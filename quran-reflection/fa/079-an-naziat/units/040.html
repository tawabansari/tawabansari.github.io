<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="خافَ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">خافَ</button>
    <button class="word-link" type="button" data-word="مَقامَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مَقامَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="وَنَهَى" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده.">وَنَهَى</button>
    <button class="word-link" type="button" data-word="النَّفسَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">النَّفسَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="الهَوىٰ" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس">الهَوىٰ</button>
  </p>
  <p class="farsi-verse">و آن که از ایستادن در پیشگاه پروردگارش ترسید و نفس را از خواهش بازداشت،</p>
</section>
