<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَغطَشَ" data-root="غ ط ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَغطَشَ</button>
    <button class="word-link" type="button" data-word="لَيلَها" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/">لَيلَها</button>
    <button class="word-link" type="button" data-word="وَأَخرَجَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">وَأَخرَجَ</button>
    <button class="word-link" type="button" data-word="ضُحىٰها" data-root="ض ح و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ضُحىٰها</button>

  <p class="farsi-verse">و شبش را تاریک کرد و روشنایی روزش را بیرون آورد.</p>
