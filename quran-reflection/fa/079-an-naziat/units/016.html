<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰهُ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="او را ندا داد؛ خطاب پروردگار به موسی." data-learn-more="/quran-terminology/fa/roots/n-d-y/">نادىٰهُ</button>
    <button class="word-link" type="button" data-word="رَبُّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش؛ نداکنندهٔ موسی.">رَبُّهُ</button>
    <button class="word-link" type="button" data-word="بِالوادِ" data-root="و د ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-d-y/" data-root-meaning="وادی: دره یا آبراه؛ دیه: جبران مالی آسیب، در شاخه‌ای دیگر." data-context="در وادی؛ جایگاه ندا.">بِالوادِ</button>
    <button class="word-link" type="button" data-word="المُقَدَّسِ" data-root="ق د س" data-learn-more="/quran-terminology/fa/roots/q-d-s/" data-root-meaning="پاکی، پاک‌سازی، جدا کردن ساحت پاک از آلودگی، و حفظ حریم قدسی" data-context="مقدس؛ وصف وادی.">المُقَدَّسِ</button>
    <button class="word-link" type="button" data-word="طُوًى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">طُوًى</button>
  </p>
  <p class="farsi-verse">آنگاه که پروردگارش در درهٔ مقدس طوی او را ندا داد:</p>
</section>
