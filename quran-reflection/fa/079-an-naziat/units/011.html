<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَءِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِذا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="شده باشیم؛ قرار گرفتن در حالت استخوان‌های پوسیده در پرسش گویندگان.">كُنّا</button>
    <button class="word-link" type="button" data-word="عِظٰمًا" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="استخوان‌ها؛ بقایای جسمانی که در این پرسش پوسیده وصف شده‌اند.">عِظٰمًا</button>
    <button class="word-link" type="button" data-word="نَخِرَةً" data-root="ن خ ر" data-learn-more="/quran-terminology/fa/roots/n-kh-r/" data-root-meaning="پوسیدگی، فرسودگی و سست شدن ماده؛ و در شاخه‌ای دیگر، صدای بینی و واژه‌های مربوط به آن." data-context="پوسیده و فرسوده؛ وصف استخوان‌ها در پرسش گویندگان درباره بازگشت به زندگی.">نَخِرَةً</button>
  </p>
  <p class="farsi-verse">آنگاه که استخوان‌هایی پوسیده شده‌ایم؟»</p>
</section>
