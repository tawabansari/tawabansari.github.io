<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار تو؛ کسی که نهایت ساعت به او بازمی‌گردد.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="مُنتَهىٰها" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="نهایت آن؛ سرانجام ساعت که به پروردگار بازمی‌گردد." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">مُنتَهىٰها</button>
  </p>
  <p class="farsi-verse">سرانجام آن به پروردگار توست.</p>
</section>
