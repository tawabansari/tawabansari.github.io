<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که آن رخداد را ببینند">يَومَ</button>
    <button class="word-link" type="button" data-word="يَرَونَها" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آن را می‌بینند؛ دیدن رخداد واپسین در سیاق آیه">يَرَونَها</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَلبَثوا" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="درنگ کرده‌اند؛ مدت ماندن گذشته از نگاه آنان">يَلبَثوا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="عَشِيَّةً" data-root="ع ش و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-w/" data-root-meaning="بخش پایانی روز و شامگاه؛ عَشو: کم‌دیدن یا چشم پوشیدن." data-context="شامگاهی؛ بخش پایانی یک روز">عَشِيَّةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="ضُحىٰها" data-root="ض ح و" data-learn-more="/quran-terminology/fa/roots/dad-h-w/" data-root-meaning="آشکار شدن در روشنایی روز و قرار گرفتن در معرض آفتاب؛ در کاربرد اسمی، روشنایی بامداد و زمان برآمدن خورشید." data-context="روشنای بامدادِ همان روز؛ در برابر شامگاه">ضُحىٰها</button>
  </p>
  <p class="farsi-verse">روزی که آن را ببینند، گویی جز شامگاهی یا صبح آن درنگ نکرده‌اند.</p>
</section>
