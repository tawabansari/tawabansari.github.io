<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَحَشَرَ" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="پس گرد آورد؛ جمع کردن مردم توسط فرعون." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">فَحَشَرَ</button>
    <button class="word-link" type="button" data-word="فَنادىٰ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="پس ندا کرد؛ فراخوان فرعون پس از گرد آوردن مردم." data-learn-more="/quran-terminology/fa/roots/n-d-y/">فَنادىٰ</button>
  </p>
  <p class="farsi-verse">پس گرد آورد و ندا داد،</p>
</section>
