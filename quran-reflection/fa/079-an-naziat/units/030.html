<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ آنچه در آیه گسترانده می‌شود.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ رابطهٔ زمانی با توصیف‌های پیشین.">بَعدَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="دَحىٰها" data-root="د ح و" data-learn-more="/quran-terminology/fa/roots/d-h-w/" data-root-meaning="گستراندن، پهن و هموار ساختن؛ در برخی کاربردها، راندن و کنار زدن چیزی بر سطح." data-context="آن را گسترانید؛ ضمیر به زمین بازمی‌گردد.">دَحىٰها</button>
  </p>
  <p class="farsi-verse">و زمین را پس از آن گسترد.</p>
</section>
