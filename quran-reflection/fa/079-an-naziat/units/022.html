<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">النازعات ۷۹:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَدبَرَ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت کرد؛ دربارهٔ روی‌گردانیِ فرعون.">أَدبَرَ</button>
    <button class="word-link" type="button" data-word="يَسعىٰ" data-root="س ع ي" data-learn-more="/quran-terminology/fa/roots/s-ayn-y/" data-root-meaning="از حرکت در یک مسیر تا کوشش برای رسیدن به نتیجه" data-context="می‌کوشید یا شتابان می‌رفت؛ وصف حرکت فرعون پس از روی‌گردانی.">يَسعىٰ</button>
  </p>
  <p class="farsi-verse">سپس روی گرداند و به تکاپو افتاد.</p>
</section>
