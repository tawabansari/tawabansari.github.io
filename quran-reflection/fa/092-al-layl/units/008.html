<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">اللیل ۹۲:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="بَخِلَ" data-root="ب خ ل" data-root-meaning="دریغ کردن و خودداری از بخشیدن؛ به‌ویژه جایی که ادای حق یا بخشندگی شایسته است." data-learn-more="/quran-terminology/fa/roots/b-kh-l/" data-context="بخل ورزید؛ از بخشیدن دریغ کرد">بَخِلَ</button>
    <button class="word-link" type="button" data-word="وَاستَغنىٰ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="خود را بی‌نیاز پنداشت">وَاستَغنىٰ</button>
  </p>
  <p class="farsi-verse">و اما آن‌که بخل ورزید و خود را بی‌نیاز دانست،</p>
</section>
