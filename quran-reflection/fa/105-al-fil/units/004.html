<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الفیل ۱۰۵:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَرميهِم" data-root="ر م ي" data-learn-more="/quran-terminology/fa/roots/r-m-y/" data-root-meaning="پرتاب کردن یا افکندن چیزی به سوی جهتی یا هدفی؛ در کاربرد گفتاری، نسبت دادن سخن یا اتهام به دیگری." data-context="سنگ‌ها را به سوی آنان پرتاب می‌کنند؛ دربارهٔ پرندگان.">تَرميهِم</button>
    <button class="word-link" type="button" data-word="بِحِجارَةٍ" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی" data-context="با سنگ‌هایی؛ ابزار پرتاب پرندگان.">بِحِجارَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سِجّيلٍ" data-root="س ج ل" data-root-note="اشتقاق تاریخی «سجّیل» مورد اختلاف است؛ قرار گرفتن آن زیر س ج ل در فهرست صرفی، به‌تنهایی ریشهٔ تاریخی آن را ثابت نمی‌کند." data-learn-more="/quran-terminology/fa/roots/s-j-l/" data-root-meaning="دلو و ریختن آب؛ سجلّ: طومار و سند؛ سجّیل: ماده سنگ‌ها، با منشأ تاریخی مورد اختلاف." data-context="سجیل؛ وصف مادهٔ سنگ‌های افکنده‌شده، با تفسیر شناخته‌شدهٔ گل پخته.">سِجّيلٍ</button>
  </p>
  <p class="farsi-verse">که آنان را با سنگ‌هایی از گل پخته می‌زدند،</p>
</section>
