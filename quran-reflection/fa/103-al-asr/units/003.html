<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">العصر ۱۰۳:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="وَتَواصَوا" data-root="و ص ي" data-learn-more="/quran-terminology/fa/roots/w-sad-y/" data-root-meaning="سفارش، سپردن مسئولیت و انتقال تعهد؛ از وصیت فردی تا تواصی اجتماعی">وَتَواصَوا</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَتَواصَوا" data-root="و ص ي" data-learn-more="/quran-terminology/fa/roots/w-sad-y/" data-root-meaning="سفارش، سپردن مسئولیت و انتقال تعهد؛ از وصیت فردی تا تواصی اجتماعی">وَتَواصَوا</button>
    <button class="word-link" type="button" data-word="بِالصَّبرِ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">بِالصَّبرِ</button>
  </p>
  <p class="farsi-verse">مگر کسانی که ایمان آوردند و کارهای شایسته کردند و یکدیگر را به حق سفارش کردند و یکدیگر را به شکیبایی سفارش کردند.</p>
</section>
