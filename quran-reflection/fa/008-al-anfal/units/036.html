<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">يُنفِقونَ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">أَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="لِيَصُدّوا" data-root="ص د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-d-d/" data-root-meaning="روی گرداندن و بازداشتن دیگری.">لِيَصُدّوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَسَيُنفِقونَها" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">فَسَيُنفِقونَها</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="تَكونُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكونُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="حَسرَةً" data-root="ح س ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-s-r/" data-root-meaning="کنار زدن پوشش؛ نیز خستگی و از توان افتادن، و حسرت و اندوه.">حَسرَةً</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُغلَبونَ" data-root="غ ل ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-b/" data-root-meaning="چیره شدن و غلبه یافتن.">يُغلَبونَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="يُحشَرونَ" data-root="ح ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sh-r/" data-root-meaning="گرد آوردن و از جایگاه‌ها به سوی یک محل راندن.">يُحشَرونَ</button>
  </p>
  <p class="farsi-verse">کافران اموالشان را خرج می‌کنند تا از راه آن معبود یگانه بازدارند؛ پس آن را خرج خواهند کرد، سپس مایه حسرتشان خواهد شد، سپس مغلوب خواهند شد؛ و کافران به سوی جهنم گرد آورده می‌شوند.</p>
</section>
