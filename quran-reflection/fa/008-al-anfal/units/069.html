<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/">فَكُلوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="غَنِمتُم" data-root="غ ن م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَنِمتُم</button>
    <button class="word-link" type="button" data-word="حَلٰلًا" data-root="ح ل ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَلٰلًا</button>
    <button class="word-link" type="button" data-word="طَيِّبًا" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/">طَيِّبًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>

  </p>
  <p class="farsi-verse">پس از آنچه به غنیمت گرفته‌اید، حلال و پاکیزه بخورید و از آن معبود یگانه پروا کنید؛ بی‌گمان آن معبود یگانه آمرزنده و رحیم است.</p>
