<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَدَأبِ" data-root="د أ ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَدَأبِ</button>
    <button class="word-link" type="button" data-word="ءالِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="فَأَهلَكنٰهُم" data-root="ه ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَهلَكنٰهُم</button>
    <button class="word-link" type="button" data-word="بِذُنوبِهِم" data-root="ذ ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِذُنوبِهِم</button>
    <button class="word-link" type="button" data-word="وَأَغرَقنا" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب">وَأَغرَقنا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالَ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">وَكُلٌّ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="ظٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظٰلِمينَ</button>
  </p>
  <p class="farsi-verse">مانند شیوه خاندان فرعون و کسانی که پیش از آنان بودند؛ آیات پروردگارشان را دروغ شمردند، پس آنان را به سبب گناهانشان نابود کردیم و خاندان فرعون را غرق کردیم؛ و همگی ستمکار بودند.</p>
</section>
