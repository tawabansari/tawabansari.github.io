<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="تَخافَنَّ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم داشته باشی">تَخافَنَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروهی">قَومٍ</button>
    <button class="word-link" type="button" data-word="خِيانَةً" data-root="خ و ن" data-root-meaning="کاستن و نقصان؛ در رفتار انسان، نقض اعتماد، امانت یا وفاداری و ضایع کردن حقی که باید رعایت می‌شد." data-context="خیانت" data-learn-more="/quran-terminology/fa/roots/kh-w-n/">خِيانَةً</button>
    <button class="word-link" type="button" data-word="فَانبِذ" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین" data-context="پس آشکارا بازگردان؛ پیمان را">فَانبِذ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="سَواءٍ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="بر پایهٔ برابری اطلاع">سَواءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دوست ندارد">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="الخائِنينَ" data-root="خ و ن" data-root-meaning="کاستن و نقصان؛ در رفتار انسان، نقض اعتماد، امانت یا وفاداری و ضایع کردن حقی که باید رعایت می‌شد." data-context="خیانت‌کاران" data-learn-more="/quran-terminology/fa/roots/kh-w-n/">الخائِنينَ</button>
  </p>
  <p class="farsi-verse">و اگر از خیانت قومی بیم داشتی، پس آن را به‌طور برابر به سویشان بازافکن؛ بی‌گمان آن معبود یگانه خیانت‌کاران را دوست ندارد.</p>
</section>
