  <h2 class="ayah-title">الانفال ۸:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">ءامَنوا</button>

    <button class="word-link" type="button" data-word="تَخونُوا" data-root="خ و ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَخونُوا</button>

    <button class="word-link" type="button" data-word="أَمٰنٰتِكُم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">أَمٰنٰتِكُم</button>

    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، به آن معبود یگانه و رسول خیانت نکنید و به امانت‌های خود خیانت نکنید، در حالی که می‌دانید.</p>
