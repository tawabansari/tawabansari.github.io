<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="يوحى" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="وحی می‌کرد؛ رساندن پیام پروردگار به فرشتگان در این صحنه.">يوحى</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار تو؛ فاعلِ وحی به فرشتگان.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ گیرندگان وحی و خطاب آغاز آیه.">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّى</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="فَثَبِّتُوا" data-root="ث ب ت" data-root-meaning="«ث ب ت» به استوار بودن و برقرار ماندن چیزی در جایگاه، وضعیت یا اعتبار خود اشاره دارد؛ و در ساختمان‌های سببی، به استوار کردن، برقرار نگه داشتن یا ثابت ساختن چیزی می‌رسد." data-context="پس استوار بدارید؛ فرمان به تقویت و پایداری مؤمنان." data-learn-more="/quran-terminology/fa/roots/th-b-t/">فَثَبِّتُوا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ کسانی که فرمانِ تثبیت دربارهٔ آنان است.">ءامَنوا</button>
    ۚ
    <button class="word-link" type="button" data-word="سَأُلقى" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه؛ و «إلقاء»، افکندن، انداختن یا رساندن چیزی به میدان مواجهه." data-context="خواهم افکند؛ قرار دادن هراس در دل‌های گروه مقابل در این رویارویی.">سَأُلقى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌ها؛ جایگاه درونی هراس در عبارت آیه.">قُلوبِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَرُوا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ وصفِ گروه مقابل در سیاق این نبرد.">كَفَرُوا</button>
    <button class="word-link" type="button" data-word="الرُّعبَ" data-root="ر ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-ayn-b/" data-root-meaning="ترس شدید و هراس." data-context="هراس شدید؛ ترسی که افکندن آن در دل‌ها بیان می‌شود.">الرُّعبَ</button>
    <button class="word-link" type="button" data-word="فَاضرِبوا" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="پس ضربه بزنید؛ فرمان در سیاق رویارویی جنگیِ آیه.">فَاضرِبوا</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بر فراز یا بالای؛ نسبتِ جایگاه ضربه با گردن‌ها.">فَوقَ</button>
    <button class="word-link" type="button" data-word="الأَعناقِ" data-root="ع ن ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-q/" data-root-meaning="گردن؛ گاه نماینده اشخاص یا حالت سر و گردن." data-context="گردن‌ها؛ اندامی که جایگاه ضربه نسبت به آن بیان می‌شود.">الأَعناقِ</button>
    <button class="word-link" type="button" data-word="وَاضرِبوا" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="و ضربه بزنید؛ فرمان بعدی دربارهٔ بنان در همان سیاق نبرد.">وَاضرِبوا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="همه؛ بیان شمولِ بنان در عبارت آیه.">كُلَّ</button>
    <button class="word-link" type="button" data-word="بَنانٍ" data-root="ب ن ن" data-root-meaning="«بَنَان» به انگشتان دست و پا و به‌ویژه بخش‌های انتهایی آنها اشاره دارد. این واژه در بعضی کاربردهای گسترده‌تر می‌تواند بخش‌های انتهایی اندام‌ها را نیز دربر گیرد." data-context="انگشتان و سرانگشتان؛ در عبارتِ «همهٔ بنان» و در سیاق نبرد. گسترش آن به اندام‌های انتهایی یا مفصل‌ها نیز در برخی شرح‌های کهن آمده است." data-learn-more="/quran-terminology/fa/roots/b-n-n/">بَنانٍ</button>
  </p>
  <p class="farsi-verse">هنگامی که پروردگارت به فرشتگان وحی می‌کرد که من با شمایم؛ پس کسانی را که ایمان آورده‌اند استوار کنید. در دل‌های کسانی که کفر ورزیده‌اند ترس خواهم افکند؛ پس بالای گردن‌ها را بزنید و هر انگشت آنان را بزنید.</p>
</section>
