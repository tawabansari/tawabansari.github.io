    <button class="word-link" type="button" data-word="النُّعاسَ" data-root="ن ع س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-ayn-s/" data-root-meaning="چرت و خواب‌آلودگی سبک.">النُّعاسَ</button>

    <button class="word-link" type="button" data-word="وَيُذهِبَ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">وَيُذهِبَ</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنكُم</button>

    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنِ</button>
    <button class="word-link" type="button" data-word="وَلِيَربِطَ" data-root="ر ب ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-b-tt/" data-root-meaning="بستن و محکم کردن؛ رباط و مرابطه: آمادگی و پایداری در جایگاه.">وَلِيَربِطَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِكُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">قُلوبِكُم</button>
    <button class="word-link" type="button" data-word="وَيُثَبِّتَ" data-root="ث ب ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-b-t/" data-root-meaning="پایدار ماندن، استوار بودن و استوار ساختن.">وَيُثَبِّتَ</button>

    <button class="word-link" type="button" data-word="الأَقدامَ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن">الأَقدامَ</button>
  </p>
  <p class="farsi-verse">هنگامی که خواب سبک را برای آرامش شما از جانب خود بر شما می‌پوشاند و از آسمان آبی بر شما فرو می‌فرستاد تا با آن پاکتان کند و پلیدی شیطان را از شما ببرد و دل‌هایتان را استوار کند و گام‌ها را با آن ثابت بدارد.</p>
</section>
