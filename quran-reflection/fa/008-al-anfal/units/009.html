<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="تَستَغيثونَ" data-root="غ و ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَستَغيثونَ</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكُم</button>
    <button class="word-link" type="button" data-word="فَاستَجابَ" data-root="ج و ب" data-root-meaning="جوب در کاربرد مادی، بریدن، شکافتن و گذشتن از میان چیزی است؛ و در کاربرد گفتاری و رفتاری، جواب و استجابت به پاسخ دادن در برابر سخن، درخواست یا دعوت اشاره دارند." data-learn-more="/quran-terminology/fa/roots/j-w-b/">فَاستَجابَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّى</button>
    <button class="word-link" type="button" data-word="مُمِدُّكُم" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر">مُمِدُّكُم</button>
    <button class="word-link" type="button" data-word="بِأَلفٍ" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أَلَّفَ؛ پیوند دادن، خو گرفتن و برقرار شدن انس و همراهی">بِأَلفٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="مُردِفينَ" data-root="ر د ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُردِفينَ</button>
  </p>
  <p class="farsi-verse">هنگامی که از پروردگارتان یاری می‌خواستید، پس شما را پاسخ داد که من شما را با هزار فرشته که در پی هم می‌آیند یاری می‌کنم.</p>
</section>
