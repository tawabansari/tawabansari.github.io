<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَدَأبِ" data-root="د أ ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَدَأبِ</button>
    <button class="word-link" type="button" data-word="ءالِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/">ءالِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَأَخَذَهُمُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/">فَأَخَذَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِذُنوبِهِم" data-root="ذ ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِذُنوبِهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قَوِىٌّ" data-root="ق و ي" data-learn-more="/quran-terminology/fa/roots/q-w-y/">قَوِىٌّ</button>
    <button class="word-link" type="button" data-word="شَديدُ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/">شَديدُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/">العِقابِ</button>
  </p>
  <p class="farsi-verse">مانند شیوه خاندان فرعون و کسانی که پیش از آنان بودند؛ به آیات آن معبود یگانه کفر ورزیدند، پس آن معبود یگانه آنان را به سبب گناهانشان گرفت؛ بی‌گمان آن معبود یگانه نیرومند و سخت‌کیفر است.</p>
</section>
