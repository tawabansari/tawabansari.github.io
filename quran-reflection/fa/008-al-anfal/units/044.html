  <p class="farsi-verse">و هنگامی که در رویارویی، آنان را در چشم شما اندک نشان می‌داد و شما را در چشم آنان اندک می‌کرد، تا آن معبود یگانه کاری را که انجام‌شدنی بود به انجام رساند؛ و کارها به آن معبود یگانه بازگردانده می‌شود.</p>
