    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>

    <button class="word-link" type="button" data-word="إِذِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذِ</button>
    <button class="word-link" type="button" data-word="التَقَيتُم" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">التَقَيتُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَعيُنِكُم" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">أَعيُنِكُم</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
    <button class="word-link" type="button" data-word="وَيُقَلِّلُكُم" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">وَيُقَلِّلُكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَعيُنِهِم" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">أَعيُنِهِم</button>
    <button class="word-link" type="button" data-word="لِيَقضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت">لِيَقضِىَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَمرًا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرًا</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="مَفعولًا" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">مَفعولًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="تُرجَعُ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">تُرجَعُ</button>
    <button class="word-link" type="button" data-word="الأُمورُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">الأُمورُ</button>
  </p>
  <p class="farsi-verse">و هنگامی که در رویارویی، آنان را در چشم شما اندک نشان می‌داد و شما را در چشم آنان اندک می‌کرد، تا آن معبود یگانه کاری را که انجام‌شدنی بود به انجام رساند؛ و کارها به آن معبود یگانه بازگردانده می‌شود.</p>
</section>
