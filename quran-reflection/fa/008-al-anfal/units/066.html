    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنكُم</button>
    <button class="word-link" type="button" data-word="وَعَلِمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و دانست؛ بیانِ علمِ آن معبود یگانه به ضعفِ مخاطبان.">وَعَلِمَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="فيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيكُم</button>

    <button class="word-link" type="button" data-word="صابِرَةٌ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="صابر و پایدار؛ وصفِ آن صد تن.">صابِرَةٌ</button>

    <button class="word-link" type="button" data-word="أَلفٌ" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أ ل ف: در شاخه مربوط به الفت، خو گرفتن و برقرار شدن پیوند و سازگاری میان اشخاص یا اجزای جدا؛ و در صورت سببی، آنها را با یکدیگر پیوند دادن. «إيلاف» با انس یافتن یا مأنوس ساختن پیوند دارد و در سوره قریش با سفر زمستان و تابستان همراه شده است. «ألف» به معنای هزار نیز در همین ماده لغوی ثبت شده است، اما رابطه تاریخی دقیق آن با شاخه الفت و تألیف قطعی نیست." data-context="هزار تن؛ عددِ گروه دوم.">أَلفٌ</button>

  <p class="farsi-verse">اکنون آن معبود یگانه از شما سبک کرد و دانست که در شما ضعفی است؛ پس اگر از شما صد تن شکیبا باشند، بر دویست تن چیره می‌شوند؛ و اگر از شما هزار تن باشند، به اذن آن معبود یگانه بر دو هزار تن چیره می‌شوند؛ و آن معبود یگانه با شکیبایان است.</p>
</section>
