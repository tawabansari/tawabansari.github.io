  <p class="farsi-verse">اکنون آن معبود یگانه از شما سبک کرد و دانست که در شما ضعفی است؛ پس اگر از شما صد تن شکیبا باشند، بر دویست تن چیره می‌شوند؛ و اگر از شما هزار تن باشند، به اذن آن معبود یگانه بر دو هزار تن چیره می‌شوند؛ و آن معبود یگانه با شکیبایان است.</p>
