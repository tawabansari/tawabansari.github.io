  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="حَسبُكَ" data-root="ح س ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَسبُكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>

  <p class="farsi-verse">ای پیامبر، آن معبود یگانه برای تو و مؤمنانی که از تو پیروی کرده‌اند کافی است.</p>
