  <p class="farsi-verse">و بدانید که از هرچه به غنیمت گرفتید، یک‌پنجم آن برای آن معبود یگانه و رسول و خویشاوندان و یتیمان و نیازمندان و درراه‌مانده است، اگر به آن معبود یگانه و آنچه در روز فرقان، روز رویارویی دو گروه، بر بنده خود فرو فرستادیم ایمان آورده‌اید؛ و آن معبود یگانه بر هر چیزی تواناست.</p>
