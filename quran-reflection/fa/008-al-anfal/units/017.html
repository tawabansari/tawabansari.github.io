  <p class="farsi-verse">پس شما آنان را نکشتید، بلکه آن معبود یگانه آنان را کشت؛ و هنگامی که افکندی، تو نیفکندی، بلکه آن معبود یگانه افکند؛ و تا مؤمنان را از جانب خود به آزمونی نیک بیازماید. بی‌گمان آن معبود یگانه شنوا و داناست.</p>
