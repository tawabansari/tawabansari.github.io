<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="و به یاد آورید.">وَاذكُروا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="قَليلٌ" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندک؛ بیانِ کمیِ مقدار.">قَليلٌ</button>
    <button class="word-link" type="button" data-word="مُستَضعَفونَ" data-root="ض ع ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="ناتوانی؛ در شاخه‌ای دیگر، چند برابر شدن و افزونی." data-context="ناتوان‌شمرده و تحت فشار.">مُستَضعَفونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین و سرزمین؛ محلِ زندگی یا رخدادِ یادشده.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="تَخافونَ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="می‌ترسیدید؛ نگرانِ ربوده شدن بودید.">تَخافونَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَتَخَطَّفَكُمُ" data-root="خ ط ف" data-learn-more="/quran-terminology/fa/roots/kh-tt-f/" data-root-meaning="ربودن، قاپیدن، گرفتن ناگهانی و پرشتاب، و جدا کردن سریع چیزی از جایگاهش پیش از آنکه فرصت واکنش یا تثبیت داشته باشد" data-context="شما را بربایند و به‌سرعت بگیرند.">يَتَخَطَّفَكُمُ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ کسانی که از ربودنِ آنان بیم داشتید.">النّاسُ</button>
    <button class="word-link" type="button" data-word="فَـٔاوىٰكُم" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="پذیرفتن و جای دادن دیگری نزد خود یا فراهم کردن پناه و جایگاه برای او." data-context="شما را پناه داد و از وضعیتِ آسیب‌پذیری بیرون آورد.">فَـٔاوىٰكُم</button>
    <button class="word-link" type="button" data-word="وَأَيَّدَكُم" data-root="أ ي د" data-learn-more="/quran-terminology/fa/roots/a-y-d/" data-root-meaning="قوت، استواری و قوت بخشیدن به دیگری" data-context="و شما را نیرومند و پشتیبانی کرد.">وَأَيَّدَكُم</button>
    <button class="word-link" type="button" data-word="بِنَصرِهِ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="با یاریِ خود.">بِنَصرِهِ</button>
    <button class="word-link" type="button" data-word="وَرَزَقَكُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="و به شما روزی داد.">وَرَزَقَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الطَّيِّبٰتِ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="چیزهای خوب و پاکیزه؛ روزیِ مناسب.">الطَّيِّبٰتِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل" data-context="سپاس بگزارید.">تَشكُرونَ</button>
  </p>
  <p class="farsi-verse">و به یاد آورید هنگامی را که اندک بودید و در زمین ضعیف شمرده می‌شدید و می‌ترسیدید مردم شما را بربایند؛ پس به شما پناه داد و با یاری خود نیرومندتان کرد و از پاکیزه‌ها روزی‌تان داد، باشد که سپاس گزارید.</p>
</section>
