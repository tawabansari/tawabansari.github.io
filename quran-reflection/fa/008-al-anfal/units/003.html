<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُقيمونَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">يُقيمونَ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَمِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">يُنفِقونَ</button>
  </p>
  <p class="farsi-verse">کسانی که صلات را برپا می‌دارند و از آنچه روزی‌شان کرده‌ایم انفاق می‌کنند.</p>
</section>
