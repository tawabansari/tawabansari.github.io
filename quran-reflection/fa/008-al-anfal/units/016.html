<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُوَلِّهِم" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="پشت به آنان کند و از رویارویی برگردد.">يُوَلِّهِم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="در آن روز و هنگامِ رویارویی.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="دُبُرَهُ" data-root="د ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پایانی؛ روی گرداندن؛ تدبیر و تدبّر: توجه به پیامد و سامان دادن." data-context="پشتِ خود؛ در ترکیبِ پشت کردن.">دُبُرَهُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="مُتَحَرِّفًا" data-root="ح ر ف" data-learn-more="/quran-terminology/fa/roots/h-r-f/" data-root-meaning="کناره و حد؛ و از آن، قرار گرفتن بر جانب یا گرداندن از جهت و جایگاه نخستین" data-context="برای تغییرِ جهت و آرایش در نبرد.">مُتَحَرِّفًا</button>
    <button class="word-link" type="button" data-word="لِقِتالٍ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="برای پیکار و رویارویی.">لِقِتالٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="مُتَحَيِّزًا" data-root="ح و ز" data-root-meaning="گرد آوردن و در اختیار گرفتن؛ در مشتق‌ها، کنار رفتن و پیوستن به یک سو یا گروه." data-context="در حالِ پیوستن و جای گرفتن نزد گروهی دیگر." data-learn-more="/quran-terminology/fa/roots/h-w-z/">مُتَحَيِّزًا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="فِئَةٍ" data-root="ف أ ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-a-y/" data-root-meaning="فئه: گروه و دسته؛ تحلیل اشتقاقی آن در فرهنگ‌ها یکسان نیست." data-context="گروه و دسته؛ طرفِ پیوستن.">فِئَةٍ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="باءَ" data-root="ب و أ" data-learn-more="/quran-terminology/fa/roots/b-w-a/" data-root-meaning="از بازگشت و جای گرفتن تا جای دادن و بر عهده گرفتن پیامد" data-context="بازگشت و گرفتارِ پیامد شد؛ در ترکیبِ خشم و ناخشنودی.">باءَ</button>
    <button class="word-link" type="button" data-word="بِغَضَبٍ" data-root="غ ض ب" data-learn-more="/quran-terminology/fa/roots/gh-dad-b/" data-root-meaning="شدت ناخشنودی و واکنش در برابر امر ناپذیرفتنی" data-context="با خشم و پیامدِ آن.">بِغَضَبٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَمَأوىٰهُ" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="جایگاه و محل اقامت یا پناه؛ بدون دلالتِ همیشگی بر امنیت و آسایش." data-context="جایگاه آنان؛ جهنم.">وَمَأوىٰهُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="و چه بد است؛ فعلِ نکوهشِ این جایگاه.">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/" data-root-meaning="از رسیدن به یک پایان تا «مصیر»؛ آنچه کار سرانجام به آن می‌رسد" data-context="فرجام و سرانجامی که به آن می‌رسند.">المَصيرُ</button>
  </p>
  <p class="farsi-verse">و هرکه آن روز به آنان پشت کند، مگر برای تغییر موضع در نبرد یا پیوستن به گروهی، به خشمی از آن معبود یگانه گرفتار شده و جایگاهش جهنم است؛ و چه بد سرانجامی است.</p>
</section>
