<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌دیدی؛ خطاب به مخاطب برای تصور صحنهٔ بیان‌شده.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="يَتَوَفَّى" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="جان می‌ستانند؛ فرشتگان جان کسانی را که کفر ورزیدند می‌گیرند.">يَتَوَفَّى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَرُوا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ کسانی که صحنهٔ ستاندن جان دربارهٔ آنان است.">كَفَرُوا</button>
    ۙ
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ عاملان ستاندن جان و زدن در این صحنه.">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="يَضرِبونَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="می‌زنند؛ زدن چهره‌ها و پشت‌های آنان.">يَضرِبونَ</button>
    <button class="word-link" type="button" data-word="وُجوهَهُم" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌هایشان؛ بخشی از بدن که ضربه بر آن وارد می‌شود.">وُجوهَهُم</button>
    <button class="word-link" type="button" data-word="وَأَدبٰرَهُم" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="و پشت‌هایشان؛ سوی پشت بدن که ضربه بر آن وارد می‌شود.">وَأَدبٰرَهُم</button>
    <button class="word-link" type="button" data-word="وَذوقوا" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="و بچشید؛ خطاب به تجربه کردن عذاب.">وَذوقوا</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ کیفری که سوزندگی آن وصف می‌شود.">عَذابَ</button>
    <button class="word-link" type="button" data-word="الحَريقِ" data-root="ح ر ق" data-root-meaning="سوختن و سوزاندن؛ اثر آتش و التهاب؛ و در کاربردی کهن، ساییدن و فرسودن." data-context="آتش سوزان؛ عذابی که به چشیدن آن خطاب می‌شود." data-learn-more="/quran-terminology/fa/roots/h-r-q/">الحَريقِ</button>
  </p>
  <p class="farsi-verse">و اگر می‌دیدی هنگامی که فرشتگان جان کافران را می‌گیرند، بر چهره‌ها و پشت‌هایشان می‌زنند: عذاب سوزان را بچشید.</p>
</section>
