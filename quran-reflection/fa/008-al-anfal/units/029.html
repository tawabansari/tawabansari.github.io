  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، اگر از آن معبود یگانه پروا کنید، برایتان فرقانی قرار می‌دهد و بدی‌هایتان را از شما می‌زداید و شما را می‌آمرزد؛ و آن معبود یگانه صاحب فضل بزرگ است.</p>
