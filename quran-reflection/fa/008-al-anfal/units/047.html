<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="مانند آن گروه نباشید؛ فعلِ نهی در آغاز آیه.">تَكونوا</button>
    <button class="word-link" type="button" data-word="كَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَالَّذينَ</button>
    <button class="word-link" type="button" data-word="خَرَجوا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="از خانه‌هایشان بیرون آمدند.">خَرَجوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دِيٰرِهِم" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت" data-context="خانه‌ها و محلِ سکونتِ آنان.">دِيٰرِهِم</button>
    <button class="word-link" type="button" data-word="بَطَرًا" data-root="ب ط ر" data-root-meaning="سرمستی و خودبزرگ‌بینی در برخورد با نعمت، توانایی یا برخورداری، همراه با ناسپاسی، زیاده‌روی یا رفتار ناسنجیده." data-context="با سرمستی و خودبزرگ‌بینی از خانه‌هایشان بیرون آمدند؛ همراه با خودنمایی در برابر مردم." data-learn-more="/quran-terminology/fa/roots/b-tt-r/">بَطَرًا</button>
    <button class="word-link" type="button" data-word="وَرِئاءَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و برای خودنمایی؛ کار را برای دیده شدن انجام دادن.">وَرِئاءَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ کسانی که نمایشِ رفتار در برابر آنان است.">النّاسِ</button>
    <button class="word-link" type="button" data-word="وَيَصُدّونَ" data-root="ص د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-d-d/" data-root-meaning="روی گرداندن و بازداشتن دیگری." data-context="و از راه بازمی‌دارند؛ رفتارِ بازدارندهٔ آن گروه.">وَيَصُدّونَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راهِ آن معبود یگانه.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="آنچه انجام می‌دهند؛ کردارِ همان گروه.">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="مُحيطٌ" data-root="ح و ط" data-learn-more="/quran-terminology/fa/roots/h-w-tt/" data-root-meaning="احاطه کردن، دربرگرفتن، پیرامون چیزی را گرفتن، از همه سو فراگرفتن؛ و در برخی کاربردها، نگاهبانی، مراقبت، یا محاصره" data-context="احاطه‌دار بر کردار آنان؛ هیچ‌یک از کارهایشان بیرون از علم و احاطهٔ او نیست.">مُحيطٌ</button>
  </p>
  <p class="farsi-verse">و مانند کسانی نباشید که با سرمستی و خودنمایی به مردم از خانه‌هایشان بیرون آمدند و از راه آن معبود یگانه بازمی‌دارند؛ و آن معبود یگانه به آنچه انجام می‌دهند احاطه دارد.</p>
</section>
