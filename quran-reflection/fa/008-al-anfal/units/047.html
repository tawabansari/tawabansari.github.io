  <p class="farsi-verse">و مانند کسانی نباشید که با سرمستی و خودنمایی به مردم از خانه‌هایشان بیرون آمدند و از راه آن معبود یگانه بازمی‌دارند؛ و آن معبود یگانه به آنچه انجام می‌دهند احاطه دارد.</p>
