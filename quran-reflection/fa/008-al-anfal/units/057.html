<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِمّا</button>
    <button class="word-link" type="button" data-word="تَثقَفَنَّهُم" data-root="ث ق ف" data-root-meaning="یافتن یا دست یافتن به شخص در موقعیتی مشخص، گاه همراه با چیرگی و تسلط بر او." data-context="اگر در جنگ به آنان دست یابی یا چیره شوی؛ مضارعِ مخاطب مفرد با نونِ تأکید در جملهٔ شرطی." data-learn-more="/quran-terminology/fa/roots/th-q-f/">تَثقَفَنَّهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَربِ" data-root="ح ر ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-r-b/" data-root-meaning="حرب: جنگ و رویارویی؛ محراب: جایگاه ویژه و برجسته، و در کاربردهایی محل عبادت." data-context="جنگ؛ قیدِ صریحِ موقعیتِ دست یافتن به حریف.">الحَربِ</button>
    <button class="word-link" type="button" data-word="فَشَرِّد" data-root="ش ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-r-d/" data-root-meaning="پراکنده و گریزان ساختن." data-context="پس پراکنده و گریزان ساز؛ فرمانِ مستقل دربارهٔ اثر بر کسانِ پشت سر آنان.">فَشَرِّد</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="خَلفَهُم" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="پشت سر آنان؛ کسانی که فرمانِ پراکندن به آنان مربوط می‌شود.">خَلفَهُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَذَّكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="متذکر شوند؛ نتیجهٔ مورد انتظار با «لعلّ».">يَذَّكَّرونَ</button>
  </p>
  <p class="farsi-verse">پس اگر در جنگ بر آنان دست یافتی، به وسیله آنان کسانی را که پشت سرشان‌اند پراکنده کن، باشد که پند گیرند.</p>
</section>
