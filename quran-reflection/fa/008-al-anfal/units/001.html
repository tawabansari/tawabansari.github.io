  <h2 class="ayah-title">الانفال ۸:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَسـَٔلونَكَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/">يَسـَٔلونَكَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="الأَنفالِ" data-root="ن ف ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَنفالِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قُلِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قُلِ</button>

    <button class="word-link" type="button" data-word="بَينِكُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/">بَينِكُم</button>

  </p>
  <p class="farsi-verse">از تو درباره غنیمت‌ها می‌پرسند. بگو: غنیمت‌ها از آنِ آن معبود یگانه و رسول است؛ پس از آن معبود یگانه پروا کنید و میان خود را اصلاح کنید و آن معبود یگانه و رسولش را اطاعت کنید، اگر مؤمن هستید.</p>
