  </p>
  <p class="farsi-verse">ای پیامبر، مؤمنان را به نبرد برانگیز؛ اگر از شما بیست تن شکیبا باشند، بر دویست تن چیره می‌شوند؛ و اگر از شما صد تن باشند، بر هزار تن از کافران چیره می‌شوند، زیرا آنان مردمی‌اند که نمی‌فهمند.</p>
