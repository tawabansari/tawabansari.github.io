  <p class="arabic-text">

    <button class="word-link" type="button" data-word="فَاعلَموا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">فَاعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مَولىٰكُم" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/">مَولىٰكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="نِعمَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نِعمَ</button>

    <button class="word-link" type="button" data-word="النَّصيرُ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/">النَّصيرُ</button>

  <p class="farsi-verse">و اگر روی گرداندند، بدانید که آن معبود یگانه سرپرست شماست؛ چه نیکو سرپرست و چه نیکو یاوری است.</p>
