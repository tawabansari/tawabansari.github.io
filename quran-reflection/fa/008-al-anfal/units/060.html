  <p class="farsi-verse">و برای آنان هرچه از نیرو و اسبان آماده می‌توانید فراهم کنید، تا با آن دشمن آن معبود یگانه و دشمن خود و دیگرانی جز آنان را که شما نمی‌شناسید و آن معبود یگانه می‌شناسد بترسانید؛ و هرچه در راه آن معبود یگانه انفاق کنید، کامل به شما بازگردانده می‌شود و بر شما ستم نمی‌رود.</p>
