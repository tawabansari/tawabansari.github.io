<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">الانفال ۸:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَعِدّوا" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="و آماده کنید؛ فرمان فراهم آوردن توان در برابر آنان.">وَأَعِدّوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="استَطَعتُم" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="توانستید؛ تا اندازه‌ای که توان فراهم کردن دارید.">استَطَعتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قُوَّةٍ" data-root="ق و ي" data-learn-more="/quran-terminology/fa/roots/q-w-y/" data-root-meaning="نیرو، توان، قدرت و استحکام؛ توان انجام، تحمل، مقاومت یا اثرگذاری" data-context="نیرو و توان؛ آنچه برای آمادگی فراهم می‌شود.">قُوَّةٍ</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="رِباطِ" data-root="ر ب ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-b-tt/" data-root-meaning="بستن و محکم کردن؛ رباط و مرابطه: آمادگی و پایداری در جایگاه." data-context="بستن و آماده نگه داشتن؛ در ترکیب نگهداری اسبان.">رِباطِ</button>
    <button class="word-link" type="button" data-word="الخَيلِ" data-root="خ ي ل" data-learn-more="/quran-terminology/fa/roots/kh-y-l/" data-root-meaning="نمود و تصور چیزی در ذهن یا برابر چشم؛ حرکت همراه با جلوه‌گری. در مشتق‌های مشخص: اسبان، پدید آوردن تصور، و خودنماییِ متکبرانه." data-context="اسبان؛ در ترکیب آماده و نگه داشته شدن برای توان دفاعی.">الخَيلِ</button>
    <button class="word-link" type="button" data-word="تُرهِبونَ" data-root="ر ه ب" data-learn-more="/quran-terminology/fa/roots/r-h2-b/" data-root-meaning="هیبت، پروا، مراقبت، و انقباض در برابر عظمت و پیامد" data-context="با آن در آنان ترس ایجاد می‌کنید و بازمی‌دارید.">تُرهِبونَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="عَدُوَّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمنِ آن معبود یگانه؛ در این ترکیب اضافی.">عَدُوَّ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَعَدُوَّكُم" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="و دشمن خودتان.">وَعَدُوَّكُم</button>
    <button class="word-link" type="button" data-word="وَءاخَرينَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="و دیگرانی؛ گروهی دیگر افزون بر دشمنان نام‌برده.">وَءاخَرينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِم" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="غیر از آنان؛ افزون بر گروه یادشده.">دونِهِم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَهُمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="آنان را نمی‌شناسید؛ با نفیِ پیش از این فعل.">تَعلَمونَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُهُم" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="آنان را می‌شناسد؛ آگاهی آن معبود یگانه از آنان.">يَعلَمُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تُنفِقوا" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="خرج کنید و ببخشید؛ در راه آن معبود یگانه.">تُنفِقوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هر چیزی؛ آنچه از آن انفاق می‌کنید.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ در ترکیب راه آن معبود یگانه.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يُوَفَّ" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="به‌تمامی به شما بازپرداخت می‌شود؛ فعل مجهول.">يُوَفَّ</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="به شما ستم نمی‌شود؛ با نفیِ پیش از فعل.">تُظلَمونَ</button>
  </p>
  <p class="farsi-verse">و برای آنان هرچه از نیرو و اسبان آماده می‌توانید فراهم کنید، تا با آن دشمن آن معبود یگانه و دشمن خود و دیگرانی جز آنان را که شما نمی‌شناسید و آن معبود یگانه می‌شناسد بترسانید؛ و هرچه در راه آن معبود یگانه انفاق کنید، کامل به شما بازگردانده می‌شود و بر شما ستم نمی‌رود.</p>
</section>
