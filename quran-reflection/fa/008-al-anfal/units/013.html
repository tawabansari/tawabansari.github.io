  <p class="farsi-verse">این بدان سبب است که آنان با آن معبود یگانه و رسولش به ستیز برخاستند؛ و هرکه با آن معبود یگانه و رسولش ستیز کند، بی‌گمان آن معبود یگانه سخت‌کیفر است.</p>
