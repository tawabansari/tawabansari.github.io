<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الشرح ۹۴:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="العُسرِ" data-root="ع س ر" data-root-meaning="سختی و تنگنایی که انجام کار، تحمل وضعیت یا دستیابی به نتیجه را دشوار می‌سازد." data-context="سختی؛ وضعیتی که همراهیِ آسانی با آن بیان می‌شود." data-learn-more="/quran-terminology/fa/roots/ayn-s-r/">العُسرِ</button>
    <button class="word-link" type="button" data-word="يُسرًا" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت" data-context="آسانی؛ گشایشی که همراهِ سختی بیان شده است.">يُسرًا</button>
  </p>
  <p class="farsi-verse">پس بی‌گمان با دشواری آسانی است.</p>
</section>
