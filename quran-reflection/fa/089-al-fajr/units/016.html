<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الفجر ۸۹:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمّا</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="ابتَلىٰهُ" data-root="ب ل و" data-learn-more="/quran-terminology/fa/roots/b-l-w/" data-root-meaning="آزمودن در واقعیت؛ از خیر و شر تا «بلاء» و فرسودگی">ابتَلىٰهُ</button>
    <button class="word-link" type="button" data-word="فَقَدَرَ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">فَقَدَرَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="رِزقَهُ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">رِزقَهُ</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبّى</button>
    <button class="word-link" type="button" data-word="أَهٰنَنِ" data-root="ه و ن" data-learn-more="/quran-terminology/fa/roots/h2-w-n/" data-root-meaning="آسانی، آرامی و فروکاستن از شأن">أَهٰنَنِ</button>
  </p>
  <p class="farsi-verse">و اما چون او را بیازماید و روزی‌اش را بر او تنگ گیرد، می‌گوید: «پروردگارم مرا خوار کرد.»</p>
</section>
