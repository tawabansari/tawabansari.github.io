<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الفجر ۸۹:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="و بیاید؛ فعل نسبت‌داده‌شده به پروردگار، بدون تعیین چگونگی آن در این واژه">وَجاءَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ فاعل آمدن در عبارت آیه">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="وَالمَلَكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="و فرشتگان؛ اسم مفرد با معنای جمعی در این سیاق">وَالمَلَكُ</button>
    <button class="word-link" type="button" data-word="صَفًّا" data-root="ص ف ف" data-learn-more="/quran-terminology/fa/roots/sad-f-f/" data-root-meaning="هم‌ردیف شدن و کنار هم چیدن؛ گستردن بال‌ها یا هم‌ردیف قرار دادن اندام‌ها؛ مصفوف: ردیف‌شده" data-context="در صف؛ نخستین بخش تعبیر صف‌به‌صف دربارهٔ فرشتگان">صَفًّا</button>
    <button class="word-link" type="button" data-word="صَفًّا" data-root="ص ف ف" data-learn-more="/quran-terminology/fa/roots/sad-f-f/" data-root-meaning="هم‌ردیف شدن و کنار هم چیدن؛ گستردن بال‌ها یا هم‌ردیف قرار دادن اندام‌ها؛ مصفوف: ردیف‌شده" data-context="صف‌به‌صف؛ تکرار برای بیان ردیف‌های پی‌درپی فرشتگان">صَفًّا</button>
  </p>
  <p class="farsi-verse">و پروردگارت بیاید و فرشتگان صف‌درصف،</p>
</section>
