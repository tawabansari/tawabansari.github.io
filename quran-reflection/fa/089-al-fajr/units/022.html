<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الفجر ۸۹:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجاءَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="وَالمَلَكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه">وَالمَلَكُ</button>
    <button class="word-link" type="button" data-word="صَفًّا" data-root="ص ف ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَفًّا</button>
    <button class="word-link" type="button" data-word="صَفًّا" data-root="ص ف ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَفًّا</button>
  </p>
  <p class="farsi-verse">و پروردگارت بیاید و فرشتگان صف‌درصف،</p>
</section>
