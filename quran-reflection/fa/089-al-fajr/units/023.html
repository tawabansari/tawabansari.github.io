    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="بِجَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِجَهَنَّمَ</button>

    <button class="word-link" type="button" data-word="يَتَذَكَّرُ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">يَتَذَكَّرُ</button>

    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>

  <p class="farsi-verse">و در آن روز جهنم آورده شود، آن روز انسان به یاد می‌آورد؛ اما یادآوری چه سودی برای او دارد؟</p>
