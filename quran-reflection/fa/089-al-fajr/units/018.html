<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الفجر ۸۹:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَحٰضّونَ" data-root="ح ض ض" data-root-meaning="هستهٔ معنایی شاخهٔ قرآنی ریشه، برانگیختن و تشویق دیگری به انجام کاری است. در صورت «تحاضّ»، این برانگیختن به رابطهٔ متقابل میان افراد گسترش می‌یابد." data-context="یکدیگر را به فراهم کردن خوراک مسکین تشویق نمی‌کنید؛ فعل در ساخت نفی" data-learn-more="/quran-terminology/fa/roots/h-dad-dad/">تَحٰضّونَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="طَعامِ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا" data-context="خوراک؛ موضوع تشویق متقابل">طَعامِ</button>
    <button class="word-link" type="button" data-word="المِسكينِ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="فرد نیازمند؛ کسی که خوراک او مورد توجه است">المِسكينِ</button>
  </p>
  <p class="farsi-verse">و یکدیگر را به خوراک دادن به نیازمند تشویق نمی‌کنید،</p>
</section>
