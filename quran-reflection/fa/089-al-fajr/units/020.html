<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الفجر ۸۹:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتُحِبّونَ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">وَتُحِبّونَ</button>
    <button class="word-link" type="button" data-word="المالَ" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">المالَ</button>
    <button class="word-link" type="button" data-word="حُبًّا" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">حُبًّا</button>
    <button class="word-link" type="button" data-word="جَمًّا" data-root="ج م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-m-m/" data-root-meaning="فراوانی و انبوه بودن؛ جمّ: بسیار و انبوه.">جَمًّا</button>
  </p>
  <p class="farsi-verse">و مال را بسیار دوست می‌دارید.</p>
</section>
