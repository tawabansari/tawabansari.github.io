<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الفجر ۸۹:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيَّتُهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيَّتُهَا</button>
    <button class="word-link" type="button" data-word="النَّفسُ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">النَّفسُ</button>
    <button class="word-link" type="button" data-word="المُطمَئِنَّةُ" data-root="ط م أ ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-m-a-n/" data-root-meaning="آرام گرفتن و اطمینان یافتن پس از اضطراب؛ با تحلیل کوتاه‌تر «طمن» نیز ثبت می‌شود.">المُطمَئِنَّةُ</button>
  </p>
  <p class="farsi-verse">ای جان آرام‌یافته،</p>
