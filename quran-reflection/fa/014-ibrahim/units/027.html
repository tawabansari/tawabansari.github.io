  <p class="farsi-verse">آن معبود یگانه کسانی را که ایمان آورده‌اند با سخن استوار، در زندگی دنیا و در آخرت استوار می‌دارد؛ و آن معبود یگانه ستمکاران را گمراه می‌کند؛ و آن معبود یگانه هر چه بخواهد می‌کند.</p>
