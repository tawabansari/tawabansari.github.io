<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَرابيلُهُم" data-root="س ر ب ل" data-root-meaning="تن‌پوش، پیراهن یا جامه‌ای که بدن را می‌پوشاند؛ در کاربرد جنگی، زره و پوشش محافظ." data-context="تن‌پوش‌های آنان؛ پوشش‌هایی که در این آیه از قطران توصیف شده‌اند." data-learn-more="/quran-terminology/fa/roots/s-r-b-l/">سَرابيلُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَطِرانٍ" data-root="ق ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-tt-r/" data-root-meaning="چکیدن؛ قِطر: مس گداخته؛ قطران: ماده قیرمانند؛ اقطار: نواحی و کرانه‌ها." data-context="قطران؛ ماده‌ای قیری که در این آیه جنس تن‌پوش‌ها با آن بیان می‌شود.">قَطِرانٍ</button>
    <button class="word-link" type="button" data-word="وَتَغشىٰ" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش" data-context="و فرامی‌گیرد؛ آتش چهره‌های آنان را می‌پوشاند.">وَتَغشىٰ</button>
    <button class="word-link" type="button" data-word="وُجوهَهُمُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌هایشان؛ بخش بدن که آتش آن را فرامی‌گیرد.">وُجوهَهُمُ</button>
    <button class="word-link" type="button" data-word="النّارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ فاعلِ فراگرفتن چهره‌ها در این جمله.">النّارُ</button>
  </p>
  <p class="farsi-verse">جامه‌هایشان از قطران است و آتش چهره‌هایشان را می‌پوشاند.</p>
</section>
