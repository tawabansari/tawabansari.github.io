<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="أَندادًا" data-root="ن د د" data-learn-more="/quran-terminology/fa/roots/n-d-d/" data-root-meaning="همتا، همانند، رقیب و چیزی که در برابر یا کنار چیزی دیگر در جایگاه مشابه قرار داده می‌شود">أَندادًا</button>
    <button class="word-link" type="button" data-word="لِيُضِلّوا" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">لِيُضِلّوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِهِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="تَمَتَّعوا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">تَمَتَّعوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="مَصيرَكُم" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/" data-root-meaning="از رسیدن به یک پایان تا «مصیر»؛ آنچه کار سرانجام به آن می‌رسد">مَصيرَكُم</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارِ</button>
  </p>
  <p class="farsi-verse">و برای آن معبود یگانه همتایانی قرار دادند تا از راه او گمراه کنند. بگو: بهره ببرید، که سرانجامتان به سوی آتش است.</p>
</section>
