  <p class="farsi-verse">پس هرگز مپندار آن معبود یگانه وعده‌اش را به رسولان خود خلاف می‌کند؛ بی‌گمان آن معبود یگانه شکست‌ناپذیر و صاحب انتقام است.</p>
