<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِرَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">بِرَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="أَعمٰلُهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">أَعمٰلُهُم</button>
    <button class="word-link" type="button" data-word="كَرَمادٍ" data-root="ر م د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَرَمادٍ</button>
    <button class="word-link" type="button" data-word="اشتَدَّت" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/">اشتَدَّت</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="الرّيحُ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/">الرّيحُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومٍ</button>
    <button class="word-link" type="button" data-word="عاصِفٍ" data-root="ع ص ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عاصِفٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَقدِرونَ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">يَقدِرونَ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="كَسَبوا" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/">كَسَبوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الضَّلٰلُ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/">الضَّلٰلُ</button>
    <button class="word-link" type="button" data-word="البَعيدُ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/">البَعيدُ</button>
  </p>
  <p class="farsi-verse">مَثَل کسانی که به پروردگارشان کفر ورزیدند: اعمالشان مانند خاکستری است که باد در روزی توفانی به‌شدت بر آن بوزد؛ از آنچه به دست آورده‌اند بر هیچ چیز دست نمی‌یابند؛ این همان گمراهی دور است.</p>
</section>
