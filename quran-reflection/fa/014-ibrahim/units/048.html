<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که؛ زمان دگرگونی زمین و آسمان‌ها و ظهور انسان‌ها.">يَومَ</button>
    <button class="word-link" type="button" data-word="تُبَدَّلُ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا." data-context="دگرگون یا جایگزین می‌شود؛ صورت مجهول دربارهٔ زمین.">تُبَدَّلُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ آنچه در آغاز به عنوان موضوع دگرگونی معرفی می‌شود.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="غیر و دیگر؛ تفاوتِ زمینِ جایگزین با زمین مورد اشاره.">غَيرَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ در ترکیب «غیر الأرض»، طرف مقایسه و تفاوت است.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَالسَّمٰوٰتُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="و آسمان‌ها؛ در تصویر دگرگونی به زمین پیوسته‌اند.">وَالسَّمٰوٰتُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبَرَزوا" data-root="ب ر ز" data-root-meaning="بیرون آمدن و نمایان شدن در فضای آشکار یا در برابر دید و مواجهه؛ در صورت گذرا، آشکار ساختن چیزی." data-learn-more="/quran-terminology/fa/roots/b-r-z/" data-context="آشکار شدند؛ ظهور انسان‌ها در برابر آن معبود یگانه، جدا از فعل دگرگونیِ زمین.">وَبَرَزوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الوٰحِدِ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="آن یگانه؛ وصف یگانگی آن معبود یگانه.">الوٰحِدِ</button>
    <button class="word-link" type="button" data-word="القَهّارِ" data-root="ق ه ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-h2-r/" data-root-meaning="چیره شدن و تحت اختیار درآوردن؛ قهر همیشه به معنای احساس خشم نیست." data-context="آن چیره؛ وصف چیرگی و سلطهٔ فراگیر آن معبود یگانه.">القَهّارِ</button>
  </p>
  <p class="farsi-verse">روزی که زمین به زمینی دیگر بدل می‌شود و آسمان‌ها نیز؛ و همگان در برابر آن معبود یگانه، آن یکتای چیره، آشکار می‌شوند.</p>
</section>
