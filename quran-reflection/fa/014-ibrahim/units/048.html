  <h2 class="ayah-title">ابراهیم ۱۴:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَ</button>
    <button class="word-link" type="button" data-word="تُبَدَّلُ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/">تُبَدَّلُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">الأَرضُ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/">غَيرَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَالسَّمٰوٰتُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">وَالسَّمٰوٰتُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبَرَزوا" data-root="ب ر ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَبَرَزوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الوٰحِدِ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/">الوٰحِدِ</button>
    <button class="word-link" type="button" data-word="القَهّارِ" data-root="ق ه ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">القَهّارِ</button>
  </p>
  <p class="farsi-verse">روزی که زمین به زمینی دیگر بدل می‌شود و آسمان‌ها نیز؛ و همگان در برابر آن معبود یگانه، آن یکتای چیره، آشکار می‌شوند.</p>
