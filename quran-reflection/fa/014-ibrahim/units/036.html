<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="إِنَّهُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُنَّ</button>
    <button class="word-link" type="button" data-word="أَضلَلنَ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">أَضلَلنَ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">كَثيرًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="تَبِعَنى" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">تَبِعَنى</button>
    <button class="word-link" type="button" data-word="فَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="مِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّى</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="عَصانى" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت.">عَصانى</button>
    <button class="word-link" type="button" data-word="فَإِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّكَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">پروردگار من، آنها بسیاری از مردم را گمراه کرده‌اند؛ پس هر که از من پیروی کند از من است؛ و هر که نافرمانی‌ام کند، تو آمرزنده و رحیمی.</p>
</section>
