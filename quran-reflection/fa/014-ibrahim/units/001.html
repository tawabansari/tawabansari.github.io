    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">كِتٰبٌ</button>

  <p class="farsi-verse">الف، لام، را. کتابی است که به سوی تو نازل کردیم تا مردم را به اذن پروردگارشان از تاریکی‌ها به سوی نور بیرون آوری، به سوی راه آن شکست‌ناپذیر ستوده.</p>
