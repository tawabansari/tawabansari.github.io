<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="أَخرِج" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">أَخرِج</button>
    <button class="word-link" type="button" data-word="قَومَكَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">قَومَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الظُّلُمٰتِ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظُّلُمٰتِ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="النّورِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/">النّورِ</button>
    <button class="word-link" type="button" data-word="وَذَكِّرهُم" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">وَذَكِّرهُم</button>
    <button class="word-link" type="button" data-word="بِأَيّىٰمِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">بِأَيّىٰمِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="صَبّارٍ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/">صَبّارٍ</button>
    <button class="word-link" type="button" data-word="شَكورٍ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/">شَكورٍ</button>
  </p>
  <p class="farsi-verse">و به‌راستی موسی را با آیات خود فرستادیم که قومت را از تاریکی‌ها به سوی نور بیرون آور و روزهای آن معبود یگانه را به یادشان آور؛ بی‌گمان در این برای هر بسیار شکیبای سپاسگزاری نشانه‌هایی است.</p>
</section>
