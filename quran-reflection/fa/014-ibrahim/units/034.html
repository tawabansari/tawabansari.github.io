  <h2 class="ayah-title">ابراهیم ۱۴:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتىٰكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">وَءاتىٰكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلِّ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="سَأَلتُموهُ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/">سَأَلتُموهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَعُدّوا" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/">تَعُدّوا</button>

    <button class="word-link" type="button" data-word="تُحصوها" data-root="ح ص ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُحصوها</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>

    <button class="word-link" type="button" data-word="كَفّارٌ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">كَفّارٌ</button>
  </p>
  <p class="farsi-verse">و از هر چه از او خواستید به شما داد؛ و اگر نعمت آن معبود یگانه را بشمارید، نمی‌توانید آن را به شمار آورید؛ بی‌گمان انسان بسیار ستمکار و بسیار ناسپاس است.</p>
