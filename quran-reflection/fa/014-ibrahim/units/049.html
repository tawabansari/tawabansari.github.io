<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">وَتَرَى</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المُجرِمينَ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="مُقَرَّنينَ" data-root="ق ر ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُقَرَّنينَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَصفادِ" data-root="ص ف د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَصفادِ</button>
  </p>
  <p class="farsi-verse">و آن روز مجرمان را می‌بینی که در زنجیرها به هم بسته شده‌اند.</p>
