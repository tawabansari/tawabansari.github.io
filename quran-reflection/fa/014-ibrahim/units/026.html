<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَثَلُ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مثل و تشبیه؛ تصویرِ سخن خبیث با درخت خبیث.">وَمَثَلُ</button>
    <button class="word-link" type="button" data-word="كَلِمَةٍ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="سخن؛ کلامی که در این مثل خبیث وصف شده است.">كَلِمَةٍ</button>
    <button class="word-link" type="button" data-word="خَبيثَةٍ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="ناروا و باطل؛ وصفِ سخن در برابر کلمهٔ طیب.">خَبيثَةٍ</button>
    <button class="word-link" type="button" data-word="كَشَجَرَةٍ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="مانند درختی؛ طرفِ تصویریِ این تشبیه.">كَشَجَرَةٍ</button>
    <button class="word-link" type="button" data-word="خَبيثَةٍ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="نامطلوب و نامرغوب؛ وصفِ درخت در این تشبیه.">خَبيثَةٍ</button>
    <button class="word-link" type="button" data-word="اجتُثَّت" data-root="ج ث ث" data-root-meaning="بریدن و برکندن چیزی از بن یا جایگاه اصلی آن؛ به‌ویژه کندن گیاه و درخت." data-context="از ریشه برکنده شده؛ فعلِ مجهول دربارهٔ درخت." data-learn-more="/quran-terminology/fa/roots/j-th-th/">اجتُثَّت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بالای زمین یا سطح آن؛ جایگاهی که درخت از آن برکنده شده است.">فَوقِ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ بسترِ تصویرِ درخت در این مثل.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَرارٍ" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری." data-context="قرار و استواری؛ درخت هیچ جای‌گیریِ پایداری ندارد.">قَرارٍ</button>
  </p>
  <p class="farsi-verse">و مَثَل سخنی ناپاک مانند درختی ناپاک است که از روی زمین کنده شده و هیچ قراری ندارد.</p>
</section>
