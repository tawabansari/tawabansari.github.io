<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَتَجَرَّعُهُ" data-root="ج ر ع" data-root-meaning="نوشیدن و فروبردن مقدار محدودی از مایع؛ جرعه‌ای از نوشیدنی." data-context="آن را جرعه‌جرعه می‌نوشد؛ نوشیدن پیاپی همان مایعِ یادشده که فروبردنش بسیار دشوار است." data-learn-more="/quran-terminology/fa/roots/j-r-ayn/">يَتَجَرَّعُهُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَكادُ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن" data-context="نزدیک است؛ همراه با نفی، دشواری بسیارِ فروبردن نوشیدنی را نشان می‌دهد.">يَكادُ</button>
    <button class="word-link" type="button" data-word="يُسيغُهُ" data-root="س و غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-gh/" data-root-meaning="به‌آسانی از گلو گذشتن و گوارا بودن." data-context="آن را فرو برد؛ گذر دادن نوشیدنی از گلو که در اینجا بسیار دشوار است.">يُسيغُهُ</button>
    <button class="word-link" type="button" data-word="وَيَأتيهِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="و به او می‌رسد؛ آمدن مرگ از هر سو در صحنه توصیف‌شده.">وَيَأتيهِ</button>
    <button class="word-link" type="button" data-word="المَوتُ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرگ؛ چیزی که از هر سو به او می‌رسد، در حالی که نمی‌میرد.">المَوتُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ فراگیر بودن جهت‌هایی که مرگ از آنها به او می‌رسد.">كُلِّ</button>
    <button class="word-link" type="button" data-word="مَكانٍ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="جا و سو؛ جهت‌های گوناگونِ آمدن مرگ به سوی او.">مَكانٍ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="بِمَيِّتٍ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرده؛ با نفی، مرگ برای او تحقق نمی‌یابد.">بِمَيِّتٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="وَرائِهِ" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش" data-context="در پی یا پیش روی او؛ عذابی سنگین که فراتر از وضعیت یادشده در انتظار اوست.">وَرائِهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ رنج و کیفری که در پی این وضعیت از آن خبر داده می‌شود.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="غَليظٌ" data-root="غ ل ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-zha/" data-root-meaning="ضخامت، سختی و درشتی؛ مادی یا رفتاری، بنا بر سیاق." data-context="سنگین و شدید؛ وصف عذابی که در انتظار اوست.">غَليظٌ</button>
  </p>
  <p class="farsi-verse">آن را جرعه‌جرعه می‌نوشد و به‌سختی می‌تواند فرو برد؛ و مرگ از هر سو به او می‌رسد، ولی او مردنی نیست؛ و در پی او عذابی سنگین است.</p>
</section>
