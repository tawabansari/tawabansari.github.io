  <p class="farsi-verse">و مردم را از روزی هشدار ده که عذاب به آنان می‌رسد؛ پس کسانی که ستم کردند می‌گویند: پروردگار ما، تا زمانی نزدیک به ما مهلت ده تا دعوتت را پاسخ دهیم و از رسولان پیروی کنیم. آیا پیش‌تر سوگند نخورده بودید که شما را زوالی نیست؟</p>
