<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آیا ندیده‌ای یا درنیافته‌ای؟ دعوت به توجه به تمثیل.">تَرَ</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="ضَرَبَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="مثال زده است؛ ارائه تمثیل برای روشن کردن سخن پاکیزه.">ضَرَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مثال یا تمثیل؛ تصویر درخت برای توضیح سخن پاکیزه.">مَثَلًا</button>
    <button class="word-link" type="button" data-word="كَلِمَةً" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="سخنی؛ گفتار یا کلمه‌ای که به پاکیزگی وصف شده است.">كَلِمَةً</button>
    <button class="word-link" type="button" data-word="طَيِّبَةً" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="پاکیزه و نیکو؛ وصف سخن در تمثیل.">طَيِّبَةً</button>
    <button class="word-link" type="button" data-word="كَشَجَرَةٍ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="مانند درختی؛ جزء گیاهی تمثیل که سخن به آن تشبیه می‌شود.">كَشَجَرَةٍ</button>
    <button class="word-link" type="button" data-word="طَيِّبَةٍ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="پاکیزه و نیکو؛ وصف درختِ تمثیل.">طَيِّبَةٍ</button>
    <button class="word-link" type="button" data-word="أَصلُها" data-root="أ ص ل" data-learn-more="/quran-terminology/fa/roots/a-sad-l/" data-root-meaning="اصل و بنیاد چیزی، و پسین‌گاه به‌عنوان بخشی مشخص از روز." data-context="ریشه آن درخت؛ بخشی که استواری‌اش با «ثابت» بیان می‌شود.">أَصلُها</button>
    <button class="word-link" type="button" data-word="ثابِتٌ" data-root="ث ب ت" data-root-meaning="«ث ب ت» به استوار بودن و برقرار ماندن چیزی در جایگاه، وضعیت یا اعتبار خود اشاره دارد؛ و در ساختمان‌های سببی، به استوار کردن، برقرار نگه داشتن یا ثابت ساختن چیزی می‌رسد." data-context="استوار و پابرجا؛ وصف وضعیت ریشه درخت." data-learn-more="/quran-terminology/fa/roots/th-b-t/">ثابِتٌ</button>
    <button class="word-link" type="button" data-word="وَفَرعُها" data-root="ف ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-ayn/" data-root-meaning="شاخه و بخش برآمده از اصل." data-context="و شاخه آن؛ بخش بالایی درخت در برابر ریشه.">وَفَرعُها</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان یا فضای بالا؛ جایگاه گسترش شاخه در تمثیل.">السَّماءِ</button>
  </p>
  <p class="farsi-verse">آیا ندیدی آن معبود یگانه چگونه مَثَلی زد: سخنی پاک مانند درختی پاک است که ریشه‌اش استوار و شاخه‌اش در آسمان است.</p>
</section>
