<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاستَفتَحوا" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده" data-context="طلب گشایش و داوری کردند؛ درخواست فتح و روشن شدن فرجام رویارویی.">وَاستَفتَحوا</button>
    <button class="word-link" type="button" data-word="وَخابَ" data-root="خ ي ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-y-b/" data-root-meaning="ناکام و محروم شدن از نتیجه مطلوب." data-context="و ناکام شد؛ نرسیدن زورگوی سرسخت به خواسته و کامیابی.">وَخابَ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ شامل هر جبارِ عنید در این بیان.">كُلُّ</button>
    <button class="word-link" type="button" data-word="جَبّارٍ" data-root="ج ب ر" data-root-meaning="اصلاح شکستگی و جبران کمبود؛ استواری، قدرت، چیرگی و واداشتن." data-context="زورگو؛ صاحب قدرتِ سرسختی که از ناکامی او سخن گفته می‌شود." data-learn-more="/quran-terminology/fa/roots/j-b-r/">جَبّارٍ</button>
    <button class="word-link" type="button" data-word="عَنيدٍ" data-root="ع ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-d/" data-root-meaning="سرسختی و مخالفت؛ «عند» واژه‌ای دستوری برای نزدیکی مکانی یا منزلتی است." data-context="سرسخت و لجوج؛ وصف کسی که در برابر حق مقاومت می‌کند.">عَنيدٍ</button>
  </p>
  <p class="farsi-verse">و پیروزی خواستند، و هر زورگوی ستیزه‌جویی ناکام شد.</p>
</section>
