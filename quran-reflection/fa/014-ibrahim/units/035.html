<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمُ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="اجعَل" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">اجعَل</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="البَلَدَ" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»">البَلَدَ</button>
    <button class="word-link" type="button" data-word="ءامِنًا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامِنًا</button>
    <button class="word-link" type="button" data-word="وَاجنُبنى" data-root="ج ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-b/" data-root-meaning="پهلو، کنار و ناحیه؛ اجتناب: کنار گرفتن و دوری کردن؛ جُنُب وضعیت آیینیِ مشخصی است.">وَاجنُبنى</button>
    <button class="word-link" type="button" data-word="وَبَنِىَّ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">وَبَنِىَّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="نَعبُدَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">نَعبُدَ</button>
    <button class="word-link" type="button" data-word="الأَصنامَ" data-root="ص ن م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-m/" data-root-meaning="بت و پیکره مورد پرستش.">الأَصنامَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که ابراهیم گفت: پروردگار من، این شهر را امن گردان و مرا و پسرانم را از پرستیدن بت‌ها دور بدار.</p>
</section>
