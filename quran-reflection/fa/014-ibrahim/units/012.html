<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="نَتَوَكَّلَ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">نَتَوَكَّلَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="هَدىٰنا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هَدىٰنا</button>
    <button class="word-link" type="button" data-word="سُبُلَنا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سُبُلَنا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَنَصبِرَنَّ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">وَلَنَصبِرَنَّ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="ءاذَيتُمونا" data-root="أ ذ ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-dh-y/" data-root-meaning="آزار، رنج و آسیبی که به شخص یا موجودی می‌رسد.">ءاذَيتُمونا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَليَتَوَكَّلِ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">فَليَتَوَكَّلِ</button>
    <button class="word-link" type="button" data-word="المُتَوَكِّلونَ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">المُتَوَكِّلونَ</button>
  </p>
  <p class="farsi-verse">و چرا بر آن معبود یگانه توکل نکنیم، در حالی که راه‌هایمان را به ما نشان داده است؟ و حتماً بر آزاری که به ما رسانده‌اید شکیبایی خواهیم کرد؛ و توکل‌کنندگان باید بر آن معبود یگانه توکل کنند.</p>
</section>
