<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُهطِعينَ" data-root="ه ط ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُهطِعينَ</button>
    <button class="word-link" type="button" data-word="مُقنِعى" data-root="ق ن ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُقنِعى</button>
    <button class="word-link" type="button" data-word="رُءوسِهِم" data-root="ر أ س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رُءوسِهِم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَرتَدُّ" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر">يَرتَدُّ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="طَرفُهُم" data-root="ط ر ف" data-learn-more="/quran-terminology/fa/roots/tt-r-f/" data-root-meaning="کناره، سویه، بخش، نگاه، و حرکت نگاه در کاربرد قرآنی">طَرفُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَفـِٔدَتُهُم" data-root="ف أ د" data-root-meaning="«دل» مناسب‌ترین معادل پایه فؤاد است؛ دلی که در کاربردهای قرآنی می‌تواند با دریافت، ادراک، گرایش، تاثیرپذیری و پایداری ارتباط داشته باشد." data-learn-more="/quran-terminology/fa/roots/f-a-d/">وَأَفـِٔدَتُهُم</button>
    <button class="word-link" type="button" data-word="هَواءٌ" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس">هَواءٌ</button>
  </p>
  <p class="farsi-verse">شتابان، سرهایشان را بالا گرفته‌اند؛ نگاهشان به سوی خودشان بازنمی‌گردد و دل‌هایشان تهی است.</p>
</section>
