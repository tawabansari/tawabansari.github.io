    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">كَفَروا</button>

    <button class="word-link" type="button" data-word="لَنُخرِجَنَّكُم" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">لَنُخرِجَنَّكُم</button>

    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="رَبُّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّهُم</button>

  </p>
  <p class="farsi-verse">و کسانی که کفر ورزیدند به رسولانشان گفتند: حتماً شما را از سرزمینمان بیرون می‌کنیم، یا حتماً به آیین ما بازمی‌گردید. پس پروردگارشان به آنان وحی کرد: حتماً ستمکاران را هلاک خواهیم کرد.</p>
