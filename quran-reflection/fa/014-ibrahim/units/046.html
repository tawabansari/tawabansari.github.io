<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">ابراهیم ۱۴:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="مَكَروا" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است." data-context="نیرنگ ورزیدند؛ اقدام آنان در طرح و تدبیر پنهان.">مَكَروا</button>
    <button class="word-link" type="button" data-word="مَكرَهُم" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است." data-context="نیرنگشان؛ همان مکر و طرح آنان.">مَكرَهُم</button>
    <button class="word-link" type="button" data-word="وَعِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مَكرُهُم" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است." data-context="نیرنگشان؛ طرحی که نزد آن معبود یگانه پوشیده نیست.">مَكرُهُم</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ فعلِ ساخت جمله دربارهٔ مکرشان.">كانَ</button>
    <button class="word-link" type="button" data-word="مَكرُهُم" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است." data-context="نیرنگشان؛ مکر در نسبت با از جای رفتن کوه‌ها.">مَكرُهُم</button>
    <button class="word-link" type="button" data-word="لِتَزولَ" data-root="ز و ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-w-l/" data-root-meaning="از جای خود کنار رفتن و از میان رفتن." data-context="از جای بروند؛ زوال و جابه‌جایی کوه‌ها در ساخت آیه.">لِتَزولَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ در بیان نسبت مکر آنان با از جای رفتن کوه‌ها." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالُ</button>
  </p>
  <p class="farsi-verse">و آنان نیرنگ خود را به کار بردند و نیرنگشان نزد آن معبود یگانه است، هرچند نیرنگشان چنان باشد که کوه‌ها از آن زایل شوند.</p>
</section>
