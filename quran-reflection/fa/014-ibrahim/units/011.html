  <p class="farsi-verse">رسولانشان به آنان گفتند: ما جز بشری مانند شما نیستیم، ولی آن معبود یگانه بر هر که از بندگانش بخواهد منت می‌نهد؛ و ما را نرسد که جز به اذن آن معبود یگانه حجتی برایتان بیاوریم؛ و مؤمنان باید بر آن معبود یگانه توکل کنند.</p>
