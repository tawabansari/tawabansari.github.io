<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که؛ زمانِ بیرون آمدن از گورها.">يَومَ</button>
    <button class="word-link" type="button" data-word="يَخرُجونَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون می‌آیند؛ از گورها.">يَخرُجونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَجداثِ" data-root="ج د ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-th/" data-root-meaning="جدث و أجداث: گور و گورها." data-context="گورها؛ مبدأ بیرون آمدن.">الأَجداثِ</button>
    <button class="word-link" type="button" data-word="سِراعًا" data-root="س ر ع" data-root-meaning="سرعت و تندیِ حرکت یا انجام کار در برابر کندی؛ و در مسارعت، شتاب در اقدام و پیش‌دستی به سوی مقصدی که ارزش آن از سیاق شناخته می‌شود." data-context="شتابان؛ حالِ اشخاص هنگام بیرون آمدن از گورها." data-learn-more="/quran-terminology/fa/roots/s-r-ayn/">سِراعًا</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="نُصُبٍ" data-root="ن ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-b/" data-root-meaning="برپا کردن؛ نَصَب: رنج؛ نصیب: سهم؛ نُصُب: سنگ‌های آیینی." data-context="نشانه‌ای برپاشده؛ مقصدِ حرکت در تشبیه.">نُصُبٍ</button>
    <button class="word-link" type="button" data-word="يوفِضونَ" data-root="و ف ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-f-dad/" data-root-meaning="شتابان رفتن و دویدن به سوی چیزی." data-context="می‌شتابند؛ حرکتِ سریع به سوی نشانهٔ برپا.">يوفِضونَ</button>
  </p>
  <p class="farsi-verse">روزی که شتابان از گورها بیرون می‌آیند، گویی به سوی نشانه‌ای برپا می‌شتابند،</p>
</section>
