<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="يَخرُجونَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">يَخرُجونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَجداثِ" data-root="ج د ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَجداثِ</button>
    <button class="word-link" type="button" data-word="سِراعًا" data-root="س ر ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سِراعًا</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="نُصُبٍ" data-root="ن ص ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نُصُبٍ</button>
    <button class="word-link" type="button" data-word="يوفِضونَ" data-root="و ف ض" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يوفِضونَ</button>
  </p>
  <p class="farsi-verse">روزی که شتابان از گورها بیرون می‌آیند، گویی به سوی نشانه‌ای برپا می‌شتابند،</p>
</section>
