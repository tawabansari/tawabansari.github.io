<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="صَلاتِهِم" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلاة خود؛ موضوع پایداری و مداومت">صَلاتِهِم</button>
    <button class="word-link" type="button" data-word="دائِمونَ" data-root="د و م" data-learn-more="/quran-terminology/fa/roots/d-w-m/" data-root-meaning="«د و م» بر پابرجا ماندن و ادامه یافتن یک چیز، حالت یا عمل در طول زمان دلالت دارد؛ و در برخی کاربردهای کهن، با سکون، ملازمت، گردش پایدار یا پیوسته دنبال کردن کار نیز ارتباط یافته است." data-context="پایدار و مداوم‌اند؛ در رابطه با صلاة خود">دائِمونَ</button>
  </p>
  <p class="farsi-verse">آنان که بر نمازشان پایدارند،</p>
