<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="مَسَّهُ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی">مَسَّهُ</button>
    <button class="word-link" type="button" data-word="الشَّرُّ" data-root="ش ر ر" data-root-meaning="شر، بدی یا زیانی است که می‌تواند به رفتار، وضعیت، رخداد یا فرجام چیزی نسبت داده شود؛ در ساخت مقایسه‌ای، بدتر بودن را بیان می‌کند؛ و شرر در شاخه مادی به پاره‌های فروزان و جهنده آتش اشاره دارد." data-learn-more="/quran-terminology/fa/roots/sh-r-r/">الشَّرُّ</button>
    <button class="word-link" type="button" data-word="جَزوعًا" data-root="ج ز ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-z-ayn/" data-root-meaning="بی‌تابی و آشفتگی در برابر رنج، در برابر شکیبایی.">جَزوعًا</button>
  </p>
  <p class="farsi-verse">هنگامی که بدی به او رسد، بی‌قرار،</p>
</section>
