<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="تَكونُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكونُ</button>
    <button class="word-link" type="button" data-word="السَّماءُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءُ</button>
    <button class="word-link" type="button" data-word="كَالمُهلِ" data-root="م ه ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-h2-l/" data-root-meaning="آرامی و مهلت دادن؛ مُهل: ماده گداخته یا روغن‌مانند، بنا بر شرح لغوی.">كَالمُهلِ</button>
  </p>
  <p class="farsi-verse">روزی که آسمان چون فلز گداخته باشد،</p>
</section>
