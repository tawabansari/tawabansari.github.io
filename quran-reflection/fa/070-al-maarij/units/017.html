<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">تَدعوا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="أَدبَرَ" data-root="د ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پایانی؛ روی گرداندن؛ تدبیر و تدبّر: توجه به پیامد و سامان دادن.">أَدبَرَ</button>
    <button class="word-link" type="button" data-word="وَتَوَلّىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">وَتَوَلّىٰ</button>
  </p>
  <p class="farsi-verse">کسی را فرامی‌خواند که پشت کرد و روی گرداند،</p>
</section>
