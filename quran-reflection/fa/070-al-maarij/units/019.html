<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="خُلِقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خُلِقَ</button>
    <button class="word-link" type="button" data-word="هَلوعًا" data-root="ه ل ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">هَلوعًا</button>

  <p class="farsi-verse">همانا انسان بی‌تاب آفریده شده است؛</p>
