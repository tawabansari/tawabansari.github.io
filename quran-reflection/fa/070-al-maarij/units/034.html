<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="صَلاتِهِم" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلاةِ آنان؛ عبادتی که بر آن مواظبت می‌کنند.">صَلاتِهِم</button>
    <button class="word-link" type="button" data-word="يُحافِظونَ" data-root="ح ف ظ" data-root-meaning="نگه داشتن و مراقبت کردن از چیزی تا ضایع، فراموش، رها یا تباه نشود." data-context="مواظبت می‌کنند؛ بر صلاةِ خود." data-learn-more="/quran-terminology/fa/roots/h-f-zha/">يُحافِظونَ</button>
  </p>
  <p class="farsi-verse">و آنان که بر نمازشان مراقبت می‌کنند،</p>
