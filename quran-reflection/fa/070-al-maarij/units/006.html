<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="يَرَونَهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">يَرَونَهُ</button>
    <button class="word-link" type="button" data-word="بَعيدًا" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعيدًا</button>
  </p>
  <p class="farsi-verse">آنان آن را دور می‌بینند،</p>
