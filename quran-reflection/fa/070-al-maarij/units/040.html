<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="أُقسِمُ" data-root="ق س م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أُقسِمُ</button>
    <button class="word-link" type="button" data-word="بِرَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">بِرَبِّ</button>
    <button class="word-link" type="button" data-word="المَشٰرِقِ" data-root="ش ر ق" data-learn-more="/quran-terminology/fa/roots/sh-r-q/">المَشٰرِقِ</button>
    <button class="word-link" type="button" data-word="وَالمَغٰرِبِ" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/">وَالمَغٰرِبِ</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="لَقٰدِرونَ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">لَقٰدِرونَ</button>
  </p>
  <p class="farsi-verse">پس سوگند می‌خورم به پروردگار خاورها و باخترها که ما تواناییم،</p>
