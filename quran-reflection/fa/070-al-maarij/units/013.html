<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَفَصيلَتِهِ" data-root="ف ص ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-sad-l/" data-root-meaning="جدا کردن و تفصیل دادن؛ فصل: جداسازی و داوری.">وَفَصيلَتِهِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="تُـٔويهِ" data-root="أ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="پناه گرفتن و در جایی جای گرفتن؛ إیواء: پناه دادن؛ مأوى: جای پناه و اقامت.">تُـٔويهِ</button>
  </p>
  <p class="farsi-verse">و خاندانش را که به او پناه می‌دهد،</p>
</section>
