<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="برای کافران؛ کسانی که عذاب مورد نظر به آنان مربوط است.">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="لَيسَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَيسَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="دافِعٌ" data-root="د ف ع" data-learn-more="/quran-terminology/fa/roots/d-f-ayn/" data-root-meaning="کنار زدن و دور ساختن یا پیش راندن؛ با «عن»، دفاع و دفع آسیب، و با «إلى»، سپردن و تحویل دادن." data-context="دفع‌کننده یا بازدارنده؛ کسی که عذاب مورد نظر را از کافران دور سازد، که وجودش نفی می‌شود.">دافِعٌ</button>
  </p>
  <p class="farsi-verse">برای کافران، که هیچ دفع‌کننده‌ای ندارد،</p>
</section>
