<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَيَطمَعُ" data-root="ط م ع" data-learn-more="/quran-terminology/fa/roots/tt-m-ayn/" data-root-meaning="چشم‌داشت و گرایش درونی به دستیابی به امر مطلوبی که ممکن پنداشته می‌شود">أَيَطمَعُ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="امرِئٍ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرِئٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُدخَلَ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">يُدخَلَ</button>
    <button class="word-link" type="button" data-word="جَنَّةَ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنَّةَ</button>
    <button class="word-link" type="button" data-word="نَعيمٍ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">نَعيمٍ</button>
  </p>
  <p class="farsi-verse">آیا هر یک از آنان طمع دارد که به باغی پرنعمت درآورده شود؟</p>
</section>
