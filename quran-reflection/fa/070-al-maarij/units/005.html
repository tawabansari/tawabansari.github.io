<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="پس شکیبایی و پایداری کن.">فَاصبِر</button>
    <button class="word-link" type="button" data-word="صَبرًا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="شکیبایی و پایداری.">صَبرًا</button>
    <button class="word-link" type="button" data-word="جَميلًا" data-root="ج م ل" data-root-meaning="زیبایی و نیکویی؛ و در شاخه‌ای دیگر، مجموعه و بزرگی؛ جَمَل نام شتر است." data-context="نیکو و شایسته؛ وصف کیفیت شکیبایی." data-learn-more="/quran-terminology/fa/roots/j-m-l/">جَميلًا</button>
  </p>
  <p class="farsi-verse">پس با شکیبایی زیبا شکیبا باش.</p>
