<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَصٰحِبَتِهِ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">وَصٰحِبَتِهِ</button>
    <button class="word-link" type="button" data-word="وَأَخيهِ" data-root="أ خ و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر و خواهر؛ و به گسترش معنا، پیوند خویشاوندی، همراهی یا تعلق مشترک.">وَأَخيهِ</button>
  </p>
  <p class="farsi-verse">و همسرش و برادرش را،</p>
