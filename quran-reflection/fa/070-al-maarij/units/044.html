  <h2 class="ayah-title">المعارج ۷۰:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خٰشِعَةً" data-root="خ ش ع" data-learn-more="/quran-terminology/fa/roots/kh-sh-ayn/">خٰشِعَةً</button>
    <button class="word-link" type="button" data-word="أَبصٰرُهُم" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/">أَبصٰرُهُم</button>
    <button class="word-link" type="button" data-word="تَرهَقُهُم" data-root="ر ه ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَرهَقُهُم</button>
    <button class="word-link" type="button" data-word="ذِلَّةٌ" data-root="ذ ل ل" data-learn-more="/quran-terminology/fa/roots/dh-l-l/">ذِلَّةٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="اليَومُ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">اليَومُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانوا</button>
    <button class="word-link" type="button" data-word="يوعَدونَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/">يوعَدونَ</button>
  </p>
  <p class="farsi-verse">چشمانشان فرو افتاده است و خواری آنان را می‌پوشاند. این همان روزی است که به آنان وعده داده می‌شد.</p>
