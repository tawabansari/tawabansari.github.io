<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">المعارج ۷۰:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="مُكرَمونَ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی.">مُكرَمونَ</button>
  </p>
  <p class="farsi-verse">آنان در باغ‌ها گرامی داشته می‌شوند.</p>
