<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">يُريدُ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="امرِئٍ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرِئٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُؤتىٰ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يُؤتىٰ</button>
    <button class="word-link" type="button" data-word="صُحُفًا" data-root="ص ح ف" data-root-meaning="« صُحُف » به صحیفه‌ها و نوشته‌ها اشاره می‌کند و « صِحَاف » به ظرف‌های پهن غذا." data-learn-more="/quran-terminology/fa/roots/sad-h-f/">صُحُفًا</button>
    <button class="word-link" type="button" data-word="مُنَشَّرَةً" data-root="ن ش ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُنَشَّرَةً</button>
  </p>
  <p class="farsi-verse">بلکه هر یک از آنان می‌خواهد به او نوشته‌هایی گشوده داده شود.</p>
</section>
