<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="عَبَسَ" data-root="ع ب س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-b-s/" data-root-meaning="اخم و درهم کشیدن چهره." data-context="اخم کرد؛ در توصیف حالت چهرهٔ شخص پس از اندیشیدن و نگریستن.">عَبَسَ</button>
    <button class="word-link" type="button" data-word="وَبَسَرَ" data-root="ب س ر" data-root-meaning="درهم کشیدن چهره، ترش‌رویی و گرفتگی صورت؛ در شاخه‌های دیگر، تازگی و نارس بودن، اقدام پیش از موعد، و بازایستادن از حرکت." data-context="و چهره‌اش را درهم کشید؛ فعل ماضی در توصیف حالت شخص پس از اندیشیدن و نگریستن." data-learn-more="/quran-terminology/fa/roots/b-s-r/">وَبَسَرَ</button>
  </p>
  <p class="farsi-verse">سپس چهره درهم کشید و ترش‌رو شد،</p>
</section>
