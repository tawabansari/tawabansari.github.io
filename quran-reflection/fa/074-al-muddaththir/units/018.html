<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="فَكَّرَ" data-root="ف ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-r/" data-root-meaning="اندیشه و به کار گرفتن فکر برای شناخت.">فَكَّرَ</button>
    <button class="word-link" type="button" data-word="وَقَدَّرَ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">وَقَدَّرَ</button>
  </p>
  <p class="farsi-verse">او اندیشید و سنجید،</p>
</section>
