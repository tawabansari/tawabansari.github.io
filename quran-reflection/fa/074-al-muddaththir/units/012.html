<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلتُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلتُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="مالًا" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">مالًا</button>
    <button class="word-link" type="button" data-word="مَمدودًا" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر">مَمدودًا</button>
  </p>
  <p class="farsi-verse">و برای او دارایی فراوان قرار دادم،</p>
</section>
