<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكُنّا</button>
    <button class="word-link" type="button" data-word="نَخوضُ" data-root="خ و ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-dad/" data-root-meaning="در آب فرو رفتن و پیش رفتن؛ مجازاً وارد بحث یا کاری شدن.">نَخوضُ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="الخائِضينَ" data-root="خ و ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-dad/" data-root-meaning="در آب فرو رفتن و پیش رفتن؛ مجازاً وارد بحث یا کاری شدن.">الخائِضينَ</button>
  </p>
  <p class="farsi-verse">و با فروروندگان در گفتار بیهوده فرو می‌رفتیم،</p>
</section>
