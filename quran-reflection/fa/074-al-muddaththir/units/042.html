<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="سَلَكَكُم" data-root="س ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-k/" data-root-meaning="در راهی رفتن یا چیزی را در مسیر و جایگاهی درآوردن.">سَلَكَكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَقَرَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سَقَرَ</button>
  </p>
  <p class="farsi-verse">«چه چیز شما را به سقر درآورد؟»</p>
</section>
