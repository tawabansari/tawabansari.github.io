<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="تَنفَعُهُم" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی">تَنفَعُهُم</button>
    <button class="word-link" type="button" data-word="شَفٰعَةُ" data-root="ش ف ع" data-learn-more="/quran-terminology/fa/roots/sh-f-ayn/" data-root-meaning="جفت‌شدن، ضمیمه‌شدن، و قرارگرفتن یک عامل در کنار عامل دیگر برای پشتیبانی یا تقویت یک اثر">شَفٰعَةُ</button>
    <button class="word-link" type="button" data-word="الشّٰفِعينَ" data-root="ش ف ع" data-learn-more="/quran-terminology/fa/roots/sh-f-ayn/" data-root-meaning="جفت‌شدن، ضمیمه‌شدن، و قرارگرفتن یک عامل در کنار عامل دیگر برای پشتیبانی یا تقویت یک اثر">الشّٰفِعينَ</button>
  </p>
  <p class="farsi-verse">پس شفاعت شفاعت‌کنندگان به آنان سودی نمی‌رساند.</p>
