<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُبقى" data-root="ب ق ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-q-y/" data-root-meaning="ماندن و از میان نرفتن؛ بقية: آنچه باقی مانده است.">تُبقى</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَذَرُ" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن.">تَذَرُ</button>
  </p>
  <p class="farsi-verse">نه باقی می‌گذارد و نه رها می‌کند،</p>
</section>
