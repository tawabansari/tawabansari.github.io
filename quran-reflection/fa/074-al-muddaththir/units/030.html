<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="تِسعَةَ" data-root="ت س ع" data-learn-more="/quran-terminology/fa/roots/t-s-ayn/" data-root-meaning="عدد نه، نود، نودونه و نوزده؛ ریشه‌ای عددی که معنای آن مقدار است و نقش هر کاربرد را سیاق تعیین می‌کند" data-context="نه؛ جزء نخست عدد نوزده.">تِسعَةَ</button>
    <button class="word-link" type="button" data-word="عَشَرَ" data-root="ع ش ر" data-root-meaning="ده و صورت‌ها و نسبت‌های عددی آن؛ معاشرت، همراهی، خویشاوندی و جماعت؛ عشار: شتران مادهٔ نزدیک به زایمان." data-context="ده؛ جزء دوم عدد نوزده." data-learn-more="/quran-terminology/fa/roots/ayn-sh-r/">عَشَرَ</button>
  </p>
  <p class="farsi-verse">بر آن نوزده تن‌اند.</p>
</section>
