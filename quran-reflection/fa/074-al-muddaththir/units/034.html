<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">المدثر ۷۴:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالصُّبحِ" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ.">وَالصُّبحِ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="أَسفَرَ" data-root="س ف ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-f-r/" data-root-meaning="آشکار کردن؛ سفر کردن؛ سِفر: کتاب؛ سفره: نویسندگان یا فرستادگان، بنا بر تفسیر.">أَسفَرَ</button>
  </p>
  <p class="farsi-verse">و صبح چون روشن شود،</p>
