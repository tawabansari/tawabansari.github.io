<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الشمس ۹۱:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="خابَ" data-root="خ ي ب" data-root-meaning="ناکام ماندن و محروم شدن از نتیجه یا بهرهٔ مورد انتظار؛ نرسیدن به مطلوبی که شخص در پی آن بوده یا به آن امید داشته است." data-context="ناکام ماند؛ در برابر فلاح در آیه پیشین و در ارتباط با تدسیهٔ نفس." data-learn-more="/quran-terminology/fa/roots/kh-y-b/">خابَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="دَسّىٰها" data-root="د س و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-s-w/" data-root-meaning="پوشاندن و فرو بردن؛ در وصف نفس، آلوده و تباه ساختن؛ با «دسس» پیوند اشتقاقی دارد." data-context="نفس را فروپوشاند و تباه ساخت؛ در خوانشِ فاعلیت انسان، شخص نفس خود را دچار این وضع می‌کند.">دَسّىٰها</button>
  </p>
  <p class="farsi-verse">و ناکام شد آن‌که آن را فروپوشاند.</p>
</section>
