<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الشمس ۹۱:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالنَّهارِ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="و سوگند به روز.">وَالنَّهارِ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="جَلّىٰها" data-root="ج ل و" data-root-meaning="آشکار شدن، آشکار ساختن و برطرف شدن پوشیدگی؛ در کاربرد سرزمین، بیرون رفتن و ترک جایگاه پیشین." data-context="آن را آشکار کند؛ روز فاعل است و ضمیر مفعولی در مقاله بررسی می‌شود." data-learn-more="/quran-terminology/fa/roots/j-l-w/">جَلّىٰها</button>
  </p>
  <p class="farsi-verse">و به روز، هنگامی که آن را آشکار کند،</p>
</section>
