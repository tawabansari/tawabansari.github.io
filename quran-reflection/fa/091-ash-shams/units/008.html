<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الشمس ۹۱:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَلهَمَها" data-root="ل ه م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَلهَمَها</button>
    <button class="word-link" type="button" data-word="فُجورَها" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست.">فُجورَها</button>
    <button class="word-link" type="button" data-word="وَتَقوىٰها" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَتَقوىٰها</button>
  </p>
  <p class="farsi-verse">پس نافرمانی و پرهیزگاری‌اش را به آن الهام کرد.</p>
</section>
