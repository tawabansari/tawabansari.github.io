<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">الشمس ۹۱:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَذَّبوهُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">فَكَذَّبوهُ</button>
    <button class="word-link" type="button" data-word="فَعَقَروها" data-root="ع ق ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَعَقَروها</button>
    <button class="word-link" type="button" data-word="فَدَمدَمَ" data-root="د م د م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَدَمدَمَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="رَبُّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّهُم</button>
    <button class="word-link" type="button" data-word="بِذَنبِهِم" data-root="ذ ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِذَنبِهِم</button>
    <button class="word-link" type="button" data-word="فَسَوّىٰها" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">فَسَوّىٰها</button>
  </p>
  <p class="farsi-verse">اما او را تکذیب کردند و آن را پی کردند؛ پس پروردگارشان به سبب گناهشان نابودی را بر آنان فروآورد و آن را هموار کرد.</p>
</section>
