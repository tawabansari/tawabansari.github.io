<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَنذَرَهُم" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">أَنذَرَهُم</button>
    <button class="word-link" type="button" data-word="بَطشَتَنا" data-root="ب ط ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَطشَتَنا</button>
    <button class="word-link" type="button" data-word="فَتَمارَوا" data-root="م ر ي" data-learn-more="/quran-terminology/fa/roots/m-r-y/" data-root-meaning="تردید، دودلی و مجادله؛ از بیرون کشیدن شیر تا کشمکش بر سر حقیقت و مرز میان پرسش و مراء در قرآن">فَتَمارَوا</button>
    <button class="word-link" type="button" data-word="بِالنُّذُرِ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">بِالنُّذُرِ</button>
  </p>
  <p class="farsi-verse">و او آنان را از سخت‌گیری ما هشدار داده بود؛ ولی دربارهٔ هشدارها به جدل پرداختند.</p>
</section>
