<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَبِّئهُم" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">وَنَبِّئهُم</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="الماءَ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">الماءَ</button>
    <button class="word-link" type="button" data-word="قِسمَةٌ" data-root="ق س م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قِسمَةٌ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="شِربٍ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن.">شِربٍ</button>
    <button class="word-link" type="button" data-word="مُحتَضَرٌ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت">مُحتَضَرٌ</button>
  </p>
  <p class="farsi-verse">و به آنان خبر بده که آب میانشان تقسیم شده است؛ هر نوبت نوشیدن با حضور صاحب آن است.</p>
</section>
