<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَنادَوا" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="پس فرا خواندند؛ قوم همراه خود را صدا زدند." data-learn-more="/quran-terminology/fa/roots/n-d-y/">فَنادَوا</button>
    <button class="word-link" type="button" data-word="صاحِبَهُم" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="همراهشان؛ فردی از قوم که فراخوانده شد.">صاحِبَهُم</button>
    <button class="word-link" type="button" data-word="فَتَعاطىٰ" data-root="ع ط و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-tt-w/" data-root-meaning="دادن و بخشش؛ تعاطی: دست به کاری زدن یا چیزی را گرفتن." data-context="پس دست به کار شد؛ اقدام برای کشتن ناقه.">فَتَعاطىٰ</button>
    <button class="word-link" type="button" data-word="فَعَقَرَ" data-root="ع ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-q-r/" data-root-meaning="پی کردن و از پا درآوردن؛ عاقر: نازا، در شاخه‌ای دیگر." data-context="پس پی کرد؛ کشتن یا از پا انداختن ناقه.">فَعَقَرَ</button>
  </p>
  <p class="farsi-verse">پس همراه خود را ندا دادند؛ او دست به کار شد و پی کرد.</p>
</section>
