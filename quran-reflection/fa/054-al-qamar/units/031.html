<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="صَيحَةً" data-root="ص ي ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَيحَةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن">وٰحِدَةً</button>
    <button class="word-link" type="button" data-word="فَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَكانوا</button>
    <button class="word-link" type="button" data-word="كَهَشيمِ" data-root="ه ش م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَهَشيمِ</button>
    <button class="word-link" type="button" data-word="المُحتَظِرِ" data-root="ح ظ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المُحتَظِرِ</button>
  </p>
  <p class="farsi-verse">ما بر آنان یک بانگ فرستادیم؛ پس مانند خاشاک حصارساز شدند.</p>
</section>
