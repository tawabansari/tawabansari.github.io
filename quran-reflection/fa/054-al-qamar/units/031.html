<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادیم؛ بانگی یگانه را بر قوم ثمود فرستادیم.">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="صَيحَةً" data-root="ص ي ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-h/" data-root-meaning="بانگ و فریاد بلند." data-context="بانگی بلند؛ صیحه‌ای که بر قوم ثمود فرستاده شد.">صَيحَةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یکی و یگانه؛ وصف صیحه و بیان اینکه یک بانگ فرستاده شد.">وٰحِدَةً</button>
    <button class="word-link" type="button" data-word="فَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="پس شدند؛ وضع آنان پس از صیحه با خرده‌های خشک حصار مقایسه می‌شود.">فَكانوا</button>
    <button class="word-link" type="button" data-word="كَهَشيمِ" data-root="ه ش م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-sh-m/" data-root-meaning="خرد شدن گیاه و خشکیده‌های شکسته." data-context="چون گیاهان یا شاخه‌های خشک و خردشده؛ با کاف تشبیه، در اضافه به «المحتظر».">كَهَشيمِ</button>
    <button class="word-link" type="button" data-word="المُحتَظِرِ" data-root="ح ظ ر" data-root-meaning="ریشهٔ «ح ظ ر» در زبان عربی بر منع، بازداشتن و ایجاد مانع دسترسی دلالت دارد. این معنا هم در محدودیت‌های غیرمادی دیده می‌شود و هم در ساخت حصارهای واقعی." data-context="حصارساز یا صاحب آغل؛ اسم فاعل باب افتعال در قرائت حفص. «هشیم» خرده‌های خشک و شکستهٔ وابسته به حصار او را بیان می‌کند." data-learn-more="/quran-terminology/fa/roots/h-zha-r/">المُحتَظِرِ</button>
  </p>
  <p class="farsi-verse">ما بر آنان یک بانگ فرستادیم؛ پس مانند خاشاک حصارساز شدند.</p>
</section>
