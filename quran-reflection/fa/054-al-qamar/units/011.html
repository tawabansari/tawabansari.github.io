  <h2 class="ayah-title">القمر ۵۴:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَفَتَحنا" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده">فَفَتَحنا</button>
    <button class="word-link" type="button" data-word="أَبوٰبَ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون.">أَبوٰبَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءِ</button>
    <button class="word-link" type="button" data-word="بِماءٍ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">بِماءٍ</button>
    <button class="word-link" type="button" data-word="مُنهَمِرٍ" data-root="ه م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-m-r/" data-root-meaning="فرو ریختن فراوان آب یا اشک.">مُنهَمِرٍ</button>
  </p>
  <p class="farsi-verse">پس درهای آسمان را با آبی ریزان گشودیم،</p>
