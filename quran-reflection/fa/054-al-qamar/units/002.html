<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">يَرَوا</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايَةً</button>
    <button class="word-link" type="button" data-word="يُعرِضوا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">يُعرِضوا</button>
    <button class="word-link" type="button" data-word="وَيَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَيَقولوا</button>
    <button class="word-link" type="button" data-word="سِحرٌ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر">سِحرٌ</button>
    <button class="word-link" type="button" data-word="مُستَمِرٌّ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت.">مُستَمِرٌّ</button>
  </p>
  <p class="farsi-verse">و اگر نشانه‌ای ببینند، روی می‌گردانند و می‌گویند: «جادویی پیوسته است.»</p>
</section>
