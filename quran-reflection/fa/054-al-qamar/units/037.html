<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="رٰوَدوهُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">رٰوَدوهُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ضَيفِهِ" data-root="ض ي ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-y-f/" data-root-meaning="مهمان و مهمان‌نوازی کردن.">ضَيفِهِ</button>
    <button class="word-link" type="button" data-word="فَطَمَسنا" data-root="ط م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-m-s/" data-root-meaning="محو کردن و از میان بردن اثر یا روشنایی.">فَطَمَسنا</button>
    <button class="word-link" type="button" data-word="أَعيُنَهُم" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">أَعيُنَهُم</button>
    <button class="word-link" type="button" data-word="فَذوقوا" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج.">فَذوقوا</button>
    <button class="word-link" type="button" data-word="عَذابى" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابى</button>
    <button class="word-link" type="button" data-word="وَنُذُرِ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">وَنُذُرِ</button>
  </p>
  <p class="farsi-verse">و از او مهمانانش را خواستند؛ پس دیدگانشان را محو کردیم: «عذاب من و هشدارهایم را بچشید.»</p>
</section>
