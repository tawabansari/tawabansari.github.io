<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَنزِعُ" data-root="ن ز ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَنزِعُ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسَ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="أَعجازُ" data-root="ع ج ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَعجازُ</button>
    <button class="word-link" type="button" data-word="نَخلٍ" data-root="ن خ ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَخلٍ</button>
    <button class="word-link" type="button" data-word="مُنقَعِرٍ" data-root="ق ع ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُنقَعِرٍ</button>
  </p>
  <p class="farsi-verse">که مردم را از جا می‌کند، گویی تنه‌های نخل از ریشه برکنده‌اند.</p>
</section>
