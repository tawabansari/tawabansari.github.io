<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="ريحًا" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">ريحًا</button>
    <button class="word-link" type="button" data-word="صَرصَرًا" data-root="ص ر ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-sad-r/" data-root-meaning="تندی و بانگ باد؛ صرصر با سرمای سخت یا صدای شدید توضیح داده شده است.">صَرصَرًا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومِ</button>
    <button class="word-link" type="button" data-word="نَحسٍ" data-root="ن ح س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h-s/" data-root-meaning="نحسی و بدفرجامی؛ نحاس: مس یا دود، بنا بر تفسیر.">نَحسٍ</button>
    <button class="word-link" type="button" data-word="مُستَمِرٍّ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت.">مُستَمِرٍّ</button>
  </p>
  <p class="farsi-verse">ما بر آنان بادی سخت و سرد در روزی با شومی پیوسته فرستادیم،</p>
</section>
