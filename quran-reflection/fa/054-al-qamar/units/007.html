<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خُشَّعًا" data-root="خ ش ع" data-learn-more="/quran-terminology/fa/roots/kh-sh-ayn/" data-root-meaning="فرو آمدن از بلندی و سختی، نرم شدن، آرام گرفتن، و فرونشستن در برابر حقیقت و عظمت">خُشَّعًا</button>
    <button class="word-link" type="button" data-word="أَبصٰرُهُم" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">أَبصٰرُهُم</button>
    <button class="word-link" type="button" data-word="يَخرُجونَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">يَخرُجونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَجداثِ" data-root="ج د ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-th/" data-root-meaning="جدث و أجداث: گور و گورها.">الأَجداثِ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="جَرادٌ" data-root="ج ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-r-d/" data-root-meaning="برهنه و بی‌پوشش شدن؛ جراد در قرآن نام ملخ است.">جَرادٌ</button>
    <button class="word-link" type="button" data-word="مُنتَشِرٌ" data-root="ن ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-r/" data-root-meaning="گستردن و پراکندن؛ نشور: برخاستن و زنده شدن دوباره.">مُنتَشِرٌ</button>
  </p>
  <p class="farsi-verse">با دیدگانی فرو افتاده از گورها بیرون می‌آیند، گویی ملخ‌هایی پراکنده‌اند،</p>
</section>
