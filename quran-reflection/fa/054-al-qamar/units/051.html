<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَهلَكنا" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="همانندان و هم‌کیشان شما را نابود ساختیم." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">أَهلَكنا</button>
    <button class="word-link" type="button" data-word="أَشياعَكُم" data-root="ش ي ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-ayn/" data-root-meaning="پراکنده و رایج شدن؛ شیعه: گروه پیرو و پشتیبان." data-context="هم‌کیشان و همانندانِ شما.">أَشياعَكُم</button>
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهَل</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مُدَّكِرٍ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="آیا پندگیرنده‌ای هست؟">مُدَّكِرٍ</button>
  </p>
  <p class="farsi-verse">و هم‌کیشان شما را هلاک کرده‌ایم؛ پس آیا پندگیرنده‌ای هست؟</p>
</section>
