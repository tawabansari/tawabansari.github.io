<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَيَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">سَيَعلَمونَ</button>
    <button class="word-link" type="button" data-word="غَدًا" data-root="غ د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-w/" data-root-meaning="بامداد و بامداد رفتن؛ غد: فردا یا آینده.">غَدًا</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَنِ</button>
    <button class="word-link" type="button" data-word="الكَذّابُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">الكَذّابُ</button>
    <button class="word-link" type="button" data-word="الأَشِرُ" data-root="أ ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-sh-r/" data-root-meaning="سرمستیِ متکبرانه، بی‌پروایی و زیاده‌روی ناشی از خودپسندی.">الأَشِرُ</button>
  </p>
  <p class="farsi-verse">فردا خواهند دانست که دروغگوی خودپسند کیست.</p>
</section>
