<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَمرُنا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرُنا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="وٰحِدَةٌ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن">وٰحِدَةٌ</button>
    <button class="word-link" type="button" data-word="كَلَمحٍ" data-root="ل م ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-m-h/" data-root-meaning="نگاه گذرا و درخشش زودگذر.">كَلَمحٍ</button>
    <button class="word-link" type="button" data-word="بِالبَصَرِ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">بِالبَصَرِ</button>
  </p>
  <p class="farsi-verse">و فرمان ما جز یکی نیست، همچون چشم برهم‌زدنی.</p>
</section>
