<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَحَمَلنٰهُ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="و او را حمل کردیم؛ نوح بر کشتیِ دارای تخته‌ها و بست‌ها." data-learn-more="/quran-terminology/fa/roots/h-m-l/">وَحَمَلنٰهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ذاتِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذاتِ</button>
    <button class="word-link" type="button" data-word="أَلوٰحٍ" data-root="ل و ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-h/" data-root-meaning="لوح و تخته؛ نیز نمایان شدن و سوزاندن یا دگرگون کردن رنگ." data-context="تخته‌ها؛ یکی از اجزای وسیلهٔ حمل نوح.">أَلوٰحٍ</button>
    <button class="word-link" type="button" data-word="وَدُسُرٍ" data-root="د س ر" data-learn-more="/quran-terminology/fa/roots/d-s-r/" data-root-meaning="راندن و پیش بردن با نیرو؛ دُسُر: میخ‌ها یا بست‌های اتصال‌دهندهٔ کشتی." data-context="و بست‌ها؛ اجزای پیونددهندهٔ تخته‌های کشتی.">وَدُسُرٍ</button>
  </p>
  <p class="farsi-verse">و او را بر چیزی دارای تخته‌ها و میخ‌ها حمل کردیم،</p>
</section>
