<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَدَعا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">فَدَعا</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّى</button>
    <button class="word-link" type="button" data-word="مَغلوبٌ" data-root="غ ل ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَغلوبٌ</button>
    <button class="word-link" type="button" data-word="فَانتَصِر" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">فَانتَصِر</button>
  </p>
  <p class="farsi-verse">پس پروردگارش را خواند: «من مغلوب شده‌ام، پس یاری کن.»</p>
</section>
