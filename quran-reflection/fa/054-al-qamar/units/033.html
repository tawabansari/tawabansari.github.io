<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذَّبَت" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبَت</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومُ</button>
    <button class="word-link" type="button" data-word="لوطٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لوطٍ</button>
    <button class="word-link" type="button" data-word="بِالنُّذُرِ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">بِالنُّذُرِ</button>
  </p>
  <p class="farsi-verse">قوم لوط هشدارها را تکذیب کردند.</p>
</section>
