<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">وَكَذَّبوا</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">وَاتَّبَعوا</button>
    <button class="word-link" type="button" data-word="أَهواءَهُم" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس">أَهواءَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">وَكُلُّ</button>
    <button class="word-link" type="button" data-word="أَمرٍ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرٍ</button>
    <button class="word-link" type="button" data-word="مُستَقِرٌّ" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری.">مُستَقِرٌّ</button>
  </p>
  <p class="farsi-verse">و تکذیب کردند و از خواسته‌های خود پیروی کردند؛ و هر کاری قرارگاهی دارد.</p>
</section>
