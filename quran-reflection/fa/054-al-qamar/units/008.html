<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُهطِعينَ" data-root="ه ط ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُهطِعينَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الدّاعِ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">الدّاعِ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولُ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرونَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="يَومٌ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومٌ</button>
    <button class="word-link" type="button" data-word="عَسِرٌ" data-root="ع س ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَسِرٌ</button>
  </p>
  <p class="farsi-verse">شتابان به سوی فراخواننده؛ کافران می‌گویند: «این روزی دشوار است.»</p>
</section>
