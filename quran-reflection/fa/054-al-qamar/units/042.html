<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">القمر ۵۴:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="كُلِّها" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّها</button>
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَأَخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="أَخذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَخذَ</button>
    <button class="word-link" type="button" data-word="عَزيزٍ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری">عَزيزٍ</button>
    <button class="word-link" type="button" data-word="مُقتَدِرٍ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">مُقتَدِرٍ</button>
  </p>
  <p class="farsi-verse">همهٔ نشانه‌های ما را تکذیب کردند؛ پس آنان را با گرفتنِ عزتمندی توانا گرفتیم.</p>
</section>
