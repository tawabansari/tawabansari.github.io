<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَدَلّىٰهُما" data-root="د ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-l-w/" data-root-meaning="دلو و فرو فرستادن یا بالا کشیدن آن؛ تدلّی: آویختن و نزدیک شدن." data-context="پس آن دو را فروکشاند؛ کشاندن به خطا در پی فریب.">فَدَلّىٰهُما</button>
    <button class="word-link" type="button" data-word="بِغُرورٍ" data-root="غ ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-r/" data-root-meaning="فریب و دل بستن به نمود گمراه‌کننده." data-context="با فریب؛ شیوهٔ کشاندن آن دو.">بِغُرورٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="ذاقَا" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="چشیدند؛ چشیدن از درخت.">ذاقَا</button>
    <button class="word-link" type="button" data-word="الشَّجَرَةَ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="درخت؛ چیزی که از آن چشیدند.">الشَّجَرَةَ</button>
    <button class="word-link" type="button" data-word="بَدَت" data-root="ب د و" data-learn-more="/quran-terminology/fa/roots/b-d-w/" data-root-meaning="آشکار شدن، پدیدار گشتن از پس پوشیدگی، و ورود چیزی به میدان دید یا آگاهی" data-context="آشکار شد؛ نمایان شدن برهنگی آن دو.">بَدَت</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُما</button>
    <button class="word-link" type="button" data-word="سَوءٰتُهُما" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="برهنگی و اندام پوشیدنی آن دو.">سَوءٰتُهُما</button>
    <button class="word-link" type="button" data-word="وَطَفِقا" data-root="ط ف ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-f-q/" data-root-meaning="آغاز کردن و به انجام کاری پرداختن." data-context="و آغاز کردند؛ شروع پوشاندن خود.">وَطَفِقا</button>
    <button class="word-link" type="button" data-word="يَخصِفانِ" data-root="خ ص ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-sad-f/" data-root-meaning="پیوستن و روی هم نهادن قطعات، مانند برگ یا وصله." data-context="بر هم می‌نهادند؛ چسباندن برگ‌ها برای پوشش.">يَخصِفانِ</button>
    <button class="word-link" type="button" data-word="عَلَيهِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِما</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="وَرَقِ" data-root="و ر ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-q/" data-root-meaning="برگ درخت؛ وَرِق: نقره یا پول نقره." data-context="برگ؛ وسیلهٔ پوشاندن.">وَرَقِ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغ؛ جایگاه برگ‌ها و رخداد.">الجَنَّةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَنادىٰهُما" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="و آن دو را ندا داد؛ خطاب پروردگار به آن دو." data-learn-more="/quran-terminology/fa/roots/n-d-y/">وَنادىٰهُما</button>
    <button class="word-link" type="button" data-word="رَبُّهُما" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار آن دو؛ نداکنندهٔ آنان.">رَبُّهُما</button>
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="أَنهَكُما" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="شما دو تن را نهی کردم؛ پرسش از نهی پیشین." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">أَنهَكُما</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="تِلكُمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">تِلكُمَا</button>
    <button class="word-link" type="button" data-word="الشَّجَرَةِ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="درخت؛ موضوع نهی پیشین.">الشَّجَرَةِ</button>
    <button class="word-link" type="button" data-word="وَأَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفتم؛ یادآوری هشدار پیشین.">وَأَقُل</button>
    <button class="word-link" type="button" data-word="لَكُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُما</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ کسی که دربارهٔ دشمنی او هشدار داده شد.">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="لَكُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُما</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن؛ نسبت شیطان با آن دو.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصف دشمنی.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">پس آن دو را با فریب فرو کشید. هنگامی که از درخت چشیدند، شرمگاه‌هایشان برایشان آشکار شد و شروع کردند برگ‌های باغ را بر خود چسباندن. و پروردگارشان آنان را ندا داد: آیا شما را از آن درخت نهی نکردم و به شما نگفتم که شیطان برای شما دشمنی آشکار است؟</p>
</section>
