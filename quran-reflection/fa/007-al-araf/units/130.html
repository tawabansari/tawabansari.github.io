<section class="ayah-block" id="ayah-130" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَخَذنا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَخَذنا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالَ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="بِالسِّنينَ" data-root="س ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است.">بِالسِّنينَ</button>
    <button class="word-link" type="button" data-word="وَنَقصٍ" data-root="ن ق ص" data-learn-more="/quran-terminology/fa/roots/n-q-sad/" data-root-meaning="کاستن، کم شدن و نقصان؛ از کاهش مال و محصول تا کم گذاشتن در حق دیگران، کاسته شدن عمر و تغییر حدود زمین">وَنَقصٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="ث م ر" data-learn-more="/quran-terminology/fa/roots/th-m-r/" data-root-meaning="بار درخت، میوه و گسترش معنا به حاصل و دارایی">الثَّمَرٰتِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَذَّكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">يَذَّكَّرونَ</button>
  </p>
  <p class="farsi-verse">و خاندان فرعون را به سال‌های قحطی و کاهش میوه‌ها گرفتار کردیم، باشد که یادآور شوند.</p>
</section>
