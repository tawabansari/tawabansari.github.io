<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="و به یاد آورید؛ یادآوری جانشینی و امکانات زندگی.">وَاذكُروا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="جَعَلَكُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="شما را قرار داد؛ قرار گرفتن قوم در موقعیت جانشینی.">جَعَلَكُم</button>
    <button class="word-link" type="button" data-word="خُلَفاءَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="جانشینان؛ قوم ثمود پس از عاد.">خُلَفاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ نسبت زمانی ثمود با عاد.">بَعدِ</button>
    <button class="word-link" type="button" data-word="عادٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عادٍ</button>
    <button class="word-link" type="button" data-word="وَبَوَّأَكُم" data-root="ب و أ" data-learn-more="/quran-terminology/fa/roots/b-w-a/" data-root-meaning="از بازگشت و جای گرفتن تا جای دادن و بر عهده گرفتن پیامد" data-context="و به شما جایگاه داد؛ فراهم شدن امکان استقرار در زمین.">وَبَوَّأَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ محل استقرار و زندگی قوم.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="تَتَّخِذونَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="می‌سازید و فراهم می‌کنید؛ برپا کردن کاخ‌ها در زمین‌های هموار.">تَتَّخِذونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سُهولِها" data-root="س ه ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-h2-l/" data-root-meaning="همواری و آسانی؛ سهل: زمین هموار." data-context="زمین‌های هموار آن؛ جای ساختن کاخ‌ها.">سُهولِها</button>
    <button class="word-link" type="button" data-word="قُصورًا" data-root="ق ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-r/" data-root-meaning="کوتاه کردن و محدود ساختن؛ قصر: بنای بزرگ یا کاخ." data-context="کاخ‌ها؛ بناهایی که در زمین‌های هموار ساخته می‌شوند.">قُصورًا</button>
    <button class="word-link" type="button" data-word="وَتَنحِتونَ" data-root="ن ح ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h-t/" data-root-meaning="تراشیدن سنگ، چوب یا جسم سخت." data-context="و می‌تراشید؛ ساختن خانه با تراشیدن کوه‌ها.">وَتَنحِتونَ</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند." data-context="کوه‌ها؛ آنچه برای ساختن خانه می‌تراشند.">الجِبالَ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/" data-root-meaning="خانه و جای اقامت؛ بات: شب را گذراندن؛ تبییت: ترتیب دادن کاری در شب یا پنهانی." data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-context="خانه‌ها؛ محل‌های سکونت تراشیده‌شده در کوه‌ها.">بُيوتًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="پس به یاد آورید؛ فرمان یادآوری نعمت‌ها پس از بیان امکانات زندگی.">فَاذكُروا</button>
    <button class="word-link" type="button" data-word="ءالاءَ" data-root="أ ل و" data-learn-more="/quran-terminology/fa/roots/a-l-w/" data-root-meaning="نعمت و عطا: «آلاء» به معنای بخشش‌ها، نعمت‌ها و احسان‌های برخوردارکننده." data-context="نعمت‌های آن معبود یگانه؛ از جمله استقرار در زمین و توان ساختن و سکونت.">ءالاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعثَوا" data-root="ع ث و" data-learn-more="/quran-terminology/fa/roots/ayn-th-w/" data-root-meaning="پرداختن به فساد و برهم‌زدن نظم و صلاح موجود، به‌گونه‌ای که حقوق مردم و بنیادهای زندگی جمعی آسیب ببیند." data-context="در «لا تعثوا»: در زمین تباهی و فساد نکنید.">تَعثَوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ عرصه‌ای که از فساد کردن در آن نهی شده‌اند.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع" data-context="فسادکنندگان؛ وصف حالِ رفتار نکوهیده در نهی پایانی.">مُفسِدينَ</button>
  </p>
  <p class="farsi-verse">و به یاد آورید هنگامی که شما را پس از عاد جانشینان قرار داد و در زمین جای داد؛ از دشت‌هایش کاخ‌ها می‌سازید و کوه‌ها را به خانه‌ها می‌تراشید. پس نعمت‌های آن معبود یگانه را به یاد آورید و در زمین فسادگرانه تباهی نکنید.</p>
</section>
