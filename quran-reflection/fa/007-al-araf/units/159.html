<section class="ayah-block" id="ayah-159" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="قَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومِ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="يَهدونَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدونَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَبِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَبِهِ</button>
    <button class="word-link" type="button" data-word="يَعدِلونَ" data-root="ع د ل" data-learn-more="/quran-terminology/fa/roots/ayn-d-l/" data-root-meaning="هم‌سنگ‌کردن، راست‌داشتن، برابرنهادن، و قرار دادن هر چیز در نسبتی که از کژی و یک‌طرفه‌شدن جلوگیری کند">يَعدِلونَ</button>
  </p>
  <p class="farsi-verse">و از قوم موسی جماعتی هستند که به حق هدایت می‌کنند و با آن داد می‌ورزند.</p>
</section>
