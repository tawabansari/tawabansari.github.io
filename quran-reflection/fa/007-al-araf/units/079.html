<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۷۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَوَلّىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">فَتَوَلّىٰ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="أَبلَغتُكُم" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت">أَبلَغتُكُم</button>
    <button class="word-link" type="button" data-word="رِسالَةَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رِسالَةَ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبّى</button>
    <button class="word-link" type="button" data-word="وَنَصَحتُ" data-root="ن ص ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-h/" data-root-meaning="خیرخواهی و راهنمایی صادقانه؛ نصوح: خالص و صمیمی.">وَنَصَحتُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُحِبّونَ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">تُحِبّونَ</button>
    <button class="word-link" type="button" data-word="النّٰصِحينَ" data-root="ن ص ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-h/" data-root-meaning="خیرخواهی و راهنمایی صادقانه؛ نصوح: خالص و صمیمی.">النّٰصِحينَ</button>
  </p>
  <p class="farsi-verse">پس از آنان روی گرداند و گفت: ای قوم من، پیام پروردگارم را به شما رساندم و برای شما خیرخواهی کردم، ولی شما خیرخواهان را دوست ندارید.</p>
</section>
