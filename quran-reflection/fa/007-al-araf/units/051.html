<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="گرفتند؛ دین خود را سرگرمی و بازی قرار دادند.">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="دينَهُم" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دینشان؛ آنچه به سرگرمی و بازی گرفتند.">دينَهُم</button>
    <button class="word-link" type="button" data-word="لَهوًا" data-root="ل ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h2-w/" data-root-meaning="سرگرمی بازدارنده از امر مهم؛ الهاء: مشغول و غافل کردن." data-context="سرگرمی؛ شیوه‌ای که دین خود را به آن گرفتند.">لَهوًا</button>
    <button class="word-link" type="button" data-word="وَلَعِبًا" data-root="ل ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-ayn-b/" data-root-meaning="بازی و کاری برای سرگرمی." data-context="و بازی؛ در کنار سرگرمی در وصف برخورد آنان با دین.">وَلَعِبًا</button>
    <button class="word-link" type="button" data-word="وَغَرَّتهُمُ" data-root="غ ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-r/" data-root-meaning="فریب و دل بستن به نمود گمراه‌کننده." data-context="و آنان را فریفت؛ اثر زندگی دنیا بر آنان.">وَغَرَّتهُمُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةُ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی؛ همراه «الدنیا»، زندگی این جهان که آنان را فریفت.">الحَيوٰةُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="دنیا؛ وصف زندگی نزدیک و این‌جهانی.">الدُّنيا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَاليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="پس امروز؛ روزی که با پیامد رفتار پیشین روبه‌رو می‌شوند.">فَاليَومَ</button>
    <button class="word-link" type="button" data-word="نَنسىٰهُم" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="آنان را فراموش می‌کنیم؛ در سیاق جزا، واگذاشتن آنان، نه ناآگاهی از وجودشان.">نَنسىٰهُم</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="نَسوا" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="فراموش کردند؛ دیدار این روز را در زندگی خود نادیده گرفتند.">نَسوا</button>
    <button class="word-link" type="button" data-word="لِقاءَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="دیدار؛ روبه‌رو شدن با این روز.">لِقاءَ</button>
    <button class="word-link" type="button" data-word="يَومِهِم" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزشان؛ همین روز رویارویی و جزا.">يَومِهِم</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ با فعل پس از خود، انکار مداوم در گذشته را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌های ما؛ آنچه در گذشته انکار می‌کردند.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="يَجحَدونَ" data-root="ج ح د" data-root-meaning="انکار و نپذیرفتن چیزی که موضوع اقرار و پذیرش است؛ در کاربرد برجسته آن، انکار با وجود شناخت حقیقت." data-context="انکار می‌کردند؛ نشانه‌های ما را در زندگی پیشین نمی‌پذیرفتند." data-learn-more="/quran-terminology/fa/roots/j-h-d/">يَجحَدونَ</button>
  </p>
  <p class="farsi-verse">همان کسانی که دین خود را سرگرمی و بازی گرفتند و زندگی دنیا فریبشان داد. پس امروز آنان را فراموش می‌کنیم، همان‌گونه که دیدار این روزشان را فراموش کردند و نشانه‌های ما را انکار می‌کردند.</p>
</section>
