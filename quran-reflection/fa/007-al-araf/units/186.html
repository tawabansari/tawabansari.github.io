<section class="ayah-block" id="ayah-186" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۸۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يُضلِلِ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">يُضلِلِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="هادِىَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هادِىَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَذَرُهُم" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَذَرُهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="طُغيٰنِهِم" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق">طُغيٰنِهِم</button>
    <button class="word-link" type="button" data-word="يَعمَهونَ" data-root="ع م ه" data-learn-more="/quran-terminology/fa/roots/ayn-m-h2/" data-root-meaning="سرگردان شدن، حیران ماندن، حرکت بی‌جهت، و نابینایی درونی نسبت به راه درست">يَعمَهونَ</button>
  </p>
  <p class="farsi-verse">هرکه را آن معبود یگانه گمراه کند، هیچ هدایتگری برای او نیست؛ و آنان را در سرکشی‌شان سرگردان وا می‌گذارد.</p>
</section>
