  <p class="farsi-verse">سپس به جای بدی، نیکی قرار دادیم تا فزونی یافتند و گفتند: رنج و آسایش به پدران ما نیز رسیده بود. پس ناگهان آنان را گرفتیم، در حالی که درنمی‌یافتند.</p>
