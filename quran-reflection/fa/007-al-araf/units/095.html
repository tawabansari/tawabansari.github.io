<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۹۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="بَدَّلنا" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">بَدَّلنا</button>
    <button class="word-link" type="button" data-word="مَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">مَكانَ</button>
    <button class="word-link" type="button" data-word="السَّيِّئَةِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّئَةِ</button>
    <button class="word-link" type="button" data-word="الحَسَنَةَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">الحَسَنَةَ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="عَفَوا" data-root="ع ف و" data-learn-more="/quran-terminology/fa/roots/ayn-f-w/" data-root-meaning="گذشتن از پیگیری خطا، برداشتن مؤاخذه، محوشدن اثر، و آنچه افزون بر نیاز باقی می‌ماند">عَفَوا</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالوا</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="مَسَّ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی">مَسَّ</button>
    <button class="word-link" type="button" data-word="ءاباءَنَا" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">ءاباءَنَا</button>
    <button class="word-link" type="button" data-word="الضَّرّاءُ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری">الضَّرّاءُ</button>
    <button class="word-link" type="button" data-word="وَالسَّرّاءُ" data-root="س ر ر" data-learn-more="/quran-terminology/fa/roots/s-r-r/" data-root-meaning="راز و نهان، شادی و آسایش، و جایگاه استقرار">وَالسَّرّاءُ</button>
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَأَخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="ب غ ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَغتَةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">سپس به جای بدی، نیکی قرار دادیم تا فزونی یافتند و گفتند: رنج و آسایش به پدران ما نیز رسیده بود. پس ناگهان آنان را گرفتیم، در حالی که درنمی‌یافتند.</p>
</section>
