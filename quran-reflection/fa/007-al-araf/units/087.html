  <p class="farsi-verse">و اگر گروهی از شما به آنچه با آن فرستاده شده‌ام ایمان آورده‌اند و گروهی ایمان نیاورده‌اند، پس شکیبایی کنید تا آن معبود یگانه میان ما داوری کند؛ و او بهترین داوران است.</p>
