  <p class="farsi-verse">و با موسی سی شب وعده گذاشتیم و آن را با ده شب کامل کردیم؛ پس زمان مقرر پروردگارش چهل شب شد. و موسی به برادرش هارون گفت: در میان قومم جانشین من باش و اصلاح کن و از راه فسادگران پیروی نکن.</p>
