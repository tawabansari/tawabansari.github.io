<section class="ayah-block" id="ayah-142" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوٰعَدنا" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَوٰعَدنا</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="ثَلٰثينَ" data-root="ث ل ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-l-th/" data-root-meaning="عدد سه و صورت‌های وابسته، مانند سه‌گانه و یک‌سوم.">ثَلٰثينَ</button>
    <button class="word-link" type="button" data-word="لَيلَةً" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه">لَيلَةً</button>
    <button class="word-link" type="button" data-word="وَأَتمَمنٰها" data-root="ت م م" data-learn-more="/quran-terminology/fa/roots/t-m-m/" data-root-meaning="رسیدن یا رساندن یک امر به حد مقرر، پس از کامل شدن مقدار، مدت، اجزا یا مراحل لازم">وَأَتمَمنٰها</button>
    <button class="word-link" type="button" data-word="بِعَشرٍ" data-root="ع ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-r/" data-root-meaning="ده و صورت‌های عددی وابسته؛ معاشرت: همراهی و زندگی با هم.">بِعَشرٍ</button>
    <button class="word-link" type="button" data-word="فَتَمَّ" data-root="ت م م" data-learn-more="/quran-terminology/fa/roots/t-m-m/" data-root-meaning="رسیدن یا رساندن یک امر به حد مقرر، پس از کامل شدن مقدار، مدت، اجزا یا مراحل لازم">فَتَمَّ</button>
    <button class="word-link" type="button" data-word="ميقٰتُ" data-root="و ق ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-t/" data-root-meaning="زمان معین و مقرر کردن هنگام؛ میقات: موعد.">ميقٰتُ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="أَربَعينَ" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی">أَربَعينَ</button>
    <button class="word-link" type="button" data-word="لَيلَةً" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه">لَيلَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="لِأَخيهِ" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر؛ در سیاق مناسب، هم‌قوم یا هم‌پیوند.">لِأَخيهِ</button>
    <button class="word-link" type="button" data-word="هٰرونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">هٰرونَ</button>
    <button class="word-link" type="button" data-word="اخلُفنى" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">اخلُفنى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قَومى" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومى</button>
    <button class="word-link" type="button" data-word="وَأَصلِح" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">وَأَصلِح</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَّبِع" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">تَتَّبِع</button>
    <button class="word-link" type="button" data-word="سَبيلَ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلَ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع">المُفسِدينَ</button>
  </p>
  <p class="farsi-verse">و با موسی سی شب وعده گذاشتیم و آن را با ده شب کامل کردیم؛ پس زمان مقرر پروردگارش چهل شب شد. و موسی به برادرش هارون گفت: در میان قومم جانشین من باش و اصلاح کن و از راه فسادگران پیروی نکن.</p>
</section>
