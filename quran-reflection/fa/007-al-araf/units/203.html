  </p>
  <p class="farsi-verse">و هنگامی که نشانه‌ای برایشان نیاوری، می‌گویند: چرا خود آن را برنگزیدی؟ بگو: تنها از آنچه از پروردگارم به من وحی می‌شود پیروی می‌کنم. این بینش‌هایی از پروردگارتان و هدایت و رحمتی برای گروهی است که ایمان می‌آورند.</p>
</section>
