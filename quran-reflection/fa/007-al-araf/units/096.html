<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="أَهلَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلَ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَاتَّقَوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَاتَّقَوا</button>
    <button class="word-link" type="button" data-word="لَفَتَحنا" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده">لَفَتَحنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بَرَكٰتٍ" data-root="ب ر ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَرَكٰتٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَأَخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان">يَكسِبونَ</button>
  </p>
  <p class="farsi-verse">و اگر مردم آبادی‌ها ایمان می‌آوردند و پروا می‌کردند، برکت‌هایی از آسمان و زمین بر آنان می‌گشودیم؛ ولی دروغ شمردند، پس آنان را به سبب آنچه به دست می‌آوردند گرفتیم.</p>
</section>
