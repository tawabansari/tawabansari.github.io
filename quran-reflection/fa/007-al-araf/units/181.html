<section class="ayah-block" id="ayah-181" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۸۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمَّن</button>
    <button class="word-link" type="button" data-word="خَلَقنا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنا</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="يَهدونَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">يَهدونَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَبِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَبِهِ</button>
    <button class="word-link" type="button" data-word="يَعدِلونَ" data-root="ع د ل" data-learn-more="/quran-terminology/fa/roots/ayn-d-l/">يَعدِلونَ</button>
  </p>
  <p class="farsi-verse">و از میان کسانی که آفریده‌ایم، جماعتی هستند که به حق هدایت می‌کنند و با آن داد می‌ورزند.</p>
