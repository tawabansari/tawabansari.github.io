  <p class="farsi-verse">ای فرزندان آدم، شیطان شما را نفریبد، همان‌گونه که پدر و مادرتان را از باغ بیرون کرد و پوشششان را از آنان برمی‌کند تا شرمگاه‌هایشان را به آنان نشان دهد. او و گروهش شما را از جایی می‌بینند که شما آنان را نمی‌بینید. ما شیطان‌ها را سرپرستان کسانی قرار داده‌ایم که ایمان نمی‌آورند.</p>
