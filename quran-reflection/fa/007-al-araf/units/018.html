<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغازِ فرمان به ابلیس.">قالَ</button>
    <button class="word-link" type="button" data-word="اخرُج" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون رو؛ فرمانِ خروج به ابلیس.">اخرُج</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="مَذءومًا" data-root="ذ أ م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-a-m/" data-root-meaning="نکوهش کردن و سرزنش شدن." data-context="نکوهیده؛ وصفِ همراهِ رانده شدن ابلیس.">مَذءومًا</button>
    <button class="word-link" type="button" data-word="مَدحورًا" data-root="د ح ر" data-learn-more="/quran-terminology/fa/roots/d-h-r/" data-root-meaning="راندن، پس زدن و دور ساختن از یک جایگاه، محدوده یا دسترسی." data-context="رانده‌شده؛ حالتِ ابلیس هنگامِ فرمانِ خروج.">مَدحورًا</button>
    ۖ
    <button class="word-link" type="button" data-word="لَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمَن</button>
    <button class="word-link" type="button" data-word="تَبِعَكَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="از تو پیروی کند؛ دربارهٔ پیروان ابلیس.">تَبِعَكَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="لَأَملَأَنَّ" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه." data-context="حتماً پر خواهم کرد؛ دربارهٔ جهنم.">لَأَملَأَنَّ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="أَجمَعينَ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="همگی؛ تأکید بر شمولِ گروهِ مورد خطاب.">أَجمَعينَ</button>
  </p>
  <p class="farsi-verse">گفت: نکوهیده و رانده از آن بیرون رو. هرکس از آنان از تو پیروی کند، حتما جهنم را از همه شما پر می‌کنم.</p>
</section>
