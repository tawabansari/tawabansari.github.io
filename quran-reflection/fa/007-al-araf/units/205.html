<section class="ayah-block" id="ayah-205" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۲۰۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَاذكُر</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="نَفسِكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسِكَ</button>
    <button class="word-link" type="button" data-word="تَضَرُّعًا" data-root="ض ر ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَضَرُّعًا</button>
    <button class="word-link" type="button" data-word="وَخيفَةً" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">وَخيفَةً</button>
    <button class="word-link" type="button" data-word="وَدونَ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">وَدونَ</button>
    <button class="word-link" type="button" data-word="الجَهرِ" data-root="ج ه ر" data-learn-more="/quran-terminology/fa/roots/j-h2-r/" data-root-meaning="آشکار و علنی بودن یا ساختن؛ و در گفتار، بلند کردن صدا به‌گونه‌ای که از حالت آهسته و پنهان بیرون آید.">الجَهرِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَولِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">القَولِ</button>
    <button class="word-link" type="button" data-word="بِالغُدُوِّ" data-root="غ د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِالغُدُوِّ</button>
    <button class="word-link" type="button" data-word="وَالـٔاصالِ" data-root="أ ص ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالـٔاصالِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكُن</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغٰفِلينَ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری">الغٰفِلينَ</button>
  </p>
  <p class="farsi-verse">و پروردگارت را در درون خود، با زاری و بیم و بی‌بلندکردن صدا، بامدادان و شامگاهان یاد کن و از غافلان مباش.</p>
</section>
