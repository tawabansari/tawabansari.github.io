<section class="ayah-block" id="ayah-152" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذُوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذُوا</button>
    <button class="word-link" type="button" data-word="العِجلَ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">العِجلَ</button>
    <button class="word-link" type="button" data-word="سَيَنالُهُم" data-root="ن ي ل" data-learn-more="/quran-terminology/fa/roots/n-y-l/" data-root-meaning="از رسیدن و دست یافتن تا چیزی که اثرش به دیگری می‌رسد">سَيَنالُهُم</button>
    <button class="word-link" type="button" data-word="غَضَبٌ" data-root="غ ض ب" data-learn-more="/quran-terminology/fa/roots/gh-dad-b/" data-root-meaning="شدت ناخشنودی و واکنش در برابر امر ناپذیرفتنی">غَضَبٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَذِلَّةٌ" data-root="ذ ل ل" data-learn-more="/quran-terminology/fa/roots/dh-l-l/" data-root-meaning="رام‌شدن، دسترس‌پذیری، فروتنی و فرو افتادن از عزت">وَذِلَّةٌ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَجزِى" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">نَجزِى</button>
    <button class="word-link" type="button" data-word="المُفتَرينَ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا.">المُفتَرينَ</button>
  </p>
  <p class="farsi-verse">کسانی که گوساله را گرفتند، خشمی از پروردگارشان و خواری‌ای در زندگی دنیا به آنان خواهد رسید؛ و این‌گونه دروغ‌پردازان را جزا می‌دهیم.</p>
</section>
