<section class="ayah-block" id="ayah-202" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۲۰۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِخوٰنُهُم" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادران، دوستان نزدیک یا همراهان در یک پیوند.">وَإِخوٰنُهُم</button>
    <button class="word-link" type="button" data-word="يَمُدّونَهُم" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر">يَمُدّونَهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الغَىِّ" data-root="غ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-y/" data-root-meaning="گمراهی و منحرف ساختن از راه درست.">الغَىِّ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُقصِرونَ" data-root="ق ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-r/" data-root-meaning="کوتاه کردن و محدود ساختن؛ قصر: بنای بزرگ یا کاخ.">يُقصِرونَ</button>
  </p>
  <p class="farsi-verse">و برادرانشان آنان را در گمراهی پیش می‌برند، سپس کوتاه نمی‌آیند.</p>
</section>
