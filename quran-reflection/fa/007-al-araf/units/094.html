<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادیم؛ دربارهٔ فرستادن پیامبر">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قَريَةٍ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی و محل سکونت مردم">قَريَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَبِىٍّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="پیامبری که به آبادی فرستاده شد">نَبِىٍّ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَخَذنا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="گرفتیم و گرفتار کردیم؛ دربارهٔ اهل آبادی">أَخَذنا</button>
    <button class="word-link" type="button" data-word="أَهلَها" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="مردم و ساکنان آن آبادی">أَهلَها</button>
    <button class="word-link" type="button" data-word="بِالبَأساءِ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="به سختی و تنگنای زندگی">بِالبَأساءِ</button>
    <button class="word-link" type="button" data-word="وَالضَّرّاءِ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="و رنج و آسیب؛ در کنار سختیِ یادشده">وَالضَّرّاءِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَضَّرَّعونَ" data-root="ض ر ع" data-learn-more="/quran-terminology/fa/roots/dad-r-ayn/" data-root-meaning="نرمی، فروتنی و اظهار نیاز؛ در کاربرد انسانی، زاری و روی آوردنِ فروتنانه. در کاربردهای دیگر، پستان شیرده دام، همانندی، و نام گیاهی ناخوشایند به نام ضریع." data-context="زاری کنند؛ با فروتنی و نیاز به پروردگار روی آورند">يَضَّرَّعونَ</button>
  </p>
  <p class="farsi-verse">و هیچ پیامبری را در آبادی‌ای نفرستادیم مگر اینکه مردمش را به سختی و رنج گرفتیم، باشد که زاری کنند.</p>
</section>
