  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="فَعَلوا" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="انجام دادند؛ کار بسیار زشت">فَعَلوا</button>
    <button class="word-link" type="button" data-word="فٰحِشَةً" data-root="ف ح ش" data-root-meaning="زشتی و ناپسندی شدید؛ فراتر رفتن رفتار یا سخن از حد پسندیده و قابل قبول." data-context="کاری بسیار زشت؛ رفتاری که انجام‌دهندگان آن به پیشینیان و فرمان الهی نسبت می‌دهند." data-learn-more="/quran-terminology/fa/roots/f-h-sh/">فٰحِشَةً</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند">قالوا</button>

    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="ءاباءَنا" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان" data-context="پدرانمان">ءاباءَنا</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَمَرَنا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="به ما فرمان داده است؛ در ادعای نقل‌شده">أَمَرَنا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان پاسخ">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَأمُرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان نمی‌دهد؛ در ساخت نفی">يَأمُرُ</button>
    <button class="word-link" type="button" data-word="بِالفَحشاءِ" data-root="ف ح ش" data-root-meaning="زشتی و ناپسندی شدید؛ فراتر رفتن رفتار یا سخن از حد پسندیده و قابل قبول." data-context="فحشا؛ زشتی شدیدی که آن معبود یگانه به آن فرمان نمی‌دهد." data-learn-more="/quran-terminology/fa/roots/f-h-sh/">بِالفَحشاءِ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَتَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="آیا می‌گویید؛ پرسش نکوهشی">أَتَقولونَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>

    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="نمی‌دانید؛ در ساخت نفی">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که کار زشتی کنند، می‌گویند: پدرانمان را بر آن یافتیم و آن معبود یگانه ما را به آن فرمان داده است. بگو: آن معبود یگانه به زشتی فرمان نمی‌دهد. آیا درباره آن معبود یگانه چیزی می‌گویید که نمی‌دانید؟</p>
</section>
