  <p class="farsi-verse">آیا پاهایی دارند که با آن‌ها راه بروند، یا دست‌هایی دارند که با آن‌ها بگیرند، یا دیدگانی دارند که با آن‌ها ببینند، یا گوش‌هایی دارند که با آن‌ها بشنوند؟ بگو: شریکانتان را بخوانید، سپس علیه من تدبیر کنید و مهلتم ندهید.</p>
</section>
