<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ادعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">ادعوا</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكُم</button>
    <button class="word-link" type="button" data-word="تَضَرُّعًا" data-root="ض ر ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَضَرُّعًا</button>
    <button class="word-link" type="button" data-word="وَخُفيَةً" data-root="خ ف ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَخُفيَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُعتَدينَ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">المُعتَدينَ</button>
  </p>
  <p class="farsi-verse">پروردگارتان را با زاری و پنهانی بخوانید؛ بی‌گمان او تجاوزگران را دوست ندارد.</p>
</section>
