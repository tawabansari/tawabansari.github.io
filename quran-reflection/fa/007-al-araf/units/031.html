<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰبَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">يٰبَنى</button>
    <button class="word-link" type="button" data-word="ءادَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">ءادَمَ</button>
    <button class="word-link" type="button" data-word="خُذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">خُذوا</button>
    <button class="word-link" type="button" data-word="زينَتَكُم" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن.">زينَتَكُم</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="مَسجِدٍ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">مَسجِدٍ</button>
    <button class="word-link" type="button" data-word="وَكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">وَكُلوا</button>
    <button class="word-link" type="button" data-word="وَاشرَبوا" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن.">وَاشرَبوا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُسرِفوا" data-root="س ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-f/" data-root-meaning="از اندازه یا حد گذشتن؛ اسراف.">تُسرِفوا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُسرِفينَ" data-root="س ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-f/" data-root-meaning="از اندازه یا حد گذشتن؛ اسراف.">المُسرِفينَ</button>
  </p>
  <p class="farsi-verse">ای فرزندان آدم، آراستگی خود را نزد هر سجده‌گاه برگیرید؛ و بخورید و بنوشید و زیاده‌روی نکنید، که او زیاده‌روان را دوست ندارد.</p>
</section>
