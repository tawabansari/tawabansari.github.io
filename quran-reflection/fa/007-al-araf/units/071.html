  </p>
  <p class="farsi-verse">گفت: از پروردگارتان پلیدی و خشمی بر شما واقع شده است. آیا با من درباره نام‌هایی جدال می‌کنید که شما و پدرانتان نامیده‌اید و آن معبود یگانه هیچ دلیلی درباره آن‌ها فرو نفرستاده است؟ پس منتظر باشید؛ من نیز با شما از منتظرانم.</p>
