<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="وَقَعَ" data-root="و ق ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-ayn/" data-root-meaning="افتادن، رخ دادن و تحقق یافتن.">وَقَعَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="رِجسٌ" data-root="ر ج س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-s/" data-root-meaning="پلیدی و آلودگی مادی یا معنوی، بر حسب سیاق.">رِجسٌ</button>
    <button class="word-link" type="button" data-word="وَغَضَبٌ" data-root="غ ض ب" data-learn-more="/quran-terminology/fa/roots/gh-dad-b/" data-root-meaning="شدت ناخشنودی و واکنش در برابر امر ناپذیرفتنی">وَغَضَبٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَتُجٰدِلونَنى" data-root="ج د ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-l/" data-root-meaning="محکم تابیدن و استوار ساختن؛ جدال: رویارویی و کشاکش گفتاری یا استدلالی.">أَتُجٰدِلونَنى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَسماءٍ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">أَسماءٍ</button>
    <button class="word-link" type="button" data-word="سَمَّيتُموها" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">سَمَّيتُموها</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="وَءاباؤُكُم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">وَءاباؤُكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="نَزَّلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">نَزَّلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سُلطٰنٍ" data-root="س ل ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-tt/" data-root-meaning="توان چیرگی؛ سلطان: قدرت، اختیار یا دلیل نافذ، بنا بر سیاق.">سُلطٰنٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَانتَظِروا" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">فَانتَظِروا</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُنتَظِرينَ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">المُنتَظِرينَ</button>
  </p>
  <p class="farsi-verse">گفت: از پروردگارتان پلیدی و خشمی بر شما واقع شده است. آیا با من درباره نام‌هایی جدال می‌کنید که شما و پدرانتان نامیده‌اید و آن معبود یگانه هیچ دلیلی درباره آن‌ها فرو نفرستاده است؟ پس منتظر باشید؛ من نیز با شما از منتظرانم.</p>
</section>
