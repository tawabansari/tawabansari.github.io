  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="فَاهبِط" data-root="ه ب ط" data-learn-more="/quran-terminology/fa/roots/h2-b-tt/" data-root-meaning="فرود آمدن، پایین آمدن، و انتقال به بستری پایین‌تر، زمینی‌تر، یا محدودتر.">فَاهبِط</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>

    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>

  <p class="farsi-verse">گفت: پس از آن فرود آی؛ تو را نرسد که در آن بزرگی بفروشی. پس بیرون رو، که تو از خوارشدگانی.</p>
