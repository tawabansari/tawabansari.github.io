<section class="ayah-block" id="ayah-113" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجاءَ</button>
    <button class="word-link" type="button" data-word="السَّحَرَةُ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر">السَّحَرَةُ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="لَأَجرًا" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">لَأَجرًا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنّا</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="الغٰلِبينَ" data-root="غ ل ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-b/" data-root-meaning="چیره شدن و غلبه یافتن.">الغٰلِبينَ</button>
  </p>
  <p class="farsi-verse">و جادوگران نزد فرعون آمدند؛ گفتند: اگر ما چیره شویم، حتما پاداشی برای ما هست.</p>
</section>
