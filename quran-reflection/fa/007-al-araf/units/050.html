  <p class="farsi-verse">و اهل آتش اهل باغ را ندا می‌دهند: از آب یا از آنچه آن معبود یگانه روزی‌تان کرده بر ما بریزید. می‌گویند: آن معبود یگانه آن دو را بر کافران حرام کرده است.</p>
