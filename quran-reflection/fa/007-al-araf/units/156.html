    <button class="word-link" type="button" data-word="وَسِعَت" data-root="و س ع" data-learn-more="/quran-terminology/fa/roots/w-s-ayn/" data-root-meaning="از فراخی مکان تا گنجایش، توان و فراگیری">وَسِعَت</button>

  <p class="farsi-verse">و برای ما در این دنیا و در آخرت نیکی مقرر کن؛ ما به سوی تو بازگشته‌ایم. گفت: عذابم را به هرکه بخواهم می‌رسانم و رحمتم همه چیز را فرا گرفته است؛ پس آن را برای کسانی مقرر می‌کنم که پروا دارند و زکات می‌دهند و به نشانه‌های ما ایمان می‌آورند.</p>
</section>
