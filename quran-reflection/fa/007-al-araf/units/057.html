<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُرسِلُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">يُرسِلُ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="ر و ح" data-root-meaning="باد، نفس، گشایش و روح" data-learn-more="/quran-terminology/fa/roots/r-w-h/">الرِّيٰحَ</button>
    <button class="word-link" type="button" data-word="بُشرًا" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">بُشرًا</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَ</button>
    <button class="word-link" type="button" data-word="يَدَى" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">يَدَى</button>
    <button class="word-link" type="button" data-word="رَحمَتِهِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحمَتِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="أَقَلَّت" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">أَقَلَّت</button>
    <button class="word-link" type="button" data-word="سَحابًا" data-root="س ح ب" data-root-meaning="کشیدن، امتداد یافتن و ابر؛ از کشیده شدن چیزی بر زمین تا حرکت ابرها در آسمان و کشانده شدن انسان در صحنه عذاب" data-learn-more="/quran-terminology/fa/roots/s-h-b/">سَحابًا</button>
    <button class="word-link" type="button" data-word="ثِقالًا" data-root="ث ق ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ثِقالًا</button>
    <button class="word-link" type="button" data-word="سُقنٰهُ" data-root="س و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سُقنٰهُ</button>
    <button class="word-link" type="button" data-word="لِبَلَدٍ" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»">لِبَلَدٍ</button>
    <button class="word-link" type="button" data-word="مَيِّتٍ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مَيِّتٍ</button>
    <button class="word-link" type="button" data-word="فَأَنزَلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">فَأَنزَلنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="الماءَ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">الماءَ</button>
    <button class="word-link" type="button" data-word="فَأَخرَجنا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">فَأَخرَجنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="ث م ر" data-learn-more="/quran-terminology/fa/roots/th-m-r/" data-root-meaning="بار درخت، میوه و گسترش معنا به حاصل و دارایی">الثَّمَرٰتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نُخرِجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">نُخرِجُ</button>
    <button class="word-link" type="button" data-word="المَوتىٰ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">المَوتىٰ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَذَكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">تَذَكَّرونَ</button>
  </p>
  <p class="farsi-verse">و اوست که بادها را مژده‌دهنده پیشاپیش رحمتش می‌فرستد؛ تا وقتی ابرهای سنگین را بردارند، آن را به سوی سرزمینی مرده می‌رانیم و با آن آب فرو می‌فرستیم، سپس با آن از هر میوه‌ای بیرون می‌آوریم. این‌گونه مردگان را بیرون می‌آوریم، باشد که یادآور شوید.</p>
</section>
