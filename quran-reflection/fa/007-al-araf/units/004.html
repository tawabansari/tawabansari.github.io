<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَريَةٍ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی‌ای از آبادی‌های پیشین.">قَريَةٍ</button>
    <button class="word-link" type="button" data-word="أَهلَكنٰها" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="آبادی‌های بسیاری را نابود ساختیم." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">أَهلَكنٰها</button>
    <button class="word-link" type="button" data-word="فَجاءَها" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="پس به آن رسید.">فَجاءَها</button>
    <button class="word-link" type="button" data-word="بَأسُنا" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="شدتِ عذاب و بأسِ ما.">بَأسُنا</button>
    <button class="word-link" type="button" data-word="بَيٰتًا" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="شب‌هنگام." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بَيٰتًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="قائِلونَ" data-root="ق ي ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-y-l/" data-root-meaning="آسودن در نیمروز؛ مقیل: جای استراحت نیمروز." data-context="در استراحتِ نیمروز.">قائِلونَ</button>
  </p>
  <p class="farsi-verse">و چه بسیار آبادی‌هایی را نابود کردیم؛ پس سختی ما شبانه یا هنگامی که در نیمروز آسوده بودند به آنان رسید.</p>
</section>
