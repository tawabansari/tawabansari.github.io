<section class="ayah-block" id="ayah-189" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۸۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="شما را آفرید؛ پدیدآوردن انسان‌ها.">خَلَقَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="نفسی؛ یک خود یا وجود انسانی.">نَفسٍ</button>
    <button class="word-link" type="button" data-word="وٰحِدَةٍ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یگانه و یکی؛ وصف نفس.">وٰحِدَةٍ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار داد؛ جفت را از آن پدید آورد.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="زَوجَها" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="جفتش؛ همسرِ آن نفس.">زَوجَها</button>
    <button class="word-link" type="button" data-word="لِيَسكُنَ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="تا آرام گیرد؛ نزد جفتش سکون و آرامش بیابد.">لِيَسكُنَ</button>
    <button class="word-link" type="button" data-word="إِلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="تَغَشّىٰها" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش" data-context="با او درآمیخت؛ در این سیاق پیوند زناشویی.">تَغَشّىٰها</button>
    <button class="word-link" type="button" data-word="حَمَلَت" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری." data-context="بار برداشت؛ باردار شد.">حَمَلَت</button>
    <button class="word-link" type="button" data-word="حَملًا" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری." data-context="باری؛ حمل بارداری.">حَملًا</button>
    <button class="word-link" type="button" data-word="خَفيفًا" data-root="خ ف ف" data-learn-more="/quran-terminology/fa/roots/kh-f-f/" data-root-meaning="از سبکی و کاهش بار تا از دست رفتن ثبات" data-context="سبک؛ وصف بار در آغاز بارداری.">خَفيفًا</button>
    <button class="word-link" type="button" data-word="فَمَرَّت" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="پس با آن ادامه داد؛ دوران حمل سبک را گذراند.">فَمَرَّت</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَثقَلَت" data-root="ث ق ل" data-root-meaning="سنگینی، وزن، بار و اهمیت؛ از بارهای مادی تا سنجش کردار انسان" data-context="سنگین‌بار شد؛ بار بارداری محسوس و سنگین شد." data-learn-more="/quran-terminology/fa/roots/th-q-l/">أَثقَلَت</button>
    <button class="word-link" type="button" data-word="دَعَوَا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="آن دو خواندند؛ رو به پروردگار دعا کردند.">دَعَوَا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="رَبَّهُما" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ آنکه هر دو به او روی می‌آورند.">رَبَّهُما</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="ءاتَيتَنا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به ما عطا کنی؛ درخواست بخشیدن فرزند.">ءاتَيتَنا</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته و سالم؛ وصف فرزندِ درخواست‌شده در این سیاق.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="لَنَكونَنَّ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بی‌گمان خواهیم بود؛ تأکید بر وعدهٔ سپاسگزاری.">لَنَكونَنَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشّٰكِرينَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل" data-context="سپاسگزاران؛ قدردانِ بخشش پروردگار.">الشّٰكِرينَ</button>
  </p>
  <p class="farsi-verse">اوست که شما را از یک نفس آفرید و از آن همسرش را قرار داد تا نزد او آرام گیرد. پس چون او را پوشاند، باری سبک برداشت و با آن گذراند؛ و چون سنگین شد، آن دو آن معبود یگانه، پروردگارشان را خواندند: اگر به ما شایسته‌ای بدهی، حتما از سپاسگزاران خواهیم بود.</p>
</section>
