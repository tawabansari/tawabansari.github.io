<section class="ayah-block" id="ayah-136" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانتَقَمنا" data-root="ن ق م" data-learn-more="/quran-terminology/fa/roots/n-q-m/" data-root-meaning="ناخشنودی، ناپسند دانستن و عیب گرفتن؛ در شاخه انتقام، پاسخ دادن با کیفر به رفتار ناپسند دانسته‌شده." data-context="پس کیفر دادیم؛ پاسخ الهی که در ادامه آیه با غرق کردن تحقق می‌یابد.">فَانتَقَمنا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="فَأَغرَقنٰهُم" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب" data-context="پس غرقشان کردیم؛ شیوه تحقق کیفر در این واقعه.">فَأَغرَقنٰهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="ي م م" data-learn-more="/quran-terminology/fa/roots/y-m-m/" data-root-meaning="دو شاخهٔ معنایی: قصد کردن، هدف قرار دادن و روی‌آوردن؛ و یَمّ، پهنهٔ بزرگ آب مانند دریا یا رود بزرگ. تیمم در آیات طهارت با دستور جداگانهٔ مسح همراه است." data-context="دریا؛ محل غرق شدن گروه یادشده.">اليَمِّ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="تکذیب کردند؛ درباره واکنش آنان به آیات.">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات ما؛ موضوع تکذیب گروه یادشده.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در بیان غفلت مستمر آنان از آیات.">وَكانوا</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنها</button>
    <button class="word-link" type="button" data-word="غٰفِلينَ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری" data-context="غافل؛ نسبت به آیات یادشده.">غٰفِلينَ</button>
  </p>
  <p class="farsi-verse">پس از آنان کیفر گرفتیم و در دریا غرقشان کردیم، زیرا نشانه‌های ما را دروغ شمردند و از آن‌ها غافل بودند.</p>
</section>
