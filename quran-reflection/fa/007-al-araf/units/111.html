<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="أَرجِه" data-root="ر ج أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-a/" data-root-meaning="به تأخیر انداختن و مهلت دادن؛ در برخی صورت‌ها همزه تلفظ نمی‌شود.">أَرجِه</button>
    <button class="word-link" type="button" data-word="وَأَخاهُ" data-root="أ خ و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر و خواهر؛ و به گسترش معنا، پیوند خویشاوندی، همراهی یا تعلق مشترک.">وَأَخاهُ</button>
    <button class="word-link" type="button" data-word="وَأَرسِل" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَأَرسِل</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="المَدائِنِ" data-root="م د ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-d-n/" data-root-meaning="مدینه: شهر و آبادی؛ تحلیل آن از «مدن» یا «دین» اختلافی است.">المَدائِنِ</button>
    <button class="word-link" type="button" data-word="حٰشِرينَ" data-root="ح ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sh-r/" data-root-meaning="گرد آوردن و از جایگاه‌ها به سوی یک محل راندن.">حٰشِرينَ</button>
  </p>
  <p class="farsi-verse">گفتند: او و برادرش را مهلت بده و گردآورندگانی به شهرها بفرست.</p>
