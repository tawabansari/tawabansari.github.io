<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو">قُل</button>
    <button class="word-link" type="button" data-word="أَمَرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان داده است">أَمَرَ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من">رَبّى</button>
    <button class="word-link" type="button" data-word="بِالقِسطِ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است." data-context="به عدالت و رعایت حق">بِالقِسطِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَقيموا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="و برپا و استوار دارید">وَأَقيموا</button>
    <button class="word-link" type="button" data-word="وُجوهَكُم" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌ها و جهتِ روی‌آوردنِ شما">وُجوهَكُم</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ همهٔ موارد را دربرمی‌گیرد">كُلِّ</button>
    <button class="word-link" type="button" data-word="مَسجِدٍ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="جای سجده و عبادت">مَسجِدٍ</button>
    <button class="word-link" type="button" data-word="وَادعوهُ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="و او را بخوانید">وَادعوهُ</button>
    <button class="word-link" type="button" data-word="مُخلِصينَ" data-root="خ ل ص" data-learn-more="/quran-terminology/fa/roots/kh-l-sad/" data-root-meaning="جدا شدن از آمیختگی؛ از خلوص تا اختصاص" data-context="خالص‌کنندگان؛ بدون آمیختن بندگی با غیر او">مُخلِصينَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="الدّينَ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دین؛ بندگی و جهت‌گیریِ الزام‌آور">الدّينَ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="بَدَأَكُم" data-root="ب د أ" data-root-meaning="آغاز کردن، نخستین بار انجام دادن و شروع یک کار یا جریان؛ در سیاق آفرینش، نخستین بار پدید آوردن." data-learn-more="/quran-terminology/fa/roots/b-d-a/" data-context="شما را نخستین بار پدید آورد">بَدَأَكُم</button>
    <button class="word-link" type="button" data-word="تَعودونَ" data-root="ع و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-d/" data-root-meaning="بازگشت و تکرار؛ عید: هنگام بازآینده؛ «عاد» نام قوم نیز هست." data-context="بازمی‌گردید">تَعودونَ</button>
  </p>
  <p class="farsi-verse">بگو: پروردگارم به داد فرمان داده است؛ و در هر سجده‌گاه روی‌های خود را استوار کنید و او را بخوانید، در حالی که دین را برای او خالص می‌کنید. همان‌گونه که شما را آغاز کرد، بازمی‌گردید.</p>
</section>
