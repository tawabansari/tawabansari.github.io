<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَعَقَرُوا" data-root="ع ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-q-r/" data-root-meaning="پی کردن و از پا درآوردن؛ عاقر: نازا، در شاخه‌ای دیگر.">فَعَقَرُوا</button>
    <button class="word-link" type="button" data-word="النّاقَةَ" data-root="ن و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-w-q/" data-root-meaning="شتر ماده.">النّاقَةَ</button>
    <button class="word-link" type="button" data-word="وَعَتَوا" data-root="ع ت و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-w/" data-root-meaning="سرکشی و از حد گذشتن؛ نیز فرسودگی شدید پیری.">وَعَتَوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالوا</button>
    <button class="word-link" type="button" data-word="يٰصٰلِحُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰصٰلِحُ</button>
    <button class="word-link" type="button" data-word="ائتِنا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ائتِنا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعِدُنا" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">تَعِدُنا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">المُرسَلينَ</button>
  </p>
  <p class="farsi-verse">پس ماده‌شتر را پی کردند و از فرمان پروردگارشان سرکشی کردند و گفتند: ای صالح، اگر از رسولانی، آنچه به ما وعده می‌دهی بیاور.</p>
</section>
