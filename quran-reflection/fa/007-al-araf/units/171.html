<section class="ayah-block" id="ayah-171" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="نَتَقنَا" data-root="ن ت ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-t-q/" data-root-meaning="کندن، برکشیدن و تکان دادن." data-context="برکندیم و بالا بردیم؛ کارِ بیان‌شده دربارهٔ کوه بر فراز آنان.">نَتَقنَا</button>
    <button class="word-link" type="button" data-word="الجَبَلَ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه؛ کوهی که بر فراز گروهی از بنی‌اسرائیل قرار داده شد." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجَبَلَ</button>
    <button class="word-link" type="button" data-word="فَوقَهُم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بر فرازشان؛ جایگاه کوه نسبت به آنان.">فَوقَهُم</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="ظُلَّةٌ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="سایبان؛ تشبیهی برای کوهِ بالای سرشان.">ظُلَّةٌ</button>
    <button class="word-link" type="button" data-word="وَظَنّوا" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد" data-context="و پنداشتند؛ تصور آنان از افتادن کوه بر سرشان.">وَظَنّوا</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="واقِعٌ" data-root="و ق ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-ayn/" data-root-meaning="افتادن، رخ دادن و تحقق یافتن." data-context="فروافتنده؛ چیزی که گمان داشتند بر آنان می‌افتد.">واقِعٌ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="خُذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="بگیرید؛ فرمان پذیرفتن آنچه به آنان داده شده است.">خُذوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="ءاتَينٰكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به شما دادیم؛ آنچه باید با نیرو بگیرند.">ءاتَينٰكُم</button>
    <button class="word-link" type="button" data-word="بِقُوَّةٍ" data-root="ق و ي" data-learn-more="/quran-terminology/fa/roots/q-w-y/" data-root-meaning="نیرو، توان، قدرت و استحکام؛ توان انجام، تحمل، مقاومت یا اثرگذاری" data-context="با نیرو و جدیت؛ کیفیتِ گرفتنِ دادهٔ الهی.">بِقُوَّةٍ</button>
    <button class="word-link" type="button" data-word="وَاذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="و یاد کنید؛ فرمان توجه به محتوای آن.">وَاذكُروا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَتَّقونَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پروا کنید؛ هدفِ یادآوری و گرفتن با جدیت.">تَتَّقونَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که کوه را بالای آنان برکندیم، گویی سایبانی بود، و گمان کردند بر آنان خواهد افتاد: آنچه به شما داده‌ایم با قوت بگیرید و آنچه در آن است به یاد آورید، باشد که پروا کنید.</p>
</section>
