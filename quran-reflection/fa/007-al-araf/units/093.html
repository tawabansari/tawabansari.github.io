<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۹۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَوَلّىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="پس روی گرداند؛ شعیب از قوم فاصله گرفت.">فَتَوَلّىٰ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ آغاز گفتار شعیب دربارهٔ رساندن پیام و خیرخواهی.">وَقالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ای قوم من؛ خطاب شعیب به مردم خود.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="أَبلَغتُكُم" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="به شما رساندم؛ گزارش رساندن پیام‌های پروردگار.">أَبلَغتُكُم</button>
    <button class="word-link" type="button" data-word="رِسٰلٰتِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="پیام‌ها؛ آنچه شعیب به مردم رسانده بود.">رِسٰلٰتِ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارم؛ مبدأ پیام‌های رسانده‌شده.">رَبّى</button>
    <button class="word-link" type="button" data-word="وَنَصَحتُ" data-root="ن ص ح" data-learn-more="/quran-terminology/fa/roots/n-sad-h/" data-root-meaning="خلوص و خیرخواهیِ دور از غش و فریب؛ در شاخه‌ای دیگر، دوختن و پیوند دادن؛ نصوح در وصف توبه، خالص و راستین است." data-context="خیرخواه شما بودم؛ گزارش شعیب از خیرخواهی پیشین خود برای قوم.">وَنَصَحتُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="ءاسىٰ" data-root="أ س ي" data-learn-more="/quran-terminology/fa/roots/a-s-w/" data-root-meaning="متاثر شدن از فقدان، ناکامی یا رفتار اشخاص؛ شاخه‌ای که نسبت اشتقاقی آن با «أ س و» در طبقه‌بندی‌های لغوی یکسان نیست." data-context="اندوه بخورم؛ در پرسش «چگونه ...»، اندوه خوردن بر قومِ مورد وصف.">ءاسىٰ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="مردم و قوم؛ گروهی که شعیب دربارهٔ آنان سخن می‌گوید.">قَومٍ</button>
    <button class="word-link" type="button" data-word="كٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفرورزندگان؛ وصفِ قومی که پیام را نپذیرفتند.">كٰفِرينَ</button>
  </p>
  <p class="farsi-verse">پس از آنان روی گرداند و گفت: ای قوم من، پیام‌های پروردگارم را به شما رساندم و برای شما خیرخواهی کردم؛ پس چگونه بر گروهی کافر اندوه بخورم؟</p>
</section>
