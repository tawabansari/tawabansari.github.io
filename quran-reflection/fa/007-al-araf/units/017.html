<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَـٔاتِيَنَّهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">لَـٔاتِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينِ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="خَلفِهِم" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">خَلفِهِم</button>
    <button class="word-link" type="button" data-word="وَعَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَن</button>
    <button class="word-link" type="button" data-word="أَيمٰنِهِم" data-root="ي م ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَيمٰنِهِم</button>
    <button class="word-link" type="button" data-word="وَعَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَن</button>
    <button class="word-link" type="button" data-word="شَمائِلِهِم" data-root="ش م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">شَمائِلِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَجِدُ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">تَجِدُ</button>
    <button class="word-link" type="button" data-word="أَكثَرَهُم" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">أَكثَرَهُم</button>
    <button class="word-link" type="button" data-word="شٰكِرينَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">شٰكِرينَ</button>
  </p>
  <p class="farsi-verse">سپس از پیش رویشان و از پشت سرشان و از راستشان و از چپشان به آنان می‌آیم؛ و بیشترشان را سپاسگزار نخواهی یافت.</p>
</section>
