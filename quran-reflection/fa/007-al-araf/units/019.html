<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰـٔادَمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَيٰـٔادَمُ</button>
    <button class="word-link" type="button" data-word="اسكُن" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="سکونت کن و جای گیر.">اسكُن</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="وَزَوجُكَ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="و همسر تو؛ همراه آدم در خطاب آیه.">وَزَوجُكَ</button>
    <button class="word-link" type="button" data-word="الجَنَّةَ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغی که برای سکونت آنان معرفی شده است.">الجَنَّةَ</button>
    <button class="word-link" type="button" data-word="فَكُلا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="پس شما دو تن بخورید.">فَكُلا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="در «من حيث شئتما»، هر جا در محدوده باغ که شما دو تن بخواهید." data-learn-more="/quran-terminology/fa/roots/h-y-th/" data-root-note="معنای کوتاه واژه: مکان یا موقعیتی که جملهٔ همراه آن مشخص می‌کند؛ با «مِنْ»، مبدأ یا منشأ، و در کاربرد تعمیمی، هرجا که. «حيث» ظرفی عمدتاً جامد است.">حَيثُ</button>
    <button class="word-link" type="button" data-word="شِئتُما" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هر جا که شما دو تن بخواهید.">شِئتُما</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَقرَبا" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="شما دو تن نزدیک نشوید.">تَقرَبا</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="الشَّجَرَةَ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="همان درخت مشخصی که از نزدیک شدن به آن منع شده‌اند.">الشَّجَرَةَ</button>
    <button class="word-link" type="button" data-word="فَتَكونا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="پس در شمارِ گروه بعد قرار می‌گیرید.">فَتَكونا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="کسانی که از حد و حق می‌گذرند و ستم می‌کنند.">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و ای آدم، تو و همسرت در باغ سکونت کنید و از هرجا که خواستید بخورید، و به این درخت نزدیک نشوید که از ستمکاران خواهید شد.</p>
</section>
