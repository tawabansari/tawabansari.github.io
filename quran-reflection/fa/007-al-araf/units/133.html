<section class="ayah-block" id="ayah-133" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="پس فرستادیم">فَأَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الطّوفانَ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل" data-context="طوفان و سیلاب">الطّوفانَ</button>
    <button class="word-link" type="button" data-word="وَالجَرادَ" data-root="ج ر د" data-root-meaning="برداشتن یا نداشتن پوشش و آشکار شدن سطح چیزی؛ جراد، نام ملخ است." data-context="و ملخ" data-learn-more="/quran-terminology/fa/roots/j-r-d/">وَالجَرادَ</button>
    <button class="word-link" type="button" data-word="وَالقُمَّلَ" data-root="ق م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-l/" data-root-meaning="قُمّل: حشرات آفت، با اختلاف در تعیین گونه؛ قمل: شپش." data-context="و قمل؛ حشرات آزاردهنده، از جمله در تفسیر، شپش">وَالقُمَّلَ</button>
    <button class="word-link" type="button" data-word="وَالضَّفادِعَ" data-root="ض ف د ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-f-d-ayn/" data-root-meaning="قورباغه." data-context="و قورباغه‌ها">وَالضَّفادِعَ</button>
    <button class="word-link" type="button" data-word="وَالدَّمَ" data-root="د م و" data-root-meaning="خون؛ مایع حیاتی بدن انسان و حیوان. «دَم» مفرد و «دِمَاء» جمع آن است؛ خون‌ریزی، حکم خوراکی و دیگر دلالت‌ها از ترکیب و سیاق روشن می‌شوند. دربارهٔ حرف سوم، تحلیل‌های «د م و» و «د م ي» وجود دارد." data-learn-more="/quran-terminology/fa/roots/d-m-w/" data-context="و خون">وَالدَّمَ</button>
    <button class="word-link" type="button" data-word="ءايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌هایی">ءايٰتٍ</button>
    <button class="word-link" type="button" data-word="مُفَصَّلٰتٍ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="جداگانه و روشن" data-learn-more="/quran-terminology/fa/roots/f-sad-l/">مُفَصَّلٰتٍ</button>
    <button class="word-link" type="button" data-word="فَاستَكبَروا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="پس تکبر ورزیدند">فَاستَكبَروا</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بودند">وَكانوا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="مردمی" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">قَومًا</button>
    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرم و گناهکار" data-learn-more="/quran-terminology/fa/roots/j-r-m/">مُجرِمينَ</button>
  </p>
  <p class="farsi-verse">پس طوفان و ملخ و شپش و قورباغه‌ها و خون را به‌صورت نشانه‌هایی جداگانه بر آنان فرستادیم؛ پس تکبر ورزیدند و گروهی مجرم بودند.</p>
</section>
