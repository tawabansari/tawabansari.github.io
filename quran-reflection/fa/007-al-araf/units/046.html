<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">وَبَينَهُما</button>
    <button class="word-link" type="button" data-word="حِجابٌ" data-root="ح ج ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِجابٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الأَعرافِ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">الأَعرافِ</button>
    <button class="word-link" type="button" data-word="رِجالٌ" data-root="ر ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رِجالٌ</button>
    <button class="word-link" type="button" data-word="يَعرِفونَ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">يَعرِفونَ</button>
    <button class="word-link" type="button" data-word="كُلًّا" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلًّا</button>
    <button class="word-link" type="button" data-word="بِسيمىٰهُم" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز">بِسيمىٰهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنادَوا" data-root="ن د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَنادَوا</button>
    <button class="word-link" type="button" data-word="أَصحٰبَ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">أَصحٰبَ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="سَلٰمٌ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">سَلٰمٌ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَدخُلوها" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">يَدخُلوها</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَطمَعونَ" data-root="ط م ع" data-learn-more="/quran-terminology/fa/roots/tt-m-ayn/" data-root-meaning="چشم‌داشت و گرایش درونی به دستیابی به امر مطلوبی که ممکن پنداشته می‌شود">يَطمَعونَ</button>
  </p>
  <p class="farsi-verse">و میان آن دو حجابی است؛ و بر بلندی‌ها مردانی‌اند که هرکدام را از نشانه‌شان می‌شناسند. و اهل باغ را ندا می‌دهند: سلام بر شما. هنوز به آن درنیامده‌اند و امید دارند.</p>
</section>
