    <button class="word-link" type="button" data-word="ءادَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">ءادَمَ</button>

  <p class="farsi-verse">ای فرزندان آدم، اگر رسولانی از خودتان نزد شما بیایند که نشانه‌های مرا برایتان بازگو کنند، پس کسانی که پروا کنند و اصلاح کنند، نه بیمی بر آنان است و نه اندوهگین می‌شوند.</p>
