  <h2 class="ayah-title">الاعراف ۷:۱۷۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُمَسِّكونَ" data-root="م س ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُمَسِّكونَ</button>
    <button class="word-link" type="button" data-word="بِالكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">بِالكِتٰبِ</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>

  <p class="farsi-verse">و کسانی که به کتاب استوار می‌چسبند و صلات را برپا داشته‌اند، ما پاداش اصلاحگران را تباه نمی‌کنیم.</p>
