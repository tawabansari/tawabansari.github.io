<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالبَلَدُ" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»">وَالبَلَدُ</button>
    <button class="word-link" type="button" data-word="الطَّيِّبُ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است.">الطَّيِّبُ</button>
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="نَباتُهُ" data-root="ن ب ت" data-learn-more="/quran-terminology/fa/roots/n-b-t/" data-root-meaning="روییدن، رویاندن و آشکار شدن حیات از بستر مناسب">نَباتُهُ</button>
    <button class="word-link" type="button" data-word="بِإِذنِ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن">بِإِذنِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذى</button>
    <button class="word-link" type="button" data-word="خَبُثَ" data-root="خ ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="ناپاکی، پلیدی یا نامرغوبی، مادی یا معنوی، بنا بر سیاق.">خَبُثَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="نَكِدًا" data-root="ن ك د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-k-d/" data-root-meaning="دشواری، کم‌بازدهی و اندکی همراه با زحمت.">نَكِدًا</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نُصَرِّفُ" data-root="ص ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-f/" data-root-meaning="برگرداندن و دگرگون کردن؛ تصریف: گرداندن یا گوناگون بیان کردن.">نُصَرِّفُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَشكُرونَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">يَشكُرونَ</button>
  </p>
  <p class="farsi-verse">و سرزمین پاکیزه، گیاهش به اذن پروردگارش بیرون می‌آید؛ و آنکه ناپاک شده، جز به دشواری چیزی بیرون نمی‌دهد. این‌گونه نشانه‌ها را برای گروهی که سپاس می‌گزارند گوناگون بیان می‌کنیم.</p>
</section>
