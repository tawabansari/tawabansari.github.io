  <p class="farsi-verse">فرعون گفت: پیش از آنکه به شما اجازه دهم به او ایمان آوردید؟ این نیرنگی است که در شهر کرده‌اید تا مردمش را از آن بیرون کنید؛ پس به‌زودی خواهید دانست.</p>
