  <p class="farsi-verse">و هنگامی که به آنان گفته شد: در این آبادی سکونت کنید و از هرجا که خواستید بخورید و بگویید: فروریختن بار خطا؛ و سجده‌کنان از دروازه درآیید تا خطاهایتان را بیامرزیم. نیکوکاران را افزون خواهیم داد.</p>
