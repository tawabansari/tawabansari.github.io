<section class="ayah-block" id="ayah-161" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="به آنان گفته شد.">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="اسكُنوا" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="سکونت کنید و جای بگیرید.">اسكُنوا</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="القَريَةَ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="این آبادیِ مورد اشاره.">القَريَةَ</button>
    <button class="word-link" type="button" data-word="وَكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="و بخورید و بهره ببرید.">وَكُلوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="هر جا که بخواهید؛ در محدوده آبادیِ مورد اشاره." data-learn-more="/quran-terminology/fa/roots/h-y-th/" data-root-note="معنای کوتاه واژه: مکان یا موقعیتی که جملهٔ همراه آن مشخص می‌کند؛ با «مِنْ»، مبدأ یا منشأ، و در کاربرد تعمیمی، هرجا که. «حيث» ظرفی عمدتاً جامد است.">حَيثُ</button>
    <button class="word-link" type="button" data-word="شِئتُم" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هر جا که شما بخواهید.">شِئتُم</button>
    <button class="word-link" type="button" data-word="وَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و بگویید و درخواست خود را بیان کنید.">وَقولوا</button>
    <button class="word-link" type="button" data-word="حِطَّةٌ" data-root="ح ط ط" data-learn-more="/quran-terminology/fa/roots/h-tt-tt/" data-root-meaning="پایین آوردن و فرو نهادن؛ و در کاربرد قرآنی حِطَّة، درخواست فروگذاشته شدن بار خطیئات و آمرزش آن‌ها." data-context="درخواست فرو نهادن و برداشتن بار خطا؛ «حِطّة».">حِطَّةٌ</button>
    <button class="word-link" type="button" data-word="وَادخُلُوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="و وارد شوید.">وَادخُلُوا</button>
    <button class="word-link" type="button" data-word="البابَ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون." data-context="دروازه یا راه ورودِ مورد اشاره.">البابَ</button>
    <button class="word-link" type="button" data-word="سُجَّدًا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="در حال سجده و فروتنی.">سُجَّدًا</button>
    <button class="word-link" type="button" data-word="نَغفِر" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="خطاهای شما را می‌آمرزیم.">نَغفِر</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="خَطيـٰٔتِكُم" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/" data-root-meaning="لغزیدن از مسیر درست، به هدف نخوردن، خطا رفتن؛ و در برخی صورت‌ها، انحراف آگاهانه از حق." data-context="خطاها و لغزش‌های شما.">خَطيـٰٔتِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="سَنَزيدُ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="به آنان افزون‌تر خواهیم داد.">سَنَزيدُ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوکاران و کسانی که کار را به نیکی انجام می‌دهند.">المُحسِنينَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که به آنان گفته شد: در این آبادی سکونت کنید و از هرجا که خواستید بخورید و بگویید: فروریختن بار خطا؛ و سجده‌کنان از دروازه درآیید تا خطاهایتان را بیامرزیم. نیکوکاران را افزون خواهیم داد.</p>
</section>
