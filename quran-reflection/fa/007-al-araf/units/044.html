<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنادىٰ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="و ندا کردند؛ خطاب اهل باغ به اهل آتش." data-learn-more="/quran-terminology/fa/roots/n-d-y/">وَنادىٰ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="اهل؛ کسانی که به باغ تعلق دارند.">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغ؛ جایگاه گروه نداکننده.">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="أَصحٰبَ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="اهل؛ گروه مخاطب ندا.">أَصحٰبَ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ جایگاه گروه مخاطب.">النّارِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="وَجَدنا" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="یافتیم؛ تحقق وعده را دریافتیم.">وَجَدنا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="وَعَدَنا" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="به ما وعده داد؛ وعدهٔ پروردگار.">وَعَدَنا</button>
    <button class="word-link" type="button" data-word="رَبُّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار ما؛ صاحب وعده.">رَبُّنا</button>
    <button class="word-link" type="button" data-word="حَقًّا" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ وصف تحقق وعده.">حَقًّا</button>
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهَل</button>
    <button class="word-link" type="button" data-word="وَجَدتُم" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="یافتید؛ پرسش از تحقق وعده برای مخاطبان.">وَجَدتُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="وَعَدَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعده داد؛ وعدهٔ پروردگار مخاطبان.">وَعَدَ</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان؛ صاحب وعدهٔ مخاطبان.">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="حَقًّا" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ وصف وعدهٔ پرسیده‌شده.">حَقًّا</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ پاسخ مخاطبان.">قالوا</button>
    <button class="word-link" type="button" data-word="نَعَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَعَم</button>
    ۚ
    <button class="word-link" type="button" data-word="فَأَذَّنَ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="پس اعلام کرد؛ رساندن اعلان میان دو گروه.">فَأَذَّنَ</button>
    <button class="word-link" type="button" data-word="مُؤَذِّنٌ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="اعلان‌کننده؛ کسی که پیام را اعلام می‌کند.">مُؤَذِّنٌ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آنان؛ جایگاه یا نسبت اعلان.">بَينَهُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="لَعنَةُ" data-root="ل ع ن" data-learn-more="/quran-terminology/fa/roots/l-ayn-n/" data-root-meaning="راندن، دور ساختن و قرار گرفتن در جایگاه طرد" data-context="لعنت؛ دوری از رحمت در اعلان.">لَعنَةُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگران؛ کسانی که لعنت دربارهٔ آنان اعلام می‌شود.">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و اهل باغ اهل آتش را ندا می‌دهند: آنچه پروردگارمان به ما وعده داده بود حق یافتیم؛ آیا شما نیز آنچه پروردگارتان وعده داده بود حق یافتید؟ می‌گویند: آری. پس نداکننده‌ای میانشان اعلام می‌کند که لعنت آن معبود یگانه بر ستمکاران است.</p>
</section>
