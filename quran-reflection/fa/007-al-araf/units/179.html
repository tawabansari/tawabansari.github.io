  <p class="farsi-verse">و بسیاری از جن و انس را برای جهنم پدید آوردیم؛ دل‌هایی دارند که با آن‌ها نمی‌فهمند، و دیدگانی دارند که با آن‌ها نمی‌بینند، و گوش‌هایی دارند که با آن‌ها نمی‌شنوند. آنان مانند چهارپایان‌اند، بلکه گمراه‌ترند؛ همانان غافلان‌اند.</p>
