  <p class="farsi-verse">و هنگامی که پشیمان شدند و دیدند که گمراه شده‌اند، گفتند: اگر پروردگارمان بر ما رحمت نیاورد و ما را نیامرزد، حتما از زیانکاران خواهیم بود.</p>
