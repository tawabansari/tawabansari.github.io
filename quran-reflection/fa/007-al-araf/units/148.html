<section class="ayah-block" id="ayah-148" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاتَّخَذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="و گرفتند؛ روی آوردن قوم موسی به گوساله به‌عنوان معبود.">وَاتَّخَذَ</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قوم موسی؛ مردمی که در غیاب او گوساله را گرفتند.">قَومُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از او؛ در غیاب موسی.">بَعدِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حُلِيِّهِم" data-root="ح ل ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-y/" data-root-meaning="زیور و آرایش، و آراستن با زیور." data-context="زیورهایشان؛ موادی که پیکر گوساله از آن فراهم شد.">حُلِيِّهِم</button>
    <button class="word-link" type="button" data-word="عِجلًا" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله" data-context="گوساله‌ای؛ صورتِ پیکری که مردم آن را گرفتند.">عِجلًا</button>
    <button class="word-link" type="button" data-word="جَسَدًا" data-root="ج س د" data-root-meaning="پیکر و صورت جسمانی؛ خود واژه زنده یا مرده بودن و داشتن آگاهی را تعیین نمی‌کند." data-context="پیکری؛ وصفِ گوساله‌ای که از زیورهای قوم موسی ساخته شده و بانگی داشت." data-learn-more="/quran-terminology/fa/roots/j-s-d/">جَسَدًا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="خُوارٌ" data-root="خ و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-r/" data-root-meaning="بانگ گاو؛ در شاخه‌ای دیگر، ضعف و سستی." data-context="بانگ گاو؛ صدایی که به پیکر گوساله نسبت داده شده است.">خُوارٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="ندیدند؛ در پرسشِ «آیا ندیدند» دربارهٔ ناتوانی گوساله.">يَرَوا</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُكَلِّمُهُم" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="با آنان سخن می‌گوید؛ فعلی که دربارهٔ گوساله نفی شده است.">يُكَلِّمُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَهديهِم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="آنان را راهنمایی می‌کند؛ توانایی‌ای که دربارهٔ گوساله نفی شده است.">يَهديهِم</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راهی؛ مسیری که گوساله توان نشان دادن آن را ندارد.">سَبيلًا</button>
    ۘ
    <button class="word-link" type="button" data-word="اتَّخَذوهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="آن را گرفتند؛ پذیرفتن همان گوساله به‌عنوان معبود.">اتَّخَذوهُ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ بیانِ وضعیت قوم با وصفِ ستمکاری.">وَكانوا</button>
    <button class="word-link" type="button" data-word="ظٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمکاران؛ وصفِ کسانی که گوساله را معبود گرفتند.">ظٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و قوم موسی پس از او از زیورهایشان گوساله‌ای گرفتند، پیکری که بانگ گاو داشت. آیا ندیدند که با آنان سخن نمی‌گوید و راهی نشانشان نمی‌دهد؟ آن را گرفتند و ستمکار بودند.</p>
</section>
