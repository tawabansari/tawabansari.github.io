<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="مَكَّنّٰكُم" data-root="م ك ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَكَّنّٰكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مَعٰيِشَ" data-root="ع ي ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَعٰيِشَ</button>
    ۗ
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">تَشكُرونَ</button>
  </p>
  <p class="farsi-verse">و شما را در زمین توان دادیم و در آن برایتان اسباب زندگی قرار دادیم. چه اندک سپاس می‌گزارید.</p>
</section>
