  <h2 class="ayah-title">الاعراف ۷:۱۹۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="ءاتىٰهُما" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">ءاتىٰهُما</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="جَعَلا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="شُرَكاءَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">شُرَكاءَ</button>

    <button class="word-link" type="button" data-word="ءاتىٰهُما" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">ءاتىٰهُما</button>

    <button class="word-link" type="button" data-word="فَتَعٰلَى" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَتَعٰلَى</button>

    <button class="word-link" type="button" data-word="يُشرِكونَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">يُشرِكونَ</button>
  </p>
  <p class="farsi-verse">پس هنگامی که به آن دو شایسته‌ای داد، در آنچه به آنان داده بود شریکانی برای او قرار دادند؛ پس آن معبود یگانه برتر است از آنچه شریک می‌گیرند.</p>
