  <p class="farsi-verse">بگو: برای خود مالک هیچ سود و زیانی نیستم، مگر آنچه آن معبود یگانه بخواهد. و اگر غیب را می‌دانستم، خیر فراوان فراهم می‌کردم و بدی به من نمی‌رسید. من جز هشداردهنده و مژده‌دهنده‌ای برای گروهی که ایمان می‌آورند نیستم.</p>
