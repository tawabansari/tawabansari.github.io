  <p class="farsi-verse">پس کسانی از آنان که ستم کردند، سخنی جز آنچه به آنان گفته شده بود جایگزین کردند؛ پس به سبب ستمی که می‌کردند عذابی از آسمان بر آنان فرستادیم.</p>
