<section class="ayah-block" id="ayah-167" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="تَأَذَّنَ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="اعلام کرد؛ خبرِ مورد تأکید از سوی پروردگار.">تَأَذَّنَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ اعلام‌کنندهٔ خبر.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="لَيَبعَثَنَّ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه." data-context="بی‌گمان برمی‌انگیزد و می‌فرستد؛ کسانی را بر آنان.">لَيَبعَثَنَّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ در ترکیب «روز قیامت».">يَومِ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قیامت؛ پایانِ مدتِ یادشده.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَسومُهُم" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز" data-context="بر آنان تحمیل می‌کند؛ دربارهٔ عذاب بد.">يَسومُهُم</button>
    <button class="word-link" type="button" data-word="سوءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی و سختی؛ در وصف عذاب.">سوءَ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ آنچه بر آنان تحمیل می‌شود.">العَذابِ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ وصف‌شده به سرعت در کیفر.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="لَسَريعُ" data-root="س ر ع" data-root-meaning="سرعت و تندیِ حرکت یا انجام کار در برابر کندی؛ و در مسارعت، شتاب در اقدام و پیش‌دستی به سوی مقصدی که ارزش آن از سیاق شناخته می‌شود." data-context="در کیفر سریع است؛ همراه با وصفِ آمرزندگی و رحمت." data-learn-more="/quran-terminology/fa/roots/s-r-ayn/">لَسَريعُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار" data-context="کیفر؛ زمینهٔ سرعتِ مورد تأکید.">العِقابِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَغَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="بی‌گمان بسیار آمرزنده؛ در کنار سرعت کیفر.">لَغَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربان و رحمت‌رسان؛ وصف خداوند.">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">و هنگامی که پروردگارت اعلام کرد که تا روز قیامت کسانی را بر آنان برمی‌انگیزد که عذاب بد به آنان بچشانند. بی‌گمان پروردگارت در کیفر سریع است و او آمرزنده و رحیم است.</p>
</section>
