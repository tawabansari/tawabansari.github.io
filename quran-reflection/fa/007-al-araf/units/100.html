<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۰۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَهدِ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدِ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="يَرِثونَ" data-root="و ر ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-th/" data-root-meaning="به ارث بردن و منتقل شدن دارایی یا جایگاه به جانشین.">يَرِثونَ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدِ</button>
    <button class="word-link" type="button" data-word="أَهلِها" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلِها</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">نَشاءُ</button>
    <button class="word-link" type="button" data-word="أَصَبنٰهُم" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">أَصَبنٰهُم</button>
    <button class="word-link" type="button" data-word="بِذُنوبِهِم" data-root="ذ ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-n-b/" data-root-meaning="دُم؛ ذنب: گناه و مسئولیت آن؛ ذَنوب: دلو پُر یا بهره‌ای مقرر.">بِذُنوبِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنَطبَعُ" data-root="ط ب ع" data-learn-more="/quran-terminology/fa/roots/tt-b-ayn/" data-root-meaning="مهر زدن، قالب زدن، و تثبیت اثری ماندگار بر مجرای دریافت پس از جهت‌گیری پایدار انسان">وَنَطبَعُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَسمَعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">يَسمَعونَ</button>
  </p>
  <p class="farsi-verse">آیا برای کسانی که زمین را پس از مردمش به ارث می‌برند روشن نشده است که اگر بخواهیم، آنان را به سبب گناهانشان گرفتار می‌کنیم؟ و بر دل‌هایشان مهر می‌نهیم، پس نمی‌شنوند.</p>
</section>
