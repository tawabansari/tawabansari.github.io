<section class="ayah-block" id="ayah-138" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجٰوَزنا" data-root="ج و ز" data-root-meaning="گذشتن و پشت سر گذاشتن؛ «تَجَاوَزَ عَنْ» در کاربرد قرآنی، درگذشتن از بدی‌ها و مؤاخذهٔ آنها." data-context="و عبور دادیم؛ بنی‌اسرائیل را از دریا گذراندیم." data-learn-more="/quran-terminology/fa/roots/j-w-z/">وَجٰوَزنا</button>
    <button class="word-link" type="button" data-word="بِبَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="فرزندانِ؛ در اینجا بنی‌اسرائیل.">بِبَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="البَحرَ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دریا؛ پهنهٔ آبی که بنی‌اسرائیل از آن عبور داده شدند.">البَحرَ</button>
    <button class="word-link" type="button" data-word="فَأَتَوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="پس رسیدند؛ به قومی برخوردند.">فَأَتَوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قومی؛ گروهی از مردم.">قَومٍ</button>
    <button class="word-link" type="button" data-word="يَعكُفونَ" data-root="ع ك ف" data-learn-more="/quran-terminology/fa/roots/ayn-k-f/" data-root-meaning="ملازم ماندن، اقامت و بازداشتن" data-context="ملازم می‌ماندند؛ به پرستش بت‌های خود سرگرم بودند.">يَعكُفونَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَصنامٍ" data-root="ص ن م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-m/" data-root-meaning="بت و پیکره مورد پرستش." data-context="بت‌هایی؛ پیکره‌هایی که آن قوم می‌پرستیدند.">أَصنامٍ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ بنی‌اسرائیل موسی را خطاب کردند.">قالوا</button>
    <button class="word-link" type="button" data-word="يٰموسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰموسَى</button>
    <button class="word-link" type="button" data-word="اجعَل" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار بده؛ درخواستِ تعیین معبودی برای خودشان.">اجعَل</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="إِلٰهًا" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبودی؛ آنچه برای پرستش درخواست کردند.">إِلٰهًا</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ءالِهَةٌ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبودانی؛ آنچه آن قوم می‌پرستیدند.">ءالِهَةٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ پاسخ موسی به درخواست آنان.">قالَ</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قومی؛ گروهی که موسی آنان را خطاب می‌کند.">قَومٌ</button>
    <button class="word-link" type="button" data-word="تَجهَلونَ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه." data-context="نادانی می‌کنید؛ رفتار ناآگاهانهٔ شما در این درخواست.">تَجهَلونَ</button>
  </p>
  <p class="farsi-verse">و فرزندان اسرائیل را از دریا گذراندیم؛ پس به مردمی رسیدند که بر بت‌های خود ملازمت داشتند. گفتند: ای موسی، برای ما معبودی قرار بده، همان‌گونه که آنان معبودانی دارند. گفت: شما مردمی هستید که نادانی می‌کنید.</p>
</section>
