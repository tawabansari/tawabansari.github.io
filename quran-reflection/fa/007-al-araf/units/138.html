  <p class="farsi-verse">و فرزندان اسرائیل را از دریا گذراندیم؛ پس به مردمی رسیدند که بر بت‌های خود ملازمت داشتند. گفتند: ای موسی، برای ما معبودی قرار بده، همان‌گونه که آنان معبودانی دارند. گفت: شما مردمی هستید که نادانی می‌کنید.</p>
