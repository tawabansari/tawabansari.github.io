<section class="ayah-block" id="ayah-163" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسـَٔلهُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="از آنان بپرس؛ درباره سرگذشت آبادی کنار دریا پرسش کن.">وَسـَٔلهُم</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="القَريَةِ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی؛ محل زندگی مردمی که داستان سبت درباره آنان است.">القَريَةِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ وضعیت آن آبادی را در کنار دریا بیان می‌کند.">كانَت</button>
    <button class="word-link" type="button" data-word="حاضِرَةَ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت" data-context="کنار دریا قرار داشت؛ نزدیک و مجاور پهنه آب بود.">حاضِرَةَ</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دریا؛ پهنه آبی که آبادی در کنار آن قرار داشت.">البَحرِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="يَعدونَ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="تجاوز می‌کردند؛ حدود مربوط به سبت را زیر پا می‌گذاشتند.">يَعدونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّبتِ" data-root="س ب ت" data-learn-more="/quran-terminology/fa/roots/s-b-t/" data-root-meaning="توقف، بازایستادن، قطع فعالیت و دست کشیدن از کار؛ از سبت تاریخی تا سبات خواب." data-context="سبت؛ روزی که مردم آن آبادی به رعایت حدود آن متعهد بودند.">السَّبتِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="تَأتيهِم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="نزد آنان می‌آمدند؛ آمدن ماهیان به سوی مردم آبادی.">تَأتيهِم</button>
    <button class="word-link" type="button" data-word="حيتانُهُم" data-root="ح و ت" data-root-meaning="ماهی؛ در کاربردهای غیرقرآنیِ این خانواده، گردش و تغییر مسیر." data-context="ماهیانشان؛ ماهیانی که در روز سبت آشکارا نزد مردم آبادی می‌آمدند." data-learn-more="/quran-terminology/fa/roots/h-w-t/">حيتانُهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمان آمدن آشکار ماهیان در سبت.">يَومَ</button>
    <button class="word-link" type="button" data-word="سَبتِهِم" data-root="س ب ت" data-learn-more="/quran-terminology/fa/roots/s-b-t/" data-root-meaning="توقف، بازایستادن، قطع فعالیت و دست کشیدن از کار؛ از سبت تاریخی تا سبات خواب." data-context="سبتشان؛ روز سبت مربوط به آن مردم و تعهد آنان.">سَبتِهِم</button>
    <button class="word-link" type="button" data-word="شُرَّعًا" data-root="ش ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-r-ayn/" data-root-meaning="راه روشن و پدید آوردن مسیر؛ شریعت: راه یا آیین؛ شُرَّع: آشکار و نزدیک‌آمده." data-context="آشکار و در دسترس؛ وصف چگونگی حضور ماهیان.">شُرَّعًا</button>
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روزی؛ زمان دیگری در برابر روز سبت.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَسبِتونَ" data-root="س ب ت" data-learn-more="/quran-terminology/fa/roots/s-b-t/" data-root-meaning="توقف، بازایستادن، قطع فعالیت و دست کشیدن از کار؛ از سبت تاریخی تا سبات خواب." data-context="سبت نگه می‌داشتند؛ با نفی «لا»، روزی که سبت را رعایت نمی‌کردند.">يَسبِتونَ</button>
    ۙ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَأتيهِم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="نزد آنان می‌آمدند؛ با نفی «لا»، ماهیان در آن روز نمی‌آمدند.">تَأتيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَبلوهُم" data-root="ب ل و" data-learn-more="/quran-terminology/fa/roots/b-l-w/" data-root-meaning="آزمودن در واقعیت؛ از خیر و شر تا «بلاء» و فرسودگی" data-context="آنان را می‌آزمودیم؛ این وضعیت زمینه آزمون مردم بود.">نَبلوهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند و ادامه می‌دادند؛ استمرار رفتار آنان را با فعل بعد بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="يَفسُقونَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="نافرمانی می‌کردند؛ از حدود و تعهد خود بیرون می‌رفتند.">يَفسُقونَ</button>
  </p>
  <p class="farsi-verse">و از آنان درباره آبادی کنار دریا بپرس، هنگامی که در سبت تجاوز می‌کردند؛ ماهیانشان روز سبتشان آشکارا نزد آنان می‌آمدند و روزی که سبت نگه نمی‌داشتند نمی‌آمدند. این‌گونه آنان را به سبب نافرمانی‌ای که می‌کردند می‌آزمودیم.</p>
</section>
