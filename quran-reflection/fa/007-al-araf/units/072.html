  <p class="farsi-verse">پس او و کسانی را که با او بودند با رحمتی از سوی خود نجات دادیم و ریشه کسانی را که نشانه‌های ما را دروغ شمردند بریدیم؛ و آنان مؤمن نبودند.</p>
