<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَعَجِبتُم" data-root="ع ج ب" data-root-meaning="شگفتی و بزرگ یا غیرمعمول یافتن؛ در اعجاب، جلب پسند یا تأثیر گذاشتن؛ و در کاربردِ عُجب، خودپسندی." data-context="آیا شگفت‌زده شده‌اید؛ از آمدن یادآوری بر مردی از خودتان." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/">أَوَعَجِبتُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="جاءَكُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="به شما رسیده است؛ یادآوری از پروردگار.">جاءَكُم</button>
    <button class="word-link" type="button" data-word="ذِكرٌ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یادآوری؛ پیامِ آمده بر مردی از میان آنان.">ذِكرٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان؛ فرستندهٔ یادآوری.">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="رَجُلٍ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="مردی؛ دریافت‌کنندهٔ پیام از میان خودشان.">رَجُلٍ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="لِيُنذِرَكُم" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="تا شما را هشدار دهد.">لِيُنذِرَكُم</button>
    <button class="word-link" type="button" data-word="وَلِتَتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و تا پروا کنید و پرهیزگار باشید.">وَلِتَتَّقوا</button>
    <button class="word-link" type="button" data-word="وَلَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُرحَمونَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مورد رحمت قرار گیرید؛ نتیجهٔ مورد امید.">تُرحَمونَ</button>
  </p>
  <p class="farsi-verse">آیا شگفت‌زده شدید که یادآوری‌ای از پروردگارتان بر مردی از خودتان به شما رسیده است تا هشدارتان دهد و تا پروا کنید و باشد که مورد رحمت قرار گیرید؟</p>
</section>
