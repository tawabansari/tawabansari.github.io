<section class="ayah-block" id="ayah-183" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأُملى" data-root="م ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-w/" data-root-meaning="مدت طولانی و مهلت دادن؛ املاء: فرصت و امتداد بخشیدن.">وَأُملى</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="كَيدى" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است.">كَيدى</button>
    <button class="word-link" type="button" data-word="مَتينٌ" data-root="م ت ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-t-n/" data-root-meaning="استواری، سختی و نیرومندی.">مَتينٌ</button>
  </p>
  <p class="farsi-verse">و به آنان مهلت می‌دهم؛ بی‌گمان تدبیر من استوار است.</p>
</section>
