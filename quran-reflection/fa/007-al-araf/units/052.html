<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="جِئنٰهُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="برای آنان آوردیم.">جِئنٰهُم</button>
    <button class="word-link" type="button" data-word="بِكِتٰبٍ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="با کتابی.">بِكِتٰبٍ</button>
    <button class="word-link" type="button" data-word="فَصَّلنٰهُ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="به‌روشنی و به‌تفصیل بیان کردیم؛ دربارهٔ موضوعِ یادشده در آیه." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">فَصَّلنٰهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانش و آگاهی.">عِلمٍ</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت و راهنمایی.">هُدًى</button>
    <button class="word-link" type="button" data-word="وَرَحمَةً" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="و رحمت.">وَرَحمَةً</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="برای مردمی یا گروهی." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان می‌آورند یا ایمان دارند.">يُؤمِنونَ</button>
  </p>
  <p class="farsi-verse">و کتابی برای آنان آوردیم که آن را بر پایه دانش به‌تفصیل بیان کردیم، هدایت و رحمتی برای گروهی که ایمان می‌آورند.</p>
</section>
