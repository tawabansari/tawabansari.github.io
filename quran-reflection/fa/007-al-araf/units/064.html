<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَذَّبوهُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">فَكَذَّبوهُ</button>
    <button class="word-link" type="button" data-word="فَأَنجَينٰهُ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">فَأَنجَينٰهُ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الفُلكِ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش.">الفُلكِ</button>
    <button class="word-link" type="button" data-word="وَأَغرَقنَا" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب">وَأَغرَقنَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">بِـٔايٰتِنا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومًا</button>
    <button class="word-link" type="button" data-word="عَمينَ" data-root="ع م ي" data-learn-more="/quran-terminology/fa/roots/ayn-m-y/" data-root-meaning="کوری، نادیدن، پوشیده شدن راه دیدن، ابهام، و از دست رفتن توان مشاهده یا تشخیص">عَمينَ</button>
  </p>
  <p class="farsi-verse">پس او را دروغگو شمردند؛ و او و کسانی را که با او در کشتی بودند نجات دادیم، و کسانی را که نشانه‌های ما را دروغ شمردند غرق کردیم؛ آنان گروهی نابینا بودند.</p>
</section>
