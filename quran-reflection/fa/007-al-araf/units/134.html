  </p>
  <p class="farsi-verse">و هنگامی که عذاب بر آنان واقع شد، گفتند: ای موسی، پروردگارت را با آن پیمانی که نزد تو دارد برای ما بخوان؛ اگر عذاب را از ما برداری، حتما به تو ایمان می‌آوریم و فرزندان اسرائیل را همراه تو می‌فرستیم.</p>
