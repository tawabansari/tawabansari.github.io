  <p class="farsi-verse">کسانی که نشانه‌های ما را دروغ شمردند و از آن‌ها با تکبر روی برتافتند، درهای آسمان برایشان گشوده نمی‌شود و به باغ درنمی‌آیند تا شتر از سوراخ سوزن بگذرد؛ و این‌گونه مجرمان را جزا می‌دهیم.</p>
