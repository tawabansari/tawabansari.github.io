  <p class="farsi-verse">بر من سزاوار است که درباره آن معبود یگانه جز حق نگویم. با دلیلی روشن از پروردگارتان نزد شما آمده‌ام؛ پس فرزندان اسرائیل را همراه من بفرست.</p>
