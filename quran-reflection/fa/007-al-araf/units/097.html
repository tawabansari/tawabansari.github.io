<section class="ayah-block" id="ayah-097" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۹۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَمِنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="آیا احساس ایمنی کرده‌اند؟">أَفَأَمِنَ</button>
    <button class="word-link" type="button" data-word="أَهلُ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="اهالی و مردم.">أَهلُ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی‌ها و شهرها.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَأتِيَهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به آنان برسد.">يَأتِيَهُم</button>
    <button class="word-link" type="button" data-word="بَأسُنا" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="سختی و نیروی کیفر ما.">بَأسُنا</button>
    <button class="word-link" type="button" data-word="بَيٰتًا" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="شبانه؛ هنگام رسیدنِ سختی، جدا از وصفِ خوابیدن." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بَيٰتًا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="نائِمونَ" data-root="ن و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-w-m/" data-root-meaning="خواب و خوابیدن." data-context="در خواب‌اند.">نائِمونَ</button>
  </p>
  <p class="farsi-verse">آیا مردم آبادی‌ها ایمن شده‌اند از اینکه سختی ما شبانه به آنان برسد، در حالی که خواب‌اند؟</p>
</section>
