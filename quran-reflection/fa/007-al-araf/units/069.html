<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَعَجِبتُم" data-root="ع ج ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/" data-root-meaning="شگفتی؛ اعجاب: پسند و شگفت‌زدگی.">أَوَعَجِبتُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="جاءَكُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَكُم</button>
    <button class="word-link" type="button" data-word="ذِكرٌ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">ذِكرٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="رَجُلٍ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه.">رَجُلٍ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="لِيُنذِرَكُم" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">لِيُنذِرَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَاذكُروا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="جَعَلَكُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلَكُم</button>
    <button class="word-link" type="button" data-word="خُلَفاءَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">خُلَفاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدِ</button>
    <button class="word-link" type="button" data-word="قَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومِ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَزادَكُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">وَزادَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الخَلقِ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">الخَلقِ</button>
    <button class="word-link" type="button" data-word="بَصۜطَةً" data-root="ب س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-s-tt/" data-root-meaning="گشودن، گستردن و فراخ کردن؛ بسط می‌تواند مادی یا مربوط به توان و امکانات باشد.">بَصۜطَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">فَاذكُروا</button>
    <button class="word-link" type="button" data-word="ءالاءَ" data-root="أ ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-l-w/" data-root-meaning="در کاربردهای مختلف: کوتاهی کردن؛ سوگند خوردن؛ و آلاء به معنای نعمت‌ها. این شاخه‌ها یکسان نیستند.">ءالاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُفلِحونَ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری">تُفلِحونَ</button>
  </p>
  <p class="farsi-verse">آیا شگفت‌زده شدید که یادآوری‌ای از پروردگارتان بر مردی از خودتان به شما رسیده است تا هشدارتان دهد؟ و به یاد آورید هنگامی که شما را پس از قوم نوح جانشینان قرار داد و در آفرینش به شما گسترش بیشتری بخشید. پس نعمت‌های آن معبود یگانه را به یاد آورید، باشد که رستگار شوید.</p>
</section>
