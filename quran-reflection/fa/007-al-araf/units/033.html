  <p class="farsi-verse">بگو: پروردگارم تنها زشتی‌ها را، چه آشکارشان و چه پنهانشان، و گناه و تجاوز به ناحق را حرام کرده است؛ و اینکه چیزی را شریک آن معبود یگانه بگیرید که درباره آن هیچ دلیلی فرو نفرستاده، و اینکه درباره آن معبود یگانه چیزی بگویید که نمی‌دانید.</p>
