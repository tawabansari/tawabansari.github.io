<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان خطاب">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="حَرَّمَ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="حرام کرده است">حَرَّمَ</button>
    <button class="word-link" type="button" data-word="رَبِّىَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من">رَبِّىَ</button>
    <button class="word-link" type="button" data-word="الفَوٰحِشَ" data-root="ف ح ش" data-root-meaning="زشتی و ناپسندی شدید؛ فراتر رفتن رفتار یا سخن از حد پسندیده و قابل قبول." data-context="کارهای بسیار زشت؛ آشکار و پنهان، در شمار منع‌های آیه." data-learn-more="/quran-terminology/fa/roots/f-h-sh/">الفَوٰحِشَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="ظَهَرَ" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی" data-context="آشکار شده است">ظَهَرَ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بَطَنَ" data-root="ب ط ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-tt-n/" data-root-meaning="شکم، درون و بخش نهان؛ باطن در برابر ظاهر است و بطانه به لایهٔ درونی یا نزدیکان گفته می‌شود." data-context="پنهان مانده است">بَطَنَ</button>
    <button class="word-link" type="button" data-word="وَالإِثمَ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="و گناه">وَالإِثمَ</button>
    <button class="word-link" type="button" data-word="وَالبَغىَ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="و تعدی">وَالبَغىَ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="بدونِ؛ نفی حق">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق">الحَقِّ</button>
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَن</button>
    <button class="word-link" type="button" data-word="تُشرِكوا" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریک بگردانید">تُشرِكوا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يُنَزِّل" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نازل نکرده است؛ در ساخت نفی">يُنَزِّل</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="سُلطٰنًا" data-root="س ل ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-tt/" data-root-meaning="توان چیرگی؛ سلطان: قدرت، اختیار یا دلیل نافذ، بنا بر سیاق." data-context="دلیل و حجتِ معتبر">سُلطٰنًا</button>
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَن</button>
    <button class="word-link" type="button" data-word="تَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگویید؛ دربارهٔ آن معبود یگانه">تَقولوا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="نمی‌دانید؛ در ساخت نفی">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">بگو: پروردگارم تنها زشتی‌ها را، چه آشکارشان و چه پنهانشان، و گناه و تجاوز به ناحق را حرام کرده است؛ و اینکه چیزی را شریک آن معبود یگانه بگیرید که درباره آن هیچ دلیلی فرو نفرستاده، و اینکه درباره آن معبود یگانه چیزی بگویید که نمی‌دانید.</p>
</section>
