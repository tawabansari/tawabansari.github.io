  <p class="farsi-verse">سرانی از قومش که تکبر ورزیدند، به کسانی که ضعیف شمرده شده بودند، به کسانی از آنان که ایمان آورده بودند، گفتند: آیا می‌دانید که صالح از پروردگارش فرستاده شده است؟ گفتند: ما به آنچه او با آن فرستاده شده ایمان داریم.</p>
