<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">الاعراف ۷:۱۰۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">تِلكَ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی‌ها؛ جوامعی که از اخبارشان روایت می‌شود.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="نَقُصُّ" data-root="ق ص ص" data-root-meaning="پی گرفتن اثر و بازگفتن؛ قصاص: مقابلهٔ متناسب با آسیب؛ در لغت، بریدن و کوتاه کردن نیز ثبت شده است." data-context="بازمی‌گوییم؛ روایت بخشی از اخبار آبادی‌ها برای مخاطب." data-learn-more="/quran-terminology/fa/roots/q-sad-sad/">نَقُصُّ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَنبائِها" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="اخبارشان؛ محتوای بخشی از روایت.">أَنبائِها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="جاءَتهُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="نزدشان آمدند؛ آمدنِ فرستادگان به جوامع.">جاءَتهُم</button>
    <button class="word-link" type="button" data-word="رُسُلُهُم" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادگانشان؛ آورندگان دلایل روشن.">رُسُلُهُم</button>
    <button class="word-link" type="button" data-word="بِالبَيِّنٰتِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="با دلایل روشن؛ وصفِ آنچه همراه فرستادگان بود.">بِالبَيِّنٰتِ</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="در «ما كانوا»: نبودند؛ در نفیِ ایمان آوردن.">كانوا</button>
    <button class="word-link" type="button" data-word="لِيُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان بیاورند؛ عملی که در جمله نفی می‌شود.">لِيُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="تکذیب کرده بودند؛ نپذیرفتنِ پیشین.">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش‌تر؛ زمانِ تکذیب.">قَبلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَطبَعُ" data-root="ط ب ع" data-learn-more="/quran-terminology/fa/roots/tt-b-ayn/" data-root-meaning="مهر زدن، قالب زدن، و تثبیت اثری ماندگار بر مجرای دریافت پس از جهت‌گیری پایدار انسان" data-context="مهر می‌نهد؛ تصویرِ بسته شدن دل‌ها.">يَطبَعُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌ها؛ موضوعِ مهر نهادن.">قُلوبِ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفرورزان؛ کسانی که دل‌هایشان موضوع جمله است.">الكٰفِرينَ</button>
  </p>
  <p class="farsi-verse">این آبادی‌هاست که از خبرهایشان برای تو بازگو می‌کنیم. رسولانشان با دلایل روشن نزدشان آمدند، ولی به آنچه پیش‌تر دروغ شمرده بودند ایمان نمی‌آوردند. این‌گونه آن معبود یگانه بر دل‌های کافران مهر می‌نهد.</p>
</section>
