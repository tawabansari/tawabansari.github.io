  <p class="farsi-verse">این آبادی‌هاست که از خبرهایشان برای تو بازگو می‌کنیم. رسولانشان با دلایل روشن نزدشان آمدند، ولی به آنچه پیش‌تر دروغ شمرده بودند ایمان نمی‌آوردند. این‌گونه آن معبود یگانه بر دل‌های کافران مهر می‌نهد.</p>
