<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="ببینی؛ مشاهدهٔ صحنهٔ مجرمان در برابر پروردگار.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="إِذِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذِ</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که در این صحنه سرها فروانداخته‌اند." data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمونَ</button>
    <button class="word-link" type="button" data-word="ناكِسوا" data-root="ن ك س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-k-s/" data-root-meaning="وارونه و سرنگون کردن؛ در عمر، بازگرداندن توان به ضعف." data-context="سرها فروانداخته؛ وصف حال مجرمان.">ناكِسوا</button>
    <button class="word-link" type="button" data-word="رُءوسِهِم" data-root="ر أ س" data-root-meaning="سر؛ و در گسترش معنا، بخش بالایی، آغازین یا اصلی چیزی؛ رأس المال: اصل دارایی." data-context="سرهایشان؛ فروانداخته نزد پروردگار." data-learn-more="/quran-terminology/fa/roots/r-a-s/">رُءوسِهِم</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ آن‌که مجرمان نزد او ایستاده‌اند.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار ما؛ آغاز درخواستِ بازگشت.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَبصَرنا" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="دیدیم؛ اعتراف به مشاهدهٔ حقیقتی که اکنون آشکار شده است.">أَبصَرنا</button>
    <button class="word-link" type="button" data-word="وَسَمِعنا" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="و شنیدیم؛ اعتراف به دریافت آنچه پیش‌تر نپذیرفته بودند.">وَسَمِعنا</button>
    <button class="word-link" type="button" data-word="فَارجِعنا" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="پس ما را بازگردان؛ درخواستِ فرصتِ دوباره برای عمل.">فَارجِعنا</button>
    <button class="word-link" type="button" data-word="نَعمَل" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="عمل کنیم؛ مقصود از درخواستِ بازگشت.">نَعمَل</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته؛ وصفِ عملی که وعده می‌دهند.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="موقِنونَ" data-root="ي ق ن" data-learn-more="/quran-terminology/fa/roots/y-q-n/" data-root-meaning="ثبات معرفت، اطمینان روشن، و عبور از گمان" data-context="یقین‌دارندگان؛ بیانِ اطمینان اکنونِ مجرمان.">موقِنونَ</button>
  </p>
  <p class="farsi-verse">و اگر ببینی آنگاه که مجرمان نزد پروردگارشان سرهایشان را فرو افکنده‌اند: پروردگارا، دیدیم و شنیدیم؛ پس ما را بازگردان تا کار شایسته کنیم؛ ما یقین داریم.</p>
</section>
