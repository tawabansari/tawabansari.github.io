<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَنُذيقَنَّهُم" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج.">وَلَنُذيقَنَّهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابِ</button>
    <button class="word-link" type="button" data-word="الأَدنىٰ" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الأَدنىٰ</button>
    <button class="word-link" type="button" data-word="دونَ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونَ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابِ</button>
    <button class="word-link" type="button" data-word="الأَكبَرِ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">الأَكبَرِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَرجِعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">يَرجِعونَ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان از عذاب نزدیک‌تر، پیش از عذاب بزرگ‌تر، به آنان می‌چشانیم؛ باشد که بازگردند.</p>
</section>
