<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="شِئنا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شِئنا</button>
    <button class="word-link" type="button" data-word="لَـٔاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">لَـٔاتَينا</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسٍ</button>
    <button class="word-link" type="button" data-word="هُدىٰها" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هُدىٰها</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="حَقَّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">حَقَّ</button>
    <button class="word-link" type="button" data-word="القَولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">القَولُ</button>
    <button class="word-link" type="button" data-word="مِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّى</button>
    <button class="word-link" type="button" data-word="لَأَملَأَنَّ" data-root="م ل أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَأَملَأَنَّ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجِنَّةِ</button>
    <button class="word-link" type="button" data-word="وَالنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">وَالنّاسِ</button>
    <button class="word-link" type="button" data-word="أَجمَعينَ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">أَجمَعينَ</button>
  </p>
  <p class="farsi-verse">و اگر می‌خواستیم، به هر نفسی هدایتش را می‌دادیم؛ ولی این سخن از سوی من تحقق یافته است که جهنم را از جن و مردم، همگی، پر خواهم کرد.</p>
</section>
