  <p class="farsi-verse">و اما آنان که نافرمانی کردند، جایگاهشان آتش است. هر بار بخواهند از آن بیرون آیند، به آن بازگردانده می‌شوند و به آنان گفته می‌شود: عذاب آتشی را که تکذیب می‌کردید بچشید.</p>
