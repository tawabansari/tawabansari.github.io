<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">ءاتَينا</button>
    <button class="word-link" type="button" data-word="موسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسَى</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">تَكُن</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مِريَةٍ" data-root="م ر ي" data-learn-more="/quran-terminology/fa/roots/m-r-y/">مِريَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لِقائِهِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/">لِقائِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَجَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">هُدًى</button>
    <button class="word-link" type="button" data-word="لِبَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">لِبَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی به موسی کتاب دادیم؛ پس درباره دیدار آن در تردید مباش؛ و آن را هدایتی برای بنی‌اسرائیل قرار دادیم.</p>
</section>
