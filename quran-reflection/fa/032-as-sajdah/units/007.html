<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکو ساخت">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ همهٔ آفریده‌ها را دربرمی‌گیرد">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه؛ نیز شَیء: چیز یا امر؛ جمع آن اشیاء است." data-context="چیز؛ هر آفریده در این عبارت">شَىءٍ</button>
    <button class="word-link" type="button" data-word="خَلَقَهُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آن را آفرید">خَلَقَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبَدَأَ" data-root="ب د أ" data-root-meaning="آغاز کردن، نخستین بار انجام دادن و شروع یک کار یا جریان؛ در سیاق آفرینش، نخستین بار پدید آوردن." data-learn-more="/quran-terminology/fa/roots/b-d-a/" data-context="و آغاز کرد؛ آفرینش انسان را شروع کرد">وَبَدَأَ</button>
    <button class="word-link" type="button" data-word="خَلقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش">خَلقَ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ نوع انسان در این عبارت">الإِنسٰنِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="طينٍ" data-root="ط ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-n/" data-root-meaning="گل، از آمیزه آب و خاک." data-context="گِل؛ ماده یا منشأِ بیان‌شده برای آغاز">طينٍ</button>
  </p>
  <p class="farsi-verse">همان که هر چیزی را که آفرید نیکو ساخت و آفرینش انسان را از گل آغاز کرد؛</p>
</section>
