<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَتَجافىٰ" data-root="ج ف و" data-root-meaning="فاصله گرفتن و دور ماندن؛ در روابط انسانی، روی‌گردانی و بی‌مهری." data-context="دور می‌شود و فاصله می‌گیرد؛ وصف پهلوهای آنان در نسبت با بسترها." data-learn-more="/quran-terminology/fa/roots/j-f-w/">تَتَجافىٰ</button>
    <button class="word-link" type="button" data-word="جُنوبُهُم" data-root="ج ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-b/" data-root-meaning="پهلو، کنار و ناحیه؛ اجتناب: کنار گرفتن و دوری کردن؛ جُنُب وضعیت آیینیِ مشخصی است." data-context="پهلوهای آنان؛ فاعلِ دور شدن از بسترها.">جُنوبُهُم</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="المَضاجِعِ" data-root="ض ج ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-j-ayn/" data-root-meaning="بر پهلو خوابیدن؛ مضجع: جای خواب." data-context="بسترها و جایگاه‌های دراز کشیدن که پهلوها از آنها فاصله می‌گیرند.">المَضاجِعِ</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="می‌خوانند؛ روی آوردن به پروردگار با دعا و درخواست.">يَدعونَ</button>
    <button class="word-link" type="button" data-word="رَبَّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ آن‌که او را با بیم و امید می‌خوانند.">رَبَّهُم</button>
    <button class="word-link" type="button" data-word="خَوفًا" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="با بیم؛ یکی از دو حالت همراه با خواندن پروردگار.">خَوفًا</button>
    <button class="word-link" type="button" data-word="وَطَمَعًا" data-root="ط م ع" data-learn-more="/quran-terminology/fa/roots/tt-m-ayn/" data-root-meaning="چشم‌داشت و گرایش درونی به دستیابی به امر مطلوبی که ممکن پنداشته می‌شود" data-context="و با امید و چشمداشت؛ حالت دیگر در کنار بیم.">وَطَمَعًا</button>
    <button class="word-link" type="button" data-word="وَمِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="روزی‌شان داده‌ایم؛ آنچه از آن انفاق می‌کنند.">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="انفاق می‌کنند؛ از روزیِ داده‌شده می‌بخشند.">يُنفِقونَ</button>
  </p>
  <p class="farsi-verse">پهلوهایشان از بسترها دور می‌شود؛ پروردگارشان را با بیم و امید می‌خوانند و از آنچه روزی‌شان داده‌ایم انفاق می‌کنند.</p>
</section>
