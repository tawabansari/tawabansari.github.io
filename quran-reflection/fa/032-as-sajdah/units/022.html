  <h2 class="ayah-title">السجده ۳۲:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>

    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّن</button>

    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبِّهِ</button>

    <button class="word-link" type="button" data-word="أَعرَضَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/">أَعرَضَ</button>

    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>

    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المُجرِمينَ</button>
    <button class="word-link" type="button" data-word="مُنتَقِمونَ" data-root="ن ق م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُنتَقِمونَ</button>
  </p>
  <p class="farsi-verse">و چه کسی ستمگرتر از آن است که به آیات پروردگارش یادآوری شود، سپس از آن‌ها روی بگرداند؟ همانا ما از مجرمان انتقام می‌گیریم.</p>
