<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَظلَمُ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمکارتر">أَظلَمُ</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّن</button>
    <button class="word-link" type="button" data-word="ذُكِّرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یادآوری شد">ذُكِّرَ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="با نشانه‌های">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار خود">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَعرَضَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="روی گرداند">أَعرَضَ</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنها</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمينَ</button>
    <button class="word-link" type="button" data-word="مُنتَقِمونَ" data-root="ن ق م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-q-m/" data-root-meaning="ناپسند داشتن و مؤاخذه؛ انتقام: کیفر دادن در پاسخ به کردار." data-context="کیفر دهندگان">مُنتَقِمونَ</button>
  </p>
  <p class="farsi-verse">و چه کسی ستمگرتر از آن است که به آیات پروردگارش یادآوری شود، سپس از آن‌ها روی بگرداند؟ همانا ما از مجرمان انتقام می‌گیریم.</p>
</section>
