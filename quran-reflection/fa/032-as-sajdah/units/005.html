<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">السجده ۳۲:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُدَبِّرُ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="تدبیر می‌کند؛ امور را از آسمان به زمین سامان می‌دهد.">يُدَبِّرُ</button>
    <button class="word-link" type="button" data-word="الأَمرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="امر؛ آنچه از آسمان به زمین تدبیر می‌شود.">الأَمرَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ مبدأِ یادشده در بیان تدبیر.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ سوی دیگرِ جریانِ تدبیر.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَعرُجُ" data-root="ع ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-j/" data-root-meaning="بالا رفتن؛ معارج: راه‌های صعود؛ اعرج: دارای لنگی." data-context="بالا می‌رود؛ دربارهٔ عروج امر به سوی او.">يَعرُجُ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی؛ زمانِ یادشده برای عروج.">يَومٍ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="است؛ در بیانِ اندازهٔ آن روز.">كانَ</button>
    <button class="word-link" type="button" data-word="مِقدارُهُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="اندازهٔ آن؛ ضمیر به روز برمی‌گردد.">مِقدارُهُ</button>
    <button class="word-link" type="button" data-word="أَلفَ" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أَلَّفَ؛ پیوند دادن، خو گرفتن و برقرار شدن انس و همراهی" data-context="هزار؛ شمارِ سال‌ها در مقایسهٔ زمانی.">أَلفَ</button>
    <button class="word-link" type="button" data-word="سَنَةٍ" data-root="س ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است." data-context="سال؛ واحدِ سنجشِ زمان در مقایسه.">سَنَةٍ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَعُدّونَ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="می‌شمارید؛ دربارهٔ شمارش زمان توسط مخاطبان.">تَعُدّونَ</button>
  </p>
  <p class="farsi-verse">کار را از آسمان تا زمین تدبیر می‌کند؛ سپس در روزی که اندازه‌اش هزار سال از آنچه می‌شمارید است، به سوی او بالا می‌رود.</p>
</section>
