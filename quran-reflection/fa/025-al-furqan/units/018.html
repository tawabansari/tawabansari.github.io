<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۱8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="سُبحٰنَكَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">سُبحٰنَكَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="يَنبَغى" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد">يَنبَغى</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="نَتَّخِذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">نَتَّخِذَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِكَ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَولِياءَ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">أَولِياءَ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="مَتَّعتَهُم" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">مَتَّعتَهُم</button>
    <button class="word-link" type="button" data-word="وَءاباءَهُم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">وَءاباءَهُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="نَسُوا" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل">نَسُوا</button>
    <button class="word-link" type="button" data-word="الذِّكرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">الذِّكرَ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانوا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومًا</button>
    <button class="word-link" type="button" data-word="بورًا" data-root="ب و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بورًا</button>
  </p>
  <p class="farsi-verse">گفتند: تو پاکی! ما را نسزد که جز تو سرپرستانی بگیریم؛ ولی آنان و پدرانشان را بهره‌مند کردی تا یادآوری را فراموش کردند و مردمی تباه شدند.</p>
</section>
