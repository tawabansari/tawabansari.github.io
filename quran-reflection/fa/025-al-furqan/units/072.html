<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:7۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشهَدونَ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهی می‌دهند یا حاضر می‌شوند؛ این رفتار در برابر زور از آنان نفی شده است.">يَشهَدونَ</button>
    <button class="word-link" type="button" data-word="الزّورَ" data-root="ز و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-w-r/" data-root-meaning="کج شدن و متمایل گشتن؛ زور: سخن منحرف از حقیقت." data-context="زور و ناراستی؛ آنچه گواهی یا حضور در آن نفی شده است.">الزّورَ</button>
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="مَرّوا" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="می‌گذرند؛ عبور از کنار سخن یا رفتار لغو.">مَرّوا</button>
    <button class="word-link" type="button" data-word="بِاللَّغوِ" data-root="ل غ و" data-learn-more="/quran-terminology/fa/roots/l-gh-w/" data-root-meaning="سخن یا کار بی‌اعتبار و بی‌حاصل، یا چیزی که در حساب نمی‌آید؛ در شاخهٔ گفتاری، سخن گفتن و ایجاد هیاهو." data-context="سخن یا رفتار بیهوده؛ آنچه بندگان رحمان بزرگوارانه از کنارش می‌گذرند.">بِاللَّغوِ</button>
    <button class="word-link" type="button" data-word="مَرّوا" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="می‌گذرند؛ بیان دوبارهٔ عبور با تأکید بر شیوهٔ آن.">مَرّوا</button>
    <button class="word-link" type="button" data-word="كِرامًا" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی." data-context="بزرگوارانه و با حفظ کرامت؛ حالت آنان هنگام گذشتن از لغو.">كِرامًا</button>
  </p>
  <p class="farsi-verse">و آنان که به دروغ گواهی نمی‌دهند و چون بر بیهودگی بگذرند، بزرگوارانه می‌گذرند،</p>
</section>
