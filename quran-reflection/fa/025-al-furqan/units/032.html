  <p class="farsi-verse">و کسانی که کفر ورزیدند گفتند: چرا قرآن یک‌باره بر او فرو فرستاده نشده است؟ این‌گونه است تا دلت را با آن استوار کنیم، و آن را به‌آرامی و پیوسته خواندیم.</p>
