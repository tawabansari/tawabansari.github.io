<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="لَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَولا</button>
    <button class="word-link" type="button" data-word="نُزِّلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">نُزِّلَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="القُرءانُ" data-root="ق ر أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-a/" data-root-meaning="خواندن و تلاوت؛ قروء: دوره‌های قاعدگی یا پاکی، با اختلاف در تفسیر.">القُرءانُ</button>
    <button class="word-link" type="button" data-word="جُملَةً" data-root="ج م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-m-l/" data-root-meaning="در شاخه‌های مختلف: جمع و توده، جمال و زیبایی، و جمل به معنای شتر.">جُملَةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن">وٰحِدَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لِنُثَبِّتَ" data-root="ث ب ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-b-t/" data-root-meaning="پایدار ماندن، استوار بودن و استوار ساختن.">لِنُثَبِّتَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="فُؤادَكَ" data-root="ف أ د" data-root-meaning="«دل» مناسب‌ترین معادل پایه فؤاد است؛ دلی که در کاربردهای قرآنی می‌تواند با دریافت، ادراک، گرایش، تاثیرپذیری و پایداری ارتباط داشته باشد." data-learn-more="/quran-terminology/fa/roots/f-a-d/">فُؤادَكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَرَتَّلنٰهُ" data-root="ر ت ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-t-l/" data-root-meaning="منظم و روشن ادا کردن سخن یا خواندن با تأنّی.">وَرَتَّلنٰهُ</button>
    <button class="word-link" type="button" data-word="تَرتيلًا" data-root="ر ت ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-t-l/" data-root-meaning="منظم و روشن ادا کردن سخن یا خواندن با تأنّی.">تَرتيلًا</button>
  </p>
  <p class="farsi-verse">و کسانی که کفر ورزیدند گفتند: چرا قرآن یک‌باره بر او فرو فرستاده نشده است؟ این‌گونه است تا دلت را با آن استوار کنیم، و آن را به‌آرامی و پیوسته خواندیم.</p>
</section>
