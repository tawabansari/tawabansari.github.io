<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يَبيتونَ" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/">يَبيتونَ</button>
    <button class="word-link" type="button" data-word="لِرَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">لِرَبِّهِم</button>
    <button class="word-link" type="button" data-word="سُجَّدًا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">سُجَّدًا</button>
    <button class="word-link" type="button" data-word="وَقِيٰمًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَقِيٰمًا</button>
  </p>
  <p class="farsi-verse">و آنان که شب را برای پروردگارشان در سجده و قیام می‌گذرانند،</p>
</section>
