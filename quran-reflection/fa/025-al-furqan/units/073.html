<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:7۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="ذُكِّروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یادآوری شوند؛ آیات پروردگار به آنان یادآوری می‌شود.">ذُكِّروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="به آیات؛ نشانه‌هایی که موضوع یادآوری‌اند.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ پروردگاری که آیات به او نسبت داده شده‌اند.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَخِرّوا" data-root="خ ر ر" data-root-meaning="فرو افتادن و حرکت به سوی پایین؛ در شاخه‌های لغوی دیگر، جریان و صدای آن." data-context="فرو می‌افتند؛ با «لم» و حالت «کر و کور» نفی شده، دربارهٔ کیفیت برخورد با آیات." data-learn-more="/quran-terminology/fa/roots/kh-r-r/">يَخِرّوا</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="صُمًّا" data-root="ص م م" data-learn-more="/quran-terminology/fa/roots/sad-m-m/" data-root-meaning="کری، بسته بودن راه شنیدن، سختی، انسداد، و نفوذناپذیری نسبت به صدا یا پیام" data-context="کر؛ در حالت نفی‌شده، دریافت نکردن آگاهانهٔ یادآوری.">صُمًّا</button>
    <button class="word-link" type="button" data-word="وَعُميانًا" data-root="ع م ي" data-learn-more="/quran-terminology/fa/roots/ayn-m-y/" data-root-meaning="کوری، نادیدن، پوشیده شدن راه دیدن، ابهام، و از دست رفتن توان مشاهده یا تشخیص" data-context="و کور؛ در حالت نفی‌شده، نداشتن بصیرت در برابر آیات.">وَعُميانًا</button>
  </p>
  <p class="farsi-verse">و آنان که چون به آیات پروردگارشان یادآوری شوند، کر و کور بر آنها فرو نمی‌افتند،</p>
</section>
