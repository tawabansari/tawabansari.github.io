<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ فعل نقلِ گفتار گروهی که پس از آن نام برده می‌شود.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند و نپذیرفتند؛ وصف گروه مورد بحث.">كَفَروا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="إِفكٌ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="ناراستی؛ عنوانی که مخالفان به قرآن نسبت می‌دهند، نه تأیید داوری آنان.">إِفكٌ</button>
    <button class="word-link" type="button" data-word="افتَرىٰهُ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="آن را برساخته است؛ ادعای مخالفان درباره پیام.">افتَرىٰهُ</button>
    <button class="word-link" type="button" data-word="وَأَعانَهُ" data-root="ع و ن" data-learn-more="/quran-terminology/fa/roots/ayn-w-n/" data-root-meaning="یاری، افزودن توان، طلب پشتیبانی و رسیدن به مرحلهٔ میانی" data-context="و او را یاری کرده‌اند؛ در ادعای مخالفان، گروهی دیگر.">وَأَعانَهُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروهی از مردم؛ کسانی که به ادعای مخالفان کمک کرده‌اند.">قَومٌ</button>
    <button class="word-link" type="button" data-word="ءاخَرونَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="دیگر؛ وصف آن گروه در ادعای کمک به برساختن پیام.">ءاخَرونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="جاءو" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="آوردند؛ درباره آوردن بهتان یا سخن ستمگرانه.">جاءو</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم؛ وصف ادعای مخالفان درباره پیام.">ظُلمًا</button>
    <button class="word-link" type="button" data-word="وَزورًا" data-root="ز و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-w-r/" data-root-meaning="کج شدن و متمایل گشتن؛ زور: سخن منحرف از حقیقت." data-context="و ناراستی؛ وصف ادعای مخالفان.">وَزورًا</button>
  </p>
  <p class="farsi-verse">و کسانی که کفر ورزیدند گفتند: این جز دروغی نیست که آن را ساخته است و گروهی دیگر او را بر آن یاری کرده‌اند. پس بی‌گمان ستم و دروغ آورده‌اند.</p>
</section>
