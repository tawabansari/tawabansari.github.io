<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِنُحـِۧىَ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">لِنُحـِۧىَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="بَلدَةً" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»">بَلدَةً</button>
    <button class="word-link" type="button" data-word="مَيتًا" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مَيتًا</button>
    <button class="word-link" type="button" data-word="وَنُسقِيَهُ" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب.">وَنُسقِيَهُ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="خَلَقنا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنا</button>
    <button class="word-link" type="button" data-word="أَنعٰمًا" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">أَنعٰمًا</button>
    <button class="word-link" type="button" data-word="وَأَناسِىَّ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">وَأَناسِىَّ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">كَثيرًا</button>
  </p>
  <p class="farsi-verse">تا با آن سرزمینی مرده را زنده کنیم و آن را به دام‌ها و انسان‌های بسیاری از آنچه آفریده‌ایم بنوشانیم.</p>
</section>
