  <p class="farsi-verse">پربرکت است آن‌که اگر بخواهد، بهتر از آن را برای تو قرار می‌دهد: باغ‌هایی که از زیر آنها نهرها روان است، و برای تو کاخ‌هایی قرار می‌دهد.</p>
