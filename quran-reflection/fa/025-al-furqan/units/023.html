<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَدِمنا" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن">وَقَدِمنا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">عَمِلوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَمَلٍ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">عَمَلٍ</button>
    <button class="word-link" type="button" data-word="فَجَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">فَجَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="هَباءً" data-root="ه ب و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">هَباءً</button>
    <button class="word-link" type="button" data-word="مَنثورًا" data-root="ن ث ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَنثورًا</button>
  </p>
  <p class="farsi-verse">و به آنچه از کار انجام داده‌اند روی می‌آوریم، پس آن را غباری پراکنده می‌کنیم.</p>
