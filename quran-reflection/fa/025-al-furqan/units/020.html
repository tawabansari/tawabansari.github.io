  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="قَبلَكَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/">قَبلَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">المُرسَلينَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَيَأكُلونَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/">لَيَأكُلونَ</button>
    <button class="word-link" type="button" data-word="الطَّعامَ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/">الطَّعامَ</button>
    <button class="word-link" type="button" data-word="وَيَمشونَ" data-root="م ش ي" data-learn-more="/quran-terminology/fa/roots/m-sh-y/" data-root-meaning="راه رفتن، گام برداشتن، حرکت کردن بر زمین؛ و در میدان گسترده‌تر، پیش رفتن در یک مسیر، روش، رفتار یا سبک زندگی">وَيَمشونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>

    <button class="word-link" type="button" data-word="بَعضَكُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/">بَعضَكُم</button>
    <button class="word-link" type="button" data-word="لِبَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/">لِبَعضٍ</button>
    <button class="word-link" type="button" data-word="فِتنَةً" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/">فِتنَةً</button>
    <button class="word-link" type="button" data-word="أَتَصبِرونَ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/">أَتَصبِرونَ</button>

    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="بَصيرًا" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/">بَصيرًا</button>
  </p>
  <p class="farsi-verse">و پیش از تو هیچ‌یک از فرستادگان را نفرستادیم مگر اینکه غذا می‌خوردند و در بازارها راه می‌رفتند. و برخی از شما را آزمونی برای برخی دیگر قرار دادیم؛ آیا شکیبایی می‌کنید؟ و پروردگارت بیناست.</p>
</section>
