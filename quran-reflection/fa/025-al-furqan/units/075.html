<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:7۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="يُجزَونَ" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">يُجزَونَ</button>
    <button class="word-link" type="button" data-word="الغُرفَةَ" data-root="غ ر ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الغُرفَةَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="صَبَروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">صَبَروا</button>
    <button class="word-link" type="button" data-word="وَيُلَقَّونَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">وَيُلَقَّونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="تَحِيَّةً" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">تَحِيَّةً</button>
    <button class="word-link" type="button" data-word="وَسَلٰمًا" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">وَسَلٰمًا</button>
  </p>
  <p class="farsi-verse">آنان به سبب شکیبایی‌شان غرفه را پاداش می‌گیرند و در آن با درود و سلام پذیرفته می‌شوند،</p>
