<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="الرَّسولُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">الرَّسولُ</button>
    <button class="word-link" type="button" data-word="يٰرَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">يٰرَبِّ</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="قَومِى" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومِى</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">القُرءانَ</button>
    <button class="word-link" type="button" data-word="مَهجورًا" data-root="ه ج ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَهجورًا</button>
  </p>
  <p class="farsi-verse">و رسول گفت: پروردگارا، قوم من این قرآن را وانهاده گرفتند.</p>
</section>
