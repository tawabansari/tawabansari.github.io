<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ آغازِ سخنِ رسول.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الرَّسولُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="رسول؛ گویندهٔ سخن.">الرَّسولُ</button>
    <button class="word-link" type="button" data-word="يٰرَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارا؛ خطابِ رسول.">يٰرَبِّ</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="قَومِى" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="قوم من؛ گروهِ مخاطبِ پیامبر." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">قَومِى</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="گرفتند؛ در ترکیب با «مهجورًا»، متروک ساختند.">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنی که قومِ رسول آن را رها کرده‌اند." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="مَهجورًا" data-root="ه ج ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-j-r/" data-root-meaning="جدا شدن و ترک کردن؛ هجرت: از جایی کوچ کردن." data-context="رهاشده؛ وصفِ رفتار قوم با قرآن.">مَهجورًا</button>
  </p>
  <p class="farsi-verse">و رسول گفت: پروردگارا، قوم من این قرآن را وانهاده گرفتند.</p>
</section>
