<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقُلنَا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">فَقُلنَا</button>
    <button class="word-link" type="button" data-word="اذهَبا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">اذهَبا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">القَومِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَدَمَّرنٰهُم" data-root="د م ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَدَمَّرنٰهُم</button>
    <button class="word-link" type="button" data-word="تَدميرًا" data-root="د م ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَدميرًا</button>
  </p>
  <p class="farsi-verse">پس گفتیم: به سوی قومی بروید که آیات ما را تکذیب کردند؛ پس آنان را به‌تمامی نابود کردیم.</p>
