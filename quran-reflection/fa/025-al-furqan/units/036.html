<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقُلنَا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس گفتیم؛ فرمان خداوند به موسی و هارون.">فَقُلنَا</button>
    <button class="word-link" type="button" data-word="اذهَبا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="بروید؛ خطاب به موسی و هارون، هر دو.">اذهَبا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قوم؛ گروهی که آیات را تکذیب کردند.">القَومِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="تکذیب کردند؛ آیات الهی را دروغ شمردند.">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات ما؛ نشانه‌هایی که تکذیب شدند.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَدَمَّرنٰهُم" data-root="د م ر" data-learn-more="/quran-terminology/fa/roots/d-m-r/" data-root-meaning="هلاکت و نابودی شدید؛ تدمیر: نابود کردن یا ویران ساختن. در شاخهٔ دیگری از عربی، دَمَرَ به وارد شدن یا هجوم بردن گفته می‌شود." data-context="پس آنان را نابود کردیم؛ گروه تکذیب‌کنندهٔ یادشده.">فَدَمَّرنٰهُم</button>
    <button class="word-link" type="button" data-word="تَدميرًا" data-root="د م ر" data-learn-more="/quran-terminology/fa/roots/d-m-r/" data-root-meaning="هلاکت و نابودی شدید؛ تدمیر: نابود کردن یا ویران ساختن. در شاخهٔ دیگری از عربی، دَمَرَ به وارد شدن یا هجوم بردن گفته می‌شود." data-context="نابودسازی؛ مصدر منصوب که نابودی را تأکید می‌کند.">تَدميرًا</button>
  </p>
  <p class="farsi-verse">پس گفتیم: به سوی قومی بروید که آیات ما را تکذیب کردند؛ پس آنان را به‌تمامی نابود کردیم.</p>
</section>
