<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="مَدَّ" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر">مَدَّ</button>
    <button class="word-link" type="button" data-word="الظِّلَّ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن.">الظِّلَّ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شاءَ</button>
    <button class="word-link" type="button" data-word="لَجَعَلَهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">لَجَعَلَهُ</button>
    <button class="word-link" type="button" data-word="ساكِنًا" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن">ساكِنًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="جَعَلنَا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنَا</button>
    <button class="word-link" type="button" data-word="الشَّمسَ" data-root="ش م س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الشَّمسَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="دَليلًا" data-root="د ل ل" data-learn-more="/quran-terminology/fa/roots/d-l-l/" data-root-meaning="از نشان دادن راه تا نشانه‌ای که چیزی را قابل شناخت می‌کند">دَليلًا</button>
  </p>
  <p class="farsi-verse">آیا به پروردگارت ننگریسته‌ای که چگونه سایه را گسترد؟ و اگر می‌خواست آن را ساکن قرار می‌داد؛ سپس خورشید را راهنمای آن قرار دادیم.</p>
</section>
