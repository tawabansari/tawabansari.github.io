<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۱7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روزی که؛ زمانِ گردآوری و پرسش.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يَحشُرُهُم" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="آنان و آنچه را جز خداوند می‌پرستند گرد می‌آورد." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">يَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَعبُدونَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="می‌پرستند؛ آنچه جز خداوند پرستیده می‌شد.">يَعبُدونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="جز و غیر؛ در ترکیب «من دون الله».">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس می‌گوید؛ پرسش از معبودهای ادعایی.">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="ءَأَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ءَأَنتُم</button>
    <button class="word-link" type="button" data-word="أَضلَلتُم" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه" data-context="گمراه کردید؛ پرسش از سببِ گمراهی.">أَضلَلتُم</button>
    <button class="word-link" type="button" data-word="عِبادى" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بندگان من؛ کسانی که دربارهٔ گمراهی‌شان پرسیده می‌شود.">عِبادى</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="ضَلُّوا" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه" data-context="گمراه شدند؛ احتمالِ مطرح‌شده در پرسش.">ضَلُّوا</button>
    <button class="word-link" type="button" data-word="السَّبيلَ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ آنچه از آن دور شده‌اند.">السَّبيلَ</button>
  </p>
  <p class="farsi-verse">و روزی که آنان و آنچه را جز آن معبود یگانه می‌پرستند گرد آورد، پس بگوید: آیا شما این بندگان مرا گمراه کردید، یا خود راه را گم کردند؟</p>
</section>
