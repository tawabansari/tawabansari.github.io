<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَأتونَكَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">يَأتونَكَ</button>
    <button class="word-link" type="button" data-word="بِمَثَلٍ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">بِمَثَلٍ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="جِئنٰكَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/">جِئنٰكَ</button>

  </p>
  <p class="farsi-verse">و هیچ مَثَلی نزد تو نمی‌آورند مگر آنکه حق و توضیحی بهتر را برای تو می‌آوریم.</p>
