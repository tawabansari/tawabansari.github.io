  <p class="farsi-verse">نزدیک بود ما را از معبودانمان گمراه کند، اگر بر آنها شکیبایی نمی‌کردیم. و هنگامی که عذاب را ببینند، خواهند دانست چه کسی از راه گمراه‌تر است.</p>
