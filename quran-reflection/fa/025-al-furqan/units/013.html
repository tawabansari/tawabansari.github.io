<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="أُلقوا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-context="آنان در جایگاهی تنگ از آتش افکنده شوند." data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه؛ و «إلقاء»، افکندن، قرار دادن یا رساندن چیزی.">أُلقوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="مَكانًا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="جایگاهی از آتش که با صفت تنگ توصیف می‌شود.">مَكانًا</button>
    <button class="word-link" type="button" data-word="ضَيِّقًا" data-root="ض ي ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-y-q/" data-root-meaning="تنگی و در تنگنا بودن یا قرار دادن." data-context="تنگ و محدود؛ وصف جایگاهی که در آن افکنده می‌شوند.">ضَيِّقًا</button>
    <button class="word-link" type="button" data-word="مُقَرَّنينَ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره." data-context="در حالی که بسته و به‌هم‌پیوسته‌اند.">مُقَرَّنينَ</button>
    <button class="word-link" type="button" data-word="دَعَوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="در آنجا هلاکت را ندا می‌کنند و فریاد برمی‌آورند.">دَعَوا</button>
    <button class="word-link" type="button" data-word="هُنالِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُنالِكَ</button>
    <button class="word-link" type="button" data-word="ثُبورًا" data-root="ث ب ر" data-root-meaning="«ث ب ر» در شاخه قرآنی خود به هلاکت، تباهی و فرجام زیان‌بار اشاره دارد. «مَثْبُور» وصف شخص گرفتار چنین وضعیتی است و «ثُبُور» نام هلاکت و تباهی است که در آیات مربوط به آخرت، موضوع فریاد و ناله انسان قرار می‌گیرد." data-context="هلاکت و تباهی که گرفتاران عذاب در آن جایگاه تنگ آن را فریاد می‌زنند؛ خود واژه نام هلاکت است." data-learn-more="/quran-terminology/fa/roots/th-b-r/">ثُبورًا</button>
  </p>
  <p class="farsi-verse">و هنگامی که به جایی تنگ از آن افکنده شوند، به هم بسته، در آنجا نابودی می‌خوانند.</p>
</section>
