<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="أُلقوا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">أُلقوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="مَكانًا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">مَكانًا</button>
    <button class="word-link" type="button" data-word="ضَيِّقًا" data-root="ض ي ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ضَيِّقًا</button>
    <button class="word-link" type="button" data-word="مُقَرَّنينَ" data-root="ق ر ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُقَرَّنينَ</button>
    <button class="word-link" type="button" data-word="دَعَوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">دَعَوا</button>
    <button class="word-link" type="button" data-word="هُنالِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُنالِكَ</button>
    <button class="word-link" type="button" data-word="ثُبورًا" data-root="ث ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ثُبورًا</button>
  </p>
  <p class="farsi-verse">و هنگامی که به جایی تنگ از آن افکنده شوند، به هم بسته، در آنجا نابودی می‌خوانند.</p>
</section>
