<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنا</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="نَبِىٍّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/">نَبِىٍّ</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/">عَدُوًّا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المُجرِمينَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِرَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">بِرَبِّكَ</button>
    <button class="word-link" type="button" data-word="هادِيًا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">هادِيًا</button>
    <button class="word-link" type="button" data-word="وَنَصيرًا" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/">وَنَصيرًا</button>
  </p>
  <p class="farsi-verse">و این‌گونه برای هر پیامبری دشمنی از مجرمان قرار دادیم؛ و پروردگارت به‌عنوان راهنما و یاور کافی است.</p>
