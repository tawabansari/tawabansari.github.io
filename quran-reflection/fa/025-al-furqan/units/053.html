<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="مَرَجَ" data-root="م ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-j/" data-root-meaning="آمیختگی و روانه ساختن؛ مارج: شعله آمیخته؛ مرجان: ماده یا گوهر دریایی، با شرح‌های متفاوت." data-context="دو پهنهٔ آب را روان و رها ساخت؛ پیوندِ این تعبیر با آمیختگی نیز در تفسیر بررسی شده است.">مَرَجَ</button>
    <button class="word-link" type="button" data-word="البَحرَينِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دو پهنهٔ آب؛ در ادامه یکی شیرین و دیگری شور توصیف می‌شود.">البَحرَينِ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="عَذبٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="آب شیرین و خوشگوار؛ این کاربرد به کیفر و عذاب اشاره ندارد.">عَذبٌ</button>
    <button class="word-link" type="button" data-word="فُراتٌ" data-root="ف ر ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-t/" data-root-meaning="آب بسیار شیرین و گوارا." data-context="بسیار شیرین و گوارا؛ وصفِ کیفیت نوشیدنیِ آب.">فُراتٌ</button>
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="مِلحٌ" data-root="م ل ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-h/" data-root-meaning="نمک و شور بودن." data-context="شور؛ وصفِ پهنهٔ دوم آب در برابر آب شیرین.">مِلحٌ</button>
    <button class="word-link" type="button" data-word="أُجاجٌ" data-root="أ ج ج" data-learn-more="/quran-terminology/fa/roots/a-j-j/" data-root-meaning="بسیار شور و گزنده؛ وصف آب با شوری شدید و مزه ناخوشایند." data-context="بسیار شور و گزنده؛ تأکید بر ناگواری آب برای نوشیدن.">أُجاجٌ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="میان دو پهنهٔ آب حایل و بازدارندگی قرار داد.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن دو پهنهٔ آب؛ بیانِ جایگاه حایل.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="بَرزَخًا" data-root="ب ر ز خ" data-root-meaning="حد، فاصله یا حایلی میان دو چیز یا دو وضعیت؛ نوع مانع و امکان گذر از آن از سیاق معلوم می‌شود." data-context="حایلی میان آب شیرین و شور؛ خود واژه جنس و ساختمان مادی آن را تعیین نمی‌کند." data-learn-more="/quran-terminology/fa/roots/b-r-z-kh/" data-root-note="حروفِ نمایه‌سازیِ واژه؛ اشتقاق تاریخی و احتمال وام‌واژه بودن آن محل اختلاف است.">بَرزَخًا</button>
    <button class="word-link" type="button" data-word="وَحِجرًا" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی" data-context="منع و بازداشتن؛ در کنار «برزخ»، بر بازدارندگی تأکید می‌کند.">وَحِجرًا</button>
    <button class="word-link" type="button" data-word="مَحجورًا" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی" data-context="منع‌شده و بازداشته؛ وصفی که تعبیرِ منع را تأکید می‌کند.">مَحجورًا</button>
  </p>
  <p class="farsi-verse">و اوست که دو دریا را روان ساخت؛ این شیرین و گوارا، و آن شور و تلخ است؛ و میان آن دو برزخی و حریمی ممنوع قرار داد.</p>
</section>
