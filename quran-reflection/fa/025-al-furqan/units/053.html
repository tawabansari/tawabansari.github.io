<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="مَرَجَ" data-root="م ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-j/" data-root-meaning="آمیختگی و روانه ساختن؛ مارج: شعله آمیخته؛ مرجان: ماده یا گوهر دریایی، با شرح‌های متفاوت.">مَرَجَ</button>
    <button class="word-link" type="button" data-word="البَحرَينِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان">البَحرَينِ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="عَذبٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذبٌ</button>
    <button class="word-link" type="button" data-word="فُراتٌ" data-root="ف ر ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-t/" data-root-meaning="آب بسیار شیرین و گوارا.">فُراتٌ</button>
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="مِلحٌ" data-root="م ل ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-h/" data-root-meaning="نمک و شور بودن.">مِلحٌ</button>
    <button class="word-link" type="button" data-word="أُجاجٌ" data-root="أ ج ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-j-j/" data-root-meaning="شدت و برافروختگی؛ أجاج: آب بسیار شور و ناگوار.">أُجاجٌ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُما</button>
    <button class="word-link" type="button" data-word="بَرزَخًا" data-context="برزخ: مانع یا حائل میان دو چیز." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">بَرزَخًا</button>
    <button class="word-link" type="button" data-word="وَحِجرًا" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی">وَحِجرًا</button>
    <button class="word-link" type="button" data-word="مَحجورًا" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی">مَحجورًا</button>
  </p>
  <p class="farsi-verse">و اوست که دو دریا را روان ساخت؛ این شیرین و گوارا، و آن شور و تلخ است؛ و میان آن دو برزخی و حریمی ممنوع قرار داد.</p>
</section>
