<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالوا</button>
    <button class="word-link" type="button" data-word="أَسٰطيرُ" data-root="س ط ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَسٰطيرُ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">الأَوَّلينَ</button>
    <button class="word-link" type="button" data-word="اكتَتَبَها" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">اكتَتَبَها</button>
    <button class="word-link" type="button" data-word="فَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهِىَ</button>
    <button class="word-link" type="button" data-word="تُملىٰ" data-root="م ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُملىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="ب ك ر" data-learn-more="/quran-terminology/fa/roots/b-k-r/" data-root-meaning="از آغاز روز و پیش‌افتادگی تا باقی بودن در مرحلهٔ نخستین">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَأَصيلًا" data-root="أ ص ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَصيلًا</button>
  </p>
  <p class="farsi-verse">و گفتند: افسانه‌های پیشینیان است که آنها را نویسانده، پس بامداد و شامگاه بر او املا می‌شود.</p>
</section>
