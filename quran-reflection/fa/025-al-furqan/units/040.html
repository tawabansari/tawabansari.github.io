<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَتَوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أَتَوا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="القَريَةِ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن.">القَريَةِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="أُمطِرَت" data-root="م ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-tt-r/" data-root-meaning="باران و باریدن؛ خوشایند یا آسیب‌رسان بودن آن را سیاق روشن می‌کند.">أُمطِرَت</button>
    <button class="word-link" type="button" data-word="مَطَرَ" data-root="م ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-tt-r/" data-root-meaning="باران و باریدن؛ خوشایند یا آسیب‌رسان بودن آن را سیاق روشن می‌کند.">مَطَرَ</button>
    <button class="word-link" type="button" data-word="السَّوءِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّوءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلَم</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكونوا</button>
    <button class="word-link" type="button" data-word="يَرَونَها" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">يَرَونَها</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="ر ج و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ نیز کناره و جانب؛ تأخیر انداختن در برخی صورت‌ها با «رجأ» بررسی می‌شود.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="نُشورًا" data-root="ن ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-r/" data-root-meaning="گستردن و پراکندن؛ نشور: برخاستن و زنده شدن دوباره.">نُشورًا</button>
  </p>
  <p class="farsi-verse">و بی‌گمان بر آن آبادی که باران بد بر آن بارانده شد گذر کرده‌اند؛ آیا آن را نمی‌دیدند؟ بلکه امید برانگیخته‌شدن نداشتند.</p>
</section>
