<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۳7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">وَقَومَ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٍ</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمّا</button>
    <button class="word-link" type="button" data-word="كَذَّبُوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/">كَذَّبُوا</button>
    <button class="word-link" type="button" data-word="الرُّسُلَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">الرُّسُلَ</button>
    <button class="word-link" type="button" data-word="أَغرَقنٰهُم" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/">أَغرَقنٰهُم</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">ءايَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَعتَدنا" data-root="ع ت د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَعتَدنا</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/">أَليمًا</button>
  </p>
  <p class="farsi-verse">و قوم نوح را، هنگامی که رسولان را تکذیب کردند، غرق کردیم و آنان را برای مردم نشانه‌ای قرار دادیم؛ و برای ستمگران عذابی دردناک آماده کرده‌ایم.</p>
</section>
