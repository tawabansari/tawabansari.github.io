<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="المُلكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="فرمانروایی؛ سلطهٔ حقیقی در آن روز.">المُلكُ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="آن روز؛ زمانِ فرمانرواییِ آشکارِ یادشده.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حقیقی؛ وصفِ فرمانروایی.">الحَقُّ</button>
    <button class="word-link" type="button" data-word="لِلرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="از آنِ فرارحمن؛ فرمانروایی متعلق به صاحبِ رحمتِ فراگیر است.">لِلرَّحمٰنِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="خواهد بود؛ بیانِ وصفِ روز.">وَكانَ</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی؛ زمانِ دشوارِ یادشده.">يَومًا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کافران؛ کسانی که دشواری روز نسبت به آنان بیان شده است.">الكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="عَسيرًا" data-root="ع س ر" data-root-meaning="سختی و تنگنایی که انجام کار، تحمل وضعیت یا دستیابی به نتیجه را دشوار می‌سازد." data-context="دشوار؛ وصفِ آن روز در نسبت با کافران." data-learn-more="/quran-terminology/fa/roots/ayn-s-r/">عَسيرًا</button>
  </p>
  <p class="farsi-verse">فرمانرواییِ حق در آن روز از آنِ فرارحمن است؛ و روزی دشوار بر کافران است.</p>
</section>
