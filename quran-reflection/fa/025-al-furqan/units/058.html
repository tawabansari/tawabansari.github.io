<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۵8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَوَكَّل" data-root="و ك ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَتَوَكَّل</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الحَىِّ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَىِّ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَموتُ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">يَموتُ</button>
    <button class="word-link" type="button" data-word="وَسَبِّح" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">وَسَبِّح</button>
    <button class="word-link" type="button" data-word="بِحَمدِهِ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">بِحَمدِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/" data-root-meaning="کفایت و بسندگی؛ از برآوردن نیاز و بر عهده گرفتن کار دیگری تا کفایت آن معبود یگانه در گواهی، حسابرسی، یاری و حفاظت">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="بِذُنوبِ" data-root="ذ ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِذُنوبِ</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عِبادِهِ</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="خ ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خَبيرًا</button>
  </p>
  <p class="farsi-verse">و بر آن زنده‌ای که نمی‌میرد توکل کن و با ستایشش تسبیح گوی؛ و آگاهی او از گناهان بندگانش کافی است،</p>
