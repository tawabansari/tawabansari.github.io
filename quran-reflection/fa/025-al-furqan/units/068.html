<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۶8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">يَدعونَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِلٰهًا" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">إِلٰهًا</button>
    <button class="word-link" type="button" data-word="ءاخَرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">ءاخَرَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَقتُلونَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">يَقتُلونَ</button>
    <button class="word-link" type="button" data-word="النَّفسَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">النَّفسَ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="حَرَّمَ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت">حَرَّمَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَزنونَ" data-root="ز ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-n-y/" data-root-meaning="رابطه جنسی نامشروع؛ زنا و زن یا مرد مرتکب آن.">يَزنونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَفعَل" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">يَفعَل</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَلقَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">يَلقَ</button>
    <button class="word-link" type="button" data-word="أَثامًا" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن">أَثامًا</button>
  </p>
  <p class="farsi-verse">و آنان که همراه آن معبود یگانه معبود دیگری نمی‌خوانند و نفسی را که آن معبود یگانه حرمت نهاده جز به حق نمی‌کشند و زنا نمی‌کنند؛ و هرکس چنین کند، با کیفر روبه‌رو می‌شود.</p>
</section>
