<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">الفرقان ۲۵:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَدعُوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">تَدعُوا</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">اليَومَ</button>
    <button class="word-link" type="button" data-word="ثُبورًا" data-root="ث ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-b-r/" data-root-meaning="هلاکت، تباهی و نابودی؛ ثبور: فریاد یا خواستنِ هلاکت در سیاق عذاب.">ثُبورًا</button>
    <button class="word-link" type="button" data-word="وٰحِدًا" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن">وٰحِدًا</button>
    <button class="word-link" type="button" data-word="وَادعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">وَادعوا</button>
    <button class="word-link" type="button" data-word="ثُبورًا" data-root="ث ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-b-r/" data-root-meaning="هلاکت، تباهی و نابودی؛ ثبور: فریاد یا خواستنِ هلاکت در سیاق عذاب.">ثُبورًا</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">كَثيرًا</button>
  </p>
  <p class="farsi-verse">امروز یک نابودی نخوانید؛ نابودی بسیار بخوانید.</p>
</section>
