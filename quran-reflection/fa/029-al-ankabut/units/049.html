<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="ءايٰتٌ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات؛ نشانه‌های روشنی که در سینه‌های دانش‌یافتگان است.">ءايٰتٌ</button>
    <button class="word-link" type="button" data-word="بَيِّنٰتٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="روشن؛ وصف آشکاری آیات.">بَيِّنٰتٌ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="صُدورِ" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/" data-context="سینه‌ها؛ در بیان جایگاه درونیِ دریافت و نگهداری آیات.">صُدورِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="داده شدند؛ کسانی که دانش به آنان عطا شده است.">أوتُوا</button>
    <button class="word-link" type="button" data-word="العِلمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانش؛ آنچه به گروه یادشده داده شده است.">العِلمَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَجحَدُ" data-root="ج ح د" data-root-meaning="انکار و نپذیرفتن چیزی که موضوع اقرار و پذیرش است؛ در کاربرد برجسته آن، انکار با وجود شناخت حقیقت." data-context="انکار می‌کند؛ رد آیات ما در ساختی که آن را به ستمگران نسبت می‌دهد." data-learn-more="/quran-terminology/fa/roots/j-h-d/">يَجحَدُ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات ما؛ نشانه‌هایی که ستمگران آنها را انکار می‌کنند.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگران؛ کسانی که در ساخت حصر، انکار آیات به آنان نسبت داده شده است.">الظّٰلِمونَ</button>
  </p>
  <p class="farsi-verse">بلکه آن آیات روشنی در سینه‌های کسانی است که دانش یافته‌اند؛ و جز ستمگران آیات ما را انکار نمی‌کنند.</p>
</section>
