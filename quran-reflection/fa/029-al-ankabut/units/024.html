  <p class="farsi-verse">پس پاسخ قومش جز این نبود که گفتند: او را بکشید یا بسوزانید. پس آن معبود یگانه او را از آتش نجات داد؛ بی‌گمان در این نشانه‌هایی برای مردمی است که ایمان می‌آورند.</p>
