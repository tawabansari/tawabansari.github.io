  <h2 class="ayah-title">العنکبوت ۲۹:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="جاءَت" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَت</button>
    <button class="word-link" type="button" data-word="رُسُلُنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رُسُلُنا</button>

    <button class="word-link" type="button" data-word="سىءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سىءَ</button>

    <button class="word-link" type="button" data-word="وَضاقَ" data-root="ض ي ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَضاقَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="ذَرعًا" data-root="ذ ر ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ذَرعًا</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَخَف" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">تَخَف</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَحزَن" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون">تَحزَن</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="مُنَجّوكَ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">مُنَجّوكَ</button>
    <button class="word-link" type="button" data-word="وَأَهلَكَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">وَأَهلَكَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="امرَأَتَكَ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرَأَتَكَ</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَت</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغٰبِرينَ" data-root="غ ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الغٰبِرينَ</button>
  </p>
  <p class="farsi-verse">و چون فرستادگان ما نزد لوط آمدند، از آمدنشان اندوهگین و درمانده شد. و گفتند: نترس و اندوهگین مباش؛ ما تو و خانواده‌ات را نجات می‌دهیم، جز همسرت که از باقی‌ماندگان بود.</p>
</section>
