<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلىٰ</button>
    <button class="word-link" type="button" data-word="مَديَنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَديَنَ</button>
    <button class="word-link" type="button" data-word="أَخاهُم" data-root="أ خ و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر و خواهر؛ و به گسترش معنا، پیوند خویشاوندی، همراهی یا تعلق مشترک.">أَخاهُم</button>
    <button class="word-link" type="button" data-word="شُعَيبًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">شُعَيبًا</button>
    <button class="word-link" type="button" data-word="فَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="اعبُدُوا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">اعبُدُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَارجُوا" data-root="ر ج و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ نیز کناره و جانب؛ تأخیر انداختن در برخی صورت‌ها با «رجأ» بررسی می‌شود.">وَارجُوا</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">اليَومَ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعثَوا" data-root="ع ث و" data-learn-more="/quran-terminology/fa/roots/ayn-th-w/" data-root-meaning="پرداختن به فساد و برهم‌زدن نظم و صلاح موجود، به‌گونه‌ای که حقوق مردم و بنیادهای زندگی جمعی آسیب ببیند.">تَعثَوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع">مُفسِدينَ</button>
  </p>
  <p class="farsi-verse">و به سوی مدین، برادرشان شعیب را؛ پس گفت: ای قوم من، آن معبود یگانه را بپرستید و به روز واپسین امید داشته باشید و در زمین فسادکنان تباهی نکنید.</p>
</section>
