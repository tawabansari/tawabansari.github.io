  <p class="farsi-verse">گفت: لوط در آن است. گفتند: ما بهتر می‌دانیم چه کسی در آن است؛ او و خانواده‌اش را نجات می‌دهیم، جز همسرش که از باقی‌ماندگان بود.</p>
