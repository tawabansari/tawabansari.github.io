<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَذَّبوهُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="پس او را تکذیب کردند؛ دعوت و پیام شعیب را دروغ شمردند.">فَكَذَّبوهُ</button>
    <button class="word-link" type="button" data-word="فَأَخَذَتهُمُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="پس آنان را فراگرفت؛ رسیدن رجفه به تکذیب‌کنندگان.">فَأَخَذَتهُمُ</button>
    <button class="word-link" type="button" data-word="الرَّجفَةُ" data-root="ر ج ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-f/" data-root-meaning="لرزیدن و اضطراب؛ ارجاف: پراکندن خبرهای هراس‌آور." data-context="لرزش شدید؛ رخدادی که آنان را فراگرفت.">الرَّجفَةُ</button>
    <button class="word-link" type="button" data-word="فَأَصبَحوا" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ." data-context="پس به این حال درآمدند؛ وضعیتِ حاصل پس از رجفه.">فَأَصبَحوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="دارِهِم" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت" data-context="خانه و سرای آنان؛ محل زندگی‌ای که در آن از پا افتادند.">دارِهِم</button>
    <button class="word-link" type="button" data-word="جٰثِمينَ" data-root="ج ث م" data-root-meaning="فرونشستن، به زمین چسبیدن و در همان جایگاه ماندن؛ درباره انسان و جانور." data-context="ازپاافتاده و بی‌حرکت بر زمین مانده؛ وصف تکذیب‌کنندگان شعیب پس از رجفه در محل زندگی‌شان." data-learn-more="/quran-terminology/fa/roots/j-th-m/">جٰثِمينَ</button>
  </p>
  <p class="farsi-verse">پس او را تکذیب کردند و لرزش آنان را گرفت؛ پس در خانه‌شان از پا افتادند.</p>
</section>
