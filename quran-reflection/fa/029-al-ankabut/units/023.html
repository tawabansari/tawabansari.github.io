<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="نشانه‌های آن معبود یگانه و دیدار او را انکار کردند.">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="به نشانه‌های آن معبود یگانه؛ موضوع انکار گروه یادشده.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلِقائِهِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="و دیدار او؛ رویارویی با آن معبود یگانه.">وَلِقائِهِ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="يَئِسوا" data-root="ي أ س" data-learn-more="/quran-terminology/fa/roots/y-a-s/" data-root-meaning="بریدن امید و از دست دادن انتظارِ تحقق چیزی؛ استیأس، نومید شدن یا رسیدن به نومیدی؛ یئوس، وصف برجستهٔ نومیدی. در رعد ۱۳:۳۱، دانستن و روشن شدن نیز به‌عنوان خوانشی اختلافی مطرح است." data-context="از رحمت من نومید شده‌اند؛ دربارهٔ منکران آیات و دیدار آن معبود یگانه.">يَئِسوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَحمَتى" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="از رحمت من؛ موضوع نومیدیِ گروه یادشده.">رَحمَتى</button>
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذابی برای آنان؛ پیامد دردناکِ یادشده در آیه.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد" data-context="دردناک؛ وصف عذابی که برای آنان بیان شده است.">أَليمٌ</button>
  </p>
  <p class="farsi-verse">و کسانی که آیات آن معبود یگانه و دیدار او را انکار کردند، آنان از رحمت من نومید شدند و عذابی دردناک دارند.</p>
</section>
