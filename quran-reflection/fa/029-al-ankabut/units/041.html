  <p class="farsi-verse">مَثَل کسانی که به جای آن معبود یگانه سرپرستانی گرفته‌اند، مانند عنکبوت است که خانه‌ای گرفت؛ و سست‌ترین خانه‌ها خانهٔ عنکبوت است، اگر می‌دانستند.</p>
