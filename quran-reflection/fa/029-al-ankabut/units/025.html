  <p class="farsi-verse">و گفت: شما تنها برای دوستی میان خود در زندگی دنیا، به جای آن معبود یگانه بت‌هایی گرفته‌اید؛ سپس روز قیامت یکدیگر را انکار و یکدیگر را لعنت می‌کنید، و جایگاهتان آتش است و یاورانی ندارید.</p>
