<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="الأَمثٰلُ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">الأَمثٰلُ</button>
    <button class="word-link" type="button" data-word="نَضرِبُها" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/">نَضرِبُها</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/">لِلنّاسِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَعقِلُها" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/">يَعقِلُها</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="العٰلِمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">العٰلِمونَ</button>
  </p>
  <p class="farsi-verse">و این مَثَل‌ها را برای مردم می‌زنیم، و جز دانایان آنها را درنمی‌یابند.</p>
