<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَستَعجِلونَكَ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله" data-context="و از تو شتاب می‌خواهند؛ رسیدنِ زودترِ عذاب را طلب می‌کنند">وَيَستَعجِلونَكَ</button>
    <button class="word-link" type="button" data-word="بِالعَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ آنچه شتاب در رسیدنش را می‌خواهند">بِالعَذابِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَولا</button>
    <button class="word-link" type="button" data-word="أَجَلٌ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت یا موعد مقرر؛ در سیاق مناسب، پایان آن مدت." data-context="سرآمد و موعدی؛ زمانِ مقررِ رسیدن عذاب">أَجَلٌ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="س م و / و س م" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-context="معین و نام‌گذاری‌شده؛ وصفِ سرآمدِ تعیین‌شده">مُسَمًّى</button>
    <button class="word-link" type="button" data-word="لَجاءَهُمُ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="حتماً به آنان رسیده بود؛ نتیجهٔ فرضِ نبودن سرآمد مقرر">لَجاءَهُمُ</button>
    <button class="word-link" type="button" data-word="العَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ واقعه‌ای که سرآمدِ مقرر دارد">العَذابُ</button>
    <button class="word-link" type="button" data-word="وَلَيَأتِيَنَّهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="و بی‌گمان بر آنان خواهد رسید؛ تأکید بر وقوعِ آینده">وَلَيَأتِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="ب غ ت" data-root-meaning="ناگهانی فرا رسیدن یا رخ دادن چیزی در زمانی که مخاطب انتظار وقوع آن را نداشته یا از نزدیک شدن آن آگاه نبوده است." data-context="ناگهان؛ رسیدن عذاب در موعد مقرر اما نامعلوم برای مخاطبان" data-learn-more="/quran-terminology/fa/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک" data-context="آگاه‌اند؛ با نفی، ندانستن هنگامِ رسیدن عذاب">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">و عذاب را از تو به شتاب می‌خواهند؛ اگر موعدی معین نبود، عذاب به آنان می‌رسید؛ و حتماً ناگهان به سراغشان می‌آید، در حالی که درنمی‌یابند.</p>
</section>
