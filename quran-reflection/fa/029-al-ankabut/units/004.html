<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="حَسِبَ" data-root="ح س ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَسِبَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَسبِقونا" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/" data-root-meaning="پیش افتادن، پیشی گرفتن و سبقت جستن؛ از مسابقه و تقدم زمانی تا پیشگامی در کارهای نیک و پیشی‌ناپذیری در برابر اراده آن معبود یگانه">يَسبِقونا</button>
    ۚ
    <button class="word-link" type="button" data-word="ساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">ساءَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَحكُمونَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">يَحكُمونَ</button>
  </p>
  <p class="farsi-verse">یا کسانی که بدی‌ها می‌کنند پنداشتند از ما پیشی می‌گیرند؟ چه بد داوری می‌کنند.</p>
</section>
