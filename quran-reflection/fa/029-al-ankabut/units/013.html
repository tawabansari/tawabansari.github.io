<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَيَحمِلُنَّ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="و بی‌گمان حمل خواهند کرد؛ بارهای خود و افزوده را بر دوش می‌برند." data-learn-more="/quran-terminology/fa/roots/h-m-l/">وَلَيَحمِلُنَّ</button>
    <button class="word-link" type="button" data-word="أَثقالَهُم" data-root="ث ق ل" data-root-meaning="سنگینی، وزن، بار و اهمیت؛ از بارهای مادی تا سنجش کردار انسان" data-context="بارهای خودشان؛ مسئولیت و پیامد کردار خود." data-learn-more="/quran-terminology/fa/roots/th-q-l/">أَثقالَهُم</button>
    <button class="word-link" type="button" data-word="وَأَثقالًا" data-root="ث ق ل" data-root-meaning="سنگینی، وزن، بار و اهمیت؛ از بارهای مادی تا سنجش کردار انسان" data-context="و بارهایی؛ مسئولیت افزودهٔ ناشی از گمراه‌کردن دیگران." data-learn-more="/quran-terminology/fa/roots/th-q-l/">وَأَثقالًا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="أَثقالِهِم" data-root="ث ق ل" data-root-meaning="سنگینی، وزن، بار و اهمیت؛ از بارهای مادی تا سنجش کردار انسان" data-context="بارهایشان؛ همان بارهای شخصی که بارهای افزوده همراه آنهاست." data-learn-more="/quran-terminology/fa/roots/th-q-l/">أَثقالِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَيُسـَٔلُنَّ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="و بی‌گمان بازخواست خواهند شد؛ دربارهٔ افتراهایشان پرسیده می‌شوند.">وَلَيُسـَٔلُنَّ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمان بازخواست.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قیامت؛ هنگام برپایی حساب و بازخواست.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="می‌بودند؛ همراه فعل پسین، رفتار گذشتهٔ آنان را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="به دروغ می‌بافتند؛ ادعاهای ساختگی نسبت می‌دادند.">يَفتَرونَ</button>
  </p>
  <p class="farsi-verse">و حتماً بارهای خود و بارهایی همراه بارهای خود را برمی‌دارند، و روز قیامت از آنچه می‌ساختند پرسیده خواهند شد.</p>
</section>
