<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَظلَمُ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">أَظلَمُ</button>
    <button class="word-link" type="button" data-word="مِمَّنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّنِ</button>
    <button class="word-link" type="button" data-word="افتَرىٰ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا.">افتَرىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كَذِبًا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذِبًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="كَذَّبَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمّا</button>
    <button class="word-link" type="button" data-word="جاءَهُ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلَيسَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَيسَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="مَثوًى" data-root="ث و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-w-y/" data-root-meaning="ماندن و اقامت کردن؛ مثوى: جای ماندن و قرارگاه.">مَثوًى</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">لِلكٰفِرينَ</button>
  </p>
  <p class="farsi-verse">و چه کسی ستمگرتر است از آنکه بر آن معبود یگانه دروغ ببندد یا حق را چون به او رسد تکذیب کند؟ آیا در جهنم جایگاهی برای انکارکنندگان نیست؟</p>
</section>
