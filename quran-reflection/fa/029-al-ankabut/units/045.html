  <p class="farsi-verse">آنچه از کتاب به تو وحی شده بخوان و صلات را برپا دار؛ صلات از زشتی و کار ناپسند بازمی‌دارد، و یاد آن معبود یگانه بزرگ‌تر است؛ و آن معبود یگانه آنچه می‌کنید می‌داند.</p>
