<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادیم؛ نوح را به سوی قومش.">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="نوحًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحًا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قوم او؛ مردمی که نوح به سوی آنان فرستاده شد.">قَومِهِ</button>
    <button class="word-link" type="button" data-word="فَلَبِثَ" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="پس درنگ کرد؛ مدت ماندنِ او در میان قومش.">فَلَبِثَ</button>
    <button class="word-link" type="button" data-word="فيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِم</button>
    <button class="word-link" type="button" data-word="أَلفَ" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أَلَّفَ؛ پیوند دادن، خو گرفتن و برقرار شدن انس و همراهی" data-context="هزار؛ شمار سال‌ها پیش از استثنای پنجاه سال.">أَلفَ</button>
    <button class="word-link" type="button" data-word="سَنَةٍ" data-root="س ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است." data-context="سال؛ واحدِ هزار سالِ یادشده.">سَنَةٍ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="خَمسينَ" data-root="خ م س" data-root-meaning="عدد پنج؛ شمار پنج‌تایی، جایگاه پنجم و نسبت یک‌پنجم از یک مجموعه." data-context="پنجاه؛ شمار سال‌های استثناشده از هزار سال." data-learn-more="/quran-terminology/fa/roots/kh-m-s/">خَمسينَ</button>
    <button class="word-link" type="button" data-word="عامًا" data-root="ع و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-m/" data-root-meaning="عام: سال؛ معنای واژه به‌تنهایی خوشی یا سختی آن سال را تعیین نمی‌کند." data-context="سال؛ واحدِ پنجاه سالِ استثناشده.">عامًا</button>
    <button class="word-link" type="button" data-word="فَأَخَذَهُمُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="پس آنان را گرفت؛ فرارسیدن طوفان بر آن قوم.">فَأَخَذَهُمُ</button>
    <button class="word-link" type="button" data-word="الطّوفانُ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل" data-context="طوفان؛ رخدادی که آن قوم را فراگرفت.">الطّوفانُ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="ظٰلِمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگر بودند؛ وصفِ آنان هنگام فراگرفتن طوفان.">ظٰلِمونَ</button>
  </p>
  <p class="farsi-verse">و نوح را به سوی قومش فرستادیم؛ پس هزار سال جز پنجاه سال در میان آنان ماند. سپس سیل آنان را گرفت، در حالی که ستمگر بودند.</p>
</section>
