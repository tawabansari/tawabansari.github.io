  <p class="farsi-verse">و کسانی که انکار کردند به مؤمنان گفتند: از راه ما پیروی کنید، و خطاهای شما را ما برمی‌داریم. و آنان چیزی از خطاهای ایشان را برنمی‌دارند؛ آنان دروغ‌گویند.</p>
