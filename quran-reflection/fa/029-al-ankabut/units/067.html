<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/">يَرَوا</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّا</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنا</button>
    <button class="word-link" type="button" data-word="حَرَمًا" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/">حَرَمًا</button>
    <button class="word-link" type="button" data-word="ءامِنًا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">ءامِنًا</button>
    <button class="word-link" type="button" data-word="وَيُتَخَطَّفُ" data-root="خ ط ف" data-learn-more="/quran-terminology/fa/roots/kh-tt-f/" data-root-meaning="ربودن، قاپیدن، گرفتن ناگهانی و پرشتاب، و جدا کردن سریع چیزی از جایگاهش پیش از آنکه فرصت واکنش یا تثبیت داشته باشد">وَيُتَخَطَّفُ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/">النّاسُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَولِهِم" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها">حَولِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَبِالبٰطِلِ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/">أَفَبِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="وَبِنِعمَةِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/">وَبِنِعمَةِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">يَكفُرونَ</button>
  </p>
  <p class="farsi-verse">آیا ندیده‌اند که حرمی امن قرار دادیم، در حالی که مردم از پیرامونشان ربوده می‌شوند؟ آیا به باطل ایمان می‌آورند و نعمت آن معبود یگانه را انکار می‌کنند؟</p>
</section>
