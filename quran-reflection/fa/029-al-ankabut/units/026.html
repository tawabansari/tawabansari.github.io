<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَـٔامَنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">فَـٔامَنَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="لوطٌ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لوطٌ</button>
    ۘ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">وَقالَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="مُهاجِرٌ" data-root="ه ج ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُهاجِرٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبّى</button>

    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/">العَزيزُ</button>
    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/">الحَكيمُ</button>
  </p>
  <p class="farsi-verse">پس لوط به او ایمان آورد، و گفت: من به سوی پروردگارم هجرت می‌کنم؛ او شکست‌ناپذیرِ حکیم است.</p>
