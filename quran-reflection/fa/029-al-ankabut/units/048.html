<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودی؛ در ساخت «ما کنت»، بیان وضعیت نفی‌شدهٔ گذشته.">كُنتَ</button>
    <button class="word-link" type="button" data-word="تَتلوا" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر" data-context="تلاوت می‌کردی یا می‌خواندی؛ عملی که در دورهٔ پیش از آن نفی شده است.">تَتلوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از آن؛ در این سیاق، پیش از نزول کتاب یادشده.">قَبلِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كِتٰبٍ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتاب؛ در ساخت منفیِ «من کتاب»، هیچ کتابی.">كِتٰبٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَخُطُّهُ" data-root="خ ط ط" data-root-meaning="ایجاد خط یا اثری ممتد بر یک سطح؛ نشانه‌گذاری و نوشتن." data-context="آن را می‌نوشتی؛ در ساخت منفیِ آیه، نوشتن کتاب با دست راست پیش از آن نفی شده است." data-learn-more="/quran-terminology/fa/roots/kh-tt-tt/">تَخُطُّهُ</button>
    <button class="word-link" type="button" data-word="بِيَمينِكَ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="با دست راستت؛ بیان نوشتنِ مستقیم با دست در این عبارت.">بِيَمينِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِذًا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذًا</button>
    <button class="word-link" type="button" data-word="لَارتابَ" data-root="ر ي ب" data-learn-more="/quran-terminology/fa/roots/r-y-b/" data-root-meaning="تردید آشفته، بی‌اعتمادی، بدگمانی، شک بی‌ثبات‌کننده، اضطراب در برابر حق، و حالتی که انسان را از اطمینان و تسلیم در برابر برهان بازمی‌دارد" data-context="بی‌گمان دچار تردید می‌شدند؛ پیامد فرضیِ بیان‌شده در پایان آیه.">لَارتابَ</button>
    <button class="word-link" type="button" data-word="المُبطِلونَ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/" data-root-meaning="بی‌پایه شدن، فروپاشیدن، بی‌اثر و بی‌حقیقت بودن" data-context="باطل‌پیشگان؛ کسانی که تردید فرضی در این جمله به آنان نسبت داده شده است.">المُبطِلونَ</button>
  </p>
  <p class="farsi-verse">و پیش از آن هیچ کتابی نمی‌خواندی و با دست راستت آن را نمی‌نوشتی؛ در آن صورت باطل‌گرایان به شک می‌افتادند.</p>
</section>
