  <p class="farsi-verse">و با اهل کتاب جز به بهترین شیوه گفت‌وگو و استدلال نکنید، مگر کسانی از آنان که ستم کردند؛ و بگویید: به آنچه به ما نازل شده و به شما نازل شده ایمان آوردیم، و معبود ما و معبود شما یکی است و ما تسلیم اوییم.</p>
