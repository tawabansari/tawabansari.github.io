<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="لَنُبَوِّئَنَّهُم" data-root="ب و أ" data-learn-more="/quran-terminology/fa/roots/b-w-a/" data-root-meaning="از بازگشت و جای گرفتن تا جای دادن و بر عهده گرفتن پیامد">لَنُبَوِّئَنَّهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="غُرَفًا" data-root="غ ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-f/" data-root-meaning="با دست یا ابزار آب برداشتن؛ غُرفه: اتاق یا جایگاه بالا.">غُرَفًا</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند">الأَنهٰرُ</button>
    <button class="word-link" type="button" data-word="خٰلِدينَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه">خٰلِدينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    ۚ
    <button class="word-link" type="button" data-word="نِعمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">نِعمَ</button>
    <button class="word-link" type="button" data-word="أَجرُ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرُ</button>
    <button class="word-link" type="button" data-word="العٰمِلينَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">العٰمِلينَ</button>
  </p>
  <p class="farsi-verse">و کسانی که ایمان آوردند و کارهای شایسته کردند، آنان را در غرفه‌هایی از باغ جای می‌دهیم که از زیر آنها رودها جاری است و در آن جاودانه‌اند؛ چه نیکوست پاداش عمل‌کنندگان؛</p>
</section>
