<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَحَسِبَ" data-root="ح س ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَحَسِبَ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُترَكوا" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی">يُترَكوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولوا</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنّا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُفتَنونَ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">يُفتَنونَ</button>
  </p>
  <p class="farsi-verse">آیا مردم پنداشتند همین که بگویند ایمان آوردیم، رها می‌شوند و آزموده نمی‌شوند؟</p>
