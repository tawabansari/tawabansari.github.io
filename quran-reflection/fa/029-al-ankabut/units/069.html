<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="جٰهَدوا" data-root="ج ه د" data-root-meaning="کوشش جدی و صرف توان در برابر دشواری؛ جَهْد شدت و مشقت، و جُهْد توان و ظرفیت را نیز بیان می‌کند." data-context="کوشش کردند؛ تلاش جدی با جهت‌گیری‌ای که «فینا» بیان می‌کند." data-learn-more="/quran-terminology/fa/roots/j-h2-d/">جٰهَدوا</button>
    <button class="word-link" type="button" data-word="فينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فينا</button>
    <button class="word-link" type="button" data-word="لَنَهدِيَنَّهُم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="حتماً هدایتشان می‌کنیم؛ وعده راهنمایی کوشش‌کنندگان.">لَنَهدِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="سُبُلَنا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه‌های ما؛ مسیرهای هدایتِ وعده‌داده‌شده.">سُبُلَنا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَمَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمَعَ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوکاران؛ کسانی که همراهی با آنان بیان شده است.">المُحسِنينَ</button>
  </p>
  <p class="farsi-verse">و کسانی که در راه ما کوشیدند، حتماً به راه‌های خود هدایتشان می‌کنیم؛ و آن معبود یگانه با نیکوکاران است.</p>
</section>
