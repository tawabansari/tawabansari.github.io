<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="جٰهَدوا" data-root="ج ه د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جٰهَدوا</button>
    <button class="word-link" type="button" data-word="فينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فينا</button>
    <button class="word-link" type="button" data-word="لَنَهدِيَنَّهُم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">لَنَهدِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="سُبُلَنا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/">سُبُلَنا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>

    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/">المُحسِنينَ</button>
  </p>
  <p class="farsi-verse">و کسانی که در راه ما کوشیدند، حتماً به راه‌های خود هدایتشان می‌کنیم؛ و آن معبود یگانه با نیکوکاران است.</p>
