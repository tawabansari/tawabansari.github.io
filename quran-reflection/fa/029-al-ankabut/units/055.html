<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">العنکبوت ۲۹:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="يَغشىٰهُمُ" data-root="غ ش ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَغشىٰهُمُ</button>
    <button class="word-link" type="button" data-word="العَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِهِم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد">فَوقِهِم</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="تَحتِ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی">تَحتِ</button>
    <button class="word-link" type="button" data-word="أَرجُلِهِم" data-root="ر ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَرجُلِهِم</button>
    <button class="word-link" type="button" data-word="وَيَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَيَقولُ</button>
    <button class="word-link" type="button" data-word="ذوقوا" data-root="ذ و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ذوقوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">تَعمَلونَ</button>
  </p>
  <p class="farsi-verse">روزی که عذاب از بالا و از زیر پاهایشان آنان را می‌پوشاند و می‌گوید: بچشید آنچه می‌کردید.</p>
</section>
