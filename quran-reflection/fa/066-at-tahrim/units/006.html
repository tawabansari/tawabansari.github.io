<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">التحريم ۶۶:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="قوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">قوا</button>
    <button class="word-link" type="button" data-word="أَنفُسَكُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">أَنفُسَكُم</button>
    <button class="word-link" type="button" data-word="وَأَهليكُم" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">وَأَهليكُم</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">نارًا</button>
    <button class="word-link" type="button" data-word="وَقودُهَا" data-root="و ق د" data-learn-more="/quran-terminology/fa/roots/w-q-d/" data-root-meaning="افروختن، شعله‌ور شدن، زنده شدن آتش از ماده سوختنی، و پایداری شعله">وَقودُهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="وَالحِجارَةُ" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی">وَالحِجارَةُ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="مَلٰئِكَةٌ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">مَلٰئِكَةٌ</button>
    <button class="word-link" type="button" data-word="غِلاظٌ" data-root="غ ل ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-zha/" data-root-meaning="ضخامت، سختی و درشتی؛ مادی یا رفتاری، بنا بر سیاق.">غِلاظٌ</button>
    <button class="word-link" type="button" data-word="شِدادٌ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شِدادٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعصونَ" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت.">يَعصونَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَمَرَهُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمَرَهُم</button>
    <button class="word-link" type="button" data-word="وَيَفعَلونَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">وَيَفعَلونَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يُؤمَرونَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">يُؤمَرونَ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، خود و خانواده‌هایتان را از آتشی حفظ کنید که سوختش مردم و سنگ‌هاست؛ بر آن فرشتگانی درشت‌خو و سخت‌گیرند که از آنچه آن معبود یگانه به آنان فرمان داده نافرمانی نمی‌کنند و آنچه را فرمان می‌یابند انجام می‌دهند.</p>
</section>
