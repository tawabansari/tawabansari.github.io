  <p class="farsi-verse">و مریم دختر عمران که شرمگاه خود را حفظ کرد؛ پس از روح خود در آن دمیدیم. و او کلمات پروردگارش و کتاب‌های او را تصدیق کرد و از فرمانبرداران بود.</p>
