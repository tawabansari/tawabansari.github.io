  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="لِمَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَ</button>
    <button class="word-link" type="button" data-word="تُحَرِّمُ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/">تُحَرِّمُ</button>

    ۖ
    <button class="word-link" type="button" data-word="تَبتَغى" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/">تَبتَغى</button>

    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>

  <p class="farsi-verse">ای پیامبر، چرا آنچه را آن معبود یگانه برایت حلال کرده حرام می‌کنی، در حالی که خشنودی همسرانت را می‌جویی؟ و آن معبود یگانه آمرزنده و مهربان است.</p>
