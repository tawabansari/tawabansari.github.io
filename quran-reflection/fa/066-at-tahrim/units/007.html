    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">كَفَروا</button>

    <button class="word-link" type="button" data-word="تَعتَذِرُوا" data-root="ع ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَعتَذِرُوا</button>

  <p class="farsi-verse">ای کسانی که کفر ورزیده‌اید، امروز عذر نیاورید؛ تنها در برابر آنچه می‌کردید جزا داده می‌شوید.</p>
