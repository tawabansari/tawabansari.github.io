<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">التحريم ۶۶:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَضَرَبَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">وَضَرَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مَثَلًا</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="امرَأَتَ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرَأَتَ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="قالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَت</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="ابنِ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">ابنِ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="عِندَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَكَ</button>
    <button class="word-link" type="button" data-word="بَيتًا" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/" data-root-meaning="خانه و جای اقامت؛ بات: شب را گذراندن؛ تبییت: ترتیب دادن کاری در شب یا پنهانی." data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست.">بَيتًا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="وَنَجِّنى" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">وَنَجِّنى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَعَمَلِهِ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">وَعَمَلِهِ</button>
    <button class="word-link" type="button" data-word="وَنَجِّنى" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">وَنَجِّنى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه برای کسانی که ایمان آوردند، زن فرعون را مثال زد، هنگامی که گفت: «پروردگارا، برایم نزد خود خانه‌ای در بهشت بساز و مرا از فرعون و کارش نجات بده و مرا از مردم ستمکار نجات بده.»</p>
</section>
