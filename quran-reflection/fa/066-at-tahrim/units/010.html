<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">التحريم ۶۶:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ضَرَبَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="مثال آورد؛ زن نوح و زن لوط را نمونه قرار داد.">ضَرَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مثالی؛ نمونه‌ای برای توضیح وضعیت کسانی که کفر ورزیده‌اند.">مَثَلًا</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَرُوا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ گروهی که مثال آیه دربارهٔ آنان مطرح می‌شود.">كَفَرُوا</button>
    <button class="word-link" type="button" data-word="امرَأَتَ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود" data-context="زنِ نوح؛ همسر نوح در مثال آیه.">امرَأَتَ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَامرَأَتَ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود" data-context="و زنِ لوط؛ همسر لوط در مثال آیه.">وَامرَأَتَ</button>
    <button class="word-link" type="button" data-word="لوطٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لوطٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="كانَتا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="آن دو بودند؛ وضعیت پیشین دو زن را بیان می‌کند.">كانَتا</button>
    <button class="word-link" type="button" data-word="تَحتَ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="زیرِ؛ در این ترکیب، بیان رابطهٔ زناشویی با دو مرد صالح.">تَحتَ</button>
    <button class="word-link" type="button" data-word="عَبدَينِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="دو بنده؛ نوح و لوط که همسران آن دو زن بودند.">عَبدَينِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِنا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بندگان ما؛ نسبت بندگی نوح و لوط به خداوند.">عِبادِنا</button>
    <button class="word-link" type="button" data-word="صٰلِحَينِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="دو صالح؛ وصف درستی و شایستگی نوح و لوط.">صٰلِحَينِ</button>
    <button class="word-link" type="button" data-word="فَخانَتاهُما" data-root="خ و ن" data-root-meaning="کاستن و نقصان؛ در رفتار انسان، نقض اعتماد، امانت یا وفاداری و ضایع کردن حقی که باید رعایت می‌شد." data-context="پس آن دو زن به دو شوهرشان خیانت کردند؛ فعل به‌تنهایی نوع دقیق خیانت را تعیین نمی‌کند." data-learn-more="/quran-terminology/fa/roots/kh-w-n/">فَخانَتاهُما</button>
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَم</button>
    <button class="word-link" type="button" data-word="يُغنِيا" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="سود رساندند؛ در جملهٔ منفی، ناتوانی دو شوهر از دفع پیامد الهی برای آن دو زن.">يُغنِيا</button>
    <button class="word-link" type="button" data-word="عَنهُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُما</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیزی؛ در جملهٔ منفی، هیچ سود و حمایتی در برابر خداوند.">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفته شد؛ فعل مجهول برای فرمانِ پس از آن.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="ادخُلَا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="آن دو وارد شوید؛ فرمان به دو زن برای ورود به آتش.">ادخُلَا</button>
    <button class="word-link" type="button" data-word="النّارَ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ جایگاهی که آن دو به ورود به آن فرمان داده می‌شوند.">النّارَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="الدّٰخِلينَ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="واردشوندگان؛ کسانی که آن دو زن همراه آنان وارد آتش می‌شوند.">الدّٰخِلينَ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه برای کسانی که کفر ورزیدند، زن نوح و زن لوط را مثال زد. آن دو همسر دو بندهٔ شایسته از بندگان ما بودند، پس به آنان خیانت کردند و آن دو در برابر آن معبود یگانه هیچ سودی به ایشان نرساندند؛ و گفته شد: «با واردشوندگان به آتش وارد شوید.»</p>
</section>
