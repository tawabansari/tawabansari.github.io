  <p class="farsi-verse">آن معبود یگانه برای کسانی که کفر ورزیدند، زن نوح و زن لوط را مثال زد. آن دو همسر دو بندهٔ شایسته از بندگان ما بودند، پس به آنان خیانت کردند و آن دو در برابر آن معبود یگانه هیچ سودی به ایشان نرساندند؛ و گفته شد: «با واردشوندگان به آتش وارد شوید.»</p>
