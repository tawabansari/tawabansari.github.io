<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">التحريم ۶۶:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَسىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَسىٰ</button>
    <button class="word-link" type="button" data-word="رَبُّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّهُ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="طَلَّقَكُنَّ" data-root="ط ل ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">طَلَّقَكُنَّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُبدِلَهُ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">يُبدِلَهُ</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند">أَزوٰجًا</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرًا</button>
    <button class="word-link" type="button" data-word="مِنكُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُنَّ</button>
    <button class="word-link" type="button" data-word="مُسلِمٰتٍ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">مُسلِمٰتٍ</button>
    <button class="word-link" type="button" data-word="مُؤمِنٰتٍ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">مُؤمِنٰتٍ</button>
    <button class="word-link" type="button" data-word="قٰنِتٰتٍ" data-root="ق ن ت" data-learn-more="/quran-terminology/fa/roots/q-n-t/" data-root-meaning="از فرمان‌پذیری و پایبندی تا ایستادگی در عبادت">قٰنِتٰتٍ</button>
    <button class="word-link" type="button" data-word="تٰئِبٰتٍ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">تٰئِبٰتٍ</button>
    <button class="word-link" type="button" data-word="عٰبِدٰتٍ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عٰبِدٰتٍ</button>
    <button class="word-link" type="button" data-word="سٰئِحٰتٍ" data-root="س ي ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سٰئِحٰتٍ</button>
    <button class="word-link" type="button" data-word="ثَيِّبٰتٍ" data-root="ث ي ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ثَيِّبٰتٍ</button>
    <button class="word-link" type="button" data-word="وَأَبكارًا" data-root="ب ك ر" data-learn-more="/quran-terminology/fa/roots/b-k-r/" data-root-meaning="از آغاز روز و پیش‌افتادگی تا باقی بودن در مرحلهٔ نخستین">وَأَبكارًا</button>
  </p>
  <p class="farsi-verse">اگر شما را طلاق دهد، امید است پروردگارش همسرانی بهتر از شما جایگزینتان کند: تسلیم‌شونده، مؤمن، فرمانبردار، توبه‌کننده، عبادت‌کننده، روزه‌دار، پیش‌تر ازدواج‌کرده و دوشیزه.</p>
</section>
