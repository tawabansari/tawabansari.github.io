<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُطافُ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل" data-context="و گردانده می‌شود؛ فعل مجهول درباره گرداندن ظرف‌ها و جام‌ها در میان آنان.">وَيُطافُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِـٔانِيَةٍ" data-root="أ ن ي" data-learn-more="/quran-terminology/fa/roots/a-n-y/" data-root-meaning="«إِنَاء» و جمع آن «آنِيَة» به ظرف اشاره دارند." data-context="با ظرف‌ها؛ «آنية» جمع «إناء» است، نه صفت بسیار داغ.">بِـٔانِيَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فِضَّةٍ" data-root="ف ض ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-dad-dad/" data-root-meaning="شکستن و پراکندن؛ فضّه: نقره." data-context="نقره؛ جنس ظرف‌های یادشده.">فِضَّةٍ</button>
    <button class="word-link" type="button" data-word="وَأَكوابٍ" data-root="ك و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-w-b/" data-root-meaning="جام و ظرف نوشیدن، معمولاً بدون دسته." data-context="و جام‌ها؛ ظرف‌های نوشیدن که جدا از «آنية» نام برده شده‌اند.">وَأَكوابٍ</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ فعل مربوط به جام‌هایی که در ادامه شیشه‌گون توصیف می‌شوند.">كانَت</button>
    <button class="word-link" type="button" data-word="قَواريرا۠" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری. «قواریر» نیز به شیشه، بلور یا ظرف‌های شفاف و بلورین اشاره دارد." data-context="شیشه یا بلور؛ توصیف شفافیت و شیشه‌گونی جام‌ها در این آیه.">قَواريرا۠</button>
  </p>
  <p class="farsi-verse">و ظرف‌هایی از نقره و جام‌هایی که شیشه‌گون‌اند بر گرد آنان گردانده می‌شود،</p>
</section>
