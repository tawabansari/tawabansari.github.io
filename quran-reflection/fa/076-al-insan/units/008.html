<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُطعِمونَ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا">وَيُطعِمونَ</button>
    <button class="word-link" type="button" data-word="الطَّعامَ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا">الطَّعامَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="حُبِّهِ" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حُبِّهِ</button>
    <button class="word-link" type="button" data-word="مِسكينًا" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن">مِسكينًا</button>
    <button class="word-link" type="button" data-word="وَيَتيمًا" data-root="ي ت م" data-learn-more="/quran-terminology/fa/roots/y-t-m/" data-root-meaning="فقدان پدر، وضعیت یتیم و مسئولیت در برابر حقوق او">وَيَتيمًا</button>
    <button class="word-link" type="button" data-word="وَأَسيرًا" data-root="أ س ر" data-learn-more="/quran-terminology/fa/roots/a-s-r/" data-root-meaning="از بستن و در اختیار گرفتن تا اسیر و استحکام پیوندها">وَأَسيرًا</button>
  </p>
  <p class="farsi-verse">و خوراک را، با آنکه دوستش دارند، به نیازمند و یتیم و اسیر می‌دهند.</p>
