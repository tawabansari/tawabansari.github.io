<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/">الَّيلِ</button>
    <button class="word-link" type="button" data-word="فَاسجُد" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/">فَاسجُد</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="وَسَبِّحهُ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/">وَسَبِّحهُ</button>

  </p>
  <p class="farsi-verse">و بخشی از شب برای او سجده کن و در شبی طولانی او را به پاکی بستای.</p>
