<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="خَلَقنٰهُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنٰهُم</button>
    <button class="word-link" type="button" data-word="وَشَدَدنا" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">وَشَدَدنا</button>
    <button class="word-link" type="button" data-word="أَسرَهُم" data-root="أ س ر" data-learn-more="/quran-terminology/fa/roots/a-s-r/" data-root-meaning="از بستن و در اختیار گرفتن تا اسیر و استحکام پیوندها">أَسرَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="شِئنا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شِئنا</button>
    <button class="word-link" type="button" data-word="بَدَّلنا" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">بَدَّلنا</button>
    <button class="word-link" type="button" data-word="أَمثٰلَهُم" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">أَمثٰلَهُم</button>
    <button class="word-link" type="button" data-word="تَبديلًا" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">تَبديلًا</button>
  </p>
  <p class="farsi-verse">ما آنان را آفریدیم و پیوندهای پیکرشان را استوار کردیم؛ و هرگاه بخواهیم، همانندهایشان را جایگزین می‌کنیم.</p>
</section>
