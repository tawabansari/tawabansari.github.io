<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الأَبرارَ" data-root="ب ر ر" data-learn-more="/quran-terminology/fa/roots/b-r-r/" data-root-meaning="نیکی گسترده، راست‌کرداری، وفاداری، احسان، گشودگی در خیر، و ایستادن بر زمین استوار اخلاقی">الأَبرارَ</button>
    <button class="word-link" type="button" data-word="يَشرَبونَ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن.">يَشرَبونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كَأسٍ" data-root="ك أ س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَأسٍ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="مِزاجُها" data-root="م ز ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مِزاجُها</button>
    <button class="word-link" type="button" data-word="كافورًا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كافورًا</button>
  </p>
  <p class="farsi-verse">نیکوکاران از جامی می‌نوشند که آمیزه‌اش کافور است،</p>
</section>
