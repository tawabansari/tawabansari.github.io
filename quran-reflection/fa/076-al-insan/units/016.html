<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قَواريرَا۟" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری.">قَواريرَا۟</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فِضَّةٍ" data-root="ف ض ض" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فِضَّةٍ</button>
    <button class="word-link" type="button" data-word="قَدَّروها" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">قَدَّروها</button>
    <button class="word-link" type="button" data-word="تَقديرًا" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">تَقديرًا</button>
  </p>
  <p class="farsi-verse">شیشه‌هایی از نقره که آنها را به‌اندازه سنجیده‌اند.</p>
</section>
