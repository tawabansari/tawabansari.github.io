<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَينًا" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">عَينًا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="تُسَمّىٰ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">تُسَمّىٰ</button>
    <button class="word-link" type="button" data-word="سَلسَبيلًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سَلسَبيلًا</button>
  </p>
  <p class="farsi-verse">از چشمه‌ای در آن که سلسبیل نامیده می‌شود.</p>
</section>
