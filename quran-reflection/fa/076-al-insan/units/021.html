<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عٰلِيَهُم" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="بر فراز و بر تن آنان؛ جایگاه لباس‌های یادشده.">عٰلِيَهُم</button>
    <button class="word-link" type="button" data-word="ثِيابُ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه" data-context="لباس‌ها؛ پوشاک سندس و استبرق.">ثِيابُ</button>
    <button class="word-link" type="button" data-word="سُندُسٍ" data-context="سندس: ابریشم نازک." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">سُندُسٍ</button>
    <button class="word-link" type="button" data-word="خُضرٌ" data-root="خ ض ر" data-root-meaning="سبزی و رنگ سبز؛ در کاربرد گیاهی، تازگی و شادابی." data-context="سبز؛ وصف لباس‌های سندس." data-learn-more="/quran-terminology/fa/roots/kh-dad-r/">خُضرٌ</button>
    <button class="word-link" type="button" data-word="وَإِستَبرَقٌ" data-context="استبرق: دیبای ضخیم." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">وَإِستَبرَقٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَحُلّوا" data-root="ح ل ي" data-root-meaning="زیور و آراستگی؛ آراستن انسان یا اشیا با چیزی که برای زیبایی به ظاهر آنها افزوده می‌شود." data-context="آراسته شده‌اند؛ فعل ماضی مجهول دربارهٔ دستبندهای نقره." data-learn-more="/quran-terminology/fa/roots/h-l-y/">وَحُلّوا</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد" data-context="دستبندها؛ زیوری که با آن آراسته شده‌اند.">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فِضَّةٍ" data-root="ف ض ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-dad-dad/" data-root-meaning="شکستن و پراکندن؛ فضّه: نقره." data-context="نقره؛ جنس دستبندهای این آیه.">فِضَّةٍ</button>
    <button class="word-link" type="button" data-word="وَسَقىٰهُم" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب." data-context="و به آنان نوشاند؛ بخشیدن نوشیدنی از سوی پروردگارشان.">وَسَقىٰهُم</button>
    <button class="word-link" type="button" data-word="رَبُّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ فاعل نوشاندنِ نوشیدنی پاکیزه.">رَبُّهُم</button>
    <button class="word-link" type="button" data-word="شَرابًا" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="نوشیدنی؛ آنچه پروردگارشان به آنان نوشانده است.">شَرابًا</button>
    <button class="word-link" type="button" data-word="طَهورًا" data-root="ط ه ر" data-learn-more="/quran-terminology/fa/roots/tt-h2-r/" data-root-meaning="پاکی، زدودن آلودگی، پالایش، و بیرون آمدن از حالت ناپاکی" data-context="پاکیزه و پاک‌کننده؛ وصف نوشیدنی.">طَهورًا</button>
  </p>
  <p class="farsi-verse">بر تن آنان جامه‌های سبز از ابریشم نازک و دیبای ضخیم است، و با دست‌بندهایی از نقره آراسته شده‌اند، و پروردگارشان به آنان نوشیدنی پاک می‌نوشاند.</p>
</section>
