<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَزىٰهُم" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">وَجَزىٰهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="صَبَروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">صَبَروا</button>
    <button class="word-link" type="button" data-word="جَنَّةً" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنَّةً</button>
    <button class="word-link" type="button" data-word="وَحَريرًا" data-root="ح ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَحَريرًا</button>
  </p>
  <p class="farsi-verse">و به پاداش شکیبایی‌شان باغی و ابریشم به آنان داد.</p>
</section>
