<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="و ك أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-a/" data-root-meaning="تکیه کردن و قرار گرفتن بر تکیه‌گاه." data-context="تکیه‌زنان؛ حالت بهشتیان بر تخت‌های یادشده.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَرائِكِ" data-root="أ ر ك" data-learn-more="/quran-terminology/fa/roots/a-r-k/" data-root-meaning="تخت یا بستری آراسته و آماده برای نشستن، آسودن و تکیه زدن؛ غالبا همراه با پوشش یا آرایش ویژه." data-context="تخت‌های آراسته؛ جایگاه تکیه زدن و آسایش در این توصیف.">الأَرائِكِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَرَونَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینند یا با آن روبه‌رو می‌شوند؛ در اینجا با «لا» نفی شده است.">يَرَونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="شَمسًا" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="خورشید؛ آیه دیدن یا مواجه شدن با آن را در آن محیط نفی می‌کند.">شَمسًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="زَمهَريرًا" data-root="ز م ه ر" data-root-meaning="سرمای بسیار سخت و گزنده؛ در دیگر کاربردهای لغوی این خانواده، درخشش، خشم و تغییر حالت چهره نیز ثبت شده است." data-context="سرمای شدید و آزاردهنده‌ای که بهشتیان از آن در امان‌اند." data-learn-more="/quran-terminology/fa/roots/z-m-h2-r/">زَمهَريرًا</button>
  </p>
  <p class="farsi-verse">در آن بر تخت‌ها تکیه زده‌اند؛ نه آفتابی در آن می‌بینند و نه سرمایی سخت.</p>
</section>
