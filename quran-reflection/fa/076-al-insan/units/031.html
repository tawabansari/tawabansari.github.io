<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُدخِلُ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/">يُدخِلُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="رَحمَتِهِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/">رَحمَتِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">وَالظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="أَعَدَّ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/">أَعَدَّ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/">أَليمًا</button>
  </p>
  <p class="farsi-verse">هر که را بخواهد در رحمت خود درمی‌آورد؛ و برای ستمکاران عذابی دردناک آماده کرده است.</p>
