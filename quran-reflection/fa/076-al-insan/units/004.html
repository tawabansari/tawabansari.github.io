<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَعتَدنا" data-root="ع ت د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-d/" data-root-meaning="آماده کردن و آماده یا حاضر بودن.">أَعتَدنا</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="سَلٰسِلَا۟" data-root="س ل س ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-s-l/" data-root-meaning="زنجیر و حلقه‌های پیوسته؛ نیز روانی آب در کاربرد دیگر.">سَلٰسِلَا۟</button>
    <button class="word-link" type="button" data-word="وَأَغلٰلًا" data-root="غ ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-l/" data-root-meaning="بند و زنجیر؛ غِلّ: کینه؛ غلول: خیانت در مال سپرده‌شده.">وَأَغلٰلًا</button>
    <button class="word-link" type="button" data-word="وَسَعيرًا" data-root="س ع ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-ayn-r/" data-root-meaning="افروختن آتش؛ سعیر: آتش شعله‌ور؛ سُعُر در برخی سیاق‌ها: آشفتگی.">وَسَعيرًا</button>
  </p>
  <p class="farsi-verse">ما برای کافران زنجیرها و بندها و آتشی سوزان آماده کرده‌ایم.</p>
</section>
