<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَطوفُ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل" data-context="و بر گرد آنان می‌گردند؛ رفت‌وآمد نوجوانان پیرامون آنان.">وَيَطوفُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وِلدٰنٌ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="نوجوانان؛ کسانی که در ادامه به مرواریدهای پراکنده تشبیه می‌شوند.">وِلدٰنٌ</button>
    <button class="word-link" type="button" data-word="مُخَلَّدونَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه" data-context="ماندگار و جاودان؛ وصف نوجوانانِ گردنده در این آیه.">مُخَلَّدونَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="رَأَيتَهُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آنان را ببینی؛ دیدن نوجوانانِ یادشده در آیه.">رَأَيتَهُم</button>
    <button class="word-link" type="button" data-word="حَسِبتَهُم" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="آنان را می‌پنداری؛ در نظر بیننده همچون مرواریدهای پراکنده‌اند.">حَسِبتَهُم</button>
    <button class="word-link" type="button" data-word="لُؤلُؤًا" data-root="ل أ ل أ" data-root-meaning="مروارید؛ گوهری شناخته‌شده به زیبایی و جلای خود که در قرآن هم به‌عنوان زینت و نعمتی طبیعی و هم در تشبیه‌های مربوط به زیبایی به کار رفته است." data-context="مرواریدها؛ نوجوانانِ گردنده در این آیه به مرواریدهای پراکنده تشبیه شده‌اند." data-learn-more="/quran-terminology/fa/roots/l-a-l-a/">لُؤلُؤًا</button>
    <button class="word-link" type="button" data-word="مَنثورًا" data-root="ن ث ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-th-r/" data-root-meaning="پراکندن و پاشیدن." data-context="پراکنده؛ وصف مرواریدها در تشبیه نوجوانان.">مَنثورًا</button>
  </p>
  <p class="farsi-verse">و نوجوانانی جاودان بر گرد آنان می‌گردند؛ چون آنان را ببینی، مرواریدهایی پراکنده می‌پنداری.</p>
</section>
