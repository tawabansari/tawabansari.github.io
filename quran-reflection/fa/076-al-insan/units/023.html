<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="نَزَّلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نازل کردیم؛ فروفرستادنِ قرآن بر مخاطب.">نَزَّلنا</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنِ نازل‌شده بر مخاطب." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="تَنزيلًا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نزول؛ تأکیدِ مصدری بر فروفرستادن.">تَنزيلًا</button>
  </p>
  <p class="farsi-verse">ما خود قرآن را بر تو فرو فرستادیم.</p>
