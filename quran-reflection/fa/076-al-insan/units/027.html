<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="يُحِبّونَ" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُحِبّونَ</button>
    <button class="word-link" type="button" data-word="العاجِلَةَ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">العاجِلَةَ</button>
    <button class="word-link" type="button" data-word="وَيَذَرونَ" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَذَرونَ</button>
    <button class="word-link" type="button" data-word="وَراءَهُم" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش">وَراءَهُم</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومًا</button>
    <button class="word-link" type="button" data-word="ثَقيلًا" data-root="ث ق ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ثَقيلًا</button>
  </p>
  <p class="farsi-verse">اینان زندگی زودگذر را دوست دارند و روزی سنگین را پشت سر خود رها می‌کنند.</p>
</section>
