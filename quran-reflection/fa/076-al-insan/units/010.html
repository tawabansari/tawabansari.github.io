<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="نَخافُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم داریم؛ گویندگان از روزی عبوس و سهمگین می‌ترسند.">نَخافُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارمان؛ آن‌که ما را می‌پرورد و تدبیر می‌کند، و در این جمله بیمِ گویندگان به او پیوند یافته است.">رَبِّنا</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی؛ زمانِ مورد بیم که با دو وصف «عبوس» و «قمطریر» توصیف شده است.">يَومًا</button>
    <button class="word-link" type="button" data-word="عَبوسًا" data-root="ع ب س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-b-s/" data-root-meaning="اخم و درهم کشیدن چهره." data-context="عبوس و گرفته؛ وصفِ روزی که ناخوشایندی و هولِ رخدادهای آن با تصویرِ چهرهٔ درهم‌کشیده بیان می‌شود.">عَبوسًا</button>
    <button class="word-link" type="button" data-word="قَمطَريرًا" data-root="ق م ط ر" data-root-meaning="جمع شدن، انقباض و فشردگی در بعضی کاربردهای خانواده؛ در صورت «قَمْطَرِير»، سختی و شدتِ سهمگین، به‌ویژه دربارهٔ روزی هولناک و دشوار." data-context="بسیار سخت و سهمگین؛ وصفِ روزی که گویندگان از شدت و هولِ آن بیم دارند." data-learn-more="/quran-terminology/fa/roots/q-m-tt-r/">قَمطَريرًا</button>
  </p>
  <p class="farsi-verse">ما از پروردگارمان، از روزی عبوس و سخت می‌ترسیم.»</p>
</section>
