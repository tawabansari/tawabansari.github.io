<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَدانِيَةً" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/">وَدانِيَةً</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="ظِلٰلُها" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/">ظِلٰلُها</button>
    <button class="word-link" type="button" data-word="وَذُلِّلَت" data-root="ذ ل ل" data-learn-more="/quran-terminology/fa/roots/dh-l-l/">وَذُلِّلَت</button>
    <button class="word-link" type="button" data-word="قُطوفُها" data-root="ق ط ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قُطوفُها</button>
    <button class="word-link" type="button" data-word="تَذليلًا" data-root="ذ ل ل" data-learn-more="/quran-terminology/fa/roots/dh-l-l/">تَذليلًا</button>
  </p>
  <p class="farsi-verse">و سایه‌هایش بر آنان نزدیک است و میوه‌های چیدنی‌اش کاملاً در دسترس قرار گرفته است.</p>
