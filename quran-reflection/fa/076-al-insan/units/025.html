<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">الإنسان ۷۶:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَاذكُرِ</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">اسمَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="ب ك ر" data-learn-more="/quran-terminology/fa/roots/b-k-r/" data-root-meaning="از آغاز روز و پیش‌افتادگی تا باقی بودن در مرحلهٔ نخستین">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَأَصيلًا" data-root="أ ص ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-sad-l/" data-root-meaning="اصل و پایهٔ چیزی؛ و در شاخهٔ زمانی، أصیل و آصال: اواخر روز و هنگام عصر.">وَأَصيلًا</button>
  </p>
  <p class="farsi-verse">و نام پروردگارت را بامداد و شامگاه یاد کن،</p>
</section>
