  <p class="farsi-verse">و کسانی از شما که می‌میرند و همسرانی بر جای می‌گذارند، برای همسرانشان وصیتی باشد: بهره‌مندی تا یک سال، بی‌آنکه بیرون رانده شوند. پس اگر بیرون رفتند، در آنچه به شیوهٔ پسندیده دربارهٔ خود انجام دهند گناهی بر شما نیست؛ و آن معبود یگانه شکست‌ناپذیر و حکیم است.</p>
