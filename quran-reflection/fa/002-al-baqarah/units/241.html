<section class="ayah-block" id="ayah-241" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِلمُطَلَّقٰتِ" data-root="ط ل ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-l-q/" data-root-meaning="رها ساختن و به راه افتادن؛ طلاق: گسستن پیوند زناشویی.">وَلِلمُطَلَّقٰتِ</button>
    <button class="word-link" type="button" data-word="مَتٰعٌ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">مَتٰعٌ</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">بِالمَعروفِ</button>
    ۖ
    <button class="word-link" type="button" data-word="حَقًّا" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">حَقًّا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">المُتَّقينَ</button>
  </p>
  <p class="farsi-verse">و برای زنان طلاق‌داده‌شده بهره‌ای به شیوهٔ پسندیده است؛ حقی بر پرهیزگاران.</p>
</section>
