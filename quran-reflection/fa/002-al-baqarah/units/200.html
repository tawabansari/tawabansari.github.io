  <p class="farsi-verse">پس چون مناسکتان را به پایان رساندید، آن معبود یگانه را همچون یاد کردن پدرانتان، یا بیشتر، یاد کنید. پس از مردم کسی می‌گوید: پروردگار ما، در دنیا به ما بده؛ و او را در آخرت بهره‌ای نیست.</p>
