  <p class="farsi-verse">هدایت آنان بر عهدهٔ تو نیست، ولی آن معبود یگانه هر که را بخواهد هدایت می‌کند. و هر خیری که انفاق کنید برای خود شماست؛ و جز برای جستن روی آن معبود یگانه انفاق نمی‌کنید. و هر خیری که انفاق کنید، به‌تمامی به شما بازداده می‌شود و بر شما ستم نمی‌رود.</p>
