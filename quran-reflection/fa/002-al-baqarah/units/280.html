<section class="ayah-block" id="ayah-280" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ وجودِ شخصِ گرفتار تنگدستی در شرطِ آیه.">كانَ</button>
    <button class="word-link" type="button" data-word="ذو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذو</button>
    <button class="word-link" type="button" data-word="عُسرَةٍ" data-root="ع س ر" data-root-meaning="سختی و تنگنایی که انجام کار، تحمل وضعیت یا دستیابی به نتیجه را دشوار می‌سازد." data-context="تنگدستی؛ وضعیتِ بدهکاری که امکانِ پرداخت ندارد." data-learn-more="/quran-terminology/fa/roots/ayn-s-r/">عُسرَةٍ</button>
    <button class="word-link" type="button" data-word="فَنَظِرَةٌ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="پس مهلت؛ فرصت دادن به بدهکار.">فَنَظِرَةٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="مَيسَرَةٍ" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت" data-context="گشایش؛ توانِ پرداختِ بدهی در پایانِ مهلت.">مَيسَرَةٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَن</button>
    <button class="word-link" type="button" data-word="تَصَدَّقوا" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="ببخشید؛ گذشتن از طلب به‌عنوان صدقه.">تَصَدَّقوا</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ وصفِ بخشیدن برای مخاطبان.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشید؛ در شرطِ دانستن.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانید؛ آگاهیِ مخاطبان از خیرِ بخشش.">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و اگر تنگدستی باشد، مهلتی تا گشایش؛ و اگر ببخشید، برای شما بهتر است، اگر بدانید.</p>
</section>
