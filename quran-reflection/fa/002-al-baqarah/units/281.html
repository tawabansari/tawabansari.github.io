  <p class="farsi-verse">و از روزی پروا کنید که در آن به سوی آن معبود یگانه بازگردانده می‌شوید؛ سپس به هر کس آنچه کسب کرده به‌تمامی داده می‌شود و بر آنان ستم نمی‌رود.</p>
