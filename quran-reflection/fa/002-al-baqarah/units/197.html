<section class="ayah-block" id="ayah-197" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۱۹۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الحَجُّ" data-root="ح ج ج" data-learn-more="/quran-terminology/fa/roots/h-j-j/" data-root-meaning="از قصد کردن و حج تا حجت و رویارویی استدلالی" data-context="حج؛ عبادتی که آیه ماه‌ها و محدودیت‌های رفتاری آن را بیان می‌کند.">الحَجُّ</button>
    <button class="word-link" type="button" data-word="أَشهُرٌ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="ماه‌ها؛ زمان‌های شناخته‌شدهٔ حج." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">أَشهُرٌ</button>
    <button class="word-link" type="button" data-word="مَعلومٰتٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="شناخته‌شده؛ وصفِ ماه‌های حج.">مَعلومٰتٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="فَرَضَ" data-root="ف ر ض" data-learn-more="/quran-terminology/fa/roots/f-r-dad/" data-root-meaning="از نشانه‌گذاری و تعیین سهم تا امر مقرر" data-context="بر خود مقرر ساخت؛ حج را به عهده گرفت.">فَرَضَ</button>
    <button class="word-link" type="button" data-word="فيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِنَّ</button>
    <button class="word-link" type="button" data-word="الحَجَّ" data-root="ح ج ج" data-learn-more="/quran-terminology/fa/roots/h-j-j/" data-root-meaning="از قصد کردن و حج تا حجت و رویارویی استدلالی" data-context="حج؛ عبادتی که شخص بر خود لازم کرده است.">الحَجَّ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="رَفَثَ" data-root="ر ف ث" data-root-meaning="گفتار جنسیِ آشکار یا زننده؛ و در کاربرد گسترده‌تر یا کنایی، نزدیکی جنسی و رفتارهای وابسته به آن." data-context="رفث؛ گفتار یا رفتار جنسی که در حج از آن نهی شده است." data-learn-more="/quran-terminology/fa/roots/r-f-th/">رَفَثَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="فُسوقَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="فسوق؛ بیرون رفتن از فرمان و رفتار ناروا در حج.">فُسوقَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="جِدالَ" data-root="ج د ل" data-root-meaning="رویارویی و رفت‌وبرگشت گفتار برای طرح، دفاع، پاسخ یا مقابله با یک موضع؛ ارزش آن به موضوع، دلیل و روش وابسته است." data-context="جدال؛ کشمکش و ستیزه در حج." data-learn-more="/quran-terminology/fa/roots/j-d-l/">جِدالَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَجِّ" data-root="ح ج ج" data-learn-more="/quran-terminology/fa/roots/h-j-j/" data-root-meaning="از قصد کردن و حج تا حجت و رویارویی استدلالی" data-context="حج؛ موقعیتی که این محدودیت‌ها دربارهٔ آن بیان شده‌اند.">الحَجِّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تَفعَلوا" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="انجام دهید؛ هر کار نیکی که از شما صادر شود.">تَفعَلوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="خَيرٍ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="نیکی؛ کار خوبی که آن معبود یگانه از آن آگاه است.">خَيرٍ</button>
    <button class="word-link" type="button" data-word="يَعلَمهُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="آن را می‌داند؛ آگاهیِ آن معبود یگانه از کار نیک.">يَعلَمهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَتَزَوَّدوا" data-root="ز و د" data-root-meaning="توشه و فراهم کردن یا همراه برداشتن آن برای راه یا مرحلهٔ پیش رو؛ در کاربرد مجازی، دستاوردِ همراهِ انسان." data-context="و توشه بگیرید؛ برای راه و مسئولیت خود آماده شوید." data-learn-more="/quran-terminology/fa/roots/z-w-d/">وَتَزَوَّدوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="خَيرَ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهترین؛ برتریِ تقوا در میان توشه‌ها.">خَيرَ</button>
    <button class="word-link" type="button" data-word="الزّادِ" data-root="ز و د" data-root-meaning="توشه و فراهم کردن یا همراه برداشتن آن برای راه یا مرحلهٔ پیش رو؛ در کاربرد مجازی، دستاوردِ همراهِ انسان." data-context="توشه؛ آنچه برای پیمودن راه با خود فراهم می‌کنند." data-learn-more="/quran-terminology/fa/roots/z-w-d/">الزّادِ</button>
    <button class="word-link" type="button" data-word="التَّقوىٰ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="تقوا؛ مراقبت و پرهیز مسئولانه که بهترین توشه خوانده شده است.">التَّقوىٰ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاتَّقونِ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و از من پروا کنید؛ دعوتِ صاحبان خرد به تقوا.">وَاتَّقونِ</button>
    <button class="word-link" type="button" data-word="يٰأُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأُولِى</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-meaning="مغز و بخش خالص و برگزیدهٔ هر چیز؛ در کاربرد انسانی، خرد و نیروی فهم." data-context="خردها؛ در خطابِ «صاحبان خرد» برای پروا از آن معبود یگانه در سیاقِ حج و بهترین توشه." data-learn-more="/quran-terminology/fa/roots/l-b-b/">الأَلبٰبِ</button>
  </p>
  <p class="farsi-verse">حج در ماه‌هایی شناخته‌شده است؛ پس هر که در آنها حج را بر خود لازم کند، در حج آمیزش و نافرمانی و جدال نباشد. و هر نیکی که انجام دهید، آن معبود یگانه آن را می‌داند. و توشه برگیرید که بهترین توشه پرهیزگاری است؛ و از من پروا کنید، ای خردمندان.</p>
</section>
