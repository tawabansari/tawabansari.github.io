  <p class="farsi-verse">حج در ماه‌هایی شناخته‌شده است؛ پس هر که در آنها حج را بر خود لازم کند، در حج آمیزش و نافرمانی و جدال نباشد. و هر نیکی که انجام دهید، آن معبود یگانه آن را می‌داند. و توشه برگیرید که بهترین توشه پرهیزگاری است؛ و از من پروا کنید، ای خردمندان.</p>
