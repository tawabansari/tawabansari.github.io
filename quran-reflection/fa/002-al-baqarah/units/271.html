  <p class="farsi-verse">اگر صدقه‌ها را آشکار کنید، چه نیکوست؛ و اگر آنها را پنهان کنید و به تهیدستان بدهید، برای شما بهتر است؛ و از بدی‌هایتان می‌زداید؛ و آن معبود یگانه به آنچه می‌کنید آگاه است.</p>
