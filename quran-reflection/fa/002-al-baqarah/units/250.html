<section class="ayah-block" id="ayah-250" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="بَرَزوا" data-root="ب ر ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-r-z/" data-root-meaning="بیرون آمدن به فضای آشکار و نمایان شدن.">بَرَزوا</button>
    <button class="word-link" type="button" data-word="لِجالوتَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لِجالوتَ</button>
    <button class="word-link" type="button" data-word="وَجُنودِهِ" data-root="ج ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-d/" data-root-meaning="جند و جنود: سپاه، نیروها و گروه‌های سازمان‌یافتهٔ پشتیبان.">وَجُنودِهِ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَفرِغ" data-root="ف ر غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-gh/" data-root-meaning="تهی شدن و از کار فارغ شدن؛ افراغ: فرو ریختن.">أَفرِغ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="صَبرًا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">صَبرًا</button>
    <button class="word-link" type="button" data-word="وَثَبِّت" data-root="ث ب ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-b-t/" data-root-meaning="پایدار ماندن، استوار بودن و استوار ساختن.">وَثَبِّت</button>
    <button class="word-link" type="button" data-word="أَقدامَنا" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن">أَقدامَنا</button>
    <button class="word-link" type="button" data-word="وَانصُرنا" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">وَانصُرنا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومِ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرينَ</button>
  </p>
  <p class="farsi-verse">و چون در برابر جالوت و سپاهیانش آشکار شدند، گفتند: پروردگار ما، بر ما شکیبایی فرو ریز و گام‌هایمان را استوار کن و ما را بر گروه کافران یاری ده.</p>
</section>
