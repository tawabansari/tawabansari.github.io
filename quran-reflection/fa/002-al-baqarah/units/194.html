<section class="ayah-block" id="ayah-194" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۱۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الشَّهرُ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="ماه؛ در ترکیبِ ماه حرام." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">الشَّهرُ</button>
    <button class="word-link" type="button" data-word="الحَرامُ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="حرام و دارای حرمت؛ وصفِ ماه.">الحَرامُ</button>
    <button class="word-link" type="button" data-word="بِالشَّهرِ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="در برابر ماه؛ بیانِ مقابله با حرف باء." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">بِالشَّهرِ</button>
    <button class="word-link" type="button" data-word="الحَرامِ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="حرام؛ وصف ماهِ دوم در ساختِ مقابله.">الحَرامِ</button>
    <button class="word-link" type="button" data-word="وَالحُرُمٰتُ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="و حرمت‌ها؛ امورِ دارای حریم در حکمِ مقابله.">وَالحُرُمٰتُ</button>
    <button class="word-link" type="button" data-word="قِصاصٌ" data-root="ق ص ص" data-root-meaning="پی گرفتن اثر و بازگفتن؛ قصاص: مقابلهٔ متناسب با آسیب؛ در لغت، بریدن و کوتاه کردن نیز ثبت شده است." data-context="مقابلهٔ متناسب؛ دربارهٔ حرمت‌ها، با تعیین حد پاسخ در عبارتِ «بمثل ما اعتدى عليكم»." data-learn-more="/quran-terminology/fa/roots/q-sad-sad/">قِصاصٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَنِ</button>
    <button class="word-link" type="button" data-word="اعتَدىٰ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="تجاوز کرد؛ فعل شرط دربارهٔ آغازِ تعدی.">اعتَدىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="فَاعتَدوا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="پس مقابله کنید؛ پاسخِ محدود به همانندِ تعدی، طبق قید بعدی.">فَاعتَدوا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="بِمِثلِ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="به همانند؛ تعیینِ نسبت و حدِ پاسخ.">بِمِثلِ</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="اعتَدىٰ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="تجاوز کرده؛ فعلِ آسیب نخست در تعیین حدِ پاسخ.">اعتَدىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و پروا بدارید؛ فرمان تقوا در کنار اجازهٔ پاسخ.">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَاعلَموا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و بدانید؛ فرمانِ آگاهی از همراهی آن معبود یگانه با پرهیزگاران.">وَاعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پرهیزگاران؛ کسانی که همراهی الهی به آنان نسبت داده شده است.">المُتَّقينَ</button>
  </p>
  <p class="farsi-verse">ماه حرام در برابر ماه حرام، و حرمت‌ها را قصاص است. پس هر که بر شما تجاوز کرد، به همان اندازه که بر شما تجاوز کرده با او مقابله کنید؛ و از آن معبود یگانه پروا کنید و بدانید که آن معبود یگانه با پرهیزگاران است.</p>
</section>
