  <p class="farsi-verse">ماه حرام در برابر ماه حرام، و حرمت‌ها را قصاص است. پس هر که بر شما تجاوز کرد، به همان اندازه که بر شما تجاوز کرده با او مقابله کنید؛ و از آن معبود یگانه پروا کنید و بدانید که آن معبود یگانه با پرهیزگاران است.</p>
