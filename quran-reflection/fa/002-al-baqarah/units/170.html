  <p class="farsi-verse">و چون به آنان گفته شود: از آنچه آن معبود یگانه نازل کرده پیروی کنید، می‌گویند: بلکه از آنچه پدرانمان را بر آن یافته‌ایم پیروی می‌کنیم. آیا هرچند پدرانشان چیزی نمی‌فهمیدند و هدایت نمی‌یافتند؟</p>
