<section class="ayah-block" id="ayah-225" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤاخِذُكُمُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="شما را مؤاخذه می‌کند؛ در این بخش، مؤاخذه برای لغو نفی شده است.">يُؤاخِذُكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِاللَّغوِ" data-root="ل غ و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-gh-w/" data-root-meaning="گفتار بیهوده و بی‌اعتبار؛ سخن یا کاری که اعتنایی به آن نیست." data-context="برای لغو؛ سخن بی‌اعتبار در سوگندها.">بِاللَّغوِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَيمٰنِكُم" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="سوگندهایتان؛ موضوعِ تفاوت میان لغو و مسئولیت قلب.">أَيمٰنِكُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="يُؤاخِذُكُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="شما را مؤاخذه می‌کند؛ دربارهٔ آنچه دل‌ها کسب کرده‌اند.">يُؤاخِذُكُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كَسَبَت" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان" data-context="کسب کرده است؛ آنچه دل‌ها بر عهده گرفته‌اند.">كَسَبَت</button>
    <button class="word-link" type="button" data-word="قُلوبُكُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌هایتان؛ جایگاه قصد و کسب در این عبارت.">قُلوبُكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="آمرزنده؛ وصفی در کنار بردباری آن معبود یگانه.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="ح ل م" data-root-meaning="خواب و رؤیا؛ بلوغ در تعبیر «بلوغ الحلم»؛ خرد، بردباری و خویشتن‌داری در برابر شتاب‌زدگی." data-context="بردبار؛ وصف آن معبود یگانه در کنار آمرزش، همراه با بیان مسئولیت قلب." data-learn-more="/quran-terminology/fa/roots/h-l-m/">حَليمٌ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه شما را به سوگندهای بیهوده‌تان بازخواست نمی‌کند، ولی به آنچه دل‌هایتان کسب کرده بازخواست می‌کند؛ و آن معبود یگانه آمرزنده و بردبار است.</p>
</section>
