  <p class="farsi-verse">آیا پنداشتید وارد بهشت می‌شوید، در حالی که هنوز مانند آنچه بر پیشینیانتان گذشت به شما نرسیده است؟ تنگدستی و رنج به آنان رسید و چنان لرزانده شدند که پیامبر و کسانی که با او ایمان آورده بودند گفتند: یاری آن معبود یگانه کی خواهد بود؟ آگاه باشید که یاری آن معبود یگانه نزدیک است.</p>
