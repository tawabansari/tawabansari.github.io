<section class="ayah-block" id="ayah-239" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="خِفتُم" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم داشتید؛ درباره وضعیت خطر در هنگام نماز.">خِفتُم</button>
    <button class="word-link" type="button" data-word="فَرِجالًا" data-root="ر ج ل" data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ پا؛ و پیاده‌رفتن و پیادگان در شاخه‌های متمایز. معنای هر صورت از ساختمان واژه و سیاق شناخته می‌شود." data-context="پیاده؛ در برابر سواره، در فرمان نماز هنگام ترس.">فَرِجالًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="رُكبانًا" data-root="ر ك ب" data-learn-more="/quran-terminology/fa/roots/r-k-b/" data-root-meaning="سوار شدن و بر چیزی قرار گرفتن؛ ترکیب و برهم‌نشستن اجزا؛ در کاربرد گسترش‌یافته، وارد شدن در کار یا گذر از حالتی به حالت دیگر." data-context="سواره؛ در برابر پیاده در وضعیت خوف.">رُكبانًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="أَمِنتُم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="امنیت یافتید و از وضعیت ترس بیرون آمدید.">أَمِنتُم</button>
    <button class="word-link" type="button" data-word="فَاذكُرُوا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="پس خدا را یاد کنید.">فَاذكُرُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="عَلَّمَكُم" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="به شما آموخت.">عَلَّمَكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ در ساخت «نمی‌دانستید».">تَكونوا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانستید؛ دانشی که پیش از تعلیم نداشتید.">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">پس اگر ترسیدید، پیاده یا سواره؛ و چون ایمن شدید، آن معبود یگانه را یاد کنید، چنان‌که آنچه را نمی‌دانستید به شما آموخت.</p>
</section>
