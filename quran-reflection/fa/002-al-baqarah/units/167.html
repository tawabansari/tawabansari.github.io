  <p class="farsi-verse">و پیروان گویند: کاش بازگشتی برای ما بود تا از آنان بیزاری جوییم، چنان‌که از ما بیزاری جستند. این‌گونه آن معبود یگانه کردارهایشان را مایهٔ حسرتشان به آنان نشان می‌دهد؛ و آنان از آتش بیرون‌آمدنی نیستند.</p>
