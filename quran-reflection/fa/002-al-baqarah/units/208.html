<section class="ayah-block" id="ayah-208" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۰۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اند؛ مخاطبانِ فرمان ورود به سلم و نهی از پیروی گام‌های شیطان.">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="ادخُلوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="درآیید؛ فرمان ورود به سلم، همراه با قید همگانی و کاملِ «کافّة».">ادخُلوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السِّلمِ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="سلم؛ صلح، سلامت و تسلیم در فرمانی که مخاطبان را به ورود همگانی و کامل فرا می‌خواند.">السِّلمِ</button>
    <button class="word-link" type="button" data-word="كافَّةً" data-root="ك ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-f-f/" data-root-meaning="کف دست؛ بازداشتن و دست کشیدن؛ کافّه: همگی." data-context="همگی و به‌تمامی؛ قید فرمان ورود به سلم، با احتمال شمول همهٔ مخاطبان یا تمامیت ورود.">كافَّةً</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَّبِعوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="پیروی نکنید؛ نهی مخاطبان از دنبال کردن گام‌ها و راه و روش شیطان.">تَتَّبِعوا</button>
    <button class="word-link" type="button" data-word="خُطُوٰتِ" data-root="خ ط و" data-root-meaning="گام برداشتن و پیش رفتن با حرکت پا؛ خُطُوَات: گام‌ها." data-context="گام‌ها و راه و روش شیطان که از پیروی آن نهی شده است؛ در برابر فرمان ورود همگانی به سلم." data-learn-more="/quran-terminology/fa/roots/kh-tt-w/">خُطُوٰتِ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ گام‌ها و راه و روشی به او نسبت داده شده که مخاطبان نباید از آن پیروی کنند.">الشَّيطٰنِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمنِ شما؛ توصیف شیطان در بیان علت پرهیز از پیروی او.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصف دشمنی شیطان برای مخاطبان.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، همگی در صلح درآیید و گام‌های شیطان را دنبال نکنید؛ بی‌گمان او دشمن آشکار شماست.</p>
</section>
