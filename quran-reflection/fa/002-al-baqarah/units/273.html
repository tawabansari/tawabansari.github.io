<section class="ayah-block" id="ayah-273" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلفُقَراءِ" data-root="ف ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-r/" data-root-meaning="نیاز و تهیدستی؛ فاقره: گرفتاری کمرشکن." data-context="برای نیازمندان؛ گروهی که انفاق به آنان در این سیاق مطرح است.">لِلفُقَراءِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أُحصِروا" data-root="ح ص ر" data-root-meaning="بازداشتن یا محدود شدن امکان حرکت، دسترسی، انجام کار یا بروز رفتار؛ با مانع بیرونی، شرایط شخص یا خویشتن‌داری." data-context="بازداشته شده‌اند؛ محدودیتِ حرکت و فعالیتِ نیازمندان در راه خدا، با توضیحِ بعدیِ ناتوانی از رفت‌وآمد در زمین." data-learn-more="/quran-terminology/fa/roots/h-sad-r/">أُحصِروا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ در ترکیب «فی سبیل الله»، زمینهٔ بازداشته شدن این نیازمندان.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-meaning="همراه و پذیرای انجام امری شدن، یا تن دادن به فرمان و خواسته‌ای؛ با شاخه‌ای مرتبط که در آن فراهم بودن توان و امکان انجام کار برجسته می‌شود." data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="توان ندارند؛ ناتوانی از رفت‌وآمد در زمین، بدون تعیینِ علتِ آن در خود فعل.">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="ضَربًا" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="رفت‌وآمد و سفر؛ در ترکیب «ضربا فی الارض»، نه ضربه زدن.">ضَربًا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ گسترهٔ رفت‌وآمدی که امکان آن برای این گروه محدود است.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="يَحسَبُهُمُ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="آنان را می‌پندارد؛ برداشتِ شخصِ ناآگاه از وضعیت آنان.">يَحسَبُهُمُ</button>
    <button class="word-link" type="button" data-word="الجاهِلُ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه." data-context="ناآگاه؛ کسی که نیازِ پنهان آنان را نمی‌شناسد.">الجاهِلُ</button>
    <button class="word-link" type="button" data-word="أَغنِياءَ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="بی‌نیازان؛ وصفی که ناآگاه به اشتباه به آنان نسبت می‌دهد.">أَغنِياءَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="التَّعَفُّفِ" data-root="ع ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-f-f/" data-root-meaning="خویشتن‌داری در برابر میل یا درخواست و حفظ پاکدامنی." data-context="به سبب خویشتن‌داری؛ علتِ پنهان ماندن نیازشان از نگاه ناآگاه.">التَّعَفُّفِ</button>
    <button class="word-link" type="button" data-word="تَعرِفُهُم" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="آنان را می‌شناسی؛ شناختِ حال آنان از نشانه‌هایشان.">تَعرِفُهُم</button>
    <button class="word-link" type="button" data-word="بِسيمٰهُم" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز" data-context="از نشانه‌هایشان؛ نشانه‌هایی که وضعیت آنان را برای مخاطب آشکار می‌کند.">بِسيمٰهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَسـَٔلونَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="درخواست نمی‌کنند؛ در عبارتِ درخواست نکردنِ اصرارآمیز از مردم.">يَسـَٔلونَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ کسانی که از آنان درخواستِ اصرارآمیز نمی‌شود.">النّاسَ</button>
    <button class="word-link" type="button" data-word="إِلحافًا" data-root="ل ح ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h-f/" data-root-meaning="پوشاندن؛ الحاف در درخواست: اصرار و پافشاری." data-context="با اصرار و پافشاری؛ قیدِ درخواست از مردم در جملهٔ منفی.">إِلحافًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تُنفِقوا" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="انفاق کنید؛ هر خیری که از مال و امکانات در این سیاق می‌بخشید.">تُنفِقوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="خَيرٍ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="خیری؛ آنچه انفاق می‌شود و خداوند به آن داناست.">خَيرٍ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصفِ آگاهی خداوند به آنچه انفاق می‌شود.">عَليمٌ</button>
  </p>
  <p class="farsi-verse">برای تهیدستانی که در راه آن معبود یگانه بازداشته شده‌اند و توان سفر در زمین ندارند؛ ناآگاه از خویشتن‌داری‌شان آنان را بی‌نیاز می‌پندارد؛ آنان را از نشانشان می‌شناسی، از مردم با اصرار درخواست نمی‌کنند. و هر خیری که انفاق کنید، بی‌گمان آن معبود یگانه به آن داناست.</p>
</section>
