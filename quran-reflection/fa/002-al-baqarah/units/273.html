  <h2 class="ayah-title">البقره ۲:۲۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلفُقَراءِ" data-root="ف ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-r/" data-root-meaning="نیاز و تهیدستی؛ فاقره: گرفتاری کمرشکن.">لِلفُقَراءِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أُحصِروا" data-root="ح ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sad-r/" data-root-meaning="در تنگنا قرار دادن، بازداشتن و محصور کردن؛ حصور: خویشتن‌دار.">أُحصِروا</button>

    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-meaning="همراه و پذیرای انجام امری شدن، یا تن دادن به فرمان و خواسته‌ای؛ با شاخه‌ای مرتبط که در آن فراهم بودن توان و امکان انجام کار برجسته می‌شود." data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">يَستَطيعونَ</button>

    <button class="word-link" type="button" data-word="الجاهِلُ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه.">الجاهِلُ</button>
    <button class="word-link" type="button" data-word="أَغنِياءَ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن.">أَغنِياءَ</button>

    <button class="word-link" type="button" data-word="التَّعَفُّفِ" data-root="ع ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-f-f/" data-root-meaning="خویشتن‌داری در برابر میل یا درخواست و حفظ پاکدامنی.">التَّعَفُّفِ</button>
    <button class="word-link" type="button" data-word="تَعرِفُهُم" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">تَعرِفُهُم</button>
    <button class="word-link" type="button" data-word="بِسيمٰهُم" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز">بِسيمٰهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَسـَٔلونَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">يَسـَٔلونَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسَ</button>
    <button class="word-link" type="button" data-word="إِلحافًا" data-root="ل ح ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h-f/" data-root-meaning="پوشاندن؛ الحاف در درخواست: اصرار و پافشاری.">إِلحافًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تُنفِقوا" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">تُنفِقوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="خَيرٍ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٍ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَليمٌ</button>
  </p>
  <p class="farsi-verse">برای تهیدستانی که در راه آن معبود یگانه بازداشته شده‌اند و توان سفر در زمین ندارند؛ ناآگاه از خویشتن‌داری‌شان آنان را بی‌نیاز می‌پندارد؛ آنان را از نشانشان می‌شناسی، از مردم با اصرار درخواست نمی‌کنند. و هر خیری که انفاق کنید، بی‌گمان آن معبود یگانه به آن داناست.</p>
</section>
