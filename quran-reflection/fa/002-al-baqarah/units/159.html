  <p class="farsi-verse">بی‌گمان کسانی که آنچه را از دلایل روشن و هدایت نازل کرده‌ایم، پس از آنکه در کتاب برای مردم روشنش کرده‌ایم، پنهان می‌کنند، آن معبود یگانه آنان را لعنت می‌کند و لعنت‌کنندگان نیز آنان را لعنت می‌کنند.</p>
