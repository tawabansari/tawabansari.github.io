<section class="ayah-block" id="ayah-175" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۱۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اشتَرَوُا" data-root="ش ر ي" data-learn-more="/quran-terminology/fa/roots/sh-r-y/" data-root-meaning="خریدن، فروختن، مبادله کردن، و واگذار کردن چیزی در برابر گرفتن چیزی دیگر">اشتَرَوُا</button>
    <button class="word-link" type="button" data-word="الضَّلٰلَةَ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">الضَّلٰلَةَ</button>
    <button class="word-link" type="button" data-word="بِالهُدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">بِالهُدىٰ</button>
    <button class="word-link" type="button" data-word="وَالعَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">وَالعَذابَ</button>
    <button class="word-link" type="button" data-word="بِالمَغفِرَةِ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">بِالمَغفِرَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="أَصبَرَهُم" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">أَصبَرَهُم</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارِ</button>
  </p>
  <p class="farsi-verse">آنان کسانی‌اند که گمراهی را به بهای هدایت و عذاب را به بهای آمرزش خریدند؛ پس چه شکیبایند بر آتش!</p>
</section>
