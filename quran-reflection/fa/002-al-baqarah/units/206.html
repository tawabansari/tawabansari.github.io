<section class="ayah-block" id="ayah-206" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="اتَّقِ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">اتَّقِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَخَذَتهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/">أَخَذَتهُ</button>
    <button class="word-link" type="button" data-word="العِزَّةُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/">العِزَّةُ</button>
    <button class="word-link" type="button" data-word="بِالإِثمِ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/">بِالإِثمِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَحَسبُهُ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">فَحَسبُهُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="المِهادُ" data-root="م ه د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المِهادُ</button>
  </p>
  <p class="farsi-verse">و چون به او گفته شود: از آن معبود یگانه پروا کن، غرور او را به گناه می‌کشاند؛ پس جهنم برای او بس است، و چه بد بستری است.</p>
</section>
