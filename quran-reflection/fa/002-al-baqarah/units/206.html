<section class="ayah-block" id="ayah-206" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="به او گفته شود؛ فعل مجهول.">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="اتَّقِ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پروا کن و خود را از نافرمانی نگه دار.">اتَّقِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَخَذَتهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="او را فرا می‌گیرد و می‌کشاند.">أَخَذَتهُ</button>
    <button class="word-link" type="button" data-word="العِزَّةُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری" data-context="عزت‌طلبی و غرورِ مانعِ پذیرش اندرز.">العِزَّةُ</button>
    <button class="word-link" type="button" data-word="بِالإِثمِ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="به گناه و در پیوند با آن.">بِالإِثمِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَحَسبُهُ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="پس برای او بسنده است.">فَحَسبُهُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="و به‌راستی چه بد؛ فعلِ نکوهش.">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="المِهادُ" data-root="م ه د" data-root-meaning="آماده و مناسب ساختن جایگاه یا شرایط برای قرار گرفتن، زندگی کردن یا انجام کاری؛ مهد و مهاد: گهواره، بستر یا جایگاه آماده." data-context="بستر و جایگاه جهنم؛ در ساختِ نکوهشِ «چه بد بستری»." data-learn-more="/quran-terminology/fa/roots/m-h2-d/">المِهادُ</button>
  </p>
  <p class="farsi-verse">و چون به او گفته شود: از آن معبود یگانه پروا کن، غرور او را به گناه می‌کشاند؛ پس جهنم برای او بس است، و چه بد بستری است.</p>
</section>
