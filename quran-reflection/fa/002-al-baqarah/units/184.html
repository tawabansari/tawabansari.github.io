  <p class="farsi-verse">روزهایی شمرده؛ پس هر که از شما بیمار یا در سفر باشد، شماری از روزهای دیگر. و بر کسانی که توان آن را دارند، فدیه‌ای است: خوراک یک نیازمند. پس هر که داوطلبانه نیکی کند، برای او بهتر است؛ و روزه گرفتن برای شما بهتر است، اگر بدانید.</p>
