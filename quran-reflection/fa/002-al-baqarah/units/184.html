<section class="ayah-block" id="ayah-184" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۱۸۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَيّامًا" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزهایی؛ مدت روزه که در ادامه شمارش‌شده وصف می‌شود.">أَيّامًا</button>
    <button class="word-link" type="button" data-word="مَعدودٰتٍ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="شمارش‌شده و محدود؛ وصف روزهای روزه.">مَعدودٰتٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ قرار داشتن یکی از شما در وضعیت بیماری یا سفر.">كانَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="مَريضًا" data-root="م ر ض" data-learn-more="/quran-terminology/fa/roots/m-r-dad/" data-root-meaning="بیماری، سستی، نقصان، و خروج از حالت سلامت و اعتدال" data-context="بیمار؛ کسی که بیماری دارد.">مَريضًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="سَفَرٍ" data-root="س ف ر" data-root-meaning="آشکار شدن و کنار رفتن پوشیدگی؛ و در شاخه‌های تثبیت‌شدهٔ آن، سفر کردن، روشن شدن، کتاب و رساندن نوشته یا پیام." data-context="سفر؛ وضعیت مسافرت." data-learn-more="/quran-terminology/fa/roots/s-f-r/">سَفَرٍ</button>
    <button class="word-link" type="button" data-word="فَعِدَّةٌ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="پس شماری؛ شمار روزهایی که باید در روزهای دیگر جبران شود.">فَعِدَّةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزهای دیگر؛ زمانی برای جبران روزه.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="أُخَرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="دیگر؛ وصف روزهایی جدا از روزهای پیشین.">أُخَرَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُطيقونَهُ" data-root="ط و ق" data-root-meaning="دربرگرفتن و احاطه؛ و در شاخهٔ مربوط به انسان، توان و ظرفیت انجام یا تحمل کاری." data-context="توان یا طاقت انجام آن را دارند؛ چگونگی این توان و دشواری آن نیازمند بررسی سیاق است." data-learn-more="/quran-terminology/fa/roots/tt-w-q/">يُطيقونَهُ</button>
    <button class="word-link" type="button" data-word="فِديَةٌ" data-root="ف د ي" data-learn-more="/quran-terminology/fa/roots/f-d-y/" data-root-meaning="رهایی در برابر چیزی که جای دیگری قرار می‌گیرد" data-context="فدیه؛ جبرانِ بیان‌شده به صورت خوراک نیازمند.">فِديَةٌ</button>
    <button class="word-link" type="button" data-word="طَعامُ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا" data-context="خوراک؛ چیزی که برای تغذیهٔ نیازمند فراهم می‌شود.">طَعامُ</button>
    <button class="word-link" type="button" data-word="مِسكينٍ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-context="نیازمند؛ کسی که خوراک فدیه برای اوست." data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن؛ و در شاخهٔ «مسکین»، نیازمندی و کم‌توانی بر اثر فشار نیاز.">مِسكينٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="تَطَوَّعَ" data-root="ط و ع" data-root-meaning="همراه و پذیرای انجام امری شدن، یا تن دادن به فرمان و خواسته‌ای؛ با شاخه‌ای مرتبط که در آن فراهم بودن توان و امکان انجام کار برجسته می‌شود." data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="داوطلبانه انجام دهد؛ اقدام اختیاری برای خیر بیشتر.">تَطَوَّعَ</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="خیری؛ کار نیکِ داوطلبانه.">خَيرًا</button>
    <button class="word-link" type="button" data-word="فَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُوَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ سود و برتریِ کار نیک برای انجام‌دهنده.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَن</button>
    <button class="word-link" type="button" data-word="تَصوموا" data-root="ص و م" data-root-meaning="خودداری و بازایستادن از یک کار یا حرکت." data-context="روزه بگیرید؛ انجام روزه در چارچوب وضعیت‌ها و شرایط بیان‌شده در آیه." data-learn-more="/quran-terminology/fa/roots/sad-w-m/">تَصوموا</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ وصف ارزش روزه گرفتن برای مخاطبان در این سیاق.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشید؛ در ترکیب شرطیِ مربوط به دانستن.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="بدانید؛ آگاه بودن از خیر بیان‌شده.">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">روزهایی شمرده؛ پس هر که از شما بیمار یا در سفر باشد، شماری از روزهای دیگر. و بر کسانی که توان آن را دارند، فدیه‌ای است: خوراک یک نیازمند. پس هر که داوطلبانه نیکی کند، برای او بهتر است؛ و روزه گرفتن برای شما بهتر است، اگر بدانید.</p>
</section>
