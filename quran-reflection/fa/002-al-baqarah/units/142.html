  <p class="farsi-verse">کم‌خردان از مردم خواهند گفت: چه چیز آنان را از قبله‌ای که بر آن بودند برگرداند؟ بگو: مشرق و مغرب برای آن معبود یگانه است؛ هر که را بخواهد به راهی راست هدایت می‌کند.</p>
