  <p class="farsi-verse">زنانتان کشتزاری برای شما هستند؛ پس هرگونه که خواستید به کشتزارتان درآیید و برای خود پیش فرستید؛ و از آن معبود یگانه پروا کنید و بدانید که او را دیدار خواهید کرد؛ و مؤمنان را بشارت بده.</p>
