<section class="ayah-block" id="ayah-276" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَمحَقُ" data-root="م ح ق" data-learn-more="/quran-terminology/fa/roots/m-h-q/" data-root-meaning="محو کردن، کاستن تدریجی، از میان بردن، فرسودن، بی‌برکت ساختن، و نابود شدن چیزی تا رسیدن به کاهش یا محو کامل">يَمحَقُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الرِّبوٰا۟" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/">الرِّبوٰا۟</button>
    <button class="word-link" type="button" data-word="وَيُربِى" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/">وَيُربِى</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتِ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/">الصَّدَقٰتِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلَّ</button>
    <button class="word-link" type="button" data-word="كَفّارٍ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">كَفّارٍ</button>
    <button class="word-link" type="button" data-word="أَثيمٍ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/">أَثيمٍ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه ربا را نابود می‌کند و صدقه‌ها را می‌رویاند؛ و آن معبود یگانه هیچ ناسپاس گناهکاری را دوست نمی‌دارد.</p>
