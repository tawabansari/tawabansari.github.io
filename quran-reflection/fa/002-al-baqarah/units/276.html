<section class="ayah-block" id="ayah-276" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَمحَقُ" data-root="م ح ق" data-learn-more="/quran-terminology/fa/roots/m-h-q/" data-root-meaning="محو کردن، کاستن تدریجی، از میان بردن، فرسودن، بی‌برکت ساختن، و نابود شدن چیزی تا رسیدن به کاهش یا محو کامل" data-context="می‌کاهد و نابود می‌کند">يَمحَقُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الرِّبوٰا۟" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/" data-root-meaning="بالا آمدن، افزون شدن، برآمدن، زیاد شدن، رشد کردن، و از حد پیشین بالاتر رفتن" data-context="ربا">الرِّبوٰا۟</button>
    <button class="word-link" type="button" data-word="وَيُربِى" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/" data-root-meaning="بالا آمدن، افزون شدن، برآمدن، زیاد شدن، رشد کردن، و از حد پیشین بالاتر رفتن" data-context="و می‌افزاید">وَيُربِى</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتِ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="صدقه‌ها">الصَّدَقٰتِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دوست ندارد">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هیچ؛ در ساخت نفی">كُلَّ</button>
    <button class="word-link" type="button" data-word="كَفّارٍ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="بسیار ناسپاس">كَفّارٍ</button>
    <button class="word-link" type="button" data-word="أَثيمٍ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="گناهکار">أَثيمٍ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه ربا را نابود می‌کند و صدقه‌ها را می‌رویاند؛ و آن معبود یگانه هیچ ناسپاس گناهکاری را دوست نمی‌دارد.</p>
</section>
