  <p class="farsi-verse">و کسانی از شما که می‌میرند و همسرانی بر جای می‌گذارند، همسرانشان چهار ماه و ده روز در انتظار بمانند؛ پس چون به پایان مدتشان رسیدند، در آنچه به شیوهٔ پسندیده دربارهٔ خود انجام دهند گناهی بر شما نیست؛ و آن معبود یگانه به آنچه می‌کنید آگاه است.</p>
