<section class="ayah-block" id="ayah-234" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُتَوَفَّونَ" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="وفات می‌کنند؛ جانشان به‌تمامی گرفته می‌شود.">يُتَوَفَّونَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَيَذَرونَ" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="و بر جای می‌گذارند؛ باقی گذاشتنِ همسران پس از مرگ.">وَيَذَرونَ</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="همسرانی؛ زنانی که پس از وفات شوهر باقی می‌مانند.">أَزوٰجًا</button>
    <button class="word-link" type="button" data-word="يَتَرَبَّصنَ" data-root="ر ب ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-b-sad/" data-root-meaning="در انتظار ماندن و چشم به رویدادی داشتن." data-context="انتظار می‌کشند؛ رعایت مدت تعیین‌شده برای خود.">يَتَرَبَّصنَ</button>
    <button class="word-link" type="button" data-word="بِأَنفُسِهِنَّ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="دربارهٔ خودشان؛ ناظر به انتظار زنانِ یادشده.">بِأَنفُسِهِنَّ</button>
    <button class="word-link" type="button" data-word="أَربَعَةَ" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی" data-context="چهار؛ شمارِ ماه‌های مدت انتظار.">أَربَعَةَ</button>
    <button class="word-link" type="button" data-word="أَشهُرٍ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="ماه‌ها؛ چهار ماه از مدت انتظار پس از وفات همسر." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">أَشهُرٍ</button>
    <button class="word-link" type="button" data-word="وَعَشرًا" data-root="ع ش ر" data-root-meaning="ده و صورت‌ها و نسبت‌های عددی آن؛ معاشرت، همراهی، خویشاوندی و جماعت؛ عشار: شتران مادهٔ نزدیک به زایمان." data-context="و ده؛ مدت افزوده بر چهار ماه، با معنای رایجِ ده روز." data-learn-more="/quran-terminology/fa/roots/ayn-sh-r/">وَعَشرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="بَلَغنَ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="رسیدند؛ رسیدن زنان به پایان مدت انتظار.">بَلَغنَ</button>
    <button class="word-link" type="button" data-word="أَجَلَهُنَّ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت یا موعد مقرر؛ در سیاق مناسب، پایان آن مدت." data-context="موعدشان؛ پایان مدت انتظارِ مقرر.">أَجَلَهُنَّ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="جُناحَ" data-root="ج ن ح" data-root-meaning="متمایل شدن یا رو آوردن به یک سو؛ بال و بخش کناری بدن یا چیزها؛ و گناه یا مسئولیتی که موجب ملامت و بازخواست می‌شود." data-learn-more="/quran-terminology/fa/roots/j-n-h/" data-context="گناه یا ملامت؛ آنچه در شرطِ یادشده بر شما نیست.">جُناحَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيما</button>
    <button class="word-link" type="button" data-word="فَعَلنَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="انجام دادند؛ اقدام زنان دربارهٔ خود پس از پایان مدت.">فَعَلنَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِنَّ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خودشان؛ موضوعِ اقدامِ پسندیدهٔ زنان.">أَنفُسِهِنَّ</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="به شیوهٔ پسندیده؛ قیدِ اقدام آنان دربارهٔ خود.">بِالمَعروفِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دهید؛ کارهای مخاطبان که از آگاهی الهی بیرون نیست.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="آگاه؛ وصفِ آگاهی آن معبود یگانه از کارهای شما." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">خَبيرٌ</button>
  </p>
  <p class="farsi-verse">و کسانی از شما که می‌میرند و همسرانی بر جای می‌گذارند، همسرانشان چهار ماه و ده روز در انتظار بمانند؛ پس چون به پایان مدتشان رسیدند، در آنچه به شیوهٔ پسندیده دربارهٔ خود انجام دهند گناهی بر شما نیست؛ و آن معبود یگانه به آنچه می‌کنید آگاه است.</p>
</section>
