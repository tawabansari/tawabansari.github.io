  <p class="farsi-verse">و مَثَل کسانی که کفر ورزیدند، همچون مَثَل کسی است که بر چیزی بانگ می‌زند که جز خواندن و فریادی نمی‌شنود؛ کرند، گنگ‌اند، کورند؛ پس خرد نمی‌ورزند.</p>
