<section class="ayah-block" id="ayah-245" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="ذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُقرِضُ" data-root="ق ر ض" data-learn-more="/quran-terminology/fa/roots/q-r-dad/" data-root-meaning="بریدن بخشی از مال، جدا کردن و دادن آن با انتظار بازگشت یا پاداش، قرض دادن، و واگذاری موقت چیزی از دارایی" data-context="قرض می‌دهد؛ دعوت به وام نیکو به آن معبود یگانه.">يُقرِضُ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قَرضًا" data-root="ق ر ض" data-learn-more="/quran-terminology/fa/roots/q-r-dad/" data-root-meaning="بریدن بخشی از مال، جدا کردن و دادن آن با انتظار بازگشت یا پاداش، قرض دادن، و واگذاری موقت چیزی از دارایی" data-context="وامی؛ آنچه به‌عنوان قرض داده می‌شود.">قَرضًا</button>
    <button class="word-link" type="button" data-word="حَسَنًا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکو؛ وصف وام مورد دعوت.">حَسَنًا</button>
    <button class="word-link" type="button" data-word="فَيُضٰعِفَهُ" data-root="ض ع ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="ناتوانی؛ در شاخه‌ای دیگر، چند برابر شدن و افزونی." data-context="پس آن را چند برابر می‌کند؛ افزایش بازده آن وام.">فَيُضٰعِفَهُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="أَضعافًا" data-root="ض ع ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="ناتوانی؛ در شاخه‌ای دیگر، چند برابر شدن و افزونی." data-context="چندین برابر؛ بیان میزان افزوده‌شدن پاداش.">أَضعافًا</button>
    <button class="word-link" type="button" data-word="كَثيرَةً" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بسیار؛ وصف آن چندبرابرها.">كَثيرَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَقبِضُ" data-root="ق ب ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-b-dad/" data-root-meaning="گرفتن و جمع کردن؛ قبضه: مشت یا مقدار گرفته‌شده." data-context="تنگ می‌گیرد؛ در برابر گشایش دادن.">يَقبِضُ</button>
    <button class="word-link" type="button" data-word="وَيَبصُۜطُ" data-root="ب س ط" data-root-meaning="گشودن، گستردن و امتداد دادن؛ در کاربردهای گوناگون، گشایش روزی یا وسعت دانش و توانایی نیز از سیاق روشن می‌شود." data-context="و گشایش می‌دهد؛ فعل مضارع در برابر قبض، با مفعولی که در این بخش نام برده نشده است." data-learn-more="/quran-terminology/fa/roots/b-s-tt/">وَيَبصُۜطُ</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="بازگردانده می‌شوید؛ بازگشت به سوی او.">تُرجَعونَ</button>
  </p>
  <p class="farsi-verse">کیست که به آن معبود یگانه وامی نیکو دهد تا آن را برایش چندین برابر کند؟ و آن معبود یگانه تنگ می‌گیرد و گشایش می‌دهد، و به سوی او بازگردانده می‌شوید.</p>
</section>
