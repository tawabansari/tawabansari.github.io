<section class="ayah-block" id="ayah-238" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حٰفِظوا" data-root="ح ف ظ" data-root-meaning="نگه داشتن و مراقبت کردن از چیزی تا ضایع، فراموش، رها یا تباه نشود." data-context="مواظبت کنید؛ امر به رعایت و رها نکردنِ صلاةها." data-learn-more="/quran-terminology/fa/roots/h-f-zha/">حٰفِظوا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الصَّلَوٰتِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلاةها؛ اعمال عبادیِ موردِ فرمانِ مواظبت.">الصَّلَوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="و صلاة؛ در ترکیبِ صلاةِ میانه.">وَالصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="الوُسطىٰ" data-root="و س ط" data-learn-more="/quran-terminology/fa/roots/w-s-tt/" data-root-meaning="میانه، میانجیگاه و اعتدال؛ از قرار گرفتن در میان چیزها تا عدالت، سنجیدگی و معنای «أُمَّةً وَسَطًا» در قرآن" data-context="میانه؛ وصفِ صلاةِ یادشده.">الوُسطىٰ</button>
    <button class="word-link" type="button" data-word="وَقوموا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="و بایستید؛ برای آن معبود یگانه.">وَقوموا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="قٰنِتينَ" data-root="ق ن ت" data-learn-more="/quran-terminology/fa/roots/q-n-t/" data-root-meaning="از فرمان‌پذیری و پایبندی تا ایستادگی در عبادت" data-context="فرمان‌بردار و با خضوع.">قٰنِتينَ</button>
  </p>
  <p class="farsi-verse">بر صلات‌ها و صلات میانه مراقبت کنید و فرمانبردار برای آن معبود یگانه بایستید.</p>
</section>
