<section class="ayah-block" id="ayah-238" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حٰفِظوا" data-root="ح ف ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-f-zha/" data-root-meaning="نگهداری، مراقبت، به خاطر سپردن و از آسیب محفوظ داشتن.">حٰفِظوا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الصَّلَوٰتِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلَوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">وَالصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="الوُسطىٰ" data-root="و س ط" data-learn-more="/quran-terminology/fa/roots/w-s-tt/" data-root-meaning="میانه، میانجیگاه و اعتدال؛ از قرار گرفتن در میان چیزها تا عدالت، سنجیدگی و معنای «أُمَّةً وَسَطًا» در قرآن">الوُسطىٰ</button>
    <button class="word-link" type="button" data-word="وَقوموا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَقوموا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="قٰنِتينَ" data-root="ق ن ت" data-learn-more="/quran-terminology/fa/roots/q-n-t/" data-root-meaning="از فرمان‌پذیری و پایبندی تا ایستادگی در عبادت">قٰنِتينَ</button>
  </p>
  <p class="farsi-verse">بر صلات‌ها و صلات میانه مراقبت کنید و فرمانبردار برای آن معبود یگانه بایستید.</p>
</section>
