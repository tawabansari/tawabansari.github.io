  <h2 class="ayah-title">البقره ۲:۲۶۸</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="الفَقرَ" data-root="ف ق ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الفَقرَ</button>
    <button class="word-link" type="button" data-word="وَيَأمُرُكُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/">وَيَأمُرُكُم</button>

    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>

    <button class="word-link" type="button" data-word="مَغفِرَةً" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/">مَغفِرَةً</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>

  </p>
  <p class="farsi-verse">شیطان به شما وعدهٔ فقر می‌دهد و شما را به زشتکاری فرمان می‌دهد؛ و آن معبود یگانه به شما آمرزشی از خود و فضلی وعده می‌دهد؛ و آن معبود یگانه گشایشگر و داناست.</p>
