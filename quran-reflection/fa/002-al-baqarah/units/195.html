  <p class="farsi-verse">و در راه آن معبود یگانه انفاق کنید و خود را با دست‌های خویش به هلاکت نیفکنید؛ و نیکی کنید، بی‌گمان آن معبود یگانه نیکوکاران را دوست می‌دارد.</p>
