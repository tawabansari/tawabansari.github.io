  <p class="farsi-verse">و آن معبود یگانه را به سبب سوگندهایتان مانعی برای نیکی کردن و پرهیزگاری و سازش دادن میان مردم قرار ندهید؛ و آن معبود یگانه شنوا و داناست.</p>
