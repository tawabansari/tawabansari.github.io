  <p class="farsi-verse">پس اگر او را طلاق داد، پس از آن برایش حلال نیست تا با شوهری دیگر ازدواج کند. پس اگر او طلاقش داد، گناهی بر آن دو نیست که به یکدیگر بازگردند، اگر گمان دارند که مرزهای آن معبود یگانه را برپا می‌دارند. و اینها مرزهای آن معبود یگانه است که برای مردمی که می‌دانند روشن می‌کند.</p>
