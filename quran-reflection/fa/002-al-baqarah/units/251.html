    <button class="word-link" type="button" data-word="دَفعُ" data-root="د ف ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-f-ayn/" data-root-meaning="دور راندن، دفاع کردن یا چیزی را به دیگری سپردن.">دَفعُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسَ</button>
    <button class="word-link" type="button" data-word="بَعضَهُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی">بَعضَهُم</button>

    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضُ</button>

  </p>
  <p class="farsi-verse">پس به اذن آن معبود یگانه آنان را شکست دادند و داوود جالوت را کشت؛ و آن معبود یگانه پادشاهی و حکمت به او داد و از آنچه می‌خواست به او آموخت. و اگر آن معبود یگانه برخی مردم را به وسیلهٔ برخی دیگر دفع نمی‌کرد، زمین تباه می‌شد؛ ولی آن معبود یگانه بر جهانیان فضل دارد.</p>
</section>
