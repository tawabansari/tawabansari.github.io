  <p class="farsi-verse">پس به اذن آن معبود یگانه آنان را شکست دادند و داوود جالوت را کشت؛ و آن معبود یگانه پادشاهی و حکمت به او داد و از آنچه می‌خواست به او آموخت. و اگر آن معبود یگانه برخی مردم را به وسیلهٔ برخی دیگر دفع نمی‌کرد، زمین تباه می‌شد؛ ولی آن معبود یگانه بر جهانیان فضل دارد.</p>
