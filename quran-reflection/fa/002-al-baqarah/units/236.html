  <p class="farsi-verse">اگر زنان را پیش از آنکه با آنان تماس داشته باشید یا برایشان مهری تعیین کرده باشید طلاق دهید، گناهی بر شما نیست؛ و آنان را بهره‌مند سازید، توانگر به اندازهٔ توانش و تنگدست به اندازهٔ توانش، بهره‌ای به شیوهٔ پسندیده؛ حقی بر نیکوکاران.</p>
