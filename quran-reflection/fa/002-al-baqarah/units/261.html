  <p class="farsi-verse">مَثَل کسانی که اموالشان را در راه آن معبود یگانه انفاق می‌کنند، همچون دانه‌ای است که هفت خوشه برویاند و در هر خوشه صد دانه باشد؛ و آن معبود یگانه برای هر که بخواهد چند برابر می‌کند؛ و آن معبود یگانه گشایشگر و داناست.</p>
