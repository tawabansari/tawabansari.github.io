<section class="ayah-block" id="ayah-261" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مَثَل">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="انفاق می‌کنند">يُنفِقونَ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="اموالشان">أَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ در راه آن معبود یگانه">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كَمَثَلِ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مانند مَثَل">كَمَثَلِ</button>
    <button class="word-link" type="button" data-word="حَبَّةٍ" data-root="ح ب ب" data-root-meaning="دانه و بذر؛ «حَبّ» دانه و غله و «حَبَّة» یک دانه است." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="یک دانه">حَبَّةٍ</button>
    <button class="word-link" type="button" data-word="أَنبَتَت" data-root="ن ب ت" data-learn-more="/quran-terminology/fa/roots/n-b-t/" data-root-meaning="روییدن، رویاندن و آشکار شدن حیات از بستر مناسب" data-context="رویاند">أَنبَتَت</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت" data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="سَنابِلَ" data-root="س ن ب ل" data-root-meaning="خوشهٔ غله؛ بخش دانه‌دار گیاه که دانه‌های محصول در آن پدید می‌آیند و کنار یکدیگر قرار می‌گیرند." data-context="خوشه" data-learn-more="/quran-terminology/fa/roots/s-n-b-l/">سَنابِلَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر">كُلِّ</button>
    <button class="word-link" type="button" data-word="سُنبُلَةٍ" data-root="س ن ب ل" data-root-meaning="خوشهٔ غله؛ بخش دانه‌دار گیاه که دانه‌های محصول در آن پدید می‌آیند و کنار یکدیگر قرار می‌گیرند." data-context="خوشه" data-learn-more="/quran-terminology/fa/roots/s-n-b-l/">سُنبُلَةٍ</button>
    <button class="word-link" type="button" data-word="مِا۟ئَةُ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="م أ ي" data-learn-more="/quran-terminology/fa/roots/m-a-y/" data-root-meaning="عدد صد و صورت‌های وابسته آن." data-context="صد">مِا۟ئَةُ</button>
    <button class="word-link" type="button" data-word="حَبَّةٍ" data-root="ح ب ب" data-root-meaning="دانه و بذر؛ «حَبّ» دانه و غله و «حَبَّة» یک دانه است." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دانه">حَبَّةٍ</button>
    ۗ

    <button class="word-link" type="button" data-word="يُضٰعِفُ" data-root="ض ع ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="ناتوانی؛ در شاخه‌ای دیگر، چند برابر شدن و افزونی." data-context="چند برابر می‌کند">يُضٰعِفُ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا" data-context="بخواهد">يَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="وٰسِعٌ" data-root="و س ع" data-learn-more="/quran-terminology/fa/roots/w-s-ayn/" data-root-meaning="از فراخی مکان تا گنجایش، توان و فراگیری" data-context="گشایشگر">وٰسِعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا">عَليمٌ</button>
  </p>
  <p class="farsi-verse">مَثَل کسانی که اموالشان را در راه آن معبود یگانه انفاق می‌کنند، همچون دانه‌ای است که هفت خوشه برویاند و در هر خوشه صد دانه باشد؛ و آن معبود یگانه برای هر که بخواهد چند برابر می‌کند؛ و آن معبود یگانه گشایشگر و داناست.</p>
</section>
