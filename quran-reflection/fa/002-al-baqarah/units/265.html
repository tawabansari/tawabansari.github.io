<section class="ayah-block" id="ayah-265" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَثَلُ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="و مَثَل و تصویرِ مقایسه‌ای.">وَمَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="می‌بخشند و هزینه می‌کنند.">يُنفِقونَ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُمُ" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="دارایی‌ها و اموالشان.">أَموٰلَهُمُ</button>
    <button class="word-link" type="button" data-word="ابتِغاءَ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="طلب و جست‌وجوی؛ هدفِ انفاق.">ابتِغاءَ</button>
    <button class="word-link" type="button" data-word="مَرضاتِ" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل" data-context="خشنودی و رضایت.">مَرضاتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَتَثبيتًا" data-root="ث ب ت" data-root-meaning="«ث ب ت» به استوار بودن و برقرار ماندن چیزی در جایگاه، وضعیت یا اعتبار خود اشاره دارد؛ و در ساختمان‌های سببی، به استوار کردن، برقرار نگه داشتن یا ثابت ساختن چیزی می‌رسد." data-context="استواری بخشیدن از جانب خویشتن؛ در زمینهٔ انفاق و تصمیم درونی." data-learn-more="/quran-terminology/fa/roots/th-b-t/">وَتَثبيتًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خویشتن و جان‌های خودشان؛ سرچشمهٔ استوارسازی در این خوانش.">أَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="كَمَثَلِ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مانند مَثَل و تصویر.">كَمَثَلِ</button>
    <button class="word-link" type="button" data-word="جَنَّةٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغی.">جَنَّةٍ</button>
    <button class="word-link" type="button" data-word="بِرَبوَةٍ" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/" data-root-meaning="بالا آمدن، افزون شدن، برآمدن، زیاد شدن، رشد کردن، و از حد پیشین بالاتر رفتن" data-context="بر بلندی و زمین مرتفع.">بِرَبوَةٍ</button>
    <button class="word-link" type="button" data-word="أَصابَها" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود" data-context="به آن رسید؛ باران به باغ رسید.">أَصابَها</button>
    <button class="word-link" type="button" data-word="وابِلٌ" data-root="و ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-b-l/" data-root-meaning="سنگینی و شدت؛ وابل: باران تند؛ وبال: پیامد زیان‌بار." data-context="باران فراوان و درشت.">وابِلٌ</button>
    <button class="word-link" type="button" data-word="فَـٔاتَت" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="پس داد و به بار آورد.">فَـٔاتَت</button>
    <button class="word-link" type="button" data-word="أُكُلَها" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="محصول و میوهٔ آن.">أُكُلَها</button>
    <button class="word-link" type="button" data-word="ضِعفَينِ" data-root="ض ع ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="ناتوانی؛ در شاخه‌ای دیگر، چند برابر شدن و افزونی." data-context="دوچندان؛ وصفِ مقدار محصول.">ضِعفَينِ</button>
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يُصِبها" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود" data-context="به آن برسد؛ در جملهٔ منفی دربارهٔ باران.">يُصِبها</button>
    <button class="word-link" type="button" data-word="وابِلٌ" data-root="و ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-b-l/" data-root-meaning="سنگینی و شدت؛ وابل: باران تند؛ وبال: پیامد زیان‌بار." data-context="باران فراوان و درشت.">وابِلٌ</button>
    <button class="word-link" type="button" data-word="فَطَلٌّ" data-root="ط ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-l-l/" data-root-meaning="باران سبک یا نم‌باران." data-context="پس باران سبک یا شبنم؛ در برابر باران درشت.">فَطَلٌّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دهید.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینا و آگاه به کردارها.">بَصيرٌ</button>
  </p>
  <p class="farsi-verse">و مَثَل کسانی که اموالشان را برای جستن خشنودی آن معبود یگانه و استواری از درون خود انفاق می‌کنند، همچون باغی بر بلندی است که بارانی تند به آن برسد و میوه‌اش را دوچندان بدهد؛ و اگر بارانی تند به آن نرسد، بارانی نرم. و آن معبود یگانه به آنچه می‌کنید بیناست.</p>
</section>
