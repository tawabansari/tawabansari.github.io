  <p class="farsi-verse">و مَثَل کسانی که اموالشان را برای جستن خشنودی آن معبود یگانه و استواری از درون خود انفاق می‌کنند، همچون باغی بر بلندی است که بارانی تند به آن برسد و میوه‌اش را دوچندان بدهد؛ و اگر بارانی تند به آن نرسد، بارانی نرم. و آن معبود یگانه به آنچه می‌کنید بیناست.</p>
