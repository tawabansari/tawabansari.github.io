<section class="ayah-block" id="ayah-179" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۱۷۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="القِصاصِ" data-root="ق ص ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-sad/" data-root-meaning="پی گرفتن اثر؛ قصّه: روایت؛ قصاص: مقابله متناسب در آسیب.">القِصاصِ</button>
    <button class="word-link" type="button" data-word="حَيوٰةٌ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">حَيوٰةٌ</button>
    <button class="word-link" type="button" data-word="يٰأُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأُولِى</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-b/" data-root-meaning="مغز و بخش خالص؛ لُبّ: خرد و دریافت روشن.">الأَلبٰبِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَتَّقونَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">تَتَّقونَ</button>
  </p>
  <p class="farsi-verse">و برای شما در قصاص زندگی است، ای خردمندان، باشد که پرهیزگار شوید.</p>
</section>
