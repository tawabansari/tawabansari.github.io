<section class="ayah-block" id="ayah-226" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="يُؤلونَ" data-root="أ ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-l-w/" data-root-meaning="در کاربردهای مختلف: کوتاهی کردن؛ سوگند خوردن؛ و آلاء به معنای نعمت‌ها. این شاخه‌ها یکسان نیستند.">يُؤلونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نِسائِهِم" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن">نِسائِهِم</button>
    <button class="word-link" type="button" data-word="تَرَبُّصُ" data-root="ر ب ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-b-sad/" data-root-meaning="در انتظار ماندن و چشم به رویدادی داشتن.">تَرَبُّصُ</button>
    <button class="word-link" type="button" data-word="أَربَعَةِ" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی">أَربَعَةِ</button>
    <button class="word-link" type="button" data-word="أَشهُرٍ" data-root="ش ه ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/" data-root-meaning="ماه به‌عنوان دوره زمانی.">أَشهُرٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="فاءو" data-root="ف ي أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-y-a/" data-root-meaning="بازگشت؛ فَیء: سایه بازگشته یا دارایی بازگشته، بنا بر سیاق.">فاءو</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">برای کسانی که سوگند به کناره‌گیری از زنانشان می‌خورند، چهار ماه انتظار است؛ پس اگر بازگشتند، بی‌گمان آن معبود یگانه آمرزنده و مهربان است.</p>
</section>
