<section class="ayah-block" id="ayah-212" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="زُيِّنَ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن.">زُيِّنَ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَرُوا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَرُوا</button>
    <button class="word-link" type="button" data-word="الحَيوٰةُ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَيَسخَرونَ" data-root="س خ ر" data-root-meaning="نخست، کوچک شمردن و دستمایه ریشخند قرار دادن دیگری؛ دوم، تابع فرمان، اختیار یا کارکرد مشخص قرار دادن شخص یا چیزی، به گونه‌ای که بتوان از کار یا توان آن استفاده کرد." data-learn-more="/quran-terminology/fa/roots/s-kh-r/">وَيَسخَرونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    ۘ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّقَوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">اتَّقَوا</button>
    <button class="word-link" type="button" data-word="فَوقَهُم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد">فَوقَهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَرزُقُ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">يَرزُقُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="حِسابٍ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">حِسابٍ</button>
  </p>
  <p class="farsi-verse">زندگی دنیا برای کسانی که کفر ورزیدند آراسته شده است و کسانی را که ایمان آورده‌اند مسخره می‌کنند؛ و کسانی که پرهیزگار بوده‌اند روز رستاخیز بالاتر از آنان‌اند. و آن معبود یگانه هر که را بخواهد بی‌حساب روزی می‌دهد.</p>
</section>
