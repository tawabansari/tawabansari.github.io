  <p class="farsi-verse">آیا کسانی را ندیدی که هزاران تن بودند و از بیم مرگ از خانه‌هایشان بیرون رفتند؟ پس آن معبود یگانه به آنان گفت: بمیرید؛ سپس زنده‌شان کرد. بی‌گمان آن معبود یگانه بر مردم فضل دارد، ولی بیشتر مردم سپاس نمی‌گزارند.</p>
