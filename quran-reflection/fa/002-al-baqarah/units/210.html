  <p class="farsi-verse">آیا جز این انتظار دارند که آن معبود یگانه در سایه‌بان‌هایی از ابر، و فرشتگان، به سویشان آیند و کار پایان یابد؟ و کارها به سوی آن معبود یگانه بازگردانده می‌شوند.</p>
