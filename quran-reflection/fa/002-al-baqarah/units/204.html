  <p class="farsi-verse">و از مردم کسی است که سخنش در زندگی دنیا تو را به شگفت می‌آورد و آن معبود یگانه را بر آنچه در دلش است گواه می‌گیرد، در حالی که سرسخت‌ترین ستیزه‌جوست.</p>
