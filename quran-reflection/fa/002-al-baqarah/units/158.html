  <p class="farsi-verse">بی‌گمان صفا و مروه از شعائر آن معبود یگانه‌اند؛ پس هر که حج خانه یا عمره به جا آورد، گناهی بر او نیست که به گرد آن دو بگردد. و هر که داوطلبانه نیکی کند، بی‌گمان آن معبود یگانه سپاس‌پذیر و داناست.</p>
