  <p class="farsi-verse">از تو دربارهٔ شراب و قمار می‌پرسند؛ بگو: در آن دو گناهی بزرگ و سودهایی برای مردم است، و گناهشان از سودشان بزرگ‌تر است. و از تو می‌پرسند چه انفاق کنند؛ بگو: افزون بر نیاز را. این‌گونه آن معبود یگانه آیات را برای شما روشن می‌سازد، باشد که بیندیشید،</p>
