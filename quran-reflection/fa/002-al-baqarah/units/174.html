  <p class="farsi-verse">بی‌گمان کسانی که آنچه را آن معبود یگانه از کتاب نازل کرده پنهان می‌کنند و آن را به بهایی اندک می‌فروشند، در شکم‌های خود جز آتش نمی‌خورند؛ و آن معبود یگانه روز رستاخیز با آنان سخن نمی‌گوید و پاکشان نمی‌سازد؛ و برای آنان عذابی دردناک است.</p>
