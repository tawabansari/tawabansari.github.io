<section class="ayah-block" id="ayah-263" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قَولٌ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتار؛ سخن شایسته در برابر صدقهٔ آزارآمیز.">قَولٌ</button>
    <button class="word-link" type="button" data-word="مَعروفٌ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="شایسته و پسندیده؛ وصف گفتار.">مَعروفٌ</button>
    <button class="word-link" type="button" data-word="وَمَغفِرَةٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="و گذشت؛ چشم‌پوشی در کنار گفتار شایسته.">وَمَغفِرَةٌ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ مقایسه با صدقه‌ای که آزار در پی دارد.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="صَدَقَةٍ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="صدقه؛ کمک مالی‌ای که در این مقایسه آزار در پی دارد.">صَدَقَةٍ</button>
    <button class="word-link" type="button" data-word="يَتبَعُها" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="در پی آن می‌آید؛ دربارهٔ آزار پس از صدقه.">يَتبَعُها</button>
    <button class="word-link" type="button" data-word="أَذًى" data-root="أ ذ ي" data-learn-more="/quran-terminology/fa/roots/a-dh-y/" data-root-meaning="رنج، ناراحتی یا آسیب ناشی از امر یا رفتاری ناگوار؛ و در صورت فعلی، ایجاد یا رساندن چنین آزار و آسیبی به دیگری. نوع، شدت و ارزش اخلاقی آن از سیاق تعیین می‌شود." data-context="آزار؛ آسیبی که در پی صدقه می‌آید.">أَذًى</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="غَنِىٌّ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="بی‌نیاز؛ وصف آن معبود یگانه.">غَنِىٌّ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="ح ل م" data-root-meaning="خواب و رؤیا؛ بلوغ در تعبیر «بلوغ الحلم»؛ خرد، بردباری و خویشتن‌داری در برابر شتاب‌زدگی." data-context="بردبار؛ وصف آن معبود یگانه در کنار بی‌نیازی و نقد صدقهٔ آزارآمیز." data-learn-more="/quran-terminology/fa/roots/h-l-m/">حَليمٌ</button>
  </p>
  <p class="farsi-verse">سخنی پسندیده و بخششی بهتر از صدقه‌ای است که آزاری در پی آن باشد؛ و آن معبود یگانه بی‌نیاز و بردبار است.</p>
</section>
