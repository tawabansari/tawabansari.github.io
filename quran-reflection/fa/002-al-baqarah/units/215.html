  <p class="farsi-verse">از تو می‌پرسند چه انفاق کنند؛ بگو: هر خیری که انفاق کنید، برای پدر و مادر و نزدیکان و یتیمان و نیازمندان و درراه‌مانده باشد؛ و هر نیکی که انجام دهید، بی‌گمان آن معبود یگانه به آن داناست.</p>
