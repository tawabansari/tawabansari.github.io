  <p class="farsi-verse">بی‌گمان کسانی که ایمان آوردند و کسانی که هجرت کردند و در راه آن معبود یگانه کوشیدند، آنان به رحمت آن معبود یگانه امید دارند؛ و آن معبود یگانه آمرزنده و مهربان است.</p>
