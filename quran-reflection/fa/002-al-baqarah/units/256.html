<section class="ayah-block" id="ayah-256" data-translation-status="provisional">
  <h2 class="ayah-title">البقره ۲:۲۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="إِكراهَ" data-root="ك ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-h2/" data-root-meaning="ناخوش داشتن و دشواری؛ اکراه: واداشتن برخلاف خواست." data-context="وادار کردن و اجبار؛ در دین نفی شده است.">إِكراهَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دین؛ زمینه‌ای که اکراه در آن نفی شده است.">الدّينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="تَبَيَّنَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار و از هم متمایز شده است.">تَبَيَّنَ</button>
    <button class="word-link" type="button" data-word="الرُّشدُ" data-root="ر ش د" data-learn-more="/quran-terminology/fa/roots/r-sh-d/" data-root-meaning="راه‌یابی درست، تشخیص سنجیده و جهت‌گیری شایسته در کارها؛ بسته به سیاق، هدایت دینی، توان ادارهٔ مال یا درستی تصمیم؛ ارشاد: راهنمایی دیگری به راه درست." data-context="راه درست و جهت‌گیری سنجیده.">الرُّشدُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغَىِّ" data-root="غ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-y/" data-root-meaning="گمراهی و منحرف ساختن از راه درست." data-context="گمراهی و انحراف از راه درست.">الغَىِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="يَكفُر" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="انکار کند و نپذیرد؛ دربارهٔ طاغوت.">يَكفُر</button>
    <button class="word-link" type="button" data-word="بِالطّٰغوتِ" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق" data-context="طاغوت؛ آنچه در برابر حق، مرجع سرکشی و بندگی قرار می‌گیرد.">بِالطّٰغوتِ</button>
    <button class="word-link" type="button" data-word="وَيُؤمِن" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="و ایمان آورد؛ به آن معبود یگانه.">وَيُؤمِن</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="استَمسَكَ" data-root="م س ك" data-learn-more="/quran-terminology/fa/roots/m-s-k/" data-root-meaning="گرفتن و نگه داشتن؛ بازداشتن از رها شدن یا از دست رفتن؛ چنگ زدن و پایبندی. «مِسک» در شاخه‌ای جدا، مشک خوشبوست." data-context="محکم چنگ زده است.">استَمسَكَ</button>
    <button class="word-link" type="button" data-word="بِالعُروَةِ" data-root="ع ر و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-w/" data-root-meaning="دستگیره و جای چنگ زدن؛ اعترا: عارض و دامنگیر شدن." data-context="دستگیره و پیوندِ قابل تمسک.">بِالعُروَةِ</button>
    <button class="word-link" type="button" data-word="الوُثقىٰ" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست" data-context="استوارترین؛ وصف دستگیره.">الوُثقىٰ</button>
    <button class="word-link" type="button" data-word="لَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَا</button>
    <button class="word-link" type="button" data-word="انفِصامَ" data-root="ف ص م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-sad-m/" data-root-meaning="ترک و گسستگی در پیوند." data-context="گسستن و شکستن؛ دربارهٔ آن دستگیره نفی شده است.">انفِصامَ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="سَميعٌ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="شنوا؛ وصف آن معبود یگانه.">سَميعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصف آن معبود یگانه.">عَليمٌ</button>
  </p>
  <p class="farsi-verse">در دین اجباری نیست؛ راه درست از گمراهی روشن شده است. پس هر که به طاغوت کفر ورزد و به آن معبود یگانه ایمان آورد، به دستاویز استواری چنگ زده که گسستن ندارد؛ و آن معبود یگانه شنوا و داناست.</p>
</section>
