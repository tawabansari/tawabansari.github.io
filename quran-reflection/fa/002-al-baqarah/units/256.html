  <p class="farsi-verse">در دین اجباری نیست؛ راه درست از گمراهی روشن شده است. پس هر که به طاغوت کفر ورزد و به آن معبود یگانه ایمان آورد، به دستاویز استواری چنگ زده که گسستن ندارد؛ و آن معبود یگانه شنوا و داناست.</p>
