<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="تَسـَٔلُهُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="از آنان می‌خواهی؛ پرسش دربارهٔ مطالبهٔ پاداش.">تَسـَٔلُهُم</button>
    <button class="word-link" type="button" data-word="أَجرًا" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل" data-context="مزدی؛ پاداش مطالبه‌شده در برابر دعوت.">أَجرًا</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَغرَمٍ" data-root="غ ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-m/" data-root-meaning="زیان یا دِینِ لازم؛ غرام: رنج یا وابستگیِ رها‌نشدنی." data-context="هزینه‌ای الزام‌آور؛ بار مالیِ مورد پرسش.">مَغرَمٍ</button>
    <button class="word-link" type="button" data-word="مُثقَلونَ" data-root="ث ق ل" data-root-meaning="سنگینی، وزن، بار و اهمیت؛ از بارهای مادی تا سنجش کردار انسان" data-context="زیر بار سنگین؛ در این پرسش، گرفتارِ هزینهٔ مطالبه‌شده." data-learn-more="/quran-terminology/fa/roots/th-q-l/">مُثقَلونَ</button>
  </p>
  <p class="farsi-verse">یا از آنان مزدی می‌خواهی که از بار بدهی سنگین شده‌اند؟</p>
</section>
