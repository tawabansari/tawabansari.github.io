<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَطافَ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل">فَطافَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="طائِفٌ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل">طائِفٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>

  <p class="farsi-verse">پس در حالی که خواب بودند، بلایی از سوی پروردگارت بر آن گذشت.</p>
