<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَذَرنى" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَذَرنى</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُكَذِّبُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/">يُكَذِّبُ</button>
    <button class="word-link" type="button" data-word="بِهٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهٰذَا</button>
    <button class="word-link" type="button" data-word="الحَديثِ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/">الحَديثِ</button>
    ۖ
    <button class="word-link" type="button" data-word="سَنَستَدرِجُهُم" data-root="د ر ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَنَستَدرِجُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَيثُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">پس مرا با کسی که این سخن را دروغ می‌شمارد واگذار. آنان را از جایی که نمی‌دانند گام‌به‌گام پیش می‌بریم.</p>
