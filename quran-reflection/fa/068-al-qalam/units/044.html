<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَذَرنى" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="پس مرا با او واگذار.">فَذَرنى</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُكَذِّبُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="تکذیب می‌کند و نادرست می‌شمارد.">يُكَذِّبُ</button>
    <button class="word-link" type="button" data-word="بِهٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهٰذَا</button>
    <button class="word-link" type="button" data-word="الحَديثِ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/" data-root-meaning="از پدید آمدن تا سخنی که بازگو می‌شود" data-context="این سخن و پیام.">الحَديثِ</button>
    ۖ
    <button class="word-link" type="button" data-word="سَنَستَدرِجُهُم" data-root="د ر ج" data-learn-more="/quran-terminology/fa/roots/d-r-j/" data-root-meaning="حرکت و گذر مرحله‌به‌مرحله؛ پله و مرتبه؛ استدراج: پیش بردن تدریجی." data-context="آنان را به‌تدریج پیش خواهیم برد.">سَنَستَدرِجُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="از منشأ یا جهتی که از آن آگاهی ندارند." data-learn-more="/quran-terminology/fa/roots/h-y-th/" data-root-note="معنای کوتاه واژه: مکان یا موقعیتی که جملهٔ همراه آن مشخص می‌کند؛ با «مِنْ»، مبدأ یا منشأ، و در کاربرد تعمیمی، هرجا که. «حيث» ظرفی عمدتاً جامد است.">حَيثُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="نمی‌دانند و از آن آگاهی ندارند.">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">پس مرا با کسی که این سخن را دروغ می‌شمارد واگذار. آنان را از جایی که نمی‌دانند گام‌به‌گام پیش می‌بریم.</p>
</section>
