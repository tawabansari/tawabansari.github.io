<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَدّوا" data-root="و د د" data-learn-more="/quran-terminology/fa/roots/w-d-d/" data-root-meaning="وَدَّ؛ محبت، خواستن و میل به تحقق چیزی" data-context="آرزو دارند؛ خواست آنان برای نرمش و سازش متقابل.">وَدّوا</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="تُدهِنُ" data-root="د ه ن" data-learn-more="/quran-terminology/fa/roots/d-h2-n/" data-root-meaning="روغن و روغن‌مالی؛ نرمی و مماشات در رفتار، با معنایی وابسته به سیاق." data-context="نرمش و سازش نشان دهی؛ در سیاق خواست تکذیب‌کنندگان برای کوتاه آمدن پیامبر.">تُدهِنُ</button>
    <button class="word-link" type="button" data-word="فَيُدهِنونَ" data-root="د ه ن" data-learn-more="/quran-terminology/fa/roots/d-h2-n/" data-root-meaning="روغن و روغن‌مالی؛ نرمی و مماشات در رفتار، با معنایی وابسته به سیاق." data-context="پس آنان نیز نرمش نشان دهند؛ پاسخ متقابلی که در خواست آنان تصور شده است.">فَيُدهِنونَ</button>
  </p>
  <p class="farsi-verse">دوست دارند که سازش کنی تا آنان نیز سازش کنند.</p>
</section>
