<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُطِع" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">تُطِع</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="حَلّافٍ" data-root="ح ل ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَلّافٍ</button>
    <button class="word-link" type="button" data-word="مَهينٍ" data-root="م ه ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَهينٍ</button>
  </p>
  <p class="farsi-verse">و از هیچ سوگندخورِ پستی اطاعت نکن،</p>
</section>
