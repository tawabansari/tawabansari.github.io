  <p class="arabic-text">

    <button class="word-link" type="button" data-word="يُكشَفُ" data-root="ك ش ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُكشَفُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ساقٍ" data-root="س و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ساقٍ</button>

    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَستَطيعونَ</button>

  <p class="farsi-verse">روزی که ساقی آشکار می‌شود و به سجده فراخوانده می‌شوند، ولی نمی‌توانند.</p>
