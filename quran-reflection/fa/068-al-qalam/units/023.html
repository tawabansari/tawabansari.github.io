<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانطَلَقوا" data-root="ط ل ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-l-q/" data-root-meaning="رها ساختن و به راه افتادن؛ طلاق: گسستن پیوند زناشویی.">فَانطَلَقوا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَتَخٰفَتونَ" data-root="خ ف ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-f-t/" data-root-meaning="آهسته و پوشیده سخن گفتن، یا کاهش صدا.">يَتَخٰفَتونَ</button>
  </p>
  <p class="farsi-verse">پس راه افتادند و آهسته با هم سخن می‌گفتند:</p>
