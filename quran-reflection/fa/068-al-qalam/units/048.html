<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">فَاصبِر</button>
    <button class="word-link" type="button" data-word="لِحُكمِ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">لِحُكمِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكُن</button>
    <button class="word-link" type="button" data-word="كَصاحِبِ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">كَصاحِبِ</button>
    <button class="word-link" type="button" data-word="الحوتِ" data-root="ح و ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الحوتِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="ن د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نادىٰ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مَكظومٌ" data-root="ك ظ م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَكظومٌ</button>
  </p>
  <p class="farsi-verse">پس برای حکم پروردگارت شکیبا باش و مانند صاحب ماهی مباش، هنگامی که در اندوه فروخورده ندا داد.</p>
</section>
