<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَغَدَوا" data-root="غ د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-w/" data-root-meaning="بامداد و بامداد رفتن؛ غد: فردا یا آینده." data-context="و بامدادان به راه افتادند؛ حرکت صبحگاهی صاحبان باغ برای اجرای تصمیمشان.">وَغَدَوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="حَردٍ" data-root="ح ر د" data-root-meaning="قصد و تصمیم جدی؛ خشم، کناره‌گیری و در برخی کاربردها منع یا قطع بهره." data-context="عزم و تصمیم استوار صاحبان باغ هنگام حرکت صبحگاهی؛ تصمیمی که در سیاق داستان با جلوگیری از ورود نیازمندان ارتباط دارد." data-learn-more="/quran-terminology/fa/roots/h-r-d/">حَردٍ</button>
    <button class="word-link" type="button" data-word="قٰدِرينَ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="در حالی که خود را بر اجرای تصمیمشان توانا می‌پنداشتند؛ این تصور، موفقیت در دستیابی به محصول را تضمین نکرد.">قٰدِرينَ</button>
  </p>
  <p class="farsi-verse">و بامدادان با عزم محروم کردن رفتند، خود را توانا می‌دانستند.</p>
</section>
