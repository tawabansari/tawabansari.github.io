<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="لَأَجرًا" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">لَأَجرًا</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">غَيرَ</button>
    <button class="word-link" type="button" data-word="مَمنونٍ" data-root="م ن ن" data-learn-more="/quran-terminology/fa/roots/m-n-n/" data-root-meaning="رساندن عطا یا احسانی برجسته؛ به رخ کشیدن آن عطا؛ آزاد کردن بدون عوض؛ و بریدن، کاستن یا پایان یافتن.">مَمنونٍ</button>
  </p>
  <p class="farsi-verse">و همانا برای تو پاداشی بی‌پایان است.</p>
</section>
