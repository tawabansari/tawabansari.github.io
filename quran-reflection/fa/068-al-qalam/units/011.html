<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هَمّازٍ" data-root="ه م ز" data-root-meaning="همز در کاربرد مادی به وارد کردن فشار، نیش یا ضربه مربوط است؛ در رفتار انسانی به عیب‌جویی و طعنه آسیب‌رسان اشاره می‌کند؛ و در تعبیر «همزات شیاطین» به تحریک‌ها و فشارهایی مربوط می‌شود که شخص از آنها به آن معبود یگانه پناه می‌برد." data-learn-more="/quran-terminology/fa/roots/h2-m-z/">هَمّازٍ</button>
    <button class="word-link" type="button" data-word="مَشّاءٍ" data-root="م ش ي" data-learn-more="/quran-terminology/fa/roots/m-sh-y/" data-root-meaning="راه رفتن، گام برداشتن، حرکت کردن بر زمین؛ و در میدان گسترده‌تر، پیش رفتن در یک مسیر، روش، رفتار یا سبک زندگی">مَشّاءٍ</button>
    <button class="word-link" type="button" data-word="بِنَميمٍ" data-root="ن م م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِنَميمٍ</button>
  </p>
  <p class="farsi-verse">عیب‌جویی که سخن‌چینی می‌کند،</p>
</section>
