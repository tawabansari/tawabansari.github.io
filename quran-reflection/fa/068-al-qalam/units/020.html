<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَصبَحَت" data-root="ص ب ح" data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ «أصبح»: به صبح رسیدن یا شدن؛ «مِصباح»: چراغ." data-context="پس شد؛ وضعیت باغ پس از رخداد شبانه.">فَأَصبَحَت</button>
    <button class="word-link" type="button" data-word="كَالصَّريمِ" data-root="ص ر م" data-learn-more="/quran-terminology/fa/roots/sad-r-m/" data-root-meaning="بریدن و جدا کردن؛ چیدن محصول، قطع پیوند و پایان یافتن پیوستگی" data-context="مانند صریم؛ تصویرِ باغ پس از آسیبِ شبانه، با خوانش‌های قطع‌شده یا تاریک.">كَالصَّريمِ</button>
  </p>
  <p class="farsi-verse">پس مانند کشتزاری دروشده شد.</p>
