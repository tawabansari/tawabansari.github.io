<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَنَجعَلُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="آیا قرار می‌دهیم">أَفَنَجعَلُ</button>
    <button class="word-link" type="button" data-word="المُسلِمينَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="تسلیم‌شدگان را">المُسلِمينَ</button>
    <button class="word-link" type="button" data-word="كَالمُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">كَالمُجرِمينَ</button>
  </p>
  <p class="farsi-verse">آیا تسلیم‌شدگان را مانند مجرمان قرار می‌دهیم؟</p>
</section>
