<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنِ</button>
    <button class="word-link" type="button" data-word="اغدوا" data-root="غ د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-w/" data-root-meaning="بامداد و بامداد رفتن؛ غد: فردا یا آینده.">اغدوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="حَرثِكُم" data-root="ح ر ث" data-learn-more="/quran-terminology/fa/roots/h-r-th/" data-root-meaning="کار هدفمند، آماده‌سازی بستر، پرورش و انتظار حاصل">حَرثِكُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="صٰرِمينَ" data-root="ص ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-m/" data-root-meaning="بریدن و چیدن محصول؛ صریم: بریده‌شده یا سیاه همچون شب، بنا بر تفسیر.">صٰرِمينَ</button>
  </p>
  <p class="farsi-verse">«اگر قصد چیدن دارید، بامدادان به سوی کشتزارتان بروید.»</p>
</section>
