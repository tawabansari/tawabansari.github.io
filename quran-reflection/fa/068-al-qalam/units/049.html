<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَولا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَدٰرَكَهُ" data-root="د ر ك" data-learn-more="/quran-terminology/fa/roots/d-r-k/" data-root-meaning="رسیدن و دست یافتن؛ دریافت حسی یا شناختی، پیوستن و تدارک؛ و در «دَرْك»، مرتبهٔ پایین." data-context="به او رسید؛ نعمت پروردگار که در سیاق، فرجام یونس را تغییر می‌دهد.">تَدٰرَكَهُ</button>
    <button class="word-link" type="button" data-word="نِعمَةٌ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمتی؛ فضلِ پروردگار که به یونس رسید.">نِعمَةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش؛ بخشندهٔ آن نعمت به یونس.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="لَنُبِذَ" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین" data-context="حتماً افکنده می‌شد؛ نتیجهٔ فرضیِ نرسیدن نعمت، با وصف نکوهیدگی.">لَنُبِذَ</button>
    <button class="word-link" type="button" data-word="بِالعَراءِ" data-root="ع ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-y/" data-root-meaning="برهنه و بی‌پوشش بودن؛ عراء: جای باز و بی‌پناه." data-context="در زمینِ بی‌پناه؛ فضای باز و بی‌پوششِ یادشده.">بِالعَراءِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مَذمومٌ" data-root="ذ م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-m-m/" data-root-meaning="نکوهش و سرزنش؛ ذمّه: عهد و تعهدی که رعایت آن لازم است." data-context="نکوهیده؛ وصفِ حالت یونس در نتیجهٔ فرضیِ نرسیدن نعمت.">مَذمومٌ</button>
  </p>
  <p class="farsi-verse">اگر نعمتی از پروردگارش به او نرسیده بود، در حالی که نکوهیده بود به زمین برهنه افکنده می‌شد.</p>
</section>
