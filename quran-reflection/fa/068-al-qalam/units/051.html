<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَكادُ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن" data-context="نزدیک است؛ نزدیک بودن وقوع کاری را بیان می‌کند.">يَكادُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ وصف مخالفانِ شنوندهٔ ذکر.">كَفَروا</button>
    <button class="word-link" type="button" data-word="لَيُزلِقونَكَ" data-root="ز ل ق" data-learn-more="/quran-terminology/fa/roots/z-l-q/" data-root-meaning="لغزیدن و از دست رفتن استواری؛ در کاربرد متعدی، لغزاندن و کنار راندن از جایگاه." data-context="تو را بلغزانند یا از پا درآورند؛ در جمله، نزدیک بودن این کار با نگاه‌های مخالفان بیان می‌شود.">لَيُزلِقونَكَ</button>
    <button class="word-link" type="button" data-word="بِأَبصٰرِهِم" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="با نگاه‌هایشان؛ وسیلهٔ مورد اشاره در جمله.">بِأَبصٰرِهِم</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمّا</button>
    <button class="word-link" type="button" data-word="سَمِعُوا" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="شنیدند؛ دربارهٔ شنیدن ذکر.">سَمِعُوا</button>
    <button class="word-link" type="button" data-word="الذِّكرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="ذکر و یادآوری؛ در این سیاق پیام قرآنی.">الذِّكرَ</button>
    <button class="word-link" type="button" data-word="وَيَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و می‌گویند؛ نقل سخن مخالفان.">وَيَقولونَ</button>
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَمَجنونٌ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="بی‌گمان دیوانه؛ اتهامی که مخالفان بر زبان می‌آورند.">لَمَجنونٌ</button>
  </p>
  <p class="farsi-verse">و نزدیک است کسانی که کفر ورزیده‌اند، هنگامی که یادآوری را شنیدند، با نگاه‌هایشان تو را بلغزانند؛ و می‌گویند: «او دیوانه است.»</p>
</section>
