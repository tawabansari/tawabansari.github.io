<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عُتُلٍّ" data-root="ع ت ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-l/" data-root-meaning="گرفتن و کشیدن با خشونت؛ عُتُلّ: سخت‌خو و درشت‌رفتار.">عُتُلٍّ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="زَنيمٍ" data-root="ز ن م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-n-m/" data-root-meaning="چیزی آویخته یا پیوسته؛ زنیم: شخصِ ملحق یا بدنام، با اختلاف در شرح دقیق.">زَنيمٍ</button>
  </p>
  <p class="farsi-verse">درشت‌خو و پس از آن بدنام.</p>
</section>
