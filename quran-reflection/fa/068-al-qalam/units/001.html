<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ن" data-context="حرف جداگانه: نون." data-learn-more="/fa/quran-terminology/huruf-muqattaat/">ن</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالقَلَمِ" data-root="ق ل م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-l-m/" data-root-meaning="تراشیدن؛ قلم: ابزار نوشتن.">وَالقَلَمِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَسطُرونَ" data-root="س ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-tt-r/" data-root-meaning="سطر و نوشتن؛ اساطیر: حکایت‌های نقل‌شده؛ مصیطر: چیره و مراقب.">يَسطُرونَ</button>
  </p>
  <p class="farsi-verse">نون. سوگند به قلم و آنچه می‌نویسند.</p>
</section>
