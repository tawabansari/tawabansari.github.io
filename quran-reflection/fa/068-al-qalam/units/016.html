  <h2 class="ayah-title">القلم ۶۸:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَنَسِمُهُ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="نشان گذاشتن، علامت‌دار کردن، و شناساندن چیزی از راه اثر یا نشانه">سَنَسِمُهُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>

  <p class="farsi-verse">به‌زودی بر پوزه‌اش نشان می‌گذاریم.</p>
