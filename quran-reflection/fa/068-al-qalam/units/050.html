<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاجتَبٰهُ" data-root="ج ب ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَاجتَبٰهُ</button>
    <button class="word-link" type="button" data-word="رَبُّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّهُ</button>
    <button class="word-link" type="button" data-word="فَجَعَلَهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">فَجَعَلَهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحينَ</button>
  </p>
  <p class="farsi-verse">پس پروردگارش او را برگزید و از شایستگان قرار داد.</p>
</section>
