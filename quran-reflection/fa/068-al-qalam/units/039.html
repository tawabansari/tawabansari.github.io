<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">القلم ۶۸:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَيمٰنٌ" data-root="ي م ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَيمٰنٌ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="بٰلِغَةٌ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت">بٰلِغَةٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومِ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    ۙ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="لَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَما</button>
    <button class="word-link" type="button" data-word="تَحكُمونَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">تَحكُمونَ</button>
  </p>
  <p class="farsi-verse">یا بر ما سوگندهایی دارید که تا روز قیامت پابرجاست، که هرچه حکم کنید برای شماست؟</p>
</section>
