<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الحديد ۵۷:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">فَاليَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤخَذُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">يُؤخَذُ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="فِديَةٌ" data-root="ف د ي" data-learn-more="/quran-terminology/fa/roots/f-d-y/" data-root-meaning="رهایی در برابر چیزی که جای دیگری قرار می‌گیرد">فِديَةٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    ۚ
    <button class="word-link" type="button" data-word="مَأوىٰكُمُ" data-root="أ و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَأوىٰكُمُ</button>
    <button class="word-link" type="button" data-word="النّارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارُ</button>
    ۖ
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="مَولىٰكُم" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">مَولىٰكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/" data-root-meaning="از رسیدن به یک پایان تا «مصیر»؛ آنچه کار سرانجام به آن می‌رسد">المَصيرُ</button>
  </p>
  <p class="farsi-verse">پس امروز نه از شما و نه از کسانی که کفر ورزیدند فدیه‌ای گرفته می‌شود. جایگاهتان آتش است؛ همان سرپرست شماست، و چه بد سرانجامی!»</p>
</section>
