<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الحديد ۵۷:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="يَأنِ" data-root="أ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-n-y/" data-root-meaning="فرا رسیدن یا رسیدن به زمان؛ آناء: بخش‌های زمان؛ آنیه: ظرف‌ها؛ و أَنّى در کاربرد پرسشی: چگونه یا از کجا." data-context="آیا وقت آن نرسیده است؟ در ساخت «ألم يأن»، پرسشی برای بیدار کردن مؤمنان به خشوع دل.">يَأنِ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="کسانی که ایمان آورده‌اند؛ مخاطبان مستقیمِ هشدار درباره دل و یاد آن معبود یگانه.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَخشَعَ" data-root="خ ش ع" data-learn-more="/quran-terminology/fa/roots/kh-sh-ayn/" data-root-meaning="فرو آمدن از بلندی و سختی، نرم شدن، آرام گرفتن، و فرونشستن در برابر حقیقت و عظمت" data-context="دل‌ها فروتن و نرم شود؛ در برابر یاد آن معبود یگانه و حقیقت نازل‌شده.">تَخشَعَ</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌های مؤمنان که به خشوع و پذیرندگی در برابر یاد و حق فراخوانده می‌شوند.">قُلوبُهُم</button>
    <button class="word-link" type="button" data-word="لِذِكرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="برای یاد آن معبود یگانه و در برابر آن؛ یادکردی که با خشوع دل پیوند دارد.">لِذِكرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="نَزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="آنچه از حق فرود آمده است؛ حقیقتی که در کنار یاد آن معبود یگانه قرار گرفته است.">نَزَلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق و حقیقتی که نازل شده و دل‌ها باید در برابر آن فروتن باشند.">الحَقِّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و مانند آنان نباشند؛ مؤمنان از قرار گرفتن در وضعیت نمونه پیشین برحذر می‌شوند.">يَكونوا</button>
    <button class="word-link" type="button" data-word="كَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَالَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="کتاب به آنان داده شد؛ فعل مجهول است و از دریافت‌کنندگان پیشین کتاب سخن می‌گوید.">أوتُوا</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابی که پیش‌تر به آن گروه داده شده بود؛ زمینه هشدار درباره سخت شدن دل‌ها.">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از این؛ به کسانی اشاره دارد که پیش‌تر کتاب دریافت کرده بودند.">قَبلُ</button>
    <button class="word-link" type="button" data-word="فَطالَ" data-root="ط و ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-w-l/" data-root-meaning="درازی و امتداد؛ طَول: توانگری یا بخشش." data-context="پس بر آنان دراز شد؛ طولانی بودن مدت از این فعل شناخته می‌شود.">فَطالَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الأَمَدُ" data-root="أ م د" data-learn-more="/quran-terminology/fa/roots/a-m-d/" data-root-meaning="کرانه یا نهایتی که یک فاصله یا امتداد به آن می‌رسد؛ و در کاربرد زمانی، مدت یا فاصله‌ای که با توجه به آغاز، پایان یا نقطه مورد انتظار سنجیده می‌شود." data-context="مدتی که بر آن گروه گذشته بود؛ دراز شدنش از «طال» شناخته می‌شود و شمار سال‌هایش در آیه تعیین نشده است.">الأَمَدُ</button>
    <button class="word-link" type="button" data-word="فَقَسَت" data-root="ق س و" data-learn-more="/quran-terminology/fa/roots/q-s-w/" data-root-meaning="سختی، صلابت، مقاومت در برابر تاثیر و کاهش پذیرندگی قلب" data-context="پس سخت شد؛ دل‌های آنان پذیرندگی و نرمی خود را از دست داد.">فَقَسَت</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌های آن گروه پیشین که پس از طولانی شدن مدت سخت گردید.">قُلوبُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَثيرٌ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="و بسیاری از آنان؛ جمله درباره همه آنان داوری یکسان نمی‌کند.">وَكَثيرٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="فٰسِقونَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="نافرمانان و بیرون‌روندگان از فرمان؛ وصف بسیاری از آن گروه در پایان آیه.">فٰسِقونَ</button>
  </p>
  <p class="farsi-verse">آیا برای کسانی که ایمان آورده‌اند هنگام آن نرسیده که دل‌هایشان در برابر یاد آن معبود یگانه و آنچه از حق فرود آمده فروتن شود، و مانند کسانی نباشند که پیش‌تر کتاب به آنان داده شد، سپس زمان بر آنان دراز گشت و دل‌هایشان سخت شد؟ و بسیاری از آنان نافرمان‌اند.</p>
</section>
