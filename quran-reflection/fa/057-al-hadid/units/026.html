<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الحديد ۵۷:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="نوحًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحًا</button>
    <button class="word-link" type="button" data-word="وَإِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَإِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتِهِمَا" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه">ذُرِّيَّتِهِمَا</button>
    <button class="word-link" type="button" data-word="النُّبُوَّةَ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">النُّبُوَّةَ</button>
    <button class="word-link" type="button" data-word="وَالكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">وَالكِتٰبَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="مُهتَدٍ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">مُهتَدٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَثيرٌ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">وَكَثيرٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="فٰسِقونَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن">فٰسِقونَ</button>
  </p>
  <p class="farsi-verse">و نوح و ابراهیم را فرستادیم و در نسل آن دو نبوت و کتاب را قرار دادیم؛ پس برخی از آنان راه‌یافته‌اند و بسیاری از آنان نافرمان‌اند.</p>
</section>
