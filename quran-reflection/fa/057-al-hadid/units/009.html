  <p class="farsi-verse">اوست که بر بنده‌اش نشانه‌هایی روشن فرو می‌فرستد تا شما را از تاریکی‌ها به روشنایی بیرون آورد؛ و آن معبود یگانه نسبت به شما دلسوز و مهربان است.</p>
