  <h2 class="ayah-title">الحديد ۵۷:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">تُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَالرَّسولُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">وَالرَّسولُ</button>

    <button class="word-link" type="button" data-word="لِتُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">لِتُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِرَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">بِرَبِّكُم</button>

  </p>
  <p class="farsi-verse">و شما را چه شده که به آن معبود یگانه ایمان نمی‌آورید، در حالی که فرستاده شما را می‌خواند تا به پروردگارتان ایمان بیاورید و او پیمان شما را گرفته است، اگر مؤمن هستید؟</p>
