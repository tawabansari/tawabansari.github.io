<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الحديد ۵۷:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَبخَلونَ" data-root="ب خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-kh-l/" data-root-meaning="بخل ورزیدن و نگه داشتن چیزی در جایی که بخشیدن آن شایسته است.">يَبخَلونَ</button>
    <button class="word-link" type="button" data-word="وَيَأمُرونَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">وَيَأمُرونَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسَ</button>
    <button class="word-link" type="button" data-word="بِالبُخلِ" data-root="ب خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-kh-l/" data-root-meaning="بخل ورزیدن و نگه داشتن چیزی در جایی که بخشیدن آن شایسته است.">بِالبُخلِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَتَوَلَّ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">يَتَوَلَّ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الغَنِىُّ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن.">الغَنِىُّ</button>
    <button class="word-link" type="button" data-word="الحَميدُ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">الحَميدُ</button>
  </p>
  <p class="farsi-verse">همان کسانی که بخل می‌ورزند و مردم را به بخل فرمان می‌دهند. و هر که روی بگرداند، آن معبود یگانه بی‌نیاز و ستوده است.</p>
</section>
