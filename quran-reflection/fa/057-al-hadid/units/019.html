  <p class="farsi-verse">و کسانی که به آن معبود یگانه و فرستادگانش ایمان آورده‌اند، آنان راست‌کرداران‌اند؛ و گواهان نزد پروردگارشان، پاداش و نور خود را دارند. و کسانی که کفر ورزیدند و نشانه‌های ما را تکذیب کردند، آنان اصحاب آتش سوزان‌اند.</p>
