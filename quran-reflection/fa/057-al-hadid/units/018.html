<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الحديد ۵۷:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="المُصَّدِّقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="مردان صدقه‌دهنده">المُصَّدِّقينَ</button>
    <button class="word-link" type="button" data-word="وَالمُصَّدِّقٰتِ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="و زنان صدقه‌دهنده">وَالمُصَّدِّقٰتِ</button>
    <button class="word-link" type="button" data-word="وَأَقرَضُوا" data-root="ق ر ض" data-learn-more="/quran-terminology/fa/roots/q-r-dad/" data-root-meaning="بریدن بخشی از مال، جدا کردن و دادن آن با انتظار بازگشت یا پاداش، قرض دادن، و واگذاری موقت چیزی از دارایی" data-context="و وام دادند؛ دربارهٔ قرض نیکو">وَأَقرَضُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قَرضًا" data-root="ق ر ض" data-learn-more="/quran-terminology/fa/roots/q-r-dad/" data-root-meaning="بریدن بخشی از مال، جدا کردن و دادن آن با انتظار بازگشت یا پاداش، قرض دادن، و واگذاری موقت چیزی از دارایی" data-context="وامی؛ عمل نیکِ یادشده">قَرضًا</button>
    <button class="word-link" type="button" data-word="حَسَنًا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکو؛ وصف قرض">حَسَنًا</button>
    <button class="word-link" type="button" data-word="يُضٰعَفُ" data-root="ض ع ف" data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="کمبود توان و ناتوانی در برابر قوت؛ در باب استفعال، ضعیف شمردن یا در وضعیت ضعف قرار دادن. در شاخه‌ای مستقل، افزودن مانندِ چیزی بر مقدار نخست و دوبرابر یا چندبرابر کردن آن." data-context="چندبرابر می‌شود؛ برای صدقه‌دهندگانِ یادشده">يُضٰعَفُ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="أَجرٌ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل" data-context="پاداش؛ نتیجهٔ بیان‌شده">أَجرٌ</button>
    <button class="word-link" type="button" data-word="كَريمٌ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی." data-context="گرامی و ارزشمند؛ وصف پاداش">كَريمٌ</button>
  </p>
  <p class="farsi-verse">مردان و زنانی که صدقه می‌دهند و به آن معبود یگانه وامی نیکو داده‌اند، برایشان چند برابر می‌شود و پاداشی گرامی دارند.</p>
</section>
