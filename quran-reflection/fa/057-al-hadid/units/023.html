<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">الحديد ۵۷:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِكَيلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِكَيلا</button>
    <button class="word-link" type="button" data-word="تَأسَوا" data-root="أ س ي" data-learn-more="/quran-terminology/fa/roots/a-s-w/" data-root-meaning="متاثر شدن از فقدان، ناکامی یا رفتار اشخاص؛ شاخه‌ای که نسبت اشتقاقی آن با «أ س و» در طبقه‌بندی‌های لغوی یکسان نیست." data-context="اندوهگین نشوید">تَأسَوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فاتَكُم" data-root="ف و ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-t/" data-root-meaning="از دسترس بیرون رفتن؛ تفاوت: ناهمسانی یا ناهماهنگی." data-context="از دست شما رفت">فاتَكُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَفرَحوا" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="سرمستی نکنید">تَفرَحوا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="ءاتىٰكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به شما داده است">ءاتىٰكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دوست ندارد">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هیچ؛ در ساخت نفی">كُلَّ</button>
    <button class="word-link" type="button" data-word="مُختالٍ" data-root="خ ي ل" data-learn-more="/quran-terminology/fa/roots/kh-y-l/" data-root-meaning="نمود و تصور چیزی در ذهن یا برابر چشم؛ حرکت همراه با جلوه‌گری. در مشتق‌های مشخص: اسبان، پدید آوردن تصور، و خودنماییِ متکبرانه." data-context="خودبزرگ‌بین">مُختالٍ</button>
    <button class="word-link" type="button" data-word="فَخورٍ" data-root="ف خ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-kh-r/" data-root-meaning="فخرفروشی و بالیدن؛ فخّار: سفال پخته، در شاخه‌ای دیگر." data-context="فخرفروش">فَخورٍ</button>
  </p>
  <p class="farsi-verse">تا بر آنچه از دستتان رفته اندوه نخورید و به آنچه به شما داده شادمانیِ سرمستانه نکنید؛ و آن معبود یگانه هیچ خودپسند فخرفروشی را دوست ندارد،</p>
</section>
