<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">الحديد ۵۷:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اعلَموا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">اعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُحىِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">يُحىِ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدَ</button>
    <button class="word-link" type="button" data-word="مَوتِها" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مَوتِها</button>
    ۚ
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="بَيَّنّا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَيَّنّا</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی">تَعقِلونَ</button>
  </p>
  <p class="farsi-verse">بدانید که آن معبود یگانه زمین را پس از مرگش زنده می‌کند. نشانه‌ها را برای شما روشن کرده‌ایم، باشد که بیندیشید.</p>
</section>
