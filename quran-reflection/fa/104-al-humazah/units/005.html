<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الهمزة ۱۰۴:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَدرىٰكَ" data-root="د ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه شدن.">أَدرىٰكَ</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="الحُطَمَةُ" data-root="ح ط م" data-root-meaning="حطم عمل شکستن و خرد کردن است؛ حطام نتیجه و باقی‌مانده خردشدگی، به‌ویژه درباره گیاه خشک است؛ و حطمة نام یا وصف چیزی است که با خردکنندگی شدید شناخته می‌شود." data-learn-more="/quran-terminology/fa/roots/h-tt-m/">الحُطَمَةُ</button>
  </p>
  <p class="farsi-verse">و چه چیز تو را آگاه کرد که خردکننده چیست؟</p>
</section>
