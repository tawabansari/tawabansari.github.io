<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">الهمزة ۱۰۴:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيلٌ" data-root="و ي ل" data-learn-more="/quran-terminology/fa/roots/w-y-l/" data-root-meaning="از فریاد اندوه و هشدار تا اعلام بدفرجامی">وَيلٌ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="هُمَزَةٍ" data-root="ه م ز" data-root-meaning="همز در کاربرد مادی به وارد کردن فشار، نیش یا ضربه مربوط است؛ در رفتار انسانی به عیب‌جویی و طعنه آسیب‌رسان اشاره می‌کند؛ و در تعبیر «همزات شیاطین» به تحریک‌ها و فشارهایی مربوط می‌شود که شخص از آنها به آن معبود یگانه پناه می‌برد." data-learn-more="/quran-terminology/fa/roots/h2-m-z/">هُمَزَةٍ</button>
    <button class="word-link" type="button" data-word="لُمَزَةٍ" data-root="ل م ز" data-root-meaning="لمز، عیب‌جویی و خرده‌گیری آسیب‌رسان از شخص یا رفتار اوست که می‌تواند از راه سخن، کنایه یا اشاره انجام شود و در کاربرد قرآنی، غالبا با طعنه و تحقیر همراه است." data-learn-more="/quran-terminology/fa/roots/l-m-z/">لُمَزَةٍ</button>
  </p>
  <p class="farsi-verse">وای بر هر طعنه‌زنِ عیب‌جو،</p>
</section>
