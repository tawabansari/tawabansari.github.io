<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الهمزة ۱۰۴:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="تَطَّلِعُ" data-root="ط ل ع" data-root-meaning="ط ل ع در هسته شناخته‌شده خود به برآمدن و آشکار شدن مربوط است. در کاربردهای طبیعی، پدیدار شدن خورشید و سر برآوردن محصول گیاه را بیان می‌کند؛ در کاربردهای مربوط به انسان، می‌تواند به مشاهده یا آگاه شدن از چیزی اشاره کند که پیش‌تر در دسترس او نبوده است؛ و در بعضی ساخت‌ها، معنای رسیدن به جایگاهی را می‌رساند." data-learn-more="/quran-terminology/fa/roots/tt-l-ayn/">تَطَّلِعُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَفـِٔدَةِ" data-root="ف أ د" data-root-meaning="«دل» مناسب‌ترین معادل پایه فؤاد است؛ دلی که در کاربردهای قرآنی می‌تواند با دریافت، ادراک، گرایش، تاثیرپذیری و پایداری ارتباط داشته باشد." data-learn-more="/quran-terminology/fa/roots/f-a-d/">الأَفـِٔدَةِ</button>
  </p>
  <p class="farsi-verse">همان که بر دل‌ها برمی‌آید.</p>
</section>
