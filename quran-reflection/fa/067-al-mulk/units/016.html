<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ءَأَمِنتُم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="آیا خود را ایمن می‌دانید؛ پرسشی هشداردهنده درباره امکان فرورفتن زمین.">ءَأَمِنتُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ در عبارت «من فی السماء» آمده و متعلق پرسش درباره ایمنی است.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَخسِفَ" data-root="خ س ف" data-root-meaning="فرو رفتن یا فروبردن در زمین؛ و در کاربرد ماه، کاهش یا پنهان شدن روشنایی آن." data-context="زمین را با شما فرو برد؛ امکان مطرح‌شده در پرسش هشداردهنده." data-learn-more="/quran-terminology/fa/roots/kh-s-f/">يَخسِفَ</button>
    <button class="word-link" type="button" data-word="بِكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكُمُ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ ممکن است با مخاطبان در آن فرو رود.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="تَمورُ" data-root="م و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-w-r/" data-root-meaning="جنبش و رفت‌وبرگشت سریع." data-context="به جنبش و نوسان درمی‌آید؛ حرکت زمین را جدا از خود فرو رفتن بیان می‌کند.">تَمورُ</button>
  </p>
  <p class="farsi-verse">آیا از آن‌که در آسمان است ایمن شده‌اید که زمین را با شما فرو ببرد و ناگهان بلرزد؟</p>
</section>
