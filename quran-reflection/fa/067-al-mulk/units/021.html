<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّن</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يَرزُقُكُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="شما را روزی می‌دهد؛ پرسش از تأمین‌کننده روزی.">يَرزُقُكُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="أَمسَكَ" data-root="م س ك" data-learn-more="/quran-terminology/fa/roots/m-s-k/" data-root-meaning="گرفتن و نگه داشتن؛ بازداشتن از رها شدن یا از دست رفتن؛ چنگ زدن و پایبندی. «مِسک» در شاخه‌ای جدا، مشک خوشبوست." data-context="بازدارد؛ نگه داشتن و نرساندن روزی در شرط آیه.">أَمسَكَ</button>
    <button class="word-link" type="button" data-word="رِزقَهُ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="روزی او؛ آنچه در فرض بازداشتن آن مطرح است.">رِزقَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="لَجّوا" data-root="ل ج ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-j-j/" data-root-meaning="اصرار و پافشاری؛ لُجّه: آب ژرف و گسترده." data-context="پافشاری کردند؛ ادامه دادن سرکشی و رویگردانی.">لَجّوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="عُتُوٍّ" data-root="ع ت و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-w/" data-root-meaning="سرکشی و از حد گذشتن؛ نیز فرسودگی شدید پیری." data-context="سرکشی؛ حالتی که همراه رویگردانی بر آن پافشاری می‌کنند.">عُتُوٍّ</button>
    <button class="word-link" type="button" data-word="وَنُفورٍ" data-root="ن ف ر" data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="دور شدن، فاصله گرفتن و به حرکت درآمدن؛ رمیدن و رویگردانی. در شاخه اسمی، گروه همراهان و یاری‌کنندگان." data-context="و رویگردانی؛ همراه با سرکشی، حالتی که بر آن پافشاری می‌کنند.">وَنُفورٍ</button>
  </p>
  <p class="farsi-verse">یا چه کسی شما را روزی می‌دهد، اگر او روزی خود را بازدارد؟ بلکه در سرکشی و گریز پافشاری کرده‌اند.</p>
</section>
