<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرید؛ پدید آوردن هفت آسمان.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ آسمان‌های طبقه‌طبقه." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="سَمٰوٰتٍ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ آنچه هفت شمرده شده است.">سَمٰوٰتٍ</button>
    <button class="word-link" type="button" data-word="طِباقًا" data-root="ط ب ق" data-learn-more="/quran-terminology/fa/roots/tt-b-q/" data-root-meaning="قرار گرفتن، پوشش، لایه، انطباق، و گذر از حالتی به حالت دیگر" data-context="طبقه‌طبقه؛ وصفِ نسبت و نظم آسمان‌ها.">طِباقًا</button>
    ۖ
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینی؛ با نفی، نیافتن ناسازگاری در آفرینش.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="خَلقِ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش؛ آنچه ناسازگاری از آن نفی شده است.">خَلقِ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="فرارحمن، با رحمت فراگیر؛ آفرینندهٔ یادشده در آیه.">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَفٰوُتٍ" data-root="ف و ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-t/" data-root-meaning="از دسترس بیرون رفتن؛ تفاوت: ناهمسانی یا ناهماهنگی." data-context="ناسازگاری و ناهماهنگی؛ آنچه در آفرینش نفی می‌شود.">تَفٰوُتٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَارجِعِ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="پس بازگردان؛ فرمانِ نگاه کردن دوباره.">فَارجِعِ</button>
    <button class="word-link" type="button" data-word="البَصَرَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="نگاه؛ آنچه باید دوباره متوجه آفرینش شود.">البَصَرَ</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینی؛ پرسش دربارهٔ یافتن شکاف.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فُطورٍ" data-root="ف ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-tt-r/" data-root-meaning="شکافتن؛ فطر: آغاز پدیدآوردن؛ فطرت: سرشت آغازین." data-context="شکاف‌ها؛ آنچه در پرسشِ پایانی جست‌وجو می‌شود.">فُطورٍ</button>
  </p>
  <p class="farsi-verse">آن‌که هفت آسمان را طبقه‌طبقه آفرید. در آفرینش فرارحمن هیچ ناهماهنگی نمی‌بینی. پس نگاه را بازگردان؛ آیا شکافی می‌بینی؟</p>
</section>
