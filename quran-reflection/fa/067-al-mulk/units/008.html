<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَكادُ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن">تَكادُ</button>
    <button class="word-link" type="button" data-word="تَمَيَّزُ" data-root="م ي ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَمَيَّزُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغَيظِ" data-root="غ ي ظ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الغَيظِ</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كُلَّما</button>
    <button class="word-link" type="button" data-word="أُلقِىَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/">أُلقِىَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="فَوجٌ" data-root="ف و ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَوجٌ</button>
    <button class="word-link" type="button" data-word="سَأَلَهُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/">سَأَلَهُم</button>
    <button class="word-link" type="button" data-word="خَزَنَتُها" data-root="خ ز ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خَزَنَتُها</button>
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="يَأتِكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">يَأتِكُم</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/">نَذيرٌ</button>
  </p>
  <p class="farsi-verse">نزدیک است از خشم پاره‌پاره شود. هر بار گروهی در آن افکنده شود، نگهبانانش از آنان می‌پرسند: «آیا هشداردهنده‌ای نزد شما نیامد؟»</p>
</section>
