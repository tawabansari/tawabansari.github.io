<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَكادُ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن" data-context="نزدیک است؛ بیان نزدیکیِ از هم پاشیدن.">تَكادُ</button>
    <button class="word-link" type="button" data-word="تَمَيَّزُ" data-root="م ي ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-y-z/" data-root-meaning="جدا و مشخص کردن؛ تمیّز: از هم جدا شدن." data-context="از هم بپاشد؛ تصویر شدت حالت آتش.">تَمَيَّزُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغَيظِ" data-root="غ ي ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-y-zha/" data-root-meaning="خشم شدید و برافروختگی." data-context="خشم؛ حالت شدیدِ منسوب به آتش.">الغَيظِ</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلَّما" data-root="ك ل ل" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-context="هر بار که؛ تکرار رسیدن گروه‌ها و پرسش نگهبانان.">كُلَّما</button>
    <button class="word-link" type="button" data-word="أُلقِىَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="افکنده شود؛ ورود گروه به آتش با ساخت مجهول.">أُلقِىَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="فَوجٌ" data-root="ف و ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-j/" data-root-meaning="گروه و دسته‌ای که با هم می‌آیند." data-context="گروهی؛ دسته‌ای که در آتش افکنده می‌شود.">فَوجٌ</button>
    <button class="word-link" type="button" data-word="سَأَلَهُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="از آنان پرسیدند؛ پرسش نگهبانان از گروه واردشده.">سَأَلَهُم</button>
    <button class="word-link" type="button" data-word="خَزَنَتُها" data-root="خ ز ن" data-root-meaning="نگهداری و محفوظ داشتن؛ خزانه جایگاه یا منابعِ نگهداری و خازن مسئول نگهداری است." data-context="نگهبانانش؛ نگهبانان آتش که دربارهٔ آمدن هشداردهنده می‌پرسند." data-learn-more="/quran-terminology/fa/roots/kh-z-n/">خَزَنَتُها</button>
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="يَأتِكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="نزد شما آمد؛ با «ألم» دربارهٔ رسیدن هشداردهنده پرسیده می‌شود.">يَأتِكُم</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="هشداردهنده؛ کسی که پیش‌تر پیام هشدار آورده بود.">نَذيرٌ</button>
  </p>
  <p class="farsi-verse">نزدیک است از خشم پاره‌پاره شود. هر بار گروهی در آن افکنده شود، نگهبانانش از آنان می‌پرسند: «آیا هشداردهنده‌ای نزد شما نیامد؟»</p>
</section>
