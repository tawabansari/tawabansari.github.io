<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="ارجِعِ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">ارجِعِ</button>
    <button class="word-link" type="button" data-word="البَصَرَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">البَصَرَ</button>
    <button class="word-link" type="button" data-word="كَرَّتَينِ" data-root="ك ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-r/" data-root-meaning="بازگشت و تکرار حمله یا فرصت.">كَرَّتَينِ</button>
    <button class="word-link" type="button" data-word="يَنقَلِب" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">يَنقَلِب</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="البَصَرُ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">البَصَرُ</button>
    <button class="word-link" type="button" data-word="خاسِئًا" data-root="خ س أ" data-learn-more="/quran-terminology/fa/roots/kh-s-a/" data-root-meaning="راندن، دور کردن همراه خواری، پس زدن و فرومانده ساختن؛ با تفکیک معنای ریشه از تأمل سیاقی.">خاسِئًا</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="حَسيرٌ" data-root="ح س ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-s-r/" data-root-meaning="کنار زدن پوشش؛ نیز خستگی و از توان افتادن، و حسرت و اندوه.">حَسيرٌ</button>
  </p>
  <p class="farsi-verse">سپس نگاه را دوباره و دوباره بازگردان؛ نگاهت ناکام و خسته به سوی تو بازمی‌گردد.</p>
</section>
