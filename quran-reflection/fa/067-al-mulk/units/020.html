<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّن</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="جُندٌ" data-root="ج ن د" data-root-meaning="نیروهای گردآمده برای یاری، پشتیبانی و اقدام مشترک؛ در کاربرد نظامی، سپاه." data-context="سپاه و نیروی پشتیبان شما؛ در پرسش از یاری مستقل از فرارحمن." data-learn-more="/quran-terminology/fa/roots/j-n-d/">جُندٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="يَنصُرُكُم" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="شما را یاری کند.">يَنصُرُكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="جز و غیرِ؛ در ترکیب «من دون».">دونِ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="فرارحمن؛ صاحب رحمت فراگیر.">الرَّحمٰنِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنِ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="انکارکنندگان.">الكٰفِرونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="غُرورٍ" data-root="غ ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-r/" data-root-meaning="فریب و دل بستن به نمود گمراه‌کننده." data-context="فریب و خودفریبی.">غُرورٍ</button>
  </p>
  <p class="farsi-verse">یا این چه سپاهی است برای شما که جز فرارحمن یاریتان کند؟ کافران جز در فریب نیستند.</p>
</section>
