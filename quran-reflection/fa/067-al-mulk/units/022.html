<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَمَن</button>
    <button class="word-link" type="button" data-word="يَمشى" data-root="م ش ي" data-learn-more="/quran-terminology/fa/roots/m-sh-y/" data-root-meaning="راه رفتن، گام برداشتن، حرکت کردن بر زمین؛ و در میدان گسترده‌تر، پیش رفتن در یک مسیر، روش، رفتار یا سبک زندگی">يَمشى</button>
    <button class="word-link" type="button" data-word="مُكِبًّا" data-root="ك ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُكِبًّا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="وَجهِهِ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»">وَجهِهِ</button>
    <button class="word-link" type="button" data-word="أَهدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">أَهدىٰ</button>
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّن</button>
    <button class="word-link" type="button" data-word="يَمشى" data-root="م ش ي" data-learn-more="/quran-terminology/fa/roots/m-sh-y/" data-root-meaning="راه رفتن، گام برداشتن، حرکت کردن بر زمین؛ و در میدان گسترده‌تر، پیش رفتن در یک مسیر، روش، رفتار یا سبک زندگی">يَمشى</button>
    <button class="word-link" type="button" data-word="سَوِيًّا" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">سَوِيًّا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="ص ر ط" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد" data-learn-more="/quran-terminology/fa/roots/s-r-t/">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُستَقيمٍ</button>
  </p>
  <p class="farsi-verse">آیا کسی که سرنگون بر روی خود راه می‌رود هدایت‌یافته‌تر است، یا کسی که راست بر راهی مستقیم راه می‌رود؟</p>
</section>
