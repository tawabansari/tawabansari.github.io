<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقَ</button>
    <button class="word-link" type="button" data-word="المَوتَ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">المَوتَ</button>
    <button class="word-link" type="button" data-word="وَالحَيوٰةَ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/">وَالحَيوٰةَ</button>
    <button class="word-link" type="button" data-word="لِيَبلُوَكُم" data-root="ب ل و" data-learn-more="/quran-terminology/fa/roots/b-l-w/">لِيَبلُوَكُم</button>
    <button class="word-link" type="button" data-word="أَيُّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيُّكُم</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="عَمَلًا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">عَمَلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/">العَزيزُ</button>
    <button class="word-link" type="button" data-word="الغَفورُ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/">الغَفورُ</button>
  </p>
  <p class="farsi-verse">آن‌که مرگ و زندگی را آفرید تا شما را بیازماید که کدامتان نیکوکردارترید؛ و او عزتمند و آمرزنده است.</p>
