<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="زَيَّنَّا" data-root="ز ي ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">زَيَّنَّا</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="بِمَصٰبيحَ" data-root="ص ب ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِمَصٰبيحَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰها" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنٰها</button>
    <button class="word-link" type="button" data-word="رُجومًا" data-root="ر ج م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رُجومًا</button>
    <button class="word-link" type="button" data-word="لِلشَّيٰطينِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">لِلشَّيٰطينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَعتَدنا" data-root="ع ت د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَعتَدنا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابَ</button>
    <button class="word-link" type="button" data-word="السَّعيرِ" data-root="س ع ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">السَّعيرِ</button>
  </p>
  <p class="farsi-verse">و آسمان نزدیک را با چراغ‌هایی آراستیم و آن‌ها را پرتابه‌هایی برای شیاطین قرار دادیم؛ و برای آنان عذاب آتش فروزان آماده کرده‌ایم.</p>
</section>
