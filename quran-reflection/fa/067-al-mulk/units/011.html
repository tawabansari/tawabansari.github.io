<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاعتَرَفوا" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">فَاعتَرَفوا</button>
    <button class="word-link" type="button" data-word="بِذَنبِهِم" data-root="ذ ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-n-b/" data-root-meaning="دُم؛ ذنب: گناه و مسئولیت آن؛ ذَنوب: دلو پُر یا بهره‌ای مقرر.">بِذَنبِهِم</button>
    <button class="word-link" type="button" data-word="فَسُحقًا" data-root="س ح ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-h-q/" data-root-meaning="ساییدن و خرد کردن؛ نیز دوری و دور افتادن.">فَسُحقًا</button>
    <button class="word-link" type="button" data-word="لِأَصحٰبِ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">لِأَصحٰبِ</button>
    <button class="word-link" type="button" data-word="السَّعيرِ" data-root="س ع ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-ayn-r/" data-root-meaning="افروختن آتش؛ سعیر: آتش شعله‌ور؛ سُعُر در برخی سیاق‌ها: آشفتگی.">السَّعيرِ</button>
  </p>
  <p class="farsi-verse">پس به گناه خود اعتراف می‌کنند؛ پس دور باد اهل آتش فروزان!</p>
</section>
