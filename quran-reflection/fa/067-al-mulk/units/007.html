<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الملك ۶۷:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="أُلقوا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">أُلقوا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="سَمِعوا" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">سَمِعوا</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="شَهيقًا" data-root="ش ه ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">شَهيقًا</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="تَفورُ" data-root="ف و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَفورُ</button>
  </p>
  <p class="farsi-verse">هنگامی که در آن افکنده شوند، از آن خروشی می‌شنوند، در حالی که می‌جوشد.</p>
