<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَتَنٰزَعونَ" data-root="ن ز ع" data-learn-more="/quran-terminology/fa/roots/n-z-ayn/" data-root-meaning="کشیدن، بیرون آوردن و جدا کردن؛ تنازع بنا بر سیاق، اختلاف و کشمکش یا دادوگرفت میان طرف‌هاست." data-context="جام را میان خود دست‌به‌دست می‌کنند؛ دادوگرفتی بدون خصومت.">يَتَنٰزَعونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="كَأسًا" data-root="ك أ س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-a-s/" data-root-meaning="جام نوشیدنی، معمولاً همراه با محتوی آن." data-context="جام؛ چیزی که میان اهل جنت دست‌به‌دست می‌شود.">كَأسًا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="لَغوٌ" data-root="ل غ و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-gh-w/" data-root-meaning="گفتار بیهوده و بی‌اعتبار؛ سخن یا کاری که اعتنایی به آن نیست." data-context="بیهوده‌گویی؛ چیزی که در آن نوشیدن نفی شده است.">لَغوٌ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَأثيمٌ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="گناه‌آفرینی؛ چیزی که در این مجلس نفی شده است.">تَأثيمٌ</button>
  </p>
  <p class="farsi-verse">در آن جامی را از یکدیگر می‌گیرند که نه بیهوده‌گویی در آن است و نه گناه‌آفرینی.</p>
</section>
