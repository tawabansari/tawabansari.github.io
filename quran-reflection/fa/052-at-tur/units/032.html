<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="تَأمُرُهُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="به آنان فرمان می‌دهند؛ در پرسش از نسبت سخنانشان با خرد.">تَأمُرُهُم</button>
    <button class="word-link" type="button" data-word="أَحلٰمُهُم" data-root="ح ل م" data-root-meaning="خواب و رؤیا؛ بلوغ در تعبیر «بلوغ الحلم»؛ خرد، بردباری و خویشتن‌داری در برابر شتاب‌زدگی." data-context="خردهایشان؛ توان داوری آنان در پرسشی انتقادی، نه خواب‌هایشان." data-learn-more="/quran-terminology/fa/roots/h-l-m/">أَحلٰمُهُم</button>
    <button class="word-link" type="button" data-word="بِهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهٰذا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروهی از مردم؛ وصف‌شده به سرکشی.">قَومٌ</button>
    <button class="word-link" type="button" data-word="طاغونَ" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق" data-context="سرکشان؛ کسانی که از حدود درست فراتر می‌روند.">طاغونَ</button>
  </p>
  <p class="farsi-verse">آیا خردهایشان آنان را به این فرمان می‌دهد، یا مردمی سرکش‌اند؟</p>
</section>
