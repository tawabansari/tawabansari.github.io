<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولونَ</button>
    <button class="word-link" type="button" data-word="شاعِرٌ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک">شاعِرٌ</button>
    <button class="word-link" type="button" data-word="نَتَرَبَّصُ" data-root="ر ب ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-b-sad/" data-root-meaning="در انتظار ماندن و چشم به رویدادی داشتن.">نَتَرَبَّصُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="رَيبَ" data-root="ر ي ب" data-learn-more="/quran-terminology/fa/roots/r-y-b/" data-root-meaning="تردید آشفته، بی‌اعتمادی، بدگمانی، شک بی‌ثبات‌کننده، اضطراب در برابر حق، و حالتی که انسان را از اطمینان و تسلیم در برابر برهان بازمی‌دارد">رَيبَ</button>
    <button class="word-link" type="button" data-word="المَنونِ" data-root="م ن ن" data-learn-more="/quran-terminology/fa/roots/m-n-n/" data-root-meaning="رساندن عطا یا احسانی برجسته؛ به رخ کشیدن آن عطا؛ آزاد کردن بدون عوض؛ و بریدن، کاستن یا پایان یافتن.">المَنونِ</button>
  </p>
  <p class="farsi-verse">یا می‌گویند: شاعری است که برای او گردش مرگ را انتظار می‌کشیم؟</p>
</section>
