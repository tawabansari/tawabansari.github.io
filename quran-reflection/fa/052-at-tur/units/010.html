<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَسيرُ" data-root="س ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-r/" data-root-meaning="رفتن و حرکت در مسیر؛ سیره: روش یا حالت." data-context="و به حرکت درمی‌آیند؛ حرکت کوه‌ها.">وَتَسيرُ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ در بیان به حرکت درآمدن آنها." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالُ</button>
    <button class="word-link" type="button" data-word="سَيرًا" data-root="س ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-r/" data-root-meaning="رفتن و حرکت در مسیر؛ سیره: روش یا حالت." data-context="حرکتی؛ تأکید مصدری بر حرکت.">سَيرًا</button>
  </p>
  <p class="farsi-verse">و کوه‌ها به حرکت درآیند.</p>
</section>
