<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالبَحرِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان">وَالبَحرِ</button>
    <button class="word-link" type="button" data-word="المَسجورِ" data-root="س ج ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-j-r/" data-root-meaning="افروختن و پُر کردن؛ مسجور و سجّرت بنا بر سیاق و تفسیر با برافروختگی یا انباشتگی توضیح داده می‌شوند.">المَسجورِ</button>
  </p>
  <p class="farsi-verse">و دریای برافروخته،</p>
