<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="عِندَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَهُم</button>
    <button class="word-link" type="button" data-word="خَزائِنُ" data-root="خ ز ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-z-n/" data-root-meaning="اندوختن و نگه داشتن؛ خزانه و نگهبان آن.">خَزائِنُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="المُصَۣيطِرونَ" data-root="س ط ر" data-root-note="برای «مصیطر» تحلیل چهارحرفی س ي ط ر و فهرست‌بندی زیر س ط ر وجود دارد؛ صاد در این صورت با سین ارتباط دارد. توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-tt-r/" data-root-meaning="سطر و نوشتن؛ اساطیر: حکایت‌های نقل‌شده؛ مصیطر: چیره و مراقب.">المُصَۣيطِرونَ</button>
  </p>
  <p class="farsi-verse">یا گنجینه‌های پروردگارت نزد آنان است، یا آنان چیره‌اند؟</p>
</section>
