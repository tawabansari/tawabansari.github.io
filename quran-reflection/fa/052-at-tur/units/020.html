<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="و ك أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-a/" data-root-meaning="تکیه کردن و قرار گرفتن بر تکیه‌گاه.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="سُرُرٍ" data-root="س ر ر" data-learn-more="/quran-terminology/fa/roots/s-r-r/" data-root-meaning="راز و نهان، شادی و آسایش، و جایگاه استقرار">سُرُرٍ</button>
    <button class="word-link" type="button" data-word="مَصفوفَةٍ" data-root="ص ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-f-f/" data-root-meaning="در ردیف نهادن یا گستردن بال‌ها.">مَصفوفَةٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَزَوَّجنٰهُم" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند">وَزَوَّجنٰهُم</button>
    <button class="word-link" type="button" data-word="بِحورٍ" data-root="ح و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-w-r/" data-root-meaning="بازگشت و پاسخ‌گویی در گفت‌وگو؛ حور: وصف چشمان برجسته و زیبا؛ حواریون: یاران نزدیک.">بِحورٍ</button>
    <button class="word-link" type="button" data-word="عينٍ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">عينٍ</button>
  </p>
  <p class="farsi-verse">بر تخت‌هایی ردیف‌شده تکیه زده‌اند، و آنان را با حورانی درشت‌چشم جفت کردیم.</p>
</section>
