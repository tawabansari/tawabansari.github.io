<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمدَدنٰهُم" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر" data-context="و پیوسته بهره‌مندشان کردیم">وَأَمدَدنٰهُم</button>
    <button class="word-link" type="button" data-word="بِفٰكِهَةٍ" data-root="ف ك ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-h2/" data-root-meaning="میوه؛ فاکه: شادمان و برخوردار؛ تفکّه: خوشی یا شگفتی و گفت‌وگو، بنا بر سیاق." data-context="با میوه">بِفٰكِهَةٍ</button>
    <button class="word-link" type="button" data-word="وَلَحمٍ" data-root="ل ح م" data-root-meaning="گوشت و بافت گوشتی بدن؛ «لَحْم» مفرد و «لُحُوم» جمع آن است. خوراکی بودن و دیگر نقش‌ها از سیاق روشن می‌شوند." data-learn-more="/quran-terminology/fa/roots/l-h-m/" data-context="و گوشت">وَلَحمٍ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="يَشتَهونَ" data-root="ش ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-w/" data-root-meaning="میل و خواست شدید برای چیزی." data-context="میل دارند">يَشتَهونَ</button>
  </p>
  <p class="farsi-verse">و از میوه و گوشتی که میل دارند بر آنان افزودیم.</p>
</section>
