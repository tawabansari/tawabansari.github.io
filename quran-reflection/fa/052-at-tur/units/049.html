  <h2 class="ayah-title">الطور ۵۲:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/">الَّيلِ</button>
    <button class="word-link" type="button" data-word="فَسَبِّحهُ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/">فَسَبِّحهُ</button>
    <button class="word-link" type="button" data-word="وَإِدبٰرَ" data-root="د ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَإِدبٰرَ</button>
    <button class="word-link" type="button" data-word="النُّجومِ" data-root="ن ج م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">النُّجومِ</button>
  </p>
  <p class="farsi-verse">و در بخشی از شب او را تسبیح گوی و هنگام پشت کردن ستارگان.</p>
