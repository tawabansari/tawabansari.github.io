<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">وَاصبِر</button>
    <button class="word-link" type="button" data-word="لِحُكمِ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">لِحُكمِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَإِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّكَ</button>
    <button class="word-link" type="button" data-word="بِأَعيُنِنا" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">بِأَعيُنِنا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَبِّح" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">وَسَبِّح</button>
    <button class="word-link" type="button" data-word="بِحَمدِ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">بِحَمدِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="حينَ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان.">حينَ</button>
    <button class="word-link" type="button" data-word="تَقومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">تَقومُ</button>
  </p>
  <p class="farsi-verse">و برای حکم پروردگارت شکیبا باش، که تو در برابر دیدگان مایی؛ و هنگامی که برمی‌خیزی با ستایش پروردگارت تسبیح گوی.</p>
</section>
