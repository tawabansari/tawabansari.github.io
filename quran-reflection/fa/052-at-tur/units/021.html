<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ کسانی که در آغاز آیه از آنان سخن می‌رود.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعَتهُم" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="و نسلشان از آنان پیروی کرد؛ همراه شدن نسل با پیشینیان در ایمان.">وَاتَّبَعَتهُم</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتُهُم" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="نسل و فرزندان آنان؛ فاعلِ پیروی کردن در این عبارت.">ذُرِّيَّتُهُم</button>
    <button class="word-link" type="button" data-word="بِإيمٰنٍ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="با ایمان؛ قیدی که پیروی نسل را با ایمان پیوند می‌دهد.">بِإيمٰنٍ</button>
    <button class="word-link" type="button" data-word="أَلحَقنا" data-root="ل ح ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h-q/" data-root-meaning="رسیدن و به دیگری پیوستن." data-context="نسلشان را به آنان پیوستیم؛ الحاق در سیاق برخورداری اهل بهشت.">أَلحَقنا</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتَهُم" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="نسل و فرزندان آنان که به ایشان ملحق می‌شوند؛ مفعولِ «ألحقنا».">ذُرِّيَّتَهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَلَتنٰهُم" data-root="أ ل ت" data-learn-more="/quran-terminology/fa/roots/a-l-t/" data-root-meaning="کاستن از مقدار، حق یا حاصل چیزی؛ به‌ویژه کم گذاشتن در آنچه به شخص تعلق دارد یا باید به او رسانده شود." data-context="در «وما ألتناهم»: هیچ چیز از عمل آنان نکاستیم؛ این پیوستن، حاصل اعمالشان را کم نمی‌کند.">أَلَتنٰهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَمَلِهِم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="عمل آنان؛ کردارشان که در این سیاق، حفظ حاصل و پاداش آن نیز مورد نظر است.">عَمَلِهِم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هیچ چیز؛ پس از نفی، هر اندازه کاستن از عمل را نفی می‌کند.">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ شمول حکم پایانی بر تک‌تک اشخاص.">كُلُّ</button>
    <button class="word-link" type="button" data-word="امرِئٍ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود" data-context="شخص؛ هر انسان در نسبت با کردار و مسئولیت خودش.">امرِئٍ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كَسَبَ" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان" data-context="به دست آورد؛ آنچه شخص از عمل و کردار کسب کرده است.">كَسَبَ</button>
    <button class="word-link" type="button" data-word="رَهينٌ" data-root="ر ه ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-h2-n/" data-root-meaning="گرو و وثیقه؛ در بند یا وابسته بودن." data-context="در گرو؛ هر شخص با آنچه خود کسب کرده پیوند مسئولیت دارد.">رَهينٌ</button>
  </p>
  <p class="farsi-verse">و کسانی که ایمان آوردند و فرزندانشان با ایمان از آنان پیروی کردند، فرزندانشان را به آنان پیوستیم و چیزی از عملشان نکاستیم؛ هرکس در گرو چیزی است که به دست آورده است.</p>
</section>
