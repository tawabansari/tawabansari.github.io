<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="يُريدونَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">يُريدونَ</button>
    <button class="word-link" type="button" data-word="كَيدًا" data-root="ك ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَيدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="المَكيدونَ" data-root="ك ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المَكيدونَ</button>
  </p>
  <p class="farsi-verse">یا نیرنگی می‌خواهند؟ پس کسانی که کفر ورزیدند خود گرفتار نیرنگ‌اند.</p>
</section>
