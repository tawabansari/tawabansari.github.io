<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الطور ۵۲:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَمَنَّ" data-root="م ن ن" data-learn-more="/quran-terminology/fa/roots/m-n-n/" data-root-meaning="رساندن عطا یا احسانی برجسته؛ به رخ کشیدن آن عطا؛ آزاد کردن بدون عوض؛ و بریدن، کاستن یا پایان یافتن.">فَمَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="وَوَقىٰنا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَوَقىٰنا</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابَ</button>
    <button class="word-link" type="button" data-word="السَّمومِ" data-root="س م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-m-m/" data-root-meaning="سوراخ باریک؛ سموم: باد بسیار گرم و آسیب‌رسان.">السَّمومِ</button>
  </p>
  <p class="farsi-verse">پس آن معبود یگانه بر ما منت نهاد و ما را از عذاب باد سوزان نگاه داشت.</p>
</section>
