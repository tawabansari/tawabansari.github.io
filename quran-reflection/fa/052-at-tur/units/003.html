  <h2 class="ayah-title">الطور ۵۲:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="رَقٍّ" data-root="ر ق ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-q-q/" data-root-meaning="نازکی و نرمی؛ رقّ: پوست یا برگ نوشتن.">رَقٍّ</button>
    <button class="word-link" type="button" data-word="مَنشورٍ" data-root="ن ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-r/" data-root-meaning="گستردن و پراکندن؛ نشور: برخاستن و زنده شدن دوباره.">مَنشورٍ</button>
