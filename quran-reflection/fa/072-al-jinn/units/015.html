<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="القٰسِطونَ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است." data-context="ستم‌پیشگان؛ در سیاق گفتار جن">القٰسِطونَ</button>
    <button class="word-link" type="button" data-word="فَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="پس در جایگاه هیزم دوزخ قرار دارند؛ بیان سرانجام آنان">فَكانوا</button>
    <button class="word-link" type="button" data-word="لِجَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لِجَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="حَطَبًا" data-root="ح ط ب" data-root-meaning="هستهٔ معنایی ریشه، هیزم و فراهم کردن مادهٔ چوبی برای افروختن آتش است. از همین کاربرد ملموس، تصویر اشخاص در جایگاه هیزم و نیز تشبیه رفتارهای فتنه‌انگیز به فراهم کردن سوخت برای آتش دشمنی شکل گرفته است." data-context="هیزم؛ وصف سرانجام ستم‌پیشگانِ مورد گفتار جن برای دوزخ" data-learn-more="/quran-terminology/fa/roots/h-tt-b/">حَطَبًا</button>
  </p>
  <p class="farsi-verse">و اما آنان که از حق منحرف‌اند، هیزم دوزخ خواهند بود.»</p>
</section>
