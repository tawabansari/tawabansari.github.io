  <h2 class="ayah-title">الجن ۷۲:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَلَّوِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَلَّوِ</button>
    <button class="word-link" type="button" data-word="استَقٰموا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">استَقٰموا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الطَّريقَةِ" data-root="ط ر ق" data-learn-more="/quran-terminology/fa/roots/tt-r-q/">الطَّريقَةِ</button>
    <button class="word-link" type="button" data-word="لَأَسقَينٰهُم" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/">لَأَسقَينٰهُم</button>

    <button class="word-link" type="button" data-word="غَدَقًا" data-root="غ د ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَدَقًا</button>
  </p>
  <p class="farsi-verse">و اگر بر آن راه پایدار می‌ماندند، به آنان آبی فراوان می‌نوشاندیم،</p>
