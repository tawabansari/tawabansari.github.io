  <h2 class="ayah-title">الجن ۷۲:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كُنّا</button>
    <button class="word-link" type="button" data-word="نَقعُدُ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/">نَقعُدُ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="مَقٰعِدَ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/">مَقٰعِدَ</button>

    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="يَستَمِعِ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/">يَستَمِعِ</button>
    <button class="word-link" type="button" data-word="الـٔانَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الـٔانَ</button>
    <button class="word-link" type="button" data-word="يَجِد" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/">يَجِد</button>

    <button class="word-link" type="button" data-word="شِهابًا" data-root="ش ه ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">شِهابًا</button>
    <button class="word-link" type="button" data-word="رَصَدًا" data-root="ر ص د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رَصَدًا</button>
  </p>
  <p class="farsi-verse">و ما در جایگاه‌هایی از آن برای شنیدن می‌نشستیم؛ اما اکنون هر که گوش بسپارد، شهابی در کمین خود می‌یابد.</p>
