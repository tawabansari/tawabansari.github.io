<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودیم؛ در ساختِ بیانِ رفتارِ پیشین.">كُنّا</button>
    <button class="word-link" type="button" data-word="نَقعُدُ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار" data-context="می‌نشستیم؛ در جایگاه‌هایی برای شنیدن مستقر می‌شدیم.">نَقعُدُ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="مَقٰعِدَ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار" data-context="جایگاه‌های نشستن؛ محل‌های استقرار برای شنیدن.">مَقٰعِدَ</button>
    <button class="word-link" type="button" data-word="لِلسَّمعِ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="برای شنیدن؛ هدفِ آن جایگاه‌گرفتن.">لِلسَّمعِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="يَستَمِعِ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="گوش بسپارد؛ اکنون برای شنیدن اقدام کند.">يَستَمِعِ</button>
    <button class="word-link" type="button" data-word="الـٔانَ" data-context="اکنون؛ وضعیتِ کنونیِ شنیدن در برابر رفتار پیشینِ گویندگان." data-root-note="اسم زمان و ظرفِ مبنی؛ اشتقاق تاریخیِ «الآن» محل اختلاف است." data-learn-more="/quran-terminology/fa/roots/a-w-n/">الـٔانَ</button>
    <button class="word-link" type="button" data-word="يَجِد" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="می‌یابد؛ با آنچه در کمین اوست روبه‌رو می‌شود.">يَجِد</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="شِهابًا" data-root="ش ه ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-b/" data-root-meaning="شعله یا جسم نورانی درخشان در آسمان." data-context="شهاب و شعلهٔ درخشان؛ آنچه شنونده در کمین خود می‌یابد.">شِهابًا</button>
    <button class="word-link" type="button" data-word="رَصَدًا" data-root="ر ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-sad-d/" data-root-meaning="مراقبت و کمین برای انتظار و مشاهده." data-context="در کمین و آمادهٔ مراقبت؛ وصفِ شهاب.">رَصَدًا</button>
  </p>
  <p class="farsi-verse">و ما در جایگاه‌هایی از آن برای شنیدن می‌نشستیم؛ اما اکنون هر که گوش بسپارد، شهابی در کمین خود می‌یابد.</p>
</section>
