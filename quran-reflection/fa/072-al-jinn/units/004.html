<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="يَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولُ</button>
    <button class="word-link" type="button" data-word="سَفيهُنا" data-root="س ف ه" data-learn-more="/quran-terminology/fa/roots/s-f-h2/" data-root-meaning="سبکی عقل، ناپختگی در تشخیص، ضعف حلم، و رأی یا رفتاری که از وزن و استواری بیرون رفته است">سَفيهُنا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شَطَطًا" data-root="ش ط ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-tt-tt/" data-root-meaning="دور شدن و از اندازه گذشتن، در گفتار یا داوری.">شَطَطًا</button>
  </p>
  <p class="farsi-verse">و نادان ما دربارهٔ آن معبود یگانه سخنی دور از حق می‌گفت.</p>
</section>
