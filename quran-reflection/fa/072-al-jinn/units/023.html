  <p class="farsi-verse">مگر رساندن پیامی از آن معبود یگانه و پیام‌های او. و هر که از آن معبود یگانه و فرستاده‌اش نافرمانی کند، آتش دوزخ برای اوست؛ جاودانه در آن می‌مانند.»</p>
