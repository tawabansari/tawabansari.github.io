<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="لَمَسنَا" data-root="ل م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-m-s/" data-root-meaning="لمس کردن؛ التماس: جست‌وجو؛ در برخی سیاق‌ها کنایه از تماس جنسی.">لَمَسنَا</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءَ</button>
    <button class="word-link" type="button" data-word="فَوَجَدنٰها" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">فَوَجَدنٰها</button>
    <button class="word-link" type="button" data-word="مُلِئَت" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه.">مُلِئَت</button>
    <button class="word-link" type="button" data-word="حَرَسًا" data-root="ح ر س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-r-s/" data-root-meaning="نگهبانی، مراقبت و حفاظت.">حَرَسًا</button>
    <button class="word-link" type="button" data-word="شَديدًا" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شَديدًا</button>
    <button class="word-link" type="button" data-word="وَشُهُبًا" data-root="ش ه ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-b/" data-root-meaning="شعله یا جسم نورانی درخشان در آسمان.">وَشُهُبًا</button>
  </p>
  <p class="farsi-verse">و ما آسمان را جست‌وجو کردیم و آن را پر از نگهبانان سخت‌گیر و شهاب‌ها یافتیم.</p>
</section>
