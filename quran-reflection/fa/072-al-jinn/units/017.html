  <h2 class="ayah-title">الجن ۷۲:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِنَفتِنَهُم" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/">لِنَفتِنَهُم</button>

    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُعرِض" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/">يُعرِض</button>

    <button class="word-link" type="button" data-word="ذِكرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">ذِكرِ</button>

  <p class="farsi-verse">تا آنان را در آن بیازماییم. و هر که از یاد پروردگارش روی بگرداند، او را به عذابی سخت درمی‌آورد.</p>
