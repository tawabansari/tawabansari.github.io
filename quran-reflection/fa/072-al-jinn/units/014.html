<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="مِنَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَّا</button>
    <button class="word-link" type="button" data-word="المُسلِمونَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="تسلیم‌شدگان؛ گروهی از جنیان که در برابر قاسطان از آنان یاد شده است.">المُسلِمونَ</button>
    <button class="word-link" type="button" data-word="وَمِنَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَّا</button>
    <button class="word-link" type="button" data-word="القٰسِطونَ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است." data-context="ستمگران و منحرفان از حق؛ گروهی در برابر تسلیم‌شدگان.">القٰسِطونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="أَسلَمَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="تسلیم شد؛ فعلِ شرط دربارهٔ کسی که رشد را جسته است.">أَسلَمَ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="تَحَرَّوا" data-root="ح ر ي" data-root-meaning="«ح ر ي» در شاخهٔ مربوط به «حَرِيّ» و «تَحَرَّى»، با سزاواری، قصد و جست‌وجوی هدفمند ارتباط دارد. «تَحَرَّى» یعنی چیزی را با توجه و کوشش جستن یا قصد کردن، به‌ویژه آنچه مناسب‌تر یا شایسته‌تر دانسته می‌شود. در قرآن، «تَحَرَّوْا رَشَدًا» به معنای جستن و روی آوردن هدفمند به رشد است." data-context="رشد را با قصد و کوشش جسته و به سوی آن روی آورده‌اند." data-learn-more="/quran-terminology/fa/roots/h-r-y/">تَحَرَّوا</button>
    <button class="word-link" type="button" data-word="رَشَدًا" data-root="ر ش د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-sh-d/" data-root-meaning="راه‌یافتگی و تشخیص درست در برابر گمراهی." data-context="رشد و راه‌یافتگی درست؛ چیزی که جسته و قصد شده است.">رَشَدًا</button>
  </p>
  <p class="farsi-verse">و از ما کسانی تسلیم‌اند و از ما کسانی از حق منحرف‌اند؛ پس آنان که تسلیم شدند، راه‌یابی را جستند.</p>
</section>
