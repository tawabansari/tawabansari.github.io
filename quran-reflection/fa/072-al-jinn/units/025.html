<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان به محمد برای بیان حد دانایی خود درباره زمان تحقق وعده.">قُل</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="أَدرى" data-root="د ر ي" data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه بودن از موضوعی؛ در باب افعال، آگاه ساختن دیگری." data-context="نمی‌دانم؛ در ترکیب «إن أدري»، «إن» نفی می‌کند و جمله شرطی نیست.">أَدرى</button>
    <button class="word-link" type="button" data-word="أَقَريبٌ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="آیا نزدیک است؟ پرسش از نزدیکی زمان آنچه به مخاطبان وعده داده می‌شود.">أَقَريبٌ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="توعَدونَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="آنچه به شما وعده داده می‌شود؛ فعل مجهول جمع مخاطب، و مصداق وعده از سیاق شناخته می‌شود.">توعَدونَ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="يَجعَلُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="برای آن مدتی قرار می‌دهد؛ تعیین فاصله یا کرانه زمانی به پروردگار نسبت داده می‌شود.">يَجعَلُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ کسی که قرار دادن مدت برای آن وعده به او نسبت داده شده است.">رَبّى</button>
    <button class="word-link" type="button" data-word="أَمَدًا" data-root="أ م د" data-learn-more="/quran-terminology/fa/roots/a-m-d/" data-root-meaning="کرانه یا نهایتی که یک فاصله یا امتداد به آن می‌رسد؛ و در کاربرد زمانی، مدت یا فاصله‌ای که با توجه به آغاز، پایان یا نقطه مورد انتظار سنجیده می‌شود." data-context="مدت یا کرانه زمانی تا تحقق وعده؛ مقدار آن برای گوینده معلوم نیست و خود واژه ضرورتا مدت بسیار طولانی نمی‌رساند.">أَمَدًا</button>
  </p>
  <p class="farsi-verse">بگو: «نمی‌دانم آیا آنچه به شما وعده داده می‌شود نزدیک است، یا پروردگارم برای آن مدتی قرار می‌دهد.»</p>
</section>
