<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="مِنَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَّا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحونَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحونَ</button>
    <button class="word-link" type="button" data-word="وَمِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنّا</button>
    <button class="word-link" type="button" data-word="دونَ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنّا</button>
    <button class="word-link" type="button" data-word="طَرائِقَ" data-root="ط ر ق" data-learn-more="/quran-terminology/fa/roots/tt-r-q/" data-root-meaning="کوبیدن، راه، طریقه، طرائق و طارق شبانه">طَرائِقَ</button>
    <button class="word-link" type="button" data-word="قِدَدًا" data-root="ق د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-d-d/" data-root-meaning="درازا بریدن یا پاره کردن؛ قِدَد: بخش‌ها و راه‌های جدا.">قِدَدًا</button>
  </p>
  <p class="farsi-verse">و از ما کسانی درستکارند و از ما کسانی جز آن؛ ما راه‌های گوناگون داشتیم.</p>
</section>
