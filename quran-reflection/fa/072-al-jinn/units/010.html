<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="نَدرى" data-root="د ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه شدن.">نَدرى</button>
    <button class="word-link" type="button" data-word="أَشَرٌّ" data-root="ش ر ر" data-root-meaning="شر، بدی یا زیانی است که می‌تواند به رفتار، وضعیت، رخداد یا فرجام چیزی نسبت داده شود؛ در ساخت مقایسه‌ای، بدتر بودن را بیان می‌کند؛ و شرر در شاخه مادی به پاره‌های فروزان و جهنده آتش اشاره دارد." data-learn-more="/quran-terminology/fa/roots/sh-r-r/">أَشَرٌّ</button>
    <button class="word-link" type="button" data-word="أُريدَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">أُريدَ</button>
    <button class="word-link" type="button" data-word="بِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِمَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="أَرادَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">أَرادَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="رَبُّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّهُم</button>
    <button class="word-link" type="button" data-word="رَشَدًا" data-root="ر ش د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-sh-d/" data-root-meaning="راه‌یافتگی و تشخیص درست در برابر گمراهی.">رَشَدًا</button>
  </p>
  <p class="farsi-verse">و ما نمی‌دانیم آیا برای کسانی که در زمین‌اند بدی خواسته شده، یا پروردگارشان برای آنان راه‌یابی خواسته است.</p>
</section>
