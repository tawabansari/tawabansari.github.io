<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الجن ۷۲:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="رِجالٌ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه.">رِجالٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الإِنسِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">الإِنسِ</button>
    <button class="word-link" type="button" data-word="يَعوذونَ" data-root="ع و ذ" data-learn-more="/quran-terminology/fa/roots/ayn-w-dh/" data-root-meaning="پناه بردن، پناه جستن، به مأمن روی آوردن و در حفاظت آن قرار گرفتن.">يَعوذونَ</button>
    <button class="word-link" type="button" data-word="بِرِجالٍ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه.">بِرِجالٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِنِّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجِنِّ</button>
    <button class="word-link" type="button" data-word="فَزادوهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">فَزادوهُم</button>
    <button class="word-link" type="button" data-word="رَهَقًا" data-root="ر ه ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-h2-q/" data-root-meaning="فراگرفتن با فشار و سنگینی؛ تحمیل کردن و به رنج انداختن.">رَهَقًا</button>
  </p>
  <p class="farsi-verse">و مردانی از آدمیان به مردانی از جن پناه می‌بردند و بر گرفتاری‌شان می‌افزودند.</p>
</section>
