<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَتبَعَهُم" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">فَأَتبَعَهُم</button>
    <button class="word-link" type="button" data-word="فِرعَونُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونُ</button>
    <button class="word-link" type="button" data-word="بِجُنودِهِ" data-root="ج ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-d/" data-root-meaning="جند و جنود: سپاه، نیروها و گروه‌های سازمان‌یافتهٔ پشتیبان.">بِجُنودِهِ</button>
    <button class="word-link" type="button" data-word="فَغَشِيَهُم" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش">فَغَشِيَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="ي م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-m/" data-root-meaning="قصد و رو آوردن؛ تیمّم: به قصد چیزی رفتن؛ یمّ: دریا یا آب پهناور، در شاخه‌ای دیگر.">اليَمِّ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="غَشِيَهُم" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش">غَشِيَهُم</button>
  </p>
  <p class="farsi-verse">پس فرعون با سپاهیانش آنان را دنبال کرد و از دریا آنچه فراگرفتشان، فراگرفتشان.</p>
</section>
