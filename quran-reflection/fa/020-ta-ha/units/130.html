<section class="ayah-block" id="ayah-130" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="پس شکیبا باش؛ فرمان به صبر در برابر سخنانی که می‌گویند.">فَاصبِر</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ سخنانی که مخاطب آیه به شکیبایی در برابر آنها فراخوانده می‌شود.">يَقولونَ</button>
    <button class="word-link" type="button" data-word="وَسَبِّح" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="و تسبیح گوی؛ فرمان به پاک دانستن پروردگار همراه ستایش او.">وَسَبِّح</button>
    <button class="word-link" type="button" data-word="بِحَمدِ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد" data-context="با ستایش؛ حمدی که همراه تسبیح پروردگار است.">بِحَمدِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ آن‌که مخاطب آیه به ستایش و تسبیح او فرمان می‌یابد.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید «قَبْل» نیز پیش از چیزی، در زمان یا ترتیب، را بیان می‌کند." data-context="پیش از؛ تعیین زمان تسبیح پیش از طلوع خورشید.">قَبلَ</button>
    <button class="word-link" type="button" data-word="طُلوعِ" data-root="ط ل ع" data-root-meaning="ط ل ع در هسته شناخته‌شده خود به برآمدن و آشکار شدن مربوط است. در کاربردهای طبیعی، پدیدار شدن خورشید و سر برآوردن محصول گیاه را بیان می‌کند؛ در کاربردهای مربوط به انسان، می‌تواند به مشاهده یا آگاه شدن از چیزی اشاره کند که پیش‌تر در دسترس او نبوده است؛ و در بعضی ساخت‌ها، معنای رسیدن به جایگاهی را می‌رساند." data-learn-more="/quran-terminology/fa/roots/tt-l-ayn/" data-context="طلوع و برآمدن؛ پدیدار شدن خورشید.">طُلوعِ</button>
    <button class="word-link" type="button" data-word="الشَّمسِ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="خورشید؛ طلوع و غروب آن از نشانه‌های زمانی در آیه‌اند.">الشَّمسِ</button>
    <button class="word-link" type="button" data-word="وَقَبلَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید «قَبْل» نیز پیش از چیزی، در زمان یا ترتیب، را بیان می‌کند." data-context="و پیش از؛ زمان دیگر تسبیح پیش از غروب خورشید.">وَقَبلَ</button>
    <button class="word-link" type="button" data-word="غُروبِها" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/" data-root-meaning="از غروب خورشید و دور شدن از دید تا مغرب، غربت و شاخه‌های دیگر" data-context="غروب آن؛ فرو رفتن خورشید از دید.">غُروبِها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="ءانائِ" data-root="أ ن ي" data-learn-more="/quran-terminology/fa/roots/a-n-y/" data-root-meaning="فرا رسیدن هنگام، بخش‌های زمان، درنگ و تأخیر، و رسیدن چیزی به مرحله آمادگی یا نهایت." data-context="بخش‌های شب؛ در «من آناء الليل»، بخشی از زمان‌های شب برای تسبیح.">ءانائِ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ زمان دیگری برای تسبیح در کنار اوقات روز.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="فَسَبِّح" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="پس تسبیح گوی؛ تکرار فرمان درباره بخش‌هایی از شب.">فَسَبِّح</button>
    <button class="word-link" type="button" data-word="وَأَطرافَ" data-root="ط ر ف" data-learn-more="/quran-terminology/fa/roots/tt-r-f/" data-root-meaning="کناره، سویه، بخش، نگاه، و حرکت نگاه در کاربرد قرآنی" data-context="کناره‌ها و بخش‌های مرزی؛ در ترکیب «اطراف روز».">وَأَطرافَ</button>
    <button class="word-link" type="button" data-word="النَّهارِ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز؛ بخش روشن زمان در ترکیب «کناره‌های روز».">النَّهارِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكَ</button>
    <button class="word-link" type="button" data-word="تَرضىٰ" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل" data-context="خشنود شوی؛ در بیان امید یا غایت با «لعلّ».">تَرضىٰ</button>
  </p>
  <p class="farsi-verse">پس بر آنچه می‌گویند شکیبا باش و پیش از طلوع خورشید و پیش از غروبش با ستایش پروردگارت تسبیح گوی؛ و در ساعت‌هایی از شب و کناره‌های روز تسبیح گوی، باشد که خشنود شوی.</p>
</section>
