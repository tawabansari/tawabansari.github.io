<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۸۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَخرَجَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="پس بیرون آورد؛ آشکار ساختن پیکر گوساله برای مردم.">فَأَخرَجَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عِجلًا" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله" data-context="گوساله‌ای؛ صورتِ پیکری که برای آنان بیرون آورده شد.">عِجلًا</button>
    <button class="word-link" type="button" data-word="جَسَدًا" data-root="ج س د" data-root-meaning="پیکر و صورت جسمانی؛ خود واژه زنده یا مرده بودن و داشتن آگاهی را تعیین نمی‌کند." data-context="پیکری؛ وصفِ گوساله‌ای که سامری برای آنان بیرون آورد و بانگی داشت." data-learn-more="/quran-terminology/fa/roots/j-s-d/">جَسَدًا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="خُوارٌ" data-root="خ و ر" data-root-meaning="در یک شاخه، بانگ جانور، به‌ویژه صدای گاو و گوساله؛ و در شاخه‌ای دیگر، سستی، ضعف و کاهش استواری." data-context="بانگ گاو؛ صدایی که از پیکر گوساله شنیده می‌شد." data-learn-more="/quran-terminology/fa/roots/kh-w-r/">خُوارٌ</button>
    <button class="word-link" type="button" data-word="فَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس گفتند؛ آغازِ ادعای آنان دربارهٔ معبود بودن گوساله.">فَقالوا</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلٰهُكُم" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبود شما؛ عنوانی که گویندگان به گوساله نسبت می‌دهند.">إِلٰهُكُم</button>
    <button class="word-link" type="button" data-word="وَإِلٰهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="و معبود؛ ادامهٔ همان ادعا دربارهٔ معبودِ موسی.">وَإِلٰهُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="فَنَسِىَ" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="پس فراموش کرد؛ فعلِ پایان آیه که مرجع ضمیر و متعلق فراموشی آن در تفسیر بررسی می‌شود.">فَنَسِىَ</button>
  </p>
  <p class="farsi-verse">پس برایشان گوساله‌ای بیرون آورد، پیکری که بانگی داشت؛ پس گفتند: این معبود شما و معبود موسی است، اما او فراموش کرد.</p>
</section>
