  <h2 class="ayah-title">طه ۲۰:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>

    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَبصُروا" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">يَبصُروا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="فَقَبَضتُ" data-root="ق ب ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-b-dad/" data-root-meaning="گرفتن و جمع کردن؛ قبضه: مشت یا مقدار گرفته‌شده.">فَقَبَضتُ</button>
    <button class="word-link" type="button" data-word="قَبضَةً" data-root="ق ب ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-b-dad/" data-root-meaning="گرفتن و جمع کردن؛ قبضه: مشت یا مقدار گرفته‌شده.">قَبضَةً</button>

    <button class="word-link" type="button" data-word="أَثَرِ" data-root="أ ث ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-th-r/" data-root-meaning="اثر و نشانهٔ باقی‌مانده؛ دنبال کردن اثر؛ و در ایثار، مقدم داشتن دیگری یا چیزی.">أَثَرِ</button>
    <button class="word-link" type="button" data-word="الرَّسولِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">الرَّسولِ</button>
    <button class="word-link" type="button" data-word="فَنَبَذتُها" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین">فَنَبَذتُها</button>
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="سَوَّلَت" data-root="س و ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-l/" data-root-meaning="خواسته نفس؛ تسویل: آراستن و خواستنی جلوه دادن.">سَوَّلَت</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="نَفسى" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">نَفسى</button>
  </p>
  <p class="farsi-verse">گفت: چیزی دیدم که آنان ندیدند؛ پس مشتی از اثر فرستاده برگرفتم و آن را افکندم؛ و نفسم این‌گونه برایم آراست.</p>
</section>
