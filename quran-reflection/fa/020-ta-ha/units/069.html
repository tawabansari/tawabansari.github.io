<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَلقِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="و بیفکن و رها کن.">وَأَلقِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="يَمينِكَ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="دست راست تو؛ جایگاه آنچه فرمان به افکندنش داده می‌شود.">يَمينِكَ</button>
    <button class="word-link" type="button" data-word="تَلقَف" data-root="ل ق ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-q-f/" data-root-meaning="سریع گرفتن یا بلعیدن." data-context="آنچه ساخته‌اند می‌بلعد و فرو می‌گیرد.">تَلقَف</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="صَنَعوا" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر." data-context="آنچه آنان ساخته و پرداخته‌اند.">صَنَعوا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="صَنَعوا" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر." data-context="آنچه ساخته و به‌کار بسته‌اند.">صَنَعوا</button>
    <button class="word-link" type="button" data-word="كَيدُ" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است." data-context="تدبیر و نیرنگِ ساحر.">كَيدُ</button>
    <button class="word-link" type="button" data-word="سٰحِرٍ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر" data-context="شخص جادوگر؛ در ترکیبِ نیرنگ ساحر.">سٰحِرٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری" data-context="به کامیابی و رستگاری نمی‌رسد.">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="السّاحِرُ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر" data-context="جادوگرِ مورد بحث.">السّاحِرُ</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="هر جا که بیاید و برود؛ تعمیم مکانیِ حکم جمله درباره ساحر." data-learn-more="/quran-terminology/fa/roots/h-y-th/" data-root-note="معنای کوتاه واژه: مکان یا موقعیتی که جملهٔ همراه آن مشخص می‌کند؛ با «مِنْ»، مبدأ یا منشأ، و در کاربرد تعمیمی، هرجا که. «حيث» ظرفی عمدتاً جامد است.">حَيثُ</button>
    <button class="word-link" type="button" data-word="أَتىٰ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="هر جا که بیاید و برود.">أَتىٰ</button>
  </p>
  <p class="farsi-verse">و آنچه در دست راستت است بیفکن تا آنچه ساخته‌اند فرو بلعد؛ آنچه ساخته‌اند تنها نیرنگ جادوگر است؛ و جادوگر هر جا بیاید کامیاب نمی‌شود.</p>
</section>
