<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۰۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="نمی‌بینی؛ نبود کژی و ناهمواریِ قابل مشاهده در زمین توصیف‌شده.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="عِوَجًا" data-root="ع و ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-j/" data-root-meaning="کجی و انحراف از راستی یا استواری." data-context="کژی و انحراف از همواری؛ در کنار «أمت» و در وصف زمین پس از برچیده شدن کوه‌ها.">عِوَجًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="أَمتًا" data-root="أ م ت" data-learn-more="/quran-terminology/fa/roots/a-m-t/" data-root-meaning="ناهمواری یا اختلاف در سطح چیزی، به‌ویژه زمین؛ مانند برآمدگی، فرورفتگی یا نابرابری موضعی که سطح را از همواری بیرون می‌آورد." data-context="پستی‌وبلندی و اختلاف سطح زمین؛ وجود آن در این صحنه با نفی بیان شده است.">أَمتًا</button>
  </p>
  <p class="farsi-verse">که هیچ کژی و بلندی در آن نمی‌بینی.</p>
</section>
