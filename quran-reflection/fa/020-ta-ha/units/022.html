<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاضمُم" data-root="ض م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-m-m/" data-root-meaning="پیوستن و نزدیک هم آوردن.">وَاضمُم</button>
    <button class="word-link" type="button" data-word="يَدَكَ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">يَدَكَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جَناحِكَ" data-root="ج ن ح" data-root-meaning="بال، پهلو، متمایل شدن و گناه؛ از حرکت پرنده و فروتنی انسان تا «لا جناح» در احکام قرآن و گرایش به صلح" data-learn-more="/quran-terminology/fa/roots/j-n-h/">جَناحِكَ</button>
    <button class="word-link" type="button" data-word="تَخرُج" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">تَخرُج</button>
    <button class="word-link" type="button" data-word="بَيضاءَ" data-root="ب ي ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-y-dad/" data-root-meaning="سفیدی و سفید شدن؛ بَیض در شاخه‌ای دیگر به تخم اشاره دارد.">بَيضاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="غَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">غَيرِ</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سوءٍ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايَةً</button>
    <button class="word-link" type="button" data-word="أُخرىٰ" data-root="أ خ ر" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-learn-more="/quran-terminology/fa/roots/a-kh-r/">أُخرىٰ</button>
  </p>
  <p class="farsi-verse">و دستت را به پهلویت ببر؛ سفید، بی‌هیچ آسیبی، بیرون می‌آید؛ نشانه‌ای دیگر،</p>
</section>
