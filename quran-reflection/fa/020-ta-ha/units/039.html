<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنِ</button>

    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="التّابوتِ" data-context="تابوت: صندوق." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">التّابوتِ</button>
    <button class="word-link" type="button" data-word="فَاقذِفيهِ" data-root="ق ذ ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-dh-f/" data-root-meaning="افکندن و پرتاب کردن با نیرو." data-context="پس آن را بیفکن">فَاقذِفيهِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="ي م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-m/" data-root-meaning="قصد و رو آوردن؛ تیمّم: به قصد چیزی رفتن؛ یمّ: دریا یا آب پهناور، در شاخه‌ای دیگر." data-context="رود؛ یَمّ در این داستان">اليَمِّ</button>
    <button class="word-link" type="button" data-word="فَليُلقِهِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="پس او را بیفکند">فَليُلقِهِ</button>
    <button class="word-link" type="button" data-word="اليَمُّ" data-root="ي م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-m/" data-root-meaning="قصد و رو آوردن؛ تیمّم: به قصد چیزی رفتن؛ یمّ: دریا یا آب پهناور، در شاخه‌ای دیگر." data-context="رود">اليَمُّ</button>
    <button class="word-link" type="button" data-word="بِالسّاحِلِ" data-root="س ح ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-h-l/" data-root-meaning="ساییدن و تراشیدن؛ ساحل: کناره دریا یا رود." data-context="به ساحل">بِالسّاحِلِ</button>
    <button class="word-link" type="button" data-word="يَأخُذهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="او را بگیرد">يَأخُذهُ</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن من">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="وَعَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="و دشمن او">وَعَدُوٌّ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَلقَيتُ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="و افکندم">وَأَلقَيتُ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="مَحَبَّةً" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="محبتی از جانب من">مَحَبَّةً</button>
    <button class="word-link" type="button" data-word="مِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّى</button>
    <button class="word-link" type="button" data-word="وَلِتُصنَعَ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر." data-context="و تا پرورده شوی">وَلِتُصنَعَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="عَينى" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="چشم من؛ تصویر مراقبت">عَينى</button>
  </p>
  <p class="farsi-verse">او را در صندوق بگذار و آن را در رود بیفکن؛ پس رود باید او را به ساحل بیفکند تا دشمن من و دشمن او وی را بگیرد؛ و محبتی از خود بر تو افکندم، تا زیر چشم من پرورده شوی.</p>
</section>
