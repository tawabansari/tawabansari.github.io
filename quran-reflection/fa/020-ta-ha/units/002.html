<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَنزَلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نازل کردیم؛ نزول قرآن بر مخاطب.">أَنزَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنِ نازل‌شده که رنج‌رسانی غایتِ آن نیست." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="لِتَشقىٰ" data-root="ش ق ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-q-w/" data-root-meaning="رنج و بدبختی و محرومیت از نیک‌فرجامی." data-context="به رنج افتی؛ غایتی که برای نزول قرآن نفی می‌شود.">لِتَشقىٰ</button>
  </p>
  <p class="farsi-verse">قرآن را بر تو نازل نکردیم تا به رنج افتی،</p>
</section>
