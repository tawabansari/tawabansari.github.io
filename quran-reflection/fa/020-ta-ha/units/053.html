<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="زمین را برای شما چنین قرار داد.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ جایگاه زندگی و حرکت.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="مَهدًا" data-root="م ه د" data-root-meaning="آماده و مناسب ساختن جایگاه یا شرایط برای قرار گرفتن، زندگی کردن یا انجام کاری؛ مهد و مهاد: گهواره، بستر یا جایگاه آماده." data-context="بستر و جایگاهی که زمین برای زندگی و نیازهای انسان فراهم می‌کند." data-learn-more="/quran-terminology/fa/roots/m-h2-d/">مَهدًا</button>
    <button class="word-link" type="button" data-word="وَسَلَكَ" data-root="س ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-k/" data-root-meaning="در راهی رفتن یا چیزی را در مسیر و جایگاهی درآوردن." data-context="در زمین راه‌هایی برایتان گشود.">وَسَلَكَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="سُبُلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه‌ها و مسیرهای عبور.">سُبُلًا</button>
    <button class="word-link" type="button" data-word="وَأَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="و فروفرستاد.">وَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="از آسمان؛ مبدأ فرود آمدن آب.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="آبِ فروفرستاده از آسمان.">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَخرَجنا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="پس به وسیلهٔ آن بیرون آوردیم.">فَأَخرَجنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="گونه‌ها و دسته‌های گوناگون گیاهان.">أَزوٰجًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَباتٍ" data-root="ن ب ت" data-learn-more="/quran-terminology/fa/roots/n-b-t/" data-root-meaning="روییدن، رویاندن و آشکار شدن حیات از بستر مناسب" data-context="از روییدنی‌ها و گیاهان.">نَباتٍ</button>
    <button class="word-link" type="button" data-word="شَتّىٰ" data-root="ش ت ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-t-t/" data-root-meaning="پراکندگی و گوناگونی." data-context="گوناگون و متفاوت.">شَتّىٰ</button>
  </p>
  <p class="farsi-verse">همان که زمین را برایتان بستری قرار داد و در آن راه‌هایی برایتان گشود و از آسمان آبی نازل کرد؛ پس با آن گونه‌هایی از گیاهان گوناگون بیرون آوردیم.</p>
</section>
