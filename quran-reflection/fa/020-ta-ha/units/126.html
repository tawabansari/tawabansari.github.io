  <h2 class="ayah-title">طه ۲۰:۱۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالَ</button>
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَتَتكَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">أَتَتكَ</button>
    <button class="word-link" type="button" data-word="ءايٰتُنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">ءايٰتُنا</button>
    <button class="word-link" type="button" data-word="فَنَسيتَها" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/">فَنَسيتَها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">اليَومَ</button>

  </p>
  <p class="farsi-verse">می‌گوید: چنین است؛ نشانه‌های ما به تو رسید و آنها را فراموش کردی؛ و امروز نیز این‌گونه فراموش می‌شوی.</p>
