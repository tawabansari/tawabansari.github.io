<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَنزيلًا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">تَنزيلًا</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّن</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقَ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضَ</button>
    <button class="word-link" type="button" data-word="وَالسَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">وَالسَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="العُلَى" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">العُلَى</button>
  </p>
  <p class="farsi-verse">نازل‌شده از سوی کسی که زمین و آسمان‌های بلند را آفرید.</p>
</section>
