<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ در اینجا آغاز سخن فرعون.">قالَ</button>
    <button class="word-link" type="button" data-word="ءامَنتُم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردید؛ در خطابِ اعتراضی فرعون.">ءامَنتُم</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از؛ در ترکیبِ پیش از اجازه دادن.">قَبلَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="ءاذَنَ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="اجازه دهم؛ فعلِ گوینده در سخن فرعون.">ءاذَنَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَكَبيرُكُمُ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="بی‌گمان بزرگ و سرکردهٔ شماست؛ ادعای فرعون دربارهٔ موسی.">لَكَبيرُكُمُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="عَلَّمَكُمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="به شما آموخته است؛ در ادعای فرعون.">عَلَّمَكُمُ</button>
    <button class="word-link" type="button" data-word="السِّحرَ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر" data-context="سحر و جادو؛ در ادعای فرعون.">السِّحرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَأُقَطِّعَنَّ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="پس حتما قطع خواهم کرد؛ تهدید مؤکدِ فرعون.">فَلَأُقَطِّعَنَّ</button>
    <button class="word-link" type="button" data-word="أَيدِيَكُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌های شما.">أَيدِيَكُم</button>
    <button class="word-link" type="button" data-word="وَأَرجُلَكُم" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="و پاهای شما.">وَأَرجُلَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="خِلٰفٍ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-context="جهت‌های مخالف؛ در ترکیبِ «من خلاف» دربارهٔ دست و پا." data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی؛ و در کاربرد «اختلاف» و «خلاف»، تفاوت، مخالفت و قرار گرفتن در جهت مخالف.">خِلٰفٍ</button>
    <button class="word-link" type="button" data-word="وَلَأُصَلِّبَنَّكُم" data-root="ص ل ب" data-root-meaning="سختی و استواری؛ صُلب: ستون پشت و در ترکیب نسب، پیوند نسلی؛ صَلب: به صلیب کشیدن انسان." data-context="و حتما شما را به صلیب خواهم کشید؛ تهدید فرعون که در ادامه تنه‌های نخل را نام می‌برد." data-learn-more="/quran-terminology/fa/roots/sad-l-b/">وَلَأُصَلِّبَنَّكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جُذوعِ" data-root="ج ذ ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-dh-ayn/" data-root-meaning="جذع و جذوع: تنه و تنه‌های درخت، به‌ویژه نخل." data-context="تنه‌هایِ؛ در ترکیبِ تنه‌های نخل.">جُذوعِ</button>
    <button class="word-link" type="button" data-word="النَّخلِ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان." data-context="درختان خرما.">النَّخلِ</button>
    <button class="word-link" type="button" data-word="وَلَتَعلَمُنَّ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و حتما خواهید دانست؛ ادامهٔ تهدیدِ فرعون.">وَلَتَعلَمُنَّ</button>
    <button class="word-link" type="button" data-word="أَيُّنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيُّنا</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="سخت‌تر و شدیدتر؛ در مقایسهٔ فرعون.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="از نظر عذاب؛ وجهِ مقایسه در سخن فرعون.">عَذابًا</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="ب ق ي" data-root-meaning="«ب ق ي» به ادامه داشتن و از میان نرفتن چیزی در برابر پایان یافتن، زوال یا از دست رفتن آن اشاره دارد. در ساختمان‌های سببی، به باقی گذاشتن و حفظ کردن می‌رسد؛ در صورت‌های وصفی، ماندگاری و بازماندن را بیان می‌کند؛ و در اسم «بقية»، به آنچه از یک مجموعه، رابطه یا مایه ارزشمند همچنان بر جا مانده است اشاره دارد." data-context="و پایدارتر؛ ادامهٔ مقایسه در سخن فرعون." data-learn-more="/quran-terminology/fa/roots/b-q-y/">وَأَبقىٰ</button>
  </p>
  <p class="farsi-verse">گفت: پیش از آنکه به شما اجازه دهم به او ایمان آوردید؟ او بزرگ شماست که جادو را به شما آموخته است؛ پس بی‌گمان دست‌ها و پاهایتان را از خلاف یکدیگر قطع می‌کنم و شما را بر تنه‌های نخل به دار می‌آویزم؛ و خواهید دانست کدام‌یک از ما عذابی سخت‌تر و پایدارتر دارد.</p>
</section>
