<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۰۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خٰلِدينَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه" data-context="ماندگارند؛ دوامِ وضعیت مرتبط با وزرِ یادشده.">خٰلِدينَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="و چه بد است؛ نکوهشِ بار یادشده.">وَساءَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمانِ ارزیابیِ بار در قیامت.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="رستاخیز؛ در ترکیب روز قیامت.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="حِملًا" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="باری؛ وصف وزرِ یادشده در روز قیامت." data-learn-more="/quran-terminology/fa/roots/h-m-l/">حِملًا</button>
  </p>
  <p class="farsi-verse">جاودانه در آن؛ و روز قیامت چه بد باری برای آنان است.</p>
</section>
