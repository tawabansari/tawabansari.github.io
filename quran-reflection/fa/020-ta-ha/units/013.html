<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَا</button>
    <button class="word-link" type="button" data-word="اختَرتُكَ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">اختَرتُكَ</button>
    <button class="word-link" type="button" data-word="فَاستَمِع" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">فَاستَمِع</button>
    <button class="word-link" type="button" data-word="لِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِما</button>
    <button class="word-link" type="button" data-word="يوحىٰ" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق.">يوحىٰ</button>
  </p>
  <p class="farsi-verse">و من تو را برگزیده‌ام؛ پس به آنچه وحی می‌شود گوش بسپار.</p>
</section>
