  <p class="farsi-verse">و اگر آنان را پیش از آن با عذابی نابود کرده بودیم، می‌گفتند: پروردگارا، چرا فرستاده‌ای به سوی ما نفرستادی تا پیش از آنکه خوار و رسوا شویم از نشانه‌هایت پیروی کنیم؟</p>
