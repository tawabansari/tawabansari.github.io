<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَعجَلَكَ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">أَعجَلَكَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="قَومِكَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومِكَ</button>
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰموسىٰ</button>
  </p>
  <p class="farsi-verse">و ای موسی، چه چیز تو را از قومت به شتاب آورد؟</p>
</section>
