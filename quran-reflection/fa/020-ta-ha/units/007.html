<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَجهَر" data-root="ج ه ر" data-learn-more="/quran-terminology/fa/roots/j-h2-r/" data-root-meaning="آشکار و علنی بودن یا ساختن؛ و در گفتار، بلند کردن صدا به‌گونه‌ای که از حالت آهسته و پنهان بیرون آید.">تَجهَر</button>
    <button class="word-link" type="button" data-word="بِالقَولِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">بِالقَولِ</button>
    <button class="word-link" type="button" data-word="فَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="السِّرَّ" data-root="س ر ر" data-learn-more="/quran-terminology/fa/roots/s-r-r/" data-root-meaning="راز و نهان، شادی و آسایش، و جایگاه استقرار">السِّرَّ</button>
    <button class="word-link" type="button" data-word="وَأَخفَى" data-root="خ ف ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-f-y/" data-root-meaning="پنهان بودن و پنهان کردن؛ برخی صورت‌ها و قرائت‌ها معنای آشکار کردن دارند.">وَأَخفَى</button>
  </p>
  <p class="farsi-verse">و اگر سخن را آشکار کنی، او راز و پنهان‌تر را می‌داند.</p>
</section>
