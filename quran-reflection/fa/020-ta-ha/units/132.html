    <button class="word-link" type="button" data-word="أَهلَكَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/">أَهلَكَ</button>
    <button class="word-link" type="button" data-word="بِالصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/">بِالصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="وَاصطَبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/">وَاصطَبِر</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="نَسـَٔلُكَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/">نَسـَٔلُكَ</button>

    ۖ
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>

    <button class="word-link" type="button" data-word="وَالعٰقِبَةُ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/">وَالعٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="لِلتَّقوىٰ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">لِلتَّقوىٰ</button>
  </p>
  <p class="farsi-verse">و خانواده‌ات را به صلات فرمان ده و بر آن شکیبا باش؛ از تو روزی نمی‌خواهیم؛ ما تو را روزی می‌دهیم؛ و فرجام از آنِ پرهیزگاری است.</p>
