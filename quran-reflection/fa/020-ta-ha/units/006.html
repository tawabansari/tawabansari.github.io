<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ در بیان مالکیت او بر آنچه در آنهاست.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ قلمروی آنچه در آن قرار دارد، در کنار آسمان‌ها.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن دو؛ میان آسمان‌ها و زمین.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تَحتَ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="زیر؛ نسبت مکانیِ آنچه پایین‌تر از خاک قرار دارد.">تَحتَ</button>
    <button class="word-link" type="button" data-word="الثَّرىٰ" data-root="ث ر ي" data-root-meaning="خاک نمناک؛ در خانوادهٔ گسترده‌تر واژگانی، رطوبت و فراوانی." data-context="خاک زمین، به‌عنوان مرجع آنچه در زیر آن قرار دارد؛ «ثرى» در معنای لغوی، خاک نمناک است." data-learn-more="/quran-terminology/fa/roots/th-r-y/">الثَّرىٰ</button>
  </p>
  <p class="farsi-verse">آنچه در آسمان‌ها و آنچه در زمین و آنچه میان آنها و آنچه زیر خاک است از آن اوست.</p>
