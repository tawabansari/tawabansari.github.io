<section class="ayah-block" id="ayah-129" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَولا</button>
    <button class="word-link" type="button" data-word="كَلِمَةٌ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد">كَلِمَةٌ</button>
    <button class="word-link" type="button" data-word="سَبَقَت" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/" data-root-meaning="پیش افتادن، پیشی گرفتن و سبقت جستن؛ از مسابقه و تقدم زمانی تا پیشگامی در کارهای نیک و پیشی‌ناپذیری در برابر اراده آن معبود یگانه">سَبَقَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="لَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">لَكانَ</button>
    <button class="word-link" type="button" data-word="لِزامًا" data-root="ل ز م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-z-m/" data-root-meaning="ملازمت و جدا نشدن؛ الزام: بر عهده نهادن.">لِزامًا</button>
    <button class="word-link" type="button" data-word="وَأَجَلٌ" data-root="أ ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت تعیین‌شده و پایان آن؛ أجل می‌تواند موعد انجام کار یا پایان زندگی باشد.">وَأَجَلٌ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">مُسَمًّى</button>
  </p>
  <p class="farsi-verse">و اگر سخنی از پروردگارت پیش نیامده بود و سرآمدی تعیین‌شده نبود، بی‌گمان لازم می‌آمد.</p>
</section>
