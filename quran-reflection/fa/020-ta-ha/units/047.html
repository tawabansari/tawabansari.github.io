  <p class="farsi-verse">پس نزد او بروید و بگویید: ما دو فرستاده پروردگار تو هستیم؛ پس فرزندان اسرائیل را با ما بفرست و آنان را عذاب مکن؛ ما نشانه‌ای از پروردگارت برایت آورده‌ایم؛ و سلام بر کسی که از هدایت پیروی کند.</p>
