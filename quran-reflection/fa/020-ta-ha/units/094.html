<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ پاسخ هارون به موسی.">قالَ</button>
    <button class="word-link" type="button" data-word="يَبنَؤُمَّ" data-context="ترکیب ندایی: ای پسر مادرم؛ ابن از ب ن ي و أم از أ م م." data-root="ب ن ي / أ م م" data-root-meaning="ابن: ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار؛ أمّ: از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-note="این ترکیب دو اسم دارد: «ابن» از ب ن ي و «أمّ» از أ م م.">يَبنَؤُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَأخُذ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="در «لا تأخذ»: مگیر؛ نهی از گرفتن ریش.">تَأخُذ</button>
    <button class="word-link" type="button" data-word="بِلِحيَتى" data-root="ل ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h-y/" data-root-meaning="ریش و موی چانه و آرواره." data-context="ریشم؛ آنچه هارون از گرفتنش نهی می‌کند.">بِلِحيَتى</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="بِرَأسى" data-root="ر أ س" data-root-meaning="سر؛ و در گسترش معنا، بخش بالایی، آغازین یا اصلی چیزی؛ رأس المال: اصل دارایی." data-context="سرم؛ عضوِ دیگری که در نهی ذکر می‌شود." data-learn-more="/quran-terminology/fa/roots/r-a-s/">بِرَأسى</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="خَشيتُ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/" data-root-meaning="بیم و ملاحظهٔ آگاهانه در برابر خطری شناخته‌شده یا پیامدی جدی، و خشیت اثرگذار در برابر آن معبود یگانه" data-context="ترسیدم؛ بیم هارون از سرزنش احتمالی موسی.">خَشيتُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَقولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگویی؛ سخنِ احتمالیِ موسی که هارون از آن بیم دارد.">تَقولَ</button>
    <button class="word-link" type="button" data-word="فَرَّقتَ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر" data-context="جدایی افکندی؛ اتهامِ احتمالی دربارهٔ بنی‌اسرائیل.">فَرَّقتَ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان؛ رابطهٔ گروه‌هایی که از هم جدا می‌شوند.">بَينَ</button>
    <button class="word-link" type="button" data-word="بَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-context="فرزندان؛ در نامِ «بنی‌اسرائیل»." data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار؛ و در کاربرد نسبی، پسر، فرزندان و نسل.">بَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="تَرقُب" data-root="ر ق ب" data-root-meaning="زیر نظر داشتن، مراقبت، انتظار و رعایت؛ رقبة: گردن و به کنایه، تمام شخص یا انسان در بند." data-context="در «لم ترقب قولي»: سخنم را رعایت نکردی؛ در نظر نداشتن دستور پیشین موسی، در سخن هارون دربارهٔ سرزنش احتمالی." data-learn-more="/quran-terminology/fa/roots/r-q-b/">تَرقُب</button>
    <button class="word-link" type="button" data-word="قَولى" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخنم؛ گفته و دستورِ موسی در عبارتِ سرزنش احتمالی.">قَولى</button>
  </p>
  <p class="farsi-verse">گفت: ای پسر مادرم، ریشم و سرم را مگیر؛ ترسیدم بگویی: میان فرزندان اسرائیل جدایی افکندی و سخنم را رعایت نکردی.</p>
</section>
