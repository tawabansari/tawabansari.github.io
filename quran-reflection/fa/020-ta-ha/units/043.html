  <h2 class="ayah-title">طه ۲۰:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اذهَبا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">اذهَبا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="طَغىٰ" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/">طَغىٰ</button>

  <p class="farsi-verse">به سوی فرعون بروید؛ او سرکشی کرده است.</p>
