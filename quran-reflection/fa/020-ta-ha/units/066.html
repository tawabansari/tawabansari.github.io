<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="أَلقوا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">أَلقوا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="حِبالُهُم" data-root="ح ب ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِبالُهُم</button>
    <button class="word-link" type="button" data-word="وَعِصِيُّهُم" data-root="ع ص و" data-learn-more="/quran-terminology/fa/roots/ayn-sad-w/" data-root-meaning="عصا، تکیه‌گاه، ابزار مهار، و وسیله‌ای برای جمع کردن توان و نظم دادن به حرکت.">وَعِصِيُّهُم</button>
    <button class="word-link" type="button" data-word="يُخَيَّلُ" data-root="خ ي ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُخَيَّلُ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سِحرِهِم" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر">سِحرِهِم</button>
    <button class="word-link" type="button" data-word="أَنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّها</button>
    <button class="word-link" type="button" data-word="تَسعىٰ" data-root="س ع ي" data-learn-more="/quran-terminology/fa/roots/s-ayn-y/" data-root-meaning="از حرکت در یک مسیر تا کوشش برای رسیدن به نتیجه">تَسعىٰ</button>
  </p>
  <p class="farsi-verse">گفت: بلکه شما بیفکنید؛ پس ناگهان ریسمان‌ها و عصاهایشان از جادویشان در نظر او چنان نمود که می‌شتابند.</p>
</section>
