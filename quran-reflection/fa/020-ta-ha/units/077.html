<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَوحَينا" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق.">أَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="أَسرِ" data-root="س ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-y/" data-root-meaning="شبانه رفتن؛ سَریّ در سیاق مریم با جوی آب یا شخص گرامی توضیح داده شده است.">أَسرِ</button>
    <button class="word-link" type="button" data-word="بِعِبادى" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">بِعِبادى</button>
    <button class="word-link" type="button" data-word="فَاضرِب" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">فَاضرِب</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="طَريقًا" data-root="ط ر ق" data-learn-more="/quran-terminology/fa/roots/tt-r-q/" data-root-meaning="کوبیدن، راه، طریقه، طرائق و طارق شبانه">طَريقًا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان">البَحرِ</button>
    <button class="word-link" type="button" data-word="يَبَسًا" data-root="ي ب س" data-learn-more="/quran-terminology/fa/roots/y-b-s/" data-root-meaning="خشک‌شدن یا خشک‌بودن؛ قرارگرفتن در حالتی مقابل رطوبت و تری.">يَبَسًا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَخٰفُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">تَخٰفُ</button>
    <button class="word-link" type="button" data-word="دَرَكًا" data-root="د ر ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-r-k/" data-root-meaning="رسیدن و دریافتن؛ درک: ژرفا یا مرتبه پایین؛ تدارک: به هم رسیدن یا جبران کردن.">دَرَكًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَخشىٰ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/" data-root-meaning="بیم و ملاحظهٔ آگاهانه در برابر خطری شناخته‌شده یا پیامدی جدی، و خشیت اثرگذار در برابر آن معبود یگانه">تَخشىٰ</button>
  </p>
  <p class="farsi-verse">و به موسی وحی کردیم: بندگان مرا شبانه ببر و برایشان راهی خشک در دریا بگشا؛ نه از گرفتار شدن می‌ترسی و نه بیم داری.</p>
</section>
