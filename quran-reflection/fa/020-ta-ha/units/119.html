<section class="ayah-block" id="ayah-119" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّكَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَظمَؤُا۟" data-root="ظ م أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/zha-m-a/" data-root-meaning="تشنگی.">تَظمَؤُا۟</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَضحىٰ" data-root="ض ح و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-h-w/" data-root-meaning="روشنایی و گرمای روز پس از برآمدن خورشید؛ در معرض آفتاب بودن.">تَضحىٰ</button>
  </p>
  <p class="farsi-verse">و نه در آن تشنه شوی و نه آفتاب‌زده.</p>
