<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصطَنَعتُكَ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر.">وَاصطَنَعتُكَ</button>
    <button class="word-link" type="button" data-word="لِنَفسِى" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">لِنَفسِى</button>
  </p>
  <p class="farsi-verse">و تو را برای خود پروردم.</p>
