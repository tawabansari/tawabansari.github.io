<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۹۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَتَّبِعَنِ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">تَتَّبِعَنِ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَعَصَيتَ" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت.">أَفَعَصَيتَ</button>
    <button class="word-link" type="button" data-word="أَمرى" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرى</button>
  </p>
  <p class="farsi-verse">از اینکه از من پیروی کنی؟ آیا از فرمانم نافرمانی کردی؟</p>
</section>
