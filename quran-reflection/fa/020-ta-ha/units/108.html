    <button class="word-link" type="button" data-word="يَتَّبِعونَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">يَتَّبِعونَ</button>

  <p class="farsi-verse">آن روز از نداکننده پیروی می‌کنند که هیچ کژی برای او نیست؛ و صداها در برابر فرارحمن فرو می‌نشینند، پس جز صدایی آهسته نمی‌شنوی.</p>
