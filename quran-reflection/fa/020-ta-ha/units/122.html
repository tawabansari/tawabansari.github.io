<section class="ayah-block" id="ayah-122" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="اجتَبٰهُ" data-root="ج ب ي" data-root-meaning="گردآوردن و فراهم آوردن چیزی؛ و در صورت اجتباء، برگزیدن و اختصاص دادن کسی یا چیزی." data-context="او را برگزید؛ انتخاب آدم پس از ماجرای پیشین، همراه با پذیرش توبه و هدایت در ادامهٔ آیه." data-learn-more="/quran-terminology/fa/roots/j-b-y/">اجتَبٰهُ</button>
    <button class="word-link" type="button" data-word="رَبُّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش؛ کسی که آدم را برگزید و به او بازگشت.">رَبُّهُ</button>
    <button class="word-link" type="button" data-word="فَتابَ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی" data-context="پس توبهٔ او را پذیرفت؛ بازگشتِ رحمت و پذیرش الهی به آدم.">فَتابَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَهَدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="و هدایت کرد؛ آدم را راه نمود.">وَهَدىٰ</button>
  </p>
  <p class="farsi-verse">سپس پروردگارش او را برگزید و به او بازگشت و هدایت کرد.</p>
</section>
