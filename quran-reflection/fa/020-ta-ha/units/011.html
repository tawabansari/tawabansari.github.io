<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَتىٰها" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به آن رسید؛ آمدن موسی به آتش.">أَتىٰها</button>
    <button class="word-link" type="button" data-word="نودِىَ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="ندا داده شد؛ خطاب به موسی هنگام رسیدن به آتش." data-learn-more="/quran-terminology/fa/roots/n-d-y/">نودِىَ</button>
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰموسىٰ</button>
  </p>
  <p class="farsi-verse">پس چون به آن رسید، ندا داده شد: ای موسی،</p>
</section>
