<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَأتِهِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="نزد او بیاید؛ حضور نزد پروردگار.">يَأتِهِ</button>
    <button class="word-link" type="button" data-word="مُؤمِنًا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمن؛ حال کسی که نزد او می‌آید.">مُؤمِنًا</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="عَمِلَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام داده باشد؛ کردار پیشین او.">عَمِلَ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="کارهای شایسته؛ آنچه انجام داده است.">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الدَّرَجٰتُ" data-root="د ر ج" data-learn-more="/quran-terminology/fa/roots/d-r-j/" data-root-meaning="حرکت و گذر مرحله‌به‌مرحله؛ پله و مرتبه؛ استدراج: پیش بردن تدریجی." data-context="درجات؛ مراتب بلند برای مؤمنانِ دارای کردار شایسته.">الدَّرَجٰتُ</button>
    <button class="word-link" type="button" data-word="العُلىٰ" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="بلند؛ وصف درجات.">العُلىٰ</button>
  </p>
  <p class="farsi-verse">و هر که با ایمان نزد او بیاید و کارهای شایسته کرده باشد، درجات بلند از آن آنان است؛</p>
</section>
