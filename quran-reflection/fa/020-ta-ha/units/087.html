<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۸۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ پاسخ قوم به موسی.">قالوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَخلَفنا" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="خلاف کردیم؛ در نفیِ نقض وعده به اختیار خودشان.">أَخلَفنا</button>
    <button class="word-link" type="button" data-word="مَوعِدَكَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعده‌ات؛ تعهدی که موسی از قوم خواسته بود.">مَوعِدَكَ</button>
    <button class="word-link" type="button" data-word="بِمَلكِنا" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="به اختیار خودمان؛ دربارهٔ توان و انتخاب در شکستن وعده.">بِمَلكِنا</button>
    <button class="word-link" type="button" data-word="وَلٰكِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِنّا</button>
    <button class="word-link" type="button" data-word="حُمِّلنا" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="بار بر عهده‌مان گذاشته شد؛ در گزارش قوم دربارهٔ زیورهای حمل‌شده." data-learn-more="/quran-terminology/fa/roots/h-m-l/">حُمِّلنا</button>
    <button class="word-link" type="button" data-word="أَوزارًا" data-root="و ز ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-z-r/" data-root-meaning="بار سنگین و مسئولیت گناه؛ وَزَر: پناه؛ وزیر: یاری‌دهنده." data-context="بارهایی؛ در اینجا بارهایی از زیورهای قوم.">أَوزارًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="زينَةِ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="زیورها؛ چیزی که بارهای یادشده از آن بودند.">زينَةِ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="آن قوم؛ صاحبان یا وابستگانِ زیورهای یادشده.">القَومِ</button>
    <button class="word-link" type="button" data-word="فَقَذَفنٰها" data-root="ق ذ ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-dh-f/" data-root-meaning="افکندن و پرتاب کردن با نیرو." data-context="پس آنها را افکندیم؛ گزارش قوم دربارهٔ زیورها.">فَقَذَفنٰها</button>
    <button class="word-link" type="button" data-word="فَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَلقَى" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="افکند؛ کاری که در ادامه به سامری نسبت داده می‌شود.">أَلقَى</button>
    <button class="word-link" type="button" data-word="السّامِرِىُّ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">السّامِرِىُّ</button>
  </p>
  <p class="farsi-verse">گفتند: به اختیار خود از وعده‌ات تخلف نکردیم؛ اما بارهایی از زیور قوم بر دوش ما گذاشته شد و آنها را افکندیم؛ پس سامری نیز چنین افکند.</p>
</section>
