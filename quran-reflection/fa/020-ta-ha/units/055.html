<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="خَلَقنٰكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنٰكُم</button>
    <button class="word-link" type="button" data-word="وَفيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفيها</button>
    <button class="word-link" type="button" data-word="نُعيدُكُم" data-root="ع و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نُعيدُكُم</button>
    <button class="word-link" type="button" data-word="وَمِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنها</button>
    <button class="word-link" type="button" data-word="نُخرِجُكُم" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">نُخرِجُكُم</button>
    <button class="word-link" type="button" data-word="تارَةً" data-root="ت و ر" data-learn-more="/quran-terminology/fa/roots/t-w-r/">تارَةً</button>
    <button class="word-link" type="button" data-word="أُخرىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُخرىٰ</button>
  </p>
  <p class="farsi-verse">شما را از آن آفریدیم و به آن بازمی‌گردانیم و بار دیگر از آن بیرون می‌آوریم.</p>
