<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَوجَسَ" data-root="و ج س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-j-s/" data-root-meaning="احساس یا صدای نهان؛ ایجاس: در درون احساس کردن.">فَأَوجَسَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">نَفسِهِ</button>
    <button class="word-link" type="button" data-word="خيفَةً" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">خيفَةً</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
  </p>
  <p class="farsi-verse">پس موسی در دل خود ترسی احساس کرد.</p>
</section>
