<section class="ayah-block" id="ayah-135" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="كُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلٌّ</button>
    <button class="word-link" type="button" data-word="مُتَرَبِّصٌ" data-root="ر ب ص" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُتَرَبِّصٌ</button>
    <button class="word-link" type="button" data-word="فَتَرَبَّصوا" data-root="ر ب ص" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَتَرَبَّصوا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَسَتَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">فَسَتَعلَمونَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="الصِّرٰطِ" data-root="ص ر ط" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد" data-learn-more="/quran-terminology/fa/roots/s-r-t/">الصِّرٰطِ</button>
    <button class="word-link" type="button" data-word="السَّوِىِّ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">السَّوِىِّ</button>
    <button class="word-link" type="button" data-word="وَمَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَنِ</button>
    <button class="word-link" type="button" data-word="اهتَدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">اهتَدىٰ</button>
  </p>
  <p class="farsi-verse">بگو: همه در انتظارند؛ پس منتظر باشید؛ خواهید دانست یاران راه راست چه کسانی‌اند و چه کسی راه یافته است.</p>
</section>
