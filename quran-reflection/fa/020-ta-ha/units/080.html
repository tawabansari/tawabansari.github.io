<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰبَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">يٰبَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="أَنجَينٰكُم" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">أَنجَينٰكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَدُوِّكُم" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">عَدُوِّكُم</button>
    <button class="word-link" type="button" data-word="وَوٰعَدنٰكُم" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَوٰعَدنٰكُم</button>
    <button class="word-link" type="button" data-word="جانِبَ" data-root="ج ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جانِبَ</button>
    <button class="word-link" type="button" data-word="الطّورِ" data-root="ط و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الطّورِ</button>
    <button class="word-link" type="button" data-word="الأَيمَنَ" data-root="ي م ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَيمَنَ</button>
    <button class="word-link" type="button" data-word="وَنَزَّلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">وَنَزَّلنا</button>
    <button class="word-link" type="button" data-word="عَلَيكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُمُ</button>
    <button class="word-link" type="button" data-word="المَنَّ" data-root="م ن ن" data-learn-more="/quran-terminology/fa/roots/m-n-n/" data-root-meaning="رساندن عطا یا احسانی برجسته؛ به رخ کشیدن آن عطا؛ آزاد کردن بدون عوض؛ و بریدن، کاستن یا پایان یافتن.">المَنَّ</button>
    <button class="word-link" type="button" data-word="وَالسَّلوىٰ" data-root="س ل و" data-learn-more="/quran-terminology/fa/roots/s-l-w/" data-root-meaning="در زبان عربی، فاصله گرفتن دل از اندوه یا تعلق؛ و در قرآن، السلوى نام روزی یا خوراکی‌ای است که همراه منّ برای بنی‌اسرائیل فراهم شد.">وَالسَّلوىٰ</button>
  </p>
  <p class="farsi-verse">ای فرزندان اسرائیل، شما را از دشمنتان نجات دادیم و در سمت راست طور با شما وعده نهادیم و منّ و سلوی را بر شما نازل کردیم.</p>
</section>
