<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَنَتِ" data-root="ع ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-w/" data-root-meaning="گردن نهادن و خوار و فرمان‌پذیر شدن؛ نیز رنج و اسارت." data-context="و فروتن شد؛ خضوع چهره‌ها در برابر آن زندهٔ پاینده.">وَعَنَتِ</button>
    <button class="word-link" type="button" data-word="الوُجوهُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌ها؛ در تصویر خضوع در برابر آن زندهٔ پاینده.">الوُجوهُ</button>
    <button class="word-link" type="button" data-word="لِلحَىِّ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="برای آن زنده؛ در وصف مخاطبِ خضوع.">لِلحَىِّ</button>
    <button class="word-link" type="button" data-word="القَيّومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="پاینده و برپادارنده؛ وصفِ آن زنده.">القَيّومِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="خابَ" data-root="خ ي ب" data-root-meaning="ناکام ماندن و محروم شدن از نتیجه یا بهرهٔ مورد انتظار؛ نرسیدن به مطلوبی که شخص در پی آن بوده یا به آن امید داشته است." data-context="ناکام شد؛ فرجامِ کسی که ستمی بر عهده دارد." data-learn-more="/quran-terminology/fa/roots/kh-y-b/">خابَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="حَمَلَ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="حمل کرده است؛ بر عهده داشتن ستم و پیامد آن." data-learn-more="/quran-terminology/fa/roots/h-m-l/">حَمَلَ</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم؛ چیزی که شخصِ ناکام بار آن را بر عهده دارد.">ظُلمًا</button>
  </p>
  <p class="farsi-verse">و چهره‌ها در برابر زنده پاینده فروتن می‌شوند؛ و هر که ستمی بر دوش کشیده باشد ناکام شده است.</p>
</section>
