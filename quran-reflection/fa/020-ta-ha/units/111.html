<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَنَتِ" data-root="ع ن و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَعَنَتِ</button>
    <button class="word-link" type="button" data-word="الوُجوهُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/">الوُجوهُ</button>
    <button class="word-link" type="button" data-word="لِلحَىِّ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/">لِلحَىِّ</button>
    <button class="word-link" type="button" data-word="القَيّومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">القَيّومِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="خابَ" data-root="خ ي ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خابَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="حَمَلَ" data-root="ح م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَمَلَ</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظُلمًا</button>
  </p>
  <p class="farsi-verse">و چهره‌ها در برابر زنده پاینده فروتن می‌شوند؛ و هر که ستمی بر دوش کشیده باشد ناکام شده است.</p>
