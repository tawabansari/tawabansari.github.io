<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَيَذَرُها" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="پس آن را بر جای می‌گذارد؛ زمین یا جایگاه کوه‌ها را در وضعیت هموارِ توصیف‌شده وا می‌گذارد.">فَيَذَرُها</button>
    <button class="word-link" type="button" data-word="قاعًا" data-root="ق و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-w-ayn/" data-root-meaning="زمین صاف و هموار." data-context="پهنه‌ای باز و هموار؛ وضعیتی که پس از برچیده شدن کوه‌ها باقی می‌ماند.">قاعًا</button>
    <button class="word-link" type="button" data-word="صَفصَفًا" data-root="ص ف ص ف" data-root-meaning="زمین صاف، هموار و یکدست؛ پهنه‌ای بدون ناهمواری محسوس. در بعضی کاربردهای لغوی، زمین بی‌گیاه نیز صفصف نامیده شده است." data-context="صاف و هموار؛ وصفِ زمین یا جایگاه کوه‌ها پس از برچیده شدن آنها، با سطحی یکدست و بدون ناهمواری." data-learn-more="/quran-terminology/fa/roots/sad-f-sad-f/">صَفصَفًا</button>
  </p>
  <p class="farsi-verse">پس آن را دشتی هموار رها می‌کند،</p>
</section>
