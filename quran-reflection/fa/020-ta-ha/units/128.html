<section class="ayah-block" id="ayah-128" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلَم</button>
    <button class="word-link" type="button" data-word="يَهدِ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="آیا روشن و راهنما نشد؟">يَهدِ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="كَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَم</button>
    <button class="word-link" type="button" data-word="أَهلَكنا" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="نسل‌های پیشین را نابود ساختیم؛ سکونتگاه‌هایشان مایهٔ عبرت است." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">أَهلَكنا</button>
    <button class="word-link" type="button" data-word="قَبلَهُم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از آنان.">قَبلَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القُرونِ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره." data-context="نسل‌های گذشته.">القُرونِ</button>
    <button class="word-link" type="button" data-word="يَمشونَ" data-root="م ش ي" data-learn-more="/quran-terminology/fa/roots/m-sh-y/" data-root-meaning="راه رفتن، گام برداشتن، حرکت کردن بر زمین؛ و در میدان گسترده‌تر، پیش رفتن در یک مسیر، روش، رفتار یا سبک زندگی" data-context="راه می‌روند.">يَمشونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مَسٰكِنِهِم" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="در سکونتگاه‌های آنان.">مَسٰكِنِهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="به‌راستی نشانه‌ها و عبرت‌ها.">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِأُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِأُولِى</button>
    <button class="word-link" type="button" data-word="النُّهىٰ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده." data-context="خردهای بازدارنده از خطا.">النُّهىٰ</button>
  </p>
  <p class="farsi-verse">آیا برای آنان روشن نشده که چه بسیار نسل‌هایی را پیش از آنان نابود کردیم که در خانه‌هایشان راه می‌روند؟ در این برای خردمندان نشانه‌هایی است.</p>
</section>
