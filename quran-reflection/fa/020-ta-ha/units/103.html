<section class="ayah-block" id="ayah-103" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۰۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَتَخٰفَتونَ" data-root="خ ف ت" data-root-meaning="آرام و کم‌آشکار شدن صدا، آهسته سخن گفتن و پنهانی گفتگو کردن؛ و در کاربردهای دیگر، ضعف و فروکش‌کردن." data-context="آهسته با هم سخن می‌گویند؛ گفت‌وگوی پنهان دربارهٔ مدت ماندن." data-learn-more="/quran-terminology/fa/roots/kh-f-t/">يَتَخٰفَتونَ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میانشان؛ فضای گفت‌وگوی آهسته.">بَينَهُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="لَبِثتُم" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="ماندید؛ مدتِ مورد بحثِ گویندگان.">لَبِثتُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="عَشرًا" data-root="ع ش ر" data-root-meaning="ده و صورت‌ها و نسبت‌های عددی آن؛ معاشرت، همراهی، خویشاوندی و جماعت؛ عشار: شتران مادهٔ نزدیک به زایمان." data-context="ده؛ شمارِ مدتِ ماندن در گفتارِ گویندگان." data-learn-more="/quran-terminology/fa/roots/ayn-sh-r/">عَشرًا</button>
  </p>
  <p class="farsi-verse">آهسته میان خود می‌گویند: جز ده نمانده‌اید.</p>
</section>
