<section class="ayah-block" id="ayah-097" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۹۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ سخن موسی خطاب به سامری.">قالَ</button>
    <button class="word-link" type="button" data-word="فَاذهَب" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="پس برو؛ فرمان رفتن به سامری.">فَاذهَب</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی؛ مدت زندگی دنیوی مخاطب.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَقولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگویی؛ سخنی که با «لا مساس» نقل می‌شود.">تَقولَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="مِساسَ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="تماس و برخورد؛ در «لا مساس»، نفی تماس.">مِساسَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="مَوعِدًا" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="موعدی مقرر؛ وعده‌ای که برای مخاطب قرار داده شده است.">مَوعِدًا</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="تُخلَفَهُ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="خلاف آن با تو عمل نخواهد شد؛ وعدهٔ مقرر حتماً تحقق می‌یابد.">تُخلَفَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَانظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="و بنگر؛ توجه کردن به معبودی که مخاطب می‌پرستید.">وَانظُر</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="إِلٰهِكَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبود تو؛ در اینجا گوساله‌ای که سامری به آن روی آورده بود.">إِلٰهِكَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="ظَلتَ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="پیوسته بودی؛ ادامه دادن عبادت آن معبود.">ظَلتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="عاكِفًا" data-root="ع ك ف" data-learn-more="/quran-terminology/fa/roots/ayn-k-f/" data-root-meaning="ملازم ماندن، اقامت و بازداشتن" data-context="مداوم در عبادت؛ وصف پایبندی مخاطب به پرستش گوساله.">عاكِفًا</button>
    ۖ
    <button class="word-link" type="button" data-word="لَنُحَرِّقَنَّهُ" data-root="ح ر ق" data-root-meaning="سوختن و سوزاندن؛ اثر آتش و التهاب؛ و در کاربردی کهن، ساییدن و فرسودن." data-context="قطعاً آن گوساله را خواهیم سوزاند؛ مطابق قرائت مشهورِ باب تفعیل." data-learn-more="/quran-terminology/fa/roots/h-r-q/">لَنُحَرِّقَنَّهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَنَنسِفَنَّهُ" data-root="ن س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-s-f/" data-root-meaning="کندن، پراکندن و بر باد دادن." data-context="قطعاً آن را پراکنده خواهیم کرد؛ پاشیدن بقایای گوساله در آب.">لَنَنسِفَنَّهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="ي م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-m/" data-root-meaning="قصد و رو آوردن؛ تیمّم: به قصد چیزی رفتن؛ یمّ: دریا یا آب پهناور، در شاخه‌ای دیگر." data-context="پهنهٔ آب؛ جایی که بقایای گوساله در آن پراکنده می‌شود.">اليَمِّ</button>
    <button class="word-link" type="button" data-word="نَسفًا" data-root="ن س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-s-f/" data-root-meaning="کندن، پراکندن و بر باد دادن." data-context="پراکنده کردنی؛ مصدرِ تأکیدی برای پاشیدن و پراکندن بقایا.">نَسفًا</button>
  </p>
  <p class="farsi-verse">گفت: پس برو؛ در زندگی برایت این است که بگویی: هیچ تماسی نباشد؛ و وعده‌گاهی داری که هرگز از آن تخلف نمی‌شود؛ و به معبودت بنگر که پیوسته بر آن مانده بودی؛ بی‌گمان آن را می‌سوزانیم و سپس در دریا پراکنده‌اش می‌کنیم.</p>
</section>
