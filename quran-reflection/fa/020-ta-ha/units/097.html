  <p class="farsi-verse">گفت: پس برو؛ در زندگی برایت این است که بگویی: هیچ تماسی نباشد؛ و وعده‌گاهی داری که هرگز از آن تخلف نمی‌شود؛ و به معبودت بنگر که پیوسته بر آن مانده بودی؛ بی‌گمان آن را می‌سوزانیم و سپس در دریا پراکنده‌اش می‌کنیم.</p>
