<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۹۲</h2>

    <button class="word-link" type="button" data-word="يٰهٰرونُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰهٰرونُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="مَنَعَكَ" data-root="م ن ع" data-learn-more="/quran-terminology/fa/roots/m-n-ayn/" data-root-meaning="از حائل شدن و بستن راه دسترسی تا دریغ کردن و حفاظت">مَنَعَكَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="رَأَيتَهُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">رَأَيتَهُم</button>
    <button class="word-link" type="button" data-word="ضَلّوا" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">ضَلّوا</button>

  <p class="farsi-verse">گفت: ای هارون، هنگامی که دیدی گمراه شدند، چه چیز تو را بازداشت،</p>
