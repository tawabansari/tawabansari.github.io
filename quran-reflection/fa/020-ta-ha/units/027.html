<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاحلُل" data-root="ح ل ل" data-root-meaning="گشودن و برداشتن بستگی؛ روا بودن و رفع ممنوعیت؛ فرود آمدن و قرار گرفتن در جایگاه." data-context="و بگشا؛ درخواست موسی برای گشودن گره زبان." data-learn-more="/quran-terminology/fa/roots/h-l-l/">وَاحلُل</button>
    <button class="word-link" type="button" data-word="عُقدَةً" data-root="ع ق د" data-learn-more="/quran-terminology/fa/roots/ayn-q-d/" data-root-meaning="عقد، بستن و برقرار ساختن پیوندی است که اجزای آن را به یکدیگر متصل و تا اندازه‌ای استوار می‌کند." data-context="گرهی؛ موضوع درخواست گشودن">عُقدَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لِسانى" data-root="ل س ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-s-n/" data-root-meaning="زبان به‌عنوان اندام، گفتار یا زبان یک قوم." data-context="زبانم؛ جایگاه گره">لِسانى</button>
  </p>
  <p class="farsi-verse">و گرهی از زبانم بگشا،</p>
</section>
