<section class="ayah-block" id="ayah-102" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۰۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که؛ زمان دمیدن در صور.">يَومَ</button>
    <button class="word-link" type="button" data-word="يُنفَخُ" data-root="ن ف خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-kh/" data-root-meaning="دمیدن و به جریان انداختن هوا." data-context="دمیده می‌شود؛ در صور.">يُنفَخُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="ص و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-r/" data-root-meaning="صورت و شکل دادن؛ صور: شیپور؛ «صُر» در بقره با متمایل کردن یا گردآوردن توضیح داده می‌شود." data-context="صور؛ آنچه در آن دمیده می‌شود.">الصّورِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنَحشُرُ" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="مجرمان را گرد می‌آوریم؛ در روز دمیدن در صور." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">وَنَحشُرُ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ موضوعِ گردآوری." data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمينَ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="در آن روز؛ زمانِ گردآوریِ مجرمان.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="زُرقًا" data-root="ز ر ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-r-q/" data-root-meaning="آبی‌فام بودن؛ زُرق در سیاق رستاخیز وصفی است که تفسیر دقیق آن اختلاف دارد." data-context="با وصف «زُرق»؛ رنگ یا حالتِ آنان که نیازمند بررسی مستقل است.">زُرقًا</button>
  </p>
  <p class="farsi-verse">روزی که در صور دمیده می‌شود و مجرمان را در آن روز کبودچشم گرد می‌آوریم.</p>
</section>
