<section class="ayah-block" id="ayah-102" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۰۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="يُنفَخُ" data-root="ن ف خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-kh/" data-root-meaning="دمیدن و به جریان انداختن هوا.">يُنفَخُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="ص و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-r/" data-root-meaning="صورت و شکل دادن؛ صور: شیپور؛ «صُر» در بقره با متمایل کردن یا گردآوردن توضیح داده می‌شود.">الصّورِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنَحشُرُ" data-root="ح ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sh-r/" data-root-meaning="گرد آوردن و از جایگاه‌ها به سوی یک محل راندن.">وَنَحشُرُ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-r-m/" data-root-meaning="بریدن و به دست آوردن؛ إجرام: مرتکب شدن جرم یا گناه؛ «لا جرم» ساختی برای تأکید و قطعیت است.">المُجرِمينَ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="زُرقًا" data-root="ز ر ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-r-q/" data-root-meaning="آبی‌فام بودن؛ زُرق در سیاق رستاخیز وصفی است که تفسیر دقیق آن اختلاف دارد.">زُرقًا</button>
  </p>
  <p class="farsi-verse">روزی که در صور دمیده می‌شود و مجرمان را در آن روز کبودچشم گرد می‌آوریم.</p>
</section>
