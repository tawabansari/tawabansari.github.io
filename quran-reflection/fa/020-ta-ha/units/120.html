<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَسوَسَ" data-root="و س و س" data-root-meaning="وسوسه در کاربرد صوتی، صدای آرام و پنهان است؛ و در کاربرد مربوط به انسان، سخن یا اندیشه‌ای است که در درون می‌گذرد یا به شیوه‌ای نهانی القا می‌شود. این القا می‌تواند از نفس انسان یا عامل دیگری باشد و نادرستی، فریبندگی یا شیطانی بودن آن از فاعل، محتوا و سیاق تعیین می‌شود، نه از خود ریشه به تنهایی." data-learn-more="/quran-terminology/fa/roots/w-s-w-s/">فَوَسوَسَ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="يٰـٔادَمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰـٔادَمُ</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="أَدُلُّكَ" data-root="د ل ل" data-learn-more="/quran-terminology/fa/roots/d-l-l/" data-root-meaning="از نشان دادن راه تا نشانه‌ای که چیزی را قابل شناخت می‌کند">أَدُلُّكَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="شَجَرَةِ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل">شَجَرَةِ</button>
    <button class="word-link" type="button" data-word="الخُلدِ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه">الخُلدِ</button>
    <button class="word-link" type="button" data-word="وَمُلكٍ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه">وَمُلكٍ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَبلىٰ" data-root="ب ل ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَبلىٰ</button>
  </p>
  <p class="farsi-verse">پس شیطان او را وسوسه کرد؛ گفت: ای آدم، آیا تو را به درخت جاودانگی و فرمانروایی‌ای که فرسوده نمی‌شود راهنمایی کنم؟</p>
</section>
