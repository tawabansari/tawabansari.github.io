<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="السّاعَةَ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="آن ساعت؛ موعد رستاخیز در سیاق آیه.">السّاعَةَ</button>
    <button class="word-link" type="button" data-word="ءاتِيَةٌ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="آمدنی؛ وصف آن ساعت.">ءاتِيَةٌ</button>
    <button class="word-link" type="button" data-word="أَكادُ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن" data-context="نزدیک است که من؛ فعلِ بیانِ قربِ رخدادِ پس از آن.">أَكادُ</button>
    <button class="word-link" type="button" data-word="أُخفيها" data-root="خ ف ي" data-root-meaning="پوشیده بودن و پنهان ماندن؛ پنهان کردن؛ و در شاخه‌ای از عربی کهن، آشکار شدن یا آشکار ساختن چیزی پوشیده." data-context="آن را پنهان می‌دارم؛ خوانش رایجِ باب افعال. تحلیل کهنِ «برداشتن خفا» نیز در مقاله بررسی می‌شود." data-learn-more="/quran-terminology/fa/roots/kh-f-y/">أُخفيها</button>
    <button class="word-link" type="button" data-word="لِتُجزىٰ" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="تا جزا داده شود؛ هر نفس بر پایهٔ کوشش خود.">لِتُجزىٰ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ در بیان فراگیری جزا.">كُلُّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="نفس؛ هر شخصی که جزا می‌یابد.">نَفسٍ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَسعىٰ" data-root="س ع ي" data-learn-more="/quran-terminology/fa/roots/s-ayn-y/" data-root-meaning="از حرکت در یک مسیر تا کوشش برای رسیدن به نتیجه" data-context="می‌کوشد؛ آنچه هر نفس در پی آن تلاش می‌کند.">تَسعىٰ</button>
  </p>
  <p class="farsi-verse">همانا ساعت آمدنی است؛ نزدیک است آن را پنهان بدارم، تا هر نفسی به آنچه می‌کوشد جزا داده شود.</p>
</section>
