<section class="ayah-block" id="ayah-121" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَكَلا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">فَأَكَلا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="فَبَدَت" data-root="ب د و" data-learn-more="/quran-terminology/fa/roots/b-d-w/" data-root-meaning="آشکار شدن، پدیدار گشتن از پس پوشیدگی، و ورود چیزی به میدان دید یا آگاهی">فَبَدَت</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُما</button>
    <button class="word-link" type="button" data-word="سَوءٰتُهُما" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سَوءٰتُهُما</button>
    <button class="word-link" type="button" data-word="وَطَفِقا" data-root="ط ف ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-f-q/" data-root-meaning="آغاز کردن و به انجام کاری پرداختن.">وَطَفِقا</button>
    <button class="word-link" type="button" data-word="يَخصِفانِ" data-root="خ ص ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-sad-f/" data-root-meaning="پیوستن و روی هم نهادن قطعات، مانند برگ یا وصله.">يَخصِفانِ</button>
    <button class="word-link" type="button" data-word="عَلَيهِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِما</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="وَرَقِ" data-root="و ر ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-q/" data-root-meaning="برگ درخت؛ وَرِق: نقره یا پول نقره.">وَرَقِ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجَنَّةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَصىٰ" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت.">وَعَصىٰ</button>
    <button class="word-link" type="button" data-word="ءادَمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">ءادَمُ</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="فَغَوىٰ" data-root="غ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-y/" data-root-meaning="گمراهی و منحرف ساختن از راه درست.">فَغَوىٰ</button>
  </p>
  <p class="farsi-verse">پس آن دو از آن خوردند و برهنگی‌هایشان برایشان آشکار شد و شروع کردند از برگ‌های باغ بر خود بپوشانند؛ و آدم از پروردگارش نافرمانی کرد و گمراه شد.</p>
</section>
