<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَجمِعوا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">فَأَجمِعوا</button>
    <button class="word-link" type="button" data-word="كَيدَكُم" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است.">كَيدَكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="ائتوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ائتوا</button>
    <button class="word-link" type="button" data-word="صَفًّا" data-root="ص ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-f-f/" data-root-meaning="در ردیف نهادن یا گستردن بال‌ها.">صَفًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="أَفلَحَ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری">أَفلَحَ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">اليَومَ</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَنِ</button>
    <button class="word-link" type="button" data-word="استَعلىٰ" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن.">استَعلىٰ</button>
  </p>
  <p class="farsi-verse">پس نیرنگ خود را هماهنگ کنید و صف‌کشیده بیایید؛ و امروز هر که چیره شود کامیاب است.</p>
</section>
