  <p class="farsi-verse">و هارون پیش‌تر به آنان گفته بود: ای قوم من، شما تنها با آن آزموده شده‌اید؛ و پروردگارتان فرارحمن است؛ پس از من پیروی کنید و فرمانم را اطاعت کنید.</p>
