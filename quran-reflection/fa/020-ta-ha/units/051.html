<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز پرسش فرعون در پاسخ به موسی.">قالَ</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="بالُ" data-root="ب و ل" data-root-meaning="«بَال» به حال، شأن و موضوع مربوط به شخص یا گروه اشاره دارد؛ واژه‌ای که در گستره زبان عربی با خاطر و توجه انسان نیز ارتباط دارد. در ترکیب «مَا بَالُ»، پرسش از وضعیت یا ماجرای شخص مطرح است؛ و در «أَصْلَحَ بَالَهُ»، سامان یافتن حال و امور او بیان می‌شود." data-context="حال و سرگذشت؛ در پرسش فرعون دربارهٔ نسل‌های پیشین." data-learn-more="/quran-terminology/fa/roots/b-w-l/">بالُ</button>
    <button class="word-link" type="button" data-word="القُرونِ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره." data-context="نسل‌ها و جماعت‌های هم‌دوره؛ گروه‌های انسانیِ پیشین.">القُرونِ</button>
    <button class="word-link" type="button" data-word="الأولىٰ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="پیشین؛ وصفِ نسل‌هایی که پیش‌تر زیسته‌اند.">الأولىٰ</button>
  </p>
  <p class="farsi-verse">گفت: پس حال نسل‌های پیشین چیست؟</p>
</section>
