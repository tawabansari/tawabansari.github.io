<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالَ</button>
    <button class="word-link" type="button" data-word="رَبُّنَا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّنَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَعطىٰ" data-root="ع ط و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَعطىٰ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَىءٍ</button>
    <button class="word-link" type="button" data-word="خَلقَهُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقَهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="هَدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">هَدىٰ</button>
  </p>
  <p class="farsi-verse">گفت: پروردگار ما کسی است که به هر چیز آفرینش آن را داد، سپس هدایت کرد.</p>
</section>
