<section class="ayah-block" id="ayah-105" data-translation-status="provisional">
  <h2 class="ayah-title">طه ۲۰:۱۰۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَسـَٔلونَكَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">وَيَسـَٔلونَكَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند.">الجِبالِ</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقُل</button>
    <button class="word-link" type="button" data-word="يَنسِفُها" data-root="ن س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-s-f/" data-root-meaning="کندن، پراکندن و بر باد دادن.">يَنسِفُها</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبّى</button>
    <button class="word-link" type="button" data-word="نَسفًا" data-root="ن س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-s-f/" data-root-meaning="کندن، پراکندن و بر باد دادن.">نَسفًا</button>
  </p>
  <p class="farsi-verse">و از تو درباره کوه‌ها می‌پرسند؛ بگو: پروردگارم آنها را پراکنده می‌کند،</p>
</section>
