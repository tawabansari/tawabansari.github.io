    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>

    <button class="word-link" type="button" data-word="وَأَقسِطوا" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است." data-context="و دادگری کنید">وَأَقسِطوا</button>

  <p class="farsi-verse">و اگر دو گروه از مؤمنان با هم جنگیدند، میانشان سازش برقرار کنید؛ پس اگر یکی بر دیگری تعدی کرد، با آن که تعدی می‌کند بجنگید تا به فرمان آن معبود یگانه بازگردد. پس اگر بازگشت، میانشان به عدالت سازش برقرار کنید و دادگری کنید؛ بی‌گمان آن معبود یگانه دادگران را دوست می‌دارد.</p>
</section>
