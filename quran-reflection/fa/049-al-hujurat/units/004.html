<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الحجرات ۴۹:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُنادونَكَ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="تو را ندا می‌کنند؛ خطاب از پشت حجره‌ها." data-learn-more="/quran-terminology/fa/roots/n-d-y/">يُنادونَكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="وَراءِ" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش" data-context="پشت؛ موقعیت نداکنندگان.">وَراءِ</button>
    <button class="word-link" type="button" data-word="الحُجُرٰتِ" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی" data-context="حجره‌ها؛ اتاق‌های محل خطاب.">الحُجُرٰتِ</button>
    <button class="word-link" type="button" data-word="أَكثَرُهُم" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بیشتر آنان؛ غالب نداکنندگان.">أَكثَرُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="تعقل می‌کنند؛ در جمله نفی شده است.">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">بی‌گمان بیشتر کسانی که تو را از پشت حجره‌ها صدا می‌زنند، تعقل نمی‌کنند.</p>
</section>
