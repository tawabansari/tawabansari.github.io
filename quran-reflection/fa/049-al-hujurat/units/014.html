  <p class="farsi-verse">بادیه‌نشینان گفتند: ایمان آوردیم. بگو: ایمان نیاورده‌اید، ولی بگویید تسلیم شدیم، و هنوز ایمان به دل‌هایتان درنیامده است. و اگر از آن معبود یگانه و فرستاده‌اش فرمان برید، از اعمالتان هیچ نمی‌کاهد؛ بی‌گمان آن معبود یگانه آمرزنده و دارای رحمت ویژه است.</p>
