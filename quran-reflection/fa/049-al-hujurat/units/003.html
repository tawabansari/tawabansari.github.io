  <p class="farsi-verse">بی‌گمان کسانی که نزد فرستادهٔ آن معبود یگانه صداهایشان را پایین می‌آورند، آنان کسانی‌اند که آن معبود یگانه دل‌هایشان را برای پرهیزگاری آزموده است؛ برای آنان آمرزش و پاداشی بزرگ است.</p>
