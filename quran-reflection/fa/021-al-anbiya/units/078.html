  <h2 class="ayah-title">الانبیاء ۲۱:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَداوۥدَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَداوۥدَ</button>
    <button class="word-link" type="button" data-word="وَسُلَيمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَسُلَيمٰنَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="يَحكُمانِ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">يَحكُمانِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَرثِ" data-root="ح ر ث" data-learn-more="/quran-terminology/fa/roots/h-r-th/" data-root-meaning="کار هدفمند، آماده‌سازی بستر، پرورش و انتظار حاصل">الحَرثِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نَفَشَت" data-root="ن ف ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَفَشَت</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="غَنَمُ" data-root="غ ن م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَنَمُ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومِ</button>
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكُنّا</button>
    <button class="word-link" type="button" data-word="لِحُكمِهِم" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">لِحُكمِهِم</button>
    <button class="word-link" type="button" data-word="شٰهِدينَ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">شٰهِدينَ</button>
  </p>
  <p class="farsi-verse">و داوود و سلیمان را، آنگاه که درباره کشتزار داوری می‌کردند، چون گوسفندان قوم شبانه در آن چریده بودند؛ و ما گواه داوری‌شان بودیم.</p>
</section>
