  <p class="farsi-verse">و چون کسانی که کافر شده‌اند تو را می‌بینند، جز به ریشخندت نمی‌گیرند: آیا این همان است که از معبودانتان یاد می‌کند؟ و خود آنان یاد فرارحمن را انکار می‌کنند.</p>
