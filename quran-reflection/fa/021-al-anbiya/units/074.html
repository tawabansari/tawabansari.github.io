<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلوطًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَلوطًا</button>
    <button class="word-link" type="button" data-word="ءاتَينٰهُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به او دادیم؛ اعطای حکم و دانش به لوط.">ءاتَينٰهُ</button>
    <button class="word-link" type="button" data-word="حُكمًا" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="حکم و توان داوری؛ موهبتی همراه با دانش.">حُكمًا</button>
    <button class="word-link" type="button" data-word="وَعِلمًا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و دانش؛ آگاهیِ بخشیده‌شده به لوط.">وَعِلمًا</button>
    <button class="word-link" type="button" data-word="وَنَجَّينٰهُ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن" data-context="و او را نجات دادیم؛ از آن آبادی رهانیدیم.">وَنَجَّينٰهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَريَةِ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی؛ جامعهٔ ساکن در آن که رفتارشان وصف می‌شود.">القَريَةِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ در ساختِ بیانِ انجام دادنِ آن رفتارها.">كانَت</button>
    <button class="word-link" type="button" data-word="تَعمَلُ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌داد؛ کردارِ اهل آن آبادی.">تَعمَلُ</button>
    <button class="word-link" type="button" data-word="الخَبٰئِثَ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="کارهای زشت و ناروا؛ مفعولِ «انجام می‌داد».">الخَبٰئِثَ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ وصفِ وضعیت و رفتارِ آن مردم.">كانوا</button>
    <button class="word-link" type="button" data-word="قَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ قوم، مردم، یا جامعه‌ای که بر پیوندی مشترک ایستاده است." data-context="مردمی؛ جامعه‌ای که بدکردار وصف شده است.">قَومَ</button>
    <button class="word-link" type="button" data-word="سَوءٍ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی؛ در ترکیب «مردمی بدکردار».">سَوءٍ</button>
    <button class="word-link" type="button" data-word="فٰسِقينَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="نافرمان و بیرون‌رونده از حدودِ حق.">فٰسِقينَ</button>
  </p>
  <p class="farsi-verse">و به لوط حکم و دانش دادیم و او را از آبادی‌ای که کارهای پلید می‌کرد نجات دادیم؛ آنان مردمی بد و نافرمان بودند.</p>
</section>
