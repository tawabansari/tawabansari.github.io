<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَركُضوا" data-root="ر ك ض" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَركُضوا</button>
    <button class="word-link" type="button" data-word="وَارجِعوا" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">وَارجِعوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أُترِفتُم" data-root="ت ر ف" data-learn-more="/quran-terminology/fa/roots/t-r-f/" data-root-meaning="فراخی زندگی، نازپروردگی، عادت به آسایش، و تبدیل برخورداری به احساس امتیاز و مقاومت در برابر حق">أُترِفتُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="وَمَسٰكِنِكُم" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن">وَمَسٰكِنِكُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُسـَٔلونَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">تُسـَٔلونَ</button>
  </p>
  <p class="farsi-verse">نگریزید و به آنچه در آن نازپرورده شده‌اید و به خانه‌هایتان بازگردید، شاید پرسیده شوید.</p>
</section>
