  </p>
  <p class="farsi-verse">و ترازوهای داد را برای روز قیامت می‌نهیم؛ پس به هیچ نفسی هیچ ستمی نمی‌شود؛ و اگر به وزن دانه خردلی باشد، آن را می‌آوریم؛ و ما برای حسابرسی بس هستیم.</p>
