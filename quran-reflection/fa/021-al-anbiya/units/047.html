<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَضَعُ" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت.">وَنَضَعُ</button>
    <button class="word-link" type="button" data-word="المَوٰزينَ" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار">المَوٰزينَ</button>
    <button class="word-link" type="button" data-word="القِسطَ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است.">القِسطَ</button>
    <button class="word-link" type="button" data-word="لِيَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">لِيَومِ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تُظلَمُ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">تُظلَمُ</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">نَفسٌ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="مِثقالَ" data-root="ث ق ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-q-l/" data-root-meaning="سنگینی، وزن و بار؛ ثقل می‌تواند جسمانی یا مربوط به مسئولیت و دشواری باشد.">مِثقالَ</button>
    <button class="word-link" type="button" data-word="حَبَّةٍ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">حَبَّةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="خَردَلٍ" data-root="خ ر د ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-r-d-l/" data-root-meaning="خردل و دانه ریز آن.">خَردَلٍ</button>
    <button class="word-link" type="button" data-word="أَتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أَتَينا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/" data-root-meaning="کفایت و بسندگی؛ از برآوردن نیاز و بر عهده گرفتن کار دیگری تا کفایت آن معبود یگانه در گواهی، حسابرسی، یاری و حفاظت">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِنا</button>
    <button class="word-link" type="button" data-word="حٰسِبينَ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">حٰسِبينَ</button>
  </p>
  <p class="farsi-verse">و ترازوهای داد را برای روز قیامت می‌نهیم؛ پس به هیچ نفسی هیچ ستمی نمی‌شود؛ و اگر به وزن دانه خردلی باشد، آن را می‌آوریم؛ و ما برای حسابرسی بس هستیم.</p>
</section>
