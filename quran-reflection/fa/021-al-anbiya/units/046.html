<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="مَسَّتهُم" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به آنان برسد و تماس پیدا کند؛ در فرض رسیدن نفحه‌ای از عذاب.">مَسَّتهُم</button>
    <button class="word-link" type="button" data-word="نَفحَةٌ" data-root="ن ف ح" data-learn-more="/quran-terminology/fa/roots/n-f-h/" data-root-meaning="وزیدن، انتشار، بیرون جستن یا رساندن اثر؛ در برخی کاربردها ضربه زدن و بخشیدن." data-context="نفحه‌ای؛ یک نوبت یا بخشی از عذاب که در این سیاق، اندک بودن مقدار آن برجسته است.">نَفحَةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ آنچه نفحه‌ای از آن فرض شده است.">عَذابِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ مخاطب با ضمیر «ک» خطاب شده است.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="لَيَقولُنَّ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بی‌گمان خواهند گفت؛ پاسخ تأکیدیِ شرط رسیدن عذاب.">لَيَقولُنَّ</button>
    <button class="word-link" type="button" data-word="يٰوَيلَنا" data-root="و ي ل" data-learn-more="/quran-terminology/fa/roots/w-y-l/" data-root-meaning="از فریاد اندوه و هشدار تا اعلام بدفرجامی" data-context="وای بر ما؛ فریاد حسرت و اندوه از زبان مخاطبان.">يٰوَيلَنا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودیم؛ در اعتراف آنان به ستمکاریِ گذشته.">كُنّا</button>
    <button class="word-link" type="button" data-word="ظٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمکاران؛ وصفی که مخاطبان در اعتراف به خود نسبت می‌دهند.">ظٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و اگر اندکی از عذاب پروردگارت به آنان برسد، بی‌گمان می‌گویند: وای بر ما، ما ستمگر بودیم.</p>
</section>
