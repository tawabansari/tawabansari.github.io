<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۹۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّتى</button>
    <button class="word-link" type="button" data-word="أَحصَنَت" data-root="ح ص ن" data-root-meaning="ریشهٔ «ح ص ن» در عربی بر حفاظت، پاسداری و مصون قرار دادن چیزی در برابر دسترسی یا تعرض دلالت دارد. «حِصْن» جایگاهی است که از آنچه درون آن است محافظت می‌کند؛ «تحصین» عمل استوار و محفوظ ساختن است؛ و «احصان» می‌تواند در زمینه‌های مادی، رفتاری و اجتماعی به کار رود." data-context="پاسداری کرد؛ مریم پاکدامنی خود را حفظ کرد" data-learn-more="/quran-terminology/fa/roots/h-sad-n/">أَحصَنَت</button>
    <button class="word-link" type="button" data-word="فَرجَها" data-root="ف ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-j/" data-root-meaning="شکاف و گشودگی؛ فرج: نیز اندام خصوصی، بنا بر سیاق." data-context="حریم جنسی و پاکدامنی خویش را">فَرجَها</button>
    <button class="word-link" type="button" data-word="فَنَفَخنا" data-root="ن ف خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-kh/" data-root-meaning="دمیدن و به جریان انداختن هوا." data-context="پس دمیدیم؛ در بیان آفرینش عیسی">فَنَفَخنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="روحِنا" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح" data-context="از روح خود؛ در تعبیر نفخِ آیه">روحِنا</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰها" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و او را قرار دادیم">وَجَعَلنٰها</button>
    <button class="word-link" type="button" data-word="وَابنَها" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="و پسرش را؛ عیسی">وَابنَها</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌ای؛ مریم و پسرش با هم">ءايَةً</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="برای جهانیان">لِلعٰلَمينَ</button>
  </p>
  <p class="farsi-verse">و آن زن را که پاکدامنی خود را حفظ کرد؛ پس از روح خود در او دمیدیم و او و پسرش را نشانه‌ای برای جهانیان قرار دادیم.</p>
</section>
