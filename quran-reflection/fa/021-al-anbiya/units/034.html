<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنا</button>
    <button class="word-link" type="button" data-word="لِبَشَرٍ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/">لِبَشَرٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="الخُلدَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/">الخُلدَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَإِي۟ن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَإِي۟ن</button>
    <button class="word-link" type="button" data-word="مِتَّ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مِتَّ</button>
    <button class="word-link" type="button" data-word="فَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُمُ</button>
    <button class="word-link" type="button" data-word="الخٰلِدونَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/">الخٰلِدونَ</button>
  </p>
  <p class="farsi-verse">و برای هیچ انسانی پیش از تو جاودانگی قرار ندادیم؛ پس اگر تو بمیری، آیا آنان جاودانه‌اند؟</p>
</section>
