<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَخشَونَ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/" data-root-meaning="بیم و ملاحظهٔ آگاهانه در برابر خطری شناخته‌شده یا پیامدی جدی، و خشیت اثرگذار در برابر آن معبود یگانه" data-context="خشیت دارند؛ با آگاهی و بیم در برابر پروردگارند.">يَخشَونَ</button>
    <button class="word-link" type="button" data-word="رَبَّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ کسی که از او خشیت دارند.">رَبَّهُم</button>
    <button class="word-link" type="button" data-word="بِالغَيبِ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد" data-context="در نهان؛ خشیت از پروردگار با آنکه او را نمی‌بینند.">بِالغَيبِ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السّاعَةِ" data-root="س و ع" data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="بخشی از زمان و هنگام معین؛ «السّاعة» در سیاق رستاخیز، ساعت موعود است. «سواع» نام خاص معبود است و منشأ اشتقاقی آن قطعی نیست." data-context="آن ساعت؛ رخداد موعود حسابرسی.">السّاعَةِ</button>
    <button class="word-link" type="button" data-word="مُشفِقونَ" data-root="ش ف ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-f-q/" data-root-meaning="دلسوزی و نگرانی همراه با بیم؛ شفق: سرخی یا روشنایی افق پس از غروب." data-context="بیمناکند؛ با نگرانی جدی نسبت به آن ساعت.">مُشفِقونَ</button>
  </p>
  <p class="farsi-verse">کسانی که در نهان از پروردگارشان می‌ترسند و از ساعت هراسان‌اند.</p>
</section>
