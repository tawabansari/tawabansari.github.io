<section class="ayah-block" id="ayah-102" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۰۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَسمَعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="صدای آن را نمی‌شنوند.">يَسمَعونَ</button>
    <button class="word-link" type="button" data-word="حَسيسَها" data-root="ح س س" data-root-meaning="ریشهٔ «ح س س» در عربی چند شاخهٔ معنایی دارد: دریافتن و آگاه شدن از چیزی؛ جست‌وجوی خبر و نشانه؛ صدا و واکنش حسی؛ و کشتن یا از میان بردن. در قرآن، معنای هر صورت از ساخت صرفی و سیاق آن مشخص می‌شود. «أَحَسَّ» به دریافتن، «تَحَسَّسَ» به جست‌وجوی خبر، «حَسِيس» به صدای خفیف، و «حَسَّ» در سیاق نبرد به کشتن و از میان بردن اشاره دارد." data-context="صدای خفیف آتشِ جهنم." data-learn-more="/quran-terminology/fa/roots/h-s-s/">حَسيسَها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="اشتَهَت" data-root="ش ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-w/" data-root-meaning="میل و خواست شدید برای چیزی." data-context="خواسته و آرزو کرده است.">اشتَهَت</button>
    <button class="word-link" type="button" data-word="أَنفُسُهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="جان‌ها و خودِ آنان.">أَنفُسُهُم</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه" data-context="در آنچه خواسته‌اند ماندگارند.">خٰلِدونَ</button>
  </p>
  <p class="farsi-verse">صدای آن را نمی‌شنوند و در آنچه جانشان بخواهد جاودانه‌اند.</p>
</section>
