  <p class="farsi-verse">اگر در آن دو جز آن معبود یگانه معبودانی بودند، هر دو تباه می‌شدند؛ پس منزه است آن معبود یگانه، پروردگار عرش، از آنچه وصف می‌کنند.</p>
