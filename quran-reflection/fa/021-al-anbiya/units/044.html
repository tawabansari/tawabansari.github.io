  <p class="farsi-verse">بلکه اینان و پدرانشان را بهره‌مند کردیم تا عمر بر آنان دراز شد؛ آیا نمی‌بینند که به زمین می‌آییم و آن را از کناره‌هایش می‌کاهیم؟ آیا آنان چیره‌اند؟</p>
