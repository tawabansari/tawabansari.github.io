<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۷۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَفَهَّمنٰها" data-root="ف ه م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَفَهَّمنٰها</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سُلَيمٰنَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلًّا" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">وَكُلًّا</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">ءاتَينا</button>
    <button class="word-link" type="button" data-word="حُكمًا" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/">حُكمًا</button>
    <button class="word-link" type="button" data-word="وَعِلمًا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">وَعِلمًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَسَخَّرنا" data-root="س خ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَسَخَّرنا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">داوۥدَ</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="ج ب ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الجِبالَ</button>

    <button class="word-link" type="button" data-word="وَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">وَكُنّا</button>
    <button class="word-link" type="button" data-word="فٰعِلينَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/">فٰعِلينَ</button>
  </p>
  <p class="farsi-verse">پس آن را به سلیمان فهماندیم؛ و به هر دو حکم و دانش دادیم؛ و کوه‌ها و پرندگان را با داوود رام کردیم که تسبیح می‌گفتند؛ و ما انجام‌دهنده بودیم.</p>
