<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۸۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَذَا</button>
    <button class="word-link" type="button" data-word="النّونِ" data-root="ن و ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-w-n/" data-root-meaning="نون: نام حرف؛ نیز ماهی در تعبیر «ذوالنون»؛ حروف مقطعه معنای قطعیِ واژگانی ندارند." data-context="ماهی؛ در لقب صاحب ماهی.">النّونِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="ذَهَبَ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="رفت؛ دور شدن صاحب ماهی.">ذَهَبَ</button>
    <button class="word-link" type="button" data-word="مُغٰضِبًا" data-root="غ ض ب" data-learn-more="/quran-terminology/fa/roots/gh-dad-b/" data-root-meaning="شدت ناخشنودی و واکنش در برابر امر ناپذیرفتنی" data-context="خشمگین؛ حالت هنگام رفتن.">مُغٰضِبًا</button>
    <button class="word-link" type="button" data-word="فَظَنَّ" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد" data-context="پس پنداشت؛ تصور او دربارهٔ پیشامد.">فَظَنَّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="نَقدِرَ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="بر او تنگ بگیریم؛ در سیاق این برداشت از آیه.">نَقدِرَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="فَنادىٰ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="پس ندا کرد؛ خطاب صاحب ماهی در تاریکی‌ها." data-learn-more="/quran-terminology/fa/roots/n-d-y/">فَنادىٰ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الظُّلُمٰتِ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="تاریکی‌ها؛ محیط ندای او.">الظُّلُمٰتِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="إِلٰهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبود؛ در نفی هر معبودی جز مخاطب.">إِلٰهَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="سُبحٰنَكَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="منزهی تو؛ تنزیه مخاطب دعا.">سُبحٰنَكَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="كُنتُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودم؛ اقرار به وضعیت پیشین.">كُنتُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگران؛ گروهی که گوینده خود را در شمارشان می‌آورد.">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و صاحب ماهی را، آنگاه که خشمگین رفت و پنداشت بر او تنگ نمی‌گیریم؛ پس در تاریکی‌ها ندا داد: هیچ معبودی جز تو نیست؛ منزهی تو؛ من از ستمگران بودم.</p>
</section>
