<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَدرى" data-root="د ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه شدن.">أَدرى</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُ</button>
    <button class="word-link" type="button" data-word="فِتنَةٌ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">فِتنَةٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَمَتٰعٌ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">وَمَتٰعٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="حينٍ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان.">حينٍ</button>
  </p>
  <p class="farsi-verse">و نمی‌دانم؛ شاید آن آزمونی برای شما و بهره‌ای تا زمانی باشد.</p>
</section>
