    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">يُؤمِنونَ</button>

  <p class="farsi-verse">آیا کسانی که کافر شده‌اند ندیده‌اند که آسمان‌ها و زمین به‌هم‌پیوسته بودند و آن دو را گشودیم، و هر چیز زنده‌ای را از آب قرار دادیم؟ آیا ایمان نمی‌آورند؟</p>
