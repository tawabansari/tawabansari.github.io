<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنوحًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَنوحًا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="ن د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نادىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلُ</button>
    <button class="word-link" type="button" data-word="فَاستَجَبنا" data-root="ج و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَاستَجَبنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="فَنَجَّينٰهُ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">فَنَجَّينٰهُ</button>
    <button class="word-link" type="button" data-word="وَأَهلَهُ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">وَأَهلَهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الكَربِ" data-root="ك ر ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الكَربِ</button>
    <button class="word-link" type="button" data-word="العَظيمِ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">العَظيمِ</button>
  </p>
  <p class="farsi-verse">و نوح را، آنگاه که پیش‌تر ندا داد؛ پس او را پاسخ دادیم و او و خانواده‌اش را از اندوه بزرگ نجات دادیم.</p>
