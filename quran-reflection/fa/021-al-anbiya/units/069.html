<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُلنا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُلنا</button>
    <button class="word-link" type="button" data-word="يٰنارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">يٰنارُ</button>
    <button class="word-link" type="button" data-word="كونى" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كونى</button>
    <button class="word-link" type="button" data-word="بَردًا" data-root="ب ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-r-d/" data-root-meaning="سردی و خنکی؛ بَرَد: تگرگ. معنای آسایش یا زیان از کاربرد و سیاق روشن می‌شود.">بَردًا</button>
    <button class="word-link" type="button" data-word="وَسَلٰمًا" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">وَسَلٰمًا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
  </p>
  <p class="farsi-verse">گفتیم: ای آتش، بر ابراهیم سرد و سلامت باش.</p>
</section>
