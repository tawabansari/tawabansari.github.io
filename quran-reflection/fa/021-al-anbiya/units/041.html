<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَدِ</button>
    <button class="word-link" type="button" data-word="استُهزِئَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد">استُهزِئَ</button>
    <button class="word-link" type="button" data-word="بِرُسُلٍ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">بِرُسُلٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="فَحاقَ" data-root="ح ي ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-y-q/" data-root-meaning="فراگرفتن و دامنگیر شدن، به‌ویژه درباره پیامد ناخوشایند.">فَحاقَ</button>
    <button class="word-link" type="button" data-word="بِالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِالَّذينَ</button>
    <button class="word-link" type="button" data-word="سَخِروا" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/">سَخِروا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد">يَستَهزِءونَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی فرستادگانی پیش از تو ریشخند شدند؛ پس آنچه ریشخند می‌کردند، کسانی را که آنان را مسخره می‌کردند فراگرفت.</p>
</section>
