<section class="ayah-block" id="ayah-104" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۰۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَ</button>
    <button class="word-link" type="button" data-word="نَطوِى" data-root="ط و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَطوِى</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءَ</button>
    <button class="word-link" type="button" data-word="كَطَىِّ" data-root="ط و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَطَىِّ</button>
    <button class="word-link" type="button" data-word="السِّجِلِّ" data-root="س ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">السِّجِلِّ</button>
    <button class="word-link" type="button" data-word="لِلكُتُبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">لِلكُتُبِ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="بَدَأنا" data-root="ب د أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَدَأنا</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="خَلقٍ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقٍ</button>
    <button class="word-link" type="button" data-word="نُعيدُهُ" data-root="ع و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نُعيدُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعدًا" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/">وَعدًا</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كُنّا</button>
    <button class="word-link" type="button" data-word="فٰعِلينَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/">فٰعِلينَ</button>
  </p>
  <p class="farsi-verse">روزی که آسمان را چون پیچیدن طومار برای نوشته‌ها می‌پیچیم؛ همان‌گونه که آفرینش نخست را آغاز کردیم، آن را بازمی‌گردانیم؛ وعده‌ای بر ماست؛ ما انجام‌دهنده‌ایم.</p>
</section>
