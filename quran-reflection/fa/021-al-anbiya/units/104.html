<section class="ayah-block" id="ayah-104" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۰۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="نَطوِى" data-root="ط و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-w-y/" data-root-meaning="تا کردن و درهم پیچیدن؛ «طوی» نام خاص یک وادی است.">نَطوِى</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءَ</button>
    <button class="word-link" type="button" data-word="كَطَىِّ" data-root="ط و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-w-y/" data-root-meaning="تا کردن و درهم پیچیدن؛ «طوی» نام خاص یک وادی است.">كَطَىِّ</button>
    <button class="word-link" type="button" data-word="السِّجِلِّ" data-root="س ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-j-l/" data-root-meaning="سجلّ: نوشته یا طومار؛ سجّیل: سنگِ عذاب، با منشأ واژگانی مورد اختلاف.">السِّجِلِّ</button>
    <button class="word-link" type="button" data-word="لِلكُتُبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">لِلكُتُبِ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="بَدَأنا" data-root="ب د أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-d-a/" data-root-meaning="آغاز کردن و پدید آوردن از آغاز؛ مبدأ: نقطه یا پایهٔ شروع.">بَدَأنا</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="خَلقٍ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقٍ</button>
    <button class="word-link" type="button" data-word="نُعيدُهُ" data-root="ع و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-d/" data-root-meaning="بازگشت و تکرار؛ عید: هنگام بازآینده؛ «عاد» نام قوم نیز هست.">نُعيدُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعدًا" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعدًا</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنّا</button>
    <button class="word-link" type="button" data-word="فٰعِلينَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">فٰعِلينَ</button>
  </p>
  <p class="farsi-verse">روزی که آسمان را چون پیچیدن طومار برای نوشته‌ها می‌پیچیم؛ همان‌گونه که آفرینش نخست را آغاز کردیم، آن را بازمی‌گردانیم؛ وعده‌ای بر ماست؛ ما انجام‌دهنده‌ایم.</p>
</section>
