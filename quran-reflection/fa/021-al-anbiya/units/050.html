<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="ذِكرٌ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">ذِكرٌ</button>
    <button class="word-link" type="button" data-word="مُبارَكٌ" data-root="ب ر ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُبارَكٌ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/">أَنزَلنٰهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَأَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَأَنتُم</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="مُنكِرونَ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/">مُنكِرونَ</button>
  </p>
  <p class="farsi-verse">و این یادی پربرکت است که نازل کرده‌ایم؛ آیا شما آن را انکار می‌کنید؟</p>
