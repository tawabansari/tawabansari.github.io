<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَحَسّوا" data-root="ح س س" data-root-meaning="ریشهٔ «ح س س» در عربی چند شاخهٔ معنایی دارد: دریافتن و آگاه شدن از چیزی؛ جست‌وجوی خبر و نشانه؛ صدا و واکنش حسی؛ و کشتن یا از میان بردن. در قرآن، معنای هر صورت از ساخت صرفی و سیاق آن مشخص می‌شود. «أَحَسَّ» به دریافتن، «تَحَسَّسَ» به جست‌وجوی خبر، «حَسِيس» به صدای خفیف، و «حَسَّ» در سیاق نبرد به کشتن و از میان بردن اشاره دارد." data-context="شدت عذاب الهی یا نشانه‌های آن را دریافتند." data-learn-more="/quran-terminology/fa/roots/h-s-s/">أَحَسّوا</button>
    <button class="word-link" type="button" data-word="بَأسَنا" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="شدتِ عذاب و کیفر ما.">بَأسَنا</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="يَركُضونَ" data-root="ر ك ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-k-dad/" data-root-meaning="با پا زدن، دویدن یا شتاب دادن به مرکب." data-context="شتابان می‌گریختند.">يَركُضونَ</button>
  </p>
  <p class="farsi-verse">پس چون عذاب ما را حس کردند، ناگهان از آن می‌گریختند.</p>
</section>
