<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="صَدَقنٰهُمُ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="وعده را برای آنان راست گرداندیم.">صَدَقنٰهُمُ</button>
    <button class="word-link" type="button" data-word="الوَعدَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعدهٔ داده‌شده.">الوَعدَ</button>
    <button class="word-link" type="button" data-word="فَأَنجَينٰهُم" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن" data-context="پس نجاتشان دادیم.">فَأَنجَينٰهُم</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هر که بخواهیم.">نَشاءُ</button>
    <button class="word-link" type="button" data-word="وَأَهلَكنَا" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="تجاوزکنندگان از حد را نابود ساختیم." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">وَأَهلَكنَا</button>
    <button class="word-link" type="button" data-word="المُسرِفينَ" data-root="س ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-f/" data-root-meaning="از اندازه یا حد گذشتن؛ اسراف." data-context="تجاوزکنندگان از حد.">المُسرِفينَ</button>
  </p>
  <p class="farsi-verse">سپس وعده را برایشان راست گرداندیم و آنان و هر که را می‌خواستیم نجات دادیم و زیاده‌روان را نابود کردیم.</p>
</section>
