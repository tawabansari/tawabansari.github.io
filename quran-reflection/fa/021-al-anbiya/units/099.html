<section class="ayah-block" id="ayah-099" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۹۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="ءالِهَةً" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">ءالِهَةً</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="وَرَدوها" data-root="و ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-d/" data-root-meaning="رسیدن به آب یا مقصد؛ وِرد: ورود یا بهره مقرر.">وَرَدوها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">وَكُلٌّ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه">خٰلِدونَ</button>
  </p>
  <p class="farsi-verse">اگر اینان معبود بودند، به آن وارد نمی‌شدند؛ و همه در آن جاودانه‌اند.</p>
</section>
