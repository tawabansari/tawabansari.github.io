<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="زالَت" data-root="ز و ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-w-l/" data-root-meaning="از جای خود کنار رفتن و از میان رفتن." data-context="پیوسته ادامه داشت؛ همراه «ما» استمرار سخن آنان را بیان می‌کند.">زالَت</button>
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">تِلكَ</button>
    <button class="word-link" type="button" data-word="دَعوىٰهُم" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="گفته و فریاد آنان؛ اعترافی که تکرار می‌کردند.">دَعوىٰهُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="جَعَلنٰهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="آنان را گرداندیم؛ وصفِ حاصل در ادامه می‌آید.">جَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="حَصيدًا" data-root="ح ص د" data-root-meaning="ریشهٔ «ح ص د» در عربی دو شاخه ثبت‌شده دارد: بریدن و درو کردن، و محکم و استوار ساختن. شاخه نخست در کشاورزی با بریدن ساقه‌ها و برداشت محصول شناخته می‌شود؛ شاخه دوم در استحکام ریسمان، زره و ساختارهای مشابه کاربرد دارد." data-context="چون کشتزاری دروشده؛ تصویر نابودی و فرو افتادن آنان." data-learn-more="/quran-terminology/fa/roots/h-sad-d/">حَصيدًا</button>
    <button class="word-link" type="button" data-word="خٰمِدينَ" data-root="خ م د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-m-d/" data-root-meaning="خاموش و بی‌حرکت شدن، مانند آتش فروکش‌کرده." data-context="خاموش و فروخفته؛ تصویر دوم پس از دروشده.">خٰمِدينَ</button>
  </p>
  <p class="farsi-verse">پس پیوسته این فریادشان بود تا آنان را دروشده و خاموش گرداندیم.</p>
</section>
