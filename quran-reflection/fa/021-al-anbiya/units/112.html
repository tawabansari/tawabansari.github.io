<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قٰلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قٰلَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="احكُم" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">احكُم</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَرَبُّنَا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">وَرَبُّنَا</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">الرَّحمٰنُ</button>
    <button class="word-link" type="button" data-word="المُستَعانُ" data-root="ع و ن" data-learn-more="/quran-terminology/fa/roots/ayn-w-n/" data-root-meaning="یاری، افزودن توان، طلب پشتیبانی و رسیدن به مرحلهٔ میانی">المُستَعانُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تَصِفونَ" data-root="و ص ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-sad-f/" data-root-meaning="وصف و بیان ویژگی.">تَصِفونَ</button>
  </p>
  <p class="farsi-verse">گفت: پروردگارا، به حق داوری کن؛ و پروردگار ما فرارحمن است که در برابر آنچه وصف می‌کنید از او یاری خواسته می‌شود.</p>
</section>
