<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوَهَبنا" data-root="و ه ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَوَهَبنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="إِسحٰقَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسحٰقَ</button>
    <button class="word-link" type="button" data-word="وَيَعقوبَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَيَعقوبَ</button>
    <button class="word-link" type="button" data-word="نافِلَةً" data-root="ن ف ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نافِلَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكُلًّا" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">وَكُلًّا</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنا</button>
    <button class="word-link" type="button" data-word="صٰلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/">صٰلِحينَ</button>
  </p>
  <p class="farsi-verse">و اسحاق و یعقوب را به‌عنوان بخششی افزوده به او دادیم و همه را شایسته گرداندیم.</p>
