<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَجَعَلَهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="پس آنان را ساخت؛ بت‌ها را به قطعات شکسته تبدیل کرد.">فَجَعَلَهُم</button>
    <button class="word-link" type="button" data-word="جُذٰذًا" data-root="ج ذ ذ" data-root-meaning="بریدن یا شکستن چیزی، به‌گونه‌ای که پیوستگی آن قطع شود یا بخش‌هایی از آن جدا گردند." data-context="قطعات شکسته؛ نتیجه قطعه‌قطعه کردن بت‌ها، جز بت بزرگِ مستثناشده." data-learn-more="/quran-terminology/fa/roots/j-dh-dh/">جُذٰذًا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="بزرگی؛ بت بزرگی که از شکسته شدن مستثنا شد.">كَبيرًا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="يَرجِعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="بازگردند؛ در ترجمه فعلی، مراجعه به بت بزرگِ باقی‌مانده.">يَرجِعونَ</button>
  </p>
  <p class="farsi-verse">پس آنان را قطعه‌قطعه کرد، جز بزرگی از آنها، شاید به او بازگردند.</p>
</section>
