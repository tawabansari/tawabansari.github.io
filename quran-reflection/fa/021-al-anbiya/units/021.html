<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="ءالِهَةً" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">ءالِهَةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="يُنشِرونَ" data-root="ن ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-r/" data-root-meaning="گستردن و پراکندن؛ نشور: برخاستن و زنده شدن دوباره.">يُنشِرونَ</button>
  </p>
  <p class="farsi-verse">آیا معبودانی از زمین گرفته‌اند که زنده می‌کنند؟</p>
</section>
