<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَتَاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَأَكيدَنَّ" data-root="ك ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَأَكيدَنَّ</button>
    <button class="word-link" type="button" data-word="أَصنٰمَكُم" data-root="ص ن م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَصنٰمَكُم</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُوَلّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">تُوَلّوا</button>
    <button class="word-link" type="button" data-word="مُدبِرينَ" data-root="د ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُدبِرينَ</button>
  </p>
  <p class="farsi-verse">و سوگند به آن معبود یگانه، پس از آنکه پشت کرده بروید، برای بت‌هایتان چاره‌ای خواهم کرد.</p>
</section>
