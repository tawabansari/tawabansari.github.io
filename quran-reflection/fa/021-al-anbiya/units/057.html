<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَتَاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَأَكيدَنَّ" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است." data-context="حتماً تدبیری خواهم کرد؛ سخن ابراهیم دربارهٔ بت‌ها.">لَأَكيدَنَّ</button>
    <button class="word-link" type="button" data-word="أَصنٰمَكُم" data-root="ص ن م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-m/" data-root-meaning="بت و پیکره مورد پرستش." data-context="بت‌های شما؛ موضوعِ اقدام ابراهیم.">أَصنٰمَكُم</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ زمان‌بندی اقدام پس از رفتن مخاطبان.">بَعدَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُوَلّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="روی بگردانید و بروید؛ دربارهٔ مخاطبان ابراهیم.">تُوَلّوا</button>
    <button class="word-link" type="button" data-word="مُدبِرينَ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت‌کنان و در حال دور شدن؛ وصف مخاطبان ابراهیم.">مُدبِرينَ</button>
  </p>
  <p class="farsi-verse">و سوگند به آن معبود یگانه، پس از آنکه پشت کرده بروید، برای بت‌هایتان چاره‌ای خواهم کرد.</p>
</section>
