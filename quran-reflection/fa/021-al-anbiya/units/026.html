<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالُوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">وَقالُوا</button>
    <button class="word-link" type="button" data-word="اتَّخَذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/">اتَّخَذَ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/">الرَّحمٰنُ</button>
    <button class="word-link" type="button" data-word="وَلَدًا" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/">وَلَدًا</button>
    ۗ
    <button class="word-link" type="button" data-word="سُبحٰنَهُ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/">سُبحٰنَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="عِبادٌ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/">عِبادٌ</button>
    <button class="word-link" type="button" data-word="مُكرَمونَ" data-root="ك ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُكرَمونَ</button>
  </p>
  <p class="farsi-verse">و گفتند: فرارحمن فرزندی گرفته است؛ منزه است او؛ بلکه بندگانی گرامی‌اند.</p>
