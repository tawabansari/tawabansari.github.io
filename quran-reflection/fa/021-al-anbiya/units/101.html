<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۰۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="سَبَقَت" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/" data-root-meaning="پیش افتادن، پیشی گرفتن و سبقت جستن؛ از مسابقه و تقدم زمانی تا پیشگامی در کارهای نیک و پیشی‌ناپذیری در برابر اراده آن معبود یگانه">سَبَقَت</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="مِنَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَّا</button>
    <button class="word-link" type="button" data-word="الحُسنىٰ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">الحُسنىٰ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنها</button>
    <button class="word-link" type="button" data-word="مُبعَدونَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">مُبعَدونَ</button>
  </p>
  <p class="farsi-verse">کسانی که از پیش نیکی از جانب ما برایشان مقرر شده است، از آن دور نگاه داشته می‌شوند.</p>
