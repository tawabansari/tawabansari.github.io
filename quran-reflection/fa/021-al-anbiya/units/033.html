<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقَ</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه">الَّيلَ</button>
    <button class="word-link" type="button" data-word="وَالنَّهارَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند">وَالنَّهارَ</button>
    <button class="word-link" type="button" data-word="وَالشَّمسَ" data-root="ش م س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالشَّمسَ</button>
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="ق م ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالقَمَرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلٌّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="فَلَكٍ" data-root="ف ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَلَكٍ</button>
    <button class="word-link" type="button" data-word="يَسبَحونَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">يَسبَحونَ</button>
  </p>
  <p class="farsi-verse">و اوست که شب و روز و خورشید و ماه را آفرید؛ هر یک در مداری شناورند.</p>
</section>
