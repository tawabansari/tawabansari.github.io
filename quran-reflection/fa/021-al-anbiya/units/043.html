<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ءالِهَةٌ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">ءالِهَةٌ</button>
    <button class="word-link" type="button" data-word="تَمنَعُهُم" data-root="م ن ع" data-learn-more="/quran-terminology/fa/roots/m-n-ayn/" data-root-meaning="از حائل شدن و بستن راه دسترسی تا دریغ کردن و حفاظت">تَمنَعُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِنا" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِنا</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="نَصرَ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">نَصرَ</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">أَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّا</button>
    <button class="word-link" type="button" data-word="يُصحَبونَ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">يُصحَبونَ</button>
  </p>
  <p class="farsi-verse">آیا معبودانی دارند که جز ما از آنان دفاع می‌کنند؟ نه توان یاری خود را دارند و نه از جانب ما همراهی می‌شوند.</p>
</section>
