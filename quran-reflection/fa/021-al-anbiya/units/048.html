<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتَينا</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="وَهٰرونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَهٰرونَ</button>
    <button class="word-link" type="button" data-word="الفُرقانَ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">الفُرقانَ</button>
    <button class="word-link" type="button" data-word="وَضِياءً" data-root="ض و ء" data-learn-more="/quran-terminology/fa/roots/dad-w-a/" data-root-meaning="روشن کردن، تاباندن، درخشیدن، و آشکار ساختن اشیا به وسیله روشنایی">وَضِياءً</button>
    <button class="word-link" type="button" data-word="وَذِكرًا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَذِكرًا</button>
    <button class="word-link" type="button" data-word="لِلمُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">لِلمُتَّقينَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی به موسی و هارون فرقان و روشنایی و یادی برای پرهیزگاران دادیم؛</p>
</section>
