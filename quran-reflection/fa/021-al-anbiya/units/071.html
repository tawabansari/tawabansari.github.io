<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَجَّينٰهُ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن" data-context="او را نجات دادیم؛ دربارهٔ ابراهیم و سپس لوط.">وَنَجَّينٰهُ</button>
    <button class="word-link" type="button" data-word="وَلوطًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَلوطًا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="سرزمینِ مقصدِ نجاتِ ابراهیم و لوط.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="بٰرَكنا" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="در آن سرزمین برای جهانیان برکت نهادیم؛ برکتِ مقصدِ نجات ابراهیم و لوط." data-learn-more="/quran-terminology/fa/roots/b-r-k/">بٰرَكنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="برای جهانیان؛ گسترهٔ خیرِ آن سرزمین.">لِلعٰلَمينَ</button>
  </p>
  <p class="farsi-verse">و او و لوط را به سرزمینی نجات دادیم که در آن برای جهانیان برکت نهاده‌ایم.</p>
</section>
