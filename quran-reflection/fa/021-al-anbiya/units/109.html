<section class="ayah-block" id="ayah-109" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۱۰۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="روی گرداندند؛ شرطِ روی‌گردانی مخاطبان.">تَوَلَّوا</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس بگو؛ فرمانِ اعلام پیام به آنان.">فَقُل</button>
    <button class="word-link" type="button" data-word="ءاذَنتُكُم" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="شما را آگاه کردم؛ اعلامِ روشن و یکسان به مخاطبان.">ءاذَنتُكُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="سَواءٍ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="به‌طور یکسان؛ در بیانِ آگاه‌سازیِ عمومی مخاطبان.">سَواءٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَدرى" data-root="د ر ي" data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه بودن از موضوعی؛ در باب افعال، آگاه ساختن دیگری." data-context="نمی‌دانم؛ نزدیک یا دور بودنِ آنچه وعده داده می‌شوید.">أَدرى</button>
    <button class="word-link" type="button" data-word="أَقَريبٌ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="آیا نزدیک است؛ پرسش دربارهٔ زمان تحققِ وعده.">أَقَريبٌ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="بَعيدٌ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="دور است؛ احتمال دیگر دربارهٔ زمان تحقق وعده.">بَعيدٌ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="توعَدونَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعده داده می‌شوید؛ رویدادی که به مخاطبان وعده داده شده است.">توعَدونَ</button>
  </p>
  <p class="farsi-verse">پس اگر روی گرداندند، بگو: همه شما را یکسان آگاه کردم؛ و نمی‌دانم آنچه وعده داده می‌شوید نزدیک است یا دور.</p>
</section>
