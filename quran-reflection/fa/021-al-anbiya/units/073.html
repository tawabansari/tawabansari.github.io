<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنٰهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="أَئِمَّةً" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أَئِمَّةً</button>
    <button class="word-link" type="button" data-word="يَهدونَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدونَ</button>
    <button class="word-link" type="button" data-word="بِأَمرِنا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">بِأَمرِنا</button>
    <button class="word-link" type="button" data-word="وَأَوحَينا" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق.">وَأَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="فِعلَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">فِعلَ</button>
    <button class="word-link" type="button" data-word="الخَيرٰتِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">الخَيرٰتِ</button>
    <button class="word-link" type="button" data-word="وَإِقامَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَإِقامَ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="وَإيتاءَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَإيتاءَ</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةِ" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">الزَّكوٰةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانوا</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="عٰبِدينَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عٰبِدينَ</button>
  </p>
  <p class="farsi-verse">و آنان را پیشوایانی قرار دادیم که به فرمان ما هدایت می‌کردند؛ و انجام کارهای نیک و برپاداشتن صلات و دادن زکات را به آنان وحی کردیم؛ و پرستندگان ما بودند.</p>
</section>
