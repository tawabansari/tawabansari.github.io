  <h2 class="ayah-title">الانبیاء ۲۱:۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنٰهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="أَئِمَّةً" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/">أَئِمَّةً</button>

    <button class="word-link" type="button" data-word="وَأَوحَينا" data-root="و ح ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَوحَينا</button>

    <button class="word-link" type="button" data-word="وَإِقامَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">وَإِقامَ</button>

    <button class="word-link" type="button" data-word="عٰبِدينَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/">عٰبِدينَ</button>
  </p>
  <p class="farsi-verse">و آنان را پیشوایانی قرار دادیم که به فرمان ما هدایت می‌کردند؛ و انجام کارهای نیک و برپاداشتن صلات و دادن زکات را به آنان وحی کردیم؛ و پرستندگان ما بودند.</p>
