<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُفٍّ" data-root="أ ف ف" data-learn-more="/quran-terminology/fa/roots/a-f-f/" data-root-meaning="اظهار ناخشنودی، بی‌حوصلگی یا بیزاری از چیزی یا کسی، با آوایی کوتاه که کراهت و آزردگی گوینده را آشکار می‌سازد." data-context="اف بر شما و معبودهایتان؛ اظهار بیزاری و نکوهش ابراهیم در سیاق نقد بت‌پرستی.">أُفٍّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَلِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلِما</button>
    <button class="word-link" type="button" data-word="تَعبُدونَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="می‌پرستید؛ عبادت چیزهایی غیر از آن معبود یگانه که ابراهیم نکوهش می‌کند.">تَعبُدونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="جز یا غیر از؛ در ترکیب «من دون الله» درباره معبودهای دیگر.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="آیا اندیشه نمی‌کنید؟ دعوت به سنجش خردمندانه ناتوانی معبودهای ساختگی.">تَعقِلونَ</button>
  </p>
  <p class="farsi-verse">اُف بر شما و آنچه جز آن معبود یگانه می‌پرستید؛ آیا نمی‌اندیشید؟</p>
</section>
