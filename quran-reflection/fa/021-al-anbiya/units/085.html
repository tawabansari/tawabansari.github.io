<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۸۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِسمٰعيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَإِسمٰعيلَ</button>
    <button class="word-link" type="button" data-word="وَإِدريسَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَإِدريسَ</button>
    <button class="word-link" type="button" data-word="وَذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَذَا</button>
    <button class="word-link" type="button" data-word="الكِفلِ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">الكِفلِ</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلٌّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰبِرينَ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">الصّٰبِرينَ</button>
  </p>
  <p class="farsi-verse">و اسماعیل و ادریس و ذوالکفل را؛ همه از شکیبایان بودند.</p>
