<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَيّوبَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَأَيّوبَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="ن د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نادىٰ</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّى</button>
    <button class="word-link" type="button" data-word="مَسَّنِىَ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/">مَسَّنِىَ</button>

  <p class="farsi-verse">و ایوب را، آنگاه که پروردگارش را ندا داد: رنج به من رسیده است و تو مهربان‌ترین مهربانانی.</p>
