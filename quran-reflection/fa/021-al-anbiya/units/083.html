<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَيّوبَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَأَيّوبَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="ندا کرد؛ ایوب پروردگارش را خطاب قرار داد." data-learn-more="/quran-terminology/fa/roots/n-d-y/">نادىٰ</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش؛ مخاطب ندای ایوب.">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّى</button>
    <button class="word-link" type="button" data-word="مَسَّنِىَ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به من رسیده است؛ اثر رنج بر ایوب.">مَسَّنِىَ</button>
    <button class="word-link" type="button" data-word="الضُّرُّ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="رنج و آسیب؛ وضعیتی که ایوب بیان می‌کند.">الضُّرُّ</button>
    <button class="word-link" type="button" data-word="وَأَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتَ</button>
    <button class="word-link" type="button" data-word="أَرحَمُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربان‌ترین؛ وصف رحمت مخاطب.">أَرحَمُ</button>
    <button class="word-link" type="button" data-word="الرّٰحِمينَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمت‌آورندگان؛ کسانی که مهربانی می‌کنند.">الرّٰحِمينَ</button>
  </p>
  <p class="farsi-verse">و ایوب را، آنگاه که پروردگارش را ندا داد: رنج به من رسیده است و تو مهربان‌ترین مهربانانی.</p>
</section>
