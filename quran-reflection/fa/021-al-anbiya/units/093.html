    <button class="word-link" type="button" data-word="أَمرَهُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/">أَمرَهُم</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/">بَينَهُم</button>

    <button class="word-link" type="button" data-word="كُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلٌّ</button>

  <p class="farsi-verse">و کار خود را میانشان پاره‌پاره کردند؛ همه به سوی ما بازمی‌گردند.</p>
