<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لاهِيَةً" data-root="ل ه و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لاهِيَةً</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">قُلوبُهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأَسَرُّوا" data-root="س ر ر" data-learn-more="/quran-terminology/fa/roots/s-r-r/" data-root-meaning="راز و نهان، شادی و آسایش، و جایگاه استقرار">وَأَسَرُّوا</button>
    <button class="word-link" type="button" data-word="النَّجوَى" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">النَّجوَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظَلَموا</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بَشَرٌ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">بَشَرٌ</button>
    <button class="word-link" type="button" data-word="مِثلُكُم" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مِثلُكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَتَأتونَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أَفَتَأتونَ</button>
    <button class="word-link" type="button" data-word="السِّحرَ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر">السِّحرَ</button>
    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="تُبصِرونَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">تُبصِرونَ</button>
  </p>
  <p class="farsi-verse">با دل‌هایی سرگرم؛ و کسانی که ستم کردند، گفت‌وگوی نهانی را پنهان داشتند: آیا این جز انسانی مانند شماست؟ آیا در حالی که می‌بینید به سراغ جادو می‌روید؟</p>
</section>
