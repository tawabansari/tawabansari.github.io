<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="تَأتيهِم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بر آنان می‌رسد؛ واقعهٔ موردِ هشدار">تَأتيهِم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="ب غ ت" data-root-meaning="ناگهانی فرا رسیدن یا رخ دادن چیزی در زمانی که مخاطب انتظار وقوع آن را نداشته یا از نزدیک شدن آن آگاه نبوده است." data-context="ناگهان؛ واقعه می‌رسد و سپس مخاطبان را مبهوت می‌کند" data-learn-more="/quran-terminology/fa/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="فَتَبهَتُهُم" data-root="ب ه ت" data-root-meaning="«ب ه ت» در یک شاخه به حیرت و درماندگی انسان در برابر امری تکان‌دهنده یا حجتی پاسخ‌ناپذیر اشاره دارد؛ و در شاخه دیگر، «بُهْتَان» به دروغ و نسبت ناروایی گفته می‌شود که حقیقت را وارونه نشان می‌دهد و می‌تواند شخصی بی‌گناه را در معرض اتهام یا آسیب قرار دهد." data-context="پس مبهوتشان می‌سازد؛ واکنشِ آنان به رسیدن واقعه" data-learn-more="/quran-terminology/fa/roots/b-h2-t/">فَتَبهَتُهُم</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="توانایی دارند؛ با نفی، ناتوانی در دفع واقعه">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="رَدَّها" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر" data-context="دفع و بازگرداندن آن؛ چیزی که توانش را ندارند">رَدَّها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="يُنظَرونَ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="مهلت داده می‌شوند؛ با نفی، نبودن فرصتِ تأخیر">يُنظَرونَ</button>
  </p>
  <p class="farsi-verse">بلکه ناگهان به آنان می‌رسد و مبهوتشان می‌کند؛ پس نه توان بازگرداندنش را دارند و نه مهلت داده می‌شوند.</p>
</section>
