<section class="ayah-block" id="ayah-090" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۹۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاستَجَبنا" data-root="ج و ب" data-root-meaning="جوب در کاربرد مادی، بریدن، شکافتن و گذشتن از میان چیزی است؛ و در کاربرد گفتاری و رفتاری، جواب و استجابت به پاسخ دادن در برابر سخن، درخواست یا دعوت اشاره دارند." data-learn-more="/quran-terminology/fa/roots/j-w-b/" data-context="پس پاسخ دادیم؛ به دعای زکریا.">فَاستَجَبنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="وَوَهَبنا" data-root="و ه ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h2-b/" data-root-meaning="بخشیدن و عطای بدون عوض." data-context="و بخشیدیم؛ یحیی را به او.">وَوَهَبنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="يَحيىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يَحيىٰ</button>
    <button class="word-link" type="button" data-word="وَأَصلَحنا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="و اصلاح کردیم؛ وضعیت همسرش را برای او.">وَأَصلَحنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="زَوجَهُ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="همسرش؛ کسی که برای او اصلاح شد.">زَوجَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ وصفِ رفتارِ پیوستهٔ آنان.">كانوا</button>
    <button class="word-link" type="button" data-word="يُسٰرِعونَ" data-root="س ر ع" data-root-meaning="سرعت و تندیِ حرکت یا انجام کار در برابر کندی؛ و در مسارعت، شتاب در اقدام و پیش‌دستی به سوی مقصدی که ارزش آن از سیاق شناخته می‌شود." data-context="در نیکی‌ها می‌شتابند؛ وصف رفتار گروهِ یادشده." data-learn-more="/quran-terminology/fa/roots/s-r-ayn/">يُسٰرِعونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الخَيرٰتِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="نیکی‌ها؛ کارهایی که در آنها می‌شتافتند.">الخَيرٰتِ</button>
    <button class="word-link" type="button" data-word="وَيَدعونَنا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="و ما را می‌خواندند؛ با امید و بیم.">وَيَدعونَنا</button>
    <button class="word-link" type="button" data-word="رَغَبًا" data-root="ر غ ب" data-learn-more="/quran-terminology/fa/roots/r-gh-b/" data-root-meaning="خواستن و روی آوردن، روی‌گردانی و جهت رغبت انسان" data-context="از روی امید و رغبت؛ در دعا.">رَغَبًا</button>
    <button class="word-link" type="button" data-word="وَرَهَبًا" data-root="ر ه ب" data-learn-more="/quran-terminology/fa/roots/r-h2-b/" data-root-meaning="هیبت، پروا، مراقبت، و انقباض در برابر عظمت و پیامد" data-context="و از روی بیم؛ در کنار امید.">وَرَهَبًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بودند؛ وصفِ خشوع آنان.">وَكانوا</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="خٰشِعينَ" data-root="خ ش ع" data-learn-more="/quran-terminology/fa/roots/kh-sh-ayn/" data-root-meaning="فرو آمدن از بلندی و سختی، نرم شدن، آرام گرفتن، و فرونشستن در برابر حقیقت و عظمت" data-context="خاشع و فروتن؛ در برابر خداوند.">خٰشِعينَ</button>
  </p>
  <p class="farsi-verse">پس او را پاسخ دادیم و یحیی را به او بخشیدیم و همسرش را برای او شایسته گرداندیم؛ آنان در کارهای نیک می‌شتافتند و ما را با امید و بیم می‌خواندند و در برابر ما فروتن بودند.</p>
</section>
