<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنَا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنَا</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءَ</button>
    <button class="word-link" type="button" data-word="سَقفًا" data-root="س ق ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَقفًا</button>
    <button class="word-link" type="button" data-word="مَحفوظًا" data-root="ح ف ظ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَحفوظًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ءايٰتِها" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتِها</button>
    <button class="word-link" type="button" data-word="مُعرِضونَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">مُعرِضونَ</button>
  </p>
  <p class="farsi-verse">و آسمان را سقفی محفوظ قرار دادیم، و آنان از نشانه‌های آن روی‌گردان‌اند.</p>
</section>
