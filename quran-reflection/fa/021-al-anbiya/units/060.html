<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">الانبیاء ۲۱:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="سَمِعنا" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">سَمِعنا</button>
    <button class="word-link" type="button" data-word="فَتًى" data-root="ف ت ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-y/" data-root-meaning="جوان و جوانی؛ فتوا: پاسخ و روشن کردن مسئله.">فَتًى</button>
    <button class="word-link" type="button" data-word="يَذكُرُهُم" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">يَذكُرُهُم</button>
    <button class="word-link" type="button" data-word="يُقالُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يُقالُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمُ</button>
  </p>
  <p class="farsi-verse">گفتند: جوانی را شنیدیم که از آنان یاد می‌کرد و ابراهیم نامیده می‌شود.</p>
</section>
