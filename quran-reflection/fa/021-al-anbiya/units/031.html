  <h2 class="ayah-title">الانبیاء ۲۱:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="ر س و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-s-w/" data-root-meaning="ثابت و استوار شدن؛ لنگر انداختن و قرار گرفتن.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَميدَ" data-root="م ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-y-d/" data-root-meaning="جنبیدن و نوسان؛ مائده: سفره یا خوان خوراک.">تَميدَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="فِجاجًا" data-root="ف ج ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-j-j/" data-root-meaning="راه فراخ و گذرگاه میان کوه‌ها.">فِجاجًا</button>
    <button class="word-link" type="button" data-word="سُبُلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سُبُلًا</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَهتَدونَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهتَدونَ</button>
  </p>
  <p class="farsi-verse">و در زمین کوه‌هایی استوار قرار دادیم تا آنان را نلرزاند؛ و در آن گذرگاه‌هایی گشاده به‌عنوان راه قرار دادیم، باشد که راه یابند.</p>
</section>
