  <p class="farsi-verse">و پراکنده نشدند مگر پس از آنکه دانش به آنان رسید، از سر ستم‌ورزی میان خود. و اگر سخنی از پروردگارت تا سرآمدی معین پیش‌تر نگذشته بود، میان آنان داوری می‌شد. و کسانی که پس از آنان وارث کتاب شدند درباره آن در تردیدی نگران‌کننده‌اند.</p>
