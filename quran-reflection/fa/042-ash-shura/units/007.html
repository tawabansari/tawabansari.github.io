<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَوحَينا" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="وحی کردیم؛ عرضهٔ قرآن به مخاطب.">أَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="قُرءانًا" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ پیامِ عربیِ وحی‌شده برای هشدار." data-learn-more="/quran-terminology/fa/roots/q-r-a/">قُرءانًا</button>
    <button class="word-link" type="button" data-word="عَرَبِيًّا" data-root="ع ر ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-b/" data-root-meaning="عربی: وابسته به زبان یا مردم عرب؛ اعراب: بادیه‌نشینان؛ عُرُب: مهرورز و دلبسته." data-context="عربی؛ زبانِ قرآنِ وحی‌شده.">عَرَبِيًّا</button>
    <button class="word-link" type="button" data-word="لِتُنذِرَ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="تا هشدار دهی؛ غایتِ وحی در این سیاق.">لِتُنذِرَ</button>
    <button class="word-link" type="button" data-word="أُمَّ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="مادر؛ در ترکیب «ام القرى»، مرکزِ آبادی‌ها.">أُمَّ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی‌ها؛ در نامِ «ام القرى».">القُرىٰ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="حَولَها" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها" data-context="پیرامونش؛ محدودهٔ اطرافِ مرکزِ یادشده.">حَولَها</button>
    <button class="word-link" type="button" data-word="وَتُنذِرَ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="و هشدار دهی؛ انذار دربارهٔ روزِ جمع.">وَتُنذِرَ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمانِ گردآمدن.">يَومَ</button>
    <button class="word-link" type="button" data-word="الجَمعِ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="گردآمدن؛ وصفِ روزِ مورد هشدار.">الجَمعِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="رَيبَ" data-root="ر ي ب" data-learn-more="/quran-terminology/fa/roots/r-y-b/" data-root-meaning="تردید آشفته، بی‌اعتمادی، بدگمانی، شک بی‌ثبات‌کننده، اضطراب در برابر حق، و حالتی که انسان را از اطمینان و تسلیم در برابر برهان بازمی‌دارد" data-context="تردید؛ آنچه دربارهٔ آن روز نفی می‌شود.">رَيبَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَريقٌ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر" data-context="گروهی؛ یکی از دو فرجامِ انسانی.">فَريقٌ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="بوستان؛ جایگاهِ گروه نخست.">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="وَفَريقٌ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر" data-context="و گروهی؛ گروهِ دارای فرجامِ دوم.">وَفَريقٌ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّعيرِ" data-root="س ع ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-ayn-r/" data-root-meaning="افروختن آتش؛ سعیر: آتش شعله‌ور؛ سُعُر در برخی سیاق‌ها: آشفتگی." data-context="آتش سوزان؛ جایگاهِ گروه دوم.">السَّعيرِ</button>
  </p>
  <p class="farsi-verse">و چنین قرآنی عربی به تو وحی کردیم تا مادر شهرها و کسانی را که پیرامون آن‌اند هشدار دهی و از روز گردآمدن که هیچ تردیدی در آن نیست هشدار دهی؛ گروهی در بهشت و گروهی در آتش افروخته‌اند.</p>
</section>
