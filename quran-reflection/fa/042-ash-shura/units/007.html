  <p class="farsi-verse">و چنین قرآنی عربی به تو وحی کردیم تا مادر شهرها و کسانی را که پیرامون آن‌اند هشدار دهی و از روز گردآمدن که هیچ تردیدی در آن نیست هشدار دهی؛ گروهی در بهشت و گروهی در آتش افروخته‌اند.</p>
