  <p class="farsi-verse">به پروردگارتان پاسخ دهید پیش از آنکه روزی از سوی آن معبود یگانه بیاید که بازگرداندنی ندارد. آن روز نه پناهگاهی دارید و نه راه انکاری.</p>
