<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يُزَوِّجُهُم" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/">يُزَوِّجُهُم</button>
    <button class="word-link" type="button" data-word="ذُكرانًا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">ذُكرانًا</button>
    <button class="word-link" type="button" data-word="وَإِنٰثًا" data-root="أ ن ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَإِنٰثًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيَجعَلُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَيَجعَلُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    <button class="word-link" type="button" data-word="عَقيمًا" data-root="ع ق م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَقيمًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">عَليمٌ</button>
    <button class="word-link" type="button" data-word="قَديرٌ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">قَديرٌ</button>
  </p>
  <p class="farsi-verse">یا پسران و دختران را برایشان همراه می‌کند و هر که را بخواهد نازا می‌گرداند؛ او دانای تواناست.</p>
</section>
