    <button class="word-link" type="button" data-word="يَشَإِ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشَإِ</button>

  </p>
  <p class="farsi-verse">یا می‌گویند: بر آن معبود یگانه دروغ بسته است؟ پس اگر آن معبود یگانه بخواهد، بر دلت مهر می‌نهد؛ و آن معبود یگانه باطل را می‌زداید و حق را با کلماتش استوار می‌کند. او به آنچه در سینه‌هاست داناست.</p>
