  <p class="farsi-verse">یا شریکانی دارند که از دین چیزی برایشان مقرر کرده‌اند که آن معبود یگانه به آن اجازه نداده است؟ و اگر سخن جدایی نبود، میان آنان داوری می‌شد؛ و ستمکاران عذابی دردناک دارند.</p>
