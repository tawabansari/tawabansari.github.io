<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَستَجيبُ" data-root="ج و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَستَجيبُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="وَيَزيدُهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/">وَيَزيدُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/">فَضلِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالكٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">وَالكٰفِرونَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/">عَذابٌ</button>
    <button class="word-link" type="button" data-word="شَديدٌ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/">شَديدٌ</button>
  </p>
  <p class="farsi-verse">و به کسانی که ایمان آورده و کارهای شایسته کرده‌اند پاسخ می‌دهد و از فضل خود بر آنان می‌افزاید؛ و کافران عذابی سخت دارند.</p>
