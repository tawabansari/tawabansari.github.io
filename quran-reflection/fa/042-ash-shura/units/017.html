  <h2 class="ayah-title">الشوری ۴۲:۱۷</h2>

    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/">أَنزَلَ</button>

    <button class="word-link" type="button" data-word="وَالميزانَ" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار">وَالميزانَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>

  <p class="farsi-verse">آن معبود یگانه است که کتاب را به حق و میزان را نازل کرد. و چه می‌دانی؟ شاید ساعت نزدیک باشد.</p>
