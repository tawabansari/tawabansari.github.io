  <p class="farsi-verse">پس هرچه به شما داده شده، بهره زندگی دنیاست؛ و آنچه نزد آن معبود یگانه است برای کسانی که ایمان آورده‌اند و بر پروردگارشان توکل می‌کنند بهتر و پایدارتر است،</p>
