<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="أوتيتُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="داده شده‌اید؛ بهره‌هایی که در زندگی در اختیار مخاطبان است.">أوتيتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه؛ و «شیء»، چیز یا امری که از آن سخن می‌رود." data-context="چیزی؛ هر بهره‌ای که موضوع جمله است.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="فَمَتٰعُ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="پس بهره و برخورداری؛ امکانات زندگیِ گذرا.">فَمَتٰعُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی؛ در ترکیب زندگی دنیا.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="دنیا؛ زندگی این‌جهانی در مقایسه با آنچه نزد اوست.">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ برتری آنچه نزد آن معبود یگانه است.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="ب ق ي" data-root-meaning="«ب ق ي» به ادامه داشتن و از میان نرفتن چیزی در برابر پایان یافتن، زوال یا از دست رفتن آن اشاره دارد. در ساختمان‌های سببی، به باقی گذاشتن و حفظ کردن می‌رسد؛ در صورت‌های وصفی، ماندگاری و بازماندن را بیان می‌کند؛ و در اسم «بقية»، به آنچه از یک مجموعه، رابطه یا مایه ارزشمند همچنان بر جا مانده است اشاره دارد." data-context="ماندگارتر؛ آنچه نزد آن معبود یگانه برای اهل ایمان و توکل است." data-learn-more="/quran-terminology/fa/roots/b-q-y/">وَأَبقىٰ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ کسانی که وعدهٔ آیه به آنان مربوط است.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ مرجع اعتمادِ مؤمنان.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="يَتَوَكَّلونَ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار." data-context="توکل می‌کنند؛ اعتماد و سپردن کار به پروردگار.">يَتَوَكَّلونَ</button>
  </p>
  <p class="farsi-verse">پس هرچه به شما داده شده، بهره زندگی دنیاست؛ و آنچه نزد آن معبود یگانه است برای کسانی که ایمان آورده‌اند و بر پروردگارشان توکل می‌کنند بهتر و پایدارتر است،</p>
</section>
