<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَستَعجِلُ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله" data-context="شتاب می‌خواهند؛ فرا رسیدن آن را زودتر طلب می‌کنند.">يَستَعجِلُ</button>
    <button class="word-link" type="button" data-word="بِهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان ندارند؛ آن ساعت را نمی‌پذیرند.">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اند؛ کسانی که باور پذیرفته دارند.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="مُشفِقونَ" data-root="ش ف ق" data-learn-more="/quran-terminology/fa/roots/sh-f-q/" data-root-meaning="شفق: روشنایی و سرخی افق پس از غروب؛ اشفاق: بیم و نگرانی، و در بعضی کاربردها دلسوزی و مراقبت برای دیگری." data-context="بیمناکند؛ از آن ساعت با نگرانی آگاهانه می‌هراسند.">مُشفِقونَ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="وَيَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و می‌دانند؛ از حق بودن آن آگاه‌اند.">وَيَعلَمونَ</button>
    <button class="word-link" type="button" data-word="أَنَّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهَا</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ واقعیتی ثابت و انکارناپذیر.">الحَقُّ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُمارونَ" data-root="م ر ي" data-learn-more="/quran-terminology/fa/roots/m-r-y/" data-root-meaning="تردید، دودلی و مجادله؛ از بیرون کشیدن شیر تا کشمکش بر سر حقیقت و مرز میان پرسش و مراء در قرآن" data-context="جدال می‌کنند؛ درباره آن ساعت به ستیزه می‌پردازند.">يُمارونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السّاعَةِ" data-root="س و ع" data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="بخشی از زمان و هنگام معین؛ «السّاعة» در سیاق رستاخیز، ساعت موعود است. «سواع» نام خاص معبود است و منشأ اشتقاقی آن قطعی نیست." data-context="آن ساعت؛ رخداد موعود موضوع جدال آنان.">السّاعَةِ</button>
    <button class="word-link" type="button" data-word="لَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَفى</button>
    <button class="word-link" type="button" data-word="ضَلٰلٍ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه" data-context="گمراهی؛ دورشدن از راه شناخت درست.">ضَلٰلٍ</button>
    <button class="word-link" type="button" data-word="بَعيدٍ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="دور؛ وصف شدت فاصله از راه درست.">بَعيدٍ</button>
  </p>
  <p class="farsi-verse">کسانی که به آن ایمان ندارند آن را به شتاب می‌خواهند؛ و کسانی که ایمان آورده‌اند از آن بیمناکند و می‌دانند که حق است. آگاه باشید، کسانی که درباره ساعت جدال می‌کنند در گمراهی دوری‌اند.</p>
</section>
