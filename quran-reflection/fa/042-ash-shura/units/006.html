<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِهِ</button>
    <button class="word-link" type="button" data-word="أَولِياءَ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">أَولِياءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="حَفيظٌ" data-root="ح ف ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-f-zha/" data-root-meaning="نگهداری، مراقبت، به خاطر سپردن و از آسیب محفوظ داشتن.">حَفيظٌ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِوَكيلٍ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">بِوَكيلٍ</button>
  </p>
  <p class="farsi-verse">و کسانی که جز او سرپرستانی گرفته‌اند، آن معبود یگانه نگاهبان آنان است و تو کارگزار آنان نیستی.</p>
</section>
