  <p class="farsi-verse">هر که کشت آخرت را بخواهد، بر کشتش می‌افزاییم؛ و هر که کشت دنیا را بخواهد، از آن به او می‌دهیم و در آخرت هیچ بهره‌ای ندارد.</p>
