<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يوحى" data-root="و ح ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يوحى</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="وَإِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری">العَزيزُ</button>
    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">الحَكيمُ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه، توانمند حکیم، چنین به تو و به کسانی که پیش از تو بودند وحی می‌کند.</p>
