  <h2 class="ayah-title">الشوری ۴۲:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَصٰبَكُم" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">أَصٰبَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مُصيبَةٍ" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">مُصيبَةٍ</button>
    <button class="word-link" type="button" data-word="فَبِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَبِما</button>
    <button class="word-link" type="button" data-word="كَسَبَت" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان">كَسَبَت</button>
    <button class="word-link" type="button" data-word="أَيديكُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">أَيديكُم</button>
    <button class="word-link" type="button" data-word="وَيَعفوا" data-root="ع ف و" data-learn-more="/quran-terminology/fa/roots/ayn-f-w/" data-root-meaning="گذشتن از پیگیری خطا، برداشتن مؤاخذه، محوشدن اثر، و آنچه افزون بر نیاز باقی می‌ماند">وَيَعفوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="كَثيرٍ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">كَثيرٍ</button>
  </p>
  <p class="farsi-verse">و هر مصیبتی که به شما برسد، به سبب آن چیزی است که دست‌هایتان به دست آورده است، و از بسیاری درمی‌گذرد.</p>
