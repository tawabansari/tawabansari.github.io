    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/">الصَّلوٰةَ</button>

  <p class="farsi-verse">و کسانی که به پروردگارشان پاسخ داده و صلات را برپا داشته‌اند و کارشان با مشورت میان خودشان است و از آنچه روزی‌شان داده‌ایم انفاق می‌کنند،</p>
