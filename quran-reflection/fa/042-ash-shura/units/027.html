<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="بَسَطَ" data-root="ب س ط" data-root-meaning="گشودن، گستردن و امتداد دادن؛ در کاربردهای گوناگون، گشایش روزی یا وسعت دانش و توانایی نیز از سیاق روشن می‌شود." data-context="فراخ می‌ساخت؛ فعل ماضی در جملهٔ شرطی دربارهٔ گسترش روزی بندگان." data-learn-more="/quran-terminology/fa/roots/b-s-tt/">بَسَطَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الرِّزقَ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="روزی؛ موضوعِ گشایش در جملهٔ شرطی.">الرِّزقَ</button>
    <button class="word-link" type="button" data-word="لِعِبادِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="برای بندگانش؛ دریافت‌کنندگانِ فرض‌شدهٔ گشایش روزی.">لِعِبادِهِ</button>
    <button class="word-link" type="button" data-word="لَبَغَوا" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="از حد می‌گذشتند؛ پیامدِ شرطیِ گشایش یادشده.">لَبَغَوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ عرصهٔ تجاوز از حد.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="يُنَزِّلُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="فرو می‌فرستد؛ بخشیدن به اندازهٔ آنچه بخواهد.">يُنَزِّلُ</button>
    <button class="word-link" type="button" data-word="بِقَدَرٍ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="به اندازه؛ حد و میزانِ فرو فرستادن.">بِقَدَرٍ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهد؛ متعلقِ آنچه به اندازه فرو می‌فرستد.">يَشاءُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِعِبادِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="از بندگانش؛ متعلقِ آگاهی و بینایی او.">بِعِبادِهِ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="آگاه؛ وصف او در شناخت بندگان." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینا؛ وصف او نسبت به بندگان.">بَصيرٌ</button>
  </p>
  <p class="farsi-verse">و اگر آن معبود یگانه روزی را برای بندگانش می‌گسترد، در زمین سرکشی می‌کردند؛ ولی آنچه را بخواهد به اندازه فرو می‌فرستد. او به بندگانش آگاه و بیناست.</p>
</section>
