<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَزٰؤُا۟" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/">وَجَزٰؤُا۟</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٍ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">سَيِّئَةٍ</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="مِثلُها" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مِثلُها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="عَفا" data-root="ع ف و" data-learn-more="/quran-terminology/fa/roots/ayn-f-w/">عَفا</button>
    <button class="word-link" type="button" data-word="وَأَصلَحَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/">وَأَصلَحَ</button>
    <button class="word-link" type="button" data-word="فَأَجرُهُ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/">فَأَجرُهُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و جزای بدی، بدی‌ای مانند آن است؛ پس هر که ببخشد و اصلاح کند، پاداشش بر آن معبود یگانه است؛ او ستمکاران را دوست ندارد.</p>
</section>
