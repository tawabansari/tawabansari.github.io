<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">الشوری ۴۲:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَزٰؤُا۟" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="و کیفر">وَجَزٰؤُا۟</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٍ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی">سَيِّئَةٍ</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌ای">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="مِثلُها" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="همانند آن">مِثلُها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="عَفا" data-root="ع ف و" data-learn-more="/quran-terminology/fa/roots/ayn-f-w/" data-root-meaning="گذشتن از پیگیری خطا، برداشتن مؤاخذه، محوشدن اثر، و آنچه افزون بر نیاز باقی می‌ماند" data-context="گذشت">عَفا</button>
    <button class="word-link" type="button" data-word="وَأَصلَحَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="و اصلاح کرد">وَأَصلَحَ</button>
    <button class="word-link" type="button" data-word="فَأَجرُهُ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل" data-context="پس پاداش او">فَأَجرُهُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دوست ندارد">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگران">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و جزای بدی، بدی‌ای مانند آن است؛ پس هر که ببخشد و اصلاح کند، پاداشش بر آن معبود یگانه است؛ او ستمکاران را دوست ندارد.</p>
</section>
