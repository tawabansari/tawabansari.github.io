<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">الماعون ۱۰۷:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يَدُعُّ" data-root="د ع ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-ayn-ayn/" data-root-meaning="راندن و پس زدن با خشونت.">يَدُعُّ</button>
    <button class="word-link" type="button" data-word="اليَتيمَ" data-root="ي ت م" data-learn-more="/quran-terminology/fa/roots/y-t-m/" data-root-meaning="فقدان پدر، وضعیت یتیم و مسئولیت در برابر حقوق او">اليَتيمَ</button>
  </p>
  <p class="farsi-verse">او همان کسی است که یتیم را می‌راند،</p>
