    ۚ

  <p class="farsi-verse">کسانی که فرشتگان جانشان را می‌گیرند در حالی که به خود ستم کرده‌اند، به آنان می‌گویند: «در چه حالی بودید؟» می‌گویند: «در زمین به ناتوانی کشیده شده بودیم.» می‌گویند: «آیا زمین آن معبود یگانه گسترده نبود تا در آن هجرت کنید؟» پس جایگاه آنان جهنم است؛ و بد سرانجامی است.</p>
