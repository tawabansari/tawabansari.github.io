<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالّٰتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالّٰتى</button>
    <button class="word-link" type="button" data-word="يَأتينَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="انجام می‌دهند؛ فاحشه را">يَأتينَ</button>
    <button class="word-link" type="button" data-word="الفٰحِشَةَ" data-root="ف ح ش" data-root-meaning="زشتی و ناپسندی شدید؛ فراتر رفتن رفتار یا سخن از حد پسندیده و قابل قبول." data-context="آن کار بسیار زشت؛ در سیاق رسیدگی با گواهی چهار نفر." data-learn-more="/quran-terminology/fa/roots/f-h-sh/">الفٰحِشَةَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نِسائِكُم" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنان شما">نِسائِكُم</button>
    <button class="word-link" type="button" data-word="فَاستَشهِدوا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="پس گواهی بخواهید">فَاستَشهِدوا</button>
    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِنَّ</button>
    <button class="word-link" type="button" data-word="أَربَعَةً" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی" data-context="چهار؛ شمار گواهان">أَربَعَةً</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="شَهِدوا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهی دادند">شَهِدوا</button>
    <button class="word-link" type="button" data-word="فَأَمسِكوهُنَّ" data-root="م س ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-k/" data-root-meaning="گرفتن، نگه داشتن و محکم چنگ زدن." data-context="پس آنان را نگه دارید">فَأَمسِكوهُنَّ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="البُيوتِ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه‌ها" data-learn-more="/quran-terminology/fa/roots/b-y-t/">البُيوتِ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يَتَوَفّىٰهُنَّ" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="جانشان را بگیرد؛ مرگ">يَتَوَفّىٰهُنَّ</button>
    <button class="word-link" type="button" data-word="المَوتُ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرگ؛ فاعلِ توفّی">المَوتُ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يَجعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار دهد؛ راهی">يَجعَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَهُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُنَّ</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راهی؛ راهِ گشایش">سَبيلًا</button>
  </p>
  <p class="farsi-verse">و از زنانتان آنان که کار زشت می‌کنند، چهار تن از خودتان بر آنان گواه بگیرید. پس اگر گواهی دادند، آنان را در خانه‌ها نگاه دارید تا مرگشان فرا رسد یا آن معبود یگانه راهی برایشان قرار دهد.</p>
</section>
