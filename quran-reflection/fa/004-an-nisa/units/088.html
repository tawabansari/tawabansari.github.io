    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>

  </p>
  <p class="farsi-verse">پس شما را چه شده است که درباره منافقان دو گروه شده‌اید، در حالی که آن معبود یگانه آنان را به سبب آنچه کسب کرده‌اند واژگون کرده است؟ آیا می‌خواهید کسی را هدایت کنید که آن معبود یگانه گمراه کرده است؟ و هر که را آن معبود یگانه گمراه کند، هرگز برای او راهی نخواهی یافت.</p>
