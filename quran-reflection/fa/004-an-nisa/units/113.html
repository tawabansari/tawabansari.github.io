  <p class="farsi-verse">و اگر فضل آن معبود یگانه و رحمتش بر تو نبود، گروهی از آنان قصد می‌کردند تو را گمراه کنند؛ و جز خودشان را گمراه نمی‌کنند و هیچ زیانی به تو نمی‌رسانند. و آن معبود یگانه کتاب و حکمت را بر تو نازل کرد و آنچه را نمی‌دانستی به تو آموخت؛ و فضل آن معبود یگانه بر تو بزرگ است.</p>
