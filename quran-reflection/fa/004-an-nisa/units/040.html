  <p class="farsi-verse">همانا آن معبود یگانه به اندازه وزن ذره‌ای ستم نمی‌کند؛ و اگر کار نیکی باشد، آن را چند برابر می‌کند و از نزد خود پاداشی بزرگ می‌دهد.</p>
