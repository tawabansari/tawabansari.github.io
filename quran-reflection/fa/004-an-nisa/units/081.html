    <button class="word-link" type="button" data-word="بَرَزوا" data-root="ب ر ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَرَزوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>

    <button class="word-link" type="button" data-word="بَيَّتَ" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/">بَيَّتَ</button>

    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">غَيرَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>

    <button class="word-link" type="button" data-word="يَكتُبُ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">يَكتُبُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يُبَيِّتونَ" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/">يُبَيِّتونَ</button>

    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="وَتَوَكَّل" data-root="و ك ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَتَوَكَّل</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>

    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/" data-root-meaning="کفایت و بسندگی؛ از برآوردن نیاز و بر عهده گرفتن کار دیگری تا کفایت آن معبود یگانه در گواهی، حسابرسی، یاری و حفاظت">وَكَفىٰ</button>

    <button class="word-link" type="button" data-word="وَكيلًا" data-root="و ك ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَكيلًا</button>
  </p>
  <p class="farsi-verse">و می‌گویند: «فرمان‌برداریم»؛ پس چون از نزد تو بیرون می‌روند، گروهی از آنان شبانه چیزی جز آنچه تو می‌گویی تدبیر می‌کنند. و آن معبود یگانه آنچه را شبانه تدبیر می‌کنند می‌نویسد. پس از آنان روی بگردان و بر آن معبود یگانه توکل کن؛ و آن معبود یگانه برای کارسازی کافی است.</p>
</section>
