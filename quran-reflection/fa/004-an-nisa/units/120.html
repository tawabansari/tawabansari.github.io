<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعِدُهُم" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">يَعِدُهُم</button>
    <button class="word-link" type="button" data-word="وَيُمَنّيهِم" data-root="م ن ي" data-learn-more="/quran-terminology/fa/roots/m-n-y/" data-root-meaning="از تقدیر و آرزو تا تلاوت، امانی و منی">وَيُمَنّيهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَعِدُهُمُ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">يَعِدُهُمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="غُرورًا" data-root="غ ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غُرورًا</button>
  </p>
  <p class="farsi-verse">به آنان وعده می‌دهد و به آرزوها می‌اندازد؛ و شیطان جز فریب به آنان وعده نمی‌دهد.</p>
