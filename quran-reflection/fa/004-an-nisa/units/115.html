  <p class="farsi-verse">و هر که پس از آنکه هدایت برایش روشن شده با رسول مخالفت کند و از راهی جز راه مؤمنان پیروی کند، او را به آنچه بدان رو کرده وامی‌گذاریم و در جهنم می‌سوزانیم؛ و بد سرانجامی است.</p>
