<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَكسِب" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان" data-context="مرتکب شود؛ خطا یا گناهی را از راه کردار خود به دست آورد.">يَكسِب</button>
    <button class="word-link" type="button" data-word="خَطيـَٔةً" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/" data-root-meaning="لغزیدن از مسیر درست، به هدف نخوردن، خطا رفتن؛ و در برخی صورت‌ها، انحراف آگاهانه از حق." data-context="خطایی؛ عملی که ابتدا به شخصِ مرتکب تعلق دارد.">خَطيـَٔةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="إِثمًا" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="گناهی؛ در کنار خطا، موضوعِ عملِ مرتکب.">إِثمًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَرمِ" data-root="ر م ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-m-y/" data-root-meaning="افکندن و پرتاب کردن؛ مجازاً نسبت و اتهام دادن." data-context="نسبت دهد؛ خطا یا گناه خود را به دیگری بیفکند.">يَرمِ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="بَريـًٔا" data-root="ب ر أ" data-learn-more="/quran-terminology/fa/roots/b-r-a/" data-root-meaning="پدیدآوردن، رهاشدن از بیماری یا نسبت، پاک‌بودن از اتهام، و اعلام برائت" data-context="بی‌گناهی؛ کسی که از همان عملِ نسبت‌داده‌شده بری است.">بَريـًٔا</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="احتَمَلَ" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری." data-context="بر دوش گرفته است؛ بار مسئولیتِ بهتان و گناه.">احتَمَلَ</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="ب ه ت" data-root-meaning="«ب ه ت» در یک شاخه به حیرت و درماندگی انسان در برابر امری تکان‌دهنده یا حجتی پاسخ‌ناپذیر اشاره دارد؛ و در شاخه دیگر، «بُهْتَان» به دروغ و نسبت ناروایی گفته می‌شود که حقیقت را وارونه نشان می‌دهد و می‌تواند شخصی بی‌گناه را در معرض اتهام یا آسیب قرار دهد." data-context="بهتانی؛ نسبت دادن خطا یا گناه خود به انسانی که از آن بری است." data-learn-more="/quran-terminology/fa/roots/b-h2-t/">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="وَإِثمًا" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="و گناه؛ مسئولیتی که افزون بر بهتان بر دوش شخص قرار می‌گیرد.">وَإِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصفِ گناهِ نسبت ناروا به بی‌گناه.">مُبينًا</button>
  </p>
  <p class="farsi-verse">و هر که خطایی یا گناهی کسب کند، سپس آن را به بی‌گناهی نسبت دهد، بهتان و گناهی آشکار بر دوش گرفته است.</p>
</section>
