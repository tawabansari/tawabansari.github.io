  <p class="farsi-verse">همانا آن معبود یگانه اینکه چیزی شریک او قرار داده شود نمی‌آمرزد، و جز آن را برای هر که بخواهد می‌آمرزد. و هر که چیزی را شریک آن معبود یگانه قرار دهد، گناهی بزرگ برساخته است.</p>
