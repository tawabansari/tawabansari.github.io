  <p class="farsi-verse">و آنچه در آسمان‌ها و آنچه در زمین است از آنِ آن معبود یگانه است. و به کسانی که پیش از شما کتاب داده شدند و به شما سفارش کردیم که از آن معبود یگانه پروا کنید. و اگر انکار کنید، آنچه در آسمان‌ها و آنچه در زمین است از آنِ آن معبود یگانه است؛ و آن معبود یگانه بی‌نیاز و ستوده است.</p>
