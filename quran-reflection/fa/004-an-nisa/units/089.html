  <p class="farsi-verse">آرزو دارند که شما انکار کنید همان‌گونه که آنان انکار کردند، تا برابر شوید. پس از آنان سرپرستانی نگیرید تا در راه آن معبود یگانه هجرت کنند. پس اگر روی گرداندند، آنان را بگیرید و هر جا یافتید بکشید؛ و از آنان نه سرپرستی بگیرید و نه یاوری.</p>
