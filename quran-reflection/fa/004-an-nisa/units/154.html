  <p class="farsi-verse">و به سبب پیمانشان، کوه را بالای آنان برافراشتیم و به آنان گفتیم: «سجده‌کنان از در وارد شوید»؛ و به آنان گفتیم: «در سبت تجاوز نکنید»؛ و از آنان پیمانی استوار گرفتیم.</p>
