<section class="ayah-block" id="ayah-154" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَرَفَعنا" data-root="ر ف ع" data-learn-more="/quran-terminology/fa/roots/r-f-ayn/" data-root-meaning="بالا بردن، بلند کردن و برافراشتن؛ از سطح یا مرتبه‌ای پایین‌تر به جایگاهی بالاتر">وَرَفَعنا</button>
    <button class="word-link" type="button" data-word="فَوقَهُمُ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد">فَوقَهُمُ</button>
    <button class="word-link" type="button" data-word="الطّورَ" data-root="ط و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الطّورَ</button>
    <button class="word-link" type="button" data-word="بِميثٰقِهِم" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست">بِميثٰقِهِم</button>
    <button class="word-link" type="button" data-word="وَقُلنا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقُلنا</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="ادخُلُوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">ادخُلُوا</button>
    <button class="word-link" type="button" data-word="البابَ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون.">البابَ</button>
    <button class="word-link" type="button" data-word="سُجَّدًا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">سُجَّدًا</button>
    <button class="word-link" type="button" data-word="وَقُلنا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقُلنا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعدوا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">تَعدوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّبتِ" data-root="س ب ت" data-learn-more="/quran-terminology/fa/roots/s-b-t/" data-root-meaning="توقف، بازایستادن، قطع فعالیت و دست کشیدن از کار؛ از سبت تاریخی تا سبات خواب.">السَّبتِ</button>
    <button class="word-link" type="button" data-word="وَأَخَذنا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">وَأَخَذنا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="ميثٰقًا" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست">ميثٰقًا</button>
    <button class="word-link" type="button" data-word="غَليظًا" data-root="غ ل ظ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَليظًا</button>
  </p>
  <p class="farsi-verse">و به سبب پیمانشان، کوه را بالای آنان برافراشتیم و به آنان گفتیم: «سجده‌کنان از در وارد شوید»؛ و به آنان گفتیم: «در سبت تجاوز نکنید»؛ و از آنان پیمانی استوار گرفتیم.</p>
</section>
