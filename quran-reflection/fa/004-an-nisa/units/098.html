<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۹۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="المُستَضعَفينَ" data-root="ض ع ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المُستَضعَفينَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الرِّجالِ" data-root="ر ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الرِّجالِ</button>
    <button class="word-link" type="button" data-word="وَالنِّساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن">وَالنِّساءِ</button>
    <button class="word-link" type="button" data-word="وَالوِلدٰنِ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">وَالوِلدٰنِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="حيلَةً" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها">حيلَةً</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَهتَدونَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهتَدونَ</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلًا</button>
  </p>
  <p class="farsi-verse">مگر مردان و زنان و کودکان ناتوان‌شده‌ای که هیچ چاره‌ای نمی‌توانند و راهی نمی‌یابند.</p>
</section>
