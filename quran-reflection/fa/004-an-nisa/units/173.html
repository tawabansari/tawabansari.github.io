<section class="ayah-block" id="ayah-173" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ وصف گروه نخست در برابر استنکاف‌کنندگان.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="و کار انجام دادند؛ همراه با صفت شایسته برای کردار آنان.">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="کارهای شایسته؛ کردار گروه مؤمنان.">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="فَيُوَفّيهِم" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="پس پاداششان را به‌تمامی می‌دهد، بی‌آنکه از آن بکاهد.">فَيُوَفّيهِم</button>
    <button class="word-link" type="button" data-word="أُجورَهُم" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل" data-context="پاداش‌های آنان برای ایمان و کردار شایسته.">أُجورَهُم</button>
    <button class="word-link" type="button" data-word="وَيَزيدُهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="و بر پاداش و بهرهٔ آنان می‌افزاید.">وَيَزيدُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="از فضل و بخشش افزودهٔ او.">فَضلِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="استَنكَفوا" data-root="ن ك ف" data-learn-more="/quran-terminology/fa/roots/n-k-f/" data-root-meaning="کنار زدن و دور ساختن؛ استنکاف، سر باز زدن از کار یا جایگاهی است که شخص آن را برای خود مایهٔ عار یا نامناسب می‌داند." data-context="سر باز زدند؛ در سیاق آیه، از بندگی او امتناع کردند.">استَنكَفوا</button>
    <button class="word-link" type="button" data-word="وَاستَكبَروا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="و تکبر کردند؛ خود را فراتر از پذیرش بندگی دانستند.">وَاستَكبَروا</button>
    <button class="word-link" type="button" data-word="فَيُعَذِّبُهُم" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="پس آنان را کیفر می‌دهد؛ پیامد رفتار گروه دوم.">فَيُعَذِّبُهُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="کیفر و عذاب؛ مفعول هم‌ریشه با فعل پیشین.">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد" data-context="دردناک؛ وصف عذابی که یاد شده است.">أَليمًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَجِدونَ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="می‌یابند؛ با نفی پیشین، نیافتن سرپرست و یاور را بیان می‌کند.">يَجِدونَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="جز و جدا از؛ در ترکیب «مِنْ دُونِ اللَّهِ».">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلِيًّا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="سرپرست و پشتیبانی که آنان را نگاه دارد.">وَلِيًّا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="نَصيرًا" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="یاوری که به آنان کمک کند و از کیفر برهاند.">نَصيرًا</button>
  </p>
  <p class="farsi-verse">پس کسانی که ایمان آوردند و کارهای شایسته کردند، پاداش‌هایشان را به‌تمامی به آنان می‌دهد و از فضلش بر آنان می‌افزاید. و اما کسانی که سر باز زدند و تکبر کردند، آنان را به عذابی دردناک عذاب می‌کند؛ و برای خود جز آن معبود یگانه نه سرپرستی می‌یابند و نه یاوری.</p>
</section>
