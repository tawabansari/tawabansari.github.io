  <p class="farsi-verse">پس کسانی که ایمان آوردند و کارهای شایسته کردند، پاداش‌هایشان را به‌تمامی به آنان می‌دهد و از فضلش بر آنان می‌افزاید. و اما کسانی که سر باز زدند و تکبر کردند، آنان را به عذابی دردناک عذاب می‌کند؛ و برای خود جز آن معبود یگانه نه سرپرستی می‌یابند و نه یاوری.</p>
