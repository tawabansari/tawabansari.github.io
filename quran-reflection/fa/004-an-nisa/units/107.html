<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۰۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُجٰدِل" data-root="ج د ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-l/" data-root-meaning="محکم تابیدن و استوار ساختن؛ جدال: رویارویی و کشاکش گفتاری یا استدلالی." data-context="دفاع و مجادله مکن">تُجٰدِل</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَختانونَ" data-root="خ و ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-n/" data-root-meaning="خیانت و نقض امانت یا پیمان." data-context="خیانت می‌کنند">يَختانونَ</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خودشان">أَنفُسَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دوست ندارد">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد">كانَ</button>
    <button class="word-link" type="button" data-word="خَوّانًا" data-root="خ و ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-n/" data-root-meaning="خیانت و نقض امانت یا پیمان." data-context="بسیار خیانت‌کار">خَوّانًا</button>
    <button class="word-link" type="button" data-word="أَثيمًا" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="گناهکار">أَثيمًا</button>
  </p>
  <p class="farsi-verse">و از کسانی که به خود خیانت می‌کنند دفاع مکن. همانا آن معبود یگانه کسی را که خیانت‌پیشه و گناهکار باشد دوست ندارد.</p>
</section>
