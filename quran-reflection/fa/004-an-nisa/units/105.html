<section class="ayah-block" id="ayah-105" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۰۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَنزَلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="کتاب را به سوی تو نازل کردیم.">أَنزَلنا</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابِ نازل‌شده که مبنای داوری به حق قرار می‌گیرد.">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="به حق و بر پایهٔ حقیقت؛ وصفِ نزول کتاب.">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="لِتَحكُمَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="تا میان مردم داوری کنی.">لِتَحكُمَ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان مردم؛ نسبتِ داوری به طرف‌های گوناگون.">بَينَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردمی که داوری میان آنان انجام می‌شود.">النّاسِ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="أَرىٰكَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آنچه خداوند به تو نشان داده یا شناسانده است؛ مبنای داوری.">أَرىٰكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="مباش؛ نهی از قرار گرفتن در نقش مدافع خیانت‌کاران.">تَكُن</button>
    <button class="word-link" type="button" data-word="لِلخائِنينَ" data-root="خ و ن" data-root-meaning="کاستن و نقصان؛ در رفتار انسان، نقض اعتماد، امانت یا وفاداری و ضایع کردن حقی که باید رعایت می‌شد." data-context="به سود خیانت‌کاران؛ کسانی که نباید از خیانتشان دفاع کرد." data-learn-more="/quran-terminology/fa/roots/kh-w-n/">لِلخائِنينَ</button>
    <button class="word-link" type="button" data-word="خَصيمًا" data-root="خ ص م" data-root-meaning="رویارویی و مخاصمهٔ دو طرف بر سر ادعا، حق یا موضوعی مورد اختلاف؛ خصم: طرف دعوا." data-context="طرف دعوا و مدافع؛ نهی از دفاع و مخاصمه به سود خیانت‌کاران." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/">خَصيمًا</button>
  </p>
  <p class="farsi-verse">ما کتاب را به‌حق به سوی تو نازل کردیم تا میان مردم بر پایه آنچه آن معبود یگانه به تو نشان داده داوری کنی؛ و مدافع خیانتکاران مباش.</p>
</section>
