  <p class="farsi-verse">و شما را چه شده است که در راه آن معبود یگانه و مردان و زنان و کودکان به‌ناتوانی‌کشیده‌شده نمی‌جنگید؛ همان کسانی که می‌گویند: «پروردگارا، ما را از این آبادی که مردمش ستمگرند بیرون ببر، و از نزد خود برای ما سرپرستی قرار ده و از نزد خود برای ما یاوری قرار ده»؟</p>
