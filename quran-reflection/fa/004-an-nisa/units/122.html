<section class="ayah-block" id="ayah-122" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="سَنُدخِلُهُم" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">سَنُدخِلُهُم</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند">الأَنهٰرُ</button>
    <button class="word-link" type="button" data-word="خٰلِدينَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه">خٰلِدينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="أَبَدًا" data-root="أ ب د" data-learn-more="/quran-terminology/fa/roots/a-b-d/" data-root-meaning="أَبَدًا؛ استمرار در سراسر آیندهٔ مورد نظر">أَبَدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَعدَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعدَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="حَقًّا" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">حَقًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَصدَقُ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">أَصدَقُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="قيلًا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قيلًا</button>
  </p>
  <p class="farsi-verse">و کسانی که ایمان آوردند و کارهای شایسته کردند، به‌زودی آنان را به باغ‌هایی وارد می‌کنیم که از زیرشان نهرها روان است؛ همواره در آن‌ها ماندگارند. وعده آن معبود یگانه حق است؛ و چه کسی از آن معبود یگانه در گفتار راستگوتر است؟</p>
</section>
