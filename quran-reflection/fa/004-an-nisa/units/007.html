<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلرِّجالِ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="برای مردان؛ صاحبان سهم یادشده.">لِلرِّجالِ</button>
    <button class="word-link" type="button" data-word="نَصيبٌ" data-root="ن ص ب" data-learn-more="/quran-terminology/fa/roots/n-sad-b/" data-root-meaning="برپا کردن و استقرار؛ نَصَب و نُصْب، رنج و خستگی؛ نَصیب، سهم و بهره؛ نُصُب و انصاب، نشان‌ها یا سنگ‌های برپا شده." data-context="سهمی برای مردان از مالِ به‌جامانده.">نَصيبٌ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَرَكَ" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی" data-context="بر جا گذاشته‌اند؛ مال باقی‌مانده از درگذشتگان.">تَرَكَ</button>
    <button class="word-link" type="button" data-word="الوٰلِدانِ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="پدر و مادر؛ کسانی که مالی بر جا گذاشته‌اند.">الوٰلِدانِ</button>
    <button class="word-link" type="button" data-word="وَالأَقرَبونَ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="و نزدیکان؛ خویشاوندانی که مالی بر جا گذاشته‌اند.">وَالأَقرَبونَ</button>
    <button class="word-link" type="button" data-word="وَلِلنِّساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="و برای زنان؛ صاحبان سهم در بخش دوم جمله.">وَلِلنِّساءِ</button>
    <button class="word-link" type="button" data-word="نَصيبٌ" data-root="ن ص ب" data-learn-more="/quran-terminology/fa/roots/n-sad-b/" data-root-meaning="برپا کردن و استقرار؛ نَصَب و نُصْب، رنج و خستگی؛ نَصیب، سهم و بهره؛ نُصُب و انصاب، نشان‌ها یا سنگ‌های برپا شده." data-context="سهمی برای زنان از مالِ به‌جامانده.">نَصيبٌ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَرَكَ" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی" data-context="بر جا گذاشته‌اند؛ دربارهٔ داراییِ به‌جامانده.">تَرَكَ</button>
    <button class="word-link" type="button" data-word="الوٰلِدانِ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="پدر و مادر؛ در بیان سهم زنان.">الوٰلِدانِ</button>
    <button class="word-link" type="button" data-word="وَالأَقرَبونَ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="و نزدیکان؛ خویشاوندان در بیان سهم زنان.">وَالأَقرَبونَ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="قَلَّ" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندک باشد؛ دربارهٔ مقدار مال به‌جامانده.">قَلَّ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="كَثُرَ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بسیار باشد؛ دربارهٔ مقدار مال به‌جامانده.">كَثُرَ</button>
    ۚ
    <button class="word-link" type="button" data-word="نَصيبًا" data-root="ن ص ب" data-learn-more="/quran-terminology/fa/roots/n-sad-b/" data-root-meaning="برپا کردن و استقرار؛ نَصَب و نُصْب، رنج و خستگی؛ نَصیب، سهم و بهره؛ نُصُب و انصاب، نشان‌ها یا سنگ‌های برپا شده." data-context="سهمی؛ همراه با «مفروض»، سهم مقرر را بیان می‌کند.">نَصيبًا</button>
    <button class="word-link" type="button" data-word="مَفروضًا" data-root="ف ر ض" data-learn-more="/quran-terminology/fa/roots/f-r-dad/" data-root-meaning="از نشانه‌گذاری و تعیین سهم تا امر مقرر" data-context="مقرر و تعیین‌شده؛ وصف سهم.">مَفروضًا</button>
  </p>
  <p class="farsi-verse">برای مردان سهمی از آنچه پدر و مادر و نزدیکان بر جا گذاشته‌اند هست، و برای زنان نیز سهمی از آنچه پدر و مادر و نزدیکان بر جا گذاشته‌اند؛ چه اندک باشد و چه بسیار؛ سهمی مقرر.</p>
</section>
