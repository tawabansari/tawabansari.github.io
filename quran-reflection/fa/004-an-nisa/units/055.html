  <h2 class="ayah-title">النساء ۴:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="ءامَنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="صَدَّ" data-root="ص د د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَدَّ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/" data-root-meaning="کفایت و بسندگی؛ از برآوردن نیاز و بر عهده گرفتن کار دیگری تا کفایت آن معبود یگانه در گواهی، حسابرسی، یاری و حفاظت">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِجَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِجَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="سَعيرًا" data-root="س ع ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَعيرًا</button>
  </p>
  <p class="farsi-verse">پس از آنان کسی به آن ایمان آورد و از آنان کسی از آن روی گرداند؛ و جهنم به‌عنوان آتشی افروخته کافی است.</p>
