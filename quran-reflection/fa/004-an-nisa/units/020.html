<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَرَدتُمُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="خواستید؛ ارادهٔ جایگزین کردن همسری با همسر دیگر.">أَرَدتُمُ</button>
    <button class="word-link" type="button" data-word="استِبدالَ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا." data-context="جایگزین کردن؛ گرفتن همسری به جای همسر دیگر.">استِبدالَ</button>
    <button class="word-link" type="button" data-word="زَوجٍ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="همسری؛ همسری که به جای دیگری اختیار می‌شود.">زَوجٍ</button>
    <button class="word-link" type="button" data-word="مَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="به جای؛ جایگاهِ همسر دیگر در ترکیبِ جایگزینی.">مَكانَ</button>
    <button class="word-link" type="button" data-word="زَوجٍ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="همسری دیگر؛ کسی که همسر تازه جای او را می‌گیرد.">زَوجٍ</button>
    <button class="word-link" type="button" data-word="وَءاتَيتُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="و داده‌اید؛ مالی که پیش‌تر به یکی از همسران داده شده است.">وَءاتَيتُم</button>
    <button class="word-link" type="button" data-word="إِحدىٰهُنَّ" data-root="أ ح د" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-context="یکی از آنان؛ یکی از همسرانِ مورد اشاره.">إِحدىٰهُنَّ</button>
    <button class="word-link" type="button" data-word="قِنطارًا" data-root="ق ن ط ر" data-root-meaning="قنطار؛ نام واحدی بزرگ از وزن که مقدار آن در نظام‌های تاریخی متفاوت بوده است؛ در کاربرد قرآنی، مقدار فراوان و قابل توجهی از مال یا دارایی." data-context="مالی فراوان؛ بدون تعیینِ مقدار عددیِ ثابت در این عبارت." data-learn-more="/quran-terminology/fa/roots/q-n-tt-r/">قِنطارًا</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَأخُذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="پس نگیرید؛ نهی از بازپس گرفتن چیزی از مالِ داده‌شده.">تَأخُذوا</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه؛ و «شیء»، چیز یا امری که از آن سخن می‌رود." data-context="چیزی؛ هر مقدار از مالِ داده‌شده در جملهٔ نهی.">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَتَأخُذونَهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="آیا پس می‌گیرید؛ پرسشِ نکوهشی دربارهٔ گرفتن مال.">أَتَأخُذونَهُ</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="ب ه ت" data-root-meaning="«ب ه ت» در یک شاخه به حیرت و درماندگی انسان در برابر امری تکان‌دهنده یا حجتی پاسخ‌ناپذیر اشاره دارد؛ و در شاخه دیگر، «بُهْتَان» به دروغ و نسبت ناروایی گفته می‌شود که حقیقت را وارونه نشان می‌دهد و می‌تواند شخصی بی‌گناه را در معرض اتهام یا آسیب قرار دهد." data-context="با بهتان و ادعای ناروا؛ در نکوهشِ بازپس گرفتن ناحقِ مالِ داده‌شده به زن." data-learn-more="/quran-terminology/fa/roots/b-h2-t/">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="وَإِثمًا" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="و گناه؛ مسئولیتِ ناروا بودنِ این گرفتن.">وَإِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصفِ گناهِ گرفتن ناحقِ مال.">مُبينًا</button>
  </p>
  <p class="farsi-verse">و اگر خواستید همسری را به جای همسری دیگر بگیرید و به یکی از آنان مال فراوانی داده‌اید، چیزی از آن بازنگیرید. آیا آن را با بهتان و گناهی آشکار می‌گیرید؟</p>
</section>
