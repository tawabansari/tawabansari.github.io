<section class="ayah-block" id="ayah-166" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لٰكِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لٰكِنِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَشهَدُ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/">يَشهَدُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَنزَلَهُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/">أَنزَلَهُ</button>
    <button class="word-link" type="button" data-word="بِعِلمِهِ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">بِعِلمِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالمَلٰئِكَةُ" data-root="أ ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/">وَالمَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="يَشهَدونَ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/">يَشهَدونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="شَهيدًا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/">شَهيدًا</button>
  </p>
  <p class="farsi-verse">ولی آن معبود یگانه به آنچه بر تو نازل کرده گواهی می‌دهد؛ آن را با دانش خود نازل کرده است؛ و فرشتگان گواهی می‌دهند. و آن معبود یگانه برای گواهی کافی است.</p>
