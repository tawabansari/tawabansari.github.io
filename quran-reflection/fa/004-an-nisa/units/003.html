<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="خِفتُم" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم داشته باشید که عدالت رعایت نشود.">خِفتُم</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تُقسِطوا" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است." data-context="در حق یتیمان عادلانه رفتار کنید؛ در ساخت نفی آمده است.">تُقسِطوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="اليَتٰمىٰ" data-root="ي ت م" data-learn-more="/quran-terminology/fa/roots/y-t-m/" data-root-meaning="فقدان پدر، وضعیت یتیم و مسئولیت در برابر حقوق او" data-context="یتیمان و رعایت حقوق آنان.">اليَتٰمىٰ</button>
    <button class="word-link" type="button" data-word="فَانكِحوا" data-root="ن ك ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-k-h/" data-root-meaning="نکاح: پیوند زناشویی یا آمیزش، با توجه به ساخت و سیاق." data-context="به همسری بگیرید؛ در سیاق شرط و مسئولیت.">فَانكِحوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="طابَ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="پسندیده و مناسب باشد.">طابَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنان؛ موضوع پیوند زناشویی در آیه.">النِّساءِ</button>
    <button class="word-link" type="button" data-word="مَثنىٰ" data-root="ث ن ي" data-root-meaning="دوتایی‌شدن، بازگرداندن و تکرار" data-context="دوتا دوتا؛ شمار توزیعی." data-learn-more="/quran-terminology/fa/roots/th-n-y/">مَثنىٰ</button>
    <button class="word-link" type="button" data-word="وَثُلٰثَ" data-root="ث ل ث" data-root-meaning="عدد سه و صورت‌های وابسته؛ شمار سه، جایگاه سوم، یک‌سوم و دوسوم، و توزیع سه‌تایی." data-context="سه‌تا سه‌تا؛ صورت توزیعیِ شمار در سیاق ازدواج و شروط عدالت." data-learn-more="/quran-terminology/fa/roots/th-l-th/">وَثُلٰثَ</button>
    <button class="word-link" type="button" data-word="وَرُبٰعَ" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی" data-context="چهارتا چهارتا؛ شمار توزیعی، نه افزودن به دو و سه.">وَرُبٰعَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="خِفتُم" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم داشته باشید که نتوانید عدالت را رعایت کنید.">خِفتُم</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعدِلوا" data-root="ع د ل" data-learn-more="/quran-terminology/fa/roots/ayn-d-l/" data-root-meaning="هم‌سنگ‌کردن، راست‌داشتن، برابرنهادن، و قرار دادن هر چیز در نسبتی که از کژی و یک‌طرفه‌شدن جلوگیری کند" data-context="عدالت را رعایت کنید؛ در ساخت نفی آمده است.">تَعدِلوا</button>
    <button class="word-link" type="button" data-word="فَوٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="پس یک زن؛ در صورت بیم از بی‌عدالتی.">فَوٰحِدَةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="مَلَكَت" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="در اختیار و مالکیت قرار گرفته است؛ جزئی از تعبیر تاریخیِ ملک یمین.">مَلَكَت</button>
    <button class="word-link" type="button" data-word="أَيمٰنُكُم" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="دست‌های راست شما؛ در تعبیر «ما ملكت أيمانكم».">أَيمٰنُكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَدنىٰ" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="نزدیک‌تر به دوری از انحراف و بی‌عدالتی.">أَدنىٰ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعولوا" data-root="ع و ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-l/" data-root-meaning="سنگینی و میل از تعادل؛ در سیاق داوری، ستم و بی‌عدالتی." data-context="از عدالت منحرف شوید؛ در ساخت نفی بیان شده است.">تَعولوا</button>
  </p>
  <p class="farsi-verse">و اگر بیم دارید که درباره یتیمان به داد رفتار نکنید، با زنانی که برای شما پسندیده‌اند ازدواج کنید: دو، سه و چهار. و اگر بیم دارید که عدالت نورزید، پس یک زن، یا آنچه دست‌های راستتان مالک شده است. این نزدیک‌تر است به اینکه ستم نکنید.</p>
</section>
