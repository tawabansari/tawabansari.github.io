<section class="ayah-block" id="ayah-119" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَأُضِلَّنَّهُم" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه" data-context="بی‌گمان آنان را گمراه خواهم کرد؛ فعل باب افعال در گفتار شیطان، با ضمیر «آنان» و تأکید بر قصد او.">وَلَأُضِلَّنَّهُم</button>
    <button class="word-link" type="button" data-word="وَلَأُمَنِّيَنَّهُم" data-root="م ن ي" data-learn-more="/quran-terminology/fa/roots/m-n-y/" data-root-meaning="از تقدیر و آرزو تا تلاوت، امانی و منی" data-context="آنان را به آرزوها خواهم افکند؛ وعدهٔ شیطان برای مشغول کردن مخاطبان به آرزوهای گمراه‌کننده.">وَلَأُمَنِّيَنَّهُم</button>
    <button class="word-link" type="button" data-word="وَلَـٔامُرَنَّهُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="بی‌گمان آنان را فرمان خواهم داد؛ در گفتار شیطان، مقدمهٔ انجام بریدن گوش‌ها به دست فرمان‌پذیران.">وَلَـٔامُرَنَّهُم</button>
    <button class="word-link" type="button" data-word="فَلَيُبَتِّكُنَّ" data-root="ب ت ك" data-learn-more="/quran-terminology/fa/roots/b-t-k/" data-root-meaning="بریدن و جدا کردن بخشی از چیزی؛ با ابزار برنده یا با کشیدن و کندن." data-context="گوش‌های چارپایان را خواهند برید یا شکافت؛ فعل باب تفعیل برای جمع غایب با تأکید، در پی فرمان شیطان.">فَلَيُبَتِّكُنَّ</button>
    <button class="word-link" type="button" data-word="ءاذانَ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="گوش‌ها؛ جمع «أُذُن» و مفعول بریدن یا شکافتن، نه اذن و اجازه.">ءاذانَ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید؛ و در شاخهٔ نَعَم و أَنْعَام: دام‌ها و چهارپایان." data-context="چارپایان دام؛ مانند شتر، گاو، گوسفند و بز؛ صاحبان گوش‌هایی که عمل بریدن دربارهٔ آنها بیان شده است.">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="وَلَـٔامُرَنَّهُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="و آنان را فرمان خواهم داد؛ تکرار فعل برای معرفی فرمان مربوط به تغییر خلق.">وَلَـٔامُرَنَّهُم</button>
    <button class="word-link" type="button" data-word="فَلَيُغَيِّرُنَّ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="بی‌گمان تغییر خواهند داد؛ فعل باب تفعیل با فاعل جمع، در گفتار شیطان دربارهٔ دگرگون ساختن خلق.">فَلَيُغَيِّرُنَّ</button>
    <button class="word-link" type="button" data-word="خَلقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش یا ساختِ آفریده؛ مفعول تغییر دادن؛ دامنهٔ «تغییر خلق» در سیاق و شبکهٔ آیات بررسی می‌شود.">خَلقَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَتَّخِذِ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="به سرپرستی بگیرد یا برای خود برگزیند؛ فعل باب افتعال در جملهٔ شرط، با شیطان به عنوان مفعول.">يَتَّخِذِ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ همان گمراه‌کننده و فرمان‌دهنده‌ای که گفتارش در بخش نخست آیه نقل شده است.">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="وَلِيًّا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="سرپرست و تکیه‌گاهِ پیروی؛ وصف نقشی که شخص در این انتخاب به شیطان می‌دهد.">وَلِيًّا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="در ترکیب «من دون الله»، به جای آن معبود یگانه یا جدا از مرجعیت او؛ نه اشاره به پایین بودن مکانی.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="خَسِرَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش" data-context="زیان کرده است؛ نتیجهٔ برگزیدن شیطان به سرپرستی در جملهٔ شرط.">خَسِرَ</button>
    <button class="word-link" type="button" data-word="خُسرانًا" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش" data-context="زیانی؛ مصدر برای تأکید بر زیان کردن، با وصف «مبین».">خُسرانًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار و روشن؛ وصف «خسران» و بیان آشکار بودن زیان.">مُبينًا</button>
  </p>
  <p class="farsi-verse">و بی‌گمان آنان را گمراه می‌کنم و به آرزوها می‌اندازم و فرمانشان می‌دهم تا گوش‌های چهارپایان را بشکافند، و فرمانشان می‌دهم تا آفرینش آن معبود یگانه را تغییر دهند.» و هر که شیطان را به جای آن معبود یگانه سرپرست بگیرد، زیانی آشکار کرده است.</p>
</section>
