  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، به آن معبود یگانه و رسولش و کتابی که بر رسولش فرو فرستاده و کتابی که پیش‌تر نازل کرده ایمان بیاورید. و هر که آن معبود یگانه و فرشتگانش و کتاب‌هایش و رسولانش و روز واپسین را انکار کند، به گمراهی دوری افتاده است.</p>
