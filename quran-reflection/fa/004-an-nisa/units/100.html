  <p class="farsi-verse">و هر که در راه آن معبود یگانه هجرت کند، در زمین پناهگاه‌های بسیار و گشایش می‌یابد. و هر که از خانه‌اش به‌قصد هجرت به سوی آن معبود یگانه و رسولش بیرون رود، سپس مرگ او را دریابد، پاداشش بر عهده آن معبود یگانه قرار گرفته است. و آن معبود یگانه آمرزنده و مهربان است.</p>
