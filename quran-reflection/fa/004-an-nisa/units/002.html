<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتُوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بدهید و به صاحبان حق برسانید.">وَءاتُوا</button>
    <button class="word-link" type="button" data-word="اليَتٰمىٰ" data-root="ي ت م" data-learn-more="/quran-terminology/fa/roots/y-t-m/" data-root-meaning="فقدان پدر، وضعیت یتیم و مسئولیت در برابر حقوق او" data-context="یتیمان؛ کودکانی که پدر خود را از دست داده‌اند.">اليَتٰمىٰ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="اموالشان؛ دارایی‌هایی که حقِ یتیمان است.">أَموٰلَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَبَدَّلُوا" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا." data-context="بد را به جای خوب نگیرید؛ در تصرف و مبادلهٔ اموال، حق یتیم را تباه نکنید.">تَتَبَدَّلُوا</button>
    <button class="word-link" type="button" data-word="الخَبيثَ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="مال نامرغوب یا تصرف ناروا در برابر مال خوب و مشروع؛ در زمینهٔ حق یتیم.">الخَبيثَ</button>
    <button class="word-link" type="button" data-word="بِالطَّيِّبِ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="مال خوب و مرغوب، یا بهره‌مندی مشروع از مال؛ در برابر خبیث.">بِالطَّيِّبِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَأكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="مصرف و تصاحب نکنید؛ اموال یتیمان را به سود خود نخورید.">تَأكُلوا</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="اموالشان؛ داراییِ یتیمان که از خوردن آن نهی شده است.">أَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَموٰلِكُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="اموال خودتان؛ افزودن مال یتیم به دارایی خود برای مصرف ناروا.">أَموٰلِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="است؛ در بیانِ گناه بزرگ بودن این رفتار.">كانَ</button>
    <button class="word-link" type="button" data-word="حوبًا" data-root="ح و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-w-b/" data-root-meaning="گناه، خطا و کار ناروا." data-context="گناه و کار ناروا؛ وصفِ تجاوز به اموال یتیمان.">حوبًا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="بزرگ؛ بیانِ سنگینیِ این گناه.">كَبيرًا</button>
  </p>
  <p class="farsi-verse">و اموال یتیمان را به آنان بدهید و ناپاک را با پاک عوض نکنید و اموالشان را همراه اموال خود نخورید؛ که این گناهی بزرگ است.</p>
</section>
