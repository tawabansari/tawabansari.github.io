<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتُوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">وَءاتُوا</button>
    <button class="word-link" type="button" data-word="اليَتٰمىٰ" data-root="ي ت م" data-learn-more="/quran-terminology/fa/roots/y-t-m/">اليَتٰمىٰ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/">أَموٰلَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَبَدَّلُوا" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/">تَتَبَدَّلُوا</button>
    <button class="word-link" type="button" data-word="الخَبيثَ" data-root="خ ب ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الخَبيثَ</button>
    <button class="word-link" type="button" data-word="بِالطَّيِّبِ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/">بِالطَّيِّبِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَأكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/">تَأكُلوا</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/">أَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَموٰلِكُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/">أَموٰلِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَ</button>
    <button class="word-link" type="button" data-word="حوبًا" data-root="ح و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حوبًا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/">كَبيرًا</button>
  </p>
  <p class="farsi-verse">و اموال یتیمان را به آنان بدهید و ناپاک را با پاک عوض نکنید و اموالشان را همراه اموال خود نخورید؛ که این گناهی بزرگ است.</p>
