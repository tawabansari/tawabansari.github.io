  <p class="farsi-verse">و چون خبری از امنیت یا ترس به آنان برسد، آن را پخش می‌کنند. و اگر آن را به رسول و صاحبان امر از خودشان بازمی‌گرداندند، کسانی از آنان که آن را استنباط می‌کنند، آن را می‌دانستند. و اگر فضل آن معبود یگانه و رحمت او بر شما نبود، جز اندکی از شیطان پیروی می‌کردید.</p>
