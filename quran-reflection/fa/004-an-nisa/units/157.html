<section class="ayah-block" id="ayah-157" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَولِهِم" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفتارشان؛ ادعای نقل‌شدهٔ آنان.">وَقَولِهِم</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="قَتَلنَا" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="کشتیم؛ در ادعایی که آیه نقل و سپس رد می‌کند.">قَتَلنَا</button>
    <button class="word-link" type="button" data-word="المَسيحَ" data-root="م س ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-h/" data-root-meaning="دست کشیدن و پاک کردن؛ نیز اندازه‌گیری سطح." data-context="مسیح؛ عنوانِ عیسی پسر مریم.">المَسيحَ</button>
    <button class="word-link" type="button" data-word="عيسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عيسَى</button>
    <button class="word-link" type="button" data-word="ابنَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-context="پسرِ؛ در معرفی عیسی به عنوان پسر مریم." data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار؛ و در صورت‌های «ابن» و «بنت»، پسر، دختر و پیوند نسلی.">ابنَ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="رَسولَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستاده؛ در وصف عیسی.">رَسولَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="قَتَلوهُ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="او را کشتند؛ در این آیه زیر نفی قرار دارد.">قَتَلوهُ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="صَلَبوهُ" data-root="ص ل ب" data-root-meaning="سختی و استواری؛ صُلب: ستون پشت و در ترکیب نسب، پیوند نسلی؛ صَلب: به صلیب کشیدن انسان." data-context="او را به صلیب کشیدند؛ فعل مجرد که در این آیه نفی شده است." data-learn-more="/quran-terminology/fa/roots/sad-l-b/">صَلَبوهُ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="شُبِّهَ" data-root="ش ب ه" data-learn-more="/quran-terminology/fa/roots/sh-b-h2/" data-root-meaning="شباهت، همانندی در صورت یا نشانه، مشتبه شدن، و هماهنگی درون‌متنی" data-context="مشتبه شد یا همانند جلوه داده شد؛ فعل مجهول، بدون نام بردن از شخصی جایگزین.">شُبِّهَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اختَلَفوا" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-context="اختلاف کردند؛ دربارهٔ موضوع یادشده." data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی؛ و در کاربرد «اختلاف» و «خلاف»، تفاوت، مخالفت و قرار گرفتن در جهت مخالف.">اختَلَفوا</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="لَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَفى</button>
    <button class="word-link" type="button" data-word="شَكٍّ" data-root="ش ك ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-k-k/" data-root-meaning="تردید و نداشتن اطمینان." data-context="شک و تردید.">شَكٍّ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانش و آگاهیِ قابل اتکا؛ در عبارت نفیِ علم.">عِلمٍ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="اتِّباعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="پیروی کردن؛ در ترکیبِ پیروی از گمان.">اتِّباعَ</button>
    <button class="word-link" type="button" data-word="الظَّنِّ" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد" data-context="گمان؛ در برابر دانش یقینی در این آیه.">الظَّنِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="قَتَلوهُ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="او را کشتند؛ در این آیه زیر نفی قرار دارد.">قَتَلوهُ</button>
    <button class="word-link" type="button" data-word="يَقينًا" data-root="ي ق ن" data-learn-more="/quran-terminology/fa/roots/y-q-n/" data-root-meaning="ثبات معرفت، اطمینان روشن، و عبور از گمان" data-context="به یقین؛ قیدِ تأکید در پایان آیه.">يَقينًا</button>
  </p>
  <p class="farsi-verse">و گفتنشان که «ما مسیح، عیسی پسر مریم، رسول آن معبود یگانه را کشتیم»؛ و او را نکشتند و به صلیب نکشیدند، ولی برای آنان چنین نمایانده شد. و کسانی که درباره او اختلاف کردند، در تردیدی درباره اویند. هیچ دانشی به آن ندارند، جز پیروی از گمان؛ و یقیناً او را نکشتند.</p>
</section>
