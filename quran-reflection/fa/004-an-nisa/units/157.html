  <p class="farsi-verse">و گفتنشان که «ما مسیح، عیسی پسر مریم، رسول آن معبود یگانه را کشتیم»؛ و او را نکشتند و به صلیب نکشیدند، ولی برای آنان چنین نمایانده شد. و کسانی که درباره او اختلاف کردند، در تردیدی درباره اویند. هیچ دانشی به آن ندارند، جز پیروی از گمان؛ و یقیناً او را نکشتند.</p>
