  <p class="farsi-verse">ای مردم، از پروردگارتان پروا کنید؛ همان که شما را از یک نفس آفرید و جفتش را از آن آفرید و از آن دو، مردان و زنان بسیاری پراکند. و از آن معبود یگانه که به نام او از یکدیگر درخواست می‌کنید، و درباره پیوندهای خویشاوندی پروا کنید. همانا آن معبود یگانه مراقب شماست.</p>
