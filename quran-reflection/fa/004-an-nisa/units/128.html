<section class="ayah-block" id="ayah-128" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنِ</button>
    <button class="word-link" type="button" data-word="امرَأَةٌ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود" data-context="زنی؛ یکی از دو طرفِ رابطهٔ همسری که از رفتار شوهر بیم دارد">امرَأَةٌ</button>
    <button class="word-link" type="button" data-word="خافَت" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم داشت؛ از نشوز یا رویگردانی شوهر">خافَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعلِها" data-root="ب ع ل" data-root-meaning="در کاربرد خانوادگی، بعل یعنی شوهر؛ مردِ طرفِ رابطهٔ همسری. در داستان الیاس، بعل نام یا عنوان معبودی است که به جای خداوند خوانده می‌شده است." data-context="شوهرش؛ مردی که زن از نشوز یا رویگردانیِ او بیم دارد" data-learn-more="/quran-terminology/fa/roots/b-ayn-l/">بَعلِها</button>
    <button class="word-link" type="button" data-word="نُشوزًا" data-root="ن ش ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-z/" data-root-meaning="بلند شدن و از جای برخاستن؛ نشوز در روابط: فاصله‌گیری و ناسازگاری." data-context="نشوز؛ ناسازگاری و فاصله‌گرفتنِ شوهر در رابطهٔ همسری">نُشوزًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="إِعراضًا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="رویگردانی؛ کناره‌گیریِ شوهر از رابطه">إِعراضًا</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="جُناحَ" data-root="ج ن ح" data-root-meaning="بال، پهلو، متمایل شدن و گناه؛ از حرکت پرنده و فروتنی انسان تا «لا جناح» در احکام قرآن و گرایش به صلح" data-learn-more="/quran-terminology/fa/roots/j-n-h/" data-context="گناه یا ملامتی نیست؛ در بیانِ مجاز بودنِ سازش میان دو طرف">جُناحَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِما</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُصلِحا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="آن دو اصلاح و سازش کنند؛ زن و شوهر رابطه را سامان دهند">يُصلِحا</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن دو؛ رابطهٔ زن و شوهر">بَينَهُما</button>
    <button class="word-link" type="button" data-word="صُلحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="سازشی؛ توافقی برای اصلاحِ رابطهٔ دو طرف">صُلحًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالصُّلحُ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="و سازش؛ آنچه در جملهٔ بعد بهتر دانسته می‌شود">وَالصُّلحُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ در وصفِ سازشِ میان دو طرف">خَيرٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأُحضِرَتِ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت" data-context="و حاضر و همراه ساخته شده‌اند؛ جان‌ها با تنگ‌چشمی مواجه‌اند">وَأُحضِرَتِ</button>
    <button class="word-link" type="button" data-word="الأَنفُسُ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="جان‌ها؛ خودِ انسان‌ها در مواجهه با تنگ‌چشمی">الأَنفُسُ</button>
    <button class="word-link" type="button" data-word="الشُّحَّ" data-root="ش ح ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h-h/" data-root-meaning="بخل همراه با حرص و تنگ‌چشمی." data-context="تنگ‌چشمی و سخت‌گیری در گذشتن از خواسته یا حقِ خود">الشُّحَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُحسِنوا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکی کنید؛ در رفتار و اصلاحِ رابطه">تُحسِنوا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و تقوا پیشه کنید؛ از رفتار آسیب‌زننده و ناروا خود را نگاه دارید">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ در بیانِ آگاهیِ پایدارِ خداوند از کردار">كانَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دهید؛ کردارِ مخاطبان">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="خ ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-b-r/" data-root-meaning="خبر و آگاهی حاصل از شناخت و تجربه." data-context="آگاه؛ وصفِ خداوند نسبت به آنچه انجام می‌دهید">خَبيرًا</button>
  </p>
  <p class="farsi-verse">و اگر زنی از سرکشی یا روی‌گردانی شوهرش بیم داشته باشد، گناهی بر آن دو نیست که میان خود سازشی برقرار کنند؛ و سازش بهتر است. و بخل در جان‌ها حاضر شده است. و اگر نیکی کنید و پروا داشته باشید، همانا آن معبود یگانه به آنچه می‌کنید آگاه است.</p>
</section>
