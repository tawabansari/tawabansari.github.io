  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنِ</button>
    <button class="word-link" type="button" data-word="امرَأَةٌ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرَأَةٌ</button>
    <button class="word-link" type="button" data-word="خافَت" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">خافَت</button>

    <button class="word-link" type="button" data-word="نُشوزًا" data-root="ن ش ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-z/" data-root-meaning="بلند شدن و از جای برخاستن؛ نشوز در روابط: فاصله‌گیری و ناسازگاری.">نُشوزًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>

    <button class="word-link" type="button" data-word="جُناحَ" data-root="ج ن ح" data-root-meaning="بال، پهلو، متمایل شدن و گناه؛ از حرکت پرنده و فروتنی انسان تا «لا جناح» در احکام قرآن و گرایش به صلح" data-learn-more="/quran-terminology/fa/roots/j-n-h/">جُناحَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِما</button>

    <button class="word-link" type="button" data-word="يُصلِحا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">يُصلِحا</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُما</button>
    <button class="word-link" type="button" data-word="صُلحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">صُلحًا</button>

    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٌ</button>

    <button class="word-link" type="button" data-word="وَأُحضِرَتِ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت">وَأُحضِرَتِ</button>
    <button class="word-link" type="button" data-word="الأَنفُسُ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">الأَنفُسُ</button>
    <button class="word-link" type="button" data-word="الشُّحَّ" data-root="ش ح ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h-h/" data-root-meaning="بخل همراه با حرص و تنگ‌چشمی.">الشُّحَّ</button>

    <button class="word-link" type="button" data-word="تُحسِنوا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">تُحسِنوا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>

    <button class="word-link" type="button" data-word="خَبيرًا" data-root="خ ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-b-r/" data-root-meaning="خبر و آگاهی حاصل از شناخت و تجربه.">خَبيرًا</button>
  </p>
  <p class="farsi-verse">و اگر زنی از سرکشی یا روی‌گردانی شوهرش بیم داشته باشد، گناهی بر آن دو نیست که میان خود سازشی برقرار کنند؛ و سازش بهتر است. و بخل در جان‌ها حاضر شده است. و اگر نیکی کنید و پروا داشته باشید، همانا آن معبود یگانه به آنچه می‌کنید آگاه است.</p>
</section>
