  <p class="farsi-verse">ما به تو وحی کردیم همان‌گونه که به نوح و پیامبران پس از او وحی کردیم؛ و به ابراهیم و اسماعیل و اسحاق و یعقوب و اسباط و عیسی و ایوب و یونس و هارون و سلیمان وحی کردیم؛ و به داوود زبور دادیم.</p>
