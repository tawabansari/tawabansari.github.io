  <p class="farsi-verse">آیا به کسانی که بهره‌ای از کتاب به آنان داده شده ننگریستی؟ به جبت و طاغوت ایمان می‌آورند و درباره کسانی که انکار کردند می‌گویند: «اینان از کسانی که ایمان آورده‌اند راه‌یافته‌ترند.»</p>
