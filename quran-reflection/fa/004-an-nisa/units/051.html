<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="ننگریستی و درنیافتی؛ دعوت به توجه و تأمل در رفتار گروهی که وصف می‌شوند.">تَرَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="داده شدند؛ کسانی که بهره‌ای از کتاب به آنان داده شده است.">أوتوا</button>
    <button class="word-link" type="button" data-word="نَصيبًا" data-root="ن ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-b/" data-root-meaning="برپا کردن؛ نَصَب: رنج؛ نصیب: سهم؛ نُصُب: سنگ‌های آیینی." data-context="بهره‌ای و سهمی؛ مقداری از کتاب که به آنان داده شده است.">نَصيبًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتاب؛ متنی از وحی که گروه مورد نقد بهره‌ای از آن دارند.">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان می‌آورند؛ جبت و طاغوت را می‌پذیرند و تصدیق می‌کنند.">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِالجِبتِ" data-root="ج ب ت" data-root-meaning="جبت: نامی برای بت، ساحر، کاهن یا دیگر امور و مراجع باطلی که به‌ناحق مورد اعتقاد و تقدیس قرار می‌گیرند." data-context="به جبت؛ پذیرش و اعتقاد به آنچه در این سیاق امر یا مرجع باطل خوانده می‌شود؛ آیه مصداق انحصاری آن را نام نمی‌برد." data-learn-more="/quran-terminology/fa/roots/j-b-t/">بِالجِبتِ</button>
    <button class="word-link" type="button" data-word="وَالطّٰغوتِ" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق" data-context="و طاغوت؛ مرجع باطلِ برون‌رفته از حد حق که در کنار جبت موضوع ایمان آنان قرار گرفته است.">وَالطّٰغوتِ</button>
    <button class="word-link" type="button" data-word="وَيَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و می‌گویند؛ داوری خود را دربارهٔ برتری راه انکارکنندگان بیان می‌کنند.">وَيَقولونَ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ کسانی که در برابر ایمان مؤمنان با انکار معرفی می‌شوند.">كَفَروا</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="أَهدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="راه‌یافته‌تر؛ برتری در هدایت که آنان به انکارکنندگان نسبت می‌دهند.">أَهدىٰ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ مؤمنانی که راهشان در این داوری نادرست فروتر شمرده می‌شود.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="از نظر راه؛ مسیر و شیوه‌ای که موضوع مقایسه در هدایت است.">سَبيلًا</button>
  </p>
  <p class="farsi-verse">آیا به کسانی که بهره‌ای از کتاب به آنان داده شده ننگریستی؟ به جبت و طاغوت ایمان می‌آورند و درباره کسانی که انکار کردند می‌گویند: «اینان از کسانی که ایمان آورده‌اند راه‌یافته‌ترند.»</p>
</section>
