  <p class="farsi-verse">ای مردم، رسول حق را از پروردگارتان برایتان آورده است. پس ایمان بیاورید که برایتان بهتر است. و اگر انکار کنید، آنچه در آسمان‌ها و زمین است از آنِ آن معبود یگانه است؛ و آن معبود یگانه دانا و حکیم است.</p>
