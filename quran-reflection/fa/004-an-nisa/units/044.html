<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أوتوا</button>
    <button class="word-link" type="button" data-word="نَصيبًا" data-root="ن ص ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَصيبًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="يَشتَرونَ" data-root="ش ر ي" data-learn-more="/quran-terminology/fa/roots/sh-r-y/" data-root-meaning="خریدن، فروختن، مبادله کردن، و واگذار کردن چیزی در برابر گرفتن چیزی دیگر">يَشتَرونَ</button>
    <button class="word-link" type="button" data-word="الضَّلٰلَةَ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">الضَّلٰلَةَ</button>
    <button class="word-link" type="button" data-word="وَيُريدونَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">وَيُريدونَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَضِلُّوا" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">تَضِلُّوا</button>
    <button class="word-link" type="button" data-word="السَّبيلَ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">السَّبيلَ</button>
  </p>
  <p class="farsi-verse">آیا به کسانی که بهره‌ای از کتاب به آنان داده شده ننگریستی؟ گمراهی را می‌خرند و می‌خواهند شما راه را گم کنید.</p>
</section>
