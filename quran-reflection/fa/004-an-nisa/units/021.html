<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَيفَ</button>
    <button class="word-link" type="button" data-word="تَأخُذونَهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">تَأخُذونَهُ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="أَفضىٰ" data-root="ف ض و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-dad-w/" data-root-meaning="به فضای باز رسیدن؛ افضاء: راه یافتن، نزدیک شدن یا تماس یافتن.">أَفضىٰ</button>
    <button class="word-link" type="button" data-word="بَعضُكُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی">بَعضُكُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی">بَعضٍ</button>
    <button class="word-link" type="button" data-word="وَأَخَذنَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">وَأَخَذنَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="ميثٰقًا" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست">ميثٰقًا</button>
    <button class="word-link" type="button" data-word="غَليظًا" data-root="غ ل ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-zha/" data-root-meaning="ضخامت، سختی و درشتی؛ مادی یا رفتاری، بنا بر سیاق.">غَليظًا</button>
  </p>
  <p class="farsi-verse">و چگونه آن را می‌گیرید، در حالی که به یکدیگر رسیده‌اید و آنان از شما پیمانی استوار گرفته‌اند؟</p>
