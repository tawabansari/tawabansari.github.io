<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="حَضَرَ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت">حَضَرَ</button>
    <button class="word-link" type="button" data-word="القِسمَةَ" data-root="ق س م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-m/" data-root-meaning="تقسیم و بهره‌بندی؛ قَسَم: سوگند.">القِسمَةَ</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولُوا</button>
    <button class="word-link" type="button" data-word="القُربىٰ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب">القُربىٰ</button>
    <button class="word-link" type="button" data-word="وَاليَتٰمىٰ" data-root="ي ت م" data-learn-more="/quran-terminology/fa/roots/y-t-m/" data-root-meaning="فقدان پدر، وضعیت یتیم و مسئولیت در برابر حقوق او">وَاليَتٰمىٰ</button>
    <button class="word-link" type="button" data-word="وَالمَسٰكينُ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن">وَالمَسٰكينُ</button>
    <button class="word-link" type="button" data-word="فَارزُقوهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">فَارزُقوهُم</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="وَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقولوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قَولًا</button>
    <button class="word-link" type="button" data-word="مَعروفًا" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">مَعروفًا</button>
  </p>
  <p class="farsi-verse">و هنگامی که خویشاوندان و یتیمان و نیازمندان در تقسیم حاضر شدند، از آن به آنان روزی دهید و با آنان سخنی پسندیده بگویید.</p>
</section>
