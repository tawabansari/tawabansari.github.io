  <p class="farsi-verse">پذیرش توبه بر عهده آن معبود یگانه تنها برای کسانی است که از نادانی بدی می‌کنند، سپس به‌زودی بازمی‌گردند. پس آنان‌اند که آن معبود یگانه به آنان بازمی‌گردد؛ و آن معبود یگانه دانا و حکیم است.</p>
