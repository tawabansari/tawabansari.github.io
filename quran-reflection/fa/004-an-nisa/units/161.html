<section class="ayah-block" id="ayah-161" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَخذِهِمُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="و گرفتنشان؛ دریافت ربا با وجود نهی.">وَأَخذِهِمُ</button>
    <button class="word-link" type="button" data-word="الرِّبوٰا۟" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/" data-root-meaning="بالا آمدن، افزون شدن، برآمدن، زیاد شدن، رشد کردن، و از حد پیشین بالاتر رفتن" data-context="ربا؛ موضوع گرفتن و نهی پیشین.">الرِّبوٰا۟</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="نُهوا" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="نهی شده بودند؛ منع پیشین از گرفتن ربا." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">نُهوا</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="وَأَكلِهِم" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="و خوردنشان؛ تصرف ناروا در مال مردم.">وَأَكلِهِم</button>
    <button class="word-link" type="button" data-word="أَموٰلَ" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="اموال؛ دارایی مردم.">أَموٰلَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ صاحبان اموالِ ناروا خورده‌شده.">النّاسِ</button>
    <button class="word-link" type="button" data-word="بِالبٰطِلِ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/" data-root-meaning="بی‌پایه شدن، فروپاشیدن، بی‌اثر و بی‌حقیقت بودن" data-context="به باطل؛ وصف شیوهٔ تصرف در مال.">بِالبٰطِلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَعتَدنا" data-root="ع ت د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-d/" data-root-meaning="آماده کردن و آماده یا حاضر بودن." data-context="و آماده کرده‌ایم؛ مهیا کردن عذاب.">وَأَعتَدنا</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="برای کافران؛ مخاطبانِ کیفر یادشده از میان آنان.">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذابی؛ کیفر بیان‌شده.">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد" data-context="دردناک؛ وصف عذاب.">أَليمًا</button>
  </p>
  <p class="farsi-verse">و گرفتن ربا در حالی که از آن نهی شده بودند، و خوردن اموال مردم به ناروا. و برای انکارکنندگان از آنان عذابی دردناک آماده کرده‌ایم.</p>
</section>
