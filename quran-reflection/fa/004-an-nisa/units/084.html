    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>

    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="نَفسَكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">نَفسَكَ</button>

    <button class="word-link" type="button" data-word="يَكُفَّ" data-root="ك ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-f-f/" data-root-meaning="کف دست؛ بازداشتن و دست کشیدن؛ کافّه: همگی.">يَكُفَّ</button>
    <button class="word-link" type="button" data-word="بَأسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">بَأسَ</button>

    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="بَأسًا" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">بَأسًا</button>
    <button class="word-link" type="button" data-word="وَأَشَدُّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">وَأَشَدُّ</button>
    <button class="word-link" type="button" data-word="تَنكيلًا" data-root="ن ك ل" data-learn-more="/quran-terminology/fa/roots/n-k-l/" data-root-meaning="بازداشتن، مهار کردن، عقب زدن و واداشتن به عقب‌نشینی؛ و در سیاق کیفری، پیامد بازدارنده.">تَنكيلًا</button>
  </p>
  <p class="farsi-verse">پس در راه آن معبود یگانه بجنگ؛ جز مسئول خود نیستی. و مؤمنان را برانگیز. باشد که آن معبود یگانه نیروی کسانی را که انکار کردند بازدارد. و آن معبود یگانه در نیرو سخت‌تر و در کیفر عبرت‌آموز شدیدتر است.</p>
</section>
