<section class="ayah-block" id="ayah-084" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۸۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقٰتِل" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="پس در راه آن معبود یگانه بجنگ؛ فرمان به قتال که موضوع برانگیختن مؤمنان در ادامهٔ آیه را روشن می‌کند.">فَقٰتِل</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ در ترکیب «در راه آن معبود یگانه»، جهت و غایت قتالِ مورد بحث را بیان می‌کند.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُكَلَّفُ" data-root="ك ل ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-l-f/" data-root-meaning="به عهده نهادن کار و مسئولیت؛ تکلّف: خود را به کاری با دشواری واداشتن." data-context="بر عهده‌ات نهاده نمی‌شود؛ در ساخت منفی و استثناییِ جمله، دامنهٔ مسئولیت مخاطب بیان می‌شود.">تُكَلَّفُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="نَفسَكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خودت؛ مخاطب در این جمله مسئول خود دانسته می‌شود و سپس به برانگیختن مؤمنان فرمان می‌یابد.">نَفسَكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَحَرِّضِ" data-root="ح ر ض" data-root-meaning="فرسودگی و ضعف شدید تا آستانهٔ نابودی؛ و در باب تفعیل، برانگیختن و به اقدام واداشتن." data-context="برانگیختن و تشویق مؤمنان به مشارکت در قتالِ مورد بحث آیه." data-learn-more="/quran-terminology/fa/roots/h-r-dad/">وَحَرِّضِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمنان؛ کسانی که پیامبر به برانگیختن آنان در سیاق قتال فرمان یافته است.">المُؤمِنينَ</button>
    ۖ
    <button class="word-link" type="button" data-word="عَسَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَسَى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَكُفَّ" data-root="ك ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-f-f/" data-root-meaning="کف دست؛ بازداشتن و دست کشیدن؛ کافّه: همگی." data-context="بازدارد؛ جلوگیری از قدرت و تعرض کسانی که کفر ورزیده‌اند، در ادامهٔ آیه به‌عنوان نتیجهٔ مورد امید مطرح است.">يَكُفَّ</button>
    <button class="word-link" type="button" data-word="بَأسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="قدرت و شدت جنگیِ کسانی که کفر ورزیده‌اند؛ چیزی که بازداشته شدن آن در آیه مطرح است.">بَأسَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ وصف گروهی که بازداشتن قدرت و تعرض آنان در این سیاق مطرح است.">كَفَروا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="نیرومندتر و شدیدتر؛ صفت تفضیلی که در اینجا شدت قدرت آن معبود یگانه را بیان می‌کند.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="بَأسًا" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="شدت و قدرت؛ در این بخش، قدرت آن معبود یگانه در مقایسه با قدرت گروه مقابل بیان می‌شود.">بَأسًا</button>
    <button class="word-link" type="button" data-word="وَأَشَدُّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="و شدیدتر؛ صفت تفضیلی در بیان شدت کیفر و بازدارندگی آن معبود یگانه.">وَأَشَدُّ</button>
    <button class="word-link" type="button" data-word="تَنكيلًا" data-root="ن ك ل" data-learn-more="/quran-terminology/fa/roots/n-k-l/" data-root-meaning="بازداشتن، مهار کردن، عقب زدن و واداشتن به عقب‌نشینی؛ و در سیاق کیفری، پیامد بازدارنده." data-context="کیفر سخت و بازدارنده؛ در پایان آیه، در بیان شدت کیفر آن معبود یگانه آمده است.">تَنكيلًا</button>
  </p>
  <p class="farsi-verse">پس در راه آن معبود یگانه بجنگ؛ جز مسئول خود نیستی. و مؤمنان را برانگیز. باشد که آن معبود یگانه نیروی کسانی را که انکار کردند بازدارد. و آن معبود یگانه در نیرو سخت‌تر و در کیفر عبرت‌آموز شدیدتر است.</p>
</section>
