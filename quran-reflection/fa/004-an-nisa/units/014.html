  <p class="farsi-verse">و هر که آن معبود یگانه و رسولش را نافرمانی کند و از مرزهای او بگذرد، او را به آتشی وارد می‌کند که در آن ماندگار است؛ و برای او عذابی خوارکننده است.</p>
