<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَعصِ" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت." data-context="نافرمانی کند؛ از آن معبود یگانه و رسول او.">يَعصِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و رسول او؛ در بیان نافرمانی.">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="وَيَتَعَدَّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="و تجاوز کند؛ از مرزهای مقرر الهی.">وَيَتَعَدَّ</button>
    <button class="word-link" type="button" data-word="حُدودَهُ" data-root="ح د د" data-root-meaning="مرز و حد فاصل؛ بازداشتن، تیزی و برندگی." data-context="حدود او؛ مرزهای مقرر الهی که از تجاوز از آنها سخن می‌رود." data-learn-more="/quran-terminology/fa/roots/h-d-d/">حُدودَهُ</button>
    <button class="word-link" type="button" data-word="يُدخِلهُ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="او را وارد می‌کند؛ به آتش یادشده.">يُدخِلهُ</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتشی؛ جایگاه سرانجام مورد اشاره.">نارًا</button>
    <button class="word-link" type="button" data-word="خٰلِدًا" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه" data-context="ماندگار در آن آتش؛ وصف سرانجام شخص.">خٰلِدًا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="وَلَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذابی؛ رنج و کیفر یادشده برای او.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="مُهينٌ" data-root="ه و ن" data-learn-more="/quran-terminology/fa/roots/h2-w-n/" data-root-meaning="آسانی، آرامی و فروکاستن از شأن" data-context="خوارکننده؛ وصف آن عذاب.">مُهينٌ</button>
  </p>
  <p class="farsi-verse">و هر که آن معبود یگانه و رسولش را نافرمانی کند و از مرزهای او بگذرد، او را به آتشی وارد می‌کند که در آن ماندگار است؛ و برای او عذابی خوارکننده است.</p>
</section>
