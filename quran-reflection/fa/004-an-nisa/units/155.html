  <p class="farsi-verse">پس به سبب شکستن پیمانشان و انکار آیات آن معبود یگانه و کشتن پیامبران به‌ناحق و گفتنشان که «دل‌های ما در پوشش است»؛ بلکه آن معبود یگانه به سبب انکارشان بر آن‌ها مهر زده است، پس جز اندکی ایمان نمی‌آورند؛</p>
