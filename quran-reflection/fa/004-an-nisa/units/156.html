<section class="ayah-block" id="ayah-156" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبِكُفرِهِم" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">وَبِكُفرِهِم</button>
    <button class="word-link" type="button" data-word="وَقَولِهِم" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقَولِهِم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="ب ه ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-h2-t/" data-root-meaning="مبهوت و درمانده شدن؛ بهتان: دروغ و نسبتی ناروا که شنونده را شگفت‌زده می‌کند.">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="عَظيمًا" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">عَظيمًا</button>
  </p>
  <p class="farsi-verse">و به سبب انکارشان و گفتن بهتانی بزرگ بر مریم؛</p>
