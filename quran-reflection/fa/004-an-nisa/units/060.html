  <p class="farsi-verse">آیا به کسانی که ادعا می‌کنند به آنچه بر تو نازل شده و آنچه پیش از تو نازل شده ایمان آورده‌اند ننگریستی؟ می‌خواهند داوری را نزد طاغوت ببرند، در حالی که فرمان یافته‌اند آن را انکار کنند؛ و شیطان می‌خواهد آنان را به گمراهی دوری بکشاند.</p>
