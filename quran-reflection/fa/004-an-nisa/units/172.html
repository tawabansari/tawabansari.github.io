<section class="ayah-block" id="ayah-172" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="يَستَنكِفَ" data-root="ن ك ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-k-f/" data-root-meaning="خودداری از روی ننگ یا تکبر؛ شأن خود را بالاتر دانستن." data-context="خودداری و استنکاف کند؛ مسیح از بندگی خداوند چنین نمی‌کند.">يَستَنكِفَ</button>
    <button class="word-link" type="button" data-word="المَسيحُ" data-root="م س ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-h/" data-root-meaning="دست کشیدن و پاک کردن؛ نیز اندازه‌گیری سطح." data-context="مسیح؛ عنوانِ شخصِ مورد اشاره که از بندگی استنکاف نمی‌کند.">المَسيحُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ در بیان بنده بودن.">يَكونَ</button>
    <button class="word-link" type="button" data-word="عَبدًا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بنده؛ نسبتِ مسیح با خداوند.">عَبدًا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="وَلَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَا</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ آنان نیز از بندگی استنکاف نمی‌کنند.">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="المُقَرَّبونَ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="نزدیک‌گردانده‌شدگان؛ وصف فرشتگان.">المُقَرَّبونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَستَنكِف" data-root="ن ك ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-k-f/" data-root-meaning="خودداری از روی ننگ یا تکبر؛ شأن خود را بالاتر دانستن." data-context="از بندگی خودداری کند؛ در جملهٔ شرطی.">يَستَنكِف</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="عِبادَتِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بندگی او؛ آنچه شخص از آن استنکاف می‌کند.">عِبادَتِهِ</button>
    <button class="word-link" type="button" data-word="وَيَستَكبِر" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="و بزرگی‌فروشی کند؛ همراه استنکاف از بندگی.">وَيَستَكبِر</button>
    <button class="word-link" type="button" data-word="فَسَيَحشُرُهُم" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="پس آنان را همگی به سوی خود گرد خواهد آورد." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">فَسَيَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="همگی؛ فراگیریِ گردآوری.">جَميعًا</button>
  </p>
  <p class="farsi-verse">مسیح هرگز از اینکه بنده آن معبود یگانه باشد سر باز نمی‌زند، و نه فرشتگان مقرب. و هر که از بندگی او سر باز زند و تکبر کند، به‌زودی همه آنان را به سوی خود گرد می‌آورد.</p>
</section>
