<section class="ayah-block" id="ayah-172" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="يَستَنكِفَ" data-root="ن ك ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَستَنكِفَ</button>
    <button class="word-link" type="button" data-word="المَسيحُ" data-root="م س ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المَسيحُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكونَ</button>
    <button class="word-link" type="button" data-word="عَبدًا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عَبدًا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="وَلَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَا</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="المُقَرَّبونَ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب">المُقَرَّبونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَستَنكِف" data-root="ن ك ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَستَنكِف</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="عِبادَتِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عِبادَتِهِ</button>
    <button class="word-link" type="button" data-word="وَيَستَكبِر" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">وَيَستَكبِر</button>
    <button class="word-link" type="button" data-word="فَسَيَحشُرُهُم" data-root="ح ش ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَسَيَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">جَميعًا</button>
  </p>
  <p class="farsi-verse">مسیح هرگز از اینکه بنده آن معبود یگانه باشد سر باز نمی‌زند، و نه فرشتگان مقرب. و هر که از بندگی او سر باز زند و تکبر کند، به‌زودی همه آنان را به سوی خود گرد می‌آورد.</p>
</section>
