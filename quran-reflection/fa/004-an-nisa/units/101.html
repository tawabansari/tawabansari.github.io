    <button class="word-link" type="button" data-word="جُناحٌ" data-root="ج ن ح" data-root-meaning="بال، پهلو، متمایل شدن و گناه؛ از حرکت پرنده و فروتنی انسان تا «لا جناح» در احکام قرآن و گرایش به صلح" data-learn-more="/quran-terminology/fa/roots/j-n-h/">جُناحٌ</button>

    <button class="word-link" type="button" data-word="يَفتِنَكُمُ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">يَفتِنَكُمُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>

    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرينَ</button>

  </p>
  <p class="farsi-verse">و هنگامی که در زمین سفر می‌کنید، گناهی بر شما نیست که از صلات بکاهید، اگر بیم دارید که کسانی که انکار کرده‌اند شما را گرفتار کنند. همانا انکارکنندگان برای شما دشمنی آشکارند.</p>
