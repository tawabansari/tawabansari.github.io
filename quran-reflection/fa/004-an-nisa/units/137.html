  <p class="farsi-verse">کسانی که ایمان آوردند، سپس انکار کردند، سپس ایمان آوردند، سپس انکار کردند، سپس بر انکار افزودند، آن معبود یگانه آنان را نخواهد آمرزید و به راهی هدایتشان نخواهد کرد.</p>
