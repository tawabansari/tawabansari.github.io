<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">يُريدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُخَفِّفَ" data-root="خ ف ف" data-learn-more="/quran-terminology/fa/roots/kh-f-f/" data-root-meaning="از سبکی و کاهش بار تا از دست رفتن ثبات">يُخَفِّفَ</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَخُلِقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">وَخُلِقَ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">الإِنسٰنُ</button>
    <button class="word-link" type="button" data-word="ضَعيفًا" data-root="ض ع ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ضَعيفًا</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه می‌خواهد از بار شما بکاهد؛ و انسان ناتوان آفریده شده است.</p>
</section>
