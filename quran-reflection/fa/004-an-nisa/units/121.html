<section class="ayah-block" id="ayah-121" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="مَأوىٰهُم" data-root="أ و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَجِدونَ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">يَجِدونَ</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنها</button>
    <button class="word-link" type="button" data-word="مَحيصًا" data-root="ح ي ص" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَحيصًا</button>
  </p>
  <p class="farsi-verse">آنان جایگاهشان جهنم است و از آن هیچ گریزگاهی نمی‌یابند.</p>
