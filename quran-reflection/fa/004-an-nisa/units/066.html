  <p class="farsi-verse">و اگر بر آنان می‌نوشتیم که «خودتان را بکشید» یا «از خانه‌هایتان بیرون روید»، جز اندکی از آنان انجامش نمی‌دادند. و اگر آنچه را به آن پند داده می‌شوند انجام می‌دادند، برایشان بهتر و استوارکننده‌تر بود.</p>
