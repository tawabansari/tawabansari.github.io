  <p class="farsi-verse">و هر که آن معبود یگانه و رسول را فرمان برد، آنان با کسانی‌اند که آن معبود یگانه به آنان نعمت داده است: پیامبران و راست‌پیشگان و گواهان و شایستگان؛ و چه نیکو همراهانی‌اند آنان.</p>
