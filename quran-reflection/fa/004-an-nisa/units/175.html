  <p class="farsi-verse">پس کسانی که به آن معبود یگانه ایمان آوردند و به او چنگ زدند، به‌زودی آنان را در رحمت و فضلی از خود وارد می‌کند و به سوی خود به راهی راست هدایتشان می‌کند.</p>
