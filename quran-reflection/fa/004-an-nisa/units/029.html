  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، اموالتان را میان خود به ناروا نخورید، مگر آنکه تجارتی با رضایت یکدیگر باشد. و خودتان را نکشید. همانا آن معبود یگانه با شما مهربان است.</p>
