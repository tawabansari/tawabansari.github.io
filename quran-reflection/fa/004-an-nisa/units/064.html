  <p class="farsi-verse">و هیچ رسولی نفرستادیم مگر برای اینکه به اذن آن معبود یگانه فرمان برده شود. و اگر آنان هنگامی که به خود ستم کردند نزد تو می‌آمدند و از آن معبود یگانه آمرزش می‌خواستند و رسول برایشان آمرزش می‌خواست، آن معبود یگانه را بسیار توبه‌پذیر و مهربان می‌یافتند.</p>
