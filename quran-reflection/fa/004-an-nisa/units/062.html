  <p class="farsi-verse">پس چگونه است هنگامی که به سبب آنچه دست‌هایشان پیش فرستاده مصیبتی به آنان می‌رسد، سپس نزد تو می‌آیند و به آن معبود یگانه سوگند می‌خورند: «جز نیکی و سازگاری نخواستیم»؟</p>
