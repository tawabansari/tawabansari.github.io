<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="يَحسُدونَ" data-root="ح س د" data-learn-more="/quran-terminology/fa/roots/h-s-d/" data-root-meaning="حَسَد؛ ناخشنودی از بهره دیگری و خواستن زوال آن">يَحسُدونَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="ءاتىٰهُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتىٰهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده.">فَضلِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتَينا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالَ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="وَالحِكمَةَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">وَالحِكمَةَ</button>
    <button class="word-link" type="button" data-word="وَءاتَينٰهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَءاتَينٰهُم</button>
    <button class="word-link" type="button" data-word="مُلكًا" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه">مُلكًا</button>
    <button class="word-link" type="button" data-word="عَظيمًا" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">عَظيمًا</button>
  </p>
  <p class="farsi-verse">یا به مردم به سبب آنچه آن معبود یگانه از فضلش به آنان داده حسد می‌ورزند؟ پس ما به خاندان ابراهیم کتاب و حکمت دادیم و به آنان فرمانروایی بزرگی بخشیدیم.</p>
</section>
