  <p class="farsi-verse">آیا به کسانی که خود را پاک می‌شمارند ننگریستی؟ بلکه آن معبود یگانه هر که را بخواهد پاک می‌کند؛ و به اندازه رشته‌ای ستم نمی‌بینند.</p>
