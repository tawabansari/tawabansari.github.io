<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُزَكّونَ" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">يُزَكّونَ</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">أَنفُسَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="بَلِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَلِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يُزَكّى" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">يُزَكّى</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">يُظلَمونَ</button>
    <button class="word-link" type="button" data-word="فَتيلًا" data-root="ف ت ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-l/" data-root-meaning="تابیدن رشته؛ فتیل: رشته باریک در شکاف هسته خرما.">فَتيلًا</button>
  </p>
  <p class="farsi-verse">آیا به کسانی که خود را پاک می‌شمارند ننگریستی؟ بلکه آن معبود یگانه هر که را بخواهد پاک می‌کند؛ و به اندازه رشته‌ای ستم نمی‌بینند.</p>
</section>
