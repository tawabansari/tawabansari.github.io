  <p class="farsi-verse">و با زنانی که پدرانتان با آنان ازدواج کرده‌اند ازدواج نکنید، مگر آنچه پیش‌تر گذشته است. همانا این کاری زشت و نفرت‌انگیز و راهی بد است.</p>
