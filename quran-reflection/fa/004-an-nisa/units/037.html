  <p class="farsi-verse">کسانی که بخل می‌ورزند و مردم را به بخل فرمان می‌دهند و آنچه آن معبود یگانه از فضلش به آنان داده پنهان می‌کنند. و برای انکارکنندگان عذابی خوارکننده آماده کرده‌ایم.</p>
