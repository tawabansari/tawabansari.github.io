  <p class="farsi-verse">مگر کسانی که توبه کردند و اصلاح کردند و به آن معبود یگانه چنگ زدند و دینشان را برای آن معبود یگانه خالص کردند؛ پس آنان با مؤمنان‌اند. و آن معبود یگانه به‌زودی پاداشی بزرگ به مؤمنان می‌دهد.</p>
