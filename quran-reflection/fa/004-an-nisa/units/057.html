  <p class="farsi-verse">و کسانی که ایمان آوردند و کارهای شایسته کردند، به‌زودی آنان را به باغ‌هایی وارد می‌کنیم که از زیرشان نهرها روان است؛ همواره در آن‌ها ماندگارند. برای آنان در آنجا همسرانی پاکیزه است؛ و آنان را به سایه‌ای گسترده وارد می‌کنیم.</p>
