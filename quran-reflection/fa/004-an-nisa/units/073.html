  <p class="farsi-verse">و اگر فضلی از آن معبود یگانه به شما برسد، بی‌گمان می‌گوید، گویی میان شما و او هیچ دوستی نبوده است: «ای کاش با آنان بودم و به کامیابی بزرگی می‌رسیدم.»</p>
