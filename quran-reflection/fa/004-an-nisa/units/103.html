<section class="ayah-block" id="ayah-103" data-translation-status="provisional">
  <h2 class="ayah-title">النساء ۴:۱۰۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="قَضَيتُمُ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="به انجام رساندید؛ در عبارتِ پایان یافتن صلات.">قَضَيتُمُ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلات؛ عملی که از به انجام رسیدن آن سخن می‌رود.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="فَاذكُرُوا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="پس یاد کنید؛ فرمان یاد کردن خداوند در حالت‌های مختلف.">فَاذكُرُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قِيٰمًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ایستاده؛ یکی از حالت‌های یاد کردن خداوند.">قِيٰمًا</button>
    <button class="word-link" type="button" data-word="وَقُعودًا" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار" data-context="و نشسته؛ در کنار ایستاده و بر پهلو بودن.">وَقُعودًا</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="جُنوبِكُم" data-root="ج ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-b/" data-root-meaning="پهلو، کنار و ناحیه؛ اجتناب: کنار گرفتن و دوری کردن؛ جُنُب وضعیت آیینیِ مشخصی است." data-context="پهلوهایتان؛ در ترکیبِ یاد کردن بر پهلوها.">جُنوبِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="اطمَأنَنتُم" data-root="ط م أ ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-m-a-n/" data-root-meaning="آرام گرفتن و اطمینان یافتن پس از اضطراب؛ با تحلیل کوتاه‌تر «طمن» نیز ثبت می‌شود." data-context="آرام و ایمن شدید؛ پس از وضعیت خوف و خطر.">اطمَأنَنتُم</button>
    <button class="word-link" type="button" data-word="فَأَقيمُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="پس صلات را برپا دارید؛ فرمان پس از بازگشت آرامش.">فَأَقيمُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلات؛ آنچه برپایی آن پس از آرامش فرمان داده می‌شود.">الصَّلوٰةَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلات؛ موضوعِ حکمِ تکلیف دارای وقت مقرر.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بوده است؛ بیانِ مقرر بودن حکم صلات برای مؤمنان.">كانَت</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="بر مؤمنان؛ کسانی که تکلیف صلات بر آنان مقرر است.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="كِتٰبًا" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="تکلیفی مقرر؛ در ترکیب «کتابا موقوتا»، امری الزام‌آور با وقت تعیین‌شده.">كِتٰبًا</button>
    <button class="word-link" type="button" data-word="مَوقوتًا" data-root="و ق ت" data-root-meaning="زمان یا حد زمانی معین، و تعیینِ آن برای کار، قرار یا رویدادی مشخص." data-context="دارای وقت مقرر؛ وصفِ تکلیف صلات در ترکیب «کتابا موقوتا»." data-learn-more="/quran-terminology/fa/roots/w-q-t/">مَوقوتًا</button>
  </p>
  <p class="farsi-verse">پس چون صلات را به پایان رساندید، آن معبود یگانه را ایستاده و نشسته و بر پهلوهایتان یاد کنید. پس هنگامی که آرامش یافتید، صلات را برپا کنید. همانا صلات بر مؤمنان تکلیفی زمان‌دار است.</p>
</section>
