<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="عيسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عيسَى</button>
    <button class="word-link" type="button" data-word="ابنُ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">ابنُ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَريَمَ</button>
    ۚ
    <button class="word-link" type="button" data-word="قَولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قَولَ</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">الحَقِّ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="يَمتَرونَ" data-root="م ر ي" data-learn-more="/quran-terminology/fa/roots/m-r-y/" data-root-meaning="تردید، دودلی و مجادله؛ از بیرون کشیدن شیر تا کشمکش بر سر حقیقت و مرز میان پرسش و مراء در قرآن">يَمتَرونَ</button>
  </p>
  <p class="farsi-verse">این است عیسی پسر مریم؛ سخن حق، همان که درباره‌اش تردید می‌کنند.</p>
</section>
