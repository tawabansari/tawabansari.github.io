<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَسمَعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="می‌شنوند؛ شنیدن سخن لغو از آنان نفی می‌شود.">يَسمَعونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="لَغوًا" data-root="ل غ و" data-learn-more="/quran-terminology/fa/roots/l-gh-w/" data-root-meaning="سخن یا کار بی‌اعتبار و بی‌حاصل، یا چیزی که در حساب نمی‌آید؛ در شاخهٔ گفتاری، سخن گفتن و ایجاد هیاهو." data-context="سخن بیهوده؛ آنچه شنیدن آن در جنت نفی شده است.">لَغوًا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="سَلٰمًا" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="سلام؛ گفتار آرامش و صلح در برابر سخن لغو.">سَلٰمًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="رِزقُهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="روزیِ آنان؛ آنچه در آنجا برایشان فراهم است.">رِزقُهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="ب ك ر" data-learn-more="/quran-terminology/fa/roots/b-k-r/" data-root-meaning="از آغاز روز و پیش‌افتادگی تا باقی بودن در مرحلهٔ نخستین" data-context="بامداد؛ یکی از دو هنگام یادشده برای روزی آنان.">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَعَشِيًّا" data-root="ع ش و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-w/" data-root-meaning="بخش پایانی روز و شامگاه؛ عَشو: کم‌دیدن یا چشم پوشیدن." data-context="و شامگاه؛ همراه بامداد در بیان روزی آنان.">وَعَشِيًّا</button>
  </p>
  <p class="farsi-verse">در آن سخن بیهوده نمی‌شنوند، جز سلام؛ و روزی‌شان در آن بامداد و شامگاه برایشان فراهم است.</p>
</section>
