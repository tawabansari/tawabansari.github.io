<section class="ayah-block" id="ayah-086" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۸۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَسوقُ" data-root="س و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-q/" data-root-meaning="راندن و پیش بردن؛ سوق: بازار؛ ساق: بخش پایین پا.">وَنَسوقُ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-r-m/" data-root-meaning="بریدن و به دست آوردن؛ إجرام: مرتکب شدن جرم یا گناه؛ «لا جرم» ساختی برای تأکید و قطعیت است.">المُجرِمينَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="وِردًا" data-root="و ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-d/" data-root-meaning="رسیدن به آب یا مقصد؛ وِرد: ورود یا بهره مقرر.">وِردًا</button>
  </p>
  <p class="farsi-verse">و مجرمان را تشنه به سوی جهنم می‌رانیم.</p>
</section>
