<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنذِرهُم" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="و آنان را بیم ده؛ هشدار دربارهٔ روز حسرت و فرجام.">وَأَنذِرهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمان مشخصِ مواجهه با فرجام و حسرت.">يَومَ</button>
    <button class="word-link" type="button" data-word="الحَسرَةِ" data-root="ح س ر" data-root-meaning="کنار رفتن پوشش و آشکار شدن؛ تحلیل رفتن نیرو و فرسودگی؛ نیز حسرت، دریغ و اندوه شدید بر فقدان یا پیامد ناخوشایند." data-learn-more="/quran-terminology/fa/roots/h-s-r/" data-context="حسرت؛ دریغ و اندوهی که روزِ فیصله یافتن کار با آن وصف می‌شود.">الحَسرَةِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="قُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="فیصله یافته است؛ فعل مجهول دربارهٔ نهایی شدن کار.">قُضِىَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا؛ نیز کار، شأن و رخداد در کاربرد اسمی." data-context="کار و امر نهایی؛ آنچه فیصله یافتن آن با حسرت پیوند دارد.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="غَفلَةٍ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری" data-context="غفلت؛ بی‌توجهی آنان به هشدار و فرجام.">غَفلَةٍ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان نمی‌آورند؛ نفی باور آنان در ادامهٔ وصف غفلت.">يُؤمِنونَ</button>
  </p>
  <p class="farsi-verse">و آنان را از روز حسرت بیم ده، آنگاه که کار پایان یافته است، در حالی که در غفلت‌اند و ایمان نمی‌آورند.</p>
</section>
