<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَرًّا" data-root="ب ر ر" data-learn-more="/quran-terminology/fa/roots/b-r-r/" data-root-meaning="نیکی گسترده، راست‌کرداری، وفاداری، احسان، گشودگی در خیر، و ایستادن بر زمین استوار اخلاقی" data-context="و نیکوکار؛ رفتار نیک و گستردهٔ یحیی در حق والدین.">وَبَرًّا</button>
    <button class="word-link" type="button" data-word="بِوٰلِدَيهِ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="به پدر و مادرش؛ والدینی که نیکوکاری یحیی متوجه آنان است.">بِوٰلِدَيهِ</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="يَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ در ساخت نفی «زورگو و نافرمان نبود».">يَكُن</button>
    <button class="word-link" type="button" data-word="جَبّارًا" data-root="ج ب ر" data-root-meaning="اصلاح شکستگی و جبران کمبود؛ استواری، قدرت، چیرگی و واداشتن." data-context="زورگو و خودبرتربین؛ وصفی که از یحیی، در کنار نفی نافرمانی، نفی شده است." data-learn-more="/quran-terminology/fa/roots/j-b-r/">جَبّارًا</button>
    <button class="word-link" type="button" data-word="عَصِيًّا" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت." data-context="نافرمان؛ وصف سرپیچی که در کنار جبار بودن از یحیی نفی می‌شود.">عَصِيًّا</button>
  </p>
  <p class="farsi-verse">و به پدر و مادرش نیکوکار بود و زورگوی نافرمان نبود.</p>
</section>
