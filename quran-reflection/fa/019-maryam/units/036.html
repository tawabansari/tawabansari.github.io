<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبّى</button>
    <button class="word-link" type="button" data-word="وَرَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">وَرَبُّكُم</button>
    <button class="word-link" type="button" data-word="فَاعبُدوهُ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/">فَاعبُدوهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="صِرٰطٌ" data-root="ص ر ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صِرٰطٌ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">مُستَقيمٌ</button>
  </p>
  <p class="farsi-verse">و همانا آن معبود یگانه پروردگار من و پروردگار شماست؛ پس او را بپرستید؛ این راهی راست است.</p>
