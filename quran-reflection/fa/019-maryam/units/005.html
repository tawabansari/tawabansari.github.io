<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="خِفتُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">خِفتُ</button>
    <button class="word-link" type="button" data-word="المَوٰلِىَ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">المَوٰلِىَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="وَراءى" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش">وَراءى</button>
    <button class="word-link" type="button" data-word="وَكانَتِ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانَتِ</button>
    <button class="word-link" type="button" data-word="امرَأَتى" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرَأَتى</button>
    <button class="word-link" type="button" data-word="عاقِرًا" data-root="ع ق ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عاقِرًا</button>
    <button class="word-link" type="button" data-word="فَهَب" data-root="و ه ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَهَب</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لَدُنكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدُنكَ</button>
    <button class="word-link" type="button" data-word="وَلِيًّا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">وَلِيًّا</button>
  </p>
  <p class="farsi-verse">و من از خویشاوندان پس از خود بیم دارم و همسرم نازا بوده است؛ پس از نزد خود سرپرستی به من ببخش،</p>
</section>
