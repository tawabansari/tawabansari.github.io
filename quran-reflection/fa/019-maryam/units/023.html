<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَجاءَهَا" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="پس او را کشاند؛ درد زایمان مریم را به سوی تنهٔ نخل برد.">فَأَجاءَهَا</button>
    <button class="word-link" type="button" data-word="المَخاضُ" data-root="م خ ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-kh-dad/" data-root-meaning="جنبش و زیرورو کردن؛ مخاض: درد و حرکت زایمان." data-context="درد زایمان؛ دردهایی که مریم را به سوی تنهٔ نخل کشاند.">المَخاضُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جِذعِ" data-root="ج ذ ع" data-root-meaning="تنه اصلی درخت، به‌ویژه نخل." data-context="تنهٔ؛ در ترکیب «تنهٔ نخل»، جایی که مریم هنگام درد زایمان به کنار آن رسید." data-learn-more="/quran-terminology/fa/roots/j-dh-ayn/">جِذعِ</button>
    <button class="word-link" type="button" data-word="النَّخلَةِ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان." data-context="نخل؛ درخت خرمایی که مریم به کنار تنهٔ آن رسید.">النَّخلَةِ</button>
    <button class="word-link" type="button" data-word="قالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ مریم آرزوی خود را در آن تنگنا بیان کرد.">قالَت</button>
    <button class="word-link" type="button" data-word="يٰلَيتَنى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰلَيتَنى</button>
    <button class="word-link" type="button" data-word="مِتُّ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرده بودم؛ در آرزوی مریم که پیش از این رویداد درگذشته باشد.">مِتُّ</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از؛ بیان زمان پیش از این رویداد.">قَبلَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="وَكُنتُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بودم؛ در ادامهٔ آرزوی مریم که چیزی از یادرفته می‌بود.">وَكُنتُ</button>
    <button class="word-link" type="button" data-word="نَسيًا" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="چیزی از یادرفته؛ چیزی که از توجه و یاد بیرون افتاده است.">نَسيًا</button>
    <button class="word-link" type="button" data-word="مَنسِيًّا" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="فراموش‌شده؛ وصفی که از یاد رفتنِ «نَسْی» را تأکید می‌کند.">مَنسِيًّا</button>
  </p>
  <p class="farsi-verse">پس درد زایمان او را به سوی تنه نخل کشاند؛ گفت: ای کاش پیش از این مرده بودم و چیزی از یاد رفته و فراموش‌شده بودم.</p>
</section>
