<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَزيدُ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="و می‌افزاید؛ افزایش هدایت به دست آن معبود یگانه.">وَيَزيدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اهتَدَوا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت یافتند؛ کسانی که راه هدایت را پذیرفته‌اند.">اهتَدَوا</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت؛ آنچه برای هدایت‌یافتگان افزایش می‌یابد.">هُدًى</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالبٰقِيٰتُ" data-root="ب ق ي" data-root-meaning="«ب ق ي» به ادامه داشتن و از میان نرفتن چیزی در برابر پایان یافتن، زوال یا از دست رفتن آن اشاره دارد. در ساختمان‌های سببی، به باقی گذاشتن و حفظ کردن می‌رسد؛ در صورت‌های وصفی، ماندگاری و بازماندن را بیان می‌کند؛ و در اسم «بقية»، به آنچه از یک مجموعه، رابطه یا مایه ارزشمند همچنان بر جا مانده است اشاره دارد." data-context="ماندگارها؛ کردارهای شایسته که در پاداش و فرجام بهترند." data-learn-more="/quran-terminology/fa/roots/b-q-y/">وَالبٰقِيٰتُ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتُ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته‌ها؛ وصفِ کردارهای ماندگار و درست.">الصّٰلِحٰتُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ برتریِ کارهای شایسته از نظر پاداش.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ مرجع سنجش پاداشِ کردار.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ثَوابًا" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه" data-context="از نظر پاداش؛ جنبهٔ نخستِ برتری کردارهای شایسته.">ثَوابًا</button>
    <button class="word-link" type="button" data-word="وَخَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="و بهتر؛ برتریِ کارهای شایسته از نظر فرجام.">وَخَيرٌ</button>
    <button class="word-link" type="button" data-word="مَرَدًّا" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر" data-context="از نظر بازگشت و فرجام؛ نتیجهٔ نهایی کردار.">مَرَدًّا</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه بر هدایت کسانی که هدایت یافته‌اند می‌افزاید؛ و کارهای شایسته ماندگار نزد پروردگارت در پاداش بهتر و در بازگشت بهترند.</p>
</section>
