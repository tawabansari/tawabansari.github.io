<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَم</button>
    <button class="word-link" type="button" data-word="أَهلَكنا" data-root="ه ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-l-k/" data-root-meaning="از میان رفتن و نابود کردن؛ نیز از دست رفتن، بنا بر سیاق.">أَهلَكنا</button>
    <button class="word-link" type="button" data-word="قَبلَهُم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَرنٍ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره.">قَرنٍ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="أَثٰثًا" data-root="أ ث ث" data-learn-more="/quran-terminology/fa/roots/a-th-th/" data-root-meaning="اسباب و دارایی؛ داشته‌ها و امکانات مادی‌ای که برخورداری شخص یا گروه را نشان می‌دهند.">أَثٰثًا</button>
    <button class="word-link" type="button" data-word="وَرِءيًا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">وَرِءيًا</button>
  </p>
  <p class="farsi-verse">و چه بسیار نسل‌هایی را پیش از آنان نابود کردیم که در اسباب و ظاهر نیکوتر بودند.</p>
</section>
