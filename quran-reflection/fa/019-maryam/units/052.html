<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنٰدَينٰهُ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="و او را ندا دادیم؛ خطاب به موسی از جانب طور." data-learn-more="/quran-terminology/fa/roots/n-d-y/">وَنٰدَينٰهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="جانِبِ" data-root="ج ن ب" data-root-meaning="پهلو، کنار و جانب؛ فاصله گرفتن، دور ساختن و پرهیز کردن. «جُنُب» در سیاق طهارت، وضعیتِ نیازمند پاک شدن است." data-context="جانب؛ سمتِ طور." data-learn-more="/quran-terminology/fa/roots/j-n-b/">جانِبِ</button>
    <button class="word-link" type="button" data-word="الطّورِ" data-root="ط و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-w-r/" data-root-meaning="طور: کوه؛ اطوار: حالت‌ها و مرحله‌های گوناگون." data-context="طور؛ کوهِ محل ندا.">الطّورِ</button>
    <button class="word-link" type="button" data-word="الأَيمَنِ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="راست؛ وصف جانبِ طور.">الأَيمَنِ</button>
    <button class="word-link" type="button" data-word="وَقَرَّبنٰهُ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="و او را نزدیک کردیم؛ نزدیک ساختن موسی.">وَقَرَّبنٰهُ</button>
    <button class="word-link" type="button" data-word="نَجِيًّا" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-context="برای گفت‌وگوی خصوصی؛ وصف نزدیک ساختن موسی." data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن؛ و در شاخهٔ نجوا، گفت‌وگوی خصوصی و جدا از فضای عمومی؛ نجیّ: هم‌راز.">نَجِيًّا</button>
  </p>
  <p class="farsi-verse">و از سمت راست طور او را ندا دادیم و برای گفت‌وگوی نهانی نزدیکش کردیم.</p>
</section>
