<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَاذكُر</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="إِذِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذِ</button>
    <button class="word-link" type="button" data-word="انتَبَذَت" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین">انتَبَذَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَهلِها" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلِها</button>
    <button class="word-link" type="button" data-word="مَكانًا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">مَكانًا</button>
    <button class="word-link" type="button" data-word="شَرقِيًّا" data-root="ش ر ق" data-learn-more="/quran-terminology/fa/roots/sh-r-q/" data-root-meaning="از برآمدن خورشید و روشن شدن افق تا مشرق و مشارق">شَرقِيًّا</button>
  </p>
  <p class="farsi-verse">و در کتاب از مریم یاد کن، آنگاه که از خانواده‌اش به جایی در شرق کناره گرفت.</p>
</section>
