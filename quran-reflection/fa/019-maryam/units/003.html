<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="فرا خواند؛ ندای زکریا به پروردگارش." data-learn-more="/quran-terminology/fa/roots/n-d-y/">نادىٰ</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش؛ مخاطب زکریا.">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="نِداءً" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="ندایی؛ خود عمل فراخواندن که پنهانی وصف می‌شود." data-learn-more="/quran-terminology/fa/roots/n-d-y/">نِداءً</button>
    <button class="word-link" type="button" data-word="خَفِيًّا" data-root="خ ف ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-f-y/" data-root-meaning="پنهان بودن و پنهان کردن؛ برخی صورت‌ها و قرائت‌ها معنای آشکار کردن دارند." data-context="پنهانی؛ چگونگی ندای زکریا.">خَفِيًّا</button>
  </p>
  <p class="farsi-verse">آنگاه که پروردگارش را با ندایی پنهان خواند.</p>
</section>
