<section class="ayah-block" id="ayah-097" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۹۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّما</button>
    <button class="word-link" type="button" data-word="يَسَّرنٰهُ" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت">يَسَّرنٰهُ</button>
    <button class="word-link" type="button" data-word="بِلِسانِكَ" data-root="ل س ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِلِسانِكَ</button>
    <button class="word-link" type="button" data-word="لِتُبَشِّرَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/">لِتُبَشِّرَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">المُتَّقينَ</button>

    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>

    <button class="word-link" type="button" data-word="لُدًّا" data-root="ل د د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لُدًّا</button>
  </p>
  <p class="farsi-verse">پس آن را به زبان تو آسان کردیم تا با آن پرهیزگاران را مژده دهی و با آن مردمی ستیزه‌جو را بیم دهی.</p>
