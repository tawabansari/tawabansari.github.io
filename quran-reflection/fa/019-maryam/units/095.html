<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۹۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكُلُّهُم" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">وَكُلُّهُم</button>
    <button class="word-link" type="button" data-word="ءاتيهِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتيهِ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="فَردًا" data-root="ف ر د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَردًا</button>
  </p>
  <p class="farsi-verse">و همه آنان روز قیامت تنها نزد او می‌آیند.</p>
</section>
