<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَرَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پس سوگند به پروردگارت؛ تأکیدِ خبرِ گردآوری.">فَوَرَبِّكَ</button>
    <button class="word-link" type="button" data-word="لَنَحشُرَنَّهُم" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="بی‌گمان آنان و شیاطین را گرد خواهیم آورد؛ با تأکیدِ سوگند." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">لَنَحشُرَنَّهُم</button>
    <button class="word-link" type="button" data-word="وَالشَّيٰطينَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="و شیاطین؛ همراهِ آنان در گردآوری.">وَالشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَنُحضِرَنَّهُم" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت" data-context="بی‌گمان حاضر می‌کنیم؛ آنان را پیرامون جهنم.">لَنُحضِرَنَّهُم</button>
    <button class="word-link" type="button" data-word="حَولَ" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها" data-context="پیرامون؛ جایگاهِ حضور.">حَولَ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="جِثِيًّا" data-root="ج ث و" data-root-meaning="بر زانو قرار گرفتن؛ حالتی که زانوها تکیه‌گاه بدن می‌شوند." data-context="بر زانو افتاده؛ وصفِ حالتِ آنان." data-learn-more="/quran-terminology/fa/roots/j-th-w/">جِثِيًّا</button>
  </p>
  <p class="farsi-verse">پس سوگند به پروردگارت، آنان و شیاطین را گرد می‌آوریم؛ سپس آنان را زانوزده پیرامون جهنم حاضر می‌کنیم.</p>
</section>
