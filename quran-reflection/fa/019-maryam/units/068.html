<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَرَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">فَوَرَبِّكَ</button>
    <button class="word-link" type="button" data-word="لَنَحشُرَنَّهُم" data-root="ح ش ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَنَحشُرَنَّهُم</button>
    <button class="word-link" type="button" data-word="وَالشَّيٰطينَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/">وَالشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَنُحضِرَنَّهُم" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/">لَنُحضِرَنَّهُم</button>
    <button class="word-link" type="button" data-word="حَولَ" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها">حَولَ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="جِثِيًّا" data-root="ج ث و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جِثِيًّا</button>
  </p>
  <p class="farsi-verse">پس سوگند به پروردگارت، آنان و شیاطین را گرد می‌آوریم؛ سپس آنان را زانوزده پیرامون جهنم حاضر می‌کنیم.</p>
