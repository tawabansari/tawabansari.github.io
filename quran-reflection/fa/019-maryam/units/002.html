<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذِكرُ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">ذِكرُ</button>
    <button class="word-link" type="button" data-word="رَحمَتِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحمَتِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="عَبدَهُ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عَبدَهُ</button>
    <button class="word-link" type="button" data-word="زَكَرِيّا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">زَكَرِيّا</button>
  </p>
  <p class="farsi-verse">یاد رحمت پروردگارت بر بنده‌اش زکریاست؛</p>
</section>
