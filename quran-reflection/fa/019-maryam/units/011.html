<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَخَرَجَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="پس بیرون آمد؛ خروج زکریا از محراب به سوی قومش.">فَخَرَجَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قوم او؛ مردمی که زکریا پس از خروج از محراب با آنان ارتباط برقرار کرد.">قَومِهِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المِحرابِ" data-root="ح ر ب" data-root-meaning="جنگ و رویارویی خصمانه؛ سلب دارایی؛ و در شاخهٔ محراب، جایگاه ممتاز و بلند." data-context="محراب؛ جایگاه مخصوص عبادت که زکریا از آن به سوی قومش بیرون می‌آید." data-learn-more="/quran-terminology/fa/roots/h-r-b/">المِحرابِ</button>
    <button class="word-link" type="button" data-word="فَأَوحىٰ" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="پس به آنان اشاره کرد؛ رساندن پیام تسبیح به قوم خود.">فَأَوحىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="سَبِّحوا" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="تسبیح گویید؛ پیام زکریا به قومش برای بامداد و شامگاه.">سَبِّحوا</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="ب ك ر" data-learn-more="/quran-terminology/fa/roots/b-k-r/" data-root-meaning="از آغاز روز و پیش‌افتادگی تا باقی بودن در مرحلهٔ نخستین" data-context="بامداد؛ یکی از دو زمان یادشده برای تسبیح.">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَعَشِيًّا" data-root="ع ش و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-w/" data-root-meaning="بخش پایانی روز و شامگاه؛ عَشو: کم‌دیدن یا چشم پوشیدن." data-context="و شامگاه؛ زمان دیگرِ یادشده برای تسبیح.">وَعَشِيًّا</button>
  </p>
  <p class="farsi-verse">پس از محراب نزد قومش بیرون آمد و به آنان اشاره کرد که بامداد و شامگاه تسبیح گویید.</p>
</section>
