<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَشارَت" data-root="ش و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-w-r/" data-root-meaning="مشورت و رایزنی؛ اشاره و نشان دادن." data-context="مریم به سوی کودک اشاره کرد.">فَأَشارَت</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="مخاطبانِ مریم گفتند.">قالوا</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="نُكَلِّمُ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="چگونه با او سخن بگوییم؟">نُكَلِّمُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="در گهواره و در حالت کودکی است؛ در پرسشِ آنان.">كانَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="المَهدِ" data-root="م ه د" data-root-meaning="آماده و مناسب ساختن جایگاه یا شرایط برای قرار گرفتن، زندگی کردن یا انجام کاری؛ مهد و مهاد: گهواره، بستر یا جایگاه آماده." data-context="گهواره و جایگاهِ کودک که مردم سخن گفتن با او را شگفت می‌دانند." data-learn-more="/quran-terminology/fa/roots/m-h2-d/">المَهدِ</button>
    <button class="word-link" type="button" data-word="صَبِيًّا" data-root="ص ب و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-w/" data-root-meaning="کودکی؛ نیز میل و اشتیاق پیدا کردن." data-context="کودکی؛ وصفِ عیسی در گهواره.">صَبِيًّا</button>
  </p>
  <p class="farsi-verse">پس به او اشاره کرد؛ گفتند: چگونه با کسی که کودکی در گهواره است سخن بگوییم؟</p>
</section>
