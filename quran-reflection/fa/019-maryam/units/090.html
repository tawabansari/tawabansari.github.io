<section class="ayah-block" id="ayah-090" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۹۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَكادُ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن" data-context="نزدیک است؛ بیانِ نزدیک شدن رخدادهای شدید.">تَكادُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ آنچه نزدیک به شکافته شدن است.">السَّمٰوٰتُ</button>
    <button class="word-link" type="button" data-word="يَتَفَطَّرنَ" data-root="ف ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-tt-r/" data-root-meaning="شکافتن؛ فطر: آغاز پدیدآوردن؛ فطرت: سرشت آغازین." data-context="از هم بشکافند؛ شکافتن آسمان‌ها در بیان آیه.">يَتَفَطَّرنَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="وَتَنشَقُّ" data-root="ش ق ق" data-learn-more="/quran-terminology/fa/roots/sh-q-q/" data-root-meaning="شکافتن، رخنه، جانب، مشقت، فاصله و گسست جبهه‌ساز" data-context="و بشکافد؛ شکافتن زمین.">وَتَنشَقُّ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ آنچه در آیه به شکافتن وصف شده است.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="وَتَخِرُّ" data-root="خ ر ر" data-root-meaning="فرو افتادن و حرکت به سوی پایین؛ در شاخه‌های لغوی دیگر، جریان و صدای آن." data-context="و فرو افتند؛ فروافتادن کوه‌ها." data-learn-more="/quran-terminology/fa/roots/kh-r-r/">وَتَخِرُّ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ در بیان فرو افتادن و درهم شکستن آنها." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالُ</button>
    <button class="word-link" type="button" data-word="هَدًّا" data-root="ه د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-d-d/" data-root-meaning="شکستن، فروریختن و ویرانی شدید." data-context="درهم‌شکستنی شدید؛ تأکید بر فروپاشی کوه‌ها.">هَدًّا</button>
  </p>
  <p class="farsi-verse">نزدیک است آسمان‌ها از آن پاره شوند و زمین بشکافد و کوه‌ها درهم‌شکسته فرو افتند،</p>
</section>
