<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="زکریا گفت.">قالَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ خطابِ زکریا.">رَبِّ</button>
    <button class="word-link" type="button" data-word="اجعَل" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="برای من قرار بده.">اجعَل</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌ای برای زکریا.">ءايَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پاسخ به درخواستِ زکریا.">قالَ</button>
    <button class="word-link" type="button" data-word="ءايَتُكَ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانهٔ تو.">ءايَتُكَ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تُكَلِّمَ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="با مردم سخن بگویی؛ در ساخت نفی آمده است.">تُكَلِّمَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ مخاطبانِ گفتار.">النّاسَ</button>
    <button class="word-link" type="button" data-word="ثَلٰثَ" data-root="ث ل ث" data-root-meaning="عدد سه و صورت‌های وابسته؛ شمار سه، جایگاه سوم، یک‌سوم و دوسوم، و توزیع سه‌تایی." data-context="سه شب که نشانهٔ زکریا، سخن نگفتن با مردم در حالی است که سالم است." data-learn-more="/quran-terminology/fa/roots/th-l-th/">ثَلٰثَ</button>
    <button class="word-link" type="button" data-word="لَيالٍ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب‌ها؛ واحدِ دورهٔ سه‌شبه.">لَيالٍ</button>
    <button class="word-link" type="button" data-word="سَوِيًّا" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="در حالی که سالم و بی‌نقصی؛ قیدِ وضعیت زکریا.">سَوِيًّا</button>
  </p>
  <p class="farsi-verse">گفت: پروردگارا، برایم نشانه‌ای قرار ده؛ گفت: نشانه‌ات این است که سه شب با مردم سخن نگویی، در حالی که سالمی.</p>
</section>
