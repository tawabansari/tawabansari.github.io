<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلَنى" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="مرا قرار داده است؛ عیسی از فعلِ آن معبود یگانه سخن می‌گوید.">وَجَعَلَنى</button>
    <button class="word-link" type="button" data-word="مُبارَكًا" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="عیسی می‌گوید مرا هرجا باشم مبارک قرار داده است؛ انسانی برخوردار از خیر و سودرسانی." data-learn-more="/quran-terminology/fa/roots/b-r-k/">مُبارَكًا</button>
    <button class="word-link" type="button" data-word="أَينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَينَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشم؛ در تعبیرِ «هرجا که باشم».">كُنتُ</button>
    <button class="word-link" type="button" data-word="وَأَوصٰنى" data-root="و ص ي" data-learn-more="/quran-terminology/fa/roots/w-sad-y/" data-root-meaning="سفارش، سپردن مسئولیت و انتقال تعهد؛ از وصیت فردی تا تواصی اجتماعی" data-context="مرا سفارش و مکلف کرده است.">وَأَوصٰنى</button>
    <button class="word-link" type="button" data-word="بِالصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="به صلات؛ یکی از سفارش‌های بیان‌شده.">بِالصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="وَالزَّكوٰةِ" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری" data-context="به زکات؛ در کنارِ صلات.">وَالزَّكوٰةِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="دُمتُ" data-root="د و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-w-m/" data-root-meaning="دوام آوردن، پایدار ماندن و ادامه داشتن." data-context="تا باقی بمانم؛ در «ما دمت حیّاً».">دُمتُ</button>
    <button class="word-link" type="button" data-word="حَيًّا" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زنده؛ وصفِ عیسی در بیانِ مدتِ تکلیف.">حَيًّا</button>
  </p>
  <p class="farsi-verse">و هر جا باشم مرا پربرکت قرار داده و تا زنده‌ام مرا به صلات و زکات سفارش کرده است،</p>
</section>
