<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُزّى" data-root="ه ز ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-z-z/" data-root-meaning="تکان دادن و جنبش شدید." data-context="و تکان ده؛ فرمان به مریم برای تکان دادن تنهٔ نخل.">وَهُزّى</button>
    <button class="word-link" type="button" data-word="إِلَيكِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكِ</button>
    <button class="word-link" type="button" data-word="بِجِذعِ" data-root="ج ذ ع" data-root-meaning="تنه اصلی درخت، به‌ویژه نخل." data-context="تنهٔ؛ در ترکیب «تنهٔ نخل»، بخشی که مریم مأمور شد آن را به سوی خود تکان دهد." data-learn-more="/quran-terminology/fa/roots/j-dh-ayn/">بِجِذعِ</button>
    <button class="word-link" type="button" data-word="النَّخلَةِ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان." data-context="نخل؛ درخت خرمایی که مریم به تکان دادن تنهٔ آن فرمان می‌یابد.">النَّخلَةِ</button>
    <button class="word-link" type="button" data-word="تُسٰقِط" data-root="س ق ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-q-tt/" data-root-meaning="افتادن و فرو افکندن." data-context="فرو می‌ریزد؛ نخل خرمای تازه و رسیده را بر مریم فرو می‌افکند.">تُسٰقِط</button>
    <button class="word-link" type="button" data-word="عَلَيكِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكِ</button>
    <button class="word-link" type="button" data-word="رُطَبًا" data-root="ر ط ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-tt-b/" data-root-meaning="تر و تازه بودن؛ رُطَب: خرمای تازه و رسیده." data-context="خرمای تازه و رسیده؛ خوراکی که از نخل بر مریم فرو می‌ریزد.">رُطَبًا</button>
    <button class="word-link" type="button" data-word="جَنِيًّا" data-root="ج ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-y/" data-root-meaning="چیدن و به دست آوردن میوه؛ جنى: میوهٔ چیدنی؛ جنیّ: تازه و آمادهٔ چیدن." data-context="رسیده و آمادهٔ چیدن؛ وصف خرمایی که بر مریم فرو می‌ریزد.">جَنِيًّا</button>
  </p>
  <p class="farsi-verse">و تنه نخل را به سوی خود تکان ده تا خرمای تازه و رسیده بر تو فرو ریزد.</p>
</section>
