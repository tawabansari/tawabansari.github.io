<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَلّا</button>
    ۚ
    <button class="word-link" type="button" data-word="سَيَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">سَيَكفُرونَ</button>
    <button class="word-link" type="button" data-word="بِعِبادَتِهِم" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">بِعِبادَتِهِم</button>
    <button class="word-link" type="button" data-word="وَيَكونونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَيَكونونَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="ضِدًّا" data-root="ض د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-d-d/" data-root-meaning="مخالفت و ناسازگاری؛ ضدّ: مقابل یا دشمن.">ضِدًّا</button>
  </p>
  <p class="farsi-verse">هرگز؛ پرستش آنان را انکار خواهند کرد و بر ضدشان خواهند بود.</p>
</section>
