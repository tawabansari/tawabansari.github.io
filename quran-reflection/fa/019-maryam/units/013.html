<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَحَنانًا" data-root="ح ن ن" data-root-meaning="اشتیاق و کشش عاطفی؛ مهر، دلسوزی و نرمی؛ در کاربردهای صوتی، حنین و صداهای شبیه آن." data-context="و مهر و شفقتی؛ عطیه‌ای از نزد خدا در سرگذشت یحیی. جهت مهر، لطف خدا به یحیی یا خصلت مهربانیِ بخشیده‌شده به او، در تفسیر بررسی می‌شود و در خود عبارت صریحاً تعیین نشده است." data-learn-more="/quran-terminology/fa/roots/h-n-n/">وَحَنانًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لَدُنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدُنّا</button>
    <button class="word-link" type="button" data-word="وَزَكوٰةً" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری" data-context="و پاکیزگی و رشد؛ عطیه‌ای در وصف یحیی که در کنار حنان آمده است.">وَزَكوٰةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بود؛ وصف پایدار یحیی به تقوا در ادامهٔ جمله.">وَكانَ</button>
    <button class="word-link" type="button" data-word="تَقِيًّا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پرهیزگار و مراقب رفتار خود؛ وصف یحیی به تقوا.">تَقِيًّا</button>
  </p>
  <p class="farsi-verse">و مهری از نزد خود و پاکی؛ و او پرهیزگار بود،</p>
</section>
