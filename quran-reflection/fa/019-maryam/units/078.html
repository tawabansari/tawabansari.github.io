<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَطَّلَعَ" data-root="ط ل ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَطَّلَعَ</button>
    <button class="word-link" type="button" data-word="الغَيبَ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد">الغَيبَ</button>
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذَ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="عَهدًا" data-root="ع ه د" data-learn-more="/quran-terminology/fa/roots/ayn-h2-d/" data-root-meaning="شناخت همراه با تعهد، پیمان، نگهداری و پاسخگویی">عَهدًا</button>
  </p>
  <p class="farsi-verse">آیا بر نهان آگاه شده یا نزد فرارحمن پیمانی گرفته است؟</p>
