<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أَنعَمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمت بخشید؛ خداوند به پیامبران یادشده لطف و بخشش ارزانی داشت.">أَنعَمَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النَّبِيّـۧنَ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="پیامبران؛ کسانی که دریافت‌کنندگان نعمت الهی در این عبارت معرفی می‌شوند.">النَّبِيّـۧنَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّةِ" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="فرزندان و نسل آدم.">ذُرِّيَّةِ</button>
    <button class="word-link" type="button" data-word="ءادَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">ءادَمَ</button>
    <button class="word-link" type="button" data-word="وَمِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمَّن</button>
    <button class="word-link" type="button" data-word="حَمَلنا" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="حمل کردیم؛ کسانی که همراه نوح بر کشتی برده شدند." data-learn-more="/quran-terminology/fa/roots/h-m-l/">حَمَلنا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّةِ" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="فرزندان و نسل ابراهیم و اسرائیل.">ذُرِّيَّةِ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="وَإِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَإِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="وَمِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمَّن</button>
    <button class="word-link" type="button" data-word="هَدَينا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت کردیم؛ کسانی که راه‌نمایی الهی شامل آنان شد.">هَدَينا</button>
    <button class="word-link" type="button" data-word="وَاجتَبَينا" data-root="ج ب ي" data-root-meaning="گردآوردن و فراهم آوردن چیزی؛ و در صورت اجتباء، برگزیدن و اختصاص دادن کسی یا چیزی." data-context="و برگزیدیم؛ کسانی که مشمول گزینش الهی شدند." data-learn-more="/quran-terminology/fa/roots/j-b-y/">وَاجتَبَينا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="تُتلىٰ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر" data-context="خوانده می‌شود؛ تلاوت آیات بر آنان.">تُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="ءايٰتُ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات و نشانه‌های رحمان که بر آنان خوانده می‌شود.">ءايٰتُ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمان؛ صاحب رحمت فراگیر که آیاتش بر آنان خوانده می‌شود.">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="خَرّوا" data-root="خ ر ر" data-root-meaning="فرو افتادن و حرکت به سوی پایین؛ در شاخه‌های لغوی دیگر، جریان و صدای آن." data-context="فرو می‌افتادند؛ هنگام شنیدن آیات، سجده‌کنان و گریان." data-learn-more="/quran-terminology/fa/roots/kh-r-r/">خَرّوا</button>
    <button class="word-link" type="button" data-word="سُجَّدًا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="سجده‌کنان؛ حالت آنان هنگام فرو افتادن در پاسخ به آیات.">سُجَّدًا</button>
    <button class="word-link" type="button" data-word="وَبُكِيًّا" data-root="ب ك ي" data-root-meaning="«ب ک ي» به گریستن اشاره دارد؛ بروز حالتی که می‌تواند با اشک، صدای زاری یا اندوه و تاثر همراه باشد. در ساختمان سببی، به گریاندن یا سبب گریستن شدن می‌رسد." data-context="و گریان؛ حالت شنوندگان آیات رحمان، همراه با سجده." data-learn-more="/quran-terminology/fa/roots/b-k-y/">وَبُكِيًّا</button>
    ۩
  </p>
  <p class="farsi-verse">اینان کسانی از پیامبران‌اند که آن معبود یگانه به آنان نعمت داد؛ از نسل آدم و از کسانی که با نوح حمل کردیم و از نسل ابراهیم و اسرائیل و از کسانی که هدایت کردیم و برگزیدیم؛ چون نشانه‌های فرارحمن بر آنان خوانده می‌شد، سجده‌کنان و گریان فرو می‌افتادند.</p>
</section>
