<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">وَاذكُر</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">الكِتٰبِ</button>

    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَ</button>
    <button class="word-link" type="button" data-word="مُخلَصًا" data-root="خ ل ص" data-learn-more="/quran-terminology/fa/roots/kh-l-sad/">مُخلَصًا</button>

    <button class="word-link" type="button" data-word="رَسولًا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">رَسولًا</button>
    <button class="word-link" type="button" data-word="نَبِيًّا" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/">نَبِيًّا</button>
  </p>
  <p class="farsi-verse">و در کتاب از موسی یاد کن؛ او خالص‌شده بود و فرستاده‌ای پیامبر بود.</p>
