<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَحَمَلَتهُ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="پس او را باردار شد؛ حملِ عیسی در بدن مریم." data-learn-more="/quran-terminology/fa/roots/h-m-l/">فَحَمَلَتهُ</button>
    <button class="word-link" type="button" data-word="فَانتَبَذَت" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین" data-context="پس کناره گرفت؛ دور شدن مریم از دیگران.">فَانتَبَذَت</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="مَكانًا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="جایی؛ مقصد کناره‌گیری مریم.">مَكانًا</button>
    <button class="word-link" type="button" data-word="قَصِيًّا" data-root="ق ص و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-w/" data-root-meaning="دوری و دورترین جانب." data-context="دور؛ وصف جایگاه کناره‌گیری.">قَصِيًّا</button>
  </p>
  <p class="farsi-verse">پس به او باردار شد و با او به جایی دور کناره گرفت.</p>
</section>
