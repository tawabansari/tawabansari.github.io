<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ پاسخ پدر ابراهیم.">قالَ</button>
    <button class="word-link" type="button" data-word="أَراغِبٌ" data-root="ر غ ب" data-learn-more="/quran-terminology/fa/roots/r-gh-b/" data-root-meaning="خواستن و روی آوردن، روی‌گردانی و جهت رغبت انسان" data-context="آیا روی‌گردانی؛ پرسش پدر از موضع ابراهیم.">أَراغِبٌ</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ءالِهَتى" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبودان من؛ موضوع روی‌گردانی در سخن پدر.">ءالِهَتى</button>
    <button class="word-link" type="button" data-word="يٰإِبرٰهيمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰإِبرٰهيمُ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَنتَهِ" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="دست بکشی؛ در تهدید پدر ابراهیم برای ترک دعوت." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">تَنتَهِ</button>
    <button class="word-link" type="button" data-word="لَأَرجُمَنَّكَ" data-root="ر ج م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-m/" data-root-meaning="سنگ افکندن؛ رجم: نیز طرد کردن یا ادعای حدسی، بنا بر سیاق." data-context="حتماً سنگسارت می‌کنم؛ تهدید پدر در صورت دست نکشیدن.">لَأَرجُمَنَّكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاهجُرنى" data-root="ه ج ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-j-r/" data-root-meaning="جدا شدن و ترک کردن؛ هجرت: از جایی کوچ کردن." data-context="و از من دور شو؛ مطالبهٔ جدایی در سخن پدر.">وَاهجُرنى</button>
    <button class="word-link" type="button" data-word="مَلِيًّا" data-root="م ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-w/" data-root-meaning="مدت طولانی و مهلت دادن؛ املاء: فرصت و امتداد بخشیدن." data-context="مدتی دراز؛ وصف دوریِ مطالبه‌شده.">مَلِيًّا</button>
  </p>
  <p class="farsi-verse">گفت: ای ابراهیم، آیا از معبودان من روی‌گردانی؟ اگر دست برنداری، بی‌گمان سنگسارت می‌کنم؛ و برای مدتی دراز از من دور شو.</p>
</section>
