<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَخَلَفَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">فَخَلَفَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِم" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدِهِم</button>
    <button class="word-link" type="button" data-word="خَلفٌ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">خَلفٌ</button>
    <button class="word-link" type="button" data-word="أَضاعُوا" data-root="ض ي ع" data-learn-more="/quran-terminology/fa/roots/dad-y-ayn/" data-root-meaning="ضایع شدن، از دست رفتن و تباه کردن؛ از حق و مسئولیت رهاشده تا ضایع نشدن ایمان، عمل و اجر نزد آن معبود یگانه">أَضاعُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعُوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">وَاتَّبَعُوا</button>
    <button class="word-link" type="button" data-word="الشَّهَوٰتِ" data-root="ش ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-w/" data-root-meaning="میل و خواست شدید برای چیزی.">الشَّهَوٰتِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَسَوفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَسَوفَ</button>
    <button class="word-link" type="button" data-word="يَلقَونَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">يَلقَونَ</button>
    <button class="word-link" type="button" data-word="غَيًّا" data-root="غ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-y/" data-root-meaning="گمراهی و منحرف ساختن از راه درست.">غَيًّا</button>
  </p>
  <p class="farsi-verse">پس پس از آنان جانشینانی آمدند که صلات را تباه کردند و از خواهش‌ها پیروی کردند؛ پس به گمراهی خواهند رسید،</p>
</section>
