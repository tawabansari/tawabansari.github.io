<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَرِثُنى" data-root="و ر ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَرِثُنى</button>
    <button class="word-link" type="button" data-word="وَيَرِثُ" data-root="و ر ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَرِثُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ءالِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالِ</button>
    <button class="word-link" type="button" data-word="يَعقوبَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يَعقوبَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاجعَلهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَاجعَلهُ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="رَضِيًّا" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل">رَضِيًّا</button>
  </p>
  <p class="farsi-verse">که از من و از خاندان یعقوب ارث ببرد؛ و پروردگارا، او را پسندیده گردان.</p>
</section>
