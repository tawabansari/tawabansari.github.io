<section class="ayah-block" id="ayah-089" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۸۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="جِئتُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/">جِئتُم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="إِدًّا" data-root="أ د د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">إِدًّا</button>

  <p class="farsi-verse">به‌راستی چیزی سخت زشت آورده‌اید.</p>
