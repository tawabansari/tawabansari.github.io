<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاتَّخَذَت" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="پس اختیار کرد و قرار داد؛ حجاب میان خود و دیگران را.">فَاتَّخَذَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِم" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="جدا از آنان و در برابر دسترسی مستقیمشان؛ در عبارت «من دونهم».">دونِهِم</button>
    <button class="word-link" type="button" data-word="حِجابًا" data-root="ح ج ب" data-root-meaning="پوشاندن، مانع شدن و جدا کردن؛ جلوگیری از دیدن یا دسترسی." data-context="پرده یا جداکننده‌ای که مریم میان خود و دیگران قرار داد." data-learn-more="/quran-terminology/fa/roots/h-j-b/">حِجابًا</button>
    <button class="word-link" type="button" data-word="فَأَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="پس فرستادیم؛ روح خود را به سوی مریم.">فَأَرسَلنا</button>
    <button class="word-link" type="button" data-word="إِلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيها</button>
    <button class="word-link" type="button" data-word="روحَنا" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح" data-context="روح ما؛ آنچه به سوی مریم فرستاده شد.">روحَنا</button>
    <button class="word-link" type="button" data-word="فَتَمَثَّلَ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="پس برای او نمایان شد و صورت گرفت؛ به صورت انسانی.">فَتَمَثَّلَ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="بَشَرًا" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="انسانی؛ صورتی که روح فرستاده‌شده برای مریم به آن نمایان شد.">بَشَرًا</button>
    <button class="word-link" type="button" data-word="سَوِيًّا" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="انسانی متناسب و کامل‌اندام؛ وصف صورت نمایان‌شده برای مریم.">سَوِيًّا</button>
  </p>
  <p class="farsi-verse">پس در برابر آنان پرده‌ای گرفت؛ آنگاه روح خود را به سوی او فرستادیم و برایش به صورت انسانی تمام‌عیار نمایان شد.</p>
</section>
