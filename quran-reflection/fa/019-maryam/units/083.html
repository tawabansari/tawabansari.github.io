<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَ</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّا</button>
    <button class="word-link" type="button" data-word="أَرسَلنَا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">أَرسَلنَا</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="تَؤُزُّهُم" data-root="أ ز ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَؤُزُّهُم</button>
    <button class="word-link" type="button" data-word="أَزًّا" data-root="أ ز ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَزًّا</button>
  </p>
  <p class="farsi-verse">آیا ندیده‌ای که ما شیاطین را بر کافران فرستادیم تا آنان را سخت برانگیزند؟</p>
</section>
