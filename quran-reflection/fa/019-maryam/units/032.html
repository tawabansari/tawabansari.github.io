<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">مریم ۱۹:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَرًّا" data-root="ب ر ر" data-learn-more="/quran-terminology/fa/roots/b-r-r/">وَبَرًّا</button>
    <button class="word-link" type="button" data-word="بِوٰلِدَتى" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/">بِوٰلِدَتى</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="يَجعَلنى" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">يَجعَلنى</button>
    <button class="word-link" type="button" data-word="جَبّارًا" data-root="ج ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جَبّارًا</button>
    <button class="word-link" type="button" data-word="شَقِيًّا" data-root="ش ق ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">شَقِيًّا</button>
  </p>
  <p class="farsi-verse">و نیکوکار به مادرم؛ و مرا زورگویی تیره‌بخت قرار نداده است.</p>
