<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الطلاق ۶۵:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالّٰـٔى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالّٰـٔى</button>
    <button class="word-link" type="button" data-word="يَئِسنَ" data-root="ي أ س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-a-s/" data-root-meaning="ناامید شدن و قطع امید." data-context="امید بریده‌اند؛ ناظر به پایان انتظارِ قاعدگی در گروه یادشده.">يَئِسنَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَحيضِ" data-root="ح ي ض" data-root-meaning="حیض و جریان خون قاعدگی؛ «محیض» می‌تواند خود قاعدگی، زمان یا محل آن را بیان کند، بنا بر سیاق." data-context="قاعدگی؛ آنچه قطع امید از آن در آیه مطرح است." data-learn-more="/quran-terminology/fa/roots/h-y-dad/">المَحيضِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نِسائِكُم" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنانتان؛ گروهِ مورد بحث در بیان مدت انتظار.">نِسائِكُم</button>
    <button class="word-link" type="button" data-word="إِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنِ</button>
    <button class="word-link" type="button" data-word="ارتَبتُم" data-root="ر ي ب" data-learn-more="/quran-terminology/fa/roots/r-y-b/" data-root-meaning="تردید آشفته، بی‌اعتمادی، بدگمانی، شک بی‌ثبات‌کننده، اضطراب در برابر حق، و حالتی که انسان را از اطمینان و تسلیم در برابر برهان بازمی‌دارد" data-context="تردید کردید؛ شرطِ یادشده در بیان حکم مدت انتظار.">ارتَبتُم</button>
    <button class="word-link" type="button" data-word="فَعِدَّتُهُنَّ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="پس مدت انتظارشان؛ دورهٔ مقرّر برای گروه یادشده.">فَعِدَّتُهُنَّ</button>
    <button class="word-link" type="button" data-word="ثَلٰثَةُ" data-root="ث ل ث" data-root-meaning="عدد سه و صورت‌های وابسته؛ شمار سه، جایگاه سوم، یک‌سوم و دوسوم، و توزیع سه‌تایی." data-context="سه؛ شمارِ ماه‌های مدت انتظار." data-learn-more="/quran-terminology/fa/roots/th-l-th/">ثَلٰثَةُ</button>
    <button class="word-link" type="button" data-word="أَشهُرٍ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="ماه‌ها؛ واحد مدت انتظار سه‌ماههٔ گروه یادشده در آیه." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">أَشهُرٍ</button>
    <button class="word-link" type="button" data-word="وَالّٰـٔى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالّٰـٔى</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَحِضنَ" data-root="ح ي ض" data-root-meaning="حیض و جریان خون قاعدگی؛ «محیض» می‌تواند خود قاعدگی، زمان یا محل آن را بیان کند، بنا بر سیاق." data-context="قاعده شده‌اند؛ همراه «لم»، زنانی که قاعده نشده‌اند." data-learn-more="/quran-terminology/fa/roots/h-y-dad/">يَحِضنَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُولٰتُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰتُ</button>
    <button class="word-link" type="button" data-word="الأَحمالِ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="بارداری‌ها؛ در ترکیب «اولات الاحمال»، زنان باردار." data-learn-more="/quran-terminology/fa/roots/h-m-l/">الأَحمالِ</button>
    <button class="word-link" type="button" data-word="أَجَلُهُنَّ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-context="پایان مدتشان؛ موعدِ زنان باردار که با وضع حمل تعیین می‌شود." data-root-meaning="مدت یا موعد مقرر؛ در سیاق مناسب، پایان آن مدت.">أَجَلُهُنَّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَضَعنَ" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="به زمین بگذارند؛ در این ترکیب، زایمان کنند.">يَضَعنَ</button>
    <button class="word-link" type="button" data-word="حَملَهُنَّ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="بارشان؛ جنینِ حمل‌شده که وضع آن پایان مدت را مشخص می‌کند." data-learn-more="/quran-terminology/fa/roots/h-m-l/">حَملَهُنَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَتَّقِ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پروا کند؛ مراقبت و پرهیز آگاهانه در برابر آن معبود یگانه.">يَتَّقِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَجعَل" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار می‌دهد؛ فراهم کردن آسانی برای فردِ پرهیزگار.">يَجعَل</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَمرِهِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-context="کارش؛ امر و وضعیتی که برای او آسان می‌شود." data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا؛ و در کاربرد اسمی، کار، موضوع و شأنِ مورد بحث.">أَمرِهِ</button>
    <button class="word-link" type="button" data-word="يُسرًا" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت" data-context="آسانی؛ گشایش در کارِ فردِ پرهیزگار.">يُسرًا</button>
  </p>
  <p class="farsi-verse">و زنانی از شما که از عادت ماهانه نومید شده‌اند، اگر شک دارید، عده‌شان سه ماه است؛ و نیز آنان که عادت ماهانه ندیده‌اند. و مدت زنان باردار تا آن است که بار خود را بر زمین نهند. و هر که از آن معبود یگانه پروا کند، کارش را برای او آسان می‌سازد.</p>
</section>
