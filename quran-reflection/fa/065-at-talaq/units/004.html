  <p class="farsi-verse">و زنانی از شما که از عادت ماهانه نومید شده‌اند، اگر شک دارید، عده‌شان سه ماه است؛ و نیز آنان که عادت ماهانه ندیده‌اند. و مدت زنان باردار تا آن است که بار خود را بر زمین نهند. و هر که از آن معبود یگانه پروا کند، کارش را برای او آسان می‌سازد.</p>
