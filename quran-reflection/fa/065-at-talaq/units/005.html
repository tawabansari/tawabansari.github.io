  <p class="farsi-verse">این فرمان آن معبود یگانه است که به سوی شما فرو فرستاده است. و هر که از آن معبود یگانه پروا کند، بدی‌هایش را از او می‌زداید و پاداشش را بزرگ می‌گرداند.</p>
