<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حُنَفاءَ" data-root="ح ن ف" data-learn-more="/quran-terminology/fa/roots/h-n-f/" data-root-meaning="حنیف؛ جهت‌گیری به سوی آن معبود یگانه و دوری از شرک، با بررسی معنای میل و حدود شواهد تاریخی" data-context="حنیفان؛ روی‌آورندگان به راه درست و دور از شرک.">حُنَفاءَ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="غیر؛ در این ترکیب، نفی شریک قرار دادن.">غَيرَ</button>
    <button class="word-link" type="button" data-word="مُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریک‌قراردهندگان؛ با «غیر» نفی شده است.">مُشرِكينَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُشرِك" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریک قرار دهد؛ نسبت دادن شریک به آن معبود یگانه.">يُشرِك</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="فَكَأَنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَأَنَّما</button>
    <button class="word-link" type="button" data-word="خَرَّ" data-root="خ ر ر" data-root-meaning="فرو افتادن و حرکت به سوی پایین؛ در شاخه‌های لغوی دیگر، جریان و صدای آن." data-context="فرو افتاد؛ سقوط از آسمان در تشبیهِ وضعیت کسی که شریک قرار می‌دهد." data-learn-more="/quran-terminology/fa/roots/kh-r-r/">خَرَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ مبدأ سقوط در تصویر تشبیهی آیه.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="فَتَخطَفُهُ" data-root="خ ط ف" data-learn-more="/quran-terminology/fa/roots/kh-tt-f/" data-root-meaning="ربودن، قاپیدن، گرفتن ناگهانی و پرشتاب، و جدا کردن سریع چیزی از جایگاهش پیش از آنکه فرصت واکنش یا تثبیت داشته باشد" data-context="پس او را می‌رباید؛ ربوده شدن شخص در تصویر سقوط.">فَتَخطَفُهُ</button>
    <button class="word-link" type="button" data-word="الطَّيرُ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق." data-context="پرندگان؛ ربایندگان شخص در یکی از دو شاخهٔ تشبیه.">الطَّيرُ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="تَهوى" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس" data-context="فرو می‌افکند؛ باد شخص را به جای دور می‌برد.">تَهوى</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="الرّيحُ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح" data-context="باد؛ عامل افکندن شخص در شاخهٔ دیگر تشبیه.">الرّيحُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مَكانٍ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="جایی؛ محل دورافتادهٔ پایان تصویر.">مَكانٍ</button>
    <button class="word-link" type="button" data-word="سَحيقٍ" data-root="س ح ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-h-q/" data-root-meaning="ساییدن و خرد کردن؛ نیز دوری و دور افتادن." data-context="بسیار دور؛ وصف مکانی که باد شخص را بدان می‌افکند.">سَحيقٍ</button>
  </p>
  <p class="farsi-verse">روی‌آورده به آن معبود یگانه، بی‌آنکه برای او شریک بگیرید. و هرکس برای آن معبود یگانه شریک بگیرد، گویی از آسمان فرو افتاده و پرندگان او را می‌ربایند یا باد او را به جایی دور می‌افکند.</p>
</section>
