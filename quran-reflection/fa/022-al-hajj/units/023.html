<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُدخِلُ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="درمی‌آورد؛ وارد کردن مؤمنانِ نیکوکار به باغ‌ها.">يُدخِلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ کسانی که وعدهٔ ورود به باغ‌ها دربارهٔ آنان است.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="و انجام دادند؛ کردارشان همراه ایمان ذکر شده است.">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="کارهای شایسته؛ وصفِ اعمالِ کسانی که به باغ‌ها درمی‌آیند.">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-context="باغ‌ها؛ جایگاهِ نعمتِ وعده‌داده‌شده." data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش؛ جَنّة: باغِ پوشیده از درخت و گیاه.">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر" data-context="روان‌اند؛ جریان یافتن رودها.">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="از زیر آنها؛ جایگاه جریان رودها در نسبت با باغ‌ها.">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="رودها؛ آب‌های روانِ زیر باغ‌ها.">الأَنهٰرُ</button>
    <button class="word-link" type="button" data-word="يُحَلَّونَ" data-root="ح ل ي" data-root-meaning="زیور و آراستگی؛ آراستن انسان یا اشیا با چیزی که برای زیبایی به ظاهر آنها افزوده می‌شود." data-context="آراسته می‌شوند؛ پوشاندن زیور به ساکنان باغ‌ها." data-learn-more="/quran-terminology/fa/roots/h-l-y/">يُحَلَّونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-context="دستبندها؛ زیورهایی که به آنان پوشانده می‌شود." data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد؛ أساور: دستبندها و حلقه‌های زینتیِ دور مچ.">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذَهَبٍ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-context="طلا؛ جنسِ دستبندهای ذکرشده." data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان؛ ذَهَب در کاربرد اسمی: طلا، فلزِ شناخته‌شده.">ذَهَبٍ</button>
    <button class="word-link" type="button" data-word="وَلُؤلُؤًا" data-root="ل أ ل أ" data-root-meaning="مروارید؛ گوهری شناخته‌شده به زیبایی و جلای خود که در قرآن هم به‌عنوان زینت و نعمتی طبیعی و هم در تشبیه‌های مربوط به زیبایی به کار رفته است." data-context="و مروارید؛ از زیورهای ساکنان باغ‌ها." data-learn-more="/quran-terminology/fa/roots/l-a-l-a/">وَلُؤلُؤًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِباسُهُم" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن" data-context="و پوشاکشان؛ جامه‌ای که در آن باغ‌ها دارند.">وَلِباسُهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="حَريرٌ" data-root="ح ر ر" data-root-meaning="آزادی و رهاسازی یا اختصاص یافتن؛ در شاخهٔ دیگر، گرما و سوزندگی؛ حریر: ابریشم." data-context="ابریشم؛ جنسِ پوشاک ساکنان باغ‌های وعده‌داده‌شده." data-learn-more="/quran-terminology/fa/roots/h-r-r/">حَريرٌ</button>
  </p>
  <p class="farsi-verse">بی‌گمان آن معبود یگانه کسانی را که ایمان آورده و کارهای شایسته کرده‌اند به باغ‌هایی درمی‌آورد که از زیر آنها نهرها روان است؛ در آنجا با دستبندهایی از طلا و مروارید آراسته می‌شوند و پوشاکشان در آنجا ابریشم است.</p>
</section>
