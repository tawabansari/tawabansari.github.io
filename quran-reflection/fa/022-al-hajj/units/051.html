<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="سَعَوا" data-root="س ع ي" data-learn-more="/quran-terminology/fa/roots/s-ayn-y/" data-root-meaning="از حرکت در یک مسیر تا کوشش برای رسیدن به نتیجه">سَعَوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="مُعٰجِزينَ" data-root="ع ج ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُعٰجِزينَ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="الجَحيمِ" data-root="ج ح م" data-learn-more="/quran-terminology/fa/roots/j-h-m/" data-root-meaning="از شدت حرارت و افروختگی تا «جحیم»">الجَحيمِ</button>
  </p>
  <p class="farsi-verse">و کسانی که در برابر آیات ما برای به‌عجزآوردن کوشیده‌اند، آنان اهل آتش فروزان‌اند.</p>
</section>
