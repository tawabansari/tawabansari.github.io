<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَجعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">لِيَجعَلَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يُلقِى" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">يُلقِى</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="فِتنَةً" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">فِتنَةً</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="مَرَضٌ" data-root="م ر ض" data-learn-more="/quran-terminology/fa/roots/m-r-dad/" data-root-meaning="بیماری، سستی، نقصان، و خروج از حالت سلامت و اعتدال">مَرَضٌ</button>
    <button class="word-link" type="button" data-word="وَالقاسِيَةِ" data-root="ق س و" data-learn-more="/quran-terminology/fa/roots/q-s-w/" data-root-meaning="سختی، صلابت، مقاومت در برابر تاثیر و کاهش پذیرندگی قلب">وَالقاسِيَةِ</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">قُلوبُهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="لَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَفى</button>
    <button class="word-link" type="button" data-word="شِقاقٍ" data-root="ش ق ق" data-learn-more="/quran-terminology/fa/roots/sh-q-q/" data-root-meaning="شکافتن، رخنه، جانب، مشقت، فاصله و گسست جبهه‌ساز">شِقاقٍ</button>
    <button class="word-link" type="button" data-word="بَعيدٍ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعيدٍ</button>
  </p>
  <p class="farsi-verse">تا آنچه را شیطان می‌افکند آزمونی برای کسانی قرار دهد که در دل‌هایشان بیماری است و آنان که دل‌هایشان سخت است. و بی‌گمان ستمگران در ستیزی دورند،</p>
</section>
