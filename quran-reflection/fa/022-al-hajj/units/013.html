<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">يَدعوا</button>
    <button class="word-link" type="button" data-word="لَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمَن</button>
    <button class="word-link" type="button" data-word="ضَرُّهُ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/">ضَرُّهُ</button>
    <button class="word-link" type="button" data-word="أَقرَبُ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/">أَقرَبُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَفعِهِ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/">نَفعِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَولىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/">المَولىٰ</button>
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="العَشيرُ" data-root="ع ش ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">العَشيرُ</button>
  </p>
  <p class="farsi-verse">کسی را می‌خواند که زیانش از سودش نزدیک‌تر است. چه بد سرپرستی و چه بد همدمی!</p>
