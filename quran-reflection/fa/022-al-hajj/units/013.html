<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="می‌خواند؛ رو آوردن به غیر الله.">يَدعوا</button>
    <button class="word-link" type="button" data-word="لَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمَن</button>
    <button class="word-link" type="button" data-word="ضَرُّهُ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="زیانش؛ اثرِ نزدیک‌ترِ آنچه می‌خواند.">ضَرُّهُ</button>
    <button class="word-link" type="button" data-word="أَقرَبُ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="نزدیک‌تر؛ مقایسهٔ زیان با سود.">أَقرَبُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَفعِهِ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی" data-context="سودش؛ طرفِ دیگرِ مقایسه.">نَفعِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="چه بد؛ نکوهشِ سرپرستِ مورد اشاره.">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَولىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="سرپرست و تکیه‌گاه؛ آنچه بد وصف شده است.">المَولىٰ</button>
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="و چه بد؛ نکوهشِ همراهِ مورد اشاره.">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="العَشيرُ" data-root="ع ش ر" data-root-meaning="ده و صورت‌ها و نسبت‌های عددی آن؛ معاشرت، همراهی، خویشاوندی و جماعت؛ عشار: شتران مادهٔ نزدیک به زایمان." data-context="همراه و هم‌معاشر؛ با «لبئس»، همراهی زیان‌بار نکوهش می‌شود." data-learn-more="/quran-terminology/fa/roots/ayn-sh-r/">العَشيرُ</button>
  </p>
  <p class="farsi-verse">کسی را می‌خواند که زیانش از سودش نزدیک‌تر است. چه بد سرپرستی و چه بد همدمی!</p>
</section>
