  <p class="farsi-verse">بی‌گمان آن معبود یگانه کسانی را که ایمان آورده و کارهای شایسته کرده‌اند به باغ‌هایی درمی‌آورد که از زیر آنها نهرها روان است. بی‌گمان آن معبود یگانه آنچه را بخواهد انجام می‌دهد.</p>
