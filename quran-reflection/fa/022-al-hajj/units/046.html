  </p>
  <p class="farsi-verse">آیا در زمین سفر نکرده‌اند تا دل‌هایی داشته باشند که با آنها بیندیشند یا گوش‌هایی که با آنها بشنوند؟ زیرا چشم‌ها نابینا نمی‌شوند، بلکه دل‌هایی که در سینه‌هاست نابینا می‌شوند.</p>
