<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="ضُرِبَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">ضُرِبَ</button>
    <button class="word-link" type="button" data-word="مَثَلٌ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مَثَلٌ</button>
    <button class="word-link" type="button" data-word="فَاستَمِعوا" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">فَاستَمِعوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="تَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">تَدعونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="يَخلُقوا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">يَخلُقوا</button>
    <button class="word-link" type="button" data-word="ذُبابًا" data-root="ذ ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ذُبابًا</button>
    <button class="word-link" type="button" data-word="وَلَوِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَوِ</button>
    <button class="word-link" type="button" data-word="اجتَمَعوا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">اجتَمَعوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَسلُبهُمُ" data-root="س ل ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَسلُبهُمُ</button>
    <button class="word-link" type="button" data-word="الذُّبابُ" data-root="ذ ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الذُّبابُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَنقِذوهُ" data-root="ن ق ذ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَستَنقِذوهُ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ضَعُفَ" data-root="ض ع ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ضَعُفَ</button>
    <button class="word-link" type="button" data-word="الطّالِبُ" data-root="ط ل ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الطّالِبُ</button>
    <button class="word-link" type="button" data-word="وَالمَطلوبُ" data-root="ط ل ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالمَطلوبُ</button>
  </p>
  <p class="farsi-verse">ای مردم، مَثَلی زده شده است؛ پس به آن گوش دهید. بی‌گمان کسانی که جز آن معبود یگانه می‌خوانید هرگز مگسی نمی‌آفرینند، هرچند برای آن گرد آیند. و اگر مگس چیزی از آنان برباید، نمی‌توانند آن را از او بازگیرند. خواهان و خواسته هردو ناتوان‌اند.</p>
</section>
