<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="و برای هر؛ بیان فراگیریِ قرار دادن مناسک برای امت‌ها.">وَلِكُلِّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="امت و جامعه؛ گروهی که مناسکی برای آن قرار داده شده است.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار دادیم و مقرر کردیم؛ دربارهٔ مناسک هر امت.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="مَنسَكًا" data-root="ن س ك" data-learn-more="/quran-terminology/fa/roots/n-s-k/" data-root-meaning="عبادت آیینی، قربانی و شیوه‌های انجام مناسک" data-context="مناسک و عمل عبادی؛ در این سیاق، آیینی مرتبط با یاد نام خداوند بر دام‌ها.">مَنسَكًا</button>
    <button class="word-link" type="button" data-word="لِيَذكُرُوا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="تا یاد کنند؛ نام خداوند را بر روزیِ دامیِ خود به زبان آورند.">لِيَذكُرُوا</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">اسمَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="رَزَقَهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="به آنان روزی داده است؛ دربارهٔ دام‌هایی که در اختیارشان قرار گرفته‌اند.">رَزَقَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَهيمَةِ" data-root="ب ه م" data-root-meaning="«ب ه م» در شاخه اصلیِ مورد تحلیل ابن فارس، با بسته بودن راه شناخت یا دسترسی و نبود نشانه روشن برای تمایز ارتباط دارد. در شاخه حیوانی، «بَهِيمَة» نام جانور چهارپاست؛ و در کاربرد قرآنی، ترکیب «بَهِيمَةُ الْأَنْعَامِ» به چهارپایان دامی شناخته‌شده اشاره می‌کند." data-context="جانور چهارپا؛ در «بهیمة الأنعام»، دام‌های شناخته‌شده که روزی داده شده‌اند و نام خداوند در مناسک بر آنها یاد می‌شود." data-learn-more="/quran-terminology/fa/roots/b-h2-m/">بَهيمَةِ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید؛ و در کاربرد «انعام»، چهارپایان اهلی و دام‌ها." data-context="دام‌های شناخته‌شده؛ شتر، گاو، گوسفند و بز در ترکیب «بهیمة الأنعام».">الأَنعٰمِ</button>
    ۗ
    <button class="word-link" type="button" data-word="فَإِلٰهُكُم" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="پس معبود شما؛ آن‌که بندگیِ مخاطبان متوجه اوست.">فَإِلٰهُكُم</button>
    <button class="word-link" type="button" data-word="إِلٰهٌ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبود؛ در جمله‌ای که یگانگی معبودِ مخاطبان را اعلام می‌کند.">إِلٰهٌ</button>
    <button class="word-link" type="button" data-word="وٰحِدٌ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یگانه؛ وصف معبود در اعلام توحید.">وٰحِدٌ</button>
    <button class="word-link" type="button" data-word="فَلَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَهُ</button>
    <button class="word-link" type="button" data-word="أَسلِموا" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="تسلیم شوید؛ در «فله أسلموا»، بندگی و پذیرش را متوجه او سازید.">أَسلِموا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="و بشارت بده؛ خبر خوش را به فروتنان برسان.">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُخبِتينَ" data-root="خ ب ت" data-root-meaning="زمین فروهشته و گسترده؛ إخبات: فروتنی و خشوع، با روی‌آوردن و آرام گرفتن بنا بر سیاق." data-context="فروتنانِ پذیرا؛ کسانی که با آرامش و فروتنی روی می‌آورند." data-learn-more="/quran-terminology/fa/roots/kh-b-t/">المُخبِتينَ</button>
  </p>
  <p class="farsi-verse">و برای هر امتی آیینی قرار دادیم تا نام آن معبود یگانه را بر دام‌هایی که روزی‌شان کرده است یاد کنند. پس معبود شما معبودی یگانه است؛ پس به او تسلیم شوید و فروتنان را مژده ده،</p>
</section>
