<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُدوا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">وَهُدوا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الطَّيِّبِ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است.">الطَّيِّبِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَولِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">القَولِ</button>
    <button class="word-link" type="button" data-word="وَهُدوا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">وَهُدوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطِ" data-root="ص ر ط" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد" data-learn-more="/quran-terminology/fa/roots/s-r-t/">صِرٰطِ</button>
    <button class="word-link" type="button" data-word="الحَميدِ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">الحَميدِ</button>
  </p>
  <p class="farsi-verse">و به سخن پاکیزه هدایت شده‌اند و به راه آن ستوده هدایت شده‌اند.</p>
</section>
