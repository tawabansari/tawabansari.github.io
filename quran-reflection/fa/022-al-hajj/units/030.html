<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُعَظِّم" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ بدارد">يُعَظِّم</button>
    <button class="word-link" type="button" data-word="حُرُمٰتِ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="حرمت‌ها و حدود محترم">حُرُمٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُوَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر و خیر؛ برای شخص">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش">رَبِّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأُحِلَّت" data-root="ح ل ل" data-root-meaning="گشودن و برداشتن بستگی؛ روا بودن و رفع ممنوعیت؛ فرود آمدن و قرار گرفتن در جایگاه." data-context="و حلال گردانیده شد؛ چهارپایان با استثنای آنچه خوانده می‌شود." data-learn-more="/quran-terminology/fa/roots/h-l-l/">وَأُحِلَّت</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمُ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-context="چهارپایان اهلی و دام‌ها" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید؛ و در کاربرد «انعام»، چهارپایان اهلی و دام‌ها.">الأَنعٰمُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يُتلىٰ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر" data-context="خوانده می‌شود؛ استثناها">يُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاجتَنِبُوا" data-root="ج ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-b/" data-root-meaning="پهلو، کنار و ناحیه؛ اجتناب: کنار گرفتن و دوری کردن؛ جُنُب وضعیت آیینیِ مشخصی است." data-context="پس دوری کنید">فَاجتَنِبُوا</button>
    <button class="word-link" type="button" data-word="الرِّجسَ" data-root="ر ج س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-s/" data-root-meaning="پلیدی و آلودگی مادی یا معنوی، بر حسب سیاق." data-context="پلیدی">الرِّجسَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَوثٰنِ" data-root="و ث ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-th-n/" data-root-meaning="بت و چیزی که به‌صورت معبود پرستیده می‌شود." data-context="بت‌ها">الأَوثٰنِ</button>
    <button class="word-link" type="button" data-word="وَاجتَنِبوا" data-root="ج ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-b/" data-root-meaning="پهلو، کنار و ناحیه؛ اجتناب: کنار گرفتن و دوری کردن؛ جُنُب وضعیت آیینیِ مشخصی است." data-context="و دوری کنید">وَاجتَنِبوا</button>
    <button class="word-link" type="button" data-word="قَولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتار">قَولَ</button>
    <button class="word-link" type="button" data-word="الزّورِ" data-root="ز و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-w-r/" data-root-meaning="کج شدن و متمایل گشتن؛ زور: سخن منحرف از حقیقت." data-context="دروغ و ناراستی">الزّورِ</button>
  </p>
  <p class="farsi-verse">چنین است؛ و هرکس حرمت‌های آن معبود یگانه را بزرگ بدارد، این نزد پروردگارش برای او بهتر است. و دام‌ها برای شما حلال شده‌اند، جز آنچه بر شما خوانده می‌شود. پس از پلیدی بت‌ها دوری کنید و از گفتار دروغ دوری کنید،</p>
</section>
