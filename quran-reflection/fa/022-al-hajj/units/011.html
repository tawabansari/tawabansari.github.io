  <p class="farsi-verse">و از مردم کسی است که آن معبود یگانه را بر لبه‌ای می‌پرستد؛ پس اگر خیری به او رسد، بدان آرام می‌گیرد، و اگر آزمونی به او رسد، بر چهره خود برمی‌گردد. دنیا و آخرت را باخته است؛ این همان زیان آشکار است.</p>
