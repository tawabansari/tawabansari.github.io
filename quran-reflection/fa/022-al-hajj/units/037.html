  <p class="farsi-verse">نه گوشت‌های آنها و نه خون‌هایشان به آن معبود یگانه می‌رسد، ولی پروای شما به او می‌رسد. این‌گونه آنها را برای شما رام کرد تا آن معبود یگانه را برای آنکه هدایتتان کرده است بزرگ بدارید؛ و نیکوکاران را مژده ده.</p>
