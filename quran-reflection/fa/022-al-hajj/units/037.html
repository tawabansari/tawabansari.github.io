<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="يَنالَ" data-root="ن ي ل" data-learn-more="/quran-terminology/fa/roots/n-y-l/" data-root-meaning="از رسیدن و دست یافتن تا چیزی که اثرش به دیگری می‌رسد" data-context="برسد؛ با «لن»: هرگز نمی‌رسد">يَنالَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لُحومُها" data-root="ل ح م" data-context="گوشت‌های آنها" data-root-meaning="گوشت و بافت گوشتی بدن؛ «لَحْم» مفرد و «لُحُوم» جمع آن است. خوراکی بودن و دیگر نقش‌ها از سیاق روشن می‌شوند." data-learn-more="/quran-terminology/fa/roots/l-h-m/">لُحومُها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="دِماؤُها" data-root="د م و" data-root-meaning="خون؛ مایع حیاتی بدن انسان و حیوان. «دَم» مفرد و «دِمَاء» جمع آن است؛ خون‌ریزی، حکم خوراکی و دیگر دلالت‌ها از ترکیب و سیاق روشن می‌شوند. دربارهٔ حرف سوم، تحلیل‌های «د م و» و «د م ي» وجود دارد." data-learn-more="/quran-terminology/fa/roots/d-m-w/" data-context="خون‌های آنها">دِماؤُها</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="يَنالُهُ" data-root="ن ي ل" data-learn-more="/quran-terminology/fa/roots/n-y-l/" data-root-meaning="از رسیدن و دست یافتن تا چیزی که اثرش به دیگری می‌رسد" data-context="به او می‌رسد">يَنالُهُ</button>
    <button class="word-link" type="button" data-word="التَّقوىٰ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="تقوا؛ پرهیزگاری و مراقبت در بندگی">التَّقوىٰ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="سَخَّرَها" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/" data-context="آنها را رام و در اختیار قرار داد">سَخَّرَها</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="لِتُكَبِّرُوا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="تا بزرگی را اعلام کنید">لِتُكَبِّرُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="هَدىٰكُم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="شما را هدایت کرد">هَدىٰكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="و مژده بده">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوکاران">المُحسِنينَ</button>
  </p>
  <p class="farsi-verse">نه گوشت‌های آنها و نه خون‌هایشان به آن معبود یگانه می‌رسد، ولی پروای شما به او می‌رسد. این‌گونه آنها را برای شما رام کرد تا آن معبود یگانه را برای آنکه هدایتتان کرده است بزرگ بدارید؛ و نیکوکاران را مژده ده.</p>
</section>
