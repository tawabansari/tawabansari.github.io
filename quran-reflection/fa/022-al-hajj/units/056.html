  <p class="farsi-verse">فرمانروایی در آن روز از آنِ آن معبود یگانه است؛ میانشان داوری می‌کند. پس کسانی که ایمان آورده و کارهای شایسته کرده‌اند در باغ‌های نعمت‌اند.</p>
