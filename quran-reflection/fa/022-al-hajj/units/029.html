  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="ليَقضوا" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/">ليَقضوا</button>
    <button class="word-link" type="button" data-word="تَفَثَهُم" data-root="ت ف ث" data-learn-more="/quran-terminology/fa/roots/t-f-th/">تَفَثَهُم</button>
    <button class="word-link" type="button" data-word="وَليوفوا" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/">وَليوفوا</button>
    <button class="word-link" type="button" data-word="نُذورَهُم" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/">نُذورَهُم</button>

  <p class="farsi-verse">سپس آلودگی خود را برطرف کنند و نذرهای خود را وفا کنند و بر گرد آن خانه کهن طواف کنند.</p>
