<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَزالُ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="ز ي ل" data-root-meaning="جدا شدن و از هم فاصله گرفتن؛ «زال» با نفی، ادامه داشتن و قطع نشدن را بیان می‌کند." data-learn-more="/quran-terminology/fa/roots/z-y-l/" data-context="همچنان می‌مانند؛ در ترکیبِ «لا یزال»، ادامه یافتنِ تردید">يَزالُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیده‌اند؛ کسانی که در تردید می‌مانند">كَفَروا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مِريَةٍ" data-root="م ر ي" data-learn-more="/quran-terminology/fa/roots/m-r-y/" data-root-meaning="تردید، دودلی و مجادله؛ از بیرون کشیدن شیر تا کشمکش بر سر حقیقت و مرز میان پرسش و مراء در قرآن" data-context="تردید؛ وضعیتی که منکران در آن ادامه می‌دهند">مِريَةٍ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="تَأتِيَهُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بر آنان برسد؛ دربارهٔ ساعت">تَأتِيَهُمُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="ساعت؛ هنگامِ رستاخیز">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="ب غ ت" data-root-meaning="ناگهانی فرا رسیدن یا رخ دادن چیزی در زمانی که مخاطب انتظار وقوع آن را نداشته یا از نزدیک شدن آن آگاه نبوده است." data-context="ناگهان؛ چگونگی رسیدن ساعت به کسانی که در تردید مانده‌اند" data-learn-more="/quran-terminology/fa/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يَأتِيَهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بر آنان برسد؛ دربارهٔ عذاب روز عقیم">يَأتِيَهُم</button>
    <button class="word-link" type="button" data-word="عَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ پیامدِ روزِ وصف‌شده به عقیم">عَذابُ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمانِ عذابی که عقیم توصیف شده است">يَومٍ</button>
    <button class="word-link" type="button" data-word="عَقيمٍ" data-root="ع ق م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-q-m/" data-root-meaning="نازا و بی‌ثمر بودن؛ عقیم: بی‌زایشی یا بی‌بازده." data-context="عقیم؛ بی‌ثمر و بدون برآمدِ مطلوب، وصفِ آن روز">عَقيمٍ</button>
  </p>
  <p class="farsi-verse">و کسانی که کفر ورزیده‌اند همواره درباره آن در تردید می‌مانند، تا آن ساعت ناگهان به آنان برسد یا عذاب روزی بی‌ثمر به آنان برسد.</p>
</section>
