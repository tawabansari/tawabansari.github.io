  <p class="farsi-verse">بی‌گمان کسانی که کفر ورزیدند و از راه آن معبود یگانه و مسجدالحرام بازمی‌دارند، همان که آن را برای مردم قرار دادیم، مقیم در آن و بادیه‌نشین در آن برابرند؛ و هرکس در آن به ستم قصد کج‌روی کند، از عذابی دردناک به او می‌چشانیم.</p>
