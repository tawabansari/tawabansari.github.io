<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَيُدخِلَنَّهُم" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">لَيُدخِلَنَّهُم</button>
    <button class="word-link" type="button" data-word="مُدخَلًا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">مُدخَلًا</button>
    <button class="word-link" type="button" data-word="يَرضَونَهُ" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل">يَرضَونَهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَعَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">لَعَليمٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="ح ل م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-m/" data-root-meaning="بردباری و خویشتن‌داری؛ نیز خواب و رؤیا، و بلوغ در تعبیر «بلغ الحلم».">حَليمٌ</button>
  </p>
  <p class="farsi-verse">بی‌گمان آنان را به جایگاهی درمی‌آورد که از آن خشنود می‌شوند. و بی‌گمان آن معبود یگانه دانا و بردبار است.</p>
</section>
