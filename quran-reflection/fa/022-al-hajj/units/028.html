<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَشهَدوا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="تا شاهد باشند و حضور یابند؛ برای بهره‌مندی از منافعِ یادشده در حج.">لِيَشهَدوا</button>
    <button class="word-link" type="button" data-word="مَنٰفِعَ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی" data-context="منفعت‌ها و بهره‌هایی برای خودشان در این حضور.">مَنٰفِعَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَيَذكُرُوا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="و یاد کنند؛ نام خداوند را در روزهای معلوم بر دام‌ها به زبان آورند.">وَيَذكُرُوا</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">اسمَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزهایی؛ زمانِ معینِ یاد نام خداوند در مناسک.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="مَعلومٰتٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="معلوم و شناخته‌شده؛ وصفِ روزهای یادشده.">مَعلومٰتٍ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="رَزَقَهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="به آنان روزی داده است؛ دربارهٔ دام‌های در اختیارشان.">رَزَقَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَهيمَةِ" data-root="ب ه م" data-root-meaning="«ب ه م» در شاخه اصلیِ مورد تحلیل ابن فارس، با بسته بودن راه شناخت یا دسترسی و نبود نشانه روشن برای تمایز ارتباط دارد. در شاخه حیوانی، «بَهِيمَة» نام جانور چهارپاست؛ و در کاربرد قرآنی، ترکیب «بَهِيمَةُ الْأَنْعَامِ» به چهارپایان دامی شناخته‌شده اشاره می‌کند." data-context="جانور چهارپا؛ در «بهیمة الأنعام»، دام‌های شناخته‌شده در سیاق یاد نام خداوند، خوردن و خوراندن." data-learn-more="/quran-terminology/fa/roots/b-h2-m/">بَهيمَةِ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید؛ و در کاربرد «انعام»، چهارپایان اهلی و دام‌ها." data-context="دام‌های شناخته‌شده؛ شتر، گاو، گوسفند و بز در ترکیب «بهیمة الأنعام».">الأَنعٰمِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="پس بخورید؛ بهره‌مندی خوراکی از حیواناتِ این سیاق.">فَكُلوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="وَأَطعِمُوا" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا" data-context="و بخورانید؛ خوراک را به نیازمندِ یادشده برسانید.">وَأَطعِمُوا</button>
    <button class="word-link" type="button" data-word="البائِسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="بینوای گرفتار سختی؛ وصفِ نیازمندی که باید خورانده شود.">البائِسَ</button>
    <button class="word-link" type="button" data-word="الفَقيرَ" data-root="ف ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-r/" data-root-meaning="نیاز و تهیدستی؛ فاقره: گرفتاری کمرشکن." data-context="نیازمند و تهیدست؛ وصفِ شخصی که باید از خوراک بهره‌مند شود.">الفَقيرَ</button>
  </p>
  <p class="farsi-verse">تا سودهایی را برای خود شاهد باشند و نام آن معبود یگانه را در روزهایی معلوم بر دام‌هایی که روزی‌شان کرده است یاد کنند. پس از آنها بخورید و به بینوای نیازمند بخورانید.</p>
</section>
