  <p class="farsi-verse">و پیش از تو هیچ رسول و پیامبری نفرستادیم مگر آنکه چون آرزو کرد، شیطان در آرزویش چیزی افکند؛ پس آن معبود یگانه آنچه را شیطان می‌افکند می‌زداید، سپس آن معبود یگانه آیات خود را استوار می‌کند. و آن معبود یگانه دانا و حکیم است،</p>
