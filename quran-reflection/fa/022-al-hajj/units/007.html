<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="السّاعَةَ" data-root="س و ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">السّاعَةَ</button>
    <button class="word-link" type="button" data-word="ءاتِيَةٌ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتِيَةٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="رَيبَ" data-root="ر ي ب" data-learn-more="/quran-terminology/fa/roots/r-y-b/" data-root-meaning="تردید آشفته، بی‌اعتمادی، بدگمانی، شک بی‌ثبات‌کننده، اضطراب در برابر حق، و حالتی که انسان را از اطمینان و تسلیم در برابر برهان بازمی‌دارد">رَيبَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَبعَثُ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه.">يَبعَثُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="القُبورِ" data-root="ق ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">القُبورِ</button>
  </p>
  <p class="farsi-verse">و اینکه آن ساعت آمدنی است؛ تردیدی در آن نیست، و آن معبود یگانه کسانی را که در گورها هستند برمی‌انگیزد.</p>
</section>
