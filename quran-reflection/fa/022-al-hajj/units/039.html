    <button class="word-link" type="button" data-word="أُذِنَ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/">أُذِنَ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="يُقٰتَلونَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/">يُقٰتَلونَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="ظُلِموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظُلِموا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="نَصرِهِم" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/">نَصرِهِم</button>
    <button class="word-link" type="button" data-word="لَقَديرٌ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">لَقَديرٌ</button>

  <p class="farsi-verse">به کسانی که با آنان جنگ می‌شود اجازه داده شد، زیرا به آنان ستم شده است؛ و بی‌گمان آن معبود یگانه بر یاری آنان تواناست،</p>
