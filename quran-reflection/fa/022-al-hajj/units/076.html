  <h2 class="ayah-title">الحج ۲۲:۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/">بَينَ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="خَلفَهُم" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/">خَلفَهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>

    <button class="word-link" type="button" data-word="الأُمورُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/">الأُمورُ</button>
  </p>
  <p class="farsi-verse">آنچه را پیش روی آنان و آنچه را پشت سر آنان است می‌داند، و کارها به سوی آن معبود یگانه بازگردانده می‌شود.</p>
