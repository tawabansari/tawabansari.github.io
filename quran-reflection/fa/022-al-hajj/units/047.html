  <p class="farsi-verse">و از تو شتاب در عذاب را می‌خواهند، و آن معبود یگانه هرگز وعده‌اش را خلاف نمی‌کند. و بی‌گمان یک روز نزد پروردگارت مانند هزار سال از آن چیزی است که می‌شمارید.</p>
