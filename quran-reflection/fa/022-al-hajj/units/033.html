<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مَنٰفِعُ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی" data-context="سودها و بهره‌ها">مَنٰفِعُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَجَلٍ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت یا موعد مقرر؛ در سیاق مناسب، پایان آن مدت." data-context="مدتی؛ زمان مقرر">أَجَلٍ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="نام‌برده و تعیین‌شده">مُسَمًّى</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="مَحِلُّها" data-root="ح ل ل" data-root-meaning="گشودن و برداشتن بستگی؛ روا بودن و رفع ممنوعیت؛ فرود آمدن و قرار گرفتن در جایگاه." data-context="جایگاه یا پایان مقررِ آنها؛ در سیاق شعائر و هدی، به سوی بیت عتیق." data-learn-more="/quran-terminology/fa/roots/h-l-l/">مَحِلُّها</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه؛ بیتِ عتیق" data-learn-more="/quran-terminology/fa/roots/b-y-t/">البَيتِ</button>
    <button class="word-link" type="button" data-word="العَتيقِ" data-root="ع ت ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-q/" data-root-meaning="کهن بودن؛ نیز آزاد یا گرامی بودن، بنا بر کاربرد." data-context="کهن و گرامی؛ وصف خانه">العَتيقِ</button>
  </p>
  <p class="farsi-verse">برای شما در آنها سودهایی تا سرآمدی معین است؛ سپس جایگاهشان نزد آن خانه کهن است.</p>
</section>
