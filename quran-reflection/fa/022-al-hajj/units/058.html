  <p class="farsi-verse">و کسانی که در راه آن معبود یگانه هجرت کردند، سپس کشته شدند یا مردند، آن معبود یگانه بی‌گمان به آنان روزی نیکویی می‌دهد. و بی‌گمان آن معبود یگانه بهترین روزی‌دهندگان است.</p>
