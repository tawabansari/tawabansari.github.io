  <p class="farsi-verse">آیا ندانسته‌ای که آن معبود یگانه آنچه را در آسمان و زمین است می‌داند؟ بی‌گمان این در کتابی است؛ بی‌گمان این بر آن معبود یگانه آسان است.</p>
