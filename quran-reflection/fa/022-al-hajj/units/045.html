<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَأَيِّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَأَيِّن</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَريَةٍ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن.">قَريَةٍ</button>
    <button class="word-link" type="button" data-word="أَهلَكنٰها" data-root="ه ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-l-k/" data-root-meaning="از میان رفتن و نابود کردن؛ نیز از دست رفتن، بنا بر سیاق.">أَهلَكنٰها</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="ظالِمَةٌ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظالِمَةٌ</button>
    <button class="word-link" type="button" data-word="فَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهِىَ</button>
    <button class="word-link" type="button" data-word="خاوِيَةٌ" data-root="خ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-y/" data-root-meaning="تهی شدن، خالی ماندن و فرو افتادن.">خاوِيَةٌ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="عُروشِها" data-root="ع ر ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-sh/" data-root-meaning="سقف و سازه برافراشته؛ عرش: تخت یا جایگاه فرمانروایی.">عُروشِها</button>
    <button class="word-link" type="button" data-word="وَبِئرٍ" data-root="ب أ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-a-r/" data-root-meaning="کندن گودی؛ بئر: چاه و گودیِ دسترسی به آب.">وَبِئرٍ</button>
    <button class="word-link" type="button" data-word="مُعَطَّلَةٍ" data-root="ع ط ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-tt-l/" data-root-meaning="خالی، رها یا بی‌استفاده گذاشتن.">مُعَطَّلَةٍ</button>
    <button class="word-link" type="button" data-word="وَقَصرٍ" data-root="ق ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-r/" data-root-meaning="کوتاه کردن و محدود ساختن؛ قصر: بنای بزرگ یا کاخ.">وَقَصرٍ</button>
    <button class="word-link" type="button" data-word="مَشيدٍ" data-root="ش ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-d/" data-root-meaning="با گچ یا مصالح استوار ساختن؛ بلند و محکم بنا کردن.">مَشيدٍ</button>
  </p>
  <p class="farsi-verse">پس چه بسیار آبادی‌ای را در حالی که ستمگر بود نابود کردیم و اکنون بر سقف‌هایش فرو ریخته است، و چه بسیار چاه رهاشده و کاخ برافراشته‌ای!</p>
</section>
