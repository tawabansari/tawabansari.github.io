<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَأَيِّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَأَيِّن</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَريَةٍ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی یا جامعهٔ ساکن در آن؛ نکره پس از «کأیّن» برای بیان فراوانیِ نمونه‌ها.">قَريَةٍ</button>
    <button class="word-link" type="button" data-word="أَهلَكنٰها" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="آن را نابود کردیم؛ فعل باب افعال با فاعل «ما» و ضمیر بازگشت‌کننده به آبادی و اهل آن." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">أَهلَكنٰها</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="ظالِمَةٌ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگر؛ وصف آبادی به اعتبار ستمِ مردمانش، در بیان حال آن هنگام نابودی.">ظالِمَةٌ</button>
    <button class="word-link" type="button" data-word="فَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهِىَ</button>
    <button class="word-link" type="button" data-word="خاوِيَةٌ" data-root="خ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-y/" data-root-meaning="تهی شدن، خالی ماندن و فرو افتادن." data-context="فروریخته یا تهی از سکنه؛ در ترجمهٔ این آیه، فروریخته بر سقف‌هایش.">خاوِيَةٌ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="عُروشِها" data-root="ع ر ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-sh/" data-root-meaning="سقف و سازه برافراشته؛ عرش: تخت یا جایگاه فرمانروایی." data-context="سقف‌های آن؛ «عروش» جمع و ضمیر «ها» ناظر به آبادی است؛ در اینجا به معنای تخت فرمانروایی نیست.">عُروشِها</button>
    <button class="word-link" type="button" data-word="وَبِئرٍ" data-root="ب أ ر" data-learn-more="/quran-terminology/fa/roots/b-a-r/" data-root-meaning="چاه و کندن زمین برای دسترسی به آب؛ در کاربردهای دیگر، پنهان یا ذخیره کردن." data-context="و چاهی؛ جایگاه حفرشده برای دسترسی به آب، که وصف بعدی آن را متروک معرفی می‌کند؛ باء جزء خود اسم است.">وَبِئرٍ</button>
    <button class="word-link" type="button" data-word="مُعَطَّلَةٍ" data-root="ع ط ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-tt-l/" data-root-meaning="خالی، رها یا بی‌استفاده گذاشتن." data-context="رهاشده و بی‌استفاده؛ وصف چاه و توقف بهره‌برداری از آن، بدون اثبات خشکی آب.">مُعَطَّلَةٍ</button>
    <button class="word-link" type="button" data-word="وَقَصرٍ" data-root="ق ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-r/" data-root-meaning="کوتاه کردن و محدود ساختن؛ قصر: بنای بزرگ یا کاخ." data-context="و کاخی؛ بنایی بزرگ که در کنار چاه و آبادیِ ویران یاد می‌شود.">وَقَصرٍ</button>
    <button class="word-link" type="button" data-word="مَشيدٍ" data-root="ش ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-d/" data-root-meaning="با گچ یا مصالح استوار ساختن؛ بلند و محکم بنا کردن." data-context="برافراشته یا گچ‌اندود؛ وصف ساختمان کاخ، بدون اثبات سالم ماندن کامل آن پس از نابودی ساکنان.">مَشيدٍ</button>
  </p>
  <p class="farsi-verse">پس چه بسیار آبادی‌ای را در حالی که ستمگر بود نابود کردیم و اکنون بر سقف‌هایش فرو ریخته است، و چه بسیار چاه رهاشده و کاخ برافراشته‌ای!</p>
</section>
