<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذانِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذانِ</button>
    <button class="word-link" type="button" data-word="خَصمانِ" data-root="خ ص م" data-root-meaning="رویارویی و مخاصمهٔ دو طرف بر سر ادعا، حق یا موضوعی مورد اختلاف؛ خصم: طرف دعوا." data-context="دو طرفِ نزاع؛ دو گروهی که دربارهٔ پروردگارشان اختلاف دارند." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/">خَصمانِ</button>
    <button class="word-link" type="button" data-word="اختَصَموا" data-root="خ ص م" data-root-meaning="رویارویی و مخاصمهٔ دو طرف بر سر ادعا، حق یا موضوعی مورد اختلاف؛ خصم: طرف دعوا." data-context="به نزاع و مجادله برخاستند؛ دربارهٔ پروردگارشان." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/">اختَصَموا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ موضوعِ اختلاف دو طرف.">رَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ گروهی که کیفرشان در ادامه توصیف می‌شود.">كَفَروا</button>
    <button class="word-link" type="button" data-word="قُطِّعَت" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="بریده شده؛ آماده شدن جامه‌های آتش برای آنان.">قُطِّعَت</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ثِيابٌ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-context="جامه‌ها؛ پوششی که از آتش توصیف شده است." data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه؛ و در شاخهٔ «ثياب»، لباس و پوشاک.">ثِيابٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نارٍ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ آنچه جامه‌ها از آن وصف شده‌اند.">نارٍ</button>
    <button class="word-link" type="button" data-word="يُصَبُّ" data-root="ص ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-b/" data-root-meaning="ریختن و سرازیر کردن." data-context="ریخته می‌شود؛ سرازیر شدنِ مایع سوزان از بالا.">يُصَبُّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بالای؛ جهتِ ریختن نسبت به سرها.">فَوقِ</button>
    <button class="word-link" type="button" data-word="رُءوسِهِمُ" data-root="ر أ س" data-root-meaning="سر؛ و در گسترش معنا، بخش بالایی، آغازین یا اصلی چیزی؛ رأس المال: اصل دارایی." data-context="سرهایشان؛ مایع سوزان از بالای آن ریخته می‌شود." data-learn-more="/quran-terminology/fa/roots/r-a-s/">رُءوسِهِمُ</button>
    <button class="word-link" type="button" data-word="الحَميمُ" data-root="ح م م" data-root-meaning="در شاخهٔ حرارت، آب گرم و بسیار داغ؛ در شاخهٔ نزدیکی، دوست یا خویشاوند صمیمی؛ و در شاخهٔ تیرگی، زغال و دود بسیار سیاه." data-context="مایع بسیار داغ و سوزان؛ آنچه بر سرها ریخته می‌شود." data-learn-more="/quran-terminology/fa/roots/h-m-m/">الحَميمُ</button>
  </p>
  <p class="farsi-verse">این دو گروهِ درگیرند که درباره پروردگارشان به جدال برخاسته‌اند. پس برای کسانی که کفر ورزیدند جامه‌هایی از آتش بریده شده است؛ از بالای سرهایشان آب جوشان ریخته می‌شود.</p>
</section>
