<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذانِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذانِ</button>
    <button class="word-link" type="button" data-word="خَصمانِ" data-root="خ ص م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/" data-root-meaning="ستیز و مجادله بر سر ادعا؛ خصم: طرف نزاع.">خَصمانِ</button>
    <button class="word-link" type="button" data-word="اختَصَموا" data-root="خ ص م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/" data-root-meaning="ستیز و مجادله بر سر ادعا؛ خصم: طرف نزاع.">اختَصَموا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="قُطِّعَت" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال">قُطِّعَت</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ثِيابٌ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">ثِيابٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نارٍ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">نارٍ</button>
    <button class="word-link" type="button" data-word="يُصَبُّ" data-root="ص ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-b/" data-root-meaning="ریختن و سرازیر کردن.">يُصَبُّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد">فَوقِ</button>
    <button class="word-link" type="button" data-word="رُءوسِهِمُ" data-root="ر أ س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-a-s/" data-root-meaning="سر و بخش بالایی یا پیشین چیز.">رُءوسِهِمُ</button>
    <button class="word-link" type="button" data-word="الحَميمُ" data-root="ح م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-m/" data-root-meaning="گرمای شدید؛ حمیم: آب بسیار داغ یا دوست نزدیک، بر حسب سیاق؛ یحموم: دود سیاه.">الحَميمُ</button>
  </p>
  <p class="farsi-verse">این دو گروهِ درگیرند که درباره پروردگارشان به جدال برخاسته‌اند. پس برای کسانی که کفر ورزیدند جامه‌هایی از آتش بریده شده است؛ از بالای سرهایشان آب جوشان ریخته می‌شود.</p>
</section>
