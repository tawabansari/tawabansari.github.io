    <button class="word-link" type="button" data-word="تَرَونَها" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَونَها</button>

    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابَ</button>

    <button class="word-link" type="button" data-word="شَديدٌ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شَديدٌ</button>
  </p>
  <p class="farsi-verse">روزی که آن را ببینید، هر زن شیردهی از آنچه شیر می‌دهد غافل می‌شود و هر بارداری بار خود را فرو می‌نهد؛ و مردم را مست می‌بینی، حال آنکه مست نیستند، ولی عذاب آن معبود یگانه سخت است.</p>
