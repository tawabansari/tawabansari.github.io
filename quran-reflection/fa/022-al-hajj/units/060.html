  <p class="farsi-verse">چنین است؛ و هرکس همانند آنچه بر او کیفر رفته است کیفر دهد، سپس بر او ستم شود، آن معبود یگانه بی‌گمان یاری‌اش می‌کند. بی‌گمان آن معبود یگانه درگذرنده و آمرزنده است.</p>
