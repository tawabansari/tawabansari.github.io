<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/">وَأَصحٰبُ</button>
    <button class="word-link" type="button" data-word="مَديَنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَديَنَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكُذِّبَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/">وَكُذِّبَ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="فَأَملَيتُ" data-root="م ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَملَيتُ</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَخَذتُهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/">أَخَذتُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَ</button>
    <button class="word-link" type="button" data-word="نَكيرِ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/">نَكيرِ</button>
  </p>
  <p class="farsi-verse">و مردم مدین؛ و موسی تکذیب شد. پس به کافران مهلت دادم، سپس آنان را گرفتم؛ پس انکار من چگونه بود؟</p>
