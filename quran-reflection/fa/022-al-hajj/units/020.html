<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الحج ۲۲:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُصهَرُ" data-root="ص ه ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-h2-r/" data-root-meaning="گداختن و ذوب کردن؛ صهر: پیوند خویشاوندی از ازدواج.">يُصهَرُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="بُطونِهِم" data-root="ب ط ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-tt-n/" data-root-meaning="شکم، درون و بخش نهان؛ باطن در برابر ظاهر است و بطانه به لایهٔ درونی یا نزدیکان گفته می‌شود.">بُطونِهِم</button>
    <button class="word-link" type="button" data-word="وَالجُلودُ" data-root="ج ل د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-l-d/" data-root-meaning="پوست و پوشش بدن؛ جَلد: زدن با تازیانه؛ در کاربردهایی، استواری و سختی.">وَالجُلودُ</button>
  </p>
  <p class="farsi-verse">آنچه در شکم‌هایشان است و پوست‌ها با آن گداخته می‌شود.</p>
