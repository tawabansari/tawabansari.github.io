<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">قریش ۱۰۶:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إۦلٰفِهِم" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أَلَّفَ؛ پیوند دادن، خو گرفتن و برقرار شدن انس و همراهی" data-context="الفت و خوگرفتنشان؛ با سفر زمستان و تابستان">إۦلٰفِهِم</button>
    <button class="word-link" type="button" data-word="رِحلَةَ" data-root="ر ح ل" data-learn-more="/quran-terminology/fa/roots/r-h-l/" data-root-meaning="کوچ و سفر کردن؛ بستن سازوبرگ بر مرکب؛ رَحْل: وسیلهٔ سواری، بار و اثاث همراه مسافر و در برخی کاربردها منزل و مأوا." data-context="سفر و کوچ؛ در ارتباط با دو فصلِ یادشده">رِحلَةَ</button>
    <button class="word-link" type="button" data-word="الشِّتاءِ" data-root="ش ت و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-t-w/" data-root-meaning="زمستان و فصل سرما." data-context="زمستان؛ یکی از دو فصلِ سفرِ یادشده">الشِّتاءِ</button>
    <button class="word-link" type="button" data-word="وَالصَّيفِ" data-root="ص ي ف" data-learn-more="/quran-terminology/fa/roots/sad-y-f/" data-root-meaning="تابستان و دوره گرم‌تر سال؛ در کاربردهای وابسته، اقامت، سفر و باران تابستانی. در شاخه‌ای دیگر، مایل شدن و منحرف شدن از مسیر." data-context="و تابستان؛ فصلِ سفر که در کنار زمستان یاد شده است">وَالصَّيفِ</button>
  </p>
  <p class="farsi-verse">اُلفتشان با سفر زمستان و تابستان،</p>
</section>
