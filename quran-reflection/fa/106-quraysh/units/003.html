<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">قریش ۱۰۶:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَليَعبُدوا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="پس باید بندگی و پرستش کنند.">فَليَعبُدوا</button>
    <button class="word-link" type="button" data-word="رَبَّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار و صاحبِ این خانه.">رَبَّ</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="این خانهٔ شناخته‌شده که پروردگارش باید پرستیده شود." data-learn-more="/quran-terminology/fa/roots/b-y-t/">البَيتِ</button>
  </p>
  <p class="farsi-verse">پس باید پروردگار این خانه را بپرستند،</p>
</section>
