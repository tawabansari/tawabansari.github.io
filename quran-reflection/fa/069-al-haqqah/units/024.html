<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">كُلوا</button>
    <button class="word-link" type="button" data-word="وَاشرَبوا" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن.">وَاشرَبوا</button>
    <button class="word-link" type="button" data-word="هَنيـًٔا" data-root="ه ن أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-n-a/" data-root-meaning="گوارا و خوشایند بودن، بدون پیامد آزاردهنده.">هَنيـًٔا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="أَسلَفتُم" data-root="س ل ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-f/" data-root-meaning="پیش رفتن و پیش‌تر انجام شدن؛ سلف: پیشینیان یا آنچه گذشته است.">أَسلَفتُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَيّامِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">الأَيّامِ</button>
    <button class="word-link" type="button" data-word="الخالِيَةِ" data-root="خ ل و" data-learn-more="/quran-terminology/fa/roots/kh-l-w/" data-root-meaning="خالی شدن، خلوت کردن، کنار رفتن از جمع، تنها شدن، رها شدن از مانع، و جدا شدن از میدان آشکار">الخالِيَةِ</button>
  </p>
  <p class="farsi-verse">«به‌گوارایی بخورید و بنوشید، به پاداش آنچه در روزهای گذشته پیش فرستادید.»</p>
</section>
