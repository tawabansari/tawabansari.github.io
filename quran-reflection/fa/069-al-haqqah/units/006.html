<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمّا</button>
    <button class="word-link" type="button" data-word="عادٌ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عادٌ</button>
    <button class="word-link" type="button" data-word="فَأُهلِكوا" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="عاد با باد سخت هلاک شدند؛ فعل مجهول." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">فَأُهلِكوا</button>
    <button class="word-link" type="button" data-word="بِريحٍ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح" data-context="با بادی ویرانگر.">بِريحٍ</button>
    <button class="word-link" type="button" data-word="صَرصَرٍ" data-root="ص ر ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-sad-r/" data-root-meaning="تندی و بانگ باد؛ صرصر با سرمای سخت یا صدای شدید توضیح داده شده است." data-context="سخت و زوزه‌کش یا بسیار سرد؛ وصفِ باد.">صَرصَرٍ</button>
    <button class="word-link" type="button" data-word="عاتِيَةٍ" data-root="ع ت و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-w/" data-root-meaning="سرکشی و از حد گذشتن؛ نیز فرسودگی شدید پیری." data-context="سرکش و سخت‌تاز.">عاتِيَةٍ</button>
  </p>
  <p class="farsi-verse">و اما عاد، با بادی سخت و سرکش هلاک شدند.</p>
</section>
