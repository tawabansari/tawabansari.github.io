<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/">وَجاءَ</button>
    <button class="word-link" type="button" data-word="فِرعَونُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونُ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="قَبلَهُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/">قَبلَهُ</button>
    <button class="word-link" type="button" data-word="وَالمُؤتَفِكٰتُ" data-root="أ ف ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالمُؤتَفِكٰتُ</button>
    <button class="word-link" type="button" data-word="بِالخاطِئَةِ" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/">بِالخاطِئَةِ</button>
  </p>
  <p class="farsi-verse">و فرعون و کسانی که پیش از او بودند و شهرهای واژگون‌شده، مرتکب خطا شدند.</p>
