<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَحُمِلَتِ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="و برداشته شدند؛ فعلِ مربوط به زمین و کوه‌ها." data-learn-more="/quran-terminology/fa/roots/h-m-l/">وَحُمِلَتِ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ همراه کوه‌ها در صحنهٔ دگرگونی.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="وَالجِبالُ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ همراه زمین در بیان یک درهم‌کوبیدن." data-learn-more="/quran-terminology/fa/roots/j-b-l/">وَالجِبالُ</button>
    <button class="word-link" type="button" data-word="فَدُكَّتا" data-root="د ك ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-k-k/" data-root-meaning="کوبیدن، خرد کردن و با زمین هموار ساختن." data-context="پس درهم کوبیده شدند؛ خرد شدن زمین و کوه‌ها.">فَدُكَّتا</button>
    <button class="word-link" type="button" data-word="دَكَّةً" data-root="د ك ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-k-k/" data-root-meaning="کوبیدن، خرد کردن و با زمین هموار ساختن." data-context="کوبیدنی؛ مصدرِ تأکید بر درهم کوبیدن.">دَكَّةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یک؛ یگانگیِ درهم‌کوبیدن.">وٰحِدَةً</button>
  </p>
  <p class="farsi-verse">و زمین و کوه‌ها برداشته شوند و با یک ضربه درهم کوبیده شوند،</p>
</section>
