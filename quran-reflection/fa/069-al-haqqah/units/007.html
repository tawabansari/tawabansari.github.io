<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَخَّرَها" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/">سَخَّرَها</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="س ب ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَبعَ</button>
    <button class="word-link" type="button" data-word="لَيالٍ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه">لَيالٍ</button>
    <button class="word-link" type="button" data-word="وَثَمٰنِيَةَ" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود">وَثَمٰنِيَةَ</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="حُسومًا" data-root="ح س م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حُسومًا</button>
    <button class="word-link" type="button" data-word="فَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">فَتَرَى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="صَرعىٰ" data-root="ص ر ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَرعىٰ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="أَعجازُ" data-root="ع ج ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَعجازُ</button>
    <button class="word-link" type="button" data-word="نَخلٍ" data-root="ن خ ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَخلٍ</button>
    <button class="word-link" type="button" data-word="خاوِيَةٍ" data-root="خ و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خاوِيَةٍ</button>
  </p>
  <p class="farsi-verse">آن را هفت شب و هشت روز پی‌درپی بر آنان مسلط کرد؛ پس مردم را در آن افتاده می‌دیدی، گویی تنه‌های نخل فرو افتاده‌اند.</p>
</section>
