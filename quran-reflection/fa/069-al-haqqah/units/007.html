<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَخَّرَها" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/" data-context="بر آنان مسلط کرد؛ دربارهٔ بادِ ویرانگر.">سَخَّرَها</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ شب‌های وزیدن باد، در کنار هشت روز." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="لَيالٍ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب‌ها؛ هفت واحدِ شبانه.">لَيالٍ</button>
    <button class="word-link" type="button" data-word="وَثَمٰنِيَةَ" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود" data-context="و هشت؛ شمارِ روزها.">وَثَمٰنِيَةَ</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزها؛ هشت واحدِ روزانه.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="حُسومًا" data-root="ح س م" data-root-meaning="«ح س م» به معنای قطع کردن، متوقف ساختن ادامهٔ چیزی و پایان دادن به اثر آن است. از همین خانواده، «حُسام» به معنای شمشیر برنده و «حسم» به معنای قطع یا فیصله دادن آمده است. در قرآن، «حُسُومًا» در وصف هفت شب و هشت روز عذاب قوم عاد به کار رفته و در خوانش مرجح، معنای پیاپی و بی‌وقفه دارد؛ هرچند خوانش ریشه‌کن‌کنندگی نیز از نظر لغوی و سیاقی قابل بررسی است." data-context="پیاپی و قاطع؛ وصفِ مدت یا اثرِ باد." data-learn-more="/quran-terminology/fa/roots/h-s-m/">حُسومًا</button>
    <button class="word-link" type="button" data-word="فَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="پس می‌بینی؛ مشاهدهٔ فرجامِ قوم.">فَتَرَى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="قوم؛ مردمی که فرجامشان توصیف می‌شود." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">القَومَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="صَرعىٰ" data-root="ص ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-ayn/" data-root-meaning="به زمین افکندن و از پا درآوردن." data-context="بر زمین افتاده؛ وصفِ بدن‌های قوم.">صَرعىٰ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="أَعجازُ" data-root="ع ج ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-z/" data-context="بن و تنه‌ها؛ در تشبیهِ قوم به نخل‌های فروافتاده." data-root-meaning="ناتوان شدن یا ناتوان ساختن؛ عجوز: زن سالخورده.؛ و در شاخهٔ اسمی، بخش پسین یا بنِ چیز؛ أعجاز نخل: بن و تنه‌های نخل.">أَعجازُ</button>
    <button class="word-link" type="button" data-word="نَخلٍ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان." data-context="نخل؛ درختانِ طرفِ تشبیه.">نَخلٍ</button>
    <button class="word-link" type="button" data-word="خاوِيَةٍ" data-root="خ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-w-y/" data-root-meaning="تهی شدن، خالی ماندن و فرو افتادن." data-context="تهی و فروافتاده؛ وصفِ نخل‌ها در تشبیه.">خاوِيَةٍ</button>
  </p>
  <p class="farsi-verse">آن را هفت شب و هشت روز پی‌درپی بر آنان مسلط کرد؛ پس مردم را در آن افتاده می‌دیدی، گویی تنه‌های نخل فرو افتاده‌اند.</p>
</section>
