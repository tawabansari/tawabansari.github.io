<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذَّبَت" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبَت</button>
    <button class="word-link" type="button" data-word="ثَمودُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">ثَمودُ</button>
    <button class="word-link" type="button" data-word="وَعادٌ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَعادٌ</button>
    <button class="word-link" type="button" data-word="بِالقارِعَةِ" data-root="ق ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-ayn/" data-root-meaning="کوبیدن و ضربه شدید؛ قارعه: حادثه کوبنده.">بِالقارِعَةِ</button>
  </p>
  <p class="farsi-verse">ثمود و عاد آن کوبنده را دروغ شمردند.</p>
</section>
