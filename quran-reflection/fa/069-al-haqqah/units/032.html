<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سِلسِلَةٍ" data-root="س ل س ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-s-l/" data-root-meaning="زنجیر و حلقه‌های پیوسته؛ نیز روانی آب در کاربرد دیگر.">سِلسِلَةٍ</button>
    <button class="word-link" type="button" data-word="ذَرعُها" data-root="ذ ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-ayn/" data-root-meaning="ساعد و ذراع؛ نیز اندازه‌گیری و توان گنجایش یا تحمل.">ذَرعُها</button>
    <button class="word-link" type="button" data-word="سَبعونَ" data-root="س ب ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/" data-root-meaning="عدد هفت؛ سَبُع: جانور درنده.">سَبعونَ</button>
    <button class="word-link" type="button" data-word="ذِراعًا" data-root="ذ ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-ayn/" data-root-meaning="ساعد و ذراع؛ نیز اندازه‌گیری و توان گنجایش یا تحمل.">ذِراعًا</button>
    <button class="word-link" type="button" data-word="فَاسلُكوهُ" data-root="س ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-k/" data-root-meaning="در راهی رفتن یا چیزی را در مسیر و جایگاهی درآوردن.">فَاسلُكوهُ</button>
  </p>
  <p class="farsi-verse">سپس در زنجیری که درازایش هفتاد ذراع است درآوریدش.</p>
