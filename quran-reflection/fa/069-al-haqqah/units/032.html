<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سِلسِلَةٍ" data-root="س ل س ل" data-root-meaning="اتصال و امتداد پیوستهٔ اجزاء؛ در صورت «سِلْسِلَة»، زنجیر ساخته‌شده از حلقه‌ها یا اجزای متصل. در برخی کاربردهای لغوی مرتبط، روانی و گواراییِ آب نیز ثبت شده است." data-context="زنجیر؛ آنچه طولش هفتاد ذراع ذکر شده است." data-learn-more="/quran-terminology/fa/roots/s-l-s-l/">سِلسِلَةٍ</button>
    <button class="word-link" type="button" data-word="ذَرعُها" data-root="ذ ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-ayn/" data-root-meaning="ساعد و ذراع؛ نیز اندازه‌گیری و توان گنجایش یا تحمل." data-context="اندازه و درازای آن؛ سنجش طول زنجیر.">ذَرعُها</button>
    <button class="word-link" type="button" data-word="سَبعونَ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفتاد؛ شمارِ ذراع‌ها در اندازهٔ زنجیر." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعونَ</button>
    <button class="word-link" type="button" data-word="ذِراعًا" data-root="ذ ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-ayn/" data-root-meaning="ساعد و ذراع؛ نیز اندازه‌گیری و توان گنجایش یا تحمل." data-context="ذراع؛ واحدِ اندازهٔ طول.">ذِراعًا</button>
    <button class="word-link" type="button" data-word="فَاسلُكوهُ" data-root="س ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-k/" data-root-meaning="در راهی رفتن یا چیزی را در مسیر و جایگاهی درآوردن." data-context="پس او را در آن درآورید؛ فرمانِ مربوط به زنجیر.">فَاسلُكوهُ</button>
  </p>
  <p class="farsi-verse">سپس در زنجیری که درازایش هفتاد ذراع است درآوریدش.</p>
</section>
