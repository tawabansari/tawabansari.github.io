<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالمَلَكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="فرشتگان؛ گروهِ مستقر بر کناره‌ها.">وَالمَلَكُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَرجائِها" data-root="ر ج و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ نیز کناره و جانب؛ تأخیر انداختن در برخی صورت‌ها با «رجأ» بررسی می‌شود." data-context="کناره‌های آن؛ جایگاه فرشتگان.">أَرجائِها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَحمِلُ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="حمل می‌کند؛ در صحنهٔ حمل عرش به‌وسیلهٔ هشت حامل." data-learn-more="/quran-terminology/fa/roots/h-m-l/">وَيَحمِلُ</button>
    <button class="word-link" type="button" data-word="عَرشَ" data-root="ع ر ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-sh/" data-root-meaning="سقف و سازه برافراشته؛ عرش: تخت یا جایگاه فرمانروایی." data-context="عرش؛ چیزی که در صحنهٔ آیه حمل می‌شود.">عَرشَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ در ترکیب عرشِ پروردگار.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَوقَهُم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بالای آنان؛ نسبت مکانی در تصویر آیه.">فَوقَهُم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="در آن روز؛ زمانِ صحنهٔ حمل عرش.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="ثَمٰنِيَةٌ" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود" data-context="هشت؛ شمارِ حاملانِ یادشده.">ثَمٰنِيَةٌ</button>
  </p>
  <p class="farsi-verse">و فرشتگان بر کناره‌های آن‌اند؛ و در آن روز هشت تن عرش پروردگارت را بالای آنان حمل می‌کنند.</p>
</section>
