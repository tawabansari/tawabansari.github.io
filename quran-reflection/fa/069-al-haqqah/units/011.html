<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمّا</button>
    <button class="word-link" type="button" data-word="طَغَا" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق">طَغَا</button>
    <button class="word-link" type="button" data-word="الماءُ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">الماءُ</button>
    <button class="word-link" type="button" data-word="حَمَلنٰكُم" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری.">حَمَلنٰكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الجارِيَةِ" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر">الجارِيَةِ</button>
  </p>
  <p class="farsi-verse">همانا هنگامی که آب طغیان کرد، شما را در آن شناور حمل کردیم،</p>
