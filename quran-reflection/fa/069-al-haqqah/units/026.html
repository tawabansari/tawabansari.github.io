<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الحاقة ۶۹:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="أَدرِ" data-root="د ر ي" data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه بودن از موضوعی؛ در باب افعال، آگاه ساختن دیگری." data-context="آگاه نشده بودم؛ در آرزوی گوینده که کاش حساب خود را نمی‌دانست.">أَدرِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="حِسابِيَه" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="حساب من؛ حسابی که گوینده آرزو می‌کند از آن آگاه نشده بود.">حِسابِيَه</button>
  </p>
  <p class="farsi-verse">و نمی‌دانستم حسابم چیست!</p>
</section>
