  <p class="arabic-text">

    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَحَدٍ" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="هیچ‌کس؛ در ساخت نفی، هر فردی از مخاطبان را دربرمی‌گیرد.">أَحَدٍ</button>

  <p class="farsi-verse">پس هیچ‌یک از شما نمی‌توانست مانع آن شود.</p>
