<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">عبس ۸۰:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الكَفَرَةُ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكَفَرَةُ</button>
    <button class="word-link" type="button" data-word="الفَجَرَةُ" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست.">الفَجَرَةُ</button>
  </p>
  <p class="farsi-verse">آنان همان کافران بدکارند.</p>
