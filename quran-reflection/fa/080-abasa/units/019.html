<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">عبس ۸۰:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نُطفَةٍ" data-root="ن ط ف" data-learn-more="/quran-terminology/fa/roots/n-tt-f/" data-root-meaning="چکیدن مایع؛ آب اندک یا صاف، و نطفه در سیاق تولیدمثل." data-context="نطفه؛ آنچه در این آیه انسان از آن آفریده و اندازه‌گذاری می‌شود.">نُطفَةٍ</button>
    <button class="word-link" type="button" data-word="خَلَقَهُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="او را آفرید؛ ضمیر به انسان بازمی‌گردد.">خَلَقَهُ</button>
    <button class="word-link" type="button" data-word="فَقَدَّرَهُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="پس او را اندازه‌گذاری و سامان داد؛ معنایی افزوده بر خودِ نطفه.">فَقَدَّرَهُ</button>
  </p>
  <p class="farsi-verse">از نطفه‌ای او را آفرید و اندازه‌اش نهاد.</p>
</section>
