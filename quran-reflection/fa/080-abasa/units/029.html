<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">عبس ۸۰:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَزَيتونًا" data-root="ز ي ت" data-learn-more="/quran-terminology/fa/roots/z-y-t/" data-root-meaning="زیتون، درخت و میوهٔ آن، و روغن استخراج‌شده از میوه؛ در کاربردهای فعلی، روغن زدن، خوراندن یا فراهم کردن روغن." data-context="و زیتون؛ از روییدنی‌های نام‌برده در فراهم شدن خوراک.">وَزَيتونًا</button>
    <button class="word-link" type="button" data-word="وَنَخلًا" data-root="ن خ ل" data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و مجموعهٔ درختان آن؛ و در شاخه‌ای غیرقرآنی، غربال کردن و گزینش." data-context="درختان خرما در شمار روییدنی‌ها و منابع خوراک.">وَنَخلًا</button>
  </p>
  <p class="farsi-verse">و زیتون و نخل،</p>
</section>
