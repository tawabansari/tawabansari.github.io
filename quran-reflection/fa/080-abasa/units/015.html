  <h2 class="ayah-title">عبس ۸۰:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بِأَيدى" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="در دست‌هایِ؛ نسبتِ در دست داشتن">بِأَيدى</button>
