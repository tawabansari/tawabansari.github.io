<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">عبس ۸۰:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="امرِئٍ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرِئٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="شَأنٌ" data-root="ش أ ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">شَأنٌ</button>
    <button class="word-link" type="button" data-word="يُغنيهِ" data-root="غ ن ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُغنيهِ</button>
  </p>
  <p class="farsi-verse">هر کس از آنان در آن روز کاری دارد که او را به خود مشغول می‌دارد.</p>
</section>
