<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَيَّضنا" data-root="ق ي ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-y-dad/" data-root-meaning="فراهم آوردن و همراه یا مسلط ساختن." data-context="و گماشتیم؛ فراهم کردن همراهان برای آنان.">وَقَيَّضنا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="قُرَناءَ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره." data-context="همراهان؛ کسانی که امور را برای آنان آراسته جلوه دادند.">قُرَناءَ</button>
    <button class="word-link" type="button" data-word="فَزَيَّنوا" data-root="ز ي ن" data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آراستگی؛ زیبا ساختن یا زیبا جلوه دادن چیزی." data-context="همراهان، آنچه پیش رو و پشت سرشان بود برای آنان آراسته جلوه دادند.">فَزَيَّنوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان؛ در تعبیر پیش روی آنان.">بَينَ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌های آنان؛ در تعبیر پیش رویشان.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="خَلفَهُم" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="پشت سر آنان؛ در برابر پیش رویشان.">خَلفَهُم</button>
    <button class="word-link" type="button" data-word="وَحَقَّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="و ثابت و محقق شد؛ دربارهٔ حکم بر آنان.">وَحَقَّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="القَولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتار و حکم؛ آنچه بر آنان محقق شد.">القَولُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أُمَمٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="امت‌ها؛ گروه‌های پیشین جن و انسان.">أُمَمٍ</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="خَلَت" data-root="خ ل و" data-learn-more="/quran-terminology/fa/roots/kh-l-w/" data-root-meaning="خالی شدن، خلوت کردن، کنار رفتن از جمع، تنها شدن، رها شدن از مانع، و جدا شدن از میدان آشکار" data-context="گذشته بودند؛ امت‌هایی که پیش‌تر سپری شده بودند.">خَلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از آنان؛ تقدم زمانی امت‌های یادشده.">قَبلِهِم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِنِّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="جن؛ یکی از دو گروه یادشده در امت‌های پیشین.">الجِنِّ</button>
    <button class="word-link" type="button" data-word="وَالإِنسِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="و انسان‌ها؛ در کنار جن.">وَالإِنسِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ بیان وضعیت زیانکاری آنان.">كانوا</button>
    <button class="word-link" type="button" data-word="خٰسِرينَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش" data-context="زیانکاران؛ وصف فرجام آنان.">خٰسِرينَ</button>
  </p>
  <p class="farsi-verse">و همنشینانی برایشان گماشتیم که آنچه پیش رویشان و پشت سرشان بود برایشان آراستند؛ و سخن بر آنان در میان امت‌هایی از جن و انسان که پیش از آنان گذشته بودند تحقق یافت. آنان زیان‌کار بودند.</p>
</section>
