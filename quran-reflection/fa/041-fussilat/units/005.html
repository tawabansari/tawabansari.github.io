<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفتند؛ سخن مخالفان دربارهٔ دل‌ها، گوش‌ها و حجاب.">وَقالوا</button>
    <button class="word-link" type="button" data-word="قُلوبُنا" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌های ما؛ در ادعای گویندگان دربارهٔ پوشیدگی از پیام.">قُلوبُنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَكِنَّةٍ" data-root="ك ن ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-n/" data-root-meaning="پوشاندن و در پناه محفوظ داشتن." data-context="پوشش‌ها؛ آنچه مخالفان ادعا می‌کنند دل‌هایشان در آن قرار دارد.">أَكِنَّةٍ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَدعونا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="ما را دعوت می‌کنی و فرا می‌خوانی؛ به آنچه مخالفان از پذیرشش فاصله می‌گیرند.">تَدعونا</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="وَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفى</button>
    <button class="word-link" type="button" data-word="ءاذانِنا" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="گوش‌های ما؛ در ادعای مخالفان دربارهٔ سنگینی در شنیدن.">ءاذانِنا</button>
    <button class="word-link" type="button" data-word="وَقرٌ" data-root="و ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-r/" data-root-meaning="سنگینی؛ وَقر: سنگینی گوش؛ وِقر: بار؛ توقیر: بزرگداشت." data-context="سنگینی در گوش؛ مانع شنیدن یا دریافت، در سخن مخالفان.">وَقرٌ</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="بَينِنا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان ما؛ یکی از دو سوی حجابی که ادعا می‌کنند.">بَينِنا</button>
    <button class="word-link" type="button" data-word="وَبَينِكَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="و میان تو؛ سوی دیگر جدایی ادعاشده با پیامبر.">وَبَينِكَ</button>
    <button class="word-link" type="button" data-word="حِجابٌ" data-root="ح ج ب" data-root-meaning="پوشاندن، مانع شدن و جدا کردن؛ جلوگیری از دیدن یا دسترسی." data-context="حجاب و فاصله‌ای که مخالفان میان خود و پیامبر ادعا می‌کنند؛ در زمینهٔ پذیرش پیام." data-learn-more="/quran-terminology/fa/roots/h-j-b/">حِجابٌ</button>
    <button class="word-link" type="button" data-word="فَاعمَل" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="پس عمل کن؛ خطاب مخالفان به پیامبر.">فَاعمَل</button>
    <button class="word-link" type="button" data-word="إِنَّنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّنا</button>
    <button class="word-link" type="button" data-word="عٰمِلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="عمل‌کنندگان؛ ادعای مخالفان که ما نیز کار خود را انجام می‌دهیم.">عٰمِلونَ</button>
  </p>
  <p class="farsi-verse">و گفتند: دل‌های ما از آنچه ما را به آن می‌خوانی در پوشش‌هایی است و در گوش‌های ما سنگینی است و میان ما و تو پرده‌ای است؛ پس عمل کن، ما نیز عمل می‌کنیم.</p>
</section>
