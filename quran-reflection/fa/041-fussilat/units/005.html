  <p class="farsi-verse">و گفتند: دل‌های ما از آنچه ما را به آن می‌خوانی در پوشش‌هایی است و در گوش‌های ما سنگینی است و میان ما و تو پرده‌ای است؛ پس عمل کن، ما نیز عمل می‌کنیم.</p>
