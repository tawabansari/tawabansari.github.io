<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَستَوِى" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="یکسان می‌شود؛ در نفیِ برابریِ نیکی و بدی.">تَستَوِى</button>
    <button class="word-link" type="button" data-word="الحَسَنَةُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکی؛ یکی از دو سوی مقایسه.">الحَسَنَةُ</button>
    <button class="word-link" type="button" data-word="وَلَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَا</button>
    <button class="word-link" type="button" data-word="السَّيِّئَةُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی؛ سوی دیگرِ مقایسه با نیکی.">السَّيِّئَةُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ادفَع" data-root="د ف ع" data-learn-more="/quran-terminology/fa/roots/d-f-ayn/" data-root-meaning="کنار زدن و دور ساختن یا پیش راندن؛ با «عن»، دفاع و دفع آسیب، و با «إلى»، سپردن و تحویل دادن." data-context="دفع کن؛ پاسخ دادن با شیوهٔ نیکوتر.">ادفَع</button>
    <button class="word-link" type="button" data-word="بِالَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِالَّتى</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوتر؛ وصفِ شیوه‌ای که برای دفع سفارش شده است.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="بَينَكَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان تو؛ یکی از دو طرفِ رابطهٔ دشمنی.">بَينَكَ</button>
    <button class="word-link" type="button" data-word="وَبَينَهُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="و میان او؛ طرفِ دیگرِ رابطهٔ دشمنی.">وَبَينَهُ</button>
    <button class="word-link" type="button" data-word="عَدٰوَةٌ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمنی؛ رابطه‌ای که در آیه به نزدیکی تشبیه می‌شود.">عَدٰوَةٌ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="وَلِىٌّ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="دوست نزدیک؛ شخصی که با حميم به صمیمیت وصف شده است.">وَلِىٌّ</button>
    <button class="word-link" type="button" data-word="حَميمٌ" data-root="ح م م" data-root-meaning="در شاخهٔ حرارت، آب گرم و بسیار داغ؛ در شاخهٔ نزدیکی، دوست یا خویشاوند صمیمی؛ و در شاخهٔ تیرگی، زغال و دود بسیار سیاه." data-context="صمیمی و بسیار نزدیک؛ وصفِ ولی در تصویر رابطه پس از دشمنی." data-learn-more="/quran-terminology/fa/roots/h-m-m/">حَميمٌ</button>
  </p>
  <p class="farsi-verse">و نیکی و بدی برابر نیستند؛ با آنچه بهتر است دفع کن، پس ناگهان آن که میان تو و او دشمنی است، گویی دوستی صمیمی است.</p>
</section>
