<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="يَنزَغَنَّكَ" data-root="ن ز غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-z-gh/" data-root-meaning="برانگیختن و در میان دیگران فساد و دشمنی افکندن.">يَنزَغَنَّكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنِ</button>
    <button class="word-link" type="button" data-word="نَزغٌ" data-root="ن ز غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-z-gh/" data-root-meaning="برانگیختن و در میان دیگران فساد و دشمنی افکندن.">نَزغٌ</button>
    <button class="word-link" type="button" data-word="فَاستَعِذ" data-root="ع و ذ" data-learn-more="/quran-terminology/fa/roots/ayn-w-dh/" data-root-meaning="پناه بردن، پناه جستن، به مأمن روی آوردن و در حفاظت آن قرار گرفتن.">فَاستَعِذ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">بِاللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="السَّميعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">السَّميعُ</button>
    <button class="word-link" type="button" data-word="العَليمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">العَليمُ</button>
  </p>
  <p class="farsi-verse">و اگر از شیطان انگیزشی تو را برانگیزد، به آن معبود یگانه پناه ببر؛ او همان شنوای داناست.</p>
</section>
