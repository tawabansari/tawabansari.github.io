  </p>
  <p class="farsi-verse">و از نشانه‌های او این است که زمین را فروتن می‌بینی، پس هنگامی که آب را بر آن نازل کنیم به جنبش می‌آید و بالا می‌آید. آن که آن را زنده کرد، زنده‌کننده مردگان است؛ او بر هر چیز تواناست.</p>
