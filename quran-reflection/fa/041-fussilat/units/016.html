<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">فَأَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="ريحًا" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">ريحًا</button>
    <button class="word-link" type="button" data-word="صَرصَرًا" data-root="ص ر ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-sad-r/" data-root-meaning="تندی و بانگ باد؛ صرصر با سرمای سخت یا صدای شدید توضیح داده شده است.">صَرصَرًا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="نَحِساتٍ" data-root="ن ح س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h-s/" data-root-meaning="نحسی و بدفرجامی؛ نحاس: مس یا دود، بنا بر تفسیر.">نَحِساتٍ</button>
    <button class="word-link" type="button" data-word="لِنُذيقَهُم" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج.">لِنُذيقَهُم</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابَ</button>
    <button class="word-link" type="button" data-word="الخِزىِ" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران">الخِزىِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَعَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">وَلَعَذابُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="أَخزىٰ" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران">أَخزىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُنصَرونَ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">يُنصَرونَ</button>
  </p>
  <p class="farsi-verse">پس بادی سخت و زوزه‌کش در روزهایی شوم بر آنان فرستادیم تا عذاب خواری را در زندگی دنیا به آنان بچشانیم؛ و عذاب آخرت خوارکننده‌تر است و آنان یاری نمی‌شوند.</p>
</section>
