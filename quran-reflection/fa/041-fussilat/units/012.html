  <p class="farsi-verse">پس آن‌ها را در دو روز هفت آسمان گرداند و در هر آسمان کار آن را وحی کرد؛ و آسمان نزدیک‌تر را با چراغ‌ها آراستیم و نگاه داشتیم. این اندازه‌گذاری توانمند داناست.</p>
