<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يُلَقّىٰها" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="آن به شخص داده یا رسانده می‌شود؛ فعل مجهول باب تفعیل، دربارهٔ خصلت پاسخ نیک به بدی.">يُلَقّىٰها</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="صَبَروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="پایداری کردند؛ کسانی که در رفتار نیک و رویارویی با دشواری خویشتن را نگه داشتند.">صَبَروا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يُلَقّىٰها" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="آن به شخص داده یا رسانده می‌شود؛ تکرارِ فعل مجهول، این بار در پیوند با دارندهٔ بهرهٔ بزرگ.">يُلَقّىٰها</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="ذو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذو</button>
    <button class="word-link" type="button" data-word="حَظٍّ" data-root="ح ظ ظ" data-root-meaning="سهم یا بهره‌ای که از چیزی به شخص می‌رسد یا برای او در نظر گرفته می‌شود. این بهره ممکن است مادی، حقوقی، معنوی یا اخروی باشد و می‌تواند از نظر مقدار و ارزش متفاوت باشد." data-context="بهره و برخورداری؛ بهره‌ای بزرگ در سیاق پایداری و پاسخ نیک به بدی، نه نامِ مستقیم ثروت یا شانس." data-learn-more="/quran-terminology/fa/roots/h-zha-zha/">حَظٍّ</button>
    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ؛ وصف بهره در سیاق پایداری و پاسخ بهتر به بدی.">عَظيمٍ</button>
  </p>
  <p class="farsi-verse">و این جز به کسانی که شکیبایی کرده‌اند داده نمی‌شود، و جز به صاحب بهره‌ای بزرگ داده نمی‌شود.</p>
</section>
