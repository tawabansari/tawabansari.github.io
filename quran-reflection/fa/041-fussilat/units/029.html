  <p class="farsi-verse">و کسانی که کفر ورزیدند می‌گویند: پروردگارا، آن دو از جن و انسان را که ما را گمراه کردند به ما نشان ده تا آن‌ها را زیر پاهایمان قرار دهیم، تا از فرودستان باشند.</p>
