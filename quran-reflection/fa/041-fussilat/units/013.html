<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="أَعرَضوا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">أَعرَضوا</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقُل</button>
    <button class="word-link" type="button" data-word="أَنذَرتُكُم" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">أَنذَرتُكُم</button>
    <button class="word-link" type="button" data-word="صٰعِقَةً" data-root="ص ع ق" data-learn-more="/quran-terminology/fa/roots/sad-ayn-q/" data-root-meaning="صاعقه، ضربه کوبنده و ناگهانی، صدای شدید و لرزاننده، و حادثه‌ای که انسان را هلاک، بیهوش، یا از وضعیت عادی خارج می‌کند">صٰعِقَةً</button>
    <button class="word-link" type="button" data-word="مِثلَ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مِثلَ</button>
    <button class="word-link" type="button" data-word="صٰعِقَةِ" data-root="ص ع ق" data-learn-more="/quran-terminology/fa/roots/sad-ayn-q/" data-root-meaning="صاعقه، ضربه کوبنده و ناگهانی، صدای شدید و لرزاننده، و حادثه‌ای که انسان را هلاک، بیهوش، یا از وضعیت عادی خارج می‌کند">صٰعِقَةِ</button>
    <button class="word-link" type="button" data-word="عادٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عادٍ</button>
    <button class="word-link" type="button" data-word="وَثَمودَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَثَمودَ</button>
  </p>
  <p class="farsi-verse">پس اگر روی گرداندند، بگو: شما را از صاعقه‌ای مانند صاعقه عاد و ثمود هشدار دادم.</p>
</section>
