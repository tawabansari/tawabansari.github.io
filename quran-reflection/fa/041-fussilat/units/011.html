<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="استَوىٰ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="روی آورد؛ در این ساخت، رو کردن به آسمان.">استَوىٰ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ آنچه در ادامه با وضعیت دود توصیف می‌شود.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="دُخانٌ" data-root="د خ ن" data-learn-more="/quran-terminology/fa/roots/d-kh-n/" data-root-meaning="دود و برخاستن آن؛ در کاربردهای دیگر، تیرگی، اثر دود و کدورت." data-context="دود؛ وصف وضعیت آسمان در این بخش از آیات آفرینش.">دُخانٌ</button>
    <button class="word-link" type="button" data-word="فَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس گفت؛ آغاز خطاب به آسمان و زمین.">فَقالَ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="وَلِلأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و به زمین؛ دومین مخاطب در کنار آسمان.">وَلِلأَرضِ</button>
    <button class="word-link" type="button" data-word="ائتِيا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بیایید؛ فرمانِ دوگانه خطاب به آسمان و زمین.">ائتِيا</button>
    <button class="word-link" type="button" data-word="طَوعًا" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="از روی خواست و فرمان‌پذیری؛ در برابر ناخواهی.">طَوعًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="كَرهًا" data-root="ك ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-h2/" data-root-meaning="ناخوش داشتن و دشواری؛ اکراه: واداشتن برخلاف خواست." data-context="از روی ناخواهی؛ در برابر خواست و فرمان‌پذیری.">كَرهًا</button>
    <button class="word-link" type="button" data-word="قالَتا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="آن دو گفتند؛ پاسخ آسمان و زمین در بیان آیه.">قالَتا</button>
    <button class="word-link" type="button" data-word="أَتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="آمدیم؛ پاسخ دو مخاطب در قالب جمعِ گویندگان.">أَتَينا</button>
    <button class="word-link" type="button" data-word="طائِعينَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="فرمان‌بردار و پذیرا؛ وصف پاسخ آسمان و زمین.">طائِعينَ</button>
  </p>
  <p class="farsi-verse">سپس به آسمان روی آورد، در حالی که دود بود، و به آن و به زمین گفت: خواه یا ناخواه بیایید. گفتند: فرمان‌بردار آمدیم.</p>
</section>
