<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَذٰلِكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَذٰلِكُم</button>
    <button class="word-link" type="button" data-word="ظَنُّكُمُ" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد">ظَنُّكُمُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="ظَنَنتُم" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد">ظَنَنتُم</button>
    <button class="word-link" type="button" data-word="بِرَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">بِرَبِّكُم</button>
    <button class="word-link" type="button" data-word="أَردىٰكُم" data-root="ر د ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-d-y/" data-root-meaning="سقوط و هلاکت؛ تردّی: فرو افتادن یا به نابودی رسیدن.">أَردىٰكُم</button>
    <button class="word-link" type="button" data-word="فَأَصبَحتُم" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ.">فَأَصبَحتُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الخٰسِرينَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">الخٰسِرينَ</button>
  </p>
  <p class="farsi-verse">و همین گمانی که درباره پروردگارتان داشتید شما را به هلاکت افکند، پس از زیان‌کاران شدید.</p>
