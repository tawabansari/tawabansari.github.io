<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمّا</button>
    <button class="word-link" type="button" data-word="ثَمودُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">ثَمودُ</button>
    <button class="word-link" type="button" data-word="فَهَدَينٰهُم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">فَهَدَينٰهُم</button>
    <button class="word-link" type="button" data-word="فَاستَحَبُّوا" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">فَاستَحَبُّوا</button>
    <button class="word-link" type="button" data-word="العَمىٰ" data-root="ع م ي" data-learn-more="/quran-terminology/fa/roots/ayn-m-y/" data-root-meaning="کوری، نادیدن، پوشیده شدن راه دیدن، ابهام، و از دست رفتن توان مشاهده یا تشخیص">العَمىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الهُدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">الهُدىٰ</button>
    <button class="word-link" type="button" data-word="فَأَخَذَتهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَأَخَذَتهُم</button>
    <button class="word-link" type="button" data-word="صٰعِقَةُ" data-root="ص ع ق" data-learn-more="/quran-terminology/fa/roots/sad-ayn-q/" data-root-meaning="صاعقه، ضربه کوبنده و ناگهانی، صدای شدید و لرزاننده، و حادثه‌ای که انسان را هلاک، بیهوش، یا از وضعیت عادی خارج می‌کند">صٰعِقَةُ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابِ</button>
    <button class="word-link" type="button" data-word="الهونِ" data-root="ه و ن" data-learn-more="/quran-terminology/fa/roots/h2-w-n/" data-root-meaning="آسانی، آرامی و فروکاستن از شأن">الهونِ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان">يَكسِبونَ</button>
  </p>
  <p class="farsi-verse">و اما ثمود، آنان را هدایت کردیم، پس کوری را بر هدایت ترجیح دادند؛ از این رو صاعقه عذاب خوارکننده، به سبب آنچه به دست می‌آوردند، آنان را گرفت.</p>
</section>
