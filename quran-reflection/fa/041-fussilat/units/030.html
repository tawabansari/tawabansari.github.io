  <p class="farsi-verse">کسانی که گفتند پروردگار ما آن معبود یگانه است، سپس استوار ماندند، فرشتگان بر آنان فرود می‌آیند که: نترسید و اندوهگین نشوید و به بهشتی که وعده داده می‌شدید مژده بگیرید.</p>
