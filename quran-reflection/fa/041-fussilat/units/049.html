<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَسـَٔمُ" data-root="س أ م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-a-m/" data-root-meaning="ملول، خسته و دل‌زده شدن." data-context="خسته نمی‌شود؛ با «لا»، نفیِ خستگی انسان از خواستن خیر.">يَسـَٔمُ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ موضوع توصیفِ خواستن خیر و واکنش به سختی.">الإِنسٰنُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دُعاءِ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="از خواستن خیر؛ درخواست نیکی و بهره‌مندی.">دُعاءِ</button>
    <button class="word-link" type="button" data-word="الخَيرِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="خیر و بهره‌مندی‌ای که انسان آن را می‌خواهد.">الخَيرِ</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="مَسَّهُ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به او برسد؛ رسیدن اثر سختی یا زیان به انسان.">مَسَّهُ</button>
    <button class="word-link" type="button" data-word="الشَّرُّ" data-root="ش ر ر" data-root-meaning="شر، بدی یا زیانی است که می‌تواند به رفتار، وضعیت، رخداد یا فرجام چیزی نسبت داده شود؛ در ساخت مقایسه‌ای، بدتر بودن را بیان می‌کند؛ و شرر در شاخه مادی به پاره‌های فروزان و جهنده آتش اشاره دارد." data-learn-more="/quran-terminology/fa/roots/sh-r-r/" data-context="سختی یا زیانی که به انسان می‌رسد.">الشَّرُّ</button>
    <button class="word-link" type="button" data-word="فَيَـٔوسٌ" data-root="ي أ س" data-learn-more="/quran-terminology/fa/roots/y-a-s/" data-root-meaning="بریدن امید و از دست دادن انتظارِ تحقق چیزی؛ استیأس، نومید شدن یا رسیدن به نومیدی؛ یئوس، وصف برجستهٔ نومیدی. در رعد ۱۳:۳۱، دانستن و روشن شدن نیز به‌عنوان خوانشی اختلافی مطرح است." data-context="پس بسیار نومید می‌شود؛ واکنش انسان هنگام رسیدن سختی.">فَيَـٔوسٌ</button>
    <button class="word-link" type="button" data-word="قَنوطٌ" data-root="ق ن ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-n-tt/" data-root-meaning="ناامیدی و از دست دادن امید به خیر." data-context="نومید؛ وصفی نزدیک به «یئوس» برای برجسته کردن واکنش به سختی.">قَنوطٌ</button>
  </p>
  <p class="farsi-verse">انسان از درخواست خیر خسته نمی‌شود؛ و اگر بدی به او برسد، بسیار نومید و مأیوس است.</p>
</section>
