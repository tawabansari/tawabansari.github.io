<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَضَلَّ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه" data-context="و گم شد و از دسترسشان رفت؛ دربارهٔ آنچه پیش‌تر می‌خواندند.">وَضَلَّ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراهِ «يَدعونَ»، خواندنِ پیشین و استمرار آن را در گذشته بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="می‌خواندند؛ دربارهٔ آنچه پیش از این برای پرستش یا یاری به آن روی می‌آوردند.">يَدعونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش‌تر؛ به زمان پیش از این مواجهه اشاره دارد.">قَبلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَظَنّوا" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد" data-context="و گمان بردند یا دریافتند؛ متعلق آن نبود راه گریز است و در این سیاق، تفسیر به یقین نیز آمده است.">وَظَنّوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَحيصٍ" data-root="ح ي ص" data-root-meaning="کنار رفتن و تغییر جهت برای دور شدن از چیزی؛ گریز و جست‌وجوی راه رهایی. محیص: گریز یا راه گریز." data-context="راه گریز؛ در پی ناپدید شدن آنچه پیش‌تر می‌خواندند، نبود چنین راهی برای آنان بیان می‌شود." data-learn-more="/quran-terminology/fa/roots/h-y-sad/">مَحيصٍ</button>
  </p>
  <p class="farsi-verse">و آنچه پیش‌تر می‌خواندند از آنان گم می‌شود و درمی‌یابند که هیچ گریزگاهی ندارند.</p>
</section>
