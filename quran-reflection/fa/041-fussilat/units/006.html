  <p class="farsi-verse">بگو: من تنها بشری مانند شما هستم؛ به من وحی می‌شود که معبود شما معبودی یگانه است؛ پس به سوی او راست و استوار باشید و از او آمرزش بخواهید. و وای بر شریک‌قراردهندگان،</p>
