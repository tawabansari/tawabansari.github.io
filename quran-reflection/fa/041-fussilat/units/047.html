  <p class="farsi-verse">دانش ساعت به او بازگردانده می‌شود؛ و هیچ میوه‌ای از پوشش خود بیرون نمی‌آید و هیچ ماده‌ای بار نمی‌گیرد و نمی‌زاید مگر به دانش او. و روزی که آنان را ندا دهد: شریکان من کجایند؟ می‌گویند: تو را آگاه کردیم که هیچ‌یک از ما گواه نیست.</p>
