<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَأتيهِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يَأتيهِ</button>
    <button class="word-link" type="button" data-word="البٰطِلُ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/" data-root-meaning="بی‌پایه شدن، فروپاشیدن، بی‌اثر و بی‌حقیقت بودن">البٰطِلُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينِ</button>
    <button class="word-link" type="button" data-word="يَدَيهِ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">يَدَيهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="خَلفِهِ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">خَلفِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="تَنزيلٌ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">تَنزيلٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَكيمٍ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">حَكيمٍ</button>
    <button class="word-link" type="button" data-word="حَميدٍ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">حَميدٍ</button>
  </p>
  <p class="farsi-verse">باطل نه از پیش رویش و نه از پشت سرش به آن نمی‌رسد؛ فروفرستاده‌ای از سوی حکیمی ستوده است.</p>
</section>
