<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="عَمِلَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">عَمِلَ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="فَلِنَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">فَلِنَفسِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">أَساءَ</button>
    <button class="word-link" type="button" data-word="فَعَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَعَلَيها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="بِظَلّٰمٍ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">بِظَلّٰمٍ</button>
    <button class="word-link" type="button" data-word="لِلعَبيدِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/">لِلعَبيدِ</button>
  </p>
  <p class="farsi-verse">هر که کار شایسته کند به سود خود اوست، و هر که بدی کند به زیان خود اوست؛ و پروردگارت به بندگان ستمگر نیست.</p>
