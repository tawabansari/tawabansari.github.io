<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="يَصبِروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="صبر کنند؛ فرضِ تحمل کردنِ آتش.">يَصبِروا</button>
    <button class="word-link" type="button" data-word="فَالنّارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="پس آتش؛ اقامتگاهی که برای آنان معرفی می‌شود.">فَالنّارُ</button>
    <button class="word-link" type="button" data-word="مَثوًى" data-root="ث و ي" data-root-meaning="ماندن و اقامت‌داشتن" data-context="آتش به‌عنوان جایگاه آنان." data-learn-more="/quran-terminology/fa/roots/th-w-y/">مَثوًى</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَستَعتِبوا" data-root="ع ت ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-b/" data-root-meaning="گله و سرزنش؛ استعتاب: طلب رفع ناخشنودی یا فرصت جبران." data-context="رفع ناخشنودی یا فرصت جبران بخواهند؛ درخواست پذیرش و رضایت.">يَستَعتِبوا</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُعتَبينَ" data-root="ع ت ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-b/" data-root-meaning="گله و سرزنش؛ استعتاب: طلب رفع ناخشنودی یا فرصت جبران." data-context="پذیرفته‌شدگان برای رفع ناخشنودی؛ با نفی، درخواست آنان پذیرفته نمی‌شود.">المُعتَبينَ</button>
  </p>
  <p class="farsi-verse">پس اگر شکیبایی کنند، آتش جایگاه آنان است؛ و اگر درخواست خشنودی کنند، از پذیرفته‌شدگان نخواهند بود.</p>
</section>
