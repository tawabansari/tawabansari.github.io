  <p class="farsi-verse">کسانی که در آیات ما کژروی می‌کنند بر ما پنهان نیستند. آیا کسی که در آتش افکنده می‌شود بهتر است یا کسی که در روز قیامت ایمن می‌آید؟ هرچه می‌خواهید انجام دهید؛ او به آنچه انجام می‌دهید بیناست.</p>
