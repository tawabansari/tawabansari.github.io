<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُلحِدونَ" data-root="ل ح د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h-d/" data-root-meaning="متمایل و منحرف شدن؛ ملتحد: پناهگاه یا راه کناره‌گیری." data-context="در آیات ما کج‌روی می‌کنند؛ از راه درستِ برخورد با آنها منحرف می‌شوند.">يُلحِدونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌های ما؛ موضوع کج‌رویِ یادشده.">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَخفَونَ" data-root="خ ف ي" data-root-meaning="پوشیده بودن و پنهان ماندن؛ پنهان کردن؛ و در شاخه‌ای از عربی کهن، آشکار شدن یا آشکار ساختن چیزی پوشیده." data-context="پنهان نمی‌مانند؛ با نفیِ پیش از فعل، کج‌روان از علم او دور نیستند." data-learn-more="/quran-terminology/fa/roots/kh-f-y/">يَخفَونَ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    ۗ
    <button class="word-link" type="button" data-word="أَفَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَمَن</button>
    <button class="word-link" type="button" data-word="يُلقىٰ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="افکنده می‌شود؛ در آتش.">يُلقىٰ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ جایگاه افکنده شدن در پرسش آیه.">النّارِ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ در مقایسهٔ دو سرانجام.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَأتى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="می‌آید؛ در حال امنیت در روز رستاخیز.">يَأتى</button>
    <button class="word-link" type="button" data-word="ءامِنًا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمن؛ حالت کسی که در روز رستاخیز می‌آید.">ءامِنًا</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمان قیامت.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="رستاخیز؛ در تعبیر روز قیامت.">القِيٰمَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="اعمَلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام دهید؛ امرِ هشدارآمیز در سیاق آیه.">اعمَلوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="شِئتُم" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهید؛ آنچه برمی‌گزینید انجام دهید.">شِئتُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دهید؛ کردار مخاطبان.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینا؛ به آنچه انجام می‌دهند.">بَصيرٌ</button>
  </p>
  <p class="farsi-verse">کسانی که در آیات ما کژروی می‌کنند بر ما پنهان نیستند. آیا کسی که در آتش افکنده می‌شود بهتر است یا کسی که در روز قیامت ایمن می‌آید؟ هرچه می‌خواهید انجام دهید؛ او به آنچه انجام می‌دهید بیناست.</p>
</section>
