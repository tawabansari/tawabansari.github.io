<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و می‌گویند؛ پرسش اشخاص از پوست‌هایشان.">وَقالوا</button>
    <button class="word-link" type="button" data-word="لِجُلودِهِم" data-root="ج ل د" data-root-meaning="پوست و پوشش بیرونی بدن؛ استواری و توان تحمل؛ و در کاربرد فعلیِ مربوط، تازیانه زدن." data-context="به پوست‌هایشان؛ مخاطب پرسش آنان دربارهٔ گواهی دادن علیه خودشان." data-learn-more="/quran-terminology/fa/roots/j-l-d/">لِجُلودِهِم</button>
    <button class="word-link" type="button" data-word="لِمَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَ</button>
    <button class="word-link" type="button" data-word="شَهِدتُم" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهی دادید؛ خطاب اشخاص به پوست‌هایی که علیه آنان شهادت داده‌اند.">شَهِدتُم</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ پاسخ پوست‌ها به پرسش.">قالوا</button>
    <button class="word-link" type="button" data-word="أَنطَقَنَا" data-root="ن ط ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-tt-q/" data-root-meaning="سخن گفتن و بیان کردن." data-context="ما را به سخن آورد؛ پوست‌ها سخن گفتنشان را به قدرت الهی نسبت می‌دهند.">أَنطَقَنَا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَنطَقَ" data-root="ن ط ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-tt-q/" data-root-meaning="سخن گفتن و بیان کردن." data-context="به سخن آورد؛ در وصف آن‌که هر چیز را به سخن آورده است.">أَنطَقَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ در ترکیب «هر چیز».">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیز؛ در بیان گستردگی قدرتِ به سخن آوردن.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="خَلَقَكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="شما را آفرید؛ خطاب به انسان‌ها.">خَلَقَكُم</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="نخستین؛ در عبارت «نخستین بار».">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="بار؛ در عبارت آفرینش نخستین.">مَرَّةٍ</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="بازگردانده می‌شوید؛ فعل مجهول دربارهٔ بازگشت به سوی او.">تُرجَعونَ</button>
  </p>
  <p class="farsi-verse">و به پوست‌هایشان می‌گویند: چرا علیه ما گواهی دادید؟ می‌گویند: آن معبود یگانه که هر چیز را به سخن آورد، ما را به سخن آورد؛ و او نخستین بار شما را آفرید و به سوی او بازگردانده می‌شوید.</p>
</section>
