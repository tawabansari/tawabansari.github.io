<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">فصلت ۴۱:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="ءايٰتِهِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌های او؛ پدیده‌های گواه آفرینش.">ءايٰتِهِ</button>
    <button class="word-link" type="button" data-word="الَّيلُ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ از نشانه‌های یادشده.">الَّيلُ</button>
    <button class="word-link" type="button" data-word="وَالنَّهارُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="و روز؛ از نشانه‌های یادشده.">وَالنَّهارُ</button>
    <button class="word-link" type="button" data-word="وَالشَّمسُ" data-root="ش م س" data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید؛ نام جرم آسمانی. در شاخه‌ای دیگر از زبان عربی، رمندگی و مقاومت در برابر مهار؛ این شاخه در قرآن نیامده است." data-context="و خورشید؛ از نشانه‌های آفرینش.">وَالشَّمسُ</button>
    <button class="word-link" type="button" data-word="وَالقَمَرُ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان." data-context="و ماه؛ از نشانه‌های آفرینش.">وَالقَمَرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَسجُدوا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="سجده کنید؛ با «لا»: برای خورشید و ماه سجده نکنید.">تَسجُدوا</button>
    <button class="word-link" type="button" data-word="لِلشَّمسِ" data-root="ش م س" data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید؛ نام جرم آسمانی. در شاخه‌ای دیگر از زبان عربی، رمندگی و مقاومت در برابر مهار؛ این شاخه در قرآن نیامده است." data-context="برای خورشید؛ موضوع سجده نهی‌شده.">لِلشَّمسِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="لِلقَمَرِ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان." data-context="برای ماه؛ موضوع سجده نهی‌شده.">لِلقَمَرِ</button>
    <button class="word-link" type="button" data-word="وَاسجُدوا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="و سجده کنید؛ فرمان سجده برای خداوند.">وَاسجُدوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَهُنَّ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آنها را آفرید؛ درباره آفریدگار پدیده‌های یادشده.">خَلَقَهُنَّ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="هستید؛ در جمله شرطیِ بندگی.">كُنتُم</button>
    <button class="word-link" type="button" data-word="إِيّاهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِيّاهُ</button>
    <button class="word-link" type="button" data-word="تَعبُدونَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بندگی می‌کنید؛ با تأکید بر اختصاص آن به او.">تَعبُدونَ</button>
  </p>
  <p class="farsi-verse">و از نشانه‌های او شب و روز و خورشید و ماه است؛ برای خورشید و برای ماه سجده نکنید، و برای آن معبود یگانه که آن‌ها را آفرید سجده کنید، اگر او را می‌پرستید.</p>
</section>
