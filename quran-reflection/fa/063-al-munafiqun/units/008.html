    <button class="word-link" type="button" data-word="رَجَعنا" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">رَجَعنا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المَدينَةِ</button>

    <button class="word-link" type="button" data-word="الأَعَزُّ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/">الأَعَزُّ</button>

    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِنَّ</button>

    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">می‌گویند: «اگر به مدینه بازگردیم، حتماً آن که عزتمندتر است، خوارتر را از آن بیرون می‌کند.» و عزت از آنِ آن معبود یگانه و فرستاده‌اش و مؤمنان است، ولی منافقان نمی‌دانند.</p>
