  <p class="farsi-verse">و چون آنان را ببینی، پیکرهایشان تو را به شگفت می‌آورد؛ و اگر سخن بگویند، به گفتارشان گوش می‌دهی. گویی چوب‌هایی تکیه‌داده‌اند. هر فریادی را علیه خود می‌پندارند. آنان دشمن‌اند؛ پس از آنان برحذر باش. آن معبود یگانه با آنان بجنگد؛ چگونه برگردانده می‌شوند!</p>
