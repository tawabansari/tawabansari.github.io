<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">المنافقون ۶۳:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="رَأَيتَهُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">رَأَيتَهُم</button>
    <button class="word-link" type="button" data-word="تُعجِبُكَ" data-root="ع ج ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُعجِبُكَ</button>
    <button class="word-link" type="button" data-word="أَجسامُهُم" data-root="ج س م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَجسامُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولوا</button>
    <button class="word-link" type="button" data-word="تَسمَع" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">تَسمَع</button>
    <button class="word-link" type="button" data-word="لِقَولِهِم" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">لِقَولِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="خُشُبٌ" data-root="خ ش ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خُشُبٌ</button>
    <button class="word-link" type="button" data-word="مُسَنَّدَةٌ" data-root="س ن د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُسَنَّدَةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَحسَبونَ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">يَحسَبونَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="صَيحَةٍ" data-root="ص ي ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَيحَةٍ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="العَدُوُّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">العَدُوُّ</button>
    <button class="word-link" type="button" data-word="فَاحذَرهُم" data-root="ح ذ ر" data-learn-more="/quran-terminology/fa/roots/h-dh-r/" data-root-meaning="احتیاط، پرهیز، بیداری در برابر خطر، ترس آگاهانه از آسیب، و مراقبت عملی پیش از وقوع ضرر">فَاحذَرهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="قٰتَلَهُمُ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">قٰتَلَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="أ ف ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُؤفَكونَ</button>
  </p>
  <p class="farsi-verse">و چون آنان را ببینی، پیکرهایشان تو را به شگفت می‌آورد؛ و اگر سخن بگویند، به گفتارشان گوش می‌دهی. گویی چوب‌هایی تکیه‌داده‌اند. هر فریادی را علیه خود می‌پندارند. آنان دشمن‌اند؛ پس از آنان برحذر باش. آن معبود یگانه با آنان بجنگد؛ چگونه برگردانده می‌شوند!</p>
</section>
