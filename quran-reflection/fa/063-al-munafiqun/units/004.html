<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">المنافقون ۶۳:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="رَأَيتَهُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آنان را ببینی؛ مشاهده گروه مورد بحث.">رَأَيتَهُم</button>
    <button class="word-link" type="button" data-word="تُعجِبُكَ" data-root="ع ج ب" data-root-meaning="شگفتی و بزرگ یا غیرمعمول یافتن؛ در اعجاب، جلب پسند یا تأثیر گذاشتن؛ و در کاربردِ عُجب، خودپسندی." data-context="تو را به شگفت و پسند می‌آورد؛ درباره ظاهر جسمانی آنان." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/">تُعجِبُكَ</button>
    <button class="word-link" type="button" data-word="أَجسامُهُم" data-root="ج س م" data-root-meaning="پیکر و ساختمان جسمانی؛ بزرگی و درشتی در مشتق‌ها یا وصف‌های همراه بیان می‌شود." data-context="جسم‌های آنان؛ ظاهر جسمانیِ گروه مورد بحث." data-learn-more="/quran-terminology/fa/roots/j-s-m/">أَجسامُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخن بگویند؛ در جمله شرطیِ شنیدن گفتارشان.">يَقولوا</button>
    <button class="word-link" type="button" data-word="تَسمَع" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="می‌شنوی؛ پاسخ شرط درباره گفتار آنان.">تَسمَع</button>
    <button class="word-link" type="button" data-word="لِقَولِهِم" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="به گفتارشان؛ آنچه مخاطب می‌شنود.">لِقَولِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="خُشُبٌ" data-root="خ ش ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-sh-b/" data-root-meaning="چوب و قطعه‌های چوب." data-context="چوب‌ها؛ در تشبیهِ گروه مورد بحث.">خُشُبٌ</button>
    <button class="word-link" type="button" data-word="مُسَنَّدَةٌ" data-root="س ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-d/" data-root-meaning="تکیه دادن و چیزی را به تکیه‌گاه سپردن." data-context="تکیه داده‌شده؛ وصف چوب‌ها.">مُسَنَّدَةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَحسَبونَ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="می‌پندارند؛ درباره هر فریادی که به زیان خود می‌انگارند.">يَحسَبونَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ فراگیری نسبت به فریادها.">كُلَّ</button>
    <button class="word-link" type="button" data-word="صَيحَةٍ" data-root="ص ي ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-h/" data-root-meaning="بانگ و فریاد بلند." data-context="فریاد و بانگ؛ آنچه علیه خود می‌پندارند.">صَيحَةٍ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="العَدُوُّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن؛ وصف همان گروه.">العَدُوُّ</button>
    <button class="word-link" type="button" data-word="فَاحذَرهُم" data-root="ح ذ ر" data-learn-more="/quran-terminology/fa/roots/h-dh-r/" data-root-meaning="احتیاط، پرهیز، بیداری در برابر خطر، ترس آگاهانه از آسیب، و مراقبت عملی پیش از وقوع ضرر" data-context="پس از آنان برحذر باش؛ فرمان احتیاط در برابرشان.">فَاحذَرهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="قٰتَلَهُمُ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="با آنان بستیزد؛ دعایی نکوهشی درباره آنان.">قٰتَلَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="چگونه از حقیقت برگردانده می‌شوند؛ در پایان توصیف گروهی که از آنان هشدار داده شده است؟">يُؤفَكونَ</button>
  </p>
  <p class="farsi-verse">و چون آنان را ببینی، پیکرهایشان تو را به شگفت می‌آورد؛ و اگر سخن بگویند، به گفتارشان گوش می‌دهی. گویی چوب‌هایی تکیه‌داده‌اند. هر فریادی را علیه خود می‌پندارند. آنان دشمن‌اند؛ پس از آنان برحذر باش. آن معبود یگانه با آنان بجنگد؛ چگونه برگردانده می‌شوند!</p>
</section>
