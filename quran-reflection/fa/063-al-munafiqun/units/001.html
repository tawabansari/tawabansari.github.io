  <p class="farsi-verse">هنگامی که منافقان نزد تو می‌آیند، می‌گویند: «گواهی می‌دهیم که تو فرستادهٔ آن معبود یگانه‌ای.» و آن معبود یگانه می‌داند که تو فرستادهٔ اویی؛ و آن معبود یگانه گواهی می‌دهد که منافقان دروغگویند.</p>
