  <h2 class="ayah-title">المنافقون ۶۳:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَن</button>
    <button class="word-link" type="button" data-word="يُؤَخِّرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/">يُؤَخِّرَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="نَفسًا" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسًا</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/">جاءَ</button>
    <button class="word-link" type="button" data-word="أَجَلُها" data-root="أ ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَجَلُها</button>

    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">تَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه هیچ جانی را هنگامی که سرآمدش فرا رسد به تأخیر نمی‌اندازد؛ و آن معبود یگانه از آنچه می‌کنید آگاه است.</p>
