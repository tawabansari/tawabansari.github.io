    <button class="word-link" type="button" data-word="رَسولِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رَسولِ</button>

    <button class="word-link" type="button" data-word="يَفقَهونَ" data-root="ف ق ه" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَفقَهونَ</button>
  </p>
  <p class="farsi-verse">آنان همان کسانی‌اند که می‌گویند: «به کسانی که نزد فرستادهٔ آن معبود یگانه‌اند انفاق نکنید تا پراکنده شوند.» و گنجینه‌های آسمان‌ها و زمین از آنِ آن معبود یگانه است، ولی منافقان نمی‌فهمند.</p>
</section>
