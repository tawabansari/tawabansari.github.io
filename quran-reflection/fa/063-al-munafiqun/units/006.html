    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>

    <button class="word-link" type="button" data-word="الفٰسِقينَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن">الفٰسِقينَ</button>
  </p>
  <p class="farsi-verse">برای آنان یکسان است که برایشان آمرزش بخواهی یا نخواهی؛ آن معبود یگانه هرگز آنان را نمی‌آمرزد. همانا آن معبود یگانه مردم نافرمان را هدایت نمی‌کند.</p>
