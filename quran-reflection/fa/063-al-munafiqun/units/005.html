<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">المنافقون ۶۳:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفته شود؛ آغاز دعوت به آمدن نزد فرستاده.">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="تَعالَوا" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="بیایید؛ دعوت به آمدن برای درخواست آمرزش.">تَعالَوا</button>
    <button class="word-link" type="button" data-word="يَستَغفِر" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="آمرزش بخواهد؛ دعای فرستاده برای آنان.">يَستَغفِر</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="رَسولُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستاده؛ کسی که برای آنان آمرزش می‌خواهد.">رَسولُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لَوَّوا" data-root="ل و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-y/" data-root-meaning="پیچاندن و کج کردن؛ در سخن، تحریف یا طفره رفتن." data-context="سرها را گرداندند؛ حرکتِ همراهِ روی‌گردانی.">لَوَّوا</button>
    <button class="word-link" type="button" data-word="رُءوسَهُم" data-root="ر أ س" data-root-meaning="سر؛ و در گسترش معنا، بخش بالایی، آغازین یا اصلی چیزی؛ رأس المال: اصل دارایی." data-context="سرهایشان؛ گردانده‌شده در روی‌گردانی از دعوت." data-learn-more="/quran-terminology/fa/roots/r-a-s/">رُءوسَهُم</button>
    <button class="word-link" type="button" data-word="وَرَأَيتَهُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و آنان را می‌بینی؛ مشاهدهٔ روی‌گردانی آنان.">وَرَأَيتَهُم</button>
    <button class="word-link" type="button" data-word="يَصُدّونَ" data-root="ص د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-d-d/" data-root-meaning="روی گرداندن و بازداشتن دیگری." data-context="روی می‌گردانند؛ واکنش آنان به دعوت.">يَصُدّونَ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="مُستَكبِرونَ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="متکبران؛ وصفِ حالت آنان هنگام روی‌گردانی.">مُستَكبِرونَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که به آنان گفته شود: «بیایید تا فرستادهٔ آن معبود یگانه برایتان آمرزش بخواهد»، سرهایشان را می‌چرخانند و می‌بینی که روی می‌گردانند و تکبر می‌ورزند.</p>
</section>
