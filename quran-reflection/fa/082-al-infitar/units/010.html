    <button class="word-link" type="button" data-word="لَحٰفِظينَ" data-root="ح ف ظ" data-root-meaning="نگه داشتن و مراقبت کردن از چیزی تا ضایع، فراموش، رها یا تباه نشود." data-context="نگهدارندگان بر شما؛ در ادامه گرامیانِ نویسنده معرفی می‌شوند." data-learn-more="/quran-terminology/fa/roots/h-f-zha/">لَحٰفِظينَ</button>
