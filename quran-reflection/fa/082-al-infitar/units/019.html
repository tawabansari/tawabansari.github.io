  <h2 class="ayah-title">الانفطار ۸۲:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَملِكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/">تَملِكُ</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسٌ</button>
    <button class="word-link" type="button" data-word="لِنَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">لِنَفسٍ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَيـًٔا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالأَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/">وَالأَمرُ</button>

    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
  </p>
  <p class="farsi-verse">روزی که هیچ جانی برای جان دیگر اختیاری ندارد، و فرمان در آن روز از آنِ خداست.</p>
