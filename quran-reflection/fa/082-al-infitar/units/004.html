<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الانفطار ۸۲:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذَا</button>
    <button class="word-link" type="button" data-word="القُبورُ" data-root="ق ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-b-r/" data-root-meaning="گور و به خاک سپردن مرده.">القُبورُ</button>
    <button class="word-link" type="button" data-word="بُعثِرَت" data-root="ب ع ث ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-ayn-th-r/" data-root-meaning="زیرورو کردن و بیرون ریختن آنچه پنهان است.">بُعثِرَت</button>
  </p>
  <p class="farsi-verse">و هنگامی که گورها زیرورو شوند،</p>
</section>
