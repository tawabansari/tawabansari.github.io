<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الانفطار ۸۲:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَىِّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَىِّ</button>
    <button class="word-link" type="button" data-word="صورَةٍ" data-root="ص و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صورَةٍ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شاءَ</button>
    <button class="word-link" type="button" data-word="رَكَّبَكَ" data-root="ر ك ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رَكَّبَكَ</button>
  </p>
  <p class="farsi-verse">در هر صورتی که خواست، تو را ترکیب کرد.</p>
