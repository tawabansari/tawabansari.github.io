  </p>
  <p class="farsi-verse">و تندر با ستایش او تسبیح می‌گوید و فرشتگان نیز از بیم او؛ و صاعقه‌ها را می‌فرستد و با آن‌ها هرکه را بخواهد می‌زند، در حالی که آنان درباره آن معبود یگانه جدال می‌کنند؛ و او سخت‌قدرت است.</p>
