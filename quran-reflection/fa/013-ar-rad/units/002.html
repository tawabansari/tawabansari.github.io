  <p class="farsi-verse">آن معبود یگانه است که آسمان‌ها را بی‌ستون‌هایی که ببینید برافراشت، سپس بر عرش استقرار یافت و خورشید و ماه را رام کرد؛ هرکدام تا زمانی معین روان است؛ کار را تدبیر می‌کند و آیات را به تفصیل بیان می‌کند، باشد که به دیدار پروردگارتان یقین کنید.</p>
