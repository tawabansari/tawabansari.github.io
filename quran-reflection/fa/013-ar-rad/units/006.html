  <p class="farsi-verse">و پیش از نیکی، بدی را از تو به شتاب می‌خواهند، در حالی که پیش از آنان کیفرهای عبرت‌آموز گذشته است؛ و پروردگارت با وجود ستم مردم برای آنان صاحب آمرزش است و پروردگارت سخت‌کیفر است.</p>
