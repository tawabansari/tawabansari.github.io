<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَدِ</button>
    <button class="word-link" type="button" data-word="استُهزِئَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد">استُهزِئَ</button>
    <button class="word-link" type="button" data-word="بِرُسُلٍ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">بِرُسُلٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="فَأَملَيتُ" data-root="م ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-w/" data-root-meaning="مدت طولانی و مهلت دادن؛ املاء: فرصت و امتداد بخشیدن.">فَأَملَيتُ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَخَذتُهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَخَذتُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="عِقابِ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار">عِقابِ</button>
  </p>
  <p class="farsi-verse">و پیش از تو رسولانی مسخره شدند؛ پس به کافران مهلت دادم، سپس آنان را گرفتم؛ پس کیفر من چگونه بود؟</p>
</section>
