<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="صَبَرُوا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">صَبَرُوا</button>
    <button class="word-link" type="button" data-word="ابتِغاءَ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد">ابتِغاءَ</button>
    <button class="word-link" type="button" data-word="وَجهِ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»">وَجهِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَنفَقوا" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">وَأَنفَقوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="سِرًّا" data-root="س ر ر" data-learn-more="/quran-terminology/fa/roots/s-r-r/" data-root-meaning="راز و نهان، شادی و آسایش، و جایگاه استقرار">سِرًّا</button>
    <button class="word-link" type="button" data-word="وَعَلانِيَةً" data-root="ع ل ن" data-learn-more="/quran-terminology/fa/roots/ayn-l-n/" data-root-meaning="آشکار بودن و آشکار ساختن در برابر حوزه پنهان">وَعَلانِيَةً</button>
    <button class="word-link" type="button" data-word="وَيَدرَءونَ" data-root="د ر أ" data-learn-more="/quran-terminology/fa/roots/d-r-a/" data-root-meaning="دور کردن، پس زدن، بازداشتن و جلوگیری از رسیدن یا اثر کردن چیزی">وَيَدرَءونَ</button>
    <button class="word-link" type="button" data-word="بِالحَسَنَةِ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">بِالحَسَنَةِ</button>
    <button class="word-link" type="button" data-word="السَّيِّئَةَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّئَةَ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عُقبَى" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار">عُقبَى</button>
    <button class="word-link" type="button" data-word="الدّارِ" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت">الدّارِ</button>
  </p>
  <p class="farsi-verse">و کسانی که در طلب روی پروردگارشان شکیبایی کردند و صلات را برپا داشتند و از آنچه روزی‌شان کرده‌ایم پنهان و آشکار بخشیدند و بدی را با نیکی دفع می‌کنند؛ برای آنان فرجام آن سراست؛</p>
</section>
