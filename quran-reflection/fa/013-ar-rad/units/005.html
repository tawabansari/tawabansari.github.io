<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَعجَب" data-root="ع ج ب" data-root-meaning="شگفتی و بزرگ یا غیرمعمول یافتن؛ در اعجاب، جلب پسند یا تأثیر گذاشتن؛ و در کاربردِ عُجب، خودپسندی." data-context="اگر شگفت‌زده می‌شوی؛ خطابِ آغاز آیه." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/">تَعجَب</button>
    <button class="word-link" type="button" data-word="فَعَجَبٌ" data-root="ع ج ب" data-root-meaning="شگفتی و بزرگ یا غیرمعمول یافتن؛ در اعجاب، جلب پسند یا تأثیر گذاشتن؛ و در کاربردِ عُجب، خودپسندی." data-context="پس شگفت‌آور است؛ سخنِ منکرانِ بازآفرینی." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/">فَعَجَبٌ</button>
    <button class="word-link" type="button" data-word="قَولُهُم" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخن آنان؛ آنچه شگفت‌آور معرفی می‌شود.">قَولُهُم</button>
    <button class="word-link" type="button" data-word="أَءِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِذا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="شدیم و بودیم؛ در پرسش از خاک شدن.">كُنّا</button>
    <button class="word-link" type="button" data-word="تُرٰبًا" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه" data-context="خاک؛ حالتِ پس از مرگ در گفتار آنان.">تُرٰبًا</button>
    <button class="word-link" type="button" data-word="أَءِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِنّا</button>
    <button class="word-link" type="button" data-word="لَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَفى</button>
    <button class="word-link" type="button" data-word="خَلقٍ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش؛ موضوعِ بازآفرینی.">خَلقٍ</button>
    <button class="word-link" type="button" data-word="جَديدٍ" data-root="ج د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-d/" data-root-meaning="شاخه‌های این خانواده شامل بریدن، نو شدن، نوارها و راه‌های آشکار، و «جدّ» به معنای عظمت است." data-context="تازه؛ وصفِ آفرینش.">جَديدٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ به پروردگارشان.">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِرَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="به پروردگارشان؛ متعلقِ کفر.">بِرَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الأَغلٰلُ" data-root="غ ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-l/" data-root-meaning="بند و زنجیر؛ غِلّ: کینه؛ غلول: خیانت در مال سپرده‌شده." data-context="غل‌ها و بندها؛ بر گردن‌هایشان.">الأَغلٰلُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَعناقِهِم" data-root="ع ن ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-q/" data-root-meaning="گردن؛ گاه نماینده اشخاص یا حالت سر و گردن." data-context="گردن‌هایشان؛ جایگاهِ غل‌ها.">أَعناقِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="اهل و همراهان؛ در ترکیبِ اهل آتش.">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ جایگاهِ یادشده.">النّارِ</button>
    ۖ
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه" data-context="ماندگار؛ وصفِ حضور آنان در آتش.">خٰلِدونَ</button>
  </p>
  <p class="farsi-verse">و اگر شگفت‌زده می‌شوی، سخن آنان شگفت است که: آیا چون خاک شدیم، در آفرینشی تازه خواهیم بود؟ آنان کسانی‌اند که به پروردگارشان کفر ورزیدند و غل‌ها بر گردن آنان است و اهل آتش‌اند و در آن ماندگارند.</p>
</section>
