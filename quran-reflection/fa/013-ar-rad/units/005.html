  <p class="farsi-verse">و اگر شگفت‌زده می‌شوی، سخن آنان شگفت است که: آیا چون خاک شدیم، در آفرینشی تازه خواهیم بود؟ آنان کسانی‌اند که به پروردگارشان کفر ورزیدند و غل‌ها بر گردن آنان است و اهل آتش‌اند و در آن ماندگارند.</p>
