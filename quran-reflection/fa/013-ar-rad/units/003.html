<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="مَدَّ" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر" data-context="گسترد؛ زمین را امتداد داد.">مَدَّ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ گسترهٔ زندگی انسان.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار داد؛ کوه‌ها و رودها را در زمین پدید آورد.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="ر س و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-s-w/" data-root-meaning="ثابت و استوار شدن؛ لنگر انداختن و قرار گرفتن." data-context="کوه‌های استوار؛ قرارگرفته و پابرجا.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="وَأَنهٰرًا" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="و رودها؛ جریان‌های آب در زمین.">وَأَنهٰرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ شمول انواع ثمرات.">كُلِّ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="ث م ر" data-learn-more="/quran-terminology/fa/roots/th-m-r/" data-root-meaning="بار درخت، میوه و گسترش معنا به حاصل و دارایی" data-context="میوه‌ها؛ فرآورده‌های گیاهی.">الثَّمَرٰتِ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد؛ دوگانگیِ مورد اشاره را پدید آورد.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="زَوجَينِ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="جفت؛ دو عضو یا دو صنفِ مورد اشاره در ثمرات.">زَوجَينِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="ث ن ي" data-root-meaning="دوتایی‌شدن، بازگرداندن و تکرار" data-context="دو؛ شمار در ترکیب زوجین دربارهٔ ثمرات." data-learn-more="/quran-terminology/fa/roots/th-n-y/">اثنَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="يُغشِى" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش" data-context="می‌پوشاند؛ شب را بر روز می‌گستراند.">يُغشِى</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ پوشانندهٔ روز در این تعبیر.">الَّيلَ</button>
    <button class="word-link" type="button" data-word="النَّهارَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز؛ آنچه شب آن را می‌پوشاند.">النَّهارَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌هایی؛ مواردی برای شناخت و توجه.">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برای مردمی؛ مخاطبان اهل اندیشیدن.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="ف ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-r/" data-root-meaning="اندیشه و به کار گرفتن فکر برای شناخت." data-context="می‌اندیشند؛ دربارهٔ نشانه‌ها تأمل می‌کنند.">يَتَفَكَّرونَ</button>
  </p>
  <p class="farsi-verse">و اوست که زمین را گسترد و در آن کوه‌های استوار و نهرها قرار داد و از همه میوه‌ها در آن جفتی دوتایی قرار داد؛ شب را بر روز می‌پوشاند؛ در این نشانه‌هایی برای مردمی است که می‌اندیشند.</p>
</section>
