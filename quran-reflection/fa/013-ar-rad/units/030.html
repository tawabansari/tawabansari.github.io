  </p>
  <p class="farsi-verse">این‌گونه تو را در میان جماعتی فرستادیم که پیش از آن جماعت‌هایی گذشته‌اند، تا آنچه را به تو وحی کرده‌ایم بر آنان بخوانی، در حالی که به فرارحمن کفر می‌ورزند؛ بگو: او پروردگار من است؛ هیچ معبودی جز او نیست؛ بر او توکل کرده‌ام و بازگشتم به سوی اوست.</p>
</section>
