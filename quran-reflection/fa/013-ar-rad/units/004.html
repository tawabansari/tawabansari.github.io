<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَفِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ جای قطعه‌های هم‌جوار و روییدنی‌ها.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="قِطَعٌ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="قطعه‌ها؛ بخش‌های زمین در کنار یکدیگر.">قِطَعٌ</button>
    <button class="word-link" type="button" data-word="مُتَجٰوِرٰتٌ" data-root="ج و ر" data-root-meaning="همسایگی و مجاورت؛ پناه دادن و حمایت؛ در شاخهٔ جَوْر، انحراف از راه و عدالت." data-context="هم‌جوار؛ قطعه‌های زمینی که در کنار یکدیگر قرار دارند." data-learn-more="/quran-terminology/fa/roots/j-w-r/">مُتَجٰوِرٰتٌ</button>
    <button class="word-link" type="button" data-word="وَجَنّٰتٌ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="و باغ‌ها؛ باغ‌های انگورِ یادشده.">وَجَنّٰتٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَعنٰبٍ" data-root="ع ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-b/" data-root-meaning="انگور و تاک." data-context="انگورها؛ محصول باغ‌ها.">أَعنٰبٍ</button>
    <button class="word-link" type="button" data-word="وَزَرعٌ" data-root="ز ر ع" data-learn-more="/quran-terminology/fa/roots/z-r-ayn/" data-root-meaning="قرار دادن بذر، رویش، رشد گیاه و پیدایش محصول" data-context="و کشتزار؛ روییدنی حاصل از کشت.">وَزَرعٌ</button>
    <button class="word-link" type="button" data-word="وَنَخيلٌ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان." data-context="و نخل‌ها؛ درختان خرمای یادشده.">وَنَخيلٌ</button>
    <button class="word-link" type="button" data-word="صِنوانٌ" data-root="ص ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-w/" data-root-meaning="شاخه یا درخت برخاسته از یک بن؛ صنو: هم‌ریشه و همتا." data-context="هم‌ریشه؛ نخل‌هایی با ریشه یا بن مشترک.">صِنوانٌ</button>
    <button class="word-link" type="button" data-word="وَغَيرُ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="و غیر؛ بیان دستهٔ مقابل نخل‌های هم‌ریشه.">وَغَيرُ</button>
    <button class="word-link" type="button" data-word="صِنوانٍ" data-root="ص ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-w/" data-root-meaning="شاخه یا درخت برخاسته از یک بن؛ صنو: هم‌ریشه و همتا." data-context="هم‌ریشه؛ وصفی که با «غیر» از گروه دوم نفی می‌شود.">صِنوانٍ</button>
    <button class="word-link" type="button" data-word="يُسقىٰ" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب." data-context="آبیاری می‌شود؛ دریافت آب برای روییدنی‌ها.">يُسقىٰ</button>
    <button class="word-link" type="button" data-word="بِماءٍ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="با آب؛ وسیلهٔ آبیاری.">بِماءٍ</button>
    <button class="word-link" type="button" data-word="وٰحِدٍ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یکسان و واحد؛ وصف آب آبیاری.">وٰحِدٍ</button>
    <button class="word-link" type="button" data-word="وَنُفَضِّلُ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="و برتری می‌دهیم؛ تفاوت حاصل میان روییدنی‌ها.">وَنُفَضِّلُ</button>
    <button class="word-link" type="button" data-word="بَعضَها" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="بعضی از آنها؛ بخشی از روییدنی‌های مقایسه‌شده.">بَعضَها</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="بعضی دیگر؛ طرف دیگر مقایسهٔ حاصل.">بَعضٍ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأُكُلِ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="خوراک و حاصل؛ چیزی که تفاوت آن بیان می‌شود.">الأُكُلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌ها؛ دلالت‌های این تفاوت‌ها و رویش‌ها.">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برای مردمی؛ مخاطبان بهره‌مند از نشانه‌ها.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="می‌اندیشند؛ به کار گرفتن خرد دربارهٔ نشانه‌ها.">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">و در زمین قطعه‌هایی همسایه و باغ‌هایی از انگور و کشتزار و نخل‌هایی هم‌ریشه و جدا از هم هست که با یک آب سیراب می‌شوند؛ و برخی را در خوراک بر برخی برتری می‌دهیم؛ در این نشانه‌هایی برای مردمی است که خرد می‌ورزند.</p>
</section>
