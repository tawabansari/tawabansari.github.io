  <p class="farsi-verse">و در زمین قطعه‌هایی همسایه و باغ‌هایی از انگور و کشتزار و نخل‌هایی هم‌ریشه و جدا از هم هست که با یک آب سیراب می‌شوند؛ و برخی را در خوراک بر برخی برتری می‌دهیم؛ در این نشانه‌هایی برای مردمی است که خرد می‌ورزند.</p>
