  <p class="farsi-verse">و کسانی که به آنان کتاب داده‌ایم به آنچه بر تو فرو فرستاده شده شاد می‌شوند و از گروه‌ها کسانی بخشی از آن را انکار می‌کنند؛ بگو: تنها فرمان یافته‌ام که آن معبود یگانه را بپرستم و چیزی را شریک او نکنم؛ به سوی او فرامی‌خوانم و بازگشتم به سوی اوست.</p>
