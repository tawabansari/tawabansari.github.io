<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءاتَينٰهُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به آنان داده‌ایم؛ عطا کردن کتاب به گروه یادشده.">ءاتَينٰهُمُ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتاب؛ آنچه پیش‌تر به آنان داده شده است.">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="يَفرَحونَ" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="شادمان می‌شوند؛ واکنش به آنچه بر مخاطب نازل شده است.">يَفرَحونَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="أُنزِلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نازل شده است؛ فروفرستادن پیام بر مخاطب.">أُنزِلَ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الأَحزابِ" data-root="ح ز ب" data-root-meaning="گرد آمدن و تشکیل مجموعه؛ گروهی از افراد با پیوند، موضع یا هدف مشترک." data-context="از گروه‌ها؛ گروه‌هایی که برخی از آنان بخشی از پیام را انکار می‌کنند." data-learn-more="/quran-terminology/fa/roots/h-z-b/">الأَحزابِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يُنكِرُ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص" data-context="انکار می‌کند؛ نپذیرفتن بخشی از آنچه نازل شده است.">يُنكِرُ</button>
    <button class="word-link" type="button" data-word="بَعضَهُ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="بخشی از آن؛ قسمت مورد انکار.">بَعضَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان اعلام سخن بعدی.">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أُمِرتُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان یافته‌ام؛ مأمور شدن به عبادت خدا.">أُمِرتُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="أَعبُدَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بپرستم؛ عبادت خدا در جملهٔ بیان مأموریت.">أَعبُدَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="أُشرِكَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریک قرار دهم؛ کاری که در این جمله نفی شده است.">أُشرِكَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="أَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="دعوت می‌کنم؛ فراخواندن به سوی او.">أَدعوا</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="مَـٔابِ" data-root="أ و ب" data-learn-more="/quran-terminology/fa/roots/a-w-b/" data-root-meaning="بازگشت و بازآوردن؛ «أوّاب»، بسیار بازگشت‌کننده و روی‌آورنده؛ «مآب»، بازگشت یا بازگشتگاه." data-context="بازگشت من؛ مقصد بازگشت به سوی خدا.">مَـٔابِ</button>
  </p>
  <p class="farsi-verse">و کسانی که به آنان کتاب داده‌ایم به آنچه بر تو فرو فرستاده شده شاد می‌شوند و از گروه‌ها کسانی بخشی از آن را انکار می‌کنند؛ بگو: تنها فرمان یافته‌ام که آن معبود یگانه را بپرستم و چیزی را شریک او نکنم؛ به سوی او فرامی‌خوانم و بازگشتم به سوی اوست.</p>
</section>
