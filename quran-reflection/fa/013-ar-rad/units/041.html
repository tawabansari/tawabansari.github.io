    <button class="word-link" type="button" data-word="مُعَقِّبَ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/">مُعَقِّبَ</button>

  </p>
  <p class="farsi-verse">آیا ندیده‌اند که به زمین می‌آییم و از کناره‌هایش می‌کاهیم؟ و آن معبود یگانه داوری می‌کند؛ هیچ‌کس حکم او را برنمی‌گرداند و او زودحساب است.</p>
