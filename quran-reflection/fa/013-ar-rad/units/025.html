  <p class="farsi-verse">و کسانی که پیمان آن معبود یگانه را پس از استوارکردنش می‌شکنند و آنچه را آن معبود یگانه فرمان داده پیوند داده شود می‌گسلند و در زمین فساد می‌کنند، لعنت و بدی آن سرا برای آنان است.</p>
