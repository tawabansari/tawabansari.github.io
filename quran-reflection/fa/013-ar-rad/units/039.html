<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَمحُوا" data-root="م ح و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَمحُوا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيُثبِتُ" data-root="ث ب ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيُثبِتُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَعِندَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعِندَهُ</button>
    <button class="word-link" type="button" data-word="أُمُّ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/">أُمُّ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">الكِتٰبِ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه هرچه را بخواهد محو می‌کند و استوار می‌دارد و اصل کتاب نزد اوست.</p>
