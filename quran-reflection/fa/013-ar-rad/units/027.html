  <p class="farsi-verse">و کافران می‌گویند: چرا نشانه‌ای از پروردگارش بر او فرو فرستاده نشده است؟ بگو: آن معبود یگانه هرکه را بخواهد گمراه می‌کند و هرکه بازگردد به سوی خود هدایت می‌کند؛</p>
