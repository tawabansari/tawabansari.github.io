<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الرعد ۱۳:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُريكُمُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">يُريكُمُ</button>
    <button class="word-link" type="button" data-word="البَرقَ" data-root="ب ر ق" data-learn-more="/quran-terminology/fa/roots/b-r-q/" data-root-meaning="درخشیدن، برق زدن، روشنایی ناگهانی، و آشکار شدن لحظه‌ای در اثر نور شدید">البَرقَ</button>
    <button class="word-link" type="button" data-word="خَوفًا" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">خَوفًا</button>
    <button class="word-link" type="button" data-word="وَطَمَعًا" data-root="ط م ع" data-learn-more="/quran-terminology/fa/roots/tt-m-ayn/" data-root-meaning="چشم‌داشت و گرایش درونی به دستیابی به امر مطلوبی که ممکن پنداشته می‌شود">وَطَمَعًا</button>
    <button class="word-link" type="button" data-word="وَيُنشِئُ" data-root="ن ش أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-a/" data-root-meaning="پدید آوردن، رشد کردن و پرورش دادن.">وَيُنشِئُ</button>
    <button class="word-link" type="button" data-word="السَّحابَ" data-root="س ح ب" data-root-meaning="کشیدن، امتداد یافتن و ابر؛ از کشیده شدن چیزی بر زمین تا حرکت ابرها در آسمان و کشانده شدن انسان در صحنه عذاب" data-learn-more="/quran-terminology/fa/roots/s-h-b/">السَّحابَ</button>
    <button class="word-link" type="button" data-word="الثِّقالَ" data-root="ث ق ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-q-l/" data-root-meaning="سنگینی، وزن و بار؛ ثقل می‌تواند جسمانی یا مربوط به مسئولیت و دشواری باشد.">الثِّقالَ</button>
  </p>
  <p class="farsi-verse">اوست که برق را برای ترس و امید به شما نشان می‌دهد و ابرهای سنگین را پدید می‌آورد.</p>
</section>
