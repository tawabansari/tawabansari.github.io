<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">القارعة ۱۰۱:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَكونُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و می‌شوند؛ بیانِ دگرگونی حالت کوه‌ها.">وَتَكونُ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ در تشبیه به پشمِ زده و پراکنده." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالُ</button>
    <button class="word-link" type="button" data-word="كَالعِهنِ" data-root="ع ه ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-h2-n/" data-root-meaning="پشم رنگ‌شده." data-context="چون پشم؛ معیار تشبیه کوه‌ها.">كَالعِهنِ</button>
    <button class="word-link" type="button" data-word="المَنفوشِ" data-root="ن ف ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-sh/" data-root-meaning="پراکنده و باز شدن؛ درباره دام، شبانه برای چرا پراکنده شدن." data-context="زده و پراکنده؛ وصفِ پشمی که از هم گشوده است.">المَنفوشِ</button>
  </p>
  <p class="farsi-verse">و کوه‌ها چون پشمِ حلاجی‌شده باشند.</p>
</section>
