<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">القارعة ۱۰۱:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="يَكونُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكونُ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="كَالفَراشِ" data-root="ف ر ش" data-learn-more="/quran-terminology/fa/roots/f-r-sh/" data-root-meaning="گستردن، پهن کردن، آماده ساختن بستر، و مهیا کردن سطحی برای استقرار، نشستن، خوابیدن، زیستن یا حرکت کردن">كَالفَراشِ</button>
    <button class="word-link" type="button" data-word="المَبثوثِ" data-root="ب ث ث" data-root-meaning="پراکندن، گستراندن و آشکار ساختن؛ از انتشار موجودات در زمین تا اندوهی که یعقوب به آن معبود یگانه بازمی‌گوید" data-learn-more="/quran-terminology/fa/roots/b-th-th/">المَبثوثِ</button>
  </p>
  <p class="farsi-verse">روزی که مردم چون پروانه‌های پراکنده باشند،</p>
</section>
