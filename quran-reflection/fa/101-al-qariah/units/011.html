  <h2 class="ayah-title">القارعة ۱۰۱:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="نارٌ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ توضیحی برای هاویه در سیاق آیات.">نارٌ</button>
    <button class="word-link" type="button" data-word="حامِيَةٌ" data-root="ح م ي" data-root-meaning="گرما و داغ شدن؛ حفاظت و بازداشتن آسیب یا دسترسی؛ حمیه: غیرت، برانگیختگی و تعصب." data-context="بسیار داغ و سوزان؛ صفت آتش در توضیح هاویه." data-learn-more="/quran-terminology/fa/roots/h-m-y/">حامِيَةٌ</button>
