<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">البروج ۸۵:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="لَوحٍ" data-root="ل و ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-h/" data-root-meaning="لوح و تخته؛ نیز نمایان شدن و سوزاندن یا دگرگون کردن رنگ.">لَوحٍ</button>
    <button class="word-link" type="button" data-word="مَحفوظٍ" data-root="ح ف ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-f-zha/" data-root-meaning="نگهداری، مراقبت، به خاطر سپردن و از آسیب محفوظ داشتن.">مَحفوظٍ</button>
  </p>
  <p class="farsi-verse">در لوحی محفوظ.</p>
