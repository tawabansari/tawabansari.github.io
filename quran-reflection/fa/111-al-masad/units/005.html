<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">المسد ۱۱۱:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جيدِها" data-root="ج ي د" data-root-meaning="گردن؛ در صورت‌های وصفی، بلندی، کشیدگی و تناسب گردن." data-context="گردن او؛ در این آیه، گردن همسر ابولهب که ریسمان بر آن قرار دارد" data-learn-more="/quran-terminology/fa/roots/j-y-d/">جيدِها</button>
    <button class="word-link" type="button" data-word="حَبلٌ" data-root="ح ب ل" data-root-meaning="ریسمان و رشتهٔ ممتد؛ پیوند، عهد و وسیلهٔ اتصال و حمایت." data-context="ریسمانی" data-learn-more="/quran-terminology/fa/roots/h-b-l/">حَبلٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَسَدٍ" data-root="م س د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-d/" data-root-meaning="تابیدن رشته؛ مسد: طناب یا رشته تابیده." data-context="الیاف یا رشته‌های تابیده برای ساختن ریسمان">مَسَدٍ</button>
  </p>
  <p class="farsi-verse">بر گردنش ریسمانی از الیاف تابیده است.</p>
</section>
