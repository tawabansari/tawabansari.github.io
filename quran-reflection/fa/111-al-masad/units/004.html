<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">المسد ۱۱۱:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَامرَأَتُهُ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">وَامرَأَتُهُ</button>
    <button class="word-link" type="button" data-word="حَمّالَةَ" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری.">حَمّالَةَ</button>
    <button class="word-link" type="button" data-word="الحَطَبِ" data-root="ح ط ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-tt-b/" data-root-meaning="هیزم و مواد سوختنی، و گردآوردن آن‌ها.">الحَطَبِ</button>
  </p>
  <p class="farsi-verse">و همسرش، آن هیزم‌کش،</p>
