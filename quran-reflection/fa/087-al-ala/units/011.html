<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">الأعلى ۸۷:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَتَجَنَّبُهَا" data-root="ج ن ب" data-root-meaning="پهلو، کنار و جانب؛ فاصله گرفتن، دور ساختن و پرهیز کردن. «جُنُب» در سیاق طهارت، وضعیتِ نیازمند پاک شدن است." data-context="و از آن دوری می‌کند؛ روی‌گردانیِ بدبخت‌ترین از یادآوری." data-learn-more="/quran-terminology/fa/roots/j-n-b/">وَيَتَجَنَّبُهَا</button>
    <button class="word-link" type="button" data-word="الأَشقَى" data-root="ش ق و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-q-w/" data-root-meaning="رنج و بدبختی و محرومیت از نیک‌فرجامی." data-context="بدبخت‌ترین؛ کسی که از یادآوری دوری می‌کند.">الأَشقَى</button>
  </p>
  <p class="farsi-verse">و بدبخت‌ترین از آن دوری خواهد کرد،</p>
</section>
