<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الأعلى ۸۷:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَيَذَّكَّرُ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">سَيَذَّكَّرُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَخشىٰ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/" data-root-meaning="بیم و ملاحظهٔ آگاهانه در برابر خطری شناخته‌شده یا پیامدی جدی، و خشیت اثرگذار در برابر آن معبود یگانه">يَخشىٰ</button>
  </p>
  <p class="farsi-verse">آن که می‌ترسد، پند خواهد گرفت،</p>
</section>
