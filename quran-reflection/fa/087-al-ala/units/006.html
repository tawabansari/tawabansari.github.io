<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الأعلى ۸۷:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَنُقرِئُكَ" data-root="ق ر أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَنُقرِئُكَ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَنسىٰ" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل">تَنسىٰ</button>
  </p>
  <p class="farsi-verse">به‌زودی تو را به خواندن وامی‌داریم، پس فراموش نخواهی کرد،</p>
