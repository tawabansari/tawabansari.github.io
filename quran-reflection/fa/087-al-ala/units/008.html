<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الأعلى ۸۷:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنُيَسِّرُكَ" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت">وَنُيَسِّرُكَ</button>
    <button class="word-link" type="button" data-word="لِليُسرىٰ" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت">لِليُسرىٰ</button>
  </p>
  <p class="farsi-verse">و تو را برای راه آسان آماده می‌کنیم.</p>
