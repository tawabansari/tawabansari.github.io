<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">الأعلى ۸۷:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَبِّحِ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">سَبِّحِ</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">اسمَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="الأَعلَى" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَعلَى</button>
  </p>
  <p class="farsi-verse">نام پروردگار برترینت را به پاکی بستای،</p>
