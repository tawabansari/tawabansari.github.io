<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الأعلى ۸۷:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="تُؤثِرونَ" data-root="أ ث ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-th-r/" data-root-meaning="اثر و نشانهٔ باقی‌مانده؛ دنبال کردن اثر؛ و در ایثار، مقدم داشتن دیگری یا چیزی.">تُؤثِرونَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةَ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
  </p>
  <p class="farsi-verse">بلکه شما زندگی دنیا را ترجیح می‌دهید،</p>
</section>
