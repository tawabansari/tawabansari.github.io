<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">العلق ۹۶:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ناصِيَةٍ" data-root="ن ص ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ناصِيَةٍ</button>
    <button class="word-link" type="button" data-word="كٰذِبَةٍ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كٰذِبَةٍ</button>
    <button class="word-link" type="button" data-word="خاطِئَةٍ" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/" data-root-meaning="لغزیدن از مسیر درست، به هدف نخوردن، خطا رفتن؛ و در برخی صورت‌ها، انحراف آگاهانه از حق.">خاطِئَةٍ</button>
  </p>
  <p class="farsi-verse">پیشانی‌ای دروغگو و خطاکار.</p>
