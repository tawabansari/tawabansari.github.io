<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">العلق ۹۶:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="أَمَرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمَرَ</button>
    <button class="word-link" type="button" data-word="بِالتَّقوىٰ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">بِالتَّقوىٰ</button>
  </p>
  <p class="farsi-verse">یا به پرهیزگاری فرمان دهد؟</p>
</section>
