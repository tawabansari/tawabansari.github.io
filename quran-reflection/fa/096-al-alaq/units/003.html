<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">العلق ۹۶:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اقرَأ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="بخوان؛ تکرارِ فرمانِ قرائت." data-learn-more="/quran-terminology/fa/roots/q-r-a/">اقرَأ</button>
    <button class="word-link" type="button" data-word="وَرَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="و پروردگارت؛ موضوعِ وصفِ کرامت.">وَرَبُّكَ</button>
    <button class="word-link" type="button" data-word="الأَكرَمُ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی." data-context="گرامی‌ترین؛ وصفِ پروردگار.">الأَكرَمُ</button>
  </p>
  <p class="farsi-verse">بخوان، و پروردگارت بخشنده‌ترین است،</p>
</section>
