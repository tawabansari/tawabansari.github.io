<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">العلق ۹۶:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَلّا</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَنتَهِ" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="دست بکشد؛ در هشدار به شخصی که از رفتار خود بازنمی‌ایستد." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">يَنتَهِ</button>
    <button class="word-link" type="button" data-word="لَنَسفَعًا" data-root="س ف ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-f-ayn/" data-root-meaning="گرفتن و کشیدن با شدت؛ نیز تیرگی و اثر سیاه." data-context="حتماً می‌گیریم؛ تهدید به گرفتن پیشانی در صورت دست نکشیدن.">لَنَسفَعًا</button>
    <button class="word-link" type="button" data-word="بِالنّاصِيَةِ" data-root="ن ص ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-y/" data-root-meaning="موی پیشانی و بخش پیشین سر؛ گرفتن ناصیه: مهار و اختیار." data-context="پیشانی یا موی پیشانی؛ موضوع گرفتن در تهدید آیه.">بِالنّاصِيَةِ</button>
  </p>
  <p class="farsi-verse">نه چنین است! اگر بازنایستد، بی‌گمان پیشانی‌اش را سخت می‌گیریم،</p>
</section>
