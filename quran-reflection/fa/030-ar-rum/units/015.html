<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الروم ۳۰:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اند؛ یکی از دو وصف اهل بوستان.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="و انجام داده‌اند؛ دربارهٔ کردارهای شایستهٔ آنان.">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="کارهای شایسته؛ کردارهایی که همراه ایمان ذکر شده‌اند.">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="رَوضَةٍ" data-root="ر و ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-w-dad/" data-root-meaning="روضة: جای سرسبز و آب‌دار، باغ یا مرغزار." data-context="بوستانی؛ جایگاه شادی و برخورداری آنان.">رَوضَةٍ</button>
    <button class="word-link" type="button" data-word="يُحبَرونَ" data-root="ح ب ر" data-root-meaning="اثر و آراستگی؛ حَبْر/حِبْر: عالم دینی؛ حُبُور: شادی و برخورداری از نعمت." data-context="شادمان و برخوردار از نعمت می‌شوند؛ حالت اهل بوستان." data-learn-more="/quran-terminology/fa/roots/h-b-r/">يُحبَرونَ</button>
  </p>
  <p class="farsi-verse">اما کسانی که ایمان آوردند و کارهای شایسته کردند، در مرغزاری شادمان می‌شوند.</p>
</section>
