  <p class="farsi-verse">و در این قرآن از هر مثلی برای مردم زده‌ایم؛ و اگر نشانه‌ای برایشان بیاوری، کسانی که انکار کردند حتماً می‌گویند: شما جز باطل‌گرایان نیستید.</p>
