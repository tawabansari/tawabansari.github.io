<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الروم ۳۰:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="أَذَقنَا" data-root="ذ و ق" data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و دریافت مزه؛ در کاربرد گسترده، آزمودن و تجربه کردن؛ أَذَاقَ: چشاندن یا دیگری را در معرض تجربه قرار دادن." data-context="بچشانیم؛ برخوردار کردن مردم از رحمت.">أَذَقنَا</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ دریافت‌کنندگان رحمت.">النّاسَ</button>
    <button class="word-link" type="button" data-word="رَحمَةً" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمت؛ نعمتی که به مردم چشانده می‌شود.">رَحمَةً</button>
    <button class="word-link" type="button" data-word="فَرِحوا" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="شاد شدند؛ واکنش آنان به رحمت.">فَرِحوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُصِبهُم" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود" data-context="به آنان برسد؛ گرفتار شدن به پیشامد ناخوشایند.">تُصِبهُم</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی؛ پیشامد ناخوشایند در برابر رحمت.">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="قَدَّمَت" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن" data-context="پیش فرستاد؛ کردار پیشین که به پیامد مربوط است.">قَدَّمَت</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌هایشان؛ تعبیر از کردار خود آنان.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="يَقنَطونَ" data-root="ق ن ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-n-tt/" data-root-meaning="ناامیدی و از دست دادن امید به خیر." data-context="نومید می‌شوند؛ واکنش آنان به رسیدن بدی.">يَقنَطونَ</button>
  </p>
  <p class="farsi-verse">و چون رحمتی به مردم بچشانیم، به آن شادمان می‌شوند؛ و اگر به سبب آنچه دست‌هایشان پیش فرستاده بدی‌ای به آنان برسد، ناگهان نومید می‌شوند.</p>
</section>
