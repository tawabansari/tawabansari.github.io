  <p class="farsi-verse">و چون رحمتی به مردم بچشانیم، به آن شادمان می‌شوند؛ و اگر به سبب آنچه دست‌هایشان پیش فرستاده بدی‌ای به آنان برسد، ناگهان نومید می‌شوند.</p>
