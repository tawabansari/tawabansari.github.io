  <p class="farsi-verse">آن معبود یگانه همان است که بادها را می‌فرستد، پس ابری برمی‌انگیزند؛ آن را هرگونه بخواهد در آسمان می‌گستراند و پاره‌پاره‌اش می‌کند، پس باران را می‌بینی که از میانش بیرون می‌آید. چون آن را به هرکه از بندگانش بخواهد برساند، ناگهان شادمان می‌شوند؛</p>
