  <p class="farsi-verse">آیا در خود نیندیشیده‌اند؟ آن معبود یگانه آسمان‌ها و زمین و آنچه میان آن دو است را جز به‌حق و برای مدتی معین نیافریده؛ و بسیاری از مردم دیدار پروردگارشان را انکار می‌کنند.</p>
