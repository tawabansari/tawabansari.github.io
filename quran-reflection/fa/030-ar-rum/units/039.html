  <p class="farsi-verse">و آنچه از ربا می‌دهید تا در اموال مردم افزایش یابد، نزد آن معبود یگانه افزایش نمی‌یابد؛ و آنچه از زکات می‌دهید و روی آن معبود یگانه را می‌خواهید، آنان‌اند که چندبرابر می‌کنند.</p>
