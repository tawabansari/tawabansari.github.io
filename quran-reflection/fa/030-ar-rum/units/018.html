<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الروم ۳۰:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُ</button>
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">الحَمدُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَعَشِيًّا" data-root="ع ش و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَعَشِيًّا</button>
    <button class="word-link" type="button" data-word="وَحينَ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان.">وَحينَ</button>
    <button class="word-link" type="button" data-word="تُظهِرونَ" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی">تُظهِرونَ</button>
  </p>
  <p class="farsi-verse">و ستایش در آسمان‌ها و زمین از آنِ اوست؛ و در شامگاه و آن‌گاه که به نیمروز درمی‌آیید.</p>
</section>
