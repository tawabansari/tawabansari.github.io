<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الروم ۳۰:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روز">وَيَومَ</button>
    <button class="word-link" type="button" data-word="تَقومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برپا می‌شود">تَقومُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="ساعت رستاخیز">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="يُبلِسُ" data-root="ب ل س" data-learn-more="/quran-terminology/fa/roots/b-l-s/" data-root-meaning="نومیدی، بریدگی، بسته شدن راه پاسخ، و خاموش شدن از درماندگی" data-context="نومید و درمانده می‌شوند">يُبلِسُ</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمونَ</button>
  </p>
  <p class="farsi-verse">و روزی که ساعت برپا شود، مجرمان نومید و درمانده می‌شوند.</p>
</section>
