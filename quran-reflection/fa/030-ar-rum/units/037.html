  <p class="farsi-verse">آیا ندیده‌اند آن معبود یگانه روزی را برای هرکه بخواهد گسترش می‌دهد و تنگ می‌گیرد؟ بی‌گمان در این نشانه‌هایی برای مردمی است که ایمان می‌آورند.</p>
