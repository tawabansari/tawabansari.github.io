<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الروم ۳۰:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بِنَصرِ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/">بِنَصرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="يَنصُرُ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/">يَنصُرُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/">العَزيزُ</button>
    <button class="word-link" type="button" data-word="الرَّحيمُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/">الرَّحيمُ</button>
  </p>
  <p class="farsi-verse">به یاری آن معبود یگانه؛ هرکه را بخواهد یاری می‌کند و او شکست‌ناپذیرِ رحیم است.</p>
