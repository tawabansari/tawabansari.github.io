  <h2 class="ayah-title">الروم ۳۰:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="كَفَرَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَرَ</button>
    <button class="word-link" type="button" data-word="فَعَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَعَلَيهِ</button>
    <button class="word-link" type="button" data-word="كُفرُهُ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كُفرُهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="عَمِلَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">عَمِلَ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="فَلِأَنفُسِهِم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">فَلِأَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="يَمهَدونَ" data-root="م ه د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَمهَدونَ</button>
  </p>
  <p class="farsi-verse">هرکس انکار کند، انکارش بر عهدهٔ خود اوست؛ و کسانی که کار شایسته کنند، برای خود آماده می‌سازند؛</p>
