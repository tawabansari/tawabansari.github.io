  <p class="farsi-verse">و از نشانه‌های اوست که برای شما از خودتان همسرانی آفرید تا نزد آنان آرام گیرید، و میان شما دوستی و رحمت قرار داد؛ بی‌گمان در این نشانه‌هایی برای مردمی است که می‌اندیشند.</p>
