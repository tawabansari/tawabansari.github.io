<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الروم ۳۰:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="فَرَّقوا" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر" data-context="پراکنده کردند؛ ایجاد جدایی در دین خود.">فَرَّقوا</button>
    <button class="word-link" type="button" data-word="دينَهُم" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دینشان؛ موضوعی که آن را پراکنده کردند.">دينَهُم</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و شدند؛ در بیان وضعیت گروه‌گروه آنان.">وَكانوا</button>
    <button class="word-link" type="button" data-word="شِيَعًا" data-root="ش ي ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-ayn/" data-root-meaning="پراکنده و رایج شدن؛ شیعه: گروه پیرو و پشتیبان." data-context="دسته‌دسته؛ گروه‌هایی جدا در موضوع دین.">شِيَعًا</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ در اشاره به هر یک از گروه‌ها.">كُلُّ</button>
    <button class="word-link" type="button" data-word="حِزبٍ" data-root="ح ز ب" data-root-meaning="گرد آمدن و تشکیل مجموعه؛ گروهی از افراد با پیوند، موضع یا هدف مشترک." data-context="هر گروه؛ دسته‌های جداشده در دین." data-learn-more="/quran-terminology/fa/roots/h-z-b/">حِزبٍ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="لَدَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدَيهِم</button>
    <button class="word-link" type="button" data-word="فَرِحونَ" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="دل‌خوش و خرسندند؛ حال هر گروه نسبت به داشته‌های خود.">فَرِحونَ</button>
  </p>
  <p class="farsi-verse">از کسانی که دینشان را پاره‌پاره کردند و دسته‌دسته شدند؛ هر گروه به آنچه نزد خود دارد شادمان است.</p>
</section>
