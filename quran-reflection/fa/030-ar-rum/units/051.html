<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">الروم ۳۰:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="ريحًا" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">ريحًا</button>
    <button class="word-link" type="button" data-word="فَرَأَوهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">فَرَأَوهُ</button>
    <button class="word-link" type="button" data-word="مُصفَرًّا" data-root="ص ف ر" data-learn-more="/quran-terminology/fa/roots/sad-f-r/" data-root-meaning="زردی، زردفامی و درآمدن چیزی به حالت زرد">مُصفَرًّا</button>
    <button class="word-link" type="button" data-word="لَظَلّوا" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن.">لَظَلّوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدِهِ</button>
    <button class="word-link" type="button" data-word="يَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">يَكفُرونَ</button>
  </p>
  <p class="farsi-verse">و اگر بادی بفرستیم و آن را زرد ببینند، پس از آن به انکار ادامه می‌دهند.</p>
</section>
