  <p class="farsi-verse">آن معبود یگانه همان است که شما را از ناتوانی آفرید، سپس پس از ناتوانی نیرو قرار داد، سپس پس از نیرو ناتوانی و سپیدمویی قرار داد. هرچه بخواهد می‌آفریند، و او دانای تواناست.</p>
