  <p class="farsi-verse">و چون آسیبی به مردم برسد، پروردگارشان را بازگشت‌کنان به سوی او می‌خوانند؛ سپس چون رحمتی از خود به آنان بچشاند، ناگهان گروهی از آنان برای پروردگارشان شریک می‌گیرند؛</p>
