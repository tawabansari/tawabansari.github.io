  <p class="farsi-verse">پس چون افکندند، موسی گفت: آنچه آورده‌اید جادوست؛ آن معبود یگانه آن را باطل خواهد کرد؛ آن معبود یگانه کار فسادگران را اصلاح نمی‌کند.</p>
