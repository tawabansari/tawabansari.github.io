  <p class="farsi-verse">و مردم جز یک جماعت نبودند، سپس اختلاف کردند؛ و اگر سخنی از پروردگارت پیشی نگرفته بود، درباره آنچه در آن اختلاف می‌کنند میانشان داوری شده بود.</p>
