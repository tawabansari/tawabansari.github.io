<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُحِقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="و استوار می‌سازد">وَيُحِقُّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق را">الحَقَّ</button>
    <button class="word-link" type="button" data-word="بِكَلِمٰتِهِ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="با کلمات خود">بِكَلِمٰتِهِ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="كَرِهَ" data-root="ك ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-h2/" data-root-meaning="ناخوش داشتن و دشواری؛ اکراه: واداشتن برخلاف خواست." data-context="ناپسند داشتند">كَرِهَ</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمونَ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه حق را با کلمات خود استوار می‌کند، هرچند مجرمان ناخشنود باشند.</p>
</section>
