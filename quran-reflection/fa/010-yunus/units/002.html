  <p class="farsi-verse">آیا برای مردم شگفت بود که به مردی از خودشان وحی کردیم که مردم را هشدار بده و مؤمنان را مژده بده که نزد پروردگارشان جایگاهی راستین دارند؟ کافران گفتند: این جادوگری آشکار است.</p>
