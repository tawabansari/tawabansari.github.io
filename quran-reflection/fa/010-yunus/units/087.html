<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۸۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَوحَينا" data-root="و ح ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="وَأَخيهِ" data-root="أ خ و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَخيهِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَبَوَّءا" data-root="ب و أ" data-learn-more="/quran-terminology/fa/roots/b-w-a/" data-root-meaning="از بازگشت و جای گرفتن تا جای دادن و بر عهده گرفتن پیامد">تَبَوَّءا</button>
    <button class="word-link" type="button" data-word="لِقَومِكُما" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِقَومِكُما</button>
    <button class="word-link" type="button" data-word="بِمِصرَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِمِصرَ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/">بُيوتًا</button>
    <button class="word-link" type="button" data-word="وَاجعَلوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَاجعَلوا</button>
    <button class="word-link" type="button" data-word="بُيوتَكُم" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/">بُيوتَكُم</button>
    <button class="word-link" type="button" data-word="قِبلَةً" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قِبلَةً</button>
    <button class="word-link" type="button" data-word="وَأَقيمُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَأَقيمُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">و به موسی و برادرش وحی کردیم که برای قوم خود در مصر خانه‌هایی برگزینید و خانه‌هایتان را قبله قرار دهید و صلات را برپا دارید؛ و مؤمنان را مژده بده.</p>
</section>
