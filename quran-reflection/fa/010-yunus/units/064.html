<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="البُشرىٰ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">البُشرىٰ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَفِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفِى</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَبديلَ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">تَبديلَ</button>
    <button class="word-link" type="button" data-word="لِكَلِمٰتِ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد">لِكَلِمٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الفَوزُ" data-root="ف و ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الفَوزُ</button>
    <button class="word-link" type="button" data-word="العَظيمُ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">العَظيمُ</button>
  </p>
  <p class="farsi-verse">برای آنان در زندگی دنیا و در آخرت مژده است؛ کلمات آن معبود یگانه تغییر نمی‌پذیرد؛ این همان کامیابی بزرگ است.</p>
</section>
