  </p>
  <p class="farsi-verse">و اگر تو را دروغ شمردند، بگو: عمل من برای من و عمل شما برای شماست؛ شما از آنچه من می‌کنم بری هستید و من از آنچه شما می‌کنید بری هستم.</p>
