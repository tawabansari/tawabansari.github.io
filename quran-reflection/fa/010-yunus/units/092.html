<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۹۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="پس امروز؛ زمانِ بیرون آوردن پیکر فرعون در ادامهٔ روایت غرق شدن.">فَاليَومَ</button>
    <button class="word-link" type="button" data-word="نُنَجّيكَ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن" data-context="تو را با پیکرت بیرون می‌رهانیم؛ در این سیاق، آشکار شدن بدن پس از غرق شدن.">نُنَجّيكَ</button>
    <button class="word-link" type="button" data-word="بِبَدَنِكَ" data-root="ب د ن" data-root-meaning="پیکر و ساختمان جسمانی؛ درشتی اندام و فربهی؛ و بُدْن، حیوانات بزرگِ قربانی، به‌ویژه شتران." data-learn-more="/quran-terminology/fa/roots/b-d-n/" data-context="با پیکرت؛ بدن فرعون که پس از غرق شدن نشانهٔ سرنوشت او می‌شود، نه نجات جان او از مرگ.">بِبَدَنِكَ</button>
    <button class="word-link" type="button" data-word="لِتَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="تا باشی و قرار بگیری؛ بیان هدفِ نشانه شدن برای دیگران.">لِتَكونَ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="خَلفَكَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="پس از تو یا پشت سر تو؛ کسانی که سرنوشت فرعون برای آنان نشانه می‌شود.">خَلفَكَ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه و مایهٔ عبرت برای کسانی که پس از فرعون‌اند.">ءايَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بسیاری؛ وصف شمار قابل توجهی از مردم در ادامهٔ آیه.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ کسانی که در ادامه، بسیاری از آنان غافل توصیف می‌شوند.">النّاسِ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌های ما؛ اموری که مردم باید به دلالت و پیام آنها توجه کنند.">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="لَغٰفِلونَ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری" data-context="بی‌گمان غافل‌اند؛ به نشانه‌ها و پیام آنها توجه نمی‌کنند.">لَغٰفِلونَ</button>
  </p>
  <p class="farsi-verse">پس امروز تو را با بدنت نجات می‌دهیم تا برای کسانی که پس از تو هستند نشانه‌ای باشی؛ و بسیاری از مردم از آیات ما غافل‌اند.</p>
</section>
