    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يُحيطوا" data-root="ح و ط" data-learn-more="/quran-terminology/fa/roots/h-w-tt/" data-root-meaning="احاطه کردن، دربرگرفتن، پیرامون چیزی را گرفتن، از همه سو فراگرفتن؛ و در برخی کاربردها، نگاهبانی، مراقبت، یا محاصره">يُحيطوا</button>
    <button class="word-link" type="button" data-word="بِعِلمِهِ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">بِعِلمِهِ</button>

    <button class="word-link" type="button" data-word="يَأتِهِم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">يَأتِهِم</button>

  </p>
  <p class="farsi-verse">بلکه چیزی را دروغ شمردند که بر دانش آن احاطه نیافتند و هنوز تأویلش به آنان نرسیده است؛ پیشینیانشان نیز این‌گونه دروغ شمردند؛ پس بنگر سرانجام ستمکاران چگونه بود.</p>
</section>
