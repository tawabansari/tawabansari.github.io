<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">يَدعوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="دارِ" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/">دارِ</button>
    <button class="word-link" type="button" data-word="السَّلٰمِ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/">السَّلٰمِ</button>
    <button class="word-link" type="button" data-word="وَيَهدى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">وَيَهدى</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="ص ر ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">مُستَقيمٍ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه به سرای سلام فرامی‌خواند و هرکه را بخواهد به راهی راست هدایت می‌کند.</p>
