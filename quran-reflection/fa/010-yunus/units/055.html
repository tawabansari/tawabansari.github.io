  <p class="farsi-verse">آگاه باشید که آنچه در آسمان‌ها و زمین است از آنِ آن معبود یگانه است؛ آگاه باشید که وعده آن معبود یگانه حق است، ولی بیشترشان نمی‌دانند.</p>
