  <p class="farsi-verse">بگو: آیا از شریکانتان کسی هست که به حق هدایت کند؟ بگو: آن معبود یگانه به حق هدایت می‌کند؛ آیا کسی که به حق هدایت می‌کند سزاوارتر است که پیروی شود یا کسی که خود هدایت نمی‌یابد مگر آنکه هدایتش کنند؟ شما را چه شده است؟ چگونه داوری می‌کنید؟</p>
