  <p class="farsi-verse">پس چرا آبادی‌ای نبود که ایمان بیاورد و ایمانش به آن سود برساند، جز قوم یونس؟ هنگامی که ایمان آوردند، عذاب خواری را در زندگی دنیا از آنان برداشتیم و تا زمانی برخوردارشان کردیم.</p>
