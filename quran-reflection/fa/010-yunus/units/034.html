<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان به مخاطب برای طرح پرسش.">قُل</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="شُرَكائِكُم" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریکان شما؛ آنچه مخاطبان شریک می‌پندارند.">شُرَكائِكُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَبدَؤُا۟" data-root="ب د أ" data-context="آغاز می‌کند؛ درباره آغاز آفرینش." data-root-meaning="آغاز کردن، نخستین بار انجام دادن و شروع یک کار یا جریان؛ در سیاق آفرینش، نخستین بار پدید آوردن." data-learn-more="/quran-terminology/fa/roots/b-d-a/">يَبدَؤُا۟</button>
    <button class="word-link" type="button" data-word="الخَلقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش؛ آنچه آغاز و سپس بازگردانده می‌شود.">الخَلقَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُعيدُهُ" data-root="ع و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-d/" data-root-meaning="بازگشت و تکرار؛ عید: هنگام بازآینده؛ «عاد» نام قوم نیز هست." data-context="آن را بازمی‌گرداند؛ ضمیر به آفرینش بازمی‌گردد.">يُعيدُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُلِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان برای بیان پاسخ.">قُلِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَبدَؤُا۟" data-root="ب د أ" data-context="آغاز می‌کند؛ درباره آغاز آفرینش." data-root-meaning="آغاز کردن، نخستین بار انجام دادن و شروع یک کار یا جریان؛ در سیاق آفرینش، نخستین بار پدید آوردن." data-learn-more="/quran-terminology/fa/roots/b-d-a/">يَبدَؤُا۟</button>
    <button class="word-link" type="button" data-word="الخَلقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش؛ آنچه آغاز و سپس بازگردانده می‌شود.">الخَلقَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُعيدُهُ" data-root="ع و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-d/" data-root-meaning="بازگشت و تکرار؛ عید: هنگام بازآینده؛ «عاد» نام قوم نیز هست." data-context="آن را بازمی‌گرداند؛ ضمیر به آفرینش بازمی‌گردد.">يُعيدُهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَنّىٰ</button>
    <button class="word-link" type="button" data-word="تُؤفَكونَ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="پس چگونه برگردانده می‌شوید؛ پس از پرسش از آغاز و بازگرداندن آفرینش؟">تُؤفَكونَ</button>
  </p>
  <p class="farsi-verse">بگو: آیا از شریکانتان کسی هست که آفرینش را آغاز کند، سپس آن را بازگرداند؟ بگو: آن معبود یگانه آفرینش را آغاز می‌کند، سپس آن را بازمی‌گرداند؛ پس چگونه منحرف می‌شوید؟</p>
</section>
