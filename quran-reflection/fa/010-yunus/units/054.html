  <p class="farsi-verse">و اگر هر نفسی که ستم کرده است مالک همه آنچه در زمین است بود، آن را فدیه می‌داد؛ و چون عذاب را ببینند، پشیمانی را پنهان می‌کنند؛ و میانشان به داد داوری می‌شود و بر آنان ستم نمی‌رود.</p>
