  <p class="farsi-verse">پس اگر روی گرداندید، من از شما پاداشی نخواسته‌ام؛ پاداش من تنها بر آن معبود یگانه است؛ و فرمان یافته‌ام که از تسلیم‌شوندگان باشم.</p>
