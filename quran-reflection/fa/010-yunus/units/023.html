  <p class="farsi-verse">پس چون نجاتشان داد، ناگهان در زمین به ناحق سرکشی می‌کنند؛ ای مردم، سرکشی شما تنها بر خودتان است؛ بهره زندگی دنیاست؛ سپس بازگشتتان به سوی ماست و شما را از آنچه می‌کردید خبر می‌دهیم.</p>
