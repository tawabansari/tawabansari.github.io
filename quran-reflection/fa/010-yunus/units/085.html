  <p class="arabic-text">

    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>

    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبَّنا</button>

    <button class="word-link" type="button" data-word="تَجعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">تَجعَلنا</button>

  </p>
  <p class="farsi-verse">پس گفتند: بر آن معبود یگانه توکل کرده‌ایم؛ پروردگارا، ما را فتنه‌ای برای مردم ستمکار قرار مده.</p>
