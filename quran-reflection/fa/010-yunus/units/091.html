<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۹۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ءالـٰٔنَ" data-context="اکنون؟ در برابر نافرمانی گذشتهٔ فرعون و هنگام اظهار ایمان او در غرق." data-root-note="اسم زمان و ظرفِ مبنی؛ اشتقاق تاریخیِ «الآن» محل اختلاف است." data-learn-more="/quran-terminology/fa/roots/a-w-n/">ءالـٰٔنَ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="عَصَيتَ" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت." data-context="نافرمانی کردی؛ رفتارِ پیشینِ فرعون.">عَصَيتَ</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="پیش از چیزی؛ تقدم زمانی، ترتیبی یا نسبی." data-context="پیش از این؛ زمانِ نافرمانی در برابر اکنون.">قَبلُ</button>
    <button class="word-link" type="button" data-word="وَكُنتَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بودی؛ در بیانِ جایگاهِ پیشین او میان فسادگران.">وَكُنتَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع" data-context="فسادگران؛ کسانی که تباهی پدید می‌آورند.">المُفسِدينَ</button>
  </p>
  <p class="farsi-verse">اکنون؟ در حالی که پیش‌تر نافرمانی کردی و از فسادگران بودی!</p>
</section>
