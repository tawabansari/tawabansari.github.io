  <p class="farsi-verse">سپس پس از او رسولانی به سوی قومشان برانگیختیم و با دلیل‌های روشن نزد آنان آمدند؛ ولی به آنچه پیش‌تر دروغ شمرده بودند ایمان‌آور نبودند؛ این‌گونه بر دل‌های تجاوزگران مهر می‌زنیم.</p>
