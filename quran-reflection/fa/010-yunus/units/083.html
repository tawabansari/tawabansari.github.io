  <p class="farsi-verse">پس جز نسلی از قومش به موسی ایمان نیاوردند، با ترس از فرعون و سرانشان که آنان را به رنج افکنند؛ و فرعون در زمین برتری‌جو بود و از اسراف‌کاران بود.</p>
