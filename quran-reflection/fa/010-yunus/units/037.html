<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بوده یا هست؛ نقش دقیق با ساخت جمله روشن می‌شود.">كانَ</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="القُرءانُ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآنِ مورد اشاره." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُفتَرىٰ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="ساخته و به دروغ نسبت داده شود.">يُفتَرىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="غیر از؛ در ساختِ «من دون».">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="تَصديقَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="تصدیق و تأییدِ راستیِ.">تَصديقَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="پیشِ؛ در تعبیرِ «بین یدیه».">بَينَ</button>
    <button class="word-link" type="button" data-word="يَدَيهِ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دو دستِ آن؛ در تعبیرِ «آنچه پیش روی آن است».">يَدَيهِ</button>
    <button class="word-link" type="button" data-word="وَتَفصيلَ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="و بیانِ روشن و تفصیلی؛ مشخص ساختن اجزا و حدودِ موضوعِ یادشده." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">وَتَفصيلَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابِ مورد اشاره.">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="رَيبَ" data-root="ر ي ب" data-learn-more="/quran-terminology/fa/roots/r-y-b/" data-root-meaning="تردید آشفته، بی‌اعتمادی، بدگمانی، شک بی‌ثبات‌کننده، اضطراب در برابر حق، و حالتی که انسان را از اطمینان و تسلیم در برابر برهان بازمی‌دارد" data-context="تردید؛ در عبارتِ نفیِ تردید.">رَيبَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارِ.">رَبِّ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="جهانیان یا عالَم‌ها.">العٰلَمينَ</button>
  </p>
  <p class="farsi-verse">و این قرآن چنان نیست که از سوی غیر آن معبود یگانه برساخته شده باشد؛ بلکه تصدیق آن چیزی است که پیش روی آن است و تفصیل کتاب؛ هیچ شکی در آن نیست؛ از پروردگار جهانیان است.</p>
</section>
