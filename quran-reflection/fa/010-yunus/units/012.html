  <p class="farsi-verse">و چون رنجی به انسان برسد، به پهلو یا نشسته یا ایستاده ما را می‌خواند؛ پس چون رنجش را از او برداریم، چنان می‌گذرد که گویی ما را برای رنجی که به او رسیده بود نخوانده است؛ این‌گونه آنچه اسراف‌کاران انجام می‌دادند برایشان آراسته شده است.</p>
