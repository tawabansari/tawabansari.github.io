<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="مَسَّ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="برسد؛ تماس و رسیدن رنج به انسان.">مَسَّ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ شخصی که رفتار او هنگام رنج و پس از رفع آن بیان می‌شود.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="الضُّرُّ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="رنج؛ آسیبی که انسان را به دعا وامی‌دارد.">الضُّرُّ</button>
    <button class="word-link" type="button" data-word="دَعانا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="ما را می‌خواند؛ درخواست کمک در هنگام رنج.">دَعانا</button>
    <button class="word-link" type="button" data-word="لِجَنبِهِ" data-root="ج ن ب" data-root-meaning="پهلو، کنار و جانب؛ فاصله گرفتن، دور ساختن و پرهیز کردن. «جُنُب» در سیاق طهارت، وضعیتِ نیازمند پاک شدن است." data-context="بر پهلوی خود؛ حالت درازکشِ انسانی که در رنج دعا می‌کند." data-learn-more="/quran-terminology/fa/roots/j-n-b/">لِجَنبِهِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="قاعِدًا" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار" data-context="نشسته؛ یکی از حالت‌های بدنیِ دعا کردن.">قاعِدًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="قائِمًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ایستاده؛ حالت دیگرِ دعا کردن.">قائِمًا</button>
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="كَشَفنا" data-root="ك ش ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-sh-f/" data-root-meaning="برداشتن پوشش و آشکار کردن؛ نیز رفع رنج." data-context="برطرف کردیم؛ برداشتن رنج از انسان.">كَشَفنا</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="ضُرَّهُ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="رنج او؛ آسیبی که برطرف می‌شود.">ضُرَّهُ</button>
    <button class="word-link" type="button" data-word="مَرَّ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="می‌گذرد؛ ادامه دادن راه پس از رفع رنج، گویی دعایی نکرده است.">مَرَّ</button>
    <button class="word-link" type="button" data-word="كَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَدعُنا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="ما را خوانده باشد؛ دعای پیشین که در رفتار بعدی نادیده گرفته می‌شود.">يَدعُنا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ضُرٍّ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="رنج؛ همان آسیبی که موضوع درخواست کمک بود.">ضُرٍّ</button>
    <button class="word-link" type="button" data-word="مَسَّهُ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به او رسیده بود؛ توصیف رنجِ پیشین.">مَسَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="زُيِّنَ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="آراسته شد؛ جلوه پسندیده یافتن کردارهای اسراف‌کاران نزد آنان.">زُيِّنَ</button>
    <button class="word-link" type="button" data-word="لِلمُسرِفينَ" data-root="س ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-f/" data-root-meaning="از اندازه یا حد گذشتن؛ اسراف." data-context="برای اسراف‌کاران؛ کسانی که از حد می‌گذرند.">لِلمُسرِفينَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در ساختِ بیان رفتار پیشین و استمرار آن.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دادند؛ کردارهایی که برای آنان آراسته شده بود.">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و چون رنجی به انسان برسد، به پهلو یا نشسته یا ایستاده ما را می‌خواند؛ پس چون رنجش را از او برداریم، چنان می‌گذرد که گویی ما را برای رنجی که به او رسیده بود نخوانده است؛ این‌گونه آنچه اسراف‌کاران انجام می‌دادند برایشان آراسته شده است.</p>
</section>
