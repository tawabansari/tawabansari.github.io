<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَثُمَّ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="وَقَعَ" data-root="و ق ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-ayn/" data-root-meaning="افتادن، رخ دادن و تحقق یافتن." data-context="واقع شود؛ رخدادِ پیش‌تر به شتاب خواسته‌شده تحقق یابد.">وَقَعَ</button>
    <button class="word-link" type="button" data-word="ءامَنتُم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="به آن ایمان می‌آورید؟ واکنشِ پرسش‌شده پس از وقوعِ آن.">ءامَنتُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ءالـٰٔنَ" data-context="اکنون؟ با همزهٔ پرسشی؛ نکوهشِ واکنش پس از وقوعِ آنچه به شتاب می‌خواستند." data-root-note="اسم زمان و ظرفِ مبنی؛ اشتقاق تاریخیِ «الآن» محل اختلاف است." data-learn-more="/quran-terminology/fa/roots/a-w-n/">ءالـٰٔنَ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ بیانِ رفتارِ پیشین در برابر اکنون.">كُنتُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="تَستَعجِلونَ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله" data-context="شتابش را می‌خواستید؛ خواهانِ زودتر رسیدن آن بودید.">تَستَعجِلونَ</button>
  </p>
  <p class="farsi-verse">آیا سپس، هنگامی که واقع شد، به آن ایمان می‌آورید؟ اکنون؟ در حالی که آن را به شتاب می‌خواستید!</p>
</section>
