<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="أَتَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">أَتَقولونَ</button>
    <button class="word-link" type="button" data-word="لِلحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">لِلحَقِّ</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمّا</button>
    <button class="word-link" type="button" data-word="جاءَكُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="أَسِحرٌ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر">أَسِحرٌ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="السّٰحِرونَ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر">السّٰحِرونَ</button>
  </p>
  <p class="farsi-verse">موسی گفت: آیا درباره حق، هنگامی که به شما رسید، چنین می‌گویید؟ آیا این جادوست؟ و جادوگران رستگار نمی‌شوند.</p>
</section>
