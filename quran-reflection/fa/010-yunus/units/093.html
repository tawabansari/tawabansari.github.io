  <p class="farsi-verse">و بنی‌اسرائیل را در جایگاهی راستین جای دادیم و از پاکیزه‌ها روزی‌شان کردیم؛ پس اختلاف نکردند تا دانش به آنان رسید؛ پروردگارت در روز قیامت درباره آنچه در آن اختلاف می‌کردند میانشان داوری می‌کند.</p>
