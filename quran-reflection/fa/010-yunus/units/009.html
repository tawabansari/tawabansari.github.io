<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="يَهديهِم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهديهِم</button>
    <button class="word-link" type="button" data-word="رَبُّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّهُم</button>
    <button class="word-link" type="button" data-word="بِإيمٰنِهِم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">بِإيمٰنِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهِمُ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی">تَحتِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند">الأَنهٰرُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَنّٰتِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنّٰتِ</button>
    <button class="word-link" type="button" data-word="النَّعيمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">النَّعيمِ</button>
  </p>
  <p class="farsi-verse">کسانی که ایمان آورده و کارهای شایسته کرده‌اند، پروردگارشان به سبب ایمانشان هدایتشان می‌کند؛ نهرها از زیر آنان در باغ‌های نعمت جاری است.</p>
</section>
