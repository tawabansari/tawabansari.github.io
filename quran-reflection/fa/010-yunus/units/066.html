  </p>
  <p class="farsi-verse">آگاه باشید که هرکه در آسمان‌ها و هرکه در زمین است از آنِ آن معبود یگانه است؛ و کسانی که جز آن معبود یگانه شریکانی را می‌خوانند از چه پیروی می‌کنند؟ جز از گمان پیروی نمی‌کنند و جز حدس نمی‌زنند.</p>
