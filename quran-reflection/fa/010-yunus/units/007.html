<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="ر ج و" data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ رَجَا در شاخهٔ مکانی، کناره و جانب است. صورت‌های بدون همزهٔ تأخیر با إرجاء و ریشهٔ ر ج أ پیوند دارند و از امید جدا بررسی می‌شوند." data-context="انتظار دیدار ما را ندارند؛ وصف نگرش به زندگی و آخرت.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="لِقاءَنا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="دیدار ما؛ آنچه انتظارش را ندارند.">لِقاءَنا</button>
    <button class="word-link" type="button" data-word="وَرَضوا" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل" data-context="و به زندگی دنیا خشنود شدند.">وَرَضوا</button>
    <button class="word-link" type="button" data-word="بِالحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="به زندگی؛ در ترکیب زندگی دنیا.">بِالحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="دنیا و نزدیک‌تر؛ وصف زندگیِ مورد رضایت آنان.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَاطمَأَنّوا" data-root="ط م أ ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-m-a-n/" data-root-meaning="آرام گرفتن و اطمینان یافتن پس از اضطراب؛ با تحلیل کوتاه‌تر «طمن» نیز ثبت می‌شود." data-context="و به آن آرام و دل‌بسته شدند.">وَاطمَأَنّوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌های ما؛ آنچه از آن غافل‌اند.">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="غٰفِلونَ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری" data-context="غافلان؛ بی‌توجه به نشانه‌های الهی.">غٰفِلونَ</button>
  </p>
  <p class="farsi-verse">کسانی که امید دیدار ما را ندارند و به زندگی دنیا راضی شده و به آن آرام گرفته‌اند و کسانی که از آیات ما غافل‌اند،</p>
</section>
