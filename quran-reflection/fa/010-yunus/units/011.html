  <h2 class="ayah-title">یونس ۱۰:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="يُعَجِّلُ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">يُعَجِّلُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="الشَّرَّ" data-root="ش ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الشَّرَّ</button>
    <button class="word-link" type="button" data-word="استِعجالَهُم" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">استِعجالَهُم</button>
    <button class="word-link" type="button" data-word="بِالخَيرِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">بِالخَيرِ</button>
    <button class="word-link" type="button" data-word="لَقُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت">لَقُضِىَ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="أَجَلُهُم" data-root="أ ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَجَلُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَنَذَرُ" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَنَذَرُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="ر ج و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="لِقاءَنا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">لِقاءَنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="طُغيٰنِهِم" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق">طُغيٰنِهِم</button>
    <button class="word-link" type="button" data-word="يَعمَهونَ" data-root="ع م ه" data-learn-more="/quran-terminology/fa/roots/ayn-m-h2/" data-root-meaning="سرگردان شدن، حیران ماندن، حرکت بی‌جهت، و نابینایی درونی نسبت به راه درست">يَعمَهونَ</button>
  </p>
  <p class="farsi-verse">و اگر آن معبود یگانه بدی را برای مردم همان‌گونه شتاب می‌داد که آنان خوبی را به شتاب می‌خواهند، مهلتشان پایان یافته بود؛ پس کسانی را که امید دیدار ما ندارند در سرکشی‌شان سرگردان رها می‌کنیم.</p>
</section>
