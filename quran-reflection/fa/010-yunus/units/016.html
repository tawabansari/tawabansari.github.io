  <p class="farsi-verse">بگو: اگر آن معبود یگانه می‌خواست، آن را بر شما نمی‌خواندم و شما را از آن آگاه نمی‌کرد؛ من پیش از آن عمری در میان شما زیسته‌ام؛ آیا خرد نمی‌ورزید؟</p>
