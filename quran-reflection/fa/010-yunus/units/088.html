  <p class="farsi-verse">و موسی گفت: پروردگارا، تو به فرعون و سرانش در زندگی دنیا زیور و اموالی داده‌ای؛ پروردگارا، تا از راه تو گمراه کنند؛ پروردگارا، اموالشان را محو کن و دل‌هایشان را سخت ببند تا ایمان نیاورند، تا هنگامی که عذاب دردناک را ببینند.</p>
