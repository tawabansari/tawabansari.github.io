  <p class="farsi-verse">بگو: ای مردم، اگر درباره دین من در شکی هستید، من کسانی را که شما جز آن معبود یگانه می‌پرستید نمی‌پرستم؛ بلکه آن معبود یگانه را می‌پرستم که شما را برمی‌گیرد؛ و فرمان یافته‌ام که از مؤمنان باشم.</p>
