  <p class="farsi-verse">و بنی‌اسرائیل را از دریا گذراندیم؛ پس فرعون و سپاهیانش از سر سرکشی و تجاوز در پی آنان رفتند؛ تا چون غرق‌شدن به او رسید، گفت: ایمان آوردم که هیچ معبودی نیست جز آن‌که بنی‌اسرائیل به او ایمان آورده‌اند و من از تسلیم‌شوندگانم.</p>
