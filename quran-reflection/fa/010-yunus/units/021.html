  <p class="farsi-verse">و چون پس از رنجی که به مردم رسیده رحمتی به آنان بچشانیم، ناگهان درباره آیات ما نیرنگ می‌کنند؛ بگو: آن معبود یگانه در تدبیر سریع‌تر است؛ رسولان ما آنچه را نیرنگ می‌کنید می‌نویسند.</p>
