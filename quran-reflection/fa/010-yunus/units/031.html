  <p class="farsi-verse">بگو: چه کسی شما را از آسمان و زمین روزی می‌دهد؟ یا چه کسی مالک شنوایی و دیدگان است؟ و چه کسی زنده را از مرده و مرده را از زنده بیرون می‌آورد؟ و چه کسی کار را تدبیر می‌کند؟ خواهند گفت: آن معبود یگانه؛ پس بگو: آیا پروا نمی‌کنید؟</p>
