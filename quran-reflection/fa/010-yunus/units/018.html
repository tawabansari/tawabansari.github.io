  <p class="farsi-verse">و جز آن معبود یگانه چیزهایی را می‌پرستند که نه زیانی به آنان می‌رساند و نه سودی، و می‌گویند: اینان شفاعت‌کنندگان ما نزد آن معبود یگانه‌اند؛ بگو: آیا آن معبود یگانه را از چیزی خبر می‌دهید که نه در آسمان‌ها می‌داند و نه در زمین؟ او از آنچه شریک می‌گیرند پاک و برتر است.</p>
