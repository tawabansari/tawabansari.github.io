  <p class="farsi-verse">بگو: ای مردم، حق از پروردگارتان به شما رسیده است؛ پس هرکه هدایت یابد، تنها به سود خود هدایت می‌یابد و هرکه گمراه شود، تنها به زیان خود گمراه می‌شود؛ و من بر شما نگهبان نیستم.</p>
