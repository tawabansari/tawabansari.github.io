<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">یونس ۱۰:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَستَمِعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">يَستَمِعونَ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَأَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَأَنتَ</button>
    <button class="word-link" type="button" data-word="تُسمِعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">تُسمِعُ</button>
    <button class="word-link" type="button" data-word="الصُّمَّ" data-root="ص م م" data-learn-more="/quran-terminology/fa/roots/sad-m-m/" data-root-meaning="کری، بسته بودن راه شنیدن، سختی، انسداد، و نفوذناپذیری نسبت به صدا یا پیام">الصُّمَّ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">و از آنان کسانی‌اند که به تو گوش می‌دهند؛ آیا تو کران را می‌شنوانی، هرچند خرد نورزند؟</p>
</section>
