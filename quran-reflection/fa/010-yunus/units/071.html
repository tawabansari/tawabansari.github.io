    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>

    <button class="word-link" type="button" data-word="تَوَكَّلتُ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">تَوَكَّلتُ</button>
    <button class="word-link" type="button" data-word="فَأَجمِعوا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">فَأَجمِعوا</button>
    <button class="word-link" type="button" data-word="أَمرَكُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرَكُم</button>

    <button class="word-link" type="button" data-word="غُمَّةً" data-root="غ م م" data-learn-more="/quran-terminology/fa/roots/gh-m-m/" data-root-meaning="پوشاندن و فراگرفتن؛ ابر پوشاننده، امر مبهم، و اندوه یا فشاری که انسان را دربرمی‌گیرد.">غُمَّةً</button>

    <button class="word-link" type="button" data-word="إِلَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَىَّ</button>

    <button class="word-link" type="button" data-word="تُنظِرونِ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">تُنظِرونِ</button>
  </p>
  <p class="farsi-verse">و خبر نوح را بر آنان بخوان، هنگامی که به قومش گفت: ای قوم من، اگر ماندنم و یادآوری‌ام به آیات آن معبود یگانه بر شما گران آمده است، من بر آن معبود یگانه توکل کرده‌ام؛ پس کار خود و شریکانتان را یک‌جا کنید، سپس کارتان بر شما پوشیده نماند؛ آن‌گاه درباره من اقدام کنید و مهلتم ندهید.</p>
</section>
