  <p class="farsi-verse">و در هیچ کاری نیستی و هیچ بخشی از قرآن را از آن نمی‌خوانی و هیچ عملی نمی‌کنید، مگر اینکه هنگامی که در آن وارد می‌شوید بر شما گواهیم؛ و هم‌وزن ذره‌ای در زمین و آسمان از پروردگارت پنهان نیست و نه کوچک‌تر از آن و نه بزرگ‌تر، مگر اینکه در کتابی روشن است.</p>
