  <p class="farsi-verse">بر آنان درباره پدرانشان و پسرانشان و برادرانشان و پسران برادرانشان و پسران خواهرانشان و زنانشان و آنچه دست‌های راستشان مالک شده گناهی نیست؛ و از آن معبود یگانه پروا کنید. همانا آن معبود یگانه بر هر چیزی گواه است.</p>
