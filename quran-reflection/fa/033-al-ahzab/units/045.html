<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَرسَلنٰكَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">أَرسَلنٰكَ</button>
    <button class="word-link" type="button" data-word="شٰهِدًا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">شٰهِدًا</button>
    <button class="word-link" type="button" data-word="وَمُبَشِّرًا" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">وَمُبَشِّرًا</button>
    <button class="word-link" type="button" data-word="وَنَذيرًا" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">وَنَذيرًا</button>
  </p>
  <p class="farsi-verse">ای پیامبر، ما تو را گواه و مژده‌دهنده و هشداردهنده فرستادیم؛</p>
