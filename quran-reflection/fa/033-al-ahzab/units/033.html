<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَرنَ" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری." data-context="و در خانه‌هایتان قرار گیرید؛ فرمان خطاب به زنان پیامبر در این سیاق.">وَقَرنَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="بُيوتِكُنَّ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه‌هایتان؛ محل اقامتِ زنان مخاطب." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بُيوتِكُنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبَرَّجنَ" data-root="ب ر ج" data-root-meaning="برجستگی و آشکار بودن؛ بُرج، بنای بلند و محافظت‌شده یا جایگاه آسمانی؛ و تبرّج، جلوه‌گری و نمایان ساختن زینت و زیبایی." data-learn-more="/quran-terminology/fa/roots/b-r-j/" data-context="جلوه‌گری نکنید؛ آشکار ساختن زینت به شیوه‌ای که مصدر بعدی آن را مشخص می‌کند.">تَبَرَّجنَ</button>
    <button class="word-link" type="button" data-word="تَبَرُّجَ" data-root="ب ر ج" data-root-meaning="برجستگی و آشکار بودن؛ بُرج، بنای بلند و محافظت‌شده یا جایگاه آسمانی؛ و تبرّج، جلوه‌گری و نمایان ساختن زینت و زیبایی." data-learn-more="/quran-terminology/fa/roots/b-r-j/" data-context="جلوه‌گریِ جاهلیت نخستین؛ مصدرِ بیان‌کنندهٔ نوع رفتار مورد نهی.">تَبَرُّجَ</button>
    <button class="word-link" type="button" data-word="الجٰهِلِيَّةِ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه." data-context="جاهلیت؛ دوره یا شیوهٔ پیشینی که جلوه‌گری به آن نسبت داده شده است.">الجٰهِلِيَّةِ</button>
    <button class="word-link" type="button" data-word="الأولىٰ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="نخستین و پیشین؛ وصف جاهلیت، بدون تعیین تاریخ دقیق از خود این کلمه.">الأولىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَقِمنَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="و برپا دارید؛ فرمان به اقامهٔ صلات.">وَأَقِمنَ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلات؛ آنچه در این عبارت به برپا داشتن آن فرمان داده شده است.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَءاتينَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="و بدهید؛ فرمان به پرداخت زکات.">وَءاتينَ</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةَ" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری" data-context="زکات؛ آنچه در این عبارت به دادن آن فرمان داده شده است.">الزَّكوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَطِعنَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="و اطاعت کنید؛ فرمان به فرمان‌پذیری از آن معبود یگانه و فرستاده‌اش.">وَأَطِعنَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و فرستاده‌اش؛ کسی که مأموریت رساندن پیام را دارد و در اینجا به اطاعت از او فرمان داده می‌شود.">وَرَسولَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="می‌خواهد؛ ارادهٔ دور ساختن پلیدی و پاک گرداندن در ادامهٔ عبارت.">يُريدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لِيُذهِبَ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="تا دور سازد و از شما ببرد؛ دربارهٔ پلیدی.">لِيُذهِبَ</button>
    <button class="word-link" type="button" data-word="عَنكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنكُمُ</button>
    <button class="word-link" type="button" data-word="الرِّجسَ" data-root="ر ج س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-s/" data-root-meaning="پلیدی و آلودگی مادی یا معنوی، بر حسب سیاق." data-context="پلیدی و آلودگی؛ چیزی که دور ساختن آن از مخاطبان بیان می‌شود.">الرِّجسَ</button>
    <button class="word-link" type="button" data-word="أَهلَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="اهل؛ وابستگان و اعضای خانه در ترکیب «اهل البیت».">أَهلَ</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه و خاندان؛ در ترکیب «اهل البیت»." data-learn-more="/quran-terminology/fa/roots/b-y-t/">البَيتِ</button>
    <button class="word-link" type="button" data-word="وَيُطَهِّرَكُم" data-root="ط ه ر" data-learn-more="/quran-terminology/fa/roots/tt-h2-r/" data-root-meaning="پاکی، زدودن آلودگی، پالایش، و بیرون آمدن از حالت ناپاکی" data-context="و شما را پاک گرداند؛ زدودن آلودگی از مخاطبان.">وَيُطَهِّرَكُم</button>
    <button class="word-link" type="button" data-word="تَطهيرًا" data-root="ط ه ر" data-learn-more="/quran-terminology/fa/roots/tt-h2-r/" data-root-meaning="پاکی، زدودن آلودگی، پالایش، و بیرون آمدن از حالت ناپاکی" data-context="پاک‌گرداندنی کامل؛ مصدرِ تأکیدکنندهٔ فعل پاک گرداندن.">تَطهيرًا</button>
  </p>
  <p class="farsi-verse">و در خانه‌هایتان قرار گیرید و مانند خودنمایی جاهلیت نخستین خودنمایی نکنید؛ و صلات را برپا دارید و زکات بدهید و از آن معبود یگانه و فرستاده‌اش اطاعت کنید. آن معبود یگانه تنها می‌خواهد پلیدی را از شما، اهل خانه، دور کند و شما را کاملا پاک سازد.</p>
</section>
