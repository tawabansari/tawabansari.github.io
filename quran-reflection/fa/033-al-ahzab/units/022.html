<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="رَءَا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">رَءَا</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="الأَحزابَ" data-root="ح ز ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-z-b/" data-root-meaning="گروه و دسته‌ای که با هم پیوند یا همراهی دارند.">الأَحزابَ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="وَعَدَنَا" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعَدَنَا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَرَسولُهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَرَسولُهُ</button>
    <button class="word-link" type="button" data-word="وَصَدَقَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">وَصَدَقَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَرَسولُهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَرَسولُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="زادَهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">زادَهُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="إيمٰنًا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">إيمٰنًا</button>
    <button class="word-link" type="button" data-word="وَتَسليمًا" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">وَتَسليمًا</button>
  </p>
  <p class="farsi-verse">و چون مؤمنان گروه‌ها را دیدند، گفتند: این همان است که آن معبود یگانه و فرستاده‌اش به ما وعده دادند، و آن معبود یگانه و فرستاده‌اش راست گفتند؛ و جز ایمان و تسلیم بر آنان نیفزود.</p>
</section>
