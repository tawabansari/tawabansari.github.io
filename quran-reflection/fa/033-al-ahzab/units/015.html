<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه فعل پیمان بستن.">كانوا</button>
    <button class="word-link" type="button" data-word="عٰهَدُوا" data-root="ع ه د" data-learn-more="/quran-terminology/fa/roots/ayn-h2-d/" data-root-meaning="شناخت همراه با تعهد، پیمان، نگهداری و پاسخگویی" data-context="پیمان بسته بودند؛ با آن معبود یگانه.">عٰهَدُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش‌تر؛ زمانِ بستنِ پیمان.">قَبلُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُوَلّونَ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="پشت نمی‌کنند؛ مضمونِ پیمان با نفی.">يُوَلّونَ</button>
    <button class="word-link" type="button" data-word="الأَدبٰرَ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت‌ها؛ در مضمونِ پیمانِ پشت نکردن.">الأَدبٰرَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="است؛ در بیان مسئولیت نسبت به پیمان.">وَكانَ</button>
    <button class="word-link" type="button" data-word="عَهدُ" data-root="ع ه د" data-learn-more="/quran-terminology/fa/roots/ayn-h2-d/" data-root-meaning="شناخت همراه با تعهد، پیمان، نگهداری و پاسخگویی" data-context="پیمان با آن معبود یگانه؛ موضوعِ بازخواست.">عَهدُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مَسـٔولًا" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="مورد پرسش و بازخواست؛ وصف پیمان.">مَسـٔولًا</button>
  </p>
  <p class="farsi-verse">و به‌راستی پیش‌تر با آن معبود یگانه پیمان بسته بودند که پشت نکنند؛ و پیمان آن معبود یگانه مورد پرسش است.</p>
</section>
