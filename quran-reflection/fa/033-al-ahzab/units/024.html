<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَجزِىَ" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">لِيَجزِىَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الصّٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">الصّٰدِقينَ</button>
    <button class="word-link" type="button" data-word="بِصِدقِهِم" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">بِصِدقِهِم</button>
    <button class="word-link" type="button" data-word="وَيُعَذِّبَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">وَيُعَذِّبَ</button>
    <button class="word-link" type="button" data-word="المُنٰفِقينَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">المُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شاءَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يَتوبَ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">يَتوبَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="غَفورًا" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">غَفورًا</button>
    <button class="word-link" type="button" data-word="رَحيمًا" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمًا</button>
  </p>
  <p class="farsi-verse">تا آن معبود یگانه راستگویان را به سبب راستی‌شان پاداش دهد و منافقان را، اگر بخواهد، عذاب کند یا به آنان بازگردد. همانا آن معبود یگانه آمرزنده و رحیم است.</p>
</section>
