<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="لِأَزوٰجِكَ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند">لِأَزوٰجِكَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُنَّ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُنَّ</button>
    <button class="word-link" type="button" data-word="تُرِدنَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">تُرِدنَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةَ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَزينَتَها" data-root="ز ي ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَزينَتَها</button>
    <button class="word-link" type="button" data-word="فَتَعالَينَ" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَتَعالَينَ</button>
    <button class="word-link" type="button" data-word="أُمَتِّعكُنَّ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">أُمَتِّعكُنَّ</button>
    <button class="word-link" type="button" data-word="وَأُسَرِّحكُنَّ" data-root="س ر ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأُسَرِّحكُنَّ</button>
    <button class="word-link" type="button" data-word="سَراحًا" data-root="س ر ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَراحًا</button>
    <button class="word-link" type="button" data-word="جَميلًا" data-root="ج م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جَميلًا</button>
  </p>
  <p class="farsi-verse">ای پیامبر، به همسرانت بگو: اگر زندگی دنیا و زینت آن را می‌خواهید، بیایید تا بهره‌مندتان سازم و به‌گونه‌ای نیکو رهایتان کنم.</p>
</section>
