<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="پیامبر؛ مخاطب فرمان.">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو.">قُل</button>
    <button class="word-link" type="button" data-word="لِأَزوٰجِكَ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="به همسران خود.">لِأَزوٰجِكَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُنَّ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشید؛ در شرطِ خواستن زندگی دنیا.">كُنتُنَّ</button>
    <button class="word-link" type="button" data-word="تُرِدنَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="می‌خواهید و اراده می‌کنید.">تُرِدنَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةَ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی را.">الحَيوٰةَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="این‌جهانی و نزدیک.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَزينَتَها" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="و آراستگی و زینت آن را.">وَزينَتَها</button>
    <button class="word-link" type="button" data-word="فَتَعالَينَ" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="پس بیایید.">فَتَعالَينَ</button>
    <button class="word-link" type="button" data-word="أُمَتِّعكُنَّ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="شما را بهره‌مند سازم.">أُمَتِّعكُنَّ</button>
    <button class="word-link" type="button" data-word="وَأُسَرِّحكُنَّ" data-root="س ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-h/" data-root-meaning="رها کردن و روانه ساختن؛ درباره دام، به چرا فرستادن." data-context="و شما را رها کنم؛ در سیاق پایان رابطهٔ زناشویی.">وَأُسَرِّحكُنَّ</button>
    <button class="word-link" type="button" data-word="سَراحًا" data-root="س ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-h/" data-root-meaning="رها کردن و روانه ساختن؛ درباره دام، به چرا فرستادن." data-context="رها کردنی و جدایی‌ای.">سَراحًا</button>
    <button class="word-link" type="button" data-word="جَميلًا" data-root="ج م ل" data-root-meaning="زیبایی و نیکویی؛ و در شاخه‌ای دیگر، مجموعه و بزرگی؛ جَمَل نام شتر است." data-context="نیکو و شایسته؛ وصف شیوهٔ رها کردن و جدایی." data-learn-more="/quran-terminology/fa/roots/j-m-l/">جَميلًا</button>
  </p>
  <p class="farsi-verse">ای پیامبر، به همسرانت بگو: اگر زندگی دنیا و زینت آن را می‌خواهید، بیایید تا بهره‌مندتان سازم و به‌گونه‌ای نیکو رهایتان کنم.</p>
</section>
