  <p class="farsi-verse">و آنگاه که گروهی از آنان گفتند: ای مردم یثرب، برای شما جای ماندن نیست؛ پس بازگردید. و گروهی از آنان از پیامبر اجازه می‌خواستند و می‌گفتند: خانه‌های ما بی‌حفاظ است؛ حال آنکه بی‌حفاظ نبود. جز گریختن نمی‌خواستند.</p>
