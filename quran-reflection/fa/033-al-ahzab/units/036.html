  <p class="farsi-verse">و هیچ مرد مؤمن و زن مؤمنی را نرسد که چون آن معبود یگانه و فرستاده‌اش کاری را حکم کردند، در کارشان اختیاری داشته باشند؛ و هرکه از آن معبود یگانه و فرستاده‌اش نافرمانی کند، به‌راستی به گمراهی آشکاری افتاده است.</p>
