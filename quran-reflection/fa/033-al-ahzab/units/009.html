  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، نعمت آن معبود یگانه را بر خود یاد کنید، آنگاه که سپاهیانی به سوی شما آمدند و بادی و سپاهیانی که نمی‌دیدید بر آنان فرستادیم. و آن معبود یگانه به آنچه می‌کردید بینا بود.</p>
