<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="عَرَضنَا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="عرضه کردیم؛ ارائهٔ امانت به آفریدگان یادشده.">عَرَضنَا</button>
    <button class="word-link" type="button" data-word="الأَمانَةَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="امانت؛ چیزی که عرضه و حمل آن موضوع آیه است.">الأَمانَةَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ از دریافت‌کنندگانِ عرضهٔ امانت.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ در کنار آسمان‌ها و کوه‌ها.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَالجِبالِ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ در کنار آسمان‌ها و زمین، در بیان عرضهٔ امانت." data-learn-more="/quran-terminology/fa/roots/j-b-l/">وَالجِبالِ</button>
    <button class="word-link" type="button" data-word="فَأَبَينَ" data-root="أ ب ي" data-learn-more="/quran-terminology/fa/roots/a-b-y/" data-root-meaning="خودداری، نپذیرفتن و سر باز زدن؛ انگیزه و ارزش اخلاقی این خودداری به موضوع، فاعل و سیاق وابسته است." data-context="پس خودداری کردند؛ نپذیرفتنِ حمل امانت.">فَأَبَينَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَحمِلنَها" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری." data-context="آن را حمل کنند؛ بر عهده گرفتن امانت.">يَحمِلنَها</button>
    <button class="word-link" type="button" data-word="وَأَشفَقنَ" data-root="ش ف ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-f-q/" data-root-meaning="دلسوزی و نگرانی همراه با بیم؛ شفق: سرخی یا روشنایی افق پس از غروب." data-context="و از آن بیم داشتند؛ نگرانی در برابر امانت.">وَأَشفَقنَ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="وَحَمَلَهَا" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری." data-context="و آن را برداشت؛ بر عهده گرفتن امانت به دست انسان.">وَحَمَلَهَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ آن‌که حمل امانت به او نسبت داده شده است.">الإِنسٰنُ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ فعلِ وصف پایانی انسان.">كانَ</button>
    <button class="word-link" type="button" data-word="ظَلومًا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="بسیار ستمگر؛ وصفِ مبالغه در ستم.">ظَلومًا</button>
    <button class="word-link" type="button" data-word="جَهولًا" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه." data-context="بسیار نادان؛ وصفِ مبالغه در ناآگاهی.">جَهولًا</button>
  </p>
  <p class="farsi-verse">ما امانت را بر آسمان‌ها و زمین و کوه‌ها عرضه کردیم؛ پس از حمل آن سر باز زدند و از آن هراسیدند؛ و انسان آن را حمل کرد. همانا او بسیار ستمگر و بسیار نادان بود.</p>
</section>
