  <p class="farsi-verse">ما امانت را بر آسمان‌ها و زمین و کوه‌ها عرضه کردیم؛ پس از حمل آن سر باز زدند و از آن هراسیدند؛ و انسان آن را حمل کرد. همانا او بسیار ستمگر و بسیار نادان بود.</p>
