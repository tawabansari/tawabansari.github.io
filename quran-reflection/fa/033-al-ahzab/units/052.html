  <p class="farsi-verse">پس از این، زنان برای تو حلال نیستند، و نه اینکه همسرانی را جایگزین آنان کنی، هرچند زیبایی‌شان تو را به شگفت آورد، مگر آنچه دست راستت مالک شده است؛ و آن معبود یگانه بر هر چیزی مراقب است.</p>
