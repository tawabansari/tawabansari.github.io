<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَحِلُّ" data-root="ح ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-l/" data-root-meaning="گشودن و باز کردن بند؛ فرود آمدن و اقامت؛ حلال شدن و رفع منع." data-context="در «لا يحل»: حلال و مجاز نیست؛ نفیِ جواز در حکم.">يَحِلُّ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="النِّساءُ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنان؛ موضوعِ حکمِ روابط خانوادگی در آیه.">النِّساءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدُ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از این؛ قیدِ زمانیِ محدودیتِ بیان‌شده.">بَعدُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَبَدَّلَ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا." data-context="جایگزین کنی؛ گرفتن همسرانی به جای همسران موجود.">تَبَدَّلَ</button>
    <button class="word-link" type="button" data-word="بِهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِنَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَزوٰجٍ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="همسران؛ کسانی که جایگزینی با آنان نفی می‌شود.">أَزوٰجٍ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَعجَبَكَ" data-root="ع ج ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/" data-root-meaning="شگفتی؛ اعجاب: پسند و شگفت‌زدگی." data-context="تو را به شگفت و پسند آورد؛ اثرِ زیبایی بر مخاطب.">أَعجَبَكَ</button>
    <button class="word-link" type="button" data-word="حُسنُهُنَّ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="زیبایی آنان؛ موضوعِ پسند آمدن.">حُسنُهُنَّ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="مَلَكَت" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="در اختیار داشته؛ در عبارتِ «ما ملكت يمينك».">مَلَكَت</button>
    <button class="word-link" type="button" data-word="يَمينُكَ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="دست راستت؛ جزء تعبیرِ اختیار در «ما ملكت يمينك».">يَمينُكَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بوده و هست؛ در بیان مراقبتِ آن معبود یگانه.">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ گسترهٔ فراگیرِ مراقبت.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-context="چیز؛ در کاربرد اسمی برای هر امرِ موضوعِ مراقبت." data-root-meaning="خواستن و اراده کردن؛ و در کاربرد اسمیِ «شیء»، چیز یا امری که از آن سخن می‌رود، با کاربردی جدا از فعلِ خواستن.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="رَقيبًا" data-root="ر ق ب" data-root-meaning="زیر نظر داشتن، مراقبت، انتظار و رعایت؛ رقبة: گردن و به کنایه، تمام شخص یا انسان در بند." data-context="مراقب بر هر چیز؛ وصف فراگیر آن معبود یگانه پس از حکم مربوط به روابط خانوادگی پیامبر." data-learn-more="/quran-terminology/fa/roots/r-q-b/">رَقيبًا</button>
  </p>
  <p class="farsi-verse">پس از این، زنان برای تو حلال نیستند، و نه اینکه همسرانی را جایگزین آنان کنی، هرچند زیبایی‌شان تو را به شگفت آورد، مگر آنچه دست راستت مالک شده است؛ و آن معبود یگانه بر هر چیزی مراقب است.</p>
</section>
