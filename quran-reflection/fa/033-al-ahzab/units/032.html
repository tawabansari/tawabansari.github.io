<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰنِساءَ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="ای زنان؛ در این خطاب، همسران پیامبر.">يٰنِساءَ</button>
    <button class="word-link" type="button" data-word="النَّبِىِّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="پیامبر؛ در اینجا پیامبری که همسرانش مخاطب‌اند.">النَّبِىِّ</button>
    <button class="word-link" type="button" data-word="لَستُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَستُنَّ</button>
    <button class="word-link" type="button" data-word="كَأَحَدٍ" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="مانند هیچ‌یک؛ در ترکیب مقایسه‌ای «كأحد من النساء».">كَأَحَدٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنان؛ گروهی که همسران پیامبر در این جمله با آنان مقایسه می‌شوند.">النِّساءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنِ</button>
    <button class="word-link" type="button" data-word="اتَّقَيتُنَّ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پروا کنید؛ رعایت حدود و مسئولیت در شرطِ خطاب به همسران پیامبر.">اتَّقَيتُنَّ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَخضَعنَ" data-root="خ ض ع" data-root-meaning="فروآمدن، سر فرود آوردن و تسلیم‌شدن؛ و در گفتار، نرمش و تمایل خاضعانه." data-context="در این نهی: نرمش خاضعانه در گفتار که در سیاق آیه زمینهٔ طمع نامناسب را فراهم می‌کند." data-learn-more="/quran-terminology/fa/roots/kh-dad-ayn/">تَخضَعنَ</button>
    <button class="word-link" type="button" data-word="بِالقَولِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="در گفتار؛ بیانگر حوزهٔ نرمشِ نهی‌شده.">بِالقَولِ</button>
    <button class="word-link" type="button" data-word="فَيَطمَعَ" data-root="ط م ع" data-learn-more="/quran-terminology/fa/roots/tt-m-ayn/" data-root-meaning="چشم‌داشت و گرایش درونی به دستیابی به امر مطلوبی که ممکن پنداشته می‌شود" data-context="طمع کند؛ در اینجا پیدا کردن میل و توقع نامناسب در اثر گفتار یادشده.">فَيَطمَعَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قَلبِهِ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل او؛ در ترکیب «در دلش بیماری است».">قَلبِهِ</button>
    <button class="word-link" type="button" data-word="مَرَضٌ" data-root="م ر ض" data-learn-more="/quran-terminology/fa/roots/m-r-dad/" data-root-meaning="بیماری، سستی، نقصان، و خروج از حالت سلامت و اعتدال" data-context="بیماری؛ در اینجا وصف وضعیت درونی و اخلاقی کسی که طمع می‌کند.">مَرَضٌ</button>
    <button class="word-link" type="button" data-word="وَقُلنَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و بگویید؛ فرمان به گفتن سخن پسندیده.">وَقُلنَ</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخنی؛ گفتاری که باید معروف و پسندیده باشد.">قَولًا</button>
    <button class="word-link" type="button" data-word="مَعروفًا" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="پسندیده و شناخته‌شده به نیکی؛ وصف گفتاری که به آن فرمان داده شده است.">مَعروفًا</button>
  </p>
  <p class="farsi-verse">ای زنان پیامبر، شما مانند هیچ‌یک از زنان نیستید، اگر پروا کنید؛ پس در گفتار نرمی مکنید که آن کس که در دلش بیماری است طمع کند، و سخنی پسندیده بگویید.</p>
</section>
