<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَحِيَّتُهُم" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/">تَحِيَّتُهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَ</button>
    <button class="word-link" type="button" data-word="يَلقَونَهُ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/">يَلقَونَهُ</button>
    <button class="word-link" type="button" data-word="سَلٰمٌ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/">سَلٰمٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَعَدَّ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/">وَأَعَدَّ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="أَجرًا" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/">أَجرًا</button>
    <button class="word-link" type="button" data-word="كَريمًا" data-root="ك ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَريمًا</button>
  </p>
  <p class="farsi-verse">درودشان در روزی که او را دیدار می‌کنند «سلام» است؛ و برای آنان پاداشی ارجمند آماده کرده است.</p>
