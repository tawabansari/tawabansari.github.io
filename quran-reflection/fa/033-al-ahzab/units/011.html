<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُنالِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُنالِكَ</button>
    <button class="word-link" type="button" data-word="ابتُلِىَ" data-root="ب ل و" data-learn-more="/quran-terminology/fa/roots/b-l-w/" data-root-meaning="آزمودن در واقعیت؛ از خیر و شر تا «بلاء» و فرسودگی">ابتُلِىَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="وَزُلزِلوا" data-root="ز ل ز ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَزُلزِلوا</button>
    <button class="word-link" type="button" data-word="زِلزالًا" data-root="ز ل ز ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">زِلزالًا</button>
    <button class="word-link" type="button" data-word="شَديدًا" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شَديدًا</button>
  </p>
  <p class="farsi-verse">آنجا مؤمنان آزموده شدند و به‌شدت لرزانده شدند.</p>
</section>
