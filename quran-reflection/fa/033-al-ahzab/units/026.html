<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">وَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظٰهَروهُم" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی">ظٰهَروهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَهلِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلِ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="صَياصيهِم" data-root="ص ي ص" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَياصيهِم</button>
    <button class="word-link" type="button" data-word="وَقَذَفَ" data-root="ق ذ ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَقَذَفَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِهِمُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">قُلوبِهِمُ</button>
    <button class="word-link" type="button" data-word="الرُّعبَ" data-root="ر ع ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الرُّعبَ</button>
    <button class="word-link" type="button" data-word="فَريقًا" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">فَريقًا</button>
    <button class="word-link" type="button" data-word="تَقتُلونَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">تَقتُلونَ</button>
    <button class="word-link" type="button" data-word="وَتَأسِرونَ" data-root="أ س ر" data-learn-more="/quran-terminology/fa/roots/a-s-r/" data-root-meaning="از بستن و در اختیار گرفتن تا اسیر و استحکام پیوندها">وَتَأسِرونَ</button>
    <button class="word-link" type="button" data-word="فَريقًا" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">فَريقًا</button>
  </p>
  <p class="farsi-verse">و کسانی از اهل کتاب را که از آنان پشتیبانی کرده بودند از دژهایشان فرود آورد و در دل‌هایشان هراس افکند؛ گروهی را می‌کشتید و گروهی را اسیر می‌کردید.</p>
</section>
