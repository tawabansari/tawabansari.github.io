  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، چون زنان مؤمن را به همسری گرفتید، سپس پیش از آنکه با آنان تماس داشته باشید طلاقشان دادید، هیچ عده‌ای بر آنان برای شما نیست که آن را بشمارید؛ پس بهره‌مندشان سازید و به‌گونه‌ای نیکو رهایشان کنید.</p>
