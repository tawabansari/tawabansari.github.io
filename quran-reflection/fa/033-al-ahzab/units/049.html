    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِنَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>

    <button class="word-link" type="button" data-word="تَعتَدّونَها" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص">تَعتَدّونَها</button>

    <button class="word-link" type="button" data-word="فَمَتِّعوهُنَّ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">فَمَتِّعوهُنَّ</button>
    <button class="word-link" type="button" data-word="وَسَرِّحوهُنَّ" data-root="س ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-h/" data-root-meaning="رها کردن و روانه ساختن؛ درباره دام، به چرا فرستادن.">وَسَرِّحوهُنَّ</button>

    <button class="word-link" type="button" data-word="جَميلًا" data-root="ج م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-m-l/" data-root-meaning="در شاخه‌های مختلف: جمع و توده، جمال و زیبایی، و جمل به معنای شتر.">جَميلًا</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، چون زنان مؤمن را به همسری گرفتید، سپس پیش از آنکه با آنان تماس داشته باشید طلاقشان دادید، هیچ عده‌ای بر آنان برای شما نیست که آن را بشمارید؛ پس بهره‌مندشان سازید و به‌گونه‌ای نیکو رهایشان کنید.</p>
