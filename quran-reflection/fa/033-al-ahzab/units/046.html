<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَداعِيًا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">وَداعِيًا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="بِإِذنِهِ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/">بِإِذنِهِ</button>
    <button class="word-link" type="button" data-word="وَسِراجًا" data-root="س ر ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَسِراجًا</button>
    <button class="word-link" type="button" data-word="مُنيرًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/">مُنيرًا</button>
  </p>
  <p class="farsi-verse">و دعوت‌کننده‌ای به سوی آن معبود یگانه به اذن او، و چراغی روشنگر.</p>
</section>
