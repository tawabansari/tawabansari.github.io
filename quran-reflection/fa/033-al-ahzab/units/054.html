<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="تُبدوا" data-root="ب د و" data-learn-more="/quran-terminology/fa/roots/b-d-w/" data-root-meaning="آشکار شدن، پدیدار گشتن از پس پوشیدگی، و ورود چیزی به میدان دید یا آگاهی" data-context="آشکار کنید؛ چیزی را.">تُبدوا</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیزی؛ آنچه آشکار یا پنهان می‌شود.">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="تُخفوهُ" data-root="خ ف ي" data-root-meaning="پوشیده بودن و پنهان ماندن؛ پنهان کردن؛ و در شاخه‌ای از عربی کهن، آشکار شدن یا آشکار ساختن چیزی پوشیده." data-context="پنهان کنید؛ در برابر آشکار کردن چیزی." data-learn-more="/quran-terminology/fa/roots/kh-f-y/">تُخفوهُ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="است؛ در بیان آگاهی فراگیر او.">كانَ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="به هر؛ در بیان گسترهٔ آگاهی.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیزی؛ موضوع علم در عبارت.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَليمًا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ به هر چیزی.">عَليمًا</button>
  </p>
  <p class="farsi-verse">اگر چیزی را آشکار کنید یا پنهانش سازید، همانا آن معبود یگانه به هر چیزی داناست.</p>
</section>
