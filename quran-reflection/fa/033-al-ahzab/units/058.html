<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُؤذونَ" data-root="أ ذ ي" data-learn-more="/quran-terminology/fa/roots/a-dh-y/" data-root-meaning="ایجاد یا رساندن آزار و آسیب به دیگری؛ نوع، شدت و ارزش اخلاقی آن از سیاق تعیین می‌شود." data-context="آزار می‌رسانند؛ آسیب ناروا به مردان و زنان مؤمن.">يُؤذونَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مردان مؤمن؛ گروهی از اشخاصِ مورد آزار.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤمِنٰتِ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="و زنان مؤمن؛ همراه مردان در بیان اشخاصِ مورد آزار.">وَالمُؤمِنٰتِ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="بدون و به غیر؛ نفیِ پشتوانهٔ آزار در کردار واقعیِ آنان.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="اكتَسَبوا" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان" data-context="مرتکب شده‌اند؛ کردارِ خودِ اشخاص، که آزار به‌ناحق به آن نسبت داده می‌شود.">اكتَسَبوا</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="احتَمَلوا" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="بر دوش گرفته‌اند؛ بار مسئولیت بهتان و گناه بر عهدهٔ آزاردهندگان." data-learn-more="/quran-terminology/fa/roots/h-m-l/">احتَمَلوا</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="ب ه ت" data-root-meaning="«ب ه ت» در یک شاخه به حیرت و درماندگی انسان در برابر امری تکان‌دهنده یا حجتی پاسخ‌ناپذیر اشاره دارد؛ و در شاخه دیگر، «بُهْتَان» به دروغ و نسبت ناروایی گفته می‌شود که حقیقت را وارونه نشان می‌دهد و می‌تواند شخصی بی‌گناه را در معرض اتهام یا آسیب قرار دهد." data-context="بهتانی؛ بارِ نسبت و آسیبِ ناروا به مردان و زنان مؤمن." data-learn-more="/quran-terminology/fa/roots/b-h2-t/">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="وَإِثمًا" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="و گناه؛ همراهِ بهتان، بار مسئولیت آزاردهندگان.">وَإِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصفِ گناهِ آزار ناروا.">مُبينًا</button>
  </p>
  <p class="farsi-verse">و کسانی که مردان مؤمن و زنان مؤمن را بی‌آنکه چیزی مرتکب شده باشند آزار می‌دهند، به‌راستی بهتان و گناهی آشکار بر دوش گرفته‌اند.</p>
</section>
