<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُؤذونَ" data-root="أ ذ ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-dh-y/" data-root-meaning="آزار، رنج و آسیبی که به شخص یا موجودی می‌رسد.">يُؤذونَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤمِنٰتِ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">وَالمُؤمِنٰتِ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="اكتَسَبوا" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان">اكتَسَبوا</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="احتَمَلوا" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری.">احتَمَلوا</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="ب ه ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-h2-t/" data-root-meaning="مبهوت و درمانده شدن؛ بهتان: دروغ و نسبتی ناروا که شنونده را شگفت‌زده می‌کند.">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="وَإِثمًا" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن">وَإِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">مُبينًا</button>
  </p>
  <p class="farsi-verse">و کسانی که مردان مؤمن و زنان مؤمن را بی‌آنکه چیزی مرتکب شده باشند آزار می‌دهند، به‌راستی بهتان و گناهی آشکار بر دوش گرفته‌اند.</p>
</section>
