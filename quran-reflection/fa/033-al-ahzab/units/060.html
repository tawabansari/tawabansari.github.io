  <p class="farsi-verse">اگر منافقان و کسانی که در دل‌هایشان بیماری است و شایعه‌پراکنان در شهر دست برندارند، بی‌گمان تو را بر آنان برمی‌انگیزیم؛ سپس جز اندکی در آن همسایه تو نخواهند بود؛</p>
