<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَنتَهِ" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="بازایستند؛ دست کشیدن از رفتار یادشده." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">يَنتَهِ</button>
    <button class="word-link" type="button" data-word="المُنٰفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="منافقان؛ یکی از گروه‌های مخاطب هشدار.">المُنٰفِقونَ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌هایشان؛ جای بیماریِ درونیِ یادشده.">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="مَرَضٌ" data-root="م ر ض" data-learn-more="/quran-terminology/fa/roots/m-r-dad/" data-root-meaning="بیماری، سستی، نقصان، و خروج از حالت سلامت و اعتدال" data-context="بیماری؛ وصف وضعیت درونی گروهی از مخاطبان.">مَرَضٌ</button>
    <button class="word-link" type="button" data-word="وَالمُرجِفونَ" data-root="ر ج ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-f/" data-root-meaning="لرزیدن و اضطراب؛ ارجاف: پراکندن خبرهای هراس‌آور." data-context="و شایعه‌پراکنان؛ کسانی که خبرهای هراس‌آور می‌پراکنند.">وَالمُرجِفونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-d-n/" data-root-meaning="مدینه: شهر و آبادی؛ تحلیل آن از «مدن» یا «دین» اختلافی است." data-context="شهر؛ مدینه که اقامت در آن مطرح است.">المَدينَةِ</button>
    <button class="word-link" type="button" data-word="لَنُغرِيَنَّكَ" data-root="غ ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-w/" data-root-meaning="چسبیدن و دل‌بسته شدن؛ اغراء: برانگیختن یا مسلط کردن." data-context="قطعاً تو را بر ضد آنان برمی‌انگیزیم؛ مفاد هشدار مشروط.">لَنُغرِيَنَّكَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُجاوِرونَكَ" data-root="ج و ر" data-root-meaning="همسایگی و مجاورت؛ پناه دادن و حمایت؛ در شاخهٔ جَوْر، انحراف از راه و عدالت." data-context="در همسایگی تو می‌مانند؛ ادامهٔ اقامت در همان شهر." data-learn-more="/quran-terminology/fa/roots/j-w-r/">يُجاوِرونَكَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندکی؛ اندازهٔ محدودِ ادامهٔ اقامت.">قَليلًا</button>
  </p>
  <p class="farsi-verse">اگر منافقان و کسانی که در دل‌هایشان بیماری است و شایعه‌پراکنان در شهر دست برندارند، بی‌گمان تو را بر آنان برمی‌انگیزیم؛ سپس جز اندکی در آن همسایه تو نخواهند بود؛</p>
</section>
