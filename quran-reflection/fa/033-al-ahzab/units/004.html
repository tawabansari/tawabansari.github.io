  <p class="farsi-verse">آن معبود یگانه برای هیچ مردی دو دل در درونش قرار نداده است؛ و همسرانتان را که با آنان ظهار می‌کنید، مادرانتان قرار نداده، و پسرخواندگانتان را پسرانتان قرار نداده است. این سخن شما با دهان‌هایتان است؛ و آن معبود یگانه حق را می‌گوید و او راه را نشان می‌دهد.</p>
