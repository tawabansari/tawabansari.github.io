<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰنِساءَ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن">يٰنِساءَ</button>
    <button class="word-link" type="button" data-word="النَّبِىِّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">النَّبِىِّ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَأتِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يَأتِ</button>
    <button class="word-link" type="button" data-word="مِنكُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُنَّ</button>
    <button class="word-link" type="button" data-word="بِفٰحِشَةٍ" data-root="ف ح ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِفٰحِشَةٍ</button>
    <button class="word-link" type="button" data-word="مُبَيِّنَةٍ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">مُبَيِّنَةٍ</button>
    <button class="word-link" type="button" data-word="يُضٰعَف" data-root="ض ع ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُضٰعَف</button>
    <button class="word-link" type="button" data-word="لَهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهَا</button>
    <button class="word-link" type="button" data-word="العَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابُ</button>
    <button class="word-link" type="button" data-word="ضِعفَينِ" data-root="ض ع ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ضِعفَينِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَسيرًا" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت">يَسيرًا</button>
  </p>
  <p class="farsi-verse">ای زنان پیامبر، هرکدام از شما که کار زشت آشکاری انجام دهد، عذاب برایش دوچندان می‌شود؛ و این بر آن معبود یگانه آسان است.</p>
</section>
