  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، مانند کسانی نباشید که موسی را آزار دادند؛ پس آن معبود یگانه او را از آنچه گفتند تبرئه کرد؛ و او نزد آن معبود یگانه آبرومند بود.</p>
