<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَلعونينَ" data-root="ل ع ن" data-learn-more="/quran-terminology/fa/roots/l-ayn-n/" data-root-meaning="راندن، دور ساختن و قرار گرفتن در جایگاه طرد" data-context="رانده و از رحمت دورشده؛ وصفِ گروهِ موضوعِ هشدار در سیاقِ پیشین.">مَلعونينَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَينَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَينَما</button>
    <button class="word-link" type="button" data-word="ثُقِفوا" data-root="ث ق ف" data-root-meaning="یافتن یا دست یافتن به شخص در موقعیتی مشخص، گاه همراه با چیرگی و تسلط بر او." data-context="هرجا به آنان دست یافته شود؛ ماضی مجهول در ساختِ شرطی، متمایز از گرفتن و کشتنِ پس از آن." data-learn-more="/quran-terminology/fa/roots/th-q-f/">ثُقِفوا</button>
    <button class="word-link" type="button" data-word="أُخِذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="گرفته می‌شوند؛ فعلِ مستقلِ گرفتن پس از دست یافتن.">أُخِذوا</button>
    <button class="word-link" type="button" data-word="وَقُتِّلوا" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="به‌شدت کشته می‌شوند؛ ماضی مجهولِ باب تفعیل در ساختِ هشدار.">وَقُتِّلوا</button>
    <button class="word-link" type="button" data-word="تَقتيلًا" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="کشتنی مؤکد؛ مصدرِ تأکیدیِ فعلِ «قُتِّلوا»، بدون تعیینِ روش خاص در خود واژه.">تَقتيلًا</button>
  </p>
  <p class="farsi-verse">لعنت‌شدگان‌اند؛ هرجا یافت شوند، گرفته می‌شوند و به‌سختی کشته می‌شوند.</p>
</section>
