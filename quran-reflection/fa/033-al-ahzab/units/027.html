<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَورَثَكُم" data-root="و ر ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَورَثَكُم</button>
    <button class="word-link" type="button" data-word="أَرضَهُم" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">أَرضَهُم</button>
    <button class="word-link" type="button" data-word="وَدِيٰرَهُم" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/">وَدِيٰرَهُم</button>
    <button class="word-link" type="button" data-word="وَأَموٰلَهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/">وَأَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="وَأَرضًا" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">وَأَرضًا</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَطَـٔوها" data-root="و ط أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَطَـٔوها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَىءٍ</button>
    <button class="word-link" type="button" data-word="قَديرًا" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">قَديرًا</button>
  </p>
  <p class="farsi-verse">و زمینشان و خانه‌هایشان و اموالشان و زمینی را که بر آن قدم ننهاده بودید به شما به ارث داد؛ و آن معبود یگانه بر هر چیزی تواناست.</p>
</section>
