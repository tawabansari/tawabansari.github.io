<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَعَنَ" data-root="ل ع ن" data-learn-more="/quran-terminology/fa/roots/l-ayn-n/" data-root-meaning="راندن، دور ساختن و قرار گرفتن در جایگاه طرد">لَعَنَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="وَأَعَدَّ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص">وَأَعَدَّ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="سَعيرًا" data-root="س ع ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-ayn-r/" data-root-meaning="افروختن آتش؛ سعیر: آتش شعله‌ور؛ سُعُر در برخی سیاق‌ها: آشفتگی.">سَعيرًا</button>
  </p>
  <p class="farsi-verse">همانا آن معبود یگانه کافران را لعنت کرده و برای آنان آتشی فروزان آماده کرده است؛</p>
</section>
