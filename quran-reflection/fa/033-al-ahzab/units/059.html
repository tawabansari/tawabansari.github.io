<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">الاحزاب ۳۳:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="پیامبر؛ مخاطب فرمانی که باید به همسران، دختران و زنان مؤمنان برساند.">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان به پیامبر برای رساندن سخن به زنان یادشده.">قُل</button>
    <button class="word-link" type="button" data-word="لِأَزوٰجِكَ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="به همسرانت؛ نخستین گروه از زنان مورد خطابِ پیامی که پیامبر می‌رساند.">لِأَزوٰجِكَ</button>
    <button class="word-link" type="button" data-word="وَبَناتِكَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="و دخترانت؛ گروه دوم در شمار زنان یادشده.">وَبَناتِكَ</button>
    <button class="word-link" type="button" data-word="وَنِساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="و زنان؛ در ترکیب «زنان مؤمنان»، گروه دیگری که پیام به آنان می‌رسد.">وَنِساءِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمنان؛ در ترکیب «زنان مؤمنان»، برای مشخص کردن زنان مورد خطاب.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="يُدنينَ" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="بر خود نزدیک کنند یا فرو افکنند؛ عمل زنان با پوشش‌های بیرونی‌شان، جدا از معنای خودِ «جلباب».">يُدنينَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِنَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="جَلٰبيبِهِنَّ" data-root="ج ل ب" data-root-meaning="آوردن و گردآوردن، بسیج کردن؛ و در شاخه‌ای دیگر، پوشاندن و دربرگرفتن." data-context="پوشش‌های بیرونی‌شان؛ جمع «جلباب» با ضمیر زنان. عمل فرو افکندن این پوشش‌ها از فعل «یُدنینَ» بیان می‌شود." data-learn-more="/quran-terminology/fa/roots/j-l-b/">جَلٰبيبِهِنَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَدنىٰ" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="نزدیک‌تر و مناسب‌تر؛ این شیوه برای شناخته شدن و آزار ندیدن آنان مناسب‌تر است.">أَدنىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُعرَفنَ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="شناخته شوند؛ فعل مجهول دربارهٔ زنان، بدون تصریح در همین عبارت به نوع دقیق شناخت اجتماعی.">يُعرَفنَ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="يُؤذَينَ" data-root="أ ذ ي" data-learn-more="/quran-terminology/fa/roots/a-dh-y/" data-root-meaning="آزار دیدن یا مورد آزار قرار گرفتن؛ نوع و شدت آزار از سیاق تعیین می‌شود." data-context="آزار داده شوند؛ فعل مجهول، که با «فلا» نفی شده است: تا آزار نبینند.">يُؤذَينَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بود/است؛ در ساخت بیان آمرزندگی و رحمت الهی.">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورًا" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="آمرزنده؛ وصف آن معبود یگانه در پایان آیه.">غَفورًا</button>
    <button class="word-link" type="button" data-word="رَحيمًا" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحیم؛ وصف رحمت آن معبود یگانه در کنار آمرزندگی.">رَحيمًا</button>
  </p>
  <p class="farsi-verse">ای پیامبر، به همسرانت و دخترانت و زنان مؤمنان بگو از پوشش‌های بیرونی‌شان بر خود فرو افکنند. این نزدیک‌تر است به اینکه شناخته شوند و آزار نبینند؛ و آن معبود یگانه آمرزنده و رحیم است.</p>
</section>
