  <p class="farsi-verse">آنان را به پدرانشان بخوانید؛ این نزد آن معبود یگانه دادگرانه‌تر است. پس اگر پدرانشان را نمی‌دانید، برادران دینی و وابستگان شما هستند. و در آنچه به خطا کرده‌اید گناهی بر شما نیست، بلکه در آن چیزی است که دل‌هایتان به عمد خواسته است. و آن معبود یگانه آمرزنده و رحیم است.</p>
