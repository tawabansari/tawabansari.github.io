  <p class="farsi-verse">بگو: چه کسی شما را در برابر آن معبود یگانه نگه می‌دارد، اگر برای شما بدی بخواهد یا برایتان رحمتی بخواهد؟ و برای خود جز آن معبود یگانه هیچ سرپرست و یاوری نمی‌یابند.</p>
