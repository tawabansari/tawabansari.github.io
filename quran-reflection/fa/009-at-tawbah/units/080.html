  </p>
  <p class="farsi-verse">برای آنان آمرزش بخواه یا آمرزش نخواه؛ اگر هفتاد بار برایشان آمرزش بخواهی، آن معبود یگانه هرگز آنان را نمی‌آمرزد؛ این بدان سبب است که به آن معبود یگانه و رسولش کفر ورزیدند؛ و آن معبود یگانه مردم نافرمان را هدایت نمی‌کند.</p>
