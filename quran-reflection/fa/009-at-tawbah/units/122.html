<section class="ayah-block" id="ayah-122" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="سزاوار نیست؛ در ساخت منفی آیه، نفی خروج همگانی مؤمنان.">كانَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمنان؛ کسانی که درباره خروج همگانی آنان سخن می‌رود.">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="لِيَنفِروا" data-root="ن ف ر" data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="دور شدن، فاصله گرفتن و به حرکت درآمدن؛ رمیدن و رویگردانی. در شاخه اسمی، گروه همراهان و یاری‌کنندگان." data-context="همگی به حرکت درآیند؛ خروج همگانی مؤمنان در این عبارت نفی شده است.">لِيَنفِروا</button>
    <button class="word-link" type="button" data-word="كافَّةً" data-root="ك ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-f-f/" data-root-meaning="کف دست؛ بازداشتن و دست کشیدن؛ کافّه: همگی." data-context="همگی؛ خروج تمام مؤمنان با یکدیگر.">كافَّةً</button>
    ۚ
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَولا</button>
    <button class="word-link" type="button" data-word="نَفَرَ" data-root="ن ف ر" data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="دور شدن، فاصله گرفتن و به حرکت درآمدن؛ رمیدن و رویگردانی. در شاخه اسمی، گروه همراهان و یاری‌کنندگان." data-context="بیرون رفت؛ حرکت دسته‌ای از هر گروه در پیوند با فهم دین و هشدار دادن.">نَفَرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ در اشاره به دسته‌ای از هر گروه.">كُلِّ</button>
    <button class="word-link" type="button" data-word="فِرقَةٍ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر" data-context="گروه؛ جماعتی که دسته‌ای از میان آن مطرح شده است.">فِرقَةٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="طائِفَةٌ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل" data-context="دسته‌ای؛ بخشی از هر گروه که از حرکت آن سخن می‌رود.">طائِفَةٌ</button>
    <button class="word-link" type="button" data-word="لِيَتَفَقَّهوا" data-root="ف ق ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-h2/" data-root-meaning="فهمیدن و دریافت دقیق سخن یا موضوع." data-context="تا فهم پیدا کنند؛ هدف تفقه و شناخت دین در پیوند با تقسیم مسئولیت.">لِيَتَفَقَّهوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دین؛ موضوع فهم و آگاهی در این عبارت.">الدّينِ</button>
    <button class="word-link" type="button" data-word="وَلِيُنذِروا" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="و تا هشدار دهند؛ رساندن هشدار به قوم خود.">وَلِيُنذِروا</button>
    <button class="word-link" type="button" data-word="قَومَهُم" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قوم خود؛ مردمی که مخاطب هشدار قرار می‌گیرند.">قَومَهُم</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="رَجَعوا" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="بازگشتند؛ بازگشت به سوی قوم یا گروه دیگر، بنا بر خوانش ضمیرها.">رَجَعوا</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَحذَرونَ" data-root="ح ذ ر" data-learn-more="/quran-terminology/fa/roots/h-dh-r/" data-root-meaning="احتیاط، پرهیز، بیداری در برابر خطر، ترس آگاهانه از آسیب، و مراقبت عملی پیش از وقوع ضرر" data-context="پرهیز کنند؛ با دریافت هشدار، مراقب پیامدها باشند.">يَحذَرونَ</button>
  </p>
  <p class="farsi-verse">و مؤمنان را نسزد که همگی حرکت کنند؛ پس چرا از هر گروهشان دسته‌ای حرکت نکند تا در دین فهم ژرف یابند و چون به سوی قوم خود بازگردند، آنان را هشدار دهند، باشد که پروا کنند؟</p>
</section>
