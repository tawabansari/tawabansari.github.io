<section class="ayah-block" id="ayah-129" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">تَوَلَّوا</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقُل</button>
    <button class="word-link" type="button" data-word="حَسبِىَ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">حَسبِىَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="إِلٰهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">إِلٰهَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    ۖ
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="تَوَكَّلتُ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">تَوَكَّلتُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="رَبُّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّ</button>
    <button class="word-link" type="button" data-word="العَرشِ" data-root="ع ر ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-sh/" data-root-meaning="سقف و سازه برافراشته؛ عرش: تخت یا جایگاه فرمانروایی.">العَرشِ</button>
    <button class="word-link" type="button" data-word="العَظيمِ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">العَظيمِ</button>
  </p>
  <p class="farsi-verse">پس اگر روی گرداندند، بگو: آن معبود یگانه برای من کافی است؛ هیچ معبودی جز او نیست؛ بر او توکل کرده‌ام و او پروردگار عرش بزرگ است.</p>
</section>
