    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَقالَتِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَتِ</button>

    <button class="word-link" type="button" data-word="المَسيحُ" data-root="م س ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-h/" data-root-meaning="دست کشیدن و پاک کردن؛ نیز اندازه‌گیری سطح.">المَسيحُ</button>

    ۖ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="قَولُهُم" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قَولُهُم</button>
    <button class="word-link" type="button" data-word="بِأَفوٰهِهِم" data-root="ف و ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-h2/" data-root-meaning="دهان و دهان‌ها.">بِأَفوٰهِهِم</button>

    <button class="word-link" type="button" data-word="قَولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قَولَ</button>

    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلُ</button>

    ۚ
    <button class="word-link" type="button" data-word="أَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="أ ف ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن چیزی از جهت درست؛ إفک: سخن دروغ و وارونه‌سازی حقیقت؛ مؤتفکه: واژگون‌شده.">يُؤفَكونَ</button>
  </p>
  <p class="farsi-verse">و یهود گفتند: عزیر پسر آن معبود یگانه است؛ و نصارا گفتند: مسیح پسر آن معبود یگانه است؛ این سخن دهان‌هایشان است؛ به سخن کسانی شباهت می‌رسانند که پیش‌تر کفر ورزیدند؛ آن معبود یگانه با آنان بستیزد؛ چگونه برگردانده می‌شوند!</p>
</section>
