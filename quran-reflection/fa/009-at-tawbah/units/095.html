<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۹۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَيَحلِفونَ" data-root="ح ل ف" data-root-meaning="سوگند خوردن برای تأکید بر یک ادعا یا استوار کردن تعهد؛ «حَلَّاف» کسی است که بسیار سوگند می‌خورد." data-context="به‌زودی سوگند خواهند خورد." data-learn-more="/quran-terminology/fa/roots/h-l-f/">سَيَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="إِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذَا</button>
    <button class="word-link" type="button" data-word="انقَلَبتُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="بازگشتید؛ هنگامِ برگشتن به سوی آنان.">انقَلَبتُم</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="لِتُعرِضوا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="تا روی بگردانید و از پیگیریِ آنان صرف نظر کنید.">لِتُعرِضوا</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَعرِضوا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="پس روی بگردانید.">فَأَعرِضوا</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="رِجسٌ" data-root="ر ج س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-s/" data-root-meaning="پلیدی و آلودگی مادی یا معنوی، بر حسب سیاق." data-context="پلیدی و وضعیتِ نکوهیده؛ وصفِ آنان در این سیاق.">رِجسٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُم" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="جایگاه و محل اقامت یا پناه؛ بدون دلالتِ همیشگی بر امنیت و آسایش." data-context="جایگاه آنان؛ جهنم.">وَمَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    <button class="word-link" type="button" data-word="جَزاءً" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="به‌عنوانِ کیفر و نتیجهٔ کردار.">جَزاءً</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در ساختِ بیانِ کردارِ گذشته.">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان" data-context="به دست می‌آوردند؛ حاصلِ رفتارشان را فراهم می‌کردند.">يَكسِبونَ</button>
  </p>
  <p class="farsi-verse">هنگامی که نزد آنان بازگردید، برایتان به آن معبود یگانه سوگند خواهند خورد تا از آنان روی بگردانید؛ پس از آنان روی بگردانید؛ آنان پلیدی‌اند و جایگاهشان جهنم است، به جزای آنچه به دست می‌آوردند.</p>
</section>
