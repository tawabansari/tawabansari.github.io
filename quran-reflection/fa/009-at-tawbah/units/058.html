<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَلمِزُكَ" data-root="ل م ز" data-root-meaning="لمز، عیب‌جویی و خرده‌گیری آسیب‌رسان از شخص یا رفتار اوست که می‌تواند از راه سخن، کنایه یا اشاره انجام شود و در کاربرد قرآنی، غالبا با طعنه و تحقیر همراه است." data-learn-more="/quran-terminology/fa/roots/l-m-z/">يَلمِزُكَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتِ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">الصَّدَقٰتِ</button>
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="أُعطوا" data-root="ع ط و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أُعطوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="رَضوا" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل">رَضوا</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يُعطَوا" data-root="ع ط و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُعطَوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="يَسخَطونَ" data-root="س خ ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَسخَطونَ</button>
  </p>
  <p class="farsi-verse">و از آنان کسی است که درباره صدقات بر تو خرده می‌گیرد؛ پس اگر از آن به آنان داده شود، خشنود می‌شوند و اگر داده نشود، ناگهان خشمگین می‌شوند.</p>
</section>
