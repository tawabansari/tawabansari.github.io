  <p class="farsi-verse">از اموالشان صدقه‌ای بگیر که با آن پاکشان کنی و رشدشان دهی و بر آنان صلات بفرست؛ بی‌گمان صلات تو برایشان آرامش است؛ و آن معبود یگانه شنوا و داناست.</p>
