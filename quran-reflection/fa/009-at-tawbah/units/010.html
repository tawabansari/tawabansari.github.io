<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَرقُبونَ" data-root="ر ق ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-q-b/" data-root-meaning="گردن؛ نیز مراقبت و چشم‌به‌راه بودن؛ رقبه می‌تواند نماینده شخص باشد." data-context="رعایت نمی‌کنند؛ حفظ نکردن حرمت پیوند و عهد درباره مؤمن.">يَرقُبونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مُؤمِنٍ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="هیچ مؤمنی؛ اسم نکره در جمله منفی، رفتار گروه را نسبت به هر مؤمن بیان می‌کند.">مُؤمِنٍ</button>
    <button class="word-link" type="button" data-word="إِلًّا" data-root="أ ل ل" data-learn-more="/quran-terminology/fa/roots/a-l-l/" data-root-meaning="پیوندی میان انسان‌ها که به سبب خویشاوندی، عهد، هم‌پیمانی یا رابطه‌ای شناخته‌شده، رعایت حرمت و حق طرف مقابل را اقتضا می‌کند." data-context="پیوند لازم‌الرعایه، مانند خویشاوندی یا هم‌پیمانی؛ موضوعِ رعایت نکردن.">إِلًّا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="ذِمَّةً" data-root="ذ م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-m-m/" data-root-meaning="نکوهش و سرزنش؛ ذمّه: عهد و تعهدی که رعایت آن لازم است." data-context="عهد، امان و تعهدی که رعایتش لازم است؛ این گروه آن را نگاه نمی‌دارد.">ذِمَّةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="المُعتَدونَ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="تجاوزگران؛ کسانی که با رعایت نکردن پیوندها و تعهدها از حدود می‌گذرند.">المُعتَدونَ</button>
  </p>
  <p class="farsi-verse">درباره هیچ مؤمنی نه خویشاوندی را رعایت می‌کنند و نه پیمانی را؛ و آنان همان تجاوزگران‌اند.</p>
</section>
