  <p class="farsi-verse">مردان و زنان منافق از یکدیگرند؛ به منکر فرمان می‌دهند و از معروف بازمی‌دارند و دست‌هایشان را می‌بندند؛ آن معبود یگانه را فراموش کردند، پس او نیز آنان را فراموش کرد؛ بی‌گمان منافقان همان نافرمانان‌اند.</p>
