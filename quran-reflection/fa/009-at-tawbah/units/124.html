  <p class="farsi-verse">و هنگامی که سوره‌ای فرو فرستاده شود، از آنان کسی می‌گوید: این بر ایمان کدام‌یک از شما افزود؟ اما کسانی که ایمان آورده‌اند، بر ایمانشان افزوده و آنان شادمان‌اند.</p>
