  </p>
  <p class="farsi-verse">و اگر به آنچه آن معبود یگانه و رسولش به آنان دادند راضی می‌شدند و می‌گفتند: آن معبود یگانه برای ما کافی است؛ آن معبود یگانه از فضل خود به ما خواهد داد و رسولش نیز؛ ما به آن معبود یگانه راغبیم.</p>
