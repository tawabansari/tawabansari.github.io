<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَحلِفونَ" data-root="ح ل ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="لِيُرضوكُم" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل">لِيُرضوكُم</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="وَرَسولُهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَرَسولُهُ</button>
    <button class="word-link" type="button" data-word="أَحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">أَحَقُّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُرضوهُ" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل">يُرضوهُ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">مُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">برای شما به آن معبود یگانه سوگند می‌خورند تا خشنودتان کنند؛ و آن معبود یگانه و رسولش سزاوارترند که او را خشنود کنند، اگر مؤمن باشند.</p>
</section>
