<section class="ayah-block" id="ayah-109" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۰۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَمَن</button>
    <button class="word-link" type="button" data-word="أَسَّسَ" data-root="أ س س" data-learn-more="/quran-terminology/fa/roots/a-s-s/" data-root-meaning="قرار دادن پایه و بنیانی که ساخت یا ادامه یک چیز بر آن استوار شود؛ و در کاربرد گسترده‌تر، آغاز و برپا کردن کاری بر یک اساس مشخص." data-context="بنیاد نهاد؛ بنا کردن بر تقوا و خشنودی الهی در سوی نخست مقایسه.">أَسَّسَ</button>
    <button class="word-link" type="button" data-word="بُنيٰنَهُ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="بنای خود؛ ساختمانِ بنیادگذار در سوی نخست مقایسه.">بُنيٰنَهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="تَقوىٰ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پروا و مراقبت مسئولانه؛ بنیادی که بنای نخست بر آن نهاده شده است.">تَقوىٰ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَرِضوٰنٍ" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل" data-context="و خشنودی؛ رضای الهی همراه با تقوا در بنیاد بنا.">وَرِضوٰنٍ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ پرسش مقایسه‌ای میان دو بنیادگذاری.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="أَسَّسَ" data-root="أ س س" data-learn-more="/quran-terminology/fa/roots/a-s-s/" data-root-meaning="قرار دادن پایه و بنیانی که ساخت یا ادامه یک چیز بر آن استوار شود؛ و در کاربرد گسترده‌تر، آغاز و برپا کردن کاری بر یک اساس مشخص." data-context="بنیاد نهاد؛ بنا کردن بر لبهٔ کناره‌ای فروریختنی در سوی دوم مقایسه.">أَسَّسَ</button>
    <button class="word-link" type="button" data-word="بُنيٰنَهُ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="بنای خود؛ ساختمانِ بنیادگذار در سوی دوم مقایسه.">بُنيٰنَهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="شَفا" data-root="ش ف و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-f-w/" data-root-meaning="لبه و کناره، به‌ویژه لبه پرتگاه." data-context="لبه؛ کناره‌ای که بنا بر آن نهاده شده است.">شَفا</button>
    <button class="word-link" type="button" data-word="جُرُفٍ" data-root="ج ر ف" data-root-meaning="برداشتن و از میان بردن مقدار فراوانی از چیزی؛ به‌ویژه کندن و بردن خاک بر اثر جریان آب." data-context="کنارهٔ فرسایش‌یافتهٔ زمین؛ در این آیه، با وصف «هار»، کناره‌ای سست و آمادهٔ فروریختن که بنا بر لبهٔ آن نهاده شده است." data-learn-more="/quran-terminology/fa/roots/j-r-f/">جُرُفٍ</button>
    <button class="word-link" type="button" data-word="هارٍ" data-root="ه و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-w-r/" data-root-meaning="فرو ریختن و در آستانه سقوط بودن." data-context="سست و فروریختنی؛ وصف کنارهٔ فرسایش‌یافته.">هارٍ</button>
    <button class="word-link" type="button" data-word="فَانهارَ" data-root="ه و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-w-r/" data-root-meaning="فرو ریختن و در آستانه سقوط بودن." data-context="پس فروریخت؛ وقوع فروپاشی در ادامهٔ تصویر بنا بر کنارهٔ سست.">فَانهارَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="نارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ در ترکیب «آتش جهنم»، سرانجام یادشده در تصویر.">نارِ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت می‌کند؛ با نفی، راهنمایی گروه ستمکار را نفی می‌کند.">يَهدِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروه و مردم؛ کسانی که در ادامه ستمکار توصیف شده‌اند.">القَومَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمکاران؛ وصف مردمی که در پایان آیه از آنان یاد شده است.">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">آیا کسی که بنای خود را بر پروا از آن معبود یگانه و خشنودی او نهاده بهتر است یا کسی که بنای خود را بر لبه پرتگاهی سست نهاده و با او در آتش جهنم فروریخته است؟ و آن معبود یگانه مردم ستمکار را هدایت نمی‌کند.</p>
</section>
