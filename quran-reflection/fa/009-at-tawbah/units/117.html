<section class="ayah-block" id="ayah-117" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="تابَ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی" data-context="روی آورد؛ رحمت و پذیرشِ بازگشتِ گروهِ یادشده.">تابَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="النَّبِىِّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="پیامبر؛ نخستین فردِ یادشده در روی‌آوریِ الهی.">النَّبِىِّ</button>
    <button class="word-link" type="button" data-word="وَالمُهٰجِرينَ" data-root="ه ج ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-j-r/" data-root-meaning="جدا شدن و ترک کردن؛ هجرت: از جایی کوچ کردن." data-context="و مهاجران؛ گروهی که از پیامبر پیروی کردند.">وَالمُهٰجِرينَ</button>
    <button class="word-link" type="button" data-word="وَالأَنصارِ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="و یاران؛ انصاری که پیامبر را همراهی کردند.">وَالأَنصارِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّبَعوهُ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="از او پیروی کردند؛ همراهی با پیامبر در سختی.">اتَّبَعوهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ساعَةِ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="هنگام؛ دورهٔ سختیِ یادشده.">ساعَةِ</button>
    <button class="word-link" type="button" data-word="العُسرَةِ" data-root="ع س ر" data-root-meaning="سختی و تنگنایی که انجام کار، تحمل وضعیت یا دستیابی به نتیجه را دشوار می‌سازد." data-context="دشواری؛ شرایطِ سختی که پیروانِ پیامبر در آن همراهی کردند." data-learn-more="/quran-terminology/fa/roots/ayn-s-r/">العُسرَةِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ ترتیبِ زمانی نسبت به انحرافِ نزدیک‌شده.">بَعدِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كادَ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن" data-context="نزدیک بود؛ بیانِ نزدیک شدن به انحراف.">كادَ</button>
    <button class="word-link" type="button" data-word="يَزيغُ" data-root="ز ي غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-gh/" data-root-meaning="میل و انحراف از مسیر یا استواری." data-context="منحرف شود؛ میلِ دل‌ها از استواری.">يَزيغُ</button>
    <button class="word-link" type="button" data-word="قُلوبُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌ها؛ جایگاهِ انحرافِ نزدیک‌شده.">قُلوبُ</button>
    <button class="word-link" type="button" data-word="فَريقٍ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر" data-context="گروهی؛ بخشی از پیروانِ یادشده.">فَريقٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="تابَ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی" data-context="روی آورد؛ تکرارِ رحمت و پذیرش نسبت به آنان.">تابَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="رَءوفٌ" data-root="ر أ ف" data-learn-more="/quran-terminology/fa/roots/r-a-f/" data-root-meaning="رأفت و رئوف؛ دلسوزی، مهربانی و رعایت حال دیگری، از عاطفه انسانی تا وصف آن معبود یگانه و نبی در قرآن" data-context="بسیار دلسوز؛ وصفِ رأفتِ آن معبود یگانه نسبت به آنان.">رَءوفٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربان؛ وصفِ رحمتِ آن معبود یگانه.">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه به پیامبر و مهاجران و انصار که در هنگام دشواری از او پیروی کردند بازگشت، پس از آنکه نزدیک بود دل‌های گروهی از آنان منحرف شود؛ سپس به آنان بازگشت؛ بی‌گمان او نسبت به آنان رئوف و رحیم است.</p>
</section>
