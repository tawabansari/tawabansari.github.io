<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌های آنان">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="مَرَضٌ" data-root="م ر ض" data-learn-more="/quran-terminology/fa/roots/m-r-dad/" data-root-meaning="بیماری، سستی، نقصان، و خروج از حالت سلامت و اعتدال" data-context="بیماری؛ در سیاق، وضعیتی درونی و نکوهیده">مَرَضٌ</button>
    <button class="word-link" type="button" data-word="فَزادَتهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="پس بر آنان افزود؛ فاعل به سورهٔ نازل‌شده بازمی‌گردد">فَزادَتهُم</button>
    <button class="word-link" type="button" data-word="رِجسًا" data-root="ر ج س" data-learn-more="/quran-terminology/fa/roots/r-j-s/" data-root-meaning="آلودگی و پلیدی، یا چیزی که ناپاک و ناپسند شمرده می‌شود؛ در سیاق‌های مختلف، محسوس، رفتاری و درونی، یا مربوط به پیامد و کیفر." data-context="آلودگیِ افزوده‌شده بر آلودگی پیشین آنان">رِجسًا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رِجسِهِم" data-root="ر ج س" data-learn-more="/quran-terminology/fa/roots/r-j-s/" data-root-meaning="آلودگی و پلیدی، یا چیزی که ناپاک و ناپسند شمرده می‌شود؛ در سیاق‌های مختلف، محسوس، رفتاری و درونی، یا مربوط به پیامد و کیفر." data-context="آلودگیِ پیشین آنان">رِجسِهِم</button>
    <button class="word-link" type="button" data-word="وَماتوا" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="و از دنیا رفتند">وَماتوا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="كٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کافر بودند؛ در حال انکار و نپذیرفتن ایمان">كٰفِرونَ</button>
  </p>
  <p class="farsi-verse">و اما کسانی که در دل‌هایشان بیماری است، پلیدی بر پلیدی‌شان افزوده و در حالی مردند که کافر بودند.</p>
</section>
