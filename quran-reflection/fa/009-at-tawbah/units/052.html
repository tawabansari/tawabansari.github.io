  <p class="farsi-verse">بگو: آیا جز یکی از دو نیکی را برای ما انتظار می‌کشید؟ و ما برای شما انتظار می‌کشیم که آن معبود یگانه عذابی از نزد خود یا به دست ما به شما برساند؛ پس منتظر باشید، ما نیز با شما منتظریم.</p>
