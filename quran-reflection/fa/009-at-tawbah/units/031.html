  <p class="farsi-verse">دانشمندان و راهبان خود و مسیح پسر مریم را به جای آن معبود یگانه ارباب گرفتند، در حالی که جز به پرستش معبودی یگانه فرمان نیافته بودند؛ هیچ معبودی جز او نیست؛ او از آنچه شریک می‌گیرند پاک و برتر است.</p>
