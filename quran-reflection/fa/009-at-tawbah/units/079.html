  <p class="farsi-verse">کسانی که بر مؤمنانی که داوطلبانه صدقه می‌دهند و بر آنان که جز توان خود چیزی نمی‌یابند خرده می‌گیرند و مسخره‌شان می‌کنند؛ آن معبود یگانه آنان را مسخره می‌کند و عذابی دردناک دارند.</p>
