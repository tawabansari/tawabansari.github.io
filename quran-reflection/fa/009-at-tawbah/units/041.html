<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="انفِروا" data-root="ن ف ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="از جا برخاستن و روانه شدن؛ نیز روی‌گردانی و رمیدن.">انفِروا</button>
    <button class="word-link" type="button" data-word="خِفافًا" data-root="خ ف ف" data-learn-more="/quran-terminology/fa/roots/kh-f-f/" data-root-meaning="از سبکی و کاهش بار تا از دست رفتن ثبات">خِفافًا</button>
    <button class="word-link" type="button" data-word="وَثِقالًا" data-root="ث ق ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-q-l/" data-root-meaning="سنگینی، وزن و بار؛ ثقل می‌تواند جسمانی یا مربوط به مسئولیت و دشواری باشد.">وَثِقالًا</button>
    <button class="word-link" type="button" data-word="وَجٰهِدوا" data-root="ج ه د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h2-d/" data-root-meaning="به کار گرفتن توان و کوشش در برابر دشواری؛ جهاد معنای خود را از هدف، شیوه و سیاق می‌گیرد.">وَجٰهِدوا</button>
    <button class="word-link" type="button" data-word="بِأَموٰلِكُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">بِأَموٰلِكُم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسِكُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">وَأَنفُسِكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكُم</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">سبک‌بار و سنگین‌بار حرکت کنید و با اموال و جان‌های خود در راه آن معبود یگانه بکوشید؛ این برای شما بهتر است، اگر بدانید.</p>
</section>
