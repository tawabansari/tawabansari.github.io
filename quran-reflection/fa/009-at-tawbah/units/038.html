  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، شما را چه شده است که چون به شما گفته می‌شود در راه آن معبود یگانه حرکت کنید، به زمین سنگینی می‌کنید؟ آیا به زندگی دنیا به جای آخرت راضی شده‌اید؟ بهره زندگی دنیا در برابر آخرت جز اندکی نیست.</p>
