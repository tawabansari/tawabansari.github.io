    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>

    <button class="word-link" type="button" data-word="مَتٰعُ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">مَتٰعُ</button>

    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَةِ</button>

  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، شما را چه شده است که چون به شما گفته می‌شود در راه آن معبود یگانه حرکت کنید، به زمین سنگینی می‌کنید؟ آیا به زندگی دنیا به جای آخرت راضی شده‌اید؟ بهره زندگی دنیا در برابر آخرت جز اندکی نیست.</p>
</section>
