<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="يَجِدونَ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">يَجِدونَ</button>
    <button class="word-link" type="button" data-word="مَلجَـًٔا" data-root="ل ج أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-j-a/" data-root-meaning="پناه بردن؛ ملجأ: پناهگاه.">مَلجَـًٔا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="مَغٰرٰتٍ" data-root="غ و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-r/" data-root-meaning="فرو رفتن و ژرفا؛ غار و مغاره: پناهگاه یا حفره در کوه.">مَغٰرٰتٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="مُدَّخَلًا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">مُدَّخَلًا</button>
    <button class="word-link" type="button" data-word="لَوَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">لَوَلَّوا</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَجمَحونَ" data-root="ج م ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-m-h/" data-root-meaning="با شتاب و نیروی مهارناپذیر پیش رفتن، مانند اسبِ سرکش.">يَجمَحونَ</button>
  </p>
  <p class="farsi-verse">اگر پناهگاهی یا غارهایی یا راه ورودی‌ای می‌یافتند، شتابان به سوی آن روی می‌آوردند.</p>
</section>
