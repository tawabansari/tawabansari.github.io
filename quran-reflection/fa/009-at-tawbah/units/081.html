<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۸۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَرِحَ" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="شاد شد؛ شادیِ بازماندگان از نرفتن.">فَرِحَ</button>
    <button class="word-link" type="button" data-word="المُخَلَّفونَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="بازماندگان؛ کسانی که در حرکت همراه نشدند.">المُخَلَّفونَ</button>
    <button class="word-link" type="button" data-word="بِمَقعَدِهِم" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار" data-context="به نشستنشان؛ از ماندن و همراه نشدن خود.">بِمَقعَدِهِم</button>
    <button class="word-link" type="button" data-word="خِلٰفَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="برخلاف و در پسِ فرستاده؛ با نرفتن همراه او.">خِلٰفَ</button>
    <button class="word-link" type="button" data-word="رَسولِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادهٔ آن معبود یگانه که آنان همراهش نرفتند.">رَسولِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَكَرِهوا" data-root="ك ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-h2/" data-root-meaning="ناخوش داشتن و دشواری؛ اکراه: واداشتن برخلاف خواست." data-context="و ناخشنود بودند؛ از کوشش با مال و جان.">وَكَرِهوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُجٰهِدوا" data-root="ج ه د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h2-d/" data-root-meaning="به کار گرفتن توان و کوشش در برابر دشواری؛ جهاد معنای خود را از هدف، شیوه و سیاق می‌گیرد." data-context="کوشش کنند؛ در راه آن معبود یگانه با مال و جان به مجاهدت بپردازند.">يُجٰهِدوا</button>
    <button class="word-link" type="button" data-word="بِأَموٰلِهِم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="با دارایی‌هایشان؛ امکانات مالی برای کوشش.">بِأَموٰلِهِم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسِهِم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="و جان‌هایشان؛ مشارکتِ خود آنان در کوشش.">وَأَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ در راه و جهتِ خدمت به آن معبود یگانه.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفتند؛ بازگوییِ توصیهٔ آنان به حرکت نکردن.">وَقالوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَنفِروا" data-root="ن ف ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="از جا برخاستن و روانه شدن؛ نیز روی‌گردانی و رمیدن." data-context="بیرون نروید؛ از حرکت و بسیج در گرما بازمی‌دارند.">تَنفِروا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحَرِّ" data-root="ح ر ر" data-root-meaning="آزادی و رهاسازی یا اختصاص یافتن؛ در شاخهٔ دیگر، گرما و سوزندگی؛ حریر: ابریشم." data-context="گرما؛ گرمای هوا که بازماندگان دلیلِ نرفتن مطرح کردند." data-learn-more="/quran-terminology/fa/roots/h-r-r/">الحَرِّ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان به فرستاده برای پاسخ دادن.">قُل</button>
    <button class="word-link" type="button" data-word="نارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ آتشِ جهنم در مقایسهٔ گرما.">نارُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="شدیدتر؛ شدتِ بیشتر گرمای آتشِ جهنم.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="حَرًّا" data-root="ح ر ر" data-root-meaning="آزادی و رهاسازی یا اختصاص یافتن؛ در شاخهٔ دیگر، گرما و سوزندگی؛ حریر: ابریشم." data-context="گرما؛ گرمای آتشِ جهنم که «أشدّ» شدتِ بیشتر آن را بیان می‌کند." data-learn-more="/quran-terminology/fa/roots/h-r-r/">حَرًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراهِ «می‌فهمیدند» در بیان شرط.">كانوا</button>
    <button class="word-link" type="button" data-word="يَفقَهونَ" data-root="ف ق ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-h2/" data-root-meaning="فهمیدن و دریافت دقیق سخن یا موضوع." data-context="می‌فهمیدند؛ دریافتِ معنای هشدار و مقایسه.">يَفقَهونَ</button>
  </p>
  <p class="farsi-verse">برجای‌ماندگان از نشستن خود پس از رسول آن معبود یگانه شاد شدند و ناخشنود بودند که با اموال و جان‌هایشان در راه آن معبود یگانه بکوشند و گفتند: در گرما حرکت نکنید؛ بگو: آتش جهنم گرم‌تر است؛ اگر می‌فهمیدند.</p>
</section>
