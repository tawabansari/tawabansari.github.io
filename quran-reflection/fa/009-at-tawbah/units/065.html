<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="سَأَلتَهُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="از آنان بپرسی؛ پرسش دربارهٔ رفتار و گفتارشان.">سَأَلتَهُم</button>
    <button class="word-link" type="button" data-word="لَيَقولُنَّ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="حتماً خواهند گفت؛ پاسخِ مؤکدی که از آنان نقل می‌شود.">لَيَقولُنَّ</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودیم؛ همراه مضارع، رفتار گذشتهٔ آنان را بیان می‌کند.">كُنّا</button>
    <button class="word-link" type="button" data-word="نَخوضُ" data-root="خ و ض" data-root-meaning="وارد شدن و حرکت کردن در میان چیزی؛ و در کاربرد گفتاری، وارد بحث یا گفتگو شدن و درگیر شدن با آن." data-context="به گفتگو می‌پرداختیم؛ ادعای گویندگان در توجیه سخن استهزاآمیز." data-learn-more="/quran-terminology/fa/roots/kh-w-dad/">نَخوضُ</button>
    <button class="word-link" type="button" data-word="وَنَلعَبُ" data-root="ل ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-ayn-b/" data-root-meaning="بازی و کاری برای سرگرمی." data-context="و بازی می‌کردیم؛ بخشِ دیگرِ توجیهِ گویندگان.">وَنَلعَبُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمانِ بیانِ پاسخ در برابر توجیه آنان.">قُل</button>
    <button class="word-link" type="button" data-word="أَبِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">أَبِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَءايٰتِهِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="و آیات او؛ در کنار نام آن معبود یگانه و فرستاده‌اش.">وَءايٰتِهِ</button>
    <button class="word-link" type="button" data-word="وَرَسولِهِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و فرستادهٔ او؛ یکی از موضوع‌های استهزای مورد پرسش.">وَرَسولِهِ</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ همراه مضارع، رفتار گذشتهٔ مخاطبان را بیان می‌کند.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَستَهزِءونَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="مسخره می‌کردید؛ توصیف رفتار آنان در پاسخِ آیه.">تَستَهزِءونَ</button>
  </p>
  <p class="farsi-verse">و اگر از آنان بپرسی، حتما می‌گویند: ما تنها به گفت‌وگو و بازی مشغول بودیم؛ بگو: آیا آن معبود یگانه و آیات او و رسولش را مسخره می‌کردید؟</p>
</section>
