<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="نَكَثوا" data-root="ن ك ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-k-th/" data-root-meaning="باز کردن رشته تابیده؛ مجازاً شکستن پیمان." data-context="شکستند؛ نقض سوگندهای پس از پیمان.">نَكَثوا</button>
    <button class="word-link" type="button" data-word="أَيمٰنَهُم" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="سوگندهایشان؛ تعهدهای نقض‌شده.">أَيمٰنَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ زمان نقض نسبت به پیمان.">بَعدِ</button>
    <button class="word-link" type="button" data-word="عَهدِهِم" data-root="ع ه د" data-learn-more="/quran-terminology/fa/roots/ayn-h2-d/" data-root-meaning="شناخت همراه با تعهد، پیمان، نگهداری و پاسخگویی" data-context="پیمانشان؛ تعهد پیشینِ مخاطبان.">عَهدِهِم</button>
    <button class="word-link" type="button" data-word="وَطَعَنوا" data-root="ط ع ن" data-learn-more="/quran-terminology/fa/roots/tt-ayn-n/" data-root-meaning="فروبردن ضربه نافذ، رخنه و جراحت؛ و در کاربرد زبانی، حمله هدفمند به اعتبار، پیمان یا بنیاد دینی" data-context="و طعن زدند؛ تعرض به دین مخاطبان.">وَطَعَنوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="دينِكُم" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دینتان؛ موضوع طعن گروه پیمان‌شکن.">دينِكُم</button>
    <button class="word-link" type="button" data-word="فَقٰتِلوا" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="پس بجنگید؛ واکنشِ بیان‌شده به نقض پیمان و طعن.">فَقٰتِلوا</button>
    <button class="word-link" type="button" data-word="أَئِمَّةَ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="پیشوایان؛ رهبرانِ کفر در این سیاق.">أَئِمَّةَ</button>
    <button class="word-link" type="button" data-word="الكُفرِ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر؛ وصفِ جهت رهبران یادشده.">الكُفرِ</button>
    ۙ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="أَيمٰنَ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="سوگندها؛ در نفی پایبندی آنان به تعهد.">أَيمٰنَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَنتَهونَ" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="دست بکشند؛ توقف پیمان‌شکنی و رفتار خصمانه." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">يَنتَهونَ</button>
  </p>
  <p class="farsi-verse">و اگر پس از پیمانشان سوگندهای خود را شکستند و به دینتان طعنه زدند، با پیشوایان کفر بجنگید؛ زیرا آنان را سوگندی نیست؛ باشد که دست بردارند.</p>
</section>
