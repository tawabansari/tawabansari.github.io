  </p>
  <p class="farsi-verse">آیا آب‌دادن به حاجیان و آبادکردن مسجدالحرام را مانند کسی قرار داده‌اید که به آن معبود یگانه و روز واپسین ایمان آورده و در راه آن معبود یگانه کوشیده است؟ نزد آن معبود یگانه برابر نیستند؛ و آن معبود یگانه مردم ستمکار را هدایت نمی‌کند.</p>
