<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="تابوا" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">تابوا</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَءاتَوُا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَءاتَوُا</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةَ" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">الزَّكوٰةَ</button>
    <button class="word-link" type="button" data-word="فَإِخوٰنُكُم" data-root="أ خ و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر و خواهر؛ و به گسترش معنا، پیوند خویشاوندی، همراهی یا تعلق مشترک.">فَإِخوٰنُكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد">الدّينِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَنُفَصِّلُ" data-root="ف ص ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-sad-l/" data-root-meaning="جدا کردن و تفصیل دادن؛ فصل: جداسازی و داوری.">وَنُفَصِّلُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">پس اگر بازگشتند و صلات را برپا داشتند و زکات دادند، برادران شما در دین‌اند؛ و آیات را برای مردمی که می‌دانند به تفصیل بیان می‌کنیم.</p>
</section>
