<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ وصف گروهِ برتر در درجه.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَهاجَروا" data-root="ه ج ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-j-r/" data-root-meaning="جدا شدن و ترک کردن؛ هجرت: از جایی کوچ کردن." data-context="و هجرت کردند؛ ترک جایگاه پیشین در راه ایمان.">وَهاجَروا</button>
    <button class="word-link" type="button" data-word="وَجٰهَدوا" data-root="ج ه د" data-root-meaning="کوشش جدی و صرف توان در برابر دشواری؛ جَهْد شدت و مشقت، و جُهْد توان و ظرفیت را نیز بیان می‌کند." data-context="و کوشش کردند؛ با مال و جان در راه آن معبود یگانه تلاش ورزیدند." data-learn-more="/quran-terminology/fa/roots/j-h2-d/">وَجٰهَدوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ جهت کوشش.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="بِأَموٰلِهِم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="با دارایی‌هایشان؛ صرف منابع در کوشش.">بِأَموٰلِهِم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسِهِم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="و جان‌هایشان؛ مشارکت شخص خود.">وَأَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="أَعظَمُ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ‌تر؛ وصف درجه آنان.">أَعظَمُ</button>
    <button class="word-link" type="button" data-word="دَرَجَةً" data-root="د ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-r-j/" data-root-meaning="پله و مرتبه؛ درجه‌درجه پیش بردن یا کشاندن." data-context="درجه؛ مرتبه آنان نزد آن معبود یگانه.">دَرَجَةً</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الفائِزونَ" data-root="ف و ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-z/" data-root-meaning="رستگاری، کامیابی و رسیدن به مطلوب با رهایی از خطر." data-context="کامیابان؛ کسانی که به فرجام مطلوب رسیده‌اند.">الفائِزونَ</button>
  </p>
  <p class="farsi-verse">کسانی که ایمان آوردند و هجرت کردند و با اموال و جان‌هایشان در راه آن معبود یگانه کوشیدند، نزد آن معبود یگانه درجه‌ای بزرگ‌تر دارند؛ و آنان همان کامیابان‌اند.</p>
</section>
