<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">يَقولُ</button>
    <button class="word-link" type="button" data-word="ائذَن" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/">ائذَن</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَفتِنّى" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/">تَفتِنّى</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الفِتنَةِ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/">الفِتنَةِ</button>
    <button class="word-link" type="button" data-word="سَقَطوا" data-root="س ق ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَقَطوا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="لَمُحيطَةٌ" data-root="ح و ط" data-learn-more="/quran-terminology/fa/roots/h-w-tt/" data-root-meaning="احاطه کردن، دربرگرفتن، پیرامون چیزی را گرفتن، از همه سو فراگرفتن؛ و در برخی کاربردها، نگاهبانی، مراقبت، یا محاصره">لَمُحيطَةٌ</button>
    <button class="word-link" type="button" data-word="بِالكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">بِالكٰفِرينَ</button>
  </p>
  <p class="farsi-verse">و از آنان کسی است که می‌گوید: به من اجازه بده و مرا به فتنه مینداز؛ آگاه باشید که در فتنه افتاده‌اند؛ و جهنم کافران را دربرگرفته است.</p>
</section>
