<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۰۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="برپا کردند یا اختیار کردند؛ ساختن مسجد با هدف‌های زیان‌بارِ بیان‌شده.">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مَسجِدًا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="مسجدی؛ بنایی با نام و ظاهر محل عبادت که هدف آن در آیه نقد شده است.">مَسجِدًا</button>
    <button class="word-link" type="button" data-word="ضِرارًا" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="برای زیان رساندن؛ یکی از هدف‌های مسجد مورد بحث.">ضِرارًا</button>
    <button class="word-link" type="button" data-word="وَكُفرًا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="و برای کفر؛ یکی از هدف‌های نکوهیدهٔ برپا کردن آن مسجد.">وَكُفرًا</button>
    <button class="word-link" type="button" data-word="وَتَفريقًا" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر" data-context="و برای جدایی افکندن؛ ایجاد تفرقه میان مؤمنان.">وَتَفريقًا</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان؛ بیان رابطهٔ جدایی افکندن میان مؤمنان.">بَينَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمنان؛ کسانی که مسجد مورد بحث برای جدایی افکندن میان آنان برپا شده بود.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَإِرصادًا" data-root="ر ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-sad-d/" data-root-meaning="مراقبت و کمین برای انتظار و مشاهده." data-context="و برای آماده داشتن پایگاهی؛ فراهم کردن جایگاهی برای کسی که پیش‌تر جنگیده بود.">وَإِرصادًا</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="حارَبَ" data-root="ح ر ب" data-root-meaning="جنگ و رویارویی خصمانه؛ سلب دارایی؛ و در شاخهٔ محراب، جایگاه ممتاز و بلند." data-context="جنگیده بود؛ کسی که پیش‌تر با آن معبود یگانه و رسول او به رویارویی خصمانه برخاسته بود." data-learn-more="/quran-terminology/fa/roots/h-r-b/">حارَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و رسول او؛ همراه با آن معبود یگانه، طرفِ رویارویی خصمانهٔ پیشین.">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش‌تر؛ زمان رویارویی خصمانه، پیش از برپا شدن آن مسجد.">قَبلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَيَحلِفُنَّ" data-root="ح ل ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-f/" data-root-meaning="سوگند خوردن و پیمان یا هم‌پیمانی بستن." data-context="و حتماً سوگند خواهند خورد؛ ادعای نیت نیک از سوی برپاکنندگان.">وَلَيَحلِفُنَّ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="أَرَدنا" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="خواستیم؛ ادعای آنان دربارهٔ قصد خود.">أَرَدنا</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الحُسنىٰ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکی؛ آنچه برپاکنندگان ادعا می‌کنند تنها قصدشان بوده است.">الحُسنىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَشهَدُ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهی می‌دهد؛ گواهی آن معبود یگانه دربارهٔ دروغ بودن ادعای آنان.">يَشهَدُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَكٰذِبونَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="قطعاً دروغگویند؛ وصف کسانی که ادعای نیت نیک می‌کنند.">لَكٰذِبونَ</button>
  </p>
  <p class="farsi-verse">و کسانی که مسجدی برای زیان‌رساندن و کفر و جدایی‌افکندن میان مؤمنان و کمینگاه‌ساختن برای کسی که پیش‌تر با آن معبود یگانه و رسولش جنگیده بود برگزیدند؛ و حتما سوگند خواهند خورد که جز نیکی نخواستیم؛ و آن معبود یگانه گواهی می‌دهد که آنان دروغ‌گویند.</p>
</section>
