<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۰۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مَسجِدًا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">مَسجِدًا</button>
    <button class="word-link" type="button" data-word="ضِرارًا" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری">ضِرارًا</button>
    <button class="word-link" type="button" data-word="وَكُفرًا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">وَكُفرًا</button>
    <button class="word-link" type="button" data-word="وَتَفريقًا" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">وَتَفريقًا</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَإِرصادًا" data-root="ر ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-sad-d/" data-root-meaning="مراقبت و کمین برای انتظار و مشاهده.">وَإِرصادًا</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="حارَبَ" data-root="ح ر ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-r-b/" data-root-meaning="حرب: جنگ و رویارویی؛ محراب: جایگاه ویژه و برجسته، و در کاربردهایی محل عبادت.">حارَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَيَحلِفُنَّ" data-root="ح ل ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-f/" data-root-meaning="سوگند خوردن و پیمان یا هم‌پیمانی بستن.">وَلَيَحلِفُنَّ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="أَرَدنا" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">أَرَدنا</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الحُسنىٰ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">الحُسنىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَشهَدُ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">يَشهَدُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَكٰذِبونَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">لَكٰذِبونَ</button>
  </p>
  <p class="farsi-verse">و کسانی که مسجدی برای زیان‌رساندن و کفر و جدایی‌افکندن میان مؤمنان و کمینگاه‌ساختن برای کسی که پیش‌تر با آن معبود یگانه و رسولش جنگیده بود برگزیدند؛ و حتما سوگند خواهند خورد که جز نیکی نخواستیم؛ و آن معبود یگانه گواهی می‌دهد که آنان دروغ‌گویند.</p>
</section>
