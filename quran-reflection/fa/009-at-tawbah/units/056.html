<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَحلِفونَ" data-root="ح ل ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-f/" data-root-meaning="سوگند خوردن و پیمان یا هم‌پیمانی بستن.">وَيَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَمِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمِنكُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِنَّهُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومٌ</button>
    <button class="word-link" type="button" data-word="يَفرَقونَ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">يَفرَقونَ</button>
  </p>
  <p class="farsi-verse">و به آن معبود یگانه سوگند می‌خورند که از شمایند، در حالی که از شما نیستند؛ بلکه مردمی‌اند که می‌ترسند.</p>
</section>
