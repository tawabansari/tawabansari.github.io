<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَحَدٌ" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="یکی؛ یک شخص از گروه یادشده.">أَحَدٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="مشرکان؛ گروهی که ممکن است یکی از آنان پناه بخواهد.">المُشرِكينَ</button>
    <button class="word-link" type="button" data-word="استَجارَكَ" data-root="ج و ر" data-root-meaning="همسایگی و مجاورت؛ پناه دادن و حمایت؛ در شاخهٔ جَوْر، انحراف از راه و عدالت." data-context="از تو پناه خواست؛ درخواست امنیت از سوی شخص یادشده." data-learn-more="/quran-terminology/fa/roots/j-w-r/">استَجارَكَ</button>
    <button class="word-link" type="button" data-word="فَأَجِرهُ" data-root="ج و ر" data-root-meaning="همسایگی و مجاورت؛ پناه دادن و حمایت؛ در شاخهٔ جَوْر، انحراف از راه و عدالت." data-context="او را پناه بده؛ فرمان حمایت از پناه‌خواه." data-learn-more="/quran-terminology/fa/roots/j-w-r/">فَأَجِرهُ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يَسمَعَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="بشنود؛ شنیدن سخن در زمان حمایت.">يَسمَعَ</button>
    <button class="word-link" type="button" data-word="كَلٰمَ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="سخن؛ آنچه پناه‌خواه فرصت شنیدنش را می‌یابد.">كَلٰمَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَبلِغهُ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="او را برسان؛ فرمان رساندن شخص به مقصد امن.">أَبلِغهُ</button>
    <button class="word-link" type="button" data-word="مَأمَنَهُ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="جایگاه امنش؛ مقصدی که باید به آن رسانده شود.">مَأمَنَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="مردمی؛ گروهی که ناآگاهی به آنان نسبت داده شده است.">قَومٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانند؛ دانشی که از آنان نفی می‌شود.">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و اگر یکی از مشرکان از تو پناه خواست، به او پناه بده تا سخن آن معبود یگانه را بشنود؛ سپس او را به جای امنش برسان؛ این بدان سبب است که آنان مردمی‌اند که نمی‌دانند.</p>
</section>
