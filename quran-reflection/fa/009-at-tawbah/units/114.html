<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="استِغفارُ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">استِغفارُ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="لِأَبيهِ" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">لِأَبيهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="مَوعِدَةٍ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">مَوعِدَةٍ</button>
    <button class="word-link" type="button" data-word="وَعَدَها" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعَدَها</button>
    <button class="word-link" type="button" data-word="إِيّاهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِيّاهُ</button>
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="تَبَيَّنَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">تَبَيَّنَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="تَبَرَّأَ" data-root="ب ر أ" data-learn-more="/quran-terminology/fa/roots/b-r-a/" data-root-meaning="پدیدآوردن، رهاشدن از بیماری یا نسبت، پاک‌بودن از اتهام، و اعلام برائت">تَبَرَّأَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="لَأَوّٰهٌ" data-root="أ و ه" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَأَوّٰهٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="ح ل م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَليمٌ</button>
  </p>
  <p class="farsi-verse">و آمرزش‌خواستن ابراهیم برای پدرش تنها به سبب وعده‌ای بود که به او داده بود؛ پس چون برایش روشن شد که او دشمن آن معبود یگانه است، از او بیزاری جست؛ بی‌گمان ابراهیم بسیار آه‌کشنده و بردبار بود.</p>
</section>
