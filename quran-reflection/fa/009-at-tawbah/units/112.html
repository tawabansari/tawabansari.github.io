<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="التّٰئِبونَ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">التّٰئِبونَ</button>
    <button class="word-link" type="button" data-word="العٰبِدونَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">العٰبِدونَ</button>
    <button class="word-link" type="button" data-word="الحٰمِدونَ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">الحٰمِدونَ</button>
    <button class="word-link" type="button" data-word="السّٰئِحونَ" data-root="س ي ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-h/" data-root-meaning="در زمین گشتن و سفر کردن؛ «سائح» در برخی تفسیرها با روزه‌داری نیز توضیح داده شده است.">السّٰئِحونَ</button>
    <button class="word-link" type="button" data-word="الرّٰكِعونَ" data-root="ر ك ع" data-learn-more="/quran-terminology/fa/roots/r-k-ayn/" data-root-meaning="خم شدن، فرود آوردن قامت، پایین آمدن از حالت ایستادگی، و نشان دادن خضوع از راه بدن">الرّٰكِعونَ</button>
    <button class="word-link" type="button" data-word="السّٰجِدونَ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">السّٰجِدونَ</button>
    <button class="word-link" type="button" data-word="الـٔامِرونَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">الـٔامِرونَ</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">بِالمَعروفِ</button>
    <button class="word-link" type="button" data-word="وَالنّاهونَ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده.">وَالنّاهونَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُنكَرِ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص">المُنكَرِ</button>
    <button class="word-link" type="button" data-word="وَالحٰفِظونَ" data-root="ح ف ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-f-zha/" data-root-meaning="نگهداری، مراقبت، به خاطر سپردن و از آسیب محفوظ داشتن.">وَالحٰفِظونَ</button>
    <button class="word-link" type="button" data-word="لِحُدودِ" data-root="ح د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-d-d/" data-root-meaning="مرز و بازدارندگی؛ حدید: آهن؛ حدّت: تیزی؛ محادّه: مخالفت و مقابله.">لِحُدودِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">بازگشت‌کنندگان، پرستندگان، ستایشگران، گردش‌کنندگان، رکوع‌کنندگان، سجده‌کنندگان، فرمان‌دهندگان به معروف و بازدارندگان از منکر و پاسداران حدود آن معبود یگانه؛ و مؤمنان را مژده بده.</p>
</section>
