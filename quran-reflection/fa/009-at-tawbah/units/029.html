    <button class="word-link" type="button" data-word="دينَ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد">دينَ</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">الحَقِّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>

  <p class="farsi-verse">با کسانی از اهل کتاب بجنگید که به آن معبود یگانه و روز واپسین ایمان نمی‌آورند و آنچه آن معبود یگانه و رسولش حرام کرده‌اند حرام نمی‌شمارند و به دین حق گردن نمی‌نهند، تا جزیه را به دست خود بدهند، در حالی که فرودست‌اند.</p>
