<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="خَرَجوا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون می‌رفتند؛ در فرضِ همراهی آنان با شما.">خَرَجوا</button>
    <button class="word-link" type="button" data-word="فيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="زادوكُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="بر شما می‌افزودند؛ در ساخت نفی و استثنا دربارهٔ پیامد حضورشان.">زادوكُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="خَبالًا" data-root="خ ب ل" data-root-meaning="آسیب، فساد و اختلال در سلامت، توانایی یا کارکرد چیزی." data-context="فساد و آشفتگی زیان‌رسان؛ آنچه حضورشان در میان شما می‌افزود." data-learn-more="/quran-terminology/fa/roots/kh-b-l/">خَبالًا</button>
    <button class="word-link" type="button" data-word="وَلَأَوضَعوا" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="و با شتاب در میان شما رفت‌وآمد می‌کردند؛ در فرضِ همراهی آنان.">وَلَأَوضَعوا</button>
    <button class="word-link" type="button" data-word="خِلٰلَكُم" data-root="خ ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-l-l/" data-root-meaning="فاصله و شکاف میان چیزها؛ نیز دوستی نزدیک و پیوند صمیمی." data-context="در میان شما؛ فضای میان اعضای گروه.">خِلٰلَكُم</button>
    <button class="word-link" type="button" data-word="يَبغونَكُمُ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="برای شما می‌جستند؛ در پیِ ایجاد فتنه برای شما.">يَبغونَكُمُ</button>
    <button class="word-link" type="button" data-word="الفِتنَةَ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن" data-context="فتنه و آشوب؛ آنچه در میان شما در پی ایجادش بودند.">الفِتنَةَ</button>
    <button class="word-link" type="button" data-word="وَفيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفيكُم</button>
    <button class="word-link" type="button" data-word="سَمّٰعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="کسانی که به آنان گوش می‌دهند؛ در توضیح دیگر، خبررسانانِ آنان.">سَمّٰعونَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="آگاه است؛ علم آن معبود یگانه به ستمگران.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="بِالظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="به ستمگران؛ کسانی که موضوع علم الهی‌اند.">بِالظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">اگر همراه شما بیرون می‌آمدند، جز آشفتگی بر شما نمی‌افزودند و در میانتان شتاب می‌کردند و برایتان فتنه می‌خواستند؛ و در میان شما کسانی‌اند که به آنان گوش می‌سپارند؛ و آن معبود یگانه به ستمکاران داناست.</p>
</section>
