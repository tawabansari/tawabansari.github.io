  </p>
  <p class="farsi-verse">اگر همراه شما بیرون می‌آمدند، جز آشفتگی بر شما نمی‌افزودند و در میانتان شتاب می‌کردند و برایتان فتنه می‌خواستند؛ و در میان شما کسانی‌اند که به آنان گوش می‌سپارند؛ و آن معبود یگانه به ستمکاران داناست.</p>
