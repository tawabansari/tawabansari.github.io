<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="جٰهِدِ" data-root="ج ه د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جٰهِدِ</button>
    <button class="word-link" type="button" data-word="الكُفّارَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">الكُفّارَ</button>
    <button class="word-link" type="button" data-word="وَالمُنٰفِقينَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/">وَالمُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="وَاغلُظ" data-root="غ ل ظ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَاغلُظ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُم" data-root="أ و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَمَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/">المَصيرُ</button>
  </p>
  <p class="farsi-verse">ای پیامبر، با کافران و منافقان بکوش و بر آنان سخت بگیر؛ و جایگاهشان جهنم است و چه بد سرانجامی است.</p>
