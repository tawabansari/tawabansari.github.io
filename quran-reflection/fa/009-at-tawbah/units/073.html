<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="نبی و پیامبر؛ مخاطبِ فرمان در این آیه.">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="جٰهِدِ" data-root="ج ه د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h2-d/" data-root-meaning="به کار گرفتن توان و کوشش در برابر دشواری؛ جهاد معنای خود را از هدف، شیوه و سیاق می‌گیرد." data-context="مجاهدت و کوشش کن؛ با گروه‌های یادشده مقابله کن.">جٰهِدِ</button>
    <button class="word-link" type="button" data-word="الكُفّارَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفرورزان؛ یکی از گروه‌های مورد خطابِ فرمان.">الكُفّارَ</button>
    <button class="word-link" type="button" data-word="وَالمُنٰفِقينَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="و منافقان؛ گروهِ دارای دوگانگیِ ظاهر و باطن.">وَالمُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="وَاغلُظ" data-root="غ ل ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-zha/" data-root-meaning="ضخامت، سختی و درشتی؛ مادی یا رفتاری، بنا بر سیاق." data-context="و سخت و استوار برخورد کن.">وَاغلُظ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُم" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="جایگاه و محل اقامت یا پناه؛ بدون دلالتِ همیشگی بر امنیت و آسایش." data-context="جایگاه آنان؛ جهنم.">وَمَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="و چه بد است؛ فعلِ نکوهشِ این جایگاه.">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/" data-root-meaning="از رسیدن به یک پایان تا «مصیر»؛ آنچه کار سرانجام به آن می‌رسد" data-context="فرجام و سرانجامی که به آن می‌رسند.">المَصيرُ</button>
  </p>
  <p class="farsi-verse">ای پیامبر، با کافران و منافقان بکوش و بر آنان سخت بگیر؛ و جایگاهشان جهنم است و چه بد سرانجامی است.</p>
</section>
