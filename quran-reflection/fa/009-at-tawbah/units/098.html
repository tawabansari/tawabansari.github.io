  <p class="farsi-verse">و از بادیه‌نشینان کسی است که آنچه انفاق می‌کند زیانی می‌شمارد و برای شما گردش‌های بد روزگار را انتظار می‌کشد؛ گردش بد بر خودشان باد؛ و آن معبود یگانه شنوا و داناست.</p>
