<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="عَرَضًا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">عَرَضًا</button>
    <button class="word-link" type="button" data-word="قَريبًا" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب">قَريبًا</button>
    <button class="word-link" type="button" data-word="وَسَفَرًا" data-root="س ف ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَسَفَرًا</button>
    <button class="word-link" type="button" data-word="قاصِدًا" data-root="ق ص د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قاصِدًا</button>
    <button class="word-link" type="button" data-word="لَاتَّبَعوكَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">لَاتَّبَعوكَ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="بَعُدَت" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعُدَت</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الشُّقَّةُ" data-root="ش ق ق" data-learn-more="/quran-terminology/fa/roots/sh-q-q/" data-root-meaning="شکافتن، رخنه، جانب، مشقت، فاصله و گسست جبهه‌ساز">الشُّقَّةُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَسَيَحلِفونَ" data-root="ح ل ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَسَيَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَوِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَوِ</button>
    <button class="word-link" type="button" data-word="استَطَعنا" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">استَطَعنا</button>
    <button class="word-link" type="button" data-word="لَخَرَجنا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">لَخَرَجنا</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="يُهلِكونَ" data-root="ه ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُهلِكونَ</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَكٰذِبونَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">لَكٰذِبونَ</button>
  </p>
  <p class="farsi-verse">اگر بهره‌ای نزدیک و سفری میانه بود، از تو پیروی می‌کردند؛ ولی راه دشوار بر آنان دور آمد؛ و به آن معبود یگانه سوگند خواهند خورد که اگر می‌توانستیم، با شما بیرون می‌آمدیم؛ خود را نابود می‌کنند و آن معبود یگانه می‌داند که آنان دروغ‌گویند.</p>
</section>
