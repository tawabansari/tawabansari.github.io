<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قٰتِلوهُم" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="با آنان بجنگید؛ گروهی که در سیاق پیشین به پیمان‌شکنی و آغاز دشمنی توصیف شده‌اند.">قٰتِلوهُم</button>
    <button class="word-link" type="button" data-word="يُعَذِّبهُمُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="آنان را عذاب کند.">يُعَذِّبهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِأَيديكُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="به دست شما و از راه اقدام شما.">بِأَيديكُم</button>
    <button class="word-link" type="button" data-word="وَيُخزِهِم" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران" data-context="و آنان را خوار سازد.">وَيُخزِهِم</button>
    <button class="word-link" type="button" data-word="وَيَنصُركُم" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="و شما را در برابر آنان یاری دهد.">وَيَنصُركُم</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَيَشفِ" data-root="ش ف ي" data-learn-more="/quran-terminology/fa/roots/sh-f-y/" data-root-meaning="شفا و بهبودی؛ برطرف کردن بیماری یا رنج، و وسیله‌ای که به این بهبودی کمک می‌کند." data-context="و رنج درونی سینه‌های گروهی مؤمن را برطرف سازد.">وَيَشفِ</button>
    <button class="word-link" type="button" data-word="صُدورَ" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/" data-context="سینه‌ها؛ در این سیاق جایگاه بیان رنج درونی.">صُدورَ</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروهی از مردم.">قَومٍ</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان‌آورندگان؛ وصف گروه یادشده.">مُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">با آنان بجنگید تا آن معبود یگانه به دست شما عذابشان کند و خوارشان سازد و شما را بر آنان یاری دهد و سینه‌های گروهی مؤمن را شفا بخشد.</p>
</section>
