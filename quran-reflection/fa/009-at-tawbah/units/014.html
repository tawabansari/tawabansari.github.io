<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قٰتِلوهُم" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">قٰتِلوهُم</button>
    <button class="word-link" type="button" data-word="يُعَذِّبهُمُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">يُعَذِّبهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِأَيديكُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">بِأَيديكُم</button>
    <button class="word-link" type="button" data-word="وَيُخزِهِم" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران">وَيُخزِهِم</button>
    <button class="word-link" type="button" data-word="وَيَنصُركُم" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">وَيَنصُركُم</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَيَشفِ" data-root="ش ف ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَشفِ</button>
    <button class="word-link" type="button" data-word="صُدورَ" data-root="ص د ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صُدورَ</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومٍ</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">مُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">با آنان بجنگید تا آن معبود یگانه به دست شما عذابشان کند و خوارشان سازد و شما را بر آنان یاری دهد و سینه‌های گروهی مؤمن را شفا بخشد.</p>
</section>
