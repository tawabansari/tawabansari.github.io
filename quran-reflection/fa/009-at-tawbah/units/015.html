<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُذهِب" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">وَيُذهِب</button>
    <button class="word-link" type="button" data-word="غَيظَ" data-root="غ ي ظ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَيظَ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/">قُلوبِهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَيَتوبُ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/">وَيَتوبُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/">حَكيمٌ</button>
  </p>
  <p class="farsi-verse">و خشم دل‌هایشان را ببرد؛ و آن معبود یگانه به هرکه بخواهد بازمی‌گردد؛ و آن معبود یگانه دانا و حکیم است.</p>
</section>
