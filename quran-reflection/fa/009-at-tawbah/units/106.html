<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاخَرونَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">وَءاخَرونَ</button>
    <button class="word-link" type="button" data-word="مُرجَونَ" data-root="ر ج أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-a/" data-root-meaning="به تأخیر انداختن و مهلت دادن؛ در برخی صورت‌ها همزه تلفظ نمی‌شود.">مُرجَونَ</button>
    <button class="word-link" type="button" data-word="لِأَمرِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">لِأَمرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِمّا</button>
    <button class="word-link" type="button" data-word="يُعَذِّبُهُم" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">يُعَذِّبُهُم</button>
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="يَتوبُ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">يَتوبُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">حَكيمٌ</button>
  </p>
  <p class="farsi-verse">و دیگرانی به فرمان آن معبود یگانه واگذاشته شده‌اند؛ یا عذابشان می‌کند یا به آنان بازمی‌گردد؛ و آن معبود یگانه دانا و حکیم است.</p>
</section>
