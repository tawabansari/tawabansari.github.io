<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّمَا</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتُ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="صدقات؛ منابع مالیِ موضوعِ تقسیم در آیه.">الصَّدَقٰتُ</button>
    <button class="word-link" type="button" data-word="لِلفُقَراءِ" data-root="ف ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-r/" data-root-meaning="نیاز و تهیدستی؛ فاقره: گرفتاری کمرشکن." data-context="برای تهیدستان؛ یکی از گروه‌های دریافت‌کننده.">لِلفُقَراءِ</button>
    <button class="word-link" type="button" data-word="وَالمَسٰكينِ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="و نیازمندان؛ گروه دیگری در مصارف صدقات.">وَالمَسٰكينِ</button>
    <button class="word-link" type="button" data-word="وَالعٰمِلينَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="و کارگزاران؛ کسانی که عهده‌دار ادارهٔ صدقات‌اند.">وَالعٰمِلينَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="وَالمُؤَلَّفَةِ" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أَلَّفَ؛ پیوند دادن، خو گرفتن و برقرار شدن انس و همراهی" data-context="و کسانی که پیوند داده می‌شوند؛ در ترکیب با «قلوبهم».">وَالمُؤَلَّفَةِ</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌هایشان؛ موضوعِ پیوند و انس در عبارت قبل.">قُلوبُهُم</button>
    <button class="word-link" type="button" data-word="وَفِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفِى</button>
    <button class="word-link" type="button" data-word="الرِّقابِ" data-root="ر ق ب" data-root-meaning="زیر نظر داشتن، مراقبت، انتظار و رعایت؛ رقبة: گردن و به کنایه، تمام شخص یا انسان در بند." data-context="انسان‌های در بند؛ بخشی از صدقات برای رهایی آنان اختصاص می‌یابد، با اختلاف تفسیری دربارهٔ شیوهٔ اجرای آن." data-learn-more="/quran-terminology/fa/roots/r-q-b/">الرِّقابِ</button>
    <button class="word-link" type="button" data-word="وَالغٰرِمينَ" data-root="غ ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-m/" data-root-meaning="زیان یا دِینِ لازم؛ غرام: رنج یا وابستگیِ رها‌نشدنی." data-context="و بدهکاران؛ گروهی از دریافت‌کنندگان منابع مالی.">وَالغٰرِمينَ</button>
    <button class="word-link" type="button" data-word="وَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ در ترکیب «سبیل الله» در مصارف صدقات.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَابنِ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="و فرزند؛ در ترکیب کنایی «ابن السبیل»، مسافرِ درراه‌مانده.">وَابنِ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ جزء دومِ تعبیر «ابن السبیل» برای مسافر.">السَّبيلِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَريضَةً" data-root="ف ر ض" data-learn-more="/quran-terminology/fa/roots/f-r-dad/" data-root-meaning="از نشانه‌گذاری و تعیین سهم تا امر مقرر" data-context="فریضه و تکلیف مقرر؛ وصفِ این تقسیم از سوی آن معبود یگانه.">فَريضَةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصف آن معبود یگانه.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="حکیم؛ وصف آن معبود یگانه در پایان حکم.">حَكيمٌ</button>
  </p>
  <p class="farsi-verse">صدقات تنها برای فقیران و نیازمندان و کارگزاران آن و کسانی است که دل‌هایشان پیوند داده می‌شود و برای آزادکردن گردن‌ها و بدهکاران و در راه آن معبود یگانه و درراه‌مانده؛ فریضه‌ای از سوی آن معبود یگانه؛ و آن معبود یگانه دانا و حکیم است.</p>
</section>
