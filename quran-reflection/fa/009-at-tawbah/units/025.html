<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="نَصَرَكُمُ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="شما را یاری کرد؛ در جایگاه‌های گوناگون.">نَصَرَكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مَواطِنَ" data-root="و ط ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-tt-n/" data-root-meaning="جای اقامت یا استقرار؛ مواطن: جایگاه‌ها و عرصه‌ها." data-context="جایگاه‌ها و موقعیت‌ها؛ عرصه‌های یاری.">مَواطِنَ</button>
    <button class="word-link" type="button" data-word="كَثيرَةٍ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بسیار؛ وصفِ جایگاه‌ها.">كَثيرَةٍ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روز؛ در اشاره به حنین.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="حُنَينٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">حُنَينٍ</button>
    ۙ
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="أَعجَبَتكُم" data-root="ع ج ب" data-root-meaning="شگفتی و بزرگ یا غیرمعمول یافتن؛ در اعجاب، جلب پسند یا تأثیر گذاشتن؛ و در کاربردِ عُجب، خودپسندی." data-context="شما را خوش آمد؛ شمار زیادِ خودتان در حنین." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/">أَعجَبَتكُم</button>
    <button class="word-link" type="button" data-word="كَثرَتُكُم" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="شمار زیادتان؛ آنچه موجب اعجاب شد.">كَثرَتُكُم</button>
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَم</button>
    <button class="word-link" type="button" data-word="تُغنِ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="بی‌نیاز و برخوردار نساخت؛ فراوانی سودی نداشت.">تُغنِ</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنكُم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هیچ چیزی؛ نفیِ هرگونه سودِ آن فراوانی.">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَضاقَت" data-root="ض ي ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-y-q/" data-root-meaning="تنگی و در تنگنا بودن یا قرار دادن." data-context="و تنگ شد؛ دربارهٔ زمین.">وَضاقَت</button>
    <button class="word-link" type="button" data-word="عَلَيكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُمُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ با وجود فراخی، تنگ احساس شد.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="رَحُبَت" data-root="ر ح ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-h-b/" data-root-meaning="گستردگی و فراخی؛ مرحبا: خوشامدگویی." data-context="فراخ بود؛ وصفِ زمین.">رَحُبَت</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="وَلَّيتُم" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="پشت کردید و بازگشتید.">وَلَّيتُم</button>
    <button class="word-link" type="button" data-word="مُدبِرينَ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت‌کنان؛ حالتِ عقب‌نشینی.">مُدبِرينَ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه شما را در جایگاه‌های بسیاری یاری کرد و در روز حنین، هنگامی که فزونی‌تان شما را به شگفت آورد، ولی هیچ سودی برایتان نداشت و زمین با همه فراخی‌اش بر شما تنگ شد؛ سپس پشت‌کنان روی گرداندید.</p>
</section>
