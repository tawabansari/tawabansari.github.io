  <p class="farsi-verse">آن معبود یگانه شما را در جایگاه‌های بسیاری یاری کرد و در روز حنین، هنگامی که فزونی‌تان شما را به شگفت آورد، ولی هیچ سودی برایتان نداشت و زمین با همه فراخی‌اش بر شما تنگ شد؛ سپس پشت‌کنان روی گرداندید.</p>
