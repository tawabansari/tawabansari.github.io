  <p class="farsi-verse">چون نزد آنان بازگردید، برایتان عذر می‌آورند؛ بگو: عذر نیاورید، هرگز شما را باور نمی‌کنیم؛ آن معبود یگانه ما را از خبرهایتان آگاه کرده است؛ و آن معبود یگانه و رسولش عمل شما را خواهند دید؛ سپس به سوی دانای نهان و آشکار بازگردانده می‌شوید و شما را از آنچه می‌کردید خبر می‌دهد.</p>
