  <p class="farsi-verse">و از آنان کسانی‌اند که پیامبر را می‌آزارند و می‌گویند: او گوش است؛ بگو: گوشی برای خیر شماست؛ به آن معبود یگانه ایمان دارد و مؤمنان را باور می‌کند و برای کسانی از شما که ایمان آورده‌اند رحمتی است؛ و کسانی که رسول آن معبود یگانه را می‌آزارند، عذابی دردناک دارند.</p>
