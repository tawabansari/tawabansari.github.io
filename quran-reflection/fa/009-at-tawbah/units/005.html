  <p class="farsi-verse">پس هنگامی که ماه‌های حرام سپری شد، مشرکان را هرجا یافتید بکشید و آنان را بگیرید و محاصره کنید و در هر کمینگاهی برایشان بنشینید؛ پس اگر بازگشتند و صلات را برپا داشتند و زکات دادند، راهشان را باز بگذارید؛ بی‌گمان آن معبود یگانه آمرزنده و رحیم است.</p>
