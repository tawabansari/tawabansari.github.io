<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="انسَلَخَ" data-root="س ل خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-kh/" data-root-meaning="پوست کندن و جدا ساختن پوشش؛ مجازاً بیرون آمدن یا پایان یافتن.">انسَلَخَ</button>
    <button class="word-link" type="button" data-word="الأَشهُرُ" data-root="ش ه ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/" data-root-meaning="ماه به‌عنوان دوره زمانی.">الأَشهُرُ</button>
    <button class="word-link" type="button" data-word="الحُرُمُ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت">الحُرُمُ</button>
    <button class="word-link" type="button" data-word="فَاقتُلُوا" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">فَاقتُلُوا</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد">المُشرِكينَ</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَيثُ</button>
    <button class="word-link" type="button" data-word="وَجَدتُموهُم" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">وَجَدتُموهُم</button>
    <button class="word-link" type="button" data-word="وَخُذوهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">وَخُذوهُم</button>
    <button class="word-link" type="button" data-word="وَاحصُروهُم" data-root="ح ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sad-r/" data-root-meaning="در تنگنا قرار دادن، بازداشتن و محصور کردن؛ حصور: خویشتن‌دار.">وَاحصُروهُم</button>
    <button class="word-link" type="button" data-word="وَاقعُدوا" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار">وَاقعُدوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="مَرصَدٍ" data-root="ر ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-sad-d/" data-root-meaning="مراقبت و کمین برای انتظار و مشاهده.">مَرصَدٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="تابوا" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">تابوا</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَءاتَوُا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَءاتَوُا</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةَ" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">الزَّكوٰةَ</button>
    <button class="word-link" type="button" data-word="فَخَلّوا" data-root="خ ل و" data-learn-more="/quran-terminology/fa/roots/kh-l-w/" data-root-meaning="خالی شدن، خلوت کردن، کنار رفتن از جمع، تنها شدن، رها شدن از مانع، و جدا شدن از میدان آشکار">فَخَلّوا</button>
    <button class="word-link" type="button" data-word="سَبيلَهُم" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">پس هنگامی که ماه‌های حرام سپری شد، مشرکان را هرجا یافتید بکشید و آنان را بگیرید و محاصره کنید و در هر کمینگاهی برایشان بنشینید؛ پس اگر بازگشتند و صلات را برپا داشتند و زکات دادند، راهشان را باز بگذارید؛ بی‌گمان آن معبود یگانه آمرزنده و رحیم است.</p>
</section>
