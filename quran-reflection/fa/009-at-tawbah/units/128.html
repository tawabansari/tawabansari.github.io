  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="جاءَكُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَكُم</button>
    <button class="word-link" type="button" data-word="رَسولٌ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رَسولٌ</button>

    <button class="word-link" type="button" data-word="أَنفُسِكُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">أَنفُسِكُم</button>

    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَنِتُّم" data-root="ع ن ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَنِتُّم</button>
    <button class="word-link" type="button" data-word="حَريصٌ" data-root="ح ر ص" data-learn-more="/quran-terminology/fa/roots/h-r-sad/" data-root-meaning="حَرَصَ؛ سخت خواستن و اهتمام شدید به یک مطلوب">حَريصٌ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="بِالمُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">بِالمُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="رَءوفٌ" data-root="ر أ ف" data-learn-more="/quran-terminology/fa/roots/r-a-f/" data-root-meaning="رأفت و رئوف؛ دلسوزی، مهربانی و رعایت حال دیگری، از عاطفه انسانی تا وصف آن معبود یگانه و نبی در قرآن">رَءوفٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">رسولی از خودتان نزد شما آمده است؛ رنج شما بر او گران است، بر شما حریص است و نسبت به مؤمنان رئوف و رحیم است.</p>
