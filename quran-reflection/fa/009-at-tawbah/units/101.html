    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>

  </p>
  <p class="farsi-verse">و از بادیه‌نشینان پیرامون شما منافقانی هستند و از اهل مدینه نیز؛ بر نفاق خو گرفته‌اند؛ تو آنان را نمی‌شناسی، ما می‌شناسیم؛ دو بار عذابشان خواهیم کرد، سپس به عذابی بزرگ بازگردانده می‌شوند.</p>
