<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۱۰۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمَّن</button>
    <button class="word-link" type="button" data-word="حَولَكُم" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها">حَولَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَعرابِ" data-root="ع ر ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-b/" data-root-meaning="عربی: وابسته به زبان یا مردم عرب؛ اعراب: بادیه‌نشینان؛ عُرُب: مهرورز و دلبسته.">الأَعرابِ</button>
    <button class="word-link" type="button" data-word="مُنٰفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">مُنٰفِقونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="أَهلِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلِ</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-d-n/" data-root-meaning="مدینه: شهر و آبادی؛ تحلیل آن از «مدن» یا «دین» اختلافی است.">المَدينَةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="مَرَدوا" data-root="م ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-d/" data-root-meaning="برهنگی و صافی؛ تمرّد: سرکشی و خو گرفتن به نافرمانی.">مَرَدوا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="النِّفاقِ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">النِّفاقِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمُهُم" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">تَعلَمُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="نَعلَمُهُم" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">نَعلَمُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="سَنُعَذِّبُهُم" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">سَنُعَذِّبُهُم</button>
    <button class="word-link" type="button" data-word="مَرَّتَينِ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت.">مَرَّتَينِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُرَدّونَ" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر">يُرَدّونَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="عَذابٍ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابٍ</button>
    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">عَظيمٍ</button>
  </p>
  <p class="farsi-verse">و از بادیه‌نشینان پیرامون شما منافقانی هستند و از اهل مدینه نیز؛ بر نفاق خو گرفته‌اند؛ تو آنان را نمی‌شناسی، ما می‌شناسیم؛ دو بار عذابشان خواهیم کرد، سپس به عذابی بزرگ بازگردانده می‌شوند.</p>
</section>
