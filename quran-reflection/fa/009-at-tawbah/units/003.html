  <p class="farsi-verse">و اعلامی از سوی آن معبود یگانه و رسولش به مردم در روز حج بزرگ که آن معبود یگانه از مشرکان بیزار است و رسولش نیز؛ پس اگر بازگردید، برایتان بهتر است؛ و اگر روی گردانید، بدانید که نمی‌توانید آن معبود یگانه را درمانده کنید؛ و کافران را به عذابی دردناک مژده ده.</p>
