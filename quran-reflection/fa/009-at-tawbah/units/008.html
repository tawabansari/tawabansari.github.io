  <p class="farsi-verse">چگونه، در حالی که اگر بر شما چیره شوند، درباره شما نه خویشاوندی را رعایت می‌کنند و نه پیمانی را؟ با دهان‌هایشان خشنودتان می‌کنند و دل‌هایشان نمی‌پذیرد؛ و بیشترشان نافرمان‌اند.</p>
