<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَليَضحَكوا" data-root="ض ح ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-h-k/" data-root-meaning="خندیدن و آشکار شدن شادی." data-context="پس بگذار اندک بخندند؛ در سیاق هشدار به کسانی که از همراهی پیامبر سر باز زدند.">فَليَضحَكوا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندک؛ مقدار خنده در برابر گریستن بسیار.">قَليلًا</button>
    <button class="word-link" type="button" data-word="وَليَبكوا" data-root="ب ك ي" data-root-meaning="«ب ک ي» به گریستن اشاره دارد؛ بروز حالتی که می‌تواند با اشک، صدای زاری یا اندوه و تاثر همراه باشد. در ساختمان سببی، به گریاندن یا سبب گریستن شدن می‌رسد." data-context="و بسیار بگریند؛ بیان تهدید و جزای کردار گروه مورد بحث، نه فرمانی عمومی برای گریستن." data-learn-more="/quran-terminology/fa/roots/b-k-y/">وَليَبكوا</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بسیار؛ مقدار گریستن در برابر خندیدن اندک.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="جَزاءً" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="جزا و پاسخ متناسب با کردارشان.">جَزاءً</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه فعل بعد، استمرار کردار آنان در گذشته را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان" data-context="به دست می‌آوردند؛ کردارهایی که پیامد و جزای آنها به خودشان بازمی‌گردد.">يَكسِبونَ</button>
  </p>
  <p class="farsi-verse">پس اندک بخندند و بسیار بگریند، به جزای آنچه به دست می‌آوردند.</p>
</section>
