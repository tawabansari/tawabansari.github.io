<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَسيحوا" data-root="س ي ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَسيحوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="أَربَعَةَ" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی">أَربَعَةَ</button>
    <button class="word-link" type="button" data-word="أَشهُرٍ" data-root="ش ه ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَشهُرٍ</button>
    <button class="word-link" type="button" data-word="وَاعلَموا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">وَاعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّكُم</button>
    <button class="word-link" type="button" data-word="غَيرُ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">غَيرُ</button>
    <button class="word-link" type="button" data-word="مُعجِزِى" data-root="ع ج ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُعجِزِى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مُخزِى" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران">مُخزِى</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرينَ</button>
  </p>
  <p class="farsi-verse">پس چهار ماه در زمین گردش کنید و بدانید که نمی‌توانید آن معبود یگانه را درمانده کنید و آن معبود یگانه خوارکننده کافران است.</p>
</section>
