<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که؛ زمان داغ شدن اندوخته‌ها و داغ گذاشتن با آنها را معرفی می‌کند.">يَومَ</button>
    <button class="word-link" type="button" data-word="يُحمىٰ" data-root="ح م ي" data-root-meaning="گرما و داغ شدن؛ حفاظت و بازداشتن آسیب یا دسترسی؛ حمیه: غیرت، برانگیختگی و تعصب." data-context="بر آن آتش افروخته و آن داغ می‌شود؛ دربارهٔ طلا و نقرهٔ اندوخته‌شده." data-learn-more="/quran-terminology/fa/roots/h-m-y/">يُحمىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="نارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ آتشی که اندوخته‌ها در آن داغ می‌شوند.">نارِ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="فَتُكوىٰ" data-root="ك و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-w-y/" data-root-meaning="داغ کردن و سوزاندن با گرما یا فلز داغ." data-context="پس با آن داغ گذاشته می‌شود؛ پیشانی‌ها، پهلوها و پشت‌ها با اندوختهٔ داغ‌شده سوزانده می‌شوند.">فَتُكوىٰ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="جِباهُهُم" data-root="ج ب ه" data-root-meaning="پیشانی و بخش پیشین چهره؛ در کاربردهای گسترش‌یافته: رویارویی، برخورد مستقیم و جایگاه پیشرو." data-context="پیشانی‌های آنان؛ یکی از سه بخش بدن که در آیه از داغ گذاشتن بر آنها سخن رفته است." data-learn-more="/quran-terminology/fa/roots/j-b-h2/">جِباهُهُم</button>
    <button class="word-link" type="button" data-word="وَجُنوبُهُم" data-root="ج ن ب" data-root-meaning="پهلو، کنار و جانب؛ فاصله گرفتن، دور ساختن و پرهیز کردن. «جُنُب» در سیاق طهارت، وضعیتِ نیازمند پاک شدن است." data-context="و پهلوهای آنان؛ دومین بخش بدن که داغ گذاشتن بر آن ذکر شده است." data-learn-more="/quran-terminology/fa/roots/j-n-b/">وَجُنوبُهُم</button>
    <button class="word-link" type="button" data-word="وَظُهورُهُم" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی" data-context="و پشت‌های آنان؛ سومین بخش بدن که داغ گذاشتن بر آن ذکر شده است.">وَظُهورُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كَنَزتُم" data-root="ك ن ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-z/" data-root-meaning="گرد آوردن و ذخیره کردن مال." data-context="اندوختید؛ خطاب به کسانی که این مال را برای خود گرد آوردند و ذخیره کردند.">كَنَزتُم</button>
    <button class="word-link" type="button" data-word="لِأَنفُسِكُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="برای خودتان؛ کسانی که مال را به سود خویش اندوخته بودند.">لِأَنفُسِكُم</button>
    <button class="word-link" type="button" data-word="فَذوقوا" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="پس بچشید؛ فرمانِ تجربه کردن پیامد رنج‌آور آنچه می‌اندوختند.">فَذوقوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ همراه با فعل پس از خود، رفتارِ اندوختن آنان در گذشته را بیان می‌کند.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَكنِزونَ" data-root="ك ن ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-z/" data-root-meaning="گرد آوردن و ذخیره کردن مال." data-context="می‌اندوختید؛ مال را گرد می‌آوردید و ذخیره می‌کردید.">تَكنِزونَ</button>
  </p>
  <p class="farsi-verse">روزی که آن را در آتش جهنم داغ کنند و با آن پیشانی‌ها و پهلوها و پشت‌هایشان را داغ بگذارند: این همان است که برای خود اندوختید؛ پس آنچه را می‌اندوختید بچشید.</p>
</section>
