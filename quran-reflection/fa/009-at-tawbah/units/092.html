<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">التوبه ۹:۹۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَتَوكَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="نزد تو آمدند؛ برای درخواستِ وسیلهٔ سواری.">أَتَوكَ</button>
    <button class="word-link" type="button" data-word="لِتَحمِلَهُم" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="تا آنان را سوار کنی؛ وسیلهٔ همراهی را فراهم سازی." data-learn-more="/quran-terminology/fa/roots/h-m-l/">لِتَحمِلَهُم</button>
    <button class="word-link" type="button" data-word="قُلتَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتی؛ پاسخ به درخواست وسیلهٔ سواری.">قُلتَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="أَجِدُ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="نمی‌یابم؛ وسیله‌ای که آنان را بر آن سوار کنم.">أَجِدُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَحمِلُكُم" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="شما را سوار کنم؛ بر وسیله‌ای که فراهم نشده است." data-learn-more="/quran-terminology/fa/roots/h-m-l/">أَحمِلُكُم</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="بازگشتند و روی برتافتند؛ پس از روشن شدن نبودِ وسیله.">تَوَلَّوا</button>
    <button class="word-link" type="button" data-word="وَأَعيُنُهُم" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="و چشم‌هایشان؛ مبتدای جمله‌ای که جریان اشک را توصیف می‌کند.">وَأَعيُنُهُم</button>
    <button class="word-link" type="button" data-word="تَفيضُ" data-root="ف ي ض" data-root-meaning="روان شدن و به جریان افتادن؛ گاه همراه با فراوانی و سرریز؛ و در کاربردهای گسترده‌تر، حرکت جمعی یا پیش رفتن در گفتار و فعالیت." data-context="چشم‌هایشان از اشک سرازیر می‌شود؛ از اندوه نداشتن وسیله و هزینهٔ لازم برای همراهی." data-learn-more="/quran-terminology/fa/roots/f-y-dad/">تَفيضُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الدَّمعِ" data-root="د م ع" data-learn-more="/quran-terminology/fa/roots/d-m-ayn/" data-root-meaning="اشک چشم و جاری شدن آن؛ در کاربردهای گسترش‌یافته، تراوش مایع و سرریز شدن." data-context="اشک؛ جریان آن با اندوه آنان پیوند دارد.">الدَّمعِ</button>
    <button class="word-link" type="button" data-word="حَزَنًا" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون" data-context="از اندوه؛ به سبب نیافتن چیزی برای هزینه کردن.">حَزَنًا</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="يَجِدوا" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="نیابند؛ چیزی برای تأمین هزینهٔ همراهی.">يَجِدوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="هزینه کنند؛ آنچه برای همراهی نیاز است.">يُنفِقونَ</button>
  </p>
  <p class="farsi-verse">و نه بر کسانی که چون نزد تو آمدند تا آنان را سوار کنی، گفتی: چیزی نمی‌یابم که شما را بر آن سوار کنم؛ برگشتند، در حالی که چشم‌هایشان از اندوه اینکه چیزی برای انفاق نمی‌یافتند اشک می‌ریخت.</p>
</section>
