  <p class="farsi-verse">و چون به آنان گفته شود: از آنچه آن معبود یگانه فرو فرستاده پیروی کنید، می‌گویند: بلکه از آنچه پدرانمان را بر آن یافته‌ایم پیروی می‌کنیم. آیا حتی اگر شیطان آنان را به عذاب آتش فروزان فرابخواند؟</p>
