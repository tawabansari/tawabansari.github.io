  </p>
  <p class="farsi-verse">و چون موجی همچون سایه‌بان‌ها آنان را فراگیرد، آن معبود یگانه را می‌خوانند، در حالی که دین را برای او خالص می‌کنند؛ پس چون آنان را به خشکی برهاند، برخی از آنان میانه‌رو هستند. و نشانه‌های ما را جز هر پیمان‌شکن ناسپاسی انکار نمی‌کند.</p>
