<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">لقمان ۳۱:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="غَشِيَهُم" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش" data-context="آنان را فراگرفت؛ موج بر آنان پوشش و احاطه یافت.">غَشِيَهُم</button>
    <button class="word-link" type="button" data-word="مَوجٌ" data-root="م و ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-w-j/" data-root-meaning="موج و حرکت موج‌وار." data-context="موج؛ آب برخاسته‌ای که همچون سایه‌بان آنان را فرا می‌گیرد.">مَوجٌ</button>
    <button class="word-link" type="button" data-word="كَالظُّلَلِ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="همچون سایه‌بان‌ها؛ تشبیه موج‌های فراگیر به پوشش‌های بالای سر.">كَالظُّلَلِ</button>
    <button class="word-link" type="button" data-word="دَعَوُا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="خواندند؛ در خطر، آن معبود یگانه را برای یاری خواندند.">دَعَوُا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مُخلِصينَ" data-root="خ ل ص" data-learn-more="/quran-terminology/fa/roots/kh-l-sad/" data-root-meaning="جدا شدن از آمیختگی؛ از خلوص تا اختصاص" data-context="خالص‌کنندگان؛ خواندن و بندگی را در آن وضعیت برای او ویژه می‌کنند.">مُخلِصينَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="الدّينَ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دین؛ بندگی و روی‌آوردنی که برای او خالص می‌کنند.">الدّينَ</button>
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="نَجّىٰهُم" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن" data-context="آنان را نجات داد؛ رهایی از خطر دریا و رساندن به خشکی.">نَجّىٰهُم</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="ب ر ر" data-learn-more="/quran-terminology/fa/roots/b-r-r/" data-root-meaning="نیکی گسترده، راست‌کرداری، وفاداری، احسان، گشودگی در خیر، و ایستادن بر زمین استوار اخلاقی" data-context="خشکی؛ جای امن پس از خطر دریا.">البَرِّ</button>
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="مُقتَصِدٌ" data-root="ق ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-d/" data-root-meaning="قصد و رو به هدف رفتن؛ نیز میانه‌روی و اعتدال." data-context="میانه‌رو؛ وصف برخی از نجات‌یافتگان، با اختلاف تفسیری درباره حد و نوع این میانه‌روی.">مُقتَصِدٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَجحَدُ" data-root="ج ح د" data-root-meaning="انکار و نپذیرفتن چیزی که موضوع اقرار و پذیرش است؛ در کاربرد برجسته آن، انکار با وجود شناخت حقیقت." data-context="انکار می‌کند؛ رد نشانه‌های ما که با پیمان‌شکنی و ناسپاسی همراه شده است." data-learn-more="/quran-terminology/fa/roots/j-h-d/">يَجحَدُ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌های ما؛ موضوع انکار در پایان آیه.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ در ساخت حصر، وصف افراد پیمان‌شکن و ناسپاس را فراگیر می‌کند.">كُلُّ</button>
    <button class="word-link" type="button" data-word="خَتّارٍ" data-root="خ ت ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-t-r/" data-root-meaning="پیمان‌شکنی و خیانت شدید." data-context="بسیار پیمان‌شکن؛ وصف خیانت و غدر در کسی که نشانه‌ها را انکار می‌کند.">خَتّارٍ</button>
    <button class="word-link" type="button" data-word="كَفورٍ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="بسیار ناسپاس؛ وصف کفران در کنار پیمان‌شکنی و انکار.">كَفورٍ</button>
  </p>
  <p class="farsi-verse">و چون موجی همچون سایه‌بان‌ها آنان را فراگیرد، آن معبود یگانه را می‌خوانند، در حالی که دین را برای او خالص می‌کنند؛ پس چون آنان را به خشکی برهاند، برخی از آنان میانه‌رو هستند. و نشانه‌های ما را جز هر پیمان‌شکن ناسپاسی انکار نمی‌کند.</p>
</section>
