  <p class="farsi-verse">و از مردم کسی است که سخن سرگرم‌کننده را می‌خرد تا بی‌هیچ دانشی از راه آن معبود یگانه گمراه کند و آن را به ریشخند بگیرد. آنان عذابی خوارکننده دارند.</p>
