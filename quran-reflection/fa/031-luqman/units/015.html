  <p class="farsi-verse">و اگر آن دو بکوشند تا چیزی را که بدان دانشی نداری شریک من قرار دهی، از آن دو اطاعت مکن؛ و در دنیا به نیکی با آن دو همراهی کن و راه کسی را پیروی کن که به سوی من بازگشته است. سپس بازگشت شما به سوی من است؛ پس شما را از آنچه می‌کردید آگاه می‌کنم.</p>
