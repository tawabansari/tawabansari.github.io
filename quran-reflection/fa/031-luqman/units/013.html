<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">لقمان ۳۱:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالَ</button>
    <button class="word-link" type="button" data-word="لُقمٰنُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لُقمٰنُ</button>
    <button class="word-link" type="button" data-word="لِابنِهِ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">لِابنِهِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="يَعِظُهُ" data-root="و ع ظ" data-learn-more="/quran-terminology/fa/roots/w-ayn-zha/">يَعِظُهُ</button>

    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُشرِك" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">تُشرِك</button>

    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشِّركَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">الشِّركَ</button>

    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/">عَظيمٌ</button>
  </p>
  <p class="farsi-verse">و آنگاه که لقمان به پسرش، در حالی که او را پند می‌داد، گفت: ای پسرکم، برای آن معبود یگانه شریک قرار مده؛ همانا شرک ستمی بزرگ است.</p>
</section>
