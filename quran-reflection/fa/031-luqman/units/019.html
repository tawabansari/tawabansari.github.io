<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">لقمان ۳۱:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاقصِد" data-root="ق ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-d/" data-root-meaning="قصد و رو به هدف رفتن؛ نیز میانه‌روی و اعتدال." data-context="و میانه‌روی کن؛ فرمان به اعتدال در رفتار و راه رفتن.">وَاقصِد</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مَشيِكَ" data-root="م ش ي" data-learn-more="/quran-terminology/fa/roots/m-sh-y/" data-root-meaning="راه رفتن، گام برداشتن، حرکت کردن بر زمین؛ و در میدان گسترده‌تر، پیش رفتن در یک مسیر، روش، رفتار یا سبک زندگی" data-context="راه رفتنت؛ شیوهٔ حرکت و گام برداشتن مخاطب.">مَشيِكَ</button>
    <button class="word-link" type="button" data-word="وَاغضُض" data-root="غ ض ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-dad-dad/" data-root-meaning="فروکاستن و مهار کردن نگاه یا صدا." data-context="و فروبکاه؛ فرمان به کاستن از بلندی صدا.">وَاغضُض</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="صَوتِكَ" data-root="ص و ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-t/" data-root-meaning="صدا و آوا." data-context="صدایت؛ آوای مخاطب که به کاستن از آن سفارش شده است.">صَوتِكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="أَنكَرَ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص" data-context="ناخوشایندترین؛ وصف صدای خران در این مقایسه.">أَنكَرَ</button>
    <button class="word-link" type="button" data-word="الأَصوٰتِ" data-root="ص و ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-t/" data-root-meaning="صدا و آوا." data-context="صداها؛ مجموعه‌ای که صدای خران با آن سنجیده می‌شود.">الأَصوٰتِ</button>
    <button class="word-link" type="button" data-word="لَصَوتُ" data-root="ص و ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-t/" data-root-meaning="صدا و آوا." data-context="به‌راستی صدای؛ تأکید بر صدای خران در ادامهٔ جمله.">لَصَوتُ</button>
    <button class="word-link" type="button" data-word="الحَميرِ" data-root="ح م ر" data-root-meaning="سرخی و رنگ سرخ؛ و در شاخه‌ای دیگر، حِمار: خر، با صورت‌های جمع حَمِیر و حُمُر." data-context="خران؛ جانورانی که صدایشان در توصیه به کاستن از بلندی صدا مثال زده شده است." data-learn-more="/quran-terminology/fa/roots/h-m-r/">الحَميرِ</button>
  </p>
  <p class="farsi-verse">و در راه رفتنت میانه‌رو باش و از صدایت بکاه. همانا ناخوش‌ترین صداها صدای خران است.</p>
</section>
