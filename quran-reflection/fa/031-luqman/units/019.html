<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">لقمان ۳۱:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاقصِد" data-root="ق ص د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَاقصِد</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="مَشيِكَ" data-root="م ش ي" data-learn-more="/quran-terminology/fa/roots/m-sh-y/" data-root-meaning="راه رفتن، گام برداشتن، حرکت کردن بر زمین؛ و در میدان گسترده‌تر، پیش رفتن در یک مسیر، روش، رفتار یا سبک زندگی">مَشيِكَ</button>
    <button class="word-link" type="button" data-word="وَاغضُض" data-root="غ ض ض" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَاغضُض</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="صَوتِكَ" data-root="ص و ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَوتِكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="أَنكَرَ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص">أَنكَرَ</button>
    <button class="word-link" type="button" data-word="الأَصوٰتِ" data-root="ص و ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَصوٰتِ</button>
    <button class="word-link" type="button" data-word="لَصَوتُ" data-root="ص و ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَصَوتُ</button>
    <button class="word-link" type="button" data-word="الحَميرِ" data-root="ح م ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الحَميرِ</button>
  </p>
  <p class="farsi-verse">و در راه رفتنت میانه‌رو باش و از صدایت بکاه. همانا ناخوش‌ترین صداها صدای خران است.</p>
</section>
