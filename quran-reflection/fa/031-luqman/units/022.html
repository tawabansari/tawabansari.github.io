<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">لقمان ۳۱:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُسلِم" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">يُسلِم</button>
    <button class="word-link" type="button" data-word="وَجهَهُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»">وَجهَهُ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مُحسِنٌ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">مُحسِنٌ</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="استَمسَكَ" data-root="م س ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-k/" data-root-meaning="گرفتن، نگه داشتن و محکم چنگ زدن.">استَمسَكَ</button>
    <button class="word-link" type="button" data-word="بِالعُروَةِ" data-root="ع ر و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-w/" data-root-meaning="دستگیره و جای چنگ زدن؛ اعترا: عارض و دامنگیر شدن.">بِالعُروَةِ</button>
    <button class="word-link" type="button" data-word="الوُثقىٰ" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست">الوُثقىٰ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="الأُمورِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">الأُمورِ</button>
  </p>
  <p class="farsi-verse">و هرکه روی خود را به آن معبود یگانه بسپارد و نیکوکار باشد، به‌راستی به استوارترین دستاویز چنگ زده است؛ و سرانجام کارها به سوی آن معبود یگانه است.</p>
</section>
