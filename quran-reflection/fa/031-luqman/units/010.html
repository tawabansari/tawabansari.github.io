  <p class="farsi-verse">آسمان‌ها را بی‌ستون‌هایی که ببینید آفرید و در زمین کوه‌های استوار افکند تا شما را نلرزاند و در آن از هر جنبنده‌ای پراکند. و از آسمان آبی فرو فرستادیم، پس در آن از هر جفت ارجمندی رویاندیم.</p>
