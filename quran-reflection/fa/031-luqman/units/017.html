<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">لقمان ۳۱:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰبُنَىَّ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="ای پسرکم؛ خطاب مهرآمیز لقمان به فرزندش.">يٰبُنَىَّ</button>
    <button class="word-link" type="button" data-word="أَقِمِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برپا دار؛ فرمان به اقامهٔ صلاة.">أَقِمِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلاة؛ موضوع نخستِ سفارش لقمان.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأمُر" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="و فرمان ده؛ سفارش به امر به معروف.">وَأمُر</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="به معروف؛ موضوع فرمانِ سفارش‌شده.">بِالمَعروفِ</button>
    <button class="word-link" type="button" data-word="وَانهَ" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="و بازدار؛ سفارش لقمان به فرزندش برای نهی از منکر." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">وَانهَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُنكَرِ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص" data-context="منکر؛ آنچه فرزند باید از آن بازدارد.">المُنكَرِ</button>
    <button class="word-link" type="button" data-word="وَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="و صبر کن؛ پایداری در برابر دشواری.">وَاصبِر</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَصابَكَ" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود" data-context="به تو رسید؛ آنچه تحمل آن سفارش شده است.">أَصابَكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَزمِ" data-root="ع ز م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-z-m/" data-root-meaning="تصمیم و اراده استوار برای انجام کار." data-context="عزم و استواری؛ وصف مسئولیت‌های یادشده.">عَزمِ</button>
    <button class="word-link" type="button" data-word="الأُمورِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="کارها؛ امور نیازمند عزم.">الأُمورِ</button>
  </p>
  <p class="farsi-verse">ای پسرکم، صلات را برپا دار و به کار پسندیده فرمان ده و از کار ناپسند بازدار و بر آنچه به تو می‌رسد شکیبا باش. همانا این از کارهایی است که عزم می‌طلبد.</p>
</section>
