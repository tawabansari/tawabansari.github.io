<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">لقمان ۳۱:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="اتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">اتَّقوا</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكُم</button>
    <button class="word-link" type="button" data-word="وَاخشَوا" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/" data-root-meaning="بیم و ملاحظهٔ آگاهانه در برابر خطری شناخته‌شده یا پیامدی جدی، و خشیت اثرگذار در برابر آن معبود یگانه">وَاخشَوا</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومًا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَجزى" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">يَجزى</button>
    <button class="word-link" type="button" data-word="والِدٌ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">والِدٌ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="وَلَدِهِ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">وَلَدِهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="مَولودٌ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">مَولودٌ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="جازٍ" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">جازٍ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="والِدِهِ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">والِدِهِ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="وَعدَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعدَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="حَقٌّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">حَقٌّ</button>

    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>

    <button class="word-link" type="button" data-word="الحَيوٰةُ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>

    <button class="word-link" type="button" data-word="الغَرورُ" data-root="غ ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-r/" data-root-meaning="فریب و دل بستن به نمود گمراه‌کننده.">الغَرورُ</button>
  </p>
  <p class="farsi-verse">ای مردم، از پروردگارتان پروا کنید و از روزی بترسید که هیچ پدری چیزی از فرزندش کفایت نمی‌کند و هیچ فرزندی چیزی از پدرش کفایت نخواهد کرد. همانا وعده آن معبود یگانه حق است؛ پس زندگی دنیا شما را نفریبد و فریبکار شما را درباره آن معبود یگانه نفریبد.</p>
</section>
