  <p class="farsi-verse">آیا ندیده‌اید که آن معبود یگانه آنچه را در آسمان‌ها و آنچه را در زمین است برای شما رام کرده و نعمت‌های آشکار و نهانش را بر شما تمام کرده است؟ و از مردم کسی است که درباره آن معبود یگانه بی‌هیچ دانش و هدایت و کتاب روشنگری جدال می‌کند.</p>
