  </p>
  <p class="farsi-verse">و انسان را درباره پدر و مادرش سفارش کردیم؛ مادرش او را با سستی بر سستی حمل کرد و از شیر گرفتنش در دو سال است؛ که مرا و پدر و مادرت را سپاس گزار. بازگشت به سوی من است.</p>
