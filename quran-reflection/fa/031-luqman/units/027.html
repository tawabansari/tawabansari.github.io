  <p class="farsi-verse">و اگر هر درختی در زمین قلم باشد و دریا، که پس از آن هفت دریای دیگر آن را مدد رسانند، کلمات آن معبود یگانه پایان نمی‌یابد. همانا آن معبود یگانه شکست‌ناپذیر و حکیم است.</p>
