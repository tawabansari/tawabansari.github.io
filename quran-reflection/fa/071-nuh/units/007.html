<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">نوح ۷۱:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="كُلَّما" data-root="ك ل ل" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلَّما</button>
    <button class="word-link" type="button" data-word="دَعَوتُهُم" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">دَعَوتُهُم</button>
    <button class="word-link" type="button" data-word="لِتَغفِرَ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">لِتَغفِرَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="جَعَلوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلوا</button>
    <button class="word-link" type="button" data-word="أَصٰبِعَهُم" data-root="ص ب ع" data-learn-more="/quran-terminology/fa/roots/sad-b-ayn/" data-root-meaning="انگشتان؛ اعضای باریک و شاخه‌شده دست یا پا که برای لمس، گرفتن، اشاره، سنجیدن، و گاهی بستن منفذ به کار می‌روند">أَصٰبِعَهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ءاذانِهِم" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن">ءاذانِهِم</button>
    <button class="word-link" type="button" data-word="وَاستَغشَوا" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش">وَاستَغشَوا</button>
    <button class="word-link" type="button" data-word="ثِيابَهُم" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">ثِيابَهُم</button>
    <button class="word-link" type="button" data-word="وَأَصَرّوا" data-root="ص ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-r/" data-root-meaning="محکم بستن و اصرار ورزیدن؛ صِرّ: سرمای سخت؛ صَرّه: فریاد یا همهمه.">وَأَصَرّوا</button>
    <button class="word-link" type="button" data-word="وَاستَكبَرُوا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">وَاستَكبَرُوا</button>
    <button class="word-link" type="button" data-word="استِكبارًا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">استِكبارًا</button>
  </p>
  <p class="farsi-verse">و هر بار آنان را فراخواندم تا بیامرزی‌شان، انگشتانشان را در گوش‌هایشان نهادند و جامه‌هایشان را بر خود کشیدند و پافشاری کردند و سخت تکبر ورزیدند.</p>
</section>
