<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">نوح ۷۱:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَم</button>
    <button class="word-link" type="button" data-word="يَزِدهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">يَزِدهُم</button>
    <button class="word-link" type="button" data-word="دُعاءى" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">دُعاءى</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="فِرارًا" data-root="ف ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فِرارًا</button>
  </p>
  <p class="farsi-verse">اما فراخوان من جز بر گریزشان نیفزود.</p>
</section>
