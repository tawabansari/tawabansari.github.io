<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">نوح ۷۱:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="القَمَرَ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان.">القَمَرَ</button>
    <button class="word-link" type="button" data-word="فيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِنَّ</button>
    <button class="word-link" type="button" data-word="نورًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">نورًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="الشَّمسَ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن.">الشَّمسَ</button>
    <button class="word-link" type="button" data-word="سِراجًا" data-root="س ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-j/" data-root-meaning="چراغ و منبع روشنایی.">سِراجًا</button>
  </p>
  <p class="farsi-verse">و ماه را در میان آنها روشنایی قرار داد و خورشید را چراغی ساخت؟</p>
