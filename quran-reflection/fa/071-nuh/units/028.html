<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">نوح ۷۱:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من.">رَبِّ</button>
    <button class="word-link" type="button" data-word="اغفِر" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="بیامرز و از گناه درگذر.">اغفِر</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="وَلِوٰلِدَىَّ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="و برای پدر و مادرم.">وَلِوٰلِدَىَّ</button>
    <button class="word-link" type="button" data-word="وَلِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلِمَن</button>
    <button class="word-link" type="button" data-word="دَخَلَ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="وارد شد.">دَخَلَ</button>
    <button class="word-link" type="button" data-word="بَيتِىَ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانهٔ من؛ جایگاهی که فرد باایمان به آن وارد می‌شود." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بَيتِىَ</button>
    <button class="word-link" type="button" data-word="مُؤمِنًا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="باایمان و در حال باورمندی.">مُؤمِنًا</button>
    <button class="word-link" type="button" data-word="وَلِلمُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="و برای مردانِ باورمند.">وَلِلمُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤمِنٰتِ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="و زنانِ باورمند.">وَالمُؤمِنٰتِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَزِدِ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="بیفزا؛ در دعای نفیِ افزایش جز تباهی.">تَزِدِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمکاران.">الظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="تَبارًا" data-root="ت ب ر" data-learn-more="/quran-terminology/fa/roots/t-b-r/" data-root-meaning="درهم شکستن و از میان بردن یک پیکره یا سامان، به‌گونه‌ای که توان ادامه یافتن به صورت پیشین را از دست بدهد." data-context="نابودی و تباهی.">تَبارًا</button>
  </p>
  <p class="farsi-verse">پروردگارا، مرا و پدر و مادرم را و هر که با ایمان به خانه‌ام وارد شود و مردان و زنان مؤمن را بیامرز؛ و ستمکاران را جز نابودی میفزا.»</p>
</section>
