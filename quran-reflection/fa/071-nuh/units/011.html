  <h2 class="ayah-title">نوح ۷۱:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُرسِلِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">يُرسِلِ</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءَ</button>

    <button class="word-link" type="button" data-word="مِدرارًا" data-root="د ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-r-r/" data-root-meaning="جاری شدن فراوان؛ مدرار: پرباران؛ دُرّی: درخشان مانند مروارید.">مِدرارًا</button>

  <p class="farsi-verse">تا از آسمان باران فراوان بر شما بفرستد،</p>
