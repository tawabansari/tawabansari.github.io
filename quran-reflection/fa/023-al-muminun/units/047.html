<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۴7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقالوا</button>
    <button class="word-link" type="button" data-word="أَنُؤمِنُ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">أَنُؤمِنُ</button>
    <button class="word-link" type="button" data-word="لِبَشَرَينِ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">لِبَشَرَينِ</button>
    <button class="word-link" type="button" data-word="مِثلِنا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مِثلِنا</button>
    <button class="word-link" type="button" data-word="وَقَومُهُما" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَقَومُهُما</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="عٰبِدونَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عٰبِدونَ</button>
  </p>
  <p class="farsi-verse">پس گفتند: آیا به دو بشر مانند خود ایمان بیاوریم، حال آنکه قومشان خدمتگزاران ما هستند؟</p>
</section>
