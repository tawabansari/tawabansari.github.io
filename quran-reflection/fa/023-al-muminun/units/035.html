<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَيَعِدُكُم" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/">أَيَعِدُكُم</button>
    <button class="word-link" type="button" data-word="أَنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّكُم</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="مِتُّم" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مِتُّم</button>
    <button class="word-link" type="button" data-word="وَكُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">وَكُنتُم</button>

    <button class="word-link" type="button" data-word="وَعِظٰمًا" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/">وَعِظٰمًا</button>
    <button class="word-link" type="button" data-word="أَنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّكُم</button>
    <button class="word-link" type="button" data-word="مُخرَجونَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">مُخرَجونَ</button>
  </p>
  <p class="farsi-verse">آیا به شما وعده می‌دهد که چون مردید و خاک و استخوان شدید، بیرون آورده می‌شوید؟</p>
