<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="نُسارِعُ" data-root="س ر ع" data-root-meaning="سرعت و تندیِ حرکت یا انجام کار در برابر کندی؛ و در مسارعت، شتاب در اقدام و پیش‌دستی به سوی مقصدی که ارزش آن از سیاق شناخته می‌شود." data-context="برای آنان در خیرها شتاب می‌کنیم؛ بخشی از پرسشِ انتقادی دربارهٔ برداشت آنان از مال و فرزند." data-learn-more="/quran-terminology/fa/roots/s-r-ayn/">نُسارِعُ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الخَيرٰتِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="خیرها و نیکی‌ها؛ آنچه برخورداری از مال و فرزند لزوماً دلیل آن نیست.">الخَيرٰتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک" data-context="درنمی‌یابند؛ نقدِ برداشت آنان از برخورداری.">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">در خیرات برایشان شتاب می‌کنیم؟ بلکه درنمی‌یابند.</p>
</section>
