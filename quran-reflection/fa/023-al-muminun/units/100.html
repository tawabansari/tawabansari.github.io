<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۰۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَعَلّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلّى</button>
    <button class="word-link" type="button" data-word="أَعمَلُ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="باشد که کاری انجام دهم؛ سخنِ کسی که بازگشت به زندگی را می‌خواهد.">أَعمَلُ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="کاری شایسته و درست که گوینده می‌خواهد پس از بازگشت انجام دهد.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيما</button>
    <button class="word-link" type="button" data-word="تَرَكتُ" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی" data-context="آنچه در زندگی پیشین واگذاشتم یا در انجامش کوتاهی کردم.">تَرَكتُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَلّا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّها</button>
    <button class="word-link" type="button" data-word="كَلِمَةٌ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="سخن یا گفته‌ای که او بر زبان می‌آورد؛ اشاره به درخواست بازگشت.">كَلِمَةٌ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="قائِلُها" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گویندهٔ آن سخن؛ او همان درخواست را بر زبان می‌آورد.">قائِلُها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="وَرائِهِم" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و نهان شدن؛ در شاخه‌ای دیگر، برآوردن آتش. «وراء» به آن سوی چیزی اشاره دارد و پیوند اشتقاقی آن محل اختلاف است." data-context="در ورای آنان؛ در این سیاق، حایلی پیش روی آنان است که راه بازگشت را می‌بندد.">وَرائِهِم</button>
    <button class="word-link" type="button" data-word="بَرزَخٌ" data-root="ب ر ز خ" data-root-meaning="حد، فاصله یا حایلی میان دو چیز یا دو وضعیت؛ نوع مانع و امکان گذر از آن از سیاق معلوم می‌شود." data-context="حایلی در ورای آنان تا روز برانگیخته شدن؛ در سیاق، مانع بازگشت به زندگی پیشین." data-learn-more="/quran-terminology/fa/roots/b-r-z-kh/" data-root-note="حروفِ نمایه‌سازیِ واژه؛ اشتقاق تاریخی و احتمال وام‌واژه بودن آن محل اختلاف است.">بَرزَخٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز برانگیخته شدن، که پایانِ بازهٔ بیان‌شده است.">يَومِ</button>
    <button class="word-link" type="button" data-word="يُبعَثونَ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه." data-context="برانگیخته می‌شوند؛ فعل مجهول دربارهٔ رستاخیز آنان.">يُبعَثونَ</button>
  </p>
  <p class="farsi-verse">باشد که در آنچه واگذاشته‌ام کار شایسته کنم. هرگز! این تنها سخنی است که او گوینده آن است؛ و پشت سرشان برزخی است تا روزی که برانگیخته شوند.</p>
</section>
