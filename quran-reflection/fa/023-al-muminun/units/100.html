<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۰۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَعَلّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلّى</button>
    <button class="word-link" type="button" data-word="أَعمَلُ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">أَعمَلُ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيما</button>
    <button class="word-link" type="button" data-word="تَرَكتُ" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی">تَرَكتُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَلّا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّها</button>
    <button class="word-link" type="button" data-word="كَلِمَةٌ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد">كَلِمَةٌ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="قائِلُها" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قائِلُها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="وَرائِهِم" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش">وَرائِهِم</button>
    <button class="word-link" type="button" data-word="بَرزَخٌ" data-root="ب ر ز خ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَرزَخٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومِ</button>
    <button class="word-link" type="button" data-word="يُبعَثونَ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه.">يُبعَثونَ</button>
  </p>
  <p class="farsi-verse">باشد که در آنچه واگذاشته‌ام کار شایسته کنم. هرگز! این تنها سخنی است که او گوینده آن است؛ و پشت سرشان برزخی است تا روزی که برانگیخته شوند.</p>
</section>
