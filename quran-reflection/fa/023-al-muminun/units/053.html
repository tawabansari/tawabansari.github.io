<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَقَطَّعوا" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال">فَتَقَطَّعوا</button>
    <button class="word-link" type="button" data-word="أَمرَهُم" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرَهُم</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُم</button>
    <button class="word-link" type="button" data-word="زُبُرًا" data-root="ز ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">زُبُرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="حِزبٍ" data-root="ح ز ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِزبٍ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="لَدَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدَيهِم</button>
    <button class="word-link" type="button" data-word="فَرِحونَ" data-root="ف ر ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَرِحونَ</button>
  </p>
  <p class="farsi-verse">پس کار خود را میان خویش پاره‌پاره کردند؛ هر گروهی به آنچه نزد خود دارد شادمان است.</p>
</section>
