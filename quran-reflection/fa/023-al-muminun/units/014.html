  <p class="farsi-verse">سپس نطفه را چیزی آویخته آفریدیم، سپس آن چیز آویخته را پاره‌گوشتی آفریدیم، سپس پاره‌گوشت را استخوان‌ها آفریدیم، پس استخوان‌ها را گوشت پوشاندیم؛ سپس او را آفرینشی دیگر پدید آوردیم. پس پربرکت است آن معبود یگانه، بهترین آفرینندگان.</p>
