<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَيها</button>
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الفُلكِ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش." data-context="کشتی‌ها؛ وسیلهٔ حمل انسان‌ها بر آب.">الفُلكِ</button>
    <button class="word-link" type="button" data-word="تُحمَلونَ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="حمل می‌شوید؛ جابه‌جایی بر چهارپایان و کشتی‌ها." data-learn-more="/quran-terminology/fa/roots/h-m-l/">تُحمَلونَ</button>
  </p>
  <p class="farsi-verse">و بر آنها و بر کشتی‌ها حمل می‌شوید.</p>
</section>
