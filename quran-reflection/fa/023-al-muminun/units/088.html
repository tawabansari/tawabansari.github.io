<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۸۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان طرح پرسش.">قُل</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="بِيَدِهِ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="به دست او؛ در اختیار و قدرت او.">بِيَدِهِ</button>
    <button class="word-link" type="button" data-word="مَلَكوتُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="فرمانروایی؛ حاکمیت بر همه چیز.">مَلَكوتُ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر و همه؛ بیان شمول فرمانروایی.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیز؛ هر آنچه موضوع فرمانروایی است.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="يُجيرُ" data-root="ج و ر" data-root-meaning="همسایگی و مجاورت؛ پناه دادن و حمایت؛ در شاخهٔ جَوْر، انحراف از راه و عدالت." data-context="پناه می‌دهد؛ بیان قدرت حمایت و محافظت." data-learn-more="/quran-terminology/fa/roots/j-w-r/">يُجيرُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُجارُ" data-root="ج و ر" data-root-meaning="همسایگی و مجاورت؛ پناه دادن و حمایت؛ در شاخهٔ جَوْر، انحراف از راه و عدالت." data-context="پناه داده می‌شود؛ امکانی که در برابر او با «لا» نفی شده است." data-learn-more="/quran-terminology/fa/roots/j-w-r/">يُجارُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="هستید؛ جزء ساخت شرطِ دانستن.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانید؛ دانستن پاسخ پرسش.">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">بگو: فرمانروایی هر چیزی در دست کیست، و او پناه می‌دهد و در برابر او پناه داده نمی‌شود، اگر می‌دانید؟</p>
</section>
