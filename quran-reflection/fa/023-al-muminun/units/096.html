<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ادفَع" data-root="د ف ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ادفَع</button>
    <button class="word-link" type="button" data-word="بِالَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِالَّتى</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="السَّيِّئَةَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّئَةَ</button>
    ۚ
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="يَصِفونَ" data-root="و ص ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَصِفونَ</button>
  </p>
  <p class="farsi-verse">بدی را با آنچه بهتر است دفع کن؛ ما به آنچه وصف می‌کنند داناتریم.</p>
</section>
