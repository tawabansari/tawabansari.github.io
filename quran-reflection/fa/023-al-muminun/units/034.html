<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="أَطَعتُم" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">أَطَعتُم</button>
    <button class="word-link" type="button" data-word="بَشَرًا" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">بَشَرًا</button>
    <button class="word-link" type="button" data-word="مِثلَكُم" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مِثلَكُم</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="إِذًا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذًا</button>
    <button class="word-link" type="button" data-word="لَخٰسِرونَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">لَخٰسِرونَ</button>
  </p>
  <p class="farsi-verse">و اگر از بشری مانند خود پیروی کنید، بی‌گمان آنگاه زیانکار خواهید بود.</p>
</section>
