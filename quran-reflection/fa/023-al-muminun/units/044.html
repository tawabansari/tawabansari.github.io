  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="رُسُلَنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">رُسُلَنا</button>
    <button class="word-link" type="button" data-word="تَترا" data-root="و ت ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَترا</button>

    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">يُؤمِنونَ</button>
  </p>
  <p class="farsi-verse">سپس رسولان خود را پی‌درپی فرستادیم. هر بار رسول امتی نزد آن آمد، او را تکذیب کردند؛ پس برخی را در پی برخی دیگر آوردیم و آنان را داستان‌ها کردیم. پس دور باد قومی که ایمان نمی‌آورند!</p>
