<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَخَذَتهُمُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَأَخَذَتهُمُ</button>
    <button class="word-link" type="button" data-word="الصَّيحَةُ" data-root="ص ي ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-h/" data-root-meaning="بانگ و فریاد بلند.">الصَّيحَةُ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="فَجَعَلنٰهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">فَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="غُثاءً" data-root="غ ث و" data-root-meaning="غثاء، خاشاک و بقایای فرسوده و سبک، به‌ویژه آنچه سیلاب با خود می‌برد یا بر سطح آب گرد می‌آورد؛ و در کاربرد گیاهی، آنچه پس از خشک شدن و از دست دادن تازگی به خاشاک تبدیل شده است." data-learn-more="/quran-terminology/fa/roots/gh-th-w/">غُثاءً</button>
    ۚ
    <button class="word-link" type="button" data-word="فَبُعدًا" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">فَبُعدًا</button>
    <button class="word-link" type="button" data-word="لِلقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِلقَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">پس فریاد به حق آنان را گرفت، پس آنان را خاشاک کردیم. پس دور باد قوم ستمگر!</p>
</section>
