  <p class="farsi-verse">پس به او وحی کردیم: کشتی را زیر چشم‌های ما و با وحی ما بساز. پس چون فرمان ما آمد و تنور جوشید، از هرکدام یک جفت، دو تا، در آن وارد کن و خانواده‌ات را، جز کسی از آنان که سخن پیش‌تر بر او رفته است؛ و درباره کسانی که ستم کرده‌اند با من سخن مگو؛ آنان غرق‌شدنی‌اند.</p>
