<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:7۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَوِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَوِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">اتَّبَعَ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">الحَقُّ</button>
    <button class="word-link" type="button" data-word="أَهواءَهُم" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس">أَهواءَهُم</button>
    <button class="word-link" type="button" data-word="لَفَسَدَتِ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع">لَفَسَدَتِ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتُ</button>
    <button class="word-link" type="button" data-word="وَالأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضُ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="فيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِنَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="أَتَينٰهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أَتَينٰهُم</button>
    <button class="word-link" type="button" data-word="بِذِكرِهِم" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">بِذِكرِهِم</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِهِم" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">ذِكرِهِم</button>
    <button class="word-link" type="button" data-word="مُعرِضونَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">مُعرِضونَ</button>
  </p>
  <p class="farsi-verse">و اگر حق از خواسته‌های آنان پیروی می‌کرد، آسمان‌ها و زمین و هرکه در آنهاست تباه می‌شدند. بلکه یادآوری‌شان را برایشان آورده‌ایم، پس از یادآوری خود روی‌گردان‌اند.</p>
</section>
