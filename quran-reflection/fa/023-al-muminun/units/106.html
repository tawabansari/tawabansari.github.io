<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّنا</button>
    <button class="word-link" type="button" data-word="غَلَبَت" data-root="غ ل ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-b/" data-root-meaning="چیره شدن و غلبه یافتن.">غَلَبَت</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="شِقوَتُنا" data-root="ش ق و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-q-w/" data-root-meaning="رنج و بدبختی و محرومیت از نیک‌فرجامی.">شِقوَتُنا</button>
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكُنّا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومًا</button>
    <button class="word-link" type="button" data-word="ضالّينَ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">ضالّينَ</button>
  </p>
  <p class="farsi-verse">گفتند: پروردگارا، تیره‌بختی ما بر ما چیره شد و ما مردمی گمراه بودیم.</p>
</section>
