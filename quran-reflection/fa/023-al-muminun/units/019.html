<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَنشَأنا" data-root="ن ش أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-a/" data-root-meaning="پدید آوردن، رشد کردن و پرورش دادن.">فَأَنشَأنا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَخيلٍ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان.">نَخيلٍ</button>
    <button class="word-link" type="button" data-word="وَأَعنٰبٍ" data-root="ع ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-b/" data-root-meaning="انگور و تاک.">وَأَعنٰبٍ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="فَوٰكِهُ" data-root="ف ك ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-h2/" data-root-meaning="میوه؛ فاکه: شادمان و برخوردار؛ تفکّه: خوشی یا شگفتی و گفت‌وگو، بنا بر سیاق.">فَوٰكِهُ</button>
    <button class="word-link" type="button" data-word="كَثيرَةٌ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">كَثيرَةٌ</button>
    <button class="word-link" type="button" data-word="وَمِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنها</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">تَأكُلونَ</button>
  </p>
  <p class="farsi-verse">پس با آن برای شما باغ‌هایی از نخل‌ها و انگورها پدید آوردیم؛ در آنها برای شما میوه‌های بسیار است و از آنها می‌خورید،</p>
</section>
