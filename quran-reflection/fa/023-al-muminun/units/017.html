<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="خَلَقنا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنا</button>
    <button class="word-link" type="button" data-word="فَوقَكُم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد">فَوقَكُم</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="س ب ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَبعَ</button>
    <button class="word-link" type="button" data-word="طَرائِقَ" data-root="ط ر ق" data-learn-more="/quran-terminology/fa/roots/tt-r-q/" data-root-meaning="کوبیدن، راه، طریقه، طرائق و طارق شبانه">طَرائِقَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنّا</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="الخَلقِ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">الخَلقِ</button>
    <button class="word-link" type="button" data-word="غٰفِلينَ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری">غٰفِلينَ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان بالای شما هفت راه آفریدیم، و از آفرینش غافل نبوده‌ایم.</p>
</section>
