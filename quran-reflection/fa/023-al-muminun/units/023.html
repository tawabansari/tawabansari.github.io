  <p class="farsi-verse">و بی‌گمان نوح را به سوی قومش فرستادیم؛ پس گفت: ای قوم من، آن معبود یگانه را بپرستید؛ شما را جز او معبودی نیست. آیا پروا نمی‌کنید؟</p>
