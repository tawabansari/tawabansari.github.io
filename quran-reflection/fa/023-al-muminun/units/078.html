<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:7۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَنشَأَ" data-root="ن ش أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-a/" data-root-meaning="پدید آوردن، رشد کردن و پرورش دادن.">أَنشَأَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="السَّمعَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">السَّمعَ</button>
    <button class="word-link" type="button" data-word="وَالأَبصٰرَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">وَالأَبصٰرَ</button>
    <button class="word-link" type="button" data-word="وَالأَفـِٔدَةَ" data-root="ف أ د" data-root-meaning="«دل» مناسب‌ترین معادل پایه فؤاد است؛ دلی که در کاربردهای قرآنی می‌تواند با دریافت، ادراک، گرایش، تاثیرپذیری و پایداری ارتباط داشته باشد." data-learn-more="/quran-terminology/fa/roots/f-a-d/">وَالأَفـِٔدَةَ</button>
    ۚ
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">تَشكُرونَ</button>
  </p>
  <p class="farsi-verse">و اوست که برای شما شنوایی و بینایی‌ها و دل‌ها را پدید آورد؛ چه اندک سپاس می‌گزارید!</p>
</section>
