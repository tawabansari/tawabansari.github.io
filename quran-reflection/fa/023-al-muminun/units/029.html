<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ دستورِ بیانِ دعا.">وَقُل</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ خطابِ دعا.">رَبِّ</button>
    <button class="word-link" type="button" data-word="أَنزِلنى" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="مرا فرود آور؛ درخواستِ فرود آمدن.">أَنزِلنى</button>
    <button class="word-link" type="button" data-word="مُنزَلًا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="فرود آمدن یا جایگاهِ فرود.">مُنزَلًا</button>
    <button class="word-link" type="button" data-word="مُبارَكًا" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="فرود آمدن یا جایگاهِ فرودی همراه با خیر و برکت؛ وصفِ «منزل»." data-learn-more="/quran-terminology/fa/roots/b-r-k/">مُبارَكًا</button>
    <button class="word-link" type="button" data-word="وَأَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتَ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهترین؛ در وصفِ فرودآورندگان.">خَيرُ</button>
    <button class="word-link" type="button" data-word="المُنزِلينَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="فرودآورندگان؛ وصفی در پایان دعا.">المُنزِلينَ</button>
  </p>
  <p class="farsi-verse">و بگو: پروردگارا، مرا در فرودگاهی پربرکت فرود آور، و تو بهترین فرودآورندگانی.</p>
</section>
