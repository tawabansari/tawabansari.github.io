<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="جَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="نُطفَةً" data-root="ن ط ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-tt-f/" data-root-meaning="اندکی مایع؛ نطفه: مقدار اندک مایع تولیدمثل در سیاق آفرینش.">نُطفَةً</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قَرارٍ" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری.">قَرارٍ</button>
    <button class="word-link" type="button" data-word="مَكينٍ" data-root="م ك ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-n/" data-root-meaning="استواری و امکان یافتن؛ تمکین: جای و توان استوار بخشیدن.">مَكينٍ</button>
  </p>
  <p class="farsi-verse">سپس او را نطفه‌ای در قرارگاهی استوار قرار دادیم.</p>
</section>
