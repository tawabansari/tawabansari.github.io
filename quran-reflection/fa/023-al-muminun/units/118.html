<section class="ayah-block" id="ayah-118" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقُل</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="اغفِر" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">اغفِر</button>
    <button class="word-link" type="button" data-word="وَارحَم" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">وَارحَم</button>
    <button class="word-link" type="button" data-word="وَأَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتَ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرُ</button>
    <button class="word-link" type="button" data-word="الرّٰحِمينَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">الرّٰحِمينَ</button>
  </p>
  <p class="farsi-verse">و بگو: پروردگارا، بیامرز و رحم کن، و تو بهترین رحم‌کنندگانی.</p>
</section>
