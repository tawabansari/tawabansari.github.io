<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="قَليلٍ" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلٍ</button>
    <button class="word-link" type="button" data-word="لَيُصبِحُنَّ" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ.">لَيُصبِحُنَّ</button>
    <button class="word-link" type="button" data-word="نٰدِمينَ" data-root="ن د م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-d-m/" data-root-meaning="پشیمانی از کار گذشته.">نٰدِمينَ</button>
  </p>
  <p class="farsi-verse">گفت: به‌زودی پشیمان خواهند شد.</p>
