<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="نُكَلِّفُ" data-root="ك ل ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-l-f/" data-root-meaning="به عهده نهادن کار و مسئولیت؛ تکلّف: خود را به کاری با دشواری واداشتن.">نُكَلِّفُ</button>
    <button class="word-link" type="button" data-word="نَفسًا" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">نَفسًا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="وُسعَها" data-root="و س ع" data-learn-more="/quran-terminology/fa/roots/w-s-ayn/" data-root-meaning="از فراخی مکان تا گنجایش، توان و فراگیری">وُسعَها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَدَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَدَينا</button>
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="يَنطِقُ" data-root="ن ط ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-tt-q/" data-root-meaning="سخن گفتن و بیان کردن.">يَنطِقُ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">يُظلَمونَ</button>
  </p>
  <p class="farsi-verse">و هیچ نفسی را جز به اندازه توانش تکلیف نمی‌کنیم، و نزد ما کتابی است که به حق سخن می‌گوید، و به آنان ستم نمی‌شود.</p>
</section>
