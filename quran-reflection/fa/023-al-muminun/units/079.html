<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:7۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="ذَرَأَكُم" data-root="ذ ر أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-a/" data-root-meaning="پدید آوردن و در جهان گستراندن آفریدگان." data-context="شما را پدید آورد و پراکند؛ در زمین.">ذَرَأَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ عرصهٔ پدید آمدن و پراکندگی.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُحشَرونَ" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="به سوی او گرد آورده می‌شوید؛ در کنار یادآوریِ آفرینش در زمین." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">تُحشَرونَ</button>
  </p>
  <p class="farsi-verse">و اوست که شما را در زمین پدید آورد، و به سوی او گرد آورده می‌شوید.</p>
</section>
