<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:7۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَخَذنٰهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="بِالعَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">بِالعَذابِ</button>
    <button class="word-link" type="button" data-word="فَمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَا</button>
    <button class="word-link" type="button" data-word="استَكانوا" data-root="ك ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-n/" data-root-meaning="«استکان» به معنای فروتن و تسلیم شدن است؛ نسبت آن به «کین» یا «سکن» اختلافی است.">استَكانوا</button>
    <button class="word-link" type="button" data-word="لِرَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">لِرَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَتَضَرَّعونَ" data-root="ض ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-r-ayn/" data-root-meaning="فروتنی و زاری؛ ضریع: گیاه یا خوراک سخت و رنج‌آور در وصف دوزخ.">يَتَضَرَّعونَ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان آنان را به عذاب گرفتیم، پس در برابر پروردگارشان فروتن نشدند و زاری نمی‌کنند،</p>
