  <p class="farsi-verse">پس سران قومش که کفر ورزیده بودند گفتند: این جز بشری مانند شما نیست؛ می‌خواهد بر شما برتری جوید. و اگر آن معبود یگانه می‌خواست، فرشتگانی فرو می‌فرستاد. ما در میان پدران نخستین خود چنین چیزی نشنیده‌ایم.</p>
