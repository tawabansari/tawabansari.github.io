<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۹۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَعوذُ" data-root="ع و ذ" data-learn-more="/quran-terminology/fa/roots/ayn-w-dh/" data-root-meaning="پناه بردن، پناه جستن، به مأمن روی آوردن و در حفاظت آن قرار گرفتن.">وَأَعوذُ</button>
    <button class="word-link" type="button" data-word="بِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَحضُرونِ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت">يَحضُرونِ</button>
  </p>
  <p class="farsi-verse">و به تو پناه می‌برم، پروردگارا، از اینکه نزد من حاضر شوند.</p>
</section>
