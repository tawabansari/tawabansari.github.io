<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="خوانده می‌شد؛ همراه با فعل بعدی، وضعیت گذشته را بیان می‌کند.">كانَت</button>
    <button class="word-link" type="button" data-word="ءايٰتى" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات و نشانه‌های من؛ در اینجا پیام‌هایی که بر مخاطبان خوانده می‌شد.">ءايٰتى</button>
    <button class="word-link" type="button" data-word="تُتلىٰ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر" data-context="خوانده و بازگو می‌شد؛ فعل مجهول دربارهٔ آیات.">تُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="فَكُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="پس چنین رفتار می‌کردید؛ همراه با فعل نکوص، رفتار گذشته را بیان می‌کند.">فَكُنتُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَعقٰبِكُم" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار" data-context="پاشنه‌های شما؛ در تصویر واپس رفتن و رویگردانی از آیات.">أَعقٰبِكُم</button>
    <button class="word-link" type="button" data-word="تَنكِصونَ" data-root="ن ك ص" data-learn-more="/quran-terminology/fa/roots/n-k-sad/" data-root-meaning="عقب‌نشینی و واپس رفتن؛ خودداری از ادامهٔ مسیر یا اقدامی که شخص به آن روی آورده است." data-context="پس می‌رفتید و روی می‌گرداندید؛ در سیاق آیه، از آیاتی که برایتان خوانده می‌شد.">تَنكِصونَ</button>
  </p>
  <p class="farsi-verse">آیات من بر شما خوانده می‌شد، پس بر پاشنه‌های خود پس می‌رفتید،</p>
</section>
