<section class="ayah-block" id="ayah-108" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۰۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="اخسَـٔوا" data-root="خ س أ" data-learn-more="/quran-terminology/fa/roots/kh-s-a/" data-root-meaning="راندن، دور کردن همراه خواری، پس زدن و فرومانده ساختن؛ با تفکیک معنای ریشه از تأمل سیاقی.">اخسَـٔوا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُكَلِّمونِ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد">تُكَلِّمونِ</button>
  </p>
  <p class="farsi-verse">گفت: خوار در آن بمانید و با من سخن مگویید.</p>
</section>
