<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۰۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="نُفِخَ" data-root="ن ف خ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نُفِخَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="ص و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الصّورِ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="أَنسابَ" data-root="ن س ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَنسابَ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَتَساءَلونَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">يَتَساءَلونَ</button>
  </p>
  <p class="farsi-verse">پس چون در صور دمیده شود، آن روز میانشان پیوندهای نسبی نیست و از یکدیگر نمی‌پرسند.</p>
