<section class="ayah-block" id="ayah-115" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۱۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَحَسِبتُم" data-root="ح س ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَفَحَسِبتُم</button>
    <button class="word-link" type="button" data-word="أَنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّما</button>
    <button class="word-link" type="button" data-word="خَلَقنٰكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنٰكُم</button>
    <button class="word-link" type="button" data-word="عَبَثًا" data-root="ع ب ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَبَثًا</button>
    <button class="word-link" type="button" data-word="وَأَنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّكُم</button>
    <button class="word-link" type="button" data-word="إِلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَينا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">تُرجَعونَ</button>
  </p>
  <p class="farsi-verse">آیا پنداشتید که شما را بیهوده آفریدیم و به سوی ما بازگردانده نمی‌شوید؟</p>
