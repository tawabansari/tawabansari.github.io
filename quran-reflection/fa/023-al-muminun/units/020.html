<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَشَجَرَةً" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/">وَشَجَرَةً</button>
    <button class="word-link" type="button" data-word="تَخرُجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">تَخرُجُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="طورِ" data-root="ط و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">طورِ</button>
    <button class="word-link" type="button" data-word="سَيناءَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سَيناءَ</button>
    <button class="word-link" type="button" data-word="تَنبُتُ" data-root="ن ب ت" data-learn-more="/quran-terminology/fa/roots/n-b-t/">تَنبُتُ</button>
    <button class="word-link" type="button" data-word="بِالدُّهنِ" data-root="د ه ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِالدُّهنِ</button>
    <button class="word-link" type="button" data-word="وَصِبغٍ" data-root="ص ب غ" data-learn-more="/quran-terminology/fa/roots/sad-b-gh/">وَصِبغٍ</button>
    <button class="word-link" type="button" data-word="لِلـٔاكِلينَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/">لِلـٔاكِلينَ</button>
  </p>
  <p class="farsi-verse">و درختی که از طور سینا برمی‌آید، با روغن و خورشی برای خورندگان می‌روید.</p>
</section>
