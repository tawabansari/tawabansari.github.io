<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">المؤمنون ۲۳:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="استَوَيتَ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">استَوَيتَ</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="مَعَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الفُلكِ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش.">الفُلكِ</button>
    <button class="word-link" type="button" data-word="فَقُلِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقُلِ</button>
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">الحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="نَجّىٰنا" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">نَجّىٰنا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">پس چون تو و کسانی که همراه تو هستند بر کشتی استقرار یافتید، بگو: ستایش از آنِ آن معبود یگانه است که ما را از قوم ستمگر نجات داد.</p>
</section>
