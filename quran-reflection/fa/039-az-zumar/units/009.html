<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّن</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="قٰنِتٌ" data-root="ق ن ت" data-learn-more="/quran-terminology/fa/roots/q-n-t/" data-root-meaning="از فرمان‌پذیری و پایبندی تا ایستادگی در عبادت">قٰنِتٌ</button>
    <button class="word-link" type="button" data-word="ءاناءَ" data-root="أ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-n-y/" data-root-meaning="فرا رسیدن یا رسیدن به زمان؛ آناء: بخش‌های زمان؛ آنیه: ظرف‌ها؛ و أَنّى در کاربرد پرسشی: چگونه یا از کجا.">ءاناءَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه">الَّيلِ</button>
    <button class="word-link" type="button" data-word="ساجِدًا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">ساجِدًا</button>
    <button class="word-link" type="button" data-word="وَقائِمًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَقائِمًا</button>
    <button class="word-link" type="button" data-word="يَحذَرُ" data-root="ح ذ ر" data-learn-more="/quran-terminology/fa/roots/h-dh-r/" data-root-meaning="احتیاط، پرهیز، بیداری در برابر خطر، ترس آگاهانه از آسیب، و مراقبت عملی پیش از وقوع ضرر">يَحذَرُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَةَ</button>
    <button class="word-link" type="button" data-word="وَيَرجوا" data-root="ر ج و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ نیز کناره و جانب؛ تأخیر انداختن در برخی صورت‌ها با «رجأ» بررسی می‌شود.">وَيَرجوا</button>
    <button class="word-link" type="button" data-word="رَحمَةَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحمَةَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="يَستَوِى" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">يَستَوِى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمونَ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمونَ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يَتَذَكَّرُ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">يَتَذَكَّرُ</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولُوا</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-b/" data-root-meaning="مغز و بخش خالص؛ لُبّ: خرد و دریافت روشن.">الأَلبٰبِ</button>
  </p>
  <p class="farsi-verse">یا کسی که در ساعت‌های شب فرمان‌بردار است، سجده‌کنان و ایستاده، از آخرت بیم دارد و به رحمت پروردگارش امید می‌برد؟ بگو: آیا کسانی که می‌دانند و کسانی که نمی‌دانند برابرند؟ تنها خردمندان متذکر می‌شوند.</p>
</section>
