<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شُفَعاءَ" data-root="ش ف ع" data-learn-more="/quran-terminology/fa/roots/sh-f-ayn/" data-root-meaning="جفت‌شدن، ضمیمه‌شدن، و قرارگرفتن یک عامل در کنار عامل دیگر برای پشتیبانی یا تقویت یک اثر">شُفَعاءَ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="أَوَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوَلَو</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَملِكونَ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه">يَملِكونَ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">یا جز آن معبود یگانه شفیعانی گرفته‌اند؟ بگو: حتی اگر مالک چیزی نباشند و نیندیشند؟</p>
</section>
