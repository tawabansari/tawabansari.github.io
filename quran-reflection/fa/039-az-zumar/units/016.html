  <p class="farsi-verse">برای آنان از بالای سرشان سایه‌بان‌هایی از آتش است و از زیرشان سایه‌بان‌هایی. آن معبود یگانه با این بندگانش را بیم می‌دهد. ای بندگان من، پس از من پروا کنید.</p>
