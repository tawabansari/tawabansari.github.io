<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيُكَفِّرَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">لِيُكَفِّرَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="أَسوَأَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">أَسوَأَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">عَمِلوا</button>
    <button class="word-link" type="button" data-word="وَيَجزِيَهُم" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">وَيَجزِيَهُم</button>
    <button class="word-link" type="button" data-word="أَجرَهُم" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرَهُم</button>
    <button class="word-link" type="button" data-word="بِأَحسَنِ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">بِأَحسَنِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">تا آن معبود یگانه بدترین آنچه را انجام داده‌اند از آنان بزداید و پاداششان را بر پایه بهترین آنچه انجام می‌دادند بدهد.</p>
</section>
