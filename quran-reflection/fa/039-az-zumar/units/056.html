<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَقولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگوید؛ گفتار انسانی که بر کوتاهی گذشته دریغ می‌خورد.">تَقولَ</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="کسی یا نفسی؛ همان شخصی که ندای حسرت سر می‌دهد.">نَفسٌ</button>
    <button class="word-link" type="button" data-word="يٰحَسرَتىٰ" data-root="ح س ر" data-root-meaning="کنار رفتن پوشش و آشکار شدن؛ تحلیل رفتن نیرو و فرسودگی؛ نیز حسرت، دریغ و اندوه شدید بر فقدان یا پیامد ناخوشایند." data-learn-more="/quran-terminology/fa/roots/h-s-r/" data-context="ای دریغ بر من؛ ندای حسرت شخصی بر کوتاهی گذشته.">يٰحَسرَتىٰ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فَرَّطتُ" data-root="ف ر ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-tt/" data-root-meaning="پیش افتادن یا از حد گذشتن؛ تفریط: کوتاهی؛ افراط: زیاده‌روی." data-context="کوتاهی کردم؛ اعتراف گوینده به فروگذاشتن مسئولیت خویش.">فَرَّطتُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَنبِ" data-root="ج ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-b/" data-root-meaning="پهلو، کنار و ناحیه؛ اجتناب: کنار گرفتن و دوری کردن؛ جُنُب وضعیت آیینیِ مشخصی است." data-context="در حق و نسبت با آن معبود یگانه؛ کاربرد سیاقی «جنب»، بدون نسبت دادن پهلوی جسمانی به او.">جَنبِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="كُنتُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودم؛ اعتراف به وضع و رفتار گذشتهٔ خود.">كُنتُ</button>
    <button class="word-link" type="button" data-word="لَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمِنَ</button>
    <button class="word-link" type="button" data-word="السّٰخِرينَ" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/" data-context="ریشخندکنندگان؛ گروهی که گوینده می‌گوید از آنان بوده است.">السّٰخِرينَ</button>
  </p>
  <p class="farsi-verse">مبادا کسی بگوید: افسوس بر من برای آنچه در حق آن معبود یگانه کوتاهی کردم، و من از مسخره‌کنندگان بودم؛</p>
</section>
