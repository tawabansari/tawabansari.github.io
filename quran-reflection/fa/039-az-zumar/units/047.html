  <p class="farsi-verse">و اگر برای کسانی که ستم کرده‌اند هرچه در زمین است و همانند آن همراهش باشد، آن را برای رهایی از عذاب بد روز قیامت فدیه می‌دهند. و از سوی آن معبود یگانه چیزی برایشان آشکار می‌شود که گمان نمی‌کردند.</p>
