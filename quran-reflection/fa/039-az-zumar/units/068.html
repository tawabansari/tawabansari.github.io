  <p class="farsi-verse">و در صور دمیده می‌شود، پس هر که در آسمان‌ها و هر که در زمین است از پای درمی‌افتد، مگر آن که آن معبود یگانه بخواهد؛ سپس بار دیگر در آن دمیده می‌شود، و ناگهان آنان ایستاده می‌نگرند.</p>
