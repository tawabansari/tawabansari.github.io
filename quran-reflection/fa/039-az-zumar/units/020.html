  <p class="farsi-verse">اما کسانی که از پروردگارشان پروا کردند، غرفه‌هایی دارند که بر فرازشان غرفه‌هایی ساخته شده و از زیر آن‌ها نهرها روان است. وعده آن معبود یگانه است؛ آن معبود یگانه وعده را خلاف نمی‌کند.</p>
