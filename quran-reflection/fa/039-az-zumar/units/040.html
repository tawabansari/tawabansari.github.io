<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَأتيهِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يَأتيهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابٌ</button>
    <button class="word-link" type="button" data-word="يُخزيهِ" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران">يُخزيهِ</button>
    <button class="word-link" type="button" data-word="وَيَحِلُّ" data-root="ح ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-l/" data-root-meaning="گشودن و باز کردن بند؛ فرود آمدن و اقامت؛ حلال شدن و رفع منع.">وَيَحِلُّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابٌ</button>
    <button class="word-link" type="button" data-word="مُقيمٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُقيمٌ</button>
  </p>
  <p class="farsi-verse">چه کسی عذابی به او می‌رسد که خوارش می‌کند و عذابی ماندگار بر او فرود می‌آید.</p>
</section>
