<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُرءانًا" data-root="ق ر أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قُرءانًا</button>
    <button class="word-link" type="button" data-word="عَرَبِيًّا" data-root="ع ر ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَرَبِيًّا</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">غَيرَ</button>
    <button class="word-link" type="button" data-word="ذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذى</button>
    <button class="word-link" type="button" data-word="عِوَجٍ" data-root="ع و ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عِوَجٍ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَّقونَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">يَتَّقونَ</button>
  </p>
  <p class="farsi-verse">قرآنی عربی، بی‌هیچ کژی، باشد که پروا کنند.</p>
