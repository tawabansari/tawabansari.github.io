<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قيلَ</button>
    <button class="word-link" type="button" data-word="ادخُلوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">ادخُلوا</button>
    <button class="word-link" type="button" data-word="أَبوٰبَ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون.">أَبوٰبَ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="خٰلِدينَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه">خٰلِدينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">فَبِئسَ</button>
    <button class="word-link" type="button" data-word="مَثوَى" data-root="ث و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-w-y/" data-root-meaning="ماندن و اقامت کردن؛ مثوى: جای ماندن و قرارگاه.">مَثوَى</button>
    <button class="word-link" type="button" data-word="المُتَكَبِّرينَ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">المُتَكَبِّرينَ</button>
  </p>
  <p class="farsi-verse">گفته می‌شود: از درهای جهنم وارد شوید، ماندگار در آن؛ پس چه بد جایگاهی برای گردن‌فرازان است!</p>
</section>
