<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزِ قیامت؛ زمانِ مخاصمه در پیشگاه پروردگار.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قیامت و برپاییِ روز حساب.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان که در پیشگاه او مخاصمه می‌کنید.">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="تَختَصِمونَ" data-root="خ ص م" data-root-meaning="رویارویی و مخاصمهٔ دو طرف بر سر ادعا، حق یا موضوعی مورد اختلاف؛ خصم: طرف دعوا." data-context="در روز قیامت نزد پروردگارتان با یکدیگر مخاصمه خواهید کرد." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/">تَختَصِمونَ</button>
  </p>
  <p class="farsi-verse">سپس شما در روز قیامت نزد پروردگارتان با یکدیگر دادخواهی خواهید کرد.</p>
</section>
