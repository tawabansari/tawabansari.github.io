<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="ندیدی؛ پرسش برای توجه دادن به فرایند طبیعی.">تَرَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نازل کرد؛ فروفرستادنِ آب از آسمان.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ مبدأ فرود آمدنِ آب در توصیف آیه.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="آب؛ آنچه از آسمان فرستاده می‌شود.">ماءً</button>
    <button class="word-link" type="button" data-word="فَسَلَكَهُ" data-root="س ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-k/" data-root-meaning="در راهی رفتن یا چیزی را در مسیر و جایگاهی درآوردن." data-context="پس آن را روان ساخت؛ راه دادن آب به صورت چشمه‌ها.">فَسَلَكَهُ</button>
    <button class="word-link" type="button" data-word="يَنٰبيعَ" data-root="ن ب ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-b-ayn/" data-root-meaning="جوشیدن آب از سرچشمه؛ ینبوع: چشمه." data-context="چشمه‌ها؛ مجراهای بیرون آمدن آب در زمین.">يَنٰبيعَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ جایگاهِ جریان آب و رویش گیاه.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُخرِجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون می‌آورد؛ رویاندنِ کشت با آب.">يُخرِجُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="زَرعًا" data-root="ز ر ع" data-learn-more="/quran-terminology/fa/roots/z-r-ayn/" data-root-meaning="قرار دادن بذر، رویش، رشد گیاه و پیدایش محصول" data-context="کشت؛ گیاهانِ روییده به وسیلهٔ آب.">زَرعًا</button>
    <button class="word-link" type="button" data-word="مُختَلِفًا" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="گوناگون؛ تفاوتِ رنگ‌های کشت.">مُختَلِفًا</button>
    <button class="word-link" type="button" data-word="أَلوٰنُهُ" data-root="ل و ن" data-learn-more="/quran-terminology/fa/roots/l-w-n/" data-root-meaning="رنگ، نمود دیداری و تمایز میان گونه‌ها" data-context="رنگ‌هایش؛ نمودهای رنگیِ متفاوتِ گیاه.">أَلوٰنُهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَهيجُ" data-root="ه ي ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-y-j/" data-root-meaning="برآشفتن؛ نیز خشک و زرد شدن گیاه." data-context="می‌خشکد؛ به سوی پژمردگی و خشکی می‌رود.">يَهيجُ</button>
    <button class="word-link" type="button" data-word="فَتَرىٰهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="پس آن را می‌بینی؛ مشاهدهٔ زرد شدن گیاه.">فَتَرىٰهُ</button>
    <button class="word-link" type="button" data-word="مُصفَرًّا" data-root="ص ف ر" data-learn-more="/quran-terminology/fa/roots/sad-f-r/" data-root-meaning="زردی، زردفامی و درآمدن چیزی به حالت زرد" data-context="زردشده؛ وصفِ کشت در مرحلهٔ خشکی.">مُصفَرًّا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَجعَلُهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="آن را می‌گرداند؛ رساندنِ گیاه به حالتِ خرد و فرسوده.">يَجعَلُهُ</button>
    <button class="word-link" type="button" data-word="حُطٰمًا" data-root="ح ط م" data-root-meaning="حطم عمل شکستن و خرد کردن است؛ حطام نتیجه و باقی‌مانده خردشدگی، به‌ویژه درباره گیاه خشک است؛ و حطمة نام یا وصف چیزی است که با خردکنندگی شدید شناخته می‌شود." data-learn-more="/quran-terminology/fa/roots/h-tt-m/" data-context="خرد و فرسوده؛ بقایای شکنندهٔ گیاه.">حُطٰمًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَذِكرىٰ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="بی‌گمان یادآوری؛ دلالتِ این فرایند برای صاحبان خرد.">لَذِكرىٰ</button>
    <button class="word-link" type="button" data-word="لِأُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِأُولِى</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-meaning="مغز و بخش خالص و برگزیدهٔ هر چیز؛ در کاربرد انسانی، خرد و نیروی فهم." data-context="خردها؛ در تعبیر صاحبان خرد که از آب، رویش و فرسودگیِ گیاه پند می‌گیرند." data-learn-more="/quran-terminology/fa/roots/l-b-b/">الأَلبٰبِ</button>
  </p>
  <p class="farsi-verse">آیا ندیده‌ای که آن معبود یگانه از آسمان آبی نازل کرد و آن را به صورت چشمه‌ها در زمین روان ساخت، سپس با آن کشتزاری با رنگ‌های گوناگون بیرون می‌آورد، سپس خشک می‌شود و آن را زرد می‌بینی، سپس آن را خرده‌ریز می‌سازد؟ در این یادآوری‌ای برای خردمندان است.</p>
</section>
