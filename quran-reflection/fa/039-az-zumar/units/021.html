  <p class="arabic-text">

    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءِ</button>

    <button class="word-link" type="button" data-word="يُخرِجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">يُخرِجُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="زَرعًا" data-root="ز ر ع" data-learn-more="/quran-terminology/fa/roots/z-r-ayn/" data-root-meaning="قرار دادن بذر، رویش، رشد گیاه و پیدایش محصول">زَرعًا</button>

    <button class="word-link" type="button" data-word="أَلوٰنُهُ" data-root="ل و ن" data-learn-more="/quran-terminology/fa/roots/l-w-n/" data-root-meaning="رنگ، نمود دیداری و تمایز میان گونه‌ها">أَلوٰنُهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَهيجُ" data-root="ه ي ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-y-j/" data-root-meaning="برآشفتن؛ نیز خشک و زرد شدن گیاه.">يَهيجُ</button>
    <button class="word-link" type="button" data-word="فَتَرىٰهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">فَتَرىٰهُ</button>
    <button class="word-link" type="button" data-word="مُصفَرًّا" data-root="ص ف ر" data-learn-more="/quran-terminology/fa/roots/sad-f-r/" data-root-meaning="زردی، زردفامی و درآمدن چیزی به حالت زرد">مُصفَرًّا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَجعَلُهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">يَجعَلُهُ</button>
    <button class="word-link" type="button" data-word="حُطٰمًا" data-root="ح ط م" data-root-meaning="حطم عمل شکستن و خرد کردن است؛ حطام نتیجه و باقی‌مانده خردشدگی، به‌ویژه درباره گیاه خشک است؛ و حطمة نام یا وصف چیزی است که با خردکنندگی شدید شناخته می‌شود." data-learn-more="/quran-terminology/fa/roots/h-tt-m/">حُطٰمًا</button>

    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَذِكرىٰ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">لَذِكرىٰ</button>

    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-b/" data-root-meaning="مغز و بخش خالص؛ لُبّ: خرد و دریافت روشن.">الأَلبٰبِ</button>
  </p>
  <p class="farsi-verse">آیا ندیده‌ای که آن معبود یگانه از آسمان آبی نازل کرد و آن را به صورت چشمه‌ها در زمین روان ساخت، سپس با آن کشتزاری با رنگ‌های گوناگون بیرون می‌آورد، سپس خشک می‌شود و آن را زرد می‌بینی، سپس آن را خرده‌ریز می‌سازد؟ در این یادآوری‌ای برای خردمندان است.</p>
</section>
