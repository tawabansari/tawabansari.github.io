<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="أَفَغَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">أَفَغَيرَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="تَأمُرونّى" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">تَأمُرونّى</button>
    <button class="word-link" type="button" data-word="أَعبُدُ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">أَعبُدُ</button>
    <button class="word-link" type="button" data-word="أَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيُّهَا</button>
    <button class="word-link" type="button" data-word="الجٰهِلونَ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه.">الجٰهِلونَ</button>
  </p>
  <p class="farsi-verse">بگو: ای نادانان، آیا مرا فرمان می‌دهید که جز آن معبود یگانه را بپرستم؟</p>
</section>
