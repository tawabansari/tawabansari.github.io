<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="مَقاليدُ" data-root="ق ل د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-l-d/" data-root-meaning="گردن‌بند و آویختن بر گردن؛ مقالید: کلیدها یا اختیار خزانه‌ها.">مَقاليدُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الخٰسِرونَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">الخٰسِرونَ</button>
  </p>
  <p class="farsi-verse">کلیدهای آسمان‌ها و زمین از آن اوست؛ و کسانی که به آیات آن معبود یگانه کفر ورزیدند، آنان همان زیان‌کاران‌اند.</p>
</section>
