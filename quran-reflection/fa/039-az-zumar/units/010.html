<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="يٰعِبادِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">يٰعِبادِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="اتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">اتَّقوا</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="أَحسَنوا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">أَحسَنوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="حَسَنَةٌ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">حَسَنَةٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَأَرضُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وٰسِعَةٌ" data-root="و س ع" data-learn-more="/quran-terminology/fa/roots/w-s-ayn/" data-root-meaning="از فراخی مکان تا گنجایش، توان و فراگیری">وٰسِعَةٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يُوَفَّى" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا">يُوَفَّى</button>
    <button class="word-link" type="button" data-word="الصّٰبِرونَ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">الصّٰبِرونَ</button>
    <button class="word-link" type="button" data-word="أَجرَهُم" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرَهُم</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="حِسابٍ" data-root="ح س ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِسابٍ</button>
  </p>
  <p class="farsi-verse">بگو: ای بندگان من که ایمان آورده‌اید، از پروردگارتان پروا کنید. برای کسانی که در این دنیا نیکی کرده‌اند نیکی است، و زمین آن معبود یگانه گسترده است. تنها شکیبایان پاداششان را بی‌حساب به‌تمامی دریافت می‌کنند.</p>
</section>
