  <p class="farsi-verse">بگو: ای بندگان من که ایمان آورده‌اید، از پروردگارتان پروا کنید. برای کسانی که در این دنیا نیکی کرده‌اند نیکی است، و زمین آن معبود یگانه گسترده است. تنها شکیبایان پاداششان را بی‌حساب به‌تمامی دریافت می‌کنند.</p>
