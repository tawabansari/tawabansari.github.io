<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَشرَقَتِ" data-root="ش ر ق" data-learn-more="/quran-terminology/fa/roots/sh-r-q/" data-root-meaning="از برآمدن خورشید و روشن شدن افق تا مشرق و مشارق">وَأَشرَقَتِ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضُ</button>
    <button class="word-link" type="button" data-word="بِنورِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">بِنورِ</button>
    <button class="word-link" type="button" data-word="رَبِّها" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّها</button>
    <button class="word-link" type="button" data-word="وَوُضِعَ" data-root="و ض ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَوُضِعَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبُ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبُ</button>
    <button class="word-link" type="button" data-word="وَجِا۟ىءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجِا۟ىءَ</button>
    <button class="word-link" type="button" data-word="بِالنَّبِيّـۧنَ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">بِالنَّبِيّـۧنَ</button>
    <button class="word-link" type="button" data-word="وَالشُّهَداءِ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">وَالشُّهَداءِ</button>
    <button class="word-link" type="button" data-word="وَقُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت">وَقُضِىَ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُم</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">يُظلَمونَ</button>
  </p>
  <p class="farsi-verse">و زمین به نور پروردگارش روشن می‌شود و کتاب نهاده می‌شود و پیامبران و گواهان آورده می‌شوند و میان آنان به حق داوری می‌شود و ستم نمی‌بینند.</p>
</section>
