  <h2 class="ayah-title">الزمر ۳۹:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَمَن</button>
    <button class="word-link" type="button" data-word="يَتَّقى" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">يَتَّقى</button>
    <button class="word-link" type="button" data-word="بِوَجهِهِ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/">بِوَجهِهِ</button>
    <button class="word-link" type="button" data-word="سوءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">سوءَ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/">العَذابِ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">القِيٰمَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">وَقيلَ</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="ذوقوا" data-root="ذ و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ذوقوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَكسِبونَ" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/">تَكسِبونَ</button>
  </p>
  <p class="farsi-verse">آیا کسی که در روز قیامت با چهره‌اش خود را از عذاب بد حفظ می‌کند؟ و به ستمکاران گفته می‌شود: آنچه را به دست می‌آوردید بچشید.</p>
