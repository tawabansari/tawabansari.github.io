  <p class="farsi-verse">پس بدی‌های آنچه به دست آوردند به آنان رسید؛ و کسانی از اینان که ستم کردند، بدی‌های آنچه به دست آوردند به آنان نیز خواهد رسید، و آنان نمی‌توانند بگریزند.</p>
