  <p class="farsi-verse">و هنگامی که آن معبود یگانه به‌تنهایی یاد شود، دل‌های کسانی که به آخرت ایمان ندارند بیزار می‌شود؛ و هنگامی که کسانی جز او یاد شوند، ناگهان آنان شادمان می‌شوند.</p>
