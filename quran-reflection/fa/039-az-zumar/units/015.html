<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاعبُدوا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">فَاعبُدوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="شِئتُم" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شِئتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الخٰسِرينَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">الخٰسِرينَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="خَسِروا" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">خَسِروا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="وَأَهليهِم" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">وَأَهليهِم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الخُسرانُ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">الخُسرانُ</button>
    <button class="word-link" type="button" data-word="المُبينُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">المُبينُ</button>
  </p>
  <p class="farsi-verse">پس هرچه می‌خواهید جز او بپرستید. بگو: زیان‌کاران کسانی‌اند که در روز قیامت خود و خانواده‌هایشان را باخته‌اند. آگاه باشید، این همان زیان آشکار است.</p>
</section>
