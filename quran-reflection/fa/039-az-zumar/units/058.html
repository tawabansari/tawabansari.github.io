<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="تَقولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">تَقولَ</button>
    <button class="word-link" type="button" data-word="حينَ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان.">حينَ</button>
    <button class="word-link" type="button" data-word="تَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَى</button>
    <button class="word-link" type="button" data-word="العَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابَ</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="كَرَّةً" data-root="ك ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَرَّةً</button>
    <button class="word-link" type="button" data-word="فَأَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَأَكونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">المُحسِنينَ</button>
  </p>
  <p class="farsi-verse">یا هنگامی که عذاب را می‌بیند بگوید: کاش بازگشتی برای من بود تا از نیکوکاران شوم.</p>
</section>
