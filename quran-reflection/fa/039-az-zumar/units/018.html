<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَستَمِعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="گوش می‌سپارند؛ با توجه سخن را می‌شنوند.">يَستَمِعونَ</button>
    <button class="word-link" type="button" data-word="القَولَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخن؛ آنچه می‌شنوند و بهترین آن را پیروی می‌کنند.">القَولَ</button>
    <button class="word-link" type="button" data-word="فَيَتَّبِعونَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="پس پیروی می‌کنند؛ عمل کردن به بهترینِ سخن.">فَيَتَّبِعونَ</button>
    <button class="word-link" type="button" data-word="أَحسَنَهُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="بهترین آن؛ آنچه از سخن برتر و شایسته‌تر است.">أَحسَنَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هَدىٰهُمُ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="آنان را هدایت کرد؛ راهنمایی به مسیر درست.">هَدىٰهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولُوا</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-meaning="مغز و بخش خالص و برگزیدهٔ هر چیز؛ در کاربرد انسانی، خرد و نیروی فهم." data-context="خردها؛ در تعبیر صاحبان خرد که سخن را می‌شنوند و بهترین آن را پیروی می‌کنند." data-learn-more="/quran-terminology/fa/roots/l-b-b/">الأَلبٰبِ</button>
  </p>
  <p class="farsi-verse">کسانی که به سخن گوش می‌دهند و بهترین آن را پیروی می‌کنند. آنان کسانی‌اند که آن معبود یگانه هدایتشان کرده است و آنان همان خردمندان‌اند.</p>
</section>
