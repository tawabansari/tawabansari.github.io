<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="مَسَّ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="برسد؛ زیان با انسان تماس پیدا کند و بر او اثر بگذارد.">مَسَّ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ شخصی که در زیان دعا می‌کند و پس از نعمت ادعایی دارد.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="ضُرٌّ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="زیان و سختی؛ رنجی که انسان را به دعا وامی‌دارد.">ضُرٌّ</button>
    <button class="word-link" type="button" data-word="دَعانا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="ما را می‌خواند؛ از خداوند در دشواری یاری می‌طلبد.">دَعانا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="خَوَّلنٰهُ" data-root="خ و ل" data-root-meaning="رسیدگی و نگهداری؛ بخشیدن و در اختیار گذاشتن؛ در شاخهٔ خویشاوندی، خال و خاله از سوی مادر." data-context="نعمتی به او بخشیدیم؛ چیزی را از جانب خود در اختیار او گذاشتیم." data-learn-more="/quran-terminology/fa/roots/kh-w-l/">خَوَّلنٰهُ</button>
    <button class="word-link" type="button" data-word="نِعمَةً" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمتی؛ برخورداری‌ای که از جانب خداوند به او داده می‌شود.">نِعمَةً</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گوید؛ ادعای شخص پس از دریافت نعمت را بیان می‌کند.">قالَ</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أوتيتُهُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="آن به من داده شده است؛ فعل مجهول در بیان ادعای دریافت‌کنندهٔ نعمت.">أوتيتُهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانشی؛ در ادعای «بر پایهٔ دانش»، که تعیین صاحب آن نیازمند تفسیر است.">عِلمٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="فِتنَةٌ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن" data-context="آزمونی؛ نعمت در این سیاق وسیلهٔ امتحان معرفی شده است.">فِتنَةٌ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="أَكثَرَهُم" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بیشتر آنان؛ گروه غالبی که ناآگاهی به آنها نسبت داده می‌شود.">أَكثَرَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانند؛ در جملهٔ منفی، ناآگاهی از حقیقت آزمون را بیان می‌کند.">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">پس چون زیانی به انسان برسد، ما را می‌خواند؛ سپس چون نعمتی از جانب خود به او ببخشیم، می‌گوید: این تنها بر پایه دانشی به من داده شده است. بلکه آن آزمونی است، ولی بیشتر آنان نمی‌دانند.</p>
</section>
