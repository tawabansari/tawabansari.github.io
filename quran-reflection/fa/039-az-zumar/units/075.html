<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/">وَتَرَى</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="أ ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="حافّينَ" data-root="ح ف ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حافّينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَولِ" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها">حَولِ</button>
    <button class="word-link" type="button" data-word="العَرشِ" data-root="ع ر ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">العَرشِ</button>
    <button class="word-link" type="button" data-word="يُسَبِّحونَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/">يُسَبِّحونَ</button>
    <button class="word-link" type="button" data-word="بِحَمدِ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/">بِحَمدِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/">وَقُضِىَ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/">بَينَهُم</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">وَقيلَ</button>
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/">الحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبِّ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">العٰلَمينَ</button>
  </p>
  <p class="farsi-verse">و فرشتگان را می‌بینی که پیرامون عرش حلقه زده‌اند و با ستایش پروردگارشان تسبیح می‌گویند؛ و میان آنان به حق داوری می‌شود و گفته می‌شود: ستایش برای آن معبود یگانه، پروردگار جهانیان است.</p>
</section>
