<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">الزمر ۳۹:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و می‌بینی؛ دیدن فرشتگان در صحنهٔ توصیف‌شده.">وَتَرَى</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ موجوداتی که در این صحنه پیرامون عرش دیده می‌شوند.">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="حافّينَ" data-root="ح ف ف" data-root-meaning="در کاربرد قرآنی، قرار گرفتن یا قرار دادن چیزی در پیرامون چیز دیگر." data-context="پیرامون عرش قرارگرفته؛ وصف حالت فرشتگانی که در اطراف آن دیده می‌شوند." data-learn-more="/quran-terminology/fa/roots/h-f-f/">حافّينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَولِ" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها" data-context="پیرامون؛ مشخص کردن جایگاه فرشتگان نسبت به عرش.">حَولِ</button>
    <button class="word-link" type="button" data-word="العَرشِ" data-root="ع ر ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-sh/" data-root-meaning="سقف و سازه برافراشته؛ عرش: تخت یا جایگاه فرمانروایی." data-context="عرش؛ آنچه فرشتگان در پیرامون آن توصیف شده‌اند.">العَرشِ</button>
    <button class="word-link" type="button" data-word="يُسَبِّحونَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="تسبیح می‌گویند؛ پروردگارشان را از هر نسبت ناروا پاک می‌دانند.">يُسَبِّحونَ</button>
    <button class="word-link" type="button" data-word="بِحَمدِ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد" data-context="با ستایش؛ حمدی که با تسبیح فرشتگان همراه است.">بِحَمدِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ آن‌که فرشتگان او را تسبیح و ستایش می‌کنند.">رَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="و داوری شد؛ بیان انجام گرفتن داوری به حق، با ساخت مجهول.">وَقُضِىَ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آنان؛ طرف‌هایی که داوری به حق درباره‌شان انجام می‌گیرد؛ تعیین مرجع ضمیر به سیاق وابسته است.">بَينَهُم</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="به حق؛ داوری بر پایهٔ درستی و عدالت.">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفته شد؛ ساخت مجهول برای معرفی سخن ستایش در پایان آیه.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد" data-context="ستایش؛ حمدی که در این سخن از آنِ آن معبود یگانه دانسته می‌شود.">الحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار؛ در این ترکیب، پروردگار جهانیان.">رَبِّ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="جهانیان؛ عالم‌ها و آفریدگانی که در این ترکیب تحت ربوبیت آن معبود یگانه‌اند.">العٰلَمينَ</button>
  </p>
  <p class="farsi-verse">و فرشتگان را می‌بینی که پیرامون عرش حلقه زده‌اند و با ستایش پروردگارشان تسبیح می‌گویند؛ و میان آنان به حق داوری می‌شود و گفته می‌شود: ستایش برای آن معبود یگانه، پروردگار جهانیان است.</p>
</section>
