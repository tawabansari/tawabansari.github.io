<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">نَشاءُ</button>
    <button class="word-link" type="button" data-word="لَطَمَسنا" data-root="ط م س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَطَمَسنا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَعيُنِهِم" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/">أَعيُنِهِم</button>
    <button class="word-link" type="button" data-word="فَاستَبَقُوا" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/">فَاستَبَقُوا</button>
    <button class="word-link" type="button" data-word="الصِّرٰطَ" data-root="ص ر ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الصِّرٰطَ</button>
    <button class="word-link" type="button" data-word="فَأَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُبصِرونَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/">يُبصِرونَ</button>
  </p>
  <p class="farsi-verse">و اگر بخواهیم، چشم‌هایشان را محو می‌کنیم؛ پس به سوی راه پیشی می‌جویند؛ اما چگونه می‌بینند؟</p>
