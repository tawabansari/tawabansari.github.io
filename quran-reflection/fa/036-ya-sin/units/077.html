<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">يَرَ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">الإِنسٰنُ</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّا</button>
    <button class="word-link" type="button" data-word="خَلَقنٰهُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنٰهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نُطفَةٍ" data-root="ن ط ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-tt-f/" data-root-meaning="اندکی مایع؛ نطفه: مقدار اندک مایع تولیدمثل در سیاق آفرینش.">نُطفَةٍ</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="خَصيمٌ" data-root="خ ص م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/" data-root-meaning="ستیز و مجادله بر سر ادعا؛ خصم: طرف نزاع.">خَصيمٌ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">مُبينٌ</button>
  </p>
  <p class="farsi-verse">آیا انسان ندیده است که او را از نطفه آفریدیم، پس ناگهان ستیزه‌گری آشکار شد؟</p>
</section>
