<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالقُرءانِ" data-root="ق ر أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-a/" data-root-meaning="خواندن و تلاوت؛ قروء: دوره‌های قاعدگی یا پاکی، با اختلاف در تفسیر.">وَالقُرءانِ</button>
    <button class="word-link" type="button" data-word="الحَكيمِ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">الحَكيمِ</button>
  </p>
  <p class="farsi-verse">سوگند به قرآن حکیم؛</p>
