<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَقصَا" data-root="ق ص و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَقصَا</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المَدينَةِ</button>
    <button class="word-link" type="button" data-word="رَجُلٌ" data-root="ر ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رَجُلٌ</button>
    <button class="word-link" type="button" data-word="يَسعىٰ" data-root="س ع ي" data-learn-more="/quran-terminology/fa/roots/s-ayn-y/" data-root-meaning="از حرکت در یک مسیر تا کوشش برای رسیدن به نتیجه">يَسعىٰ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="اتَّبِعُوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">اتَّبِعُوا</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">المُرسَلينَ</button>
  </p>
  <p class="farsi-verse">و از دورترین بخش شهر مردی شتابان آمد؛ گفت: ای قوم من، از فرستادگان پیروی کنید؛</p>
</section>
