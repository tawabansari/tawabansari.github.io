    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مَنٰفِعُ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/">مَنٰفِعُ</button>

    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلا</button>

  <p class="farsi-verse">و در آن‌ها سودها و نوشیدنی‌هایی برایشان است؛ آیا پس سپاس نمی‌گزارند؟</p>
