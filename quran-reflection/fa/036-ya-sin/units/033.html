<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءايَةٌ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">وَءايَةٌ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">الأَرضُ</button>
    <button class="word-link" type="button" data-word="المَيتَةُ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">المَيتَةُ</button>
    <button class="word-link" type="button" data-word="أَحيَينٰها" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/">أَحيَينٰها</button>
    <button class="word-link" type="button" data-word="وَأَخرَجنا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">وَأَخرَجنا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="حَبًّا" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَبًّا</button>
    <button class="word-link" type="button" data-word="فَمِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمِنهُ</button>
    <button class="word-link" type="button" data-word="يَأكُلونَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/">يَأكُلونَ</button>
  </p>
  <p class="farsi-verse">و زمین مرده نشانه‌ای برای آنان است؛ آن را زنده کردیم و از آن دانه‌ای بیرون آوردیم که از آن می‌خورند.</p>
