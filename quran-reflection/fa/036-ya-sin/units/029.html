<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ همراه «إن ... إلا» رخداد را به یک صیحه محدود می‌کند.">كانَت</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="صَيحَةً" data-root="ص ي ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-h/" data-root-meaning="بانگ و فریاد بلند." data-context="یک بانگ یا فریاد؛ رخدادی که هلاکت آن قوم در پی آن آمد.">صَيحَةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یکی، یگانه؛ صفتِ «صیحه» که یک‌بار بودن آن را بیان می‌کند.">وٰحِدَةً</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="خٰمِدونَ" data-root="خ م د" data-root-meaning="فروکش‌کردن و خاموش‌شدنِ شعله، حرارت یا فعالیت؛ و در کاربرد انسانی، آرام و بی‌حرکت شدن یا پایان حیات." data-context="خاموش و بی‌جان؛ قومی که ناگهان پس از یک صیحه به هلاکت رسیده‌اند." data-learn-more="/quran-terminology/fa/roots/kh-m-d/">خٰمِدونَ</button>
  </p>
  <p class="farsi-verse">جز یک فریاد نبود؛ پس ناگهان خاموش شدند.</p>
</section>
