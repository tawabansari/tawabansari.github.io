  <p class="farsi-verse">و چون به آنان گفته شود: از آنچه آن معبود یگانه روزی‌تان داده انفاق کنید، کسانی که کفر ورزیدند به کسانی که ایمان آوردند می‌گویند: آیا کسی را خوراک دهیم که اگر آن معبود یگانه می‌خواست، خود به او خوراک می‌داد؟ شما جز در گمراهی آشکار نیستید.</p>
