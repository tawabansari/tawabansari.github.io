<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَا</button>
    <button class="word-link" type="button" data-word="الشَّمسُ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="خورشید؛ فاعلِ رسیدنی که در جمله نفی می‌شود.">الشَّمسُ</button>
    <button class="word-link" type="button" data-word="يَنبَغى" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="سزد یا شایسته باشد؛ با نفیِ رسیدن خورشید به ماه.">يَنبَغى</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُدرِكَ" data-root="د ر ك" data-learn-more="/quran-terminology/fa/roots/d-r-k/" data-root-meaning="رسیدن و دست یافتن؛ دریافت حسی یا شناختی، پیوستن و تدارک؛ و در «دَرْك»، مرتبهٔ پایین." data-context="به ماه برسد؛ رسیدنی که برای خورشید در نظمِ بیان‌شده نفی می‌شود.">تُدرِكَ</button>
    <button class="word-link" type="button" data-word="القَمَرَ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان." data-context="ماه؛ چیزی که رسیدن خورشید به آن نفی می‌شود.">القَمَرَ</button>
    <button class="word-link" type="button" data-word="وَلَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَا</button>
    <button class="word-link" type="button" data-word="الَّيلُ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ در نفی پیشی گرفتن آن از روز.">الَّيلُ</button>
    <button class="word-link" type="button" data-word="سابِقُ" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/" data-root-meaning="پیش افتادن، پیشی گرفتن و سبقت جستن؛ از مسابقه و تقدم زمانی تا پیشگامی در کارهای نیک و پیشی‌ناپذیری در برابر اراده آن معبود یگانه" data-context="پیشی‌گیرنده؛ وصفی که برای شب نسبت به روز نفی می‌شود.">سابِقُ</button>
    <button class="word-link" type="button" data-word="النَّهارِ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز؛ در نسبت با شب و پیشی گرفتن.">النَّهارِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="و هر یک؛ شمولِ حکم شناوری نسبت به موارد یادشده.">وَكُلٌّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="فَلَكٍ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش." data-context="فلک؛ مسیر یا گسترهٔ گردش در تصویر آیه.">فَلَكٍ</button>
    <button class="word-link" type="button" data-word="يَسبَحونَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="شناورند؛ حرکتِ بیان‌شده در فلک.">يَسبَحونَ</button>
  </p>
  <p class="farsi-verse">نه خورشید را سزد که به ماه برسد و نه شب از روز پیشی می‌گیرد؛ و هریک در مداری شناورند.</p>
</section>
