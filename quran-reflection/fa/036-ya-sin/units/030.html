<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰحَسرَةً" data-root="ح س ر" data-root-meaning="کنار رفتن پوشش و آشکار شدن؛ تحلیل رفتن نیرو و فرسودگی؛ نیز حسرت، دریغ و اندوه شدید بر فقدان یا پیامد ناخوشایند." data-learn-more="/quran-terminology/fa/roots/h-s-r/" data-context="افسوس بر بندگان؛ ندای دریغ بر رفتار و سرنوشت آنان.">يٰحَسرَةً</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="العِبادِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بندگان؛ کسانی که رفتارشان با فرستادگان وصف می‌شود.">العِبادِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَأتيهِم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به سراغشان می‌آید؛ آمدن فرستاده برای آنان.">يَأتيهِم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَسولٍ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستاده؛ کسی که مأموریت رساندن پیام را دارد.">رَسولٍ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند و چنین می‌کردند؛ بیان رفتار تکرارشونده با فرستادگان.">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="ریشخند می‌کردند؛ برخورد تحقیرآمیز آنان با فرستاده.">يَستَهزِءونَ</button>
  </p>
  <p class="farsi-verse">افسوس بر بندگان؛ هیچ فرستاده‌ای به سراغشان نمی‌آید مگر آنکه او را ریشخند می‌کنند.</p>
</section>
