<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان." data-context="و ماه؛ جرم آسمانی‌ای که در این آیه از منزل‌ها و تغییر شکلِ دیداریِ آن سخن می‌رود.">وَالقَمَرَ</button>
    <button class="word-link" type="button" data-word="قَدَّرنٰهُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="برای آن اندازه‌گذاری کردیم؛ برای ماه منزل‌ها و مرحله‌هایی معین ساختیم.">قَدَّرنٰهُ</button>
    <button class="word-link" type="button" data-word="مَنازِلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="منزل‌ها و مرحله‌های معینِ ماه در سیر آن؛ سیاق به تغییر حالتِ دیداری آن می‌انجامد.">مَنازِلَ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="عادَ" data-root="ع و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-d/" data-root-meaning="بازگشت و تکرار؛ عید: هنگام بازآینده؛ «عاد» نام قوم نیز هست." data-context="بازگشت؛ پس از گذر از منزل‌ها، دوباره به حالتی باریک و خمیده رسید.">عادَ</button>
    <button class="word-link" type="button" data-word="كَالعُرجونِ" data-root="ع ر ج ن" data-root-meaning="چوب یا پایهٔ اصلیِ خوشهٔ خرما؛ بخشی که شاخه‌های حامل میوه به آن متصل‌اند و در حالت کهنه و خشکیده می‌تواند باریک و خمیده شود." data-context="مانند چوبِ خوشهٔ خرما؛ ماه در حالت باریک و خمیده‌اش به چوب کهنهٔ خوشه تشبیه شده است." data-learn-more="/quran-terminology/fa/roots/ayn-r-j-n/">كَالعُرجونِ</button>
    <button class="word-link" type="button" data-word="القَديمِ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن" data-context="کهنه؛ وصفِ چوب خوشهٔ خرما که با گذشت زمان خشک و خمیده شده است.">القَديمِ</button>
  </p>
  <p class="farsi-verse">و برای ماه منزل‌هایی اندازه‌گذاری کردیم تا مانند شاخه کهنه خرما بازگردد.</p>
</section>
