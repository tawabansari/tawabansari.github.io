<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="ق م ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالقَمَرَ</button>
    <button class="word-link" type="button" data-word="قَدَّرنٰهُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">قَدَّرنٰهُ</button>
    <button class="word-link" type="button" data-word="مَنازِلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/">مَنازِلَ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="عادَ" data-root="ع و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عادَ</button>
    <button class="word-link" type="button" data-word="كَالعُرجونِ" data-root="ع ر ج ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَالعُرجونِ</button>
    <button class="word-link" type="button" data-word="القَديمِ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/">القَديمِ</button>
  </p>
  <p class="farsi-verse">و برای ماه منزل‌هایی اندازه‌گذاری کردیم تا مانند شاخه کهنه خرما بازگردد.</p>
