<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="تُنذِرُ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/">تُنذِرُ</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَنِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/">اتَّبَعَ</button>
    <button class="word-link" type="button" data-word="الذِّكرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">الذِّكرَ</button>
    <button class="word-link" type="button" data-word="وَخَشِىَ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/">وَخَشِىَ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/">الرَّحمٰنَ</button>
    <button class="word-link" type="button" data-word="بِالغَيبِ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/">بِالغَيبِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبَشِّرهُ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/">فَبَشِّرهُ</button>
    <button class="word-link" type="button" data-word="بِمَغفِرَةٍ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/">بِمَغفِرَةٍ</button>
    <button class="word-link" type="button" data-word="وَأَجرٍ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/">وَأَجرٍ</button>
    <button class="word-link" type="button" data-word="كَريمٍ" data-root="ك ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَريمٍ</button>
  </p>
  <p class="farsi-verse">تو تنها کسی را هشدار می‌دهی که از یادآوری پیروی کند و در نهان از رحمان بترسد؛ پس او را به آمرزش و پاداشی ارجمند مژده ده.</p>
