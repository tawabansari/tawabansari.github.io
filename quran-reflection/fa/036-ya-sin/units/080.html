<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد یا پدید آورد؛ برای شما از درخت سبز آتش فراهم کرد.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشَّجَرِ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="درخت یا درختان؛ در این آیه با وصف سبز آمده است.">الشَّجَرِ</button>
    <button class="word-link" type="button" data-word="الأَخضَرِ" data-root="خ ض ر" data-root-meaning="سبزی و رنگ سبز؛ در کاربرد گیاهی، تازگی و شادابی." data-context="سبز؛ وصف رنگ درخت، نه خودِ آتش یا شیوهٔ آتش‌افروزی." data-learn-more="/quran-terminology/fa/roots/kh-dad-r/">الأَخضَرِ</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ چیزی که برای انسان از درخت سبز فراهم شده است.">نارًا</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="توقِدونَ" data-root="و ق د" data-learn-more="/quran-terminology/fa/roots/w-q-d/" data-root-meaning="افروختن، شعله‌ور شدن، زنده شدن آتش از ماده سوختنی، و پایداری شعله" data-context="آتش می‌افروزید؛ از آنچه آیه معرفی می‌کند آتش روشن می‌کنید.">توقِدونَ</button>
  </p>
  <p class="farsi-verse">همان که برای شما از درخت سبز آتش قرار داد؛ پس شما از آن آتش می‌افروزید.</p>
</section>
