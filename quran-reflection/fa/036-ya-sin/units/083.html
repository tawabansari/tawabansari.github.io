  <h2 class="ayah-title">یس ۳۶:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَسُبحٰنَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/">فَسُبحٰنَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="بِيَدِهِ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/">بِيَدِهِ</button>
    <button class="word-link" type="button" data-word="مَلَكوتُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/">مَلَكوتُ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَىءٍ</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">تُرجَعونَ</button>
  </p>
  <p class="farsi-verse">پس منزه است آنکه فرمانروایی هر چیزی به دست اوست؛ و به سوی او بازگردانده می‌شوید.</p>
