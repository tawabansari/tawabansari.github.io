<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۷۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="يُحييهَا" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">يُحييهَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَنشَأَها" data-root="ن ش أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَنشَأَها</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="م ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَرَّةٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="خَلقٍ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقٍ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَليمٌ</button>
  </p>
  <p class="farsi-verse">بگو: همان که نخستین بار آن‌ها را پدید آورد زنده‌شان می‌کند؛ و او به هر آفرینشی داناست؛</p>
</section>
