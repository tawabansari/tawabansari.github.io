<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۷۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان پاسخ دادن به پرسش دربارهٔ استخوان‌ها.">قُل</button>
    <button class="word-link" type="button" data-word="يُحييهَا" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="آنها را زنده می‌کند؛ دربارهٔ استخوان‌های یادشده.">يُحييهَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَنشَأَها" data-root="ن ش أ" data-learn-more="/quran-terminology/fa/roots/n-sh-a/" data-root-meaning="پدید آمدن، برآمدن و رشد کردن؛ در ساخت سببی، پدید آوردن، شکل دادن و پرورش دادن." data-context="آنها را پدید آورد؛ اشاره به پدیدآورندهٔ نخستین استخوان‌ها.">أَنشَأَها</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="نخستین؛ در قید «نخستین بار».">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="م ر ر" data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و سپری شدن؛ یک بار یا یک نوبت؛ در شاخه‌های دیگر، تلخی و ناگواری، و قوت و استواری." data-context="بار؛ همراه با «نخستین»، زمان پدید آوردن پیشین.">مَرَّةٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="به هر؛ بیان گستردگی علم او نسبت به آفرینش.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="خَلقٍ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش؛ موضوع دانایی خداوند.">خَلقٍ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصف پدیدآورنده نسبت به هر آفرینش.">عَليمٌ</button>
  </p>
  <p class="farsi-verse">بگو: همان که نخستین بار آن‌ها را پدید آورد زنده‌شان می‌کند؛ و او به هر آفرینشی داناست؛</p>
</section>
