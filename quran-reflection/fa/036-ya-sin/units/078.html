<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَضَرَبَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/">وَضَرَبَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مَثَلًا</button>
    <button class="word-link" type="button" data-word="وَنَسِىَ" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/">وَنَسِىَ</button>
    <button class="word-link" type="button" data-word="خَلقَهُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يُحىِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/">يُحىِ</button>
    <button class="word-link" type="button" data-word="العِظٰمَ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/">العِظٰمَ</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="رَميمٌ" data-root="ر م م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رَميمٌ</button>
  </p>
  <p class="farsi-verse">و برای ما مثالی زد و آفرینش خود را فراموش کرد؛ گفت: چه کسی استخوان‌ها را، در حالی که پوسیده‌اند، زنده می‌کند؟</p>
</section>
