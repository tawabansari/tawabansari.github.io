<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءايَةٌ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">وَءايَةٌ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّا</button>
    <button class="word-link" type="button" data-word="حَمَلنا" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری.">حَمَلنا</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتَهُم" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه">ذُرِّيَّتَهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الفُلكِ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش.">الفُلكِ</button>
    <button class="word-link" type="button" data-word="المَشحونِ" data-root="ش ح ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h-n/" data-root-meaning="پُر کردن و انباشتن؛ مشحون: پُربار و انباشته.">المَشحونِ</button>
  </p>
  <p class="farsi-verse">و نشانه‌ای برای آنان این است که نسلشان را در کشتی پربار حمل کردیم؛</p>
</section>
