<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="تَطَيَّرنا" data-root="ط ي ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَطَيَّرنا</button>
    <button class="word-link" type="button" data-word="بِكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَنتَهوا" data-root="ن ه ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَنتَهوا</button>
    <button class="word-link" type="button" data-word="لَنَرجُمَنَّكُم" data-root="ر ج م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَنَرجُمَنَّكُم</button>
    <button class="word-link" type="button" data-word="وَلَيَمَسَّنَّكُم" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی">وَلَيَمَسَّنَّكُم</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّا</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد">أَليمٌ</button>
  </p>
  <p class="farsi-verse">گفتند: ما شما را به فال بد گرفته‌ایم؛ اگر دست برندارید، بی‌گمان سنگسارتان می‌کنیم و از سوی ما عذابی دردناک به شما می‌رسد.</p>
