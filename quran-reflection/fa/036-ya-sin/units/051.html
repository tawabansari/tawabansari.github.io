<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنُفِخَ" data-root="ن ف خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-kh/" data-root-meaning="دمیدن و به جریان انداختن هوا." data-context="و در صور دمیده می‌شود؛ فعل مجهول.">وَنُفِخَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="ص و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-r/" data-root-meaning="صورت و شکل دادن؛ صور: شیپور؛ «صُر» در بقره با متمایل کردن یا گردآوردن توضیح داده می‌شود." data-context="صور و شیپوری که در آن دمیده می‌شود.">الصّورِ</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَجداثِ" data-root="ج د ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-th/" data-root-meaning="جدث و أجداث: گور و گورها." data-context="گورها؛ مبدأ بیرون آمدن انسان‌ها.">الأَجداثِ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ مقصد بیان‌شدهٔ حرکت در صحنهٔ رستاخیز.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="يَنسِلونَ" data-root="ن س ل" data-root-meaning="بیرون آمدن و جدا شدن از منشأ؛ «نَسْل»: زادگان و تداوم نسل؛ «يَنْسِلُونَ»: حرکت شتابان." data-context="از گورها به سوی پروردگارشان شتابان بیرون می‌آیند." data-learn-more="/quran-terminology/fa/roots/n-s-l/">يَنسِلونَ</button>
  </p>
  <p class="farsi-verse">و در صور دمیده می‌شود؛ پس ناگهان از گورها به سوی پروردگارشان شتابان می‌روند.</p>
</section>
