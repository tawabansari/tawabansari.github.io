<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادیم؛ دو فرستاده به سوی آن مردم.">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="إِلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِمُ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="ث ن ي" data-root-meaning="دوتایی‌شدن، بازگرداندن و تکرار" data-context="دو نفر؛ فرستادگانِ نخست." data-learn-more="/quran-terminology/fa/roots/th-n-y/">اثنَينِ</button>
    <button class="word-link" type="button" data-word="فَكَذَّبوهُما" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="پس آن دو را تکذیب کردند.">فَكَذَّبوهُما</button>
    <button class="word-link" type="button" data-word="فَعَزَّزنا" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری" data-context="پس تقویت کردیم؛ با فرستاده‌ای سوم.">فَعَزَّزنا</button>
    <button class="word-link" type="button" data-word="بِثالِثٍ" data-root="ث ل ث" data-root-meaning="عدد سه و صورت‌های وابسته؛ شمار سه، جایگاه سوم، یک‌سوم و دوسوم، و توزیع سه‌تایی." data-context="با فرستاده‌ای سوم که به دو فرستادهٔ پیشین افزوده شد." data-learn-more="/quran-terminology/fa/roots/th-l-th/">بِثالِثٍ</button>
    <button class="word-link" type="button" data-word="فَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس گفتند؛ سخنِ فرستادگان.">فَقالوا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="مُرسَلونَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستاده‌شده‌ایم؛ بیانِ مأموریتِ فرستادگان.">مُرسَلونَ</button>
  </p>
  <p class="farsi-verse">آنگاه که دو تن را به سوی آنان فرستادیم و آن دو را تکذیب کردند؛ پس با سومی تقویت کردیم و گفتند: ما به سوی شما فرستاده شده‌ایم.</p>
</section>
