<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءايَةٌ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="و نشانه‌ای؛ امری برای توجه و شناخت.">وَءايَةٌ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الَّيلُ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ زمانی که با کنار رفتن روشنایی روز آشکار می‌شود.">الَّيلُ</button>
    <button class="word-link" type="button" data-word="نَسلَخُ" data-root="س ل خ" data-learn-more="/quran-terminology/fa/roots/s-l-kh/" data-root-meaning="کندن پوست و جدا کردن پوشش؛ بیرون آمدن از پیوند پیشین و سپری شدن دوره‌ای زمانی." data-context="روز را از شب برمی‌کنیم؛ روشنایی آن را کنار می‌بریم.">نَسلَخُ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="النَّهارَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز؛ روشنایی روز که از شب جدا می‌شود.">النَّهارَ</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="مُظلِمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="در تاریکی قرارگرفته‌اند.">مُظلِمونَ</button>
  </p>
  <p class="farsi-verse">و شب نشانه‌ای برای آنان است؛ روز را از آن برمی‌کنیم، پس ناگهان در تاریکی‌اند.</p>
</section>
