<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">یس ۳۶:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="توان دارند؛ در اینجا نفی شده است.">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="نَصرَهُم" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="یاری رساندن به آنان.">نَصرَهُم</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="جُندٌ" data-root="ج ن د" data-root-meaning="نیروهای گردآمده برای یاری، پشتیبانی و اقدام مشترک؛ در کاربرد نظامی، سپاه." data-context="سپاهی در نسبت با معبودان؛ مرجع ضمیرها در مقاله بررسی شده است." data-learn-more="/quran-terminology/fa/roots/j-n-d/">جُندٌ</button>
    <button class="word-link" type="button" data-word="مُحضَرونَ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت" data-context="حاضرکرده‌شدگان و به حضور آورده‌شدگان.">مُحضَرونَ</button>
  </p>
  <p class="farsi-verse">توان یاری آنان را ندارند؛ و آنان سپاهی حاضر برای آن‌ها هستند.</p>
</section>
