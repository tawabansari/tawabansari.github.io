  <h2 class="ayah-title">البلد ۹۰:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="أُقسِمُ" data-root="ق س م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-m/" data-root-meaning="تقسیم و بهره‌بندی؛ قَسَم: سوگند.">أُقسِمُ</button>
    <button class="word-link" type="button" data-word="بِهٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهٰذَا</button>
    <button class="word-link" type="button" data-word="البَلَدِ" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»">البَلَدِ</button>
  </p>
  <p class="farsi-verse">نه، سوگند به این شهر،</p>
