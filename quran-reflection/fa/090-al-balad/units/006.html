<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">البلد ۹۰:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولُ</button>
    <button class="word-link" type="button" data-word="أَهلَكتُ" data-root="ه ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-l-k/" data-root-meaning="از میان رفتن و نابود کردن؛ نیز از دست رفتن، بنا بر سیاق.">أَهلَكتُ</button>
    <button class="word-link" type="button" data-word="مالًا" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">مالًا</button>
    <button class="word-link" type="button" data-word="لُبَدًا" data-root="ل ب د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-d/" data-root-meaning="روی هم گرد آمدن و انبوه شدن.">لُبَدًا</button>
  </p>
  <p class="farsi-verse">می‌گوید: «مال فراوانی را تباه کردم.»</p>
