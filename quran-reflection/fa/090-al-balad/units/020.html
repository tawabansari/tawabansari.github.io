<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">البلد ۹۰:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="نارٌ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">نارٌ</button>
    <button class="word-link" type="button" data-word="مُؤصَدَةٌ" data-root="و ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-sad-d/" data-root-meaning="بستن و محکم پوشاندن؛ وصید: آستانه یا فضای ورودی.">مُؤصَدَةٌ</button>
  </p>
  <p class="farsi-verse">بر آنان آتشی فروبسته است.</p>
</section>
