  <h2 class="ayah-title">البلد ۹۰:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهَدَينٰهُ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">وَهَدَينٰهُ</button>
    <button class="word-link" type="button" data-word="النَّجدَينِ" data-root="ن ج د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-j-d/" data-root-meaning="زمین بلند؛ نجدین: دو راه، در توضیح رایج راه خیر و شر.">النَّجدَينِ</button>

  <p class="farsi-verse">و او را به دو راه بلند راه ننمودیم؟</p>
