<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">التین ۹۵:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="خَلَقنَا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَحسَنِ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">أَحسَنِ</button>
    <button class="word-link" type="button" data-word="تَقويمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">تَقويمٍ</button>
  </p>
  <p class="farsi-verse">به‌راستی انسان را در نیکوترین ساختار آفریدیم.</p>
</section>
