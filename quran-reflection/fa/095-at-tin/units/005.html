<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">التین ۹۵:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="رَدَدنٰهُ" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر" data-context="او را بازگرداندیم؛ در بیان انتقال انسان به وضعیت فروتر.">رَدَدنٰهُ</button>
    <button class="word-link" type="button" data-word="أَسفَلَ" data-root="س ف ل" data-learn-more="/quran-terminology/fa/roots/s-f-l/" data-root-meaning="پایین بودن یا پایین‌تر قرار گرفتن نسبت به مکان یا مرتبه‌ای دیگر؛ فرودستی با معنایی وابسته به سیاق." data-context="پایین‌ترین؛ در ترکیب بیانگر شدیدترین فرودستی.">أَسفَلَ</button>
    <button class="word-link" type="button" data-word="سٰفِلينَ" data-root="س ف ل" data-learn-more="/quran-terminology/fa/roots/s-f-l/" data-root-meaning="پایین بودن یا پایین‌تر قرار گرفتن نسبت به مکان یا مرتبه‌ای دیگر؛ فرودستی با معنایی وابسته به سیاق." data-context="فرودستان؛ جمع سافل در ترکیب «أسفل سافلين».">سٰفِلينَ</button>
  </p>
  <p class="farsi-verse">سپس او را به پایین‌ترینِ فرودستان بازگرداندیم،</p>
