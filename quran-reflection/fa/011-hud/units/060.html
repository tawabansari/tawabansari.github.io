  <h2 class="ayah-title">هود ۱۱:۶۰</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/">الدُّنيا</button>

    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>

  </p>
  <p class="farsi-verse">و در این دنیا و روز قیامت لعنتی در پی آنان آمد؛ آگاه باشید که عاد به پروردگارشان کفر ورزیدند؛ آگاه باشید، دور باد عاد، قوم هود.</p>
