    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="أَنصَحَ" data-root="ن ص ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَنصَحَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>

    ۚ

    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">تُرجَعونَ</button>
  </p>
  <p class="farsi-verse">و اگر بخواهم اندرزتان دهم، اندرزم به شما سودی نمی‌رساند اگر آن معبود یگانه بخواهد شما را به بیراهه ببرد؛ او پروردگار شماست و به سوی او بازگردانده می‌شوید.</p>
</section>
