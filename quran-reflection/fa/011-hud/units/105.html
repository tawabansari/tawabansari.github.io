<section class="ayah-block" id="ayah-105" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۰۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که فرا می‌رسد؛ روز مورد بحث در سیاق داوری.">يَومَ</button>
    <button class="word-link" type="button" data-word="يَأتِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="فرا می‌رسد؛ آمدن روز یادشده.">يَأتِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَكَلَّمُ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="سخن می‌گوید؛ در جمله منفی، هیچ نفسی جز با اذن او سخن نمی‌گوید.">تَكَلَّمُ</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="شخص یا جان؛ هیچ‌کس در ساخت منفی جمله.">نَفسٌ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِإِذنِهِ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="با اجازه او.">بِإِذنِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="شَقِىٌّ" data-root="ش ق و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-q-w/" data-root-meaning="رنج و بدبختی و محرومیت از نیک‌فرجامی." data-context="بدبخت؛ در برابر نیکبخت، در وصف فرجام روز داوری.">شَقِىٌّ</button>
    <button class="word-link" type="button" data-word="وَسَعيدٌ" data-root="س ع د" data-learn-more="/quran-terminology/fa/roots/s-ayn-d/" data-root-meaning="نیکبختی و برخورداری از خیر و فرجام مطلوب؛ در شاخه‌های دیگر، یاری کردن و ساعد دست." data-context="نیکبخت؛ در برابر شقی، در وصف فرجام انسان در روز داوری.">وَسَعيدٌ</button>
  </p>
  <p class="farsi-verse">روزی که بیاید، هیچ نفسی جز به اذن او سخن نمی‌گوید؛ پس برخی از آنان بدبخت‌اند و برخی نیکبخت.</p>
</section>
