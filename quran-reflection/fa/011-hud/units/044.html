<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفته شد؛ آغاز فرمان خطاب به زمین و آسمان در پایان طوفان.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="يٰأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="ای زمین؛ مخاطب فرمانِ فروبردن آب.">يٰأَرضُ</button>
    <button class="word-link" type="button" data-word="ابلَعى" data-root="ب ل ع" data-root-meaning="«ب ل ع» به فروبردن چیزی به درون اشاره دارد؛ به‌گونه‌ای که آن چیز از محل آشکار یا جایگاه پیشین خود عبور کند و در فضای درونی قرار گیرد. این معنا درباره آب و خوراک به صورت محسوس و درباره زمین و مجاری آب در کاربردی گسترده‌تر به کار می‌رود." data-context="فرو ببر؛ فرمان به زمین برای فروبردن آب خود در پایان طوفان." data-learn-more="/quran-terminology/fa/roots/b-l-ayn/">ابلَعى</button>
    <button class="word-link" type="button" data-word="ماءَكِ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="آب خودت؛ آب منسوب به زمین در صحنهٔ طوفان، مفعولِ «ابلعی».">ماءَكِ</button>
    <button class="word-link" type="button" data-word="وَيٰسَماءُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="و ای آسمان؛ مخاطب فرمانِ بازایستادن از بارش.">وَيٰسَماءُ</button>
    <button class="word-link" type="button" data-word="أَقلِعى" data-root="ق ل ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-l-ayn/" data-root-meaning="برکندن و بیرون کشیدن؛ نیز بازایستادن." data-context="بازایست؛ فرمان به آسمان برای پایان دادن به بارش.">أَقلِعى</button>
    <button class="word-link" type="button" data-word="وَغيضَ" data-root="غ ي ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-y-dad/" data-root-meaning="کم شدن و فرو نشستن مایع." data-context="و آب فروکش داده شد؛ کاهش و فرونشستن آب طوفان، با فعل مجهول.">وَغيضَ</button>
    <button class="word-link" type="button" data-word="الماءُ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="آب؛ نایب فاعلِ «غیض»، آبی که در پایان طوفان فروکش کرد.">الماءُ</button>
    <button class="word-link" type="button" data-word="وَقُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="و به انجام رسید؛ پایان یافتن امر مورد بحث در سیاق طوفان.">وَقُضِىَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا؛ و اسم «امر»، کار، شأن، مسئله یا رخداد." data-context="کار و امر مورد بحث؛ رویداد طوفان و فرجام گروه ستمگر در این سیاق.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="وَاستَوَت" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی؛ و «استوا»، در سیاق مناسب، قرار گرفتن و استقرار یافتن." data-context="و قرار گرفت؛ کشتی بر جودی آرام گرفت.">وَاستَوَت</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الجودِىِّ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">الجودِىِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفته شد؛ معرفیِ عبارت پایانی دربارهٔ گروه ستمگران.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="بُعدًا" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="دوری باد؛ بیانِ دورافتادگی و طرد گروه ستمگر در پایان آیه.">بُعدًا</button>
    <button class="word-link" type="button" data-word="لِلقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و «قوم»، گروه انسانی، مردم یا جامعه." data-context="برای آن گروه و مردم؛ کسانی که با وصف ستمگران مشخص شده‌اند.">لِلقَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگران؛ وصف گروهی که عبارت پایانی دربارهٔ آنان گفته می‌شود.">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و گفته شد: ای زمین، آب خود را فرو ببر و ای آسمان، بازایست؛ و آب فرو نشست و کار پایان یافت و بر جودی قرار گرفت؛ و گفته شد: دور باد مردم ستمکار.</p>
</section>
