<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقيلَ</button>
    <button class="word-link" type="button" data-word="يٰأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">يٰأَرضُ</button>
    <button class="word-link" type="button" data-word="ابلَعى" data-root="ب ل ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-l-ayn/" data-root-meaning="بلعیدن و فرو بردن در درون.">ابلَعى</button>
    <button class="word-link" type="button" data-word="ماءَكِ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">ماءَكِ</button>
    <button class="word-link" type="button" data-word="وَيٰسَماءُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">وَيٰسَماءُ</button>
    <button class="word-link" type="button" data-word="أَقلِعى" data-root="ق ل ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-l-ayn/" data-root-meaning="برکندن و بیرون کشیدن؛ نیز بازایستادن.">أَقلِعى</button>
    <button class="word-link" type="button" data-word="وَغيضَ" data-root="غ ي ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-y-dad/" data-root-meaning="کم شدن و فرو نشستن مایع.">وَغيضَ</button>
    <button class="word-link" type="button" data-word="الماءُ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">الماءُ</button>
    <button class="word-link" type="button" data-word="وَقُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت">وَقُضِىَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">الأَمرُ</button>
    <button class="word-link" type="button" data-word="وَاستَوَت" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">وَاستَوَت</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الجودِىِّ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">الجودِىِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقيلَ</button>
    <button class="word-link" type="button" data-word="بُعدًا" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بُعدًا</button>
    <button class="word-link" type="button" data-word="لِلقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِلقَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و گفته شد: ای زمین، آب خود را فرو ببر و ای آسمان، بازایست؛ و آب فرو نشست و کار پایان یافت و بر جودی قرار گرفت؛ و گفته شد: دور باد مردم ستمکار.</p>
</section>
