<section class="ayah-block" id="ayah-117" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="چنین نبوده است.">كانَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="لِيُهلِكَ" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="آبادی‌ها را نابود کند؛ در نفیِ هلاک به ظلم هنگام اصلاح‌گری مردم." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">لِيُهلِكَ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی‌ها و جامعه‌های آنها.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="بِظُلمٍ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="به ستم؛ پیوندِ هلاک با ظلم.">بِظُلمٍ</button>
    <button class="word-link" type="button" data-word="وَأَهلُها" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="و مردمِ آن آبادی‌ها.">وَأَهلُها</button>
    <button class="word-link" type="button" data-word="مُصلِحونَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="اصلاح‌گر و در کارِ سامان دادن.">مُصلِحونَ</button>
  </p>
  <p class="farsi-verse">و پروردگارت چنین نبود که آبادی‌ها را به ستم نابود کند، در حالی که مردمشان اصلاح‌گرند.</p>
</section>
