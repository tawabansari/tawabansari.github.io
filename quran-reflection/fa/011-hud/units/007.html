  <p class="farsi-verse">و اوست که آسمان‌ها و زمین را در شش روز آفرید و عرش او بر آب بود، تا شما را بیازماید که کدامتان نیکوکردارترید؛ و اگر بگویی شما پس از مرگ برانگیخته می‌شوید، کافران حتما می‌گویند: این جز جادویی آشکار نیست.</p>
