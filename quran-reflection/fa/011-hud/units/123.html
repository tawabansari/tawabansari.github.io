  <p class="farsi-verse">و نهان آسمان‌ها و زمین از آنِ آن معبود یگانه است و همه کار به سوی او بازگردانده می‌شود؛ پس او را بپرست و بر او توکل کن؛ و پروردگارت از آنچه می‌کنید غافل نیست.</p>
