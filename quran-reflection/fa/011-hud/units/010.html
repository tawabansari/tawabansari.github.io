<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="أَذَقنٰهُ" data-root="ذ و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَذَقنٰهُ</button>
    <button class="word-link" type="button" data-word="نَعماءَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/">نَعماءَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/">بَعدَ</button>
    <button class="word-link" type="button" data-word="ضَرّاءَ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/">ضَرّاءَ</button>
    <button class="word-link" type="button" data-word="مَسَّتهُ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/">مَسَّتهُ</button>
    <button class="word-link" type="button" data-word="لَيَقولَنَّ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">لَيَقولَنَّ</button>
    <button class="word-link" type="button" data-word="ذَهَبَ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">ذَهَبَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">السَّيِّـٔاتُ</button>
    <button class="word-link" type="button" data-word="عَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنّى</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَفَرِحٌ" data-root="ف ر ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَفَرِحٌ</button>
    <button class="word-link" type="button" data-word="فَخورٌ" data-root="ف خ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَخورٌ</button>
  </p>
  <p class="farsi-verse">و اگر پس از رنجی که به او رسیده نعمتی به او بچشانیم، حتما می‌گوید: بدی‌ها از من رفته است؛ بی‌گمان شادمان و فخرفروش می‌شود.</p>
