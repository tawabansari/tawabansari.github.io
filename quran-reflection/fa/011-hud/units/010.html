<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="أَذَقنٰهُ" data-root="ذ و ق" data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و دریافت مزه؛ در کاربرد گسترده، آزمودن و تجربه کردن؛ أَذَاقَ: چشاندن یا دیگری را در معرض تجربه قرار دادن." data-context="به او بچشانیم؛ برخوردار کردن انسان از آسایش پس از سختی.">أَذَقنٰهُ</button>
    <button class="word-link" type="button" data-word="نَعماءَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمت و آسایش؛ آنچه پس از سختی به انسان چشانده می‌شود.">نَعماءَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ ترتیب آسایش نسبت به سختی.">بَعدَ</button>
    <button class="word-link" type="button" data-word="ضَرّاءَ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="سختی؛ وضعیت ناخوشایند پیشین.">ضَرّاءَ</button>
    <button class="word-link" type="button" data-word="مَسَّتهُ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به او رسید؛ تجربهٔ دشواری پیشین.">مَسَّتهُ</button>
    <button class="word-link" type="button" data-word="لَيَقولَنَّ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="قطعاً می‌گوید؛ واکنش گفتاری انسان به رفع سختی.">لَيَقولَنَّ</button>
    <button class="word-link" type="button" data-word="ذَهَبَ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="رفت؛ برطرف شدن بدی‌ها در گفتهٔ او.">ذَهَبَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌ها؛ گرفتاری‌هایی که می‌گوید از او دور شده‌اند.">السَّيِّـٔاتُ</button>
    <button class="word-link" type="button" data-word="عَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنّى</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَفَرِحٌ" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="بسیار شادمان؛ وصف واکنش انسان پس از آسایش.">لَفَرِحٌ</button>
    <button class="word-link" type="button" data-word="فَخورٌ" data-root="ف خ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-kh-r/" data-root-meaning="فخرفروشی و بالیدن؛ فخّار: سفال پخته، در شاخه‌ای دیگر." data-context="فخرفروش؛ خودستایی انسان پس از رفع سختی.">فَخورٌ</button>
  </p>
  <p class="farsi-verse">و اگر پس از رنجی که به او رسیده نعمتی به او بچشانیم، حتما می‌گوید: بدی‌ها از من رفته است؛ بی‌گمان شادمان و فخرفروش می‌شود.</p>
</section>
