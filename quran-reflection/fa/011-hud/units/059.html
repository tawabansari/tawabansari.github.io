<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="عادٌ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عادٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="جَحَدوا" data-root="ج ح د" data-root-meaning="انکار و نپذیرفتن چیزی که موضوع اقرار و پذیرش است؛ در کاربرد برجسته آن، انکار با وجود شناخت حقیقت." data-context="انکار کردند؛ نپذیرفتن نشانه‌های پروردگار با جحود." data-learn-more="/quran-terminology/fa/roots/j-h-d/">جَحَدوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="به نشانه‌ها؛ آیات پروردگار که قوم عاد انکار کردند.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ آن‌که پرورش و تدبیرشان به او وابسته است.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَعَصَوا" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت." data-context="و نافرمانی کردند؛ سرپیچی قوم عاد از فرستادگان پروردگار.">وَعَصَوا</button>
    <button class="word-link" type="button" data-word="رُسُلَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادگانش؛ رسولانی که قوم از آنان نافرمانی کردند.">رُسُلَهُ</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="و پیروی کردند؛ دنبال کردن فرمان صاحبان قدرتِ زورگو.">وَاتَّبَعوا</button>
    <button class="word-link" type="button" data-word="أَمرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان؛ دستور زورگوی سرسخت که قوم از آن پیروی کردند.">أَمرَ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ عمومیت در تعبیر «هر زورگوی سرسخت».">كُلِّ</button>
    <button class="word-link" type="button" data-word="جَبّارٍ" data-root="ج ب ر" data-root-meaning="اصلاح شکستگی و جبران کمبود؛ استواری، قدرت، چیرگی و واداشتن." data-context="زورگو؛ صاحب قدرتی که قوم عاد از فرمان او پیروی کردند، همراه با وصف «عنید»." data-learn-more="/quran-terminology/fa/roots/j-b-r/">جَبّارٍ</button>
    <button class="word-link" type="button" data-word="عَنيدٍ" data-root="ع ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-d/" data-root-meaning="سرسختی و مخالفت؛ «عند» واژه‌ای دستوری برای نزدیکی مکانی یا منزلتی است." data-context="سرسخت و لجوج؛ وصفِ همراه جبار برای مقاومت در برابر حق.">عَنيدٍ</button>
  </p>
  <p class="farsi-verse">و این عاد بود؛ آیات پروردگارشان را انکار کردند و رسولان او را نافرمانی کردند و فرمان هر زورگوی سرسختی را پیروی کردند.</p>
</section>
