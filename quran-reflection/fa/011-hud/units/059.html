<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="عادٌ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عادٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="جَحَدوا" data-root="ج ح د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جَحَدوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَعَصَوا" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/">وَعَصَوا</button>
    <button class="word-link" type="button" data-word="رُسُلَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/">رُسُلَهُ</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/">وَاتَّبَعوا</button>
    <button class="word-link" type="button" data-word="أَمرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/">أَمرَ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلِّ</button>
    <button class="word-link" type="button" data-word="جَبّارٍ" data-root="ج ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جَبّارٍ</button>
    <button class="word-link" type="button" data-word="عَنيدٍ" data-root="ع ن د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَنيدٍ</button>
  </p>
  <p class="farsi-verse">و این عاد بود؛ آیات پروردگارشان را انکار کردند و رسولان او را نافرمانی کردند و فرمان هر زورگوی سرسختی را پیروی کردند.</p>
</section>
