<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الر" data-context="حروف جداگانه: الف، لام، را." data-learn-more="/fa/quran-terminology/huruf-muqattaat/">الر</button>
    ۚ
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابی.">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="أُحكِمَت" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="استوار و منسجم گردانده شد؛ دربارهٔ آیات.">أُحكِمَت</button>
    <button class="word-link" type="button" data-word="ءايٰتُهُ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیاتِ آن.">ءايٰتُهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="فُصِّلَت" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="تفصیل یافت و به‌روشنی بیان شد؛ فعل مجهول دربارهٔ آیات." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">فُصِّلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لَدُن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدُن</button>
    <button class="word-link" type="button" data-word="حَكيمٍ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="حکیم و استوارکار.">حَكيمٍ</button>
    <button class="word-link" type="button" data-word="خَبيرٍ" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="آگاه و باخبر." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">خَبيرٍ</button>
  </p>
  <p class="farsi-verse">الف، لام، را. کتابی است که آیاتش استوار شده، سپس از نزد حکیمی آگاه به تفصیل بیان شده است.</p>
</section>
