<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنِ</button>
    <button class="word-link" type="button" data-word="استَغفِروا" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">استَغفِروا</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="توبوا" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">توبوا</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="يُمَتِّعكُم" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">يُمَتِّعكُم</button>
    <button class="word-link" type="button" data-word="مَتٰعًا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">مَتٰعًا</button>
    <button class="word-link" type="button" data-word="حَسَنًا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">حَسَنًا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَجَلٍ" data-root="أ ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت تعیین‌شده و پایان آن؛ أجل می‌تواند موعد انجام کار یا پایان زندگی باشد.">أَجَلٍ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">مُسَمًّى</button>
    <button class="word-link" type="button" data-word="وَيُؤتِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَيُؤتِ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="ذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذى</button>
    <button class="word-link" type="button" data-word="فَضلٍ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده.">فَضلٍ</button>
    <button class="word-link" type="button" data-word="فَضلَهُ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده.">فَضلَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">تَوَلَّوا</button>
    <button class="word-link" type="button" data-word="فَإِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنّى</button>
    <button class="word-link" type="button" data-word="أَخافُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">أَخافُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابَ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومٍ</button>
    <button class="word-link" type="button" data-word="كَبيرٍ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">كَبيرٍ</button>
  </p>
  <p class="farsi-verse">و اینکه از پروردگارتان آمرزش بخواهید، سپس به سوی او بازگردید تا شما را تا زمانی معین به بهره‌ای نیکو برخوردار کند و به هر صاحب فضلی فضل او را بدهد؛ و اگر روی بگردانید، من از عذاب روزی بزرگ بر شما می‌ترسم.</p>
</section>
