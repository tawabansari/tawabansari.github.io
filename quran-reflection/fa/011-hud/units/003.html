  <p class="farsi-verse">و اینکه از پروردگارتان آمرزش بخواهید، سپس به سوی او بازگردید تا شما را تا زمانی معین به بهره‌ای نیکو برخوردار کند و به هر صاحب فضلی فضل او را بدهد؛ و اگر روی بگردانید، من از عذاب روزی بزرگ بر شما می‌ترسم.</p>
