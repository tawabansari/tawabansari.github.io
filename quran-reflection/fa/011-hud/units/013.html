<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ ادعای ساخته بودن قرآن.">يَقولونَ</button>
    <button class="word-link" type="button" data-word="افتَرىٰهُ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="آن را ساخته است؛ ادعای نسبت‌داده‌شده به مخالفان.">افتَرىٰهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمانِ پاسخ به ادعا.">قُل</button>
    <button class="word-link" type="button" data-word="فَأتوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="پس بیاورید؛ درخواستِ آوردن ده سوره.">فَأتوا</button>
    <button class="word-link" type="button" data-word="بِعَشرِ" data-root="ع ش ر" data-root-meaning="ده و صورت‌ها و نسبت‌های عددی آن؛ معاشرت، همراهی، خویشاوندی و جماعت؛ عشار: شتران مادهٔ نزدیک به زایمان." data-context="ده؛ شمارِ سوره‌های خواسته‌شده." data-learn-more="/quran-terminology/fa/roots/ayn-sh-r/">بِعَشرِ</button>
    <button class="word-link" type="button" data-word="سُوَرٍ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-context="سوره‌ها؛ آنچه ده نمونه از آن خواسته شده است." data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد؛ و سوره: واحدی مشخص از متن قرآن با آغاز و پایان.">سُوَرٍ</button>
    <button class="word-link" type="button" data-word="مِثلِهِ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مانند آن؛ وصفِ سوره‌های خواسته‌شده.">مِثلِهِ</button>
    <button class="word-link" type="button" data-word="مُفتَرَيٰتٍ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="ساخته‌شده؛ وصفِ سوره‌ها در پاسخِ چالشی به ادعای افترا.">مُفتَرَيٰتٍ</button>
    <button class="word-link" type="button" data-word="وَادعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="و بخوانید؛ فراخواندن یاری‌دهندگان.">وَادعوا</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَنِ</button>
    <button class="word-link" type="button" data-word="استَطَعتُم" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="توانستید؛ حدِ کسانی که می‌توانند فراخوانند.">استَطَعتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="غیرِ؛ در عبارتِ «غیر الله».">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="هستید؛ در شرطِ راستگو بودن.">كُنتُم</button>
    <button class="word-link" type="button" data-word="صٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راستگویان؛ وصفِ مشروطِ مدعیان.">صٰدِقينَ</button>
  </p>
  <p class="farsi-verse">یا می‌گویند آن را برساخته است؟ بگو: پس ده سوره برساخته مانند آن بیاورید و هرکه را جز آن معبود یگانه می‌توانید بخوانید، اگر راست‌گویید.</p>
</section>
