  <p class="farsi-verse">یا می‌گویند آن را برساخته است؟ بگو: پس ده سوره برساخته مانند آن بیاورید و هرکه را جز آن معبود یگانه می‌توانید بخوانید، اگر راست‌گویید.</p>
