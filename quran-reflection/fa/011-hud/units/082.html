<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="فرا رسید؛ در این جمله دربارهٔ فرا رسیدن فرمان ماست.">جاءَ</button>
    <button class="word-link" type="button" data-word="أَمرُنا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان ما؛ آنچه فرا رسید و رخدادِ پس از آن را در پی داشت.">أَمرُنا</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار دادیم و گردانیدیم؛ بالا را به پایین تبدیل کردیم.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="عٰلِيَها" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="بخش بالایی آن؛ در نسبت با پایینِ همان آبادی.">عٰلِيَها</button>
    <button class="word-link" type="button" data-word="سافِلَها" data-root="س ف ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-f-l/" data-root-meaning="پایین و فرودست بودن، در برابر بالا." data-context="بخش پایینی آن؛ حالتی که بالای آبادی به آن گردانده شد.">سافِلَها</button>
    <button class="word-link" type="button" data-word="وَأَمطَرنا" data-root="م ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-tt-r/" data-root-meaning="باران و باریدن؛ خوشایند یا آسیب‌رسان بودن آن را سیاق روشن می‌کند." data-context="و فرو باراندیم؛ باراندن سنگ‌ها بر آن آبادی.">وَأَمطَرنا</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="حِجارَةً" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/" data-root-meaning="سنگ، سختی، حریم، منع، مرزبندی صلب و بازدارندگی" data-context="سنگ‌ها؛ آنچه در این رخداد بر آبادی بارانده شد.">حِجارَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سِجّيلٍ" data-root-note="اشتقاق تاریخی «سجّیل» مورد اختلاف است؛ قرار گرفتن آن زیر س ج ل در فهرست صرفی، به‌تنهایی ریشهٔ تاریخی آن را ثابت نمی‌کند." data-root="س ج ل" data-learn-more="/quran-terminology/fa/roots/s-j-l/" data-root-meaning="دلو و ریختن آب؛ سجلّ: طومار و سند؛ سجّیل: ماده سنگ‌ها، با منشأ تاریخی مورد اختلاف." data-context="سجیل؛ ماده‌ای که سنگ‌ها از آن معرفی شده‌اند و «منضود» وصفِ آن است؛ منشأ و معنای تاریخی این نام محل بحث است.">سِجّيلٍ</button>
    <button class="word-link" type="button" data-word="مَنضودٍ" data-root="ن ض د" data-learn-more="/quran-terminology/fa/roots/n-dad-d/" data-root-meaning="کنار هم یا روی هم چیدن اجزا به‌صورت پیوسته و منظم." data-context="برهم‌نهاده و پیوسته؛ وصفِ سجیل و آرایش اجزای آن.">مَنضودٍ</button>
  </p>
  <p class="farsi-verse">پس چون فرمان ما رسید، بالای آن را زیر آن قرار دادیم و بر آن سنگ‌هایی از گل پخته، لایه‌لایه، باراندیم؛</p>
</section>
