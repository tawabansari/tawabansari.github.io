  <p class="farsi-verse">و ای قوم من، مخالفتتان با من شما را به آنجا نکشاند که مانند آنچه به قوم نوح یا قوم هود یا قوم صالح رسید به شما برسد؛ و قوم لوط از شما دور نیست.</p>
