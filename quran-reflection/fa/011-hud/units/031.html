  <p class="farsi-verse">و به شما نمی‌گویم گنجینه‌های آن معبود یگانه نزد من است و نه نهان را می‌دانم و نه می‌گویم فرشته‌ام و نه درباره کسانی که دیدگانتان خوار می‌شمارد می‌گویم آن معبود یگانه هرگز خیری به آنان نمی‌دهد؛ آن معبود یگانه به آنچه در جانشان است داناتر است؛ در آن صورت از ستمکاران خواهم بود.</p>
