<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/">دونِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكيدونى" data-root="ك ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَكيدونى</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/">جَميعًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُنظِرونِ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/">تُنظِرونِ</button>
  </p>
  <p class="farsi-verse">جز او؛ پس همگی بر ضد من تدبیر کنید، سپس مهلتم ندهید.</p>
