<section class="ayah-block" id="ayah-118" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شاءَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="لَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">لَجَعَلَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/">النّاسَ</button>
    <button class="word-link" type="button" data-word="أُمَّةً" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/">أُمَّةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/">وٰحِدَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَزالونَ" data-root="ز و ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَزالونَ</button>
    <button class="word-link" type="button" data-word="مُختَلِفينَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/">مُختَلِفينَ</button>
  </p>
  <p class="farsi-verse">و اگر پروردگارت می‌خواست، مردم را یک جماعت قرار می‌داد؛ و پیوسته اختلاف می‌کنند؛</p>
</section>
