<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفته شد؛ فعل مجهولِ خطاب به نوح.">قيلَ</button>
    <button class="word-link" type="button" data-word="يٰنوحُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰنوحُ</button>
    <button class="word-link" type="button" data-word="اهبِط" data-root="ه ب ط" data-learn-more="/quran-terminology/fa/roots/h2-b-tt/" data-root-meaning="فرود آمدن، پایین آمدن، و انتقال به بستری پایین‌تر، زمینی‌تر، یا محدودتر." data-context="فرود آی؛ فرمان به نوح.">اهبِط</button>
    <button class="word-link" type="button" data-word="بِسَلٰمٍ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="با سلام و ایمنی از سوی ما.">بِسَلٰمٍ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّا</button>
    <button class="word-link" type="button" data-word="وَبَرَكٰتٍ" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="برکت‌هایی بر نوح و گروه‌هایی از همراهان او؛ در کنارِ سلام." data-learn-more="/quran-terminology/fa/roots/b-r-k/">وَبَرَكٰتٍ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="أُمَمٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="امت‌ها و گروه‌هایی از همراهانِ نوح.">أُمَمٍ</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّن</button>
    <button class="word-link" type="button" data-word="مَعَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُمَمٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="امت‌ها و گروه‌های دیگری که سرنوشتشان بیان می‌شود.">وَأُمَمٌ</button>
    <button class="word-link" type="button" data-word="سَنُمَتِّعُهُم" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="آنان را بهره‌مند خواهیم ساخت؛ برخورداریِ پیش از عذاب.">سَنُمَتِّعُهُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَمَسُّهُم" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به آنان می‌رسد؛ دربارهٔ عذاب.">يَمَسُّهُم</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّا</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب و کیفرِ بیان‌شده.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد" data-context="دردناک؛ وصفِ عذاب.">أَليمٌ</button>
  </p>
  <p class="farsi-verse">گفته شد: ای نوح، با سلامی از ما و برکت‌هایی بر تو و بر جماعت‌هایی از همراهانت فرود آی؛ و جماعت‌هایی هستند که برخوردارشان می‌کنیم، سپس از سوی ما عذابی دردناک به آنان می‌رسد.</p>
</section>
