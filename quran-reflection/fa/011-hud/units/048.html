  <p class="farsi-verse">گفته شد: ای نوح، با سلامی از ما و برکت‌هایی بر تو و بر جماعت‌هایی از همراهانت فرود آی؛ و جماعت‌هایی هستند که برخوردارشان می‌کنیم، سپس از سوی ما عذابی دردناک به آنان می‌رسد.</p>
