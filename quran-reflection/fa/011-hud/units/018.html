  <p class="farsi-verse">و چه کسی ستمکارتر از کسی است که بر آن معبود یگانه دروغ ببندد؟ آنان بر پروردگارشان عرضه می‌شوند و گواهان می‌گویند: اینان کسانی‌اند که بر پروردگارشان دروغ بستند؛ آگاه باشید که لعنت آن معبود یگانه بر ستمکاران است؛</p>
