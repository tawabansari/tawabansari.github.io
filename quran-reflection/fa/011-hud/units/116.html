  <p class="farsi-verse">پس چرا از نسل‌های پیش از شما صاحبان فضیلتی نبودند که از فساد در زمین بازدارند، جز اندکی از کسانی که از میانشان نجات دادیم؟ و ستمکاران در پی آن ناز و نعمتی رفتند که در آن قرار گرفته بودند و مجرم بودند.</p>
