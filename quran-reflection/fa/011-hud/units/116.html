<section class="ayah-block" id="ayah-116" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَولا</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در پرسش از وجود اصلاحگران در نسل‌های پیشین.">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القُرونِ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره." data-context="نسل‌ها و جماعت‌های پیشین؛ جوامعی که از آنان سخن می‌رود.">القُرونِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكُم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از شما؛ جایگاه زمانیِ نسل‌های یادشده.">قَبلِكُم</button>
    <button class="word-link" type="button" data-word="أُولوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولوا</button>
    <button class="word-link" type="button" data-word="بَقِيَّةٍ" data-root="ب ق ي" data-root-meaning="«ب ق ي» به ادامه داشتن و از میان نرفتن چیزی در برابر پایان یافتن، زوال یا از دست رفتن آن اشاره دارد. در ساختمان‌های سببی، به باقی گذاشتن و حفظ کردن می‌رسد؛ در صورت‌های وصفی، ماندگاری و بازماندن را بیان می‌کند؛ و در اسم «بقية»، به آنچه از یک مجموعه، رابطه یا مایه ارزشمند همچنان بر جا مانده است اشاره دارد." data-context="مایه‌ای باقی از خیر و تشخیص؛ در ترکیب صاحبان بقية که از فساد بازمی‌دارند." data-learn-more="/quran-terminology/fa/roots/b-q-y/">بَقِيَّةٍ</button>
    <button class="word-link" type="button" data-word="يَنهَونَ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده." data-context="بازمی‌داشتند؛ اقدام به جلوگیری از فساد در زمین.">يَنهَونَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="الفَسادِ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع" data-context="فساد؛ تباهکاری‌ای که صاحبان بقية با آن مقابله می‌کنند.">الفَسادِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ عرصهٔ فساد و اقدام اصلاحی.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندکی؛ استثنای شمار محدودی از نجات‌یافتگان.">قَليلًا</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّن</button>
    <button class="word-link" type="button" data-word="أَنجَينا" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن" data-context="نجات دادیم؛ رهانیدن آن شمار اندک.">أَنجَينا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاتَّبَعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="و پیروی کردند؛ دنبال کردن رفاه و برخورداری به دست ستمگران.">وَاتَّبَعَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم کردند؛ گروهی که از فساد و رفاهِ غفلت‌آور پیروی کردند.">ظَلَموا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أُترِفوا" data-root="ت ر ف" data-learn-more="/quran-terminology/fa/roots/t-r-f/" data-root-meaning="فراخی زندگی، نازپروردگی، عادت به آسایش، و تبدیل برخورداری به احساس امتیاز و مقاومت در برابر حق" data-context="در آن به رفاه رسیده بودند؛ برخورداری‌ای که سرگرم آن شدند.">أُترِفوا</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بودند؛ وصفِ مجرم بودن آنان.">وَكانوا</button>
    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ مرتکبان کردارِ نکوهیدهٔ بیان‌شده." data-learn-more="/quran-terminology/fa/roots/j-r-m/">مُجرِمينَ</button>
  </p>
  <p class="farsi-verse">پس چرا از نسل‌های پیش از شما صاحبان فضیلتی نبودند که از فساد در زمین بازدارند، جز اندکی از کسانی که از میانشان نجات دادیم؟ و ستمکاران در پی آن ناز و نعمتی رفتند که در آن قرار گرفته بودند و مجرم بودند.</p>
</section>
