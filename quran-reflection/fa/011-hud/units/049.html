  <p class="farsi-verse">این از خبرهای نهان است که به تو وحی می‌کنیم؛ پیش از این نه تو آن‌ها را می‌دانستی و نه قومت؛ پس شکیبا باش؛ سرانجام از آنِ پرواپیشگان است.</p>
