<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">تِلكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَنباءِ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">أَنباءِ</button>
    <button class="word-link" type="button" data-word="الغَيبِ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد">الغَيبِ</button>
    <button class="word-link" type="button" data-word="نوحيها" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق.">نوحيها</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتَ</button>
    <button class="word-link" type="button" data-word="تَعلَمُها" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">تَعلَمُها</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="قَومُكَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومُكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلِ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">فَاصبِر</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="العٰقِبَةَ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار">العٰقِبَةَ</button>
    <button class="word-link" type="button" data-word="لِلمُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">لِلمُتَّقينَ</button>
  </p>
  <p class="farsi-verse">این از خبرهای نهان است که به تو وحی می‌کنیم؛ پیش از این نه تو آن‌ها را می‌دانستی و نه قومت؛ پس شکیبا باش؛ سرانجام از آنِ پرواپیشگان است.</p>
</section>
