<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغازِ سخنِ نقل‌شده.">قالَ</button>
    <button class="word-link" type="button" data-word="سَـٔاوى" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="پیوستن و جای گرفتن نزد کسی یا در جایی؛ پناه گرفتن یا توقف کردن، بنا بر سیاق." data-context="به کوهی پناه خواهم برد؛ قصدِ پسر نوح برای حفاظت از آب.">سَـٔاوى</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جَبَلٍ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوهی؛ مقصدِ پناه‌جویی." data-learn-more="/quran-terminology/fa/roots/j-b-l/">جَبَلٍ</button>
    <button class="word-link" type="button" data-word="يَعصِمُنى" data-root="ع ص م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sad-m/" data-root-meaning="نگه داشتن و بازداشتن از آسیب؛ اعتصام: محکم چنگ زدن." data-context="مرا حفظ کند و از آسیب نگه دارد.">يَعصِمُنى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الماءِ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="آب؛ خطری که پناه‌جو از آن می‌گریزد.">الماءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغازِ سخنِ نقل‌شده.">قالَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="عاصِمَ" data-root="ع ص م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sad-m/" data-root-meaning="نگه داشتن و بازداشتن از آسیب؛ اعتصام: محکم چنگ زدن." data-context="نگهدارنده و محافظ؛ در ساختِ نفی.">عاصِمَ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="امروز؛ زمانِ رخداد و داوریِ بیان‌شده.">اليَومَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان؛ در ترکیبِ فرمانِ آن معبود یگانه.">أَمرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="رَحِمَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمت کند؛ مهربانی و نجاتِ یادشده از اوست.">رَحِمَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَحالَ" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها" data-context="و حایل شد؛ میانِ آن دو فاصله انداخت.">وَحالَ</button>
    <button class="word-link" type="button" data-word="بَينَهُمَا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میانِ آن دو.">بَينَهُمَا</button>
    <button class="word-link" type="button" data-word="المَوجُ" data-root="م و ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-w-j/" data-root-meaning="موج و حرکت موج‌وار." data-context="موج؛ آنچه میانِ پدر و پسر حایل شد.">المَوجُ</button>
    <button class="word-link" type="button" data-word="فَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="پس شد؛ در زمرهٔ گروهِ بعد قرار گرفت.">فَكانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُغرَقينَ" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب" data-context="غرق‌شدگان.">المُغرَقينَ</button>
  </p>
  <p class="farsi-verse">گفت: به کوهی پناه می‌برم که مرا از آب نگه دارد؛ گفت: امروز در برابر فرمان آن معبود یگانه هیچ نگهدارنده‌ای نیست، مگر آن‌که رحم کند؛ و موج میان آن دو جدایی انداخت و او از غرق‌شدگان شد.</p>
</section>
