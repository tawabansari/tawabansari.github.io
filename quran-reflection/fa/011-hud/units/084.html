  </p>
  <p class="farsi-verse">و به سوی مدین، برادرشان شعیب را؛ گفت: ای قوم من، آن معبود یگانه را بپرستید؛ هیچ معبودی جز او ندارید؛ و از پیمانه و ترازو نکاهید؛ شما را در نیکی می‌بینم و از عذاب روزی فراگیر بر شما می‌ترسم.</p>
</section>
