  <p class="farsi-verse">و به سوی ثمود، برادرشان صالح را؛ گفت: ای قوم من، آن معبود یگانه را بپرستید؛ هیچ معبودی جز او ندارید؛ او شما را از زمین پدید آورد و شما را در آن آبادگر ساخت؛ پس از او آمرزش بخواهید، سپس به سوی او بازگردید؛ پروردگارم نزدیک و پاسخ‌دهنده است.</p>
