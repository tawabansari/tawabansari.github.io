<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَسَوفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَسَوفَ</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="خواهید دانست">تَعلَمونَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَأتيهِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به او می‌رسد">يَأتيهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذابی؛ فاعل رسیدن">عَذابٌ</button>
    <button class="word-link" type="button" data-word="يُخزيهِ" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران" data-context="او را خوار می‌کند">يُخزيهِ</button>
    <button class="word-link" type="button" data-word="وَيَحِلُّ" data-root="ح ل ل" data-root-meaning="گشودن و برداشتن بستگی؛ روا بودن و رفع ممنوعیت؛ فرود آمدن و قرار گرفتن در جایگاه." data-context="و فرود می‌آید؛ عذابِ پایدار بر شخص." data-learn-more="/quran-terminology/fa/roots/h-l-l/">وَيَحِلُّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ فاعل فرود آمدن">عَذابٌ</button>
    <button class="word-link" type="button" data-word="مُقيمٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="پایدار؛ وصف عذاب">مُقيمٌ</button>
  </p>
  <p class="farsi-verse">پس خواهید دانست عذابی که خوار می‌کند به چه کسی می‌رسد و عذابی ماندگار بر چه کسی فرود می‌آید.</p>
</section>
