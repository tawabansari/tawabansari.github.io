<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَت" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَت</button>
    <button class="word-link" type="button" data-word="رُسُلُنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رُسُلُنا</button>
    <button class="word-link" type="button" data-word="لوطًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لوطًا</button>
    <button class="word-link" type="button" data-word="سىءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سىءَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="وَضاقَ" data-root="ض ي ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-y-q/" data-root-meaning="تنگی و در تنگنا بودن یا قرار دادن.">وَضاقَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="ذَرعًا" data-root="ذ ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-ayn/" data-root-meaning="ساعد و ذراع؛ نیز اندازه‌گیری و توان گنجایش یا تحمل.">ذَرعًا</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="يَومٌ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومٌ</button>
    <button class="word-link" type="button" data-word="عَصيبٌ" data-root="ع ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sad-b/" data-root-meaning="بستن و استواری گروه؛ عصبه: گروه همبسته؛ عصیب: سخت و دشوار.">عَصيبٌ</button>
  </p>
  <p class="farsi-verse">و چون رسولان ما نزد لوط آمدند، از آمدنشان نگران شد و توانش از آنان به تنگ آمد و گفت: این روزی سخت است.</p>
</section>
