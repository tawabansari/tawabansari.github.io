<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="د ب ب" data-root-meaning="جنبیدن، حرکت کردن و جنبنده؛ از حرکت مورچه و راه رفتن انسان تا گستردگی جانداران، روزی آنان و دو کاربرد متفاوت «دابة الأرض» در قرآن" data-learn-more="/quran-terminology/fa/roots/d-b-b/">دابَّةٍ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="رِزقُها" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">رِزقُها</button>
    <button class="word-link" type="button" data-word="وَيَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">وَيَعلَمُ</button>
    <button class="word-link" type="button" data-word="مُستَقَرَّها" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری.">مُستَقَرَّها</button>
    <button class="word-link" type="button" data-word="وَمُستَودَعَها" data-root="و د ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-d-ayn/" data-root-meaning="واگذاشتن؛ وداع و ترک کردن؛ مستودع: جای سپرده شدن.">وَمُستَودَعَها</button>
    ۚ
    <button class="word-link" type="button" data-word="كُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلٌّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="كِتٰبٍ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">كِتٰبٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">مُبينٍ</button>
  </p>
  <p class="farsi-verse">و هیچ جنبنده‌ای در زمین نیست مگر اینکه روزی‌اش بر عهده آن معبود یگانه است و قرارگاه و سپرده‌گاهش را می‌داند؛ همه در کتابی روشن است.</p>
</section>
