<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۹۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَقدُمُ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن">يَقدُمُ</button>
    <button class="word-link" type="button" data-word="قَومَهُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومَهُ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="فَأَورَدَهُمُ" data-root="و ر د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَورَدَهُمُ</button>
    <button class="word-link" type="button" data-word="النّارَ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="الوِردُ" data-root="و ر د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الوِردُ</button>
    <button class="word-link" type="button" data-word="المَورودُ" data-root="و ر د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المَورودُ</button>
  </p>
  <p class="farsi-verse">در روز قیامت پیشاپیش قومش می‌رود و آنان را به آتش درمی‌آورد؛ و چه بد آبشخوری است که به آن درمی‌آیند.</p>
</section>
