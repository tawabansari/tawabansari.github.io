  <p class="farsi-verse">و ای قوم من، این ماده‌شتر آن معبود یگانه، نشانه‌ای برای شماست؛ بگذارید در زمین آن معبود یگانه بخورد و آسیبی به آن نرسانید که عذابی نزدیک شما را می‌گیرد.</p>
