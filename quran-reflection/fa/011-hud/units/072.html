<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ سخنِ همسر ابراهیم.">قالَت</button>
    <button class="word-link" type="button" data-word="يٰوَيلَتىٰ" data-root="و ي ل" data-learn-more="/quran-terminology/fa/roots/w-y-l/" data-root-meaning="از فریاد اندوه و هشدار تا اعلام بدفرجامی" data-context="ای وای بر من؛ ندای شگفتی در این سیاق.">يٰوَيلَتىٰ</button>
    <button class="word-link" type="button" data-word="ءَأَلِدُ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="آیا فرزند می‌آورم؛ پرسشِ شگفت‌زده.">ءَأَلِدُ</button>
    <button class="word-link" type="button" data-word="وَأَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنا۠</button>
    <button class="word-link" type="button" data-word="عَجوزٌ" data-root="ع ج ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-z/" data-root-meaning="ناتوان شدن یا ناتوان ساختن؛ عجوز: زن سالخورده." data-context="زنِ سالخورده؛ وصفِ گوینده.">عَجوزٌ</button>
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="بَعلى" data-root="ب ع ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-ayn-l/" data-root-meaning="بعل: شوهر یا صاحب؛ در سورهٔ صافات، نام معبودی خاص است." data-context="شوهرم؛ همسرِ سالخوردهٔ او.">بَعلى</button>
    <button class="word-link" type="button" data-word="شَيخًا" data-root="ش ي خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-kh/" data-root-meaning="پیری و سالخوردگی؛ شیخ: مرد سالخورده." data-context="پیر؛ وصف شوهر.">شَيخًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="لَشَىءٌ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بی‌گمان چیزی؛ موضوعِ وصفِ عجیب.">لَشَىءٌ</button>
    <button class="word-link" type="button" data-word="عَجيبٌ" data-root="ع ج ب" data-root-meaning="شگفتی و بزرگ یا غیرمعمول یافتن؛ در اعجاب، جلب پسند یا تأثیر گذاشتن؛ و در کاربردِ عُجب، خودپسندی." data-context="شگفت‌انگیز؛ وصفِ فرزنددار شدن در سالخوردگی." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/">عَجيبٌ</button>
  </p>
  <p class="farsi-verse">گفت: ای وای بر من، آیا فرزند می‌زایم در حالی که پیرزنم و این شوهرم پیرمرد است؟ این چیزی شگفت است.</p>
</section>
