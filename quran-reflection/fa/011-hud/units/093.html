  <p class="farsi-verse">و ای قوم من، بر جایگاه خود عمل کنید؛ من نیز عمل می‌کنم؛ خواهید دانست عذابی که خوار می‌کند به چه کسی می‌رسد و چه کسی دروغ‌گوست؛ و مراقب باشید که من نیز همراه شما مراقبم.</p>
