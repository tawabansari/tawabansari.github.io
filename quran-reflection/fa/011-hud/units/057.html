  <p class="farsi-verse">پس اگر روی بگردانید، آنچه را با آن به سوی شما فرستاده شده‌ام به شما رسانده‌ام و پروردگارم مردمی جز شما را جانشین می‌کند و هیچ زیانی به او نمی‌رسانید؛ پروردگارم بر هر چیزی نگهبان است.</p>
