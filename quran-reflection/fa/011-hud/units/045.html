<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنادىٰ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="و ندا کرد؛ خطاب نوح به پروردگارش." data-learn-more="/quran-terminology/fa/roots/n-d-y/">وَنادىٰ</button>
    <button class="word-link" type="button" data-word="نوحٌ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٌ</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش؛ مخاطب ندای نوح.">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="فَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس گفت؛ آغاز محتوای ندای نوح.">فَقالَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ خطاب نوح.">رَبِّ</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="ابنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="پسر من؛ موضوع سخن نوح.">ابنى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَهلى" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="خانوادهٔ من؛ نسبت پسر با نوح.">أَهلى</button>
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="وَعدَكَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعدهٔ تو؛ وعدهٔ پروردگار.">وَعدَكَ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ وصف وعده.">الحَقُّ</button>
    <button class="word-link" type="button" data-word="وَأَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتَ</button>
    <button class="word-link" type="button" data-word="أَحكَمُ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="داورترین؛ برتری در داوری.">أَحكَمُ</button>
    <button class="word-link" type="button" data-word="الحٰكِمينَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="داوران؛ کسانی که حکم می‌کنند.">الحٰكِمينَ</button>
  </p>
  <p class="farsi-verse">و نوح پروردگارش را خواند و گفت: پروردگارا، پسرم از خانواده من است و وعده تو حق است و تو داورترین داورانی.</p>
</section>
