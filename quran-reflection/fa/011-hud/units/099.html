<section class="ayah-block" id="ayah-099" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۹۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأُتبِعوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="و لعنت در پی آنان قرار داده شد؛ فعل مجهول.">وَأُتبِعوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="لَعنَةً" data-root="ل ع ن" data-learn-more="/quran-terminology/fa/roots/l-ayn-n/" data-root-meaning="راندن، دور ساختن و قرار گرفتن در جایگاه طرد" data-context="لعنت و طردی که در این زندگی و روز قیامت در پی آنان است.">لَعنَةً</button>
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روز؛ در ترکیب «روز قیامت».">وَيَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قیامت و رستاخیز؛ در ترکیب «روز قیامت».">القِيٰمَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="چه بد؛ فعل نکوهش برای عطا و فرجامی که در ادامه وصف می‌شود.">بِئسَ</button>
    <button class="word-link" type="button" data-word="الرِّفدُ" data-root="ر ف د" data-learn-more="/quran-terminology/fa/roots/r-f-d/" data-root-meaning="یاری و پشتیبانی، با عطا یا وسیله‌ای دیگر؛ فراهم کردن چیزی برای تقویت یا بهره‌مندی دیگری." data-context="عطا و بخشش؛ در این سیاق، تعبیری طعنه‌آمیز برای لعنت و فرجام نکوهیدهٔ آنان.">الرِّفدُ</button>
    <button class="word-link" type="button" data-word="المَرفودُ" data-root="ر ف د" data-learn-more="/quran-terminology/fa/roots/r-f-d/" data-root-meaning="یاری و پشتیبانی، با عطا یا وسیله‌ای دیگر؛ فراهم کردن چیزی برای تقویت یا بهره‌مندی دیگری." data-context="عطا‌شده یا با افزوده‌ای همراه‌شده؛ اسم مفعول در ترکیب نکوهشیِ رفد.">المَرفودُ</button>
  </p>
  <p class="farsi-verse">و در این و روز قیامت لعنتی در پی آنان آمد؛ چه بد بخششی است که بخشیده شده است.</p>
</section>
