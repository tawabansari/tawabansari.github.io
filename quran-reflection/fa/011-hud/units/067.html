<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَخَذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="و فراگرفت؛ رسیدن صیحه به کسانی که ستم کرده بودند.">وَأَخَذَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَمُوا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم کردند؛ وصف کسانی که گرفتار صیحه شدند.">ظَلَمُوا</button>
    <button class="word-link" type="button" data-word="الصَّيحَةُ" data-root="ص ي ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-h/" data-root-meaning="بانگ و فریاد بلند." data-context="بانگ و صدای شدید؛ رخدادی که ستمکاران را فراگرفت.">الصَّيحَةُ</button>
    <button class="word-link" type="button" data-word="فَأَصبَحوا" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ." data-context="پس به این حال درآمدند؛ وضعیتِ پس از صیحه را معرفی می‌کند.">فَأَصبَحوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="دِيٰرِهِم" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت" data-context="خانه‌ها و جایگاه‌های سکونتشان؛ محل ازپاافتادن آنان.">دِيٰرِهِم</button>
    <button class="word-link" type="button" data-word="جٰثِمينَ" data-root="ج ث م" data-root-meaning="فرونشستن، به زمین چسبیدن و در همان جایگاه ماندن؛ درباره انسان و جانور." data-context="ازپاافتاده و بی‌حرکت بر زمین مانده؛ وصف ستمکاران قوم صالح پس از صیحه." data-learn-more="/quran-terminology/fa/roots/j-th-m/">جٰثِمينَ</button>
  </p>
  <p class="farsi-verse">و بانگ، ستمکاران را گرفت و در خانه‌هایشان از پا افتادند؛</p>
</section>
