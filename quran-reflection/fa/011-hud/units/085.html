<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۸۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَيٰقَومِ</button>
    <button class="word-link" type="button" data-word="أَوفُوا" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا">أَوفُوا</button>
    <button class="word-link" type="button" data-word="المِكيالَ" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد">المِكيالَ</button>
    <button class="word-link" type="button" data-word="وَالميزانَ" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار">وَالميزانَ</button>
    <button class="word-link" type="button" data-word="بِالقِسطِ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است.">بِالقِسطِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبخَسُوا" data-root="ب خ س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-kh-s/" data-root-meaning="کم گذاشتن و کاستن ناعادلانه از حق، ارزش یا اندازهٔ چیزی.">تَبخَسُوا</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسَ</button>
    <button class="word-link" type="button" data-word="أَشياءَهُم" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">أَشياءَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعثَوا" data-root="ع ث و" data-learn-more="/quran-terminology/fa/roots/ayn-th-w/" data-root-meaning="پرداختن به فساد و برهم‌زدن نظم و صلاح موجود، به‌گونه‌ای که حقوق مردم و بنیادهای زندگی جمعی آسیب ببیند.">تَعثَوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع">مُفسِدينَ</button>
  </p>
  <p class="farsi-verse">و ای قوم من، پیمانه و ترازو را به داد تمام بدهید و از چیزهای مردم نکاهید و در زمین فسادگرانه تباهی مکنید.</p>
</section>
