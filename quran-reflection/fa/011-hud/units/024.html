<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الفَريقَينِ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/">الفَريقَينِ</button>
    <button class="word-link" type="button" data-word="كَالأَعمىٰ" data-root="ع م ي" data-learn-more="/quran-terminology/fa/roots/ayn-m-y/" data-root-meaning="کوری، نادیدن، پوشیده شدن راه دیدن، ابهام، و از دست رفتن توان مشاهده یا تشخیص">كَالأَعمىٰ</button>
    <button class="word-link" type="button" data-word="وَالأَصَمِّ" data-root="ص م م" data-learn-more="/quran-terminology/fa/roots/sad-m-m/" data-root-meaning="کری، بسته بودن راه شنیدن، سختی، انسداد، و نفوذناپذیری نسبت به صدا یا پیام">وَالأَصَمِّ</button>
    <button class="word-link" type="button" data-word="وَالبَصيرِ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/">وَالبَصيرِ</button>
    <button class="word-link" type="button" data-word="وَالسَّميعِ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/">وَالسَّميعِ</button>
    ۚ
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="يَستَوِيانِ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/">يَستَوِيانِ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مَثَلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَذَكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">تَذَكَّرونَ</button>
  </p>
  <p class="farsi-verse">مثل این دو گروه مانند نابینا و ناشنوا و بینا و شنواست؛ آیا این دو در مثل برابرند؟ آیا پند نمی‌گیرید؟</p>
</section>
