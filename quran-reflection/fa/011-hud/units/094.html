<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="آمد؛ فرارسیدن فرمان الهی.">جاءَ</button>
    <button class="word-link" type="button" data-word="أَمرُنا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان ما؛ آنچه با فرارسیدن آن، نجات و عذابِ این واقعه تحقق یافت.">أَمرُنا</button>
    <button class="word-link" type="button" data-word="نَجَّينا" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن" data-context="نجات دادیم؛ رهایی شعیب و مؤمنان همراه او از عذاب.">نَجَّينا</button>
    <button class="word-link" type="button" data-word="شُعَيبًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">شُعَيبًا</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ کسانی که همراه شعیب باور و اعتماد داشتند.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="بِرَحمَةٍ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="با رحمتی؛ رهایی آنان با رحمت از سوی گویندهٔ الهی.">بِرَحمَةٍ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّا</button>
    <button class="word-link" type="button" data-word="وَأَخَذَتِ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="و فراگرفت؛ رسیدن صیحه به ستمکاران.">وَأَخَذَتِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَمُوا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم کردند؛ وصف گروهی که در برابر نجات‌یافتگان، گرفتار صیحه شدند.">ظَلَمُوا</button>
    <button class="word-link" type="button" data-word="الصَّيحَةُ" data-root="ص ي ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-h/" data-root-meaning="بانگ و فریاد بلند." data-context="بانگ و صدای شدید؛ رخدادِ فراگیرندهٔ ستمکاران.">الصَّيحَةُ</button>
    <button class="word-link" type="button" data-word="فَأَصبَحوا" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ." data-context="پس به این حال درآمدند؛ نتیجهٔ رخداد در وضعیت آنان را بیان می‌کند.">فَأَصبَحوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="دِيٰرِهِم" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت" data-context="خانه‌ها و جایگاه‌های سکونتشان؛ محل ازپاافتادن آنان.">دِيٰرِهِم</button>
    <button class="word-link" type="button" data-word="جٰثِمينَ" data-root="ج ث م" data-root-meaning="فرونشستن، به زمین چسبیدن و در همان جایگاه ماندن؛ درباره انسان و جانور." data-context="ازپاافتاده و بی‌حرکت بر زمین مانده؛ وصف ستمکارانِ گرفتار صیحه، در برابر نجات شعیب و مؤمنان همراه او." data-learn-more="/quran-terminology/fa/roots/j-th-m/">جٰثِمينَ</button>
  </p>
  <p class="farsi-verse">و چون فرمان ما رسید، شعیب و کسانی را که همراه او ایمان آورده بودند با رحمتی از خود نجات دادیم و بانگ، ستمکاران را گرفت و در خانه‌هایشان از پا افتادند؛</p>
</section>
