  <h2 class="ayah-title">هود ۱۱:۸۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَقِيَّتُ" data-root="ب ق ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَقِيَّتُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/">خَيرٌ</button>

    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>

    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>

    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="بِحَفيظٍ" data-root="ح ف ظ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِحَفيظٍ</button>
  </p>
  <p class="farsi-verse">آنچه آن معبود یگانه باقی می‌گذارد برای شما بهتر است، اگر مؤمن باشید؛ و من نگهبان شما نیستم.</p>
