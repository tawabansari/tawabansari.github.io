<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصنَعِ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر." data-context="و بساز؛ فرمان به ساختن کشتی.">وَاصنَعِ</button>
    <button class="word-link" type="button" data-word="الفُلكَ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش." data-context="کشتی؛ وسیله‌ای که نوح به ساختن آن فرمان یافته است.">الفُلكَ</button>
    <button class="word-link" type="button" data-word="بِأَعيُنِنا" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="زیر نظر ما؛ در اینجا بیان مراقبت الهی از ساخت کشتی.">بِأَعيُنِنا</button>
    <button class="word-link" type="button" data-word="وَوَحيِنا" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="و با وحی ما؛ راهنمایی الهی برای ساخت کشتی.">وَوَحيِنا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُخٰطِبنى" data-root="خ ط ب" data-root-meaning="سخن گفتن با مخاطب و طرح یا پیگیری یک موضوع؛ در کاربردهای دیگر، کار و پیشامد، و درخواست ازدواج." data-context="با من سخن مگو؛ نهی از مخاطبه دربارهٔ کسانی که ستم کرده‌اند، در این موقعیت مشخص." data-learn-more="/quran-terminology/fa/roots/kh-tt-b/">تُخٰطِبنى</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم کردند؛ وصف گروهی که سخن گفتن دربارهٔ آنان نهی شده است.">ظَلَموا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="مُغرَقونَ" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب" data-context="غرق‌شدنی‌اند؛ خبر از سرنوشت گروه یادشده.">مُغرَقونَ</button>
  </p>
  <p class="farsi-verse">و کشتی را زیر نظر ما و با وحی ما بساز و درباره کسانی که ستم کرده‌اند با من سخن مگو؛ آنان غرق خواهند شد.</p>
</section>
