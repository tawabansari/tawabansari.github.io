<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصنَعِ" data-root="ص ن ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَاصنَعِ</button>
    <button class="word-link" type="button" data-word="الفُلكَ" data-root="ف ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الفُلكَ</button>
    <button class="word-link" type="button" data-word="بِأَعيُنِنا" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">بِأَعيُنِنا</button>
    <button class="word-link" type="button" data-word="وَوَحيِنا" data-root="و ح ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَوَحيِنا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُخٰطِبنى" data-root="خ ط ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُخٰطِبنى</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظَلَموا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="مُغرَقونَ" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب">مُغرَقونَ</button>
  </p>
  <p class="farsi-verse">و کشتی را زیر نظر ما و با وحی ما بساز و درباره کسانی که ستم کرده‌اند با من سخن مگو؛ آنان غرق خواهند شد.</p>
</section>
