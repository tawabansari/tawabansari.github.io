<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَيٰقَومِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَنصُرُنى" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">يَنصُرُنى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="طَرَدتُهُم" data-root="ط ر د" data-learn-more="/quran-terminology/fa/roots/tt-r-d/" data-root-meaning="راندن، دنبال کردن، و واداشتن کسی یا چیزی به دور شدن از یک مکان، جمع یا حوزه حضور">طَرَدتُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَذَكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">تَذَكَّرونَ</button>
  </p>
  <p class="farsi-verse">و ای قوم من، اگر آنان را برانم چه کسی در برابر آن معبود یگانه یاری‌ام می‌کند؟ آیا پند نمی‌گیرید؟</p>
</section>
