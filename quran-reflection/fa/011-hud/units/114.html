<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَقِمِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برپا دار؛ فرمان به اقامهٔ صلاة.">وَأَقِمِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلاة؛ آنچه فرمان به برپایی آن در زمان‌های یادشده داده شده است.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="طَرَفَىِ" data-root="ط ر ف" data-learn-more="/quran-terminology/fa/roots/tt-r-f/" data-root-meaning="کناره، سویه، بخش، نگاه، و حرکت نگاه در کاربرد قرآنی" data-context="دو سوی روز؛ دو کرانهٔ زمانی آن.">طَرَفَىِ</button>
    <button class="word-link" type="button" data-word="النَّهارِ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز؛ در بیان زمان برپایی صلاة.">النَّهارِ</button>
    <button class="word-link" type="button" data-word="وَزُلَفًا" data-root="ز ل ف" data-learn-more="/quran-terminology/fa/roots/z-l-f/" data-root-meaning="نزدیک شدن، پیش آمدن و نزدیک آوردن؛ قرب مکانی، زمانی یا منزلتی." data-context="بخش‌هایی از شب؛ با معنای نزدیکی زمانی در کاربرد «زُلَف».">وَزُلَفًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ بخش‌هایی از آن برای برپایی صلاة یاد شده است.">الَّيلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الحَسَنٰتِ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکی‌ها؛ کردارهای نیک.">الحَسَنٰتِ</button>
    <button class="word-link" type="button" data-word="يُذهِبنَ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="از میان می‌برند؛ دربارهٔ اثر نیکی‌ها بر بدی‌ها.">يُذهِبنَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌ها؛ کردارهای بد.">السَّيِّـٔاتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="ذِكرىٰ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یادآوری؛ برای کسانی که یاد می‌کنند.">ذِكرىٰ</button>
    <button class="word-link" type="button" data-word="لِلذّٰكِرينَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یادکنندگان و پندپذیران.">لِلذّٰكِرينَ</button>
  </p>
  <p class="farsi-verse">و صلات را در دو سوی روز و در بخش‌های نزدیک شب برپا دار؛ نیکی‌ها بدی‌ها را می‌برند؛ این یادآوری‌ای برای یادکنندگان است.</p>
</section>
