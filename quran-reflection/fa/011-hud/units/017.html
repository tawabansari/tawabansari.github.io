  <p class="farsi-verse">پس آن‌که بر دلیلی روشن از پروردگارش است و گواهی از سوی او در پی آن می‌آید و پیش از آن کتاب موسی پیشوا و رحمت بود؟ آنان به آن ایمان می‌آورند؛ و هرکه از گروه‌ها به آن کفر ورزد، آتش وعده‌گاه اوست؛ پس درباره آن در تردید مباش؛ آن حق از پروردگار توست، ولی بیشتر مردم ایمان نمی‌آورند.</p>
