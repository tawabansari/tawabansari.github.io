<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۷۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ سخنِ فرستادگان با اهل خانه.">قالوا</button>
    <button class="word-link" type="button" data-word="أَتَعجَبينَ" data-root="ع ج ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/" data-root-meaning="شگفتی؛ اعجاب: پسند و شگفت‌زدگی." data-context="آیا شگفتی می‌کنی؟ خطابِ پرسشی.">أَتَعجَبينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان و کارِ آن معبود یگانه.">أَمرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="رَحمَتُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمتِ آن معبود یگانه؛ در کنار برکت‌های او.">رَحمَتُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَبَرَكٰتُهُ" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="برکت‌های او بر اهل این خانه؛ جمع «برکت» همراه با ضمیر، در کنارِ رحمت." data-learn-more="/quran-terminology/fa/roots/b-r-k/">وَبَرَكٰتُهُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="أَهلَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="اهل و خاندانِ این خانه.">أَهلَ</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/" data-root-meaning="خانه و جای اقامت؛ بات: شب را گذراندن؛ تبییت: ترتیب دادن کاری در شب یا پنهانی." data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-context="خانه، در خطابِ «اهل البیت».">البَيتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="حَميدٌ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد" data-context="ستوده و شایستهٔ ستایش.">حَميدٌ</button>
    <button class="word-link" type="button" data-word="مَجيدٌ" data-root="م ج د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-j-d/" data-root-meaning="بزرگواری، شکوه و فراوانی نیکی." data-context="باشکوه و بزرگوار.">مَجيدٌ</button>
  </p>
  <p class="farsi-verse">گفتند: آیا از فرمان آن معبود یگانه شگفت‌زده می‌شوی؟ رحمت آن معبود یگانه و برکت‌هایش بر شما اهل این خانه باد؛ او ستوده و بزرگوار است.</p>
</section>
