<section class="ayah-block" id="ayah-108" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۰۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="سُعِدوا" data-root="س ع د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-ayn-d/" data-root-meaning="بهره‌مندی از نیکی و نیک‌بختی." data-context="نیکبخت شدند؛ کسانی که در برابر گروه پیشین، جایگاهشان باغ معرفی می‌شود.">سُعِدوا</button>
    <button class="word-link" type="button" data-word="فَفِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَفِى</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغ؛ جایگاه نیکبختان در این آیه.">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="خٰلِدينَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه" data-context="ماندگار؛ وصف اقامت آنان در باغ.">خٰلِدينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="دامَتِ" data-root="د و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-w-m/" data-root-meaning="دوام آوردن، پایدار ماندن و ادامه داشتن." data-context="برپا ماند؛ همراه «ما»، بیان مدتِ دوام آسمان‌ها و زمین.">دامَتِ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ بخشی از عبارت بیان دوام.">السَّمٰوٰتُ</button>
    <button class="word-link" type="button" data-word="وَالأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ در کنار آسمان‌ها در عبارت بیان دوام.">وَالأَرضُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهد؛ مشیت پروردگار در عبارت استثنا.">شاءَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ آنکه مشیت در عبارت استثنا به او نسبت داده شده است.">رَبُّكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="عَطاءً" data-root="ع ط و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-tt-w/" data-root-meaning="دادن و بخشش؛ تعاطی: دست به کاری زدن یا چیزی را گرفتن." data-context="بخششی؛ عطایی که در ادامه بی‌گسست وصف می‌شود.">عَطاءً</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="غیر؛ با وصف پس از خود، قطع شدن بخشش را نفی می‌کند.">غَيرَ</button>
    <button class="word-link" type="button" data-word="مَجذوذٍ" data-root="ج ذ ذ" data-root-meaning="بریدن یا شکستن چیزی، به‌گونه‌ای که پیوستگی آن قطع شود یا بخش‌هایی از آن جدا گردند." data-context="قطع‌شده؛ با «غیر»، قطع شدن بخشش نفی می‌شود: بخششی بی‌گسست." data-learn-more="/quran-terminology/fa/roots/j-dh-dh/">مَجذوذٍ</button>
  </p>
  <p class="farsi-verse">و اما آنان که نیکبخت شدند در باغ‌اند؛ تا آسمان‌ها و زمین برپاست در آن ماندگارند، مگر آنچه پروردگارت بخواهد؛ بخششی بی‌گسست.</p>
</section>
