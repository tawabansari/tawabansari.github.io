<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَامرَأَتُهُ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">وَامرَأَتُهُ</button>
    <button class="word-link" type="button" data-word="قائِمَةٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قائِمَةٌ</button>
    <button class="word-link" type="button" data-word="فَضَحِكَت" data-root="ض ح ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-h-k/" data-root-meaning="خندیدن و آشکار شدن شادی.">فَضَحِكَت</button>
    <button class="word-link" type="button" data-word="فَبَشَّرنٰها" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">فَبَشَّرنٰها</button>
    <button class="word-link" type="button" data-word="بِإِسحٰقَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِإِسحٰقَ</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="وَراءِ" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش">وَراءِ</button>
    <button class="word-link" type="button" data-word="إِسحٰقَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسحٰقَ</button>
    <button class="word-link" type="button" data-word="يَعقوبَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يَعقوبَ</button>
  </p>
  <p class="farsi-verse">و همسرش ایستاده بود، پس خندید؛ و او را به اسحاق و پس از اسحاق به یعقوب مژده دادیم.</p>
</section>
