<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="اركَبوا" data-root="ر ك ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">اركَبوا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="بِسمِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">بِسمِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مَجر۪ىٰها" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر">مَجر۪ىٰها</button>
    <button class="word-link" type="button" data-word="وَمُرسىٰها" data-root="ر س و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَمُرسىٰها</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبّى</button>
    <button class="word-link" type="button" data-word="لَغَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">لَغَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">و گفت: در آن سوار شوید؛ به نام آن معبود یگانه است روان‌شدن و ایستادن آن؛ پروردگارم آمرزنده و رحیم است.</p>
</section>
