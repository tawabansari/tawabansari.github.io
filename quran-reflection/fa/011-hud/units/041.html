<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و نوح گفت.">وَقالَ</button>
    <button class="word-link" type="button" data-word="اركَبوا" data-root="ر ك ب" data-learn-more="/quran-terminology/fa/roots/r-k-b/" data-root-meaning="سوار شدن و بر چیزی قرار گرفتن؛ ترکیب و برهم‌نشستن اجزا؛ در کاربرد گسترش‌یافته، وارد شدن در کار یا گذر از حالتی به حالت دیگر." data-context="در کشتی سوار شوید.">اركَبوا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="بِسمِ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="به نام؛ «بِـ» حرف جر است و «اسم» به نام، شناسه یا نشانه‌ای برای شناخت اشاره دارد. در این عبارت، آغاز کردن با نام و یاد آن معبود یگانه.">بِسمِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مَجر۪ىٰها" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر" data-context="حرکت و جریان یافتن کشتی.">مَجر۪ىٰها</button>
    <button class="word-link" type="button" data-word="وَمُرسىٰها" data-root="ر س و" data-learn-more="/quran-terminology/fa/roots/r-s-w/" data-root-meaning="استقرار یافتن، ثابت شدن و پابرجا ماندن؛ استوار ساختن. در قرآن: کوه‌های استوار، دیگ‌های ثابت، توقف کشتی و هنگام وقوع ساعت." data-context="توقف و استقرار کشتی؛ متوقف ساختن آن.">وَمُرسىٰها</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ پروردگار نوح.">رَبّى</button>
    <button class="word-link" type="button" data-word="لَغَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="بسیار آمرزنده؛ وصف پروردگار.">لَغَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربان و رحمت‌رسان؛ وصف پروردگار.">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">و گفت: در آن سوار شوید؛ به نام آن معبود یگانه است روان‌شدن و ایستادن آن؛ پروردگارم آمرزنده و رحیم است.</p>
</section>
