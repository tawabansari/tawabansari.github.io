<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">هود ۱۱:۱۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكُلًّا" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">وَكُلًّا</button>
    <button class="word-link" type="button" data-word="نَقُصُّ" data-root="ق ص ص" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَقُصُّ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَنباءِ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">أَنباءِ</button>
    <button class="word-link" type="button" data-word="الرُّسُلِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">الرُّسُلِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="نُثَبِّتُ" data-root="ث ب ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نُثَبِّتُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="فُؤادَكَ" data-root="ف أ د" data-root-meaning="«دل» مناسب‌ترین معادل پایه فؤاد است؛ دلی که در کاربردهای قرآنی می‌تواند با دریافت، ادراک، گرایش، تاثیرپذیری و پایداری ارتباط داشته باشد." data-learn-more="/quran-terminology/fa/roots/f-a-d/">فُؤادَكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَجاءَكَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجاءَكَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">الحَقُّ</button>
    <button class="word-link" type="button" data-word="وَمَوعِظَةٌ" data-root="و ع ظ" data-learn-more="/quran-terminology/fa/roots/w-ayn-zha/" data-root-meaning="پند دادن، اندرز دادن، هشدار و یادآوری عواقب برای متوجه ساختن و اصلاح رفتار.">وَمَوعِظَةٌ</button>
    <button class="word-link" type="button" data-word="وَذِكرىٰ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَذِكرىٰ</button>
    <button class="word-link" type="button" data-word="لِلمُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">لِلمُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">و هر خبری از رسولان که برایت بازمی‌گوییم، چیزی است که دلت را با آن استوار می‌کنیم؛ و در این، حق و اندرز و یادآوری برای مؤمنان به تو رسیده است.</p>
</section>
