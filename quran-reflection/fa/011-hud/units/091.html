  <p class="farsi-verse">گفتند: ای شعیب، بسیاری از آنچه می‌گویی نمی‌فهمیم و تو را در میان خود ناتوان می‌بینیم؛ و اگر خویشاوندانت نبودند سنگسارت می‌کردیم و تو نزد ما نیرومند نیستی.</p>
