  <p class="farsi-verse">گفت: ای قوم من، به من بگویید، اگر بر دلیلی روشن از پروردگارم باشم و از نزد خود رحمتی به من داده باشد که بر شما پوشیده مانده است، آیا آن را بر شما الزام کنیم، در حالی که آن را ناخوش دارید؟</p>
