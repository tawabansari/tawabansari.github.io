  <h2 class="ayah-title">هود ۱۱:۱۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="كُلًّا" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلًّا</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمّا</button>
    <button class="word-link" type="button" data-word="لَيُوَفِّيَنَّهُم" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/">لَيُوَفِّيَنَّهُم</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">أَعمٰلَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="خ ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خَبيرٌ</button>
  </p>
  <p class="farsi-verse">و پروردگارت کارهای همه آنان را حتما به‌تمامی به آنان بازمی‌دهد؛ او به آنچه می‌کنند آگاه است.</p>
