  <p class="farsi-verse">آن معبود یگانه تنها شما را از دوستی و هم‌پیمانی با کسانی بازمی‌دارد که در دین با شما جنگیدند و شما را از خانه‌هایتان بیرون کردند و در بیرون راندنتان پشتیبانی کردند. و هر که با آنان هم‌پیمان شود، آنان ستمکاران‌اند.</p>
