<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">الممتحنة ۶۰:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="يَثقَفوكُم" data-root="ث ق ف" data-root-meaning="یافتن یا دست یافتن به شخص در موقعیتی مشخص، گاه همراه با چیرگی و تسلط بر او." data-context="بر شما دست یابند؛ به چنگ آوردن مخاطبان از سوی دشمنان." data-learn-more="/quran-terminology/fa/roots/th-q-f/">يَثقَفوكُم</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="خواهند بود؛ در بیانِ حالتِ دشمنیِ آنان.">يَكونوا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَعداءً" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمنان؛ موضع آنان نسبت به مخاطبان.">أَعداءً</button>
    <button class="word-link" type="button" data-word="وَيَبسُطوا" data-root="ب س ط" data-root-meaning="گشودن، گستردن و امتداد دادن؛ در کاربردهای گوناگون، گشایش روزی یا وسعت دانش و توانایی نیز از سیاق روشن می‌شود." data-context="و دراز می‌کنند؛ دست‌ها و زبان‌های دشمنان به بدی به سوی مخاطبان." data-learn-more="/quran-terminology/fa/roots/b-s-tt/">وَيَبسُطوا</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌هایشان؛ وسیلهٔ آسیب‌رسانی در این تهدید.">أَيدِيَهُم</button>
    <button class="word-link" type="button" data-word="وَأَلسِنَتَهُم" data-root="ل س ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-s-n/" data-root-meaning="زبان به‌عنوان اندام، گفتار یا زبان یک قوم." data-context="و زبان‌هایشان؛ گفتارِ آسیب‌رسان در کنار دست‌ها.">وَأَلسِنَتَهُم</button>
    <button class="word-link" type="button" data-word="بِالسّوءِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="به بدی؛ جهتِ دراز کردن دست و زبان.">بِالسّوءِ</button>
    <button class="word-link" type="button" data-word="وَوَدّوا" data-root="و د د" data-learn-more="/quran-terminology/fa/roots/w-d-d/" data-root-meaning="وَدَّ؛ محبت، خواستن و میل به تحقق چیزی" data-context="و خواستند؛ آرزوی آنان دربارهٔ انکار مخاطبان.">وَوَدّوا</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر بورزید؛ آنچه دشمنان برای مخاطبان می‌خواهند.">تَكفُرونَ</button>
  </p>
  <p class="farsi-verse">اگر بر شما دست یابند، دشمن شما خواهند بود و دست‌ها و زبان‌هایشان را به بدی به سوی شما می‌گشایند، و دوست دارند که کفر بورزید.</p>
</section>
