<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">الممتحنة ۶۰:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="يَثقَفوكُم" data-root="ث ق ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-q-f/" data-root-meaning="یافتن و به چنگ آوردن، با دقت یا تسلط؛ در کاربردهای دیگر، مهارت و راست کردن.">يَثقَفوكُم</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكونوا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَعداءً" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">أَعداءً</button>
    <button class="word-link" type="button" data-word="وَيَبسُطوا" data-root="ب س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-s-tt/" data-root-meaning="گشودن، گستردن و فراخ کردن؛ بسط می‌تواند مادی یا مربوط به توان و امکانات باشد.">وَيَبسُطوا</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">أَيدِيَهُم</button>
    <button class="word-link" type="button" data-word="وَأَلسِنَتَهُم" data-root="ل س ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-s-n/" data-root-meaning="زبان به‌عنوان اندام، گفتار یا زبان یک قوم.">وَأَلسِنَتَهُم</button>
    <button class="word-link" type="button" data-word="بِالسّوءِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">بِالسّوءِ</button>
    <button class="word-link" type="button" data-word="وَوَدّوا" data-root="و د د" data-learn-more="/quran-terminology/fa/roots/w-d-d/" data-root-meaning="وَدَّ؛ محبت، خواستن و میل به تحقق چیزی">وَوَدّوا</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">تَكفُرونَ</button>
  </p>
  <p class="farsi-verse">اگر بر شما دست یابند، دشمن شما خواهند بود و دست‌ها و زبان‌هایشان را به بدی به سوی شما می‌گشایند، و دوست دارند که کفر بورزید.</p>
</section>
