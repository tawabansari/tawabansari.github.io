  <p class="farsi-verse">هر که پس از ایمانش به آن معبود یگانه کفر ورزد، مگر کسی که مجبور شده و دلش به ایمان آرام است؛ ولی آنان که سینه‌ای به کفر بگشایند، خشمی از آن معبود یگانه بر آنان است و عذابی بزرگ دارند.</p>
