<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="كَفَرَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="پس از ایمان کفر ورزید؛ موضوع شرط و استثنای پس از آن.">كَفَرَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ بیان تقدم ایمان بر کفر در این جمله.">بَعدِ</button>
    <button class="word-link" type="button" data-word="إيمٰنِهِ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان او؛ باوری که پیش از کفر داشته است.">إيمٰنِهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="أُكرِهَ" data-root="ك ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-h2/" data-root-meaning="ناخوش داشتن و دشواری؛ اکراه: واداشتن برخلاف خواست." data-context="به اکراه وادار شد؛ در حالی که دل او بر ایمان آرام است.">أُكرِهَ</button>
    <button class="word-link" type="button" data-word="وَقَلبُهُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="و دل او؛ جایگاه باور درونی در برابر فشار بیرونی.">وَقَلبُهُ</button>
    <button class="word-link" type="button" data-word="مُطمَئِنٌّ" data-root="ط م أ ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-m-a-n/" data-root-meaning="آرام گرفتن و اطمینان یافتن پس از اضطراب؛ با تحلیل کوتاه‌تر «طمن» نیز ثبت می‌شود." data-context="آرام و استوار بر ایمان؛ وصف دل شخص مجبورشده.">مُطمَئِنٌّ</button>
    <button class="word-link" type="button" data-word="بِالإيمٰنِ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="به ایمان؛ آنچه دل شخص مجبورشده بر آن آرام است.">بِالإيمٰنِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="شَرَحَ" data-root="ش ر ح" data-learn-more="/quran-terminology/fa/roots/sh-r-h/" data-root-meaning="گشودن، گستردن و آشکار ساختن؛ شرح صدر: گشایش و فراخی درونی، با جهتی که متعلق و سیاق مشخص می‌کند." data-context="سینه خود را به روی کفر گشود؛ بیان پذیرش درونی در برابر وضعیت اکراه.">شَرَحَ</button>
    <button class="word-link" type="button" data-word="بِالكُفرِ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="به روی کفر؛ جهت گشایش سینه در این عبارت.">بِالكُفرِ</button>
    <button class="word-link" type="button" data-word="صَدرًا" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/" data-context="سینه؛ در اینجا بیان ظرفیت و پذیرش درونی نسبت به کفر.">صَدرًا</button>
    <button class="word-link" type="button" data-word="فَعَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَعَلَيهِم</button>
    <button class="word-link" type="button" data-word="غَضَبٌ" data-root="غ ض ب" data-learn-more="/quran-terminology/fa/roots/gh-dad-b/" data-root-meaning="شدت ناخشنودی و واکنش در برابر امر ناپذیرفتنی" data-context="خشم الهی بر کسانی که سینه خود را به روی کفر می‌گشایند.">غَضَبٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذابی که برای این گروه بیان شده است.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ و سخت؛ وصف عذاب.">عَظيمٌ</button>
  </p>
  <p class="farsi-verse">هر که پس از ایمانش به آن معبود یگانه کفر ورزد، مگر کسی که مجبور شده و دلش به ایمان آرام است؛ ولی آنان که سینه‌ای به کفر بگشایند، خشمی از آن معبود یگانه بر آنان است و عذابی بزرگ دارند.</p>
</section>
