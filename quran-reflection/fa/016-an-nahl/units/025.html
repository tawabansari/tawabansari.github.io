<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَحمِلوا" data-root="ح م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لِيَحمِلوا</button>
    <button class="word-link" type="button" data-word="أَوزارَهُم" data-root="و ز ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَوزارَهُم</button>
    <button class="word-link" type="button" data-word="كامِلَةً" data-root="ك م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كامِلَةً</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="أَوزارِ" data-root="و ز ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَوزارِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُضِلّونَهُم" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">يُضِلّونَهُم</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عِلمٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="ساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">ساءَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَزِرونَ" data-root="و ز ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَزِرونَ</button>
  </p>
  <p class="farsi-verse">تا روز قیامت بارهای خود را به‌تمامی بردارند و نیز از بارهای کسانی که بی‌دانش گمراهشان می‌کنند؛ آگاه باشید، چه بد باری برمی‌دارند.</p>
</section>
