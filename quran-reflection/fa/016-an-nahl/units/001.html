<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَتىٰ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أَتىٰ</button>
    <button class="word-link" type="button" data-word="أَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَستَعجِلوهُ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">تَستَعجِلوهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="سُبحٰنَهُ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">سُبحٰنَهُ</button>
    <button class="word-link" type="button" data-word="وَتَعٰلىٰ" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن.">وَتَعٰلىٰ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="يُشرِكونَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد">يُشرِكونَ</button>
  </p>
  <p class="farsi-verse">فرمان آن معبود یگانه آمد؛ پس آن را به شتاب مخواهید. او منزه و برتر از آن چیزی است که شریک می‌سازند.</p>
</section>
