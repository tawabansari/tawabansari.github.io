<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید؛ نیز دام‌ها و چهارپایان در «أَنْعَام»." data-context="چارپایان و دام‌ها">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="لَعِبرَةً" data-root="ع ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-b-r/" data-root-meaning="گذشتن از یک سو به سوی دیگر؛ عبرت و تعبیر: از نشانه به معنا رسیدن." data-context="مایهٔ عبرتی">لَعِبرَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="نُسقيكُم" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب." data-context="به شما می‌نوشانیم">نُسقيكُم</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="بُطونِهِ" data-root="ب ط ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-tt-n/" data-root-meaning="شکم، درون و بخش نهان؛ باطن در برابر ظاهر است و بطانه به لایهٔ درونی یا نزدیکان گفته می‌شود." data-context="شکم‌های آن؛ درون دام">بُطونِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میانِ">بَينِ</button>
    <button class="word-link" type="button" data-word="فَرثٍ" data-root="ف ر ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-th/" data-root-meaning="محتویات گوارشی شکم جانور." data-context="مواد گوارشی درون شکم">فَرثٍ</button>
    <button class="word-link" type="button" data-word="وَدَمٍ" data-root="د م و" data-root-meaning="خون؛ مایع حیاتی بدن انسان و حیوان. «دَم» مفرد و «دِمَاء» جمع آن است؛ خون‌ریزی، حکم خوراکی و دیگر دلالت‌ها از ترکیب و سیاق روشن می‌شوند. دربارهٔ حرف سوم، تحلیل‌های «د م و» و «د م ي» وجود دارد." data-learn-more="/quran-terminology/fa/roots/d-m-w/" data-context="و خون">وَدَمٍ</button>
    <button class="word-link" type="button" data-word="لَبَنًا" data-root="ل ب ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-n/" data-root-meaning="شیرِ خوراکی." data-context="شیری">لَبَنًا</button>
    <button class="word-link" type="button" data-word="خالِصًا" data-root="خ ل ص" data-learn-more="/quran-terminology/fa/roots/kh-l-sad/" data-root-meaning="جدا شدن از آمیختگی؛ از خلوص تا اختصاص" data-context="خالص">خالِصًا</button>
    <button class="word-link" type="button" data-word="سائِغًا" data-root="س و غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-gh/" data-root-meaning="به‌آسانی از گلو گذشتن و گوارا بودن." data-context="گوارا">سائِغًا</button>
    <button class="word-link" type="button" data-word="لِلشّٰرِبينَ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="برای نوشندگان">لِلشّٰرِبينَ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان در دام‌ها برای شما عبرتی است؛ از آنچه در شکم آن است، از میان سرگین و خون، شیری خالص به شما می‌نوشانیم که برای نوشندگان گواراست.</p>
</section>
