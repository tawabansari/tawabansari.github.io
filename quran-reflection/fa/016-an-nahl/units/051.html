<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ بیان فرمان الهی.">وَقالَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَتَّخِذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="برنگیرید؛ نهی از پذیرفتن دو معبود.">تَتَّخِذوا</button>
    <button class="word-link" type="button" data-word="إِلٰهَينِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="دو معبود؛ موضوع نهی آیه.">إِلٰهَينِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="ث ن ي" data-root-meaning="دوتایی‌شدن، بازگرداندن و تکرار" data-context="دو؛ شمار معبودهایی که گرفتن آنها نهی شده است." data-learn-more="/quran-terminology/fa/roots/th-n-y/">اثنَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="إِلٰهٌ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبود؛ آنکه پرستش متوجه اوست.">إِلٰهٌ</button>
    <button class="word-link" type="button" data-word="وٰحِدٌ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یکتا؛ نفی دوگانگی در معبود.">وٰحِدٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِيّٰىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِيّٰىَ</button>
    <button class="word-link" type="button" data-word="فَارهَبونِ" data-root="ر ه ب" data-learn-more="/quran-terminology/fa/roots/r-h2-b/" data-root-meaning="هیبت، پروا، مراقبت، و انقباض در برابر عظمت و پیامد" data-context="پس از من پروا کنید؛ بیم و توجه را به من متوجه سازید.">فَارهَبونِ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه گفت: دو معبود نگیرید؛ او تنها معبودی یگانه است؛ پس تنها از من بیم داشته باشید.</p>
</section>
