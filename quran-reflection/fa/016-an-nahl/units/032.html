<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="تَتَوَفّىٰهُمُ" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا">تَتَوَفّىٰهُمُ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="طَيِّبينَ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است.">طَيِّبينَ</button>
    ۙ
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولونَ</button>
    <button class="word-link" type="button" data-word="سَلٰمٌ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">سَلٰمٌ</button>
    <button class="word-link" type="button" data-word="عَلَيكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُمُ</button>
    <button class="word-link" type="button" data-word="ادخُلُوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">ادخُلُوا</button>
    <button class="word-link" type="button" data-word="الجَنَّةَ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجَنَّةَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">تَعمَلونَ</button>
  </p>
  <p class="farsi-verse">آنان که فرشتگان جانشان را در پاکی می‌گیرند، می‌گویند: سلام بر شما؛ به سبب آنچه می‌کردید به بهشت درآیید.</p>
</section>
