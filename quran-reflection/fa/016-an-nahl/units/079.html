  <p class="farsi-verse">آیا به پرندگان ننگریسته‌اند که در فضای آسمان رام شده‌اند؟ جز آن معبود یگانه کسی آنها را نگه نمی‌دارد؛ بی‌گمان در این برای مردمی که ایمان می‌آورند نشانه‌هایی است.</p>
