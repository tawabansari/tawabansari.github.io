  </p>
  <p class="farsi-verse">با حکمت و پند نیکو به راه پروردگارت دعوت کن و با آنان به شیوه‌ای که بهتر است گفت‌وگو و استدلال کن؛ بی‌گمان پروردگارت به کسی که از راه او گمراه شده داناتر است و به هدایت‌یافتگان داناتر است.</p>
