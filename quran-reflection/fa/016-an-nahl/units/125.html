<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ادعُ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="دعوت کن؛ به راه پروردگارت.">ادعُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راهِ پروردگار؛ مقصد دعوت.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ صاحب راهی که به آن دعوت می‌شود.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="بِالحِكمَةِ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="با حکمت؛ روشِ سنجیدهٔ دعوت.">بِالحِكمَةِ</button>
    <button class="word-link" type="button" data-word="وَالمَوعِظَةِ" data-root="و ع ظ" data-learn-more="/quran-terminology/fa/roots/w-ayn-zha/" data-root-meaning="پند دادن، اندرز دادن، هشدار و یادآوری عواقب برای متوجه ساختن و اصلاح رفتار." data-context="و با اندرز؛ یادآوری و پندِ نیکو.">وَالمَوعِظَةِ</button>
    <button class="word-link" type="button" data-word="الحَسَنَةِ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکو؛ وصفِ اندرز.">الحَسَنَةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَجٰدِلهُم" data-root="ج د ل" data-root-meaning="رویارویی و رفت‌وبرگشت گفتار برای طرح، دفاع، پاسخ یا مقابله با یک موضع؛ ارزش آن به موضوع، دلیل و روش وابسته است." data-context="با آنان به شیوه‌ای که نیکوتر است مجادله کن." data-learn-more="/quran-terminology/fa/roots/j-d-l/">وَجٰدِلهُم</button>
    <button class="word-link" type="button" data-word="بِالَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِالَّتى</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوتر؛ وصفِ روش مجادله.">أَحسَنُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ صاحبِ علم به گمراهان و هدایت‌یافتگان.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="داناتر؛ دربارهٔ کسی که از راه او گمراه شده است.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِمَن</button>
    <button class="word-link" type="button" data-word="ضَلَّ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه" data-context="گمراه شده است؛ از راه پروردگار.">ضَلَّ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِهِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه او؛ مسیری که از آن گمراه شده‌اند.">سَبيلِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="داناتر؛ دربارهٔ هدایت‌یافتگان.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِالمُهتَدينَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت‌یافتگان؛ کسانی که راه را پذیرفته‌اند.">بِالمُهتَدينَ</button>
  </p>
  <p class="farsi-verse">با حکمت و پند نیکو به راه پروردگارت دعوت کن و با آنان به شیوه‌ای که بهتر است گفت‌وگو و استدلال کن؛ بی‌گمان پروردگارت به کسی که از راه او گمراه شده داناتر است و به هدایت‌یافتگان داناتر است.</p>
</section>
