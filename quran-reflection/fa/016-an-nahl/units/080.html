  <h2 class="ayah-title">النحل ۱۶:۸۰</h2>

    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>

    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="جُلودِ" data-root="ج ل د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-l-d/" data-root-meaning="پوست و پوشش بدن؛ جَلد: زدن با تازیانه؛ در کاربردهایی، استواری و سختی.">جُلودِ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/" data-root-meaning="خانه و جای اقامت؛ بات: شب را گذراندن؛ تبییت: ترتیب دادن کاری در شب یا پنهانی." data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست.">بُيوتًا</button>
    <button class="word-link" type="button" data-word="تَستَخِفّونَها" data-root="خ ف ف" data-learn-more="/quran-terminology/fa/roots/kh-f-f/" data-root-meaning="از سبکی و کاهش بار تا از دست رفتن ثبات">تَستَخِفّونَها</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="ظَعنِكُم" data-root="ظ ع ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/zha-ayn-n/" data-root-meaning="کوچ کردن و از جایی رفتن.">ظَعنِكُم</button>
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">وَيَومَ</button>
    <button class="word-link" type="button" data-word="إِقامَتِكُم" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">إِقامَتِكُم</button>
    ۙ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="أَصوافِها" data-root="ص و ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-f/" data-root-meaning="پشم.">أَصوافِها</button>
    <button class="word-link" type="button" data-word="وَأَوبارِها" data-root="و ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-b-r/" data-root-meaning="کرک و موی نرم جانور، به‌ویژه شتر.">وَأَوبارِها</button>
    <button class="word-link" type="button" data-word="وَأَشعارِها" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک">وَأَشعارِها</button>
    <button class="word-link" type="button" data-word="أَثٰثًا" data-root="أ ث ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-th-th/" data-root-meaning="انبوه و متراکم بودن؛ أثاث: اسباب، وسایل و دارایی خانه.">أَثٰثًا</button>
    <button class="word-link" type="button" data-word="وَمَتٰعًا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">وَمَتٰعًا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="حينٍ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان.">حينٍ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه از خانه‌هایتان برای شما آرامگاه قرار داد و از پوست دام‌ها خانه‌هایی برای شما قرار داد که در روز کوچ و روز اقامتتان آنها را سبک می‌یابید؛ و از پشم‌ها و کرک‌ها و موهای آنها، اثاث و بهره‌ای تا زمانی.</p>
</section>
