<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="برای شما فراهم و قرار داد.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بُيوتِكُم" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه‌های شما که جای سکونت و آرام گرفتن‌اند." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بُيوتِكُم</button>
    <button class="word-link" type="button" data-word="سَكَنًا" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="جای آرام گرفتن و سکونت.">سَكَنًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و برای شما فراهم کرد.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="جُلودِ" data-root="ج ل د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-l-d/" data-root-meaning="پوست و پوشش بدن؛ جَلد: زدن با تازیانه؛ در کاربردهایی، استواری و سختی." data-context="پوست‌های دام‌ها.">جُلودِ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-context="دام‌ها؛ حیوانات پرورشیِ مورد استفاده." data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید؛ و در کاربرد «انعام»، چهارپایان اهلی و دام‌ها.">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه‌ها و سرپناه‌های قابل حمل از پوست دام‌ها." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بُيوتًا</button>
    <button class="word-link" type="button" data-word="تَستَخِفّونَها" data-root="خ ف ف" data-learn-more="/quran-terminology/fa/roots/kh-f-f/" data-root-meaning="از سبکی و کاهش بار تا از دست رفتن ثبات" data-context="آنها را سبک و آسان‌حمل می‌یابید.">تَستَخِفّونَها</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز و هنگامِ کوچ.">يَومَ</button>
    <button class="word-link" type="button" data-word="ظَعنِكُم" data-root="ظ ع ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/zha-ayn-n/" data-root-meaning="کوچ کردن و از جایی رفتن." data-context="کوچ و سفر شما.">ظَعنِكُم</button>
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روز و هنگامِ ماندن.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="إِقامَتِكُم" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ماندن و اقامت شما.">إِقامَتِكُم</button>
    ۙ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="أَصوافِها" data-root="ص و ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-f/" data-root-meaning="پشم." data-context="پشمِ آنها.">أَصوافِها</button>
    <button class="word-link" type="button" data-word="وَأَوبارِها" data-root="و ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-b-r/" data-root-meaning="کرک و موی نرم جانور، به‌ویژه شتر." data-context="کرکِ آنها.">وَأَوبارِها</button>
    <button class="word-link" type="button" data-word="وَأَشعارِها" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-context="موی آنها." data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک؛ و «شَعْر»، موی بدن.">وَأَشعارِها</button>
    <button class="word-link" type="button" data-word="أَثٰثًا" data-root="أ ث ث" data-learn-more="/quran-terminology/fa/roots/a-th-th/" data-root-meaning="اسباب و وسایل زندگی؛ مانند فرش، پوشاک و دیگر وسایل فراهم‌شده از پشم، کرک و مو." data-context="وسایل و اسباب زندگی.">أَثٰثًا</button>
    <button class="word-link" type="button" data-word="وَمَتٰعًا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="و بهره و کالای مورد استفاده.">وَمَتٰعًا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="حينٍ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان." data-context="زمانی و مدتی.">حينٍ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه از خانه‌هایتان برای شما آرامگاه قرار داد و از پوست دام‌ها خانه‌هایی برای شما قرار داد که در روز کوچ و روز اقامتتان آنها را سبک می‌یابید؛ و از پشم‌ها و کرک‌ها و موهای آنها، اثاث و بهره‌ای تا زمانی.</p>
</section>
