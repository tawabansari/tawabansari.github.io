  <p class="farsi-verse">سوگند به آن معبود یگانه، به سوی امت‌هایی پیش از تو فرستادیم، پس شیطان اعمالشان را برای آنان آراست؛ پس امروز او سرپرست آنان است و عذابی دردناک دارند.</p>
