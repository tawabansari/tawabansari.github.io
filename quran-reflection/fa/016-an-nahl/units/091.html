  <p class="farsi-verse">و چون پیمان بستید، به پیمان آن معبود یگانه وفا کنید و سوگندها را پس از استوار کردنشان نشکنید، در حالی که آن معبود یگانه را بر خود ضامن قرار داده‌اید؛ آن معبود یگانه آنچه را می‌کنید می‌داند.</p>
