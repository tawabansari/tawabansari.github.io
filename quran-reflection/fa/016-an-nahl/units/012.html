<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسَخَّرَ" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/" data-context="و برای شما رام ساخت؛ در اختیار سودمندی انسان قرار داد">وَسَخَّرَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ بخشی از چرخهٔ زمانیِ رام‌شده برای انسان">الَّيلَ</button>
    <button class="word-link" type="button" data-word="وَالنَّهارَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="و روز؛ بخش روشن چرخهٔ شبانه‌روز">وَالنَّهارَ</button>
    <button class="word-link" type="button" data-word="وَالشَّمسَ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="و خورشید؛ از پدیده‌های رام‌شده برای انسان">وَالشَّمسَ</button>
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان." data-context="و ماه؛ از پدیده‌های رام‌شده برای انسان">وَالقَمَرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالنُّجومُ" data-root="ن ج م" data-learn-more="/quran-terminology/fa/roots/n-j-m/" data-root-meaning="برآمدن و پدیدار شدن؛ نجم: ستاره یا گیاهِ فاقد تنهٔ ایستاده، بنا بر سیاق؛ در عربی، بخش یا موعد معین نیز هست." data-context="ستارگان؛ در این آیه رام‌شده به فرمان او">وَالنُّجومُ</button>
    <button class="word-link" type="button" data-word="مُسَخَّرٰتٌ" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/" data-context="رام‌شده و فرمان‌پذیر؛ در وصف ستارگان">مُسَخَّرٰتٌ</button>
    <button class="word-link" type="button" data-word="بِأَمرِهِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="به فرمان او؛ به امر آن معبود یگانه">بِأَمرِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="بی‌گمان نشانه‌هایی؛ در پدیده‌های یادشده">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برای مردمی؛ گروهی که خرد می‌ورزند">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="خرد می‌ورزند؛ با اندیشه پیوند نشانه‌ها را درمی‌یابند">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">و شب و روز و خورشید و ماه را برای شما رام کرد؛ و ستارگان به فرمان او رام شده‌اند؛ بی‌گمان در این برای مردمی که خرد می‌ورزند نشانه‌هایی است.</p>
</section>
