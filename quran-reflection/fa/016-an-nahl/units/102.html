<section class="ayah-block" id="ayah-102" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱۰۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو.">قُل</button>
    <button class="word-link" type="button" data-word="نَزَّلَهُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="آن را فرو فرستاد؛ اشاره به وحی.">نَزَّلَهُ</button>
    <button class="word-link" type="button" data-word="روحُ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح" data-context="روح؛ در ترکیبِ روح‌القدس.">روحُ</button>
    <button class="word-link" type="button" data-word="القُدُسِ" data-root="ق د س" data-learn-more="/quran-terminology/fa/roots/q-d-s/" data-root-meaning="پاکی، پاک‌سازی، جدا کردن ساحت پاک از آلودگی، و حفظ حریم قدسی" data-context="پاکی و قدس؛ در عنوان روح‌القدس.">القُدُسِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار تو.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="به حق و بر پایهٔ راستی.">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="لِيُثَبِّتَ" data-root="ث ب ت" data-root-meaning="«ث ب ت» به استوار بودن و برقرار ماندن چیزی در جایگاه، وضعیت یا اعتبار خود اشاره دارد؛ و در ساختمان‌های سببی، به استوار کردن، برقرار نگه داشتن یا ثابت ساختن چیزی می‌رسد." data-context="تا باورمندان را استوار سازد؛ از هدف‌های نزول وحی." data-learn-more="/quran-terminology/fa/roots/th-b-t/">لِيُثَبِّتَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اند.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَهُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="و راهنمایی و هدایت.">وَهُدًى</button>
    <button class="word-link" type="button" data-word="وَبُشرىٰ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-context="و مژده و خبر خوش." data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم؛ و «بُشرى»، مژده و خبر خوش.">وَبُشرىٰ</button>
    <button class="word-link" type="button" data-word="لِلمُسلِمينَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="برای تسلیم‌شدگان و مسلمانان.">لِلمُسلِمينَ</button>
  </p>
  <p class="farsi-verse">بگو: روح قدس آن را از سوی پروردگارت به حق نازل کرده است تا کسانی را که ایمان آورده‌اند استوار کند، و هدایت و مژده‌ای برای تسلیم‌شدگان باشد.</p>
</section>
