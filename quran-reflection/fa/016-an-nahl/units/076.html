  <p class="farsi-verse">و آن معبود یگانه مَثَلی از دو مرد زد: یکی لال است و بر هیچ چیز توانایی ندارد و سربار سرپرست خویش است؛ هر جا او را بفرستد خیری نمی‌آورد؛ آیا او با کسی که به عدالت فرمان می‌دهد و خود بر راهی راست است برابر است؟</p>
