<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۹۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="نباشید؛ در نهی از همانند شدن با زنِ ازهم‌گشاینده رشته.">تَكونوا</button>
    <button class="word-link" type="button" data-word="كَالَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَالَّتى</button>
    <button class="word-link" type="button" data-word="نَقَضَت" data-root="ن ق ض" data-learn-more="/quran-terminology/fa/roots/n-q-dad/" data-root-meaning="باز کردن و واچیدن پیوندی که پیش‌تر بسته، تابیده، استوار یا بنا شده بود" data-context="از هم گشود؛ عمل برهم زدن رشته‌ای که پیش‌تر استوار شده بود.">نَقَضَت</button>
    <button class="word-link" type="button" data-word="غَزلَها" data-root="غ ز ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-z-l/" data-root-meaning="ریسیدن و رشته تابیده." data-context="رشته‌اش؛ چیزی که زن ریسیده و سپس از هم گشوده است.">غَزلَها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ در بیان پیشین بودن استواری رشته نسبت به گشودن آن.">بَعدِ</button>
    <button class="word-link" type="button" data-word="قُوَّةٍ" data-root="ق و ي" data-learn-more="/quran-terminology/fa/roots/q-w-y/" data-root-meaning="نیرو، توان، قدرت و استحکام؛ توان انجام، تحمل، مقاومت یا اثرگذاری" data-context="استواری؛ محکم بودن رشته پیش از ازهم‌گشوده شدن.">قُوَّةٍ</button>
    <button class="word-link" type="button" data-word="أَنكٰثًا" data-root="ن ك ث" data-learn-more="/quran-terminology/fa/roots/n-k-th/" data-root-meaning="از هم گشودن و برهم زدن چیزی که پیش‌تر بسته یا استوار شده است؛ در تعهدات، شکستن عهد، سوگند یا بیعت." data-context="رشته‌ها و الیاف واگشوده؛ حالت رشته‌ای که پس از استوار شدن دوباره از هم باز شده است.">أَنكٰثًا</button>
    <button class="word-link" type="button" data-word="تَتَّخِذونَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="وسیله می‌گیرید؛ درباره به کار گرفتن سوگندها برای فریب.">تَتَّخِذونَ</button>
    <button class="word-link" type="button" data-word="أَيمٰنَكُم" data-root="ي م ن" data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="دست راست و جانب راست؛ و در کاربردهای مرتبط، سوگند و پیمان، توانایی و اختیار، و فرخندگی. معنای هر صورت از ساخت و سیاق آن شناخته می‌شود." data-context="سوگندهایتان؛ تعهدهایی که از استفاده فریبکارانه از آنها نهی شده است.">أَيمٰنَكُم</button>
    <button class="word-link" type="button" data-word="دَخَلًا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="وسیله فریب؛ وصف کاربرد نادرست سوگندها میان طرف‌ها.">دَخَلًا</button>
    <button class="word-link" type="button" data-word="بَينَكُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان شما؛ جایگاه روابطی که سوگندها در آن به کار می‌روند.">بَينَكُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ در بیان افزون‌تر بودن یک گروه از گروه دیگر.">تَكونَ</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="گروهی؛ یکی از دو جماعت مورد مقایسه.">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَربىٰ" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/" data-root-meaning="بالا آمدن، افزون شدن، برآمدن، زیاد شدن، رشد کردن، و از حد پیشین بالاتر رفتن" data-context="افزون‌تر؛ در مقایسه یک جماعت با جماعت دیگر.">أَربىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="گروه دیگر؛ جماعتی که افزونی گروه نخست نسبت به آن سنجیده می‌شود.">أُمَّةٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يَبلوكُمُ" data-root="ب ل و" data-learn-more="/quran-terminology/fa/roots/b-l-w/" data-root-meaning="آزمودن در واقعیت؛ از خیر و شر تا «بلاء» و فرسودگی" data-context="شما را می‌آزماید؛ در بیان آزمون الهی در همین موقعیت.">يَبلوكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَيُبَيِّنَنَّ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="روشن خواهد کرد؛ بیان روشن شدن موضوع اختلاف در قیامت.">وَلَيُبَيِّنَنَّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ در ترکیب روز قیامت.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قیامت؛ زمان روشن شدن آنچه درباره‌اش اختلاف داشتند.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ در بیان اختلاف پیشین مخاطبان.">كُنتُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="تَختَلِفونَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="اختلاف می‌کردید؛ موضوعی که روز قیامت روشن می‌شود.">تَختَلِفونَ</button>
  </p>
  <p class="farsi-verse">و مانند آن زنی نباشید که رشته خود را پس از استوار شدن، واگشود و پاره‌پاره کرد؛ سوگندهایتان را وسیله فریب میان خود می‌گیرید، به سبب آنکه گروهی از گروهی افزون‌تر است. آن معبود یگانه تنها شما را با آن می‌آزماید؛ و روز قیامت آنچه را در آن اختلاف می‌کردید برایتان روشن خواهد کرد.</p>
</section>
