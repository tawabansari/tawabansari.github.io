<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَنّٰتُ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/">جَنّٰتُ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="ع د ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَدنٍ</button>
    <button class="word-link" type="button" data-word="يَدخُلونَها" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/">يَدخُلونَها</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/">الأَنهٰرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءونَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَجزِى" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/">يَجزِى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">المُتَّقينَ</button>
  </p>
  <p class="farsi-verse">باغ‌های ماندگاری که به آنها درمی‌آیند، نهرها از زیر آنها جاری است؛ هر چه بخواهند در آنجا دارند؛ آن معبود یگانه پرهیزگاران را چنین پاداش می‌دهد.</p>
</section>
