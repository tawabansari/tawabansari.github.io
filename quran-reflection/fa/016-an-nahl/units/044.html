<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بِالبَيِّنٰتِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بِالبَيِّنٰتِ</button>
    <button class="word-link" type="button" data-word="وَالزُّبُرِ" data-root="ز ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالزُّبُرِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأَنزَلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">وَأَنزَلنا</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="الذِّكرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">الذِّكرَ</button>
    <button class="word-link" type="button" data-word="لِتُبَيِّنَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">لِتُبَيِّنَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="نُزِّلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">نُزِّلَ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="وَلَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="ف ك ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَتَفَكَّرونَ</button>
  </p>
  <p class="farsi-verse">با دلایل روشن و نوشته‌ها؛ و یادآوری را به سوی تو نازل کردیم تا برای مردم آنچه را به سوی آنان نازل شده روشن کنی و باشد که بیندیشند.</p>
</section>
