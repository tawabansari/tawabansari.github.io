    <button class="word-link" type="button" data-word="فَكَذَّبوهُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/">فَكَذَّبوهُ</button>

  <p class="farsi-verse">و به‌راستی رسولی از خودشان نزد آنان آمد، پس او را تکذیب کردند و عذاب آنان را گرفت، در حالی که ستمکار بودند.</p>
