<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَمِنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">أَفَأَمِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="مَكَرُوا" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است.">مَكَرُوا</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَخسِفَ" data-root="خ س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-s-f/" data-root-meaning="فرو رفتن یا فرو بردن در زمین؛ نیز کاهش نور و گرفتگی ماه.">يَخسِفَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يَأتِيَهُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يَأتِيَهُمُ</button>
    <button class="word-link" type="button" data-word="العَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَيثُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">آیا کسانی که نیرنگ‌های بد به کار بردند ایمن شده‌اند از اینکه آن معبود یگانه زمین را با آنان فرو ببرد یا عذاب از جایی که نمی‌دانند به آنان برسد؟</p>
</section>
