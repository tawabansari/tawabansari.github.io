<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَموٰتٌ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">أَموٰتٌ</button>
    <button class="word-link" type="button" data-word="غَيرُ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/">غَيرُ</button>
    <button class="word-link" type="button" data-word="أَحياءٍ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/">أَحياءٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/">يَشعُرونَ</button>
    <button class="word-link" type="button" data-word="أَيّانَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيّانَ</button>
    <button class="word-link" type="button" data-word="يُبعَثونَ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/">يُبعَثونَ</button>
  </p>
  <p class="farsi-verse">مردگان‌اند، نه زندگان؛ و نمی‌دانند چه هنگام برانگیخته می‌شوند.</p>
