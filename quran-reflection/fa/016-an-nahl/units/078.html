<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَخرَجَكُم" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="شما را بیرون آورد؛ از شکم‌های مادرانتان">أَخرَجَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بُطونِ" data-root="ب ط ن" data-root-meaning="درون و سوی داخلی چیزی در برابر بیرون و رویهٔ آن؛ و در کاربردهای گسترده‌تر، جنبهٔ نهفته، کمتر آشکار یا در دسترس نزدیکان و آگاهان از یک امر." data-context="شکم‌های مادران؛ جایگاه پیش از تولد انسان" data-learn-more="/quran-terminology/fa/roots/b-tt-n/">بُطونِ</button>
    <button class="word-link" type="button" data-word="أُمَّهٰتِكُم" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="مادران شما؛ کسانی که از شکم آنان بیرون آمدید">أُمَّهٰتِكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانید؛ در عبارتِ نفی، ناآگاهیِ هنگام تولد را بیان می‌کند">تَعلَمونَ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیزی؛ در نفیِ دانستن هنگام تولد">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار داد و بخشید؛ شنوایی و بینایی و دل‌ها را برای شما">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="السَّمعَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="شنوایی که به انسان بخشیده شده است">السَّمعَ</button>
    <button class="word-link" type="button" data-word="وَالأَبصٰرَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="و بینایی‌ها؛ توان دیدن که به انسان داده شده است">وَالأَبصٰرَ</button>
    <button class="word-link" type="button" data-word="وَالأَفـِٔدَةَ" data-root="ف أ د" data-root-meaning="«دل» مناسب‌ترین معادل پایه فؤاد است؛ دلی که در کاربردهای قرآنی می‌تواند با دریافت، ادراک، گرایش، تاثیرپذیری و پایداری ارتباط داشته باشد." data-learn-more="/quran-terminology/fa/roots/f-a-d/" data-context="و دل‌ها؛ قوای دریافت و گرایشِ بخشیده‌شده به انسان">وَالأَفـِٔدَةَ</button>
    ۙ
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل" data-context="سپاس می‌گزارید؛ پاسخِ مورد انتظار به این نعمت‌ها">تَشكُرونَ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه شما را از شکم‌های مادرانتان بیرون آورد، در حالی که چیزی نمی‌دانستید؛ و برای شما شنوایی و دیدگان و دل‌ها قرار داد، باشد که سپاس گزارید.</p>
</section>
