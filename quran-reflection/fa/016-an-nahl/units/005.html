<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَنعٰمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="و دام‌ها؛ حیواناتی که آفرینش و منافعشان یاد می‌شود.">وَالأَنعٰمَ</button>
    <button class="word-link" type="button" data-word="خَلَقَها" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آنها را آفرید؛ آفرینش دام‌ها.">خَلَقَها</button>
    ۗ
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="دِفءٌ" data-root="د ف أ" data-learn-more="/quran-terminology/fa/roots/d-f-a/" data-root-meaning="گرمی در برابر سرما؛ گرم شدن و گرم نگه داشتن، و پوشاک یا وسایلِ فراهم‌کننده و نگه‌دارندهٔ گرما." data-context="گرمی؛ به‌ویژه پوشاک و پوشش‌های گرمابخشِ فراهم‌شده از فرآورده‌های دام‌ها.">دِفءٌ</button>
    <button class="word-link" type="button" data-word="وَمَنٰفِعُ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی" data-context="و منفعت‌های گوناگون؛ در کنار گرمیِ نام‌برده از دام‌ها.">وَمَنٰفِعُ</button>
    <button class="word-link" type="button" data-word="وَمِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنها</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="می‌خورید؛ استفادهٔ خوراکی از دام‌ها که جداگانه ذکر شده است.">تَأكُلونَ</button>
  </p>
  <p class="farsi-verse">و دام‌ها را آفرید؛ برای شما در آنها گرمی و سودهایی است و از آنها می‌خورید.</p>
</section>
