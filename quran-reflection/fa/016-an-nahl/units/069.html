<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="كُلى" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">كُلى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="ث م ر" data-learn-more="/quran-terminology/fa/roots/th-m-r/" data-root-meaning="بار درخت، میوه و گسترش معنا به حاصل و دارایی">الثَّمَرٰتِ</button>
    <button class="word-link" type="button" data-word="فَاسلُكى" data-root="س ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-k/" data-root-meaning="در راهی رفتن یا چیزی را در مسیر و جایگاهی درآوردن.">فَاسلُكى</button>
    <button class="word-link" type="button" data-word="سُبُلَ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سُبُلَ</button>
    <button class="word-link" type="button" data-word="رَبِّكِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكِ</button>
    <button class="word-link" type="button" data-word="ذُلُلًا" data-root="ذ ل ل" data-learn-more="/quran-terminology/fa/roots/dh-l-l/" data-root-meaning="رام‌شدن، دسترس‌پذیری، فروتنی و فرو افتادن از عزت">ذُلُلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بُطونِها" data-root="ب ط ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-tt-n/" data-root-meaning="شکم، درون و بخش نهان؛ باطن در برابر ظاهر است و بطانه به لایهٔ درونی یا نزدیکان گفته می‌شود.">بُطونِها</button>
    <button class="word-link" type="button" data-word="شَرابٌ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن.">شَرابٌ</button>
    <button class="word-link" type="button" data-word="مُختَلِفٌ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">مُختَلِفٌ</button>
    <button class="word-link" type="button" data-word="أَلوٰنُهُ" data-root="ل و ن" data-learn-more="/quran-terminology/fa/roots/l-w-n/" data-root-meaning="رنگ، نمود دیداری و تمایز میان گونه‌ها">أَلوٰنُهُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="شِفاءٌ" data-root="ش ف ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-f-y/" data-root-meaning="بهبود یافتن و درمان کردن.">شِفاءٌ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">لَـٔايَةً</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="ف ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-r/" data-root-meaning="اندیشه و به کار گرفتن فکر برای شناخت.">يَتَفَكَّرونَ</button>
  </p>
  <p class="farsi-verse">سپس از همه میوه‌ها بخور و راه‌های پروردگارت را رام و هموار بپیما. از شکم‌های آنها نوشیدنی‌ای با رنگ‌های گوناگون بیرون می‌آید که در آن برای مردم شفاست؛ بی‌گمان در این برای مردمی که می‌اندیشند نشانه‌ای است.</p>
</section>
