    <button class="word-link" type="button" data-word="اتَّقَوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">اتَّقَوا</button>

  </p>
  <p class="farsi-verse">و به کسانی که پروا کردند گفته شود: پروردگارتان چه نازل کرده است؟ می‌گویند: خیر. برای آنان که نیکی کردند در این دنیا نیکی است و سرای آخرت بهتر است؛ و چه نیکوست سرای پرهیزگاران.</p>
