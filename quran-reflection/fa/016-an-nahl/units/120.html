<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="أُمَّةً" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أُمَّةً</button>
    <button class="word-link" type="button" data-word="قانِتًا" data-root="ق ن ت" data-learn-more="/quran-terminology/fa/roots/q-n-t/" data-root-meaning="از فرمان‌پذیری و پایبندی تا ایستادگی در عبادت">قانِتًا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="حَنيفًا" data-root="ح ن ف" data-learn-more="/quran-terminology/fa/roots/h-n-f/" data-root-meaning="حنیف؛ جهت‌گیری به سوی آن معبود یگانه و دوری از شرک، با بررسی معنای میل و حدود شواهد تاریخی">حَنيفًا</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="يَكُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد">المُشرِكينَ</button>
  </p>
  <p class="farsi-verse">بی‌گمان ابراهیم امتی بود، فرمانبردار آن معبود یگانه و حق‌گرا، و از مشرکان نبود.</p>
</section>
