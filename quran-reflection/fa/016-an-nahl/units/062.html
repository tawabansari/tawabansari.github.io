  <p class="farsi-verse">و آنچه را ناخوش می‌دارند برای آن معبود یگانه قرار می‌دهند و زبان‌هایشان به دروغ می‌گوید که بهترین برای آنان است؛ بی‌گمان آتش برای آنان است و آنان پیش فرستاده می‌شوند.</p>
