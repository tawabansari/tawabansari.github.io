<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="جَمالٌ" data-root="ج م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-m-l/" data-root-meaning="در شاخه‌های مختلف: جمع و توده، جمال و زیبایی، و جمل به معنای شتر.">جَمالٌ</button>
    <button class="word-link" type="button" data-word="حينَ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان.">حينَ</button>
    <button class="word-link" type="button" data-word="تُريحونَ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">تُريحونَ</button>
    <button class="word-link" type="button" data-word="وَحينَ" data-root="ح ي ن" data-learn-more="/quran-terminology/fa/roots/h-y-n/" data-root-meaning="هنگام، برهه، مقطع، مهلت، و قطعه‌ای از جریان زمان.">وَحينَ</button>
    <button class="word-link" type="button" data-word="تَسرَحونَ" data-root="س ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-h/" data-root-meaning="رها کردن و روانه ساختن؛ درباره دام، به چرا فرستادن.">تَسرَحونَ</button>
  </p>
  <p class="farsi-verse">و برای شما در آنها زیبایی است، هنگامی که بازمی‌گردانید و هنگامی که به چرا می‌برید.</p>
