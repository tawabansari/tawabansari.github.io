<section class="ayah-block" id="ayah-118" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هادوا" data-root="ه و د" data-learn-more="/quran-terminology/fa/roots/h2-w-d/" data-root-meaning="از «إِنَّا هُدْنَا إِلَيْكَ» تا «الَّذِينَ هَادُوا»" data-context="یهودی شدند؛ در عنوانِ گروهِ موضوعِ تحریم.">هادوا</button>
    <button class="word-link" type="button" data-word="حَرَّمنا" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="حرام کردیم؛ ممنوع کردنِ چیزهای پیش‌تر بیان‌شده.">حَرَّمنا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="قَصَصنا" data-root="ق ص ص" data-root-meaning="پی گرفتن اثر و بازگفتن؛ قصاص: مقابلهٔ متناسب با آسیب؛ در لغت، بریدن و کوتاه کردن نیز ثبت شده است." data-context="پیش‌تر برایت بیان کرده‌ایم؛ دربارهٔ آنچه بر یهودیان حرام شده بود، نه لزوماً داستانی طولانی." data-learn-more="/quran-terminology/fa/roots/q-sad-sad/">قَصَصنا</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش‌تر؛ زمانِ بیانِ حکم.">قَبلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="ظَلَمنٰهُم" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="در «ما ظلمناهم»: بر آنان ستم نکردیم؛ نفیِ ستمِ الهی.">ظَلَمنٰهُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در بیانِ رفتارِ آنان.">كانوا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خویشتن‌هایشان؛ موضوعِ ستمِ خود آنان.">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="يَظلِمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم می‌کردند؛ رفتارِ منسوب به خود آنان.">يَظلِمونَ</button>
  </p>
  <p class="farsi-verse">و بر کسانی که یهودی شدند، آنچه پیش‌تر برایت بازگفتیم حرام کردیم؛ و به آنان ستم نکردیم، ولی خود به خویش ستم می‌کردند.</p>
</section>
