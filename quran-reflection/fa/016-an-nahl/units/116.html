  <p class="farsi-verse">و به سبب دروغی که زبان‌هایتان بیان می‌کنند نگویید: این حلال است و این حرام است، تا بر آن معبود یگانه دروغ ببندید؛ بی‌گمان کسانی که بر آن معبود یگانه دروغ می‌بندند رستگار نمی‌شوند.</p>
