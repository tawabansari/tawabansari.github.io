<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="بُشِّرَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="خبر داده شد؛ خبر تولد دختر که باید مژده باشد.">بُشِّرَ</button>
    <button class="word-link" type="button" data-word="أَحَدُهُم" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="یکی از آنان؛ کسی که خبر دختر به او داده می‌شود.">أَحَدُهُم</button>
    <button class="word-link" type="button" data-word="بِالأُنثىٰ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="دختر؛ خبر تولد او به شخص داده می‌شود و واکنش او مورد نقد است.">بِالأُنثىٰ</button>
    <button class="word-link" type="button" data-word="ظَلَّ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="گردید یا همچنان ماند؛ درباره چهره تیره‌شده شخص.">ظَلَّ</button>
    <button class="word-link" type="button" data-word="وَجهُهُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره او؛ هنگام دریافت خبر دختر.">وَجهُهُ</button>
    <button class="word-link" type="button" data-word="مُسوَدًّا" data-root="س و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-d/" data-root-meaning="سیاهی؛ در شاخه‌ای دیگر، سیادت و سروری." data-context="تیره‌شده؛ وصف چهره هنگام خبر دختر.">مُسوَدًّا</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="كَظيمٌ" data-root="ك ظ م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-zha-m/" data-root-meaning="فرو خوردن و در درون نگه داشتن، به‌ویژه خشم یا اندوه." data-context="فروخورنده خشم و اندوه؛ حال شخص هنگام خبر دختر.">كَظيمٌ</button>
  </p>
  <p class="farsi-verse">و هنگامی که یکی از آنان به دختر مژده داده شود، چهره‌اش تیره می‌گردد و اندوه خود را فرو می‌خورد.</p>
</section>
