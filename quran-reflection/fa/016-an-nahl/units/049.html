<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَلِلَّهِ</button>
    <button class="word-link" type="button" data-word="يَسجُدُ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">يَسجُدُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="د ب ب" data-root-meaning="جنبیدن، حرکت کردن و جنبنده؛ از حرکت مورچه و راه رفتن انسان تا گستردگی جانداران، روزی آنان و دو کاربرد متفاوت «دابة الأرض» در قرآن" data-learn-more="/quran-terminology/fa/roots/d-b-b/">دابَّةٍ</button>
    <button class="word-link" type="button" data-word="وَالمَلٰئِكَةُ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">وَالمَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَكبِرونَ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">يَستَكبِرونَ</button>
  </p>
  <p class="farsi-verse">و هر جنبنده‌ای که در آسمان‌ها و در زمین است و فرشتگان، برای آن معبود یگانه سجده می‌کنند و تکبر نمی‌ورزند.</p>
</section>
