<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَتَوٰرىٰ" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش" data-context="از مردم پنهان می‌شود؛ خود را از دید آنان کنار می‌کشد.">يَتَوٰرىٰ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="مردمی که از روبه‌رو شدن با آنان دوری می‌کند.">القَومِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سوءِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="ناخوشایندیِ خبری که در نگاه او بد شمرده می‌شود؛ نه داوری قرآن دربارهٔ دختر.">سوءِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="بُشِّرَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="به او خبر داده شد؛ در سیاق، خبر تولد دختر.">بُشِّرَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَيُمسِكُهُ" data-root="م س ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-k/" data-root-meaning="گرفتن، نگه داشتن و محکم چنگ زدن." data-context="آیا او را نگه دارد؛ پرسش از نگه داشتن فرزند.">أَيُمسِكُهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="هونٍ" data-root="ه و ن" data-learn-more="/quran-terminology/fa/roots/h2-w-n/" data-root-meaning="آسانی، آرامی و فروکاستن از شأن" data-context="با خواری؛ حالتی که مرد در نگه داشتن دختر می‌بیند؛ خواریِ پدر یا فرزند در تفسیرها مطرح شده است.">هونٍ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="يَدُسُّهُ" data-root="د س س" data-learn-more="/quran-terminology/fa/roots/d-s-s/" data-root-meaning="فروبردن و داخل کردن چیزی زیر یا میان پوششی، به‌گونه‌ای که پنهان بماند." data-context="پنهانش کند؛ در خاک فرو بردنِ فرزند در سیاق نکوهش رفتار نسبت به دختر.">يَدُسُّهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="التُّرابِ" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه" data-context="خاک؛ جایگاهی که با «فِي» برای پنهان کردن فرزند مشخص شده است.">التُّرابِ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="ساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="چه بد است؛ نکوهشِ داوری آنان.">ساءَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَحكُمونَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="داوری می‌کنند؛ ارزیابیِ نکوهش‌شدهٔ آنان دربارهٔ دختران.">يَحكُمونَ</button>
  </p>
  <p class="farsi-verse">از بدی آنچه به او مژده داده شده از مردم پنهان می‌شود؛ آیا آن را با خواری نگه دارد یا در خاک پنهانش کند؟ آگاه باشید، چه بد داوری می‌کنند.</p>
</section>
