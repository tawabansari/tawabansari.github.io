  <p class="farsi-verse">و کسانی که شرک ورزیدند گفتند: اگر آن معبود یگانه می‌خواست، نه ما و نه پدرانمان چیزی جز او را نمی‌پرستیدیم و بدون او چیزی را حرام نمی‌کردیم. کسانی که پیش از آنان بودند نیز چنین کردند؛ پس آیا بر رسولان جز رساندن روشن است؟</p>
