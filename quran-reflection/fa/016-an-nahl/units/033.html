  <p class="farsi-verse">آیا جز این انتظار دارند که فرشتگان نزدشان بیایند یا فرمان پروردگارت برسد؟ کسانی که پیش از آنان بودند نیز چنین کردند؛ و آن معبود یگانه به آنان ستم نکرد، بلکه خود به خویش ستم می‌کردند.</p>
