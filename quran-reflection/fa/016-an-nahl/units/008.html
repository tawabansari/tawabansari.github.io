<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالخَيلَ" data-root="خ ي ل" data-learn-more="/quran-terminology/fa/roots/kh-y-l/" data-root-meaning="نمود و تصور چیزی در ذهن یا برابر چشم؛ حرکت همراه با جلوه‌گری. در مشتق‌های مشخص: اسبان، پدید آوردن تصور، و خودنماییِ متکبرانه." data-context="و اسب‌ها؛ یکی از سه گروه حیوانات نام‌برده برای سواری و زیبایی.">وَالخَيلَ</button>
    <button class="word-link" type="button" data-word="وَالبِغالَ" data-root="ب غ ل" data-root-meaning="«بَغْل» نام قاطر، حیوان دورگه اسب و الاغ، است؛ و «بِغَال» جمع آن است. قرآن این حیوان را در کنار اسب و الاغ، با توجه به امکان سواری و زیبایی آن نام می‌برد." data-context="و قاطرها؛ حیوانات نام‌برده در کنار اسب‌ها و الاغ‌ها برای سواری و زیبایی." data-learn-more="/quran-terminology/fa/roots/b-gh-l/">وَالبِغالَ</button>
    <button class="word-link" type="button" data-word="وَالحَميرَ" data-root="ح م ر" data-root-meaning="سرخی و رنگ سرخ؛ و در شاخه‌ای دیگر، حِمار: خر، با صورت‌های جمع حَمِیر و حُمُر." data-context="و الاغ‌ها؛ حیواناتی که در کنار اسب‌ها و قاطرها نام برده شده‌اند." data-learn-more="/quran-terminology/fa/roots/h-m-r/">وَالحَميرَ</button>
    <button class="word-link" type="button" data-word="لِتَركَبوها" data-root="ر ك ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-k-b/" data-root-meaning="سوار شدن، برهم قرار گرفتن و ترکیب یافتن." data-context="تا بر آنها سوار شوید؛ هدفی برای بهره‌گیری از هر سه گروه حیوانات.">لِتَركَبوها</button>
    <button class="word-link" type="button" data-word="وَزينَةً" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="و مایهٔ زیبایی؛ جلوه و آراستگی همان حیوانات برای انسان.">وَزينَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَخلُقُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="و می‌آفریند؛ آفرینش او به حیوانات نام‌برده محدود نیست.">وَيَخلُقُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانید؛ در جملهٔ منفی، چیزهایی که مخاطبان از آنها آگاهی ندارند.">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و اسبان و استران و خران را، تا بر آنها سوار شوید و برای زینت؛ و آنچه را نمی‌دانید می‌آفریند.</p>
</section>
