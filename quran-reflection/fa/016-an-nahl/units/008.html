<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالخَيلَ" data-root="خ ي ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-y-l/" data-root-meaning="تصویر ذهنی و خیال؛ اختیال: خودبزرگ‌بینی؛ خیل: اسبان.">وَالخَيلَ</button>
    <button class="word-link" type="button" data-word="وَالبِغالَ" data-root="ب غ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-gh-l/" data-root-meaning="بغل و بغال: استر و استران، حاصل آمیزش اسب و الاغ.">وَالبِغالَ</button>
    <button class="word-link" type="button" data-word="وَالحَميرَ" data-root="ح م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-r/" data-root-meaning="سرخی و رنگ سرخ؛ در شاخه‌ای دیگر، حمار و حُمُر: خر و خران.">وَالحَميرَ</button>
    <button class="word-link" type="button" data-word="لِتَركَبوها" data-root="ر ك ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-k-b/" data-root-meaning="سوار شدن، برهم قرار گرفتن و ترکیب یافتن.">لِتَركَبوها</button>
    <button class="word-link" type="button" data-word="وَزينَةً" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن.">وَزينَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَخلُقُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">وَيَخلُقُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و اسبان و استران و خران را، تا بر آنها سوار شوید و برای زینت؛ و آنچه را نمی‌دانید می‌آفریند.</p>
</section>
