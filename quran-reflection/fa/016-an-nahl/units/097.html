<section class="ayah-block" id="ayah-097" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۹۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="عَمِلَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام داد؛ کردار شخص در شرط پاداش یا جزا.">عَمِلَ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="کاری شایسته؛ کردارِ همراه با ایمان.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذَكَرٍ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="مرد؛ در سیاق انسانی در کنار زن.">ذَكَرٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="أُنثىٰ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="زن؛ در کنار مرد در شرط ایمان و عمل صالح و وعده زندگی پاکیزه.">أُنثىٰ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مُؤمِنٌ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمن؛ شرط ایمانِ نیکوکار.">مُؤمِنٌ</button>
    <button class="word-link" type="button" data-word="فَلَنُحيِيَنَّهُ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="بی‌گمان او را زندگی خواهیم بخشید؛ وعده زندگی پاکیزه.">فَلَنُحيِيَنَّهُ</button>
    <button class="word-link" type="button" data-word="حَيوٰةً" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی؛ در وعده زندگی پاکیزه.">حَيوٰةً</button>
    <button class="word-link" type="button" data-word="طَيِّبَةً" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="پاکیزه و نیکو؛ وصف زندگی وعده‌داده‌شده.">طَيِّبَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَنَجزِيَنَّهُم" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="و بی‌گمان پاداششان خواهیم داد.">وَلَنَجزِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="أَجرَهُم" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل" data-context="پاداش آنان.">أَجرَهُم</button>
    <button class="word-link" type="button" data-word="بِأَحسَنِ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="بر پایه بهترینِ آنچه انجام می‌دادند.">بِأَحسَنِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="می‌کردند؛ فعلِ بیان استمرار کردار گذشته در ترکیب جمله.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دادند؛ کردار گذشته در بیان پاداش.">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">هر که کار شایسته کند، مرد باشد یا زن، و مؤمن باشد، حتماً او را به زندگی‌ای پاکیزه زنده می‌داریم و حتماً پاداششان را بر پایه بهترین آنچه می‌کردند می‌دهیم.</p>
</section>
