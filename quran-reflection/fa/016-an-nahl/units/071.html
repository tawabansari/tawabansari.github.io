  <p class="farsi-verse">و آن معبود یگانه برخی از شما را در روزی بر برخی برتری داده است؛ پس آنان که برتری داده شده‌اند، روزی خود را به کسانی که دست‌های راستشان در اختیار دارد بازنمی‌دهند تا در آن برابر باشند؛ آیا نعمت آن معبود یگانه را انکار می‌کنند؟</p>
