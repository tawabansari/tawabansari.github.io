  <p class="farsi-verse">و اگر آن معبود یگانه می‌خواست، شما را امتی یگانه قرار می‌داد؛ ولی هر که را بخواهد گمراه می‌کند و هر که را بخواهد هدایت می‌کند؛ و حتماً درباره آنچه می‌کردید پرسیده خواهید شد.</p>
