<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَحمِلُ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="و حمل می‌کنند؛ چهارپایان بارها را جابه‌جا می‌کنند." data-learn-more="/quran-terminology/fa/roots/h-m-l/">وَتَحمِلُ</button>
    <button class="word-link" type="button" data-word="أَثقالَكُم" data-root="ث ق ل" data-root-meaning="سنگینی، وزن، بار و اهمیت؛ از بارهای مادی تا سنجش کردار انسان" data-context="بارهای شما؛ اسباب و بارهای حمل‌شدنی در سفر." data-learn-more="/quran-terminology/fa/roots/th-q-l/">أَثقالَكُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَلَدٍ" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»" data-context="سرزمینی؛ مقصد سفر و حمل بار.">بَلَدٍ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="نبودید؛ در بیان ناتوانی از رسیدن بی‌رنج.">تَكونوا</button>
    <button class="word-link" type="button" data-word="بٰلِغيهِ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="رسنده به آن؛ توان رسیدن به مقصد.">بٰلِغيهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِشِقِّ" data-root="ش ق ق" data-learn-more="/quran-terminology/fa/roots/sh-q-q/" data-root-meaning="شکافتن، رخنه، جانب، مشقت، فاصله و گسست جبهه‌ساز" data-context="با رنج و دشواری؛ کوشش طاقت‌فرسای سفر.">بِشِقِّ</button>
    <button class="word-link" type="button" data-word="الأَنفُسِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="جان‌ها؛ خودِ انسان‌ها که رنج سفر را تحمل می‌کنند.">الأَنفُسِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان؛ صاحب تدبیر و پرورش شما.">رَبَّكُم</button>
    <button class="word-link" type="button" data-word="لَرَءوفٌ" data-root="ر أ ف" data-learn-more="/quran-terminology/fa/roots/r-a-f/" data-root-meaning="رأفت و رئوف؛ دلسوزی، مهربانی و رعایت حال دیگری، از عاطفه انسانی تا وصف آن معبود یگانه و نبی در قرآن" data-context="بسیار دلسوز؛ وصف رأفت پروردگار.">لَرَءوفٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربان؛ وصف رحمت پروردگار.">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">و بارهای شما را به سرزمینی می‌برند که جز با رنج جان‌ها به آن نمی‌رسیدید؛ بی‌گمان پروردگارتان بسیار رئوف و رحیم است.</p>
</section>
