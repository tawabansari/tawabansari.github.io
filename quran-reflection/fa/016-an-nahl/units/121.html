<section class="ayah-block" id="ayah-121" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۱۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="شاكِرًا" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">شاكِرًا</button>
    <button class="word-link" type="button" data-word="لِأَنعُمِهِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">لِأَنعُمِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="اجتَبىٰهُ" data-root="ج ب ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-y/" data-root-meaning="گرد آوردن و جمع کردن؛ اجتباء: برگزیدن؛ جابیه و جواب: حوض‌های گردآورندهٔ آب.">اجتَبىٰهُ</button>
    <button class="word-link" type="button" data-word="وَهَدىٰهُ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">وَهَدىٰهُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="ص ر ط" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد" data-learn-more="/quran-terminology/fa/roots/s-r-t/">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُستَقيمٍ</button>
  </p>
  <p class="farsi-verse">سپاسگزار نعمت‌های او بود؛ او را برگزید و به راهی راست هدایتش کرد.</p>
</section>
