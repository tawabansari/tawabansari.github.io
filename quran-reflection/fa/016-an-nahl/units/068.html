<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَوحىٰ" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="و راهنمایی و الهام کرد.">وَأَوحىٰ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="النَّحلِ" data-root="ن ح ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h-l/" data-root-meaning="بخشش؛ نحل: زنبور عسل." data-context="زنبور عسل.">النَّحلِ</button>
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنِ</button>
    <button class="word-link" type="button" data-word="اتَّخِذى" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="برگزین و فراهم کن؛ خطاب به زنبور.">اتَّخِذى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالِ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="لانه‌ها و جایگاه‌های زندگی زنبور." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بُيوتًا</button>
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الشَّجَرِ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="درختان.">الشَّجَرِ</button>
    <button class="word-link" type="button" data-word="وَمِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمّا</button>
    <button class="word-link" type="button" data-word="يَعرِشونَ" data-root="ع ر ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-sh/" data-root-meaning="سقف و سازه برافراشته؛ عرش: تخت یا جایگاه فرمانروایی." data-context="برمی‌افرازند و داربست و سازه فراهم می‌کنند.">يَعرِشونَ</button>
  </p>
  <p class="farsi-verse">و پروردگارت به زنبور عسل وحی کرد که از کوه‌ها و درختان و از آنچه برمی‌افرازند خانه‌هایی برگیر.</p>
</section>
