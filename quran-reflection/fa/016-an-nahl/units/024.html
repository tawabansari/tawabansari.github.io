<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ماذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ماذا</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّكُم</button>
    ۙ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="أَسٰطيرُ" data-root="س ط ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَسٰطيرُ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">الأَوَّلينَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که به آنان گفته شود پروردگارتان چه نازل کرده است، می‌گویند: افسانه‌های پیشینیان.</p>
</section>
