    <button class="word-link" type="button" data-word="الحَرَّ" data-root="ح ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-r-r/" data-root-meaning="آزادی و رهاسازی؛ نیز گرما و، در شاخه‌ای دیگر، حریر و ابریشم.">الحَرَّ</button>
    <button class="word-link" type="button" data-word="وَسَرٰبيلَ" data-root="س ر ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-b-l/" data-root-meaning="جامه و پوشش تن، از جمله پوشش محافظ.">وَسَرٰبيلَ</button>
    <button class="word-link" type="button" data-word="تَقيكُم" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">تَقيكُم</button>

  </p>
  <p class="farsi-verse">و آن معبود یگانه از آنچه آفریده برای شما سایه‌ها قرار داد و از کوه‌ها پناهگاه‌هایی برای شما قرار داد و جامه‌هایی برایتان قرار داد که شما را از گرما نگه می‌دارند و جامه‌هایی که شما را در نبردتان نگه می‌دارند؛ این‌گونه نعمتش را بر شما تمام می‌کند، باشد که تسلیم شوید.</p>
</section>
