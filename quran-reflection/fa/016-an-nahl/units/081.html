<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۸۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد؛ فراهم ساختن سایه‌ها برای شما.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفریده است؛ چیزهایی که سایه‌ها از آنها فراهم می‌شوند.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="ظِلٰلًا" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="سایه‌ها؛ پوشش‌هایی از تابش که در آفرینش فراهم شده‌اند.">ظِلٰلًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار داد؛ فراهم ساختن پناهگاه‌ها.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند." data-context="کوه‌ها؛ جایگاه پناهگاه‌های طبیعی.">الجِبالِ</button>
    <button class="word-link" type="button" data-word="أَكنٰنًا" data-root="ك ن ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-n/" data-root-meaning="پوشاندن و در پناه محفوظ داشتن." data-context="پناهگاه‌ها؛ جای‌های پوشیده و محفوظ در کوه‌ها.">أَكنٰنًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار داد؛ فراهم ساختن پوشاک محافظ.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="سَرٰبيلَ" data-root="س ر ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-b-l/" data-root-meaning="جامه و پوشش تن، از جمله پوشش محافظ." data-context="جامه‌ها؛ پوشاکی که از گرما محافظت می‌کنند.">سَرٰبيلَ</button>
    <button class="word-link" type="button" data-word="تَقيكُمُ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="شما را حفظ می‌کنند؛ نقش جامه‌ها در برابر گرما.">تَقيكُمُ</button>
    <button class="word-link" type="button" data-word="الحَرَّ" data-root="ح ر ر" data-root-meaning="آزادی و رهاسازی یا اختصاص یافتن؛ در شاخهٔ دیگر، گرما و سوزندگی؛ حریر: ابریشم." data-context="گرما؛ آنچه جامه‌ها شما را از آسیبش حفظ می‌کنند." data-learn-more="/quran-terminology/fa/roots/h-r-r/">الحَرَّ</button>
    <button class="word-link" type="button" data-word="وَسَرٰبيلَ" data-root="س ر ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-b-l/" data-root-meaning="جامه و پوشش تن، از جمله پوشش محافظ." data-context="و پوشش‌ها؛ جامه‌های محافظ در برابر آسیب نبرد.">وَسَرٰبيلَ</button>
    <button class="word-link" type="button" data-word="تَقيكُم" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="شما را حفظ می‌کنند؛ نقش پوشش‌های محافظ در نبرد.">تَقيكُم</button>
    <button class="word-link" type="button" data-word="بَأسَكُم" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="آسیب نبردتان؛ شدت و ضربه‌های جنگ میان شما.">بَأسَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يُتِمُّ" data-root="ت م م" data-learn-more="/quran-terminology/fa/roots/t-m-m/" data-root-meaning="رسیدن یا رساندن یک امر به حد مقرر، پس از کامل شدن مقدار، مدت، اجزا یا مراحل لازم" data-context="کامل می‌گرداند؛ به تمامیت رساندن نعمت.">يُتِمُّ</button>
    <button class="word-link" type="button" data-word="نِعمَتَهُ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمتش؛ امکانات سودمندی که برای شما فراهم کرده است.">نِعمَتَهُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُسلِمونَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="تسلیم شوید؛ روی آوردن به پذیرش و فرمان‌پذیری.">تُسلِمونَ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه از آنچه آفریده برای شما سایه‌ها قرار داد و از کوه‌ها پناهگاه‌هایی برای شما قرار داد و جامه‌هایی برایتان قرار داد که شما را از گرما نگه می‌دارند و جامه‌هایی که شما را در نبردتان نگه می‌دارند؛ این‌گونه نعمتش را بر شما تمام می‌کند، باشد که تسلیم شوید.</p>
</section>
