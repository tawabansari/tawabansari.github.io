<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">النحل ۱۶:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بِكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نِعمَةٍ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمت؛ هر برخورداری که سرچشمهٔ آن در آیه بیان می‌شود.">نِعمَةٍ</button>
    <button class="word-link" type="button" data-word="فَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="مَسَّكُمُ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به شما رسید؛ تماس و اثرِ زیان بر مخاطبان.">مَسَّكُمُ</button>
    <button class="word-link" type="button" data-word="الضُّرُّ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="زیان و سختی؛ گرفتاری‌ای که فریاد یاری را در پی دارد.">الضُّرُّ</button>
    <button class="word-link" type="button" data-word="فَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تَجـَٔرونَ" data-root="ج أ ر" data-root-meaning="بلند کردن صدای ناله یا فریاد در حالت نیاز و درماندگی، به‌ویژه برای درخواست یاری و رهایی از گرفتاری." data-context="رو به او فریاد یاری برمی‌آورید؛ واکنش مخاطبان هنگام رسیدن زیان." data-learn-more="/quran-terminology/fa/roots/j-a-r/">تَجـَٔرونَ</button>
  </p>
  <p class="farsi-verse">و هر نعمتی که دارید از آن معبود یگانه است؛ سپس هنگامی که زیان به شما برسد، به سوی او فریاد برمی‌آورید.</p>
</section>
