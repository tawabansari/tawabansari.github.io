<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لٰبِثينَ" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="ماندگان؛ وصف گروه یادشده که در جهنم اقامت دارند؛ مدت این ماندن با «أحقابا» بیان می‌شود.">لٰبِثينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="أَحقابًا" data-root="ح ق ب" data-root-meaning="در کاربرد قرآنی، دوره‌ای دراز از زمان، بدون تعیین شمار سال‌ها در خود آیه؛ «أحقاب» جمعِ دوره‌هاست و شمار نهایی آنها را به‌تنهایی تعیین نمی‌کند." data-context="دوره‌های دراز زمانی؛ بیان مدت ماندن گروه یادشده در جهنم، بدون تعیین شمار نهایی دوره‌ها در خود این واژه." data-learn-more="/quran-terminology/fa/roots/h-q-b/">أَحقابًا</button>
  </p>
  <p class="farsi-verse">که روزگارانی در آن می‌مانند.</p>
</section>
