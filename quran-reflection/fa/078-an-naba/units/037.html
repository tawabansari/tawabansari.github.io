<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار؛ در اینجا پروردگار آسمان‌ها و زمین و میان آنها.">رَبِّ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ بخشی از قلمرو ربوبیت یادشده.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ در کنار آسمان‌ها و آنچه میان آنهاست.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُمَا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن دو؛ آنچه میان آسمان‌ها و زمین قرار دارد.">بَينَهُمَا</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمان؛ نام الهی در پی وصف پروردگار آسمان‌ها و زمین.">الرَّحمٰنِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَملِكونَ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="اختیار دارند؛ در ساخت منفی، نداشتن اختیار مستقل برای مخاطبه.">يَملِكونَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="خِطابًا" data-root="خ ط ب" data-root-meaning="سخن گفتن با مخاطب و طرح یا پیگیری یک موضوع؛ در کاربردهای دیگر، کار و پیشامد، و درخواست ازدواج." data-context="خطاب و مخاطبه با او؛ در این سیاق، بدون اختیار مستقل برای سخن گفتن." data-learn-more="/quran-terminology/fa/roots/kh-tt-b/">خِطابًا</button>
  </p>
  <p class="farsi-verse">پروردگار آسمان‌ها و زمین و آنچه میان آن دو است، فرارحمن؛ اختیار سخن گفتن با او را ندارند.</p>
</section>
