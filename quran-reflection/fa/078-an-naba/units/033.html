<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَواعِبَ" data-root="ك ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-ayn-b/" data-root-meaning="برآمدگی؛ کعب: قوزک پا؛ کعبه: بنای چهارگوش؛ کواعب: وصف بلوغ جسمی.">وَكَواعِبَ</button>
    <button class="word-link" type="button" data-word="أَترابًا" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه">أَترابًا</button>
  </p>
  <p class="farsi-verse">و دخترانِ سینه‌برآمدهٔ هم‌سال،</p>
