<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَأسًا" data-root="ك أ س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-a-s/" data-root-meaning="جام نوشیدنی، معمولاً همراه با محتوی آن." data-context="و جامی؛ ظرفِ دارای نوشیدنی که «دهاق» پر بودنش را وصف می‌کند.">وَكَأسًا</button>
    <button class="word-link" type="button" data-word="دِهاقًا" data-root="د ه ق" data-learn-more="/quran-terminology/fa/roots/d-h2-q/" data-root-meaning="پر کردن و انباشتن، فشردگی و فشار؛ در وصف جام، پر و لبالب بودن." data-context="لبالب و کاملاً پر؛ وصف جام نوشیدنی در این آیه.">دِهاقًا</button>
  </p>
  <p class="farsi-verse">و جامی لبریز.</p>
</section>
