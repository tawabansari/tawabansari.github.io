<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَذوقوا" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج.">فَذوقوا</button>
    <button class="word-link" type="button" data-word="فَلَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَن</button>
    <button class="word-link" type="button" data-word="نَزيدَكُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">نَزيدَكُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابًا</button>
  </p>
  <p class="farsi-verse">پس بچشید؛ جز عذاب چیزی بر شما نمی‌افزاییم.</p>
</section>
