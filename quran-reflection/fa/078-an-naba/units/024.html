<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَذوقونَ" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="نمی‌چشند؛ نداشتن تجربه و بهره‌ای از خنکی و نوشیدنی در آن جایگاه.">يَذوقونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="بَردًا" data-root="ب ر د" data-root-meaning="سردی و خنکی در برابر گرمی؛ «بَرَد»: تگرگ؛ و در برخی کاربردهای گسترده، فروکش کردن و آسودگی." data-learn-more="/quran-terminology/fa/roots/b-r-d/" data-context="خنکی؛ خوانش مرجح در سیاق گرما و نوشیدنی؛ معنای خواب نیز در لغت و تفسیر گزارش شده است.">بَردًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="شَرابًا" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="نوشیدنی؛ در پیوند با استثنای آیهٔ بعد، از نوشیدنیِ رفع‌کنندهٔ عطش و آسایش‌بخش محروم‌اند.">شَرابًا</button>
  </p>
  <p class="farsi-verse">در آن نه خنکی می‌چشند و نه نوشیدنی،</p>
</section>
