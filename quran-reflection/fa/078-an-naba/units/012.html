<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَنَينا" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">وَبَنَينا</button>
    <button class="word-link" type="button" data-word="فَوقَكُم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد">فَوقَكُم</button>
    <button class="word-link" type="button" data-word="سَبعًا" data-root="س ب ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/" data-root-meaning="عدد هفت؛ سَبُع: جانور درنده.">سَبعًا</button>
    <button class="word-link" type="button" data-word="شِدادًا" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شِدادًا</button>
  </p>
  <p class="farsi-verse">و بر فراز شما هفت استوار بنا کردیم،</p>
</section>
