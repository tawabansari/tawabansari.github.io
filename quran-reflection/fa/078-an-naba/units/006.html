<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="نَجعَلِ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">نَجعَلِ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضَ</button>
    <button class="word-link" type="button" data-word="مِهٰدًا" data-root="م ه د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مِهٰدًا</button>
  </p>
  <p class="farsi-verse">آیا زمین را بستری نساختیم،</p>
