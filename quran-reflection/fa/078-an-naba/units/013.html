<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="سِراجًا" data-root="س ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-j/" data-root-meaning="چراغ و منبع روشنایی.">سِراجًا</button>
    <button class="word-link" type="button" data-word="وَهّاجًا" data-root="و ه ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h2-j/" data-root-meaning="درخشندگی و گرمای شدید.">وَهّاجًا</button>

  <p class="farsi-verse">و چراغی فروزان قرار دادیم،</p>
