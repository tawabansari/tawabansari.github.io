<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">النبأ ۷۸:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="اليَومُ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="آن روز؛ روزِ حق.">اليَومُ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق و قطعی؛ وصف آن روز.">الحَقُّ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هرکس بخواهد.">شاءَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="راه بازگشت به پروردگار را در پیش گیرد.">اتَّخَذَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار او؛ جهت بازگشت.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="مَـٔابًا" data-root="أ و ب" data-learn-more="/quran-terminology/fa/roots/a-w-b/" data-root-meaning="بازگشت و بازآوردن؛ «أوّاب»، بسیار بازگشت‌کننده و روی‌آورنده؛ «مآب»، بازگشت یا بازگشتگاه." data-context="بازگشت به سوی پروردگار؛ در ساخت اختیار کردن آن.">مَـٔابًا</button>
  </p>
  <p class="farsi-verse">آن روزِ حق است؛ پس هر که بخواهد، به سوی پروردگارش بازگشتگاهی برگزیند.</p>
</section>
