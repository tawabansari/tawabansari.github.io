    <button class="word-link" type="button" data-word="الكُفرَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكُفرَ</button>

    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>

    <button class="word-link" type="button" data-word="أَنصارُ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">أَنصارُ</button>

    <button class="word-link" type="button" data-word="وَاشهَد" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">وَاشهَد</button>

    <button class="word-link" type="button" data-word="مُسلِمونَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">مُسلِمونَ</button>
  </p>
  <p class="farsi-verse">پس چون عیسی از آنان انکار احساس کرد، گفت: «چه کسانی یاوران من به سوی آن معبود یگانه هستند؟» حواریون گفتند: «ما یاوران آن معبود یگانه‌ایم؛ به آن معبود یگانه ایمان آوردیم، و گواه باش که ما تسلیم هستیم.</p>
</section>
