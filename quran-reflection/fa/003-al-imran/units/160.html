  <p class="farsi-verse">اگر آن معبود یگانه شما را یاری کند، هیچ‌کس بر شما چیره نمی‌شود؛ و اگر شما را واگذارد، چه کسی پس از او شما را یاری می‌کند؟ و مؤمنان باید بر آن معبود یگانه توکل کنند.</p>
