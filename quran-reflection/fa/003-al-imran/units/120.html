<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="تَمسَسكُم" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی">تَمسَسكُم</button>
    <button class="word-link" type="button" data-word="حَسَنَةٌ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">حَسَنَةٌ</button>
    <button class="word-link" type="button" data-word="تَسُؤهُم" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">تَسُؤهُم</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُصِبكُم" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">تُصِبكُم</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="يَفرَحوا" data-root="ف ر ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَفرَحوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَصبِروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">تَصبِروا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَضُرُّكُم" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری">يَضُرُّكُم</button>
    <button class="word-link" type="button" data-word="كَيدُهُم" data-root="ك ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَيدُهُم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="مُحيطٌ" data-root="ح و ط" data-learn-more="/quran-terminology/fa/roots/h-w-tt/" data-root-meaning="احاطه کردن، دربرگرفتن، پیرامون چیزی را گرفتن، از همه سو فراگرفتن؛ و در برخی کاربردها، نگاهبانی، مراقبت، یا محاصره">مُحيطٌ</button>
  </p>
  <p class="farsi-verse">اگر نیکی‌ای به شما برسد، آنان را اندوهگین می‌کند؛ و اگر بدی‌ای به شما برسد، به آن شاد می‌شوند. و اگر شکیبایی و پروا داشته باشید، نیرنگشان هیچ زیانی به شما نمی‌رساند؛ آن معبود یگانه به آنچه می‌کنند احاطه دارد.</p>
</section>
