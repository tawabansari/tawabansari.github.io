<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُعَلِّمُهُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">وَيُعَلِّمُهُ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="وَالحِكمَةَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">وَالحِكمَةَ</button>
    <button class="word-link" type="button" data-word="وَالتَّورىٰةَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَالتَّورىٰةَ</button>
    <button class="word-link" type="button" data-word="وَالإِنجيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَالإِنجيلَ</button>
  </p>
  <p class="farsi-verse">و به او کتاب و حکمت و تورات و انجیل می‌آموزد.</p>
</section>
