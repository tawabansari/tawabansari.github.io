<section class="ayah-block" id="ayah-086" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۸۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدِى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومًا</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدَ</button>
    <button class="word-link" type="button" data-word="إيمٰنِهِم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">إيمٰنِهِم</button>
    <button class="word-link" type="button" data-word="وَشَهِدوا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">وَشَهِدوا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="الرَّسولَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">الرَّسولَ</button>
    <button class="word-link" type="button" data-word="حَقٌّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">حَقٌّ</button>
    <button class="word-link" type="button" data-word="وَجاءَهُمُ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجاءَهُمُ</button>
    <button class="word-link" type="button" data-word="البَيِّنٰتُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">البَيِّنٰتُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">چگونه آن معبود یگانه گروهی را هدایت کند که پس از ایمانشان کفر ورزیدند و گواهی داده بودند که فرستاده حق است و نشانه‌های روشن به آنان رسیده بود؟ و آن معبود یگانه گروه ستمکاران را هدایت نمی‌کند.</p>
</section>
