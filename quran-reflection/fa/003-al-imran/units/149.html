  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، اگر از کسانی که کفر ورزیدند اطاعت کنید، شما را بر پاشنه‌هایتان بازمی‌گردانند و زیانکار بازخواهید گشت.</p>
