<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="نخستین؛ ترتیبِ قرار دادن خانه برای مردم.">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="بَيتٍ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه‌ای که برای مردم قرار داده شد." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بَيتٍ</button>
    <button class="word-link" type="button" data-word="وُضِعَ" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="قرار داده شد؛ فعل مجهول دربارهٔ خانه.">وُضِعَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="برای مردم؛ مخاطبان و بهره‌مندان از خانه.">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="لَلَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَلَّذى</button>
    <button class="word-link" type="button" data-word="بِبَكَّةَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِبَكَّةَ</button>
    <button class="word-link" type="button" data-word="مُبارَكًا" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="خانه‌ای برخوردار از خیر و برکت؛ در کنار وصفِ هدایت برای جهانیان." data-learn-more="/quran-terminology/fa/roots/b-r-k/">مُبارَكًا</button>
    <button class="word-link" type="button" data-word="وَهُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت و راهنمایی؛ وصفی در کنارِ مبارک بودن خانه.">وَهُدًى</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="برای جهانیان؛ گسترهٔ بیان‌شدهٔ هدایت.">لِلعٰلَمينَ</button>
  </p>
  <p class="farsi-verse">همانا نخستین خانه‌ای که برای مردم نهاده شد، همان است که در بکّه است؛ پربرکت و هدایتی برای جهانیان.</p>
</section>
