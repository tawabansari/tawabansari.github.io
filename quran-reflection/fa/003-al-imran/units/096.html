<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="بَيتٍ" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/">بَيتٍ</button>
    <button class="word-link" type="button" data-word="وُضِعَ" data-root="و ض ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وُضِعَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="لَلَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَلَّذى</button>
    <button class="word-link" type="button" data-word="بِبَكَّةَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِبَكَّةَ</button>
    <button class="word-link" type="button" data-word="مُبارَكًا" data-root="ب ر ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُبارَكًا</button>
    <button class="word-link" type="button" data-word="وَهُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">وَهُدًى</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">لِلعٰلَمينَ</button>
  </p>
  <p class="farsi-verse">همانا نخستین خانه‌ای که برای مردم نهاده شد، همان است که در بکّه است؛ پربرکت و هدایتی برای جهانیان.</p>
</section>
