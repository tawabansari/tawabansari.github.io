  <p class="farsi-verse">گفت: «پروردگارا، چگونه مرا فرزندی باشد، در حالی که بشری به من دست نزده است؟» گفت: «چنین است؛ آن معبود یگانه هرچه بخواهد می‌آفریند. چون کاری را مقرر کند، تنها به آن می‌گوید: باش؛ پس می‌شود.»</p>
