<section class="ayah-block" id="ayah-162" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَمَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَمَنِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">اتَّبَعَ</button>
    <button class="word-link" type="button" data-word="رِضوٰنَ" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل">رِضوٰنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَمَن</button>
    <button class="word-link" type="button" data-word="باءَ" data-root="ب و أ" data-learn-more="/quran-terminology/fa/roots/b-w-a/" data-root-meaning="از بازگشت و جای گرفتن تا جای دادن و بر عهده گرفتن پیامد">باءَ</button>
    <button class="word-link" type="button" data-word="بِسَخَطٍ" data-root="س خ ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-kh-tt/" data-root-meaning="ناخشنودی و خشم.">بِسَخَطٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَمَأوىٰهُ" data-root="أ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="پناه گرفتن و در جایی جای گرفتن؛ إیواء: پناه دادن؛ مأوى: جای پناه و اقامت.">وَمَأوىٰهُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/" data-root-meaning="از رسیدن به یک پایان تا «مصیر»؛ آنچه کار سرانجام به آن می‌رسد">المَصيرُ</button>
  </p>
  <p class="farsi-verse">آیا کسی که از خشنودی آن معبود یگانه پیروی کرده، مانند کسی است که به خشمی از آن معبود یگانه گرفتار شده و جایگاهش دوزخ است؟ و چه بد سرانجامی است.</p>
</section>
