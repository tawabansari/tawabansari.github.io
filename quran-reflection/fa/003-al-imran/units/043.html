<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰمَريَمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰمَريَمُ</button>
    <button class="word-link" type="button" data-word="اقنُتى" data-root="ق ن ت" data-learn-more="/quran-terminology/fa/roots/q-n-t/">اقنُتى</button>
    <button class="word-link" type="button" data-word="لِرَبِّكِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">لِرَبِّكِ</button>
    <button class="word-link" type="button" data-word="وَاسجُدى" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/">وَاسجُدى</button>
    <button class="word-link" type="button" data-word="وَاركَعى" data-root="ر ك ع" data-learn-more="/quran-terminology/fa/roots/r-k-ayn/">وَاركَعى</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="الرّٰكِعينَ" data-root="ر ك ع" data-learn-more="/quran-terminology/fa/roots/r-k-ayn/">الرّٰكِعينَ</button>

  <p class="farsi-verse">ای مریم، برای پروردگارت فرمانبردار باش و سجده کن و با رکوع‌کنندگان رکوع کن.</p>
