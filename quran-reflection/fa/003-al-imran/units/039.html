  <p class="farsi-verse">پس فرشتگان او را ندا دادند، در حالی که در محراب ایستاده صلات می‌گزارد: آن معبود یگانه تو را به یحیی بشارت می‌دهد، تصدیق‌کنندهٔ کلمه‌ای از آن معبود یگانه و بزرگوار و خویشتن‌دار و پیامبری از شایستگان.</p>
