<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَنادَتهُ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="پس او را ندا دادند؛ خطاب فرشتگان به زکریا." data-learn-more="/quran-terminology/fa/roots/n-d-y/">فَنادَتهُ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ نداکنندگان زکریا.">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="قائِمٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ایستاده؛ حالت زکریا هنگام ندا.">قائِمٌ</button>
    <button class="word-link" type="button" data-word="يُصَلّى" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلاة به‌جا می‌آورد؛ کار زکریا هنگام ندا.">يُصَلّى</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="المِحرابِ" data-root="ح ر ب" data-root-meaning="جنگ و رویارویی خصمانه؛ سلب دارایی؛ و در شاخهٔ محراب، جایگاه ممتاز و بلند." data-context="محراب؛ جایگاه عبادت زکریا." data-learn-more="/quran-terminology/fa/roots/h-r-b/">المِحرابِ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُبَشِّرُكَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="به تو بشارت می‌دهد؛ خبر تولد یحیی.">يُبَشِّرُكَ</button>
    <button class="word-link" type="button" data-word="بِيَحيىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِيَحيىٰ</button>
    <button class="word-link" type="button" data-word="مُصَدِّقًا" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="تصدیق‌کننده؛ وصف یحیی در نسبت با کلمه‌ای از آن معبود یگانه.">مُصَدِّقًا</button>
    <button class="word-link" type="button" data-word="بِكَلِمَةٍ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="به کلمه‌ای؛ آنچه یحیی تصدیق می‌کند.">بِكَلِمَةٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَسَيِّدًا" data-root="س و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-d/" data-root-meaning="سیاهی؛ در شاخه‌ای دیگر، سیادت و سروری." data-context="و سرور؛ وصف جایگاه یحیی.">وَسَيِّدًا</button>
    <button class="word-link" type="button" data-word="وَحَصورًا" data-root="ح ص ر" data-root-meaning="بازداشتن یا محدود شدن امکان حرکت، دسترسی، انجام کار یا بروز رفتار؛ با مانع بیرونی، شرایط شخص یا خویشتن‌داری." data-context="و خویشتن‌دار؛ وصف یحیی." data-learn-more="/quran-terminology/fa/roots/h-sad-r/">وَحَصورًا</button>
    <button class="word-link" type="button" data-word="وَنَبِيًّا" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="و پیامبر؛ وصف یحیی.">وَنَبِيًّا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایستگان؛ گروهی که یحیی از آنان معرفی می‌شود.">الصّٰلِحينَ</button>
  </p>
  <p class="farsi-verse">پس فرشتگان او را ندا دادند، در حالی که در محراب ایستاده صلات می‌گزارد: آن معبود یگانه تو را به یحیی بشارت می‌دهد، تصدیق‌کنندهٔ کلمه‌ای از آن معبود یگانه و بزرگوار و خویشتن‌دار و پیامبری از شایستگان.</p>
</section>
