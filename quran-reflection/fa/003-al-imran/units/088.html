  <p class="arabic-text">

    <button class="word-link" type="button" data-word="يُخَفَّفُ" data-root="خ ف ف" data-learn-more="/quran-terminology/fa/roots/kh-f-f/" data-root-meaning="از سبکی و کاهش بار تا از دست رفتن ثبات">يُخَفَّفُ</button>

    <button class="word-link" type="button" data-word="العَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابُ</button>

  <p class="farsi-verse">در آن ماندگارند؛ عذاب از آنان کاسته نمی‌شود و به آنان مهلت داده نمی‌شود؛</p>
