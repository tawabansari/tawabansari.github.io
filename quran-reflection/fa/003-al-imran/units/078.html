  <p class="farsi-verse">و از آنان گروهی هستند که زبان‌هایشان را به کتاب می‌پیچانند تا آن را از کتاب بپندارید، در حالی که از کتاب نیست؛ و می‌گویند: «این از نزد آن معبود یگانه است»، در حالی که از نزد آن معبود یگانه نیست؛ و بر آن معبود یگانه دروغ می‌بندند، در حالی که می‌دانند.</p>
