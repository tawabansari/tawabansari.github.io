  <p class="farsi-verse">پروردگارا، ما نداکننده‌ای شنیدیم که به ایمان فرامی‌خواند: به پروردگارتان ایمان بیاورید؛ پس ایمان آوردیم. پروردگارا، گناهان ما را بیامرز و بدی‌های ما را بپوشان و ما را با نیکان برگیر.</p>
