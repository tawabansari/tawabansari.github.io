<section class="ayah-block" id="ayah-127" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَقطَعَ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="تا بخشی از مخالفان را از میان بردارد.">لِيَقطَعَ</button>
    <button class="word-link" type="button" data-word="طَرَفًا" data-root="ط ر ف" data-learn-more="/quran-terminology/fa/roots/tt-r-f/" data-root-meaning="کناره، سویه، بخش، نگاه، و حرکت نگاه در کاربرد قرآنی" data-context="بخشی یا گروهی از کسانی که کفر ورزیدند.">طَرَفًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کسانی که کفر ورزیدند؛ مخالفان در این سیاق.">كَفَروا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يَكبِتَهُم" data-root="ك ب ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-b-t/" data-root-meaning="خوار و ناکام ساختن و بازداشتن." data-context="آنان را خوار و سرکوب کند و از هدفشان بازدارد.">يَكبِتَهُم</button>
    <button class="word-link" type="button" data-word="فَيَنقَلِبوا" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="پس بازگردند؛ با حالِ ناکامی که واژهٔ بعد بیان می‌کند.">فَيَنقَلِبوا</button>
    <button class="word-link" type="button" data-word="خائِبينَ" data-root="خ ي ب" data-root-meaning="ناکام ماندن و محروم شدن از نتیجه یا بهرهٔ مورد انتظار؛ نرسیدن به مطلوبی که شخص در پی آن بوده یا به آن امید داشته است." data-context="ناکام؛ در حالی بازمی‌گردند که به هدف خود نرسیده‌اند." data-learn-more="/quran-terminology/fa/roots/kh-y-b/">خائِبينَ</button>
  </p>
  <p class="farsi-verse">تا بخشی از کسانی را که کفر ورزیدند برکند یا آنان را خوار کند، پس نومید بازگردند.</p>
</section>
