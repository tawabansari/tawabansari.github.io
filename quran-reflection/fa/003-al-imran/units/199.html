  <p class="farsi-verse">و از اهل کتاب کسانی هستند که به آن معبود یگانه و آنچه به سوی شما نازل شده و آنچه به سوی خودشان نازل شده ایمان دارند، در برابر آن معبود یگانه فروتن‌اند و آیات آن معبود یگانه را به بهایی اندک نمی‌فروشند. آنان پاداششان را نزد پروردگارشان دارند؛ آن معبود یگانه زودحساب است.</p>
