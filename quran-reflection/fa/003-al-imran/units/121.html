  <h2 class="ayah-title">آل عمران ۳:۱۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="غَدَوتَ" data-root="غ د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَدَوتَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَهلِكَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/">أَهلِكَ</button>
    <button class="word-link" type="button" data-word="تُبَوِّئُ" data-root="ب و أ" data-learn-more="/quran-terminology/fa/roots/b-w-a/">تُبَوِّئُ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="مَقٰعِدَ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/">مَقٰعِدَ</button>

    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>

  </p>
  <p class="farsi-verse">و آنگاه که بامداد از نزد خانواده‌ات بیرون رفتی و مؤمنان را در جایگاه‌هایی برای نبرد می‌گماشتی؛ و آن معبود یگانه شنوای داناست.</p>
