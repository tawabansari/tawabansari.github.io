<section class="ayah-block" id="ayah-141" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِيُمَحِّصَ" data-root="م ح ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-h-sad/" data-root-meaning="پاک کردن از آمیختگی و آزمودن برای آشکار شدن کیفیت.">وَلِيُمَحِّصَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَيَمحَقَ" data-root="م ح ق" data-learn-more="/quran-terminology/fa/roots/m-h-q/" data-root-meaning="محو کردن، کاستن تدریجی، از میان بردن، فرسودن، بی‌برکت ساختن، و نابود شدن چیزی تا رسیدن به کاهش یا محو کامل">وَيَمحَقَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرينَ</button>
  </p>
  <p class="farsi-verse">و تا آن معبود یگانه کسانی را که ایمان آورده‌اند پالایش کند و کافران را از میان ببرد.</p>
</section>
