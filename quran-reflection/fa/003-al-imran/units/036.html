  </p>
  <p class="farsi-verse">پس چون او را زایید، گفت: پروردگار من، او را دختر زاییدم؛ و آن معبود یگانه به آنچه زاییده بود داناتر بود؛ و پسر همچون دختر نیست. و او را مریم نامیدم و او و نسلش را از شیطان رانده‌شده در پناه تو می‌گذارم.</p>
