<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="وَضَعَتها" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="او را به دنیا آورد؛ یا در نقل اول‌شخص، او را به دنیا آوردم.">وَضَعَتها</button>
    <button class="word-link" type="button" data-word="قالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ مادر مریم سخن می‌گوید.">قالَت</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ در دعای مادر مریم.">رَبِّ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="وَضَعتُها" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="او را به دنیا آورد؛ یا در نقل اول‌شخص، او را به دنیا آوردم.">وَضَعتُها</button>
    <button class="word-link" type="button" data-word="أُنثىٰ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="دختر؛ مریم که مادرش او را به دنیا آورده است.">أُنثىٰ</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="داناتر؛ درباره دانایی آن معبود یگانه به زاده‌شدن مریم.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="وَضَعَت" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="به دنیا آورد؛ درباره مادر مریم.">وَضَعَت</button>
    <button class="word-link" type="button" data-word="وَلَيسَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَيسَ</button>
    <button class="word-link" type="button" data-word="الذَّكَرُ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="پسر؛ در مقایسه با دختر، در زمینه نذر و تولد مریم.">الذَّكَرُ</button>
    <button class="word-link" type="button" data-word="كَالأُنثىٰ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="دختر؛ در مقایسه با پسر در داستان تولد مریم و نذر مادر، بدون بیان برتری مطلق همه مردان بر همه زنان.">كَالأُنثىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="سَمَّيتُها" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">سَمَّيتُها</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="أُعيذُها" data-root="ع و ذ" data-learn-more="/quran-terminology/fa/roots/ayn-w-dh/" data-root-meaning="پناه بردن، پناه جستن، به مأمن روی آوردن و در حفاظت آن قرار گرفتن." data-context="او را به پناه تو می‌سپارم؛ دعای مادر مریم.">أُعيذُها</button>
    <button class="word-link" type="button" data-word="بِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكَ</button>
    <button class="word-link" type="button" data-word="وَذُرِّيَّتَها" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="و نسل او؛ در دعای مادر مریم.">وَذُرِّيَّتَها</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ در دعای پناه‌جویی.">الشَّيطٰنِ</button>
    <button class="word-link" type="button" data-word="الرَّجيمِ" data-root="ر ج م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-m/" data-root-meaning="سنگ افکندن؛ رجم: نیز طرد کردن یا ادعای حدسی، بنا بر سیاق." data-context="رانده‌شده؛ وصف شیطان.">الرَّجيمِ</button>
  </p>
  <p class="farsi-verse">پس چون او را زایید، گفت: پروردگار من، او را دختر زاییدم؛ و آن معبود یگانه به آنچه زاییده بود داناتر بود؛ و پسر همچون دختر نیست. و او را مریم نامیدم و او و نسلش را از شیطان رانده‌شده در پناه تو می‌گذارم.</p>
</section>
