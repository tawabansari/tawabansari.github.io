  <p class="farsi-verse">روزی که هر کس آنچه از نیکی کرده حاضر می‌یابد، و دربارهٔ آنچه از بدی کرده آرزو می‌کند کاش میان او و آن فاصله‌ای دور بود. و آن معبود یگانه شما را از خود برحذر می‌دارد؛ و آن معبود یگانه با بندگان مهربان است.</p>
