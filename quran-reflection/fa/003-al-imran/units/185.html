  <p class="farsi-verse">هر نفسی چشنده مرگ است؛ و پاداش‌های شما تنها در روز قیامت به‌تمامی داده می‌شود. پس هرکس از آتش دور داشته شود و به بهشت درآید، کامیاب شده است؛ و زندگی دنیا جز بهره‌ای فریبنده نیست.</p>
