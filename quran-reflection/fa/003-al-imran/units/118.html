<section class="ayah-block" id="ayah-118" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اید؛ خطاب آیه به مؤمنان است.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَتَّخِذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="در «لا تتخذوا»: برنگزینید و در جایگاه محرم امور خود قرار ندهید.">تَتَّخِذوا</button>
    <button class="word-link" type="button" data-word="بِطانَةً" data-root="ب ط ن" data-root-meaning="درون و سوی داخلی چیزی در برابر بیرون و رویهٔ آن؛ و در کاربردهای گسترده‌تر، جنبهٔ نهفته، کمتر آشکار یا در دسترس نزدیکان و آگاهان از یک امر." data-context="محرم اسرار و امور درونی؛ کسی که به حلقه اعتماد راه می‌یابد." data-learn-more="/quran-terminology/fa/roots/b-tt-n/">بِطانَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِكُم" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="از بیرون جمع شما؛ درباره کسانی که ادامه آیه رفتار زیان‌رسانشان را وصف می‌کند.">دونِكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَألونَكُم" data-root="أ ل و" data-learn-more="/quran-terminology/fa/roots/a-l-w/" data-root-meaning="کوشش و کوتاهی: انجام دادن یا فروگذاشتن کاری در نسبت با توان و میزان تلاش." data-context="در «لا يألونكم خبالا»: در آسیب رساندن و تباه کردن کار شما هیچ کوتاهی نمی‌کنند.">يَألونَكُم</button>
    <button class="word-link" type="button" data-word="خَبالًا" data-root="خ ب ل" data-root-meaning="آسیب، فساد و اختلال در سلامت، توانایی یا کارکرد چیزی." data-context="تباهی و آشفتگی زیان‌رسان؛ موضوعی که در رساندن آن کوتاهی نمی‌کنند." data-learn-more="/quran-terminology/fa/roots/kh-b-l/">خَبالًا</button>
    <button class="word-link" type="button" data-word="وَدّوا" data-root="و د د" data-learn-more="/quran-terminology/fa/roots/w-d-d/" data-root-meaning="وَدَّ؛ محبت، خواستن و میل به تحقق چیزی" data-context="می‌خواهند و آرزو دارند؛ رنج و دشواری مخاطبان را خواهان‌اند.">وَدّوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَنِتُّم" data-root="ع ن ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-t/" data-root-meaning="رنج، سختی و به زحمت انداختن." data-context="رنج و دشواری شما؛ آنچه گروه مورد بحث خواهان آن است.">عَنِتُّم</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="بَدَتِ" data-root="ب د و" data-learn-more="/quran-terminology/fa/roots/b-d-w/" data-root-meaning="آشکار شدن، پدیدار گشتن از پس پوشیدگی، و ورود چیزی به میدان دید یا آگاهی" data-context="آشکار شده است؛ پدیدار شدن دشمنی در گفتار آنان.">بَدَتِ</button>
    <button class="word-link" type="button" data-word="البَغضاءُ" data-root="ب غ ض" data-root-meaning="«ب غ ض» به بیزاری و نفرت از شخص یا چیزی در برابر کشش و محبت اشاره دارد. «بغضاء» صورت بیانگر شدت این بیزاری است که می‌تواند در دل وجود داشته باشد، در سخن و کردار آشکار شود و بر روابط میان اشخاص یا گروه‌ها اثر بگذارد." data-context="دشمنی و کینه؛ حالتی که از گفتارشان آشکار شده است." data-learn-more="/quran-terminology/fa/roots/b-gh-dad/">البَغضاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَفوٰهِهِم" data-root="ف و ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-h2/" data-root-meaning="دهان و دهان‌ها." data-context="دهان‌هایشان؛ گفتار زبانی که دشمنی از آن آشکار شده است.">أَفوٰهِهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تُخفى" data-root="خ ف ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-f-y/" data-root-meaning="پنهان بودن و پنهان کردن؛ برخی صورت‌ها و قرائت‌ها معنای آشکار کردن دارند." data-context="پنهان می‌کند؛ آنچه سینه‌هایشان از دشمنی در خود نهان دارد.">تُخفى</button>
    <button class="word-link" type="button" data-word="صُدورُهُم" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/" data-context="سینه‌هایشان؛ جایگاه آنچه از موضع درونی خود پنهان می‌کنند.">صُدورُهُم</button>
    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="بزرگ‌تر است؛ دشمنی پنهان آنان از آنچه آشکار شده بیشتر است.">أَكبَرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="بَيَّنّا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="روشن ساختیم؛ بیان روشن نشانه‌ها برای مخاطبان.">بَيَّنّا</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌ها؛ آنچه برای شناخت و داوری مخاطبان روشن شده است.">الـٔايٰتِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="اگر هستید؛ در ساخت شرطیِ «إن كنتم تعقلون».">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="اندیشه و تعقل می‌کنید؛ به کار گرفتن فهم در شناخت نشانه‌های بیان‌شده.">تَعقِلونَ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، از غیر خود محرم راز نگیرید؛ آنان در تباه کردن شما کوتاهی نمی‌کنند و رنج شما را دوست دارند. دشمنی از دهان‌هایشان آشکار شده، و آنچه سینه‌هایشان پنهان می‌کند بزرگ‌تر است. آیات را برای شما روشن کرده‌ایم، اگر بیندیشید.</p>
</section>
