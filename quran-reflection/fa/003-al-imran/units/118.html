    <button class="word-link" type="button" data-word="صُدورُهُم" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/">صُدورُهُم</button>

  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، از غیر خود محرم راز نگیرید؛ آنان در تباه کردن شما کوتاهی نمی‌کنند و رنج شما را دوست دارند. دشمنی از دهان‌هایشان آشکار شده، و آنچه سینه‌هایشان پنهان می‌کند بزرگ‌تر است. آیات را برای شما روشن کرده‌ایم، اگر بیندیشید.</p>
