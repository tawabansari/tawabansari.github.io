<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزِ بازخواست که دگرگونی چهره‌ها در آن رخ می‌دهد.">يَومَ</button>
    <button class="word-link" type="button" data-word="تَبيَضُّ" data-root="ب ي ض" data-root-meaning="«ب ي ض» در اصل به سپیدی به‌عنوان یک ویژگی رنگی اشاره دارد. از این معنا، وصف سفید بودن و فعل سفید شدن پدید آمده است. «بَيْضَة» نیز نام تخم پرنده است که در عربی کهن به این خانواده تعلق داشته و سپس در تشبیه‌ها و نام‌گذاری بعضی اشیای همانند به کار رفته است." data-context="سفید می‌شوند؛ دگرگونی چهره‌ها در روز بازخواست." data-learn-more="/quran-terminology/fa/roots/b-y-dad/">تَبيَضُّ</button>
    <button class="word-link" type="button" data-word="وُجوهٌ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌هایی؛ گروهی که سفید می‌شوند.">وُجوهٌ</button>
    <button class="word-link" type="button" data-word="وَتَسوَدُّ" data-root="س و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-d/" data-root-meaning="سیاهی؛ در شاخه‌ای دیگر، سیادت و سروری." data-context="و سیاه می‌شوند؛ در تقابل با سفید شدن چهره‌ها.">وَتَسوَدُّ</button>
    <button class="word-link" type="button" data-word="وُجوهٌ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌هایی؛ گروهی که سیاه می‌شوند.">وُجوهٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اسوَدَّت" data-root="س و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-d/" data-root-meaning="سیاهی؛ در شاخه‌ای دیگر، سیادت و سروری." data-context="سیاه شده است؛ وصف دگرگونی چهره‌های آنان.">اسوَدَّت</button>
    <button class="word-link" type="button" data-word="وُجوهُهُم" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌های آنان.">وُجوهُهُم</button>
    <button class="word-link" type="button" data-word="أَكَفَرتُم" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="آیا کفر ورزیدید و انکار کردید؟">أَكَفَرتُم</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ ترتیب ایمان و کفر در پرسش.">بَعدَ</button>
    <button class="word-link" type="button" data-word="إيمٰنِكُم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان و باورمندیِ شما.">إيمٰنِكُم</button>
    <button class="word-link" type="button" data-word="فَذوقُوا" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="پس بچشید و پیامد را تجربه کنید.">فَذوقُوا</button>
    <button class="word-link" type="button" data-word="العَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب و کیفر.">العَذابَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ در اشاره به رفتار آنان.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر و انکار می‌ورزیدید.">تَكفُرونَ</button>
  </p>
  <p class="farsi-verse">روزی که چهره‌هایی سفید و چهره‌هایی سیاه می‌شوند. اما آنان که چهره‌هایشان سیاه شده است: «آیا پس از ایمانتان کفر ورزیدید؟ پس به سبب کفری که می‌ورزیدید عذاب را بچشید.»</p>
</section>
