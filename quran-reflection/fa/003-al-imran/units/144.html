  <p class="farsi-verse">و محمد جز فرستاده‌ای نیست؛ پیش از او نیز فرستادگان گذشته‌اند. آیا اگر بمیرد یا کشته شود، بر پاشنه‌های خود بازمی‌گردید؟ و هرکس بر دو پاشنه خود بازگردد، هیچ زیانی به آن معبود یگانه نمی‌رساند؛ و آن معبود یگانه سپاسگزاران را پاداش خواهد داد.</p>
