<section class="ayah-block" id="ayah-104" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۰۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلتَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و باید باشد؛ فرمان به وجود گروهی با مسئولیت اجتماعی.">وَلتَكُن</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="گروهی؛ جماعت دعوت‌کننده به خیر.">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="دعوت می‌کنند؛ فراخواندن به خیر.">يَدعونَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الخَيرِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="خیر؛ مقصد دعوت این گروه.">الخَيرِ</button>
    <button class="word-link" type="button" data-word="وَيَأمُرونَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="و فرمان می‌دهند؛ دعوت به انجام معروف.">وَيَأمُرونَ</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="به معروف؛ موضوع امر این گروه.">بِالمَعروفِ</button>
    <button class="word-link" type="button" data-word="وَيَنهَونَ" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="و بازمی‌دارند؛ نهی از منکر در کنار دعوت به خیر و امر به معروف." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">وَيَنهَونَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُنكَرِ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص" data-context="منکر؛ رفتار ناپسندی که از آن بازمی‌دارند.">المُنكَرِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="المُفلِحونَ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری" data-context="رستگاران؛ وصف گروه یادشده.">المُفلِحونَ</button>
  </p>
  <p class="farsi-verse">و باید از میان شما جماعتی باشند که به خیر فراخوانند و به کار پسندیده فرمان دهند و از کار ناپسند بازدارند؛ و آنان همان رستگاران‌اند.</p>
</section>
