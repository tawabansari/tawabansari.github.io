  <p class="farsi-verse">و آنگاه که آن معبود یگانه از کسانی که کتاب به آنان داده شده پیمان گرفت: «باید آن را برای مردم روشن کنید و پنهانش نکنید»؛ اما آن را پشت سر خود افکندند و به بهایی اندک فروختند؛ چه بد چیزی به دست می‌آورند.</p>
