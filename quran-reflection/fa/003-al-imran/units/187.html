<section class="ayah-block" id="ayah-187" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۸۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="أَخَذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَخَذَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ميثٰقَ" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست">ميثٰقَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أوتُوا</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="لَتُبَيِّنُنَّهُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">لَتُبَيِّنُنَّهُ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكتُمونَهُ" data-root="ك ت م" data-learn-more="/quran-terminology/fa/roots/k-t-m/" data-root-meaning="پنهان کردن، در خود نگه داشتن، و جلوگیری از آشکار شدن چیزی که نزد انسان حاضر است">تَكتُمونَهُ</button>
    <button class="word-link" type="button" data-word="فَنَبَذوهُ" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین">فَنَبَذوهُ</button>
    <button class="word-link" type="button" data-word="وَراءَ" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش">وَراءَ</button>
    <button class="word-link" type="button" data-word="ظُهورِهِم" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی">ظُهورِهِم</button>
    <button class="word-link" type="button" data-word="وَاشتَرَوا" data-root="ش ر ي" data-learn-more="/quran-terminology/fa/roots/sh-r-y/" data-root-meaning="خریدن، فروختن، مبادله کردن، و واگذار کردن چیزی در برابر گرفتن چیزی دیگر">وَاشتَرَوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="ثَمَنًا" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود">ثَمَنًا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">فَبِئسَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشتَرونَ" data-root="ش ر ي" data-learn-more="/quran-terminology/fa/roots/sh-r-y/" data-root-meaning="خریدن، فروختن، مبادله کردن، و واگذار کردن چیزی در برابر گرفتن چیزی دیگر">يَشتَرونَ</button>
  </p>
  <p class="farsi-verse">و آنگاه که آن معبود یگانه از کسانی که کتاب به آنان داده شده پیمان گرفت: «باید آن را برای مردم روشن کنید و پنهانش نکنید»؛ اما آن را پشت سر خود افکندند و به بهایی اندک فروختند؛ چه بد چیزی به دست می‌آورند.</p>
</section>
