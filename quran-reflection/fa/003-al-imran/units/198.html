  <p class="farsi-verse">اما کسانی که از پروردگارشان پروا کردند، برایشان باغ‌هایی است که از زیر آنها نهرها جاری است؛ در آنها ماندگارند، پذیرایی‌ای از نزد آن معبود یگانه؛ و آنچه نزد آن معبود یگانه است برای نیکان بهتر است.</p>
