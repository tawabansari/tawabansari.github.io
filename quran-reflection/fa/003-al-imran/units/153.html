  <p class="farsi-verse">آنگاه که دور می‌شدید و به هیچ‌کس روی نمی‌گرداندید و فرستاده از پشت سرتان شما را فرامی‌خواند؛ پس اندوهی در برابر اندوه به شما داد، تا بر آنچه از دستتان رفت و آنچه به شما رسید اندوهگین نشوید؛ و آن معبود یگانه از آنچه می‌کنید آگاه است.</p>
