<section class="ayah-block" id="ayah-153" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="تُصعِدونَ" data-root="ص ع د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-ayn-d/" data-root-meaning="بالا رفتن و پیش رفتن؛ صعید: سطح زمین یا خاک." data-context="دور می‌شدید؛ حرکتِ شتابان در صحنهٔ نبرد.">تُصعِدونَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَلوۥنَ" data-root="ل و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-y/" data-root-meaning="پیچاندن و کج کردن؛ در سخن، تحریف یا طفره رفتن." data-context="توجه می‌کنید؛ با نفیِ جمله: به کسی توجه نداشتید.">تَلوۥنَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَحَدٍ" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="هیچ‌کس؛ در جملهٔ نفیِ توجه به دیگران.">أَحَدٍ</button>
    <button class="word-link" type="button" data-word="وَالرَّسولُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و رسول؛ پیام‌آورِ فراخوانندهٔ شما.">وَالرَّسولُ</button>
    <button class="word-link" type="button" data-word="يَدعوكُم" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="شما را فرا می‌خواند؛ خطاب رسول به مخاطبان.">يَدعوكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أُخرىٰكُم" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="پشت سر شما؛ جایگاه رسول هنگام فراخواندن.">أُخرىٰكُم</button>
    <button class="word-link" type="button" data-word="فَأَثٰبَكُم" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه" data-context="پس شما را جزا داد؛ در اینجا با اندوه.">فَأَثٰبَكُم</button>
    <button class="word-link" type="button" data-word="غَمًّا" data-root="غ م م" data-learn-more="/quran-terminology/fa/roots/gh-m-m/" data-root-meaning="پوشاندن و فراگرفتن؛ ابر پوشاننده، امر مبهم، و اندوه یا فشاری که انسان را دربرمی‌گیرد." data-context="اندوهی؛ آنچه در پی رفتار مخاطبان رسید.">غَمًّا</button>
    <button class="word-link" type="button" data-word="بِغَمٍّ" data-root="غ م م" data-learn-more="/quran-terminology/fa/roots/gh-m-m/" data-root-meaning="پوشاندن و فراگرفتن؛ ابر پوشاننده، امر مبهم، و اندوه یا فشاری که انسان را دربرمی‌گیرد." data-context="با اندوه؛ در ترکیبِ اندوه در پی اندوه.">بِغَمٍّ</button>
    <button class="word-link" type="button" data-word="لِكَيلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِكَيلا</button>
    <button class="word-link" type="button" data-word="تَحزَنوا" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون" data-context="اندوهگین شوید؛ با نفیِ همراه جمله.">تَحزَنوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فاتَكُم" data-root="ف و ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-t/" data-root-meaning="از دسترس بیرون رفتن؛ تفاوت: ناهمسانی یا ناهماهنگی." data-context="از دست شما رفت؛ آنچه به آن دست نیافتید.">فاتَكُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَصٰبَكُم" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود" data-context="به شما رسید؛ رخدادِ ناگوار یادشده.">أَصٰبَكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="آگاه؛ وصفِ آگاهی آن معبود یگانه در سیاق آیه." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دهید؛ کردار مخاطبان.">تَعمَلونَ</button>
  </p>
  <p class="farsi-verse">آنگاه که دور می‌شدید و به هیچ‌کس روی نمی‌گرداندید و فرستاده از پشت سرتان شما را فرامی‌خواند؛ پس اندوهی در برابر اندوه به شما داد، تا بر آنچه از دستتان رفت و آنچه به شما رسید اندوهگین نشوید؛ و آن معبود یگانه از آنچه می‌کنید آگاه است.</p>
</section>
