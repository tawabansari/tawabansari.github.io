  <p class="farsi-verse">گفت: پروردگار من، نشانه‌ای برایم قرار بده. گفت: نشانهٔ تو این است که سه روز جز با اشاره با مردم سخن نگویی؛ و پروردگارت را بسیار یاد کن و شامگاه و بامداد تسبیح گوی.</p>
