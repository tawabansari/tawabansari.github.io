<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ خطاب به کفرورزندگان.">قُل</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ مخاطبانِ هشدار.">كَفَروا</button>
    <button class="word-link" type="button" data-word="سَتُغلَبونَ" data-root="غ ل ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-b/" data-root-meaning="چیره شدن و غلبه یافتن." data-context="شکست خواهید خورد؛ هشدارِ پیش از گردآوری.">سَتُغلَبونَ</button>
    <button class="word-link" type="button" data-word="وَتُحشَرونَ" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="به سوی جهنم گرد آورده می‌شوید؛ در هشدار به مخاطبان." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">وَتُحشَرونَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="و چه بد است؛ نکوهشِ جایگاهِ یادشده.">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المِهادُ" data-root="م ه د" data-root-meaning="آماده و مناسب ساختن جایگاه یا شرایط برای قرار گرفتن، زندگی کردن یا انجام کاری؛ مهد و مهاد: گهواره، بستر یا جایگاه آماده." data-context="بستر و جایگاه؛ دربارهٔ جهنم." data-learn-more="/quran-terminology/fa/roots/m-h2-d/">المِهادُ</button>
  </p>
  <p class="farsi-verse">به کسانی که کفر ورزیدند بگو: شکست خواهید خورد و به سوی جهنم گرد آورده خواهید شد؛ و چه بد بستری است.</p>
</section>
