    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَشتَرونَ" data-root="ش ر ي" data-learn-more="/quran-terminology/fa/roots/sh-r-y/" data-root-meaning="خریدن، فروختن، مبادله کردن، و واگذار کردن چیزی در برابر گرفتن چیزی دیگر">يَشتَرونَ</button>
    <button class="word-link" type="button" data-word="بِعَهدِ" data-root="ع ه د" data-learn-more="/quran-terminology/fa/roots/ayn-h2-d/" data-root-meaning="شناخت همراه با تعهد، پیمان، نگهداری و پاسخگویی">بِعَهدِ</button>

    <button class="word-link" type="button" data-word="وَأَيمٰنِهِم" data-root="ي م ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَيمٰنِهِم</button>
    <button class="word-link" type="button" data-word="ثَمَنًا" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود">ثَمَنًا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="خَلٰقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلٰقَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُكَلِّمُهُمُ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد">يُكَلِّمُهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَنظُرُ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">يَنظُرُ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُزَكّيهِم" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">يُزَكّيهِم</button>

    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد">أَليمٌ</button>
  </p>
  <p class="farsi-verse">کسانی که پیمان آن معبود یگانه و سوگندهای خود را به بهایی اندک می‌فروشند، در آخرت بهره‌ای ندارند؛ و آن معبود یگانه در روز قیامت با آنان سخن نمی‌گوید و به آنان نمی‌نگرد و پاکشان نمی‌سازد، و برایشان عذابی دردناک است.</p>
</section>
