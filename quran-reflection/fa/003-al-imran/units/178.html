    <button class="word-link" type="button" data-word="أَنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّما</button>

  </p>
  <p class="farsi-verse">و کسانی که کفر ورزیدند نپندارند مهلتی که به آنان می‌دهیم برایشان بهتر است؛ تنها به آنان مهلت می‌دهیم تا بر گناه بیفزایند، و برای آنان عذابی خوارکننده است.</p>
