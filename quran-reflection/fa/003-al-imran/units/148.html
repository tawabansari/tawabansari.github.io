<section class="ayah-block" id="ayah-148" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَـٔاتىٰهُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">فَـٔاتىٰهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ثَوابَ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">ثَوابَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَحُسنَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">وَحُسنَ</button>
    <button class="word-link" type="button" data-word="ثَوابِ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">ثَوابِ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَةِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">المُحسِنينَ</button>
  </p>
  <p class="farsi-verse">پس آن معبود یگانه پاداش دنیا و نیکویی پاداش آخرت را به آنان داد؛ و آن معبود یگانه نیکوکاران را دوست دارد.</p>
</section>
