<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَلىٰ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="تَصبِروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">تَصبِروا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="وَيَأتوكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَيَأتوكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَورِهِم" data-root="ف و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-r/" data-root-meaning="جوشش و فوران؛ فور: بی‌درنگی و هنگام آغازین.">فَورِهِم</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="يُمدِدكُم" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر">يُمدِدكُم</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="بِخَمسَةِ" data-root="خ م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-m-s/" data-root-meaning="عدد پنج و مشتقات عددی آن، مانند پنجاه و یک‌پنجم.">بِخَمسَةِ</button>
    <button class="word-link" type="button" data-word="ءالٰفٍ" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أَلَّفَ؛ پیوند دادن، خو گرفتن و برقرار شدن انس و همراهی">ءالٰفٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="مُسَوِّمينَ" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز">مُسَوِّمينَ</button>
  </p>
  <p class="farsi-verse">آری، اگر شکیبایی و پروا داشته باشید و آنان همین دم بر شما بتازند، پروردگارتان شما را با پنج هزار فرشته نشان‌دار مدد می‌رساند.</p>
</section>
