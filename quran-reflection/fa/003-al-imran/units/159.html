  <p class="farsi-verse">پس به رحمتی از آن معبود یگانه با آنان نرم شدی؛ و اگر تندخو و سخت‌دل بودی، از پیرامونت پراکنده می‌شدند. پس از آنان درگذر و برایشان آمرزش بخواه و در کار با آنان مشورت کن؛ و چون تصمیم گرفتی، بر آن معبود یگانه توکل کن؛ آن معبود یگانه توکل‌کنندگان را دوست دارد.</p>
