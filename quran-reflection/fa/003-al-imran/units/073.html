  <p class="farsi-verse">و جز به کسی که از دین شما پیروی کرده باور نکنید — بگو: «هدایت، هدایت آن معبود یگانه است» — که به کسی مانند آنچه به شما داده شده داده شود، یا نزد پروردگارتان با شما حجت آورند. بگو: «فضل به دست آن معبود یگانه است؛ آن را به هرکه بخواهد می‌دهد، و آن معبود یگانه گشایشگر داناست.»</p>
