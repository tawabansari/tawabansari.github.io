<section class="ayah-block" id="ayah-110" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="خَيرَ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرَ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="أُخرِجَت" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">أُخرِجَت</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="تَأمُرونَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">تَأمُرونَ</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">بِالمَعروفِ</button>
    <button class="word-link" type="button" data-word="وَتَنهَونَ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده.">وَتَنهَونَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُنكَرِ" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص">المُنكَرِ</button>
    <button class="word-link" type="button" data-word="وَتُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">وَتُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="ءامَنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنَ</button>
    <button class="word-link" type="button" data-word="أَهلُ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلُ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="لَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">لَكانَ</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرًا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="مِنهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُمُ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="وَأَكثَرُهُمُ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">وَأَكثَرُهُمُ</button>
    <button class="word-link" type="button" data-word="الفٰسِقونَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن">الفٰسِقونَ</button>
  </p>
  <p class="farsi-verse">شما بهترین جماعتی بوده‌اید که برای مردم پدید آورده شده‌اید؛ به کار پسندیده فرمان می‌دهید و از کار ناپسند بازمی‌دارید و به آن معبود یگانه ایمان دارید. و اگر اهل کتاب ایمان می‌آوردند، برایشان بهتر بود؛ از آنان مؤمنانی هستند، و بیشترشان نافرمان‌اند.</p>
</section>
