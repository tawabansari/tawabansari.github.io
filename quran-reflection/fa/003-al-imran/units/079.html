    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>

    <button class="word-link" type="button" data-word="رَبّٰنِيّـۧنَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبّٰنِيّـۧنَ</button>

  </p>
  <p class="farsi-verse">هیچ بشری را نسزد که آن معبود یگانه به او کتاب و داوری و پیامبری بدهد، سپس به مردم بگوید: «به جای آن معبود یگانه بندگان من باشید»؛ بلکه: «ربانی باشید، از آن رو که کتاب را آموزش می‌دادید و از آن رو که آن را می‌آموختید.»</p>
</section>
