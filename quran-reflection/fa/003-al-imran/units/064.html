  <p class="farsi-verse">بگو: «ای اهل کتاب، به سوی سخنی یکسان میان ما و شما بیایید: جز آن معبود یگانه را بندگی نکنیم، چیزی را شریک او نسازیم و برخی از ما برخی دیگر را به جای آن معبود یگانه ارباب نگیرد.» پس اگر روی گرداندند، بگویید: «گواه باشید که ما تسلیم هستیم.»</p>
