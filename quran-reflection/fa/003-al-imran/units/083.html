<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَغَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">أَفَغَيرَ</button>
    <button class="word-link" type="button" data-word="دينِ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد">دينِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَبغونَ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد">يَبغونَ</button>
    <button class="word-link" type="button" data-word="وَلَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُ</button>
    <button class="word-link" type="button" data-word="أَسلَمَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">أَسلَمَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="طَوعًا" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">طَوعًا</button>
    <button class="word-link" type="button" data-word="وَكَرهًا" data-root="ك ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-h2/" data-root-meaning="ناخوش داشتن و دشواری؛ اکراه: واداشتن برخلاف خواست.">وَكَرهًا</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="يُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">يُرجَعونَ</button>
  </p>
  <p class="farsi-verse">آیا دینی جز دین آن معبود یگانه می‌جویند، در حالی که هرکه در آسمان‌ها و زمین است، خواسته و ناخواسته، تسلیم او شده است و به سوی او بازگردانده می‌شوند؟</p>
</section>
