  <p class="farsi-verse">آیا چون مصیبتی به شما رسید که دو برابر آن را رسانده بودید، گفتید: «این از کجاست؟» بگو: «آن از خود شماست.» آن معبود یگانه بر هر چیزی تواناست.</p>
