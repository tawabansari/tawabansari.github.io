  <p class="farsi-verse">و آنان که چون کاری زشت کنند یا بر خود ستم ورزند، آن معبود یگانه را یاد می‌کنند و برای گناهانشان آمرزش می‌خواهند؛ و چه کسی جز آن معبود یگانه گناهان را می‌آمرزد؟ و بر آنچه کرده‌اند، با آگاهی پافشاری نمی‌کنند.</p>
