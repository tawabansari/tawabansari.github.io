  <p class="farsi-verse">بگو: «به آن معبود یگانه و آنچه بر ما نازل شده و آنچه بر ابراهیم و اسماعیل و اسحاق و یعقوب و اسباط نازل شده، و آنچه به موسی و عیسی و پیامبران از پروردگارشان داده شده ایمان آوردیم؛ میان هیچ‌یک از آنان جدایی نمی‌گذاریم و ما تسلیم او هستیم.»</p>
