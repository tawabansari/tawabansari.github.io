    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالوا</button>

  <p class="farsi-verse">کسانی که خود نشستند و درباره برادرانشان گفتند: «اگر از ما اطاعت می‌کردند، کشته نمی‌شدند.» بگو: «اگر راست می‌گویید، مرگ را از خود دور کنید.»</p>
