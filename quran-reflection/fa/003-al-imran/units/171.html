<section class="ayah-block" id="ayah-171" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَستَبشِرونَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">يَستَبشِرونَ</button>
    <button class="word-link" type="button" data-word="بِنِعمَةٍ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">بِنِعمَةٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَفَضلٍ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده.">وَفَضلٍ</button>
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُضيعُ" data-root="ض ي ع" data-learn-more="/quran-terminology/fa/roots/dad-y-ayn/" data-root-meaning="ضایع شدن، از دست رفتن و تباه کردن؛ از حق و مسئولیت رهاشده تا ضایع نشدن ایمان، عمل و اجر نزد آن معبود یگانه">يُضيعُ</button>
    <button class="word-link" type="button" data-word="أَجرَ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">به نعمت و فضلی از آن معبود یگانه شادمانی می‌کنند، و اینکه آن معبود یگانه پاداش مؤمنان را تباه نمی‌کند.</p>
</section>
