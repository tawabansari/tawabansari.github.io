<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند">يَقولونَ</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار ما">رَبَّنا</button>
    <button class="word-link" type="button" data-word="إِنَّنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّنا</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌ایم">ءامَنّا</button>
    <button class="word-link" type="button" data-word="فَاغفِر" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="پس برای ما بیامرز">فَاغفِر</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="ذُنوبَنا" data-root="ذ ن ب" data-learn-more="/quran-terminology/fa/roots/dh-n-b/" data-root-meaning="ذَنْب: گناه، خطا یا جرمِ قابل انتساب؛ ذَنَب: دُم و بخش پسین؛ ذَنُوب با فتح ذال: سهم و بهره، با کاربرد دلو آب." data-context="گناهان ما؛ موضوع درخواست آمرزش">ذُنوبَنا</button>
    <button class="word-link" type="button" data-word="وَقِنا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و ما را نگه دار">وَقِنا</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب و کیفر">عَذابَ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش">النّارِ</button>
  </p>
  <p class="farsi-verse">کسانی که می‌گویند: پروردگار ما، بی‌گمان ایمان آوردیم؛ پس گناهانمان را بیامرز و ما را از عذاب آتش نگاه دار.</p>
</section>
