  <p class="farsi-verse">آن معبود یگانه سخن کسانی را که گفتند: «آن معبود یگانه فقیر است و ما توانگریم» شنید. آنچه گفتند و کشتن پیامبران به‌ناحق به دست آنان را خواهیم نوشت، و می‌گوییم: «عذاب سوزان را بچشید.»</p>
