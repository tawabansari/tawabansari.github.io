<section class="ayah-block" id="ayah-113" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَيسوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَيسوا</button>
    <button class="word-link" type="button" data-word="سَواءً" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="یکسان و برابر؛ نفیِ یکسان بودن همه اهل کتاب در آغاز آیه.">سَواءً</button>
    ۗ
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَهلِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="اهل و وابستگان؛ در ترکیب «اهل کتاب»، جامعه‌ای که به کتاب آسمانی نسبت داده می‌شود.">أَهلِ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتاب آسمانی؛ در عنوان «اهل کتاب».">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="جماعتی؛ گروهی از اهل کتاب که اوصاف بعدی درباره آنان است.">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="قائِمَةٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="استوار و برپا؛ وصف جماعتی که آیه از تلاوت و سجده آنان یاد می‌کند.">قائِمَةٌ</button>
    <button class="word-link" type="button" data-word="يَتلونَ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر" data-context="تلاوت می‌کنند؛ آیات را پیوسته می‌خوانند.">يَتلونَ</button>
    <button class="word-link" type="button" data-word="ءايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات و نشانه‌ها؛ آنچه در اینجا تلاوت می‌شود.">ءايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ءاناءَ" data-root="أ ن ي" data-learn-more="/quran-terminology/fa/roots/a-n-y/" data-root-meaning="فرا رسیدن هنگام، بخش‌های زمان، درنگ و تأخیر، و رسیدن چیزی به مرحله آمادگی یا نهایت." data-context="بخش‌ها یا ساعت‌های شب؛ زمان تلاوت، بدون تعیین تعداد ساعت یا الزام به تمام شب.">ءاناءَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ زمانی که جماعت یادشده آیات را تلاوت می‌کند.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَسجُدونَ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="سجده می‌کنند؛ حالت خضوع و سجده جماعت در وصف پایانی آیه.">يَسجُدونَ</button>
  </p>
  <p class="farsi-verse">یکسان نیستند؛ از اهل کتاب جماعتی استوارند که آیات آن معبود یگانه را در ساعت‌های شب می‌خوانند و سجده می‌کنند.</p>
</section>
