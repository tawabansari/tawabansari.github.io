  <p class="farsi-verse">شما همان کسانید که درباره چیزی که از آن دانشی داشتید بحث کردید؛ پس چرا درباره چیزی که از آن دانشی ندارید بحث می‌کنید؟ آن معبود یگانه می‌داند و شما نمی‌دانید.</p>
