<section class="ayah-block" id="ayah-133" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسارِعوا" data-root="س ر ع" data-root-meaning="سرعت و تندیِ حرکت یا انجام کار در برابر کندی؛ و در مسارعت، شتاب در اقدام و پیش‌دستی به سوی مقصدی که ارزش آن از سیاق شناخته می‌شود." data-context="بشتابید؛ به سوی آمرزش پروردگار و بهشت." data-learn-more="/quran-terminology/fa/roots/s-r-ayn/">وَسارِعوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="مَغفِرَةٍ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="آمرزش؛ مقصد فرمانِ شتافتن.">مَغفِرَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان؛ آمرزش از سوی اوست.">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="وَجَنَّةٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="و بهشت؛ مقصدی در کنار آمرزش.">وَجَنَّةٍ</button>
    <button class="word-link" type="button" data-word="عَرضُهَا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="پهنای آن؛ دربارهٔ گسترهٔ بهشت.">عَرضُهَا</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ در بیان پهنای بهشت.">السَّمٰوٰتُ</button>
    <button class="word-link" type="button" data-word="وَالأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ در کنار آسمان‌ها.">وَالأَرضُ</button>
    <button class="word-link" type="button" data-word="أُعِدَّت" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="آماده شده است؛ دربارهٔ بهشت.">أُعِدَّت</button>
    <button class="word-link" type="button" data-word="لِلمُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="برای پرهیزگاران؛ کسانی که بهشت برای آنان آماده شده است.">لِلمُتَّقينَ</button>
  </p>
  <p class="farsi-verse">و به سوی آمرزشی از پروردگارتان و بهشتی که پهنای آن آسمان‌ها و زمین است و برای پرهیزگاران آماده شده، بشتابید؛</p>
</section>
