  <p class="farsi-verse">اگر زخمی به شما رسیده، به آن گروه نیز زخمی همانند آن رسیده است؛ و این روزها را میان مردم می‌گردانیم، و تا آن معبود یگانه کسانی را که ایمان آورده‌اند بداند و از میان شما گواهانی بگیرد؛ و آن معبود یگانه ستمکاران را دوست ندارد؛</p>
