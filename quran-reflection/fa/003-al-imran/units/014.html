<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="زُيِّنَ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="آراسته شده است">زُيِّنَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="برای مردم">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="حُبُّ" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دوست داشتن">حُبُّ</button>
    <button class="word-link" type="button" data-word="الشَّهَوٰتِ" data-root="ش ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-w/" data-root-meaning="میل و خواست شدید برای چیزی." data-context="خواستنی‌ها">الشَّهَوٰتِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنان">النِّساءِ</button>
    <button class="word-link" type="button" data-word="وَالبَنينَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار؛ نیز فرزند، فرزندان و نسل در کاربرد نسبی." data-context="و پسران">وَالبَنينَ</button>
    <button class="word-link" type="button" data-word="وَالقَنٰطيرِ" data-root="ق ن ط ر" data-root-meaning="قنطار؛ نام واحدی بزرگ از وزن که مقدار آن در نظام‌های تاریخی متفاوت بوده است؛ در کاربرد قرآنی، مقدار فراوان و قابل توجهی از مال یا دارایی." data-context="و انبوه‌های ثروت" data-learn-more="/quran-terminology/fa/roots/q-n-tt-r/">وَالقَنٰطيرِ</button>
    <button class="word-link" type="button" data-word="المُقَنطَرَةِ" data-root="ق ن ط ر" data-root-meaning="قنطار؛ نام واحدی بزرگ از وزن که مقدار آن در نظام‌های تاریخی متفاوت بوده است؛ در کاربرد قرآنی، مقدار فراوان و قابل توجهی از مال یا دارایی." data-context="انباشته" data-learn-more="/quran-terminology/fa/roots/q-n-tt-r/">المُقَنطَرَةِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الذَّهَبِ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-context="طلا" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان؛ در صورت اسمیِ «ذَهَب»: طلا؛ پیوند آن با معنای رفتن باید با احتیاط توضیح داده شود.">الذَّهَبِ</button>
    <button class="word-link" type="button" data-word="وَالفِضَّةِ" data-root="ف ض ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-dad-dad/" data-root-meaning="شکستن و پراکندن؛ فضّه: نقره." data-context="و نقره">وَالفِضَّةِ</button>
    <button class="word-link" type="button" data-word="وَالخَيلِ" data-root="خ ي ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-y-l/" data-root-meaning="تصویر ذهنی و خیال؛ اختیال: خودبزرگ‌بینی؛ خیل: اسبان." data-context="و اسب‌ها">وَالخَيلِ</button>
    <button class="word-link" type="button" data-word="المُسَوَّمَةِ" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز" data-context="نشان‌دار یا پرورش‌یافته">المُسَوَّمَةِ</button>
    <button class="word-link" type="button" data-word="وَالأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید؛ نیز دام‌ها و چهارپایان در «أَنْعَام»." data-context="و دام‌ها">وَالأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="وَالحَرثِ" data-root="ح ر ث" data-learn-more="/quran-terminology/fa/roots/h-r-th/" data-root-meaning="کار هدفمند، آماده‌سازی بستر، پرورش و انتظار حاصل" data-context="و کشتزار">وَالحَرثِ</button>
    ۗ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مَتٰعُ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="بهره">مَتٰعُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="دنیا؛ زندگی نزدیک">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عِندَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَهُ</button>
    <button class="word-link" type="button" data-word="حُسنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکویی">حُسنُ</button>
    <button class="word-link" type="button" data-word="المَـٔابِ" data-root="أ و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-w-b/" data-root-meaning="بازگشت و بازآمدن؛ أوّاب: بسیار بازگشت‌کننده و روی‌آورنده." data-context="بازگشت و فرجام">المَـٔابِ</button>
  </p>
  <p class="farsi-verse">دوست داشتن خواستنی‌ها، از زنان و پسران و انبوه‌های انباشتهٔ طلا و نقره و اسب‌های نشان‌دار و دام‌ها و کشتزار، برای مردم آراسته شده است. این بهرهٔ زندگی دنیاست؛ و نیکویی بازگشت نزد آن معبود یگانه است.</p>
</section>
