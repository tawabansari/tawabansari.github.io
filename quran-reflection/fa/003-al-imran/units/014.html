  <p class="farsi-verse">دوست داشتن خواستنی‌ها، از زنان و پسران و انبوه‌های انباشتهٔ طلا و نقره و اسب‌های نشان‌دار و دام‌ها و کشتزار، برای مردم آراسته شده است. این بهرهٔ زندگی دنیاست؛ و نیکویی بازگشت نزد آن معبود یگانه است.</p>
