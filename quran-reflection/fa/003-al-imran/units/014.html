<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="زُيِّنَ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن.">زُيِّنَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="حُبُّ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">حُبُّ</button>
    <button class="word-link" type="button" data-word="الشَّهَوٰتِ" data-root="ش ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-h2-w/" data-root-meaning="میل و خواست شدید برای چیزی.">الشَّهَوٰتِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن">النِّساءِ</button>
    <button class="word-link" type="button" data-word="وَالبَنينَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">وَالبَنينَ</button>
    <button class="word-link" type="button" data-word="وَالقَنٰطيرِ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="ق ن ط ر" data-learn-more="/quran-terminology/fa/roots/q-n-tt-r/" data-root-meaning="قنطار: مقدار یا انبوهی بزرگ از دارایی؛ اندازه عددی ثابت آن از خود واژه روشن نیست.">وَالقَنٰطيرِ</button>
    <button class="word-link" type="button" data-word="المُقَنطَرَةِ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="ق ن ط ر" data-learn-more="/quran-terminology/fa/roots/q-n-tt-r/" data-root-meaning="قنطار: مقدار یا انبوهی بزرگ از دارایی؛ اندازه عددی ثابت آن از خود واژه روشن نیست.">المُقَنطَرَةِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الذَّهَبِ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">الذَّهَبِ</button>
    <button class="word-link" type="button" data-word="وَالفِضَّةِ" data-root="ف ض ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-dad-dad/" data-root-meaning="شکستن و پراکندن؛ فضّه: نقره.">وَالفِضَّةِ</button>
    <button class="word-link" type="button" data-word="وَالخَيلِ" data-root="خ ي ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-y-l/" data-root-meaning="تصویر ذهنی و خیال؛ اختیال: خودبزرگ‌بینی؛ خیل: اسبان.">وَالخَيلِ</button>
    <button class="word-link" type="button" data-word="المُسَوَّمَةِ" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز">المُسَوَّمَةِ</button>
    <button class="word-link" type="button" data-word="وَالأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">وَالأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="وَالحَرثِ" data-root="ح ر ث" data-learn-more="/quran-terminology/fa/roots/h-r-th/" data-root-meaning="کار هدفمند، آماده‌سازی بستر، پرورش و انتظار حاصل">وَالحَرثِ</button>
    ۗ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مَتٰعُ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">مَتٰعُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عِندَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَهُ</button>
    <button class="word-link" type="button" data-word="حُسنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">حُسنُ</button>
    <button class="word-link" type="button" data-word="المَـٔابِ" data-root="أ و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-w-b/" data-root-meaning="بازگشت و بازآمدن؛ أوّاب: بسیار بازگشت‌کننده و روی‌آورنده.">المَـٔابِ</button>
  </p>
  <p class="farsi-verse">دوست داشتن خواستنی‌ها، از زنان و پسران و انبوه‌های انباشتهٔ طلا و نقره و اسب‌های نشان‌دار و دام‌ها و کشتزار، برای مردم آراسته شده است. این بهرهٔ زندگی دنیاست؛ و نیکویی بازگشت نزد آن معبود یگانه است.</p>
</section>
