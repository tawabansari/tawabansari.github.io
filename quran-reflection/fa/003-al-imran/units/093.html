<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۹۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="الطَّعامِ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا">الطَّعامِ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="حِلًّا" data-root="ح ل ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِلًّا</button>
    <button class="word-link" type="button" data-word="لِبَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">لِبَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="حَرَّمَ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت">حَرَّمَ</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُنَزَّلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">تُنَزَّلَ</button>
    <button class="word-link" type="button" data-word="التَّورىٰةُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">التَّورىٰةُ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="فَأتوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">فَأتوا</button>
    <button class="word-link" type="button" data-word="بِالتَّورىٰةِ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِالتَّورىٰةِ</button>
    <button class="word-link" type="button" data-word="فَاتلوها" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر">فَاتلوها</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="صٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">صٰدِقينَ</button>
  </p>
  <p class="farsi-verse">همه خوراک‌ها برای بنی‌اسرائیل حلال بود، جز آنچه اسرائیل پیش از نازل شدن تورات بر خود حرام کرده بود. بگو: «اگر راست می‌گویید، تورات را بیاورید و آن را بخوانید.»</p>
</section>
