<section class="ayah-block" id="ayah-200" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۲۰۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="اصبِروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/">اصبِروا</button>
    <button class="word-link" type="button" data-word="وَصابِروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/">وَصابِروا</button>
    <button class="word-link" type="button" data-word="وَرابِطوا" data-root="ر ب ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَرابِطوا</button>
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">وَاتَّقُوا</button>

    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُفلِحونَ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/">تُفلِحونَ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، شکیبا باشید و در پایداری استوارتر بمانید و آماده و پیوسته بمانید، و از آن معبود یگانه پروا کنید، باشد که رستگار شوید.</p>
