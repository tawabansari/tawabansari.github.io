<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۰۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَيفَ</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">تَكفُرونَ</button>
    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="تُتلىٰ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر">تُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="ءايٰتُ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَفيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفيكُم</button>
    <button class="word-link" type="button" data-word="رَسولُهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رَسولُهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَعتَصِم" data-root="ع ص م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sad-m/" data-root-meaning="نگه داشتن و بازداشتن از آسیب؛ اعتصام: محکم چنگ زدن.">يَعتَصِم</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="هُدِىَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هُدِىَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="ص ر ط" data-learn-more="/quran-terminology/fa/roots/s-r-t/" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُستَقيمٍ</button>
  </p>
  <p class="farsi-verse">و چگونه کفر می‌ورزید، در حالی که آیات آن معبود یگانه بر شما خوانده می‌شود و فرستاده او در میان شماست؟ و هرکس به آن معبود یگانه چنگ زند، به راهی راست هدایت شده است.</p>
</section>
