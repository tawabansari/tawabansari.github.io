  <p class="farsi-verse">شادمان به آنچه آن معبود یگانه از فضل خود به آنان داده است، و درباره کسانی که از پی آنان هنوز به ایشان نپیوسته‌اند شادمانی می‌کنند که نه ترسی بر آنان است و نه اندوهگین می‌شوند؛</p>
