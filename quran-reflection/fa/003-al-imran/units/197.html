<section class="ayah-block" id="ayah-197" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۹۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَتٰعٌ" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">مَتٰعٌ</button>
    <button class="word-link" type="button" data-word="قَليلٌ" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلٌ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="مَأوىٰهُم" data-root="أ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="پناه گرفتن و در جایی جای گرفتن؛ إیواء: پناه دادن؛ مأوى: جای پناه و اقامت.">مَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المِهادُ" data-root="م ه د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-h2-d/" data-root-meaning="هموار و آماده کردن؛ مهد: گهواره یا بستر آماده.">المِهادُ</button>
  </p>
  <p class="farsi-verse">بهره‌ای اندک است؛ سپس جایگاهشان دوزخ است، و چه بد بستری است.</p>
</section>
