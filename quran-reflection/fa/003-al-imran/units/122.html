  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>

    ۗ

  <p class="farsi-verse">آنگاه که دو گروه از شما در آستانه سستی بودند، در حالی که آن معبود یگانه سرپرست آن دو بود؛ و مؤمنان باید بر آن معبود یگانه توکل کنند.</p>
