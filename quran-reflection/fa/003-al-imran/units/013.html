<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ بیان وجود نشانه در آن رویارویی.">كانَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="ءايَةٌ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه و مایه عبرت.">ءايَةٌ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="فِئَتَينِ" data-root="ف أ ي" data-learn-more="/quran-terminology/fa/roots/f-a-y/" data-root-meaning="فئه: گروه یا دسته‌ای از مردم؛ نقش رزمی یا پشتیبانی آن از سیاق شناخته می‌شود." data-context="دو گروهی که با یکدیگر روبه‌رو شدند.">فِئَتَينِ</button>
    <button class="word-link" type="button" data-word="التَقَتا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="با یکدیگر روبه‌رو شدند؛ درباره دو گروه.">التَقَتا</button>
    ۖ
    <button class="word-link" type="button" data-word="فِئَةٌ" data-root="ف أ ي" data-learn-more="/quran-terminology/fa/roots/f-a-y/" data-root-meaning="فئه: گروه یا دسته‌ای از مردم؛ نقش رزمی یا پشتیبانی آن از سیاق شناخته می‌شود." data-context="گروهی که در راه خدا می‌جنگد.">فِئَةٌ</button>
    <button class="word-link" type="button" data-word="تُقٰتِلُ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="می‌جنگد؛ وصف یکی از دو گروه.">تُقٰتِلُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه خدا؛ جهت و هدف جنگیدن در این عبارت.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَأُخرىٰ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="گروه دیگر.">وَأُخرىٰ</button>
    <button class="word-link" type="button" data-word="كافِرَةٌ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کافر؛ وصف گروه دیگر.">كافِرَةٌ</button>
    <button class="word-link" type="button" data-word="يَرَونَهُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آنان را می‌دیدند؛ درباره ادراک دیداری در رویارویی.">يَرَونَهُم</button>
    <button class="word-link" type="button" data-word="مِثلَيهِم" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="دو برابر آنان.">مِثلَيهِم</button>
    <button class="word-link" type="button" data-word="رَأىَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="دیدن؛ در ترکیب دیدن با چشم.">رَأىَ</button>
    <button class="word-link" type="button" data-word="العَينِ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="چشم؛ ابزار دیدن در این عبارت.">العَينِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُؤَيِّدُ" data-root="أ ي د" data-learn-more="/quran-terminology/fa/roots/a-y-d/" data-root-meaning="قوت، استواری و قوت بخشیدن به دیگری" data-context="تقویت و پشتیبانی می‌کند.">يُؤَيِّدُ</button>
    <button class="word-link" type="button" data-word="بِنَصرِهِ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="با یاری خود.">بِنَصرِهِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="می‌خواهد.">يَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَعِبرَةً" data-root="ع ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-b-r/" data-root-meaning="گذشتن از یک سو به سوی دیگر؛ عبرت و تعبیر: از نشانه به معنا رسیدن." data-context="مایه عبرت و آموختن از رخداد.">لَعِبرَةً</button>
    <button class="word-link" type="button" data-word="لِأُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِأُولِى</button>
    <button class="word-link" type="button" data-word="الأَبصٰرِ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینایی‌ها؛ در ترکیب صاحبان بینش.">الأَبصٰرِ</button>
  </p>
  <p class="farsi-verse">در دو گروهی که به هم رسیدند، نشانه‌ای برای شما بود: گروهی در راه آن معبود یگانه می‌جنگید و گروهی دیگر کافر بود؛ آنان را به چشم، دو برابر خود می‌دیدند. و آن معبود یگانه هر که را بخواهد با یاری خود نیرو می‌بخشد؛ بی‌گمان در این عبرتی برای صاحبان بینش است.</p>
</section>
