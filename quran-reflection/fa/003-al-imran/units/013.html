    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>

    <button class="word-link" type="button" data-word="فِئَتَينِ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="ف أ ي" data-learn-more="/quran-terminology/fa/roots/f-a-y/" data-root-meaning="فئه: گروه و دسته؛ تحلیل اشتقاقی آن در فرهنگ‌ها یکسان نیست.">فِئَتَينِ</button>
    <button class="word-link" type="button" data-word="التَقَتا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">التَقَتا</button>

    <button class="word-link" type="button" data-word="فِئَةٌ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="ف أ ي" data-learn-more="/quran-terminology/fa/roots/f-a-y/" data-root-meaning="فئه: گروه و دسته؛ تحلیل اشتقاقی آن در فرهنگ‌ها یکسان نیست.">فِئَةٌ</button>

    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلِ</button>

    <button class="word-link" type="button" data-word="وَأُخرىٰ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">وَأُخرىٰ</button>

    <button class="word-link" type="button" data-word="العَينِ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">العَينِ</button>

    <button class="word-link" type="button" data-word="يُؤَيِّدُ" data-root="أ ي د" data-learn-more="/quran-terminology/fa/roots/a-y-d/" data-root-meaning="قوت، استواری و قوت بخشیدن به دیگری">يُؤَيِّدُ</button>

    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَعِبرَةً" data-root="ع ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-b-r/" data-root-meaning="گذشتن از یک سو به سوی دیگر؛ عبرت و تعبیر: از نشانه به معنا رسیدن.">لَعِبرَةً</button>

  </p>
  <p class="farsi-verse">در دو گروهی که به هم رسیدند، نشانه‌ای برای شما بود: گروهی در راه آن معبود یگانه می‌جنگید و گروهی دیگر کافر بود؛ آنان را به چشم، دو برابر خود می‌دیدند. و آن معبود یگانه هر که را بخواهد با یاری خود نیرو می‌بخشد؛ بی‌گمان در این عبرتی برای صاحبان بینش است.</p>
</section>
