<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُنالِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُنالِكَ</button>
    <button class="word-link" type="button" data-word="دَعا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">دَعا</button>
    <button class="word-link" type="button" data-word="زَكَرِيّا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">زَكَرِيّا</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبِّ</button>
    <button class="word-link" type="button" data-word="هَب" data-root="و ه ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">هَب</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لَدُنكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدُنكَ</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّةً" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/">ذُرِّيَّةً</button>
    <button class="word-link" type="button" data-word="طَيِّبَةً" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/">طَيِّبَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="سَميعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/">سَميعُ</button>
    <button class="word-link" type="button" data-word="الدُّعاءِ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">الدُّعاءِ</button>
  </p>
  <p class="farsi-verse">آنجا زکریا پروردگارش را خواند؛ گفت: پروردگار من، از نزد خود نسلی پاکیزه به من ببخش؛ بی‌گمان تو شنوای دعایی.</p>
</section>
