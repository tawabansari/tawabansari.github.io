  <p class="farsi-verse">مؤمنان نباید کافران را به جای مؤمنان سرپرست بگیرند؛ و هر که چنین کند، در هیچ چیز با آن معبود یگانه پیوندی ندارد، مگر آنکه از آنان برای حفظ خود پروا کنید. و آن معبود یگانه شما را از خود برحذر می‌دارد؛ و بازگشت به سوی آن معبود یگانه است.</p>
