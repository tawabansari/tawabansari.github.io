  <p class="farsi-verse">در دل‌های کسانی که کفر ورزیدند هراس خواهیم افکند، از آن رو که چیزی را شریک آن معبود یگانه ساختند که هیچ حجتی درباره آن نازل نکرده است؛ و جایگاهشان آتش است، و چه بد است جایگاه ستمکاران.</p>
