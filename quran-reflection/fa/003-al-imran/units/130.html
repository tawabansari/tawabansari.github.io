<section class="ayah-block" id="ayah-130" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۱۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اند؛ مخاطبان فرمان">ءامَنوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَأكُلُوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="نخورید؛ در نهی از بهره‌گیری از ربا">تَأكُلُوا</button>
    <button class="word-link" type="button" data-word="الرِّبوٰا۟" data-root="ر ب و" data-learn-more="/quran-terminology/fa/roots/r-b-w/" data-root-meaning="بالا آمدن، افزون شدن، برآمدن، زیاد شدن، رشد کردن، و از حد پیشین بالاتر رفتن" data-context="ربا؛ موضوع نهی آیه">الرِّبوٰا۟</button>
    <button class="word-link" type="button" data-word="أَضعٰفًا" data-root="ض ع ف" data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="کمبود توان و ناتوانی در برابر قوت؛ در باب استفعال، ضعیف شمردن یا در وضعیت ضعف قرار دادن. در شاخه‌ای مستقل، افزودن مانندِ چیزی بر مقدار نخست و دوبرابر یا چندبرابر کردن آن." data-context="چندبرابرها؛ وصف مقدارهای افزوده‌شدهٔ ربا">أَضعٰفًا</button>
    <button class="word-link" type="button" data-word="مُضٰعَفَةً" data-root="ض ع ف" data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="کمبود توان و ناتوانی در برابر قوت؛ در باب استفعال، ضعیف شمردن یا در وضعیت ضعف قرار دادن. در شاخه‌ای مستقل، افزودن مانندِ چیزی بر مقدار نخست و دوبرابر یا چندبرابر کردن آن." data-context="چندبرابرشده و افزوده‌شونده؛ وصف أضعاف">مُضٰعَفَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و پروا کنید؛ فرمان به پرهیز از نافرمانی">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُفلِحونَ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری" data-context="رستگار شوید؛ نتیجهٔ مورد انتظار پروا">تُفلِحونَ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، ربا را چندین برابرشده مخورید؛ و از آن معبود یگانه پروا کنید، باشد که رستگار شوید.</p>
</section>
