<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">آل عمران ۳:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="تَمَسَّنَا" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی">تَمَسَّنَا</button>
    <button class="word-link" type="button" data-word="النّارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَيّامًا" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">أَيّامًا</button>
    <button class="word-link" type="button" data-word="مَعدودٰتٍ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص">مَعدودٰتٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَغَرَّهُم" data-root="غ ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَغَرَّهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="دينِهِم" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد">دينِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="ف ر ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَفتَرونَ</button>
  </p>
  <p class="farsi-verse">این از آن روست که گفتند: آتش جز روزهایی شمرده به ما نمی‌رسد؛ و آنچه می‌بافتند آنان را در دینشان فریب داد.</p>
</section>
