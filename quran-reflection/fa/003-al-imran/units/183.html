  <p class="farsi-verse">آنان که گفتند: «آن معبود یگانه با ما پیمان بسته است که به هیچ فرستاده‌ای ایمان نیاوریم تا برایمان قربانی‌ای بیاورد که آتش آن را بخورد.» بگو: «پیش از من فرستادگانی با نشانه‌های روشن و با آنچه گفتید نزد شما آمدند؛ پس چرا آنان را کشتید، اگر راست می‌گویید؟»</p>
