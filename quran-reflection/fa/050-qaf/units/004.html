    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تَنقُصُ" data-root="ن ق ص" data-learn-more="/quran-terminology/fa/roots/n-q-sad/">تَنقُصُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">الأَرضُ</button>

    ۖ
    <button class="word-link" type="button" data-word="وَعِندَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعِندَنا</button>

  <p class="farsi-verse">ما می‌دانیم زمین چه چیزی از آنان می‌کاهد، و نزد ما کتابی نگهدارنده است.</p>
