<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءونَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">يَشاءونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="وَلَدَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَدَينا</button>
    <button class="word-link" type="button" data-word="مَزيدٌ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">مَزيدٌ</button>
  </p>
  <p class="farsi-verse">در آن هرچه بخواهند برایشان هست و نزد ما بیشتر است.</p>
</section>
