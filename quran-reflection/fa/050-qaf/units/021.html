<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَت" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجاءَت</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">نَفسٍ</button>
    <button class="word-link" type="button" data-word="مَعَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَها</button>
    <button class="word-link" type="button" data-word="سائِقٌ" data-root="س و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-q/" data-root-meaning="راندن و پیش بردن؛ سوق: بازار؛ ساق: بخش پایین پا.">سائِقٌ</button>
    <button class="word-link" type="button" data-word="وَشَهيدٌ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">وَشَهيدٌ</button>
  </p>
  <p class="farsi-verse">و هر نفسی آمد، با او راننده‌ای و گواهی.</p>
</section>
