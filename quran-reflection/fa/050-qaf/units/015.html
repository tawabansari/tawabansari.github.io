<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَعَيينا" data-root="ع ي ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-y-y/" data-root-meaning="درماندگی و ناتوانی از انجام کار یا بیان سخن.">أَفَعَيينا</button>
    <button class="word-link" type="button" data-word="بِالخَلقِ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">بِالخَلقِ</button>
    <button class="word-link" type="button" data-word="الأَوَّلِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">الأَوَّلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="لَبسٍ" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن">لَبسٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="خَلقٍ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقٍ</button>
    <button class="word-link" type="button" data-word="جَديدٍ" data-root="ج د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-d/" data-root-meaning="شاخه‌های این خانواده شامل بریدن، نو شدن، نوارها و راه‌های آشکار، و «جدّ» به معنای عظمت است.">جَديدٍ</button>
  </p>
  <p class="farsi-verse">آیا از آفرینش نخست خسته شدیم؟ بلکه آنان دربارهٔ آفرینشی تازه در تردیدند.</p>
</section>
