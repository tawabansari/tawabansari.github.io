<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="توعَدونَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">توعَدونَ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="أَوّابٍ" data-root="أ و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-w-b/" data-root-meaning="بازگشت و بازآمدن؛ أوّاب: بسیار بازگشت‌کننده و روی‌آورنده.">أَوّابٍ</button>
    <button class="word-link" type="button" data-word="حَفيظٍ" data-root="ح ف ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-f-zha/" data-root-meaning="نگهداری، مراقبت، به خاطر سپردن و از آسیب محفوظ داشتن.">حَفيظٍ</button>
  </p>
  <p class="farsi-verse">این همان است که به شما وعده داده می‌شود، برای هر بازگشت‌کنندهٔ نگهدارنده،</p>
</section>
