<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَءِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِذا</button>
    <button class="word-link" type="button" data-word="مِتنا" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مِتنا</button>
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">وَكُنّا</button>
    <button class="word-link" type="button" data-word="تُرابًا" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/">تُرابًا</button>
    ۖ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="رَجعٌ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">رَجعٌ</button>
    <button class="word-link" type="button" data-word="بَعيدٌ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/">بَعيدٌ</button>
  </p>
  <p class="farsi-verse">آیا هنگامی که مردیم و خاک شدیم؟ این بازگشتی دور است.</p>
</section>
