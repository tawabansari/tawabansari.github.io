<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاستَمِع" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="و گوش فرا ده؛ فرمان شنیدن ندا.">وَاستَمِع</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمان ندای منادی.">يَومَ</button>
    <button class="word-link" type="button" data-word="يُنادِ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="ندا می‌کند؛ عمل فراخواننده از جایی نزدیک." data-learn-more="/quran-terminology/fa/roots/n-d-y/">يُنادِ</button>
    <button class="word-link" type="button" data-word="المُنادِ" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="ندا‌کننده؛ صاحب فراخوانِ بیان‌شده." data-learn-more="/quran-terminology/fa/roots/n-d-y/">المُنادِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَكانٍ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="جای؛ مبدأ ندای منادی.">مَكانٍ</button>
    <button class="word-link" type="button" data-word="قَريبٍ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="نزدیک؛ وصف جای ندا.">قَريبٍ</button>
  </p>
  <p class="farsi-verse">و گوش بسپار، روزی که نداکننده از جایی نزدیک ندا می‌دهد،</p>
</section>
