  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="خَشِىَ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/">خَشِىَ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/">الرَّحمٰنَ</button>
    <button class="word-link" type="button" data-word="بِالغَيبِ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/">بِالغَيبِ</button>
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/">وَجاءَ</button>

    <button class="word-link" type="button" data-word="مُنيبٍ" data-root="ن و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُنيبٍ</button>

  <p class="farsi-verse">کسی که از رحمان در نهان ترسید و با دلی بازگشت‌کننده آمد.</p>
