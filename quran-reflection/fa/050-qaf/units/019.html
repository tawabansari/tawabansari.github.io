<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَت" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="و فرا رسید؛ آمدنِ حالت مرگ را بیان می‌کند.">وَجاءَت</button>
    <button class="word-link" type="button" data-word="سَكرَةُ" data-root="س ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-k-r/" data-root-meaning="مستی و اختلال در آگاهی؛ نیز بسته شدن راه دریافت." data-context="شدت و غلبهٔ حالت مرگ بر آگاهی انسان.">سَكرَةُ</button>
    <button class="word-link" type="button" data-word="المَوتِ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرگ؛ موضوعِ حالت شدیدِ بیان‌شده در «سکرة الموت».">المَوتِ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="با حقیقت؛ فرا رسیدن واقعیت مرگ و آنچه با آن آشکار می‌شود.">بِالحَقِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="در گذشته چنین بودی؛ همراه «تحید»، دوری جستن پیشین را بیان می‌کند.">كُنتَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="تَحيدُ" data-root="ح ي د" data-root-meaning="کنار رفتن و تغییر مسیر؛ دوری جستن از رویارویی، و در سیاق مناسب، گریختن." data-context="از آن کنار می‌رفتی و می‌گریختی؛ در این سیاق، از مواجهه با مرگ و فرا رسیدن حقیقت آن." data-learn-more="/quran-terminology/fa/roots/h-y-d/">تَحيدُ</button>
  </p>
  <p class="farsi-verse">و بی‌خودی مرگ به حق آمد؛ این همان است که از آن می‌گریختی.</p>
</section>
