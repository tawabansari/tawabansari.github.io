<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنُفِخَ" data-root="ن ف خ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَنُفِخَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="ص و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الصّورِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَومُ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومُ</button>
    <button class="word-link" type="button" data-word="الوَعيدِ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">الوَعيدِ</button>
  </p>
  <p class="farsi-verse">و در صور دمیده شد؛ این روز هشدار است.</p>
