<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="و اهل و مردم ایکه.">وَأَصحٰبُ</button>
    <button class="word-link" type="button" data-word="الأَيكَةِ" data-root="أ ي ك" data-learn-more="/quran-terminology/fa/roots/a-y-k/" data-root-meaning="اجتماع و درهم‌تنیدگی درختان؛ «أیکة»، بیشه و پوشش درختی انبوه؛ در قرآن بخشی از عنوانِ اصحاب ایکه." data-context="ایکه؛ بیشه یا درختستان، در عنوان اصحاب ایکه.">الأَيكَةِ</button>
    <button class="word-link" type="button" data-word="وَقَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="و قوم؛ در ترکیب قوم تبع.">وَقَومُ</button>
    <button class="word-link" type="button" data-word="تُبَّعٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">تُبَّعٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="كُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="همگیِ گروه‌های یادشده.">كُلٌّ</button>
    <button class="word-link" type="button" data-word="كَذَّبَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="فرستادگان را تکذیب کرد؛ فعل مفرد با «کلّ».">كَذَّبَ</button>
    <button class="word-link" type="button" data-word="الرُّسُلَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادگان؛ موضوع تکذیب اقوام.">الرُّسُلَ</button>
    <button class="word-link" type="button" data-word="فَحَقَّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="پس هشدار من تحقق یافت و استوار شد.">فَحَقَّ</button>
    <button class="word-link" type="button" data-word="وَعيدِ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="هشدار من درباره کیفر.">وَعيدِ</button>
  </p>
  <p class="farsi-verse">و اصحاب بیشه و قوم تُبّع؛ همگی فرستادگان را تکذیب کردند، پس هشدار من تحقق یافت.</p>
</section>
