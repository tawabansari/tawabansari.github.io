<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالنَّخلَ" data-root="ن خ ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالنَّخلَ</button>
    <button class="word-link" type="button" data-word="باسِقٰتٍ" data-root="ب س ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">باسِقٰتٍ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="طَلعٌ" data-root="ط ل ع" data-root-meaning="ط ل ع در هسته شناخته‌شده خود به برآمدن و آشکار شدن مربوط است. در کاربردهای طبیعی، پدیدار شدن خورشید و سر برآوردن محصول گیاه را بیان می‌کند؛ در کاربردهای مربوط به انسان، می‌تواند به مشاهده یا آگاه شدن از چیزی اشاره کند که پیش‌تر در دسترس او نبوده است؛ و در بعضی ساخت‌ها، معنای رسیدن به جایگاهی را می‌رساند." data-learn-more="/quran-terminology/fa/roots/tt-l-ayn/">طَلعٌ</button>
    <button class="word-link" type="button" data-word="نَضيدٌ" data-root="ن ض د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَضيدٌ</button>
  </p>
  <p class="farsi-verse">و نخل‌های بلند که خوشه‌های روی‌هم‌چیده دارند،</p>
</section>
