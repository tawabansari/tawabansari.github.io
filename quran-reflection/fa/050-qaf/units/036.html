<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَم</button>
    <button class="word-link" type="button" data-word="أَهلَكنا" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="نسل‌های نیرومندترِ پیش از آنان را نابود ساختیم." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">أَهلَكنا</button>
    <button class="word-link" type="button" data-word="قَبلَهُم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از آنان.">قَبلَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَرنٍ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره." data-context="نسلی از مردمِ گذشته.">قَرنٍ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="نیرومندتر در چیرگی.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="بَطشًا" data-root="ب ط ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-tt-sh/" data-root-meaning="گرفتن و برخورد کردن با قدرت و غلبه؛ حمله یا کیفر سخت در سیاق مربوط." data-context="قدرتِ حمله و تسلط.">بَطشًا</button>
    <button class="word-link" type="button" data-word="فَنَقَّبوا" data-root="ن ق ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-q-b/" data-root-meaning="سوراخ کردن و راه یافتن؛ نقیب: سرپرست یا نماینده گروه." data-context="پس در سرزمین‌ها راه گشودند و جست‌وجو کردند.">فَنَقَّبوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="البِلٰدِ" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»" data-context="در سرزمین‌ها.">البِلٰدِ</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَحيصٍ" data-root="ح ي ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-y-sad/" data-root-meaning="کنار کشیدن و گریز؛ محیص: راه گریز." data-context="راه گریز و پناهی برای رهایی.">مَحيصٍ</button>
  </p>
  <p class="farsi-verse">و چه بسیار نسل‌هایی را پیش از آنان هلاک کردیم که از ایشان نیرومندتر بودند؛ پس در سرزمین‌ها گشتند؛ آیا گریزگاهی هست؟</p>
</section>
