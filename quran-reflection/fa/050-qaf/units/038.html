<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="خَلَقنَا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفریدیم؛ آفرینش آسمان‌ها و زمین و میان آنها.">خَلَقنَا</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ از آفریده‌های یادشده.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ از آفریده‌های یادشده.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن دو؛ میان آسمان‌ها و زمین.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سِتَّةِ" data-root="س ت ت" data-learn-more="/quran-terminology/fa/roots/s-t-t/" data-root-meaning="عدد شش؛ در صورت «ستین»، شصت؛ مرتبط با خانواده عددی «س د س»." data-context="شش؛ شمار روزهای آفرینش در این آیه.">سِتَّةِ</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزها؛ واحد زمانی همراه عدد شش.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="مَسَّنا" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به ما رسید؛ در جمله‌ای که رسیدن فرسودگی را نفی می‌کند.">مَسَّنا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لُغوبٍ" data-root="ل غ ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-gh-b/" data-root-meaning="خستگی و فرسودگی." data-context="خستگی و فرسودگی؛ چیزی که رسیدن آن نفی شده است.">لُغوبٍ</button>
  </p>
  <p class="farsi-verse">و به‌راستی آسمان‌ها و زمین و آنچه میان آنهاست را در شش روز آفریدیم و هیچ خستگی به ما نرسید.</p>
</section>
