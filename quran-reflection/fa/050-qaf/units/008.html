<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَبصِرَةً" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="برای بینش‌بخشی؛ هدفِ نشان دادن نشانه‌های آفرینش.">تَبصِرَةً</button>
    <button class="word-link" type="button" data-word="وَذِكرىٰ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="و یادآوری؛ آنچه نشانه‌ها برای بندهٔ روی‌آورنده فراهم می‌کنند.">وَذِكرىٰ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="برای هر؛ بیان فراگیری نسبت به بندهٔ روی‌آورنده.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="عَبدٍ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بنده؛ کسی که روی‌آورنده توصیف شده است.">عَبدٍ</button>
    <button class="word-link" type="button" data-word="مُنيبٍ" data-root="ن و ب" data-learn-more="/quran-terminology/fa/roots/n-w-b/" data-root-meaning="بازگشت و مراجعه، و در برخی کاربردها آمدوشدِ مکرر یا نوبتی و جانشینی؛ أَنَابَ در قرآن روی‌آوردن به آن معبود یگانه است و مُنِيب، شخص یا قلبِ روی‌آورنده را وصف می‌کند." data-context="روی‌آورنده؛ وصف بنده‌ای که نشانه‌ها برای او یادآوری‌اند.">مُنيبٍ</button>
  </p>
  <p class="farsi-verse">برای بینش و یادآوری هر بندهٔ بازگشت‌کننده.</p>
</section>
