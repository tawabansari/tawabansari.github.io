<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="خَلَقنَا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="انسان را آفریدیم و پدید آوردیم؛ سخن دربارهٔ آفرینش او.">خَلَقنَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ موجودی که آفرینش و حالات درونی او موضوع آیه است.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="وَنَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و می‌دانیم؛ آنچه نفس انسان در درون او وسوسه می‌کند.">وَنَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تُوَسوِسُ" data-root="و س و س" data-root-meaning="وسوسه در کاربرد صوتی، صدای آرام و پنهان است؛ و در کاربرد مربوط به انسان، سخن یا اندیشه‌ای است که در درون می‌گذرد یا به شیوه‌ای نهانی القا می‌شود. این القا می‌تواند از نفس انسان یا عامل دیگری باشد و نادرستی، فریبندگی یا شیطانی بودن آن از فاعل، محتوا و سیاق تعیین می‌شود، نه از خود ریشه به تنهایی." data-learn-more="/quran-terminology/fa/roots/w-s-w-s/" data-context="در نهان القا می‌کند و زمزمه می‌نماید؛ دربارهٔ آنچه در نفس انسان می‌گذرد.">تُوَسوِسُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="نَفسُهُ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="نفس و خودِ او؛ منشأ زمزمه‌های درونی یادشده در آیه.">نَفسُهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَنَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَنَحنُ</button>
    <button class="word-link" type="button" data-word="أَقرَبُ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="نزدیک‌تریم؛ در مقایسه با رگ گردن انسان.">أَقرَبُ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَبلِ" data-root="ح ب ل" data-root-meaning="ریسمان و رشتهٔ ممتد؛ پیوند، عهد و وسیلهٔ اتصال و حمایت." data-context="رشتهٔ رگ در ترکیب «حبل الورید»؛ رگ گردن که در بیان نزدیکی به انسان آمده است." data-learn-more="/quran-terminology/fa/roots/h-b-l/">حَبلِ</button>
    <button class="word-link" type="button" data-word="الوَريدِ" data-root="و ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-d/" data-root-meaning="رسیدن به آب یا مقصد؛ وِرد: ورود یا بهره مقرر." data-context="ورید؛ رگی در گردن، در ترکیب «حبل الورید».">الوَريدِ</button>
  </p>
  <p class="farsi-verse">و به‌راستی انسان را آفریدیم و آنچه را نفسش با او زمزمه می‌کند می‌دانیم؛ و ما از رگ گردن به او نزدیک‌تریم.</p>
</section>
