<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذَّبَت" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبَت</button>
    <button class="word-link" type="button" data-word="قَبلَهُم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلَهُم</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومُ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَأَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">وَأَصحٰبُ</button>
    <button class="word-link" type="button" data-word="الرَّسِّ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">الرَّسِّ</button>
    <button class="word-link" type="button" data-word="وَثَمودُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَثَمودُ</button>
  </p>
  <p class="farsi-verse">پیش از آنان قوم نوح و اصحاب رسّ و ثمود تکذیب کردند،</p>
</section>
