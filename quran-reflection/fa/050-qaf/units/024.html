<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلقِيا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">أَلقِيا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="كَفّارٍ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفّارٍ</button>
    <button class="word-link" type="button" data-word="عَنيدٍ" data-root="ع ن د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَنيدٍ</button>
  </p>
  <p class="farsi-verse">شما دو تن، هر کافر سرسختی را در جهنم بیفکنید،</p>
</section>
