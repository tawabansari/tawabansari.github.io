<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَلفِظُ" data-root="ل ف ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-f-zha/" data-root-meaning="بیرون انداختن؛ لفظ: سخنی که از دهان ادا می‌شود." data-context="بر زبان می‌آورد؛ بیرون دادن سخن از دهان.">يَلفِظُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَولٍ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخنی؛ آنچه انسان بر زبان می‌آورد.">قَولٍ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="لَدَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدَيهِ</button>
    <button class="word-link" type="button" data-word="رَقيبٌ" data-root="ر ق ب" data-root-meaning="زیر نظر داشتن، مراقبت، انتظار و رعایت؛ رقبة: گردن و به کنایه، تمام شخص یا انسان در بند." data-context="مراقبی نزد انسان؛ «عتید» جداگانه آمادگی و حضور او را بیان می‌کند. خود رقیب به معنای نوشتن نیست." data-learn-more="/quran-terminology/fa/roots/r-q-b/">رَقيبٌ</button>
    <button class="word-link" type="button" data-word="عَتيدٌ" data-root="ع ت د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-d/" data-root-meaning="آماده کردن و آماده یا حاضر بودن." data-context="آماده و حاضر؛ وصفِ مستقلی برای مراقب.">عَتيدٌ</button>
  </p>
  <p class="farsi-verse">هیچ سخنی بر زبان نمی‌آورد مگر آنکه نزد او مراقبی آماده است.</p>
</section>
