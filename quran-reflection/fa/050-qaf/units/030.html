<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="نَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">نَقولُ</button>
    <button class="word-link" type="button" data-word="لِجَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لِجَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="هَلِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَلِ</button>
    <button class="word-link" type="button" data-word="امتَلَأتِ" data-root="م ل أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">امتَلَأتِ</button>
    <button class="word-link" type="button" data-word="وَتَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَتَقولُ</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَزيدٍ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">مَزيدٍ</button>
  </p>
  <p class="farsi-verse">روزی که به جهنم می‌گوییم: آیا پر شدی؟ و می‌گوید: آیا بیشتر هست؟</p>
</section>
