<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ادخُلوها" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">ادخُلوها</button>
    <button class="word-link" type="button" data-word="بِسَلٰمٍ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">بِسَلٰمٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَومُ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومُ</button>
    <button class="word-link" type="button" data-word="الخُلودِ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه">الخُلودِ</button>
  </p>
  <p class="farsi-verse">با سلام به آن درآیید؛ این روز ماندگاری است.</p>
</section>
