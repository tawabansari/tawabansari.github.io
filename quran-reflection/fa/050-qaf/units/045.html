<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">ق ۵۰:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="داناتریم؛ علم به سخنانِ آنان.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ سخنانِ معلوم برای آن معبود یگانه.">يَقولونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِجَبّارٍ" data-root="ج ب ر" data-root-meaning="اصلاح شکستگی و جبران کمبود؛ استواری، قدرت، چیرگی و واداشتن." data-context="وادارکننده؛ نقشی که برای مخاطب نفی می‌شود." data-learn-more="/quran-terminology/fa/roots/j-b-r/">بِجَبّارٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذَكِّر" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="پس یادآوری کن؛ تذکر دادن با قرآن.">فَذَكِّر</button>
    <button class="word-link" type="button" data-word="بِالقُرءانِ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="با قرآن؛ وسیلهٔ یادآوری برای بیم‌دارندهٔ هشدار." data-learn-more="/quran-terminology/fa/roots/q-r-a/">بِالقُرءانِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَخافُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="می‌ترسد؛ بیم از هشدارِ الهی.">يَخافُ</button>
    <button class="word-link" type="button" data-word="وَعيدِ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="هشدار من؛ خبرِ پیامدِ ناخوشایند.">وَعيدِ</button>
  </p>
  <p class="farsi-verse">ما به آنچه می‌گویند داناتریم، و تو بر آنان زورگو نیستی؛ پس با قرآن کسی را که از هشدار من می‌ترسد یادآوری کن.</p>
</section>
