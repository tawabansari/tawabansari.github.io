<section class="ayah-block" id="ayah-108" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۱۰۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="سَبيلى" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلى</button>
    <button class="word-link" type="button" data-word="أَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">أَدعوا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَصيرَةٍ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">بَصيرَةٍ</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنا۠</button>
    <button class="word-link" type="button" data-word="وَمَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَنِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَنى" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">اتَّبَعَنى</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسُبحٰنَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">وَسُبحٰنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنا۠</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد">المُشرِكينَ</button>
  </p>
  <p class="farsi-verse">بگو: این راه من است؛ من و هرکه از من پیروی کرده، با بینش به سوی آن معبود یگانه فرامی‌خوانیم؛ و آن معبود یگانه پاک و برتر است و من از مشرکان نیستم.</p>
</section>
