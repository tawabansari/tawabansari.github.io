<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَأتى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يَأتى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدِ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="عامٌ" data-root="ع و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-w-m/" data-root-meaning="عام: سال؛ معنای واژه به‌تنهایی خوشی یا سختی آن سال را تعیین نمی‌کند.">عامٌ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="يُغاثُ" data-root="غ و ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-th/" data-root-meaning="فریادرسی و یاری در گرفتاری.">يُغاثُ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="وَفيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفيهِ</button>
    <button class="word-link" type="button" data-word="يَعصِرونَ" data-root="ع ص ر" data-root-meaning="عصر در کاربرد مادی، فشردن و بیرون آوردن مایع است؛ در کاربرد زمانی، به وقت و روزگار اشاره دارد؛ و در صورت‌های مربوط به باد و باران، باید معنای خاص هر مشتق را از ساخت و سیاق آن شناخت." data-learn-more="/quran-terminology/fa/roots/ayn-sad-r/">يَعصِرونَ</button>
  </p>
  <p class="farsi-verse">سپس پس از آن سالی می‌آید که مردم در آن یاری می‌شوند و در آن می‌فشارند.</p>
</section>
