    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>

    <button class="word-link" type="button" data-word="الأَحاديثِ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/" data-root-meaning="از پدید آمدن تا سخنی که بازگو می‌شود">الأَحاديثِ</button>
    ۚ

    <button class="word-link" type="button" data-word="غالِبٌ" data-root="غ ل ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-b/" data-root-meaning="چیره شدن و غلبه یافتن.">غالِبٌ</button>

    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسِ</button>

    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و کسی از مصر که او را خرید، به همسرش گفت: جایگاهش را گرامی بدار؛ شاید به ما سود برساند یا او را فرزند بگیریم؛ و این‌گونه یوسف را در زمین جای دادیم و تا از تأویل سخنان به او بیاموزیم؛ و آن معبود یگانه بر کار خود چیره است، ولی بیشتر مردم نمی‌دانند.</p>
</section>
