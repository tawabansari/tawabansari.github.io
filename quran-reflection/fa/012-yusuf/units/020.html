<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَشَرَوهُ" data-root="ش ر ي" data-learn-more="/quran-terminology/fa/roots/sh-r-y/" data-root-meaning="خریدن، فروختن، مبادله کردن، و واگذار کردن چیزی در برابر گرفتن چیزی دیگر" data-context="و او را فروختند">وَشَرَوهُ</button>
    <button class="word-link" type="button" data-word="بِثَمَنٍ" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود" data-context="به بهایی؛ در برابر یک قیمت">بِثَمَنٍ</button>
    <button class="word-link" type="button" data-word="بَخسٍ" data-root="ب خ س" data-root-meaning="کاستن و کم گذاشتن؛ به‌ویژه کاستن ناروا از حق، سهم یا ارزش چیزی." data-learn-more="/quran-terminology/fa/roots/b-kh-s/" data-context="ناچیز و فروتر از ارزش؛ در تفسیر دیگر، ناروا">بَخسٍ</button>
    <button class="word-link" type="button" data-word="دَرٰهِمَ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="د ر ه م" data-learn-more="/quran-terminology/fa/roots/d-r-h2-m/" data-root-meaning="درهم: سکه یا واحد پول، با منشأ وام‌گرفته." data-context="درهم‌ها؛ واحدهای پول">دَرٰهِمَ</button>
    <button class="word-link" type="button" data-word="مَعدودَةٍ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="شمارش‌شده؛ در این سیاق، اندک">مَعدودَةٍ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بودند">وَكانوا</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الزّٰهِدينَ" data-root="ز ه د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-h2-d/" data-root-meaning="بی‌رغبتی و کم‌ارزش شمردن چیزی." data-context="بی‌رغبتان؛ کسانی که نسبت به او رغبت نداشتند">الزّٰهِدينَ</button>
  </p>
  <p class="farsi-verse">و او را به بهایی اندک، چند درهم شمرده، فروختند و به او بی‌رغبت بودند.</p>
</section>
