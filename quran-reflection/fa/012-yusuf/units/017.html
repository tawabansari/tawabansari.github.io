  <p class="farsi-verse">گفتند: پدر ما، ما رفتیم مسابقه بدهیم و یوسف را نزد وسایلمان گذاشتیم، پس گرگ او را خورد؛ و تو سخن ما را باور نمی‌کنی، هرچند راست‌گو باشیم.</p>
