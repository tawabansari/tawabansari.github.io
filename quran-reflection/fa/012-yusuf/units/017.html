<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ آغاز گزارش برادران پس از بازگشت.">قالوا</button>
    <button class="word-link" type="button" data-word="يٰأَبانا" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان" data-context="ای پدر ما؛ خطاب برادران به یعقوب.">يٰأَبانا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="ذَهَبنا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="رفتیم؛ بخشی از گزارش برادران دربارهٔ دور شدن.">ذَهَبنا</button>
    <button class="word-link" type="button" data-word="نَستَبِقُ" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/" data-root-meaning="پیش افتادن، پیشی گرفتن و سبقت جستن؛ از مسابقه و تقدم زمانی تا پیشگامی در کارهای نیک و پیشی‌ناپذیری در برابر اراده آن معبود یگانه" data-context="مسابقه می‌دادیم؛ کاری که برادران در گزارش خود ادعا می‌کنند.">نَستَبِقُ</button>
    <button class="word-link" type="button" data-word="وَتَرَكنا" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی" data-context="و گذاشتیم؛ ادعای برادران دربارهٔ تنها گذاشتن یوسف.">وَتَرَكنا</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="مَتٰعِنا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="وسایل ما؛ جایگاهی که می‌گویند یوسف را نزد آن گذاشتند.">مَتٰعِنا</button>
    <button class="word-link" type="button" data-word="فَأَكَلَهُ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="پس او را خورد؛ فعل گذشته در ادعای برادران.">فَأَكَلَهُ</button>
    <button class="word-link" type="button" data-word="الذِّئبُ" data-root="ذ أ ب" data-learn-more="/quran-terminology/fa/roots/dh-a-b/" data-root-meaning="ذِئْب، گرگ؛ نام جانوری وحشی و شکارگر." data-context="گرگ؛ جانوری که برادران ادعا می‌کنند یوسف را خورده است.">الذِّئبُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="بِمُؤمِنٍ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="باورکننده؛ در نفی پذیرفتن گزارش آنان از سوی پدر.">بِمُؤمِنٍ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشیم؛ در فرضِ راست‌گو بودنِ گویندگان.">كُنّا</button>
    <button class="word-link" type="button" data-word="صٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راست‌گو؛ وصفی که برادران در جملهٔ فرضی برای خود می‌آورند.">صٰدِقينَ</button>
  </p>
  <p class="farsi-verse">گفتند: پدر ما، ما رفتیم مسابقه بدهیم و یوسف را نزد وسایلمان گذاشتیم، پس گرگ او را خورد؛ و تو سخن ما را باور نمی‌کنی، هرچند راست‌گو باشیم.</p>
</section>
