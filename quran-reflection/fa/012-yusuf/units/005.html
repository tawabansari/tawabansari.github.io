<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ سخنِ پدر یوسف.">قالَ</button>
    <button class="word-link" type="button" data-word="يٰبُنَىَّ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="ای پسرکم؛ خطابِ محبت‌آمیزِ پدر.">يٰبُنَىَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَقصُص" data-root="ق ص ص" data-root-meaning="پی گرفتن اثر و بازگفتن؛ قصاص: مقابلهٔ متناسب با آسیب؛ در لغت، بریدن و کوتاه کردن نیز ثبت شده است." data-context="در «لا تقصص»: بازگو مکن؛ نهی از گفتن رؤیا به برادران." data-learn-more="/quran-terminology/fa/roots/q-sad-sad/">تَقصُص</button>
    <button class="word-link" type="button" data-word="رُءياكَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="رؤیایت؛ محتوایی که نباید بازگو شود.">رُءياكَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="إِخوَتِكَ" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادران؛ در سیاق مناسب، خواهران و برادران یا اعضای یک پیوند ایمانی." data-context="برادرانت؛ مخاطبانِ احتمالیِ بازگویی.">إِخوَتِكَ</button>
    <button class="word-link" type="button" data-word="فَيَكيدوا" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است." data-context="تا نیرنگ کنند؛ پیامدِ مورد هشدارِ گفتن رؤیا.">فَيَكيدوا</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="كَيدًا" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است." data-context="نیرنگی؛ مصدرِ تأکیدی برای عملِ پیشین.">كَيدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ دشمنِ مورد اشاره در هشدار.">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="لِلإِنسٰنِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="برای انسان؛ نسبتِ دشمنی با آدمی.">لِلإِنسٰنِ</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن؛ وصفِ شیطان در این جمله.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصفِ دشمنی یا دشمنِ یادشده.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">گفت: پسرکم، خوابت را برای برادرانت بازگو مکن که برایت نیرنگی می‌چینند؛ شیطان برای انسان دشمنی آشکار است.</p>
</section>
