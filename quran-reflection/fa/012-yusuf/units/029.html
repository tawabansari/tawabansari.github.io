<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يوسُفُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفُ</button>
    <button class="word-link" type="button" data-word="أَعرِض" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/">أَعرِض</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاستَغفِرى" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/">وَاستَغفِرى</button>
    <button class="word-link" type="button" data-word="لِذَنبِكِ" data-root="ذ ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لِذَنبِكِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّكِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكِ</button>
    <button class="word-link" type="button" data-word="كُنتِ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كُنتِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الخاطِـٔينَ" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/">الخاطِـٔينَ</button>
  </p>
  <p class="farsi-verse">یوسف، از این درگذر؛ و تو برای گناهت آمرزش بخواه که از خطاکاران بوده‌ای.</p>
</section>
