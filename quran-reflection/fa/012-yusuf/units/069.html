<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="دَخَلوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="وارد شدند؛ نزد یوسف آمدند.">دَخَلوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="ءاوىٰ" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="پذیرفتن و جای دادن دیگری نزد خود یا فراهم کردن پناه و جایگاه برای او." data-context="برادرش را نزد خود پذیرفت و جای داد.">ءاوىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="أَخاهُ" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر؛ در سیاق مناسب، هم‌قوم یا هم‌پیوند." data-context="برادرش؛ کسی که یوسف نزد خود پذیرفت.">أَخاهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغازِ سخنِ نقل‌شده.">قالَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنا۠</button>
    <button class="word-link" type="button" data-word="أَخوكَ" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر؛ در سیاق مناسب، هم‌قوم یا هم‌پیوند." data-context="برادر تو؛ در معرفیِ یوسف به برادرش.">أَخوكَ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَبتَئِس" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="اندوهگین و آزرده مباش؛ در ساختِ نهی.">تَبتَئِس</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در ساختِ بیانِ کردارِ گذشته.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دادند؛ رفتارِ یادشده.">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و چون بر یوسف وارد شدند، برادرش را نزد خود جای داد؛ گفت: من برادر تو هستم؛ پس از آنچه می‌کردند اندوهگین مباش.</p>
</section>
