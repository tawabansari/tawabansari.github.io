<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="لِلَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذى</button>
    <button class="word-link" type="button" data-word="ظَنَّ" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد">ظَنَّ</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="ناجٍ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">ناجٍ</button>
    <button class="word-link" type="button" data-word="مِنهُمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُمَا</button>
    <button class="word-link" type="button" data-word="اذكُرنى" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">اذكُرنى</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَأَنسىٰهُ" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل">فَأَنسىٰهُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="ذِكرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">ذِكرَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="فَلَبِثَ" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان.">فَلَبِثَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السِّجنِ" data-root="س ج ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-j-n/" data-root-meaning="زندانی کردن و زندان؛ سجّین: نام جایگاه یا ثبت بدکاران، بنا بر تفسیر.">السِّجنِ</button>
    <button class="word-link" type="button" data-word="بِضعَ" data-root="ب ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-dad-ayn/" data-root-meaning="بخش و پاره؛ بِضع: چند یا شماری اندک؛ بضاعة: کالا و سرمایهٔ قابل دادوستد.">بِضعَ</button>
    <button class="word-link" type="button" data-word="سِنينَ" data-root="س ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است.">سِنينَ</button>
  </p>
  <p class="farsi-verse">و به آن‌که گمان داشت از آن دو نجات می‌یابد گفت: مرا نزد سرورت یاد کن؛ پس شیطان یادکردن نزد سرورش را از خاطرش برد و چند سالی در زندان ماند.</p>
</section>
