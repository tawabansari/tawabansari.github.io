<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="وَإِخوَتِهِ" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادران؛ در سیاق مناسب، خواهران و برادران یا اعضای یک پیوند ایمانی.">وَإِخوَتِهِ</button>
    <button class="word-link" type="button" data-word="ءايٰتٌ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتٌ</button>
    <button class="word-link" type="button" data-word="لِلسّائِلينَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">لِلسّائِلينَ</button>
  </p>
  <p class="farsi-verse">در یوسف و برادرانش نشانه‌هایی برای پرسشگران بود.</p>
</section>
