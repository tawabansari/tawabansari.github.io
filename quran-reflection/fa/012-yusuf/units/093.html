<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۹۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اذهَبوا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">اذهَبوا</button>
    <button class="word-link" type="button" data-word="بِقَميصى" data-root="ق م ص" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِقَميصى</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="فَأَلقوهُ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">فَأَلقوهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="وَجهِ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»">وَجهِ</button>
    <button class="word-link" type="button" data-word="أَبى" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">أَبى</button>
    <button class="word-link" type="button" data-word="يَأتِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يَأتِ</button>
    <button class="word-link" type="button" data-word="بَصيرًا" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">بَصيرًا</button>
    <button class="word-link" type="button" data-word="وَأتونى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَأتونى</button>
    <button class="word-link" type="button" data-word="بِأَهلِكُم" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">بِأَهلِكُم</button>
    <button class="word-link" type="button" data-word="أَجمَعينَ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">أَجمَعينَ</button>
  </p>
  <p class="farsi-verse">این پیراهن مرا ببرید و بر چهره پدرم بیفکنید تا بینا شود و همه خانواده‌تان را نزد من بیاورید.</p>
</section>
