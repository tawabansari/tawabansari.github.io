  <p class="farsi-verse">گفت: او خواست مرا از خود به کام گیرد؛ و گواهی از خانواده او گواهی داد: اگر پیراهنش از پیش دریده شده، او راست گفته و یوسف از دروغ‌گویان است؛</p>
