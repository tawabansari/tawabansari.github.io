<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز نقل سخن یکی از برادران.">قالَ</button>
    <button class="word-link" type="button" data-word="قائِلٌ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گوینده‌ای؛ یکی از آنان که پیشنهاد خود را بیان کرد.">قائِلٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَقتُلوا" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="نکشید؛ نهی از کشتن یوسف.">تَقتُلوا</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="وَأَلقوهُ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="و او را بیفکنید؛ پیشنهاد انداختن یوسف در چاه.">وَأَلقوهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="غَيٰبَتِ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد" data-context="نهانگاه؛ بخش چاه که از دید پنهان می‌ماند.">غَيٰبَتِ</button>
    <button class="word-link" type="button" data-word="الجُبِّ" data-root="ج ب ب" data-root-meaning="بریدن و گردآمدن؛ جُبّ: چاه." data-context="چاه؛ در ترکیب «غیابت الجب»، چاهی که بخش پنهان آن برای افکندن یوسف پیشنهاد می‌شود." data-learn-more="/quran-terminology/fa/roots/j-b-b/">الجُبِّ</button>
    <button class="word-link" type="button" data-word="يَلتَقِطهُ" data-root="ل ق ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-q-tt/" data-root-meaning="پیدا کردن و از زمین برداشتن." data-context="او را پیدا کنند و برگیرند؛ احتمال یافتن یوسف به دست مسافران.">يَلتَقِطهُ</button>
    <button class="word-link" type="button" data-word="بَعضُ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی؛ پاره‌ای از مسافران، نه همهٔ آنان.">بَعضُ</button>
    <button class="word-link" type="button" data-word="السَّيّارَةِ" data-root="س ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-r/" data-root-meaning="رفتن و حرکت در مسیر؛ سیره: روش یا حالت." data-context="مسافران؛ گروهی که در مسیر سفر حرکت می‌کنند.">السَّيّارَةِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="هستید؛ در شرط «اگر می‌خواهید کاری کنید».">كُنتُم</button>
    <button class="word-link" type="button" data-word="فٰعِلينَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="اقدام‌کنندگان؛ اگر بر انجام کاری دربارهٔ یوسف تصمیم دارید.">فٰعِلينَ</button>
  </p>
  <p class="farsi-verse">یکی از آنان گفت: یوسف را نکشید و اگر کاری می‌کنید، او را در نهانگاه چاه بیفکنید تا برخی رهگذران او را برگیرند.</p>
</section>
