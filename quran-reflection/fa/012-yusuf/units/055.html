<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغازِ سخنِ نقل‌شده.">قالَ</button>
    <button class="word-link" type="button" data-word="اجعَلنى" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="مرا بگمار؛ درخواستِ مسئولیتِ خزانه‌ها.">اجعَلنى</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="خَزائِنِ" data-root="خ ز ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-z-n/" data-root-meaning="اندوختن و نگه داشتن؛ خزانه و نگهبان آن." data-context="خزانه‌ها؛ ذخیره‌گاه‌های سرزمین.">خَزائِنِ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="سرزمین؛ قلمروِ خزانه‌ها.">الأَرضِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="حَفيظٌ" data-root="ح ف ظ" data-root-meaning="نگه داشتن و مراقبت کردن از چیزی تا ضایع، فراموش، رها یا تباه نشود." data-context="نگهدارنده و امانت‌دار؛ وصفِ یوسف برای مسئولیتِ خزانه‌ها." data-learn-more="/quran-terminology/fa/roots/h-f-zha/">حَفيظٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ آگاه از کارِ سپرده‌شده.">عَليمٌ</button>
  </p>
  <p class="farsi-verse">گفت: مرا بر گنجینه‌های این سرزمین بگمار؛ من نگهبانی دانا هستم.</p>
</section>
