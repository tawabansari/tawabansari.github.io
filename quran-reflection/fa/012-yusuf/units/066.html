  <p class="farsi-verse">گفت: هرگز او را با شما نمی‌فرستم تا پیمانی از آن معبود یگانه به من بدهید که حتما او را نزد من بیاورید، مگر اینکه محاصره شوید؛ پس چون پیمانشان را به او دادند، گفت: آن معبود یگانه بر آنچه می‌گوییم کارساز است.</p>
