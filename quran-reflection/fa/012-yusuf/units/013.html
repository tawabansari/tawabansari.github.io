  <h2 class="ayah-title">یوسف ۱۲:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="لَيَحزُنُنى" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون">لَيَحزُنُنى</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَذهَبوا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">تَذهَبوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>

    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>

    <button class="word-link" type="button" data-word="الذِّئبُ" data-root="ذ أ ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الذِّئبُ</button>

    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="غٰفِلونَ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری">غٰفِلونَ</button>
  </p>
  <p class="farsi-verse">گفت: اینکه او را ببرید اندوهگینم می‌کند و می‌ترسم گرگ او را بخورد، در حالی که از او غافل باشید.</p>
