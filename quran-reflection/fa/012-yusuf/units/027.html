<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ در شرطِ جهت پارگی پیراهن.">كانَ</button>
    <button class="word-link" type="button" data-word="قَميصُهُ" data-root="ق م ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-sad/" data-root-meaning="پیراهن." data-context="پیراهن او؛ موضوع بررسی جهت پارگی.">قَميصُهُ</button>
    <button class="word-link" type="button" data-word="قُدَّ" data-root="ق د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-d-d/" data-root-meaning="درازا بریدن یا پاره کردن؛ قِدَد: بخش‌ها و راه‌های جدا." data-context="دریده شده باشد؛ دربارهٔ پیراهن.">قُدَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دُبُرٍ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت؛ جهتِ پارگی پیراهن در شرطِ آیه.">دُبُرٍ</button>
    <button class="word-link" type="button" data-word="فَكَذَبَت" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="پس او دروغ گفته است؛ دربارهٔ زن در نتیجهٔ شرط.">فَكَذَبَت</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راستگویان؛ یوسف در نتیجهٔ این شرط از آنان است.">الصّٰدِقينَ</button>
  </p>
  <p class="farsi-verse">و اگر پیراهنش از پشت دریده شده، او دروغ گفته و یوسف از راست‌گویان است.</p>
</section>
