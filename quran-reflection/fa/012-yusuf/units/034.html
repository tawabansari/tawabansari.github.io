<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاستَجابَ" data-root="ج و ب" data-root-meaning="جوب در کاربرد مادی، بریدن، شکافتن و گذشتن از میان چیزی است؛ و در کاربرد گفتاری و رفتاری، جواب و استجابت به پاسخ دادن در برابر سخن، درخواست یا دعوت اشاره دارند." data-learn-more="/quran-terminology/fa/roots/j-w-b/">فَاستَجابَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="رَبُّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّهُ</button>
    <button class="word-link" type="button" data-word="فَصَرَفَ" data-root="ص ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-f/" data-root-meaning="برگرداندن و دگرگون کردن؛ تصریف: گرداندن یا گوناگون بیان کردن.">فَصَرَفَ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="كَيدَهُنَّ" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است.">كَيدَهُنَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="السَّميعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن">السَّميعُ</button>
    <button class="word-link" type="button" data-word="العَليمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">العَليمُ</button>
  </p>
  <p class="farsi-verse">پس پروردگارش پاسخش داد و نیرنگشان را از او گرداند؛ او همان شنوای داناست.</p>
</section>
