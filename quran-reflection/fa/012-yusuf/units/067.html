  <p class="farsi-verse">و گفت: پسرانم، از یک در وارد نشوید و از درهای جداگانه وارد شوید؛ و من در برابر آن معبود یگانه هیچ کاری برایتان نمی‌توانم بکنم؛ حکم تنها از آنِ آن معبود یگانه است؛ بر او توکل کرده‌ام و توکل‌کنندگان باید بر او توکل کنند.</p>
