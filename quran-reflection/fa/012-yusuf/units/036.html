<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَدَخَلَ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="و وارد شد؛ ورود دو جوان به زندان همراه یوسف.">وَدَخَلَ</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="السِّجنَ" data-root="س ج ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-j-n/" data-root-meaning="زندانی کردن و زندان؛ سجّین: نام جایگاه یا ثبت بدکاران، بنا بر تفسیر." data-context="زندان؛ محل ورود و گفت‌وگوی دو جوان با یوسف.">السِّجنَ</button>
    <button class="word-link" type="button" data-word="فَتَيانِ" data-root="ف ت ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-y/" data-root-meaning="جوان و جوانی؛ فتوا: پاسخ و روشن کردن مسئله." data-context="دو جوان؛ همراهان یوسف در زندان.">فَتَيانِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز بیان رؤیای جوان نخست.">قالَ</button>
    <button class="word-link" type="button" data-word="أَحَدُهُما" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="یکی از آن دو؛ جوانی که از فشردن شراب سخن می‌گوید.">أَحَدُهُما</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَرىٰنى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="خود را می‌بینم؛ گزارش رؤیای جوان نخست.">أَرىٰنى</button>
    <button class="word-link" type="button" data-word="أَعصِرُ" data-root="ع ص ر" data-root-meaning="عصر در کاربرد مادی، فشردن و بیرون آوردن مایع است؛ در کاربرد زمانی، به وقت و روزگار اشاره دارد؛ و در صورت‌های مربوط به باد و باران، باید معنای خاص هر مشتق را از ساخت و سیاق آن شناخت." data-learn-more="/quran-terminology/fa/roots/ayn-sad-r/" data-context="می‌فشارم؛ فشردنِ آنچه برای شراب است در گزارش رؤیا.">أَعصِرُ</button>
    <button class="word-link" type="button" data-word="خَمرًا" data-root="خ م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-m-r/" data-root-meaning="پوشاندن؛ خمر: نوشیدنی مست‌کننده؛ خمار: پوشش سر، بنا بر کاربرد واژه." data-context="شراب؛ نوشیدنیِ مورد اشاره در رؤیا.">خَمرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ آغاز سخن جوان دیگر.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الـٔاخَرُ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="دیگری؛ جوان دوم از آن دو.">الـٔاخَرُ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَرىٰنى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="خود را می‌بینم؛ گزارش رؤیای جوان دوم.">أَرىٰنى</button>
    <button class="word-link" type="button" data-word="أَحمِلُ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="حمل می‌کنم؛ بردن نان بالای سر در رؤیا." data-learn-more="/quran-terminology/fa/roots/h-m-l/">أَحمِلُ</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بالای؛ جایگاه نان نسبت به سر.">فَوقَ</button>
    <button class="word-link" type="button" data-word="رَأسى" data-root="ر أ س" data-root-meaning="سر؛ و در گسترش معنا، بخش بالایی، آغازین یا اصلی چیزی؛ رأس المال: اصل دارایی." data-context="سرم؛ نان در رؤیا بالای آن حمل می‌شود." data-learn-more="/quran-terminology/fa/roots/r-a-s/">رَأسى</button>
    <button class="word-link" type="button" data-word="خُبزًا" data-root="خ ب ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-b-z/" data-root-meaning="نان و پختن نان." data-context="نان؛ آنچه در رؤیا بالای سر حمل می‌شود.">خُبزًا</button>
    <button class="word-link" type="button" data-word="تَأكُلُ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="می‌خورند؛ خوردن پرندگان از نان.">تَأكُلُ</button>
    <button class="word-link" type="button" data-word="الطَّيرُ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق." data-context="پرندگان؛ خورندگانِ نان در رؤیا.">الطَّيرُ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="نَبِّئنا" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="ما را آگاه کن؛ درخواستِ توضیح رؤیا از یوسف.">نَبِّئنا</button>
    <button class="word-link" type="button" data-word="بِتَأويلِهِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="از تأویل آن؛ توضیحِ مرجع و فرجام رؤیای گزارش‌شده.">بِتَأويلِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="نَرىٰكَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="تو را می‌بینیم و می‌شناسیم؛ داوری دو جوان دربارهٔ یوسف.">نَرىٰكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوکاران؛ وصفی که دو جوان برای یوسف می‌شناسند.">المُحسِنينَ</button>
  </p>
  <p class="farsi-verse">و دو جوان همراهش وارد زندان شدند؛ یکی گفت: من خود را می‌بینم که شراب می‌فشارم؛ و دیگری گفت: من خود را می‌بینم که بر سرم نانی می‌برم و پرندگان از آن می‌خورند؛ ما را از تأویلش خبر بده؛ ما تو را از نیکوکاران می‌بینیم.</p>
</section>
