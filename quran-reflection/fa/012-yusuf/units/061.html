<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="سَنُرٰوِدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">سَنُرٰوِدُ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="أَباهُ" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">أَباهُ</button>
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَفٰعِلونَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">لَفٰعِلونَ</button>
  </p>
  <p class="farsi-verse">گفتند: درباره او با پدرش گفت‌وگو می‌کنیم و حتما چنین خواهیم کرد.</p>
