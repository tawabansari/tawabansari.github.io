<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاستَبَقَا" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/" data-root-meaning="پیش افتادن، پیشی گرفتن و سبقت جستن؛ از مسابقه و تقدم زمانی تا پیشگامی در کارهای نیک و پیشی‌ناپذیری در برابر اراده آن معبود یگانه" data-context="و آن دو به سوی در شتافتند؛ فعل باب افتعال برای یوسف و آن زن، با مقصدِ «الباب».">وَاستَبَقَا</button>
    <button class="word-link" type="button" data-word="البابَ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون." data-context="در؛ مفعولِ شتافتن در این ساخت و مقصد حرکت آن دو.">البابَ</button>
    <button class="word-link" type="button" data-word="وَقَدَّت" data-root="ق د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-d-d/" data-root-meaning="درازا بریدن یا پاره کردن؛ قِدَد: بخش‌ها و راه‌های جدا." data-context="و آن زن درید؛ فعل با فاعل مؤنث، دربارهٔ پاره کردن پیراهن یوسف.">وَقَدَّت</button>
    <button class="word-link" type="button" data-word="قَميصَهُ" data-root="ق م ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-sad/" data-root-meaning="پیراهن." data-context="پیراهن او؛ «ه» به یوسف بازمی‌گردد و پیراهن مفعولِ دریدن است.">قَميصَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دُبُرٍ" data-root="د ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پایانی؛ روی گرداندن؛ تدبیر و تدبّر: توجه به پیامد و سامان دادن." data-context="از پشت؛ «دُبُر» جهتِ پاره شدن پیراهن را در ترکیب «من دبر» مشخص می‌کند.">دُبُرٍ</button>
    <button class="word-link" type="button" data-word="وَأَلفَيا" data-root="ل ف و" data-root-meaning="یافتن و روبه‌رو شدن با شخص، چیز یا وضعیتی موجود؛ بدون دلالت ذاتی بر پذیرفتن یا پیروی کردن." data-learn-more="/quran-terminology/fa/roots/l-f-w/" data-context="و آن دو یافتند؛ یوسف و آن زن شوهر او را کنار در یافتند، بدون اینکه فعل به‌تنهایی جستجوی قبلی را ثابت کند.">وَأَلفَيا</button>
    <button class="word-link" type="button" data-word="سَيِّدَها" data-root="س و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-d/" data-root-meaning="سیاهی؛ در شاخه‌ای دیگر، سیادت و سروری." data-context="شوهر آن زن؛ «سید» در این سیاق به همسر او اشاره دارد و ضمیر «ها» به آن زن بازمی‌گردد.">سَيِّدَها</button>
    <button class="word-link" type="button" data-word="لَدَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدَا</button>
    <button class="word-link" type="button" data-word="البابِ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون." data-context="در؛ مکانِ یافتن شوهر در ترکیب «لدا الباب».">البابِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="آن زن گفت؛ فعل ماضی مؤنث که آغاز گفتار او به شوهرش را نشان می‌دهد.">قالَت</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="جَزاءُ" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="جزا یا کیفر؛ موضوع پرسشِ زن دربارهٔ کسی که او به قصد بد متهم می‌کند.">جَزاءُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="أَرادَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="قصد کرده باشد؛ فعل دربارهٔ نیتی که زن به شخص مورد اتهام نسبت می‌دهد، نه تأیید راستیِ اتهام از سوی خود فعل.">أَرادَ</button>
    <button class="word-link" type="button" data-word="بِأَهلِكَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="نسبت به خانواده‌ات؛ در این خطاب، ناظر به همسر مخاطب در چارچوب خانوادهٔ او.">بِأَهلِكَ</button>
    <button class="word-link" type="button" data-word="سوءًا" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی یا آسیبی؛ مفعولِ قصد کردن در گفتار اتهام‌آمیز زن.">سوءًا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُسجَنَ" data-root="س ج ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-j-n/" data-root-meaning="زندانی کردن و زندان؛ سجّین: نام جایگاه یا ثبت بدکاران، بنا بر تفسیر." data-context="زندانی شود؛ فعل مضارع مجهول، در بیان یکی از کیفرهای پیشنهادی در گفتار زن.">يُسجَنَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب یا کیفری؛ گزینهٔ دیگر در سخن زن، در کنار زندانی شدن.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد" data-context="دردناک؛ وصفِ عذاب و بیان رنج‌آور بودن آن.">أَليمٌ</button>
  </p>
  <p class="farsi-verse">و هر دو به سوی در شتافتند و او پیراهنش را از پشت درید و شوهر او را کنار در یافتند؛ گفت: جزای کسی که برای خانواده‌ات بدی بخواهد چیست، جز اینکه زندانی شود یا عذابی دردناک ببیند؟</p>
</section>
