<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءو" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="و آمدند؛ برادران یوسف نزد پدر بازگشتند.">وَجاءو</button>
    <button class="word-link" type="button" data-word="أَباهُم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان" data-context="پدرشان؛ یعقوب، که برادران یوسف نزد او آمدند.">أَباهُم</button>
    <button class="word-link" type="button" data-word="عِشاءً" data-root="ع ش و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-w/" data-root-meaning="بخش پایانی روز و شامگاه؛ عَشو: کم‌دیدن یا چشم پوشیدن." data-context="شامگاه؛ زمان آمدن برادران یوسف نزد پدر.">عِشاءً</button>
    <button class="word-link" type="button" data-word="يَبكونَ" data-root="ب ك ي" data-root-meaning="«ب ک ي» به گریستن اشاره دارد؛ بروز حالتی که می‌تواند با اشک، صدای زاری یا اندوه و تاثر همراه باشد. در ساختمان سببی، به گریاندن یا سبب گریستن شدن می‌رسد." data-context="گریان؛ حالت برادران یوسف هنگام آمدن نزد پدر و بیان روایت دروغینشان." data-learn-more="/quran-terminology/fa/roots/b-k-y/">يَبكونَ</button>
  </p>
  <p class="farsi-verse">و شبانگاه گریان نزد پدرشان آمدند.</p>
</section>
