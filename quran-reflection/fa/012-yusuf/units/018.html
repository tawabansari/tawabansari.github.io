<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءو" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="و آوردند">وَجاءو</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَميصِهِ" data-root="ق م ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-sad/" data-root-meaning="پیراهن." data-context="پیراهن او">قَميصِهِ</button>
    <button class="word-link" type="button" data-word="بِدَمٍ" data-root="د م و" data-root-meaning="خون؛ مایع حیاتی بدن انسان و حیوان. «دَم» مفرد و «دِمَاء» جمع آن است؛ خون‌ریزی، حکم خوراکی و دیگر دلالت‌ها از ترکیب و سیاق روشن می‌شوند. دربارهٔ حرف سوم، تحلیل‌های «د م و» و «د م ي» وجود دارد." data-learn-more="/quran-terminology/fa/roots/d-m-w/" data-context="با خونی">بِدَمٍ</button>
    <button class="word-link" type="button" data-word="كَذِبٍ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="دروغین؛ وسیلهٔ اثبات ادعایی دروغین">كَذِبٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت">قالَ</button>
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="سَوَّلَت" data-root="س و ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-l/" data-root-meaning="خواسته نفس؛ تسویل: آراستن و خواستنی جلوه دادن." data-context="آراسته و آسان جلوه داده است">سَوَّلَت</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَنفُسُكُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="نفس‌های شما">أَنفُسُكُم</button>
    <button class="word-link" type="button" data-word="أَمرًا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا؛ نیز کار، شأن و رخداد در کاربرد اسمی." data-context="کاری؛ ماجرایی">أَمرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَصَبرٌ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="پس صبری">فَصَبرٌ</button>
    <button class="word-link" type="button" data-word="جَميلٌ" data-root="ج م ل" data-root-meaning="زیبایی و نیکویی؛ و در شاخه‌ای دیگر، مجموعه و بزرگی؛ جَمَل نام شتر است." data-context="نیکو و شایسته" data-learn-more="/quran-terminology/fa/roots/j-m-l/">جَميلٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="المُستَعانُ" data-root="ع و ن" data-learn-more="/quran-terminology/fa/roots/ayn-w-n/" data-root-meaning="یاری، افزودن توان، طلب پشتیبانی و رسیدن به مرحلهٔ میانی" data-context="کسی که از او یاری خواسته می‌شود">المُستَعانُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تَصِفونَ" data-root="و ص ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-sad-f/" data-root-meaning="وصف و بیان ویژگی." data-context="وصف می‌کنید">تَصِفونَ</button>
  </p>
  <p class="farsi-verse">و بر پیراهنش خونی دروغین آوردند؛ گفت: بلکه نفس‌هایتان کاری را برایتان آراسته است؛ پس شکیبایی‌ای نیکو؛ و آن معبود یگانه است که در برابر آنچه وصف می‌کنید از او یاری خواسته می‌شود.</p>
</section>
