    <button class="word-link" type="button" data-word="مُتَّكَـًٔا" data-root="و ك أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-a/" data-root-meaning="تکیه کردن و قرار گرفتن بر تکیه‌گاه.">مُتَّكَـًٔا</button>

    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِنَّ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="رَأَينَهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">رَأَينَهُ</button>
    <button class="word-link" type="button" data-word="أَكبَرنَهُ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">أَكبَرنَهُ</button>

    <button class="word-link" type="button" data-word="أَيدِيَهُنَّ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">أَيدِيَهُنَّ</button>

    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>

    <button class="word-link" type="button" data-word="بَشَرًا" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">بَشَرًا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَلَكٌ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">مَلَكٌ</button>
    <button class="word-link" type="button" data-word="كَريمٌ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی.">كَريمٌ</button>
  </p>
  <p class="farsi-verse">پس چون از نیرنگشان شنید، به دنبالشان فرستاد و برایشان تکیه‌گاهی آماده کرد و به هرکدام کاردی داد و گفت: بر آنان بیرون آی؛ پس چون او را دیدند بزرگش شمردند و دست‌هایشان را بریدند و گفتند: پاکا آن معبود یگانه، این بشر نیست؛ این جز فرشته‌ای گرامی نیست.</p>
</section>
