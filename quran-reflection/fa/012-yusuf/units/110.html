  <p class="farsi-verse">تا هنگامی که رسولان نومید شدند و گمان کردند که به آنان دروغ گفته شده است، یاری ما به آنان رسید؛ پس هرکه را می‌خواستیم نجات یافت؛ و سختی ما از مردم مجرم برگردانده نمی‌شود.</p>
