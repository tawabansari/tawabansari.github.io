<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ آغاز بیان رؤیای پادشاه.">وَقالَ</button>
    <button class="word-link" type="button" data-word="المَلِكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="پادشاه؛ گویندهٔ گزارش رؤیا.">المَلِكُ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینم؛ دیدنِ صحنه‌ها در رؤیا.">أَرىٰ</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ گاوهای فربه در رؤیا." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="بَقَرٰتٍ" data-root="ب ق ر" data-learn-more="/quran-terminology/fa/roots/b-q-r/" data-root-meaning="گاو، گاوان، جنس گاو؛ همراه با تفکیک کاربرد قرآنی از شاخهٔ لغوی شکافتن و گشودن در عربی." data-context="گاوها؛ حیواناتِ فربهِ رؤیا.">بَقَرٰتٍ</button>
    <button class="word-link" type="button" data-word="سِمانٍ" data-root="س م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-m-n/" data-root-meaning="فربهی و چاق شدن." data-context="فربه؛ وصفِ هفت گاوِ نخست.">سِمانٍ</button>
    <button class="word-link" type="button" data-word="يَأكُلُهُنَّ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="آنها را می‌خورند؛ خوردن گاوهای فربه به دست لاغرها.">يَأكُلُهُنَّ</button>
    <button class="word-link" type="button" data-word="سَبعٌ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ گاوهای لاغرِ خورنده در رؤیا." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعٌ</button>
    <button class="word-link" type="button" data-word="عِجافٌ" data-root="ع ج ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-f/" data-root-meaning="لاغری و کم‌گوشتی شدید." data-context="لاغر؛ وصفِ هفت گاوِ خورنده.">عِجافٌ</button>
    <button class="word-link" type="button" data-word="وَسَبعَ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ خوشه‌های سبز در رؤیا." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">وَسَبعَ</button>
    <button class="word-link" type="button" data-word="سُنبُلٰتٍ" data-root="س ن ب ل" data-root-meaning="خوشهٔ غله؛ بخش دانه‌دار گیاه که دانه‌های محصول در آن پدید می‌آیند و کنار یکدیگر قرار می‌گیرند." data-context="خوشه‌ها؛ خوشه‌های سبز در رؤیا." data-learn-more="/quran-terminology/fa/roots/s-n-b-l/">سُنبُلٰتٍ</button>
    <button class="word-link" type="button" data-word="خُضرٍ" data-root="خ ض ر" data-root-meaning="سبزی و رنگ سبز؛ در کاربرد گیاهی، تازگی و شادابی." data-context="سبز؛ وصفِ خوشه‌ها." data-learn-more="/quran-terminology/fa/roots/kh-dad-r/">خُضرٍ</button>
    <button class="word-link" type="button" data-word="وَأُخَرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="و دیگر؛ خوشه‌هایی در برابرِ سبزها.">وَأُخَرَ</button>
    <button class="word-link" type="button" data-word="يابِسٰتٍ" data-root="ي ب س" data-learn-more="/quran-terminology/fa/roots/y-b-s/" data-root-meaning="خشک‌شدن یا خشک‌بودن؛ قرارگرفتن در حالتی مقابل رطوبت و تری." data-context="خشک؛ وصفِ خوشه‌های دیگر.">يابِسٰتٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="المَلَأُ" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه." data-context="بزرگان و سران؛ مخاطبانِ درخواست پادشاه.">المَلَأُ</button>
    <button class="word-link" type="button" data-word="أَفتونى" data-root="ف ت ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-y/" data-root-meaning="جوان و جوانی؛ فتوا: پاسخ و روشن کردن مسئله." data-context="به من پاسخ دهید؛ درخواستِ تعبیر رؤیا.">أَفتونى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="رُءيٰىَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="رؤیای من؛ موضوعِ درخواستِ پاسخ.">رُءيٰىَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="هستید؛ شرطِ تواناییِ تعبیر.">كُنتُم</button>
    <button class="word-link" type="button" data-word="لِلرُّءيا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="رؤیا؛ موضوعِ تعبیر کردن.">لِلرُّءيا</button>
    <button class="word-link" type="button" data-word="تَعبُرونَ" data-root="ع ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-b-r/" data-root-meaning="گذشتن از یک سو به سوی دیگر؛ عبرت و تعبیر: از نشانه به معنا رسیدن." data-context="تعبیر می‌کنید؛ فهم و بیانِ معنای رؤیا.">تَعبُرونَ</button>
  </p>
  <p class="farsi-verse">و پادشاه گفت: من هفت گاو فربه می‌بینم که هفت گاو لاغر آن‌ها را می‌خورند و هفت خوشه سبز و دیگرانی خشک؛ ای سران، اگر خواب تعبیر می‌کنید، درباره خوابم به من پاسخ دهید.</p>
</section>
