<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يوسُفُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفُ</button>
    <button class="word-link" type="button" data-word="أَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيُّهَا</button>
    <button class="word-link" type="button" data-word="الصِّدّيقُ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">الصِّدّيقُ</button>
    <button class="word-link" type="button" data-word="أَفتِنا" data-root="ف ت ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-y/" data-root-meaning="جوان و جوانی؛ فتوا: پاسخ و روشن کردن مسئله.">أَفتِنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَبعِ" data-root="س ب ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/" data-root-meaning="عدد هفت؛ سَبُع: جانور درنده.">سَبعِ</button>
    <button class="word-link" type="button" data-word="بَقَرٰتٍ" data-root="ب ق ر" data-learn-more="/quran-terminology/fa/roots/b-q-r/" data-root-meaning="گاو، گاوان، جنس گاو؛ همراه با تفکیک کاربرد قرآنی از شاخهٔ لغوی شکافتن و گشودن در عربی.">بَقَرٰتٍ</button>
    <button class="word-link" type="button" data-word="سِمانٍ" data-root="س م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-m-n/" data-root-meaning="فربهی و چاق شدن.">سِمانٍ</button>
    <button class="word-link" type="button" data-word="يَأكُلُهُنَّ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">يَأكُلُهُنَّ</button>
    <button class="word-link" type="button" data-word="سَبعٌ" data-root="س ب ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/" data-root-meaning="عدد هفت؛ سَبُع: جانور درنده.">سَبعٌ</button>
    <button class="word-link" type="button" data-word="عِجافٌ" data-root="ع ج ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-f/" data-root-meaning="لاغری و کم‌گوشتی شدید.">عِجافٌ</button>
    <button class="word-link" type="button" data-word="وَسَبعِ" data-root="س ب ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/" data-root-meaning="عدد هفت؛ سَبُع: جانور درنده.">وَسَبعِ</button>
    <button class="word-link" type="button" data-word="سُنبُلٰتٍ" data-root="س ن ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-b-l/" data-root-meaning="خوشه غله و خوشه دادن.">سُنبُلٰتٍ</button>
    <button class="word-link" type="button" data-word="خُضرٍ" data-root="خ ض ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-dad-r/" data-root-meaning="رنگ سبز و سبز شدن گیاه یا زمین.">خُضرٍ</button>
    <button class="word-link" type="button" data-word="وَأُخَرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">وَأُخَرَ</button>
    <button class="word-link" type="button" data-word="يابِسٰتٍ" data-root="ي ب س" data-learn-more="/quran-terminology/fa/roots/y-b-s/" data-root-meaning="خشک‌شدن یا خشک‌بودن؛ قرارگرفتن در حالتی مقابل رطوبت و تری.">يابِسٰتٍ</button>
    <button class="word-link" type="button" data-word="لَعَلّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلّى</button>
    <button class="word-link" type="button" data-word="أَرجِعُ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">أَرجِعُ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">یوسف، ای بسیار راست‌گو، درباره هفت گاو فربه که هفت گاو لاغر آن‌ها را می‌خورند و هفت خوشه سبز و دیگرانی خشک به ما پاسخ بده، شاید نزد مردم بازگردم تا بدانند.</p>
</section>
