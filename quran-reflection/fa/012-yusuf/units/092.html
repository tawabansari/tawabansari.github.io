<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۹۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="یوسف در پاسخ اعتراف برادران گفت.">قالَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَثريبَ" data-root="ث ر ب" data-root-meaning="«ث ر ب» در شاخه مربوط به رفتار انسانی، به سرزنش و بازخواست ملامت‌آمیز شخص به سبب خطا اشاره دارد؛ به‌ویژه هنگامی که آن خطا یادآوری می‌شود و شخص مورد عیب‌جویی یا سرکوفت قرار می‌گیرد." data-context="سرزنش و سرکوفت دربارهٔ خطای برادران؛ در «لا تثريب» نبودِ این ملامت اعلام می‌شود، پس از اعتراف آنان به خطا." data-learn-more="/quran-terminology/fa/roots/th-r-b/">تَثريبَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُمُ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="امروز و در این موقعیتِ رویارویی و گذشت.">اليَومَ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَغفِرُ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="خداوند شما را بیامرزد؛ در خوانش دعایی، یوسف آمرزش برادران را از خداوند می‌خواهد.">يَغفِرُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="أَرحَمُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربان‌تر و دارای رحمت بیشتر؛ در ساخت تفضیل «أرحم الراحمين».">أَرحَمُ</button>
    <button class="word-link" type="button" data-word="الرّٰحِمينَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربانان و رحمت‌کنندگان؛ جمعِ راحم، در عبارت «أرحم الراحمين».">الرّٰحِمينَ</button>
  </p>
  <p class="farsi-verse">گفت: امروز هیچ سرزنشی بر شما نیست؛ آن معبود یگانه شما را بیامرزد و او مهربان‌ترین مهربانان است.</p>
</section>
