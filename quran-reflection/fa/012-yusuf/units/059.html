<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="جَهَّزَهُم" data-root="ج ه ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h2-z/" data-root-meaning="آماده کردن توشه و وسایل؛ جهاز: سازوبرگ و بارِ آمادهٔ سفر یا کار.">جَهَّزَهُم</button>
    <button class="word-link" type="button" data-word="بِجَهازِهِم" data-root="ج ه ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h2-z/" data-root-meaning="آماده کردن توشه و وسایل؛ جهاز: سازوبرگ و بارِ آمادهٔ سفر یا کار.">بِجَهازِهِم</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="ائتونى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ائتونى</button>
    <button class="word-link" type="button" data-word="بِأَخٍ" data-root="أ خ و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر و خواهر؛ و به گسترش معنا، پیوند خویشاوندی، همراهی یا تعلق مشترک.">بِأَخٍ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَبيكُم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">أَبيكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="تَرَونَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَونَ</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّى</button>
    <button class="word-link" type="button" data-word="أوفِى" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا">أوفِى</button>
    <button class="word-link" type="button" data-word="الكَيلَ" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد">الكَيلَ</button>
    <button class="word-link" type="button" data-word="وَأَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنا۠</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرُ</button>
    <button class="word-link" type="button" data-word="المُنزِلينَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">المُنزِلينَ</button>
  </p>
  <p class="farsi-verse">و چون سازوبرگشان را آماده کرد، گفت: برادری را که از پدرتان دارید نزد من بیاورید؛ آیا نمی‌بینید که پیمانه را تمام می‌دهم و بهترین میزبانم؟</p>
</section>
