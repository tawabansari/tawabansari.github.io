<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="نَجا" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">نَجا</button>
    <button class="word-link" type="button" data-word="مِنهُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُما</button>
    <button class="word-link" type="button" data-word="وَادَّكَرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَادَّكَرَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدَ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنا۠</button>
    <button class="word-link" type="button" data-word="أُنَبِّئُكُم" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">أُنَبِّئُكُم</button>
    <button class="word-link" type="button" data-word="بِتَأويلِهِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">بِتَأويلِهِ</button>
    <button class="word-link" type="button" data-word="فَأَرسِلونِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">فَأَرسِلونِ</button>
  </p>
  <p class="farsi-verse">و آن‌که از آن دو نجات یافته بود و پس از مدتی به یاد آورد گفت: من شما را از تأویل آن خبر می‌دهم؛ پس مرا بفرستید.</p>
</section>
