<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۷۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جَهَّزَهُم" data-root="ج ه ز" data-root-meaning="فراهم کردن لوازم و آماده‌سازی برای مقصودی مشخص؛ جَهَاز: مجموعهٔ بار، وسایل و تدارکات." data-context="آنان را آماده کرد؛ فراهم کردن دوبارهٔ بار و تدارکات برادران." data-learn-more="/quran-terminology/fa/roots/j-h2-z/">جَهَّزَهُم</button>
    <button class="word-link" type="button" data-word="بِجَهازِهِم" data-root="ج ه ز" data-root-meaning="فراهم کردن لوازم و آماده‌سازی برای مقصودی مشخص؛ جَهَاز: مجموعهٔ بار، وسایل و تدارکات." data-context="با بار و توشه‌شان؛ مجموعهٔ تدارکات آماده‌شده برای کاروان." data-learn-more="/quran-terminology/fa/roots/j-h2-z/">بِجَهازِهِم</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد؛ نهادن ظرف در بار برادرش.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="السِّقايَةَ" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب." data-context="ظرف آب‌خوری؛ ظرفی که در بار برادر یوسف گذاشته شد.">السِّقايَةَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="رَحلِ" data-root="ر ح ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-h-l/" data-root-meaning="بار و سازوبرگ سفر؛ کوچ و سفر کردن." data-context="بار و وسایل سفر؛ جای قرار گرفتن ظرف.">رَحلِ</button>
    <button class="word-link" type="button" data-word="أَخيهِ" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر؛ در سیاق مناسب، هم‌قوم یا هم‌پیوند." data-context="برادرش؛ برادر یوسف که ظرف در بار او نهاده شد.">أَخيهِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَذَّنَ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="ندا داد؛ اعلامِ خطاب به کاروان.">أَذَّنَ</button>
    <button class="word-link" type="button" data-word="مُؤَذِّنٌ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="ندا‌دهنده‌ای؛ کسی که اعلام را بر زبان آورد.">مُؤَذِّنٌ</button>
    <button class="word-link" type="button" data-word="أَيَّتُهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيَّتُهَا</button>
    <button class="word-link" type="button" data-word="العيرُ" data-root="ع ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-y-r/" data-root-meaning="عیر: کاروان و باربران آن." data-context="کاروان؛ جماعتِ مسافران همراه با بارهایشان که خطاب می‌شوند.">العيرُ</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="لَسٰرِقونَ" data-root="س ر ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-q/" data-root-meaning="پنهانی برداشتن مال یا چیزی که حق آن نیست." data-context="قطعاً دزد هستید؛ اتهامی که ندا‌دهنده به مخاطبان اعلام کرد.">لَسٰرِقونَ</button>
  </p>
  <p class="farsi-verse">پس چون سازوبرگشان را آماده کرد، جام را در بار برادرش گذاشت؛ سپس نداکننده‌ای ندا داد: ای کاروان، شما دزد هستید.</p>
</section>
