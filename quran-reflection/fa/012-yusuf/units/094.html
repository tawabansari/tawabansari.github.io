<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="فَصَلَتِ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="حرکت کرد و از محل پیشین جدا شد؛ دربارهٔ کاروان." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">فَصَلَتِ</button>
    <button class="word-link" type="button" data-word="العيرُ" data-root="ع ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-y-r/" data-root-meaning="عیر: کاروان و باربران آن." data-context="کاروان.">العيرُ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت.">قالَ</button>
    <button class="word-link" type="button" data-word="أَبوهُم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان" data-context="پدرشان.">أَبوهُم</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="لَأَجِدُ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="بی‌گمان احساس می‌کنم و درمی‌یابم.">لَأَجِدُ</button>
    <button class="word-link" type="button" data-word="ريحَ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-context="بویِ؛ در ترکیبِ بوی یوسف." data-root-meaning="باد، نفس، گشایش و روح؛ و در کاربرد «ریح»، بو و اثرِ دریافت‌شده با بویایی نیز آمده است.">ريحَ</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَولا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُفَنِّدونِ" data-root="ف ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-n-d/" data-root-meaning="ناتوانی رأی؛ تفنید: نسبت خطا، سستی رأی یا بی‌خردی دادن." data-context="مرا به سستیِ رأی یا بی‌خردی نسبت دهید.">تُفَنِّدونِ</button>
  </p>
  <p class="farsi-verse">و چون کاروان جدا شد، پدرشان گفت: من بوی یوسف را می‌یابم، اگر مرا کم‌خرد نشمارید.</p>
</section>
