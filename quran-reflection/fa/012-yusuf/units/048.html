<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَأتى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="می‌آید؛ فرارسیدنِ دورهٔ دشوار.">يَأتى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ ترتیبِ دورهٔ دشوار نسبت به نخستین دوره.">بَعدِ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="سَبعٌ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ سال‌های سخت که از سیاقِ پیشین شناخته می‌شوند." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعٌ</button>
    <button class="word-link" type="button" data-word="شِدادٌ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="سخت؛ وصفِ هفت سالِ بعد.">شِدادٌ</button>
    <button class="word-link" type="button" data-word="يَأكُلنَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="می‌خورند؛ مصرف شدن ذخیره‌ها در سال‌های سخت.">يَأكُلنَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="قَدَّمتُم" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن" data-context="پیش‌تر آماده کردید؛ ذخیره‌سازی برای سال‌های سخت.">قَدَّمتُم</button>
    <button class="word-link" type="button" data-word="لَهُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُنَّ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندکی؛ مقدارِ محفوظ از مصرف.">قَليلًا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="تُحصِنونَ" data-root="ح ص ن" data-root-meaning="ریشهٔ «ح ص ن» در عربی بر حفاظت، پاسداری و مصون قرار دادن چیزی در برابر دسترسی یا تعرض دلالت دارد. «حِصْن» جایگاهی است که از آنچه درون آن است محافظت می‌کند؛ «تحصین» عمل استوار و محفوظ ساختن است؛ و «احصان» می‌تواند در زمینه‌های مادی، رفتاری و اجتماعی به کار رود." data-context="نگه می‌دارید و محفوظ می‌سازید؛ دربارهٔ بخشی از ذخیره." data-learn-more="/quran-terminology/fa/roots/h-sad-n/">تُحصِنونَ</button>
  </p>
  <p class="farsi-verse">سپس پس از آن هفت سال سخت می‌آید که آنچه برایشان پیش انداخته‌اید می‌خورند، جز اندکی که نگاه می‌دارید.</p>
</section>
