  <p class="farsi-verse">پروردگارا، به من از فرمانروایی داده‌ای و از تأویل سخنان آموخته‌ای؛ ای پدیدآورنده آسمان‌ها و زمین، تو در دنیا و آخرت سرپرست منی؛ مرا تسلیم‌شده برگیر و به شایستگان بپیوند.</p>
