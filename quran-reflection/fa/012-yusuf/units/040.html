  <p class="farsi-verse">جز او چیزی جز نام‌هایی نمی‌پرستید که شما و پدرانتان نامیده‌اید و آن معبود یگانه هیچ حجتی برای آن‌ها فرو نفرستاده است؛ حکم تنها از آنِ آن معبود یگانه است؛ فرمان داده جز او را نپرستید؛ این دین استوار است، ولی بیشتر مردم نمی‌دانند.</p>
