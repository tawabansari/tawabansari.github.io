<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ پاسخِ جویندگانِ ظرف به پرسشِ کاروان">قالوا</button>
    <button class="word-link" type="button" data-word="نَفقِدُ" data-root="ف ق د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-d/" data-root-meaning="نبودن چیزی و از دست دادن؛ تفقّد: سراغ گرفتن و بررسی کردن." data-context="گم کرده‌ایم و در پی آن هستیم؛ دربارهٔ پیمانهٔ پادشاه">نَفقِدُ</button>
    <button class="word-link" type="button" data-word="صُواعَ" data-root="ص و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-ayn/" data-root-meaning="صواع: پیمانه یا جام؛ در شاخه‌ای دیگر، پراکندگی." data-context="پیمانه یا جامِ پادشاه؛ ظرفی که گم‌شدن آن اعلام شده است">صُواعَ</button>
    <button class="word-link" type="button" data-word="المَلِكِ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="پادشاه؛ صاحبِ ظرفِ موردِ جست‌وجو">المَلِكِ</button>
    <button class="word-link" type="button" data-word="وَلِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلِمَن</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="بیاورد؛ ظرفِ گمشده را بازگرداند">جاءَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="حِملُ" data-root="ح م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-l/" data-root-meaning="برداشتن و حمل کردن بار؛ بر عهده گرفتن؛ نیز بارداری." data-context="بار؛ مقدار محموله‌ای که یک شتر حمل می‌کند، به‌عنوان پاداش">حِملُ</button>
    <button class="word-link" type="button" data-word="بَعيرٍ" data-root="ب ع ر" data-root-meaning="بعیر نام شتر، نر یا ماده، است؛ در دو کاربرد قرآنی، ظرفیت حمل بار آن برای بیان مقدار آذوقه یا پاداش به کار می‌رود. شاخهٔ دیگر ریشه، بعر به معنای سرگین، در قرآن نیامده است." data-context="یک شتر؛ در ترکیبِ «بار یک شتر»، معیارِ مقدار پاداش" data-learn-more="/quran-terminology/fa/roots/b-ayn-r/">بَعيرٍ</button>
    <button class="word-link" type="button" data-word="وَأَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنا۠</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="زَعيمٌ" data-root="ز ع م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-ayn-m/" data-root-meaning="ادعا و گفتار؛ زعیم: عهده‌دار یا ضامن، بنا بر سیاق." data-context="ضامن و عهده‌دار؛ کسی که پرداخت پاداش را تضمین می‌کند">زَعيمٌ</button>
  </p>
  <p class="farsi-verse">گفتند: پیمانه پادشاه را گم کرده‌ایم؛ و هرکه آن را بیاورد یک بار شتر دارد و من ضامن آنم.</p>
</section>
