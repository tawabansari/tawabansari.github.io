<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ پرسش‌کننده، ماجرای زنان را جویا می‌شود.">قالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="خَطبُكُنَّ" data-root="خ ط ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-tt-b/" data-root-meaning="خطاب و گفت‌وگو؛ خطبه: سخنرانی؛ خِطبه: خواستگاری؛ خَطب: امر مهم." data-context="ماجرای شما؛ امرِ مربوط به آن واقعه.">خَطبُكُنَّ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="رٰوَدتُنَّ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="از او کام خواستید و برای همراه کردنش کوشیدید.">رٰوَدتُنَّ</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خودِ او؛ در ترکیبِ کام‌خواهی و درخواست از یوسف.">نَفسِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُلنَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ پاسخِ زنان به آن پرسش.">قُلنَ</button>
    <button class="word-link" type="button" data-word="حٰشَ" data-root="ح و ش" data-root-meaning="گرد آوردن، راندن و در میان گرفتن؛ «حاش لله» تعبیر تنزیه و انکار است و انتساب اشتقاقی آن به این ریشه اختلافی است." data-context="در تعبیر «حاش لله»، تنزیه و دور دانستن اتهام؛ زنان می‌گویند هیچ بدی از یوسف سراغ ندارند." data-learn-more="/quran-terminology/fa/roots/h-w-sh/" data-root-note="انتساب اشتقاقی «حاش لله» به ح و ش قطعی نیست؛ تحلیل ح ش و / ح ش ي نیز مطرح است.">حٰشَ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَلِمنا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="نمی‌دانیم و سراغ نداریم؛ نفیِ شناختِ بدی از او.">عَلِمنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی؛ هر رفتارِ ناروایی که از یوسف نفی می‌کنند.">سوءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَتِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغازِ اقرارِ همسر عزیز.">قالَتِ</button>
    <button class="word-link" type="button" data-word="امرَأَتُ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود" data-context="زن و همسر؛ در ترکیبِ «همسر عزیز».">امرَأَتُ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری" data-context="عزیز؛ عنوانِ صاحب‌منصبی که همسرش سخن می‌گوید.">العَزيزِ</button>
    <button class="word-link" type="button" data-word="الـٰٔنَ" data-context="اکنون؛ زمانِ آشکار شدنِ حقیقت در سخنِ همسر عزیز." data-root-note="اسم زمان و ظرفِ مبنی؛ اشتقاق تاریخیِ «الآن» محل اختلاف است." data-learn-more="/quran-terminology/fa/roots/a-w-n/">الـٰٔنَ</button>
    <button class="word-link" type="button" data-word="حَصحَصَ" data-root="ح ص ح ص" data-root-meaning="آشکار و روشن شدن پس از پنهانی؛ استقرار و مشخص شدن؛ و در کاربردهای دیگر، حرکت و جابه‌جایی." data-context="کاملاً آشکار شد؛ حقیقت اکنون روشن گردید." data-learn-more="/quran-terminology/fa/roots/h-sad-h-sad/">حَصحَصَ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق و حقیقت؛ آنچه همسر عزیز به آشکار شدنش اقرار می‌کند.">الحَقُّ</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنا۠</button>
    <button class="word-link" type="button" data-word="رٰوَدتُهُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="من از او کام خواستم و برای همراه کردنش کوشیدم.">رٰوَدتُهُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خودِ او؛ در اقرارِ همسر عزیز به کام‌خواهی از یوسف.">نَفسِهِ</button>
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راستگویان؛ اقرار به راستگوییِ یوسف.">الصّٰدِقينَ</button>
  </p>
  <p class="farsi-verse">گفت: ماجرای شما چه بود هنگامی که خواستید یوسف را از خود به کام گیرید؟ گفتند: پاکا آن معبود یگانه، هیچ بدی از او نمی‌دانیم؛ همسر عزیز گفت: اکنون حق آشکار شد؛ من خواستم او را از خود به کام گیرم و او از راست‌گویان است.</p>
</section>
