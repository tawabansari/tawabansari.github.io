<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ پاسخ مشاوران دربارهٔ خواب پادشاه.">قالوا</button>
    <button class="word-link" type="button" data-word="أَضغٰثُ" data-root="ض غ ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-gh-th/" data-root-meaning="دسته‌ای آمیخته از گیاه یا شاخه؛ اضغاث احلام: خواب‌های درهم." data-context="درهم‌آمیخته‌ها؛ وصف خواب‌ها در داوری پاسخ‌دهندگان.">أَضغٰثُ</button>
    <button class="word-link" type="button" data-word="أَحلٰمٍ" data-root="ح ل م" data-root-meaning="خواب و رؤیا؛ بلوغ در تعبیر «بلوغ الحلم»؛ خرد، بردباری و خویشتن‌داری در برابر شتاب‌زدگی." data-context="خواب‌ها؛ در داوری پاسخ‌دهندگان که آنها را درهم‌آمیخته می‌خوانند." data-learn-more="/quran-terminology/fa/roots/h-l-m/">أَحلٰمٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="بِتَأويلِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="به تأویل؛ روشن کردن معنای خواب‌ها.">بِتَأويلِ</button>
    <button class="word-link" type="button" data-word="الأَحلٰمِ" data-root="ح ل م" data-root-meaning="خواب و رؤیا؛ بلوغ در تعبیر «بلوغ الحلم»؛ خرد، بردباری و خویشتن‌داری در برابر شتاب‌زدگی." data-context="خواب‌ها؛ موضوع تأویلی که پاسخ‌دهندگان از ندانستن آن سخن می‌گویند." data-learn-more="/quran-terminology/fa/roots/h-l-m/">الأَحلٰمِ</button>
    <button class="word-link" type="button" data-word="بِعٰلِمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ در نفی آگاهی آنان از تأویل خواب‌ها.">بِعٰلِمينَ</button>
  </p>
  <p class="farsi-verse">گفتند: خواب‌هایی درهم‌آمیخته است و ما به تأویل خواب‌ها دانا نیستیم.</p>
</section>
