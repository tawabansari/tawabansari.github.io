    <button class="word-link" type="button" data-word="اذهَبوا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">اذهَبوا</button>

    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="القَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومُ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرونَ</button>

  <p class="farsi-verse">پسرانم، بروید و از یوسف و برادرش جست‌وجو کنید و از گشایش آن معبود یگانه نومید نشوید؛ جز مردم کافر از گشایش آن معبود یگانه نومید نمی‌شوند.</p>
