  </p>
  <p class="farsi-verse">و چون از جایی که پدرشان فرمان داده بود وارد شدند، این در برابر آن معبود یگانه هیچ سودی به آنان نمی‌رساند، جز خواسته‌ای در دل یعقوب که برآورد؛ و او به سبب آنچه به او آموخته بودیم صاحب دانش بود، ولی بیشتر مردم نمی‌دانند.</p>
