  <p class="farsi-verse">پس چون بر او وارد شدند، گفتند: ای عزیز، رنج به ما و خانواده‌مان رسیده و کالایی ناچیز آورده‌ایم؛ پس پیمانه را برایمان تمام بده و بر ما تصدق کن؛ آن معبود یگانه صدقه‌دهندگان را پاداش می‌دهد.</p>
