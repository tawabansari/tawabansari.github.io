<section class="ayah-block" id="ayah-084" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۸۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَوَلّىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="و روی گرداند و کناره گرفت.">وَتَوَلّىٰ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت.">وَقالَ</button>
    <button class="word-link" type="button" data-word="يٰأَسَفىٰ" data-root="أ س ف" data-learn-more="/quran-terminology/fa/roots/a-s-f/" data-root-meaning="متاثر شدن شدید در برابر امری ناگوار، به‌گونه‌ای که این تاثیر به صورت اندوه، دریغ، آزردگی یا خشم آشکار شود." data-context="ای دریغ و اندوه من!">يٰأَسَفىٰ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="وَابيَضَّت" data-root="ب ي ض" data-root-meaning="«ب ي ض» در اصل به سپیدی به‌عنوان یک ویژگی رنگی اشاره دارد. از این معنا، وصف سفید بودن و فعل سفید شدن پدید آمده است. «بَيْضَة» نیز نام تخم پرنده است که در عربی کهن به این خانواده تعلق داشته و سپس در تشبیه‌ها و نام‌گذاری بعضی اشیای همانند به کار رفته است." data-context="و سفید شد؛ دگرگونی چشم‌های یعقوب در پیوند با اندوه." data-learn-more="/quran-terminology/fa/roots/b-y-dad/">وَابيَضَّت</button>
    <button class="word-link" type="button" data-word="عَيناهُ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="دو چشم او؛ چشم‌های یعقوب.">عَيناهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الحُزنِ" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون" data-context="اندوه و غم.">الحُزنِ</button>
    <button class="word-link" type="button" data-word="فَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُوَ</button>
    <button class="word-link" type="button" data-word="كَظيمٌ" data-root="ك ظ م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-zha-m/" data-root-meaning="فرو خوردن و در درون نگه داشتن، به‌ویژه خشم یا اندوه." data-context="اندوه را در خود نگه‌داشته و فروخورنده.">كَظيمٌ</button>
  </p>
  <p class="farsi-verse">و از آنان روی گرداند و گفت: دریغا بر یوسف؛ و چشمانش از اندوه سفید شد و اندوه خود را فرو می‌خورد.</p>
</section>
