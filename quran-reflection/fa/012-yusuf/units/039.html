<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰصٰحِبَىِ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">يٰصٰحِبَىِ</button>
    <button class="word-link" type="button" data-word="السِّجنِ" data-root="س ج ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">السِّجنِ</button>
    <button class="word-link" type="button" data-word="ءَأَربابٌ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">ءَأَربابٌ</button>
    <button class="word-link" type="button" data-word="مُتَفَرِّقونَ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">مُتَفَرِّقونَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الوٰحِدُ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن">الوٰحِدُ</button>
    <button class="word-link" type="button" data-word="القَهّارُ" data-root="ق ه ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">القَهّارُ</button>
  </p>
  <p class="farsi-verse">ای دو همراه زندان من، آیا پروردگاران پراکنده بهترند یا آن معبود یگانه، یکتای چیره؟</p>
</section>
