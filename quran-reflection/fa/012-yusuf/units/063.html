    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="يٰأَبانا" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">يٰأَبانا</button>
    <button class="word-link" type="button" data-word="مُنِعَ" data-root="م ن ع" data-learn-more="/quran-terminology/fa/roots/m-n-ayn/" data-root-meaning="از حائل شدن و بستن راه دسترسی تا دریغ کردن و حفاظت">مُنِعَ</button>

    <button class="word-link" type="button" data-word="الكَيلُ" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد">الكَيلُ</button>

    <button class="word-link" type="button" data-word="أَخانا" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر؛ در سیاق مناسب، هم‌قوم یا هم‌پیوند.">أَخانا</button>
    <button class="word-link" type="button" data-word="نَكتَل" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد">نَكتَل</button>
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>

  </p>
  <p class="farsi-verse">پس چون نزد پدرشان بازگشتند، گفتند: پدر ما، پیمانه از ما بازداشته شد؛ پس برادرمان را با ما بفرست تا پیمانه بگیریم و ما نگهبان او هستیم.</p>
</section>
