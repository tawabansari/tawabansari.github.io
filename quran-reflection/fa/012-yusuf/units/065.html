<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="فَتَحوا" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده" data-context="گشودند؛ بار و وسایلِ خود را.">فَتَحوا</button>
    <button class="word-link" type="button" data-word="مَتٰعَهُم" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="بار و وسایلشان.">مَتٰعَهُم</button>
    <button class="word-link" type="button" data-word="وَجَدوا" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="یافتند؛ کالای بازگردانده‌شده را.">وَجَدوا</button>
    <button class="word-link" type="button" data-word="بِضٰعَتَهُم" data-root="ب ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-dad-ayn/" data-root-meaning="بخش و پاره؛ بِضع: چند یا شماری اندک؛ بضاعة: کالا و سرمایهٔ قابل دادوستد." data-context="کالایشان؛ آنچه برای دادوستد برده بودند.">بِضٰعَتَهُم</button>
    <button class="word-link" type="button" data-word="رُدَّت" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر" data-context="بازگردانده شده است.">رُدَّت</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ سخنِ برادران.">قالوا</button>
    <button class="word-link" type="button" data-word="يٰأَبانا" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان" data-context="ای پدر ما؛ خطابِ پدر.">يٰأَبانا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="نَبغى" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="بخواهیم یا بجوییم؛ در پرسشِ برادران.">نَبغى</button>
    ۖ
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="بِضٰعَتُنا" data-root="ب ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-dad-ayn/" data-root-meaning="بخش و پاره؛ بِضع: چند یا شماری اندک؛ بضاعة: کالا و سرمایهٔ قابل دادوستد." data-context="کالای ما؛ همان مالِ بازگردانده‌شده.">بِضٰعَتُنا</button>
    <button class="word-link" type="button" data-word="رُدَّت" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر" data-context="بازگردانده شده است.">رُدَّت</button>
    <button class="word-link" type="button" data-word="إِلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَينا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَنَميرُ" data-root="م ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-y-r/" data-root-meaning="خوراک و آذوقه فراهم کردن." data-context="و خوراک فراهم آوریم.">وَنَميرُ</button>
    <button class="word-link" type="button" data-word="أَهلَنا" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="خانوادهٔ ما؛ دریافت‌کنندگانِ خوراک.">أَهلَنا</button>
    <button class="word-link" type="button" data-word="وَنَحفَظُ" data-root="ح ف ظ" data-root-meaning="نگه داشتن و مراقبت کردن از چیزی تا ضایع، فراموش، رها یا تباه نشود." data-context="نگه می‌داریم؛ وعدهٔ مراقبت از برادرشان." data-learn-more="/quran-terminology/fa/roots/h-f-zha/">وَنَحفَظُ</button>
    <button class="word-link" type="button" data-word="أَخانا" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادر؛ در سیاق مناسب، هم‌قوم یا هم‌پیوند." data-context="برادرمان؛ شخصِ موردِ درخواستِ همراهی و نگهداری.">أَخانا</button>
    <button class="word-link" type="button" data-word="وَنَزدادُ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="و بیفزاییم؛ بر سهمِ پیمانه.">وَنَزدادُ</button>
    <button class="word-link" type="button" data-word="كَيلَ" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد" data-context="پیمانه و سهمِ اندازه‌گیری‌شده.">كَيلَ</button>
    <button class="word-link" type="button" data-word="بَعيرٍ" data-root="ب ع ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-ayn-r/" data-root-meaning="بعیر: شتر، نر یا ماده؛ بارِ بعیر، مقدار بار یک شتر است." data-context="یک شتر؛ اندازهٔ بارِ افزوده.">بَعيرٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="كَيلٌ" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد" data-context="پیمانه؛ سهمِ خوراکِ یادشده.">كَيلٌ</button>
    <button class="word-link" type="button" data-word="يَسيرٌ" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت" data-context="آسان؛ وصفِ پیمانه یا فراهم آوردنِ آن.">يَسيرٌ</button>
  </p>
  <p class="farsi-verse">و چون وسایلشان را گشودند، دیدند کالایشان به آنان بازگردانده شده است؛ گفتند: پدر ما، دیگر چه می‌خواهیم؟ این کالای ماست که به ما بازگردانده شده است؛ و برای خانواده‌مان آذوقه می‌آوریم و برادرمان را نگاه می‌داریم و یک بار شتر بیشتر پیمانه می‌گیریم؛ این پیمانه‌ای آسان است.</p>
</section>
