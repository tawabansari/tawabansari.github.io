<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغازِ پاسخ و برنامهٔ یوسف.">قالَ</button>
    <button class="word-link" type="button" data-word="تَزرَعونَ" data-root="ز ر ع" data-learn-more="/quran-terminology/fa/roots/z-r-ayn/" data-root-meaning="قرار دادن بذر، رویش، رشد گیاه و پیدایش محصول" data-context="کشت می‌کنید؛ کارِ هفت سالِ نخست.">تَزرَعونَ</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ سال‌های کشت‌وکار در برنامهٔ یوسف." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="سِنينَ" data-root="س ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است." data-context="سال‌ها؛ واحدِ مدتِ هفت‌گانه.">سِنينَ</button>
    <button class="word-link" type="button" data-word="دَأَبًا" data-root="د أ ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-a-b/" data-root-meaning="پیوستگی در کوشش یا عادت؛ دأب: روش تکرارشونده." data-context="پیوسته و با کوشش؛ وصفِ کشت‌وکار.">دَأَبًا</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="حَصَدتُم" data-root="ح ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sad-d/" data-root-meaning="درو کردن و بریدن کشت؛ حصید: دروشده یا از پا افتاده." data-context="درو کردید؛ برداشت محصول.">حَصَدتُم</button>
    <button class="word-link" type="button" data-word="فَذَروهُ" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="پس آن را باقی بگذارید؛ نگهداری محصول در خوشه.">فَذَروهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سُنبُلِهِ" data-root="س ن ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-b-l/" data-root-meaning="خوشه غله و خوشه دادن." data-context="خوشهٔ آن؛ محلِ نگهداری محصول.">سُنبُلِهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندکی؛ مقدارِ مستثنا برای خوردن.">قَليلًا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="می‌خورید؛ مصرفِ مقدارِ مستثنا.">تَأكُلونَ</button>
  </p>
  <p class="farsi-verse">گفت: هفت سال پیوسته کشت می‌کنید؛ پس آنچه درو کردید، جز اندکی که می‌خورید، در خوشه‌اش بگذارید.</p>
</section>
