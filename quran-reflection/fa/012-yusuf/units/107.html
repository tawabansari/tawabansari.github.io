<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۱۰۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="آیا ایمن شده‌اند؛ پرسش از احساسِ امنیت در برابر عذاب یا ساعت">أَفَأَمِنوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَأتِيَهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بر آنان برسد؛ دربارهٔ فراگیرنده‌ای از عذاب">تَأتِيَهُم</button>
    <button class="word-link" type="button" data-word="غٰشِيَةٌ" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش" data-context="فراگیرنده‌ای؛ چیزی از عذاب که آنان را دربر می‌گیرد">غٰشِيَةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ آنچه ممکن است به‌صورت فراگیرنده برسد">عَذابِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="تَأتِيَهُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بر آنان برسد؛ دربارهٔ ساعت">تَأتِيَهُمُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="ساعت؛ هنگامِ رستاخیز در این سیاق">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="ب غ ت" data-root-meaning="ناگهانی فرا رسیدن یا رخ دادن چیزی در زمانی که مخاطب انتظار وقوع آن را نداشته یا از نزدیک شدن آن آگاه نبوده است." data-context="ناگهان؛ دربارهٔ فرا رسیدن ساعت بر مخاطبانِ بی‌خبر" data-learn-more="/quran-terminology/fa/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک" data-context="آگاه‌اند؛ با نفی، بی‌خبری از فرا رسیدن ساعت">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">آیا ایمن شده‌اند که پوشاننده‌ای از عذاب آن معبود یگانه به آنان برسد یا آن ساعت ناگهان بیاید، در حالی که آگاه نیستند؟</p>
</section>
