<section class="ayah-block" id="ayah-103" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۱۰۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَكثَرُ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">أَكثَرُ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسِ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="حَرَصتَ" data-root="ح ر ص" data-learn-more="/quran-terminology/fa/roots/h-r-sad/" data-root-meaning="حَرَصَ؛ سخت خواستن و اهتمام شدید به یک مطلوب">حَرَصتَ</button>
    <button class="word-link" type="button" data-word="بِمُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">بِمُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">و بیشتر مردم، هرچند بسیار بخواهی، مؤمن نیستند.</p>
