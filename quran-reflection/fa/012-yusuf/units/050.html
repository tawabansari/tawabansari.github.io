<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ آغاز فرمانِ پادشاه در این آیه.">وَقالَ</button>
    <button class="word-link" type="button" data-word="المَلِكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="پادشاه؛ فرمانروایی که یوسف را به حضور می‌خواند.">المَلِكُ</button>
    <button class="word-link" type="button" data-word="ائتونى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="او را نزد من بیاورید؛ فرمانِ آوردن یوسف.">ائتونى</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَهُ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="نزد او آمد؛ دربارهٔ رسیدن فرستاده به یوسف.">جاءَهُ</button>
    <button class="word-link" type="button" data-word="الرَّسولُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستاده؛ پیام‌رسانِ پادشاه در این ماجرا.">الرَّسولُ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز پاسخِ یوسف به فرستاده.">قالَ</button>
    <button class="word-link" type="button" data-word="ارجِع" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="بازگرد؛ فرمان یوسف به فرستاده برای برگشتن نزد سرورش.">ارجِع</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="سرورت؛ در اینجا پادشاهی که فرستاده از نزد او آمده است.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَسـَٔلهُ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="پس از او بپرس؛ درخواستِ پرسش از پادشاه دربارهٔ ماجرای زنان.">فَسـَٔلهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="بالُ" data-root="ب و ل" data-root-meaning="«بَال» به حال، شأن و موضوع مربوط به شخص یا گروه اشاره دارد؛ واژه‌ای که در گستره زبان عربی با خاطر و توجه انسان نیز ارتباط دارد. در ترکیب «مَا بَالُ»، پرسش از وضعیت یا ماجرای شخص مطرح است؛ و در «أَصْلَحَ بَالَهُ»، سامان یافتن حال و امور او بیان می‌شود." data-context="حال و ماجرا؛ در «ما بال النسوة»، پرسش از موضوع زنانی که دست‌های خود را بریدند." data-learn-more="/quran-terminology/fa/roots/b-w-l/">بالُ</button>
    <button class="word-link" type="button" data-word="النِّسوَةِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنان؛ گروه زنانی که ماجرای بریدن دست‌ها به آنان مربوط است.">النِّسوَةِ</button>
    <button class="word-link" type="button" data-word="الّٰتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الّٰتى</button>
    <button class="word-link" type="button" data-word="قَطَّعنَ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="بریدند؛ دربارهٔ دست‌های خودِ آن زنان در رویداد پیشین.">قَطَّعنَ</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُنَّ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌هایشان؛ اندام‌هایی که زنان در آن ماجرا بریدند.">أَيدِيَهُنَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ در پایان پاسخ یوسف، مرجعی که به نیرنگ زنان داناست.">رَبّى</button>
    <button class="word-link" type="button" data-word="بِكَيدِهِنَّ" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است." data-context="به نیرنگشان؛ طرح و تدبیرِ آن زنان در این ماجرا.">بِكَيدِهِنَّ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصفِ پروردگار دربارهٔ آگاهی از نیرنگ آنان.">عَليمٌ</button>
  </p>
  <p class="farsi-verse">و پادشاه گفت: او را نزد من بیاورید؛ پس چون فرستاده نزد او آمد، گفت: نزد سرورت بازگرد و از او بپرس ماجرای زنانی که دست‌هایشان را بریدند چه بود؛ پروردگارم به نیرنگ آنان داناست.</p>
</section>
