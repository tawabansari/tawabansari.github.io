    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>

  </p>
  <p class="farsi-verse">پس پیش از ظرف برادرش از ظرف‌های آنان آغاز کرد، سپس آن را از ظرف برادرش بیرون آورد؛ این‌گونه برای یوسف تدبیر کردیم؛ در آیین پادشاه نمی‌توانست برادرش را بگیرد، مگر آنکه آن معبود یگانه بخواهد؛ هرکه را بخواهیم به درجاتی بالا می‌بریم و بالای هر صاحب دانشی، دانایی است.</p>
