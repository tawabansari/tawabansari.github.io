<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">یوسف ۱۲:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰصٰحِبَىِ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="ای دو همراه من؛ خطاب یوسف به دو هم‌زندانی.">يٰصٰحِبَىِ</button>
    <button class="word-link" type="button" data-word="السِّجنِ" data-root="س ج ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-j-n/" data-root-meaning="زندانی کردن و زندان؛ سجّین: نام جایگاه یا ثبت بدکاران، بنا بر تفسیر." data-context="زندان؛ در ترکیبِ دو همراه زندان.">السِّجنِ</button>
    <button class="word-link" type="button" data-word="أَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمّا</button>
    <button class="word-link" type="button" data-word="أَحَدُكُما" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="یکی از شما دو نفر.">أَحَدُكُما</button>
    <button class="word-link" type="button" data-word="فَيَسقى" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب." data-context="پس نوشیدنی خواهد داد؛ دربارهٔ خدمت به سرور.">فَيَسقى</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="سرور و صاحب‌اختیارش؛ در اینجا سرورِ انسانیِ زندانی.">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="خَمرًا" data-root="خ م ر" data-root-meaning="پوشاندن و پنهان ساختن؛ در بعضی کاربردها، درآمیختن و اثر گذاشتن چیزی در چیز دیگر." data-context="شراب؛ نوشیدنی مست‌کننده." data-learn-more="/quran-terminology/fa/roots/kh-m-r/">خَمرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الـٔاخَرُ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="آن دیگری؛ نفر دوم از دو زندانی.">الـٔاخَرُ</button>
    <button class="word-link" type="button" data-word="فَيُصلَبُ" data-root="ص ل ب" data-root-meaning="سختی و استواری؛ صُلب: ستون پشت و در ترکیب نسب، پیوند نسلی؛ صَلب: به صلیب کشیدن انسان." data-context="پس به صلیب کشیده می‌شود؛ دربارهٔ سرنوشت یکی از دو زندانی." data-learn-more="/quran-terminology/fa/roots/sad-l-b/">فَيُصلَبُ</button>
    <button class="word-link" type="button" data-word="فَتَأكُلُ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="پس می‌خورند؛ دربارهٔ پرندگان.">فَتَأكُلُ</button>
    <button class="word-link" type="button" data-word="الطَّيرُ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق." data-context="پرندگان.">الطَّيرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَأسِهِ" data-root="ر أ س" data-root-meaning="سر؛ و در گسترش معنا، بخش بالایی، آغازین یا اصلی چیزی؛ رأس المال: اصل دارایی." data-context="سرِ او." data-learn-more="/quran-terminology/fa/roots/r-a-s/">رَأسِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="فیصله یافته و مقرر شده است؛ فعل مجهول.">قُضِىَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-context="کار و موضوعی که دو زندانی درباره‌اش پرسیده‌اند." data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا؛ و در کاربرد اسمی، کار، موضوع و شأنِ مورد بحث.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="تَستَفتِيانِ" data-root="ف ت ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-y/" data-root-meaning="جوان و جوانی؛ فتوا: پاسخ و روشن کردن مسئله." data-context="شما دو نفر نظر و پاسخ می‌خواهید.">تَستَفتِيانِ</button>
  </p>
  <p class="farsi-verse">ای دو همراه زندان من، اما یکی از شما به سرورش شراب می‌نوشاند و دیگری به دار آویخته می‌شود و پرندگان از سرش می‌خورند؛ کاری که درباره‌اش می‌پرسید پایان یافته است.</p>
</section>
