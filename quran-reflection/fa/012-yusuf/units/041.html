  <p class="farsi-verse">ای دو همراه زندان من، اما یکی از شما به سرورش شراب می‌نوشاند و دیگری به دار آویخته می‌شود و پرندگان از سرش می‌خورند؛ کاری که درباره‌اش می‌پرسید پایان یافته است.</p>
