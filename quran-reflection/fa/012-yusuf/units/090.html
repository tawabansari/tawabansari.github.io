  <p class="farsi-verse">گفتند: آیا تو خود یوسف هستی؟ گفت: من یوسفم و این برادر من است؛ آن معبود یگانه بر ما منت نهاده است؛ هرکه پروا کند و شکیبا باشد، آن معبود یگانه پاداش نیکوکاران را تباه نمی‌کند.</p>
