  </p>
  <p class="farsi-verse">گفت: این همان کسی است که درباره‌اش سرزنشم کردید؛ من خواستم او را از خود به کام گیرم، ولی خود را نگاه داشت؛ و اگر آنچه فرمانش می‌دهم انجام ندهد، حتما زندانی و از خوارشدگان خواهد شد.</p>
