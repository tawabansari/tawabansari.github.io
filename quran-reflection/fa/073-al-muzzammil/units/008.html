<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یاد کن؛ فعل امر برای یاد کردن و بر زبان و در آگاهی حاضر داشتن نام پروردگار.">وَاذكُرِ</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">اسمَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ «ک» ضمیر خطاب به محمد است و اسم به پروردگار او نسبت داده می‌شود.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="وَتَبَتَّل" data-root="ب ت ل" data-learn-more="/quran-terminology/fa/roots/b-t-l/" data-root-meaning="جدا کردن و مستقل یا اختصاصی ساختن؛ تبتل در سیاق عبادت: روی‌آوردن یکسره به پروردگار." data-context="و یکسره به سوی او روی آور؛ فعل امر باب تفعّل در سیاق ذکر و عبادت، با مقصدِ مشخصِ «إلیه».">وَتَبَتَّل</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="تَبتيلًا" data-root="ب ت ل" data-learn-more="/quran-terminology/fa/roots/b-t-l/" data-root-meaning="جدا کردن و مستقل یا اختصاصی ساختن؛ تبتل در سیاق عبادت: روی‌آوردن یکسره به پروردگار." data-context="با اختصاص و روی‌آوردنِ یکسره؛ مصدر باب تفعیل در نقش تأکیدِ فرمان تبتل، نه فرمانی مستقل.">تَبتيلًا</button>
  </p>
  <p class="farsi-verse">و نام پروردگارت را یاد کن و یکسره به او روی آور.</p>
</section>
