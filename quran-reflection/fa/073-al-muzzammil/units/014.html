<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="تَرجُفُ" data-root="ر ج ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَرجُفُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضُ</button>
    <button class="word-link" type="button" data-word="وَالجِبالُ" data-root="ج ب ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالجِبالُ</button>
    <button class="word-link" type="button" data-word="وَكانَتِ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانَتِ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="ج ب ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الجِبالُ</button>
    <button class="word-link" type="button" data-word="كَثيبًا" data-root="ك ث ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَثيبًا</button>
    <button class="word-link" type="button" data-word="مَهيلًا" data-root="ه ي ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَهيلًا</button>
  </p>
  <p class="farsi-verse">روزی که زمین و کوه‌ها بلرزند و کوه‌ها توده‌ای شن روان شوند.</p>
</section>
