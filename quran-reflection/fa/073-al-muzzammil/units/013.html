<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَطَعامًا" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا">وَطَعامًا</button>
    <button class="word-link" type="button" data-word="ذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذا</button>
    <button class="word-link" type="button" data-word="غُصَّةٍ" data-root="غ ص ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-sad-sad/" data-root-meaning="گیر کردن خوراک در گلو و دشواری بلع.">غُصَّةٍ</button>
    <button class="word-link" type="button" data-word="وَعَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">وَعَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد">أَليمًا</button>
  </p>
  <p class="farsi-verse">و خوراکی گلوگیر و عذابی دردناک،</p>
</section>
