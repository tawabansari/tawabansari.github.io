<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">وَاصبِر</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولونَ</button>
    <button class="word-link" type="button" data-word="وَاهجُرهُم" data-root="ه ج ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-j-r/" data-root-meaning="جدا شدن و ترک کردن؛ هجرت: از جایی کوچ کردن.">وَاهجُرهُم</button>
    <button class="word-link" type="button" data-word="هَجرًا" data-root="ه ج ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-j-r/" data-root-meaning="جدا شدن و ترک کردن؛ هجرت: از جایی کوچ کردن.">هَجرًا</button>
    <button class="word-link" type="button" data-word="جَميلًا" data-root="ج م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-m-l/" data-root-meaning="در شاخه‌های مختلف: جمع و توده، جمال و زیبایی، و جمل به معنای شتر.">جَميلًا</button>
  </p>
  <p class="farsi-verse">و بر آنچه می‌گویند شکیبا باش و به شیوه‌ای نیک از آنان دوری کن.</p>
</section>
