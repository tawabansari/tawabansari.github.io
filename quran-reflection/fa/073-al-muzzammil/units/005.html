<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="سَنُلقى" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-context="به‌زودی القا خواهیم کرد؛ سخن را به تو خواهیم رساند." data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه؛ و «إلقاء»، افکندن، قرار دادن یا رساندن چیزی.">سَنُلقى</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخنی؛ پیامی که سنگین وصف شده است.">قَولًا</button>
    <button class="word-link" type="button" data-word="ثَقيلًا" data-root="ث ق ل" data-root-meaning="سنگینی، وزن، بار و اهمیت؛ از بارهای مادی تا سنجش کردار انسان" data-context="سنگین و پرارج؛ وصف سخنی دارای اهمیت و مسئولیت." data-learn-more="/quran-terminology/fa/roots/th-q-l/">ثَقيلًا</button>
  </p>
  <p class="farsi-verse">ما سخنی سنگین بر تو خواهیم افکند.</p>
</section>
