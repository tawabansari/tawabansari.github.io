<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="نِصفَهُ" data-root="ن ص ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نِصفَهُ</button>
    <button class="word-link" type="button" data-word="أَوِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوِ</button>
    <button class="word-link" type="button" data-word="انقُص" data-root="ن ق ص" data-learn-more="/quran-terminology/fa/roots/n-q-sad/" data-root-meaning="کاستن، کم شدن و نقصان؛ از کاهش مال و محصول تا کم گذاشتن در حق دیگران، کاسته شدن عمر و تغییر حدود زمین">انقُص</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
  </p>
  <p class="farsi-verse">نیمی از آن، یا اندکی از آن بکاه،</p>
