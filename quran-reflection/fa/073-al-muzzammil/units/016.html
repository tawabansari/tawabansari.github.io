<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَعَصىٰ" data-root="ع ص ي" data-learn-more="/quran-terminology/fa/roots/ayn-sad-y/" data-root-meaning="سرپیچی از فرمان، نپذیرفتن دستور، و عمل‌کردن برخلاف مسیر طاعت.">فَعَصىٰ</button>
    <button class="word-link" type="button" data-word="فِرعَونُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونُ</button>
    <button class="word-link" type="button" data-word="الرَّسولَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">الرَّسولَ</button>
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَأَخَذنٰهُ</button>
    <button class="word-link" type="button" data-word="أَخذًا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَخذًا</button>
    <button class="word-link" type="button" data-word="وَبيلًا" data-root="و ب ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَبيلًا</button>
  </p>
  <p class="farsi-verse">پس فرعون از آن فرستاده نافرمانی کرد و او را به گرفتنی سخت گرفتیم.</p>
</section>
