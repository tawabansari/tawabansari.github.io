<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="السَّماءُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءُ</button>
    <button class="word-link" type="button" data-word="مُنفَطِرٌ" data-root="ف ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-tt-r/" data-root-meaning="شکافتن؛ فطر: آغاز پدیدآوردن؛ فطرت: سرشت آغازین.">مُنفَطِرٌ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="وَعدُهُ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعدُهُ</button>
    <button class="word-link" type="button" data-word="مَفعولًا" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">مَفعولًا</button>
  </p>
  <p class="farsi-verse">آسمان از آن شکافته می‌شود؛ وعدهٔ او انجام‌شدنی است.</p>
</section>
