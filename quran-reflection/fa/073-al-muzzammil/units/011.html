<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">المزمل ۷۳:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَذَرنى" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَذَرنى</button>
    <button class="word-link" type="button" data-word="وَالمُكَذِّبينَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">وَالمُكَذِّبينَ</button>
    <button class="word-link" type="button" data-word="أُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولِى</button>
    <button class="word-link" type="button" data-word="النَّعمَةِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">النَّعمَةِ</button>
    <button class="word-link" type="button" data-word="وَمَهِّلهُم" data-root="م ه ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَمَهِّلهُم</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
  </p>
  <p class="farsi-verse">و مرا با تکذیب‌کنندگانِ برخوردار از آسایش واگذار و اندکی به آنان مهلت بده.</p>
</section>
