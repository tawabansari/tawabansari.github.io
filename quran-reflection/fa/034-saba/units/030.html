<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان به بیان موعد.">قُل</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="ميعادُ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="موعد؛ زمان وعده‌داده‌شده برای مخاطبان.">ميعادُ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی؛ روزی که موعد آنان است.">يَومٍ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَستَـٔخِرونَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="پس نمی‌افتید؛ نمی‌توانید از موعد عقب بمانید.">تَستَـٔخِرونَ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="ساعَةً" data-root="س و ع" data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="بخشی از زمان و هنگام معین؛ «السّاعة» در سیاق رستاخیز، ساعت موعود است. «سواع» نام خاص معبود است و منشأ اشتقاقی آن قطعی نیست." data-context="مدتی هرچند کوتاه؛ نفی امکان تأخیر در موعد.">ساعَةً</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَستَقدِمونَ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن" data-context="پیش نمی‌روید؛ نمی‌توانید موعد را جلو اندازید.">تَستَقدِمونَ</button>
  </p>
  <p class="farsi-verse">بگو: برای شما وعده روزی است که نه ساعتی از آن عقب می‌مانید و نه پیش می‌افتید.</p>
</section>
