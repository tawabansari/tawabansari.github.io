<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="قَضَينا" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="مقرر کردیم؛ گویندهٔ الهی از مقرر کردن مرگ سخن می‌گوید.">قَضَينا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="المَوتَ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرگ؛ پایان حیات سلیمان که پیش از سقوط بیان شده است.">المَوتَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="دَلَّهُم" data-root="د ل ل" data-learn-more="/quran-terminology/fa/roots/d-l-l/" data-root-meaning="از نشان دادن راه تا نشانه‌ای که چیزی را قابل شناخت می‌کند" data-context="آنان را راهنمایی کرد؛ در ساخت نفی و استثنا، آگاه شدن از مرگ.">دَلَّهُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَوتِهِ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرگ او؛ مرگ سلیمان که از آنان پوشیده بود.">مَوتِهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="دابَّةُ" data-root="د ب ب" data-root-meaning="جنبیدن، حرکت کردن و جنبنده؛ از حرکت مورچه و راه رفتن انسان تا گستردگی جانداران، روزی آنان و دو کاربرد متفاوت «دابة الأرض» در قرآن" data-learn-more="/quran-terminology/fa/roots/d-b-b/" data-context="جنبنده؛ موجودی که عصای سلیمان را می‌خورد.">دابَّةُ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ در ترکیب «جنبندهٔ زمین».">الأَرضِ</button>
    <button class="word-link" type="button" data-word="تَأكُلُ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="می‌خورد؛ خوردن عصا به وسیلهٔ جنبنده.">تَأكُلُ</button>
    <button class="word-link" type="button" data-word="مِنسَأَتَهُ" data-root="ن س أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-s-a/" data-root-meaning="به تأخیر انداختن؛ نسیء: جابه‌جایی حرمت ماه‌ها؛ منسأة: عصا." data-context="عصای او؛ تکیه‌گاه سلیمان که جنبنده آن را می‌خورد.">مِنسَأَتَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="خَرَّ" data-root="خ ر ر" data-root-meaning="فرو افتادن و حرکت به سوی پایین؛ در شاخه‌های لغوی دیگر، جریان و صدای آن." data-context="فرو افتاد؛ افتادن پیکر سلیمان پس از مرگ و آسیب دیدن عصا." data-learn-more="/quran-terminology/fa/roots/kh-r-r/">خَرَّ</button>
    <button class="word-link" type="button" data-word="تَبَيَّنَتِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار شد؛ روشن شدن موضوع برای جنیان پس از سقوط.">تَبَيَّنَتِ</button>
    <button class="word-link" type="button" data-word="الجِنُّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="جنیان؛ گروهی که ناآگاهی‌شان از غیب آشکار می‌شود.">الجِنُّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه با «یعلمون» در شرطِ دانستن غیب.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانستند؛ دانستن غیب که در شرط فرض شده است.">يَعلَمونَ</button>
    <button class="word-link" type="button" data-word="الغَيبَ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد" data-context="غیب؛ آنچه از آگاهی جنیان پنهان مانده بود.">الغَيبَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَبِثوا" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="می‌ماندند؛ با «ما» نفی شده در پاسخ شرط.">لَبِثوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ رنجی که جنیان در آن می‌ماندند.">العَذابِ</button>
    <button class="word-link" type="button" data-word="المُهينِ" data-root="ه و ن" data-learn-more="/quran-terminology/fa/roots/h2-w-n/" data-root-meaning="آسانی، آرامی و فروکاستن از شأن" data-context="خوارکننده؛ وصف عذاب یادشده.">المُهينِ</button>
  </p>
  <p class="farsi-verse">پس چون مرگ را بر او مقرر کردیم، چیزی آنان را از مرگش آگاه نکرد مگر جنبنده زمین که عصایش را می‌خورد. پس چون فرو افتاد، برای جن روشن شد که اگر نهان را می‌دانستند، در عذاب خوارکننده نمی‌ماندند.</p>
</section>
