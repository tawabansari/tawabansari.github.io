<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">يَشاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَحٰريبَ" data-root="ح ر ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَحٰريبَ</button>
    <button class="word-link" type="button" data-word="وَتَمٰثيلَ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">وَتَمٰثيلَ</button>
    <button class="word-link" type="button" data-word="وَجِفانٍ" data-root="ج ف ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَجِفانٍ</button>
    <button class="word-link" type="button" data-word="كَالجَوابِ" data-root="ج ب ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَالجَوابِ</button>
    <button class="word-link" type="button" data-word="وَقُدورٍ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">وَقُدورٍ</button>
    <button class="word-link" type="button" data-word="راسِيٰتٍ" data-root="ر س و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">راسِيٰتٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="اعمَلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">اعمَلوا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالَ</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">داوۥدَ</button>
    <button class="word-link" type="button" data-word="شُكرًا" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">شُكرًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَقَليلٌ" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">وَقَليلٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِىَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عِبادِىَ</button>
    <button class="word-link" type="button" data-word="الشَّكورُ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">الشَّكورُ</button>
  </p>
  <p class="farsi-verse">برای او هرچه می‌خواست از محراب‌ها و تندیس‌ها و کاسه‌هایی مانند حوض‌ها و دیگ‌های استوار می‌ساختند. ای خاندان داوود، سپاسگزارانه کار کنید؛ و اندکی از بندگان من سپاسگزارند.</p>
</section>
