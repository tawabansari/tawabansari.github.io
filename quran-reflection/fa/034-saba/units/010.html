  <p class="arabic-text">

    <button class="word-link" type="button" data-word="فَضلًا" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/">فَضلًا</button>

  </p>
  <p class="farsi-verse">و به‌راستی به داوود از سوی خود فضلی دادیم: ای کوه‌ها، با او هم‌آوا شوید، و پرندگان نیز؛ و آهن را برای او نرم کردیم؛</p>
