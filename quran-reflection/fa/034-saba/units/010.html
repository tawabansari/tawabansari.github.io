<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="دادیم؛ بخشیدن فضل به داوود.">ءاتَينا</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">داوۥدَ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنّا</button>
    <button class="word-link" type="button" data-word="فَضلًا" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="فضلی و افزونیِ بخشش؛ موهبت ویژه به داوود.">فَضلًا</button>
    ۖ
    <button class="word-link" type="button" data-word="يٰجِبالُ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="ای کوه‌ها؛ خطاب به کوه‌ها برای همراهی با داوود." data-learn-more="/quran-terminology/fa/roots/j-b-l/">يٰجِبالُ</button>
    <button class="word-link" type="button" data-word="أَوِّبى" data-root="أ و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-w-b/" data-root-meaning="بازگشت و بازآمدن؛ أوّاب: بسیار بازگشت‌کننده و روی‌آورنده." data-context="همراه او بازآیید؛ فرمان همراهی کوه‌ها با داوود که با تسبیح توضیح داده شده است.">أَوِّبى</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="وَالطَّيرَ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق." data-context="و پرندگان؛ در کنار کوه‌ها در خطاب آیه.">وَالطَّيرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَلَنّا" data-root="ل ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-y-n/" data-root-meaning="نرمی و نرم شدن؛ لینه: نوعی درخت خرما، با شرح‌های متفاوت." data-context="و نرم کردیم؛ نرم ساختن آهن برای داوود.">وَأَلَنّا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="الحَديدَ" data-root="ح د د" data-root-meaning="مرز و حد فاصل؛ بازداشتن، تیزی و برندگی." data-context="آهن؛ آنچه برای داوود نرم شد." data-learn-more="/quran-terminology/fa/roots/h-d-d/">الحَديدَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی به داوود از سوی خود فضلی دادیم: ای کوه‌ها، با او هم‌آوا شوید، و پرندگان نیز؛ و آهن را برای او نرم کردیم؛</p>
</section>
