<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنِ</button>
    <button class="word-link" type="button" data-word="اعمَل" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">اعمَل</button>
    <button class="word-link" type="button" data-word="سٰبِغٰتٍ" data-root="س ب غ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سٰبِغٰتٍ</button>
    <button class="word-link" type="button" data-word="وَقَدِّر" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">وَقَدِّر</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّردِ" data-root="س ر د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">السَّردِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاعمَلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">وَاعمَلوا</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/">صٰلِحًا</button>

    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/">بَصيرٌ</button>

  <p class="farsi-verse">که زره‌های فراخ بساز و در بافتن اندازه نگه دار؛ و کار شایسته کنید؛ همانا من به آنچه می‌کنید بینایم.</p>
