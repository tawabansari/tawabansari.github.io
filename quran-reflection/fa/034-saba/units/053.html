<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيَقذِفونَ" data-root="ق ذ ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-dh-f/" data-root-meaning="افکندن و پرتاب کردن با نیرو.">وَيَقذِفونَ</button>
    <button class="word-link" type="button" data-word="بِالغَيبِ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد">بِالغَيبِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مَكانٍ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">مَكانٍ</button>
    <button class="word-link" type="button" data-word="بَعيدٍ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعيدٍ</button>
  </p>
  <p class="farsi-verse">و پیش‌تر به آن کفر ورزیده بودند؛ و از جایی دور به نهان گمان می‌افکندند.</p>
</section>
