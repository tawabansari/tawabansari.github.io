<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَرزُقُكُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">يَرزُقُكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قُلِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُلِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="إِيّاكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِيّاكُم</button>
    <button class="word-link" type="button" data-word="لَعَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلىٰ</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هُدًى</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ضَلٰلٍ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">ضَلٰلٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">مُبينٍ</button>
  </p>
  <p class="farsi-verse">بگو: چه کسی از آسمان‌ها و زمین به شما روزی می‌دهد؟ بگو: آن معبود یگانه؛ و به‌راستی ما یا شما بر هدایت یا در گمراهی آشکاریم.</p>
</section>
