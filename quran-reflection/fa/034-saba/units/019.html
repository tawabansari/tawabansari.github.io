<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّنا</button>
    <button class="word-link" type="button" data-word="بٰعِد" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بٰعِد</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَ</button>
    <button class="word-link" type="button" data-word="أَسفارِنا" data-root="س ف ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَسفارِنا</button>
    <button class="word-link" type="button" data-word="وَظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">وَظَلَموا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="فَجَعَلنٰهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">فَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="أَحاديثَ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/" data-root-meaning="از پدید آمدن تا سخنی که بازگو می‌شود">أَحاديثَ</button>
    <button class="word-link" type="button" data-word="وَمَزَّقنٰهُم" data-root="م ز ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَمَزَّقنٰهُم</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="مُمَزَّقٍ" data-root="م ز ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُمَزَّقٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="صَبّارٍ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">صَبّارٍ</button>
    <button class="word-link" type="button" data-word="شَكورٍ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">شَكورٍ</button>
  </p>
  <p class="farsi-verse">پس گفتند: پروردگارا، میان سفرهای ما فاصله بینداز؛ و به خود ستم کردند؛ پس آنان را داستان‌هایی کردیم و کاملا پراکنده‌شان ساختیم. همانا در این برای هر بسیار شکیبای سپاسگزار نشانه‌هایی است.</p>
</section>
