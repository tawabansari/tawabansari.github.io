  <p class="farsi-verse">بگو: کسانی را که جز آن معبود یگانه می‌پندارید بخوانید. هم‌وزن ذره‌ای را در آسمان‌ها و در زمین مالک نیستند و در آن دو هیچ سهمی ندارند و از میان آنان هیچ پشتیبانی برای او نیست.</p>
