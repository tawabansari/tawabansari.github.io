<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَعرَضوا" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">فَأَعرَضوا</button>
    <button class="word-link" type="button" data-word="فَأَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">فَأَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="سَيلَ" data-root="س ي ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَيلَ</button>
    <button class="word-link" type="button" data-word="العَرِمِ" data-root="ع ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">العَرِمِ</button>
    <button class="word-link" type="button" data-word="وَبَدَّلنٰهُم" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">وَبَدَّلنٰهُم</button>
    <button class="word-link" type="button" data-word="بِجَنَّتَيهِم" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">بِجَنَّتَيهِم</button>
    <button class="word-link" type="button" data-word="جَنَّتَينِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="ذَواتَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذَواتَى</button>
    <button class="word-link" type="button" data-word="أُكُلٍ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">أُكُلٍ</button>
    <button class="word-link" type="button" data-word="خَمطٍ" data-root="خ م ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خَمطٍ</button>
    <button class="word-link" type="button" data-word="وَأَثلٍ" data-root="أ ث ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَثلٍ</button>
    <button class="word-link" type="button" data-word="وَشَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">وَشَىءٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سِدرٍ" data-root="س د ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سِدرٍ</button>
    <button class="word-link" type="button" data-word="قَليلٍ" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلٍ</button>
  </p>
  <p class="farsi-verse">پس روی گرداندند و سیلاب سد را بر آنان فرستادیم و دو باغشان را به دو باغ با میوه تلخ و گز و اندکی درخت سدر بدل کردیم.</p>
</section>
