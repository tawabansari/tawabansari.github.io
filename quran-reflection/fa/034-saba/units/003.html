  <p class="farsi-verse">و کسانی که کفر ورزیدند گفتند: آن ساعت به سراغ ما نمی‌آید. بگو: چرا، سوگند به پروردگارم، دانای نهان، بی‌گمان به سراغتان می‌آید. هم‌وزن ذره‌ای در آسمان‌ها و در زمین از او پنهان نمی‌ماند، و نه کوچک‌تر از آن و نه بزرگ‌تر، مگر آنکه در کتابی روشن است؛</p>
