  <p class="farsi-verse">و باد را برای سلیمان؛ رفتن بامدادی آن یک ماه و رفتن شامگاهی آن یک ماه بود. و چشمه مس را برای او روان کردیم؛ و از جن کسانی پیش روی او به اذن پروردگارش کار می‌کردند؛ و هرکدام از آنان از فرمان ما منحرف می‌شد، از عذاب آتش فروزان به او می‌چشاندیم.</p>
