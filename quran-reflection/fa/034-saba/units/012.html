<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِسُلَيمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَلِسُلَيمٰنَ</button>
    <button class="word-link" type="button" data-word="الرّيحَ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح" data-context="باد؛ آنچه برای سلیمان قرار داده شد.">الرّيحَ</button>
    <button class="word-link" type="button" data-word="غُدُوُّها" data-root="غ د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-w/" data-root-meaning="بامداد و بامداد رفتن؛ غد: فردا یا آینده." data-context="حرکت بامدادی آن؛ مسیر یا رفتن باد در آغاز روز.">غُدُوُّها</button>
    <button class="word-link" type="button" data-word="شَهرٌ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="یک ماه؛ مقیاسِ حرکت بامدادی باد در بیان آیه." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">شَهرٌ</button>
    <button class="word-link" type="button" data-word="وَرَواحُها" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-context="و حرکت پسین‌گاهی آن؛ رفتن باد در بخش پسین روز." data-root-meaning="باد، نفس، گشایش و روح؛ و رَواح، حرکت در بخش پسین روز.">وَرَواحُها</button>
    <button class="word-link" type="button" data-word="شَهرٌ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="یک ماه؛ مقیاسِ حرکت پسین‌گاهی باد در بیان آیه." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">شَهرٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَسَلنا" data-root="س ي ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-l/" data-root-meaning="جاری شدن و روان ساختن؛ سیل: جریان فراوان آب." data-context="و روان ساختیم؛ جاری کردن چشمهٔ مس برای سلیمان.">وَأَسَلنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="عَينَ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="چشمه؛ سرچشمهٔ مسِ روان‌شده.">عَينَ</button>
    <button class="word-link" type="button" data-word="القِطرِ" data-root="ق ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-tt-r/" data-root-meaning="چکیدن؛ قِطر: مس گداخته؛ قطران: ماده قیرمانند؛ اقطار: نواحی و کرانه‌ها." data-context="مس گداخته؛ مادهٔ چشمهٔ روان‌شده در آیه.">القِطرِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الجِنِّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="جنیان؛ گروهی که از میانشان برای سلیمان کار می‌کردند.">الجِنِّ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَعمَلُ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="کار می‌کند؛ کار کردنِ برخی جنیان پیش روی سلیمان.">يَعمَلُ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان؛ در ترکیب «بین یدیه»، پیشِ روی او.">بَينَ</button>
    <button class="word-link" type="button" data-word="يَدَيهِ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دو دست او؛ همراه «بین»، تعبیرِ پیش روی سلیمان.">يَدَيهِ</button>
    <button class="word-link" type="button" data-word="بِإِذنِ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="به اجازه؛ اذنِ پروردگار برای کار یادشده.">بِإِذنِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارش؛ صاحبِ اذنِ یادشده.">رَبِّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَزِغ" data-root="ز ي غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-gh/" data-root-meaning="میل و انحراف از مسیر یا استواری." data-context="منحرف شود؛ دور شدن از فرمانِ بیان‌شده.">يَزِغ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرِنا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان ما؛ دستوری که انحراف از آن پیامد دارد.">أَمرِنا</button>
    <button class="word-link" type="button" data-word="نُذِقهُ" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="به او می‌چشانیم؛ رساندنِ تجربهٔ عذاب به فردِ منحرف‌شده.">نُذِقهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ رنجی که چشاندن آن بیان شده است.">عَذابِ</button>
    <button class="word-link" type="button" data-word="السَّعيرِ" data-root="س ع ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-ayn-r/" data-root-meaning="افروختن آتش؛ سعیر: آتش شعله‌ور؛ سُعُر در برخی سیاق‌ها: آشفتگی." data-context="آتش سوزان؛ وصفِ عذاب یادشده.">السَّعيرِ</button>
  </p>
  <p class="farsi-verse">و باد را برای سلیمان؛ رفتن بامدادی آن یک ماه و رفتن شامگاهی آن یک ماه بود. و چشمه مس را برای او روان کردیم؛ و از جن کسانی پیش روی او به اذن پروردگارش کار می‌کردند؛ و هرکدام از آنان از فرمان ما منحرف می‌شد، از عذاب آتش فروزان به او می‌چشاندیم.</p>
</section>
