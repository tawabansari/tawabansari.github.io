<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمانِ بیانِ پاسخ.">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارم؛ صاحبِ گشایش و محدودیت روزی.">رَبّى</button>
    <button class="word-link" type="button" data-word="يَبسُطُ" data-root="ب س ط" data-root-meaning="گشودن، گستردن و امتداد دادن؛ در کاربردهای گوناگون، گشایش روزی یا وسعت دانش و توانایی نیز از سیاق روشن می‌شود." data-context="گشایش می‌دهد؛ فراخ ساختن روزی به خواست پروردگار." data-learn-more="/quran-terminology/fa/roots/b-s-tt/">يَبسُطُ</button>
    <button class="word-link" type="button" data-word="الرِّزقَ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="روزی؛ آنچه گشایش یا محدودیت می‌یابد.">الرِّزقَ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهد؛ در بیانِ دریافت‌کنندهٔ روزی.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيَقدِرُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="و محدود می‌سازد؛ در برابر گشایش روزی.">وَيَقدِرُ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بیشتر؛ کمیتِ مردمی که نمی‌دانند.">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ کسانی که ناآگاهی بیشترشان بیان می‌شود.">النّاسِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانند؛ با نفیِ آگاهیِ بیشتر مردم.">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">بگو: پروردگارم روزی را برای هرکه بخواهد گسترش می‌دهد و تنگ می‌گرداند؛ ولی بیشتر مردم نمی‌دانند.</p>
</section>
