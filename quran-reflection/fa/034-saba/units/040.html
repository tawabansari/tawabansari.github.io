<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روزی که؛ زمانِ گردآوری و پرسش.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يَحشُرُهُم" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="آنان را همگی گرد می‌آورد؛ پیش از پرسش از فرشتگان." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">يَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="همگی؛ فراگیریِ گردآوری.">جَميعًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گوید؛ خطاب به فرشتگان.">يَقولُ</button>
    <button class="word-link" type="button" data-word="لِلمَلٰئِكَةِ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="به فرشتگان؛ مخاطبانِ پرسش.">لِلمَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="أَهٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَهٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="إِيّاكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِيّاكُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در پرسش از رفتارِ پیشین.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعبُدونَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="می‌پرستیدند؛ موضوع پرسش از فرشتگان.">يَعبُدونَ</button>
  </p>
  <p class="farsi-verse">و روزی که همه آنان را گرد می‌آورد، سپس به فرشتگان می‌گوید: آیا اینان شما را می‌پرستیدند؟</p>
</section>
