<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="يَجمَعُ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">يَجمَعُ</button>
    <button class="word-link" type="button" data-word="بَينَنا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَنا</button>
    <button class="word-link" type="button" data-word="رَبُّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّنا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَفتَحُ" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده">يَفتَحُ</button>
    <button class="word-link" type="button" data-word="بَينَنا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَنا</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الفَتّاحُ" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده">الفَتّاحُ</button>
    <button class="word-link" type="button" data-word="العَليمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">العَليمُ</button>
  </p>
  <p class="farsi-verse">بگو: پروردگارمان ما را گرد می‌آورد، سپس به حق میان ما داوری می‌کند؛ و او داور داناست.</p>
</section>
