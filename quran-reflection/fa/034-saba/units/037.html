  <p class="farsi-verse">و اموالتان و فرزندانتان نیستند که شما را به ما نزدیک می‌کنند، مگر کسی که ایمان آورد و کار شایسته کند؛ پس آنان به سبب آنچه کرده‌اند پاداش چندبرابر دارند و در غرفه‌ها ایمن‌اند.</p>
