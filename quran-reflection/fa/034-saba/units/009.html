<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آیا ننگریسته‌اند؛ دعوت به توجه به آسمان و زمین پیرامونشان.">يَرَوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="در ترکیب «بین أیدیهم»، پیش روی آنان.">بَينَ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌هایشان؛ در ترکیب «بین أیدیهم»، جهت پیش روی آنان را بیان می‌کند.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="خَلفَهُم" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="پشت سر آنان؛ در برابر آنچه پیش رویشان است.">خَلفَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ بخشی از گستره‌ای که به نگریستن در آن فراخوانده می‌شوند.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ همراه آسمان، محیط پیرامون آنان.">وَالأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="نَشَأ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهیم؛ در جمله شرطی، وقوع پیامد را به مشیت الهی وابسته می‌کند.">نَشَأ</button>
    <button class="word-link" type="button" data-word="نَخسِف" data-root="خ س ف" data-root-meaning="فرو رفتن یا فروبردن در زمین؛ و در کاربرد ماه، کاهش یا پنهان شدن روشنایی آن." data-context="در صورت مشیت الهی، آنان را در زمین فرو ببریم؛ جواب شرط است." data-learn-more="/quran-terminology/fa/roots/kh-s-f/">نَخسِف</button>
    <button class="word-link" type="button" data-word="بِهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ جایگاه فروبرده شدن در یکی از دو امکان مطرح‌شده.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="نُسقِط" data-root="س ق ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-q-tt/" data-root-meaning="افتادن و فرو افکندن." data-context="فرو افکنیم؛ در اینجا پاره‌هایی از آسمان را بر آنان.">نُسقِط</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="كِسَفًا" data-root="ك س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-s-f/" data-root-meaning="پاره و قطعه." data-context="پاره‌ها یا قطعاتی از آسمان؛ متمایز از «خسف» به معنای فروبردن.">كِسَفًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ پاره‌های فرو افتادنی در این هشدار از آن معرفی می‌شوند.">السَّماءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="بی‌گمان نشانه‌ای؛ برای بنده‌ای که بازمی‌گردد و توجه می‌کند.">لَـٔايَةً</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="برای هر؛ شمول نشانه را نسبت به هر بنده بازگشت‌کننده بیان می‌کند.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="عَبدٍ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بنده؛ انسانی در نسبت بندگی با پروردگار.">عَبدٍ</button>
    <button class="word-link" type="button" data-word="مُنيبٍ" data-root="ن و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-w-b/" data-root-meaning="بازگشت پیاپی؛ انابه: بازگشت و روی آوردن." data-context="بازگشت‌کننده؛ بنده‌ای که رو به پروردگار می‌آورد.">مُنيبٍ</button>
  </p>
  <p class="farsi-verse">آیا به آنچه از آسمان و زمین پیش رویشان و پشت سرشان است ننگریسته‌اند؟ اگر بخواهیم، آنان را در زمین فرو می‌بریم یا پاره‌هایی از آسمان بر آنان می‌افکنیم. همانا در این برای هر بنده بازگشت‌کننده‌ای نشانه‌ای است.</p>
</section>
