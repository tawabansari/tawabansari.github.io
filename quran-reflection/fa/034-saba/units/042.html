<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">فَاليَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَملِكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه">يَملِكُ</button>
    <button class="word-link" type="button" data-word="بَعضُكُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی">بَعضُكُم</button>
    <button class="word-link" type="button" data-word="لِبَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی">لِبَعضٍ</button>
    <button class="word-link" type="button" data-word="نَفعًا" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی">نَفعًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="ضَرًّا" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری">ضَرًّا</button>
    <button class="word-link" type="button" data-word="وَنَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَنَقولُ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظَلَموا</button>
    <button class="word-link" type="button" data-word="ذوقوا" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج.">ذوقوا</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابَ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="تُكَذِّبونَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">تُكَذِّبونَ</button>
  </p>
  <p class="farsi-verse">پس امروز هیچ‌یک از شما برای دیگری سود و زیانی در اختیار ندارد؛ و به کسانی که ستم کردند می‌گوییم: عذاب آتشی را که تکذیب می‌کردید بچشید.</p>
</section>
