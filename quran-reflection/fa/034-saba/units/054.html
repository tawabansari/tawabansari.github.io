<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَحيلَ" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها">وَحيلَ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُم</button>
    <button class="word-link" type="button" data-word="وَبَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">وَبَينَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشتَهونَ" data-root="ش ه و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَشتَهونَ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="فُعِلَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">فُعِلَ</button>
    <button class="word-link" type="button" data-word="بِأَشياعِهِم" data-root="ش ي ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِأَشياعِهِم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="شَكٍّ" data-root="ش ك ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">شَكٍّ</button>
    <button class="word-link" type="button" data-word="مُريبٍ" data-root="ر ي ب" data-learn-more="/quran-terminology/fa/roots/r-y-b/" data-root-meaning="تردید آشفته، بی‌اعتمادی، بدگمانی، شک بی‌ثبات‌کننده، اضطراب در برابر حق، و حالتی که انسان را از اطمینان و تسلیم در برابر برهان بازمی‌دارد">مُريبٍ</button>
  </p>
  <p class="farsi-verse">و میان آنان و آنچه می‌خواهند جدایی افکنده می‌شود، چنان‌که پیش‌تر با همانندانشان شد. همانا آنان در تردیدی ناآرام‌کننده بودند.</p>
</section>
