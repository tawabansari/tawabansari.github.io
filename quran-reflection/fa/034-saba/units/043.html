    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>

    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>

    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار و روشن؛ وصفِ بهتان یا سحرِ ادعاشده در سیاق.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">و چون آیات روشن ما بر آنان خوانده شود، می‌گویند: این جز مردی نیست که می‌خواهد شما را از آنچه پدرانتان می‌پرستیدند بازدارد. و می‌گویند: این جز دروغی برساخته نیست. و کسانی که کفر ورزیدند، چون حق به سراغشان آمد، درباره آن گفتند: این جز جادویی آشکار نیست.</p>
</section>
