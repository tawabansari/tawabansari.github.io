  <p class="farsi-verse">و چون آیات روشن ما بر آنان خوانده شود، می‌گویند: این جز مردی نیست که می‌خواهد شما را از آنچه پدرانتان می‌پرستیدند بازدارد. و می‌گویند: این جز دروغی برساخته نیست. و کسانی که کفر ورزیدند، چون حق به سراغشان آمد، درباره آن گفتند: این جز جادویی آشکار نیست.</p>
