  <p class="farsi-verse">بگو: پروردگارم روزی را برای هرکه از بندگانش بخواهد گسترش می‌دهد و برای او تنگ می‌گرداند؛ و هر چیزی که انفاق کنید، او جایگزینش می‌کند؛ و او بهترین روزی‌دهندگان است.</p>
