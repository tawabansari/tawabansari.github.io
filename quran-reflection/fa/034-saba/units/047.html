<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">سبأ ۳۴:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="سَأَلتُكُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">سَأَلتُكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَجرٍ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرٍ</button>
    <button class="word-link" type="button" data-word="فَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُوَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="أَجرِىَ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرِىَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَىءٍ</button>
    <button class="word-link" type="button" data-word="شَهيدٌ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">شَهيدٌ</button>
  </p>
  <p class="farsi-verse">بگو: هر پاداشی از شما خواسته‌ام، برای خود شما باشد؛ پاداش من تنها بر آن معبود یگانه است؛ و او بر هر چیزی گواه است.</p>
</section>
