<section class="ayah-block" id="ayah-177" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="نَزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">نَزَلَ</button>
    <button class="word-link" type="button" data-word="بِساحَتِهِم" data-root="س و ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-h/" data-root-meaning="ساحت: فضای باز و پیرامون خانه یا محل.">بِساحَتِهِم</button>
    <button class="word-link" type="button" data-word="فَساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">فَساءَ</button>
    <button class="word-link" type="button" data-word="صَباحُ" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ.">صَباحُ</button>
    <button class="word-link" type="button" data-word="المُنذَرينَ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">المُنذَرينَ</button>
  </p>
  <p class="farsi-verse">پس چون در میدانشان فرود آید، صبح هشدارگرفتگان چه بد خواهد بود!</p>
