  <p class="farsi-verse">پس چون با او به سن کوشش رسید، گفت: پسرکم، من در خواب می‌بینم که تو را سر می‌برم؛ پس بنگر چه می‌اندیشی. گفت: پدرم، آنچه فرمان می‌یابی انجام ده؛ اگر آن معبود یگانه بخواهد، مرا از شکیبایان خواهی یافت.</p>
