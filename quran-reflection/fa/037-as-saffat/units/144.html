<section class="ayah-block" id="ayah-144" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَلَبِثَ" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="حتماً می‌ماند؛ نتیجهٔ شرطِ بیان‌شده دربارهٔ یونس">لَلَبِثَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="بَطنِهِ" data-root="ب ط ن" data-root-meaning="درون و سوی داخلی چیزی در برابر بیرون و رویهٔ آن؛ و در کاربردهای گسترده‌تر، جنبهٔ نهفته، کمتر آشکار یا در دسترس نزدیکان و آگاهان از یک امر." data-context="شکم آن ماهی؛ جای ماندن یونس در صورتِ بیان‌شده در آیه" data-learn-more="/quran-terminology/fa/roots/b-tt-n/">بَطنِهِ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ موعد برانگیخته شدن">يَومِ</button>
    <button class="word-link" type="button" data-word="يُبعَثونَ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه." data-context="برانگیخته می‌شوند؛ زنده شدن در روزِ یادشده">يُبعَثونَ</button>
  </p>
  <p class="farsi-verse">تا روزی که برانگیخته شوند در شکم آن می‌ماند.</p>
</section>
