<section class="ayah-block" id="ayah-169" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">لَكُنّا</button>
    <button class="word-link" type="button" data-word="عِبادَ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عِبادَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="المُخلَصينَ" data-root="خ ل ص" data-learn-more="/quran-terminology/fa/roots/kh-l-sad/" data-root-meaning="جدا شدن از آمیختگی؛ از خلوص تا اختصاص">المُخلَصينَ</button>
  </p>
  <p class="farsi-verse">بی‌گمان بندگان خالص‌شده آن معبود یگانه بودیم.</p>
</section>
