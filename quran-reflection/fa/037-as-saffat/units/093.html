<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۹۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَراغَ" data-root="ر و غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-w-gh/" data-root-meaning="آهسته یا با چرخش از مسیری رفتن و به سویی متمایل شدن.">فَراغَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="ضَربًا" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">ضَربًا</button>
    <button class="word-link" type="button" data-word="بِاليَمينِ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی.">بِاليَمينِ</button>
  </p>
  <p class="farsi-verse">پس به سویشان رفت و با دست راست ضربه زد.</p>
</section>
