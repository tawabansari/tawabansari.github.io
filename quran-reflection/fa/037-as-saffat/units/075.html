<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="نادىٰنا" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="ما را ندا کرد؛ ندای نوح و اجابت آن." data-learn-more="/quran-terminology/fa/roots/n-d-y/">نادىٰنا</button>
    <button class="word-link" type="button" data-word="نوحٌ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٌ</button>
    <button class="word-link" type="button" data-word="فَلَنِعمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="پس چه نیکو؛ تعبیر ستایش پاسخ‌دهندگان.">فَلَنِعمَ</button>
    <button class="word-link" type="button" data-word="المُجيبونَ" data-root="ج و ب" data-root-meaning="جوب در کاربرد مادی، بریدن، شکافتن و گذشتن از میان چیزی است؛ و در کاربرد گفتاری و رفتاری، جواب و استجابت به پاسخ دادن در برابر سخن، درخواست یا دعوت اشاره دارند." data-learn-more="/quran-terminology/fa/roots/j-w-b/" data-context="پاسخ‌دهندگان؛ وصف اجابت‌کنندهٔ ندای نوح.">المُجيبونَ</button>
  </p>
  <p class="farsi-verse">و نوح ما را ندا داد؛ و چه نیک پاسخ‌دهنده‌ای هستیم!</p>
</section>
