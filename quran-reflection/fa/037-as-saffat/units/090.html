<section class="ayah-block" id="ayah-090" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۹۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَوَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">فَتَوَلَّوا</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="مُدبِرينَ" data-root="د ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پایانی؛ روی گرداندن؛ تدبیر و تدبّر: توجه به پیامد و سامان دادن.">مُدبِرينَ</button>
  </p>
  <p class="farsi-verse">پس پشت‌کنان از او روی گرداندند.</p>
