<section class="ayah-block" id="ayah-126" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكُم</button>
    <button class="word-link" type="button" data-word="وَرَبَّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">وَرَبَّ</button>
    <button class="word-link" type="button" data-word="ءابائِكُمُ" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">ءابائِكُمُ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">الأَوَّلينَ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه را، پروردگار شما و پروردگار پدران پیشین شما؟</p>
</section>
