<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعِندَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعِندَهُم</button>
    <button class="word-link" type="button" data-word="قٰصِرٰتُ" data-root="ق ص ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قٰصِرٰتُ</button>
    <button class="word-link" type="button" data-word="الطَّرفِ" data-root="ط ر ف" data-learn-more="/quran-terminology/fa/roots/tt-r-f/" data-root-meaning="کناره، سویه، بخش، نگاه، و حرکت نگاه در کاربرد قرآنی">الطَّرفِ</button>
    <button class="word-link" type="button" data-word="عينٌ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">عينٌ</button>
  </p>
  <p class="farsi-verse">و نزد آنان زنانی با نگاه فروگرفته و چشمانی درشت‌اند،</p>
</section>
