<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۹۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَرادوا" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">فَأَرادوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="كَيدًا" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است.">كَيدًا</button>
    <button class="word-link" type="button" data-word="فَجَعَلنٰهُمُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">فَجَعَلنٰهُمُ</button>
    <button class="word-link" type="button" data-word="الأَسفَلينَ" data-root="س ف ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-f-l/" data-root-meaning="پایین و فرودست بودن، در برابر بالا.">الأَسفَلينَ</button>
  </p>
  <p class="farsi-verse">پس برای او نیرنگی خواستند، و ما آنان را فروتر قرار دادیم.</p>
</section>
