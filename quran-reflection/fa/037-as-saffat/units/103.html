<section class="ayah-block" id="ayah-103" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۰۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَسلَما" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="هر دو تسلیم شدند؛ ابراهیم و فرزندش در برابر آنچه در این واقعه فرمان یافته بودند، همراه شدند.">أَسلَما</button>
    <button class="word-link" type="button" data-word="وَتَلَّهُ" data-root="ت ل ل" data-learn-more="/quran-terminology/fa/roots/t-l-l/" data-root-meaning="گرفتن و به زمین افکندن کسی، به‌ویژه قرار دادن بدن بر کنار صورت یا پیشانی" data-context="و او را بر زمین افکند؛ ابراهیم فرزندش را بر کنار پیشانی قرار داد.">وَتَلَّهُ</button>
    <button class="word-link" type="button" data-word="لِلجَبينِ" data-root="ج ب ن" data-root-meaning="سه شاخهٔ متمایزِ کنار پیشانی، ترسویی و پنیر؛ در قرآن: کنار پیشانی." data-context="بر کنار پیشانی؛ اشاره به حالتی که فرزند ابراهیم هنگام افکنده شدن بر زمین در آن قرار گرفت." data-learn-more="/quran-terminology/fa/roots/j-b-n/">لِلجَبينِ</button>
  </p>
  <p class="farsi-verse">پس هنگامی که هر دو تسلیم شدند و او را بر کنار پیشانی افکند،</p>
</section>
