  <h2 class="ayah-title">الصافات ۳۷:۱۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَنَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنَحنُ</button>
    <button class="word-link" type="button" data-word="الصّافّونَ" data-root="ص ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-f-f/" data-root-meaning="در ردیف نهادن یا گستردن بال‌ها.">الصّافّونَ</button>
