<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۰۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَبَشَّرنٰهُ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="پس او را مژده دادیم؛ خبر خوش دربارهٔ پسر.">فَبَشَّرنٰهُ</button>
    <button class="word-link" type="button" data-word="بِغُلٰمٍ" data-root="غ ل م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-m/" data-root-meaning="پسر و نوجوان." data-context="به پسری؛ کسی که با بردباری وصف شده است.">بِغُلٰمٍ</button>
    <button class="word-link" type="button" data-word="حَليمٍ" data-root="ح ل م" data-root-meaning="خواب و رؤیا؛ بلوغ در تعبیر «بلوغ الحلم»؛ خرد، بردباری و خویشتن‌داری در برابر شتاب‌زدگی." data-context="بردبار؛ وصف پسری که مژدهٔ او به ابراهیم داده می‌شود." data-learn-more="/quran-terminology/fa/roots/h-l-m/">حَليمٍ</button>
  </p>
  <p class="farsi-verse">پس او را به پسری بردبار مژده دادیم.</p>
</section>
