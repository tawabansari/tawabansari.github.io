<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَءِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِذا</button>
    <button class="word-link" type="button" data-word="مِتنا" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مِتنا</button>
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكُنّا</button>
    <button class="word-link" type="button" data-word="تُرابًا" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه">تُرابًا</button>
    <button class="word-link" type="button" data-word="وَعِظٰمًا" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">وَعِظٰمًا</button>
    <button class="word-link" type="button" data-word="أَءِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِنّا</button>
    <button class="word-link" type="button" data-word="لَمَبعوثونَ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه.">لَمَبعوثونَ</button>
  </p>
  <p class="farsi-verse">آیا هنگامی که مردیم و خاک و استخوان شدیم، آیا به‌راستی برانگیخته خواهیم شد؟</p>
</section>
