<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَيضاءَ" data-root="ب ي ض" data-root-meaning="«ب ي ض» در اصل به سپیدی به‌عنوان یک ویژگی رنگی اشاره دارد. از این معنا، وصف سفید بودن و فعل سفید شدن پدید آمده است. «بَيْضَة» نیز نام تخم پرنده است که در عربی کهن به این خانواده تعلق داشته و سپس در تشبیه‌ها و نام‌گذاری بعضی اشیای همانند به کار رفته است." data-context="سفید؛ وصف جام و نوشیدنی بهشتیِ یادشده." data-learn-more="/quran-terminology/fa/roots/b-y-dad/">بَيضاءَ</button>
    <button class="word-link" type="button" data-word="لَذَّةٍ" data-root="ل ذ ذ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-dh-dh/" data-root-meaning="خوشی و لذت، به‌ویژه خوشایندی مزه." data-context="لذت‌بخش و خوشایند؛ وصفِ نوشیدنی.">لَذَّةٍ</button>
    <button class="word-link" type="button" data-word="لِلشّٰرِبينَ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="برای نوشندگان.">لِلشّٰرِبينَ</button>
  </p>
  <p class="farsi-verse">سپید، لذت‌بخش برای نوشندگان؛</p>
</section>
