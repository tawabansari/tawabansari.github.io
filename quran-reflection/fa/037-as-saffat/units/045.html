  <h2 class="ayah-title">الصافات ۳۷:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُطافُ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل">يُطافُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِكَأسٍ" data-root="ك أ س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-a-s/" data-root-meaning="جام نوشیدنی، معمولاً همراه با محتوی آن.">بِكَأسٍ</button>

  </p>
  <p class="farsi-verse">جامی از چشمه‌ای روان بر گردشان گردانده می‌شود،</p>
