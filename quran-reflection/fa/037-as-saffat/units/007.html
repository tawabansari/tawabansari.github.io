<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَحِفظًا" data-root="ح ف ظ" data-root-meaning="نگه داشتن و مراقبت کردن از چیزی تا ضایع، فراموش، رها یا تباه نشود." data-context="و برای نگهداری؛ حفاظت از هر شیطانِ سرکش در سیاقِ آسمان." data-learn-more="/quran-terminology/fa/roots/h-f-zha/">وَحِفظًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ بیانِ شمول نسبت به اسم پس از آن.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَيطٰنٍ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ موجودِ موردِ دورداشتن در سیاق.">شَيطٰنٍ</button>
    <button class="word-link" type="button" data-word="مارِدٍ" data-root="م ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-d/" data-root-meaning="برهنگی و صافی؛ تمرّد: سرکشی و خو گرفتن به نافرمانی." data-context="سرکش؛ وصفِ شیطان.">مارِدٍ</button>
  </p>
  <p class="farsi-verse">و برای حفاظت از هر شیطان سرکش.</p>
</section>
