<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَشَّرنٰهُ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">وَبَشَّرنٰهُ</button>
    <button class="word-link" type="button" data-word="بِإِسحٰقَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بِإِسحٰقَ</button>
    <button class="word-link" type="button" data-word="نَبِيًّا" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">نَبِيًّا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحينَ</button>
  </p>
  <p class="farsi-verse">و او را به اسحاق مژده دادیم، پیامبری از شایستگان.</p>
</section>
