<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَتَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">أَتَدعونَ</button>
    <button class="word-link" type="button" data-word="بَعلًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">بَعلًا</button>
    <button class="word-link" type="button" data-word="وَتَذَرونَ" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَتَذَرونَ</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="الخٰلِقينَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">الخٰلِقينَ</button>
  </p>
  <p class="farsi-verse">آیا بعل را می‌خوانید و بهترین آفرینندگان را رها می‌کنید،</p>
</section>
