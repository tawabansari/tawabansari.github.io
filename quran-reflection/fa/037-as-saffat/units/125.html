<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَتَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="آیا می‌خوانید؛ پرسشِ الیاس دربارهٔ خواندنِ بعل به عنوان معبود">أَتَدعونَ</button>
    <button class="word-link" type="button" data-word="بَعلًا" data-root="ب ع ل" data-root-meaning="در کاربرد خانوادگی، بعل یعنی شوهر؛ مردِ طرفِ رابطهٔ همسری. در داستان الیاس، بعل نام یا عنوان معبودی است که به جای خداوند خوانده می‌شده است." data-context="بعل؛ نام یا عنوان معبودی که قوم الیاس به جای خداوند می‌خواندند، نه شوهر" data-learn-more="/quran-terminology/fa/roots/b-ayn-l/" data-root-note="نام یا عنوان معبود در داستان الیاس.">بَعلًا</button>
    <button class="word-link" type="button" data-word="وَتَذَرونَ" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="و وا می‌گذارید؛ روی گرداندن از نیکوترین آفرینندگان">وَتَذَرونَ</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوترین؛ وصفِ آفریننده‌ای که به جای بعل باید خوانده شود">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="الخٰلِقينَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینندگان؛ در ترکیبِ «نیکوترین آفرینندگان»">الخٰلِقينَ</button>
  </p>
  <p class="farsi-verse">آیا بعل را می‌خوانید و بهترین آفرینندگان را رها می‌کنید،</p>
</section>
