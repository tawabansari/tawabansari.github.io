<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَقبَلوا" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">فَأَقبَلوا</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="يَزِفّونَ" data-root="ز ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-f-f/" data-root-meaning="شتابان آمدن و حرکت کردن.">يَزِفّونَ</button>
  </p>
  <p class="farsi-verse">پس شتابان به سوی او آمدند.</p>
