<section class="ayah-block" id="ayah-145" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَنَبَذنٰهُ" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین">فَنَبَذنٰهُ</button>
    <button class="word-link" type="button" data-word="بِالعَراءِ" data-root="ع ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-y/" data-root-meaning="برهنه و بی‌پوشش بودن؛ عراء: جای باز و بی‌پناه.">بِالعَراءِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="سَقيمٌ" data-root="س ق م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-q-m/" data-root-meaning="بیماری و ناخوشی.">سَقيمٌ</button>
  </p>
  <p class="farsi-verse">پس او را در زمینی برهنه افکندیم، در حالی که بیمار بود.</p>
