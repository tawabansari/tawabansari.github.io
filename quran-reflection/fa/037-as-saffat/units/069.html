<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="أَلفَوا" data-root="ل ف و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-f-w/" data-root-meaning="یافتن و برخوردن به کسی یا چیزی در حالتی.">أَلفَوا</button>
    <button class="word-link" type="button" data-word="ءاباءَهُم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">ءاباءَهُم</button>
    <button class="word-link" type="button" data-word="ضالّينَ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">ضالّينَ</button>
  </p>
  <p class="farsi-verse">آنان پدرانشان را گمراه یافتند،</p>
