<section class="ayah-block" id="ayah-113" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبٰرَكنا" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="بر او و اسحاق برکت نهادیم؛ بدون تضمینِ نیکوکاری همهٔ نسلِ آنان." data-learn-more="/quran-terminology/fa/roots/b-r-k/">وَبٰرَكنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="إِسحٰقَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسحٰقَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتِهِما" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="از نسلِ آن دو؛ فرزندانِ ابراهیم و اسحاق.">ذُرِّيَّتِهِما</button>
    <button class="word-link" type="button" data-word="مُحسِنٌ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوکار؛ یکی از گروه‌های نسلِ آنان.">مُحسِنٌ</button>
    <button class="word-link" type="button" data-word="وَظالِمٌ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگر؛ در اینجا کسی که بر خود ستم می‌کند.">وَظالِمٌ</button>
    <button class="word-link" type="button" data-word="لِنَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="بر خودِ او؛ جهتِ ستمِ بیان‌شده.">لِنَفسِهِ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصفِ ستمِ بیان‌شده.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">و بر او و بر اسحاق برکت نهادیم؛ و از فرزندان آن دو، نیکوکار هست و کسی که آشکارا بر خود ستم می‌کند.</p>
</section>
