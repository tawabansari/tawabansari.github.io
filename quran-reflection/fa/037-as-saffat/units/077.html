<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتَهُ" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه">ذُرِّيَّتَهُ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الباقينَ" data-root="ب ق ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-q-y/" data-root-meaning="ماندن و از میان نرفتن؛ بقية: آنچه باقی مانده است.">الباقينَ</button>
  </p>
  <p class="farsi-verse">و فرزندان او را همان بازماندگان قرار دادیم.</p>
</section>
