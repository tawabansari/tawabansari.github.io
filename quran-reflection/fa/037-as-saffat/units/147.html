<section class="ayah-block" id="ayah-147" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَرسَلنٰهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَأَرسَلنٰهُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="مِا۟ئَةِ" data-root="م أ ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-a-y/" data-root-meaning="عدد صد و صورت‌های وابسته آن.">مِا۟ئَةِ</button>
    <button class="word-link" type="button" data-word="أَلفٍ" data-root="أ ل ف" data-learn-more="/quran-terminology/fa/roots/a-l-f/" data-root-meaning="أَلَّفَ؛ پیوند دادن، خو گرفتن و برقرار شدن انس و همراهی">أَلفٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يَزيدونَ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">يَزيدونَ</button>
  </p>
  <p class="farsi-verse">و او را به سوی صد هزار تن یا بیشتر فرستادیم.</p>
