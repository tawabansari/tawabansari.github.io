<section class="ayah-block" id="ayah-116" data-translation-status="provisional">
  <h2 class="ayah-title">الصافات ۳۷:۱۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَصَرنٰهُم" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد">وَنَصَرنٰهُم</button>
    <button class="word-link" type="button" data-word="فَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَكانوا</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الغٰلِبينَ" data-root="غ ل ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الغٰلِبينَ</button>
  </p>
  <p class="farsi-verse">و آنان را یاری کردیم، پس آنان پیروز شدند.</p>
</section>
