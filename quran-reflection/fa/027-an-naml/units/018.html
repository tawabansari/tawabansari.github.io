  <p class="farsi-verse">تا چون به درهٔ مورچگان رسیدند، مورچه‌ای گفت: ای مورچگان، به خانه‌هایتان درآیید تا سلیمان و سپاهیانش شما را ناآگاهانه درهم نشکنند.</p>
