<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعلوا" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن.">تَعلوا</button>
    <button class="word-link" type="button" data-word="عَلَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَىَّ</button>
    <button class="word-link" type="button" data-word="وَأتونى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَأتونى</button>
    <button class="word-link" type="button" data-word="مُسلِمينَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">مُسلِمينَ</button>
  </p>
  <p class="farsi-verse">بر من برتری مجویید و تسلیم‌شده نزد من بیایید.</p>
</section>
