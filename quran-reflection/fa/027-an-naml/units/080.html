<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُسمِعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="نمی‌توانی بشنوانی؛ در تصویرِ مردگان.">تُسمِعُ</button>
    <button class="word-link" type="button" data-word="المَوتىٰ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مردگان؛ در تصویر نشنیدن دعوت.">المَوتىٰ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُسمِعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="نمی‌توانی بشنوانی؛ دربارهٔ کران.">تُسمِعُ</button>
    <button class="word-link" type="button" data-word="الصُّمَّ" data-root="ص م م" data-learn-more="/quran-terminology/fa/roots/sad-m-m/" data-root-meaning="کری، بسته بودن راه شنیدن، سختی، انسداد، و نفوذناپذیری نسبت به صدا یا پیام" data-context="کران؛ در تصویر مخاطبان دعوت.">الصُّمَّ</button>
    <button class="word-link" type="button" data-word="الدُّعاءَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="دعوت و فراخوانی که شنیده نمی‌شود.">الدُّعاءَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="وَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="روی گردانند؛ در توصیفِ پشت کردن.">وَلَّوا</button>
    <button class="word-link" type="button" data-word="مُدبِرينَ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت‌کنان؛ حالتِ مخاطبان در تصویر نشنیدن دعوت.">مُدبِرينَ</button>
  </p>
  <p class="farsi-verse">تو مردگان را شنوا نمی‌کنی و ندا را به کران نمی‌شنوانی هنگامی که پشت‌کنان روی می‌گردانند.</p>
</section>
