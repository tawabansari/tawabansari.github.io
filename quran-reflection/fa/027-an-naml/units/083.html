<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">وَيَومَ</button>
    <button class="word-link" type="button" data-word="نَحشُرُ" data-root="ح ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sh-r/" data-root-meaning="گرد آوردن و از جایگاه‌ها به سوی یک محل راندن.">نَحشُرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="فَوجًا" data-root="ف و ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-j/" data-root-meaning="گروه و دسته‌ای که با هم می‌آیند.">فَوجًا</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّن</button>
    <button class="word-link" type="button" data-word="يُكَذِّبُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">يُكَذِّبُ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="يوزَعونَ" data-root="و ز ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-z-ayn/" data-root-meaning="بازداشتن و سامان دادن جمع؛ ایزاع: برانگیختن و توفیق انجام دادن.">يوزَعونَ</button>
  </p>
  <p class="farsi-verse">و روزی که از هر امتی گروهی از کسانی را که آیات ما را تکذیب می‌کنند گرد آوریم، پس به نظم نگه داشته می‌شوند؛</p>
</section>
