<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سُلَيمٰنَ</button>
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِسمِ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="به نام؛ «بِـ» حرف جر است و «اسم» به نام، شناسه یا نشانه‌ای برای شناخت اشاره دارد. در این عبارت، آغاز کردن با نام و یاد آن معبود یگانه.">بِسمِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم.">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت و پیوند پرورنده" data-context="رحمت فراگیر، سرشار و همه‌پوش آن معبود یگانه">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="الرَّحيمِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت و پیوند پرورنده" data-context="رحمت پایدار، نزدیک و ویژه‌ای که در هدایت و رشد جاری می‌شود">الرَّحيمِ</button>
  </p>
  <p class="farsi-verse">آن از سلیمان است و آن چنین است: به نام <a href="/fa/quran-terminology/allah-khodavand-parvardegar/">آن معبود یگانه</a>؛ <a href="/fa/quran-terminology/allah-khodavand-parvardegar/#tanzih-hyper">فرارحمن، با رحمت فراگیر</a>؛ <a href="/fa/quran-terminology/allah-khodavand-parvardegar/#tanzih-hyper">فرارحیم، با رحمت ویژه</a>.</p>
</section>
