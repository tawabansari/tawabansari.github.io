<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالُوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالُوا</button>
    <button class="word-link" type="button" data-word="اطَّيَّرنا" data-root="ط ي ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">اطَّيَّرنا</button>
    <button class="word-link" type="button" data-word="بِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكَ</button>
    <button class="word-link" type="button" data-word="وَبِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَبِمَن</button>
    <button class="word-link" type="button" data-word="مَعَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="طٰئِرُكُم" data-root="ط ي ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">طٰئِرُكُم</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومٌ</button>
    <button class="word-link" type="button" data-word="تُفتَنونَ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">تُفتَنونَ</button>
  </p>
  <p class="farsi-verse">گفتند: تو و همراهانت را به فال بد گرفته‌ایم. گفت: فال شما نزد آن معبود یگانه است؛ بلکه شما قومی هستید که آزموده می‌شوید.</p>
</section>
