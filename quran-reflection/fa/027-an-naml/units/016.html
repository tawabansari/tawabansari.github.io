<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوَرِثَ" data-root="و ر ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَوَرِثَ</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سُلَيمٰنُ</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">داوۥدَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="عُلِّمنا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عُلِّمنا</button>
    <button class="word-link" type="button" data-word="مَنطِقَ" data-root="ن ط ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَنطِقَ</button>
    <button class="word-link" type="button" data-word="الطَّيرِ" data-root="ط ي ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الطَّيرِ</button>
    <button class="word-link" type="button" data-word="وَأوتينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَأوتينا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَىءٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="لَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُوَ</button>
    <button class="word-link" type="button" data-word="الفَضلُ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده.">الفَضلُ</button>
    <button class="word-link" type="button" data-word="المُبينُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">المُبينُ</button>
  </p>
  <p class="farsi-verse">و سلیمان از داوود ارث برد و گفت: ای مردم، زبان پرندگان به ما آموخته شده و از هر چیز به ما داده شده است؛ این همان فضل آشکار است.</p>
</section>
