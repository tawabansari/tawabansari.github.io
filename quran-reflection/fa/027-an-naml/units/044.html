  </p>
  <p class="farsi-verse">به او گفته شد: به کاخ درآی. پس چون آن را دید، گمان کرد آب ژرفی است و ساق‌هایش را برهنه کرد. گفت: این کاخی هموار از شیشه است. گفت: پروردگارا، من به خود ستم کردم و همراه سلیمان تسلیم آن معبود یگانه، پروردگار جهانیان شدم.</p>
</section>
