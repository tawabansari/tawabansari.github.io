<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۷۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَحزَن" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون">تَحزَن</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="ك و ن" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">تَكُن</button>

    <button class="word-link" type="button" data-word="يَمكُرونَ" data-root="م ك ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَمكُرونَ</button>
  </p>
  <p class="farsi-verse">و بر آنان اندوهگین مباش و از آنچه نیرنگ می‌کنند در تنگنا مباش.</p>
