  <p class="farsi-verse">پس از سخن او لبخندی خندان زد و گفت: پروردگارا، مرا برانگیز تا نعمتی را که به من و پدر و مادرم ارزانی داشته‌ای سپاس گزارم و کاری شایسته کنم که آن را بپسندی؛ و مرا به رحمتت در میان بندگان شایسته‌ات درآور.</p>
