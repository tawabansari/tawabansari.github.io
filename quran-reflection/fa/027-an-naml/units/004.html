<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِالـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">بِالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="زَيَّنّا" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن.">زَيَّنّا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">أَعمٰلَهُم</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="يَعمَهونَ" data-root="ع م ه" data-learn-more="/quran-terminology/fa/roots/ayn-m-h2/" data-root-meaning="سرگردان شدن، حیران ماندن، حرکت بی‌جهت، و نابینایی درونی نسبت به راه درست">يَعمَهونَ</button>
  </p>
  <p class="farsi-verse">کسانی که به آخرت ایمان نمی‌آورند، کارهایشان را برایشان آراسته‌ایم؛ پس سرگردان‌اند.</p>
</section>
