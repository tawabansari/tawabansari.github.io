  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَكَروا" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است.">وَمَكَروا</button>

    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">و نیرنگی چیدند و ما نیز تدبیری کردیم، در حالی که درنمی‌یافتند.</p>
