  <p class="farsi-verse">گفتند: با یکدیگر به آن معبود یگانه سوگند بخورید که شبانه به او و خانواده‌اش حمله کنیم؛ سپس به سرپرستش بگوییم: ما شاهد نابودی خانواده‌اش نبودیم و راست‌گوییم.</p>
