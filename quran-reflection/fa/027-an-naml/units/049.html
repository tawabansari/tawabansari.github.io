<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="تَقاسَموا" data-root="ق س م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-m/" data-root-meaning="تقسیم و بهره‌بندی؛ قَسَم: سوگند.">تَقاسَموا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَنُبَيِّتَنَّهُ" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/" data-root-meaning="خانه و جای اقامت؛ بات: شب را گذراندن؛ تبییت: ترتیب دادن کاری در شب یا پنهانی." data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست.">لَنُبَيِّتَنَّهُ</button>
    <button class="word-link" type="button" data-word="وَأَهلَهُ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">وَأَهلَهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَنَقولَنَّ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">لَنَقولَنَّ</button>
    <button class="word-link" type="button" data-word="لِوَلِيِّهِ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">لِوَلِيِّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="شَهِدنا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">شَهِدنا</button>
    <button class="word-link" type="button" data-word="مَهلِكَ" data-root="ه ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-l-k/" data-root-meaning="از میان رفتن و نابود کردن؛ نیز از دست رفتن، بنا بر سیاق.">مَهلِكَ</button>
    <button class="word-link" type="button" data-word="أَهلِهِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلِهِ</button>
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَصٰدِقونَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">لَصٰدِقونَ</button>
  </p>
  <p class="farsi-verse">گفتند: با یکدیگر به آن معبود یگانه سوگند بخورید که شبانه به او و خانواده‌اش حمله کنیم؛ سپس به سرپرستش بگوییم: ما شاهد نابودی خانواده‌اش نبودیم و راست‌گوییم.</p>
</section>
