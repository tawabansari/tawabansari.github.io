<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۹۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُلِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">وَقُلِ</button>
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/">الحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="سَيُريكُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/">سَيُريكُم</button>
    <button class="word-link" type="button" data-word="ءايٰتِهِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">ءايٰتِهِ</button>
    <button class="word-link" type="button" data-word="فَتَعرِفونَها" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/">فَتَعرِفونَها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="بِغٰفِلٍ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/">بِغٰفِلٍ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">تَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و بگو: ستایش برای آن معبود یگانه است. نشانه‌هایش را به شما نشان خواهد داد، پس آنها را خواهید شناخت؛ و پروردگارت از آنچه می‌کنید غافل نیست.</p>
</section>
