  <p class="farsi-verse">یا آنکه شما را در تاریکی‌های خشکی و دریا راه می‌نماید و بادها را پیشاپیش رحمتش مژده‌رسان می‌فرستد؟ آیا معبودی با آن معبود یگانه است؟ آن معبود یگانه برتر است از آنچه شریک می‌گیرند.</p>
