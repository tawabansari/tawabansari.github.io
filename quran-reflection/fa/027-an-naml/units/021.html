<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَأُعَذِّبَنَّهُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">لَأُعَذِّبَنَّهُ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابًا</button>
    <button class="word-link" type="button" data-word="شَديدًا" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شَديدًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="لَأَا۟ذبَحَنَّهُ" data-root="ذ ب ح" data-learn-more="/quran-terminology/fa/roots/dh-b-h/" data-root-meaning="بریدن گلو و پایان‌دادن به حیات از راه ذبح">لَأَا۟ذبَحَنَّهُ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="لَيَأتِيَنّى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">لَيَأتِيَنّى</button>
    <button class="word-link" type="button" data-word="بِسُلطٰنٍ" data-root="س ل ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-tt/" data-root-meaning="توان چیرگی؛ سلطان: قدرت، اختیار یا دلیل نافذ، بنا بر سیاق.">بِسُلطٰنٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">مُبينٍ</button>
  </p>
  <p class="farsi-verse">حتماً او را عذابی سخت می‌دهم یا سرش را می‌برم، مگر آنکه دلیلی روشن برایم بیاورد.</p>
