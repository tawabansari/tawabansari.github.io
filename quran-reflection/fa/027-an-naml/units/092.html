  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَن</button>

    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">القُرءانَ</button>

    <button class="word-link" type="button" data-word="اهتَدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">اهتَدىٰ</button>

    <button class="word-link" type="button" data-word="ضَلَّ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">ضَلَّ</button>

    <button class="word-link" type="button" data-word="المُنذِرينَ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">المُنذِرينَ</button>
  </p>
  <p class="farsi-verse">و قرآن را بخوانم. پس هرکس راه یابد، تنها به سود خود راه می‌یابد؛ و هرکس گمراه شود، بگو: من فقط از هشداردهندگانم.</p>
