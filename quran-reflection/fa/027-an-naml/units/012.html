<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَدخِل" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="و داخل کن و فرو ببر.">وَأَدخِل</button>
    <button class="word-link" type="button" data-word="يَدَكَ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست خود را.">يَدَكَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَيبِكَ" data-root="ج ي ب" data-root-meaning="گشودگی بالای جامه در ناحیهٔ گردن و بالای سینه؛ گریبان." data-context="گریبان و شکافِ جامهٔ تو." data-learn-more="/quran-terminology/fa/roots/j-y-b/">جَيبِكَ</button>
    <button class="word-link" type="button" data-word="تَخرُج" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون آید.">تَخرُج</button>
    <button class="word-link" type="button" data-word="بَيضاءَ" data-root="ب ي ض" data-root-meaning="«ب ي ض» در اصل به سپیدی به‌عنوان یک ویژگی رنگی اشاره دارد. از این معنا، وصف سفید بودن و فعل سفید شدن پدید آمده است. «بَيْضَة» نیز نام تخم پرنده است که در عربی کهن به این خانواده تعلق داشته و سپس در تشبیه‌ها و نام‌گذاری بعضی اشیای همانند به کار رفته است." data-context="سفید؛ وصفِ دست بیرون‌آمده از گریبان، بدون آسیب." data-learn-more="/quran-terminology/fa/roots/b-y-dad/">بَيضاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="غَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="بدون؛ در نفی آسیب.">غَيرِ</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="آسیب و عارضه؛ در عبارتِ نفیِ آن.">سوءٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="تِسعِ" data-root="ت س ع" data-learn-more="/quran-terminology/fa/roots/t-s-ayn/" data-root-meaning="عدد نه، نود، نودونه و نوزده؛ ریشه‌ای عددی که معنای آن مقدار است و نقش هر کاربرد را سیاق تعیین می‌کند" data-context="نه؛ شمار نشانه‌ها.">تِسعِ</button>
    <button class="word-link" type="button" data-word="ءايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌ها.">ءايٰتٍ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَقَومِهِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="و مردم و قوم فرعون." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">وَقَومِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ در وصف قوم.">كانوا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="مردم و قومی." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">قَومًا</button>
    <button class="word-link" type="button" data-word="فٰسِقينَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="نافرمان و بیرون‌رونده از مرز فرمان.">فٰسِقينَ</button>
  </p>
  <p class="farsi-verse">و دستت را در گریبانت ببر تا بی‌هیچ آسیبی سفید بیرون آید؛ در شمار نُه نشانه به سوی فرعون و قومش؛ آنان قومی نافرمان بودند.</p>
</section>
