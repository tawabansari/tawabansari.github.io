<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَفَقَّدَ" data-root="ف ق د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-d/" data-root-meaning="نبودن چیزی و از دست دادن؛ تفقّد: سراغ گرفتن و بررسی کردن." data-context="و سراغ گرفت و بازبینی کرد؛ بررسی پرندگان از سوی سلیمان.">وَتَفَقَّدَ</button>
    <button class="word-link" type="button" data-word="الطَّيرَ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق." data-context="پرندگان؛ گروهی که سلیمان آنان را بازبینی می‌کند.">الطَّيرَ</button>
    <button class="word-link" type="button" data-word="فَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس گفت؛ سخن سلیمان پس از بازبینی پرندگان.">فَقالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِىَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="أَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینم؛ در عبارتِ «چرا هدهد را نمی‌بینم؟»، ندیدن پرنده را بیان می‌کند.">أَرَى</button>
    <button class="word-link" type="button" data-word="الهُدهُدَ" data-root="ه د ه د" data-root-meaning="«هُدْهُد» نام پرنده‌ای کاکل‌دار با آوای مشخص است. در خانوادهٔ لغوی «ه د ه د»، کاربردهایی برای تکرار صدا و حرکت دادن نیز ثبت شده‌اند. در قرآن، این واژه تنها به‌عنوان نام پرنده‌ای در داستان سلیمان آمده است." data-context="هدهد؛ پرندهٔ مشخصی که سلیمان هنگام بازبینی پرندگان او را نمی‌دید." data-learn-more="/quran-terminology/fa/roots/h2-d-h2-d/">الهُدهُدَ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود یا هست؛ در پرسش از اینکه هدهد در شمار غایبان قرار دارد.">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغائِبينَ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد" data-context="غایبان؛ کسانی که حاضر نیستند، در پرسش سلیمان دربارهٔ نبودن هدهد.">الغائِبينَ</button>
  </p>
  <p class="farsi-verse">و پرندگان را بررسی کرد و گفت: مرا چه شده که هدهد را نمی‌بینم؟ یا از غایبان است؟</p>
</section>
