<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَلقِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="و بیفکن؛ فرمان به موسی دربارهٔ عصا.">وَأَلقِ</button>
    <button class="word-link" type="button" data-word="عَصاكَ" data-root="ع ص و" data-learn-more="/quran-terminology/fa/roots/ayn-sad-w/" data-root-meaning="عصا، تکیه‌گاه، ابزار مهار، و وسیله‌ای برای جمع کردن توان و نظم دادن به حرکت." data-context="عصای تو؛ آنچه موسی به افکندنش مأمور شد.">عَصاكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="رَءاها" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آن را دید؛ مشاهدهٔ حرکت عصا.">رَءاها</button>
    <button class="word-link" type="button" data-word="تَهتَزُّ" data-root="ه ز ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-z-z/" data-root-meaning="تکان دادن و جنبش شدید." data-context="می‌جنبد؛ دربارهٔ عصا در تشبیه به جان.">تَهتَزُّ</button>
    <button class="word-link" type="button" data-word="كَأَنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّها</button>
    <button class="word-link" type="button" data-word="جانٌّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="جان؛ ماری که جنبش عصا به آن تشبیه می‌شود.">جانٌّ</button>
    <button class="word-link" type="button" data-word="وَلّىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="روی گرداند؛ دربارهٔ واکنش موسی.">وَلّىٰ</button>
    <button class="word-link" type="button" data-word="مُدبِرًا" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت‌کنان و در حال دور شدن؛ وصف واکنش موسی.">مُدبِرًا</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="يُعَقِّب" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار" data-context="بازنگشت؛ در بیان ادامهٔ دور شدن موسی.">يُعَقِّب</button>
    ۚ
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰموسىٰ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَخَف" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="مترس؛ خطاب اطمینان‌بخش به موسی.">تَخَف</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَخافُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم ندارند؛ در بیان حال فرستادگان نزد آن معبود یگانه.">يَخافُ</button>
    <button class="word-link" type="button" data-word="لَدَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدَىَّ</button>
    <button class="word-link" type="button" data-word="المُرسَلونَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادگان؛ کسانی که در پیشگاه الهی بیم ندارند.">المُرسَلونَ</button>
  </p>
  <p class="farsi-verse">و عصایت را بیفکن. پس چون آن را دید که می‌جنبد، گویی ماری است، پشت کرد و بازنگشت. ای موسی، نترس؛ فرستادگان نزد من نمی‌ترسند؛</p>
</section>
