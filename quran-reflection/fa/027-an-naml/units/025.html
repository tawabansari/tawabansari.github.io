<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="يَسجُدوا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="سجده کنند؛ با «أَلَّا» در ادامهٔ سیاق پیشین: تا برای آن معبود یگانه سجده نکنند.">يَسجُدوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُخرِجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون می‌آورد؛ آن معبود یگانه نهفته‌های آسمان‌ها و زمین را بیرون می‌آورد.">يُخرِجُ</button>
    <button class="word-link" type="button" data-word="الخَبءَ" data-root="خ ب أ" data-root-meaning="پوشاندن و پنهان نگه داشتن؛ خَبْء: چیز پوشیده و نهفته." data-context="آنچه در آسمان‌ها و زمین نهفته است و آن معبود یگانه آن را بیرون می‌آورد." data-learn-more="/quran-terminology/fa/roots/kh-b-a/">الخَبءَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ یکی از دو گستره‌ای که نهفته‌های آن را آن معبود یگانه بیرون می‌آورد.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ گسترهٔ دیگرِ نهفته‌هایی که آن معبود یگانه بیرون می‌آورد.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَيَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و می‌داند؛ آن معبود یگانه از آنچه مخاطبان پنهان یا آشکار می‌کنند آگاه است.">وَيَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تُخفونَ" data-root="خ ف ي" data-root-meaning="پوشیده بودن و پنهان ماندن؛ پنهان کردن؛ و در شاخه‌ای از عربی کهن، آشکار شدن یا آشکار ساختن چیزی پوشیده." data-context="پنهان می‌کنید؛ آنچه از دید یا آگاهی دیگران پوشیده نگه می‌دارید." data-learn-more="/quran-terminology/fa/roots/kh-f-y/">تُخفونَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تُعلِنونَ" data-root="ع ل ن" data-learn-more="/quran-terminology/fa/roots/ayn-l-n/" data-root-meaning="آشکار بودن و آشکار ساختن در برابر حوزه پنهان" data-context="آشکار می‌کنید؛ آنچه علنی می‌سازید و از پنهانی بیرون می‌آورید.">تُعلِنونَ</button>
  </p>
  <p class="farsi-verse">تا برای آن معبود یگانه سجده نکنند؛ همان که نهان را در آسمان‌ها و زمین بیرون می‌آورد و آنچه پنهان و آشکار می‌کنید می‌داند.</p>
</section>
