<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّكَ</button>
    <button class="word-link" type="button" data-word="لَتُلَقَّى" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">لَتُلَقَّى</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-a/" data-root-meaning="خواندن و تلاوت؛ قروء: دوره‌های قاعدگی یا پاکی، با اختلاف در تفسیر.">القُرءانَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لَدُن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدُن</button>
    <button class="word-link" type="button" data-word="حَكيمٍ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">حَكيمٍ</button>
    <button class="word-link" type="button" data-word="عَليمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَليمٍ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان تو قرآن را از نزد حکیمی دانا دریافت می‌کنی.</p>
</section>
