  <p class="farsi-verse">و کوه‌ها را می‌بینی و آنها را بی‌حرکت می‌پنداری، در حالی که همچون ابر می‌گذرند؛ ساختهٔ آن معبود یگانه که هر چیز را استوار ساخته است. او به آنچه می‌کنید آگاه است.</p>
