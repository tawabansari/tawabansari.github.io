<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۸۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و می‌بینی؛ دیدن کوه‌ها در بیان آیه.">وَتَرَى</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ با وجود تصور بی‌حرکتی، در آیه به گذشتن مانند ابرها وصف می‌شوند." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالَ</button>
    <button class="word-link" type="button" data-word="تَحسَبُها" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="آنها را می‌پنداری؛ تصور کوه‌ها به صورت بی‌حرکت.">تَحسَبُها</button>
    <button class="word-link" type="button" data-word="جامِدَةً" data-root="ج م د" data-root-meaning="منجمد شدن و بازایستادن جریان؛ و در کاربرد قرآنی، ثابت و بی‌حرکت بودن." data-context="بی‌حرکت؛ حالتی که بیننده برای کوه‌ها می‌پندارد." data-learn-more="/quran-terminology/fa/roots/j-m-d/">جامِدَةً</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="تَمُرُّ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="می‌گذرند؛ حرکتِ بیان‌شده دربارهٔ کوه‌ها.">تَمُرُّ</button>
    <button class="word-link" type="button" data-word="مَرَّ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="گذر؛ مصدرِ فعل که با ابرها مقایسه شده است.">مَرَّ</button>
    <button class="word-link" type="button" data-word="السَّحابِ" data-root="س ح ب" data-root-meaning="کشیدن، امتداد یافتن و ابر؛ از کشیده شدن چیزی بر زمین تا حرکت ابرها در آسمان و کشانده شدن انسان در صحنه عذاب" data-learn-more="/quran-terminology/fa/roots/s-h-b/" data-context="ابرها؛ معیار تشبیه برای گذر کوه‌ها.">السَّحابِ</button>
    ۚ
    <button class="word-link" type="button" data-word="صُنعَ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر." data-context="ساخت و آفرینش؛ نسبت دادن این کار به آن معبود یگانه.">صُنعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَتقَنَ" data-root="ت ق ن" data-learn-more="/quran-terminology/fa/roots/t-q-n/" data-root-meaning="دقیق، استوار، هماهنگ و بی‌خلل ساختن؛ پرداخت سنجیده یک ساخته" data-context="استوار و دقیق ساخت؛ وصفِ ساختن هر چیز.">أَتقَنَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ شمول تعبیر نسبت به هر چیز.">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیز؛ آفریده یا امری که ساختِ دقیق به آن نسبت داده می‌شود.">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="خ ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-b-r/" data-root-meaning="خبر و آگاهی حاصل از شناخت و تجربه." data-context="آگاه؛ وصف آگاهی الهی به کار مخاطبان.">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَفعَلونَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="انجام می‌دهید؛ کارهای مخاطبان.">تَفعَلونَ</button>
  </p>
  <p class="farsi-verse">و کوه‌ها را می‌بینی و آنها را بی‌حرکت می‌پنداری، در حالی که همچون ابر می‌گذرند؛ ساختهٔ آن معبود یگانه که هر چیز را استوار ساخته است. او به آنچه می‌کنید آگاه است.</p>
</section>
