<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۸۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">وَتَرَى</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند.">الجِبالَ</button>
    <button class="word-link" type="button" data-word="تَحسَبُها" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">تَحسَبُها</button>
    <button class="word-link" type="button" data-word="جامِدَةً" data-root="ج م د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-m-d/" data-root-meaning="بسته و سخت شدن و از حرکت ایستادن؛ جامد: ثابت و بی‌جنبش به نظر رسنده.">جامِدَةً</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="تَمُرُّ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت.">تَمُرُّ</button>
    <button class="word-link" type="button" data-word="مَرَّ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت.">مَرَّ</button>
    <button class="word-link" type="button" data-word="السَّحابِ" data-root="س ح ب" data-root-meaning="کشیدن، امتداد یافتن و ابر؛ از کشیده شدن چیزی بر زمین تا حرکت ابرها در آسمان و کشانده شدن انسان در صحنه عذاب" data-learn-more="/quran-terminology/fa/roots/s-h-b/">السَّحابِ</button>
    ۚ
    <button class="word-link" type="button" data-word="صُنعَ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر.">صُنعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَتقَنَ" data-root="ت ق ن" data-learn-more="/quran-terminology/fa/roots/t-q-n/" data-root-meaning="دقیق، استوار، هماهنگ و بی‌خلل ساختن؛ پرداخت سنجیده یک ساخته">أَتقَنَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="خ ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-b-r/" data-root-meaning="خبر و آگاهی حاصل از شناخت و تجربه.">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَفعَلونَ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">تَفعَلونَ</button>
  </p>
  <p class="farsi-verse">و کوه‌ها را می‌بینی و آنها را بی‌حرکت می‌پنداری، در حالی که همچون ابر می‌گذرند؛ ساختهٔ آن معبود یگانه که هر چیز را استوار ساخته است. او به آنچه می‌کنید آگاه است.</p>
</section>
