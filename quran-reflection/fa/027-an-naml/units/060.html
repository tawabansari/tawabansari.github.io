<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّن</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرید؛ دربارهٔ آسمان‌ها و زمین.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ بخشی از آفرینش یادشده در پرسش آیه.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ در کنار آسمان‌ها، آفریدهٔ آن آفریننده.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَأَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="و فرو فرستاد؛ دربارهٔ آب از آسمان.">وَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ جهتی که باران از آن فرو می‌آید.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="آب؛ بارانی که به وسیلهٔ آن باغ‌ها رویانده می‌شوند.">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَنبَتنا" data-root="ن ب ت" data-learn-more="/quran-terminology/fa/roots/n-b-t/" data-root-meaning="روییدن، رویاندن و آشکار شدن حیات از بستر مناسب" data-context="پس رویاندیم؛ دربارهٔ باغ‌هایی دارای زیبایی و طراوت.">فَأَنبَتنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="حَدائِقَ" data-root="ح د ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-d-q/" data-root-meaning="احاطه کردن؛ حدیقه و حدائق: باغ و باغ‌های محصور یا مشخص." data-context="باغ‌ها؛ باغستان‌های دارای درخت و زیباییِ رویش.">حَدائِقَ</button>
    <button class="word-link" type="button" data-word="ذاتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذاتَ</button>
    <button class="word-link" type="button" data-word="بَهجَةٍ" data-root="ب ه ج" data-root-meaning="«ب ه ج» به زیبایی و طراوت آشکاری اشاره دارد که در رنگ، ظاهر یا جلوه چیزی نمایان می‌شود؛ و در کاربرد مربوط به انسان، به شادی و خوشی‌ای گفته می‌شود که از برخورد با چیزی خوشایند پدید می‌آید و ممکن است در چهره و رفتار نیز آشکار گردد." data-context="زیبایی و طراوت؛ در «باغ‌هایی دارای زیبایی و طراوت»، وصف جلوهٔ خوشایند باغ‌ها." data-learn-more="/quran-terminology/fa/roots/b-h2-j/">بَهجَةٍ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ در «برای شما ممکن نبود»، دربارهٔ رویاندن درختان باغ‌ها.">كانَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُنبِتوا" data-root="ن ب ت" data-learn-more="/quran-terminology/fa/roots/n-b-t/" data-root-meaning="روییدن، رویاندن و آشکار شدن حیات از بستر مناسب" data-context="برویانید؛ دربارهٔ درختان آن باغ‌ها.">تُنبِتوا</button>
    <button class="word-link" type="button" data-word="شَجَرَها" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل" data-context="درختانِ آن؛ درختان باغ‌های یادشده.">شَجَرَها</button>
    ۗ
    <button class="word-link" type="button" data-word="أَءِلٰهٌ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="آیا معبودی؛ پرسش از وجود معبودی در کنار آن معبود یگانه.">أَءِلٰهٌ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و «قوم»، گروه انسانی، مردم یا جامعه." data-context="مردم یا گروهی انسانی؛ وصف مخاطبانی که همتا قرار می‌دهند.">قَومٌ</button>
    <button class="word-link" type="button" data-word="يَعدِلونَ" data-root="ع د ل" data-learn-more="/quran-terminology/fa/roots/ayn-d-l/" data-root-meaning="هم‌سنگ‌کردن، راست‌داشتن، برابرنهادن، و قرار دادن هر چیز در نسبتی که از کژی و یک‌طرفه‌شدن جلوگیری کند" data-context="همتا قرار می‌دهند؛ در این سیاق، دیگران را هم‌پایهٔ آن معبود یگانه می‌گیرند؛ روی‌گردانی از حق نیز در تفسیر این فعل آمده است.">يَعدِلونَ</button>
  </p>
  <p class="farsi-verse">یا آنکه آسمان‌ها و زمین را آفرید و از آسمان برای شما آبی فرو فرستاد، پس با آن باغ‌هایی دل‌انگیز رویاندیم که شما توان رویاندن درختانشان را نداشتید؟ آیا معبودی با آن معبود یگانه است؟ بلکه آنان قومی‌اند که همتا می‌گیرند.</p>
</section>
