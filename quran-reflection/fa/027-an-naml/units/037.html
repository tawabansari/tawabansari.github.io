<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ارجِع" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">ارجِع</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="فَلَنَأتِيَنَّهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">فَلَنَأتِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="بِجُنودٍ" data-root="ج ن د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِجُنودٍ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="قِبَلَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قِبَلَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="وَلَنُخرِجَنَّهُم" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">وَلَنُخرِجَنَّهُم</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="أَذِلَّةً" data-root="ذ ل ل" data-learn-more="/quran-terminology/fa/roots/dh-l-l/" data-root-meaning="رام‌شدن، دسترس‌پذیری، فروتنی و فرو افتادن از عزت">أَذِلَّةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="صٰغِرونَ" data-root="ص غ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صٰغِرونَ</button>
  </p>
  <p class="farsi-verse">به سوی آنان بازگرد؛ حتماً با سپاهیانی به سراغشان می‌آییم که توان رویارویی با آنها را ندارند، و آنان را خوار و سرافکنده از آنجا بیرون خواهیم کرد.</p>
</section>
