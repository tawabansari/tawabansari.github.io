<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَلِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَلِ</button>
    <button class="word-link" type="button" data-word="ادّٰرَكَ" data-root="د ر ك" data-learn-more="/quran-terminology/fa/roots/d-r-k/" data-root-meaning="رسیدن و دست یافتن؛ دریافت حسی یا شناختی، پیوستن و تدارک؛ و در «دَرْك»، مرتبهٔ پایین." data-context="دانششان به نهایت رسیده است؛ با اختلاف تحلیل دربارهٔ پایان شناخت یا رسیدن دیرهنگام آن در آخرت.">ادّٰرَكَ</button>
    <button class="word-link" type="button" data-word="عِلمُهُم" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانششان؛ موضوع جمله دربارهٔ شناخت آخرت.">عِلمُهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="آخرت؛ موضوع شناخت و شک در آیه.">الـٔاخِرَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="شَكٍّ" data-root="ش ك ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-k-k/" data-root-meaning="تردید و نداشتن اطمینان." data-context="شک؛ تردید آنان دربارهٔ آخرت.">شَكٍّ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    ۖ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="عَمونَ" data-root="ع م ي" data-learn-more="/quran-terminology/fa/roots/ayn-m-y/" data-root-meaning="کوری، نادیدن، پوشیده شدن راه دیدن، ابهام، و از دست رفتن توان مشاهده یا تشخیص" data-context="کور و ناآگاه؛ تصویر ناتوانی آنان از شناخت آخرت.">عَمونَ</button>
  </p>
  <p class="farsi-verse">بلکه دانششان دربارهٔ آخرت به پایان رسیده؛ بلکه دربارهٔ آن در شک‌اند؛ بلکه نسبت به آن کورند.</p>
</section>
