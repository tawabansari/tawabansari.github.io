<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَحَدوا" data-root="ج ح د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَجَحَدوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="وَاستَيقَنَتها" data-root="ي ق ن" data-learn-more="/quran-terminology/fa/roots/y-q-n/">وَاستَيقَنَتها</button>
    <button class="word-link" type="button" data-word="أَنفُسُهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">أَنفُسُهُم</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظُلمًا</button>
    <button class="word-link" type="button" data-word="وَعُلُوًّا" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَعُلُوًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَانظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/">فَانظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/">المُفسِدينَ</button>
  </p>
  <p class="farsi-verse">و از سر ستم و برتری‌جویی آنها را انکار کردند، در حالی که جان‌هایشان به آنها یقین داشت؛ پس بنگر سرانجام فسادگران چگونه بود.</p>
