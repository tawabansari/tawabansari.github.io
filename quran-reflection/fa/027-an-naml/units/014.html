<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَحَدوا" data-root="ج ح د" data-root-meaning="انکار و نپذیرفتن چیزی که موضوع اقرار و پذیرش است؛ در کاربرد برجسته آن، انکار با وجود شناخت حقیقت." data-context="و انکار کردند؛ نشانه‌ها را با وجود یقین درونی، از سر ستم و برتری‌جویی رد کردند." data-learn-more="/quran-terminology/fa/roots/j-h-d/">وَجَحَدوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="وَاستَيقَنَتها" data-root="ي ق ن" data-learn-more="/quran-terminology/fa/roots/y-q-n/" data-root-meaning="ثبات معرفت، اطمینان روشن، و عبور از گمان" data-context="و به آنها یقین داشت؛ یقین درونی به نشانه‌هایی که انکار کردند.">وَاستَيقَنَتها</button>
    <button class="word-link" type="button" data-word="أَنفُسُهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="جان‌هایشان؛ بیان درونِ کسانی که به نشانه‌ها یقین داشتند.">أَنفُسُهُم</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="از سر ستم؛ توصیف انگیزه یا وجه اخلاقی انکار.">ظُلمًا</button>
    <button class="word-link" type="button" data-word="وَعُلُوًّا" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="و برتری‌جویی؛ خودبزرگ‌بینیِ همراه انکار.">وَعُلُوًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَانظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="پس بنگر؛ دعوت به توجه به سرانجام آنان.">فَانظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ در پرسش از چگونگی سرانجام فسادگران.">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار" data-context="سرانجام؛ نتیجه و فرجام کار فسادگران.">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع" data-context="فسادگران؛ کسانی که سرانجامشان مایه عبرت قرار گرفته است.">المُفسِدينَ</button>
  </p>
  <p class="farsi-verse">و از سر ستم و برتری‌جویی آنها را انکار کردند، در حالی که جان‌هایشان به آنها یقین داشت؛ پس بنگر سرانجام فسادگران چگونه بود.</p>
</section>
