<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ فاعلِ بیانِ موضوع‌های اختلاف." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="يَقُصُّ" data-root="ق ص ص" data-root-meaning="پی گرفتن اثر و بازگفتن؛ قصاص: مقابلهٔ متناسب با آسیب؛ در لغت، بریدن و کوتاه کردن نیز ثبت شده است." data-context="بیان و بازگو می‌کند؛ دربارهٔ بسیاری از موضوع‌های اختلاف بنی‌اسرائیل." data-learn-more="/quran-terminology/fa/roots/q-sad-sad/">يَقُصُّ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="فرزندان؛ در نامِ «بنی‌اسرائیل».">بَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بیشتر؛ اندازهٔ موضوع‌های مورد بیان.">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="يَختَلِفونَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="اختلاف دارند؛ رفتارِ بنی‌اسرائیل دربارهٔ موضوع‌های یادشده.">يَختَلِفونَ</button>
  </p>
  <p class="farsi-verse">این قرآن بیشتر آنچه را که فرزندان اسرائیل درباره‌اش اختلاف دارند برای آنان بازگو می‌کند.</p>
</section>
