<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّن</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد و ساخت؛ زمین را قرارگاه قرار دادن.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ چیزی که قرارگاه ساخته شده است.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="قَرارًا" data-root="ق ر ر" data-learn-more="/quran-terminology/fa/roots/q-r-r/" data-root-meaning="قرار گرفتن، ثابت شدن، آرام گرفتن در جایگاه، و فرونشستن بی‌قراری." data-context="قرارگاه و جای استقرار؛ وصف زمین در این جمله.">قَرارًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد؛ دربارهٔ رودهای میان زمین.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="خِلٰلَها" data-root="خ ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-l-l/" data-root-meaning="فاصله و شکاف میان چیزها؛ نیز دوستی نزدیک و پیوند صمیمی." data-context="در میان و بخش‌های آن؛ محل قرار گرفتن رودها.">خِلٰلَها</button>
    <button class="word-link" type="button" data-word="أَنهٰرًا" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="رودها؛ آبراه‌هایی که در میان زمین قرار داده شده‌اند.">أَنهٰرًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد؛ دربارهٔ کوه‌های استوارِ زمین.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="ر س و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-s-w/" data-root-meaning="ثابت و استوار شدن؛ لنگر انداختن و قرار گرفتن." data-context="کوه‌های استوار؛ بلندی‌هایی که در وصف زمین آمده‌اند.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داد؛ دربارهٔ حایل میان دو پهنهٔ آب.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان؛ جایگاه حایل نسبت به دو پهنهٔ آب.">بَينَ</button>
    <button class="word-link" type="button" data-word="البَحرَينِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دو پهنهٔ آب یا دو دریا؛ دو طرف حایل یادشده.">البَحرَينِ</button>
    <button class="word-link" type="button" data-word="حاجِزًا" data-root="ح ج ز" data-root-meaning="جدا کردن و مانع شدن؛ جلوگیری از رسیدن، عبور یا انجام کاری." data-context="حایل و جداکننده‌ای میان دو پهنهٔ آب." data-learn-more="/quran-terminology/fa/roots/h-j-z/">حاجِزًا</button>
    ۗ
    <button class="word-link" type="button" data-word="أَءِلٰهٌ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="آیا معبودی؟ پرسشی دربارهٔ همراه دانستن معبودی با آن معبود یگانه.">أَءِلٰهٌ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="أَكثَرُهُم" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بیشترِ آنان؛ اکثریتی که ندانستن به آنان نسبت داده شده است.">أَكثَرُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="می‌دانند؛ با «لا»، ندانستنِ بیشتر آنان بیان شده است.">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">یا آنکه زمین را قرارگاه ساخت و میان آن رودهایی قرار داد و برای آن کوه‌های استوار نهاد و میان دو دریا مانعی گذاشت؟ آیا معبودی با آن معبود یگانه است؟ بلکه بیشترشان نمی‌دانند.</p>
</section>
