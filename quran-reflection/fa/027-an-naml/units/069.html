<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو">قُل</button>
    <button class="word-link" type="button" data-word="سيروا" data-root="س ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-r/" data-root-meaning="رفتن و حرکت در مسیر؛ سیره: روش یا حالت." data-context="سیر کنید">سيروا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین">الأَرضِ</button>
    <button class="word-link" type="button" data-word="فَانظُروا" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="پس بنگرید">فَانظُروا</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار" data-context="سرانجام">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمينَ</button>
  </p>
  <p class="farsi-verse">بگو: در زمین بگردید و بنگرید سرانجام مجرمان چگونه بود.</p>
</section>
