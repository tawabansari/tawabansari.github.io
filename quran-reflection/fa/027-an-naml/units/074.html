<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="لَيَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">لَيَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تُكِنُّ" data-root="ك ن ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُكِنُّ</button>
    <button class="word-link" type="button" data-word="صُدورُهُم" data-root="ص د ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صُدورُهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يُعلِنونَ" data-root="ع ل ن" data-learn-more="/quran-terminology/fa/roots/ayn-l-n/" data-root-meaning="آشکار بودن و آشکار ساختن در برابر حوزه پنهان">يُعلِنونَ</button>
  </p>
  <p class="farsi-verse">و پروردگارت آنچه سینه‌هایشان پنهان می‌کند و آنچه آشکار می‌کنند می‌داند.</p>
