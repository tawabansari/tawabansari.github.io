<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="أَءِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِذا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنّا</button>
    <button class="word-link" type="button" data-word="تُرٰبًا" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه">تُرٰبًا</button>
    <button class="word-link" type="button" data-word="وَءاباؤُنا" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">وَءاباؤُنا</button>
    <button class="word-link" type="button" data-word="أَئِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَئِنّا</button>
    <button class="word-link" type="button" data-word="لَمُخرَجونَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">لَمُخرَجونَ</button>
  </p>
  <p class="farsi-verse">و کسانی که انکار کردند گفتند: آیا چون ما و پدرانمان خاک شدیم، بیرون آورده می‌شویم؟</p>
</section>
