<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَحُشِرَ" data-root="ح ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sh-r/" data-root-meaning="گرد آوردن و از جایگاه‌ها به سوی یک محل راندن.">وَحُشِرَ</button>
    <button class="word-link" type="button" data-word="لِسُلَيمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لِسُلَيمٰنَ</button>
    <button class="word-link" type="button" data-word="جُنودُهُ" data-root="ج ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-d/" data-root-meaning="جند و جنود: سپاه، نیروها و گروه‌های سازمان‌یافتهٔ پشتیبان.">جُنودُهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِنِّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجِنِّ</button>
    <button class="word-link" type="button" data-word="وَالإِنسِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">وَالإِنسِ</button>
    <button class="word-link" type="button" data-word="وَالطَّيرِ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق.">وَالطَّيرِ</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="يوزَعونَ" data-root="و ز ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-z-ayn/" data-root-meaning="بازداشتن و سامان دادن جمع؛ ایزاع: برانگیختن و توفیق انجام دادن.">يوزَعونَ</button>
  </p>
  <p class="farsi-verse">و سپاهیان سلیمان از جن و انسان و پرندگان برای او گرد آورده شدند و به نظم نگه داشته می‌شدند.</p>
</section>
