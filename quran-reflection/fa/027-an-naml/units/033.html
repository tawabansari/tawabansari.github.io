<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">النمل ۲۷:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="أُولوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولوا</button>
    <button class="word-link" type="button" data-word="قُوَّةٍ" data-root="ق و ي" data-learn-more="/quran-terminology/fa/roots/q-w-y/" data-root-meaning="نیرو، توان، قدرت و استحکام؛ توان انجام، تحمل، مقاومت یا اثرگذاری">قُوَّةٍ</button>
    <button class="word-link" type="button" data-word="وَأُولوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولوا</button>
    <button class="word-link" type="button" data-word="بَأسٍ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">بَأسٍ</button>
    <button class="word-link" type="button" data-word="شَديدٍ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شَديدٍ</button>
    <button class="word-link" type="button" data-word="وَالأَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">وَالأَمرُ</button>
    <button class="word-link" type="button" data-word="إِلَيكِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكِ</button>
    <button class="word-link" type="button" data-word="فَانظُرى" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">فَانظُرى</button>
    <button class="word-link" type="button" data-word="ماذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ماذا</button>
    <button class="word-link" type="button" data-word="تَأمُرينَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">تَأمُرينَ</button>
  </p>
  <p class="farsi-verse">گفتند: ما دارای نیرو و توان رزمی سخت هستیم، و فرمان با توست؛ پس بنگر چه فرمان می‌دهی.</p>
</section>
