  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ادخُلوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/">ادخُلوا</button>
    <button class="word-link" type="button" data-word="أَبوٰبَ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/">أَبوٰبَ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="خٰلِدينَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/">خٰلِدينَ</button>

    <button class="word-link" type="button" data-word="فَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/">فَبِئسَ</button>

  </p>
  <p class="farsi-verse">از درهای جهنم وارد شوید، ماندگار در آن؛ پس چه بد جایگاهی برای گردن‌فرازان است!</p>
