<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="النّارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارُ</button>
    <button class="word-link" type="button" data-word="يُعرَضونَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">يُعرَضونَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="غُدُوًّا" data-root="غ د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-w/" data-root-meaning="بامداد و بامداد رفتن؛ غد: فردا یا آینده.">غُدُوًّا</button>
    <button class="word-link" type="button" data-word="وَعَشِيًّا" data-root="ع ش و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-w/" data-root-meaning="بخش پایانی روز و شامگاه؛ عَشو: کم‌دیدن یا چشم پوشیدن.">وَعَشِيًّا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">وَيَومَ</button>
    <button class="word-link" type="button" data-word="تَقومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">تَقومُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است.">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="أَدخِلوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">أَدخِلوا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالَ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="أَشَدَّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">أَشَدَّ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابِ</button>
  </p>
  <p class="farsi-verse">آتش، که بامداد و شامگاه بر آن عرضه می‌شوند؛ و روزی که ساعت برپا شود: خاندان فرعون را به سخت‌ترین عذاب وارد کنید.</p>
</section>
