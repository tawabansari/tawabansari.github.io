  <p class="farsi-verse">اوست که شما را از خاک، سپس از نطفه، سپس از چیزی آویخته آفرید، سپس شما را به صورت کودک بیرون می‌آورد، سپس تا به توانایی کاملتان برسید، سپس تا سالخورده شوید؛ و برخی از شما پیش از آن جانشان ستانده می‌شود؛ و تا به سرآمدی معین برسید و باشد که بیندیشید.</p>
