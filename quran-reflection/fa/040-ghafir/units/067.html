<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="شما را آفرید؛ فعلِ بیانگر آفرینش انسان در مراحل یادشده.">خَلَقَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تُرابٍ" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه" data-context="خاک؛ نخستین منشأ یادشده در این توالی، پیش از نطفه.">تُرابٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نُطفَةٍ" data-root="ن ط ف" data-learn-more="/quran-terminology/fa/roots/n-tt-f/" data-root-meaning="چکیدن مایع؛ آب اندک یا صاف، و نطفه در سیاق تولیدمثل." data-context="نطفه؛ مرحلهٔ یادشده پس از خاک و پیش از علقه در بیان پیدایش انسان.">نُطفَةٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَلَقَةٍ" data-root="ع ل ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-q/" data-root-meaning="چسبیدن و آویختن؛ علق و علقه: ماده چسبنده یا خون‌بسته، با شرح‌های لغوی متفاوت." data-context="علقه؛ وضعیتِ یادشده پس از نطفه، با معنای لغویِ چسبندگی یا خون‌بسته در توضیح‌های کهن.">عَلَقَةٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُخرِجُكُم" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="شما را بیرون می‌آورد؛ در این جمله به صورت کودک.">يُخرِجُكُم</button>
    <button class="word-link" type="button" data-word="طِفلًا" data-root="ط ف ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-f-l/" data-root-meaning="کودک و مرحله کودکی." data-context="کودک؛ صورت مفرد با اشاره به هر یک از مخاطبان پس از بیرون آمدن.">طِفلًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لِتَبلُغوا" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="تا برسید؛ در این بخش، به مرحلهٔ نیرو و رشد کامل‌تر.">لِتَبلُغوا</button>
    <button class="word-link" type="button" data-word="أَشُدَّكُم" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="مرحلهٔ نیرو و استواری شما؛ پس از کودکی.">أَشُدَّكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لِتَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="تا باشید یا به آن حالت درآیید؛ در ادامه، سالخوردگی.">لِتَكونوا</button>
    <button class="word-link" type="button" data-word="شُيوخًا" data-root="ش ي خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-kh/" data-root-meaning="پیری و سالخوردگی؛ شیخ: مرد سالخورده." data-context="سالخوردگان؛ جمعِ شیخ، مرحله‌ای پس از رسیدن به نیرو.">شُيوخًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنكُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يُتَوَفّىٰ" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="جانش به تمامی گرفته می‌شود؛ در این سیاق، مرگ پیش از رسیدن به برخی مراحل یادشده.">يُتَوَفّىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از آن؛ دربارهٔ مرگ برخی افراد پیش از آن مراحل.">قَبلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِتَبلُغوا" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="و تا برسید؛ در این عبارت، به موعدی تعیین‌شده.">وَلِتَبلُغوا</button>
    <button class="word-link" type="button" data-word="أَجَلًا" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت یا موعد مقرر؛ در سیاق مناسب، پایان آن مدت." data-context="مدت یا موعد؛ در این جمله، دارای تعیین و نام‌گذاری.">أَجَلًا</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="تعیین‌شده؛ وصفِ اجل و موعدِ آن.">مُسَمًّى</button>
    <button class="word-link" type="button" data-word="وَلَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="خرد به کار برید و دریابید؛ غایتِ بیانِ این مراحل در جمله.">تَعقِلونَ</button>
  </p>
  <p class="farsi-verse">اوست که شما را از خاک، سپس از نطفه، سپس از چیزی آویخته آفرید، سپس شما را به صورت کودک بیرون می‌آورد، سپس تا به توانایی کاملتان برسید، سپس تا سالخورده شوید؛ و برخی از شما پیش از آن جانشان ستانده می‌شود؛ و تا به سرآمدی معین برسید و باشد که بیندیشید.</p>
</section>
