<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكُم</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="دُعِىَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">دُعِىَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَحدَهُ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/">وَحدَهُ</button>
    <button class="word-link" type="button" data-word="كَفَرتُم" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">كَفَرتُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يُشرَك" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">يُشرَك</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="تُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">تُؤمِنوا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَالحُكمُ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/">فَالحُكمُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="العَلِىِّ" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">العَلِىِّ</button>
    <button class="word-link" type="button" data-word="الكَبيرِ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/">الكَبيرِ</button>
  </p>
  <p class="farsi-verse">این از آن روست که چون آن معبود یگانه به‌تنهایی خوانده می‌شد کفر می‌ورزیدید، و اگر شریکی برای او قرار داده می‌شد ایمان می‌آوردید. پس حکم از آنِ آن معبود یگانه، بلندمرتبه بزرگ است.</p>
</section>
