<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يُؤفَكُ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="چنین برگردانده می‌شوند؛ درباره کسانی که آیات آن معبود یگانه را انکار می‌کردند.">يُؤفَكُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند و چنین می‌کردند؛ فعل مربوط به رفتار یا وضعیت گذشته آنان.">كانوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات و نشانه‌ها را؛ متعلقِ انکار در این جمله.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَجحَدونَ" data-root="ج ح د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h-d/" data-root-meaning="انکار و نپذیرفتن، به‌ویژه نفی چیزی که شخص آن را می‌شناسد یا به آن آگاهی دارد." data-context="انکار می‌کردند؛ درباره آیات آن معبود یگانه.">يَجحَدونَ</button>
  </p>
  <p class="farsi-verse">کسانی که آیات آن معبود یگانه را انکار می‌کردند چنین برگردانده می‌شوند.</p>
</section>
