<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که؛ زمانِ آشکار بودن آنان در صحنهٔ مورد بحث.">يَومَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="بٰرِزونَ" data-root="ب ر ز" data-root-meaning="بیرون آمدن و نمایان شدن در فضای آشکار یا در برابر دید و مواجهه؛ در صورت گذرا، آشکار ساختن چیزی." data-learn-more="/quran-terminology/fa/roots/b-r-z/" data-context="آشکار و نمایان‌اند؛ اسم فاعل جمع مذکر، وصف حالت آنان.">بٰرِزونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَخفىٰ" data-root="خ ف ي" data-root-meaning="پوشیده بودن و پنهان ماندن؛ پنهان کردن؛ و در شاخه‌ای از عربی کهن، آشکار شدن یا آشکار ساختن چیزی پوشیده." data-context="پوشیده نمی‌ماند؛ نفیِ نهان بودن چیزی از آنان بر آن معبود یگانه." data-learn-more="/quran-terminology/fa/roots/kh-f-y/">يَخفىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="شَىءٌ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن و اراده کردن؛ «شیء» چیزی، امر یا موجودی قابل اشاره و شناخت است." data-context="چیزی؛ در ساخت نفی، هیچ‌چیز از آنان پوشیده نیست.">شَىءٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="لِمَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَنِ</button>
    <button class="word-link" type="button" data-word="المُلكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="فرمانروایی و سلطنت؛ موضوع پرسشِ «امروز از آنِ کیست؟»">المُلكُ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="امروز؛ روز مورد اشاره در صحنهٔ داوری.">اليَومَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الوٰحِدِ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="آن یگانه؛ وصف یگانگی آن معبود یگانه.">الوٰحِدِ</button>
    <button class="word-link" type="button" data-word="القَهّارِ" data-root="ق ه ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-h2-r/" data-root-meaning="چیره شدن و تحت اختیار درآوردن؛ قهر همیشه به معنای احساس خشم نیست." data-context="آن چیره؛ وصف سلطه و چیرگی آن معبود یگانه.">القَهّارِ</button>
  </p>
  <p class="farsi-verse">روزی که آنان آشکارند و هیچ چیز از آنان بر آن معبود یگانه پنهان نیست. امروز فرمانروایی از آن کیست؟ از آنِ آن معبود یگانه، یکتای چیره.</p>
</section>
