    <button class="word-link" type="button" data-word="ءامَنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">ءامَنَ</button>

  <p class="farsi-verse">و آن که ایمان آورده بود گفت: ای قوم من، از من پیروی کنید تا شما را به راه درست هدایت کنم.</p>
