<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذِ</button>
    <button class="word-link" type="button" data-word="الأَغلٰلُ" data-root="غ ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-l/" data-root-meaning="بند و زنجیر؛ غِلّ: کینه؛ غلول: خیانت در مال سپرده‌شده.">الأَغلٰلُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَعنٰقِهِم" data-root="ع ن ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-q/" data-root-meaning="گردن؛ گاه نماینده اشخاص یا حالت سر و گردن.">أَعنٰقِهِم</button>
    <button class="word-link" type="button" data-word="وَالسَّلٰسِلُ" data-root="س ل س ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-s-l/" data-root-meaning="زنجیر و حلقه‌های پیوسته؛ نیز روانی آب در کاربرد دیگر.">وَالسَّلٰسِلُ</button>
    <button class="word-link" type="button" data-word="يُسحَبونَ" data-root="س ح ب" data-root-meaning="کشیدن، امتداد یافتن و ابر؛ از کشیده شدن چیزی بر زمین تا حرکت ابرها در آسمان و کشانده شدن انسان در صحنه عذاب" data-learn-more="/quran-terminology/fa/roots/s-h-b/">يُسحَبونَ</button>
  </p>
  <p class="farsi-verse">هنگامی که غل‌ها و زنجیرها بر گردن‌هایشان باشد و کشیده شوند،</p>
</section>
