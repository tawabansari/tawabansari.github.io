<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذَّبَت" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="تکذیب کردند؛ قوم نوح و گروه‌های پس از آنان.">كَذَّبَت</button>
    <button class="word-link" type="button" data-word="قَبلَهُم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از آنان؛ تقدمِ منکرانِ پیشین.">قَبلَهُم</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="قومِ نوح؛ گروهی از تکذیب‌کنندگان پیشین." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">قَومُ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَالأَحزابُ" data-root="ح ز ب" data-root-meaning="گرد آمدن و تشکیل مجموعه؛ گروهی از افراد با پیوند، موضع یا هدف مشترک." data-context="و گروه‌ها و دسته‌های پس از آنان." data-learn-more="/quran-terminology/fa/roots/h-z-b/">وَالأَحزابُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِم" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از آنان؛ ترتیبِ زمانیِ گروه‌ها.">بَعدِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهَمَّت" data-root="ه م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-m-m/" data-root-meaning="اندوه و دل‌مشغولی؛ همّ: قصد یا بر آن شدن." data-context="و آهنگ کرد؛ قصدِ گرفتن فرستاده.">وَهَمَّت</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ فراگیریِ امت‌های یادشده.">كُلُّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="امت و جماعت؛ گروهی که علیه فرستاده‌اش قصد می‌کند.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="بِرَسولِهِم" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادهٔ آنان؛ هدفِ اقدامشان.">بِرَسولِهِم</button>
    <button class="word-link" type="button" data-word="لِيَأخُذوهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="تا او را بگیرند؛ قصدِ امت‌ها دربارهٔ فرستادگان.">لِيَأخُذوهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَجٰدَلوا" data-root="ج د ل" data-root-meaning="رویارویی و رفت‌وبرگشت گفتار برای طرح، دفاع، پاسخ یا مقابله با یک موضع؛ ارزش آن به موضوع، دلیل و روش وابسته است." data-context="با باطل مجادله کردند تا به وسیلهٔ آن حق را کنار بزنند." data-learn-more="/quran-terminology/fa/roots/j-d-l/">وَجٰدَلوا</button>
    <button class="word-link" type="button" data-word="بِالبٰطِلِ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/" data-root-meaning="بی‌پایه شدن، فروپاشیدن، بی‌اثر و بی‌حقیقت بودن" data-context="با باطل؛ وسیله و محتوای مجادله.">بِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="لِيُدحِضوا" data-root="د ح ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-h-dad/" data-root-meaning="لغزیدن؛ مجازاً از اعتبار انداختن یا باطل شدن حجت." data-context="تا از اعتبار بیندازند؛ دربارهٔ حق.">لِيُدحِضوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ هدفِ کوشش برای کنار زدن.">الحَقَّ</button>
    <button class="word-link" type="button" data-word="فَأَخَذتُهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="پس آنان را گرفتار ساختم؛ گرفتنِ کیفری از سوی خداوند.">فَأَخَذتُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ در پرسش از چگونگیِ کیفر.">كانَ</button>
    <button class="word-link" type="button" data-word="عِقابِ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار" data-context="کیفر من؛ پیامدِ تکذیب و جدال با باطل.">عِقابِ</button>
  </p>
  <p class="farsi-verse">پیش از آنان قوم نوح و گروه‌های هم‌پیمان پس از آنان تکذیب کردند؛ و هر امتی قصد فرستاده خود کرد تا او را بگیرد، و با باطل جدال کردند تا حق را با آن از میان ببرند. پس آنان را گرفتم؛ پس کیفر من چگونه بود؟</p>
</section>
