  <p class="farsi-verse">پس شکیبا باش؛ وعده آن معبود یگانه حق است. پس چه بخشی از آنچه به آنان وعده می‌دهیم به تو نشان دهیم یا جان تو را بستانیم، به سوی ما بازگردانده می‌شوند.</p>
