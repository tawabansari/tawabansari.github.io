<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="فِرعَونُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونُ</button>
    <button class="word-link" type="button" data-word="يٰهٰمٰنُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰهٰمٰنُ</button>
    <button class="word-link" type="button" data-word="ابنِ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">ابنِ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="صَرحًا" data-root="ص ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-h/" data-root-meaning="آشکار و خالص بودن؛ صرح: بنای بلند یا نمایان.">صَرحًا</button>
    <button class="word-link" type="button" data-word="لَعَلّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلّى</button>
    <button class="word-link" type="button" data-word="أَبلُغُ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت">أَبلُغُ</button>
    <button class="word-link" type="button" data-word="الأَسبٰبَ" data-root="س ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-b-b/" data-root-meaning="رشته و وسیله پیوند یا دستیابی؛ در شاخه‌ای دیگر، دشنام دادن.">الأَسبٰبَ</button>
  </p>
  <p class="farsi-verse">و فرعون گفت: ای هامان، برای من بنایی بلند بساز، باشد که به راه‌ها برسم،</p>
</section>
