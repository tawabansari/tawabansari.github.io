<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="خائِنَةَ" data-root="خ و ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خائِنَةَ</button>
    <button class="word-link" type="button" data-word="الأَعيُنِ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس.">الأَعيُنِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تُخفِى" data-root="خ ف ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُخفِى</button>
    <button class="word-link" type="button" data-word="الصُّدورُ" data-root="ص د ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الصُّدورُ</button>
  </p>
  <p class="farsi-verse">خیانت چشم‌ها و آنچه سینه‌ها پنهان می‌کنند را می‌داند.</p>
