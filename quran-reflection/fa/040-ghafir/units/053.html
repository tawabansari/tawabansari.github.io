<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتَينا</button>
    <button class="word-link" type="button" data-word="موسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسَى</button>
    <button class="word-link" type="button" data-word="الهُدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">الهُدىٰ</button>
    <button class="word-link" type="button" data-word="وَأَورَثنا" data-root="و ر ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَورَثنا</button>
    <button class="word-link" type="button" data-word="بَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">بَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبَ</button>
  </p>
  <p class="farsi-verse">و به موسی هدایت دادیم و بنی‌اسرائیل را وارث کتاب کردیم،</p>
</section>
