<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مَنٰفِعُ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی" data-context="سودها؛ بهره‌مندی‌های انسان از چهارپایان.">مَنٰفِعُ</button>
    <button class="word-link" type="button" data-word="وَلِتَبلُغوا" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="و تا برسید؛ رسیدن به نیاز یا مقصود با کمک آن جانوران.">وَلِتَبلُغوا</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="حاجَةً" data-root="ح و ج" data-root-meaning="نیاز یا خواسته‌ای که برای انسان لازم یا مطلوب است؛ مادی، عملی یا درونی." data-context="نیازی؛ مقصودی که در سینه‌های انسان‌هاست." data-learn-more="/quran-terminology/fa/roots/h-w-j/">حاجَةً</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="صُدورِكُم" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/" data-context="سینه‌هایتان؛ جایگاهِ نیاز و مقصودِ درونی در بیان آیه.">صُدورِكُم</button>
    <button class="word-link" type="button" data-word="وَعَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَيها</button>
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الفُلكِ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش." data-context="کشتی‌ها؛ وسیلهٔ دیگرِ حمل انسان‌ها.">الفُلكِ</button>
    <button class="word-link" type="button" data-word="تُحمَلونَ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="حمل می‌شوید؛ جابه‌جایی به وسیلهٔ چهارپایان و کشتی‌ها." data-learn-more="/quran-terminology/fa/roots/h-m-l/">تُحمَلونَ</button>
  </p>
  <p class="farsi-verse">و در آن‌ها برای شما سودهایی است، و تا با آن‌ها به نیازی در سینه‌هایتان برسید؛ و بر آن‌ها و بر کشتی‌ها حمل می‌شوید.</p>
</section>
