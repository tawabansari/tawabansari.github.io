<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مَنٰفِعُ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی">مَنٰفِعُ</button>
    <button class="word-link" type="button" data-word="وَلِتَبلُغوا" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت">وَلِتَبلُغوا</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="حاجَةً" data-root="ح و ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حاجَةً</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="صُدورِكُم" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/">صُدورِكُم</button>
    <button class="word-link" type="button" data-word="وَعَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَيها</button>
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الفُلكِ" data-root="ف ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الفُلكِ</button>
    <button class="word-link" type="button" data-word="تُحمَلونَ" data-root="ح م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُحمَلونَ</button>
  </p>
  <p class="farsi-verse">و در آن‌ها برای شما سودهایی است، و تا با آن‌ها به نیازی در سینه‌هایتان برسید؛ و بر آن‌ها و بر کشتی‌ها حمل می‌شوید.</p>
</section>
