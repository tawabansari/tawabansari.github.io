  <p class="farsi-verse">هر که بدی کند، جز همانند آن جزا داده نمی‌شود؛ و هر که کار شایسته کند، مرد یا زن، و ایمان‌آورنده باشد، آنان وارد بهشت می‌شوند و در آن بی‌حساب روزی داده می‌شوند.</p>
