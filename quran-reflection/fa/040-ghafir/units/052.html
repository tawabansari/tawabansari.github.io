<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَنفَعُ" data-root="ن ف ع" data-learn-more="/quran-terminology/fa/roots/n-f-ayn/" data-root-meaning="نَفَعَ؛ سود رساندن و ایجاد نتیجه‌ای مطلوب برای کسی">يَنفَعُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="مَعذِرَتُهُم" data-root="ع ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-dh-r/" data-root-meaning="عذر و بیان دلیل برای رفع سرزنش.">مَعذِرَتُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّعنَةُ" data-root="ل ع ن" data-learn-more="/quran-terminology/fa/roots/l-ayn-n/" data-root-meaning="راندن، دور ساختن و قرار گرفتن در جایگاه طرد">اللَّعنَةُ</button>
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="سوءُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سوءُ</button>
    <button class="word-link" type="button" data-word="الدّارِ" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت">الدّارِ</button>
  </p>
  <p class="farsi-verse">روزی که پوزش ستمکاران به آنان سود نمی‌رساند، و لعنت و سرای بد برای آنان است.</p>
</section>
