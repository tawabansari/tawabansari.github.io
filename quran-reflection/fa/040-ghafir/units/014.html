<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَادعُوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">فَادعُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مُخلِصينَ" data-root="خ ل ص" data-learn-more="/quran-terminology/fa/roots/kh-l-sad/" data-root-meaning="جدا شدن از آمیختگی؛ از خلوص تا اختصاص">مُخلِصينَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="الدّينَ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد">الدّينَ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="كَرِهَ" data-root="ك ر ه" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَرِهَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرونَ</button>
  </p>
  <p class="farsi-verse">پس آن معبود یگانه را بخوانید، در حالی که دین را برای او خالص می‌کنید، هرچند کافران ناخشنود باشند.</p>
</section>
