  <p class="farsi-verse">پس چون حق را از نزد ما برایشان آورد، گفتند: پسران کسانی را که با او ایمان آورده‌اند بکشید و زنانشان را زنده نگه دارید. و نیرنگ کافران جز در گمراهی نیست.</p>
