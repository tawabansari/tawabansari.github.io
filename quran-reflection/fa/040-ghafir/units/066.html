  <p class="farsi-verse">بگو: من از پرستش کسانی که جز آن معبود یگانه می‌خوانید بازداشته شده‌ام، هنگامی که دلایل روشن از پروردگارم به من رسید؛ و فرمان یافته‌ام که تسلیم پروردگار جهانیان شوم.</p>
