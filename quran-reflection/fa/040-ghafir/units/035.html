  <p class="farsi-verse">کسانی که درباره آیات آن معبود یگانه بی‌هیچ دلیلی که به آنان رسیده باشد جدال می‌کنند. این نزد آن معبود یگانه و نزد کسانی که ایمان آورده‌اند بسیار نفرت‌انگیز است. آن معبود یگانه بر هر دل گردن‌فراز زورگو چنین مهر می‌نهد.</p>
