  <p class="farsi-verse">و پیش از تو فرستادگانی فرستادیم؛ از آنان کسانی‌اند که برای تو حکایت کرده‌ایم و از آنان کسانی‌اند که برای تو حکایت نکرده‌ایم. و هیچ فرستاده‌ای را نرسد که جز به اذن آن معبود یگانه نشانه‌ای بیاورد. پس چون فرمان آن معبود یگانه برسد، به حق داوری می‌شود و آنجا باطل‌گرایان زیان می‌کنند.</p>
