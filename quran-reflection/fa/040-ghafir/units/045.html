<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَقىٰهُ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">فَوَقىٰهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">سَيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="مَكَروا" data-root="م ك ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَكَروا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="ح ي ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِـٔالِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/">بِـٔالِ</button>

    <button class="word-link" type="button" data-word="سوءُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">سوءُ</button>

  </p>
  <p class="farsi-verse">پس آن معبود یگانه او را از بدی‌های آنچه نیرنگ کرده بودند نگاه داشت و عذاب بد خاندان فرعون را فراگرفت؛</p>
