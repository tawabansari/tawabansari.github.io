<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَقىٰهُ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پس او را محفوظ داشت؛ دربارهٔ حفظِ شخص از بدی‌های نیرنگ آنان.">فَوَقىٰهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌ها؛ پیامدهای ناگوارِ آنچه نیرنگ ساخته بودند.">سَيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="مَكَروا" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است." data-context="نیرنگ ساختند؛ کردار گروهی که برای زیان رساندن نقشه کشیدند.">مَكَروا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="ح ي ق" data-root-meaning="فرود آمدن و فراگرفتن چیزی، به‌ویژه پیامدی ناگوار که شخص را گرفتار می‌کند." data-context="فراگرفت؛ عذاب ناگوار بر آل فرعون فرود آمد." data-learn-more="/quran-terminology/fa/roots/h-y-q/">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِـٔالِ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="آل و وابستگان؛ در ترکیب «آل فرعون»، گروهی که عذاب آنان را فراگرفت.">بِـٔالِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="سوءُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی و سختی؛ در «سوء العذاب»، وصفِ ناگواری عذاب.">سوءُ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ آنچه آل فرعون را فراگرفت.">العَذابِ</button>
  </p>
  <p class="farsi-verse">پس آن معبود یگانه او را از بدی‌های آنچه نیرنگ کرده بودند نگاه داشت و عذاب بد خاندان فرعون را فراگرفت؛</p>
</section>
