<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">فَاصبِر</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="وَعدَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعدَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="حَقٌّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">حَقٌّ</button>
    <button class="word-link" type="button" data-word="وَاستَغفِر" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">وَاستَغفِر</button>
    <button class="word-link" type="button" data-word="لِذَنبِكَ" data-root="ذ ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لِذَنبِكَ</button>
    <button class="word-link" type="button" data-word="وَسَبِّح" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">وَسَبِّح</button>
    <button class="word-link" type="button" data-word="بِحَمدِ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/" data-root-meaning="ستایش آگاهانه، شناخت نیکی و کمال، سپاسِ همراه با اقرار، و آشکار شدن شایستگی برای حمد">بِحَمدِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="بِالعَشِىِّ" data-root="ع ش و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِالعَشِىِّ</button>
    <button class="word-link" type="button" data-word="وَالإِبكٰرِ" data-root="ب ك ر" data-learn-more="/quran-terminology/fa/roots/b-k-r/" data-root-meaning="از آغاز روز و پیش‌افتادگی تا باقی بودن در مرحلهٔ نخستین">وَالإِبكٰرِ</button>
  </p>
  <p class="farsi-verse">پس شکیبا باش؛ وعده آن معبود یگانه حق است؛ و برای گناهت آمرزش بخواه و شامگاه و بامداد با ستایش پروردگارت تسبیح بگو.</p>
</section>
