<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَسبٰبَ" data-root="س ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-b-b/" data-root-meaning="رشته و وسیله پیوند یا دستیابی؛ در شاخه‌ای دیگر، دشنام دادن.">أَسبٰبَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="فَأَطَّلِعَ" data-root="ط ل ع" data-root-meaning="ط ل ع در هسته شناخته‌شده خود به برآمدن و آشکار شدن مربوط است. در کاربردهای طبیعی، پدیدار شدن خورشید و سر برآوردن محصول گیاه را بیان می‌کند؛ در کاربردهای مربوط به انسان، می‌تواند به مشاهده یا آگاه شدن از چیزی اشاره کند که پیش‌تر در دسترس او نبوده است؛ و در بعضی ساخت‌ها، معنای رسیدن به جایگاهی را می‌رساند." data-learn-more="/quran-terminology/fa/roots/tt-l-ayn/">فَأَطَّلِعَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="إِلٰهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">إِلٰهِ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="لَأَظُنُّهُ" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد">لَأَظُنُّهُ</button>
    <button class="word-link" type="button" data-word="كٰذِبًا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كٰذِبًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="زُيِّنَ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن.">زُيِّنَ</button>
    <button class="word-link" type="button" data-word="لِفِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لِفِرعَونَ</button>
    <button class="word-link" type="button" data-word="سوءُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سوءُ</button>
    <button class="word-link" type="button" data-word="عَمَلِهِ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">عَمَلِهِ</button>
    <button class="word-link" type="button" data-word="وَصُدَّ" data-root="ص د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-d-d/" data-root-meaning="روی گرداندن و بازداشتن دیگری.">وَصُدَّ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">السَّبيلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كَيدُ" data-root="ك ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-y-d/" data-root-meaning="چاره‌اندیشی و تدبیر پنهان؛ ارزش آن به سیاق وابسته است.">كَيدُ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="تَبابٍ" data-root="ت ب ب" data-learn-more="/quran-terminology/fa/roots/t-b-b/" data-root-meaning="خسران و ناکامی‌ای که شخص، عمل، نقشه یا تکیه‌گاه را از رسیدن به فرجام سودمند بازمی‌دارد.">تَبابٍ</button>
  </p>
  <p class="farsi-verse">راه‌های آسمان‌ها، پس به معبود موسی بنگرم؛ و من او را دروغ‌گو می‌پندارم. و چنین بدی عمل فرعون برایش آراسته شد و از راه بازداشته شد؛ و نیرنگ فرعون جز در تباهی نبود.</p>
</section>
