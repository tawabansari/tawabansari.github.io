<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنذِرهُم" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="و آنان را هشدار بده؛ دربارهٔ روز نزدیک‌شونده و پیامد کردار.">وَأَنذِرهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمانِ رخداد نزدیک‌شونده‌ای که دربارهٔ آن هشدار داده می‌شود.">يَومَ</button>
    <button class="word-link" type="button" data-word="الـٔازِفَةِ" data-root="أ ز ف" data-learn-more="/quran-terminology/fa/roots/a-z-f/" data-root-meaning="نزدیک شدنِ زمان یک امر یا رویداد؛ بدون آنکه خود واژه اندازه فاصله یا وقوع کامل آن رویداد را تعیین کند." data-context="نزدیک‌شونده؛ وصف آن روز در سیاق حساب و داوری.">الـٔازِفَةِ</button>
    <button class="word-link" type="button" data-word="إِذِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذِ</button>
    <button class="word-link" type="button" data-word="القُلوبُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌ها؛ در تصویر قرار داشتن آن‌ها نزد گلوگاه‌ها از شدت هراس.">القُلوبُ</button>
    <button class="word-link" type="button" data-word="لَدَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدَى</button>
    <button class="word-link" type="button" data-word="الحَناجِرِ" data-root="ح ن ج ر" data-root-meaning="حنجره و گلوگاه؛ بخش مرتبط با عبور نفس و تولید صدا در ناحیهٔ گلو." data-context="گلوگاه‌ها؛ در تصویر قرار گرفتن دل‌ها نزد گلوگاه در روز حساب، همراه با فروخوردن اندوه و فشار." data-learn-more="/quran-terminology/fa/roots/h-n-j-r/">الحَناجِرِ</button>
    <button class="word-link" type="button" data-word="كٰظِمينَ" data-root="ك ظ م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-zha-m/" data-root-meaning="فرو خوردن و در درون نگه داشتن، به‌ویژه خشم یا اندوه." data-context="فروخورندگان اندوه و فشار؛ حالت اشخاص در صحنهٔ هراس.">كٰظِمينَ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="برای ستمکاران؛ کسانی که در این جمله از دوست و شفیع پذیرفته‌شده بی‌بهره‌اند.">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَميمٍ" data-root="ح م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-m/" data-root-meaning="گرمای شدید؛ حمیم: آب بسیار داغ یا دوست نزدیک، بر حسب سیاق؛ یحموم: دود سیاه." data-context="دوستی صمیمی و دلسوز؛ کسی که نبودنش برای ستمکاران بیان می‌شود.">حَميمٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="شَفيعٍ" data-root="ش ف ع" data-learn-more="/quran-terminology/fa/roots/sh-f-ayn/" data-root-meaning="جفت‌شدن، ضمیمه‌شدن، و قرارگرفتن یک عامل در کنار عامل دیگر برای پشتیبانی یا تقویت یک اثر" data-context="شفیع و میانجی؛ در عبارتِ نفیِ شفیعی که سخنش پذیرفته شود.">شَفيعٍ</button>
    <button class="word-link" type="button" data-word="يُطاعُ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="پذیرفته و پیروی شود؛ دربارهٔ سخن شفیع در ساختِ نفی آیه.">يُطاعُ</button>
  </p>
  <p class="farsi-verse">و آنان را از روز نزدیک‌شونده هشدار ده، هنگامی که دل‌ها نزد گلوهاست و اندوه را فرو می‌خورند. برای ستمکاران نه دوستی صمیمی هست و نه شفیعی که سخنش پذیرفته شود.</p>
</section>
