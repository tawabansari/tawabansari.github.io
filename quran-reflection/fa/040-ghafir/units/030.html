<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ سخن مرد مؤمن از قوم فرعون.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="ءامَنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده بود؛ وصف مردی که قوم خود را هشدار می‌دهد.">ءامَنَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ای قوم من؛ خطاب مرد مؤمن به مردم خود.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَخافُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیم دارم؛ نگرانی او دربارهٔ سرانجام قومش.">أَخافُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="مِثلَ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مانند؛ مقایسه با سرنوشت گروه‌های پیشین.">مِثلَ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ در اشاره به رخداد و سرانجام گروه‌های پیشین.">يَومِ</button>
    <button class="word-link" type="button" data-word="الأَحزابِ" data-root="ح ز ب" data-root-meaning="گرد آمدن و تشکیل مجموعه؛ گروهی از افراد با پیوند، موضع یا هدف مشترک." data-context="گروه‌ها؛ امت‌های پیشین که سرنوشتشان موضوع هشدار است." data-learn-more="/quran-terminology/fa/roots/h-z-b/">الأَحزابِ</button>
  </p>
  <p class="farsi-verse">و آن که ایمان آورده بود گفت: ای قوم من، من برای شما از چیزی مانند روز گروه‌های هم‌پیمان می‌ترسم،</p>
</section>
