    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">يٰقَومِ</button>

    <button class="word-link" type="button" data-word="أَخافُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/">أَخافُ</button>

  <p class="farsi-verse">و آن که ایمان آورده بود گفت: ای قوم من، من برای شما از چیزی مانند روز گروه‌های هم‌پیمان می‌ترسم،</p>
