<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّنا</button>
    <button class="word-link" type="button" data-word="وَأَدخِلهُم" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">وَأَدخِلهُم</button>
    <button class="word-link" type="button" data-word="جَنّٰتِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنّٰتِ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="ع د ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَدنٍ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="وَعَدتَهُم" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعَدتَهُم</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="صَلَحَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">صَلَحَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ءابائِهِم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">ءابائِهِم</button>
    <button class="word-link" type="button" data-word="وَأَزوٰجِهِم" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند">وَأَزوٰجِهِم</button>
    <button class="word-link" type="button" data-word="وَذُرِّيّٰتِهِم" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه">وَذُرِّيّٰتِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری">العَزيزُ</button>
    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">الحَكيمُ</button>
  </p>
  <p class="farsi-verse">پروردگارا، آنان را به باغ‌های ماندگاری که وعده‌شان داده‌ای وارد کن، و هر که از پدران و همسران و فرزندانشان شایسته بوده است؛ تو همان توانمند حکیمی.</p>
</section>
