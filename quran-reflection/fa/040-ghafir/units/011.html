<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَمَتَّنَا" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">أَمَتَّنَا</button>
    <button class="word-link" type="button" data-word="اثنَتَينِ" data-root="ث ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-n-y/" data-root-meaning="دو کردن، تکرار و تا کردن؛ اثنان و مثنى به دو و دوتادوتا اشاره دارند.">اثنَتَينِ</button>
    <button class="word-link" type="button" data-word="وَأَحيَيتَنَا" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">وَأَحيَيتَنَا</button>
    <button class="word-link" type="button" data-word="اثنَتَينِ" data-root="ث ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-n-y/" data-root-meaning="دو کردن، تکرار و تا کردن؛ اثنان و مثنى به دو و دوتادوتا اشاره دارند.">اثنَتَينِ</button>
    <button class="word-link" type="button" data-word="فَاعتَرَفنا" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">فَاعتَرَفنا</button>
    <button class="word-link" type="button" data-word="بِذُنوبِنا" data-root="ذ ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-n-b/" data-root-meaning="دُم؛ ذنب: گناه و مسئولیت آن؛ ذَنوب: دلو پُر یا بهره‌ای مقرر.">بِذُنوبِنا</button>
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهَل</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="خُروجٍ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">خُروجٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سَبيلٍ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلٍ</button>
  </p>
  <p class="farsi-verse">می‌گویند: پروردگارا، دو بار ما را میراندی و دو بار زنده کردی؛ پس به گناهانمان اعتراف کردیم. آیا راهی برای بیرون رفتن هست؟</p>
</section>
