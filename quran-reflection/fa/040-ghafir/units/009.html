<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">غافر ۴۰:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقِهِمُ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَقِهِمُ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّـٔاتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="تَقِ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">تَقِ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="رَحِمتَهُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحِمتَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الفَوزُ" data-root="ف و ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-z/" data-root-meaning="رستگاری، کامیابی و رسیدن به مطلوب با رهایی از خطر.">الفَوزُ</button>
    <button class="word-link" type="button" data-word="العَظيمُ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">العَظيمُ</button>
  </p>
  <p class="farsi-verse">و آنان را از بدی‌ها نگاه دار؛ و هر که را در آن روز از بدی‌ها نگاه داری، به او رحمت کرده‌ای؛ و این همان کامیابی بزرگ است.</p>
</section>
