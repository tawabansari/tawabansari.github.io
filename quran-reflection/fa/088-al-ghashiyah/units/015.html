  <h2 class="ayah-title">الغاشیة ۸۸:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَمارِقُ" data-context="نمارق: بالش‌ها." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">وَنَمارِقُ</button>
    <button class="word-link" type="button" data-word="مَصفوفَةٌ" data-root="ص ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-f-f/" data-root-meaning="در ردیف نهادن یا گستردن بال‌ها.">مَصفوفَةٌ</button>

  <p class="farsi-verse">و بالش‌هایی ردیف‌شده،</p>
