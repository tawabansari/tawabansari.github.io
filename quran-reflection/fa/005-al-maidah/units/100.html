<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۱۰۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمانِ بیانِ این تمایز.">قُل</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَستَوِى" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="برابر نیست؛ خبیث و طیب هم‌ارزش نیستند.">يَستَوِى</button>
    <button class="word-link" type="button" data-word="الخَبيثُ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="ناپاک و ناشایست در برابر پاک و شایسته؛ تمایزی ارزشی.">الخَبيثُ</button>
    <button class="word-link" type="button" data-word="وَالطَّيِّبُ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="پاک و شایسته؛ سوی مقابلِ خبیث در این سنجش.">وَالطَّيِّبُ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَعجَبَكَ" data-root="ع ج ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-b/" data-root-meaning="شگفتی؛ اعجاب: پسند و شگفت‌زدگی." data-context="تو را به شگفت آورد یا چشم تو را بگیرد.">أَعجَبَكَ</button>
    <button class="word-link" type="button" data-word="كَثرَةُ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="فراوانی؛ زیاد بودنِ خبیث که ممکن است چشمگیر باشد.">كَثرَةُ</button>
    <button class="word-link" type="button" data-word="الخَبيثِ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="همان ناپاک یا ناشایست که فراوانی‌اش ارزش آن را تغییر نمی‌دهد.">الخَبيثِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پس از آن معبود یگانه پروا کنید و مسئولانه مراقب باشید.">فَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يٰأُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأُولِى</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-b/" data-root-meaning="مغز و بخش خالص؛ لُبّ: خرد و دریافت روشن." data-context="خردها؛ در خطاب به صاحبان فهم و تشخیص.">الأَلبٰبِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُفلِحونَ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری" data-context="رستگار شوید و به فرجام نیک برسید.">تُفلِحونَ</button>
  </p>
  <p class="farsi-verse">بگو: «ناپاک و پاک برابر نیستند، هرچند فراوانی ناپاک تو را به شگفت آورد.» پس ای خردمندان، از آن معبود یگانه پروا کنید، باشد که رستگار شوید.</p>
</section>
