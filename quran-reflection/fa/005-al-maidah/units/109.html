<section class="ayah-block" id="ayah-109" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۱۰۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="يَجمَعُ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">يَجمَعُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الرُّسُلَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">الرُّسُلَ</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="ماذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ماذا</button>
    <button class="word-link" type="button" data-word="أُجِبتُم" data-root="ج و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أُجِبتُم</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="عِلمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عِلمَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتَ</button>
    <button class="word-link" type="button" data-word="عَلّٰمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَلّٰمُ</button>
    <button class="word-link" type="button" data-word="الغُيوبِ" data-root="غ ي ب" data-learn-more="/quran-terminology/fa/roots/gh-y-b/" data-root-meaning="پنهانی، غیبت، پوشیده بودن از دید انسان، و مرزی که میان آگاهی محدود انسان و علم فراگیر آن معبود یگانه قرار دارد">الغُيوبِ</button>
  </p>
  <p class="farsi-verse">روزی که آن معبود یگانه رسولان را گرد می‌آورد و می‌گوید: «چه پاسخی به شما داده شد؟» می‌گویند: «ما دانشی نداریم؛ همانا تو دانای نهان‌هایی.»</p>
</section>
