  <p class="farsi-verse">اگر دستت را به سوی من دراز کنی تا مرا بکشی، من دستم را به سوی تو دراز نمی‌کنم تا تو را بکشم. من از آن معبود یگانه، پروردگار جهانیان، می‌ترسم.</p>
