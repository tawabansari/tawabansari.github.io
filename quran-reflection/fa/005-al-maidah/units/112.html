  <p class="farsi-verse">هنگامی که حواریان گفتند: «ای عیسی پسر مریم، آیا پروردگارت می‌تواند سفره‌ای از آسمان بر ما فرو فرستد؟» گفت: «از آن معبود یگانه پروا کنید، اگر مؤمن هستید.»</p>
