  <p class="farsi-verse">پس آن معبود یگانه کلاغی فرستاد که در زمین می‌کاوید تا به او نشان دهد چگونه پیکر برادرش را بپوشاند. گفت: «وای بر من! آیا ناتوان شدم از اینکه مانند این کلاغ باشم و پیکر برادرم را بپوشانم؟» پس از پشیمانان شد.</p>
