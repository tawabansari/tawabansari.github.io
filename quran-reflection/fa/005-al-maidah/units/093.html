  <p class="farsi-verse">بر کسانی که ایمان آورده‌اند و کارهای شایسته کرده‌اند، در آنچه خورده‌اند گناهی نیست، هنگامی که پروا کردند و ایمان آوردند و کارهای شایسته کردند، سپس پروا کردند و ایمان آوردند، سپس پروا کردند و نیکی کردند. و آن معبود یگانه نیکوکاران را دوست دارد.</p>
