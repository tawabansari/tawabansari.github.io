  <p class="farsi-verse">بگو: «آیا شما را از چیزی بدتر از این از نظر کیفر نزد آن معبود یگانه آگاه کنم؟ کسی که آن معبود یگانه لعنتش کرده و بر او خشم گرفته و از آنان بوزینگان و خوکان قرار داده، و طاغوت را پرستیده است. آنان جایگاهی بدتر دارند و از راه راست گمراه‌ترند.»</p>
