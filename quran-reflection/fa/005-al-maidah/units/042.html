<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَمّٰعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="بسیار گوش‌سپار">سَمّٰعونَ</button>
    <button class="word-link" type="button" data-word="لِلكَذِبِ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="به دروغ">لِلكَذِبِ</button>
    <button class="word-link" type="button" data-word="أَكّٰلونَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="بسیار خورنده">أَكّٰلونَ</button>
    <button class="word-link" type="button" data-word="لِلسُّحتِ" data-root="س ح ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-h-t/" data-root-meaning="ریشه‌کن کردن؛ سحت: درآمد ناروا و تباه‌کننده." data-context="مال ناروا">لِلسُّحتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="جاءوكَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="نزد تو آمدند">جاءوكَ</button>
    <button class="word-link" type="button" data-word="فَاحكُم" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="پس داوری کن">فَاحكُم</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آنان">بَينَهُم</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="أَعرِض" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="یا روی بگردان">أَعرِض</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُعرِض" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="روی بگردانی">تُعرِض</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="فَلَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَن</button>
    <button class="word-link" type="button" data-word="يَضُرّوكَ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="به تو زیان نمی‌رسانند">يَضُرّوكَ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هیچ چیزی">شَيـًٔا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="حَكَمتَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="داوری کردی">حَكَمتَ</button>
    <button class="word-link" type="button" data-word="فَاحكُم" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="پس داوری کن">فَاحكُم</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آنان">بَينَهُم</button>
    <button class="word-link" type="button" data-word="بِالقِسطِ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است." data-context="به داد">بِالقِسطِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="ح ب ب" data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-context="دوست دارد">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُقسِطينَ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است." data-context="دادگران">المُقسِطينَ</button>
  </p>
  <p class="farsi-verse">بسیار شنونده دروغ و بسیار خورنده مال ناروا هستند. پس اگر نزد تو آمدند، میانشان داوری کن یا از آنان روی بگردان. و اگر از آنان روی بگردانی، هیچ زیانی به تو نمی‌رسانند. و اگر داوری کردی، میانشان به داد داوری کن؛ همانا آن معبود یگانه دادگران را دوست دارد.</p>
</section>
