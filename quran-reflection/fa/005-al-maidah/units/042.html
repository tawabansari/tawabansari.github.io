  </p>
  <p class="farsi-verse">بسیار شنونده دروغ و بسیار خورنده مال ناروا هستند. پس اگر نزد تو آمدند، میانشان داوری کن یا از آنان روی بگردان. و اگر از آنان روی بگردانی، هیچ زیانی به تو نمی‌رسانند. و اگر داوری کردی، میانشان به داد داوری کن؛ همانا آن معبود یگانه دادگران را دوست دارد.</p>
</section>
