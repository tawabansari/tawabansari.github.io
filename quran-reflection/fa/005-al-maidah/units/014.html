  <p class="farsi-verse">و از کسانی که گفتند: «ما نصارا هستیم» پیمان گرفتیم؛ پس بهره‌ای از آنچه به آنان یادآوری شده بود فراموش کردند. پس میان آنان تا روز قیامت دشمنی و کینه افکندیم. و آن معبود یگانه به‌زودی آنان را از آنچه می‌کردند آگاه خواهد کرد.</p>
