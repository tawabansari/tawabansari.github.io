<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ دربارهٔ کسانی که خود را نصارا نامیدند.">قالوا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="نَصٰرىٰ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="نصارا؛ نام جماعت مسیحیان که در این آیه از پیمانشان سخن می‌رود.">نَصٰرىٰ</button>
    <button class="word-link" type="button" data-word="أَخَذنا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="گرفتیم؛ گرفتن پیمان از آنان.">أَخَذنا</button>
    <button class="word-link" type="button" data-word="ميثٰقَهُم" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست" data-context="پیمان استوارشان؛ تعهدی که از آنان گرفته شد.">ميثٰقَهُم</button>
    <button class="word-link" type="button" data-word="فَنَسوا" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="پس فراموش کردند؛ بخشی از یادآوری و تعهد را فروگذاشتند.">فَنَسوا</button>
    <button class="word-link" type="button" data-word="حَظًّا" data-root="ح ظ ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-zha-zha/" data-root-meaning="بهره، سهم و نصیب." data-context="بهره و بخشی از آنچه به آنان یادآوری شده بود.">حَظًّا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="ذُكِّروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="به آنان یادآوری شده بود؛ محتوایی که نباید فروگذاشته می‌شد.">ذُكِّروا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="فَأَغرَينا" data-root="غ ر و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-w/" data-root-meaning="چسبیدن و دل‌بسته شدن؛ اغراء: برانگیختن یا مسلط کردن." data-context="پس برانگیختیم؛ دشمنی و نفرت را میانشان پدید آوردیم.">فَأَغرَينا</button>
    <button class="word-link" type="button" data-word="بَينَهُمُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آنان؛ عرصهٔ رابطه‌ای که دشمنی و نفرت در آن پدید آمد.">بَينَهُمُ</button>
    <button class="word-link" type="button" data-word="العَداوَةَ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمنی؛ رابطهٔ خصمانه‌ای که در کنار نفرت آمده است.">العَداوَةَ</button>
    <button class="word-link" type="button" data-word="وَالبَغضاءَ" data-root="ب غ ض" data-root-meaning="«ب غ ض» به بیزاری و نفرت از شخص یا چیزی در برابر کشش و محبت اشاره دارد. «بغضاء» صورت بیانگر شدت این بیزاری است که می‌تواند در دل وجود داشته باشد، در سخن و کردار آشکار شود و بر روابط میان اشخاص یا گروه‌ها اثر بگذارد." data-context="و نفرت؛ بیزاریِ همراه دشمنی که پس از فراموش کردن بخشی از عهد، میانشان برانگیخته شد." data-learn-more="/quran-terminology/fa/roots/b-gh-dad/">وَالبَغضاءَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ در ترکیب «روز قیامت»، پایان زمانیِ بیان‌شده در جمله.">يَومِ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="رستاخیز؛ برپایی قیامت که استمرار این وضعیت تا آن بیان شده است.">القِيٰمَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَسَوفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَسَوفَ</button>
    <button class="word-link" type="button" data-word="يُنَبِّئُهُمُ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="آنان را آگاه خواهد کرد؛ خبر دادن از کردارهایشان.">يُنَبِّئُهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه فعل بعدی، کردار گذشته و مستمر آنان را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="يَصنَعونَ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر." data-context="انجام می‌دادند؛ کردارهایی که از آن‌ها آگاه خواهند شد.">يَصنَعونَ</button>
  </p>
  <p class="farsi-verse">و از کسانی که گفتند: «ما نصارا هستیم» پیمان گرفتیم؛ پس بهره‌ای از آنچه به آنان یادآوری شده بود فراموش کردند. پس میان آنان تا روز قیامت دشمنی و کینه افکندیم. و آن معبود یگانه به‌زودی آنان را از آنچه می‌کردند آگاه خواهد کرد.</p>
</section>
