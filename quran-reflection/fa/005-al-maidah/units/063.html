<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَولا</button>
    <button class="word-link" type="button" data-word="يَنهىٰهُمُ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده.">يَنهىٰهُمُ</button>
    <button class="word-link" type="button" data-word="الرَّبّٰنِيّونَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">الرَّبّٰنِيّونَ</button>
    <button class="word-link" type="button" data-word="وَالأَحبارُ" data-root="ح ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-r/" data-root-meaning="آراستگی، زیبایی و شادی؛ أحبار: عالمان دینی؛ یحبرون: شاد و برخوردار شدن.">وَالأَحبارُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="قَولِهِمُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قَولِهِمُ</button>
    <button class="word-link" type="button" data-word="الإِثمَ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن">الإِثمَ</button>
    <button class="word-link" type="button" data-word="وَأَكلِهِمُ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">وَأَكلِهِمُ</button>
    <button class="word-link" type="button" data-word="السُّحتَ" data-root="س ح ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-h-t/" data-root-meaning="ریشه‌کن کردن؛ سحت: درآمد ناروا و تباه‌کننده.">السُّحتَ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="يَصنَعونَ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر.">يَصنَعونَ</button>
  </p>
  <p class="farsi-verse">چرا خداپروران و دانشمندان آنان را از گفتار گناه‌آلود و خوردن مال ناروا بازنمی‌دارند؟ چه بد است آنچه می‌کردند.</p>
</section>
