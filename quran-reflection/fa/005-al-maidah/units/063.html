<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَولا</button>
    <button class="word-link" type="button" data-word="يَنهىٰهُمُ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده." data-context="آنان را بازمی‌دارند؛ از گفتار گناه‌آلود و خوردن مال ناروا.">يَنهىٰهُمُ</button>
    <button class="word-link" type="button" data-word="الرَّبّٰنِيّونَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="ربانیان؛ عنوان گروهی دارای جایگاه علمی و دینی در کنار احبار.">الرَّبّٰنِيّونَ</button>
    <button class="word-link" type="button" data-word="وَالأَحبارُ" data-root="ح ب ر" data-root-meaning="اثر و آراستگی؛ حَبْر/حِبْر: عالم دینی؛ حُبُور: شادی و برخورداری از نعمت." data-context="و عالمان دینی؛ کسانی که مسئولیت بازداشتن از گفتار گناه‌آلود و مال ناروا دارند." data-learn-more="/quran-terminology/fa/roots/h-b-r/">وَالأَحبارُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="قَولِهِمُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتارشان؛ سخنی که با گناه وصف شده است.">قَولِهِمُ</button>
    <button class="word-link" type="button" data-word="الإِثمَ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن" data-context="گناه؛ وصفِ گفتار مورد نکوهش.">الإِثمَ</button>
    <button class="word-link" type="button" data-word="وَأَكلِهِمُ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="و خوردنشان؛ تصرف و مصرف مال ناروا.">وَأَكلِهِمُ</button>
    <button class="word-link" type="button" data-word="السُّحتَ" data-root="س ح ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-h-t/" data-root-meaning="ریشه‌کن کردن؛ سحت: درآمد ناروا و تباه‌کننده." data-context="مال ناروا؛ آنچه از راه نامشروع به دست می‌آورند و می‌خورند.">السُّحتَ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="چه بد است؛ نکوهشِ کاری که انجام می‌دادند.">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه «یَصنعون» به رفتار آنان در گذشته اشاره دارد.">كانوا</button>
    <button class="word-link" type="button" data-word="يَصنَعونَ" data-root="ص ن ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-n-ayn/" data-root-meaning="ساختن و انجام دادن با مهارت و تدبیر." data-context="انجام می‌دادند؛ رفتار مورد نکوهش در آیه.">يَصنَعونَ</button>
  </p>
  <p class="farsi-verse">چرا خداپروران و دانشمندان آنان را از گفتار گناه‌آلود و خوردن مال ناروا بازنمی‌دارند؟ چه بد است آنچه می‌کردند.</p>
</section>
