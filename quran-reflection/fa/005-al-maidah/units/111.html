<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۱۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="أَوحَيتُ" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="الهام کردم؛ خطاب الهی درباره ایمان آوردن حواریون.">أَوحَيتُ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الحَوارِيّـۧنَ" data-root="ح و ر" data-root-meaning="بازگشت و رفت‌وبرگشت گفتار؛ گردش و ویژگی‌های رنگ و چشم؛ حواریون، یاران ویژه عیسی." data-context="حواریون؛ گروه یاران عیسی که به ایمان دعوت می‌شوند." data-learn-more="/quran-terminology/fa/roots/h-w-r/">الحَوارِيّـۧنَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="ءامِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان بیاورید؛ فرمان به باور و اعتماد به گوینده و رسول او.">ءامِنوا</button>
    <button class="word-link" type="button" data-word="بى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بى</button>
    <button class="word-link" type="button" data-word="وَبِرَسولى" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و به رسول من؛ پیام‌آور الهی در کنار ایمان به گوینده.">وَبِرَسولى</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ پاسخ حواریون به دعوت ایمان.">قالوا</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردیم؛ اعلام باور و پذیرش حواریون.">ءامَنّا</button>
    <button class="word-link" type="button" data-word="وَاشهَد" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="و گواه باش؛ درخواست گواهی بر تسلیم آنان.">وَاشهَد</button>
    <button class="word-link" type="button" data-word="بِأَنَّنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّنا</button>
    <button class="word-link" type="button" data-word="مُسلِمونَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="تسلیم‌شدگان؛ وصفی که حواریون برای خود بیان می‌کنند.">مُسلِمونَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که به حواریان وحی کردم که به من و رسولم ایمان بیاورید، گفتند: ایمان آوردیم و گواه باش که ما تسلیم هستیم.»</p>
</section>
