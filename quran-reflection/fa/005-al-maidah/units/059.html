  <p class="farsi-verse">بگو: «ای اهل کتاب، آیا از ما خرده می‌گیرید جز برای اینکه به آن معبود یگانه و آنچه بر ما نازل شده و آنچه پیش‌تر نازل شده ایمان آورده‌ایم، و اینکه بیشتر شما نافرمانید؟»</p>
