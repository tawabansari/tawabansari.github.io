  <p class="farsi-verse">آن معبود یگانه هیچ بحیره و سائبه و وصیله و حامی مقرر نکرده است؛ ولی کسانی که انکار کرده‌اند بر آن معبود یگانه دروغ می‌بندند، و بیشترشان خرد نمی‌ورزند.</p>
