<section class="ayah-block" id="ayah-103" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۱۰۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار داده و مقرر کرده است؛ اینجا نسبت دادن این عنوان‌های عرفی به حکم خدا نفی می‌شود.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَحيرَةٍ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="بحیره؛ عنوانی عرفی برای ماده‌شتری با گوش شکافته و محدودیت‌هایی در استفاده از آن؛ جزئیات رسم در نقل‌ها متفاوت است.">بَحيرَةٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="سائِبَةٍ" data-root="س ي ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-b/" data-root-meaning="رها کردن؛ سائبه: دام رهاشده بر اساس رسم مذهبی پیشین." data-context="سائبه؛ دامی که طبق رسمی رها می‌کردند و استفاده از آن را محدود می‌ساختند.">سائِبَةٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="وَصيلَةٍ" data-root="و ص ل" data-learn-more="/quran-terminology/fa/roots/w-sad-l/" data-root-meaning="پیوستن، پیوند دادن، رساندن، و حفظ اتصال‌هایی که نباید گسسته شوند" data-context="وصیله؛ عنوانی عرفی برای دام در پیوند با زایش و پیوستگی نسل؛ جزئیات آن در گزارش‌ها متفاوت است.">وَصيلَةٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="حامٍ" data-root="ح م ي" data-root-meaning="گرما و داغ شدن؛ حفاظت و بازداشتن آسیب یا دسترسی؛ حمیه: غیرت، برانگیختگی و تعصب." data-context="حام؛ عنوانی عرفی برای شتر نری که پس از مرحله‌ای از تولید نسل از استفادهٔ معمول کنار گذاشته می‌شد؛ آیه نسبت دادن این رسم به حکم خدا را نفی می‌کند." data-learn-more="/quran-terminology/fa/roots/h-m-y/">حامٍ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ کسانی که در این آیه جعل حکم و دروغ بستن به خدا به آنان نسبت داده می‌شود.">كَفَروا</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="می‌سازند و به دروغ نسبت می‌دهند؛ دربارهٔ ادعای حکم الهی برای این رسم‌ها.">يَفتَرونَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الكَذِبَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام" data-context="دروغ؛ نسبت دادن چیزی خلاف واقع به خدا.">الكَذِبَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَكثَرُهُم" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="و بیشتر آنان؛ اکثریت گروه مورد سخن.">وَأَكثَرُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="خرد را به کار می‌گیرند و می‌سنجند؛ با «لا»، تعقل نکردن بیشتر آنان بیان می‌شود.">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه هیچ بحیره و سائبه و وصیله و حامی مقرر نکرده است؛ ولی کسانی که انکار کرده‌اند بر آن معبود یگانه دروغ می‌بندند، و بیشترشان خرد نمی‌ورزند.</p>
</section>
