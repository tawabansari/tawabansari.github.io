<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="نادَيتُم" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="فرا خواندید؛ دعوت به صلاة." data-learn-more="/quran-terminology/fa/roots/n-d-y/">نادَيتُم</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلاة؛ عمل عبادیِ موضوع فراخوان.">الصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوها" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="آن را می‌گیرند؛ برخورد آنان با فراخوان به صورت تمسخر.">اتَّخَذوها</button>
    <button class="word-link" type="button" data-word="هُزُوًا" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="ریشخند؛ شیوهٔ برخورد با فراخوان.">هُزُوًا</button>
    <button class="word-link" type="button" data-word="وَلَعِبًا" data-root="ل ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-ayn-b/" data-root-meaning="بازی و کاری برای سرگرمی." data-context="و بازی؛ برخورد غیرجدی آنان.">وَلَعِبًا</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="مردمی؛ گروهی که رفتارشان وصف می‌شود." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">قَومٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="تعقل می‌کنند؛ در این جمله نفی شده است.">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که به صلات فرا می‌خوانید، آن را به مسخره و بازی می‌گیرند. این از آن روست که آنان قومی‌اند که خرد نمی‌ورزند.</p>
</section>
