  <p class="farsi-verse">و هنگامی که آنچه را به سوی رسول نازل شده می‌شنوند، می‌بینی که چشم‌هایشان از اشک لبریز می‌شود، به سبب آنچه از حق شناخته‌اند. می‌گویند: «پروردگارا، ایمان آوردیم؛ پس ما را با گواهان بنویس.</p>
