<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="سَمِعوا" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="می‌شنوند؛ آنچه را به سوی فرستاده نازل شده است.">سَمِعوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أُنزِلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نازل شده است؛ دربارهٔ پیام وحی که به فرستاده رسیده است.">أُنزِلَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="الرَّسولِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستاده؛ دریافت‌کنندهٔ پیام نازل‌شده در آیه.">الرَّسولِ</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینی؛ مشاهدهٔ چشم‌های اشک‌بار آنان.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="أَعيُنَهُم" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="چشم‌هایشان؛ مفعولِ «ترى» که جریان اشک به آنها نسبت داده شده است.">أَعيُنَهُم</button>
    <button class="word-link" type="button" data-word="تَفيضُ" data-root="ف ي ض" data-root-meaning="روان شدن و به جریان افتادن؛ گاه همراه با فراوانی و سرریز؛ و در کاربردهای گسترده‌تر، حرکت جمعی یا پیش رفتن در گفتار و فعالیت." data-context="چشم‌هایشان از اشک سرازیر می‌شود؛ در واکنش به حقیقتی که شناخته‌اند." data-learn-more="/quran-terminology/fa/roots/f-y-dad/">تَفيضُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الدَّمعِ" data-root="د م ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-m-ayn/" data-root-meaning="اشک و اشک ریختن." data-context="اشک؛ آنچه از چشم‌های آنان جریان می‌یابد.">الدَّمعِ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="عَرَفوا" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="شناختند و بازشناختند؛ دربارهٔ حقیقتی که شنیده‌اند.">عَرَفوا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حقیقت و راستی؛ آنچه از پیام شناخته‌اند.">الحَقِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ بیان ایمان و درخواستِ ثبت شدن همراه گواهان.">يَقولونَ</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار ما؛ خطاب آنان هنگام اقرار به ایمان.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردیم؛ اقرار آنان پس از شناخت حقیقت.">ءامَنّا</button>
    <button class="word-link" type="button" data-word="فَاكتُبنا" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="پس ما را بنویس و ثبت کن؛ همراه گواهان.">فَاكتُبنا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="الشّٰهِدينَ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهان؛ گروهی که خواهان ثبت شدن همراه آنان‌اند.">الشّٰهِدينَ</button>
  </p>
  <p class="farsi-verse">و هنگامی که آنچه را به سوی رسول نازل شده می‌شنوند، می‌بینی که چشم‌هایشان از اشک لبریز می‌شود، به سبب آنچه از حق شناخته‌اند. می‌گویند: «پروردگارا، ایمان آوردیم؛ پس ما را با گواهان بنویس.</p>
</section>
