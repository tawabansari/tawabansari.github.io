  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، از چیزهایی نپرسید که اگر برای شما آشکار شوند، شما را ناخشنود کنند. و اگر هنگام نازل شدن قرآن درباره آن‌ها بپرسید، برای شما آشکار می‌شوند. آن معبود یگانه از آن‌ها درگذشته است؛ و آن معبود یگانه آمرزنده و بردبار است.</p>
