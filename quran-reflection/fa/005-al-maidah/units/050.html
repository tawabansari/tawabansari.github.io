<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَحُكمَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">أَفَحُكمَ</button>
    <button class="word-link" type="button" data-word="الجٰهِلِيَّةِ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه.">الجٰهِلِيَّةِ</button>
    <button class="word-link" type="button" data-word="يَبغونَ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد">يَبغونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="حُكمًا" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">حُكمًا</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يوقِنونَ" data-root="ي ق ن" data-learn-more="/quran-terminology/fa/roots/y-q-n/" data-root-meaning="ثبات معرفت، اطمینان روشن، و عبور از گمان">يوقِنونَ</button>
  </p>
  <p class="farsi-verse">آیا حکم جاهلیت را می‌جویند؟ و برای قومی که یقین دارند، چه کسی در داوری بهتر از آن معبود یگانه است؟</p>
</section>
