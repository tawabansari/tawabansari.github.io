  </p>
  <p class="farsi-verse">پس کسانی را که در دل‌هایشان بیماری است می‌بینی که در میان آنان شتاب می‌کنند و می‌گویند: «می‌ترسیم گردش ناگواری به ما برسد.» پس چه‌بسا آن معبود یگانه پیروزی یا امری از نزد خود بیاورد و آنان بر آنچه در خود پنهان کرده‌اند پشیمان شوند.</p>
