  </p>
  <p class="farsi-verse">و خبر دو پسر آدم را به‌حق بر آنان بخوان؛ هنگامی که هر دو قربانی‌ای پیش آوردند، پس از یکی پذیرفته شد و از دیگری پذیرفته نشد. گفت: «حتماً تو را می‌کشم.» گفت: «آن معبود یگانه تنها از پرواپیشگان می‌پذیرد.</p>
