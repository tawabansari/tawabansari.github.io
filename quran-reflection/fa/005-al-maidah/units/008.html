  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، برای آن معبود یگانه استوار بایستید و به داد گواهی دهید. و دشمنی با قومی شما را به بی‌عدالتی واندارد. عدالت بورزید که به پروا نزدیک‌تر است. و از آن معبود یگانه پروا کنید؛ همانا آن معبود یگانه به آنچه می‌کنید آگاه است.</p>
