<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="أَقامُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="تورات و انجیل و آنچه نازل شده را برپا می‌داشتند.">أَقامُوا</button>
    <button class="word-link" type="button" data-word="التَّورىٰةَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">التَّورىٰةَ</button>
    <button class="word-link" type="button" data-word="وَالإِنجيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَالإِنجيلَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أُنزِلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="نازل شده؛ آنچه از سوی پروردگارشان به آنان رسیده است.">أُنزِلَ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار آنان.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="لَأَكَلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="حتما می‌خوردند؛ بهره‌مندی از روزی در نتیجه شرط پیشین.">لَأَكَلوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِهِم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بالای آنان؛ یکی از جهت‌های رسیدن روزی.">فَوقِهِم</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="تَحتِ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="زیر پاهای آنان؛ جهت رسیدن روزی.">تَحتِ</button>
    <button class="word-link" type="button" data-word="أَرجُلِهِم" data-root="ر ج ل" data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ پا؛ و پیاده‌رفتن و پیادگان در شاخه‌های متمایز. معنای هر صورت از ساختمان واژه و سیاق شناخته می‌شود." data-context="پاهای آنان؛ روزی از زیر پاهایشان.">أَرجُلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="گروهی از میان آنان.">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="مُقتَصِدَةٌ" data-root="ق ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-d/" data-root-meaning="قصد و رو به هدف رفتن؛ نیز میانه‌روی و اعتدال." data-context="میانه‌رو و بر راه معتدل؛ وصف گروهی از آنان.">مُقتَصِدَةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَثيرٌ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="و بسیاری از آنان.">وَكَثيرٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="ساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بد است؛ در نکوهش رفتار بسیاری از آنان.">ساءَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دهند؛ کردار نکوهیده آنان.">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و اگر تورات و انجیل و آنچه از پروردگارشان به سوی آنان نازل شده برپا می‌داشتند، از بالای خود و از زیر پاهایشان می‌خوردند. از آنان جماعتی میانه‌رو هستند؛ و بسیاری از آنان، بد است آنچه انجام می‌دهند.</p>
</section>
