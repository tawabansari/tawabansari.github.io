<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="المَسيحُ" data-root="م س ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-h/" data-root-meaning="دست کشیدن و پاک کردن؛ نیز اندازه‌گیری سطح." data-context="مسیح؛ عنوان عیسی در این آیه.">المَسيحُ</button>
    <button class="word-link" type="button" data-word="ابنُ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="پسر؛ بیان پیوند فرزندی در ترکیب پس از آن.">ابنُ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="رَسولٌ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="رسول و فرستاده؛ وصف مسیح در این آیه.">رَسولٌ</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="خَلَت" data-root="خ ل و" data-learn-more="/quran-terminology/fa/roots/kh-l-w/" data-root-meaning="خالی شدن، خلوت کردن، کنار رفتن از جمع، تنها شدن، رها شدن از مانع، و جدا شدن از میدان آشکار" data-context="گذشته‌اند؛ درباره رسولانی که پیش از او بودند.">خَلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از او؛ پیش از مسیح در این آیه.">قَبلِهِ</button>
    <button class="word-link" type="button" data-word="الرُّسُلُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="رسولان و فرستادگان پیشین.">الرُّسُلُ</button>
    <button class="word-link" type="button" data-word="وَأُمُّهُ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="و مادر او؛ مادر مسیح.">وَأُمُّهُ</button>
    <button class="word-link" type="button" data-word="صِدّيقَةٌ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="بسیار راستگو و پایبند به راستی؛ وصف مادر مسیح.">صِدّيقَةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="كانا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="آن دو بودند؛ فعلِ مربوط به مسیح و مادرش.">كانا</button>
    <button class="word-link" type="button" data-word="يَأكُلانِ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="آن دو غذا می‌خوردند؛ مسیح و مادرش.">يَأكُلانِ</button>
    <button class="word-link" type="button" data-word="الطَّعامَ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا" data-context="خوراکی که آن دو می‌خوردند.">الطَّعامَ</button>
    ۗ
    <button class="word-link" type="button" data-word="انظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="بنگر؛ دعوت مخاطب به توجه و مشاهده.">انظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="نُبَيِّنُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="روشن می‌سازیم؛ آشکار کردن نشانه‌ها برای آنان.">نُبَيِّنُ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌هایی که برای آنان روشن ساخته می‌شود.">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="انظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="بنگر؛ دعوت مخاطب به توجه و مشاهده.">انظُر</button>
    <button class="word-link" type="button" data-word="أَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="پس از بیان نشانه‌ها درباره مسیح، چگونه از حقیقت برگردانده می‌شوند؟">يُؤفَكونَ</button>
  </p>
  <p class="farsi-verse">مسیح پسر مریم جز رسولی نیست که پیش از او رسولان گذشته‌اند؛ و مادرش زنی بسیار راستگو بود. هر دو خوراک می‌خوردند. بنگر چگونه آیات را برای آنان روشن می‌کنیم؛ سپس بنگر چگونه گردانده می‌شوند.</p>
</section>
