<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۹۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">يُريدُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يوقِعَ" data-root="و ق ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-ayn/" data-root-meaning="افتادن، رخ دادن و تحقق یافتن.">يوقِعَ</button>
    <button class="word-link" type="button" data-word="بَينَكُمُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَكُمُ</button>
    <button class="word-link" type="button" data-word="العَدٰوَةَ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">العَدٰوَةَ</button>
    <button class="word-link" type="button" data-word="وَالبَغضاءَ" data-root="ب غ ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-gh-dad/" data-root-meaning="بیزاری، نفرت و نخواستنِ چیزی یا کسی؛ در برابر محبت.">وَالبَغضاءَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الخَمرِ" data-root="خ م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-m-r/" data-root-meaning="پوشاندن؛ خمر: نوشیدنی مست‌کننده؛ خمار: پوشش سر، بنا بر کاربرد واژه.">الخَمرِ</button>
    <button class="word-link" type="button" data-word="وَالمَيسِرِ" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت">وَالمَيسِرِ</button>
    <button class="word-link" type="button" data-word="وَيَصُدَّكُم" data-root="ص د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-d-d/" data-root-meaning="روی گرداندن و بازداشتن دیگری.">وَيَصُدَّكُم</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">ذِكرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَعَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَنِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهَل</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="مُنتَهونَ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده.">مُنتَهونَ</button>
  </p>
  <p class="farsi-verse">شیطان تنها می‌خواهد به‌وسیله شراب و قمار میان شما دشمنی و کینه بیندازد و شما را از یاد آن معبود یگانه و از صلات بازدارد. پس آیا بازمی‌ایستید؟</p>
</section>
