  <p class="farsi-verse">پس آن معبود یگانه به سبب آنچه گفتند، باغ‌هایی به آنان پاداش داد که از زیرشان نهرها روان است؛ در آن‌ها ماندگارند. و این پاداش نیکوکاران است.</p>
