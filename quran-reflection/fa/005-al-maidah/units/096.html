<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُحِلَّ" data-root="ح ل ل" data-root-meaning="گشودن و برداشتن بستگی؛ روا بودن و رفع ممنوعیت؛ فرود آمدن و قرار گرفتن در جایگاه." data-context="حلال گردانیده شد؛ شکار دریا و خوراک آن." data-learn-more="/quran-terminology/fa/roots/h-l-l/">أُحِلَّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="صَيدُ" data-root="ص ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-d/" data-root-meaning="شکار کردن و جانور شکارشده." data-context="شکار؛ جانور شکارشونده">صَيدُ</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دریا">البَحرِ</button>
    <button class="word-link" type="button" data-word="وَطَعامُهُ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا" data-context="و خوراک آن">وَطَعامُهُ</button>
    <button class="word-link" type="button" data-word="مَتٰعًا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="بهره و مایهٔ استفاده">مَتٰعًا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَلِلسَّيّارَةِ" data-root="س ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-r/" data-root-meaning="رفتن و حرکت در مسیر؛ سیره: روش یا حالت." data-context="و برای مسافران">وَلِلسَّيّارَةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَحُرِّمَ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="و حرام شد">وَحُرِّمَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="صَيدُ" data-root="ص ي د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-y-d/" data-root-meaning="شکار کردن و جانور شکارشده." data-context="شکار؛ موضوع منع">صَيدُ</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="ب ر ر" data-learn-more="/quran-terminology/fa/roots/b-r-r/" data-context="خشکی" data-root-meaning="نیکی گسترده، راست‌کرداری، وفاداری، احسان، گشودگی در خیر، و ایستادن بر زمین استوار اخلاقی؛ و «بَرّ» در برابر دریا، خشکی است.">البَرِّ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="دُمتُم" data-root="د و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-w-m/" data-root-meaning="دوام آوردن، پایدار ماندن و ادامه داشتن." data-context="باقی هستید؛ در وضعیت احرام">دُمتُم</button>
    <button class="word-link" type="button" data-word="حُرُمًا" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="در احرام">حُرُمًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و پروا کنید">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُحشَرونَ" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="گرد آورده می‌شوید" data-learn-more="/quran-terminology/fa/roots/h-sh-r/">تُحشَرونَ</button>
  </p>
  <p class="farsi-verse">شکار دریا و خوراک آن برای شما حلال شده است، بهره‌ای برای شما و مسافران؛ و شکار خشکی تا هنگامی که در احرام هستید بر شما حرام شده است. و از آن معبود یگانه که به سوی او گرد آورده می‌شوید پروا کنید.</p>
</section>
