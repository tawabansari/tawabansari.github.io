  <p class="farsi-verse">و مرد دزد و زن دزد؛ دست‌هایشان را ببرید، کیفری در برابر آنچه کسب کرده‌اند، کیفر عبرت‌آموزی از سوی آن معبود یگانه. و آن معبود یگانه شکست‌ناپذیر و حکیم است.</p>
