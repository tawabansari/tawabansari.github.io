<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۷۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="أَخَذنا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَخَذنا</button>
    <button class="word-link" type="button" data-word="ميثٰقَ" data-root="و ث ق" data-learn-more="/quran-terminology/fa/roots/w-th-q/" data-root-meaning="استحکام، اعتماد، محکم بستن، وثاقت و تعهدی که سست و رها نیست">ميثٰقَ</button>
    <button class="word-link" type="button" data-word="بَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">بَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="وَأَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَأَرسَلنا</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="رُسُلًا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رُسُلًا</button>
    ۖ
    <button class="word-link" type="button" data-word="كُلَّما" data-root="ك ل ل" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلَّما</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَهُم</button>
    <button class="word-link" type="button" data-word="رَسولٌ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رَسولٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَهوىٰ" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس">تَهوىٰ</button>
    <button class="word-link" type="button" data-word="أَنفُسُهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">أَنفُسُهُم</button>
    <button class="word-link" type="button" data-word="فَريقًا" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">فَريقًا</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="وَفَريقًا" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">وَفَريقًا</button>
    <button class="word-link" type="button" data-word="يَقتُلونَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">يَقتُلونَ</button>
  </p>
  <p class="farsi-verse">از بنی‌اسرائیل پیمان گرفتیم و رسولانی به سوی آنان فرستادیم. هر بار رسولی چیزی برایشان آورد که نفس‌هایشان نمی‌پسندید، گروهی را دروغ شمردند و گروهی را می‌کشتند.</p>
</section>
