  <p class="farsi-verse">از بنی‌اسرائیل پیمان گرفتیم و رسولانی به سوی آنان فرستادیم. هر بار رسولی چیزی برایشان آورد که نفس‌هایشان نمی‌پسندید، گروهی را دروغ شمردند و گروهی را می‌کشتند.</p>
