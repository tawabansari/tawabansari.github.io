  <p class="farsi-verse">کسانی که انکار کرده‌اند، اگر همه آنچه در زمین است و همانند آن را همراهش داشته باشند تا به‌وسیله آن خود را از عذاب روز قیامت بازخرند، از آنان پذیرفته نمی‌شود؛ و برای آنان عذابی دردناک است.</p>
