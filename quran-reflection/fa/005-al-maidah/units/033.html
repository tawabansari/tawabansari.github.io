  <p class="farsi-verse">کیفر کسانی که با آن معبود یگانه و رسولش می‌جنگند و در زمین برای فساد می‌کوشند، تنها این است که کشته شوند یا به صلیب کشیده شوند یا دست‌ها و پاهایشان از جهت مخالف بریده شود یا از زمین رانده شوند. این برای آنان خواری در دنیاست؛ و در آخرت برای آنان عذابی بزرگ است.</p>
