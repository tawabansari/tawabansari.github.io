  <p class="farsi-verse">به آنان جز آنچه مرا به آن فرمان دادی نگفتم: آن معبود یگانه، پروردگار من و پروردگار شما را بپرستید. و تا هنگامی که در میانشان بودم بر آنان گواه بودم؛ پس چون مرا به‌تمامی گرفتی، خود تو مراقب آنان بودی؛ و تو بر هر چیزی گواهی.</p>
