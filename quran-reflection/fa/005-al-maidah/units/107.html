  </p>
  <p class="farsi-verse">پس اگر معلوم شد که آن دو مرتکب گناه شده‌اند، دو تن دیگر از کسانی که حقشان پایمال شده، آن دو که سزاوارترند، به جای آنان می‌ایستند و به آن معبود یگانه سوگند می‌خورند: «گواهی ما از گواهی آن دو راست‌تر است و تجاوز نکرده‌ایم؛ که در آن صورت از ستمگران خواهیم بود.»</p>
