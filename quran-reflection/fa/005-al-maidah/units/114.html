<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۱۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="عيسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عيسَى</button>
    <button class="word-link" type="button" data-word="ابنُ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">ابنُ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="اللَّهُمَّ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُمَّ</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَنزِل" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">أَنزِل</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="مائِدَةً" data-root="م ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مائِدَةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءِ</button>
    <button class="word-link" type="button" data-word="تَكونُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكونُ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="عيدًا" data-root="ع و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عيدًا</button>
    <button class="word-link" type="button" data-word="لِأَوَّلِنا" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">لِأَوَّلِنا</button>
    <button class="word-link" type="button" data-word="وَءاخِرِنا" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">وَءاخِرِنا</button>
    <button class="word-link" type="button" data-word="وَءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">وَءايَةً</button>
    <button class="word-link" type="button" data-word="مِنكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَارزُقنا" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">وَارزُقنا</button>
    <button class="word-link" type="button" data-word="وَأَنتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنتَ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرُ</button>
    <button class="word-link" type="button" data-word="الرّٰزِقينَ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">الرّٰزِقينَ</button>
  </p>
  <p class="farsi-verse">عیسی پسر مریم گفت: «ای آن معبود یگانه، پروردگار ما، سفره‌ای از آسمان بر ما فرو فرست که برای نخستین و آخرین ما عیدی باشد و نشانه‌ای از تو؛ و به ما روزی بده که تو بهترین روزی‌دهندگانی.»</p>
</section>
