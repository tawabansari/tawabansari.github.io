<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اید؛ مخاطبانِ خطاب.">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="اذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="به یاد آورید؛ فرمان یادکرد نعمت.">اذكُروا</button>
    <button class="word-link" type="button" data-word="نِعمَتَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمت؛ احسان یادآوری‌شده در بازداشتن دست دشمنان.">نِعمَتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="هَمَّ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="ه م م" data-learn-more="/quran-terminology/fa/roots/h2-m-m/" data-root-meaning="اندوه و دل‌مشغولی؛ همّ: قصد یا بر آن شدن." data-context="قصد کردند؛ تصمیم گروه برای دست دراز کردن.">هَمَّ</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="گروهی؛ کسانی که قصد آسیب داشتند." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">قَومٌ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَبسُطوا" data-root="ب س ط" data-root-meaning="گشودن، گستردن و امتداد دادن؛ در کاربردهای گوناگون، گشایش روزی یا وسعت دانش و توانایی نیز از سیاق روشن می‌شود." data-context="دست دراز کنند؛ فعل دربارهٔ قصد گروه برای آسیب‌رسانی به مخاطبان." data-learn-more="/quran-terminology/fa/roots/b-s-tt/">يَبسُطوا</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌هایشان؛ آنچه می‌خواستند به سوی مخاطبان دراز کنند.">أَيدِيَهُم</button>
    <button class="word-link" type="button" data-word="فَكَفَّ" data-root="ك ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-f-f/" data-root-meaning="کف دست؛ بازداشتن و دست کشیدن؛ کافّه: همگی." data-context="پس بازداشت؛ جلوگیری از رسیدن دست‌های آنان.">فَكَفَّ</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="دست‌هایشان؛ دست‌هایی که بازداشته شدند.">أَيدِيَهُم</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و پروا کنید؛ فرمان مراقبت در نسبت با آن معبود یگانه.">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَليَتَوَكَّلِ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار." data-context="باید توکل کند؛ فرمان اعتماد و سپردن کار.">فَليَتَوَكَّلِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمنان؛ کسانی که به توکل فراخوانده شده‌اند.">المُؤمِنونَ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، نعمت آن معبود یگانه بر خود را به یاد آورید، هنگامی که قومی قصد کردند دست‌هایشان را به سوی شما دراز کنند، پس دست‌هایشان را از شما بازداشت. و از آن معبود یگانه پروا کنید؛ و مؤمنان بر آن معبود یگانه توکل کنند.</p>
</section>
