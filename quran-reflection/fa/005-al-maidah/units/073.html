  <p class="farsi-verse">کسانی که گفتند: «آن معبود یگانه سومِ سه است» بی‌گمان انکار کردند؛ و هیچ معبودی جز معبودی یگانه نیست. و اگر از آنچه می‌گویند بازنایستند، حتماً به کسانی از آنان که انکار کرده‌اند عذابی دردناک خواهد رسید.</p>
