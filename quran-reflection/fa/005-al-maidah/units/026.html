<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">المائده ۵:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="فَإِنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّها</button>
    <button class="word-link" type="button" data-word="مُحَرَّمَةٌ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت">مُحَرَّمَةٌ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    ۛ
    <button class="word-link" type="button" data-word="أَربَعينَ" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی">أَربَعينَ</button>
    <button class="word-link" type="button" data-word="سَنَةً" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-root="س ن و" data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است.">سَنَةً</button>
    ۛ
    <button class="word-link" type="button" data-word="يَتيهونَ" data-root="ت ي ه" data-learn-more="/quran-terminology/fa/roots/t-y-h2/" data-root-meaning="حرکت سرگردان در فضایی که راه درست، جهت ثابت یا مسیر خروج در آن پیدا نمی‌شود.">يَتيهونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَأسَ" data-root="أ س ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-s-w/" data-root-meaning="مداوا و اصلاح؛ أُسوه: الگو و پیروی؛ أَسى: اندوه و دریغ. معنای هر شاخه از صورت و سیاق شناخته می‌شود.">تَأسَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومِ</button>
    <button class="word-link" type="button" data-word="الفٰسِقينَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن">الفٰسِقينَ</button>
  </p>
  <p class="farsi-verse">گفت: «پس آن سرزمین چهل سال بر آنان ممنوع است؛ در زمین سرگردان می‌شوند. پس بر قوم نافرمان اندوه مخور.»</p>
</section>
