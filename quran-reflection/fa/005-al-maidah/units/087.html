  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، پاکیزه‌های آنچه آن معبود یگانه برای شما حلال کرده حرام نکنید و تجاوز نکنید. همانا آن معبود یگانه تجاوزگران را دوست ندارد.</p>
