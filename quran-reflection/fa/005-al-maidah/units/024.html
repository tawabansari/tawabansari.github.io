    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>

  <p class="farsi-verse">گفتند: «ای موسی، تا هنگامی که آنان در آن‌اند، ما هرگز وارد آن نمی‌شویم. پس تو و پروردگارت بروید و بجنگید؛ ما همین‌جا نشسته‌ایم.»</p>
