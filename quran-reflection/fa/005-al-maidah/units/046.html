  <p class="farsi-verse">و در پی آنان عیسی پسر مریم را فرستادیم، تصدیق‌کننده آنچه پیش روی او از تورات بود؛ و به او انجیل دادیم که در آن هدایت و نور بود و تصدیق‌کننده آنچه پیش روی آن از تورات بود، و هدایت و پندی برای پرواپیشگان.</p>
