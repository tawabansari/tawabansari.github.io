  <p class="farsi-verse">آن معبود یگانه گفت: «من آن را بر شما فرو می‌فرستم؛ پس هر که از شما پس از آن انکار کند، او را عذابی می‌کنم که هیچ‌کس از جهانیان را چنان عذاب نمی‌کنم.»</p>
