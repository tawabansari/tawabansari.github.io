  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، کسانی را که دین شما را به مسخره و بازی گرفته‌اند، از آنان که پیش از شما کتاب داده شده‌اند و انکارکنندگان، سرپرست نگیرید. و از آن معبود یگانه پروا کنید، اگر مؤمن هستید.</p>
