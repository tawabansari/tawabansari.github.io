  <p class="farsi-verse">بگو: «ای اهل کتاب، بر چیزی استوار نیستید تا تورات و انجیل و آنچه از پروردگارتان به سوی شما نازل شده برپا دارید.» و آنچه از پروردگارت بر تو نازل شده، بی‌گمان بر سرکشی و انکار بسیاری از آنان می‌افزاید. پس بر قوم انکارکننده اندوه مخور.</p>
