  <p class="farsi-verse">ای رسول، آنچه از پروردگارت به سوی تو نازل شده برسان؛ و اگر انجام ندهی، پیام او را نرسانده‌ای. و آن معبود یگانه تو را از مردم نگاه می‌دارد. همانا آن معبود یگانه قوم انکارکننده را هدایت نمی‌کند.</p>
