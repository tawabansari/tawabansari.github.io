  <p class="farsi-verse">و کسانی که کفر ورزیدند دربارهٔ کسانی که ایمان آوردند گفتند: اگر خیری بود، در آن بر ما پیشی نمی‌گرفتند. و چون با آن هدایت نیافتند، خواهند گفت: این دروغی کهنه است.</p>
