<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ فعل نقلِ گفتار گروهی که پس از آن نام برده می‌شود.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند و نپذیرفتند؛ وصف گروه مورد بحث.">كَفَروا</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آورده‌اند؛ گروهی که مخالفان درباره آنان سخن می‌گویند.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="می‌بود؛ در جمله شرطیِ گفتار مخالفان: اگر پیام خیری می‌بود.">كانَ</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="خیری؛ وصفی که مخالفان در جمله شرطی درباره پیام مطرح می‌کنند.">خَيرًا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="سَبَقونا" data-root="س ب ق" data-learn-more="/quran-terminology/fa/roots/s-b-q/" data-root-meaning="پیش افتادن، پیشی گرفتن و سبقت جستن؛ از مسابقه و تقدم زمانی تا پیشگامی در کارهای نیک و پیشی‌ناپذیری در برابر اراده آن معبود یگانه" data-context="از ما پیشی گرفته‌اند؛ در ادعای مخالفان درباره پذیرش پیام.">سَبَقونا</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَهتَدوا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت" data-context="هدایت نیافته‌اند؛ در این جمله پس از نفی آمده است.">يَهتَدوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="فَسَيَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس خواهند گفت؛ خبر از ادعای آینده آنان.">فَسَيَقولونَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِفكٌ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="ناراستی؛ عنوانی که مخالفان پیام هدایت را با وصف «کهن» می‌خوانند.">إِفكٌ</button>
    <button class="word-link" type="button" data-word="قَديمٌ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن" data-context="کهن و قدیمی؛ وصف ناراستی در گفتار مخالفان.">قَديمٌ</button>
  </p>
  <p class="farsi-verse">و کسانی که کفر ورزیدند دربارهٔ کسانی که ایمان آوردند گفتند: اگر خیری بود، در آن بر ما پیشی نمی‌گرفتند. و چون با آن هدایت نیافتند، خواهند گفت: این دروغی کهنه است.</p>
</section>
