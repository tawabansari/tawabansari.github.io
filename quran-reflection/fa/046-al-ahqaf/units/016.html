<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="نَتَقَبَّلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="می‌پذیریم؛ دربارهٔ پذیرش نیکوترین کردار آنان.">نَتَقَبَّلُ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوترینِ؛ وصفِ آنچه از کردارشان پذیرفته می‌شود.">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام دادند؛ کردارهایی که از آنان سر زده است.">عَمِلوا</button>
    <button class="word-link" type="button" data-word="وَنَتَجاوَزُ" data-root="ج و ز" data-root-meaning="گذشتن و پشت سر گذاشتن؛ «تَجَاوَزَ عَنْ» در کاربرد قرآنی، درگذشتن از بدی‌ها و مؤاخذهٔ آنها." data-context="و درمی‌گذریم؛ از بدی‌های آنان و مؤاخذهٔ آنها چشم‌پوشی می‌کنیم." data-learn-more="/quran-terminology/fa/roots/j-w-z/">وَنَتَجاوَزُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِهِم" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌هایشان؛ کردارهای بدی که از آنها درگذشته می‌شود.">سَيِّـٔاتِهِم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="أَصحٰبِ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="اهل و همراهانِ؛ در ترکیب «اهلِ باغ».">أَصحٰبِ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغ؛ جایگاه وعده‌داده‌شده به آنان.">الجَنَّةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَعدَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعده؛ وعده‌ای که به آنان داده شده است.">وَعدَ</button>
    <button class="word-link" type="button" data-word="الصِّدقِ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راستی؛ در وصفِ وعدهٔ راستین.">الصِّدقِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه «یُوعَدون» از وعده‌ای که پیش‌تر به آنان داده می‌شد خبر می‌دهد.">كانوا</button>
    <button class="word-link" type="button" data-word="يوعَدونَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعده داده می‌شدند؛ چیزی که پیش‌تر به آنان وعده داده شده بود.">يوعَدونَ</button>
  </p>
  <p class="farsi-verse">آنان کسانی‌اند که بهترینِ آنچه کرده‌اند را از آنان می‌پذیریم و از بدی‌هایشان درمی‌گذریم، در میان اهل بهشت؛ وعدهٔ راستی که به آنان داده می‌شد.</p>
</section>
