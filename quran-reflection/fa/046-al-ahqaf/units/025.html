<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تُدَمِّرُ" data-root="د م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-m-r/" data-root-meaning="ویران و نابود کردن." data-context="درهم می‌کوبد و نابود می‌کند">تُدَمِّرُ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیز">شَىءٍ</button>
    <button class="word-link" type="button" data-word="بِأَمرِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="به فرمان">بِأَمرِ</button>
    <button class="word-link" type="button" data-word="رَبِّها" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار آن باد">رَبِّها</button>
    <button class="word-link" type="button" data-word="فَأَصبَحوا" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ." data-context="پس چنان شدند">فَأَصبَحوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="دیده می‌شود؛ در ساخت نفی، دیده نمی‌شود">يُرىٰ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَسٰكِنُهُم" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="مسکن‌هایشان">مَسٰكِنُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَجزِى" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="جزا می‌دهیم">نَجزِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروه مردم را">القَومَ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمينَ</button>
  </p>
  <p class="farsi-verse">که به فرمان پروردگارش هرچیز را نابود می‌کند. پس چنان شدند که جز خانه‌هایشان دیده نمی‌شد؛ این‌گونه مردم مجرم را جزا می‌دهیم.</p>
</section>
