  <p class="farsi-verse">آیا ندیده‌اند که آن معبود یگانه، که آسمان‌ها و زمین را آفرید و از آفرینش آنها خسته نشد، بر زنده کردن مردگان تواناست؟ آری، او بر هرچیز تواناست.</p>
