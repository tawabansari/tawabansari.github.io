  <p class="farsi-verse">و روزی که کسانی که کفر ورزیدند بر آتش عرضه شوند: پاکیزه‌های خود را در زندگی دنیایتان از دست دادید و از آنها بهره بردید؛ پس امروز به عذاب خواری جزا داده می‌شوید، به سبب آنکه در زمین به‌ناحق تکبر می‌ورزیدید و به سبب آنکه نافرمانی می‌کردید.</p>
