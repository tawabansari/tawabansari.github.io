    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/">قَبلِهِ</button>
    <button class="word-link" type="button" data-word="كِتٰبُ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">كِتٰبُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>

    ۚ
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰذا</button>

  </p>
  <p class="farsi-verse">و پیش از آن، کتاب موسی راهنما و رحمت بود؛ و این کتابی تصدیق‌کننده به زبان عربی است تا کسانی را که ستم کرده‌اند هشدار دهد و مژده‌ای برای نیکوکاران باشد.</p>
