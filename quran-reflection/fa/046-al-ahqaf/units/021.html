  <p class="farsi-verse">و برادر عاد را یاد کن، آنگاه که قومش را در تپه‌های شنی هشدار داد، و هشداردهندگان پیش از او و پس از او گذشته بودند، که جز آن معبود یگانه را نپرستید؛ من بر شما از عذاب روزی بزرگ می‌ترسم.</p>
