<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَاذكُر</button>
    <button class="word-link" type="button" data-word="أَخا" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="برادرِ قوم؛ در این سیاق، بیانگر پیوند قومی یا اجتماعی با مخاطبان، نه هم‌دینی همه آنان.">أَخا</button>
    <button class="word-link" type="button" data-word="عادٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عادٍ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="أَنذَرَ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">أَنذَرَ</button>
    <button class="word-link" type="button" data-word="قَومَهُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومَهُ</button>
    <button class="word-link" type="button" data-word="بِالأَحقافِ" data-root="ح ق ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-q-f/" data-root-meaning="خمیدگی و توده‌های خمیده شن؛ احقاف: ریگزارها و نام ناحیه‌ای.">بِالأَحقافِ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="خَلَتِ" data-root="خ ل و" data-learn-more="/quran-terminology/fa/roots/kh-l-w/" data-root-meaning="خالی شدن، خلوت کردن، کنار رفتن از جمع، تنها شدن، رها شدن از مانع، و جدا شدن از میدان آشکار">خَلَتِ</button>
    <button class="word-link" type="button" data-word="النُّذُرُ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">النُّذُرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينِ</button>
    <button class="word-link" type="button" data-word="يَدَيهِ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">يَدَيهِ</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="خَلفِهِ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">خَلفِهِ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعبُدوا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">تَعبُدوا</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَخافُ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">أَخافُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابَ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومٍ</button>
    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">عَظيمٍ</button>
  </p>
  <p class="farsi-verse">و برادر عاد را یاد کن، آنگاه که قومش را در تپه‌های شنی هشدار داد، و هشداردهندگان پیش از او و پس از او گذشته بودند، که جز آن معبود یگانه را نپرستید؛ من بر شما از عذاب روزی بزرگ می‌ترسم.</p>
</section>
