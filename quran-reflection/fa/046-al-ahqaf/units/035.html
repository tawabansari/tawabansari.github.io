<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="پس شکیبایی کن.">فَاصبِر</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="صَبَرَ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="چنان‌که شکیبایی کردند.">صَبَرَ</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولُوا</button>
    <button class="word-link" type="button" data-word="العَزمِ" data-root="ع ز م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-z-m/" data-root-meaning="تصمیم و اراده استوار برای انجام کار." data-context="عزم و ارادهٔ استوار.">العَزمِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الرُّسُلِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="از فرستادگان.">الرُّسُلِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَستَعجِل" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله" data-context="شتاب مکن؛ در درخواستِ فرارسیدن پیامد.">تَستَعجِل</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که آن را می‌بینند.">يَومَ</button>
    <button class="word-link" type="button" data-word="يَرَونَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینند.">يَرَونَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يوعَدونَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="آنچه به آنان وعده داده می‌شود.">يوعَدونَ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَلبَثوا" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="درنگ نکرده‌اند؛ در برآوردِ آنان.">يَلبَثوا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="ساعَةً" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="جز پاره‌ای کوتاه از روز.">ساعَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَهارٍ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز و روشناییِ آن.">نَهارٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَلٰغٌ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="ابلاغ و پیامی رسانده‌شده.">بَلٰغٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهَل</button>
    <button class="word-link" type="button" data-word="يُهلَكُ" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="هلاک می‌شوند؛ فعل مجهول دربارهٔ گروهِ نافرمان." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">يُهلَكُ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="القَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک." data-context="گروهِ نافرمان.">القَومُ</button>
    <button class="word-link" type="button" data-word="الفٰسِقونَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="بیرون‌روندگان از حد فرمان.">الفٰسِقونَ</button>
  </p>
  <p class="farsi-verse">پس شکیبا باش، همان‌گونه که صاحبان عزم از فرستادگان شکیبایی کردند، و برای آنان شتاب مخواه. روزی که آنچه را به آنان وعده داده می‌شود ببینند، گویی جز ساعتی از روز نمانده‌اند. ابلاغی است؛ پس آیا جز مردم نافرمان هلاک می‌شوند؟</p>
</section>
