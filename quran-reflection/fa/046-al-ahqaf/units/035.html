  <p class="farsi-verse">پس شکیبا باش، همان‌گونه که صاحبان عزم از فرستادگان شکیبایی کردند، و برای آنان شتاب مخواه. روزی که آنچه را به آنان وعده داده می‌شود ببینند، گویی جز ساعتی از روز نمانده‌اند. ابلاغی است؛ پس آیا جز مردم نافرمان هلاک می‌شوند؟</p>
