<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ طرح اتهامِ ساخته بودن وحی.">يَقولونَ</button>
    <button class="word-link" type="button" data-word="افتَرىٰهُ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="او آن را ساخته و به دروغ نسبت داده است؛ ادعای مخالفان.">افتَرىٰهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمانِ پاسخ دادن به ادعای مخالفان.">قُل</button>
    <button class="word-link" type="button" data-word="إِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنِ</button>
    <button class="word-link" type="button" data-word="افتَرَيتُهُ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="اگر آن را ساخته باشم؛ فرضِ مطرح‌شده در پاسخ به اتهام.">افتَرَيتُهُ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَملِكونَ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="اختیار و توانِ دفع چیزی را برای من ندارید؛ در برابر خداوند.">تَملِكونَ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="هیچ چیزی؛ نفیِ هرگونه توان حمایت در فرض یادشده.">شَيـًٔا</button>
    ۖ
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="داناتر است؛ دربارهٔ آنچه مخالفان به بحث و گفتار در آن می‌پردازند.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تُفيضونَ" data-root="ف ي ض" data-root-meaning="روان شدن و به جریان افتادن؛ گاه همراه با فراوانی و سرریز؛ و در کاربردهای گسترده‌تر، حرکت جمعی یا پیش رفتن در گفتار و فعالیت." data-context="دربارهٔ آن سخن می‌گویید و وارد بحث می‌شوید؛ در سیاق ادعای مخالفان دربارهٔ وحی." data-learn-more="/quran-terminology/fa/roots/f-y-dad/">تُفيضونَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="كَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/" data-root-meaning="کفایت و بسندگی؛ از برآوردن نیاز و بر عهده گرفتن کار دیگری تا کفایت آن معبود یگانه در گواهی، حسابرسی، یاری و حفاظت" data-context="کافی است؛ خداوند برای گواهی میان من و شما بس است.">كَفىٰ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="شَهيدًا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواه؛ وصفِ خداوند میان گوینده و مخاطبان.">شَهيدًا</button>
    <button class="word-link" type="button" data-word="بَينى" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان من؛ در بیان گواهی خداوند میان دو طرف.">بَينى</button>
    <button class="word-link" type="button" data-word="وَبَينَكُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="و میان شما؛ طرف دیگرِ گواهی یادشده.">وَبَينَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الغَفورُ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="آمرزنده؛ وصف خداوند در پایان پاسخ.">الغَفورُ</button>
    <button class="word-link" type="button" data-word="الرَّحيمُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="مهربان و رحمت‌رسان؛ وصف خداوند در پایان آیه.">الرَّحيمُ</button>
  </p>
  <p class="farsi-verse">یا می‌گویند: آن را ساخته است؟ بگو: اگر آن را ساخته باشم، شما در برابر آن معبود یگانه چیزی برای من در اختیار ندارید. او به آنچه در آن فرو می‌روید داناتر است. او برای گواهی میان من و شما کافی است؛ و او آمرزنده و دارای رحمت ویژه است.</p>
</section>
