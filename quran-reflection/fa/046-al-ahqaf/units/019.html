<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِكُلٍّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="و برای هر یک؛ فراگیریِ مراتب بر پایه کردار.">وَلِكُلٍّ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٌ" data-root="د ر ج" data-learn-more="/quran-terminology/fa/roots/d-r-j/" data-root-meaning="حرکت و گذر مرحله‌به‌مرحله؛ پله و مرتبه؛ استدراج: پیش بردن تدریجی." data-context="درجات؛ مراتب متناسب با آنچه انجام داده‌اند.">دَرَجٰتٌ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام داده‌اند؛ کردار مبنای درجات.">عَمِلوا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِيُوَفِّيَهُم" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="و تا کامل به آنان برساند؛ در بیان پرداخت کامل نتیجه اعمال.">وَلِيُوَفِّيَهُم</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="اعمالشان؛ کردار آنان و نتیجه‌ای که کامل داده می‌شود.">أَعمٰلَهُم</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم نمی‌شوند؛ نفی نادیده گرفتن حق آنان.">يُظلَمونَ</button>
  </p>
  <p class="farsi-verse">و برای هرکس به سبب آنچه کرده است درجاتی است، و تا اعمالشان را به‌تمامی به آنان بازدهد و به آنان ستم نمی‌شود.</p>
</section>
