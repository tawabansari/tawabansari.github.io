<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِكُلٍّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">وَلِكُلٍّ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٌ" data-root="د ر ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">دَرَجٰتٌ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">عَمِلوا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِيُوَفِّيَهُم" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/">وَلِيُوَفِّيَهُم</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">أَعمٰلَهُم</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">يُظلَمونَ</button>
  </p>
  <p class="farsi-verse">و برای هرکس به سبب آنچه کرده است درجاتی است، و تا اعمالشان را به‌تمامی به آنان بازدهد و به آنان ستم نمی‌شود.</p>
</section>
