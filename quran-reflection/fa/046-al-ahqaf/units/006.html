<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="حُشِرَ" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="مردم گرد آورده شوند؛ هنگام آشکار شدن دشمنی و انکارِ پرستش." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">حُشِرَ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ کسانی که گرد آورده می‌شوند.">النّاسُ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="می‌شوند؛ در بیانِ دشمنیِ معبودهای ادعایی.">كانوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="أَعداءً" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمنان؛ نسبتِ آنان با پرستندگان.">أَعداءً</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و می‌شوند؛ در بیانِ انکارِ پرستش.">وَكانوا</button>
    <button class="word-link" type="button" data-word="بِعِبادَتِهِم" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="پرستشِ آنان؛ آنچه انکار می‌شود.">بِعِبادَتِهِم</button>
    <button class="word-link" type="button" data-word="كٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="انکارکننده؛ نسبت به پرستشِ یادشده.">كٰفِرينَ</button>
  </p>
  <p class="farsi-verse">و چون مردم گرد آورده شوند، دشمن آنان خواهند بود و پرستش آنان را انکار خواهند کرد.</p>
</section>
