  <p class="farsi-verse">پس چون آن را ابری دیدند که رو به دره‌هایشان می‌آید، گفتند: این ابری است که بر ما باران می‌بارد. بلکه همان است که شتابش را می‌خواستید؛ بادی که در آن عذابی دردناک است،</p>
