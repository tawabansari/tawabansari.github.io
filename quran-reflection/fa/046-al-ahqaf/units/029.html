<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="صَرَفنا" data-root="ص ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-f/" data-root-meaning="برگرداندن و دگرگون کردن؛ تصریف: گرداندن یا گوناگون بیان کردن." data-context="روانه کردیم؛ جهت دادنِ گروهی از جنیان به سوی مخاطب.">صَرَفنا</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="نَفَرًا" data-root="ن ف ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-context="گروهی؛ شمارِ نامعیّن از جنیان." data-root-meaning="از جا برخاستن و روانه شدن؛ نیز روی‌گردانی و رمیدن.؛ و در کاربرد اسمیِ نَفَر، گروهی از افراد.">نَفَرًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِنِّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="جنیان؛ گروهی که شنوندهٔ قرآن شدند.">الجِنِّ</button>
    <button class="word-link" type="button" data-word="يَستَمِعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="گوش می‌دهند؛ شنیدنِ قرائت قرآن.">يَستَمِعونَ</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنِ شنیده‌شده توسط گروهی از جنیان." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="حَضَروهُ" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت" data-context="حاضر شدند؛ رسیدن به قرائتِ قرآن.">حَضَروهُ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ سفارش به سکوت.">قالوا</button>
    <button class="word-link" type="button" data-word="أَنصِتوا" data-root="ن ص ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-t/" data-root-meaning="سکوت برای گوش سپردن." data-context="خاموش باشید؛ فرمانِ گوش دادنِ بی‌اخلال.">أَنصِتوا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="قُضِىَ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="پایان یافت؛ تمام شدنِ قرائت.">قُضِىَ</button>
    <button class="word-link" type="button" data-word="وَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="بازگشتند؛ رفتن به سوی قوم خود.">وَلَّوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِم" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-context="قومشان؛ گروهی که نزد آن بازگشتند." data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک.">قَومِهِم</button>
    <button class="word-link" type="button" data-word="مُنذِرينَ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="هشداردهندگان؛ نقشِ آنان پس از شنیدن.">مُنذِرينَ</button>
  </p>
  <p class="farsi-verse">و آنگاه که گروهی از جن را به سوی تو روانه کردیم که قرآن را می‌شنیدند؛ پس چون نزد آن حاضر شدند، گفتند: خاموش باشید. پس چون پایان یافت، هشداردهنده به سوی قومشان بازگشتند.</p>
</section>
