  <p class="farsi-verse">بگو: آیا آنچه را جز آن معبود یگانه می‌خوانید دیده‌اید؟ به من نشان دهید چه چیزی از زمین آفریده‌اند، یا در آسمان‌ها سهمی دارند؟ کتابی پیش از این یا اثری از دانش برای من بیاورید، اگر راستگویید.</p>
