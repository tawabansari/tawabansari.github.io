  <p class="farsi-verse">و آن که به پدر و مادرش گفت: اُف بر شما! آیا به من وعده می‌دهید که بیرون آورده شوم، درحالی‌که نسل‌ها پیش از من گذشته‌اند؟ و آن دو از آن معبود یگانه یاری می‌خواهند: وای بر تو، ایمان بیاور؛ وعدهٔ آن معبود یگانه حق است. پس می‌گوید: این جز افسانه‌های پیشینیان نیست.</p>
