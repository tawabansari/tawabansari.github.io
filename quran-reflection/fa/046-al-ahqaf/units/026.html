  <p class="farsi-verse">و به‌راستی به آنان در چیزی توان داده بودیم که به شما در آن توان نداده‌ایم؛ و برایشان شنوایی و دیدگان و دل‌ها قرار دادیم. پس نه شنوایی‌شان و نه دیدگانشان و نه دل‌هایشان چیزی به کارشان آمد، چون نشانه‌های آن معبود یگانه را انکار می‌کردند؛ و آنچه مسخره‌اش می‌کردند آنان را فراگرفت.</p>
