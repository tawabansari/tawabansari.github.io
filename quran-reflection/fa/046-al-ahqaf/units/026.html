  <h2 class="ayah-title">الاحقاف ۴۶:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>

    <button class="word-link" type="button" data-word="مَكَّنّٰكُم" data-root="م ك ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-n/" data-root-meaning="استواری و امکان یافتن؛ تمکین: جای و توان استوار بخشیدن." data-context="به شما توان داده‌ایم؛ در جمله نفی شده و با امکانات پیشینیان مقایسه می‌شود.">مَكَّنّٰكُم</button>

    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار دادیم؛ بخشیدن ابزارهای شناخت به آنان.">وَجَعَلنا</button>

    <button class="word-link" type="button" data-word="سَمعًا" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="شنوایی؛ یکی از ابزارهای شناختِ داده‌شده.">سَمعًا</button>

    <button class="word-link" type="button" data-word="أَغنىٰ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="به کار آمد؛ در جمله نفی شده، سود ندادن ابزارهایشان در برابر پیامد انکار.">أَغنىٰ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="سَمعُهُم" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="شنوایی‌شان؛ آنچه نتوانست در آن وضعیت سودشان دهد.">سَمعُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="أَبصٰرُهُم" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="دیدگانشان؛ آنچه نتوانست پیامد انکار را دفع کند.">أَبصٰرُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>

    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیزی؛ با نفی جمله، هیچ سودی از ابزارهایشان در آن وضعیت.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ با فعل بعد، انکارِ نشانه‌ها در گذشته را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="يَجحَدونَ" data-root="ج ح د" data-root-meaning="انکار و نپذیرفتن چیزی که موضوع اقرار و پذیرش است؛ در کاربرد برجسته آن، انکار با وجود شناخت حقیقت." data-context="انکار می‌کردند؛ نشانه‌های آن معبود یگانه را با وجود برخورداری از ابزارهای شناخت رد می‌کردند." data-learn-more="/quran-terminology/fa/roots/j-h-d/">يَجحَدونَ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌ها؛ موضوع انکار آنان.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="ح ي ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-y-q/" data-root-meaning="فراگرفتن و دامنگیر شدن، به‌ویژه درباره پیامد ناخوشایند." data-context="و فراگرفت؛ آنچه مسخره می‌کردند بر آنان واقع شد و احاطه یافت.">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ با فعل بعد، رفتار مسخره کردن در گذشته را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="مسخره می‌کردند؛ تمسخر آنچه سرانجام آنان را فراگرفت.">يَستَهزِءونَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی به آنان در چیزی توان داده بودیم که به شما در آن توان نداده‌ایم؛ و برایشان شنوایی و دیدگان و دل‌ها قرار دادیم. پس نه شنوایی‌شان و نه دیدگانشان و نه دل‌هایشان چیزی به کارشان آمد، چون نشانه‌های آن معبود یگانه را انکار می‌کردند؛ و آنچه مسخره‌اش می‌کردند آنان را فراگرفت.</p>
</section>
