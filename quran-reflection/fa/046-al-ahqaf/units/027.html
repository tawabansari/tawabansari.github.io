<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الاحقاف ۴۶:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَهلَكنا" data-root="ه ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَهلَكنا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="حَولَكُم" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها">حَولَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="وَصَرَّفنَا" data-root="ص ر ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَصَرَّفنَا</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَرجِعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">يَرجِعونَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی آبادی‌های پیرامون شما را هلاک کردیم و نشانه‌ها را گوناگون بیان کردیم، باشد که بازگردند.</p>
</section>
