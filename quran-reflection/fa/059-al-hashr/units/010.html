  <p class="farsi-verse">و کسانی که پس از آنان آمدند می‌گویند: «پروردگارا، ما و برادرانمان را که در ایمان بر ما پیشی گرفتند بیامرز، و در دل‌هایمان نسبت به کسانی که ایمان آورده‌اند کینه‌ای قرار مده. پروردگارا، تو دلسوز و مهربانی.»</p>
