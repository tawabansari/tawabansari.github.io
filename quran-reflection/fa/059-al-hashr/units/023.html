  <p class="farsi-verse">او آن معبود یگانه است که معبودی جز او نیست؛ فرمانروا، پاک، سرچشمهٔ سلامت، ایمنی‌بخش، نگهبان، عزتمند، جبار و بزرگ‌منش است. پاک است آن معبود یگانه از آنچه شریک او می‌سازند.</p>
