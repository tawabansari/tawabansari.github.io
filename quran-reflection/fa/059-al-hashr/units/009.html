    <button class="word-link" type="button" data-word="خَصاصَةٌ" data-root="خ ص ص" data-learn-more="/quran-terminology/fa/roots/kh-sad-sad/" data-root-meaning="خَصَّ؛ جدا و ویژه کردن، و خَصَاصَة؛ کمبودی که باقی مانده است">خَصاصَةٌ</button>

  </p>
  <p class="farsi-verse">و کسانی که پیش از آنان در آن سرا و در ایمان جای گرفتند، کسانی را که به سویشان هجرت کرده‌اند دوست دارند و در سینه‌هایشان نسبت به آنچه به آنان داده شده نیازی نمی‌یابند؛ و آنان را بر خود ترجیح می‌دهند، هرچند خود تنگدست باشند. و هر که از آزمندی نفسش نگاه داشته شود، آنان رستگاران‌اند.</p>
</section>
