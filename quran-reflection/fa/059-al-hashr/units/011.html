  <p class="farsi-verse">آیا منافقان را ندیده‌ای که به برادران کافرشان از اهل کتاب می‌گویند: «اگر بیرون رانده شوید، حتماً با شما بیرون می‌رویم و هرگز دربارهٔ شما از هیچ‌کس اطاعت نمی‌کنیم؛ و اگر با شما جنگ شود، حتماً یاری‌تان می‌کنیم»؟ و آن معبود یگانه گواهی می‌دهد که آنان دروغگویان‌اند.</p>
