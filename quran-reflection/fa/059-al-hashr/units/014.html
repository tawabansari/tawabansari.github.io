<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">الحشر ۵۹:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُقٰتِلونَكُم" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="با شما می‌جنگند؛ رویاروییِ جنگی که به حالت‌های بعد محدود شده است.">يُقٰتِلونَكُم</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="همگی و با هم؛ دربارهٔ شکلِ رویارویی آنان.">جَميعًا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قُرًى" data-root="ق ر ي" data-learn-more="/quran-terminology/fa/roots/q-r-y/" data-root-meaning="آبادی یا محل سکونت و اجتماع یک جامعه انسانی؛ بدون تعیین ثابت درباره کوچک یا بزرگ بودن آن." data-context="آبادی‌ها؛ جایگاه‌های استحکام‌یافته در این رویارویی.">قُرًى</button>
    <button class="word-link" type="button" data-word="مُحَصَّنَةٍ" data-root="ح ص ن" data-root-meaning="ریشهٔ «ح ص ن» در عربی بر حفاظت، پاسداری و مصون قرار دادن چیزی در برابر دسترسی یا تعرض دلالت دارد. «حِصْن» جایگاهی است که از آنچه درون آن است محافظت می‌کند؛ «تحصین» عمل استوار و محفوظ ساختن است؛ و «احصان» می‌تواند در زمینه‌های مادی، رفتاری و اجتماعی به کار رود." data-context="استحکام‌یافته؛ آبادی‌های دارای حفاظت و موانع دفاعی." data-learn-more="/quran-terminology/fa/roots/h-sad-n/">مُحَصَّنَةٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="وَراءِ" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش؛ «وراء» که گاه زیر این ریشه نمایه می‌شود: پشت یا سوی دیگر." data-context="پشت؛ جایگاه آنان نسبت به دیوارها.">وَراءِ</button>
    <button class="word-link" type="button" data-word="جُدُرٍ" data-root="ج د ر" data-root-meaning="دیوار، پایه و حصار آن؛ در جدیر و أجدر، تناسب و شایستگی؛ در شاخه‌ای دیگر، برآمدن و آشکار شدن." data-context="دیوارها؛ موانع جسمانی که در این رویارویی از پشت آنها می‌جنگند." data-learn-more="/quran-terminology/fa/roots/j-d-r/">جُدُرٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَأسُهُم" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="درگیری و نیروی ستیزشان؛ آنچه میان خودشان شدید است.">بَأسُهُم</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان خودشان؛ محدودهٔ ستیزِ یادشده.">بَينَهُم</button>
    <button class="word-link" type="button" data-word="شَديدٌ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="شدید؛ وصفِ درگیری آنان میان خودشان.">شَديدٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="تَحسَبُهُم" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="می‌پنداری؛ گمانِ یکپارچه بودنِ آنان.">تَحسَبُهُم</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="یکپارچه و متحد؛ حالتی که در ظاهر دربارهٔ آنان گمان می‌رود.">جَميعًا</button>
    <button class="word-link" type="button" data-word="وَقُلوبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="و دل‌هایشان؛ جایگاهِ پراکندگی درونی آنان.">وَقُلوبُهُم</button>
    <button class="word-link" type="button" data-word="شَتّىٰ" data-root="ش ت ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-t-t/" data-root-meaning="پراکندگی و گوناگونی." data-context="پراکنده؛ وصفِ دل‌ها در برابر ظاهرِ اتحاد.">شَتّىٰ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="مردمی؛ گروهی که نداشتن تعقل به آنان نسبت داده شده است.">قَومٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی" data-context="خرد می‌ورزند؛ تعقل که در وصفِ این گروه نفی شده است.">يَعقِلونَ</button>
  </p>
  <p class="farsi-verse">همگی با شما نمی‌جنگند مگر در آبادی‌های استوارشده یا از پشت دیوارها. درگیری‌شان میان خودشان سخت است. آنان را متحد می‌پنداری، حال آنکه دل‌هایشان پراکنده است؛ این از آن روست که آنان مردمی هستند که خرد نمی‌ورزند.</p>
</section>
