  <p class="farsi-verse">همگی با شما نمی‌جنگند مگر در آبادی‌های استوارشده یا از پشت دیوارها. درگیری‌شان میان خودشان سخت است. آنان را متحد می‌پنداری، حال آنکه دل‌هایشان پراکنده است؛ این از آن روست که آنان مردمی هستند که خرد نمی‌ورزند.</p>
