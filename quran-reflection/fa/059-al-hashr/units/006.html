  <p class="farsi-verse">و آنچه آن معبود یگانه از آنان به فرستاده‌اش بازگرداند، شما برای آن نه اسبی تاختید و نه شتری؛ ولی آن معبود یگانه فرستادگانش را بر هر که بخواهد مسلط می‌کند، و آن معبود یگانه بر هر چیزی تواناست.</p>
