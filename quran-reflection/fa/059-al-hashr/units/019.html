    <button class="word-link" type="button" data-word="نَسُوا" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/">نَسُوا</button>

  <p class="farsi-verse">و مانند کسانی نباشید که آن معبود یگانه را فراموش کردند، پس او خودشان را از یادشان برد. آنان نافرمانان‌اند.</p>
