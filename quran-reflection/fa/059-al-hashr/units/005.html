<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الحشر ۵۹:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="قَطَعتُم" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="بریدید؛ قطع کردن درختان خرما در رخداد مورد اشاره.">قَطَعتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="لينَةٍ" data-root="ل ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-y-n/" data-root-meaning="نرمی و نرم شدن؛ لینه: نوعی درخت خرما، با شرح‌های متفاوت." data-context="درخت خرما؛ درباره گستره دقیق این نام در میان انواع نخل اختلاف توضیح وجود دارد.">لينَةٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="تَرَكتُموها" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی" data-context="یا آن را باقی گذاشتید؛ رها کردن درخت در حالت ایستاده.">تَرَكتُموها</button>
    <button class="word-link" type="button" data-word="قائِمَةً" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ایستاده و پابرجا؛ حالِ درختی که قطع نشده است.">قائِمَةً</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أُصولِها" data-root="أ ص ل" data-learn-more="/quran-terminology/fa/roots/a-sad-l/" data-root-meaning="اصل و بنیاد چیزی، و پسین‌گاه به‌عنوان بخشی مشخص از روز." data-context="بر ریشه‌های خود؛ پایه‌های واقعی درخت خرما که ایستاده باقی مانده است.">أُصولِها</button>
    <button class="word-link" type="button" data-word="فَبِإِذنِ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="پس به اذن؛ بریدن یا باقی گذاشتن درخت در این رخداد با اجازه آن معبود یگانه بوده است.">فَبِإِذنِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلِيُخزِىَ" data-root="خ ز ي" data-learn-more="/quran-terminology/fa/roots/kh-z-y/" data-root-meaning="خواری، رسوایی و فرو افتادن جایگاه در برابر دیگران" data-context="و تا خوار سازد؛ هدف یادشده درباره نافرمانان.">وَلِيُخزِىَ</button>
    <button class="word-link" type="button" data-word="الفٰسِقينَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="نافرمانان؛ گروهی که در سیاق رخداد به فسق وصف شده‌اند.">الفٰسِقينَ</button>
  </p>
  <p class="farsi-verse">هر درخت خرمایی را که بریدید یا بر ریشه‌هایش ایستاده رها کردید، به اذن آن معبود یگانه بود و برای آنکه نافرمانان را خوار کند.</p>
</section>
