<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُصَدَّعونَ" data-root="ص د ع" data-root-meaning="شکافتن و گسستن پیوستگی؛ در کاربردها، شکافتگی جسم، جدایی گروه‌ها، بیان آشکار و سردرد." data-context="دچار سردرد می‌شوند؛ فعل مجهول باب تفعیل که در این آیه با «لا» نفی شده است." data-learn-more="/quran-terminology/fa/roots/sad-d-ayn/">يُصَدَّعونَ</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُنزِفونَ" data-root="ن ز ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-z-f/" data-root-meaning="تهی کردن؛ نیز از دست رفتن عقل یا توان بر اثر نوشیدنی." data-context="عقل یا توانشان بر اثر نوشیدنی از دست می‌رود؛ در این آیه نفی شده است. توضیح قرائت‌ها جدا بررسی می‌شود.">يُنزِفونَ</button>
  </p>
  <p class="farsi-verse">نه از آن سردرد می‌گیرند و نه عقلشان را از دست می‌دهند،</p>
</section>
