  <h2 class="ayah-title">الواقعة ۵۶:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَفُرُشٍ" data-root="ف ر ش" data-learn-more="/quran-terminology/fa/roots/f-r-sh/" data-root-meaning="گستردن، پهن کردن، آماده ساختن بستر، و مهیا کردن سطحی برای استقرار، نشستن، خوابیدن، زیستن یا حرکت کردن">وَفُرُشٍ</button>
