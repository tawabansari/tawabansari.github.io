<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سِدرٍ" data-root="س د ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-d-r/" data-root-meaning="سدر و درخت سدر." data-context="درختان سدر؛ در این آیه با وصف بی‌خار یا خارزدوده معرفی شده‌اند.">سِدرٍ</button>
    <button class="word-link" type="button" data-word="مَخضودٍ" data-root="خ ض د" data-root-meaning="خم‌کردن یا شکستن شاخه؛ بریدن و برداشتن بخش‌هایی مانند خار." data-context="خارهایش برداشته‌شده؛ وصف درختان سدرِ بی‌خار در این آیه." data-learn-more="/quran-terminology/fa/roots/kh-dad-d/">مَخضودٍ</button>
  </p>
  <p class="farsi-verse">در میان درختان سدر بی‌خار،</p>
</section>
