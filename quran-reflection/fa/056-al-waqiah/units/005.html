<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبُسَّتِ" data-root="ب س س" data-root-meaning="خرد و ریزریز کردن و درهم آمیختن؛ در شاخه‌ای دیگر، راندن و به حرکت درآوردن." data-context="و خرد و ریزریز شوند؛ فعل ماضی مجهول دربارهٔ کوه‌ها، با توجه به تبدیل شدن آنها به غبار در آیهٔ بعد." data-learn-more="/quran-terminology/fa/roots/b-s-s/">وَبُسَّتِ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند." data-context="کوه‌ها؛ نایب فاعل مرفوع که عمل خرد شدن بر آنها واقع می‌شود.">الجِبالُ</button>
    <button class="word-link" type="button" data-word="بَسًّا" data-root="ب س س" data-root-meaning="خرد و ریزریز کردن و درهم آمیختن؛ در شاخه‌ای دیگر، راندن و به حرکت درآوردن." data-context="خرد و ریزریز شدن؛ مصدر منصوب در جایگاه مفعول مطلق، برای تأکید همان عمل، نه نام ماده‌ای جداگانه." data-learn-more="/quran-terminology/fa/roots/b-s-s/">بَسًّا</button>
  </p>
  <p class="farsi-verse">و کوه‌ها کاملاً خرد شوند،</p>
</section>
