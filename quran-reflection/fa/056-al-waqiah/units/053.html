<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَمالِـٔونَ" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه." data-context="پس پُرکنندگان‌اند؛ شکم‌ها را از آن خوراک پُر می‌کنید">فَمالِـٔونَ</button>
    <button class="word-link" type="button" data-word="مِنهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهَا</button>
    <button class="word-link" type="button" data-word="البُطونَ" data-root="ب ط ن" data-root-meaning="درون و سوی داخلی چیزی در برابر بیرون و رویهٔ آن؛ و در کاربردهای گسترده‌تر، جنبهٔ نهفته، کمتر آشکار یا در دسترس نزدیکان و آگاهان از یک امر." data-context="شکم‌ها؛ از خوراک درخت زقوم پر می‌شوند" data-learn-more="/quran-terminology/fa/roots/b-tt-n/">البُطونَ</button>
  </p>
  <p class="farsi-verse">و شکم‌ها را از آن پر خواهید کرد،</p>
</section>
