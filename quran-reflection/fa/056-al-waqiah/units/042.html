<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="سَمومٍ" data-root="س م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-m-m/" data-root-meaning="سوراخ باریک؛ سموم: باد بسیار گرم و آسیب‌رسان." data-context="باد سوزان؛ یکی از دو پدیدهٔ وصف‌شده.">سَمومٍ</button>
    <button class="word-link" type="button" data-word="وَحَميمٍ" data-root="ح م م" data-root-meaning="در شاخهٔ حرارت، آب گرم و بسیار داغ؛ در شاخهٔ نزدیکی، دوست یا خویشاوند صمیمی؛ و در شاخهٔ تیرگی، زغال و دود بسیار سیاه." data-context="آب بسیار داغ؛ در کنار باد سوزان در صحنهٔ عذاب." data-learn-more="/quran-terminology/fa/roots/h-m-m/">وَحَميمٍ</button>
  </p>
  <p class="farsi-verse">در باد سوزان و آب جوشان،</p>
</section>
