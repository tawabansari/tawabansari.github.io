<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="عَلِمتُمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَلِمتُمُ</button>
    <button class="word-link" type="button" data-word="النَّشأَةَ" data-root="ن ش أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-a/" data-root-meaning="پدید آوردن، رشد کردن و پرورش دادن.">النَّشأَةَ</button>
    <button class="word-link" type="button" data-word="الأولىٰ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">الأولىٰ</button>
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَولا</button>
    <button class="word-link" type="button" data-word="تَذَكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">تَذَكَّرونَ</button>
  </p>
  <p class="farsi-verse">و آفرینش نخستین را دانسته‌اید؛ پس چرا به یاد نمی‌آورید؟</p>
</section>
