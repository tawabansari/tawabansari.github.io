  <p class="arabic-text">

    <button class="word-link" type="button" data-word="الحَديثِ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/" data-root-meaning="از پدید آمدن تا سخنی که بازگو می‌شود">الحَديثِ</button>

    <button class="word-link" type="button" data-word="مُدهِنونَ" data-root="د ه ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُدهِنونَ</button>
