<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۷۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">نَشاءُ</button>
    <button class="word-link" type="button" data-word="جَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="أُجاجًا" data-root="أ ج ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أُجاجًا</button>
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَولا</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/">تَشكُرونَ</button>
  </p>
  <p class="farsi-verse">اگر بخواهیم آن را تلخ و شور می‌کنیم؛ پس چرا سپاس نمی‌گزارید؟</p>
</section>
