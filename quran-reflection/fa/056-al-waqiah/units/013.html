<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُلَّةٌ" data-root="ث ل ل" data-root-meaning="جماعت و گردآمدن گروهی از افراد." data-context="جماعتی پرشمار از پیشینیان که در شمار پیشگامان‌اند." data-learn-more="/quran-terminology/fa/roots/th-l-l/">ثُلَّةٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="پیشینیان؛ گروه‌های مقدم که از میان آنان پیشگامان‌اند.">الأَوَّلينَ</button>
  </p>
  <p class="farsi-verse">گروهی بسیار از پیشینیان،</p>
</section>
