<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عُرُبًا" data-root="ع ر ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-b/" data-root-meaning="عربی: وابسته به زبان یا مردم عرب؛ اعراب: بادیه‌نشینان؛ عُرُب: مهرورز و دلبسته.">عُرُبًا</button>
    <button class="word-link" type="button" data-word="أَترابًا" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه">أَترابًا</button>
  </p>
  <p class="farsi-verse">مهرورز و هم‌سال،</p>
