<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَو</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">نَشاءُ</button>
    <button class="word-link" type="button" data-word="لَجَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">لَجَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="حُطٰمًا" data-root="ح ط م" data-root-meaning="حطم عمل شکستن و خرد کردن است؛ حطام نتیجه و باقی‌مانده خردشدگی، به‌ویژه درباره گیاه خشک است؛ و حطمة نام یا وصف چیزی است که با خردکنندگی شدید شناخته می‌شود." data-learn-more="/quran-terminology/fa/roots/h-tt-m/">حُطٰمًا</button>
    <button class="word-link" type="button" data-word="فَظَلتُم" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن.">فَظَلتُم</button>
    <button class="word-link" type="button" data-word="تَفَكَّهونَ" data-root="ف ك ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-h2/" data-root-meaning="میوه؛ فاکه: شادمان و برخوردار؛ تفکّه: خوشی یا شگفتی و گفت‌وگو، بنا بر سیاق.">تَفَكَّهونَ</button>
  </p>
  <p class="farsi-verse">اگر بخواهیم آن را خاشاک می‌کنیم، پس پیوسته شگفت‌زده می‌مانید:</p>
</section>
