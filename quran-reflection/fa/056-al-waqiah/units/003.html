<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خافِضَةٌ" data-root="خ ف ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-f-dad/" data-root-meaning="پایین آوردن و کاستن؛ در رفتار، نرم‌خویی و فروتنی.">خافِضَةٌ</button>
    <button class="word-link" type="button" data-word="رافِعَةٌ" data-root="ر ف ع" data-learn-more="/quran-terminology/fa/roots/r-f-ayn/" data-root-meaning="بالا بردن، بلند کردن و برافراشتن؛ از سطح یا مرتبه‌ای پایین‌تر به جایگاهی بالاتر">رافِعَةٌ</button>
  </p>
  <p class="farsi-verse">فروآورنده و برافرازنده است.</p>
