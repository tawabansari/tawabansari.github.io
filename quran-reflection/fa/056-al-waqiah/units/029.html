<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">الواقعة ۵۶:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَطَلحٍ" data-root="ط ل ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-l-h/" data-root-meaning="طلح: نام درخت؛ در تفسیر با موز یا درخت خاردار توضیح داده شده است.">وَطَلحٍ</button>
    <button class="word-link" type="button" data-word="مَنضودٍ" data-root="ن ض د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-dad-d/" data-root-meaning="منظم روی هم چیدن.">مَنضودٍ</button>
  </p>
  <p class="farsi-verse">و درختان موز با میوه‌های روی‌هم‌چیده،</p>
