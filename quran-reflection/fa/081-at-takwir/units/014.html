<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">التکویر ۸۱:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَلِمَت" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَلِمَت</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسٌ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَحضَرَت" data-root="ح ض ر" data-learn-more="/quran-terminology/fa/roots/h-dad-r/" data-root-meaning="حضور، فرا رسیدن، نزدیک بودن و حاضر ساختن؛ از زندگی روزمره تا رویارویی با اعمال در آخرت">أَحضَرَت</button>
  </p>
  <p class="farsi-verse">هر جان بداند چه حاضر کرده است.</p>
