<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">التکویر ۸۱:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذَا</button>
    <button class="word-link" type="button" data-word="الوُحوشُ" data-root="و ح ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-sh/" data-root-meaning="جانوران وحشی و دور از انس با انسان." data-context="جانوران وحشی؛ گردآوردگانِ آیه.">الوُحوشُ</button>
    <button class="word-link" type="button" data-word="حُشِرَت" data-root="ح ش ر" data-root-meaning="گردآوردن اشخاص یا موجودات از پراکندگی؛ در بسیاری کاربردها همراه با سوق دادن به سوی جایگاه یا موقعیتی مشترک." data-context="گرد آورده شدند؛ دربارهٔ جانوران وحشی در صحنهٔ دگرگونی جهان." data-learn-more="/quran-terminology/fa/roots/h-sh-r/">حُشِرَت</button>
  </p>
  <p class="farsi-verse">و هنگامی که جانوران وحشی گرد آورده شوند،</p>
</section>
