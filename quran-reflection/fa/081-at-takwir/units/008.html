  <h2 class="ayah-title">التکویر ۸۱:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذَا</button>
    <button class="word-link" type="button" data-word="المَوءۥدَةُ" data-root="و أ د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المَوءۥدَةُ</button>
    <button class="word-link" type="button" data-word="سُئِلَت" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">سُئِلَت</button>
  </p>
  <p class="farsi-verse">و هنگامی که از دختر زنده‌به‌گورشده پرسیده شود،</p>
