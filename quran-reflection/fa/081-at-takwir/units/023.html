<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">التکویر ۸۱:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="رَءاهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="او را دیده است؛ فعل دیدن با ضمیر مفعولی «او»، که مرجعش از سیاق شناخته می‌شود.">رَءاهُ</button>
    <button class="word-link" type="button" data-word="بِالأُفُقِ" data-root="أ ف ق" data-learn-more="/quran-terminology/fa/roots/a-f-q/" data-root-meaning="کرانه و ناحیه‌ای که در امتداد یک گستره قرار دارد؛ به‌ویژه دورترین بخش میدان دید در نسبت میان آسمان و زمین، و در صورت جمع، نواحی و کرانه‌های گوناگون جهان." data-context="در افق؛ ناحیه‌ای که دیدن در آن رخ داده و با وصف «آشکار» مشخص شده است.">بِالأُفُقِ</button>
    <button class="word-link" type="button" data-word="المُبينِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار و روشن؛ وصفِ افق در صحنه دیدن، نه نام جهت شرقی یا غربی.">المُبينِ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان او را در افق آشکار دیده است.</p>
</section>
