<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">التکویر ۸۱:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="بِقَولِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">بِقَولِ</button>
    <button class="word-link" type="button" data-word="شَيطٰنٍ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">شَيطٰنٍ</button>
    <button class="word-link" type="button" data-word="رَجيمٍ" data-root="ر ج م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-m/" data-root-meaning="سنگ افکندن؛ رجم: نیز طرد کردن یا ادعای حدسی، بنا بر سیاق.">رَجيمٍ</button>
  </p>
  <p class="farsi-verse">و این سخن شیطانی رانده‌شده نیست.</p>
</section>
