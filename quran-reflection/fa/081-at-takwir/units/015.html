<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">التکویر ۸۱:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="أُقسِمُ" data-root="ق س م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أُقسِمُ</button>
    <button class="word-link" type="button" data-word="بِالخُنَّسِ" data-root="خ ن س" data-root-meaning="خنوس، عقب نشستن، جمع شدن یا کنار رفتن از جایگاه آشکار است که می‌تواند با پنهان شدن از دید همراه باشد. « خُنَّس » به واپس‌روندگان یا پنهان‌شوندگان اشاره می‌کند و « خَنَّاس » وصف کسی یا چیزی است که عقب‌نشینی و پنهان شدن در رفتار او برجسته است." data-learn-more="/quran-terminology/fa/roots/kh-n-s/">بِالخُنَّسِ</button>
  </p>
  <p class="farsi-verse">پس سوگند می‌خورم به واپس‌روندگان،</p>
</section>
