<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">التکویر ۸۱:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="سوگند به شب؛ در این آیه، شب در هنگامِ واپس‌رفتن و رو به پایان نهادن آن مطرح است.">وَالَّيلِ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="عَسعَسَ" data-root="ع س ع س" data-root-meaning="روی‌آوردن تاریکی شب یا واپس‌رفتن آن؛ دو کاربرد ثبت‌شده برای دگرگونی وضعیت شب در آغاز و پایان حضور تاریکی." data-context="واپس رفت و رو به پایان نهاد؛ با توجه به دمیدن صبح در آیهٔ بعد." data-learn-more="/quran-terminology/fa/roots/ayn-s-ayn-s/">عَسعَسَ</button>
  </p>
  <p class="farsi-verse">و به شب، هنگامی که پشت کند،</p>
</section>
