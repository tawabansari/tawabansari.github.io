<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن دو پهنهٔ آب که در آیهٔ پیش از به‌هم‌رسیدنشان سخن رفته است.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="بَرزَخٌ" data-root="ب ر ز خ" data-root-meaning="حد، فاصله یا حایلی میان دو چیز یا دو وضعیت؛ نوع مانع و امکان گذر از آن از سیاق معلوم می‌شود." data-context="حایلی میان دو پهنهٔ آب که به یکدیگر می‌رسند و از حد بیان‌شده نمی‌گذرند." data-learn-more="/quran-terminology/fa/roots/b-r-z-kh/" data-root-note="حروفِ نمایه‌سازیِ واژه؛ اشتقاق تاریخی و احتمال وام‌واژه بودن آن محل اختلاف است.">بَرزَخٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَبغِيانِ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="با «لا»: آن دو از حد بیان‌شده تجاوز نمی‌کنند؛ فعل برای دو پهنهٔ آب آمده است.">يَبغِيانِ</button>
  </p>
  <p class="farsi-verse">میانشان مانعی است که از آن تجاوز نمی‌کنند.</p>
</section>
