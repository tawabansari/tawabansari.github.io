  <h2 class="ayah-title">الرحمن ۵۵:۷۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِنَّ</button>
    <button class="word-link" type="button" data-word="خَيرٰتٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٰتٌ</button>
    <button class="word-link" type="button" data-word="حِسانٌ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">حِسانٌ</button>
  </p>
  <p class="farsi-verse">در آنها زنانی نیک و زیبا هستند،</p>
