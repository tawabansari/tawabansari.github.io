<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَرَجَ" data-root="م ر ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَرَجَ</button>
    <button class="word-link" type="button" data-word="البَحرَينِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان">البَحرَينِ</button>
    <button class="word-link" type="button" data-word="يَلتَقِيانِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">يَلتَقِيانِ</button>
  </p>
  <p class="farsi-verse">دو دریا را رها کرد که به هم می‌رسند؛</p>
</section>
