<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون می‌آید؛ بیرون آمدن مروارید و مرجان از آن دو دریا.">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="مِنهُمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُمَا</button>
    <button class="word-link" type="button" data-word="اللُّؤلُؤُ" data-root="ل أ ل أ" data-root-meaning="مروارید؛ گوهری شناخته‌شده به زیبایی و جلای خود که در قرآن هم به‌عنوان زینت و نعمتی طبیعی و هم در تشبیه‌های مربوط به زیبایی به کار رفته است." data-context="مروارید؛ گوهرِ یادشده که از آن دو دریا بیرون می‌آید." data-learn-more="/quran-terminology/fa/roots/l-a-l-a/">اللُّؤلُؤُ</button>
    <button class="word-link" type="button" data-word="وَالمَرجانُ" data-root="م ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-j/" data-root-meaning="آمیختگی و روانه ساختن؛ مارج: شعله آمیخته؛ مرجان: ماده یا گوهر دریایی، با شرح‌های متفاوت." data-context="و مرجان؛ مادهٔ زینتی دریایی که در کنار مروارید یاد شده است.">وَالمَرجانُ</button>
  </p>
  <p class="farsi-verse">از آن دو مروارید و مرجان بیرون می‌آید.</p>
</section>
