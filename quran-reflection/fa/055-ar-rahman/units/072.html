<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حورٌ" data-root="ح و ر" data-root-meaning="بازگشت و رفت‌وبرگشت گفتار؛ گردش و ویژگی‌های رنگ و چشم؛ حواریون، یاران ویژه عیسی." data-context="حور؛ توصیف‌شدگانی با ویژگی رنگ چشم که در این آیه وصف مؤنث دارند." data-learn-more="/quran-terminology/fa/roots/h-w-r/">حورٌ</button>
    <button class="word-link" type="button" data-word="مَقصورٰتٌ" data-root="ق ص ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-r/" data-root-meaning="کوتاه کردن و محدود ساختن؛ قصر: بنای بزرگ یا کاخ." data-context="نگاه‌داشته‌شدگان؛ وصف جمع مؤنث در بیان جایگاه و اختصاص آنان.">مَقصورٰتٌ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الخِيامِ" data-root="خ ي م" data-learn-more="/quran-terminology/fa/roots/kh-y-m/" data-root-meaning="اقامت و ماندن در یک مکان؛ و در کاربرد اصلیِ اسم، خیمه به‌عنوان سرپناه یا اقامتگاهِ برپاشده." data-context="خیمه‌ها؛ جایگاهی که در این توصیف آمده است.">الخِيامِ</button>
  </p>
  <p class="farsi-verse">حوریانی در خیمه‌ها نگاه داشته‌شده.</p>
</section>
