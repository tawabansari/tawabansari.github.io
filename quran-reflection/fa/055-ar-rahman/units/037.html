<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="انشَقَّتِ" data-root="ش ق ق" data-learn-more="/quran-terminology/fa/roots/sh-q-q/" data-root-meaning="شکافتن، رخنه، جانب، مشقت، فاصله و گسست جبهه‌ساز">انشَقَّتِ</button>
    <button class="word-link" type="button" data-word="السَّماءُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءُ</button>
    <button class="word-link" type="button" data-word="فَكانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَكانَت</button>
    <button class="word-link" type="button" data-word="وَردَةً" data-root="و ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-d/" data-root-meaning="رسیدن به آب یا مقصد؛ وِرد: ورود یا بهره مقرر.">وَردَةً</button>
    <button class="word-link" type="button" data-word="كَالدِّهانِ" data-root="د ه ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-h2-n/" data-root-meaning="روغن و روغن‌مالی؛ ادهان: نرمش سازشکارانه یا سهل‌انگاری، بنا بر سیاق.">كَالدِّهانِ</button>
  </p>
  <p class="farsi-verse">پس هنگامی که آسمان شکافته شود و سرخ‌گلگون، همچون روغن گردد،</p>
