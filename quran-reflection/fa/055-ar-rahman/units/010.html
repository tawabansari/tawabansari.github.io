<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ پهنه‌ای که در این آیه برای آفریدگان قرار داده شده و در آیات بعد از میوه‌ها و گیاهان آن یاد می‌شود.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَضَعَها" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="آن را قرار داد؛ فراهم ساختن زمین برای آفریدگان، بدون آنکه خود فعل شکل هندسی زمین یا مالکیت خصوصی آن را تعیین کند.">وَضَعَها</button>
    <button class="word-link" type="button" data-word="لِلأَنامِ" data-root="أ ن م" data-learn-more="/quran-terminology/fa/roots/a-n-m/" data-root-meaning="أَنَام نام جمعی آفریدگان است؛ به‌ویژه موجوداتی که در زمین زندگی می‌کنند یا با آن ارتباط دارند." data-context="برای آفریدگان؛ موجوداتی که زمین برای آنان قرار داده شده است. انسان و جن در سیاق برجسته‌اند، اما خوانش گسترده‌تر، دیگر جانداران زمینی را نیز دربر می‌گیرد.">لِلأَنامِ</button>
  </p>
  <p class="farsi-verse">و زمین را برای آفریدگان نهاد.</p>
</section>
