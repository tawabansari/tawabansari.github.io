<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَضَعَها" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت.">وَضَعَها</button>
    <button class="word-link" type="button" data-word="لِلأَنامِ" data-root="أ ن م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-n-m/" data-root-meaning="أنام: آفریدگان و موجودات، به‌ویژه مردم و ساکنان زمین؛ این نام جمع، ریشهٔ تاریخی قطعی را تعیین نمی‌کند.">لِلأَنامِ</button>
  </p>
  <p class="farsi-verse">و زمین را برای آفریدگان نهاد.</p>
</section>
