<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَبقىٰ" data-root="ب ق ي" data-root-meaning="«ب ق ي» به ادامه داشتن و از میان نرفتن چیزی در برابر پایان یافتن، زوال یا از دست رفتن آن اشاره دارد. در ساختمان‌های سببی، به باقی گذاشتن و حفظ کردن می‌رسد؛ در صورت‌های وصفی، ماندگاری و بازماندن را بیان می‌کند؛ و در اسم «بقية»، به آنچه از یک مجموعه، رابطه یا مایه ارزشمند همچنان بر جا مانده است اشاره دارد." data-context="باقی می‌ماند؛ بقای وجه پروردگار در برابر فناپذیری آفریدگان." data-learn-more="/quran-terminology/fa/roots/b-q-y/">وَيَبقىٰ</button>
    <button class="word-link" type="button" data-word="وَجهُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="وجه؛ در این وصف الهی، بیان نسبت به پروردگار، نه اثباتِ عضو جسمانی.">وَجهُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ صاحبِ بقایی که در برابر فنا آمده است.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ذُو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذُو</button>
    <button class="word-link" type="button" data-word="الجَلٰلِ" data-root="ج ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-l-l/" data-root-meaning="بزرگی و عظمت قدر؛ جلال: شکوه و بزرگی." data-context="جلال؛ عظمت و بزرگیِ پروردگار.">الجَلٰلِ</button>
    <button class="word-link" type="button" data-word="وَالإِكرامِ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی." data-context="و گرامیداشت؛ کرامت و اکرام در وصف پروردگار.">وَالإِكرامِ</button>
  </p>
  <p class="farsi-verse">و روی پروردگارت، دارندهٔ شکوه و بزرگواری، باقی می‌ماند.</p>
</section>
