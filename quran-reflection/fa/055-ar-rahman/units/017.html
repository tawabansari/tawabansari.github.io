<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبُّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّ</button>
    <button class="word-link" type="button" data-word="المَشرِقَينِ" data-root="ش ر ق" data-learn-more="/quran-terminology/fa/roots/sh-r-q/" data-root-meaning="از برآمدن خورشید و روشن شدن افق تا مشرق و مشارق">المَشرِقَينِ</button>
    <button class="word-link" type="button" data-word="وَرَبُّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">وَرَبُّ</button>
    <button class="word-link" type="button" data-word="المَغرِبَينِ" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/" data-root-meaning="از غروب خورشید و دور شدن از دید تا مغرب، غربت و شاخه‌های دیگر">المَغرِبَينِ</button>
  </p>
  <p class="farsi-verse">پروردگار دو مشرق و پروردگار دو مغرب.</p>
