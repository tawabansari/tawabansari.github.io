<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَهُ</button>
    <button class="word-link" type="button" data-word="الجَوارِ" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر">الجَوارِ</button>
    <button class="word-link" type="button" data-word="المُنشَـٔاتُ" data-root="ن ش أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المُنشَـٔاتُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان">البَحرِ</button>
    <button class="word-link" type="button" data-word="كَالأَعلٰمِ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">كَالأَعلٰمِ</button>
  </p>
  <p class="farsi-verse">و از آنِ اوست کشتی‌های برافراشته در دریا، همچون کوه‌ها.</p>
</section>
