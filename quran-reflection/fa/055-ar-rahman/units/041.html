<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُعرَفُ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">يُعرَفُ</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="ج ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-r-m/" data-root-meaning="بریدن و به دست آوردن؛ إجرام: مرتکب شدن جرم یا گناه؛ «لا جرم» ساختی برای تأکید و قطعیت است.">المُجرِمونَ</button>
    <button class="word-link" type="button" data-word="بِسيمٰهُم" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/" data-root-meaning="روانه‌کردن، در معرض چیزی قراردادن، تحمیل پیوسته، و نشانه‌گذاری برای تمایز">بِسيمٰهُم</button>
    <button class="word-link" type="button" data-word="فَيُؤخَذُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَيُؤخَذُ</button>
    <button class="word-link" type="button" data-word="بِالنَّوٰصى" data-root="ن ص و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-y/" data-root-meaning="موی پیشانی و بخش پیشین سر؛ گرفتن ناصیه: مهار و اختیار.">بِالنَّوٰصى</button>
    <button class="word-link" type="button" data-word="وَالأَقدامِ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن">وَالأَقدامِ</button>
  </p>
  <p class="farsi-verse">مجرمان از نشانشان شناخته می‌شوند و از پیشانی‌ها و پاها گرفته می‌شوند.</p>
</section>
