<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَطوفونَ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل" data-context="رفت‌وآمد می‌کنند؛ میان دوزخِ مورد اشاره و آب بسیار داغ می‌گردند.">يَطوفونَ</button>
    <button class="word-link" type="button" data-word="بَينَها" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن؛ یک سوی رفت‌وآمد، دوزخ مورد اشاره در سیاق.">بَينَها</button>
    <button class="word-link" type="button" data-word="وَبَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="و میان؛ سوی دیگر رفت‌وآمد را به آب بسیار داغ پیوند می‌دهد.">وَبَينَ</button>
    <button class="word-link" type="button" data-word="حَميمٍ" data-root="ح م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-m/" data-root-meaning="گرمای شدید؛ حمیم: آب بسیار داغ یا دوست نزدیک، بر حسب سیاق؛ یحموم: دود سیاه." data-context="آب بسیار داغ؛ موصوف «آنٍ»، نه دوست نزدیک.">حَميمٍ</button>
    <button class="word-link" type="button" data-word="ءانٍ" data-root="أ ن ي" data-learn-more="/quran-terminology/fa/roots/a-n-y/" data-root-meaning="فرا رسیدن هنگام، بخش‌های زمان، درنگ و تأخیر، و رسیدن چیزی به مرحله آمادگی یا نهایت." data-context="به نهایت گرما رسیده؛ وصف آب بسیار داغ، نه معنای دیرهنگام یا منتظر.">ءانٍ</button>
  </p>
  <p class="farsi-verse">میان آن و آبی به نهایت جوشان می‌گردند.</p>
</section>
