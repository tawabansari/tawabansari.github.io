<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَبِأَىِّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَبِأَىِّ</button>
    <button class="word-link" type="button" data-word="ءالاءِ" data-root="أ ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ءالاءِ</button>
    <button class="word-link" type="button" data-word="رَبِّكُما" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكُما</button>
    <button class="word-link" type="button" data-word="تُكَذِّبانِ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">تُكَذِّبانِ</button>
  </p>
  <p class="farsi-verse">پس کدام‌یک از نعمت‌های پروردگارتان را شما دو تن تکذیب می‌کنید؟</p>
</section>
