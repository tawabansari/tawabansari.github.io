<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالحَبُّ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">وَالحَبُّ</button>
    <button class="word-link" type="button" data-word="ذُو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذُو</button>
    <button class="word-link" type="button" data-word="العَصفِ" data-root="ع ص ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sad-f/" data-root-meaning="وزش شدید باد؛ عصف: برگ و بقایای خشک کشت.">العَصفِ</button>
    <button class="word-link" type="button" data-word="وَالرَّيحانُ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">وَالرَّيحانُ</button>
  </p>
  <p class="farsi-verse">و دانهٔ دارای کاه و گیاه خوشبو.</p>
</section>
