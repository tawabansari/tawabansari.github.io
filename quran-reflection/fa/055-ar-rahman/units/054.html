<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="و ك أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="فُرُشٍ" data-root="ف ر ش" data-learn-more="/quran-terminology/fa/roots/f-r-sh/" data-root-meaning="گستردن، پهن کردن، آماده ساختن بستر، و مهیا کردن سطحی برای استقرار، نشستن، خوابیدن، زیستن یا حرکت کردن">فُرُشٍ</button>
    <button class="word-link" type="button" data-word="بَطائِنُها" data-root="ب ط ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَطائِنُها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="إِستَبرَقٍ" data-context="استبرق: دیبای ضخیم." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">إِستَبرَقٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَجَنَى" data-root="ج ن ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَجَنَى</button>
    <button class="word-link" type="button" data-word="الجَنَّتَينِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/">الجَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="دانٍ" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/">دانٍ</button>
  </p>
  <p class="farsi-verse">بر بسترهایی تکیه زده‌اند که آسترهایشان از دیبای ضخیم است؛ و میوهٔ چیدنیِ آن دو باغ نزدیک است.</p>
