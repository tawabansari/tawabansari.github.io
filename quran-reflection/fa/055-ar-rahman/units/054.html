<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="و ك أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-a/" data-root-meaning="تکیه کردن و قرار گرفتن بر تکیه‌گاه." data-context="تکیه‌زنان؛ حالتِ کسانی که بر بسترها آرمیده‌اند">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="فُرُشٍ" data-root="ف ر ش" data-learn-more="/quran-terminology/fa/roots/f-r-sh/" data-root-meaning="گستردن، پهن کردن، آماده ساختن بستر، و مهیا کردن سطحی برای استقرار، نشستن، خوابیدن، زیستن یا حرکت کردن" data-context="بسترها؛ تکیه‌گاه‌هایی با آستر استبرق">فُرُشٍ</button>
    <button class="word-link" type="button" data-word="بَطائِنُها" data-root="ب ط ن" data-root-meaning="درون و سوی داخلی چیزی در برابر بیرون و رویهٔ آن؛ و در کاربردهای گسترده‌تر، جنبهٔ نهفته، کمتر آشکار یا در دسترس نزدیکان و آگاهان از یک امر." data-context="آسترهای آن بسترها؛ از استبرق توصیف شده‌اند" data-learn-more="/quran-terminology/fa/roots/b-tt-n/">بَطائِنُها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="إِستَبرَقٍ" data-context="استبرق: دیبای ضخیم." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">إِستَبرَقٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَجَنَى" data-root="ج ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-y/" data-root-meaning="چیدن و به دست آوردن میوه؛ جنى: میوهٔ چیدنی؛ جنیّ: تازه و آمادهٔ چیدن." data-context="و میوهٔ چیدنی؛ محصولِ در دسترسِ دو باغ">وَجَنَى</button>
    <button class="word-link" type="button" data-word="الجَنَّتَينِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="دو باغ؛ جایگاهِ میوهٔ نزدیک">الجَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="دانٍ" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="نزدیک و دسترس‌پذیر؛ وصفِ میوهٔ دو باغ">دانٍ</button>
  </p>
  <p class="farsi-verse">بر بسترهایی تکیه زده‌اند که آسترهایشان از دیبای ضخیم است؛ و میوهٔ چیدنیِ آن دو باغ نزدیک است.</p>
</section>
