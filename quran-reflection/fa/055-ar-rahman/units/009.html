<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَقيمُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَأَقيمُوا</button>
    <button class="word-link" type="button" data-word="الوَزنَ" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار">الوَزنَ</button>
    <button class="word-link" type="button" data-word="بِالقِسطِ" data-root="ق س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-tt/" data-root-meaning="قسط و اقساط: عدالت و رعایت سهم؛ قُسوط: انحراف و ستم؛ صورت واژه تعیین‌کننده است.">بِالقِسطِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُخسِرُوا" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">تُخسِرُوا</button>
    <button class="word-link" type="button" data-word="الميزانَ" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار">الميزانَ</button>
  </p>
  <p class="farsi-verse">و وزن را به داد برپا دارید و از میزان نکاهید.</p>
</section>
