<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَبٰرَكَ" data-root="ب ر ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-r-k/" data-root-meaning="ثبات و ماندگاری؛ برکت: خیر پایدار و فزاینده؛ مبارک: برخوردار از این خیر.">تَبٰرَكَ</button>
    <button class="word-link" type="button" data-word="اسمُ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">اسمُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ذِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذِى</button>
    <button class="word-link" type="button" data-word="الجَلٰلِ" data-root="ج ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-l-l/" data-root-meaning="بزرگی و عظمت قدر؛ جلال: شکوه و بزرگی.">الجَلٰلِ</button>
    <button class="word-link" type="button" data-word="وَالإِكرامِ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی.">وَالإِكرامِ</button>
  </p>
  <p class="farsi-verse">پربرکت است نام پروردگارت، دارندهٔ شکوه و بزرگواری.</p>
</section>
