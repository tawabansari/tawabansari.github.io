<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۵۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَأَنَّهُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّهُنَّ</button>
    <button class="word-link" type="button" data-word="الياقوتُ" data-context="یاقوت: سنگ گران‌بها." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">الياقوتُ</button>
    <button class="word-link" type="button" data-word="وَالمَرجانُ" data-root="م ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-j/" data-root-meaning="آمیختگی و روانه ساختن؛ مارج: شعله آمیخته؛ مرجان: ماده یا گوهر دریایی، با شرح‌های متفاوت.">وَالمَرجانُ</button>
  </p>
  <p class="farsi-verse">گویی آنان یاقوت و مرجان‌اند.</p>
</section>
