<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الرحمن ۵۵:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالسَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">وَالسَّماءَ</button>
    <button class="word-link" type="button" data-word="رَفَعَها" data-root="ر ف ع" data-learn-more="/quran-terminology/fa/roots/r-f-ayn/" data-root-meaning="بالا بردن، بلند کردن و برافراشتن؛ از سطح یا مرتبه‌ای پایین‌تر به جایگاهی بالاتر">رَفَعَها</button>
    <button class="word-link" type="button" data-word="وَوَضَعَ" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت.">وَوَضَعَ</button>
    <button class="word-link" type="button" data-word="الميزانَ" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار">الميزانَ</button>
  </p>
  <p class="farsi-verse">و آسمان را برافراشت و میزان را نهاد،</p>
</section>
