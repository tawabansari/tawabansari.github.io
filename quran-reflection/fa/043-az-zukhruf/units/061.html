<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَعِلمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">لَعِلمٌ</button>
    <button class="word-link" type="button" data-word="لِلسّاعَةِ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است.">لِلسّاعَةِ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَمتَرُنَّ" data-root="م ر ي" data-learn-more="/quran-terminology/fa/roots/m-r-y/" data-root-meaning="تردید، دودلی و مجادله؛ از بیرون کشیدن شیر تا کشمکش بر سر حقیقت و مرز میان پرسش و مراء در قرآن">تَمتَرُنَّ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="وَاتَّبِعونِ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">وَاتَّبِعونِ</button>
    ۚ
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="صِرٰطٌ" data-root="ص ر ط" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد" data-learn-more="/quran-terminology/fa/roots/s-r-t/">صِرٰطٌ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُستَقيمٌ</button>
  </p>
  <p class="farsi-verse">و او بی‌گمان دانشی دربارهٔ ساعت است؛ پس در آن تردید نکنید و از من پیروی کنید. این راهی راست است.</p>
</section>
