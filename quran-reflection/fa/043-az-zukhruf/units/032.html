  <p class="farsi-verse">آیا آنان رحمت پروردگارت را تقسیم می‌کنند؟ ما معاش آنان را در زندگی دنیا میانشان تقسیم کرده‌ایم و برخی را بر برخی دیگر درجاتی بالا برده‌ایم تا برخی، برخی دیگر را به خدمت گیرند. و رحمت پروردگارت از آنچه گرد می‌آورند بهتر است.</p>
