<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۷۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنادَوا" data-root="ن د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَنادَوا</button>
    <button class="word-link" type="button" data-word="يٰمٰلِكُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰمٰلِكُ</button>
    <button class="word-link" type="button" data-word="لِيَقضِ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/">لِيَقضِ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالَ</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="مٰكِثونَ" data-root="م ك ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مٰكِثونَ</button>
  </p>
  <p class="farsi-verse">و ندا دهند: ای مالک، پروردگارت کار ما را یکسره کند. گوید: شما ماندگارید.</p>
