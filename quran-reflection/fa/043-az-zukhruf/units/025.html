  <h2 class="ayah-title">الزخرف ۴۳:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانتَقَمنا" data-root="ن ق م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَانتَقَمنا</button>

    <button class="word-link" type="button" data-word="فَانظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/">فَانظُر</button>

  <p class="farsi-verse">پس از آنان انتقام گرفتیم؛ بنگر سرانجام تکذیب‌کنندگان چگونه بود.</p>
