<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۸۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="سَأَلتَهُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">سَأَلتَهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="خَلَقَهُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقَهُم</button>
    <button class="word-link" type="button" data-word="لَيَقولُنَّ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">لَيَقولُنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="أ ف ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُؤفَكونَ</button>
  </p>
  <p class="farsi-verse">و اگر از آنان بپرسی چه کسی آنان را آفریده است، بی‌گمان می‌گویند: آن معبود یگانه. پس چگونه برگردانده می‌شوند؟</p>
</section>
