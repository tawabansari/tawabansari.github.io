<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الأَخِلّاءُ" data-root="خ ل ل" data-root-meaning="فاصله و فضای میان چیزها؛ نفوذ و گذشتن از میان آنها؛ و در کاربرد انسانی، دوستی و پیوند نزدیک." data-context="دوستان نزدیک؛ کسانی که رابطه‌شان در آن روز با استثنای پرهیزگاران توصیف شده است." data-learn-more="/quran-terminology/fa/roots/kh-l-l/">الأَخِلّاءُ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="در آن روز؛ ترکیب یوم و إذ، زمان دگرگونی رابطهٔ دوستان.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="بَعضُهُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی از آنان؛ یک سوی رابطهٔ دوطرفهٔ یادشده.">بَعضُهُم</button>
    <button class="word-link" type="button" data-word="لِبَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برای برخی دیگر؛ سوی دیگر رابطه.">لِبَعضٍ</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن؛ وصف رابطهٔ دوستان در آن روز.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="پرهیزگاران؛ استثنا از دشمنیِ یادشده.">المُتَّقينَ</button>
  </p>
  <p class="farsi-verse">دوستان در آن روز دشمن یکدیگرند، جز پرهیزگاران.</p>
</section>
