<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="بُشِّرَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="مژده داده شود؛ خبر تولدی که از آن ناخشنود می‌شود به او برسد.">بُشِّرَ</button>
    <button class="word-link" type="button" data-word="أَحَدُهُم" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="یکی از آنان؛ یکی از کسانی که آیه نقدشان می‌کند.">أَحَدُهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="ضَرَبَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="قرار داده است؛ چیزی را به فرارحمن نسبت داده است.">ضَرَبَ</button>
    <button class="word-link" type="button" data-word="لِلرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="برای فرارحمن؛ کسی که آن نسبت را درباره او ساخته‌اند.">لِلرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مثالی؛ همانندی و نسبتی که برای فرارحمن قرار داده است.">مَثَلًا</button>
    <button class="word-link" type="button" data-word="ظَلَّ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="در آن حالت می‌ماند؛ چهره‌اش تیره می‌شود.">ظَلَّ</button>
    <button class="word-link" type="button" data-word="وَجهُهُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره او؛ محل آشکار شدن واکنش ناخشنود او.">وَجهُهُ</button>
    <button class="word-link" type="button" data-word="مُسوَدًّا" data-root="س و د" data-learn-more="/quran-terminology/fa/roots/s-w-d/" data-root-meaning="سیاهی و سیاه یا تیره شدن؛ در شاخه‌ای دیگر، سیادت، سروری و جایگاه برجسته اجتماعی." data-context="تیره‌شده؛ حالت چهره در واکنش ناخشنود به مژده.">مُسوَدًّا</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="كَظيمٌ" data-root="ك ظ م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-zha-m/" data-root-meaning="فرو خوردن و در درون نگه داشتن، به‌ویژه خشم یا اندوه." data-context="فروخورنده خشم و اندوه؛ احساس شدید خود را در درون نگه می‌دارد.">كَظيمٌ</button>
  </p>
  <p class="farsi-verse">و چون یکی از آنان به آنچه برای رحمان مَثَل زده است مژده داده شود، چهره‌اش سیاه می‌شود و خشم خود را فرو می‌خورد.</p>
</section>
