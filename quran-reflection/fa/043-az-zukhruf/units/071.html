  <p class="farsi-verse">سینی‌هایی از طلا و جام‌هایی گرد آنان گردانده می‌شود؛ و در آن هرچه جان‌ها بخواهند و چشم‌ها از آن لذت برند هست؛ و شما در آن ماندگارید.</p>
