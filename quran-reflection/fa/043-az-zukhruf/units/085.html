<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۸۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَبارَكَ" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="بزرگ و پربرکت است صاحب فرمانرواییِ آسمان‌ها و زمین؛ تعبیرِ ستایش." data-learn-more="/quran-terminology/fa/roots/b-r-k/">وَتَبارَكَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="مُلكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="فرمانرواییِ آسمان‌ها و زمین.">مُلكُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان‌ها؛ قلمروِ فرمانروایی.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین، در کنارِ آسمان‌ها.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میانِ آن دو؛ آنچه میانِ آسمان‌ها و زمین است.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="وَعِندَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعِندَهُ</button>
    <button class="word-link" type="button" data-word="عِلمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانشِ ساعت؛ آگاهی از هنگامِ بیان‌شده.">عِلمُ</button>
    <button class="word-link" type="button" data-word="السّاعَةِ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="ساعت؛ هنگامِ رستاخیز.">السّاعَةِ</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="بازگردانده می‌شوید؛ فعل مجهولِ بازگشت به سوی او.">تُرجَعونَ</button>
  </p>
  <p class="farsi-verse">و پربرکت است آن که فرمانروایی آسمان‌ها و زمین و آنچه میان آنهاست از آنِ اوست، و دانش ساعت نزد اوست و به سوی او بازگردانده می‌شوید.</p>
</section>
