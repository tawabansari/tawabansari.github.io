<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَجَعَلنٰهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="پس آنان را قرار دادیم.">فَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="سَلَفًا" data-root="س ل ف" data-learn-more="/quran-terminology/fa/roots/s-l-f/" data-root-meaning="پیشی داشتن و پیش‌تر واقع شدن؛ گذشته بودن، پیشینیان و انجام دادن یا فراهم ساختن چیزی پیشاپیش." data-context="پیشینیان؛ قوم فرعون که پیش از آیندگان به آن فرجام رسیدند.">سَلَفًا</button>
    <button class="word-link" type="button" data-word="وَمَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="و نمونه‌ای؛ در این سیاق مایهٔ عبرت.">وَمَثَلًا</button>
    <button class="word-link" type="button" data-word="لِلـٔاخِرينَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="برای آیندگان و کسانی که پس از آنان می‌آیند.">لِلـٔاخِرينَ</button>
  </p>
  <p class="farsi-verse">پس آنان را پیشینیان و نمونه‌ای برای پسینیان قرار دادیم.</p>
</section>
