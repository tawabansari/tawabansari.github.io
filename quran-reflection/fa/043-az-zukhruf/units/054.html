  <h2 class="ayah-title">الزخرف ۴۳:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاستَخَفَّ" data-root="خ ف ف" data-learn-more="/quran-terminology/fa/roots/kh-f-f/">فَاستَخَفَّ</button>
    <button class="word-link" type="button" data-word="قَومَهُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">قَومَهُ</button>
    <button class="word-link" type="button" data-word="فَأَطاعوهُ" data-root="ط و ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَطاعوهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانوا</button>

    <button class="word-link" type="button" data-word="فٰسِقينَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/">فٰسِقينَ</button>
  </p>
  <p class="farsi-verse">پس قومش را سبک شمرد و آنان از او فرمان بردند؛ بی‌گمان آنان قومی نافرمان بودند.</p>
