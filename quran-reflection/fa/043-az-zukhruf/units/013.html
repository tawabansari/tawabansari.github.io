<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِتَستَوۥا" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">لِتَستَوۥا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ظُهورِهِ" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی">ظُهورِهِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="تَذكُروا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">تَذكُروا</button>
    <button class="word-link" type="button" data-word="نِعمَةَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">نِعمَةَ</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="إِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذَا</button>
    <button class="word-link" type="button" data-word="استَوَيتُم" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">استَوَيتُم</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَتَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَتَقولوا</button>
    <button class="word-link" type="button" data-word="سُبحٰنَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">سُبحٰنَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="سَخَّرَ" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/">سَخَّرَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنّا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="مُقرِنينَ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره.">مُقرِنينَ</button>
  </p>
  <p class="farsi-verse">تا بر پشت آن قرار گیرید، سپس چون بر آن قرار گرفتید نعمت پروردگارتان را یاد کنید و بگویید: پاک است آن که این را رام ما کرد، و ما توان مهار آن را نداشتیم.</p>
</section>
