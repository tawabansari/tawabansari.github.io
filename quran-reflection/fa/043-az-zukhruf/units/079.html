<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۷۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="أَبرَموا" data-root="ب ر م" data-root-meaning="محکم تابیدن و استوار ساختن؛ إبرامِ کار، استوار و قطعی کردنِ تصمیم یا تدبیر است." data-context="دربارهٔ کاری تصمیمی استوار گرفته‌اند؛ فعلِ ماضی دربارهٔ مخالفان، بدون تعیینِ نوعِ نقشه از خود واژه." data-learn-more="/quran-terminology/fa/roots/b-r-m/">أَبرَموا</button>
    <button class="word-link" type="button" data-word="أَمرًا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن؛ و در کاربرد اسمی، کار، شأن، موضوع یا رخدادی که دربارهٔ آن سخن می‌رود." data-context="کاری یا موضوعی که درباره‌اش تصمیمی استوار گرفته‌اند؛ مفعولِ «أبرموا»، نه فرمان دادن در این کاربرد.">أَمرًا</button>
    <button class="word-link" type="button" data-word="فَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنّا</button>
    <button class="word-link" type="button" data-word="مُبرِمونَ" data-root="ب ر م" data-root-meaning="محکم تابیدن و استوار ساختن؛ إبرامِ کار، استوار و قطعی کردنِ تصمیم یا تدبیر است." data-context="تدبیر را استوار می‌کنیم؛ اسم فاعلِ جمع در بیانِ پاسخِ الهی، با مفعولی که در عبارت ذکر نشده است." data-learn-more="/quran-terminology/fa/roots/b-r-m/">مُبرِمونَ</button>
  </p>
  <p class="farsi-verse">یا کاری را استوار کرده‌اند؟ پس ما نیز استوار می‌کنیم.</p>
</section>
