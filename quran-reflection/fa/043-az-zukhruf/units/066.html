<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="يَنظُرونَ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="انتظار می‌کشند؛ در پرسش دربارهٔ آمدن ساعت">يَنظُرونَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="السّاعَةَ" data-root="س و ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-ayn/" data-root-meaning="گذشت و بخشی از زمان؛ ساعت: هنگام یا رستاخیز؛ «سواع» نام خاص معبود است." data-context="ساعت؛ هنگامِ رستاخیز که انتظارش مطرح است">السّاعَةَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَأتِيَهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بر آنان برسد؛ آمدن ساعت">تَأتِيَهُم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="ب غ ت" data-root-meaning="ناگهانی فرا رسیدن یا رخ دادن چیزی در زمانی که مخاطب انتظار وقوع آن را نداشته یا از نزدیک شدن آن آگاه نبوده است." data-context="ناگهان؛ چگونگی فرا رسیدن ساعت در حال بی‌خبری مخاطبان" data-learn-more="/quran-terminology/fa/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک" data-context="آگاه‌اند؛ با نفی، بی‌خبری از زمانِ رسیدن ساعت">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">آیا جز ساعت را انتظار می‌کشند که ناگهان بر آنان درآید، درحالی‌که آگاه نیستند؟</p>
</section>
