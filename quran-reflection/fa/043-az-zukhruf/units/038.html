<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="جاءَنا" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَنا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="يٰلَيتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰلَيتَ</button>
    <button class="word-link" type="button" data-word="بَينى" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينى</button>
    <button class="word-link" type="button" data-word="وَبَينَكَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">وَبَينَكَ</button>
    <button class="word-link" type="button" data-word="بُعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بُعدَ</button>
    <button class="word-link" type="button" data-word="المَشرِقَينِ" data-root="ش ر ق" data-learn-more="/quran-terminology/fa/roots/sh-r-q/" data-root-meaning="از برآمدن خورشید و روشن شدن افق تا مشرق و مشارق">المَشرِقَينِ</button>
    <button class="word-link" type="button" data-word="فَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">فَبِئسَ</button>
    <button class="word-link" type="button" data-word="القَرينُ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره.">القَرينُ</button>
  </p>
  <p class="farsi-verse">تا آنگاه که نزد ما آید، گوید: ای کاش میان من و تو فاصلهٔ دو مشرق بود؛ چه بد هم‌نشینی!</p>
</section>
