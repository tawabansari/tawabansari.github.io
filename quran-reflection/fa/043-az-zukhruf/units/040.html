  <p class="arabic-text">

    <button class="word-link" type="button" data-word="تُسمِعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/">تُسمِعُ</button>

  <p class="farsi-verse">آیا تو کران را می‌شنوانی یا نابینایان و کسی را که در گمراهی آشکار است هدایت می‌کنی؟</p>
