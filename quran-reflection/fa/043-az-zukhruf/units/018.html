<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوَمَن</button>
    <button class="word-link" type="button" data-word="يُنَشَّؤُا۟" data-root="ن ش أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sh-a/" data-root-meaning="پدید آوردن، رشد کردن و پرورش دادن." data-context="در زیور پرورش داده می‌شود؛ فعل مجهولِ وصف‌کنندهٔ شخص یا مصداق مورد بحث.">يُنَشَّؤُا۟</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الحِليَةِ" data-root="ح ل ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-y/" data-root-meaning="زیور و آرایش، و آراستن با زیور." data-context="زیور و آرایه‌ای که پرورش در میان آن توصیف شده است.">الحِليَةِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الخِصامِ" data-root="خ ص م" data-root-meaning="رویارویی و مخاصمهٔ دو طرف بر سر ادعا، حق یا موضوعی مورد اختلاف؛ خصم: طرف دعوا." data-context="هنگام مخاصمه و رویارویی گفتاری؛ «غیر مبین» به روشنیِ بیان در این موقعیت مربوط است." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/">الخِصامِ</button>
    <button class="word-link" type="button" data-word="غَيرُ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="ناـ؛ در ترکیب «غیر مبین»، نفیِ روشنیِ بیان در مخاصمه.">غَيرُ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="روشن‌بیان در مخاصمه؛ با «غیر» نفی شده است.">مُبينٍ</button>
  </p>
  <p class="farsi-verse">آیا کسی که در زیور پرورش می‌یابد و در ستیز، بیان روشنی ندارد؟</p>
</section>
