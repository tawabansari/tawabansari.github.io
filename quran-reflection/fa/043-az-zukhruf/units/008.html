<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَهلَكنا" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="پیشینیانِ نیرومندتر را نابود ساختیم." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">فَأَهلَكنا</button>
    <button class="word-link" type="button" data-word="أَشَدَّ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="نیرومندتر در حمله و چیرگی.">أَشَدَّ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="بَطشًا" data-root="ب ط ش" data-root-meaning="گرفتن یا برخورد کردن با قدرت، شدت و غلبه؛ و در کاربردهای گسترده‌تر، توانِ اعمال قهر و چیرگی." data-context="قدرتِ حمله و چیرگی." data-learn-more="/quran-terminology/fa/roots/b-tt-sh/">بَطشًا</button>
    <button class="word-link" type="button" data-word="وَمَضىٰ" data-root="م ض ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-dad-y/" data-root-meaning="گذشتن و پیش رفتن." data-context="و گذشت و پیش‌تر رخ داد.">وَمَضىٰ</button>
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مثل و سرگذشتِ عبرت‌آموز.">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="پیشینیان.">الأَوَّلينَ</button>
  </p>
  <p class="farsi-verse">پس کسانی نیرومندتر از آنان را هلاک کردیم، و نمونهٔ پیشینیان گذشت.</p>
</section>
