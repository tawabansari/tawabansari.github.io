<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَذِكرٌ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">لَذِكرٌ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="وَلِقَومِكَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَلِقَومِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَوفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَسَوفَ</button>
    <button class="word-link" type="button" data-word="تُسـَٔلونَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">تُسـَٔلونَ</button>
  </p>
  <p class="farsi-verse">و آن یادآوری‌ای برای تو و قوم توست؛ و بازخواست خواهید شد.</p>
</section>
