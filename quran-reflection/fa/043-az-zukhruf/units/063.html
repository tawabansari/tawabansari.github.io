  <p class="farsi-verse">و چون عیسی با دلایل روشن آمد، گفت: به‌راستی حکمت را برایتان آورده‌ام و تا بخشی از آنچه را در آن اختلاف دارید برایتان روشن کنم؛ پس از آن معبود یگانه پروا کنید و از من فرمان برید.</p>
