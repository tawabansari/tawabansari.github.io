<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۷۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ادخُلُوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="درآیید؛ فرمان ورود به بهشت.">ادخُلُوا</button>
    <button class="word-link" type="button" data-word="الجَنَّةَ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="بهشت؛ باغی که به ورود در آن فراخوانده می‌شوند.">الجَنَّةَ</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="وَأَزوٰجُكُم" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="و همسرانتان؛ همراهانِ مخاطبان در ورود به بهشت.">وَأَزوٰجُكُم</button>
    <button class="word-link" type="button" data-word="تُحبَرونَ" data-root="ح ب ر" data-root-meaning="اثر و آراستگی؛ حَبْر/حِبْر: عالم دینی؛ حُبُور: شادی و برخورداری از نعمت." data-context="شادمان و برخوردار از نعمت می‌شوید؛ خطاب به واردشوندگان به بهشت." data-learn-more="/quran-terminology/fa/roots/h-b-r/">تُحبَرونَ</button>
  </p>
  <p class="farsi-verse">شما و همسرانتان به بهشت درآیید؛ شادمان می‌شوید.</p>
</section>
