<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَولا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بشوند؛ در بیانِ احتمالِ یکسان شدن مردم.">يَكونَ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم.">النّاسُ</button>
    <button class="word-link" type="button" data-word="أُمَّةً" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="جامعه و گروهی با جهت مشترک.">أُمَّةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یک و یگانه.">وٰحِدَةً</button>
    <button class="word-link" type="button" data-word="لَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قطعاً قرار می‌دادیم و فراهم می‌کردیم.">لَجَعَلنا</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَكفُرُ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر و انکار می‌ورزد.">يَكفُرُ</button>
    <button class="word-link" type="button" data-word="بِالرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="به فرارحمن؛ دارای رحمت فراگیر.">بِالرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="لِبُيوتِهِم" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="برای خانه‌های آنان؛ در تصویرِ امکانات دنیوی." data-learn-more="/quran-terminology/fa/roots/b-y-t/">لِبُيوتِهِم</button>
    <button class="word-link" type="button" data-word="سُقُفًا" data-root="س ق ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-q-f/" data-root-meaning="سقف و پوشش بالایی." data-context="سقف‌ها.">سُقُفًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فِضَّةٍ" data-root="ف ض ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-dad-dad/" data-root-meaning="شکستن و پراکندن؛ فضّه: نقره." data-context="نقره.">فِضَّةٍ</button>
    <button class="word-link" type="button" data-word="وَمَعارِجَ" data-root="ع ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-j/" data-root-meaning="بالا رفتن؛ معارج: راه‌های صعود؛ اعرج: دارای لنگی." data-context="و پلکان‌ها و راه‌های بالارفتن.">وَمَعارِجَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="يَظهَرونَ" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی" data-context="بالا می‌روند.">يَظهَرونَ</button>
  </p>
  <p class="farsi-verse">و اگر نبود که مردم یک امت می‌شدند، برای کسانی که به رحمان کفر می‌ورزند، برای خانه‌هایشان سقف‌هایی از نقره و پلکان‌هایی قرار می‌دادیم که بر آنها بالا روند،</p>
</section>
