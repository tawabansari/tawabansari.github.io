  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِمّا</button>
    <button class="word-link" type="button" data-word="نَذهَبَنَّ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">نَذهَبَنَّ</button>
    <button class="word-link" type="button" data-word="بِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكَ</button>
    <button class="word-link" type="button" data-word="فَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنّا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="مُنتَقِمونَ" data-root="ن ق م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-q-m/" data-root-meaning="ناپسند داشتن و مؤاخذه؛ انتقام: کیفر دادن در پاسخ به کردار.">مُنتَقِمونَ</button>

  <p class="farsi-verse">پس اگر تو را ببریم، بی‌گمان از آنان انتقام خواهیم گرفت،</p>
