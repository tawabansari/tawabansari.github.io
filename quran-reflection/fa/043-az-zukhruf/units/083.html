<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَذَرهُم" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَذَرهُم</button>
    <button class="word-link" type="button" data-word="يَخوضوا" data-root="خ و ض" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَخوضوا</button>
    <button class="word-link" type="button" data-word="وَيَلعَبوا" data-root="ل ع ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَلعَبوا</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يُلٰقوا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">يُلٰقوا</button>
    <button class="word-link" type="button" data-word="يَومَهُمُ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَهُمُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يوعَدونَ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">يوعَدونَ</button>
  </p>
  <p class="farsi-verse">پس رهایشان کن تا فرو روند و بازی کنند، تا روزی را که به آنان وعده داده می‌شود دیدار کنند.</p>
</section>
