<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلُوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و نسبت دادند یا چنین شمردند؛ فرشتگان را مؤنث دانستند.">وَجَعَلُوا</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ موضوع ادعای مؤنث نامیدن یا مؤنث آفریده شدن.">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="عِبٰدُ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="شخص برده؛ در حکم قصاص.">عِبٰدُ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمان؛ در معرفی فرشتگان به‌عنوان بندگان او.">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="إِنٰثًا" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="مؤنث؛ وصفی که مدعیان به فرشتگان نسبت می‌دهند و پشتوانه دانایی آن نقد می‌شود.">إِنٰثًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَشَهِدوا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="آیا شاهد بودند؟ پرسش از حضور هنگام آفرینش فرشتگان.">أَشَهِدوا</button>
    <button class="word-link" type="button" data-word="خَلقَهُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفرینش آنان؛ درباره فرشتگان.">خَلقَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="سَتُكتَبُ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="نوشته خواهد شد؛ فعل مجهول درباره گواهی مدعیان.">سَتُكتَبُ</button>
    <button class="word-link" type="button" data-word="شَهٰدَتُهُم" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهی آنان؛ آنچه نوشته و درباره‌اش پرسش می‌شود.">شَهٰدَتُهُم</button>
    <button class="word-link" type="button" data-word="وَيُسـَٔلونَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن" data-context="و از آنان پرسش خواهد شد؛ فعل مجهول درباره مدعیان.">وَيُسـَٔلونَ</button>
  </p>
  <p class="farsi-verse">و فرشتگان را که بندگان رحمان‌اند، مؤنث قرار دادند. آیا آفرینش آنان را شاهد بودند؟ گواهی‌شان نوشته خواهد شد و بازخواست خواهند شد.</p>
</section>
