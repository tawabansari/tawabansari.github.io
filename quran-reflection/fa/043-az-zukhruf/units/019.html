<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلُوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلُوا</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="أ ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="عِبٰدُ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/">عِبٰدُ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="إِنٰثًا" data-root="أ ن ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">إِنٰثًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَشَهِدوا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/">أَشَهِدوا</button>
    <button class="word-link" type="button" data-word="خَلقَهُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="سَتُكتَبُ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">سَتُكتَبُ</button>
    <button class="word-link" type="button" data-word="شَهٰدَتُهُم" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/">شَهٰدَتُهُم</button>
    <button class="word-link" type="button" data-word="وَيُسـَٔلونَ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/">وَيُسـَٔلونَ</button>
  </p>
  <p class="farsi-verse">و فرشتگان را که بندگان رحمان‌اند، مؤنث قرار دادند. آیا آفرینش آنان را شاهد بودند؟ گواهی‌شان نوشته خواهد شد و بازخواست خواهند شد.</p>
