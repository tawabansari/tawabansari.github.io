<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاختَلَفَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/">فَاختَلَفَ</button>
    <button class="word-link" type="button" data-word="الأَحزابُ" data-root="ح ز ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَحزابُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِهِم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/">بَينِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَوَيلٌ" data-root="و ي ل" data-learn-more="/quran-terminology/fa/roots/w-y-l/">فَوَيلٌ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظَلَموا</button>

  <p class="farsi-verse">پس گروه‌ها از میانشان اختلاف کردند؛ وای بر کسانی که ستم کردند از عذاب روزی دردناک.</p>
