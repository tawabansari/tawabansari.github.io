<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَيَصُدّونَهُم" data-root="ص د د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَيَصُدّونَهُم</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">السَّبيلِ</button>
    <button class="word-link" type="button" data-word="وَيَحسَبونَ" data-root="ح س ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَحسَبونَ</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="مُهتَدونَ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">مُهتَدونَ</button>
  </p>
  <p class="farsi-verse">و آنان بی‌گمان اینان را از راه بازمی‌دارند، و اینان می‌پندارند که راه‌یافته‌اند.</p>
