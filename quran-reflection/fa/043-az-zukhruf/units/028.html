<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الزخرف ۴۳:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلَها" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلَها</button>
    <button class="word-link" type="button" data-word="كَلِمَةً" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/">كَلِمَةً</button>
    <button class="word-link" type="button" data-word="باقِيَةً" data-root="ب ق ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">باقِيَةً</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="عَقِبِهِ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/">عَقِبِهِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَرجِعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">يَرجِعونَ</button>
  </p>
  <p class="farsi-verse">و آن را سخنی پایدار در نسل پس از خود قرار داد، باشد که بازگردند.</p>
</section>
