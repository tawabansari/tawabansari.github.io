<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">المطففین ۸۳:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَرائِكِ" data-root="أ ر ك" data-learn-more="/quran-terminology/fa/roots/a-r-k/" data-root-meaning="تخت یا بستری آراسته و آماده برای نشستن، آسودن و تکیه زدن؛ غالبا همراه با پوشش یا آرایش ویژه.">الأَرائِكِ</button>
    <button class="word-link" type="button" data-word="يَنظُرونَ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">يَنظُرونَ</button>
  </p>
  <p class="farsi-verse">بر تخت‌ها می‌نگرند.</p>
