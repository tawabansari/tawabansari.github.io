<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">المطففین ۸۳:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُسقَونَ" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب.">يُسقَونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَحيقٍ" data-root="ر ح ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رَحيقٍ</button>
    <button class="word-link" type="button" data-word="مَختومٍ" data-root="خ ت م" data-learn-more="/quran-terminology/fa/roots/kh-t-m/" data-root-meaning="مُهر، پایان‌بخشی، بسته‌شدن، و تثبیت نهایی">مَختومٍ</button>
  </p>
  <p class="farsi-verse">از نوشیدنی زلالِ مهرشده به آنان نوشانده می‌شود،</p>
</section>
