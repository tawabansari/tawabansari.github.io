<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">المطففین ۸۳:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَلّا</button>
    ۖ
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    ۜ
    <button class="word-link" type="button" data-word="رانَ" data-root="ر ي ن" data-learn-more="/quran-terminology/fa/roots/r-y-n/" data-root-meaning="پوشاندن، فراگرفتن و چیره شدن؛ زنگار و آلودگی در کاربردهای محسوس، و غلبه در حالت‌های غیرمادی." data-context="بر دل‌هایشان چیره شد و آن‌ها را پوشاند؛ اثر آنچه پیوسته کسب می‌کردند.">رانَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌های آنان؛ جایگاه فهم و جهت‌گیری اخلاقی در این سیاق.">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه فعل بعد، کردار آنان را در گذشته بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان" data-context="کسب می‌کردند؛ کردارها و دستاوردهایی که بر دل‌هایشان اثر گذاشت.">يَكسِبونَ</button>
  </p>
  <p class="farsi-verse">چنین نیست؛ بلکه آنچه به دست می‌آوردند بر دل‌هایشان زنگار بسته است.</p>
</section>
