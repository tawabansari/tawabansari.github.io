<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">المطففین ۸۳:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِزاجُهُ" data-root="م ز ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-z-j/" data-root-meaning="آمیختن نوشیدنی و ماده آمیخته‌شونده با آن.">وَمِزاجُهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَسنيمٍ" data-root="س ن م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-m/" data-root-meaning="بلندی؛ تسنیم: نام چشمه‌ای در وصف نعمت بهشتی.">تَسنيمٍ</button>
  </p>
  <p class="farsi-verse">و آمیخته‌اش از تسنیم است،</p>
