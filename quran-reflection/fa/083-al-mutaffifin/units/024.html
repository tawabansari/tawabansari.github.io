<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">المطففین ۸۳:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَعرِفُ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">تَعرِفُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="وُجوهِهِم" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»">وُجوهِهِم</button>
    <button class="word-link" type="button" data-word="نَضرَةَ" data-root="ن ض ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-dad-r/" data-root-meaning="تازگی، شادابی و درخشندگی.">نَضرَةَ</button>
    <button class="word-link" type="button" data-word="النَّعيمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">النَّعيمِ</button>
  </p>
  <p class="farsi-verse">در چهره‌هایشان شادابی نعمت را می‌شناسی.</p>
</section>
