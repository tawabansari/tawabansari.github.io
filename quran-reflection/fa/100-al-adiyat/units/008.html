<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">العادیات ۱۰۰:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لِحُبِّ" data-root="ح ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-b-b/" data-root-meaning="حُبّ: دوستی و محبت؛ حَبّ و حَبّة: دانه. این دو شاخه را نباید در همهٔ کاربردها یک معنا دانست.">لِحُبِّ</button>
    <button class="word-link" type="button" data-word="الخَيرِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">الخَيرِ</button>
    <button class="word-link" type="button" data-word="لَشَديدٌ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">لَشَديدٌ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان در دوست داشتن مال سخت است.</p>
</section>
