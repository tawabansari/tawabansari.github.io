<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">العادیات ۱۰۰:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالعٰدِيٰتِ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="سوگند به تازندگان؛ آنان که با شتاب می‌دوند">وَالعٰدِيٰتِ</button>
    <button class="word-link" type="button" data-word="ضَبحًا" data-root="ض ب ح" data-learn-more="/quran-terminology/fa/roots/dad-b-h/" data-root-meaning="بانگ و نفس‌زدن صدادار، به‌ویژه هنگام دویدن جانور؛ در شاخه‌ای دیگر، تیره شدن یا تغییر رنگ بر اثر آتش و آفتاب." data-context="نفس‌زدن صدادار و پرفشار هنگام تاختن؛ حالت تازندگان در آیه">ضَبحًا</button>
  </p>
  <p class="farsi-verse">سوگند به تازندگانِ نفس‌زنان،</p>
