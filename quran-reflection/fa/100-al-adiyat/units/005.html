  <h2 class="ayah-title">العادیات ۱۰۰:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَسَطنَ" data-root="و س ط" data-learn-more="/quran-terminology/fa/roots/w-s-tt/" data-root-meaning="میانه، میانجیگاه و اعتدال؛ از قرار گرفتن در میان چیزها تا عدالت، سنجیدگی و معنای «أُمَّةً وَسَطًا» در قرآن">فَوَسَطنَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>

  <p class="farsi-verse">و با آن به میان جمع درآیند.</p>
