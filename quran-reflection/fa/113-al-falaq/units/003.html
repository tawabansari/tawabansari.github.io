<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الفلق ۱۱۳:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="شَرِّ" data-root="ش ر ر" data-root-meaning="شر، بدی یا زیانی است که می‌تواند به رفتار، وضعیت، رخداد یا فرجام چیزی نسبت داده شود؛ در ساخت مقایسه‌ای، بدتر بودن را بیان می‌کند؛ و شرر در شاخه مادی به پاره‌های فروزان و جهنده آتش اشاره دارد." data-learn-more="/quran-terminology/fa/roots/sh-r-r/">شَرِّ</button>
    <button class="word-link" type="button" data-word="غاسِقٍ" data-root="غ س ق" data-root-meaning="غسق در کاربرد مربوط به شب، تاریک شدن و فرارسیدن یا گسترش تاریکی است؛ در شاخه دیگری از زبان عربی، این خانواده برای جاری شدن و فرو ریختن مایعات نیز به کار رفته است. «غاسق» وصف تاریک‌شونده یا در سیاق مناسب جاری‌شونده است، و «غساق» در قرآن نام چیزی عذاب‌آور است که درباره ماهیت دقیق آن اختلاف لغوی باقی مانده است." data-learn-more="/quran-terminology/fa/roots/gh-s-q/">غاسِقٍ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="وَقَبَ" data-root="و ق ب" data-root-meaning="وقوب، داخل شدن و فرو رفتن یا پنهان گشتن چیزی در یک جایگاه است؛ و در کاربردهای مربوط به خورشید، ماه و تاریکی، می‌تواند غروب، ناپدید شدن یا فرارسیدن و فراگیر شدن را بیان کند. «وقب» همچنین نام گودی یا فرورفتگی‌ای است که چیزی در آن جای می‌گیرد." data-learn-more="/quran-terminology/fa/roots/w-q-b/">وَقَبَ</button>
  </p>
  <p class="farsi-verse">و از شر تاریکی هنگامی که فرارسد،</p>
</section>
