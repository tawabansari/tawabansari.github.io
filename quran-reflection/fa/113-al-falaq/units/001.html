<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">الفلق ۱۱۳:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="أَعوذُ" data-root="ع و ذ" data-learn-more="/quran-terminology/fa/roots/ayn-w-dh/" data-root-meaning="پناه بردن، پناه جستن، به مأمن روی آوردن و در حفاظت آن قرار گرفتن.">أَعوذُ</button>
    <button class="word-link" type="button" data-word="بِرَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">بِرَبِّ</button>
    <button class="word-link" type="button" data-word="الفَلَقِ" data-root="ف ل ق" data-root-meaning="فلق، شکافتن و از هم گشودن چیزی است؛ در کاربرد مادی، به ایجاد شکاف و جدا شدن بخش‌ها مربوط می‌شود؛ و در کاربرد مربوط به صبح، به پدیدار شدن سپیده و آشکار شدن روشنایی آغاز روز اشاره دارد. «فالق» شکافنده و گشاینده است، «انفلق» شکافته شدن را بیان می‌کند و «الفلق» در سوره فلق نام سپیده‌دم است." data-learn-more="/quran-terminology/fa/roots/f-l-q/">الفَلَقِ</button>
  </p>
  <p class="farsi-verse">بگو: به پروردگار سپیده‌دم پناه می‌برم،</p>
</section>
