<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">يُريدُ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">الإِنسٰنُ</button>
    <button class="word-link" type="button" data-word="لِيَفجُرَ" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست.">لِيَفجُرَ</button>
    <button class="word-link" type="button" data-word="أَمامَهُ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أَمامَهُ</button>
  </p>
  <p class="farsi-verse">بلکه انسان می‌خواهد در پیش روی خود به بدکاری ادامه دهد.</p>
</section>
