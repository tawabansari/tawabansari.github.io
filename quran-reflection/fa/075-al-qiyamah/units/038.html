<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="عَلَقَةً" data-root="ع ل ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَلَقَةً</button>
    <button class="word-link" type="button" data-word="فَخَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">فَخَلَقَ</button>
    <button class="word-link" type="button" data-word="فَسَوّىٰ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">فَسَوّىٰ</button>
  </p>
  <p class="farsi-verse">سپس خون‌بسته‌ای شد، پس او آفرید و سامان داد،</p>
</section>
