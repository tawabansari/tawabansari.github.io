<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="أُقسِمُ" data-root="ق س م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-m/" data-root-meaning="تقسیم و بهره‌بندی؛ قَسَم: سوگند.">أُقسِمُ</button>
    <button class="word-link" type="button" data-word="بِالنَّفسِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">بِالنَّفسِ</button>
    <button class="word-link" type="button" data-word="اللَّوّامَةِ" data-root="ل و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-m/" data-root-meaning="ملامت و سرزنش.">اللَّوّامَةِ</button>
  </p>
  <p class="farsi-verse">و سوگند می‌خورم به نفس سرزنشگر.</p>
</section>
