<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُحَرِّك" data-root="ح ر ك" data-root-meaning="حرکت و جنبش در برابر سکون؛ به حرکت درآوردن چیزی." data-context="حرکت دهی؛ در این آیه، حرکت دادن زبان در ارتباط با شتاب کردن در دریافت یا خواندن پیام، که از آن نهی شده است." data-learn-more="/quran-terminology/fa/roots/h-r-k/">تُحَرِّك</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="لِسانَكَ" data-root="ل س ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-s-n/" data-root-meaning="زبان به‌عنوان اندام، گفتار یا زبان یک قوم." data-context="زبانت؛ عضوی که مخاطب از حرکت دادن شتاب‌زدهٔ آن در این وضعیت بازداشته می‌شود.">لِسانَكَ</button>
    <button class="word-link" type="button" data-word="لِتَعجَلَ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله" data-context="تا در آن شتاب کنی؛ هدفِ حرکت زبان که در این موقعیت از آن نهی شده است.">لِتَعجَلَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
  </p>
  <p class="farsi-verse">زبانت را برای شتاب کردن در آن به حرکت درنیاور.</p>
</section>
