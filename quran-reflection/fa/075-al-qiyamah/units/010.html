<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولُ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت">الإِنسٰنُ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="أَينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَينَ</button>
    <button class="word-link" type="button" data-word="المَفَرُّ" data-root="ف ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-r/" data-root-meaning="گریختن و دور شدن.">المَفَرُّ</button>
  </p>
  <p class="farsi-verse">انسان در آن روز می‌گوید: «گریزگاه کجاست؟»</p>
</section>
