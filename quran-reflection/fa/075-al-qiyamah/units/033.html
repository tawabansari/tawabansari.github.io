<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="ذَهَبَ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">ذَهَبَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَهلِهِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلِهِ</button>
    <button class="word-link" type="button" data-word="يَتَمَطّىٰ" data-root="م ط و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَتَمَطّىٰ</button>
  </p>
  <p class="farsi-verse">سپس با تبختر به سوی خانواده‌اش رفت.</p>
