  <h2 class="ayah-title">القيامة ۷۵:۹</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="وَالقَمَرُ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان.">وَالقَمَرُ</button>
