<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوُجوهٌ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="و چهره‌ها؛ چهره‌هایی که حالت گرفتهٔ آنها در این جمله بیان می‌شود.">وَوُجوهٌ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="در آن روز؛ اشاره به روز قیامت در سیاق این آیات.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="باسِرَةٌ" data-root="ب س ر" data-root-meaning="درهم کشیدن چهره، ترش‌رویی و گرفتگی صورت؛ در شاخه‌های دیگر، تازگی و نارس بودن، اقدام پیش از موعد، و بازایستادن از حرکت." data-context="گرفته و درهم‌کشیده‌اند؛ اسم فاعل مؤنث مرفوع، خبرِ «چهره‌ها» در توصیف حالت آنها در آن روز." data-learn-more="/quran-terminology/fa/roots/b-s-r/">باسِرَةٌ</button>
  </p>
  <p class="farsi-verse">و چهره‌هایی در آن روز درهم‌کشیده‌اند،</p>
</section>
