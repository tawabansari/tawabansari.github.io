<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">القيامة ۷۵:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="جَمعَهُ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="گردآوردنِ آن؛ جمعِ پیام در کنار قرائتِ آن.">جَمعَهُ</button>
    <button class="word-link" type="button" data-word="وَقُرءانَهُ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="و قرائتِ آن؛ خواندنِ پیام در کنار گردآوردنِ آن." data-learn-more="/quran-terminology/fa/roots/q-r-a/">وَقُرءانَهُ</button>
  </p>
  <p class="farsi-verse">همانا گردآوردن و خواندن آن بر عهدهٔ ماست.</p>
</section>
