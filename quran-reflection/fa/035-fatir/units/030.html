    <button class="word-link" type="button" data-word="أُجورَهُم" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/">أُجورَهُم</button>

    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>

  <p class="farsi-verse">تا پاداش‌هایشان را به‌تمامی به آنان بدهد و از فضل خود بر آنان بیفزاید. همانا او آمرزنده و بسیار سپاسگزار است.</p>
