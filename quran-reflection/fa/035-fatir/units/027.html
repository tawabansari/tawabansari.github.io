<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="دیده و در نظر آورده‌ای.">تَرَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="فرو فرستاد.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ جهت فرود آمدن باران.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست" data-context="آب؛ در اینجا آب باران.">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَخرَجنا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="پس بیرون آوردیم و پدیدار ساختیم.">فَأَخرَجنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="ثَمَرٰتٍ" data-root="ث م ر" data-learn-more="/quran-terminology/fa/roots/th-m-r/" data-root-meaning="بار درخت، میوه و گسترش معنا به حاصل و دارایی" data-context="میوه‌ها و محصولات.">ثَمَرٰتٍ</button>
    <button class="word-link" type="button" data-word="مُختَلِفًا" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="گوناگون و متفاوت؛ وصف رنگ میوه‌ها.">مُختَلِفًا</button>
    <button class="word-link" type="button" data-word="أَلوٰنُها" data-root="ل و ن" data-learn-more="/quran-terminology/fa/roots/l-w-n/" data-root-meaning="رنگ، نمود دیداری و تمایز میان گونه‌ها" data-context="رنگ‌های آنها؛ میوه‌ها.">أَلوٰنُها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالِ</button>
    <button class="word-link" type="button" data-word="جُدَدٌ" data-root="ج د د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-d-d/" data-root-meaning="شاخه‌های این خانواده شامل بریدن، نو شدن، نوارها و راه‌های آشکار، و «جدّ» به معنای عظمت است." data-context="رگه‌ها و راه‌های نمایان در کوه‌ها.">جُدَدٌ</button>
    <button class="word-link" type="button" data-word="بيضٌ" data-root="ب ي ض" data-root-meaning="«ب ي ض» در اصل به سپیدی به‌عنوان یک ویژگی رنگی اشاره دارد. از این معنا، وصف سفید بودن و فعل سفید شدن پدید آمده است. «بَيْضَة» نیز نام تخم پرنده است که در عربی کهن به این خانواده تعلق داشته و سپس در تشبیه‌ها و نام‌گذاری بعضی اشیای همانند به کار رفته است." data-context="سفیدرنگ؛ وصفِ رگه‌ها و راه‌های کوه‌ها." data-learn-more="/quran-terminology/fa/roots/b-y-dad/">بيضٌ</button>
    <button class="word-link" type="button" data-word="وَحُمرٌ" data-root="ح م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-m-r/" data-root-meaning="سرخی و رنگ سرخ؛ در شاخه‌ای دیگر، حمار و حُمُر: خر و خران." data-context="و سرخ‌رنگ؛ وصفِ رگه‌ها.">وَحُمرٌ</button>
    <button class="word-link" type="button" data-word="مُختَلِفٌ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="متفاوت و گوناگون؛ وصف رنگ‌ها.">مُختَلِفٌ</button>
    <button class="word-link" type="button" data-word="أَلوٰنُها" data-root="ل و ن" data-learn-more="/quran-terminology/fa/roots/l-w-n/" data-root-meaning="رنگ، نمود دیداری و تمایز میان گونه‌ها" data-context="رنگ‌های آنها؛ رگه‌های کوه‌ها.">أَلوٰنُها</button>
    <button class="word-link" type="button" data-word="وَغَرابيبُ" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/" data-context="و بسیار تیره و سیاه؛ تاکید بر شدت سیاهی." data-root-meaning="از غروب خورشید و دور شدن از دید تا مغرب، غربت و شاخه‌های دیگر؛ و «غِربیب» و جمع آن «غرابیب»، سیاهی بسیار تیره.">وَغَرابيبُ</button>
    <button class="word-link" type="button" data-word="سودٌ" data-root="س و د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-d/" data-root-meaning="سیاهی؛ در شاخه‌ای دیگر، سیادت و سروری." data-context="سیاه‌رنگ.">سودٌ</button>
  </p>
  <p class="farsi-verse">آیا ندیده‌ای که آن معبود یگانه از آسمان آبی فرو فرستاد و با آن میوه‌هایی با رنگ‌های گوناگون بیرون آوردیم؟ و از کوه‌ها راهه‌هایی سفید و سرخ با رنگ‌های گوناگون و سیاهِ تیره است.</p>
</section>
