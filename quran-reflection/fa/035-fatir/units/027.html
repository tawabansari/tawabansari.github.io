  <p class="farsi-verse">آیا ندیده‌ای که آن معبود یگانه از آسمان آبی فرو فرستاد و با آن میوه‌هایی با رنگ‌های گوناگون بیرون آوردیم؟ و از کوه‌ها راهه‌هایی سفید و سرخ با رنگ‌های گوناگون و سیاهِ تیره است.</p>
