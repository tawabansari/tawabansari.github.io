  <p class="farsi-verse">همانا آن معبود یگانه آسمان‌ها و زمین را نگه می‌دارد تا از جای نروند؛ و اگر از جای بروند، هیچ‌کس پس از او آن دو را نگه نمی‌دارد. همانا او بردبار و آمرزنده است.</p>
