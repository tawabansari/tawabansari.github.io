<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَرسَلَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">أَرسَلَ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">الرِّيٰحَ</button>
    <button class="word-link" type="button" data-word="فَتُثيرُ" data-root="ث و ر" data-learn-more="/quran-terminology/fa/roots/th-w-r/" data-root-meaning="برخاستن، برانگیختن، زیروروکردن و به حرکت درآوردن">فَتُثيرُ</button>
    <button class="word-link" type="button" data-word="سَحابًا" data-root="س ح ب" data-root-meaning="کشیدن، امتداد یافتن و ابر؛ از کشیده شدن چیزی بر زمین تا حرکت ابرها در آسمان و کشانده شدن انسان در صحنه عذاب" data-learn-more="/quran-terminology/fa/roots/s-h-b/">سَحابًا</button>
    <button class="word-link" type="button" data-word="فَسُقنٰهُ" data-root="س و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَسُقنٰهُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَلَدٍ" data-root="ب ل د" data-learn-more="/quran-terminology/fa/roots/b-l-d/" data-root-meaning="از قطعه‌ای از زمین تا سرزمین، آبادی و «بلد امن»">بَلَدٍ</button>
    <button class="word-link" type="button" data-word="مَيِّتٍ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مَيِّتٍ</button>
    <button class="word-link" type="button" data-word="فَأَحيَينا" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">فَأَحيَينا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدَ</button>
    <button class="word-link" type="button" data-word="مَوتِها" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">مَوتِها</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="النُّشورُ" data-root="ن ش ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">النُّشورُ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه است که بادها را می‌فرستد و ابری را برمی‌انگیزند؛ پس آن را به سرزمینی مرده می‌رانیم و با آن زمین را پس از مرگش زنده می‌کنیم. برانگیخته شدن چنین است.</p>
</section>
