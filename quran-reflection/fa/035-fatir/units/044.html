  <p class="farsi-verse">آیا در زمین سفر نکرده‌اند تا بنگرند سرانجام کسانی که پیش از آنان بودند چگونه بود، و آنان از اینان نیرومندتر بودند؟ و هیچ چیزی در آسمان‌ها و در زمین نمی‌تواند آن معبود یگانه را ناتوان سازد. همانا او دانا و تواناست.</p>
