<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ در ساخت «هرکس خواهان عزت باشد».">كانَ</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="بخواهد و خواهان باشد؛ دربارهٔ عزت.">يُريدُ</button>
    <button class="word-link" type="button" data-word="العِزَّةَ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری" data-context="عزت و توانمندیِ همراه با استواری؛ آنچه شخص خواهان آن است.">العِزَّةَ</button>
    <button class="word-link" type="button" data-word="فَلِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">فَلِلَّهِ</button>
    <button class="word-link" type="button" data-word="العِزَّةُ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری" data-context="عزت و توانمندی؛ آنچه در ادامه سراسر از آنِ خداوند دانسته می‌شود.">العِزَّةُ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="همگی و یکسره؛ قیدِ فراگیریِ عزت.">جَميعًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="يَصعَدُ" data-root="ص ع د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-ayn-d/" data-root-meaning="بالا رفتن و پیش رفتن؛ صعید: سطح زمین یا خاک." data-context="بالا می‌رود؛ دربارهٔ سخن پاکیزه به سوی مخاطب الهی.">يَصعَدُ</button>
    <button class="word-link" type="button" data-word="الكَلِمُ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="سخن و کلمات؛ موصوفِ «پاکیزه» در این آیه.">الكَلِمُ</button>
    <button class="word-link" type="button" data-word="الطَّيِّبُ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="پاکیزه و نیکو؛ وصفِ سخنِ یادشده.">الطَّيِّبُ</button>
    <button class="word-link" type="button" data-word="وَالعَمَلُ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="و کردار و عمل؛ موصوفِ «صالح».">وَالعَمَلُ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحُ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته و درست؛ وصف کردار.">الصّٰلِحُ</button>
    <button class="word-link" type="button" data-word="يَرفَعُهُ" data-root="ر ف ع" data-learn-more="/quran-terminology/fa/roots/r-f-ayn/" data-root-meaning="بالا بردن، بلند کردن و برافراشتن؛ از سطح یا مرتبه‌ای پایین‌تر به جایگاهی بالاتر" data-context="آن را بالا می‌برد؛ در خوانشِ ترجمهٔ این پژوهش، کردار شایسته سخن پاکیزه را بالا می‌برد؛ دربارهٔ مرجع ضمیر در تفسیرها خوانش‌های دیگری نیز آمده است.">يَرفَعُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يَمكُرونَ" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است." data-context="نیرنگ می‌اندیشند و تدبیر پنهان می‌کنند؛ در این سیاق همراه با بدکاری.">يَمكُرونَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌ها و کردارهای بد؛ موضوعِ نیرنگِ یادشده.">السَّيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب و کیفرِ رنج‌آور؛ پیامدِ بیان‌شده برای نیرنگ‌ورزان.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="شَديدٌ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="سخت و شدید؛ وصف عذاب.">شَديدٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَكرُ" data-root="م ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-r/" data-root-meaning="تدبیر پنهان برای برگرداندن جریان کار؛ ارزش آن به فاعل و سیاق وابسته است." data-context="و نیرنگ؛ طرح پنهانِ کسانی که پیش‌تر یاد شدند.">وَمَكرُ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="يَبورُ" data-root="ب و ر" data-root-meaning="«ب و ر» در شاخه اصلی کاربردهای قرآنی به تباه شدن و از دست رفتن حاصل، فایده یا وضعیت مطلوب چیزی اشاره دارد؛ و بسته به سیاق، می‌تواند معنای کسادی، بی‌حاصلی، فساد یا نابودی پیدا کند." data-context="تباه و ناکام می‌شود؛ دربارهٔ نیرنگِ کسانی که بدکاری را تدبیر می‌کنند." data-learn-more="/quran-terminology/fa/roots/b-w-r/">يَبورُ</button>
  </p>
  <p class="farsi-verse">هرکه عزت می‌خواهد، همه عزت از آنِ آن معبود یگانه است. سخن پاک به سوی او بالا می‌رود و عمل شایسته آن را بالا می‌برد؛ و کسانی که بدی‌ها را نیرنگ می‌کنند عذابی سخت دارند؛ و نیرنگ آنان است که تباه می‌شود.</p>
</section>
