    <button class="word-link" type="button" data-word="نَفسُكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسُكَ</button>

    <button class="word-link" type="button" data-word="حَسَرٰتٍ" data-root="ح س ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَسَرٰتٍ</button>

    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>

  </p>
  <p class="farsi-verse">آیا کسی که بدی عملش برای او آراسته شده و آن را نیکو دیده است؟ همانا آن معبود یگانه هرکه را بخواهد گمراه می‌کند و هرکه را بخواهد هدایت می‌کند؛ پس جانت از حسرت‌ها بر آنان از دست نرود. همانا آن معبود یگانه به آنچه می‌کنند داناست.</p>
