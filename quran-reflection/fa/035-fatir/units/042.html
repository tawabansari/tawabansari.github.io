<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَقسَموا" data-root="ق س م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-m/" data-root-meaning="تقسیم و بهره‌بندی؛ قَسَم: سوگند.">وَأَقسَموا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="جَهدَ" data-root="ج ه د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h2-d/" data-root-meaning="به کار گرفتن توان و کوشش در برابر دشواری؛ جهاد معنای خود را از هدف، شیوه و سیاق می‌گیرد.">جَهدَ</button>
    <button class="word-link" type="button" data-word="أَيمٰنِهِم" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی.">أَيمٰنِهِم</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَهُم</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">نَذيرٌ</button>
    <button class="word-link" type="button" data-word="لَيَكونُنَّ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">لَيَكونُنَّ</button>
    <button class="word-link" type="button" data-word="أَهدىٰ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">أَهدىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="إِحدَى" data-root="أ ح د" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-learn-more="/quran-terminology/fa/roots/a-h-d/">إِحدَى</button>
    <button class="word-link" type="button" data-word="الأُمَمِ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">الأُمَمِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَهُم</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">نَذيرٌ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="زادَهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">زادَهُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="نُفورًا" data-root="ن ف ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="از جا برخاستن و روانه شدن؛ نیز روی‌گردانی و رمیدن.">نُفورًا</button>
  </p>
  <p class="farsi-verse">و به آن معبود یگانه سخت‌ترین سوگندهایشان را خوردند که اگر هشداردهنده‌ای به سراغشان بیاید، بی‌گمان از یکی از امت‌ها هدایت‌یافته‌تر خواهند بود؛ پس چون هشداردهنده‌ای به سراغشان آمد، جز بر رمیدنشان نیفزود؛</p>
</section>
