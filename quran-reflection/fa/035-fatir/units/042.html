  <p class="farsi-verse">و به آن معبود یگانه سخت‌ترین سوگندهایشان را خوردند که اگر هشداردهنده‌ای به سراغشان بیاید، بی‌گمان از یکی از امت‌ها هدایت‌یافته‌تر خواهند بود؛ پس چون هشداردهنده‌ای به سراغشان آمد، جز بر رمیدنشان نیفزود؛</p>
