  <p class="farsi-verse">ای مردم، نعمت آن معبود یگانه را بر خود یاد کنید. آیا آفریدگاری جز آن معبود یگانه هست که از آسمان و زمین به شما روزی دهد؟ هیچ معبودی جز او نیست؛ پس چگونه برگردانده می‌شوید؟</p>
