  <p class="farsi-verse">و کسانی که کفر ورزیدند، آتش جهنم برای آنان است؛ بر آنان حکم نمی‌شود که بمیرند و از عذاب آن برایشان کاسته نمی‌شود. این‌گونه هر بسیار ناسپاسی را جزا می‌دهیم.</p>
