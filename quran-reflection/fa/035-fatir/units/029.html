  <p class="farsi-verse">همانا کسانی که کتاب آن معبود یگانه را می‌خوانند و صلات را برپا داشته‌اند و از آنچه روزی‌شان داده‌ایم پنهان و آشکار انفاق کرده‌اند، به دادوستدی امید دارند که هرگز تباه نمی‌شود؛</p>
