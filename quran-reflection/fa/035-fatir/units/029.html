<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَتلونَ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر؛ و «تلاوت»، خواندن و بازگفتنِ پیوستهٔ سخن یا آیات." data-context="پیوسته می‌خوانند و تلاوت می‌کنند؛ دربارهٔ کتاب خداوند.">يَتلونَ</button>
    <button class="word-link" type="button" data-word="كِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتاب؛ متنِ منسوب به خداوند که تلاوت می‌شود.">كِتٰبَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="و برپا داشته‌اند؛ دربارهٔ صلوة.">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلوة؛ پیوند بندگی با آن معبود یگانه که در آیه برپا داشته می‌شود.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَنفَقوا" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن" data-context="و بخشیده‌اند و انفاق کرده‌اند؛ از روزیِ دریافت‌شده.">وَأَنفَقوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="به آنان روزی داده‌ایم؛ دربارهٔ آنچه بخشی از آن را می‌بخشند.">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="سِرًّا" data-root="س ر ر" data-learn-more="/quran-terminology/fa/roots/s-r-r/" data-root-meaning="راز و نهان، شادی و آسایش، و جایگاه استقرار" data-context="پنهانی؛ وصف شیوهٔ بخشیدن.">سِرًّا</button>
    <button class="word-link" type="button" data-word="وَعَلانِيَةً" data-root="ع ل ن" data-learn-more="/quran-terminology/fa/roots/ayn-l-n/" data-root-meaning="آشکار بودن و آشکار ساختن در برابر حوزه پنهان" data-context="و آشکارا؛ در کنار بخشیدنِ پنهان.">وَعَلانِيَةً</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="ر ج و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ نیز کناره و جانب؛ تأخیر انداختن در برخی صورت‌ها با «رجأ» بررسی می‌شود." data-context="امید دارند؛ به تجارتی که کساد و بی‌حاصل نمی‌شود.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="تِجٰرَةً" data-root="ت ج ر" data-learn-more="/quran-terminology/fa/roots/t-j-r/" data-root-meaning="ورود به دادوستد و به گردش درآوردن مال یا سرمایه برای طلب ربح و منفعت." data-context="تجارت؛ تصویرِ دادوستد برای کردارهای یادشده و امید به حاصل و پاداش آنها.">تِجٰرَةً</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="تَبورَ" data-root="ب و ر" data-root-meaning="«ب و ر» در شاخه اصلی کاربردهای قرآنی به تباه شدن و از دست رفتن حاصل، فایده یا وضعیت مطلوب چیزی اشاره دارد؛ و بسته به سیاق، می‌تواند معنای کسادی، بی‌حاصلی، فساد یا نابودی پیدا کند." data-context="کساد و بی‌حاصل شود؛ با «لن»، تجارتی که هرگز چنین فرجامی نخواهد داشت." data-learn-more="/quran-terminology/fa/roots/b-w-r/">تَبورَ</button>
  </p>
  <p class="farsi-verse">همانا کسانی که کتاب آن معبود یگانه را می‌خوانند و صلات را برپا داشته‌اند و از آنچه روزی‌شان داده‌ایم پنهان و آشکار انفاق کرده‌اند، به دادوستدی امید دارند که هرگز تباه نمی‌شود؛</p>
</section>
