<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="يَشَأ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشَأ</button>
    <button class="word-link" type="button" data-word="يُذهِبكُم" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">يُذهِبكُم</button>
    <button class="word-link" type="button" data-word="وَيَأتِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">وَيَأتِ</button>
    <button class="word-link" type="button" data-word="بِخَلقٍ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">بِخَلقٍ</button>
    <button class="word-link" type="button" data-word="جَديدٍ" data-root="ج د د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جَديدٍ</button>
  </p>
  <p class="farsi-verse">اگر بخواهد، شما را می‌برد و آفرینشی تازه می‌آورد؛</p>
</section>
