<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَلَقَكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="شما را آفرید؛ خطاب به انسان‌ها.">خَلَقَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تُرابٍ" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه" data-context="خاک؛ در بیان آفرینش انسان.">تُرابٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نُطفَةٍ" data-root="ن ط ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-tt-f/" data-root-meaning="اندکی مایع؛ نطفه: مقدار اندک مایع تولیدمثل در سیاق آفرینش." data-context="نطفه؛ قطره در زمینه پیدایش انسان.">نُطفَةٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="جَعَلَكُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="شما را قرار داد؛ در اینجا جفت‌هایی.">جَعَلَكُم</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="شما را جفت‌هایی قرار داد.">أَزوٰجًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تَحمِلُ" data-root="ح م ل" data-root-meaning="برداشتن، حمل کردن و بر عهده داشتن چیزی؛ از بار مادی و بارداری تا مسئولیت، تعهد و پیامد کردار." data-context="حمل می‌کند یا باردار می‌شود؛ فاعل، موجود ماده است." data-learn-more="/quran-terminology/fa/roots/h-m-l/">تَحمِلُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أُنثىٰ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="موجود ماده‌ای که باردار می‌شود یا می‌زاید؛ فاعلِ حمل، نه دختر بودن جنین.">أُنثىٰ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَضَعُ" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="به دنیا می‌آورد؛ در کنار بارداری.">تَضَعُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِعِلمِهِ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="با علم او؛ دانایی به بارداری و زایمان.">بِعِلمِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يُعَمَّرُ" data-root="ع م ر" data-learn-more="/quran-terminology/fa/roots/ayn-m-r/" data-root-meaning="عَمَرَ؛ دوام زندگی، آباد ماندن و حضور پایدار" data-context="عمر داده می‌شود؛ فعل مجهول درباره مدت زندگی.">يُعَمَّرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مُعَمَّرٍ" data-root="ع م ر" data-learn-more="/quran-terminology/fa/roots/ayn-m-r/" data-root-meaning="عَمَرَ؛ دوام زندگی، آباد ماندن و حضور پایدار" data-context="کسی که عمر داده می‌شود؛ در بیان مدت زندگی.">مُعَمَّرٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُنقَصُ" data-root="ن ق ص" data-learn-more="/quran-terminology/fa/roots/n-q-sad/" data-root-meaning="کاستن، کم شدن و نقصان؛ از کاهش مال و محصول تا کم گذاشتن در حق دیگران، کاسته شدن عمر و تغییر حدود زمین" data-context="کاسته می‌شود؛ فعل مجهول درباره عمر.">يُنقَصُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عُمُرِهِ" data-root="ع م ر" data-learn-more="/quran-terminology/fa/roots/ayn-m-r/" data-root-meaning="عَمَرَ؛ دوام زندگی، آباد ماندن و حضور پایدار" data-context="عمر او؛ درباره کاسته شدن از طول زندگی.">عُمُرِهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="كِتٰبٍ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="مقرر شده است؛ فعل مجهول درباره قصاص.">كِتٰبٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَسيرٌ" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت" data-context="آسان؛ درباره دانایی و ثبت مدت زندگی نزد آن معبود یگانه.">يَسيرٌ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه شما را از خاک، سپس از نطفه آفرید، سپس شما را جفت‌ها قرار داد. و هیچ ماده‌ای باردار نمی‌شود و وضع حمل نمی‌کند مگر به دانش او؛ و هیچ عمرکرده‌ای عمر داده نمی‌شود و از عمرش کاسته نمی‌شود مگر آنکه در کتابی است. همانا این بر آن معبود یگانه آسان است.</p>
</section>
