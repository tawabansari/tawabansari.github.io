  <p class="farsi-verse">اوست که شما را جانشینانی در زمین قرار داد؛ پس هرکه کفر ورزد، کفرش بر خود اوست؛ و کفر کافران نزد پروردگارشان جز بر بیزاری نمی‌افزاید؛ و کفر کافران جز بر زیانشان نمی‌افزاید.</p>
