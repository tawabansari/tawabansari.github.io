<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يولِجُ" data-root="و ل ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-l-j/" data-root-meaning="داخل شدن؛ ولیجه: محرم و همراز نزدیک." data-context="درمی‌آورد؛ وارد کردنِ شب در روز، در توصیفِ تدبیرِ آن معبود یگانه.">يولِجُ</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ زمانی که در روز درآورده می‌شود و سپس روز نیز در آن درمی‌آید.">الَّيلَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="النَّهارِ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز؛ زمانی که شب در آن درآورده می‌شود.">النَّهارِ</button>
    <button class="word-link" type="button" data-word="وَيولِجُ" data-root="و ل ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-l-j/" data-root-meaning="داخل شدن؛ ولیجه: محرم و همراز نزدیک." data-context="و درمی‌آورد؛ وارد کردنِ روز در شب، در کنارِ وارد کردنِ شب در روز.">وَيولِجُ</button>
    <button class="word-link" type="button" data-word="النَّهارَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روز؛ در بخش دومِ توصیف، در شب درآورده می‌شود.">النَّهارَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ زمانی که روز در آن درآورده می‌شود.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَسَخَّرَ" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/" data-context="و رام کرده است؛ خورشید و ماه را در نظمِ مقرر به کار انداخته است.">وَسَخَّرَ</button>
    <button class="word-link" type="button" data-word="الشَّمسَ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="خورشید؛ یکی از دو جرمِ نام‌برده که به فرمان الهی رام شده‌اند.">الشَّمسَ</button>
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="ق م ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-m-r/" data-root-meaning="ماه آسمان." data-context="و ماه؛ در کنارِ خورشید، در نظمِ مقرر جریان دارد.">وَالقَمَرَ</button>
    <button class="word-link" type="button" data-word="كُلٌّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هرکدام؛ اشاره به خورشید و ماه که هر یک تا سرآمدی معین روان‌اند.">كُلٌّ</button>
    <button class="word-link" type="button" data-word="يَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر" data-context="روان است؛ حرکتِ هرکدام از خورشید و ماه تا سرآمدی معین.">يَجرى</button>
    <button class="word-link" type="button" data-word="لِأَجَلٍ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت یا موعد مقرر؛ در سیاق مناسب، پایان آن مدت." data-context="تا سرآمدی؛ حدّ زمانیِ معین برای جریانِ خورشید و ماه.">لِأَجَلٍ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="معین و تعیین‌شده؛ وصفِ سرآمدی که برای جریانِ هرکدام مقرر است.">مُسَمًّى</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان؛ نسبتِ ربوبیتِ آن معبود یگانه با مخاطبان.">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="المُلكُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="فرمانروایی؛ از آنِ اوست، در تقابل با نداشتنِ حتی کمترین مالکیت برای خوانده‌شدگانِ جز او.">المُلكُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="تَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="می‌خوانید؛ دعا و روی‌آوردنِ مخاطبان به کسانی جز آن معبود یگانه.">تَدعونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن" data-context="جز او؛ جایگاهِ خوانده‌شدگان در نسبت با آن معبود یگانه.">دونِهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَملِكونَ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="مالک‌اند؛ با «ما»، مالکیتِ حتی قطمیری برای کسانی که جز او خوانده می‌شوند نفی می‌شود.">يَملِكونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قِطميرٍ" data-root="ق ط م ر" data-root-meaning="پوستهٔ بسیار نازک هستهٔ خرما؛ در کاربرد تأکیدی، نمونه‌ای از چیزی بسیار کوچک و ناچیز. برای مصداق دقیق، معانی شکاف هسته و نقطهٔ سفید آن نیز در منابع لغوی ثبت شده‌اند." data-context="قطمیر؛ پوستهٔ نازک هستهٔ خرما، که در این ساختِ منفی برای نفیِ مالکیتِ حتی چیزی بسیار ناچیز آمده است." data-learn-more="/quran-terminology/fa/roots/q-tt-m-r/">قِطميرٍ</button>
  </p>
  <p class="farsi-verse">شب را در روز درمی‌آورد و روز را در شب درمی‌آورد و خورشید و ماه را رام کرده است؛ هرکدام تا سرآمدی معین روان‌اند. این است آن معبود یگانه، پروردگارتان؛ فرمانروایی از آنِ اوست؛ و کسانی که جز او می‌خوانید، حتی پوست نازک هسته خرمایی را مالک نیستند.</p>
</section>
