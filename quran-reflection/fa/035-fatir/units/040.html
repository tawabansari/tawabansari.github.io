  <p class="farsi-verse">بگو: آیا شریکانتان را که جز آن معبود یگانه می‌خوانید دیده‌اید؟ به من نشان دهید چه چیزی از زمین آفریده‌اند؛ یا در آسمان‌ها سهمی دارند؟ یا به آنان کتابی داده‌ایم که از آن بر دلیلی روشن باشند؟ بلکه ستمگران به یکدیگر جز فریب وعده نمی‌دهند.</p>
