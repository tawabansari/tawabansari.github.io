<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَستَوِى" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="برابر است؛ با «ما»: برابر نیست">يَستَوِى</button>
    <button class="word-link" type="button" data-word="البَحرانِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دو پهنهٔ آب">البَحرانِ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="عَذبٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="شیرین">عَذبٌ</button>
    <button class="word-link" type="button" data-word="فُراتٌ" data-root="ف ر ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-t/" data-root-meaning="آب بسیار شیرین و گوارا." data-context="بسیار گوارا">فُراتٌ</button>
    <button class="word-link" type="button" data-word="سائِغٌ" data-root="س و غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-w-gh/" data-root-meaning="به‌آسانی از گلو گذشتن و گوارا بودن." data-context="گوارا برای نوشیدن">سائِغٌ</button>
    <button class="word-link" type="button" data-word="شَرابُهُ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="نوشیدن آن">شَرابُهُ</button>
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="مِلحٌ" data-root="م ل ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-h/" data-root-meaning="نمک و شور بودن." data-context="شور">مِلحٌ</button>
    <button class="word-link" type="button" data-word="أُجاجٌ" data-root="أ ج ج" data-learn-more="/quran-terminology/fa/roots/a-j-j/" data-root-meaning="بسیار شور و گزنده؛ وصف آب با شوری شدید و مزه ناخوشایند." data-context="بسیار شور و گزنده">أُجاجٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="كُلٍّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر یک">كُلٍّ</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="می‌خورید">تَأكُلونَ</button>
    <button class="word-link" type="button" data-word="لَحمًا" data-root="ل ح م" data-root-meaning="گوشت و بافت گوشتی بدن؛ «لَحْم» مفرد و «لُحُوم» جمع آن است. خوراکی بودن و دیگر نقش‌ها از سیاق روشن می‌شوند." data-learn-more="/quran-terminology/fa/roots/l-h-m/" data-context="گوشتی">لَحمًا</button>
    <button class="word-link" type="button" data-word="طَرِيًّا" data-root="ط ر و" data-learn-more="/quran-terminology/fa/roots/tt-r-w/" data-root-meaning="تازگی، شادابی، نرمی، و حفظ کیفیت طبیعی پیش از ماندگی، خشکی یا فساد" data-context="تازه و لطیف">طَرِيًّا</button>
    <button class="word-link" type="button" data-word="وَتَستَخرِجونَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="و بیرون می‌آورید">وَتَستَخرِجونَ</button>
    <button class="word-link" type="button" data-word="حِليَةً" data-root="ح ل ي" data-root-meaning="زیور و آراستگی؛ آراستن انسان یا اشیا با چیزی که برای زیبایی به ظاهر آنها افزوده می‌شود." data-context="زیوری" data-learn-more="/quran-terminology/fa/roots/h-l-y/">حِليَةً</button>
    <button class="word-link" type="button" data-word="تَلبَسونَها" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن" data-context="آن را می‌پوشید">تَلبَسونَها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و می‌بینی">وَتَرَى</button>
    <button class="word-link" type="button" data-word="الفُلكَ" data-root="ف ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-l-k/" data-root-meaning="فُلک: کشتی؛ فَلک: مدار و مسیر گردش." data-context="کشتی‌ها">الفُلكَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="مَواخِرَ" data-root="م خ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-kh-r/" data-root-meaning="شکافتن آب با حرکت، به‌ویژه حرکت کشتی." data-context="شکافندهٔ آب">مَواخِرَ</button>
    <button class="word-link" type="button" data-word="لِتَبتَغوا" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="تا بجویید">لِتَبتَغوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="فضل و بخشش او">فَضلِهِ</button>
    <button class="word-link" type="button" data-word="وَلَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل" data-context="سپاس می‌گزارید">تَشكُرونَ</button>
  </p>
  <p class="farsi-verse">و دو دریا برابر نیستند: این یکی شیرین و گواراست، نوشیدنش خوشایند است؛ و آن یکی شور و تلخ است. و از هریک گوشت تازه می‌خورید و زیوری بیرون می‌آورید که می‌پوشید؛ و کشتی‌ها را در آن شکافنده می‌بینی، تا از فضل او بجویید و باشد که سپاس گزارید.</p>
</section>
