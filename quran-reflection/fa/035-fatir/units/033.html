<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَنّٰتُ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-context="باغ‌ها؛ جایگاهِ ماندگاری و نعمت." data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش؛ جَنّة: باغِ پوشیده از درخت و گیاه.">جَنّٰتُ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="ع د ن" data-root-meaning="ریشه «ع د ن» در زبان عربی به اقامت، ماندن و استقرار در مکان مربوط است." data-learn-more="/quran-terminology/fa/roots/ayn-d-n/" data-context="ماندگاری؛ «باغ‌های عدن»، باغ‌های اقامت پایدار.">عَدنٍ</button>
    <button class="word-link" type="button" data-word="يَدخُلونَها" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="به آنها درمی‌آیند؛ وارد باغ‌های ماندگاری می‌شوند.">يَدخُلونَها</button>
    <button class="word-link" type="button" data-word="يُحَلَّونَ" data-root="ح ل ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-l-y/" data-root-meaning="زیور و آرایش، و آراستن با زیور." data-context="آراسته می‌شوند؛ پوشاندن زیور به ساکنان باغ‌ها.">يُحَلَّونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-context="دستبندها؛ زیورهای وعده‌داده‌شده." data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد؛ أساور: دستبندها و حلقه‌های زینتیِ دور مچ.">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذَهَبٍ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-context="طلا؛ جنسِ دستبندهای ذکرشده." data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان؛ ذَهَب در کاربرد اسمی: طلا، فلزِ شناخته‌شده.">ذَهَبٍ</button>
    <button class="word-link" type="button" data-word="وَلُؤلُؤًا" data-root="ل أ ل أ" data-root-meaning="مروارید؛ گوهری شناخته‌شده به زیبایی و جلای خود که در قرآن هم به‌عنوان زینت و نعمتی طبیعی و هم در تشبیه‌های مربوط به زیبایی به کار رفته است." data-context="و مروارید؛ از زیورهای ساکنان باغ‌ها." data-learn-more="/quran-terminology/fa/roots/l-a-l-a/">وَلُؤلُؤًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِباسُهُم" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن" data-context="و پوشاکشان؛ جامه‌ای که در آن باغ‌ها دارند.">وَلِباسُهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="حَريرٌ" data-root="ح ر ر" data-root-meaning="آزادی و رهاسازی یا اختصاص یافتن؛ در شاخهٔ دیگر، گرما و سوزندگی؛ حریر: ابریشم." data-context="ابریشم؛ جنسِ پوشاک کسانی که به باغ‌های ماندگاری وارد می‌شوند." data-learn-more="/quran-terminology/fa/roots/h-r-r/">حَريرٌ</button>
  </p>
  <p class="farsi-verse">باغ‌های ماندگاری که به آن‌ها وارد می‌شوند؛ در آن‌ها با دستبندهایی از طلا و مروارید آراسته می‌شوند؛ و پوشاکشان در آن‌ها ابریشم است.</p>
</section>
