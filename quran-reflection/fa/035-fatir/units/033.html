<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَنّٰتُ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنّٰتُ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="ع د ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَدنٍ</button>
    <button class="word-link" type="button" data-word="يَدخُلونَها" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">يَدخُلونَها</button>
    <button class="word-link" type="button" data-word="يُحَلَّونَ" data-root="ح ل ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُحَلَّونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذَهَبٍ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">ذَهَبٍ</button>
    <button class="word-link" type="button" data-word="وَلُؤلُؤًا" data-root="ل أ ل أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَلُؤلُؤًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِباسُهُم" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن">وَلِباسُهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="حَريرٌ" data-root="ح ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَريرٌ</button>
  </p>
  <p class="farsi-verse">باغ‌های ماندگاری که به آن‌ها وارد می‌شوند؛ در آن‌ها با دستبندهایی از طلا و مروارید آراسته می‌شوند؛ و پوشاکشان در آن‌ها ابریشم است.</p>
</section>
