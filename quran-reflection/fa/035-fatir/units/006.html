<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="فَاتَّخِذوهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/">فَاتَّخِذوهُ</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/">عَدُوًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">يَدعوا</button>
    <button class="word-link" type="button" data-word="حِزبَهُ" data-root="ح ز ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِزبَهُ</button>
    <button class="word-link" type="button" data-word="لِيَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">لِيَكونوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَصحٰبِ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/">أَصحٰبِ</button>
    <button class="word-link" type="button" data-word="السَّعيرِ" data-root="س ع ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">السَّعيرِ</button>
  </p>
  <p class="farsi-verse">همانا شیطان دشمن شماست؛ پس او را دشمن بگیرید. او تنها گروه خود را فرامی‌خواند تا از اهل آتش فروزان باشند.</p>
