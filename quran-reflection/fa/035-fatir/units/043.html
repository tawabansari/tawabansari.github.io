  <p class="farsi-verse">از روی تکبر در زمین و نیرنگ بد؛ و نیرنگ بد جز دامنگیر اهلش نمی‌شود. پس آیا جز روش پیشینیان را انتظار می‌کشند؟ هرگز برای روش آن معبود یگانه تبدیلی نخواهی یافت، و هرگز برای روش آن معبود یگانه دگرگونی نخواهی یافت.</p>
