<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">فاطر ۳۵:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَصطَرِخونَ" data-root="ص ر خ" data-learn-more="/quran-terminology/fa/roots/sad-r-kh/" data-root-meaning="فریاد بلند؛ فریادخواهی و درخواست کمک؛ فریادرسی و یاری رساندن، بسته به ساخت واژه و سیاق." data-context="در آن فریاد برمی‌آورند؛ با فریاد درخواست می‌کنند از عذاب بیرون آورده شوند.">يَصطَرِخونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار ما؛ خطاب فریادخواهان در درخواست رهایی.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَخرِجنا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="ما را بیرون آور؛ درخواست خروج از جایگاه عذاب.">أَخرِجنا</button>
    <button class="word-link" type="button" data-word="نَعمَل" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام دهیم؛ وعدهٔ عمل پس از بیرون آورده شدن.">نَعمَل</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته؛ وصف کاری که می‌گویند انجام خواهند داد.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="غیر از؛ متفاوت با آنچه پیش‌تر انجام می‌دادند.">غَيرَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودیم؛ همراه فعل بعدی، روش گذشتهٔ آنان را بیان می‌کند.">كُنّا</button>
    <button class="word-link" type="button" data-word="نَعمَلُ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دادیم؛ کارهای پیشین آنان.">نَعمَلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="نُعَمِّركُم" data-root="ع م ر" data-learn-more="/quran-terminology/fa/roots/ayn-m-r/" data-root-meaning="عَمَرَ؛ دوام زندگی، آباد ماندن و حضور پایدار" data-context="به شما عمر دادیم؛ فرصت زندگی در اختیارتان گذاشتیم.">نُعَمِّركُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَتَذَكَّرُ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="پند گیرد؛ یادآور شود و از فرصت استفاده کند.">يَتَذَكَّرُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="تَذَكَّرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="پند گرفت؛ کسی که آمادهٔ یادآوری و پندپذیری بود.">تَذَكَّرَ</button>
    <button class="word-link" type="button" data-word="وَجاءَكُمُ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="و برای شما آمد؛ هشداردهنده نزد شما رسید.">وَجاءَكُمُ</button>
    <button class="word-link" type="button" data-word="النَّذيرُ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="هشداردهنده؛ آنکه برای هشدار دادن به شما آمده بود.">النَّذيرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذوقوا" data-root="ذ و ق" data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و دریافت مزه؛ در کاربرد گسترده، آزمودن و تجربه کردن؛ أَذَاقَ: چشاندن یا دیگری را در معرض تجربه قرار دادن." data-context="پس بچشید؛ پیامد رنج‌آور را تجربه کنید.">فَذوقوا</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="برای ستمگران؛ گروهی که وجود یاور برای آنان نفی می‌شود.">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَصيرٍ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="یاور؛ یاری‌رسانی که وجود او برای ستمگران در این وضعیت نفی می‌شود.">نَصيرٍ</button>
  </p>
  <p class="farsi-verse">و آنان در آن فریاد می‌زنند: پروردگارا، ما را بیرون آور تا کار شایسته کنیم، غیر از آنچه می‌کردیم. آیا شما را به‌اندازه‌ای عمر ندادیم که هرکه پندپذیر بود در آن پند گیرد، و هشداردهنده به سراغتان آمد؟ پس بچشید؛ برای ستمگران هیچ یاوری نیست.</p>
</section>
