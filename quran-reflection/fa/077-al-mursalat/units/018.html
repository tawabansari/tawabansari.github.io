<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَفعَلُ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="انجام می‌دهیم">نَفعَلُ</button>
    <button class="word-link" type="button" data-word="بِالمُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">بِالمُجرِمينَ</button>
  </p>
  <p class="farsi-verse">با گناهکاران چنین می‌کنیم.</p>
