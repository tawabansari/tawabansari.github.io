<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذَا</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="کوه‌ها؛ در بیان برکنده و پراکنده شدن آنها." data-learn-more="/quran-terminology/fa/roots/j-b-l/">الجِبالُ</button>
    <button class="word-link" type="button" data-word="نُسِفَت" data-root="ن س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-s-f/" data-root-meaning="کندن، پراکندن و بر باد دادن." data-context="برکنده و پراکنده شدند؛ فعلِ مربوط به کوه‌ها.">نُسِفَت</button>
  </p>
  <p class="farsi-verse">و هنگامی که کوه‌ها پراکنده شوند،</p>
</section>
