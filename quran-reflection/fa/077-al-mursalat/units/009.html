<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذَا</button>
    <button class="word-link" type="button" data-word="السَّماءُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءُ</button>
    <button class="word-link" type="button" data-word="فُرِجَت" data-root="ف ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-j/" data-root-meaning="شکاف و گشودگی؛ فرج: نیز اندام خصوصی، بنا بر سیاق.">فُرِجَت</button>

  <p class="farsi-verse">و هنگامی که آسمان شکافته شود،</p>
