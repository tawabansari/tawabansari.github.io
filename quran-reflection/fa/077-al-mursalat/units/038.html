<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="يَومُ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزِ.">يَومُ</button>
    <button class="word-link" type="button" data-word="الفَصلِ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="داوری و فیصله؛ در ترکیبِ «روز داوری»." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">الفَصلِ</button>
    ۖ
    <button class="word-link" type="button" data-word="جَمَعنٰكُم" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="شما را گرد آوردیم.">جَمَعنٰكُم</button>
    <button class="word-link" type="button" data-word="وَالأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="و پیشینیان.">وَالأَوَّلينَ</button>
  </p>
  <p class="farsi-verse">این روز داوری است؛ شما و پیشینیان را گرد آورده‌ایم.</p>
</section>
