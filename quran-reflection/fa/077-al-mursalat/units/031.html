<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="ظَليلٍ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن.">ظَليلٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُغنى" data-root="غ ن ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُغنى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهَبِ" data-root="ل ه ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">اللَّهَبِ</button>
  </p>
  <p class="farsi-verse">که نه سایه‌گستر است و نه از شعله بی‌نیاز می‌کند.</p>
</section>
