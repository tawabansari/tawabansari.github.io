<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقَدَرنا" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">فَقَدَرنا</button>
    <button class="word-link" type="button" data-word="فَنِعمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">فَنِعمَ</button>
    <button class="word-link" type="button" data-word="القٰدِرونَ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">القٰدِرونَ</button>
  </p>
  <p class="farsi-verse">پس اندازه نهادیم، و چه نیک اندازه‌گذارانی هستیم!</p>
</section>
