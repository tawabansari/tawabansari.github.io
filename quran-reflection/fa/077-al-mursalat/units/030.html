<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="انطَلِقوا" data-root="ط ل ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-l-q/" data-root-meaning="رها ساختن و به راه افتادن؛ طلاق: گسستن پیوند زناشویی." data-context="روانه شوید؛ فرمانِ رفتن به سوی سایهٔ مذکور.">انطَلِقوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ظِلٍّ" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="سایه؛ در تصویرِ سه‌شاخهٔ آیه.">ظِلٍّ</button>
    <button class="word-link" type="button" data-word="ذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذى</button>
    <button class="word-link" type="button" data-word="ثَلٰثِ" data-root="ث ل ث" data-root-meaning="عدد سه و صورت‌های وابسته؛ شمار سه، جایگاه سوم، یک‌سوم و دوسوم، و توزیع سه‌تایی." data-context="سه شاخه در وصف سایه‌ای که مخاطبان به سوی آن رانده می‌شوند." data-learn-more="/quran-terminology/fa/roots/th-l-th/">ثَلٰثِ</button>
    <button class="word-link" type="button" data-word="شُعَبٍ" data-root="ش ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-ayn-b/" data-root-meaning="شاخه‌شاخه شدن و انشعاب؛ شعب: شاخه‌ها یا گروه‌های بزرگ انسانی." data-context="شاخه‌ها؛ وصفِ ساختِ سایه.">شُعَبٍ</button>
  </p>
  <p class="farsi-verse">به سوی سایه‌ای سه‌شاخه بروید،</p>
</section>
