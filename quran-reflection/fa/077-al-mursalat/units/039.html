  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>

    <button class="word-link" type="button" data-word="فَكيدونِ" data-root="ك ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَكيدونِ</button>
  </p>
  <p class="farsi-verse">پس اگر چاره‌ای دارید، در برابر من به کار بندید!</p>
