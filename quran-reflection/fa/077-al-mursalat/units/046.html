<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">المرسلات ۷۷:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">كُلوا</button>
    <button class="word-link" type="button" data-word="وَتَمَتَّعوا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">وَتَمَتَّعوا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="مُجرِمونَ" data-root="ج ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-r-m/" data-root-meaning="بریدن و به دست آوردن؛ إجرام: مرتکب شدن جرم یا گناه؛ «لا جرم» ساختی برای تأکید و قطعیت است.">مُجرِمونَ</button>
  </p>
  <p class="farsi-verse">اندکی بخورید و بهره ببرید؛ شما گناهکارید.</p>
</section>
