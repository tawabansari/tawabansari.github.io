<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">القدر ۹۷:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَدرىٰكَ" data-root="د ر ي" data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه بودن از موضوعی؛ در باب افعال، آگاه ساختن دیگری." data-context="تو را آگاه ساخته است؛ پرسش دربارهٔ شب قدر.">أَدرىٰكَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَيلَةُ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ در ترکیبِ شب قدر.">لَيلَةُ</button>
    <button class="word-link" type="button" data-word="القَدرِ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="قدر؛ عنوان شبی که آیه دربارهٔ حقیقت آن پرسش می‌کند.">القَدرِ</button>
  </p>
  <p class="farsi-verse">و چه چیز تو را آگاه کرد که شب قدر چیست؟</p>
</section>
