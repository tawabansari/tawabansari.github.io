  <p class="farsi-verse">و می‌گویند: به آن معبود یگانه و رسول ایمان آوردیم و اطاعت کردیم؛ سپس پس از آن گروهی از آنان روی می‌گردانند؛ و آنان مؤمن نیستند.</p>
