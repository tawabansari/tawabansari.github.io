  <h2 class="ayah-title">النور ۲۴:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُقَلِّبُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/">يُقَلِّبُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/">الَّيلَ</button>
    <button class="word-link" type="button" data-word="وَالنَّهارَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/">وَالنَّهارَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَعِبرَةً" data-root="ع ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَعِبرَةً</button>
    <button class="word-link" type="button" data-word="لِأُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِأُولِى</button>
    <button class="word-link" type="button" data-word="الأَبصٰرِ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/">الأَبصٰرِ</button>
  </p>
  <p class="farsi-verse">آن معبود یگانه شب و روز را می‌گرداند؛ بی‌گمان در این برای صاحبان بینش عبرتی است.</p>
