<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَولا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="سَمِعتُموهُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="آن را شنیدید؛ شنیدنِ سخن و اتهامِ مورد بحث.">سَمِعتُموهُ</button>
    <button class="word-link" type="button" data-word="قُلتُم" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="نگفتید؛ پاسخی که می‌بایست هنگام شنیدن داده می‌شد.">قُلتُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَكونُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="روا نیست؛ در ترکیبِ «ما یکون لنا» دربارهٔ سخن گفتن از این اتهام.">يَكونُ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="نَتَكَلَّمَ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="سخن بگوییم؛ پرداختن به اتهامی که شنیده‌اند.">نَتَكَلَّمَ</button>
    <button class="word-link" type="button" data-word="بِهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهٰذا</button>
    <button class="word-link" type="button" data-word="سُبحٰنَكَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="تو منزهی؛ خطابِ تنزیه به خداوند در پاسخ به سخن ناروا.">سُبحٰنَكَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="بُهتٰنٌ" data-root="ب ه ت" data-root-meaning="«ب ه ت» در یک شاخه به حیرت و درماندگی انسان در برابر امری تکان‌دهنده یا حجتی پاسخ‌ناپذیر اشاره دارد؛ و در شاخه دیگر، «بُهْتَان» به دروغ و نسبت ناروایی گفته می‌شود که حقیقت را وارونه نشان می‌دهد و می‌تواند شخصی بی‌گناه را در معرض اتهام یا آسیب قرار دهد." data-context="بهتانی بزرگ؛ وصفِ سخن و اتهامِ ناروایی که نباید بازگفته می‌شد." data-learn-more="/quran-terminology/fa/roots/b-h2-t/">بُهتٰنٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ و سنگین؛ وصفِ بهتانِ مورد بحث.">عَظيمٌ</button>
  </p>
  <p class="farsi-verse">و چرا هنگامی که آن را شنیدید نگفتید: ما را نسزد که از این سخن بگوییم؛ تو پاکی، این بهتانی بزرگ است؟</p>
</section>
