<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُطِعِ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">يُطِعِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="وَيَخشَ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/" data-root-meaning="بیم و ملاحظهٔ آگاهانه در برابر خطری شناخته‌شده یا پیامدی جدی، و خشیت اثرگذار در برابر آن معبود یگانه">وَيَخشَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَيَتَّقهِ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَيَتَّقهِ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الفائِزونَ" data-root="ف و ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-z/" data-root-meaning="رستگاری، کامیابی و رسیدن به مطلوب با رهایی از خطر.">الفائِزونَ</button>
  </p>
  <p class="farsi-verse">و هرکس آن معبود یگانه و رسولش را اطاعت کند و از آن معبود یگانه بترسد و از او پروا کند، آنان همان کامیابان‌اند.</p>
</section>
