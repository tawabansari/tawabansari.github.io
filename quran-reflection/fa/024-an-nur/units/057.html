<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۵7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَحسَبَنَّ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="گمان مبر؛ در ساختِ نهی.">تَحسَبَنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="انکار ورزیدند و کفر پیشه کردند.">كَفَروا</button>
    <button class="word-link" type="button" data-word="مُعجِزينَ" data-root="ع ج ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-z/" data-root-meaning="ناتوان شدن یا ناتوان ساختن؛ عجوز: زن سالخورده." data-context="ناتوان‌کنندگان؛ کسانی که بتوانند از دسترس قدرت بگریزند.">مُعجِزينَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین و سرزمین؛ محلِ زندگی یا رخدادِ یادشده.">الأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُمُ" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="جایگاه و محل اقامت یا پناه؛ بدون دلالتِ همیشگی بر امنیت و آسایش." data-context="جایگاه آنان؛ آتش.">وَمَأوىٰهُمُ</button>
    <button class="word-link" type="button" data-word="النّارُ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ جایگاهِ کیفریِ بیان‌شده.">النّارُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="و به‌راستی چه بد است؛ نکوهشِ سرانجام.">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/" data-root-meaning="از رسیدن به یک پایان تا «مصیر»؛ آنچه کار سرانجام به آن می‌رسد" data-context="فرجام و سرانجامی که به آن می‌رسند.">المَصيرُ</button>
  </p>
  <p class="farsi-verse">مپندار که کسانی که کفر ورزیده‌اند در زمین به‌عجزآورنده‌اند؛ و جایگاهشان آتش است، و چه بد بازگشتگاهی!</p>
</section>
