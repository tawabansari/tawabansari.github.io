<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَجعَلوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">تَجعَلوا</button>
    <button class="word-link" type="button" data-word="دُعاءَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">دُعاءَ</button>
    <button class="word-link" type="button" data-word="الرَّسولِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">الرَّسولِ</button>
    <button class="word-link" type="button" data-word="بَينَكُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَكُم</button>
    <button class="word-link" type="button" data-word="كَدُعاءِ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">كَدُعاءِ</button>
    <button class="word-link" type="button" data-word="بَعضِكُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی">بَعضِكُم</button>
    <button class="word-link" type="button" data-word="بَعضًا" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی">بَعضًا</button>
    ۚ
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَتَسَلَّلونَ" data-root="س ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-l/" data-root-meaning="آهسته بیرون کشیدن یا بیرون رفتن؛ سلاله: عصاره یا برگزیده بیرون‌کشیده‌شده.">يَتَسَلَّلونَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="لِواذًا" data-root="ل و ذ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-dh/" data-root-meaning="پناه گرفتن و پشت چیزی یا کسی پنهان شدن.">لِواذًا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَليَحذَرِ" data-root="ح ذ ر" data-learn-more="/quran-terminology/fa/roots/h-dh-r/" data-root-meaning="احتیاط، پرهیز، بیداری در برابر خطر، ترس آگاهانه از آسیب، و مراقبت عملی پیش از وقوع ضرر">فَليَحذَرِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُخالِفونَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">يُخالِفونَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرِهِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرِهِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُصيبَهُم" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">تُصيبَهُم</button>
    <button class="word-link" type="button" data-word="فِتنَةٌ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">فِتنَةٌ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يُصيبَهُم" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">يُصيبَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد">أَليمٌ</button>
  </p>
  <p class="farsi-verse">فراخوان رسول را در میان خود مانند فراخوان برخی از شما به برخی دیگر قرار ندهید. آن معبود یگانه کسانی از شما را که پناه‌جویانه پنهانی می‌گریزند می‌داند. پس کسانی که از فرمان او سرپیچی می‌کنند، بترسند که آزمونی به آنان برسد یا عذابی دردناک به آنان برسد.</p>
</section>
