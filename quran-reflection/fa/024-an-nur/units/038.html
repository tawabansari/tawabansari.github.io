  <p class="farsi-verse">تا آن معبود یگانه به بهترین آنچه انجام داده‌اند پاداششان دهد و از فضل خود بر آنان بیفزاید؛ و آن معبود یگانه هرکه را بخواهد بی‌حساب روزی می‌دهد.</p>
