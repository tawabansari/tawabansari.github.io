  <p class="farsi-verse">و کسانی که به همسرانشان اتهام می‌زنند و جز خودشان گواهانی ندارند، پس گواهی هر یک از آنان چهار گواهی به آن معبود یگانه است که بی‌گمان او از راستگویان است،</p>
