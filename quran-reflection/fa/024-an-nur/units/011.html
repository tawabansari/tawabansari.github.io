  <p class="farsi-verse">بی‌گمان کسانی که آن بهتان را آوردند گروهی از شمایند. آن را برای خود بد مپندارید؛ بلکه برای شما خیر است. برای هرکس از آنان چیزی است که از گناه کسب کرده است؛ و آن کس از آنان که بخش بزرگ آن را بر عهده گرفت، برای او عذابی بزرگ است.</p>
