<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالقَوٰعِدُ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار؛ و قواعد، پایه‌های بنا یا در کاربردی جداگانه زنان سالخورده." data-context="زنان سالخورده؛ گروهی که در ادامه با امید نداشتن به ازدواج توصیف می‌شوند.">وَالقَوٰعِدُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن" data-context="زنان؛ گروه انسانیِ مخاطب این حکم.">النِّساءِ</button>
    <button class="word-link" type="button" data-word="الّٰتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الّٰتى</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="ر ج و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ نیز کناره و جانب؛ تأخیر انداختن در برخی صورت‌ها با «رجأ» بررسی می‌شود." data-context="امید و انتظار دارند؛ با «لا»، دیگر امید یا انتظار ازدواج ندارند.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="نِكاحًا" data-root="ن ك ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-k-h/" data-root-meaning="نکاح: پیوند زناشویی یا آمیزش، با توجه به ساخت و سیاق." data-context="ازدواج؛ چیزی که این زنان دیگر امید یا انتظار آن را ندارند.">نِكاحًا</button>
    <button class="word-link" type="button" data-word="فَلَيسَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَيسَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِنَّ</button>
    <button class="word-link" type="button" data-word="جُناحٌ" data-root="ج ن ح" data-root-meaning="بال، پهلو، متمایل شدن و گناه؛ از حرکت پرنده و فروتنی انسان تا «لا جناح» در احکام قرآن و گرایش به صلح" data-learn-more="/quran-terminology/fa/roots/j-n-h/" data-context="گناه و سرزنشی؛ در ساخت نفی، در شرایط بیان‌شده گناهی بر آنان نیست.">جُناحٌ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَضَعنَ" data-root="و ض ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dad-ayn/" data-root-meaning="نهادن و پایین گذاشتن؛ وضع حمل: زایمان؛ ایضاع: شتاب در حرکت." data-context="کنار بگذارند؛ دربارهٔ جامه‌هایشان در چارچوب شرط آیه.">يَضَعنَ</button>
    <button class="word-link" type="button" data-word="ثِيابَهُنَّ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه؛ و در شاخهٔ دیگر، ثوب و ثیاب به معنای جامه و لباس." data-context="جامه‌هایشان؛ نوع و اندازهٔ پوشش باید در سیاق بررسی شود و از این واژه به‌تنهایی تعیین نمی‌شود.">ثِيابَهُنَّ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="بی‌آنکه؛ نفیِ حالت جلوه‌گری در ترکیب حالیِ بعدی.">غَيرَ</button>
    <button class="word-link" type="button" data-word="مُتَبَرِّجٰتٍ" data-root="ب ر ج" data-root-meaning="برجستگی و آشکار بودن؛ بُرج، بنای بلند و محافظت‌شده یا جایگاه آسمانی؛ و تبرّج، جلوه‌گری و نمایان ساختن زینت و زیبایی." data-learn-more="/quran-terminology/fa/roots/b-r-j/" data-context="جلوه‌گرانِ زینت؛ پس از «غیر»، بی‌آنکه زینتی را به نمایش بگذارند.">مُتَبَرِّجٰتٍ</button>
    <button class="word-link" type="button" data-word="بِزينَةٍ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="با زینت؛ آنچه در این ترکیب از به نمایش گذاشتن آن پرهیز می‌شود.">بِزينَةٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَن</button>
    <button class="word-link" type="button" data-word="يَستَعفِفنَ" data-root="ع ف ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-f-f/" data-root-meaning="خویشتن‌داری در برابر میل یا درخواست و حفظ پاکدامنی." data-context="خویشتن‌داری کنند؛ رفتاری که در پایانِ این اجازه بهتر معرفی می‌شود.">يَستَعفِفنَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ بیان ترجیح خویشتن‌داری برای آنان.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَهُنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُنَّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="سَميعٌ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="شنوا؛ وصف آن معبود یگانه در پایان آیه.">سَميعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصف آن معبود یگانه در پایان آیه.">عَليمٌ</button>
  </p>
  <p class="farsi-verse">و زنان سالخورده‌ای که امید نکاح ندارند، بر آنان گناهی نیست که جامه‌های خود را فرو نهند، بی‌آنکه زینتی به نمایش بگذارند؛ و اگر خویشتن‌داری کنند برایشان بهتر است. و آن معبود یگانه شنوا و داناست.</p>
</section>
