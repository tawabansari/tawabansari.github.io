<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَولا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="سَمِعتُموهُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="آن را شنیدید؛ شنیدن خبر بهتان از سوی مخاطبان.">سَمِعتُموهُ</button>
    <button class="word-link" type="button" data-word="ظَنَّ" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد" data-context="گمان برد؛ درباره گمان نیک مؤمنان به یکدیگر.">ظَنَّ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مردان مؤمن؛ مخاطبانِ انتظارِ گمان نیک.">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤمِنٰتُ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="و زنان مؤمن؛ همراه مردان مؤمن.">وَالمُؤمِنٰتُ</button>
    <button class="word-link" type="button" data-word="بِأَنفُسِهِم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="درباره خودشان و یکدیگر؛ در پیوند اجتماعی مؤمنان.">بِأَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="نیکی؛ گمان نیک مردان و زنان مؤمن درباره خود و یکدیگر.">خَيرًا</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفتند؛ معرفی گفتار نقل‌شده در آیه.">وَقالوا</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِفكٌ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="بهتان؛ اتهام ناراستی که انتظار می‌رود مؤمنان آن را آشکارا رد کنند.">إِفكٌ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار و روشن؛ وصفِ بهتان یا سحرِ ادعاشده در سیاق.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">چرا هنگامی که آن را شنیدید، مردان و زنان مؤمن درباره خود گمان نیک نبردند و نگفتند: این بهتانی آشکار است؟</p>
</section>
