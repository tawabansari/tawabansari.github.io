  </p>
  <p class="farsi-verse">و با سخت‌ترین سوگندهایشان به آن معبود یگانه سوگند خوردند که اگر به آنان فرمان دهی، بی‌گمان بیرون می‌روند. بگو: سوگند نخورید؛ اطاعتی شناخته‌شده. بی‌گمان آن معبود یگانه به آنچه انجام می‌دهید آگاه است.</p>
