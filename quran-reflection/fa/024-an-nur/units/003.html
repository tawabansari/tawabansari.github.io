  <p class="farsi-verse">مرد زناکار جز با زن زناکار یا زن مشرک نکاح نمی‌کند، و با زن زناکار جز مرد زناکار یا مرد مشرک نکاح نمی‌کند؛ و این بر مؤمنان حرام شده است.</p>
