  <p class="arabic-text">

    <button class="word-link" type="button" data-word="يَرمونَ" data-root="ر م ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَرمونَ</button>

    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>

    <button class="word-link" type="button" data-word="شُهَداءَ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">شُهَداءَ</button>
    <button class="word-link" type="button" data-word="فَاجلِدوهُم" data-root="ج ل د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَاجلِدوهُم</button>

    <button class="word-link" type="button" data-word="أَبَدًا" data-root="أ ب د" data-learn-more="/quran-terminology/fa/roots/a-b-d/" data-root-meaning="أَبَدًا؛ استمرار در سراسر آیندهٔ مورد نظر">أَبَدًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>

    <button class="word-link" type="button" data-word="الفٰسِقونَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن">الفٰسِقونَ</button>
  </p>
  <p class="farsi-verse">و کسانی که به زنان پاکدامن اتهام می‌زنند، سپس چهار گواه نمی‌آورند، آنان را هشتاد تازیانه بزنید و هرگز گواهی‌شان را نپذیرید؛ و آنان همان نافرمانان‌اند،</p>
</section>
