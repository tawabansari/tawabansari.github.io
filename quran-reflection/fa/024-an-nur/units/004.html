<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يَرمونَ" data-root="ر م ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-m-y/" data-root-meaning="افکندن و پرتاب کردن؛ مجازاً نسبت و اتهام دادن." data-context="اتهام می‌زنند؛ نسبت دادن جرم جنسی به زنانِ توصیف‌شده در آیه.">يَرمونَ</button>
    <button class="word-link" type="button" data-word="المُحصَنٰتِ" data-root="ح ص ن" data-root-meaning="ریشهٔ «ح ص ن» در عربی بر حفاظت، پاسداری و مصون قرار دادن چیزی در برابر دسترسی یا تعرض دلالت دارد. «حِصْن» جایگاهی است که از آنچه درون آن است محافظت می‌کند؛ «تحصین» عمل استوار و محفوظ ساختن است؛ و «احصان» می‌تواند در زمینه‌های مادی، رفتاری و اجتماعی به کار رود." data-context="زنان پاکدامن؛ کسانی که موضوع اتهام قرار گرفته‌اند." data-learn-more="/quran-terminology/fa/roots/h-sad-n/">المُحصَنٰتِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَأتوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="بیاورند؛ در نفیِ آوردن چهار گواه.">يَأتوا</button>
    <button class="word-link" type="button" data-word="بِأَربَعَةِ" data-root="ر ب ع" data-learn-more="/quran-terminology/fa/roots/r-b-ayn/" data-root-meaning="چهار، چهارگانه، یک‌چهارم، چهل و میدان معناییِ شمارش و بخش‌بندی" data-context="چهار؛ شمار گواهانِ مورد مطالبه.">بِأَربَعَةِ</button>
    <button class="word-link" type="button" data-word="شُهَداءَ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهان؛ چهار شاهدی که اتهام‌زنندگان نیاورده‌اند.">شُهَداءَ</button>
    <button class="word-link" type="button" data-word="فَاجلِدوهُم" data-root="ج ل د" data-root-meaning="پوست و پوشش بیرونی بدن؛ استواری و توان تحمل؛ و در کاربرد فعلیِ مربوط، تازیانه زدن." data-context="آنان را تازیانه بزنید؛ فرمان دربارهٔ اتهام‌زنندگانِ توصیف‌شده در آیه." data-learn-more="/quran-terminology/fa/roots/j-l-d/">فَاجلِدوهُم</button>
    <button class="word-link" type="button" data-word="ثَمٰنينَ" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود" data-context="هشتاد؛ شمار ضربه‌های تازیانه.">ثَمٰنينَ</button>
    <button class="word-link" type="button" data-word="جَلدَةً" data-root="ج ل د" data-root-meaning="پوست و پوشش بیرونی بدن؛ استواری و توان تحمل؛ و در کاربرد فعلیِ مربوط، تازیانه زدن." data-context="یک ضربهٔ تازیانه؛ واحد شمارش در «هشتاد تازیانه»." data-learn-more="/quran-terminology/fa/roots/j-l-d/">جَلدَةً</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَقبَلوا" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="بپذیرید؛ در نهیِ پذیرفتن گواهی آن اشخاص.">تَقبَلوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="شَهٰدَةً" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواهی؛ آنچه آیه از پذیرفتنش نهی می‌کند.">شَهٰدَةً</button>
    <button class="word-link" type="button" data-word="أَبَدًا" data-root="أ ب د" data-learn-more="/quran-terminology/fa/roots/a-b-d/" data-root-meaning="أَبَدًا؛ استمرار در سراسر آیندهٔ مورد نظر" data-context="هرگز؛ بیان استمرارِ نپذیرفتن گواهی در همین عبارت.">أَبَدًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الفٰسِقونَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن" data-context="نافرمانان؛ وصف اتهام‌زنندگانِ معرفی‌شده.">الفٰسِقونَ</button>
  </p>
  <p class="farsi-verse">و کسانی که به زنان پاکدامن اتهام می‌زنند، سپس چهار گواه نمی‌آورند، آنان را هشتاد تازیانه بزنید و هرگز گواهی‌شان را نپذیرید؛ و آنان همان نافرمانان‌اند،</p>
</section>
