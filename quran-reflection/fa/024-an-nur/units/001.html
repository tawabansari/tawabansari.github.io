<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سورَةٌ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد">سورَةٌ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰها" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">أَنزَلنٰها</button>
    <button class="word-link" type="button" data-word="وَفَرَضنٰها" data-root="ف ر ض" data-learn-more="/quran-terminology/fa/roots/f-r-dad/" data-root-meaning="از نشانه‌گذاری و تعیین سهم تا امر مقرر">وَفَرَضنٰها</button>
    <button class="word-link" type="button" data-word="وَأَنزَلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">وَأَنزَلنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="ءايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتٍ</button>
    <button class="word-link" type="button" data-word="بَيِّنٰتٍ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَيِّنٰتٍ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَذَكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">تَذَكَّرونَ</button>
  </p>
  <p class="farsi-verse">سوره‌ای است که آن را فرو فرستادیم و مقرر کردیم، و در آن آیات روشنی فرو فرستادیم، باشد که یادآور شوید.</p>
</section>
