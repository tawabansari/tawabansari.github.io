  <p class="farsi-verse">آیا ندیده‌ای که هرکه در آسمان‌ها و زمین است و پرندگان بال‌گشوده، آن معبود یگانه را تسبیح می‌گویند؟ هرکدام صلات و تسبیح خود را دانسته است؛ و آن معبود یگانه به آنچه انجام می‌دهند داناست.</p>
