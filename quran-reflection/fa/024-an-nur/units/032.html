<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنكِحُوا" data-root="ن ك ح" data-learn-more="/quran-terminology/fa/roots/n-k-h/" data-root-meaning="ازدواج و برقراری پیوند همسری؛ به ازدواج درآوردن یا خواستن ازدواج، بسته به ساخت؛ کاربرد آمیزش نیز در عربی ثبت شده است." data-context="به ازدواج درآورید یا زمینه ازدواج را فراهم کنید؛ فعل امر باب افعال درباره ازدواج دیگران.">وَأَنكِحُوا</button>
    <button class="word-link" type="button" data-word="الأَيٰمىٰ" data-root="أ ي م" data-learn-more="/quran-terminology/fa/roots/a-y-m/" data-context="افراد بی‌همسر؛ زن یا مردِ بدون همسر، نه تنها زنان بیوه؛ از ریشه أ ي م و متمایز از إماء." data-root-meaning="زن یا مردی که همسر ندارد؛ بدون تعیین سابقه یا علتِ بی‌همسری.">الأَيٰمىٰ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَالصّٰلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایستگان؛ در یک خوانش درستکاران و در خوانشی دیگر، افراد مناسب و آماده برای ازدواج.">وَالصّٰلِحينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِكُم" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه؛ و در کاربرد انسانی، بردگی و زیر سلطه بودن." data-context="مردان برده تحت مالکیت شما؛ در این سیاق و در کنار «إمائكم»، نه صرفا بندگان آن معبود یگانه.">عِبادِكُم</button>
    <button class="word-link" type="button" data-word="وَإِمائِكُم" data-root="أ م و" data-learn-more="/quran-terminology/fa/roots/a-m-w/" data-root-meaning="زن در وضعیت بردگی و تحت مالکیت انسانی دیگر، در برابر زن آزاد؛ بدون آنکه این عنوان به خودی خود درباره ایمان، شخصیت، اخلاق یا توانایی او داوری کند." data-context="و زنان برده تحت مالکیت شما؛ جمع مجرور با ضمیر «شما»، در فرمان فراهم ساختن ازدواج؛ نه به معنای همسران شما.">وَإِمائِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="اگر تنگدست باشند؛ فعلِ شرط درباره کسانی که ازدواجشان مطرح است.">يَكونوا</button>
    <button class="word-link" type="button" data-word="فُقَراءَ" data-root="ف ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-r/" data-root-meaning="نیاز و تهیدستی؛ فاقره: گرفتاری کمرشکن." data-context="تنگدستان؛ وضعیت مالی اشخاص، متمایز از وضعیت بردگی یا بی‌همسری.">فُقَراءَ</button>
    <button class="word-link" type="button" data-word="يُغنِهِمُ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="آنان را بی‌نیاز می‌گرداند؛ گشایش از فضل آن معبود یگانه، بدون تعیین مقدار و تاریخ آن در همین آیه.">يُغنِهِمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="از فضل و بخشش او؛ سرچشمه گشایشِ بیان‌شده در جمله.">فَضلِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="وٰسِعٌ" data-root="و س ع" data-learn-more="/quran-terminology/fa/roots/w-s-ayn/" data-root-meaning="از فراخی مکان تا گنجایش، توان و فراگیری" data-context="دارای گشایش و فضل گسترده؛ وصف آن معبود یگانه در پایان آیه.">وٰسِعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصف آن معبود یگانه در کنار «واسع».">عَليمٌ</button>
  </p>
  <p class="farsi-verse">و بی‌همسران خود و شایستگان از بندگان و کنیزان خود را به نکاح درآورید. اگر نیازمند باشند، آن معبود یگانه از فضل خود بی‌نیازشان می‌کند؛ و آن معبود یگانه گشایشگر و داناست.</p>
</section>
