<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنكِحُوا" data-root="ن ك ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَنكِحُوا</button>
    <button class="word-link" type="button" data-word="الأَيٰمىٰ" data-root="أ ي م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَيٰمىٰ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَالصّٰلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">وَالصّٰلِحينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِكُم" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عِبادِكُم</button>
    <button class="word-link" type="button" data-word="وَإِمائِكُم" data-root="أ م و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَإِمائِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكونوا</button>
    <button class="word-link" type="button" data-word="فُقَراءَ" data-root="ف ق ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فُقَراءَ</button>
    <button class="word-link" type="button" data-word="يُغنِهِمُ" data-root="غ ن ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُغنِهِمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده.">فَضلِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="وٰسِعٌ" data-root="و س ع" data-learn-more="/quran-terminology/fa/roots/w-s-ayn/" data-root-meaning="از فراخی مکان تا گنجایش، توان و فراگیری">وٰسِعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَليمٌ</button>
  </p>
  <p class="farsi-verse">و بی‌همسران خود و شایستگان از بندگان و کنیزان خود را به نکاح درآورید. اگر نیازمند باشند، آن معبود یگانه از فضل خود بی‌نیازشان می‌کند؛ و آن معبود یگانه گشایشگر و داناست.</p>
</section>
