  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، به خانه‌هایی جز خانه‌های خود وارد نشوید تا آشنایی و پذیرش بجویید و بر اهل آن سلام کنید. این برای شما بهتر است، باشد که یادآور شوید.</p>
