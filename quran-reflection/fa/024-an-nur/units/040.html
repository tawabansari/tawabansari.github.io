  </p>
  <p class="farsi-verse">یا چون تاریکی‌هایی در دریایی ژرف، که موجی آن را می‌پوشاند، بالای آن موجی و بالای آن ابری است؛ تاریکی‌هایی بر فراز یکدیگر. چون دستش را بیرون آورد، به‌سختی آن را می‌بیند؛ و هرکه را آن معبود یگانه نوری قرار ندهد، هیچ نوری برای او نیست.</p>
