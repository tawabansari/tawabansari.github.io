  <p class="farsi-verse">بگو: آن معبود یگانه را اطاعت کنید و رسول را اطاعت کنید. پس اگر روی بگردانید، بر او تنها چیزی است که بر عهده‌اش گذاشته شده، و بر شما چیزی است که بر عهده‌تان گذاشته شده است. و اگر او را اطاعت کنید، هدایت می‌شوید؛ و بر رسول جز رساندن آشکار نیست.</p>
