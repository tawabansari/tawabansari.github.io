<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الخَبيثٰتُ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="ناپاک‌ها؛ جمع مؤنث با دو خوانشِ زنان یا گفتار و کردار ناپاک.">الخَبيثٰتُ</button>
    <button class="word-link" type="button" data-word="لِلخَبيثينَ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="برای ناپاکان؛ جمع مذکر برای اشخاصِ ناشایست.">لِلخَبيثينَ</button>
    <button class="word-link" type="button" data-word="وَالخَبيثونَ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="و ناپاکان؛ اشخاصِ ناشایست در این تقابل.">وَالخَبيثونَ</button>
    <button class="word-link" type="button" data-word="لِلخَبيثٰتِ" data-root="خ ب ث" data-learn-more="/quran-terminology/fa/roots/kh-b-th/" data-root-meaning="خبیث در معنای پایه، چیزی است که از جهت کیفیت، اثر، رفتار یا ارزش، نامطلوب و ناشایست است." data-context="برای ناپاک‌ها؛ همان جمع مؤنث با دو خوانشِ یادشده.">لِلخَبيثٰتِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالطَّيِّبٰتُ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="و پاک‌ها؛ جمع مؤنث با دو خوانشِ زنان یا گفتار و کردار پاک.">وَالطَّيِّبٰتُ</button>
    <button class="word-link" type="button" data-word="لِلطَّيِّبينَ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="برای پاکان؛ جمع مذکر برای اشخاصِ شایسته.">لِلطَّيِّبينَ</button>
    <button class="word-link" type="button" data-word="وَالطَّيِّبونَ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="و پاکان؛ اشخاصِ شایسته در این تقابل.">وَالطَّيِّبونَ</button>
    <button class="word-link" type="button" data-word="لِلطَّيِّبٰتِ" data-root="ط ي ب" data-learn-more="/quran-terminology/fa/roots/tt-y-b/" data-root-meaning="پاک، خوش، گوارا، پسندیده و سازگار در سیاق خود؛ در برابر آنچه خبیث، ناپاک، زیان‌آور یا ناخوشایند است." data-context="برای پاک‌ها؛ همان جمع مؤنث با دو خوانشِ یادشده.">لِلطَّيِّبٰتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="مُبَرَّءونَ" data-root="ب ر أ" data-learn-more="/quran-terminology/fa/roots/b-r-a/" data-root-meaning="پدیدآوردن، رهاشدن از بیماری یا نسبت، پاک‌بودن از اتهام، و اعلام برائت" data-context="مبرا و پاک از نسبتِ ناروا؛ به‌ناحق متهم شده‌اند.">مُبَرَّءونَ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ نسبت‌ها و سخنانی که دربارهٔ آنان بیان می‌شود.">يَقولونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="مَغفِرَةٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند." data-context="آمرزش؛ آنچه برای این مبراشدگان وعده داده شده است.">مَغفِرَةٌ</button>
    <button class="word-link" type="button" data-word="وَرِزقٌ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="و روزی؛ بهره و عطایی که برای آنان است.">وَرِزقٌ</button>
    <button class="word-link" type="button" data-word="كَريمٌ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی." data-context="گرامی و ارجمند؛ وصفِ روزیِ وعده‌شده.">كَريمٌ</button>
  </p>
  <p class="farsi-verse">ناپاک‌ها برای ناپاکان‌اند و ناپاکان برای ناپاک‌ها؛ و پاکیزه‌ها برای پاکیزگان‌اند و پاکیزگان برای پاکیزه‌ها. آنان از آنچه می‌گویند مبرا هستند؛ برایشان آمرزش و روزی ارجمندی است.</p>
</section>
