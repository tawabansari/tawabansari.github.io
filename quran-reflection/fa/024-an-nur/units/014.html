<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَولا</button>
    <button class="word-link" type="button" data-word="فَضلُ" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="فضل و بخشش خداوند که مانع رسیدن عذاب یادشده شد.">فَضلُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="وَرَحمَتُهُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="و رحمت او بر شما؛ در دنیا و آخرت.">وَرَحمَتُهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="زندگی این‌جهانی؛ یکی از دو عرصهٔ فضل و رحمت یادشده.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَالـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="و آخرت؛ زندگی پسین در کنار دنیا.">وَالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="لَمَسَّكُم" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="بی‌گمان به شما می‌رسید؛ دربارهٔ عذابِ ناشی از گفتار یادشده.">لَمَسَّكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَفَضتُم" data-root="ف ي ض" data-root-meaning="روان شدن و به جریان افتادن؛ گاه همراه با فراوانی و سرریز؛ و در کاربردهای گسترده‌تر، حرکت جمعی یا پیش رفتن در گفتار و فعالیت." data-context="به آن موضوع پرداختید و گفتار را در آن گسترش دادید؛ در سیاق اتهام و سخن بی‌پشتوانه." data-learn-more="/quran-terminology/fa/roots/f-y-dad/">أَفَضتُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب و کیفر؛ پیامد گفتار و رفتاری که آیه نکوهش می‌کند.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ و سنگین؛ وصفِ عذاب یادشده.">عَظيمٌ</button>
  </p>
  <p class="farsi-verse">و اگر فضل آن معبود یگانه و رحمتش در دنیا و آخرت بر شما نبود، در آنچه وارد شدید عذابی بزرگ به شما می‌رسید،</p>
</section>
