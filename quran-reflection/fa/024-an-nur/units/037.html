<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۳7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رِجالٌ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه.">رِجالٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُلهيهِم" data-root="ل ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h2-w/" data-root-meaning="سرگرمی بازدارنده از امر مهم؛ الهاء: مشغول و غافل کردن.">تُلهيهِم</button>
    <button class="word-link" type="button" data-word="تِجٰرَةٌ" data-root="ت ج ر" data-learn-more="/quran-terminology/fa/roots/t-j-r/" data-root-meaning="ورود به دادوستد و به گردش درآوردن مال یا سرمایه برای طلب ربح و منفعت.">تِجٰرَةٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="بَيعٌ" data-root="ب ي ع" data-learn-more="/quran-terminology/fa/roots/b-y-ayn/" data-root-meaning="فروختن، خرید و فروش کردن، واگذار کردن چیزی در برابر عوض، و انجام معامله روشن میان دو طرف">بَيعٌ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">ذِكرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَإِقامِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَإِقامِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةِ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="وَإيتاءِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَإيتاءِ</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةِ" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">الزَّكوٰةِ</button>
    ۙ
    <button class="word-link" type="button" data-word="يَخافونَ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">يَخافونَ</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومًا</button>
    <button class="word-link" type="button" data-word="تَتَقَلَّبُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">تَتَقَلَّبُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="القُلوبُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">القُلوبُ</button>
    <button class="word-link" type="button" data-word="وَالأَبصٰرُ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">وَالأَبصٰرُ</button>
  </p>
  <p class="farsi-verse">مردانی که نه تجارت و نه خریدوفروش آنان را از یاد آن معبود یگانه و برپاداشتن صلات و دادن زکات بازنمی‌دارد؛ از روزی می‌ترسند که در آن دل‌ها و چشم‌ها دگرگون می‌شوند،</p>
</section>
