  <p class="farsi-verse">زن زناکار و مرد زناکار، هر یک را صد تازیانه بزنید؛ و در دین آن معبود یگانه نسبت به آن دو دلسوزی شما را نگیرد، اگر به آن معبود یگانه و روز واپسین ایمان دارید؛ و گروهی از مؤمنان شاهد عذاب آن دو باشند.</p>
