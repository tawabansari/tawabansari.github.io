<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الزّانِيَةُ" data-root="ز ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-n-y/" data-root-meaning="رابطه جنسی نامشروع؛ زنا و زن یا مرد مرتکب آن." data-context="زن زناکار؛ یکی از دو شخص موضوع فرمان آیه.">الزّانِيَةُ</button>
    <button class="word-link" type="button" data-word="وَالزّانى" data-root="ز ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-n-y/" data-root-meaning="رابطه جنسی نامشروع؛ زنا و زن یا مرد مرتکب آن." data-context="و مرد زناکار؛ شخص دوم در موضوع فرمان.">وَالزّانى</button>
    <button class="word-link" type="button" data-word="فَاجلِدوا" data-root="ج ل د" data-root-meaning="پوست و پوشش بیرونی بدن؛ استواری و توان تحمل؛ و در کاربرد فعلیِ مربوط، تازیانه زدن." data-context="تازیانه بزنید؛ فعل امر که شمار ضربه‌های آن در ادامهٔ عبارت آمده است." data-learn-more="/quran-terminology/fa/roots/j-l-d/">فَاجلِدوا</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ در عبارت «هر یک از آن دو».">كُلَّ</button>
    <button class="word-link" type="button" data-word="وٰحِدٍ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یک؛ در ساخت «هر یک از آن دو».">وٰحِدٍ</button>
    <button class="word-link" type="button" data-word="مِنهُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُما</button>
    <button class="word-link" type="button" data-word="مِا۟ئَةَ" data-root="م أ ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-a-y/" data-root-meaning="عدد صد و صورت‌های وابسته آن." data-context="صد؛ شمار ضربه‌های تازیانه در فرمان آیه.">مِا۟ئَةَ</button>
    <button class="word-link" type="button" data-word="جَلدَةٍ" data-root="ج ل د" data-root-meaning="پوست و پوشش بیرونی بدن؛ استواری و توان تحمل؛ و در کاربرد فعلیِ مربوط، تازیانه زدن." data-context="یک ضربهٔ تازیانه؛ واحدِ شمارش در ترکیب «صد تازیانه»، نه قطعه‌ای از پوست." data-learn-more="/quran-terminology/fa/roots/j-l-d/">جَلدَةٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَأخُذكُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="شما را بگیرد؛ در نهیِ اینکه رأفت نسبت به آن دو مانع اجرای فرمان شود.">تَأخُذكُم</button>
    <button class="word-link" type="button" data-word="بِهِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِما</button>
    <button class="word-link" type="button" data-word="رَأفَةٌ" data-root="ر أ ف" data-learn-more="/quran-terminology/fa/roots/r-a-f/" data-root-meaning="رأفت و رئوف؛ دلسوزی، مهربانی و رعایت حال دیگری، از عاطفه انسانی تا وصف آن معبود یگانه و نبی در قرآن" data-context="رأفت و دلسوزی؛ حالتی که آیه دربارهٔ تاثیر آن بر اجرای فرمان سخن می‌گوید.">رَأفَةٌ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="دينِ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دین؛ در ترکیب «دین آن معبود یگانه».">دينِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="هستید؛ در شرط «اگر ایمان دارید».">كُنتُم</button>
    <button class="word-link" type="button" data-word="تُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان دارید؛ در شرطِ ایمان به آن معبود یگانه و روز واپسین.">تُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَاليَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روز؛ در ترکیب «روز واپسین».">وَاليَومِ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="واپسین؛ وصف روز در ترکیب «روز واپسین».">الـٔاخِرِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَليَشهَد" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="و باید شاهد باشند؛ فرمانِ حضور گروهی از مؤمنان به‌عنوان شاهد.">وَليَشهَد</button>
    <button class="word-link" type="button" data-word="عَذابَهُما" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب یا مجازات آن دو؛ آنچه گروهی از مؤمنان شاهدش می‌شوند.">عَذابَهُما</button>
    <button class="word-link" type="button" data-word="طائِفَةٌ" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل" data-context="گروهی؛ بخشی از مؤمنان که شاهد مجازات می‌شوند.">طائِفَةٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمنان؛ گروه شاهد از میان آنان است.">المُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">زن زناکار و مرد زناکار، هر یک را صد تازیانه بزنید؛ و در دین آن معبود یگانه نسبت به آن دو دلسوزی شما را نگیرد، اگر به آن معبود یگانه و روز واپسین ایمان دارید؛ و گروهی از مؤمنان شاهد عذاب آن دو باشند.</p>
</section>
