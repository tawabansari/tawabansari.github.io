<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">النور ۲۴:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالخٰمِسَةَ" data-root="خ م س" data-root-meaning="عدد پنج؛ شمار پنج‌تایی، جایگاه پنجم و نسبت یک‌پنجم از یک مجموعه." data-context="و پنجمین گواهی؛ در ترتیب گواهی‌های زن." data-learn-more="/quran-terminology/fa/roots/kh-m-s/">وَالخٰمِسَةَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="غَضَبَ" data-root="غ ض ب" data-learn-more="/quran-terminology/fa/roots/gh-dad-b/" data-root-meaning="شدت ناخشنودی و واکنش در برابر امر ناپذیرفتنی" data-context="خشم؛ موضوعِ پنجمین گواهی زن اگر مرد راستگو باشد.">غَضَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ شرطِ راستگو بودنِ مرد در این اتهام.">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راستگویان؛ دربارهٔ صدقِ ادعای مرد.">الصّٰدِقينَ</button>
  </p>
  <p class="farsi-verse">و پنجمین اینکه خشم آن معبود یگانه بر او باشد، اگر او از راستگویان باشد.</p>
</section>
