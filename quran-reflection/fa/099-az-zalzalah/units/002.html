<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">الزلزلة ۹۹:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَخرَجَتِ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">وَأَخرَجَتِ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضُ</button>
    <button class="word-link" type="button" data-word="أَثقالَها" data-root="ث ق ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَثقالَها</button>
  </p>
  <p class="farsi-verse">و زمین بارهای سنگینش را بیرون آورد،</p>
</section>
