<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">الزلزلة ۹۹:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="زُلزِلَتِ" data-root="ز ل ز ل" data-root-meaning="لرزاندن و تکان شدید؛ برهم زدن حالت ثبات و قرار، چه در جهان محسوس و چه در وضعیت انسان." data-context="به لرزه درآید؛ فعل مجهولی که زمین، نائب فاعلِ آن است." data-learn-more="/quran-terminology/fa/roots/z-l-z-l/">زُلزِلَتِ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ در این آیه نائب فاعلِ فعلِ لرزانده شدن است.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="زِلزالَها" data-root="ز ل ز ل" data-root-meaning="لرزاندن و تکان شدید؛ برهم زدن حالت ثبات و قرار، چه در جهان محسوس و چه در وضعیت انسان." data-context="لرزش خود؛ مصدرِ تأکیدی با ضمیری که به زمین بازمی‌گردد." data-learn-more="/quran-terminology/fa/roots/z-l-z-l/">زِلزالَها</button>
  </p>
  <p class="farsi-verse">هنگامی که زمین با لرزش خود به لرزه درآید،</p>
</section>
