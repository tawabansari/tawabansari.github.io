<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الزلزلة ۹۹:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَصدُرُ" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/">يَصدُرُ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسُ</button>
    <button class="word-link" type="button" data-word="أَشتاتًا" data-root="ش ت ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَشتاتًا</button>
    <button class="word-link" type="button" data-word="لِيُرَوا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">لِيُرَوا</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">أَعمٰلَهُم</button>
  </p>
  <p class="farsi-verse">آن روز مردم پراکنده بیرون می‌آیند تا کارهایشان به آنان نشان داده شود.</p>
</section>
