  <p class="farsi-verse">به‌راستی آن معبود یگانه از مؤمنان خشنود شد، آنگاه که زیر آن درخت با تو بیعت می‌کردند؛ پس آنچه را در دل‌هایشان بود دانست و آرامش را بر آنان فروفرستاد و گشایشی نزدیک به آنان پاداش داد،</p>
