  <p class="farsi-verse">چون برای گرفتن غنیمت‌ها روانه شوید، بازماندگان خواهند گفت: بگذارید از شما پیروی کنیم. می‌خواهند سخن آن معبود یگانه را تغییر دهند. بگو: هرگز از ما پیروی نخواهید کرد؛ آن معبود یگانه پیش‌تر چنین گفته است. پس خواهند گفت: بلکه به ما حسد می‌ورزید. بلکه جز اندکی نمی‌فهمیدند.</p>
