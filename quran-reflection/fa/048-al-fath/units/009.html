<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الفتح ۴۸:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِتُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">لِتُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَرَسولِهِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَرَسولِهِ</button>
    <button class="word-link" type="button" data-word="وَتُعَزِّروهُ" data-root="ع ز ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-z-r/" data-root-meaning="پشتیبانی همراه با بزرگداشت؛ در کاربردهای دیگر، بازداشتن یا تأدیب.">وَتُعَزِّروهُ</button>
    <button class="word-link" type="button" data-word="وَتُوَقِّروهُ" data-root="و ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-r/" data-root-meaning="سنگینی؛ وَقر: سنگینی گوش؛ وِقر: بار؛ توقیر: بزرگداشت.">وَتُوَقِّروهُ</button>
    <button class="word-link" type="button" data-word="وَتُسَبِّحوهُ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">وَتُسَبِّحوهُ</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="ب ك ر" data-learn-more="/quran-terminology/fa/roots/b-k-r/" data-root-meaning="از آغاز روز و پیش‌افتادگی تا باقی بودن در مرحلهٔ نخستین">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَأَصيلًا" data-root="أ ص ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-sad-l/" data-root-meaning="اصل و پایهٔ چیزی؛ و در شاخهٔ زمانی، أصیل و آصال: اواخر روز و هنگام عصر.">وَأَصيلًا</button>
  </p>
  <p class="farsi-verse">تا به آن معبود یگانه و فرستاده‌اش ایمان آورید و او را یاری و بزرگ بدارید و بامداد و شامگاه تسبیحش گویید.</p>
</section>
