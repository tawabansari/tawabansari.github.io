<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الفتح ۴۸:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="لِلمُخَلَّفينَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">لِلمُخَلَّفينَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَعرابِ" data-root="ع ر ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-b/" data-root-meaning="عربی: وابسته به زبان یا مردم عرب؛ اعراب: بادیه‌نشینان؛ عُرُب: مهرورز و دلبسته.">الأَعرابِ</button>
    <button class="word-link" type="button" data-word="سَتُدعَونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">سَتُدعَونَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومٍ</button>
    <button class="word-link" type="button" data-word="أُولى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولى</button>
    <button class="word-link" type="button" data-word="بَأسٍ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">بَأسٍ</button>
    <button class="word-link" type="button" data-word="شَديدٍ" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">شَديدٍ</button>
    <button class="word-link" type="button" data-word="تُقٰتِلونَهُم" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">تُقٰتِلونَهُم</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يُسلِمونَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">يُسلِمونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="تُطيعوا" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">تُطيعوا</button>
    <button class="word-link" type="button" data-word="يُؤتِكُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يُؤتِكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَجرًا" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرًا</button>
    <button class="word-link" type="button" data-word="حَسَنًا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">حَسَنًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَتَوَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">تَتَوَلَّوا</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="تَوَلَّيتُم" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">تَوَلَّيتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلُ</button>
    <button class="word-link" type="button" data-word="يُعَذِّبكُم" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">يُعَذِّبكُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد">أَليمًا</button>
  </p>
  <p class="farsi-verse">به بازماندگان از بادیه‌نشینان بگو: به سوی مردمی سخت‌نیرومند فراخوانده خواهید شد؛ با آنان می‌جنگید یا تسلیم می‌شوند. پس اگر فرمان برید، آن معبود یگانه پاداشی نیک به شما می‌دهد؛ و اگر روی گردانید، همان‌گونه که پیش‌تر روی گرداندید، شما را به عذابی دردناک عذاب می‌کند.</p>
</section>
