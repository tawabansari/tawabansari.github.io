  <p class="farsi-verse">آن معبود یگانه غنیمت‌های فراوانی به شما وعده داده که آنها را می‌گیرید؛ پس این را برایتان پیش انداخت و دست مردم را از شما بازداشت، و تا نشانه‌ای برای مؤمنان باشد و شما را به راهی راست هدایت کند.</p>
