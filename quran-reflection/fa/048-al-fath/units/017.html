<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">الفتح ۴۸:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَيسَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَيسَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَعمىٰ" data-root="ع م ي" data-learn-more="/quran-terminology/fa/roots/ayn-m-y/" data-root-meaning="کوری، نادیدن، پوشیده شدن راه دیدن، ابهام، و از دست رفتن توان مشاهده یا تشخیص" data-context="نابینا؛ یکی از سه گروهی که در این موضوع معذورند.">الأَعمىٰ</button>
    <button class="word-link" type="button" data-word="حَرَجٌ" data-root="ح ر ج" data-root-meaning="تنگنا، فشار و محدودیت؛ گرفتار شدن در دشواری یا مسئولیت." data-context="مؤاخذه بابت ناتوانی ناشی از نابینایی در مسئولیتِ مورد بحث؛ آیه آن را برمی‌دارد." data-learn-more="/quran-terminology/fa/roots/h-r-j/">حَرَجٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَعرَجِ" data-root="ع ر ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-r-j/" data-root-meaning="بالا رفتن؛ معارج: راه‌های صعود؛ اعرج: دارای لنگی." data-context="دارای دشواری در راه رفتن؛ یکی از گروه‌های دارای عذر جسمانی.">الأَعرَجِ</button>
    <button class="word-link" type="button" data-word="حَرَجٌ" data-root="ح ر ج" data-root-meaning="تنگنا، فشار و محدودیت؛ گرفتار شدن در دشواری یا مسئولیت." data-context="مؤاخذه بابت محدودیت حرکت در مسئولیتِ مورد بحث؛ آیه آن را برمی‌دارد." data-learn-more="/quran-terminology/fa/roots/h-r-j/">حَرَجٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="المَريضِ" data-root="م ر ض" data-learn-more="/quran-terminology/fa/roots/m-r-dad/" data-root-meaning="بیماری، سستی، نقصان، و خروج از حالت سلامت و اعتدال" data-context="بیمار؛ سومین گروهِ دارای عذر در آیه.">المَريضِ</button>
    <button class="word-link" type="button" data-word="حَرَجٌ" data-root="ح ر ج" data-root-meaning="تنگنا، فشار و محدودیت؛ گرفتار شدن در دشواری یا مسئولیت." data-context="مؤاخذه بابت ناتوانی ناشی از بیماری در مسئولیتِ مورد بحث؛ آیه آن را برمی‌دارد." data-learn-more="/quran-terminology/fa/roots/h-r-j/">حَرَجٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُطِعِ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="اطاعت کند؛ فرمان‌پذیری نسبت به آن معبود یگانه و رسول او.">يُطِعِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و رسول او؛ همراه با آن معبود یگانه، جهت اطاعت.">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="يُدخِلهُ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="او را وارد می‌کند؛ ورود شخص فرمان‌پذیر به باغ‌ها.">يُدخِلهُ</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغ‌ها؛ جایگاه پاداشِ بیان‌شده در آیه.">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر" data-context="جاری است؛ جریان نهرها در تصویر باغ‌ها.">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="از زیر آن‌ها؛ جایگاه جریان نهرها نسبت به باغ‌ها.">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="نهرها؛ آبراه‌های جاری در تصویر پاداش.">الأَنهٰرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَتَوَلَّ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="روی بگرداند؛ در برابر اطاعت در بخش پیشین آیه.">يَتَوَلَّ</button>
    <button class="word-link" type="button" data-word="يُعَذِّبهُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="او را عذاب می‌کند؛ پیامد روی‌گردانیِ بیان‌شده.">يُعَذِّبهُ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذابی؛ رنج و کیفرِ بیان‌شده در آیه.">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد" data-context="دردناک؛ وصف عذاب در پایان آیه.">أَليمًا</button>
  </p>
  <p class="farsi-verse">بر نابینا تنگنایی نیست و بر لنگ تنگنایی نیست و بر بیمار تنگنایی نیست. و هرکس از آن معبود یگانه و فرستاده‌اش فرمان برد، او را به باغ‌هایی درمی‌آورد که از زیر آنها نهرها روان است؛ و هرکس روی گرداند، او را به عذابی دردناک عذاب می‌کند.</p>
</section>
