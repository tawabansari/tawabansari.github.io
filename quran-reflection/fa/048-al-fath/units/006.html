    <button class="word-link" type="button" data-word="وَساءَت" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/">وَساءَت</button>

  </p>
  <p class="farsi-verse">و مردان و زنان منافق و مردان و زنان مشرک را که به آن معبود یگانه گمان بد می‌برند عذاب کند؛ گردش بدی بر آنان است؛ و آن معبود یگانه بر آنان خشم گرفته و لعنتشان کرده و جهنم را برایشان آماده کرده است؛ و چه بد سرانجامی است.</p>
