  <p class="farsi-verse">آنگاه که کافران در دل‌هایشان تعصب، تعصب جاهلیت را نهادند، آن معبود یگانه آرامش خود را بر فرستاده‌اش و بر مؤمنان فروفرستاد و آنان را به سخن پرهیزگاری پایبند ساخت؛ و آنان به آن سزاوارتر و اهل آن بودند؛ و آن معبود یگانه به هرچیز داناست.</p>
