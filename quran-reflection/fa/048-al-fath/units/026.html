<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الفتح ۴۸:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار دادند و جای دادند؛ دربارهٔ حمیه در دل‌های کفرورزندگان.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ گروهی که حمیهٔ جاهلی را در دل‌های خود قرار دادند.">كَفَروا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِهِمُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌هایشان؛ جایگاه درونی گرایش و تعصب آنان در این آیه.">قُلوبِهِمُ</button>
    <button class="word-link" type="button" data-word="الحَمِيَّةَ" data-root="ح م ي" data-root-meaning="گرما و داغ شدن؛ حفاظت و بازداشتن آسیب یا دسترسی؛ حمیه: غیرت، برانگیختگی و تعصب." data-context="حمیه و برانگیختگی متعصبانه‌ای که کفرورزندگان در دل‌های خود قرار دادند؛ عبارت بعد نوع جاهلی آن را مشخص می‌کند." data-learn-more="/quran-terminology/fa/roots/h-m-y/">الحَمِيَّةَ</button>
    <button class="word-link" type="button" data-word="حَمِيَّةَ" data-root="ح م ي" data-root-meaning="گرما و داغ شدن؛ حفاظت و بازداشتن آسیب یا دسترسی؛ حمیه: غیرت، برانگیختگی و تعصب." data-context="حمیه؛ در ترکیب «حمیة الجاهلیة»، تعصب و برانگیختگی نکوهیده‌ای که در برابر آرامش و تقوا قرار گرفته است." data-learn-more="/quran-terminology/fa/roots/h-m-y/">حَمِيَّةَ</button>
    <button class="word-link" type="button" data-word="الجٰهِلِيَّةِ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه." data-context="جاهلیت؛ وصفی که نوع نکوهیدهٔ حمیه و تعصب گروه مورد سخن را مشخص می‌کند.">الجٰهِلِيَّةِ</button>
    <button class="word-link" type="button" data-word="فَأَنزَلَ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="پس فرود آورد؛ دربارهٔ آرامشی که خدا بر پیامبر و مؤمنان نازل کرد.">فَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="سَكينَتَهُ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="آرامش و ثباتی که از سوی اوست؛ در برابر حمیهٔ جاهلی.">سَكينَتَهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="رَسولِهِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادهٔ او؛ پیامبری که آرامش الهی بر او فرود آمد.">رَسولِهِ</button>
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="مؤمنان؛ ایمان‌آورندگانی که همراه پیامبر از آرامش الهی برخوردار شدند.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَأَلزَمَهُم" data-root="ل ز م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-z-m/" data-root-meaning="ملازمت و جدا نشدن؛ الزام: بر عهده نهادن." data-context="و آنان را پایبند ساخت؛ دربارهٔ پیوند استوار آنان با کلمهٔ تقوا.">وَأَلزَمَهُم</button>
    <button class="word-link" type="button" data-word="كَلِمَةَ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد" data-context="کلمه و سخن؛ در ترکیب «کلمة التقوى»، سخنی که پایبندی آنان به تقوا را بیان می‌کند.">كَلِمَةَ</button>
    <button class="word-link" type="button" data-word="التَّقوىٰ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="تقوا؛ خودنگهداری و مراقبت در برابر آنچه نادرست و آسیب‌زاست.">التَّقوىٰ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بودند؛ وضعیت شایستگی و سزاواری آنان را بیان می‌کند.">وَكانوا</button>
    <button class="word-link" type="button" data-word="أَحَقَّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="سزاوارتر و شایسته‌تر؛ دربارهٔ نسبت آنان با کلمهٔ تقوا.">أَحَقَّ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="وَأَهلَها" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="و اهل و شایستگان آن؛ کسانی که برای آن کلمه سزاوار بودند.">وَأَهلَها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بود و هست؛ در این جمله، دانایی خدا را بیان می‌کند.">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="به هر و همهٔ؛ شمول دانایی نسبت به هر چیز.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیز؛ در «بکل شيء»، هر آنچه موضوع دانایی است.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَليمًا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصف خدا با دانایی به هر چیز.">عَليمًا</button>
  </p>
  <p class="farsi-verse">آنگاه که کافران در دل‌هایشان تعصب، تعصب جاهلیت را نهادند، آن معبود یگانه آرامش خود را بر فرستاده‌اش و بر مؤمنان فروفرستاد و آنان را به سخن پرهیزگاری پایبند ساخت؛ و آنان به آن سزاوارتر و اهل آن بودند؛ و آن معبود یگانه به هرچیز داناست.</p>
</section>
