<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الفتح ۴۸:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَغانِمَ" data-root="غ ن م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَمَغانِمَ</button>
    <button class="word-link" type="button" data-word="كَثيرَةً" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">كَثيرَةً</button>
    <button class="word-link" type="button" data-word="يَأخُذونَها" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">يَأخُذونَها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَزيزًا" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری">عَزيزًا</button>
    <button class="word-link" type="button" data-word="حَكيمًا" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">حَكيمًا</button>
  </p>
  <p class="farsi-verse">و غنیمت‌های فراوانی که آنها را می‌گیرند؛ و آن معبود یگانه شکست‌ناپذیر حکیم است.</p>
</section>
