<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الفتح ۴۸:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="صَدَقَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">صَدَقَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="رَسولَهُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">رَسولَهُ</button>
    <button class="word-link" type="button" data-word="الرُّءيا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">الرُّءيا</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَتَدخُلُنَّ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">لَتَدخُلُنَّ</button>
    <button class="word-link" type="button" data-word="المَسجِدَ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">المَسجِدَ</button>
    <button class="word-link" type="button" data-word="الحَرامَ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت">الحَرامَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ءامِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامِنينَ</button>
    <button class="word-link" type="button" data-word="مُحَلِّقينَ" data-root="ح ل ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُحَلِّقينَ</button>
    <button class="word-link" type="button" data-word="رُءوسَكُم" data-root="ر أ س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رُءوسَكُم</button>
    <button class="word-link" type="button" data-word="وَمُقَصِّرينَ" data-root="ق ص ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَمُقَصِّرينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَخافونَ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">تَخافونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَعَلِمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">فَعَلِمَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَعلَموا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">تَعلَموا</button>
    <button class="word-link" type="button" data-word="فَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">فَجَعَلَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="فَتحًا" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده">فَتحًا</button>
    <button class="word-link" type="button" data-word="قَريبًا" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب">قَريبًا</button>
  </p>
  <p class="farsi-verse">به‌راستی آن معبود یگانه رؤیا را برای فرستاده‌اش به حق راست گردانید: بی‌گمان، اگر آن معبود یگانه بخواهد، با امنیت به مسجدالحرام درمی‌آیید، با سرهای تراشیده و موهای کوتاه‌شده، بی‌آنکه بترسید. پس آنچه را نمی‌دانستید دانست و پیش از آن گشایشی نزدیک قرار داد.</p>
</section>
