  <p class="farsi-verse">تا مردان و زنان مؤمن را به باغ‌هایی درآورد که از زیر آنها نهرها روان است، در آن ماندگار باشند و بدی‌هایشان را از آنان بزداید؛ و این نزد آن معبود یگانه کامیابی بزرگی است.</p>
