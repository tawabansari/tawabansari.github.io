  <p class="farsi-verse">اوست که آرامش را در دل‌های مؤمنان فروفرستاد تا ایمانی بر ایمانشان بیفزایند؛ و سپاهیان آسمان‌ها و زمین از آنِ آن معبود یگانه‌اند؛ و آن معبود یگانه دانای حکیم است.</p>
