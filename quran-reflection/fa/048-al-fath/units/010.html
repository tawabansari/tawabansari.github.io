  <p class="farsi-verse">بی‌گمان کسانی که با تو بیعت می‌کنند، تنها با آن معبود یگانه بیعت می‌کنند؛ دست آن معبود یگانه بالای دست‌های آنان است. پس هرکس پیمان بشکند، تنها به زیان خود می‌شکند؛ و هرکس به آنچه با آن معبود یگانه عهد بسته وفا کند، به‌زودی پاداشی بزرگ به او خواهد داد.</p>
