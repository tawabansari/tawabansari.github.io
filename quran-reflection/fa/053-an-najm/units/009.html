<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَكانَ</button>
    <button class="word-link" type="button" data-word="قابَ" data-root="ق و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قابَ</button>
    <button class="word-link" type="button" data-word="قَوسَينِ" data-root="ق و س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قَوسَينِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="أَدنىٰ" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">أَدنىٰ</button>
  </p>
  <p class="farsi-verse">پس به اندازهٔ دو کمان یا نزدیک‌تر بود.</p>
</section>
