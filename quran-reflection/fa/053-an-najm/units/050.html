<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="أَهلَكَ" data-root="ه ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَهلَكَ</button>
    <button class="word-link" type="button" data-word="عادًا" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">عادًا</button>
    <button class="word-link" type="button" data-word="الأولىٰ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/">الأولىٰ</button>
  </p>
  <p class="farsi-verse">و اینکه عاد نخستین را نابود کرد،</p>
