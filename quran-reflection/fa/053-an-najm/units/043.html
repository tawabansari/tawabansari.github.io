<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَضحَكَ" data-root="ض ح ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-h-k/" data-root-meaning="خندیدن و آشکار شدن شادی." data-context="خنداند؛ سبب خندیدن شد، در کنار گریاندن و با فاعلیت خداوند.">أَضحَكَ</button>
    <button class="word-link" type="button" data-word="وَأَبكىٰ" data-root="ب ك ي" data-root-meaning="«ب ک ي» به گریستن اشاره دارد؛ بروز حالتی که می‌تواند با اشک، صدای زاری یا اندوه و تاثر همراه باشد. در ساختمان سببی، به گریاندن یا سبب گریستن شدن می‌رسد." data-context="و گریاند؛ سبب گریستن شد، با فاعلیت خداوند؛ فعل سببی است." data-learn-more="/quran-terminology/fa/roots/b-k-y/">وَأَبكىٰ</button>
  </p>
  <p class="farsi-verse">و اینکه اوست که خنداند و گریاند،</p>
</section>
