<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عِندَها" data-root="ع ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-d/" data-root-meaning="سرسختی و مخالفت؛ «عند» واژه‌ای دستوری برای نزدیکی مکانی یا منزلتی است." data-context="نزدِ آن؛ بیانِ جایگاهِ نسبی.">عِندَها</button>
    <button class="word-link" type="button" data-word="جَنَّةُ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغ؛ جایگاهِ بهشتیِ یادشده.">جَنَّةُ</button>
    <button class="word-link" type="button" data-word="المَأوىٰ" data-root="أ و ي" data-learn-more="/quran-terminology/fa/roots/a-w-y/" data-root-meaning="جایگاه و محل اقامت یا پناه؛ بدون دلالتِ همیشگی بر امنیت و آسایش." data-context="جایگاهِ اقامت؛ در ترکیبِ باغِ اقامتگاه.">المَأوىٰ</button>
  </p>
  <p class="farsi-verse">که باغ پناهگاه نزد آن است،</p>
</section>
