<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَبِأَىِّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَبِأَىِّ</button>
    <button class="word-link" type="button" data-word="ءالاءِ" data-root="أ ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-l-w/" data-root-meaning="در کاربردهای مختلف: کوتاهی کردن؛ سوگند خوردن؛ و آلاء به معنای نعمت‌ها. این شاخه‌ها یکسان نیستند.">ءالاءِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="تَتَمارىٰ" data-root="م ر ي" data-learn-more="/quran-terminology/fa/roots/m-r-y/" data-root-meaning="تردید، دودلی و مجادله؛ از بیرون کشیدن شیر تا کشمکش بر سر حقیقت و مرز میان پرسش و مراء در قرآن">تَتَمارىٰ</button>
  </p>
  <p class="farsi-verse">پس در کدام‌یک از نعمت‌های پروردگارت تردید می‌کنی؟</p>
</section>
