  <p class="farsi-verse">آنها جز نام‌هایی نیستند که شما و پدرانتان نامیده‌اید؛ آن معبود یگانه هیچ حجتی برای آنها فرو نفرستاده است. آنان جز گمان و آنچه جان‌ها هوس می‌کنند پیروی نمی‌کنند، در حالی که هدایت از پروردگارشان به آنان رسیده است.</p>
