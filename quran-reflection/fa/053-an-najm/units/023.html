    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>

    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَهُم</button>

  </p>
  <p class="farsi-verse">آنها جز نام‌هایی نیستند که شما و پدرانتان نامیده‌اید؛ آن معبود یگانه هیچ حجتی برای آنها فرو نفرستاده است. آنان جز گمان و آنچه جان‌ها هوس می‌کنند پیروی نمی‌کنند، در حالی که هدایت از پروردگارشان به آنان رسیده است.</p>
