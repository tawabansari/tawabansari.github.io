<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذو</button>
    <button class="word-link" type="button" data-word="مِرَّةٍ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت.">مِرَّةٍ</button>
    <button class="word-link" type="button" data-word="فَاستَوىٰ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">فَاستَوىٰ</button>
  </p>
  <p class="farsi-verse">دارای استواری؛ پس راست ایستاد،</p>
