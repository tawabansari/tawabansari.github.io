<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="يَغشَى" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش" data-context="فرا می‌گیرد؛ آنچه نامش بیان نشده سدره را فرا می‌گیرد.">يَغشَى</button>
    <button class="word-link" type="button" data-word="السِّدرَةَ" data-root="س د ر" data-learn-more="/quran-terminology/fa/roots/s-d-r/" data-root-meaning="نام درخت سدر یا کنار، با میوه‌ای به نام نبق؛ صورت مفرد آن سدرة است." data-context="آن درخت سدر؛ همان سدرهٔ منتها که چیزی آن را فرا می‌گیرد.">السِّدرَةَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَغشىٰ" data-root="غ ش ي" data-learn-more="/quran-terminology/fa/roots/gh-sh-w/" data-root-meaning="پوشاندن، فراگرفتن، احاطه شدن، و تغییر وضعیت در اثر پوشش" data-context="فرا می‌گیرد؛ در عبارت «آنچه فرا می‌گیرد»، بدون تعیین ماهیت آن.">يَغشىٰ</button>
  </p>
  <p class="farsi-verse">آنگاه که درخت سدر را پوشاند آنچه پوشاند.</p>
</section>
