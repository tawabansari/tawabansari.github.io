<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="رَءاهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">رَءاهُ</button>
    <button class="word-link" type="button" data-word="نَزلَةً" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">نَزلَةً</button>
    <button class="word-link" type="button" data-word="أُخرىٰ" data-root="أ خ ر" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-learn-more="/quran-terminology/fa/roots/a-kh-r/">أُخرىٰ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان او را در فرودی دیگر دید،</p>
