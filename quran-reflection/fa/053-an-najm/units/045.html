<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقَ</button>
    <button class="word-link" type="button" data-word="الزَّوجَينِ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند">الزَّوجَينِ</button>
    <button class="word-link" type="button" data-word="الذَّكَرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">الذَّكَرَ</button>
    <button class="word-link" type="button" data-word="وَالأُنثىٰ" data-root="أ ن ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="مادینه بودن؛ أُنثى نام جنس مؤنث است و به‌خودی‌خود داوری ارزشی ندارد.">وَالأُنثىٰ</button>
  </p>
  <p class="farsi-verse">و اینکه دو همتا، نر و ماده، را آفرید،</p>
</section>
