  <p class="farsi-verse">این اندازهٔ رسیدن آنان به دانش است. بی‌گمان پروردگارت بهتر می‌داند چه کسی از راه او گمراه شده، و بهتر می‌داند چه کسی هدایت یافته است.</p>
