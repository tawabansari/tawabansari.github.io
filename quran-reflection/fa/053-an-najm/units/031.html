  <p class="farsi-verse">و آنچه در آسمان‌ها و آنچه در زمین است از آنِ آن معبود یگانه است، تا کسانی را که بدی کردند به آنچه کردند جزا دهد و کسانی را که نیکی کردند به بهترین جزا دهد؛</p>
