<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">النجم ۵۳:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان می‌آورند؛ در ساخت منفی درباره آخرت.">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِالـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="به آخرت؛ موضوع ایمان در جمله منفی.">بِالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="لَيُسَمّونَ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">لَيُسَمّونَ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ موضوع ادعای مؤنث نامیدن یا مؤنث آفریده شدن.">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="تَسمِيَةَ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">تَسمِيَةَ</button>
    <button class="word-link" type="button" data-word="الأُنثىٰ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="نام و وصف مؤنث؛ در «تسمية الأنثى» درباره نامیدن فرشتگان، نه اثبات جنس واقعی آنان.">الأُنثىٰ</button>
  </p>
  <p class="farsi-verse">کسانی که به آخرت ایمان ندارند، فرشتگان را به نام‌گذاریِ ماده نام می‌نهند.</p>
</section>
