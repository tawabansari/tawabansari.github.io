<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز نقل سخن ابلیس.">قالَ</button>
    <button class="word-link" type="button" data-word="أَرَءَيتَكَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="آیا دیدی و به من خبر می‌دهی؛ تعبیر پرسشی ابلیس در اعتراض به گرامی داشتن آدم.">أَرَءَيتَكَ</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="كَرَّمتَ" data-root="ك ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-m/" data-root-meaning="بزرگواری، گرامی بودن و بخشندگی." data-context="گرامی داشته‌ای؛ دربارهٔ برتری‌ای که ابلیس برای آدم نسبت به خود مورد اعتراض قرار می‌دهد.">كَرَّمتَ</button>
    <button class="word-link" type="button" data-word="عَلَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَىَّ</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="أَخَّرتَنِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="مرا مهلت دهی و به تأخیر اندازی؛ درخواست ابلیس برای ادامهٔ مهلت.">أَخَّرتَنِ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ در ترکیب «یوم القیامة»، روز رستاخیز.">يَومِ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قیامت و برخاستن؛ در ترکیب روز رستاخیز.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="لَأَحتَنِكَنَّ" data-root="ح ن ك" data-root-meaning="کام و بخش دهان؛ مهار کردن و یکسره گرفتن یا از میان بردن؛ در کاربردی دیگر، پختگی بر اثر تجربه." data-context="قطعاً به دنبال خود خواهم کشاند و زیر نفوذ خواهم آورد؛ ادعای ابلیس دربارهٔ نسل آدم، با استثنای «جز اندکی»؛ بیان قصد اوست و به‌تنهایی سلطهٔ مطلق یا سلب اختیار انسان را ثابت نمی‌کند." data-learn-more="/quran-terminology/fa/roots/h-n-k/">لَأَحتَنِكَنَّ</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتَهُ" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="نسل و فرزندان او؛ مقصود نسل آدم در سخن ابلیس است.">ذُرِّيَّتَهُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندکی؛ گروهی که ابلیس در ادعای خود استثنا می‌کند، بدون تعیین عدد دقیق.">قَليلًا</button>
  </p>
  <p class="farsi-verse">گفت: مرا خبر ده، این همان کسی است که بر من گرامی داشتی؟ اگر تا روز قیامت به من مهلت دهی، بی‌گمان نسلش را جز اندکی به مهار خود درمی‌آورم.</p>
</section>
