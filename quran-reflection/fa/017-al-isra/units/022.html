<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَجعَل" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار مده؛ از قرار دادن معبودی دیگر در کنار آن معبود یگانه نهی می‌شود.">تَجعَل</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِلٰهًا" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبودی؛ آنچه در کنار آن معبود یگانه موضوع پرستش قرار داده شود.">إِلٰهًا</button>
    <button class="word-link" type="button" data-word="ءاخَرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="دیگر؛ وصف معبودی که از قرار دادن آن در کنار آن معبود یگانه نهی شده است.">ءاخَرَ</button>
    <button class="word-link" type="button" data-word="فَتَقعُدَ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار" data-context="پس بمانی یا در آن وضعیت قرار گیری؛ نتیجهٔ نهی پیشین.">فَتَقعُدَ</button>
    <button class="word-link" type="button" data-word="مَذمومًا" data-root="ذ م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-m-m/" data-root-meaning="نکوهش و سرزنش؛ ذمّه: عهد و تعهدی که رعایت آن لازم است." data-context="نکوهیده؛ وصفی مستقل از بی‌یاور بودن.">مَذمومًا</button>
    <button class="word-link" type="button" data-word="مَخذولًا" data-root="خ ذ ل" data-root-meaning="واگذاشتن و دست کشیدن از یاری و همراهی؛ به‌ویژه هنگامی که پشتیبانی مورد انتظار است." data-context="واگذاشته و بی‌یاور؛ در پی قرار دادن معبودی دیگر در کنار آن معبود یگانه." data-learn-more="/quran-terminology/fa/roots/kh-dh-l/">مَخذولًا</button>
  </p>
  <p class="farsi-verse">همراه آن معبود یگانه معبود دیگری قرار مده، که نکوهیده و بی‌یاور می‌مانی.</p>
</section>
