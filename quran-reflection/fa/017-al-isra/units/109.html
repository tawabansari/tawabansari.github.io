<section class="ayah-block" id="ayah-109" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۰۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَخِرّونَ" data-root="خ ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-r-r/" data-root-meaning="فرو افتادن؛ نیز صدای ریزش یا جریان.">وَيَخِرّونَ</button>
    <button class="word-link" type="button" data-word="لِلأَذقانِ" data-root="ذ ق ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-q-n/" data-root-meaning="چانه و بخش زیرین صورت.">لِلأَذقانِ</button>
    <button class="word-link" type="button" data-word="يَبكونَ" data-root="ب ك ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-k-y/" data-root-meaning="گریستن و اشک ریختن؛ أبكى: به گریه انداختن.">يَبكونَ</button>
    <button class="word-link" type="button" data-word="وَيَزيدُهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">وَيَزيدُهُم</button>
    <button class="word-link" type="button" data-word="خُشوعًا" data-root="خ ش ع" data-learn-more="/quran-terminology/fa/roots/kh-sh-ayn/" data-root-meaning="فرو آمدن از بلندی و سختی، نرم شدن، آرام گرفتن، و فرونشستن در برابر حقیقت و عظمت">خُشوعًا</button>
    ۩
  </p>
  <p class="farsi-verse">و گریان بر چانه‌ها فرو می‌افتند و بر فروتنی‌شان می‌افزاید.</p>
</section>
