<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="أَحسَنتُم" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="اگر نیکی کنید؛ رفتار شایستهٔ مخاطبان.">أَحسَنتُم</button>
    <button class="word-link" type="button" data-word="أَحسَنتُم" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکی کرده‌اید؛ سود آن به خودتان می‌رسد.">أَحسَنتُم</button>
    <button class="word-link" type="button" data-word="لِأَنفُسِكُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="برای خودتان؛ دریافت‌کنندگان پیامد نیکی.">لِأَنفُسِكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَسَأتُم" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی کنید؛ رفتار نادرست با پیامد برای خود.">أَسَأتُم</button>
    <button class="word-link" type="button" data-word="فَلَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَها</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="فرا رسد؛ دربارهٔ وعدهٔ نوبت دیگر.">جاءَ</button>
    <button class="word-link" type="button" data-word="وَعدُ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="وعده؛ موعد اعلام‌شدهٔ رویداد.">وَعدُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="نوبت دیگر؛ در برابر نوبت نخستِ بیان‌شده در سیاق.">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="لِيَسـۥـٔوا" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="تا اندوهگین و خوار سازند؛ دربارهٔ چهره‌های مخاطبان.">لِيَسـۥـٔوا</button>
    <button class="word-link" type="button" data-word="وُجوهَكُم" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهره‌هایتان؛ محل آشکار شدن اندوه و خواری.">وُجوهَكُم</button>
    <button class="word-link" type="button" data-word="وَلِيَدخُلُوا" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="و تا وارد شوند؛ به مسجد.">وَلِيَدخُلُوا</button>
    <button class="word-link" type="button" data-word="المَسجِدَ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="مسجد؛ جایگاه ورود یادشده.">المَسجِدَ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="دَخَلوهُ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن." data-context="وارد آن شدند؛ در نخستین نوبت.">دَخَلوهُ</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="نخستین؛ تعیین نوبت ورود پیشین.">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="م ر ر" data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و سپری شدن؛ یک بار یا یک نوبت؛ در شاخه‌های دیگر، تلخی و ناگواری، و قوت و استواری." data-context="بار؛ در ترکیب «نخستین بار»، ورود پیشین به مسجد.">مَرَّةٍ</button>
    <button class="word-link" type="button" data-word="وَلِيُتَبِّروا" data-root="ت ب ر" data-learn-more="/quran-terminology/fa/roots/t-b-r/" data-root-meaning="درهم شکستن و از میان بردن یک پیکره یا سامان، به‌گونه‌ای که توان ادامه یافتن به صورت پیشین را از دست بدهد." data-context="و تا ویران کنند؛ آنچه بر آن چیره شدند.">وَلِيُتَبِّروا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَلَوا" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="بر آن چیره شدند؛ در بیان دامنهٔ ویرانی.">عَلَوا</button>
    <button class="word-link" type="button" data-word="تَتبيرًا" data-root="ت ب ر" data-learn-more="/quran-terminology/fa/roots/t-b-r/" data-root-meaning="درهم شکستن و از میان بردن یک پیکره یا سامان، به‌گونه‌ای که توان ادامه یافتن به صورت پیشین را از دست بدهد." data-context="ویران کردنی فراگیر؛ تأکید بر فعل ویران کردن.">تَتبيرًا</button>
  </p>
  <p class="farsi-verse">اگر نیکی کنید، به خود نیکی کرده‌اید و اگر بدی کنید، به خود کرده‌اید؛ پس هنگامی که وعده دیگر رسید، تا چهره‌هایتان را اندوهگین کنند و به مسجد درآیند، همان‌گونه که نخستین بار به آن درآمدند، و آنچه را بر آن دست یابند به‌تمامی ویران کنند.</p>
</section>
