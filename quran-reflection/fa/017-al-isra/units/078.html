<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَقِمِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برپا دار؛ فرمانِ اقامهٔ صلات.">أَقِمِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلات؛ آنچه باید برپا داشته شود.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="لِدُلوكِ" data-root="د ل ك" data-learn-more="/quran-terminology/fa/roots/d-l-k/" data-root-meaning="مالیدن و ساییدن؛ دُلُوک خورشید: میل و زوال آن، با کاربردهای ثبت‌شده از زوال نیمروز تا غروب و اختلاف در تعیین هنگام." data-context="از دلوک؛ زمانِ میل یا زوال خورشید در بیانِ آیه.">لِدُلوكِ</button>
    <button class="word-link" type="button" data-word="الشَّمسِ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="خورشید؛ تعیین‌کنندهٔ زمانِ دلوک.">الشَّمسِ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="غَسَقِ" data-root="غ س ق" data-root-meaning="غسق در کاربرد مربوط به شب، تاریک شدن و فرارسیدن یا گسترش تاریکی است؛ در شاخه دیگری از زبان عربی، این خانواده برای جاری شدن و فرو ریختن مایعات نیز به کار رفته است. «غاسق» وصف تاریک‌شونده یا در سیاق مناسب جاری‌شونده است، و «غساق» در قرآن نام چیزی عذاب‌آور است که درباره ماهیت دقیق آن اختلاف لغوی باقی مانده است." data-learn-more="/quran-terminology/fa/roots/gh-s-q/" data-context="تاریکی؛ فرا رسیدن تاریکیِ شب.">غَسَقِ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ زمانِ غسق.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَقُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرائت؛ خواندنِ مربوط به فجر در سیاقِ صلات." data-learn-more="/quran-terminology/fa/roots/q-r-a/">وَقُرءانَ</button>
    <button class="word-link" type="button" data-word="الفَجرِ" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست." data-context="فجر؛ زمانِ قرائتِ یادشده.">الفَجرِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="قُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرائت؛ خواندنِ مربوط به فجر در سیاقِ صلات." data-learn-more="/quran-terminology/fa/roots/q-r-a/">قُرءانَ</button>
    <button class="word-link" type="button" data-word="الفَجرِ" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست." data-context="فجر؛ قیدِ زمانیِ قرائت در جملهٔ دوم.">الفَجرِ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="است؛ بیانِ وصفِ قرائت فجر.">كانَ</button>
    <button class="word-link" type="button" data-word="مَشهودًا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="مورد گواهی؛ وصفِ قرائت فجر.">مَشهودًا</button>
  </p>
  <p class="farsi-verse">صلات را از زوال خورشید تا تاریکی شب برپا دار، و خواندن سپیده‌دم را؛ همانا خواندن سپیده‌دم مورد گواهی است.</p>
</section>
