<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَقِمِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">أَقِمِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="لِدُلوكِ" data-root="د ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لِدُلوكِ</button>
    <button class="word-link" type="button" data-word="الشَّمسِ" data-root="ش م س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الشَّمسِ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="غَسَقِ" data-root="غ س ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَسَقِ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَقُرءانَ" data-root="ق ر أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَقُرءانَ</button>
    <button class="word-link" type="button" data-word="الفَجرِ" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست.">الفَجرِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="قُرءانَ" data-root="ق ر أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قُرءانَ</button>
    <button class="word-link" type="button" data-word="الفَجرِ" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست.">الفَجرِ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="مَشهودًا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">مَشهودًا</button>
  </p>
  <p class="farsi-verse">صلات را از زوال خورشید تا تاریکی شب برپا دار، و خواندن سپیده‌دم را؛ همانا خواندن سپیده‌دم مورد گواهی است.</p>
</section>
