<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="كادوا" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن">كادوا</button>
    <button class="word-link" type="button" data-word="لَيَستَفِزّونَكَ" data-root="ف ز ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَيَستَفِزّونَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="لِيُخرِجوكَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">لِيُخرِجوكَ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِذًا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذًا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَلبَثونَ" data-root="ل ب ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَلبَثونَ</button>
    <button class="word-link" type="button" data-word="خِلٰفَكَ" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی">خِلٰفَكَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
  </p>
  <p class="farsi-verse">و نزدیک بود تو را از این سرزمین برکنند تا از آن بیرونت کنند؛ و آن‌گاه پس از تو جز اندکی نمی‌ماندند.</p>
</section>
