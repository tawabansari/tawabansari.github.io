<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَمِنتُم" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="آیا ایمن شده‌اید؛ پرسش از احساس امنیت در برابر خطر.">أَفَأَمِنتُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَخسِفَ" data-root="خ س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-s-f/" data-root-meaning="فرو رفتن یا فرو بردن در زمین؛ نیز کاهش نور و گرفتگی ماه." data-context="فرو برد؛ خطر فرورفتن در زمین.">يَخسِفَ</button>
    <button class="word-link" type="button" data-word="بِكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكُم</button>
    <button class="word-link" type="button" data-word="جانِبَ" data-root="ج ن ب" data-root-meaning="پهلو، کنار و جانب؛ فاصله گرفتن، دور ساختن و پرهیز کردن. «جُنُب» در سیاق طهارت، وضعیتِ نیازمند پاک شدن است." data-context="بخش یا سوی خشکی؛ مکانی که خطر فروبرده شدن در آن مطرح است." data-learn-more="/quran-terminology/fa/roots/j-n-b/">جانِبَ</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="ب ر ر" data-learn-more="/quran-terminology/fa/roots/b-r-r/" data-root-meaning="نیکی گسترده، راست‌کرداری، وفاداری، احسان، گشودگی در خیر، و ایستادن بر زمین استوار اخلاقی" data-context="خشکی؛ در برابر دریا، عرصه خطر یادشده.">البَرِّ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يُرسِلَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="بفرستد؛ فرستاده شدن سنگ‌بارانِ یادشده.">يُرسِلَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="حاصِبًا" data-root="ح ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sad-b/" data-root-meaning="ریگ و سنگ‌ریزه، و افکندن آن؛ حاصب: باد سنگ‌افکن؛ حصب در سیاق آتش: سوخت." data-context="سنگ‌باران؛ چیزی که با سنگ‌ریزه بر مخاطبان فرستاده می‌شود.">حاصِبًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تَجِدوا" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="بیابید؛ یافتنِ کارساز که در پایان نفی می‌شود.">تَجِدوا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَكيلًا" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار." data-context="کارساز؛ کسی که بتوان امور آنان را بر عهده گیرد و حمایت کند.">وَكيلًا</button>
  </p>
  <p class="farsi-verse">آیا ایمن شده‌اید که شما را در بخشی از خشکی فرو برد یا بر شما سنگ‌بارانی بفرستد، سپس برای خود کارسازی نیابید؟</p>
</section>
