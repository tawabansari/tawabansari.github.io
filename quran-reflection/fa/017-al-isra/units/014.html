<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اقرَأ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="بخوان؛ فرمانِ خواندنِ کتابِ اعمالِ خود." data-learn-more="/quran-terminology/fa/roots/q-r-a/">اقرَأ</button>
    <button class="word-link" type="button" data-word="كِتٰبَكَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابت؛ ثبتِ اعمالِ خودِ مخاطب.">كِتٰبَكَ</button>
    <button class="word-link" type="button" data-word="كَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/" data-root-meaning="کفایت و بسندگی؛ از برآوردن نیاز و بر عهده گرفتن کار دیگری تا کفایت آن معبود یگانه در گواهی، حسابرسی، یاری و حفاظت" data-context="کافی است؛ بسندگیِ خود فرد برای حسابرسی.">كَفىٰ</button>
    <button class="word-link" type="button" data-word="بِنَفسِكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خودت؛ شخصِ حسابرسِ خویش.">بِنَفسِكَ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="امروز؛ زمانِ حسابِ یادشده.">اليَومَ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="حَسيبًا" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="حسابرس؛ نقشِ خود فرد در حسابرسیِ خویش.">حَسيبًا</button>
  </p>
  <p class="farsi-verse">کتابت را بخوان؛ امروز خودت برای حسابرسی بر خویش کافی هستی.</p>
</section>
