<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="رَدَدنا" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر">رَدَدنا</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الكَرَّةَ" data-root="ك ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-r/" data-root-meaning="بازگشت و تکرار حمله یا فرصت.">الكَرَّةَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَأَمدَدنٰكُم" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر">وَأَمدَدنٰكُم</button>
    <button class="word-link" type="button" data-word="بِأَموٰلٍ" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">بِأَموٰلٍ</button>
    <button class="word-link" type="button" data-word="وَبَنينَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">وَبَنينَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰكُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنٰكُم</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="نَفيرًا" data-root="ن ف ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="از جا برخاستن و روانه شدن؛ نیز روی‌گردانی و رمیدن.">نَفيرًا</button>
  </p>
  <p class="farsi-verse">سپس نوبت غلبه بر آنان را به شما بازگرداندیم و شما را با اموال و پسران یاری کردیم و نفراتتان را بیشتر گرداندیم.</p>
</section>
