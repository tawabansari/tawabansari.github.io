<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنَا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار دادیم.">وَجَعَلنَا</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب.">الَّيلَ</button>
    <button class="word-link" type="button" data-word="وَالنَّهارَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="و روز.">وَالنَّهارَ</button>
    <button class="word-link" type="button" data-word="ءايَتَينِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="دو نشانه.">ءايَتَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَحَونا" data-root="م ح و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-h-w/" data-root-meaning="محو کردن و از میان بردن اثر." data-context="پس محو و کم‌اثر کردیم.">فَمَحَونا</button>
    <button class="word-link" type="button" data-word="ءايَةَ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانهٔ.">ءايَةَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شبِ.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار دادیم.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="ءايَةَ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانهٔ.">ءايَةَ</button>
    <button class="word-link" type="button" data-word="النَّهارِ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="روزِ.">النَّهارِ</button>
    <button class="word-link" type="button" data-word="مُبصِرَةً" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="روشنی‌بخش و دیدپذیرکننده.">مُبصِرَةً</button>
    <button class="word-link" type="button" data-word="لِتَبتَغوا" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="تا بجویید.">لِتَبتَغوا</button>
    <button class="word-link" type="button" data-word="فَضلًا" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="فضلی و بهره‌ای افزون.">فَضلًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان.">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="وَلِتَعلَموا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و تا بدانید.">وَلِتَعلَموا</button>
    <button class="word-link" type="button" data-word="عَدَدَ" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص" data-context="شمارِ.">عَدَدَ</button>
    <button class="word-link" type="button" data-word="السِّنينَ" data-root="س ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است." data-context="سال‌ها.">السِّنينَ</button>
    <button class="word-link" type="button" data-word="وَالحِسابَ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="و حساب و شمارش.">وَالحِسابَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="و هرِ؛ در بیانِ شمول.">وَكُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-context="چیز یا امرِ مورد بحث." data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه؛ و در کاربرد اسمیِ «شیء»، چیز یا امری که از آن سخن می‌رود، جدا از فعلِ خواستن.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="فَصَّلنٰهُ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="به‌روشنی و به‌تفصیل بیان کردیم؛ دربارهٔ موضوعِ یادشده در آیه." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">فَصَّلنٰهُ</button>
    <button class="word-link" type="button" data-word="تَفصيلًا" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="و بیانِ روشن و تفصیلی؛ مشخص ساختن اجزا و حدودِ موضوعِ یادشده." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">تَفصيلًا</button>
  </p>
  <p class="farsi-verse">و شب و روز را دو نشانه قرار دادیم؛ پس نشانه شب را محو کردیم و نشانه روز را بیناکننده قرار دادیم تا فضلی از پروردگارتان بجویید و شمار سال‌ها و حساب را بدانید؛ و هر چیزی را به‌روشنی تفصیل داده‌ایم.</p>
</section>
