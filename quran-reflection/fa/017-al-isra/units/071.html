<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمانِ فراخوانِ همگانی.">يَومَ</button>
    <button class="word-link" type="button" data-word="نَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="فرا می‌خوانیم؛ دعوتِ هر گروه با امامشان.">نَدعوا</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ فراگیریِ گروه‌های مخاطب.">كُلَّ</button>
    <button class="word-link" type="button" data-word="أُناسٍ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="گروه مردم؛ واحدهای انسانیِ فراخوانده‌شده.">أُناسٍ</button>
    <button class="word-link" type="button" data-word="بِإِمٰمِهِم" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="با امامشان؛ همراهِ پیشوا یا مرجعِ گروه.">بِإِمٰمِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="أوتِىَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="داده شد؛ دریافتِ کتابِ اعمال.">أوتِىَ</button>
    <button class="word-link" type="button" data-word="كِتٰبَهُ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابش؛ ثبتِ اعمالِ شخص.">كِتٰبَهُ</button>
    <button class="word-link" type="button" data-word="بِيَمينِهِ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی." data-context="به دست راستش؛ شیوهٔ دریافتِ کتاب.">بِيَمينِهِ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="يَقرَءونَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="می‌خوانند؛ خواندنِ کتابِ اعمالِ خودشان." data-learn-more="/quran-terminology/fa/roots/q-r-a/">يَقرَءونَ</button>
    <button class="word-link" type="button" data-word="كِتٰبَهُم" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابشان؛ ثبتِ اعمالی که می‌خوانند.">كِتٰبَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستم می‌شوند؛ با «لا»، نفیِ کم‌گذاشتنِ حق.">يُظلَمونَ</button>
    <button class="word-link" type="button" data-word="فَتيلًا" data-root="ف ت ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-l/" data-root-meaning="تابیدن رشته؛ فتیل: رشته باریک در شکاف هسته خرما." data-context="رشته‌ای باریک؛ تصویرِ کمترین مقدار در نفی ستم.">فَتيلًا</button>
  </p>
  <p class="farsi-verse">روزی که هر گروهی از مردم را با پیشوایشان فرا می‌خوانیم؛ پس هر که کتابش به دست راستش داده شود، آنان کتاب خود را می‌خوانند و به اندازه رشته‌ای ستم نمی‌بینند.</p>
</section>
