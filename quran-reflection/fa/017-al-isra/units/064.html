<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاستَفزِز" data-root="ف ز ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-z-z/" data-root-meaning="به جنبش و اضطراب انداختن؛ برانگیختن یا از جا کندن." data-context="و برانگیز؛ هر کس از آنان را که می‌توانی با صدایت تحریک کن و از حالت پیشین بیرون آور.">وَاستَفزِز</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَنِ</button>
    <button class="word-link" type="button" data-word="استَطَعتَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="توانستی؛ هر کس از آنان که در توان توست او را برانگیزی.">استَطَعتَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="بِصَوتِكَ" data-root="ص و ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-w-t/" data-root-meaning="صدا و آوا." data-context="با صدایت؛ وسیلهٔ برانگیختن در خطاب به شیطان، بدون تعیین نوع مشخصی از صدا در خود آیه.">بِصَوتِكَ</button>
    <button class="word-link" type="button" data-word="وَأَجلِب" data-root="ج ل ب" data-root-meaning="آوردن و گردآوردن، بسیج کردن؛ و در شاخه‌ای دیگر، پوشاندن و دربرگرفتن." data-context="و علیه آنان نیرو بسیج کن؛ در ترکیب با سواران و پیادگان، گردآوردن و به حرکت درآوردن نیروها برای هجوم." data-learn-more="/quran-terminology/fa/roots/j-l-b/">وَأَجلِب</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِخَيلِكَ" data-root="خ ي ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-y-l/" data-root-meaning="تصویر ذهنی و خیال؛ اختیال: خودبزرگ‌بینی؛ خیل: اسبان." data-context="با اسبان یا سوارانت؛ نیروی سوار در کنار پیادگان، در تصویر بسیج نیروهای شیطان.">بِخَيلِكَ</button>
    <button class="word-link" type="button" data-word="وَرَجِلِكَ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="و پیادگانت؛ نیروی پیاده در کنار سواران.">وَرَجِلِكَ</button>
    <button class="word-link" type="button" data-word="وَشارِكهُم" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="و با آنان شریک شو؛ در دارایی‌ها و فرزندان، در سیاق گمراه‌سازی شیطان.">وَشارِكهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَموٰلِ" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="دارایی‌ها؛ اموالی که مشارکت شیطان با انسان‌ها در آنها مطرح شده است.">الأَموٰلِ</button>
    <button class="word-link" type="button" data-word="وَالأَولٰدِ" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="و فرزندان؛ در ادامهٔ موضوع مشارکت شیطان با انسان‌ها.">وَالأَولٰدِ</button>
    <button class="word-link" type="button" data-word="وَعِدهُم" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="و به آنان وعده بده؛ خطاب به شیطان، با توضیح فریبنده بودن وعده‌های او در پایان آیه.">وَعِدهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَعِدُهُمُ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید" data-context="به آنان وعده می‌دهد؛ گزارش ماهیت وعده‌های شیطان در ساخت نفی و استثنا.">يَعِدُهُمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ همان گمراه‌کننده‌ای که خطاب‌های پیشین آیه متوجه اوست.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="غُرورًا" data-root="غ ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-r/" data-root-meaning="فریب و دل بستن به نمود گمراه‌کننده." data-context="فریب؛ ماهیت وعده‌های شیطان، که جز نمود گمراه‌کننده به آنان عرضه نمی‌کند.">غُرورًا</button>
  </p>
  <p class="farsi-verse">و هر که از آنان را می‌توانی با صدایت برانگیز، و با سواران و پیادگانت بر آنان بتاز، و در دارایی‌ها و فرزندان با آنان شریک شو و به آنان وعده بده؛ و شیطان جز فریب به آنان وعده نمی‌دهد.</p>
</section>
