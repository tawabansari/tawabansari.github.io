<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان به ابلاغ سخن پس از آن.">قُل</button>
    <button class="word-link" type="button" data-word="كَفىٰ" data-root="ك ف ي" data-learn-more="/quran-terminology/fa/roots/k-f-y/" data-root-meaning="کفایت و بسندگی؛ از برآوردن نیاز و بر عهده گرفتن کار دیگری تا کفایت آن معبود یگانه در گواهی، حسابرسی، یاری و حفاظت" data-context="کافی است؛ دربارهٔ گواهی خداوند.">كَفىٰ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="شَهيدًا" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت" data-context="گواه؛ وصف خداوند میان دو طرف.">شَهيدًا</button>
    <button class="word-link" type="button" data-word="بَينى" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان من؛ یک سوی گواهی.">بَينى</button>
    <button class="word-link" type="button" data-word="وَبَينَكُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="و میان شما؛ سوی دیگر گواهی.">وَبَينَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بوده و هست؛ در توصیف آن معبود یگانه.">كانَ</button>
    <button class="word-link" type="button" data-word="بِعِبادِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="به بندگانش؛ متعلق آگاهی و بینایی الهی.">بِعِبادِهِ</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="آگاه؛ وصفِ آگاهی آن معبود یگانه در سیاق آیه." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">خَبيرًا</button>
    <button class="word-link" type="button" data-word="بَصيرًا" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینا؛ وصف آن معبود یگانه.">بَصيرًا</button>
  </p>
  <p class="farsi-verse">بگو: آن معبود یگانه برای گواهی میان من و شما بس است؛ همانا او به بندگانش آگاه و بیناست.</p>
</section>
