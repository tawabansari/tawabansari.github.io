<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِالـٔاخِرَةِ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">بِالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="أَعتَدنا" data-root="ع ت د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-t-d/" data-root-meaning="آماده کردن و آماده یا حاضر بودن.">أَعتَدنا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد">أَليمًا</button>
  </p>
  <p class="farsi-verse">و اینکه برای کسانی که به آخرت ایمان نمی‌آورند عذابی دردناک آماده کرده‌ایم.</p>
</section>
