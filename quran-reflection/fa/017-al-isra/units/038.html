<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="سَيِّئُهُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سَيِّئُهُ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="مَكروهًا" data-root="ك ر ه" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَكروهًا</button>
  </p>
  <p class="farsi-verse">بدیِ همه اینها نزد پروردگارت ناپسند است.</p>
</section>
