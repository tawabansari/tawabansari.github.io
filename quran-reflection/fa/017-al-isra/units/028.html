<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="تُعرِضَنَّ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">تُعرِضَنَّ</button>
    <button class="word-link" type="button" data-word="عَنهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُمُ</button>
    <button class="word-link" type="button" data-word="ابتِغاءَ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد">ابتِغاءَ</button>
    <button class="word-link" type="button" data-word="رَحمَةٍ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحمَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="تَرجوها" data-root="ر ج و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَرجوها</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقُل</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قَولًا</button>
    <button class="word-link" type="button" data-word="مَيسورًا" data-root="ي س ر" data-learn-more="/quran-terminology/fa/roots/y-s-r/" data-root-meaning="آسانی، گشایش، فراهم بودن، روانی کار، توانایی و دسترسی؛ و در شاخه میسر، بهره‌گیری از آسانی یا بخت برای دست‌یابی به منفعت">مَيسورًا</button>
  </p>
  <p class="farsi-verse">و اگر در طلب رحمتی از پروردگارت که به آن امید داری از آنان روی بگردانی، با آنان سخنی نرم و آسان بگو.</p>
</section>
