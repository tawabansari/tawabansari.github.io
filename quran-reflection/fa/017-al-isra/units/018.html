<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">يُريدُ</button>
    <button class="word-link" type="button" data-word="العاجِلَةَ" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">العاجِلَةَ</button>
    <button class="word-link" type="button" data-word="عَجَّلنا" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">عَجَّلنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">نَشاءُ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="نُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">نُريدُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="يَصلىٰها" data-root="ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-y/" data-root-meaning="از گرفتن گرمای آتش تا درآمدن در آتش">يَصلىٰها</button>
    <button class="word-link" type="button" data-word="مَذمومًا" data-root="ذ م م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَذمومًا</button>
    <button class="word-link" type="button" data-word="مَدحورًا" data-root="د ح ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَدحورًا</button>
  </p>
  <p class="farsi-verse">هر که زندگی زودگذر را بخواهد، در آن هر چه بخواهیم برای هر که بخواهیم زود فراهم می‌کنیم؛ سپس جهنم را برای او قرار می‌دهیم که نکوهیده و رانده‌شده در آن می‌سوزد.</p>
</section>
