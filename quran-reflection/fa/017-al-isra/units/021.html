<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="انظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="بنگر؛ فرمان توجه به تفاوت جایگاه‌ها.">انظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="فَضَّلنا" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="برتری دادیم؛ بیان تفاوت برخی با برخی دیگر.">فَضَّلنا</button>
    <button class="word-link" type="button" data-word="بَعضَهُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی از آنان؛ یک سوی مقایسه.">بَعضَهُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی دیگر؛ سوی دیگر مقایسه.">بَعضٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَلـٔاخِرَةُ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="و آخرت؛ عرصه‌ای که مراتب آن بزرگ‌تر توصیف می‌شود.">وَلَلـٔاخِرَةُ</button>
    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="بزرگ‌تر؛ درباره درجات آخرت.">أَكبَرُ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="د ر ج" data-learn-more="/quran-terminology/fa/roots/d-r-j/" data-root-meaning="حرکت و گذر مرحله‌به‌مرحله؛ پله و مرتبه؛ استدراج: پیش بردن تدریجی." data-context="درجات؛ مراتب آخرت که بزرگ‌تر توصیف شده‌اند.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="وَأَكبَرُ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="و بزرگ‌تر؛ درباره برتری دادن در آخرت.">وَأَكبَرُ</button>
    <button class="word-link" type="button" data-word="تَفضيلًا" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده." data-context="برتری دادن؛ تفاوت منزلت در مقایسه یادشده.">تَفضيلًا</button>
  </p>
  <p class="farsi-verse">بنگر چگونه برخی را بر برخی برتری داده‌ایم؛ و آخرت در درجات بزرگ‌تر و در برتری بخشیدن بزرگ‌تر است.</p>
</section>
