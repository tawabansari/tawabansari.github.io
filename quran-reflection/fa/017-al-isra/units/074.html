<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَولا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="ثَبَّتنٰكَ" data-root="ث ب ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ثَبَّتنٰكَ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="كِدتَ" data-root="ك و د" data-learn-more="/quran-terminology/fa/roots/k-w-d/" data-root-meaning="نزدیک شدن به مرز وقوع، ایستادن در آستانه انجام یک کار یا پدید آمدن یک حالت، و نشان دادن شدت آمادگی یا فشار یک پدیده برای رخ دادن">كِدتَ</button>
    <button class="word-link" type="button" data-word="تَركَنُ" data-root="ر ك ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَركَنُ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/">قَليلًا</button>
  </p>
  <p class="farsi-verse">و اگر تو را استوار نکرده بودیم، نزدیک بود اندکی به آنان متمایل شوی.</p>
