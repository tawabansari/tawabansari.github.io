<section class="ayah-block" id="ayah-110" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُلِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان به بیان سخنِ پس از آن.">قُلِ</button>
    <button class="word-link" type="button" data-word="ادعُوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="بخوانید؛ دعوت به خواندن آن معبود یگانه.">ادعُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَوِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوِ</button>
    <button class="word-link" type="button" data-word="ادعُوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="بخوانید؛ خواندن او با نام رحمان.">ادعُوا</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمان؛ نام الهی که در کنار الله در موضوع خواندن او آمده است.">الرَّحمٰنَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَيًّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيًّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="تَدعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="بخوانید؛ هر یک از نام‌های یادشده را در خواندن او به کار برید.">تَدعوا</button>
    <button class="word-link" type="button" data-word="فَلَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَهُ</button>
    <button class="word-link" type="button" data-word="الأَسماءُ" data-root="س م و / و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="بالا آوردن به سطح شناخت، و نشانه‌گذاری برای تشخیص" data-context="از اسم‌هایشان؛ شناسه‌ها و نشانه‌هایی که حقیقت، ویژگی و کارکرد آن موجودات یا پدیده‌ها را قابل شناخت می‌کند.">الأَسماءُ</button>
    <button class="word-link" type="button" data-word="الحُسنىٰ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوترین؛ وصف نام‌های یادشده.">الحُسنىٰ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَجهَر" data-root="ج ه ر" data-learn-more="/quran-terminology/fa/roots/j-h2-r/" data-root-meaning="آشکار و علنی بودن یا ساختن؛ و در گفتار، بلند کردن صدا به‌گونه‌ای که از حالت آهسته و پنهان بیرون آید." data-context="با صدای بلند آشکار کنی؛ در ساخت نهی دربارهٔ صلوة.">تَجهَر</button>
    <button class="word-link" type="button" data-word="بِصَلاتِكَ" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد" data-context="صلوة تو؛ عملی که آیه دربارهٔ شیوهٔ آشکار یا پایین ادا کردن صدای آن سخن می‌گوید.">بِصَلاتِكَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُخافِت" data-root="خ ف ت" data-root-meaning="آرام و کم‌آشکار شدن صدا، آهسته سخن گفتن و پنهانی گفتگو کردن؛ و در کاربردهای دیگر، ضعف و فروکش‌کردن." data-context="آن را با صدای پایین و فروخورده ادا کنی؛ در این نهی، در برابر جهر و همراه با فرمان به راهی میان آن دو." data-learn-more="/quran-terminology/fa/roots/kh-f-t/">تُخافِت</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِها</button>
    <button class="word-link" type="button" data-word="وَابتَغِ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="و بجوی؛ فرمان به یافتن راهی میان دو شیوه.">وَابتَغِ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان؛ جایگاه راه خواسته‌شده نسبت به دو شیوهٔ یادشده.">بَينَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راهی؛ شیوه‌ای میان جهر و مخافتة در این آیه.">سَبيلًا</button>
  </p>
  <p class="farsi-verse">بگو: آن معبود یگانه را بخوانید یا فرارحمن را بخوانید؛ هر کدام را بخوانید، نیکوترین نام‌ها از آن اوست؛ و صلاتت را بلند مخوان و آن را آهسته نیز مخوان، و میان این دو راهی بجوی.</p>
</section>
