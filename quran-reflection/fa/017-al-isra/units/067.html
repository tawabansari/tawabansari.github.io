  <p class="farsi-verse">و چون در دریا زیانی به شما برسد، هر که را می‌خوانید جز او از یاد می‌رود؛ پس چون شما را به خشکی نجات دهد، روی می‌گردانید؛ و انسان بسیار ناسپاس است.</p>
