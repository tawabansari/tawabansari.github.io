<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="أَنعَمنا" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نعمت دادیم؛ بخشیدن برخورداری به انسان.">أَنعَمنا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الإِنسٰنِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ شخص برخوردار از نعمت که روی می‌گرداند.">الإِنسٰنِ</button>
    <button class="word-link" type="button" data-word="أَعرَضَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="روی می‌گرداند؛ واکنش انسان هنگام برخورداری.">أَعرَضَ</button>
    <button class="word-link" type="button" data-word="وَنَـٔا" data-root="ن أ ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-a-y/" data-root-meaning="دور شدن و کناره گرفتن." data-context="و دور می‌شود؛ در ترکیبِ کنار کشیدنِ جانب خود.">وَنَـٔا</button>
    <button class="word-link" type="button" data-word="بِجانِبِهِ" data-root="ج ن ب" data-root-meaning="پهلو، کنار و جانب؛ فاصله گرفتن، دور ساختن و پرهیز کردن. «جُنُب» در سیاق طهارت، وضعیتِ نیازمند پاک شدن است." data-context="به جانب خود؛ در ترکیبِ کناره گرفتن و روی‌گردانی پس از نعمت." data-learn-more="/quran-terminology/fa/roots/j-n-b/">بِجانِبِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="مَسَّهُ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="به او برسد؛ رسیدن بدی به انسان.">مَسَّهُ</button>
    <button class="word-link" type="button" data-word="الشَّرُّ" data-root="ش ر ر" data-root-meaning="شر، بدی یا زیانی است که می‌تواند به رفتار، وضعیت، رخداد یا فرجام چیزی نسبت داده شود؛ در ساخت مقایسه‌ای، بدتر بودن را بیان می‌کند؛ و شرر در شاخه مادی به پاره‌های فروزان و جهنده آتش اشاره دارد." data-learn-more="/quran-terminology/fa/roots/sh-r-r/" data-context="بدی؛ آسیب یا دشواری که انسان با آن نومید می‌شود.">الشَّرُّ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="می‌شود؛ بیان حالت او هنگام رسیدن بدی.">كانَ</button>
    <button class="word-link" type="button" data-word="يَـٔوسًا" data-root="ي أ س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-a-s/" data-root-meaning="ناامید شدن و قطع امید." data-context="بسیار نومید؛ حالت انسان هنگام دشواری.">يَـٔوسًا</button>
  </p>
  <p class="farsi-verse">و چون به انسان نعمت دهیم، روی می‌گرداند و خود را کنار می‌کشد؛ و چون بدی به او برسد، بسیار نومید می‌شود.</p>
</section>
