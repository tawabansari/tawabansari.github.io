<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُلًّا" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر دو گروه؛ هم آنان که دنیا را می‌خواهند و هم آنان که آخرت را با ایمان و کوشش می‌جویند.">كُلًّا</button>
    <button class="word-link" type="button" data-word="نُمِدُّ" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر" data-context="بهره و پشتیبانی می‌رسانیم؛ به هر دو گروه از عطای پروردگار مدد می‌دهیم.">نُمِدُّ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="وَهٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَطاءِ" data-root="ع ط و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-tt-w/" data-root-meaning="دادن و بخشش؛ تعاطی: دست به کاری زدن یا چیزی را گرفتن." data-context="عطا و بخشش؛ آنچه پروردگار از آن به هر دو گروه می‌رساند.">عَطاءِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار تو؛ بخشندهٔ عطایی که هر دو گروه از آن بهره می‌برند.">رَبِّكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودن یا قرار داشتن در حالتی؛ در «وما كان» منع‌شده بودن عطای پروردگار نفی می‌شود.">كانَ</button>
    <button class="word-link" type="button" data-word="عَطاءُ" data-root="ع ط و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-tt-w/" data-root-meaning="دادن و بخشش؛ تعاطی: دست به کاری زدن یا چیزی را گرفتن." data-context="عطا و بخشش پروردگار؛ موضوع جمله‌ای که منع‌شده بودن آن را نفی می‌کند.">عَطاءُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار تو؛ عطای او در انحصار یکی از دو گروه قرار ندارد.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="مَحظورًا" data-root="ح ظ ر" data-root-meaning="ریشهٔ «ح ظ ر» در زبان عربی بر منع، بازداشتن و ایجاد مانع دسترسی دلالت دارد. این معنا هم در محدودیت‌های غیرمادی دیده می‌شود و هم در ساخت حصارهای واقعی." data-context="منع‌شده یا بازداشته‌شده؛ در این آیه منع شدن عطای پروردگار نفی می‌شود و عطا به یکی از دو گروه مورد سخن اختصاص ندارد." data-learn-more="/quran-terminology/fa/roots/h-zha-r/">مَحظورًا</button>
  </p>
  <p class="farsi-verse">همه را، اینان و آنان را، از عطای پروردگارت مدد می‌رسانیم؛ و عطای پروردگارت منع‌شده نیست.</p>
</section>
