<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قُلنا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُلنا</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="أَحاطَ" data-root="ح و ط" data-learn-more="/quran-terminology/fa/roots/h-w-tt/" data-root-meaning="احاطه کردن، دربرگرفتن، پیرامون چیزی را گرفتن، از همه سو فراگرفتن؛ و در برخی کاربردها، نگاهبانی، مراقبت، یا محاصره">أَحاطَ</button>
    <button class="word-link" type="button" data-word="بِالنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">بِالنّاسِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="جَعَلنَا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنَا</button>
    <button class="word-link" type="button" data-word="الرُّءيَا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">الرُّءيَا</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="أَرَينٰكَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">أَرَينٰكَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="فِتنَةً" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">فِتنَةً</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="وَالشَّجَرَةَ" data-root="ش ج ر" data-learn-more="/quran-terminology/fa/roots/sh-j-r/" data-root-meaning="شاخه‌دار شدن، انشعاب، درهم‌تنیدگی، و گسترش پیچیده از یک اصل">وَالشَّجَرَةَ</button>
    <button class="word-link" type="button" data-word="المَلعونَةَ" data-root="ل ع ن" data-learn-more="/quran-terminology/fa/roots/l-ayn-n/" data-root-meaning="راندن، دور ساختن و قرار گرفتن در جایگاه طرد">المَلعونَةَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="القُرءانِ" data-root="ق ر أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-a/" data-root-meaning="خواندن و تلاوت؛ قروء: دوره‌های قاعدگی یا پاکی، با اختلاف در تفسیر.">القُرءانِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنُخَوِّفُهُم" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">وَنُخَوِّفُهُم</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="يَزيدُهُم" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین">يَزيدُهُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="طُغيٰنًا" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق">طُغيٰنًا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">كَبيرًا</button>
  </p>
  <p class="farsi-verse">و آنگاه که به تو گفتیم: پروردگارت مردم را فراگرفته است؛ و آن رؤیایی را که به تو نشان دادیم جز آزمونی برای مردم قرار ندادیم، و نیز آن درخت نفرین‌شده در قرآن را؛ و آنان را بیم می‌دهیم، اما جز بر سرکشی بزرگشان نمی‌افزاید.</p>
</section>
