<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="المُبَذِّرينَ" data-root="ب ذ ر" data-root-meaning="پراکندن و پخش کردن؛ در کشاورزی، پاشیدن دانه برای کشت؛ و در تبذیر، خرج کردن و ضایع ساختن نابجای دارایی و امکانات." data-learn-more="/quran-terminology/fa/roots/b-dh-r/" data-context="تبذیرکنندگان؛ کسانی که دارایی و امکانات را نابجا خرج و ضایع می‌کنند.">المُبَذِّرينَ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بوده‌اند؛ در این ساخت، بیان نسبت تبذیرکنندگان با شیاطین، بدون دلالت بر پایان یافتن آن در زمان حاضر.">كانوا</button>
    <button class="word-link" type="button" data-word="إِخوٰنَ" data-root="أ خ و" data-learn-more="/quran-terminology/fa/roots/a-kh-w/" data-root-meaning="«أخ» و «أخت» به برادر و خواهر اشاره دارند؛ نخست در پیوند خانوادگی، و در کاربرد گسترده‌تر، برای کسان یا چیزهایی که در نسبت، قوم، دین، راه، همکاری یا ویژگی مشترکی با یکدیگر پیوند دارند. «إخوة» و «إخوان» دو صورت جمع این خانواده‌اند که دامنه کاربردشان هم‌پوشانی دارد." data-context="برادران شیاطین؛ همراهی یا همانندی در رفتار و راه، نه خویشاوندی زیستی.">إِخوٰنَ</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیاطین؛ در ترکیب «برادران شیاطین»، بیان همراهی تبذیرکنندگان با راه و رفتار آنان.">الشَّيٰطينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بوده است؛ پیوند دادن ناسپاسی شیطان به وصف پیشین، بدون تعیین زمان پایان آن.">وَكانَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ موجود سرکش که در ادامه نسبت به پروردگارش سخت ناسپاس توصیف می‌شود.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="لِرَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="نسبت به پروردگارش؛ بیان رابطه‌ای که ناسپاسی شیطان در برابر آن نکوهش می‌شود.">لِرَبِّهِ</button>
    <button class="word-link" type="button" data-word="كَفورًا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="سخت ناسپاس؛ وصف شدید ناسپاسی شیطان نسبت به پروردگارش در این سیاق.">كَفورًا</button>
  </p>
  <p class="farsi-verse">بی‌گمان ریخت‌وپاش‌کنندگان برادران شیاطین‌اند؛ و شیطان نسبت به پروردگارش بسیار ناسپاس است.</p>
</section>
