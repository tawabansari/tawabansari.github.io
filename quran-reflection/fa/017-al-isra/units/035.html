<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَوفُوا" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="و کامل بدهید؛ فرمانِ تمام دادن پیمانه و کم نگذاشتن از مقدارِ حقِ طرف معامله.">وَأَوفُوا</button>
    <button class="word-link" type="button" data-word="الكَيلَ" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد" data-context="پیمانه؛ مقدارِ سنجیده‌شده با پیمانه که باید کامل داده شود.">الكَيلَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="كِلتُم" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد" data-context="پیمانه می‌کنید؛ سنجیدنِ مقدار با پیمانه، در موقعیتی که آیه به کامل دادن آن فرمان می‌دهد.">كِلتُم</button>
    <button class="word-link" type="button" data-word="وَزِنوا" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار" data-context="و وزن کنید؛ فرمانِ سنجیدن وزنِ کالا با ترازوی درست.">وَزِنوا</button>
    <button class="word-link" type="button" data-word="بِالقِسطاسِ" data-root="ق س ط س" data-root-meaning="ترازو و وسیلهٔ سنجش وزن؛ در کاربرد لغوی، به‌ویژه ترازوی درست و قابل اعتماد که برای رعایت عدالت در وزن‌کردن به کار می‌رود." data-context="با ترازو؛ ابزار وزن‌کردن که در این آیه با وصفِ «المستقيم»، در کنار فرمانِ کامل دادن پیمانه آمده است." data-learn-more="/quran-terminology/fa/roots/q-s-tt-s/">بِالقِسطاسِ</button>
    <button class="word-link" type="button" data-word="المُستَقيمِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="درست؛ وصفِ ترازو، با تأکید بر دقت و نبودِ انحراف در سنجش.">المُستَقيمِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ داوری دربارهٔ کامل دادن پیمانه و درست وزن‌کردن.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="وَأَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="و نیکوتر؛ برتریِ فرجامِ کامل دادن پیمانه و درست وزن‌کردن.">وَأَحسَنُ</button>
    <button class="word-link" type="button" data-word="تَأويلًا" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="از نظر فرجام؛ نتیجه و عاقبتِ رفتارِ سفارش‌شده در پیمانه و وزن، نه تفسیرِ متن.">تَأويلًا</button>
  </p>
  <p class="farsi-verse">و هنگامی که پیمانه می‌کنید، پیمانه را کامل بدهید و با ترازوی درست بسنجید؛ این بهتر و از نظر فرجام نیکوتر است.</p>
</section>
