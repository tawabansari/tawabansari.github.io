<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَقرَبُوا" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب">تَقرَبُوا</button>
    <button class="word-link" type="button" data-word="الزِّنىٰ" data-root="ز ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-n-y/" data-root-meaning="رابطه جنسی نامشروع؛ زنا و زن یا مرد مرتکب آن.">الزِّنىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="فٰحِشَةً" data-root="ف ح ش" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-h-sh/" data-root-meaning="زشتی آشکار و شدید در کردار یا گفتار.">فٰحِشَةً</button>
    <button class="word-link" type="button" data-word="وَساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">وَساءَ</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلًا</button>
  </p>
  <p class="farsi-verse">و به زنا نزدیک نشوید؛ بی‌گمان زشتکاری و راهی بد است.</p>
</section>
