<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنُنَزِّلُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="و نازل می‌کنیم؛ فروفرستادنِ پیام.">وَنُنَزِّلُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="القُرءانِ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنِ وصف‌شده به شفا و رحمت برای مؤمنان." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="شِفاءٌ" data-root="ش ف ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-f-y/" data-root-meaning="بهبود یافتن و درمان کردن." data-context="شفا؛ وصفِ قرآن برای مؤمنان.">شِفاءٌ</button>
    <button class="word-link" type="button" data-word="وَرَحمَةٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="و رحمت؛ وصفِ دیگرِ قرآن برای مؤمنان.">وَرَحمَةٌ</button>
    <button class="word-link" type="button" data-word="لِلمُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="برای مؤمنان؛ بهره‌مندانِ شفا و رحمت.">لِلمُؤمِنينَ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَزيدُ" data-root="ز ي د" data-learn-more="/quran-terminology/fa/roots/z-y-d/" data-root-meaning="افزودن، زیاد شدن، افزونی، و شدت گرفتن یک حالت فراتر از اندازه پیشین" data-context="می‌افزاید؛ نتیجه در نسبت با ستمگران.">يَزيدُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگران؛ گروهی که زیانشان افزوده می‌شود.">الظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="خَسارًا" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش" data-context="زیان؛ نتیجهٔ افزوده برای ستمگران.">خَسارًا</button>
  </p>
  <p class="farsi-verse">و از قرآن آنچه را برای مؤمنان شفا و رحمت است نازل می‌کنیم؛ و ستمگران را جز زیان نمی‌افزاید.</p>
</section>
