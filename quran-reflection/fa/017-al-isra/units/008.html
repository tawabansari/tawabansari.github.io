<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَسىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَسىٰ</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَرحَمَكُم" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">يَرحَمَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="عُدتُم" data-root="ع و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عُدتُم</button>
    <button class="word-link" type="button" data-word="عُدنا" data-root="ع و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عُدنا</button>
    ۘ
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="حَصيرًا" data-root="ح ص ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَصيرًا</button>
  </p>
  <p class="farsi-verse">باشد که پروردگارتان به شما رحم کند؛ و اگر بازگردید، ما نیز بازمی‌گردیم؛ و جهنم را برای کافران زندان قرار داده‌ایم.</p>
</section>
