<section class="ayah-block" id="ayah-108" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۰۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَيَقولونَ</button>
    <button class="word-link" type="button" data-word="سُبحٰنَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا">سُبحٰنَ</button>
    <button class="word-link" type="button" data-word="رَبِّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّنا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="وَعدُ" data-root="و ع د" data-learn-more="/quran-terminology/fa/roots/w-ayn-d/" data-root-meaning="وعده‌دادن، خبر دادن از امری در آینده، تعیین زمان یا جای دیدار، و هشدار درباره پیامدی که خواهد رسید">وَعدُ</button>
    <button class="word-link" type="button" data-word="رَبِّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّنا</button>
    <button class="word-link" type="button" data-word="لَمَفعولًا" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل">لَمَفعولًا</button>
  </p>
  <p class="farsi-verse">و می‌گویند: پاک است پروردگار ما؛ بی‌گمان وعده پروردگار ما انجام‌شدنی است.</p>
</section>
