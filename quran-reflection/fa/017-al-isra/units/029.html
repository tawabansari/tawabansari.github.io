<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَجعَل" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">تَجعَل</button>
    <button class="word-link" type="button" data-word="يَدَكَ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">يَدَكَ</button>
    <button class="word-link" type="button" data-word="مَغلولَةً" data-root="غ ل ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-l/" data-root-meaning="بند و زنجیر؛ غِلّ: کینه؛ غلول: خیانت در مال سپرده‌شده.">مَغلولَةً</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="عُنُقِكَ" data-root="ع ن ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-q/" data-root-meaning="گردن؛ گاه نماینده اشخاص یا حالت سر و گردن.">عُنُقِكَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبسُطها" data-root="ب س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-s-tt/" data-root-meaning="گشودن، گستردن و فراخ کردن؛ بسط می‌تواند مادی یا مربوط به توان و امکانات باشد.">تَبسُطها</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="البَسطِ" data-root="ب س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-s-tt/" data-root-meaning="گشودن، گستردن و فراخ کردن؛ بسط می‌تواند مادی یا مربوط به توان و امکانات باشد.">البَسطِ</button>
    <button class="word-link" type="button" data-word="فَتَقعُدَ" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار">فَتَقعُدَ</button>
    <button class="word-link" type="button" data-word="مَلومًا" data-root="ل و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-m/" data-root-meaning="ملامت و سرزنش.">مَلومًا</button>
    <button class="word-link" type="button" data-word="مَحسورًا" data-root="ح س ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-s-r/" data-root-meaning="کنار زدن پوشش؛ نیز خستگی و از توان افتادن، و حسرت و اندوه.">مَحسورًا</button>
  </p>
  <p class="farsi-verse">و دستت را به گردنت بسته مگذار و آن را یکسره مگشا، که سرزنش‌شده و درمانده می‌مانی.</p>
</section>
