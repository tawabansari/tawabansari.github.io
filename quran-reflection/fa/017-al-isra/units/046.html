<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار دادیم؛ پدید آمدنِ پوشش‌ها.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌هایشان؛ جایگاهِ پوششِ یادشده.">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="أَكِنَّةً" data-root="ك ن ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-n/" data-root-meaning="پوشاندن و در پناه محفوظ داشتن." data-context="پوشش‌ها؛ مانعِ فهمیدنِ پیام.">أَكِنَّةً</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَفقَهوهُ" data-root="ف ق ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-h2/" data-root-meaning="فهمیدن و دریافت دقیق سخن یا موضوع." data-context="آن را بفهمند؛ فهمی که پوشش‌ها مانع آن‌اند.">يَفقَهوهُ</button>
    <button class="word-link" type="button" data-word="وَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفى</button>
    <button class="word-link" type="button" data-word="ءاذانِهِم" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن" data-context="گوش‌هایشان؛ محلِ سنگینیِ شنیدن.">ءاذانِهِم</button>
    <button class="word-link" type="button" data-word="وَقرًا" data-root="و ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-r/" data-root-meaning="سنگینی؛ وَقر: سنگینی گوش؛ وِقر: بار؛ توقیر: بزرگداشت." data-context="سنگینی؛ مانعِ شنیدنِ پذیرنده.">وَقرًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="ذَكَرتَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یاد کردی؛ ذکرِ پروردگار در قرآن.">ذَكَرتَ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ موضوعِ ذکر.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="القُرءانِ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنی که پروردگار در آن به یگانگی یاد می‌شود." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانِ</button>
    <button class="word-link" type="button" data-word="وَحدَهُ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="تنها؛ بیانِ یگانگیِ پروردگار در ذکر.">وَحدَهُ</button>
    <button class="word-link" type="button" data-word="وَلَّوا" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد." data-context="روی گرداندند؛ واکنشِ گروه یادشده.">وَلَّوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَدبٰرِهِم" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشت‌هایشان؛ در تعبیرِ روی‌گردانی.">أَدبٰرِهِم</button>
    <button class="word-link" type="button" data-word="نُفورًا" data-root="ن ف ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-r/" data-root-meaning="از جا برخاستن و روانه شدن؛ نیز روی‌گردانی و رمیدن." data-context="گریزان؛ وصفِ روی‌گردانیِ آنان.">نُفورًا</button>
  </p>
  <p class="farsi-verse">و بر دل‌هایشان پوشش‌هایی قرار داده‌ایم تا آن را نفهمند و در گوش‌هایشان سنگینی؛ و هنگامی که در قرآن تنها پروردگارت را یاد می‌کنی، با گریز پشت می‌کنند.</p>
</section>
