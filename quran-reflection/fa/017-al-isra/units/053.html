<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و بگو؛ فرمان به پیامبر برای رساندن سفارش به بندگان.">وَقُل</button>
    <button class="word-link" type="button" data-word="لِعِبادى" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="به بندگان من؛ مخاطبان سفارش به گفتن سخن نیکوتر.">لِعِبادى</button>
    <button class="word-link" type="button" data-word="يَقولُوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگویند؛ سخنی را که نیکوتر است برگزینند.">يَقولُوا</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّتى</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکوتر؛ وصف سخنی که بندگان باید بگویند.">أَحسَنُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ کسی که میان آنان فساد و اختلاف برمی‌انگیزد.">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="يَنزَغُ" data-root="ن ز غ" data-learn-more="/quran-terminology/fa/roots/n-z-gh/" data-root-meaning="تحریک و برانگیختن آسیب‌رسان؛ به رفتار نادرست کشاندن یا میان اشخاص اختلاف و فساد افکندن." data-context="میان بندگان اختلاف و فساد برمی‌انگیزد؛ در پی هشدار درباره شیوه سخن گفتن.">يَنزَغُ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آنان؛ در روابط بندگان با یکدیگر.">بَينَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ در بیان دشمنی آشکار او با انسان.">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بوده است؛ در بیان دشمنی شیطان با انسان.">كانَ</button>
    <button class="word-link" type="button" data-word="لِلإِنسٰنِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="برای انسان؛ کسی که شیطان دشمن آشکار اوست.">لِلإِنسٰنِ</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن؛ وصف رابطه خصمانه شیطان با انسان.">عَدُوًّا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصف دشمنی شیطان با انسان.">مُبينًا</button>
  </p>
  <p class="farsi-verse">و به بندگانم بگو آنچه را بهتر است بگویند؛ بی‌گمان شیطان میان آنان آشوب می‌افکند؛ بی‌گمان شیطان برای انسان دشمنی آشکار است.</p>
</section>
