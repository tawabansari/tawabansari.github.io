<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتِ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="و بده و برسان؛ فرمان به ادای حقی که در ادامه بیان می‌شود.">وَءاتِ</button>
    <button class="word-link" type="button" data-word="ذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذَا</button>
    <button class="word-link" type="button" data-word="القُربىٰ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب" data-context="خویشاوندی؛ در ترکیب «ذَا الْقُرْبَىٰ»، آن‌که با تو پیوند خویشاوندی دارد.">القُربىٰ</button>
    <button class="word-link" type="button" data-word="حَقَّهُ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق او؛ آنچه باید برای خویشاوند رعایت یا به او داده شود.">حَقَّهُ</button>
    <button class="word-link" type="button" data-word="وَالمِسكينَ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن؛ و در شاخهٔ مسکین و مسکنت، نیازمندی، کم‌توانی و فرونشستگی در فشار فقر." data-context="و نیازمند؛ کسی که فشار نیاز توان زندگی او را محدود کرده است.">وَالمِسكينَ</button>
    <button class="word-link" type="button" data-word="وَابنَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار؛ و ابن، بنون و بنی، فرزند و پیوند نسلی." data-context="و «ابن» در ترکیب «ابن السبیل»؛ عنوانی برای مسافر نیازمند یا درراه‌مانده، نه فرزند زیستی راه.">وَابنَ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راه؛ در ترکیب «ابن السبیل»، مسافری که در راه به یاری نیازمند شده است.">السَّبيلِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُبَذِّر" data-root="ب ذ ر" data-root-meaning="پراکندن و پخش کردن؛ در کشاورزی، پاشیدن دانه برای کشت؛ و در تبذیر، خرج کردن و ضایع ساختن نابجای دارایی و امکانات." data-learn-more="/quran-terminology/fa/roots/b-dh-r/" data-context="بیهوده و نابجا خرج مکن و دارایی را ناروا هدر مده؛ فعل نهی خطاب به یک نفر.">تُبَذِّر</button>
    <button class="word-link" type="button" data-word="تَبذيرًا" data-root="ب ذ ر" data-root-meaning="پراکندن و پخش کردن؛ در کشاورزی، پاشیدن دانه برای کشت؛ و در تبذیر، خرج کردن و ضایع ساختن نابجای دارایی و امکانات." data-learn-more="/quran-terminology/fa/roots/b-dh-r/" data-context="تبذیر؛ مصدرِ تأکیدکنندهٔ نهی پیشین از مصرف ناروا، نه تعیین مبلغ یا شمار دفعات.">تَبذيرًا</button>
  </p>
  <p class="farsi-verse">و حق خویشاوند و نیازمند و درراه‌مانده را بده و ریخت‌وپاش مکن.</p>
</section>
