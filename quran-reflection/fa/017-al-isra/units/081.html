<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۸۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و بگو؛ فرمان به بیان پیام آیه.">وَقُل</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="آمد و حاضر شد؛ دربارهٔ حق.">جاءَ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ حقیقت و امر درست در برابر باطل.">الحَقُّ</button>
    <button class="word-link" type="button" data-word="وَزَهَقَ" data-root="ز ه ق" data-learn-more="/quran-terminology/fa/roots/z-h2-q/" data-root-meaning="پیش رفتن و گذشتن؛ در کاربردهای مربوط به حیات و بقا، بیرون رفتن، از میان رفتن و نابودی." data-context="و از میان رفت؛ دربارهٔ باطل در برابر حق.">وَزَهَقَ</button>
    <button class="word-link" type="button" data-word="البٰطِلُ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/" data-root-meaning="بی‌پایه شدن، فروپاشیدن، بی‌اثر و بی‌حقیقت بودن" data-context="باطل؛ آنچه در برابر حق از میان می‌رود.">البٰطِلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="البٰطِلَ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/" data-root-meaning="بی‌پایه شدن، فروپاشیدن، بی‌اثر و بی‌حقیقت بودن" data-context="باطل؛ موضوع حکمِ ازمیان‌رفتنی بودن.">البٰطِلَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بوده است؛ در این ساخت، بیانگر وصف باطل.">كانَ</button>
    <button class="word-link" type="button" data-word="زَهوقًا" data-root="ز ه ق" data-learn-more="/quran-terminology/fa/roots/z-h2-q/" data-root-meaning="پیش رفتن و گذشتن؛ در کاربردهای مربوط به حیات و بقا، بیرون رفتن، از میان رفتن و نابودی." data-context="ازمیان‌رفتنی و ناپایدار؛ وصف باطل.">زَهوقًا</button>
  </p>
  <p class="farsi-verse">و بگو: حق آمد و باطل از میان رفت؛ همانا باطل ازمیان‌رفتنی است.</p>
</section>
