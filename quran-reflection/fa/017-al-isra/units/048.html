<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="انظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">انظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="ضَرَبوا" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">ضَرَبوا</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="الأَمثالَ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">الأَمثالَ</button>
    <button class="word-link" type="button" data-word="فَضَلّوا" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">فَضَلّوا</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">سَبيلًا</button>
  </p>
  <p class="farsi-verse">بنگر چگونه برایت مَثَل‌ها زدند، پس گمراه شدند و نمی‌توانند راهی بیابند.</p>
</section>
