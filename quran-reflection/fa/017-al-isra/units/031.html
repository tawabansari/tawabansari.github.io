<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَقتُلوا" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/">تَقتُلوا</button>
    <button class="word-link" type="button" data-word="أَولٰدَكُم" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/">أَولٰدَكُم</button>
    <button class="word-link" type="button" data-word="خَشيَةَ" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/">خَشيَةَ</button>
    <button class="word-link" type="button" data-word="إِملٰقٍ" data-root="م ل ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">إِملٰقٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="نَرزُقُهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/">نَرزُقُهُم</button>
    <button class="word-link" type="button" data-word="وَإِيّاكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِيّاكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="قَتلَهُم" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/">قَتلَهُم</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَ</button>
    <button class="word-link" type="button" data-word="خِطـًٔا" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/">خِطـًٔا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/">كَبيرًا</button>
  </p>
  <p class="farsi-verse">و فرزندانتان را از ترس تنگدستی نکشید؛ ما آنان و شما را روزی می‌دهیم؛ بی‌گمان کشتن آنان خطایی بزرگ است.</p>
