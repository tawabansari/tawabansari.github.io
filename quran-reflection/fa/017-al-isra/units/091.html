<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۹۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ در درخواست داشتن باغ.">تَكونَ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="جَنَّةٌ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="باغی؛ یکی از خواسته‌های مطرح‌شده.">جَنَّةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نَخيلٍ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان." data-context="نخل‌ها؛ بخشی از درختان باغِ درخواستی.">نَخيلٍ</button>
    <button class="word-link" type="button" data-word="وَعِنَبٍ" data-root="ع ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-b/" data-root-meaning="انگور و تاک." data-context="و انگور؛ در کنار نخل‌ها.">وَعِنَبٍ</button>
    <button class="word-link" type="button" data-word="فَتُفَجِّرَ" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست." data-context="پس جاری سازی؛ رودها را در میان باغ.">فَتُفَجِّرَ</button>
    <button class="word-link" type="button" data-word="الأَنهٰرَ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="رودها؛ آنچه خواسته می‌شود در باغ جاری شوند.">الأَنهٰرَ</button>
    <button class="word-link" type="button" data-word="خِلٰلَها" data-root="خ ل ل" data-root-meaning="فاصله و فضای میان چیزها؛ نفوذ و گذشتن از میان آنها؛ و در کاربرد انسانی، دوستی و پیوند نزدیک." data-context="در میان آن؛ فضای باغِ درخواستی." data-learn-more="/quran-terminology/fa/roots/kh-l-l/">خِلٰلَها</button>
    <button class="word-link" type="button" data-word="تَفجيرًا" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست." data-context="به‌فراوانی جاری ساختن؛ مصدرِ تأکیدیِ فعل پیش از آن.">تَفجيرًا</button>
  </p>
  <p class="farsi-verse">یا باغی از نخل‌ها و انگور داشته باشی و نهرها را در میانش روان کنی.</p>
</section>
