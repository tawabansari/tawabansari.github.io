<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَءاتَينا</button>
    <button class="word-link" type="button" data-word="موسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسَى</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هُدًى</button>
    <button class="word-link" type="button" data-word="لِبَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">لِبَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَتَّخِذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">تَتَّخِذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونى" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونى</button>
    <button class="word-link" type="button" data-word="وَكيلًا" data-root="و ك ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَكيلًا</button>
  </p>
  <p class="farsi-verse">و به موسی کتاب دادیم و آن را برای بنی‌اسرائیل هدایت قرار دادیم که جز من کارسازی نگیرید.</p>
</section>
