  <p class="farsi-verse">و آنگاه که به فرشتگان گفتیم: برای آدم سجده کنید؛ پس سجده کردند جز ابلیس؛ گفت: آیا برای کسی سجده کنم که او را از گِل آفریدی؟</p>
