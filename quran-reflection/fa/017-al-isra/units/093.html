  <p class="farsi-verse">یا خانه‌ای از زر داشته باشی یا به آسمان بالا روی؛ و به بالا رفتنت ایمان نمی‌آوریم تا کتابی بر ما نازل کنی که آن را بخوانیم؛ بگو: پاک است پروردگار من؛ آیا جز انسانی فرستاده بوده‌ام؟</p>
