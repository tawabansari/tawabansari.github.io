<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سُبحٰنَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="منزّه و پاک دانستنِ آن‌که بنده‌اش را شبانه برد.">سُبحٰنَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَسرىٰ" data-root="س ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-y/" data-root-meaning="شبانه رفتن؛ سَریّ در سیاق مریم با جوی آب یا شخص گرامی توضیح داده شده است." data-context="شبانه برد؛ فعلِ سفر دادنِ بنده.">أَسرىٰ</button>
    <button class="word-link" type="button" data-word="بِعَبدِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بندهٔ او؛ شخصِ سفر داده‌شده.">بِعَبدِهِ</button>
    <button class="word-link" type="button" data-word="لَيلًا" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="در بخشی از شب؛ قیدِ زمانِ سفر.">لَيلًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَسجِدِ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="مسجد، در ترکیبِ «المسجد الحرام».">المَسجِدِ</button>
    <button class="word-link" type="button" data-word="الحَرامِ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="حرام و دارای حرمت؛ وصفِ مسجد.">الحَرامِ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَى</button>
    <button class="word-link" type="button" data-word="المَسجِدِ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم" data-context="مسجد، در ترکیبِ «المسجد الاقصی».">المَسجِدِ</button>
    <button class="word-link" type="button" data-word="الأَقصَا" data-root="ق ص و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-w/" data-root-meaning="دوری و دورترین جانب." data-context="دورتر یا دورترین؛ وصفِ مسجدِ مقصد.">الأَقصَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="بٰرَكنا" data-root="ب ر ك" data-root-meaning="ثبات و برقرار ماندن؛ برکت، خیرِ پایدار و فزاینده؛ «تبارک» در قرآن تعبیر بزرگداشت و خیر فراوان است." data-context="پیرامونِ مسجدالاقصی را برکت بخشیدیم؛ «حوله» متعلقِ مکانیِ فعل را مشخص می‌کند." data-learn-more="/quran-terminology/fa/roots/b-r-k/">بٰرَكنا</button>
    <button class="word-link" type="button" data-word="حَولَهُ" data-root="ح و ل" data-learn-more="/quran-terminology/fa/roots/h-w-l/" data-root-meaning="پیرامون، گردش، تغییر وضعیت، انتقال، حائل شدن، و جابه‌جایی نسبت میان چیزها" data-context="پیرامونِ آن؛ متعلقِ مکانیِ برکت.">حَولَهُ</button>
    <button class="word-link" type="button" data-word="لِنُرِيَهُ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="تا به او نشان دهیم؛ غرضِ بیان‌شده.">لِنُرِيَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌های ما؛ آنچه به بنده نشان داده می‌شود.">ءايٰتِنا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="السَّميعُ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/" data-root-meaning="شنیدن، گوش سپردن، دریافت پیام، و مسئولیت پس از شنیدن" data-context="شنوا؛ وصفِ گویندهٔ الهی.">السَّميعُ</button>
    <button class="word-link" type="button" data-word="البَصيرُ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینا؛ در کنارِ وصفِ شنوا.">البَصيرُ</button>
  </p>
  <p class="farsi-verse">منزه است آن که بنده‌اش را شبانه از مسجدالحرام به مسجد دورتر، که پیرامونش را برکت داده‌ایم، برد تا از آیات خود به او نشان دهیم؛ بی‌گمان او شنوای بیناست.</p>
</section>
