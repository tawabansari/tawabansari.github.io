<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالوا</button>
    <button class="word-link" type="button" data-word="أَءِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِذا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنّا</button>
    <button class="word-link" type="button" data-word="عِظٰمًا" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">عِظٰمًا</button>
    <button class="word-link" type="button" data-word="وَرُفٰتًا" data-root="ر ف ت" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَرُفٰتًا</button>
    <button class="word-link" type="button" data-word="أَءِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَءِنّا</button>
    <button class="word-link" type="button" data-word="لَمَبعوثونَ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه.">لَمَبعوثونَ</button>
    <button class="word-link" type="button" data-word="خَلقًا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلقًا</button>
    <button class="word-link" type="button" data-word="جَديدًا" data-root="ج د د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جَديدًا</button>
  </p>
  <p class="farsi-verse">و گفتند: آیا هنگامی که استخوان و خرده‌های پوسیده شدیم، به‌راستی با آفرینشی تازه برانگیخته می‌شویم؟</p>
</section>
