<section class="ayah-block" id="ayah-089" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۸۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="صَرَّفنا" data-root="ص ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-f/" data-root-meaning="برگرداندن و دگرگون کردن؛ تصریف: گرداندن یا گوناگون بیان کردن." data-context="گوناگون بیان کردیم؛ تنوعِ مثال‌ها در قرآن.">صَرَّفنا</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="برای مردم؛ مخاطبانِ مثال‌ها.">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذَا</button>
    <button class="word-link" type="button" data-word="القُرءانِ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنِ دارای مثال‌های گوناگون برای مردم." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ فراگیریِ مثال‌ها.">كُلِّ</button>
    <button class="word-link" type="button" data-word="مَثَلٍ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مثال؛ بیانِ روشنگر برای مردم.">مَثَلٍ</button>
    <button class="word-link" type="button" data-word="فَأَبىٰ" data-root="أ ب ي" data-learn-more="/quran-terminology/fa/roots/a-b-y/" data-root-meaning="خودداری، نپذیرفتن و سر باز زدن؛ انگیزه و ارزش اخلاقی این خودداری به موضوع، فاعل و سیاق وابسته است." data-context="پس نپذیرفت؛ امتناعِ بیشتر مردم.">فَأَبىٰ</button>
    <button class="word-link" type="button" data-word="أَكثَرُ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="بیشتر؛ نسبتِ مردمِ ممتنع.">أَكثَرُ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه" data-context="مردم؛ گروهِ دارای واکنشِ یادشده.">النّاسِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="كُفورًا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="انکار؛ آنچه بر آن اصرار دارند.">كُفورًا</button>
  </p>
  <p class="farsi-verse">و به‌راستی در این قرآن برای مردم از هر مثلی به گونه‌های گوناگون بیان کردیم، اما بیشتر مردم جز انکار را نپذیرفتند.</p>
</section>
