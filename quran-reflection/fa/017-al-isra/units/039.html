<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="أَوحىٰ" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق.">أَوحىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الحِكمَةِ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">الحِكمَةِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَجعَل" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">تَجعَل</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِلٰهًا" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">إِلٰهًا</button>
    <button class="word-link" type="button" data-word="ءاخَرَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">ءاخَرَ</button>
    <button class="word-link" type="button" data-word="فَتُلقىٰ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">فَتُلقىٰ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="مَلومًا" data-root="ل و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-m/" data-root-meaning="ملامت و سرزنش.">مَلومًا</button>
    <button class="word-link" type="button" data-word="مَدحورًا" data-root="د ح ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-h-r/" data-root-meaning="راندن، دور کردن و طرد کردن.">مَدحورًا</button>
  </p>
  <p class="farsi-verse">این از حکمتی است که پروردگارت به تو وحی کرده است؛ و همراه آن معبود یگانه معبود دیگری قرار مده، که سرزنش‌شده و رانده‌شده در جهنم افکنده می‌شوی.</p>
</section>
