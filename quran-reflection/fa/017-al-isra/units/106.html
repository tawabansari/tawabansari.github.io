<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۱۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُرءانًا" data-root="ق ر أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-a/" data-root-meaning="خواندن و تلاوت؛ قروء: دوره‌های قاعدگی یا پاکی، با اختلاف در تفسیر.">وَقُرءانًا</button>
    <button class="word-link" type="button" data-word="فَرَقنٰهُ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">فَرَقنٰهُ</button>
    <button class="word-link" type="button" data-word="لِتَقرَأَهُ" data-root="ق ر أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-a/" data-root-meaning="خواندن و تلاوت؛ قروء: دوره‌های قاعدگی یا پاکی، با اختلاف در تفسیر.">لِتَقرَأَهُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسِ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مُكثٍ" data-root="م ك ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-th/" data-root-meaning="درنگ و ماندن.">مُكثٍ</button>
    <button class="word-link" type="button" data-word="وَنَزَّلنٰهُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">وَنَزَّلنٰهُ</button>
    <button class="word-link" type="button" data-word="تَنزيلًا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">تَنزيلًا</button>
  </p>
  <p class="farsi-verse">و قرآنی که آن را بخش‌بخش کردیم تا آن را با درنگ بر مردم بخوانی، و آن را به‌تدریج نازل کردیم.</p>
</section>
