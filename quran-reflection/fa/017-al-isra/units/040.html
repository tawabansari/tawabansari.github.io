<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">الاسراء ۱۷:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَصفىٰكُم" data-root="ص ف و" data-learn-more="/quran-terminology/fa/roots/sad-f-w/" data-root-meaning="صفا و خلوص، برگزیدن، پالودگی و سنگ صاف" data-context="آیا شما را ویژه ساخته است؟ پرسش انتقادی درباره نسبت دادن پسران و فرشتگان.">أَفَأَصفىٰكُم</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار شما؛ سرچشمه تخفیف و رحمت.">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="بِالبَنينَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="پسران؛ در پرسش انتقادی درباره ادعای ترجیح.">بِالبَنينَ</button>
    <button class="word-link" type="button" data-word="وَاتَّخَذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="و برگرفت؛ در پرسش انتقادی درباره ادعای فرشتگان.">وَاتَّخَذَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="فرشتگان؛ موضوع ادعای مؤنث نامیدن یا مؤنث آفریده شدن.">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="إِنٰثًا" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="مؤنث‌ها؛ ادعای مؤنث گرفتن فرشتگان و نسبت دادن آنها به آن معبود یگانه، در پرسش انتقادی.">إِنٰثًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="لَتَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بی‌گمان می‌گویید؛ تأکید بر گفتار مورد نقد.">لَتَقولونَ</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخنی؛ گفتارِ ناروا و بزرگ شمرده‌شده.">قَولًا</button>
    <button class="word-link" type="button" data-word="عَظيمًا" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ و سنگین؛ وصف سخنِ ناروا.">عَظيمًا</button>
  </p>
  <p class="farsi-verse">آیا پروردگارتان شما را به پسران برگزیده و خود از فرشتگان دختران گرفته است؟ بی‌گمان سخنی بزرگ می‌گویید.</p>
</section>
