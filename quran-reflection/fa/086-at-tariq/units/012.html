<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الطارق ۸۶:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="و زمین؛ موضوعِ سوگند.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="ذاتِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذاتِ</button>
    <button class="word-link" type="button" data-word="الصَّدعِ" data-root="ص د ع" data-root-meaning="شکافتن و گسستن پیوستگی؛ در کاربردها، شکافتگی جسم، جدایی گروه‌ها، بیان آشکار و سردرد." data-context="شکافتگی؛ در وصفِ زمین به داشتن شکاف، بدون تعیین نوع یا علتِ آن از خود واژه." data-learn-more="/quran-terminology/fa/roots/sad-d-ayn/">الصَّدعِ</button>
  </p>
  <p class="farsi-verse">و به زمینِ دارای شکاف،</p>
