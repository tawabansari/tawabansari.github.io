<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">الطارق ۸۶:۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَدرىٰكَ" data-root="د ر ي" data-learn-more="/quran-terminology/fa/roots/d-r-y/" data-root-meaning="دانستن و آگاه بودن از موضوعی؛ در باب افعال، آگاه ساختن دیگری." data-context="تو را آگاه ساخته است؛ پرسش دربارهٔ طارق.">أَدرىٰكَ</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَا</button>
    <button class="word-link" type="button" data-word="الطّارِقُ" data-root="ط ر ق" data-learn-more="/quran-terminology/fa/roots/tt-r-q/" data-root-meaning="کوبیدن، راه، طریقه، طرائق و طارق شبانه" data-context="طارق؛ آنچه آیه با این نام درباره‌اش پرسش می‌کند.">الطّارِقُ</button>
  </p>
  <p class="farsi-verse">و چه چیز تو را آگاه کرد که شب‌آینده چیست؟</p>
</section>
