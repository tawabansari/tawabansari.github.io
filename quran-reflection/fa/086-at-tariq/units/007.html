<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الطارق ۸۶:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون می‌آید؛ فعلِ خروج در پیِ ذکرِ آب دافق.">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میانِ؛ در ساختِ «من بين».">بَينِ</button>
    <button class="word-link" type="button" data-word="الصُّلبِ" data-root="ص ل ب" data-root-meaning="سختی و استواری؛ صُلب: ستون پشت و در ترکیب نسب، پیوند نسلی؛ صَلب: به صلیب کشیدن انسان." data-context="صلب؛ ستون استخوانی پشت، در ترکیبِ «از میان صلب و ترائب»." data-learn-more="/quran-terminology/fa/roots/sad-l-b/">الصُّلبِ</button>
    <button class="word-link" type="button" data-word="وَالتَّرائِبِ" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه" data-context="و ترائب؛ نام ناحیه یا استخوان‌های پیشین بالاتنه که حدود دقیق آن نیازمند بررسی مستقل است.">وَالتَّرائِبِ</button>
  </p>
  <p class="farsi-verse">که از میان پشت و استخوان‌های سینه بیرون می‌آید.</p>
</section>
