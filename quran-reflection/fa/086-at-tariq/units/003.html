<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الطارق ۸۶:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="النَّجمُ" data-root="ن ج م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-j-m/" data-root-meaning="برآمدن و نمایان شدن؛ نجم: ستاره یا گیاه بی‌ساقه، بنا بر سیاق.">النَّجمُ</button>
    <button class="word-link" type="button" data-word="الثّاقِبُ" data-root="ث ق ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/th-q-b/" data-root-meaning="سوراخ کردن و نفوذ؛ ثاقب در وصف روشنایی: درخشان و نفوذکننده.">الثّاقِبُ</button>
  </p>
  <p class="farsi-verse">آن ستارهٔ فروزان.</p>
