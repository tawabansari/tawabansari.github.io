<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الر" data-context="حروف جداگانه: الف، لام، را." data-learn-more="/fa/quran-terminology/huruf-muqattaat/">الر</button>
    ۚ
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">تِلكَ</button>
    <button class="word-link" type="button" data-word="ءايٰتُ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات؛ نشانه‌ها و پیام‌های کتاب.">ءايٰتُ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتاب؛ متنِ مورد اشاره.">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="وَقُرءانٍ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="و قرآن؛ متنِ روشنِ مورد اشاره." data-learn-more="/quran-terminology/fa/roots/q-r-a/">وَقُرءانٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="روشن؛ وصفِ قرآن.">مُبينٍ</button>
  </p>
  <p class="farsi-verse">الف، لام، را. اینها آیات کتاب و قرآنی روشن است.</p>
</section>
