<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="اهل بیشه ستمگر بودند.">كانَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="اهل و مردمانِ وابسته به ایکه؛ در این عنوان، نه لزوماً مالکان حقوقی.">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="الأَيكَةِ" data-root="أ ي ك" data-learn-more="/quran-terminology/fa/roots/a-y-k/" data-root-meaning="اجتماع و درهم‌تنیدگی درختان؛ «أیکة»، بیشه و پوشش درختی انبوه؛ در قرآن بخشی از عنوانِ اصحاب ایکه." data-context="ایکه؛ بیشه یا درختستانی که جماعت با آن شناخته می‌شد.">الأَيكَةِ</button>
    <button class="word-link" type="button" data-word="لَظٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="به‌راستی ستمگر؛ وصف اهل بیشه.">لَظٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی اهل بیشه ستمکار بودند.</p>
</section>
