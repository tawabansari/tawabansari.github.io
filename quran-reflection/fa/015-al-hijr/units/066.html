<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۶۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَضَينا" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="و اعلام قطعی کردیم؛ دربارهٔ سرانجام آن گروه.">وَقَضَينا</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="الأَمرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="این امر؛ خبرِ قطعیِ پایان آن گروه.">الأَمرَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="دابِرَ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="آخرین بازماندهٔ این گروه؛ در خبرِ قطع شدن.">دابِرَ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="مَقطوعٌ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="قطع‌شده و از میان رفتنی؛ وصف دنبالهٔ آن گروه.">مَقطوعٌ</button>
    <button class="word-link" type="button" data-word="مُصبِحينَ" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ." data-context="هنگام صبح؛ زمانِ تحققِ سرانجامِ اعلام‌شده.">مُصبِحينَ</button>
  </p>
  <p class="farsi-verse">و این امر را به او رساندیم که ریشه اینان هنگام صبح بریده خواهد شد.</p>
</section>
