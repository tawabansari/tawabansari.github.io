<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز گفتار پروردگار به فرشتگان.">قالَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ گویندهٔ اعلام آفرینش بشر.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="لِلمَلٰئِكَةِ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن" data-context="به فرشتگان؛ مخاطبانِ اعلام آفرینش بشر.">لِلمَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="خٰلِقٌ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفریننده؛ اعلامِ آفریدن بشر.">خٰلِقٌ</button>
    <button class="word-link" type="button" data-word="بَشَرًا" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="بشری؛ انسانی که آفرینش او اعلام می‌شود.">بَشَرًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="صَلصٰلٍ" data-root="ص ل ص ل" data-root-meaning="صدای آشکار و طنین‌دار، گاهی تکرارشونده؛ در صورت «صَلْصَال»، گل خشکیده‌ای که هنگام برخورد چنین صدایی ایجاد می‌کند." data-context="همان گل خشکیدهٔ صدادار؛ در اعلام پروردگار به فرشتگان دربارهٔ آفرینش بشر." data-learn-more="/quran-terminology/fa/roots/sad-l-sad-l/">صَلصٰلٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَمَإٍ" data-root="ح م أ" data-root-meaning="گل‌ولای تیره و رسوبی در آب یا محیط مرطوب؛ ماده‌ای که می‌تواند رنگ، شفافیت یا بوی آب را تغییر دهد." data-context="گل تیره و لجن‌مانند؛ منشأ یا جنسِ صلصال." data-learn-more="/quran-terminology/fa/roots/h-m-a/">حَمَإٍ</button>
    <button class="word-link" type="button" data-word="مَسنونٍ" data-root="س ن ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-n/" data-root-meaning="دندان؛ سنّت: روش جاری؛ مسنون: شکل‌داده‌شده یا دگرگون‌شده، بنا بر توضیح لغوی." data-context="دگرگون‌شده؛ وصفِ حمأ، با اختلافِ شرح‌های لغوی دربارهٔ این صورت.">مَسنونٍ</button>
  </p>
  <p class="farsi-verse">و هنگامی که پروردگارت به فرشتگان گفت: من بشری از گلی خشک و صداکننده، از لجن دگرگون‌شده می‌آفرینم.</p>
</section>
