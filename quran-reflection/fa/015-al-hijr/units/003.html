<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذَرهُم" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ذَرهُم</button>
    <button class="word-link" type="button" data-word="يَأكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف">يَأكُلوا</button>
    <button class="word-link" type="button" data-word="وَيَتَمَتَّعوا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">وَيَتَمَتَّعوا</button>
    <button class="word-link" type="button" data-word="وَيُلهِهِمُ" data-root="ل ه و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيُلهِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَمَلُ" data-root="أ م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَمَلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَسَوفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَسَوفَ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">بگذار بخورند و بهره ببرند و آرزو سرگرمشان کند؛ پس به‌زودی خواهند دانست.</p>
</section>
