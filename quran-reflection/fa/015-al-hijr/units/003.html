<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذَرهُم" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="آنان را واگذار؛ فرمان مفرد خطاب به محمد درباره مخالفان مورد بحث، نه فرمانی عمومی برای رها کردن همه انسان‌ها.">ذَرهُم</button>
    <button class="word-link" type="button" data-word="يَأكُلوا" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="تا بخورند؛ در ادامه فرمان واگذاشتن آنان و توصیف برخورداری‌ای که با غفلت همراه شده است.">يَأكُلوا</button>
    <button class="word-link" type="button" data-word="وَيَتَمَتَّعوا" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار." data-context="و بهره ببرند؛ برخورداری از زندگی، در این سیاق همراه با سرگرمی و بی‌توجهی به فرجام.">وَيَتَمَتَّعوا</button>
    <button class="word-link" type="button" data-word="وَيُلهِهِمُ" data-root="ل ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h2-w/" data-root-meaning="سرگرمی بازدارنده از امر مهم؛ الهاء: مشغول و غافل کردن." data-context="و آنان را سرگرم و غافل سازد؛ فاعل این فعل «الأمل» است و ضمیر «هم» مفعول آن.">وَيُلهِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَمَلُ" data-root="أ م ل" data-learn-more="/quran-terminology/fa/roots/a-m-l/" data-root-meaning="امید و انتظار رسیدن به چیزی مطلوب که هنوز تحقق نیافته است؛ چشم داشتن به آینده با تصور امکان دستیابی به آن." data-context="امید و چشم‌داشت آنان به آینده که در این وضعیت، ایشان را سرگرم و از حقیقت غافل می‌سازد؛ غفلت از «يلههم» شناخته می‌شود، نه از خود «أمل».">الأَمَلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَسَوفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَسَوفَ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="خواهند دانست؛ آگاهی آینده از فرجام رفتار، بدون تعیین تاریخ دقیق یا ضرورت نزدیکی آن در این عبارت.">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">بگذار بخورند و بهره ببرند و آرزو سرگرمشان کند؛ پس به‌زودی خواهند دانست.</p>
</section>
