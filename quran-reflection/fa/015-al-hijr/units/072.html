<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَعَمرُكَ" data-root="ع م ر" data-learn-more="/quran-terminology/fa/roots/ayn-m-r/" data-root-meaning="عَمَرَ؛ دوام زندگی، آباد ماندن و حضور پایدار">لَعَمرُكَ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَفى</button>
    <button class="word-link" type="button" data-word="سَكرَتِهِم" data-root="س ك ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سَكرَتِهِم</button>
    <button class="word-link" type="button" data-word="يَعمَهونَ" data-root="ع م ه" data-learn-more="/quran-terminology/fa/roots/ayn-m-h2/" data-root-meaning="سرگردان شدن، حیران ماندن، حرکت بی‌جهت، و نابینایی درونی نسبت به راه درست">يَعمَهونَ</button>
  </p>
  <p class="farsi-verse">به جان تو سوگند، آنان در مستی خود سرگردان بودند.</p>
