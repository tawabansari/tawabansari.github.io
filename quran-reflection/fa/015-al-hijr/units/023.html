<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَنَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنَحنُ</button>
    <button class="word-link" type="button" data-word="نُحيۦ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">نُحيۦ</button>
    <button class="word-link" type="button" data-word="وَنُميتُ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">وَنُميتُ</button>
    <button class="word-link" type="button" data-word="وَنَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَنَحنُ</button>
    <button class="word-link" type="button" data-word="الوٰرِثونَ" data-root="و ر ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-th/" data-root-meaning="به ارث بردن و منتقل شدن دارایی یا جایگاه به جانشین.">الوٰرِثونَ</button>
  </p>
  <p class="farsi-verse">و بی‌گمان ماییم که زنده می‌کنیم و می‌میرانیم و ماییم وارثان.</p>
</section>
