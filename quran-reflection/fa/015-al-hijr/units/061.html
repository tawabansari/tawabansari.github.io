<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۶۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَ</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">ءالَ</button>
    <button class="word-link" type="button" data-word="لوطٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لوطٍ</button>
    <button class="word-link" type="button" data-word="المُرسَلونَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">المُرسَلونَ</button>
  </p>
  <p class="farsi-verse">پس هنگامی که فرستادگان نزد خاندان لوط آمدند،</p>
</section>
