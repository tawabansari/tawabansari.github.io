<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَسرِ" data-root="س ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-y/" data-root-meaning="شبانه رفتن؛ سَریّ در سیاق مریم با جوی آب یا شخص گرامی توضیح داده شده است." data-context="پس شبانه حرکت کن و روانه شو.">فَأَسرِ</button>
    <button class="word-link" type="button" data-word="بِأَهلِكَ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="با خانواده و وابستگان خود.">بِأَهلِكَ</button>
    <button class="word-link" type="button" data-word="بِقِطعٍ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="در پاره‌ای از شب.">بِقِطعٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب، زمانِ فرمان حرکت.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَاتَّبِع" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="و در پی آنان برو.">وَاتَّبِع</button>
    <button class="word-link" type="button" data-word="أَدبٰرَهُم" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="پشتِ سر و بخش پایانیِ گروه آنان.">أَدبٰرَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَلتَفِت" data-root="ل ف ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-f-t/" data-root-meaning="برگرداندن و رو کردن به سویی." data-context="هیچ‌یک روی نگرداند و به عقب ننگرد.">يَلتَفِت</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="أَحَدٌ" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="هیچ‌کس از میان شما.">أَحَدٌ</button>
    <button class="word-link" type="button" data-word="وَامضوا" data-root="م ض ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-dad-y/" data-root-meaning="گذشتن و پیش رفتن." data-context="و پیش بروید و راه خود را ادامه دهید.">وَامضوا</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="به جایی یا جهتی که فرمان داده می‌شوید." data-learn-more="/quran-terminology/fa/roots/h-y-th/" data-root-note="معنای کوتاه واژه: مکان یا موقعیتی که جملهٔ همراه آن مشخص می‌کند؛ با «مِنْ»، مبدأ یا منشأ، و در کاربرد تعمیمی، هرجا که. «حيث» ظرفی عمدتاً جامد است.">حَيثُ</button>
    <button class="word-link" type="button" data-word="تُؤمَرونَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="به جایی که فرمان داده می‌شوید.">تُؤمَرونَ</button>
  </p>
  <p class="farsi-verse">پس در بخشی از شب با خانواده‌ات حرکت کن و از پی آنان برو و هیچ‌یک از شما به عقب ننگرد؛ و به جایی بروید که فرمان داده می‌شوید.</p>
</section>
