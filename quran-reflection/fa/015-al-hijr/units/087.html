<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۸۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينٰكَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به تو دادیم؛ عطای بیان‌شده.">ءاتَينٰكَ</button>
    <button class="word-link" type="button" data-word="سَبعًا" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ مورد عطا." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَثانى" data-root="ث ن ي" data-root-meaning="دوتایی‌شدن، بازگرداندن و تکرار" data-context="مثانی؛ وصفِ تکرارشوندگی یا دوگانگیِ مجموعه، با اختلاف در تعیین مصداق." data-learn-more="/quran-terminology/fa/roots/th-n-y/">المَثانى</button>
    <button class="word-link" type="button" data-word="وَالقُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="و قرآن؛ متنِ بزرگِ عطاشده به مخاطب." data-learn-more="/quran-terminology/fa/roots/q-r-a/">وَالقُرءانَ</button>
    <button class="word-link" type="button" data-word="العَظيمَ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر" data-context="بزرگ؛ وصفِ قرآنِ عطاشده.">العَظيمَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی به تو هفت از تکرارشونده‌ها و قرآن بزرگ را دادیم.</p>
</section>
