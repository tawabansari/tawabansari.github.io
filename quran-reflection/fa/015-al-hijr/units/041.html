<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="صِرٰطٌ" data-root="ص ر ط" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد" data-learn-more="/quran-terminology/fa/roots/s-r-t/">صِرٰطٌ</button>
    <button class="word-link" type="button" data-word="عَلَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَىَّ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُستَقيمٌ</button>
  </p>
  <p class="farsi-verse">گفت: این راهی راست بر عهده من است.</p>
</section>
