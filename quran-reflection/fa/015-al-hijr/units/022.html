<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَرسَلنَا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">وَأَرسَلنَا</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">الرِّيٰحَ</button>
    <button class="word-link" type="button" data-word="لَوٰقِحَ" data-root="ل ق ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-q-h/" data-root-meaning="باروری و بارور کردن؛ لواقح: بارورکننده یا بارآور، در وصف بادها.">لَوٰقِحَ</button>
    <button class="word-link" type="button" data-word="فَأَنزَلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">فَأَنزَلنا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَسقَينٰكُموهُ" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب.">فَأَسقَينٰكُموهُ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="بِخٰزِنينَ" data-root="خ ز ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-z-n/" data-root-meaning="اندوختن و نگه داشتن؛ خزانه و نگهبان آن.">بِخٰزِنينَ</button>
  </p>
  <p class="farsi-verse">و بادها را بارورکننده فرستادیم، پس از آسمان آبی فرو فرستادیم و آن را به شما نوشاندیم؛ و شما ذخیره‌کننده آن نیستید.</p>
</section>
