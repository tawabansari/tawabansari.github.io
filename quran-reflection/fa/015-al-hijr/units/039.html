<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="أَغوَيتَنى" data-root="غ و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَغوَيتَنى</button>
    <button class="word-link" type="button" data-word="لَأُزَيِّنَنَّ" data-root="ز ي ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَأُزَيِّنَنَّ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلَأُغوِيَنَّهُم" data-root="غ و ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَلَأُغوِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="أَجمَعينَ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">أَجمَعينَ</button>
  </p>
  <p class="farsi-verse">گفت: پروردگار من، به سبب آنکه مرا گمراه کردی، حتماً در زمین برای آنان می‌آرایم و حتماً همه آنان را گمراه می‌کنم،</p>
