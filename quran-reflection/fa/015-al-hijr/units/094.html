<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاصدَع" data-root="ص د ع" data-root-meaning="شکافتن و گسستن پیوستگی؛ در کاربردها، شکافتگی جسم، جدایی گروه‌ها، بیان آشکار و سردرد." data-context="پس آشکار و صریح بیان کن؛ فرمان به اعلام آنچه پیامبر بدان مأمور است." data-learn-more="/quran-terminology/fa/roots/sad-d-ayn/">فَاصدَع</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تُؤمَرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان داده می‌شوی؛ فعل مجهول خطاب به پیامبر.">تُؤمَرُ</button>
    <button class="word-link" type="button" data-word="وَأَعرِض" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="و روی بگردان؛ فرمان به اعراض از گروهِ یادشده.">وَأَعرِض</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="مشرکان؛ کسانی که شریک قرار می‌دهند.">المُشرِكينَ</button>
  </p>
  <p class="farsi-verse">پس آنچه را فرمان می‌یابی آشکارا بیان کن و از مشرکان روی بگردان.</p>
</section>
