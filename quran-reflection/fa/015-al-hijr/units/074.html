<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">فَجَعَلنا</button>
    <button class="word-link" type="button" data-word="عٰلِيَها" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عٰلِيَها</button>
    <button class="word-link" type="button" data-word="سافِلَها" data-root="س ف ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سافِلَها</button>
    <button class="word-link" type="button" data-word="وَأَمطَرنا" data-root="م ط ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَأَمطَرنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="حِجارَةً" data-root="ح ج ر" data-learn-more="/quran-terminology/fa/roots/h-j-r/">حِجارَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سِجّيلٍ" data-root="س ج ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سِجّيلٍ</button>
  </p>
  <p class="farsi-verse">پس بالای آن را زیر آن قرار دادیم و بر آنان سنگ‌هایی از گل پخته باراندیم.</p>
