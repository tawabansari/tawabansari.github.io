<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۸۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتَينٰهُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَءاتَينٰهُم</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَكانوا</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنها</button>
    <button class="word-link" type="button" data-word="مُعرِضينَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">مُعرِضينَ</button>
  </p>
  <p class="farsi-verse">و آیات خود را به آنان دادیم، ولی از آنها روی‌گردان بودند.</p>
</section>
