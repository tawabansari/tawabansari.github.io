<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۹۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="جَعَلُوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار دادند؛ رفتار با قرآن در عبارت بعدی.">جَعَلُوا</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنی که پاره‌پاره گرفتنِ آن نکوهش می‌شود." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="عِضينَ" data-root="ع ض و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-dad-w/" data-root-meaning="پاره و بخش کردن؛ عضین: بخش‌ها، با اختلاف در تحلیل اشتقاقی واژه." data-context="پاره‌پاره؛ بخش‌بندیِ قرآن در رفتارِ نکوهیدهٔ یادشده.">عِضينَ</button>
  </p>
  <p class="farsi-verse">کسانی که قرآن را پاره‌پاره کردند.</p>
</section>
