<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۸۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="خَلَقنَا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقنَا</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُما</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="السّاعَةَ" data-root="س و ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">السّاعَةَ</button>
    <button class="word-link" type="button" data-word="لَـٔاتِيَةٌ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">لَـٔاتِيَةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاصفَحِ" data-root="ص ف ح" data-learn-more="/quran-terminology/fa/roots/sad-f-h/" data-root-meaning="صَفَحَ؛ روی و جانب گرداندن و از چیزی درگذشتن">فَاصفَحِ</button>
    <button class="word-link" type="button" data-word="الصَّفحَ" data-root="ص ف ح" data-learn-more="/quran-terminology/fa/roots/sad-f-h/" data-root-meaning="صَفَحَ؛ روی و جانب گرداندن و از چیزی درگذشتن">الصَّفحَ</button>
    <button class="word-link" type="button" data-word="الجَميلَ" data-root="ج م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الجَميلَ</button>
  </p>
  <p class="farsi-verse">و آسمان‌ها و زمین و آنچه میان آن دو است را جز به حق نیافریدیم؛ و بی‌گمان آن ساعت آمدنی است؛ پس با گذشتی زیبا درگذر.</p>
</section>
