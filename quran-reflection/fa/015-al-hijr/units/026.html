<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="خَلَقنَا" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="آفریدیم؛ گزارش آفرینش انسان از مادهٔ بیان‌شده.">خَلَقنَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان؛ موجودی که مادهٔ آفرینش او در این آیه بیان می‌شود.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="صَلصٰلٍ" data-root="ص ل ص ل" data-root-meaning="صدای آشکار و طنین‌دار، گاهی تکرارشونده؛ در صورت «صَلْصَال»، گل خشکیده‌ای که هنگام برخورد چنین صدایی ایجاد می‌کند." data-context="گل خشکیده‌ای که هنگام برخورد صدای طنین‌دار ایجاد می‌کند؛ در اینجا مادهٔ آفرینش انسان، با منشأ یا جنسِ حمأ مسنون." data-learn-more="/quran-terminology/fa/roots/sad-l-sad-l/">صَلصٰلٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَمَإٍ" data-root="ح م أ" data-root-meaning="گل‌ولای تیره و رسوبی در آب یا محیط مرطوب؛ ماده‌ای که می‌تواند رنگ، شفافیت یا بوی آب را تغییر دهد." data-context="گل تیره و لجن‌مانند؛ منشأ یا جنسِ صلصالِ یادشده." data-learn-more="/quran-terminology/fa/roots/h-m-a/">حَمَإٍ</button>
    <button class="word-link" type="button" data-word="مَسنونٍ" data-root="س ن ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-n/" data-root-meaning="دندان؛ سنّت: روش جاری؛ مسنون: شکل‌داده‌شده یا دگرگون‌شده، بنا بر توضیح لغوی." data-context="دگرگون‌شده؛ وصفِ حمأ در برگردان این آیه، با وجود شرح‌های لغوی دیگری مانند شکل‌یافته.">مَسنونٍ</button>
  </p>
  <p class="farsi-verse">و به‌راستی انسان را از گلی خشک و صداکننده، از لجن دگرگون‌شده آفریدیم.</p>
</section>
