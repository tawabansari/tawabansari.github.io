<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانوا</button>
    <button class="word-link" type="button" data-word="يَنحِتونَ" data-root="ن ح ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h-t/" data-root-meaning="تراشیدن سنگ، چوب یا جسم سخت.">يَنحِتونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند.">الجِبالِ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="ب ي ت" data-learn-more="/quran-terminology/fa/roots/b-y-t/" data-root-meaning="خانه و جای اقامت؛ بات: شب را گذراندن؛ تبییت: ترتیب دادن کاری در شب یا پنهانی." data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست.">بُيوتًا</button>
    <button class="word-link" type="button" data-word="ءامِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامِنينَ</button>
  </p>
  <p class="farsi-verse">و با امنیت از کوه‌ها خانه‌هایی می‌تراشیدند.</p>
</section>
