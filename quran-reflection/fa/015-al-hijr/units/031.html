<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="إِبليسَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبليسَ</button>
    <button class="word-link" type="button" data-word="أَبىٰ" data-root="أ ب ي" data-learn-more="/quran-terminology/fa/roots/a-b-y/" data-root-meaning="خودداری، نپذیرفتن و سر باز زدن؛ انگیزه و ارزش اخلاقی این خودداری به موضوع، فاعل و سیاق وابسته است.">أَبىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكونَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="السّٰجِدينَ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">السّٰجِدينَ</button>
  </p>
  <p class="farsi-verse">جز ابلیس که خودداری کرد از سجده‌کنندگان باشد.</p>
</section>
