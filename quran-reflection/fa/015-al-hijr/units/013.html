<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="خَلَت" data-root="خ ل و" data-learn-more="/quran-terminology/fa/roots/kh-l-w/" data-root-meaning="خالی شدن، خلوت کردن، کنار رفتن از جمع، تنها شدن، رها شدن از مانع، و جدا شدن از میدان آشکار">خَلَت</button>
    <button class="word-link" type="button" data-word="سُنَّةُ" data-root="س ن ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-n/" data-root-meaning="دندان؛ سنّت: روش جاری؛ مسنون: شکل‌داده‌شده یا دگرگون‌شده، بنا بر توضیح لغوی.">سُنَّةُ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">الأَوَّلينَ</button>
  </p>
  <p class="farsi-verse">به آن ایمان نمی‌آورند؛ و روش پیشینیان گذشته است.</p>
</section>
