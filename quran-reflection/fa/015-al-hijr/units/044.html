<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="سَبعَةُ" data-root="س ب ع" data-root-meaning="عدد هفت و صورت‌های وابسته به آن؛ در شاخه‌ای دیگر، سَبُع: جانور درنده." data-context="هفت؛ شمارِ درهای جهنم." data-learn-more="/quran-terminology/fa/roots/s-b-ayn/">سَبعَةُ</button>
    <button class="word-link" type="button" data-word="أَبوٰبٍ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون." data-context="درها؛ ورودی‌های شمرده‌شده با عدد هفت.">أَبوٰبٍ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="برای هر؛ توزیعِ بخش‌ها میان درها.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="بابٍ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون." data-context="در؛ هر یک از هفت ورودی.">بابٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="جُزءٌ" data-root="ج ز أ" data-root-meaning="بخش یا سهمی از یک کل؛ و در شاخهٔ فعلیِ دیگر، کفایت کردن و بسنده کردن." data-context="بخشی؛ گروهِ اختصاص‌یافته به هر در." data-learn-more="/quran-terminology/fa/roots/j-z-a/">جُزءٌ</button>
    <button class="word-link" type="button" data-word="مَقسومٌ" data-root="ق س م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-s-m/" data-root-meaning="تقسیم و بهره‌بندی؛ قَسَم: سوگند." data-context="تقسیم‌شده؛ وصفِ بخشِ اختصاص‌یافته.">مَقسومٌ</button>
  </p>
  <p class="farsi-verse">هفت در دارد؛ برای هر دری بخشی تقسیم‌شده از آنان است.</p>
</section>
