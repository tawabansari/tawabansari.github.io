<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِلمُتَوَسِّمينَ" data-root="و س م" data-learn-more="/quran-terminology/fa/roots/w-s-m/" data-root-meaning="نشان گذاشتن، علامت‌دار کردن، و شناساندن چیزی از راه اثر یا نشانه">لِلمُتَوَسِّمينَ</button>
  </p>
  <p class="farsi-verse">بی‌گمان در این برای نشانه‌شناسان نشانه‌هایی است.</p>
