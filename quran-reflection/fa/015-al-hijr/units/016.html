<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="در آسمان قرار دادیم؛ دربارهٔ برج‌های آسمانی.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ جایگاه برج‌های یادشده در این آیه.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="بُروجًا" data-root="ب ر ج" data-root-meaning="برجستگی و آشکار بودن؛ بُرج، بنای بلند و محافظت‌شده یا جایگاه آسمانی؛ و تبرّج، جلوه‌گری و نمایان ساختن زینت و زیبایی." data-learn-more="/quran-terminology/fa/roots/b-r-j/" data-context="برج‌های آسمانی؛ جایگاه‌ها یا نمودهای برجستهٔ آسمان، بدون تعیین یک مدل نجومی خاص از خود واژه.">بُروجًا</button>
    <button class="word-link" type="button" data-word="وَزَيَّنّٰها" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="و آسمان را آراستیم؛ ضمیر به آسمان بازمی‌گردد.">وَزَيَّنّٰها</button>
    <button class="word-link" type="button" data-word="لِلنّٰظِرينَ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="برای نگاه‌کنندگان؛ کسانی که آسمان و جلوهٔ آن را می‌نگرند.">لِلنّٰظِرينَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی در آسمان برج‌هایی قرار دادیم و آن را برای بینندگان آراستیم.</p>
</section>
