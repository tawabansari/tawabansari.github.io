<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="أَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">أَكُن</button>
    <button class="word-link" type="button" data-word="لِأَسجُدَ" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">لِأَسجُدَ</button>
    <button class="word-link" type="button" data-word="لِبَشَرٍ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">لِبَشَرٍ</button>
    <button class="word-link" type="button" data-word="خَلَقتَهُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقتَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="صَلصٰلٍ" data-root="ص ل ص ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَلصٰلٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="حَمَإٍ" data-root="ح م أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَمَإٍ</button>
    <button class="word-link" type="button" data-word="مَسنونٍ" data-root="س ن ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَسنونٍ</button>
  </p>
  <p class="farsi-verse">گفت: من آن نیستم که برای بشری سجده کنم که او را از گلی خشک و صداکننده، از لجن دگرگون‌شده آفریده‌ای.</p>
</section>
