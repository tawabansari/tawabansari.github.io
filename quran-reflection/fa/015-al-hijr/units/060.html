<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="امرَأَتَهُ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/">امرَأَتَهُ</button>
    <button class="word-link" type="button" data-word="قَدَّرنا" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">قَدَّرنا</button>
    ۙ
    <button class="word-link" type="button" data-word="إِنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّها</button>
    <button class="word-link" type="button" data-word="لَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَمِنَ</button>
    <button class="word-link" type="button" data-word="الغٰبِرينَ" data-root="غ ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الغٰبِرينَ</button>
  </p>
  <p class="farsi-verse">مگر همسرش؛ مقرر کرده‌ایم که او از بازماندگان باشد.</p>
</section>
