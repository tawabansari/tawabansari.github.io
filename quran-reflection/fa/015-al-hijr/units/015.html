<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="حتماً می‌گفتند؛ پاسخ فرضی منکران حتی پس از دیدن نشانه.">لَقالوا</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="سُكِّرَت" data-root="س ك ر" data-learn-more="/quran-terminology/fa/roots/s-k-r/" data-root-meaning="مستی و آشفتگی ادراک؛ در شاخه‌های دیگر، بستن و بازداشتن جریان و فرو نشستن حرکت." data-context="بسته یا مختل شده است؛ ادعای منکران دربارهٔ بینایی خود.">سُكِّرَت</button>
    <button class="word-link" type="button" data-word="أَبصٰرُنا" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینایی ما؛ آنچه گویندگان ادعا می‌کنند مختل شده است.">أَبصٰرُنا</button>
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروهی از مردم؛ وصف گویندگان دربارهٔ خود.">قَومٌ</button>
    <button class="word-link" type="button" data-word="مَسحورونَ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر" data-context="جادوشده؛ ادعای گویندگان دربارهٔ وضعیت خود.">مَسحورونَ</button>
  </p>
  <p class="farsi-verse">حتماً می‌گویند: تنها چشمانمان بسته شده است؛ بلکه ما مردمی جادوشده‌ایم.</p>
</section>
