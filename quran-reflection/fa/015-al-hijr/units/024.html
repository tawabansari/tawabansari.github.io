<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="عَلِمنَا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَلِمنَا</button>
    <button class="word-link" type="button" data-word="المُستَقدِمينَ" data-root="ق د م" data-learn-more="/quran-terminology/fa/roots/q-d-m/" data-root-meaning="پیش بودن، پیش فرستادن، سابقه داشتن">المُستَقدِمينَ</button>

    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="عَلِمنَا" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عَلِمنَا</button>
    <button class="word-link" type="button" data-word="المُستَـٔخِرينَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">المُستَـٔخِرينَ</button>

  <p class="farsi-verse">و به‌راستی پیش‌افتادگان شما را می‌دانیم و به‌راستی پس‌ماندگان را می‌دانیم.</p>
