<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّها</button>
    <button class="word-link" type="button" data-word="لَبِسَبيلٍ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت">لَبِسَبيلٍ</button>
    <button class="word-link" type="button" data-word="مُقيمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُقيمٍ</button>
  </p>
  <p class="farsi-verse">و آن بر راهی پابرجاست.</p>
