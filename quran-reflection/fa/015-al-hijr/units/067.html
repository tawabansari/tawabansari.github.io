<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">الحجر ۱۵:۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">وَجاءَ</button>
    <button class="word-link" type="button" data-word="أَهلُ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلُ</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-d-n/" data-root-meaning="مدینه: شهر و آبادی؛ تحلیل آن از «مدن» یا «دین» اختلافی است.">المَدينَةِ</button>
    <button class="word-link" type="button" data-word="يَستَبشِرونَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم">يَستَبشِرونَ</button>
  </p>
  <p class="farsi-verse">و مردم شهر شادمان آمدند.</p>
</section>
