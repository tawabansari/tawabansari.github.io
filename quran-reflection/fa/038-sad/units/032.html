<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقالَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَحبَبتُ" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَحبَبتُ</button>
    <button class="word-link" type="button" data-word="حُبَّ" data-root="ح ب ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حُبَّ</button>
    <button class="word-link" type="button" data-word="الخَيرِ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">الخَيرِ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">ذِكرِ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبّى</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="تَوارَت" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش">تَوارَت</button>
    <button class="word-link" type="button" data-word="بِالحِجابِ" data-root="ح ج ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِالحِجابِ</button>
  </p>
  <p class="farsi-verse">پس گفت: من دوستی این خیر را بر یاد پروردگارم برگزیدم، تا پشت پرده نهان شد.</p>
</section>
