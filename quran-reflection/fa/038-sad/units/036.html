<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَسَخَّرنا" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/">فَسَخَّرنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="الرّيحَ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">الرّيحَ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر">تَجرى</button>
    <button class="word-link" type="button" data-word="بِأَمرِهِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">بِأَمرِهِ</button>
    <button class="word-link" type="button" data-word="رُخاءً" data-root="ر خ و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رُخاءً</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَيثُ</button>
    <button class="word-link" type="button" data-word="أَصابَ" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">أَصابَ</button>
  </p>
  <p class="farsi-verse">پس باد را برای او رام کردیم که به فرمانش نرم می‌وزید، هر جا که قصد می‌کرد،</p>
</section>
