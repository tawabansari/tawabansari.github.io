<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوَهَبنا" data-root="و ه ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَوَهَبنا</button>
    <button class="word-link" type="button" data-word="لِداوۥدَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لِداوۥدَ</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سُلَيمٰنَ</button>
    ۚ
    <button class="word-link" type="button" data-word="نِعمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">نِعمَ</button>
    <button class="word-link" type="button" data-word="العَبدُ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">العَبدُ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="أَوّابٌ" data-root="أ و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَوّابٌ</button>
  </p>
  <p class="farsi-verse">و سلیمان را به داوود بخشیدیم. چه نیک بنده‌ای! او بسیار بازگشت‌کننده بود.</p>
</section>
