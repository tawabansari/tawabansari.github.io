<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ص" data-context="حرف جداگانه: صاد." data-learn-more="/fa/quran-terminology/huruf-muqattaat/">ص</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالقُرءانِ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="و قرآن؛ متنِ دارای ذکر در سوگند." data-learn-more="/quran-terminology/fa/roots/q-r-a/">وَالقُرءانِ</button>
    <button class="word-link" type="button" data-word="ذِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذِى</button>
    <button class="word-link" type="button" data-word="الذِّكرِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یادآوری؛ در وصفِ قرآنِ دارای ذکر.">الذِّكرِ</button>
  </p>
  <p class="farsi-verse">صاد. سوگند به قرآنِ دارای یادآوری.</p>
</section>
