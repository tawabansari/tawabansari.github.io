<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَغَفَرنا" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">فَغَفَرنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="عِندَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَنا</button>
    <button class="word-link" type="button" data-word="لَزُلفىٰ" data-root="ز ل ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَزُلفىٰ</button>
    <button class="word-link" type="button" data-word="وَحُسنَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">وَحُسنَ</button>
    <button class="word-link" type="button" data-word="مَـٔابٍ" data-root="أ و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَـٔابٍ</button>
  </p>
  <p class="farsi-verse">پس آن را برای او آمرزیدیم؛ و برای او نزد ما نزدیکی و بازگشتگاهی نیکوست.</p>
