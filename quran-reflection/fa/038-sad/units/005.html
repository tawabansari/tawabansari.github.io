<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">أَجَعَلَ</button>
    <button class="word-link" type="button" data-word="الـٔالِهَةَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">الـٔالِهَةَ</button>
    <button class="word-link" type="button" data-word="إِلٰهًا" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">إِلٰهًا</button>
    <button class="word-link" type="button" data-word="وٰحِدًا" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/">وٰحِدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="لَشَىءٌ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">لَشَىءٌ</button>
    <button class="word-link" type="button" data-word="عُجابٌ" data-root="ع ج ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عُجابٌ</button>
  </p>
  <p class="farsi-verse">آیا معبودان را یک معبود کرده است؟ این به‌راستی چیزی شگفت است.</p>
</section>
