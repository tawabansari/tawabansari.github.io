<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="و ك أ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">يَدعونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="بِفٰكِهَةٍ" data-root="ف ك ه" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِفٰكِهَةٍ</button>
    <button class="word-link" type="button" data-word="كَثيرَةٍ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده">كَثيرَةٍ</button>
    <button class="word-link" type="button" data-word="وَشَرابٍ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن.">وَشَرابٍ</button>
  </p>
  <p class="farsi-verse">در آن‌ها تکیه زده‌اند و میوه‌های بسیار و نوشیدنی می‌طلبند.</p>
