<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۴۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَاذكُر</button>
    <button class="word-link" type="button" data-word="عَبدَنا" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عَبدَنا</button>
    <button class="word-link" type="button" data-word="أَيّوبَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">أَيّوبَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="ن د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-d-y/" data-root-meaning="ندا و گردآمدن؛ نادی و ندیّ: مجلس و انجمن؛ نیز نم و رطوبت.">نادىٰ</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنّى</button>
    <button class="word-link" type="button" data-word="مَسَّنِىَ" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی">مَسَّنِىَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="بِنُصبٍ" data-root="ن ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-b/" data-root-meaning="برپا کردن؛ نَصَب: رنج؛ نصیب: سهم؛ نُصُب: سنگ‌های آیینی.">بِنُصبٍ</button>
    <button class="word-link" type="button" data-word="وَعَذابٍ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">وَعَذابٍ</button>
  </p>
  <p class="farsi-verse">و بنده ما ایوب را یاد کن، هنگامی که پروردگارش را ندا داد: شیطان مرا به رنج و عذاب رسانده است.</p>
</section>
