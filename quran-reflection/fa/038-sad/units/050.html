<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَنّٰتِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنّٰتِ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="ع د ن" data-root-meaning="ریشه «ع د ن» در زبان عربی به اقامت، ماندن و استقرار در مکان مربوط است." data-learn-more="/quran-terminology/fa/roots/ayn-d-n/">عَدنٍ</button>
    <button class="word-link" type="button" data-word="مُفَتَّحَةً" data-root="ف ت ح" data-learn-more="/quran-terminology/fa/roots/f-t-h/" data-root-meaning="از گشودن امر بسته تا دسترسی، فیصله و گشایش تعیین کننده">مُفَتَّحَةً</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الأَبوٰبُ" data-root="ب و ب" data-learn-more="/quran-terminology/fa/roots/b-w-b/" data-root-meaning="در، دروازه، مدخل و آستانه عبور میان بیرون و درون.">الأَبوٰبُ</button>
  </p>
  <p class="farsi-verse">باغ‌های ماندگار که درهایشان برای آنان گشوده است.</p>
</section>
