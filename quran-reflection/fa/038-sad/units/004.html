  <h2 class="ayah-title">ص ۳۸:۴</h2>

  <p class="farsi-verse">و شگفت‌زده شدند که هشداردهنده‌ای از خودشان نزد آنان آمد؛ و کافران گفتند: این جادوگری بسیار دروغ‌گوست.</p>
