<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="مُبٰرَكٌ" data-root="ب ر ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-r-k/" data-root-meaning="ثبات و ماندگاری؛ برکت: خیر پایدار و فزاینده؛ مبارک: برخوردار از این خیر.">مُبٰرَكٌ</button>
    <button class="word-link" type="button" data-word="لِيَدَّبَّروا" data-root="د ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پایانی؛ روی گرداندن؛ تدبیر و تدبّر: توجه به پیامد و سامان دادن.">لِيَدَّبَّروا</button>
    <button class="word-link" type="button" data-word="ءايٰتِهِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتِهِ</button>
    <button class="word-link" type="button" data-word="وَلِيَتَذَكَّرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَلِيَتَذَكَّرَ</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولُوا</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="ل ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-b/" data-root-meaning="مغز و بخش خالص؛ لُبّ: خرد و دریافت روشن.">الأَلبٰبِ</button>
  </p>
  <p class="farsi-verse">کتابی پربرکت است که آن را به سوی تو نازل کردیم تا در آیاتش بیندیشند و خردمندان متذکر شوند.</p>
</section>
