<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="لِلطّٰغينَ" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق">لِلطّٰغينَ</button>
    <button class="word-link" type="button" data-word="لَشَرَّ" data-root="ش ر ر" data-root-meaning="شر، بدی یا زیانی است که می‌تواند به رفتار، وضعیت، رخداد یا فرجام چیزی نسبت داده شود؛ در ساخت مقایسه‌ای، بدتر بودن را بیان می‌کند؛ و شرر در شاخه مادی به پاره‌های فروزان و جهنده آتش اشاره دارد." data-learn-more="/quran-terminology/fa/roots/sh-r-r/">لَشَرَّ</button>
    <button class="word-link" type="button" data-word="مَـٔابٍ" data-root="أ و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَـٔابٍ</button>
  </p>
  <p class="farsi-verse">این است؛ و برای سرکشان بدترین بازگشتگاه است:</p>
</section>
