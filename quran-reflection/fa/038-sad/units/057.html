<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="فَليَذوقوهُ" data-root="ذ و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَليَذوقوهُ</button>
    <button class="word-link" type="button" data-word="حَميمٌ" data-root="ح م م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَميمٌ</button>
    <button class="word-link" type="button" data-word="وَغَسّاقٌ" data-root="غ س ق" data-root-meaning="غسق در کاربرد مربوط به شب، تاریک شدن و فرارسیدن یا گسترش تاریکی است؛ در شاخه دیگری از زبان عربی، این خانواده برای جاری شدن و فرو ریختن مایعات نیز به کار رفته است. «غاسق» وصف تاریک‌شونده یا در سیاق مناسب جاری‌شونده است، و «غساق» در قرآن نام چیزی عذاب‌آور است که درباره ماهیت دقیق آن اختلاف لغوی باقی مانده است." data-learn-more="/quran-terminology/fa/roots/gh-s-q/">وَغَسّاقٌ</button>
  </p>
  <p class="farsi-verse">این است؛ پس آن را بچشند: آب جوشان و چرکابه،</p>
</section>
