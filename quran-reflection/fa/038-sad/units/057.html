<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="فَليَذوقوهُ" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="پس آن را بچشند؛ دربارهٔ آنچه در ادامه نام برده می‌شود.">فَليَذوقوهُ</button>
    <button class="word-link" type="button" data-word="حَميمٌ" data-root="ح م م" data-root-meaning="در شاخهٔ حرارت، آب گرم و بسیار داغ؛ در شاخهٔ نزدیکی، دوست یا خویشاوند صمیمی؛ و در شاخهٔ تیرگی، زغال و دود بسیار سیاه." data-context="آب بسیار داغ؛ در کنار غساق به‌عنوان چیزی برای چشیدن." data-learn-more="/quran-terminology/fa/roots/h-m-m/">حَميمٌ</button>
    <button class="word-link" type="button" data-word="وَغَسّاقٌ" data-root="غ س ق" data-root-meaning="غسق در کاربرد مربوط به شب، تاریک شدن و فرارسیدن یا گسترش تاریکی است؛ در شاخه دیگری از زبان عربی، این خانواده برای جاری شدن و فرو ریختن مایعات نیز به کار رفته است. «غاسق» وصف تاریک‌شونده یا در سیاق مناسب جاری‌شونده است، و «غساق» در قرآن نام چیزی عذاب‌آور است که درباره ماهیت دقیق آن اختلاف لغوی باقی مانده است." data-learn-more="/quran-terminology/fa/roots/gh-s-q/" data-context="و غساق؛ مادهٔ دیگری که در کنار حميم نام برده شده است.">وَغَسّاقٌ</button>
  </p>
  <p class="farsi-verse">این است؛ پس آن را بچشند: آب جوشان و چرکابه،</p>
</section>
