<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اركُض" data-root="ر ك ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-k-dad/" data-root-meaning="با پا زدن، دویدن یا شتاب دادن به مرکب." data-context="با پا بزن؛ فرمان به ایوب برای ضربه زدن با پا.">اركُض</button>
    <button class="word-link" type="button" data-word="بِرِجلِكَ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="با پایت؛ پا وسیلهٔ انجام فرمانِ «ارکض» است.">بِرِجلِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="مُغتَسَلٌ" data-root="غ س ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-s-l/" data-root-meaning="شستن؛ غسلین: خوراک یا مایع پلید در وصف دوزخ، با شرح‌های متفاوت." data-context="آب یا محل شست‌وشو؛ در این جمله چیزی که با آن شست‌وشو انجام می‌شود.">مُغتَسَلٌ</button>
    <button class="word-link" type="button" data-word="بارِدٌ" data-root="ب ر د" data-root-meaning="سردی و خنکی در برابر گرمی؛ «بَرَد»: تگرگ؛ و در برخی کاربردهای گسترده، فروکش کردن و آسودگی." data-learn-more="/quran-terminology/fa/roots/b-r-d/" data-context="خنک؛ وصف دمای آبِ معرفی‌شده برای شست‌وشو و نوشیدن، نه تعریف عامِ شفابخش بودن.">بارِدٌ</button>
    <button class="word-link" type="button" data-word="وَشَرابٌ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="و نوشیدنی؛ آبی که برای نوشیدن نیز معرفی شده است.">وَشَرابٌ</button>
  </p>
  <p class="farsi-verse">با پایت بر زمین بزن؛ این شستشوگاهی خنک و نوشیدنی است.</p>
</section>
