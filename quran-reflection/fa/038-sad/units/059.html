<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="فَوجٌ" data-root="ف و ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-j/" data-root-meaning="گروه و دسته‌ای که با هم می‌آیند.">فَوجٌ</button>
    <button class="word-link" type="button" data-word="مُقتَحِمٌ" data-root="ق ح م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-h-m/" data-root-meaning="با دشواری یا شتاب وارد شدن و از مانع گذشتن.">مُقتَحِمٌ</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="مَرحَبًا" data-root="ر ح ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-h-b/" data-root-meaning="گستردگی و فراخی؛ مرحبا: خوشامدگویی.">مَرحَبًا</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="صالُوا" data-root="ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-y/" data-root-meaning="از گرفتن گرمای آتش تا درآمدن در آتش">صالُوا</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارِ</button>
  </p>
  <p class="farsi-verse">این گروهی است که همراه شما به درون هجوم می‌برد؛ خوشامدی برای آنان نیست؛ آنان در آتش خواهند سوخت.</p>
</section>
