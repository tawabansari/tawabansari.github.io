<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَشَدَدنا" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="و استوار ساختیم.">وَشَدَدنا</button>
    <button class="word-link" type="button" data-word="مُلكَهُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="فرمانرواییِ او.">مُلكَهُ</button>
    <button class="word-link" type="button" data-word="وَءاتَينٰهُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="و به او دادیم.">وَءاتَينٰهُ</button>
    <button class="word-link" type="button" data-word="الحِكمَةَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="حکمت و داوریِ استوار.">الحِكمَةَ</button>
    <button class="word-link" type="button" data-word="وَفَصلَ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="سخن و داوریِ قاطع و روشن؛ در ترکیبِ «فصل الخطاب»." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">وَفَصلَ</button>
    <button class="word-link" type="button" data-word="الخِطابِ" data-root="خ ط ب" data-root-meaning="سخن گفتن با مخاطب و طرح یا پیگیری یک موضوع؛ در کاربردهای دیگر، کار و پیشامد، و درخواست ازدواج." data-context="خطاب و سخن." data-learn-more="/quran-terminology/fa/roots/kh-tt-b/">الخِطابِ</button>
  </p>
  <p class="farsi-verse">و فرمانروایی‌اش را استوار کردیم و به او حکمت و سخن فیصله‌بخش دادیم.</p>
</section>
