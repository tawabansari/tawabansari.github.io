<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَشَدَدنا" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا">وَشَدَدنا</button>
    <button class="word-link" type="button" data-word="مُلكَهُ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه">مُلكَهُ</button>
    <button class="word-link" type="button" data-word="وَءاتَينٰهُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">وَءاتَينٰهُ</button>
    <button class="word-link" type="button" data-word="الحِكمَةَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست">الحِكمَةَ</button>
    <button class="word-link" type="button" data-word="وَفَصلَ" data-root="ف ص ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَفَصلَ</button>
    <button class="word-link" type="button" data-word="الخِطابِ" data-root="خ ط ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الخِطابِ</button>
  </p>
  <p class="farsi-verse">و فرمانروایی‌اش را استوار کردیم و به او حکمت و سخن فیصله‌بخش دادیم.</p>
</section>
