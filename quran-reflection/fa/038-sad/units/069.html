<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۶۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="برای من چنین دانشی وجود نداشت.">كانَ</button>
    <button class="word-link" type="button" data-word="لِىَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِىَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانش دربارهٔ جمع بلندمرتبه و مخاصمهٔ آنان.">عِلمٍ</button>
    <button class="word-link" type="button" data-word="بِالمَلَإِ" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه." data-context="دربارهٔ جمع و جماعت بلندمرتبه.">بِالمَلَإِ</button>
    <button class="word-link" type="button" data-word="الأَعلىٰ" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="بلندمرتبه؛ وصفِ آن جمع.">الأَعلىٰ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="يَختَصِمونَ" data-root="خ ص م" data-root-meaning="رویارویی و مخاصمهٔ دو طرف بر سر ادعا، حق یا موضوعی مورد اختلاف؛ خصم: طرف دعوا." data-context="مخاصمه در جمع بلندمرتبه؛ خود فعل، موضوع دقیق و هویت همهٔ طرف‌ها را تعیین نمی‌کند." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/">يَختَصِمونَ</button>
  </p>
  <p class="farsi-verse">من از جمع برتر، هنگامی که با هم گفت‌وگو می‌کردند، دانشی نداشتم.</p>
</section>
