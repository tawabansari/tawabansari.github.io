<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رُدّوها" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/">رُدّوها</button>
    <button class="word-link" type="button" data-word="عَلَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَىَّ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَطَفِقَ" data-root="ط ف ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَطَفِقَ</button>
    <button class="word-link" type="button" data-word="مَسحًا" data-root="م س ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَسحًا</button>
    <button class="word-link" type="button" data-word="بِالسّوقِ" data-root="س و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بِالسّوقِ</button>
    <button class="word-link" type="button" data-word="وَالأَعناقِ" data-root="ع ن ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالأَعناقِ</button>
  </p>
  <p class="farsi-verse">آن‌ها را نزد من بازگردانید. پس به دست کشیدن بر ساق‌ها و گردن‌ها پرداخت.</p>
