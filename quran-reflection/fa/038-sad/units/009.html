<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="عِندَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَهُم</button>
    <button class="word-link" type="button" data-word="خَزائِنُ" data-root="خ ز ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خَزائِنُ</button>
    <button class="word-link" type="button" data-word="رَحمَةِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحمَةِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری">العَزيزِ</button>
    <button class="word-link" type="button" data-word="الوَهّابِ" data-root="و ه ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الوَهّابِ</button>
  </p>
  <p class="farsi-verse">یا خزانه‌های رحمت پروردگار تو، آن توانمند بسیار بخشنده، نزد آنان است؟</p>
</section>
