  <p class="farsi-verse">گفت: او با درخواست میش تو برای افزودن به میش‌هایش بر تو ستم کرده است. و بسیاری از شریکان بر یکدیگر ستم می‌کنند، مگر کسانی که ایمان آورده و کارهای شایسته کرده‌اند، و آنان اندک‌اند. و داوود دریافت که او را آزموده‌ایم؛ پس از پروردگارش آمرزش خواست و رکوع‌کنان فرو افتاد و بازگشت.</p>
