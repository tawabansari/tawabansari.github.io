<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="يَصلَونَها" data-root="ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-y/" data-root-meaning="از گرفتن گرمای آتش تا درآمدن در آتش">يَصلَونَها</button>
    <button class="word-link" type="button" data-word="فَبِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">فَبِئسَ</button>
    <button class="word-link" type="button" data-word="المِهادُ" data-root="م ه د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المِهادُ</button>
  </p>
  <p class="farsi-verse">جهنم، که در آن می‌سوزند؛ چه بد بستری است!</p>
