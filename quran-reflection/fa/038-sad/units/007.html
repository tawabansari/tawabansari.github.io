    <button class="word-link" type="button" data-word="اختِلٰقٌ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">اختِلٰقٌ</button>

  <p class="farsi-verse">این را در آیین اخیر نشنیده‌ایم؛ این جز ساخته‌وپرداخته‌ای نیست.</p>
