  <h2 class="ayah-title">ص ۳۸:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَخُذ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/">وَخُذ</button>
    <button class="word-link" type="button" data-word="بِيَدِكَ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/">بِيَدِكَ</button>
    <button class="word-link" type="button" data-word="ضِغثًا" data-root="ض غ ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ضِغثًا</button>
    <button class="word-link" type="button" data-word="فَاضرِب" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/">فَاضرِب</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَحنَث" data-root="ح ن ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَحنَث</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="وَجَدنٰهُ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/">وَجَدنٰهُ</button>
    <button class="word-link" type="button" data-word="صابِرًا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/">صابِرًا</button>
    ۚ
    <button class="word-link" type="button" data-word="نِعمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/">نِعمَ</button>
    <button class="word-link" type="button" data-word="العَبدُ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/">العَبدُ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="أَوّابٌ" data-root="أ و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَوّابٌ</button>
  </p>
  <p class="farsi-verse">و دسته‌ای ساقه به دستت بگیر و با آن بزن و سوگند مشکن. ما او را شکیبا یافتیم. چه نیک بنده‌ای! او بسیار بازگشت‌کننده بود.</p>
