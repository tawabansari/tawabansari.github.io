<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَحَقٌّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="به‌راستی واقع و ثابت است؛ تأکید بر حقیقت مخاصمهٔ اهل آتش.">لَحَقٌّ</button>
    <button class="word-link" type="button" data-word="تَخاصُمُ" data-root="خ ص م" data-root-meaning="رویارویی و مخاصمهٔ دو طرف بر سر ادعا، حق یا موضوعی مورد اختلاف؛ خصم: طرف دعوا." data-context="مخاصمهٔ متقابل اهل آتش، در پی سرزنش‌ها و اعتراض‌های آنان به یکدیگر." data-learn-more="/quran-terminology/fa/roots/kh-sad-m/">تَخاصُمُ</button>
    <button class="word-link" type="button" data-word="أَهلِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="اهل و ساکنان آتش.">أَهلِ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتشِ سرانجام که اهل آن با یکدیگر مخاصمه می‌کنند.">النّارِ</button>
  </p>
  <p class="farsi-verse">این به‌راستی حقیقت است: ستیز اهل آتش با یکدیگر.</p>
</section>
