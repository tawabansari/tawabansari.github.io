<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="عَطاؤُنا" data-root="ع ط و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-tt-w/" data-root-meaning="دادن و بخشش؛ تعاطی: دست به کاری زدن یا چیزی را گرفتن.">عَطاؤُنا</button>
    <button class="word-link" type="button" data-word="فَامنُن" data-root="م ن ن" data-learn-more="/quran-terminology/fa/roots/m-n-n/" data-root-meaning="رساندن عطا یا احسانی برجسته؛ به رخ کشیدن آن عطا؛ آزاد کردن بدون عوض؛ و بریدن، کاستن یا پایان یافتن.">فَامنُن</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="أَمسِك" data-root="م س ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-s-k/" data-root-meaning="گرفتن، نگه داشتن و محکم چنگ زدن.">أَمسِك</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="حِسابٍ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">حِسابٍ</button>
  </p>
  <p class="farsi-verse">این بخشش ماست؛ پس بی‌حساب ببخش یا نگه دار.</p>
</section>
