<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهَل</button>
    <button class="word-link" type="button" data-word="أَتىٰكَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أَتىٰكَ</button>
    <button class="word-link" type="button" data-word="نَبَؤُا۟" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">نَبَؤُا۟</button>
    <button class="word-link" type="button" data-word="الخَصمِ" data-root="خ ص م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الخَصمِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="تَسَوَّرُوا" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد">تَسَوَّرُوا</button>
    <button class="word-link" type="button" data-word="المِحرابَ" data-root="ح ر ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المِحرابَ</button>
  </p>
  <p class="farsi-verse">و آیا خبر دادخواهان به تو رسیده است، هنگامی که از دیوار محراب بالا رفتند؟</p>
