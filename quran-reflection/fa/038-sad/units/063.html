<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَتَّخَذنٰهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَتَّخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="سِخرِيًّا" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/">سِخرِيًّا</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="زاغَت" data-root="ز ي غ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">زاغَت</button>
    <button class="word-link" type="button" data-word="عَنهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُمُ</button>
    <button class="word-link" type="button" data-word="الأَبصٰرُ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">الأَبصٰرُ</button>
  </p>
  <p class="farsi-verse">آیا آنان را به تمسخر گرفته بودیم، یا دیدگان از آنان منحرف شده است؟</p>
</section>
