<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالشَّيٰطينَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">وَالشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلَّ</button>
    <button class="word-link" type="button" data-word="بَنّاءٍ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">بَنّاءٍ</button>
    <button class="word-link" type="button" data-word="وَغَوّاصٍ" data-root="غ و ص" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-sad/" data-root-meaning="غواصی و فرو رفتن در آب.">وَغَوّاصٍ</button>
  </p>
  <p class="farsi-verse">و شیاطین را، هر سازنده و غواصی،</p>
</section>
