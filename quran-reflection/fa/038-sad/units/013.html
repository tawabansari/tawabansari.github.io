<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَثَمودُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَثَمودُ</button>
    <button class="word-link" type="button" data-word="وَقَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">وَقَومُ</button>
    <button class="word-link" type="button" data-word="لوطٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لوطٍ</button>
    <button class="word-link" type="button" data-word="وَأَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">وَأَصحٰبُ</button>
    <button class="word-link" type="button" data-word="لـَٔيكَةِ" data-context="ایکه: بیشه یا درختستان." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">لـَٔيكَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الأَحزابُ" data-root="ح ز ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الأَحزابُ</button>
  </p>
  <p class="farsi-verse">و ثمود و قوم لوط و اصحاب ایکه؛ آنان گروه‌های هم‌پیمان بودند.</p>
</section>
