<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۸۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومِ</button>
    <button class="word-link" type="button" data-word="الوَقتِ" data-root="و ق ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-t/" data-root-meaning="زمان معین و مقرر کردن هنگام؛ میقات: موعد.">الوَقتِ</button>
    <button class="word-link" type="button" data-word="المَعلومِ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">المَعلومِ</button>
  </p>
  <p class="farsi-verse">تا روز زمان معلوم.</p>
</section>
