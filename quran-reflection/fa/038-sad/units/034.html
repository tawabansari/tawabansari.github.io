<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="فَتَنّا" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن" data-context="آزمودیم؛ آزمون سلیمان در رخدادِ بیان‌شده در آیه.">فَتَنّا</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">سُلَيمٰنَ</button>
    <button class="word-link" type="button" data-word="وَأَلقَينا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="و افکندیم؛ قرار گرفتن پیکری بر تخت سلیمان.">وَأَلقَينا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُرسِيِّهِ" data-root="ك ر س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-s/" data-root-meaning="کرسی: جای نشستن یا جایگاه اقتدار؛ شرح آن در وصف آن معبود یگانه به سیاق وابسته است." data-context="تخت او؛ جایگاهی که پیکر بر آن افکنده شد.">كُرسِيِّهِ</button>
    <button class="word-link" type="button" data-word="جَسَدًا" data-root="ج س د" data-root-meaning="پیکر و صورت جسمانی؛ خود واژه زنده یا مرده بودن و داشتن آگاهی را تعیین نمی‌کند." data-context="پیکری؛ آنچه در جریان آزمون سلیمان بر تخت او افکنده شد، بدون تعیین هویت در همین آیه." data-learn-more="/quran-terminology/fa/roots/j-s-d/">جَسَدًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَنابَ" data-root="ن و ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-w-b/" data-root-meaning="بازگشت پیاپی؛ انابه: بازگشت و روی آوردن." data-context="بازگشت و روی آورد؛ بازگشت سلیمان پس از آزمون.">أَنابَ</button>
  </p>
  <p class="farsi-verse">و سلیمان را آزمودیم و بر تختش پیکری افکندیم؛ سپس بازگشت.</p>
</section>
