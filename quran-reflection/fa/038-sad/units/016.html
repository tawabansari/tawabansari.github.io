<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّنا</button>
    <button class="word-link" type="button" data-word="عَجِّل" data-root="ع ج ل" data-learn-more="/quran-terminology/fa/roots/ayn-j-l/" data-root-meaning="شتاب‌کردن، خواستن نتیجه پیش از زمان مناسب، نزدیک‌بودن و گوساله">عَجِّل</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنا</button>
    <button class="word-link" type="button" data-word="قِطَّنا" data-root="ق ط ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-tt-tt/" data-root-meaning="بریدن؛ قِطّ: نوشته سهم یا بهره مقرر.">قِطَّنا</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلَ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومِ</button>
    <button class="word-link" type="button" data-word="الحِسابِ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">الحِسابِ</button>
  </p>
  <p class="farsi-verse">و گفتند: پروردگارا، سهم ما را پیش از روز حساب برایمان بشتابان.</p>
</section>
