<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">ص ۳۸:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="عُرِضَ" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="عرضه شدند؛ پیش روی سلیمان قرار داده شدن اسب‌ها.">عُرِضَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="بِالعَشِىِّ" data-root="ع ش و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-w/" data-root-meaning="بخش پایانی روز و شامگاه؛ عَشو: کم‌دیدن یا چشم پوشیدن." data-context="در پسین روز؛ زمان عرضه شدن اسب‌ها.">بِالعَشِىِّ</button>
    <button class="word-link" type="button" data-word="الصّٰفِنٰتُ" data-root="ص ف ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-f-n/" data-root-meaning="ایستادن اسب با قرار گرفتن ویژه پاها؛ صافنات: اسبان خوش‌ایستاده." data-context="اسب‌های خوش‌ایستاده؛ وصف حالت ایستادن اسب‌های یادشده.">الصّٰفِنٰتُ</button>
    <button class="word-link" type="button" data-word="الجِيادُ" data-root="ج و د" data-root-meaning="بخشندگی و فراوانی عطا؛ خوبی و مرغوبیت؛ جَواد در وصف اسب، ممتاز و تیزرو." data-context="اسب‌های ممتاز و تیزرو؛ وصف کیفیت و توان حرکت همان اسب‌های عرضه‌شده." data-learn-more="/quran-terminology/fa/roots/j-w-d/">الجِيادُ</button>
  </p>
  <p class="farsi-verse">هنگامی که شامگاه، اسبان ایستاده و تیزرو بر او عرضه شدند،</p>
</section>
