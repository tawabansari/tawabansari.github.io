<section class="ayah-block" id="ayah-155" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="مُبارَكٌ" data-root="ب ر ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُبارَكٌ</button>
    <button class="word-link" type="button" data-word="فَاتَّبِعوهُ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/">فَاتَّبِعوهُ</button>
    <button class="word-link" type="button" data-word="وَاتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">وَاتَّقوا</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُرحَمونَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/">تُرحَمونَ</button>
  </p>
  <p class="farsi-verse">و این کتابی است مبارک که فرو فرستادیم؛ پس از آن پیروی کنید و پروا داشته باشید، باشد که مورد رحمت قرار گیرید.</p>
