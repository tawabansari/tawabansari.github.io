  <p class="farsi-verse">و اگر روی‌گردانی آنان بر تو گران آمده است، پس اگر می‌توانی راهی در زمین یا نردبانی در آسمان بجویی و نشانه‌ای برایشان بیاوری. و اگر آن معبود یگانه می‌خواست، آنان را بر هدایت گرد می‌آورد؛ پس هرگز از نادانان مباش.</p>
