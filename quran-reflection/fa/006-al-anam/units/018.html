<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="القاهِرُ" data-root="ق ه ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-h2-r/" data-root-meaning="چیره شدن و تحت اختیار درآوردن؛ قهر همیشه به معنای احساس خشم نیست." data-context="چیره؛ وصف آن معبود یگانه بر بندگان.">القاهِرُ</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بر فراز و برتر؛ در بیان چیرگی بر بندگان.">فَوقَ</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="بندگان او؛ انسان‌هایی که به او نسبت داده شده‌اند.">عِبادِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="حکیم؛ وصف آن معبود یگانه.">الحَكيمُ</button>
    <button class="word-link" type="button" data-word="الخَبيرُ" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="آگاه؛ وصفِ آگاهی آن معبود یگانه در سیاق آیه." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">الخَبيرُ</button>
  </p>
  <p class="farsi-verse">و او بر بندگانش چیره است؛ و او حکیم و آگاه است.</p>
</section>
