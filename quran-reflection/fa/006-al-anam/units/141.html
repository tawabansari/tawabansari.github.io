  <p class="farsi-verse">و اوست که باغ‌های داربست‌دار و بی‌داربست، و نخل و کشتزار را با محصول گوناگون، و زیتون و انار را شبیه و ناشبیه پدید آورد. از میوه‌اش هنگامی که میوه می‌دهد بخورید و حق آن را روز برداشتش بدهید؛ و زیاده‌روی نکنید، که او زیاده‌روان را دوست ندارد.</p>
