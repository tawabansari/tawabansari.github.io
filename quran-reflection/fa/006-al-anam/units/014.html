  <p class="farsi-verse">بگو: آیا جز آن معبود یگانه، پدیدآورنده آسمان‌ها و زمین، سرپرستی بگیرم، در حالی که او خوراک می‌دهد و خوراک داده نمی‌شود؟ بگو: من فرمان یافته‌ام نخستین کسی باشم که تسلیم می‌شود؛ و هرگز از شریک‌گیرندگان مباش.</p>
