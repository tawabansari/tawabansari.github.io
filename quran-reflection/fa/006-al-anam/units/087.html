<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۸۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِن</button>
    <button class="word-link" type="button" data-word="ءابائِهِم" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">ءابائِهِم</button>
    <button class="word-link" type="button" data-word="وَذُرِّيّٰتِهِم" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه">وَذُرِّيّٰتِهِم</button>
    <button class="word-link" type="button" data-word="وَإِخوٰنِهِم" data-root="أ خ و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَإِخوٰنِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاجتَبَينٰهُم" data-root="ج ب ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَاجتَبَينٰهُم</button>
    <button class="word-link" type="button" data-word="وَهَدَينٰهُم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">وَهَدَينٰهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="ص ر ط" data-root-meaning="مسیر روشن، کشیده و جهت دار، راه مستقیم رساننده، و طریق استواری که انسان را به مقصد حق می برد" data-learn-more="/quran-terminology/fa/roots/s-r-t/">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">مُستَقيمٍ</button>
  </p>
  <p class="farsi-verse">و از پدرانشان و نسل‌هایشان و برادرانشان؛ و آنان را برگزیدیم و به راهی راست هدایت کردیم.</p>
</section>
