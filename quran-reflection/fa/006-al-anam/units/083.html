<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="حُجَّتُنا" data-root="ح ج ج" data-learn-more="/quran-terminology/fa/roots/h-j-j/">حُجَّتُنا</button>
    <button class="word-link" type="button" data-word="ءاتَينٰها" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">ءاتَينٰها</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">قَومِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="نَرفَعُ" data-root="ر ف ع" data-learn-more="/quran-terminology/fa/roots/r-f-ayn/">نَرفَعُ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="د ر ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">نَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/">حَكيمٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">عَليمٌ</button>
  </p>
  <p class="farsi-verse">و این حجت ماست که به ابراهیم در برابر قومش دادیم. هرکه را بخواهیم به درجاتی بالا می‌بریم؛ بی‌گمان پروردگار تو حکیم و داناست.</p>
</section>
