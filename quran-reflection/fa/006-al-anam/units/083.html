<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۸۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="حُجَّتُنا" data-root="ح ج ج" data-learn-more="/quran-terminology/fa/roots/h-j-j/" data-root-meaning="از قصد کردن و حج تا حجت و رویارویی استدلالی" data-context="حجت ما؛ استدلالی که به ابراهیم داده شد.">حُجَّتُنا</button>
    <button class="word-link" type="button" data-word="ءاتَينٰها" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="آن را دادیم؛ اعطای حجت به ابراهیم.">ءاتَينٰها</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قومش؛ مردمی که ابراهیم با آنان استدلال می‌کرد.">قَومِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="نَرفَعُ" data-root="ر ف ع" data-learn-more="/quran-terminology/fa/roots/r-f-ayn/" data-root-meaning="بالا بردن، بلند کردن و برافراشتن؛ از سطح یا مرتبه‌ای پایین‌تر به جایگاهی بالاتر" data-context="بالا می‌بریم؛ درباره مراتب کسانی که بخواهیم.">نَرفَعُ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="د ر ج" data-learn-more="/quran-terminology/fa/roots/d-r-j/" data-root-meaning="حرکت و گذر مرحله‌به‌مرحله؛ پله و مرتبه؛ استدراج: پیش بردن تدریجی." data-context="درجات؛ مراتب کسانی که در سیاق حجت ابراهیم بالا برده می‌شوند.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهیم؛ خواست الهی در بالا بردن مراتب.">نَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ صاحب حکمت و علم در جمله پایانی.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="حکیم؛ وصف پروردگار.">حَكيمٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانا؛ وصف پروردگار.">عَليمٌ</button>
  </p>
  <p class="farsi-verse">و این حجت ماست که به ابراهیم در برابر قومش دادیم. هرکه را بخواهیم به درجاتی بالا می‌بریم؛ بی‌گمان پروردگار تو حکیم و داناست.</p>
</section>
