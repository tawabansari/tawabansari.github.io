<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فالِقُ" data-root="ف ل ق" data-root-meaning="فلق، شکافتن و از هم گشودن چیزی است؛ در کاربرد مادی، به ایجاد شکاف و جدا شدن بخش‌ها مربوط می‌شود؛ و در کاربرد مربوط به صبح، به پدیدار شدن سپیده و آشکار شدن روشنایی آغاز روز اشاره دارد. «فالق» شکافنده و گشاینده است، «انفلق» شکافته شدن را بیان می‌کند و «الفلق» در سوره فلق نام سپیده‌دم است." data-learn-more="/quran-terminology/fa/roots/f-l-q/">فالِقُ</button>
    <button class="word-link" type="button" data-word="الإِصباحِ" data-root="ص ب ح" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الإِصباحِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه">الَّيلَ</button>
    <button class="word-link" type="button" data-word="سَكَنًا" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن">سَكَنًا</button>
    <button class="word-link" type="button" data-word="وَالشَّمسَ" data-root="ش م س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالشَّمسَ</button>
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="ق م ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالقَمَرَ</button>
    <button class="word-link" type="button" data-word="حُسبانًا" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">حُسبانًا</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="تَقديرُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">تَقديرُ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری">العَزيزِ</button>
    <button class="word-link" type="button" data-word="العَليمِ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">العَليمِ</button>
  </p>
  <p class="farsi-verse">شکافنده سپیده‌دم است؛ و شب را آرامش، و خورشید و ماه را برای حساب قرار داده است. این اندازه‌گذاری آن شکست‌ناپذیر داناست.</p>
</section>
