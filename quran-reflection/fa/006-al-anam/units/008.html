  <p class="farsi-verse">و گفتند: چرا فرشته‌ای بر او فرو فرستاده نشده است؟ و اگر فرشته‌ای فرو می‌فرستادیم، کار پایان یافته بود و سپس مهلت داده نمی‌شدند.</p>
