<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۷۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="رَءَا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="دید؛ مشاهده خورشید هنگام برآمدن.">رَءَا</button>
    <button class="word-link" type="button" data-word="الشَّمسَ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="خورشید؛ جرم آسمانیِ موضوع این مرحله.">الشَّمسَ</button>
    <button class="word-link" type="button" data-word="بازِغَةً" data-root="ب ز غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-z-gh/" data-root-meaning="برآمدن، ظاهر شدن و آغاز آشکار شدن روشناییِ جرم آسمانی." data-context="برآینده؛ اسم فاعل مؤنث منصوب، وصف حالت خورشید هنگام مشاهده.">بازِغَةً</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ سخن ابراهیم پس از دیدن خورشید.">قالَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ در سخن «این پروردگار من است».">رَبّى</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="بزرگ‌تر؛ مقایسه در سخن ابراهیم، بدون تعیین اندازه‌های عددی اجرام در آیه.">أَكبَرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَفَلَت" data-root="أ ف ل" data-learn-more="/quran-terminology/fa/roots/a-f-l/" data-root-meaning="غایب شدن و از میدان دید بیرون رفتن چیزی که پیش‌تر آشکار بوده است؛ به‌ویژه ناپدید شدن اجرام آسمانی از افق دید ناظر." data-context="غروب کرد؛ فعل ماضی مفرد مؤنث درباره خورشید.">أَفَلَت</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ خطاب ابراهیم به قومش پس از غروب خورشید.">قالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="ای قوم من؛ خطاب صریح ابراهیم به مردم خود.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="بَرىءٌ" data-root="ب ر أ" data-learn-more="/quran-terminology/fa/roots/b-r-a/" data-root-meaning="پدیدآوردن، رهاشدن از بیماری یا نسبت، پاک‌بودن از اتهام، و اعلام برائت" data-context="بیزار و جدا؛ ابراهیم خود را از آنچه قومش شریک می‌گیرند جدا می‌داند.">بَرىءٌ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="تُشرِكونَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریک می‌گیرید؛ نسبت دادن شریک در پرستش و ربوبیت در خطاب به قوم.">تُشرِكونَ</button>
  </p>
  <p class="farsi-verse">پس هنگامی که خورشید را برآینده دید، گفت: این پروردگار من است؛ این بزرگ‌تر است. پس چون غروب کرد، گفت: ای قوم من، من از آنچه شریک می‌گیرید بیزارم.</p>
</section>
