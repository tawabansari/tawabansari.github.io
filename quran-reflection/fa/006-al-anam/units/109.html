  <p class="farsi-verse">و با سخت‌ترین سوگندهایشان به آن معبود یگانه سوگند خوردند که اگر نشانه‌ای به آنان برسد، حتما به آن ایمان خواهند آورد. بگو: نشانه‌ها تنها نزد آن معبود یگانه است. و چه می‌دانید که وقتی آن بیاید، ایمان نخواهند آورد؟</p>
