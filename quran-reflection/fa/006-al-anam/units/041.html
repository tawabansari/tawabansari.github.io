  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَل</button>

    <button class="word-link" type="button" data-word="تَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">تَدعونَ</button>
    <button class="word-link" type="button" data-word="فَيَكشِفُ" data-root="ك ش ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَيَكشِفُ</button>

    <button class="word-link" type="button" data-word="تُشرِكونَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">تُشرِكونَ</button>
  </p>
  <p class="farsi-verse">بلکه تنها او را می‌خوانید؛ پس اگر بخواهد، آنچه را برایش او را می‌خوانید برطرف می‌کند و آنچه را شریک می‌گیرید فراموش می‌کنید.</p>
