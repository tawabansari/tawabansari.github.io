<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقُطِعَ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/">فَقُطِعَ</button>
    <button class="word-link" type="button" data-word="دابِرُ" data-root="د ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">دابِرُ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">القَومِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظَلَموا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالحَمدُ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/">وَالحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبِّ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">العٰلَمينَ</button>
  </p>
  <p class="farsi-verse">پس ریشه گروهی که ستم کردند بریده شد؛ و ستایش از آنِ آن معبود یگانه، پروردگار جهانیان است.</p>
