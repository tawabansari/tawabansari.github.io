  <p class="farsi-verse">پس هرکه را آن معبود یگانه بخواهد هدایت کند، سینه‌اش را برای تسلیم می‌گشاید؛ و هرکه را بخواهد گمراه کند، سینه‌اش را تنگ و فشرده می‌سازد، گویی به دشواری در آسمان بالا می‌رود. این‌گونه آن معبود یگانه پلیدی را بر کسانی قرار می‌دهد که ایمان نمی‌آورند.</p>
