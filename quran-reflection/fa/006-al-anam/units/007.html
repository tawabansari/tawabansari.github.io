<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="نَزَّلنا" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="فرو می‌فرستادیم؛ فرستادن نوشته‌ای به پیامبر در فرضی که آیه مطرح می‌کند.">نَزَّلنا</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="كِتٰبًا" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="نوشته‌ای؛ متن مکتوبی که در فرض آیه بر قرطاس عرضه می‌شود.">كِتٰبًا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="قِرطاسٍ" data-root="ق ر ط س" data-root-meaning="صفحه یا برگِ نوشتاری؛ سطحی که نوشته بر آن ثبت می‌شود، مانند پاپیروس، پوست آماده‌شده یا کاغذ. در کاربردی دیگر، سطح یا هدفِ تیراندازی نیز قرطاس نامیده شده است." data-context="قرطاس؛ صفحه یا مادهٔ نوشتاری که در فرضِ آیه، نوشته‌ای بر آن فرود می‌آید و با دست قابل لمس است." data-learn-more="/quran-terminology/fa/roots/q-r-tt-s/">قِرطاسٍ</button>
    <button class="word-link" type="button" data-word="فَلَمَسوهُ" data-root="ل م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-m-s/" data-root-meaning="لمس کردن؛ التماس: جست‌وجو؛ در برخی سیاق‌ها کنایه از تماس جنسی." data-context="پس آن را لمس می‌کردند؛ تماس مستقیمِ دست با نوشته یا حامل مادی آن در فرض آیه.">فَلَمَسوهُ</button>
    <button class="word-link" type="button" data-word="بِأَيديهِم" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان." data-context="با دست‌هایشان؛ وسیلهٔ لمس مستقیمِ آن نوشتهٔ مادی.">بِأَيديهِم</button>
    <button class="word-link" type="button" data-word="لَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="به‌یقین می‌گفتند؛ پاسخِ پیش‌بینی‌شدهٔ انکارکنندگان در فرض آیه.">لَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کسانی که کفر ورزیدند؛ گروهی که در فرض آیه نیز نوشتهٔ قابل لمس را جادو می‌نامند.">كَفَروا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="سِحرٌ" data-root="س ح ر" data-learn-more="/quran-terminology/fa/roots/s-h-r/" data-root-meaning="سِحْر و سَحَر؛ دگرگون‌نمایی ادراک و زمان پیش از فجر" data-context="جادو؛ عنوانی که انکارکنندگان در فرض آیه به آن نوشته نسبت می‌دهند.">سِحرٌ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ صفتِ «جادو» در ادعای انکارکنندگان، نه تأیید آن ادعا از سوی آیه.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">و اگر نوشته‌ای بر کاغذ بر تو فرو می‌فرستادیم و آن را با دست‌هایشان لمس می‌کردند، کسانی که کفر ورزیدند می‌گفتند: این جز جادویی آشکار نیست.</p>
</section>
