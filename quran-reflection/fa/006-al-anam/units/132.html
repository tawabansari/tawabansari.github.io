<section class="ayah-block" id="ayah-132" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِكُلٍّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">وَلِكُلٍّ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٌ" data-root="د ر ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">دَرَجٰتٌ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمّا</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">عَمِلوا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="بِغٰفِلٍ" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/">بِغٰفِلٍ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و برای هرکس درجاتی از آنچه انجام داده‌اند هست؛ و پروردگارت از آنچه انجام می‌دهند غافل نیست.</p>
