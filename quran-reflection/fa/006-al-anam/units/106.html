<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۰۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اتَّبِع" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">اتَّبِع</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أوحِىَ" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق.">أوحِىَ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="إِلٰهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">إِلٰهَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَعرِض" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی.">وَأَعرِض</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد">المُشرِكينَ</button>
  </p>
  <p class="farsi-verse">از آنچه از پروردگارت به تو وحی شده است پیروی کن؛ هیچ معبودی جز او نیست؛ و از شریک‌گیرندگان روی بگردان.</p>
</section>
