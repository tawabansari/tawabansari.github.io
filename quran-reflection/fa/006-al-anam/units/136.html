  <p class="farsi-verse">و از کشت و چهارپایانی که او پدید آورده، سهمی برای آن معبود یگانه قرار دادند و به پندار خود گفتند: این برای آن معبود یگانه است و این برای شریکان ما. پس آنچه برای شریکانشان است به آن معبود یگانه نمی‌رسد، و آنچه برای آن معبود یگانه است به شریکانشان می‌رسد. چه بد داوری می‌کنند.</p>
