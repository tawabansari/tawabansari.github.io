<section class="ayah-block" id="ayah-110" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنُقَلِّبُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">وَنُقَلِّبُ</button>
    <button class="word-link" type="button" data-word="أَفـِٔدَتَهُم" data-root="ف أ د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَفـِٔدَتَهُم</button>
    <button class="word-link" type="button" data-word="وَأَبصٰرَهُم" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">وَأَبصٰرَهُم</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">يُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="م ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَرَّةٍ</button>
    <button class="word-link" type="button" data-word="وَنَذَرُهُم" data-root="و ذ ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَنَذَرُهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="طُغيٰنِهِم" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق">طُغيٰنِهِم</button>
    <button class="word-link" type="button" data-word="يَعمَهونَ" data-root="ع م ه" data-learn-more="/quran-terminology/fa/roots/ayn-m-h2/" data-root-meaning="سرگردان شدن، حیران ماندن، حرکت بی‌جهت، و نابینایی درونی نسبت به راه درست">يَعمَهونَ</button>
  </p>
  <p class="farsi-verse">و دل‌ها و دیدگانشان را برمی‌گردانیم، همان‌گونه که نخستین بار به آن ایمان نیاوردند، و آنان را در سرکشی‌شان سرگردان وا می‌گذاریم.</p>
</section>
