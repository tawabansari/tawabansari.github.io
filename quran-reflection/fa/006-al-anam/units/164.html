  <p class="farsi-verse">بگو: آیا جز آن معبود یگانه پروردگاری بجویم، در حالی که او پروردگار هر چیزی است؟ و هر نفسی جز بر عهده خود چیزی به دست نمی‌آورد؛ و هیچ باربرداری بار دیگری را برنمی‌دارد. سپس بازگشت شما به سوی پروردگارتان است و شما را از آنچه در آن اختلاف می‌کردید آگاه می‌کند.</p>
