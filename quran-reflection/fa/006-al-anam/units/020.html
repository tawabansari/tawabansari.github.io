<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءاتَينٰهُمُ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتَينٰهُمُ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="يَعرِفونَهُ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">يَعرِفونَهُ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="يَعرِفونَ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">يَعرِفونَ</button>
    <button class="word-link" type="button" data-word="أَبناءَهُمُ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">أَبناءَهُمُ</button>
    ۘ
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="خَسِروا" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">خَسِروا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">يُؤمِنونَ</button>
  </p>
  <p class="farsi-verse">کسانی که کتاب به آنان داده‌ایم، او را می‌شناسند همان‌گونه که پسرانشان را می‌شناسند. کسانی که خود را زیانکار کرده‌اند، ایمان نمی‌آورند.</p>
</section>
