<section class="ayah-block" id="ayah-103" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۰۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="تُدرِكُهُ" data-root="د ر ك" data-learn-more="/quran-terminology/fa/roots/d-r-k/" data-root-meaning="رسیدن و دست یافتن؛ دریافت حسی یا شناختی، پیوستن و تدارک؛ و در «دَرْك»، مرتبهٔ پایین." data-context="او را درمی‌یابد؛ با نفی جمله: دیدگان او را درنمی‌یابند.">تُدرِكُهُ</button>
    <button class="word-link" type="button" data-word="الأَبصٰرُ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="دیدگان؛ فاعلِ دریافتن در جملهٔ منفی.">الأَبصٰرُ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="يُدرِكُ" data-root="د ر ك" data-learn-more="/quran-terminology/fa/roots/d-r-k/" data-root-meaning="رسیدن و دست یافتن؛ دریافت حسی یا شناختی، پیوستن و تدارک؛ و در «دَرْك»، مرتبهٔ پایین." data-context="درمی‌یابد؛ وصف فعل خداوند نسبت به دیدگان.">يُدرِكُ</button>
    <button class="word-link" type="button" data-word="الأَبصٰرَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="دیدگان را؛ متعلقِ دریافتن.">الأَبصٰرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="اللَّطيفُ" data-root="ل ط ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-tt-f/" data-root-meaning="باریکی و ظرافت؛ لطف: توجه دقیق و مهربانانه." data-context="لطیف؛ وصف آن معبود یگانه.">اللَّطيفُ</button>
    <button class="word-link" type="button" data-word="الخَبيرُ" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="آگاه؛ وصفِ آگاهی آن معبود یگانه در سیاق آیه." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">الخَبيرُ</button>
  </p>
  <p class="farsi-verse">دیدگان او را درنمی‌یابند و او دیدگان را درمی‌یابد؛ و او لطیف و آگاه است.</p>
</section>
