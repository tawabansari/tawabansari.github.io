<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَنهَونَ" data-root="ن ه ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h2-y/" data-root-meaning="بازداشتن و پایان؛ نُهی: خردِ بازدارنده.">يَنهَونَ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="وَيَنـَٔونَ" data-root="ن أ ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-a-y/" data-root-meaning="دور شدن و کناره گرفتن.">وَيَنـَٔونَ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="يُهلِكونَ" data-root="ه ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-l-k/" data-root-meaning="از میان رفتن و نابود کردن؛ نیز از دست رفتن، بنا بر سیاق.">يُهلِكونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">و آنان از آن بازمی‌دارند و از آن دوری می‌کنند؛ و جز خود را نابود نمی‌کنند و درنمی‌یابند.</p>
</section>
