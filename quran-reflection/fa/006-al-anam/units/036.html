<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يَستَجيبُ" data-root="ج و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَستَجيبُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَسمَعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/">يَسمَعونَ</button>
    ۘ
    <button class="word-link" type="button" data-word="وَالمَوتىٰ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">وَالمَوتىٰ</button>
    <button class="word-link" type="button" data-word="يَبعَثُهُمُ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/">يَبعَثُهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="يُرجَعونَ" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع">يُرجَعونَ</button>
  </p>
  <p class="farsi-verse">تنها کسانی پاسخ می‌دهند که می‌شنوند؛ و مردگان را آن معبود یگانه برمی‌انگیزد، سپس به سوی او بازگردانده می‌شوند.</p>
</section>
