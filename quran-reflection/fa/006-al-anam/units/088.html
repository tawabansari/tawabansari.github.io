  <p class="farsi-verse">این هدایت آن معبود یگانه است که با آن هرکه را از بندگانش بخواهد هدایت می‌کند؛ و اگر شریک می‌گرفتند، آنچه انجام می‌دادند تباه می‌شد.</p>
