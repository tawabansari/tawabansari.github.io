<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۸۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُدَى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هُدَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَهدى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدى</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">يَشاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه">عِبادِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَشرَكوا" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد">أَشرَكوا</button>
    <button class="word-link" type="button" data-word="لَحَبِطَ" data-root="ح ب ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَحَبِطَ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">این هدایت آن معبود یگانه است که با آن هرکه را از بندگانش بخواهد هدایت می‌کند؛ و اگر شریک می‌گرفتند، آنچه انجام می‌دادند تباه می‌شد.</p>
</section>
