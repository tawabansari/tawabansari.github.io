  <p class="farsi-verse">بگو: به من بگویید، اگر آن معبود یگانه شنوایی و دیدگان شما را بگیرد و بر دل‌هایتان مهر نهد، کدام معبود جز آن معبود یگانه آن را برایتان می‌آورد؟ بنگر چگونه نشانه‌ها را گوناگون بیان می‌کنیم، سپس آنان روی می‌گردانند.</p>
