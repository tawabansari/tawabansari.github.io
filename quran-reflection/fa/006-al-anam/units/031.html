  <p class="farsi-verse">کسانی که دیدار آن معبود یگانه را دروغ شمردند زیان کردند؛ تا هنگامی که ساعت ناگهان به آنان برسد، می‌گویند: ای دریغ بر ما، بر کوتاهی‌ای که در آن کردیم؛ در حالی که بارهایشان را بر پشت‌هایشان می‌کشند. آگاه باشید، چه بد باری می‌کشند.</p>
