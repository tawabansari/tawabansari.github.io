<section class="ayah-block" id="ayah-162" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="صَلاتى" data-root="ص ل و / ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-w/" data-root-meaning="صلوة، پیوند زنده با آن معبود یگانه، هم‌جهت شدن با حق، و برپا داشتن راهی که انسان را از غفلت، کجی و پراکندگی بیرون می‌آورد">صَلاتى</button>
    <button class="word-link" type="button" data-word="وَنُسُكى" data-root="ن س ك" data-learn-more="/quran-terminology/fa/roots/n-s-k/" data-root-meaning="عبادت آیینی، قربانی و شیوه‌های انجام مناسک">وَنُسُكى</button>
    <button class="word-link" type="button" data-word="وَمَحياىَ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">وَمَحياىَ</button>
    <button class="word-link" type="button" data-word="وَمَماتى" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">وَمَماتى</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">العٰلَمينَ</button>
  </p>
  <p class="farsi-verse">بگو: صلات من و عبادت آیینی من و زندگی من و مرگ من برای آن معبود یگانه، پروردگار جهانیان است.</p>
</section>
