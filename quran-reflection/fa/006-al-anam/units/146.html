  <p class="farsi-verse">و بر کسانی که یهودی شدند هر ناخن‌داری را حرام کردیم؛ و از گاو و گوسفند، پیه آن دو را بر آنان حرام کردیم، مگر آنچه پشت‌هایشان یا روده‌ها حمل می‌کند یا آنچه با استخوان آمیخته است. این‌گونه آنان را به سبب سرکشی‌شان جزا دادیم؛ و ما راستگوییم.</p>
