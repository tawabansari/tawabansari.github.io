<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جَنَّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="پرده افکند و پوشاند؛ شب با تاریکی خود بر ابراهیم فراگرفت.">جَنَّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="الَّيلُ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="شب؛ فاعلِ پوشاندن و فراگرفتن در آغاز آیه.">الَّيلُ</button>
    <button class="word-link" type="button" data-word="رَءا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="دید؛ مشاهده یک کوکب در آسمان شب.">رَءا</button>
    <button class="word-link" type="button" data-word="كَوكَبًا" data-root="ك و ك ب" data-root-meaning="ستاره یا جرم روشنِ قابل مشاهده در آسمان؛ در کاربردهای گستردهٔ عربی، درخشندگی، شکوفهٔ برجسته و بخش بزرگ یا چشمگیر چیزی نیز با این نام بیان شده است." data-context="کوکبی؛ جرم آسمانی درخشانی که بدون نام‌گذاری دقیق دیده می‌شود." data-learn-more="/quran-terminology/fa/roots/k-w-k-b/">كَوكَبًا</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ سخن ابراهیم پس از دیدن کوکب: این پروردگار من است.">قالَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار من؛ در سخن «این پروردگار من است»، که نقش آن از سیاق احتجاج بررسی می‌شود.">رَبّى</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَفَلَ" data-root="أ ف ل" data-learn-more="/quran-terminology/fa/roots/a-f-l/" data-root-meaning="غایب شدن و از میدان دید بیرون رفتن چیزی که پیش‌تر آشکار بوده است؛ به‌ویژه ناپدید شدن اجرام آسمانی از افق دید ناظر." data-context="از دید پنهان شد؛ فعل ماضی مفرد مذکر درباره همان کوکب.">أَفَلَ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ سخن ابراهیم پس از افول کوکب.">قالَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="أُحِبُّ" data-root="ح ب ب" data-context="دوست دارم؛ در جمله با «لا» نفی شده است: دوست ندارم." data-root-meaning="محبت، دوست داشتن و دلبستگی؛ در ساخت‌های مربوط، محبوب‌تر بودن، محبوب گردانیدن یا ترجیح دادن." data-learn-more="/quran-terminology/fa/roots/h-b-b/">أُحِبُّ</button>
    <button class="word-link" type="button" data-word="الـٔافِلينَ" data-root="أ ف ل" data-learn-more="/quran-terminology/fa/roots/a-f-l/" data-root-meaning="غایب شدن و از میدان دید بیرون رفتن چیزی که پیش‌تر آشکار بوده است؛ به‌ویژه ناپدید شدن اجرام آسمانی از افق دید ناظر." data-context="افول‌کنندگان؛ وصف جمعیِ آنچه از دید پنهان می‌شود، در داوری ابراهیم درباره ربوبیت.">الـٔافِلينَ</button>
  </p>
  <p class="farsi-verse">پس هنگامی که شب او را پوشاند، ستاره‌ای دید؛ گفت: این پروردگار من است. پس چون غروب کرد، گفت: غروب‌کنندگان را دوست ندارم.</p>
</section>
