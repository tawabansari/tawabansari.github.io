<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۹۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="فالِقُ" data-root="ف ل ق" data-root-meaning="فلق، شکافتن و از هم گشودن چیزی است؛ در کاربرد مادی، به ایجاد شکاف و جدا شدن بخش‌ها مربوط می‌شود؛ و در کاربرد مربوط به صبح، به پدیدار شدن سپیده و آشکار شدن روشنایی آغاز روز اشاره دارد. «فالق» شکافنده و گشاینده است، «انفلق» شکافته شدن را بیان می‌کند و «الفلق» در سوره فلق نام سپیده‌دم است." data-learn-more="/quran-terminology/fa/roots/f-l-q/" data-context="شکافنده؛ وصف آن معبود یگانه نسبت به دانه و هسته.">فالِقُ</button>
    <button class="word-link" type="button" data-word="الحَبِّ" data-root="ح ب ب" data-context="دانه؛ در کنار هسته، موضوع شکافتن و رویش." data-root-meaning="دانه و بذر؛ «حَبّ» دانه و غله و «حَبَّة» یک دانه است." data-learn-more="/quran-terminology/fa/roots/h-b-b/">الحَبِّ</button>
    <button class="word-link" type="button" data-word="وَالنَّوىٰ" data-root="ن و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-w-y/" data-root-meaning="هسته میوه؛ در شاخه‌ای دیگر، قصد و مقصد." data-context="و هسته‌ها؛ در کنار دانه.">وَالنَّوىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="يُخرِجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="بیرون می‌آورد؛ زنده را از مرده.">يُخرِجُ</button>
    <button class="word-link" type="button" data-word="الحَىَّ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زنده؛ آنچه از مرده بیرون آورده می‌شود.">الحَىَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَيِّتِ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرده؛ در تقابل با زنده در این آیه.">المَيِّتِ</button>
    <button class="word-link" type="button" data-word="وَمُخرِجُ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="و بیرون‌آورنده؛ وصف فاعلِ بیرون آوردن مرده از زنده.">وَمُخرِجُ</button>
    <button class="word-link" type="button" data-word="المَيِّتِ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="مرده؛ در تقابل با زنده در این آیه.">المَيِّتِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الحَىِّ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زنده؛ آنچه مرده از آن بیرون آورده می‌شود.">الحَىِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَنّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَنّىٰ</button>
    <button class="word-link" type="button" data-word="تُؤفَكونَ" data-root="أ ف ك" data-learn-more="/quran-terminology/fa/roots/a-f-k/" data-root-meaning="برگرداندن یا دگرگون شدن چیزی از جهت، وضعیت یا صورتی که داشته است؛ و در حوزه سخن و باور، وارونه ساختن حقیقت یا روی‌گردان شدن از آن." data-context="پس چگونه از حقیقت برگردانده می‌شوید؛ پس از بیان آفرینش و بیرون آوردن زنده و مرده؟">تُؤفَكونَ</button>
  </p>
  <p class="farsi-verse">بی‌گمان آن معبود یگانه شکافنده دانه و هسته است؛ زنده را از مرده بیرون می‌آورد و بیرون‌آورنده مرده از زنده است. این است آن معبود یگانه؛ پس چگونه برگردانده می‌شوید؟</p>
</section>
