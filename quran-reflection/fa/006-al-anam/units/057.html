  <p class="farsi-verse">بگو: من بر دلیلی روشن از پروردگارم هستم و شما آن را دروغ شمرده‌اید. آنچه در آن شتاب می‌خواهید نزد من نیست. حکم جز از آنِ آن معبود یگانه نیست؛ حق را بیان می‌کند و او بهترین جداکنندگان است.</p>
