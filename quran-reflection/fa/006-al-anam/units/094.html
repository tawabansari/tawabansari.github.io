<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="جِئتُمونا" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="نزد ما آمده‌اید؛ حضور مخاطبان نزد خداوند در روز حساب.">جِئتُمونا</button>
    <button class="word-link" type="button" data-word="فُرٰدىٰ" data-root="ف ر د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-d/" data-root-meaning="تنها و یگانه بودن؛ فرادی: تک‌تک و جداگانه." data-context="تک‌تک و تنها؛ بدون همراهی دارایی‌ها و تکیه‌گاه‌های دنیوی.">فُرٰدىٰ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="خَلَقنٰكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="شما را آفریدیم؛ پدید آوردن نخستین مخاطبان.">خَلَقنٰكُم</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="نخستین؛ در ترکیب «نخستین بار» دربارهٔ آفرینش.">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="م ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-r-r/" data-root-meaning="گذشتن و تکرار؛ نیز تلخی و استواری، در صورت‌های متفاوت." data-context="بار؛ نوبت، در ترکیب «نخستین بار».">مَرَّةٍ</button>
    <button class="word-link" type="button" data-word="وَتَرَكتُم" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی" data-context="و رها کرده‌اید؛ دارایی‌ها و امکانات عطاشده را پشت سر گذاشته‌اید.">وَتَرَكتُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="خَوَّلنٰكُم" data-root="خ و ل" data-root-meaning="رسیدگی و نگهداری؛ بخشیدن و در اختیار گذاشتن؛ در شاخهٔ خویشاوندی، خال و خاله از سوی مادر." data-context="به شما داده و در اختیارتان گذاشته بودیم؛ برخورداری‌هایی که پشت سر رها کرده‌اید." data-learn-more="/quran-terminology/fa/roots/kh-w-l/">خَوَّلنٰكُم</button>
    <button class="word-link" type="button" data-word="وَراءَ" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش" data-context="پشتِ؛ آنچه در دنیا باقی گذاشته‌اند.">وَراءَ</button>
    <button class="word-link" type="button" data-word="ظُهورِكُم" data-root="ظ ه ر" data-learn-more="/quran-terminology/fa/roots/zha-h2-r/" data-root-meaning="پشت، سطح بیرونی، آشکاری، برتری و پشتیبانی" data-context="پشت‌هایتان؛ در تعبیر پشت سر گذاشتن برخورداری‌های دنیوی.">ظُهورِكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="نَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="می‌بینیم؛ در جملهٔ منفی، همراه نبودن شفیعان ادعایی را بیان می‌کند.">نَرىٰ</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="شُفَعاءَكُمُ" data-root="ش ف ع" data-learn-more="/quran-terminology/fa/roots/sh-f-ayn/" data-root-meaning="جفت‌شدن، ضمیمه‌شدن، و قرارگرفتن یک عامل در کنار عامل دیگر برای پشتیبانی یا تقویت یک اثر" data-context="شفیعان شما؛ میانجیانی که انتظار همراهی آنان را داشتید.">شُفَعاءَكُمُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="زَعَمتُم" data-root="ز ع م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-ayn-m/" data-root-meaning="ادعا و گفتار؛ زعیم: عهده‌دار یا ضامن، بنا بر سیاق." data-context="ادعا می‌کردید؛ نسبت دادن شراکت به شفیعان یادشده.">زَعَمتُم</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="فيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيكُم</button>
    <button class="word-link" type="button" data-word="شُرَكٰؤُا۟" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریکان؛ جایگاهی که برای شفیعان ادعایی قائل بودند.">شُرَكٰؤُا۟</button>
    ۚ
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="تَقَطَّعَ" data-root="ق ط ع" data-learn-more="/quran-terminology/fa/roots/q-tt-ayn/" data-root-meaning="بریدن، جدا کردن، گسستن، منقطع ساختن، و پایان دادن به راه اتصال" data-context="گسسته است؛ قطع شدن پیوندهایی که به آنها تکیه می‌کردند.">تَقَطَّعَ</button>
    <button class="word-link" type="button" data-word="بَينَكُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان شما؛ در سیاق گسستن پیوندهای پیشین.">بَينَكُم</button>
    <button class="word-link" type="button" data-word="وَضَلَّ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه" data-context="و از دسترس ناپدید شده است؛ آنچه به گمان و ادعا به آن تکیه داشتند.">وَضَلَّ</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ همراه فعل پس از خود، استمرار ادعاهای پیشین را بیان می‌کند.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَزعُمونَ" data-root="ز ع م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-ayn-m/" data-root-meaning="ادعا و گفتار؛ زعیم: عهده‌دار یا ضامن، بنا بر سیاق." data-context="ادعا می‌کردید؛ باورهای ادعایی دربارهٔ تکیه‌گاه‌های یادشده.">تَزعُمونَ</button>
  </p>
  <p class="farsi-verse">و به‌راستی تنها نزد ما آمده‌اید، همان‌گونه که نخستین بار شما را آفریدیم؛ و آنچه به شما بخشیده بودیم پشت سر گذاشته‌اید. و شفاعت‌کنندگانتان را که می‌پنداشتید در کار شما شریک‌اند با شما نمی‌بینیم. پیوند میانتان بریده شده و آنچه ادعا می‌کردید از شما گم شده است.</p>
</section>
