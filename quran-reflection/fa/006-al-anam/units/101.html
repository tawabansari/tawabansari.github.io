  <p class="farsi-verse">پدیدآورنده بی‌مانند آسمان‌ها و زمین است؛ چگونه فرزندی داشته باشد، در حالی که همسری ندارد و هر چیزی را آفریده است؟ و او به هر چیزی داناست.</p>
