<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="جَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">جَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="مَلَكًا" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">مَلَكًا</button>
    <button class="word-link" type="button" data-word="لَجَعَلنٰهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">لَجَعَلنٰهُ</button>
    <button class="word-link" type="button" data-word="رَجُلًا" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه.">رَجُلًا</button>
    <button class="word-link" type="button" data-word="وَلَلَبَسنا" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن">وَلَلَبَسنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَلبِسونَ" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن">يَلبِسونَ</button>
  </p>
  <p class="farsi-verse">و اگر او را فرشته قرار می‌دادیم، حتما او را مردی قرار می‌دادیم و آنچه را در آن ابهام می‌افکنند بر آنان مبهم می‌ساختیم.</p>
</section>
