<section class="ayah-block" id="ayah-133" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَرَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="و پروردگار تو؛ در وصف بی‌نیازی و رحمت او.">وَرَبُّكَ</button>
    <button class="word-link" type="button" data-word="الغَنِىُّ" data-root="غ ن ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-n-y/" data-root-meaning="بی‌نیازی و توانگری؛ اغناء: کفایت و سود رساندن." data-context="بی‌نیاز؛ نیازمند مخاطبان و عبادت آنان نیست.">الغَنِىُّ</button>
    <button class="word-link" type="button" data-word="ذُو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذُو</button>
    <button class="word-link" type="button" data-word="الرَّحمَةِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمت؛ وصف بخشایندگی پروردگار.">الرَّحمَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="يَشَأ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهد؛ در شرطِ برداشتن مخاطبان.">يَشَأ</button>
    <button class="word-link" type="button" data-word="يُذهِبكُم" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="شما را ببرد؛ از میان برداشتن مخاطبان در عبارت شرطی.">يُذهِبكُم</button>
    <button class="word-link" type="button" data-word="وَيَستَخلِف" data-root="خ ل ف" data-learn-more="/quran-terminology/fa/roots/kh-l-f/" data-root-meaning="پشت سر آمدن، جانشینی، در پی چیزی آمدن، قرار گرفتن در امتداد یا پس از چیزی" data-context="و جانشین سازد؛ پس از شما کسانی دیگر را.">وَيَستَخلِف</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِكُم" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از شما؛ زمان جانشین شدن دیگران.">بَعدِكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهد؛ دربارهٔ کسانی که جانشین می‌شوند.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="أَنشَأَكُم" data-root="ن ش أ" data-learn-more="/quran-terminology/fa/roots/n-sh-a/" data-root-meaning="پدید آمدن، برآمدن و رشد کردن؛ در ساخت سببی، پدید آوردن، شکل دادن و پرورش دادن." data-context="شما را پدید آورد؛ پیوند پیدایش مخاطبان با نسل مردمی پیشین.">أَنشَأَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّةِ" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه" data-context="نسل؛ زادگان مردمی دیگر که مخاطبان از آنان پدید آمده‌اند.">ذُرِّيَّةِ</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="مردمی؛ گروه پیشینی که نسل مخاطبان به آنان پیوند دارد.">قَومٍ</button>
    <button class="word-link" type="button" data-word="ءاخَرينَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="دیگر؛ وصف مردمی که پیش از مخاطبان بوده‌اند.">ءاخَرينَ</button>
  </p>
  <p class="farsi-verse">و پروردگارت بی‌نیاز و دارای رحمت است؛ اگر بخواهد شما را می‌برد و پس از شما هرچه بخواهد جانشین می‌کند، همان‌گونه که شما را از نسل گروهی دیگر پدید آورد.</p>
</section>
