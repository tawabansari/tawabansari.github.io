  <p class="farsi-verse">بگو: من از پرستیدن کسانی که جز آن معبود یگانه می‌خوانید نهی شده‌ام. بگو: از خواسته‌های شما پیروی نمی‌کنم؛ در آن صورت گمراه شده‌ام و از هدایت‌یافتگان نیستم.</p>
