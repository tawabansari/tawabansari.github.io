<section class="ayah-block" id="ayah-105" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۰۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نُصَرِّفُ" data-root="ص ر ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نُصَرِّفُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="وَلِيَقولوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">وَلِيَقولوا</button>
    <button class="word-link" type="button" data-word="دَرَستَ" data-root="د ر س" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">دَرَستَ</button>
    <button class="word-link" type="button" data-word="وَلِنُبَيِّنَهُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/">وَلِنُبَيِّنَهُ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">يَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و این‌گونه نشانه‌ها را گوناگون بیان می‌کنیم، و تا بگویند: درس خوانده‌ای؛ و تا آن را برای گروهی که می‌دانند روشن سازیم.</p>
