  <p class="farsi-verse">و چگونه از آنچه شریک گرفته‌اید بترسم، در حالی که شما نمی‌ترسید از اینکه چیزی را شریک آن معبود یگانه گرفته‌اید که درباره‌اش هیچ دلیلی بر شما فرو نفرستاده است؟ پس کدام‌یک از دو گروه به امنیت سزاوارتر است، اگر می‌دانید؟</p>
