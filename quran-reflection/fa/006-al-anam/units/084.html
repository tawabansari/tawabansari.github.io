  <p class="farsi-verse">و اسحاق و یعقوب را به او بخشیدیم؛ همه را هدایت کردیم. و نوح را پیش‌تر هدایت کردیم؛ و از نسل او داوود، سلیمان، ایوب، یوسف، موسی و هارون را؛ و این‌گونه نیکوکاران را پاداش می‌دهیم.</p>
