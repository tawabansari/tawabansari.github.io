<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَدِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَدِ</button>
    <button class="word-link" type="button" data-word="استُهزِئَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="تمسخر شدند؛ فعل مجهول دربارهٔ پیامبران پیشین.">استُهزِئَ</button>
    <button class="word-link" type="button" data-word="بِرُسُلٍ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="پیامبرانی؛ کسانی که پیش از مخاطب مورد تمسخر قرار گرفتند.">بِرُسُلٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از تو؛ خطاب به پیامبر و دربارهٔ رسولان پیشین.">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="فَحاقَ" data-root="ح ي ق" data-root-meaning="فرود آمدن و فراگرفتن چیزی، به‌ویژه پیامدی ناگوار که شخص را گرفتار می‌کند." data-context="فراگرفت؛ آنچه پیش‌تر مسخره می‌کردند، بر خود آنان واقع شد." data-learn-more="/quran-terminology/fa/roots/h-y-q/">فَحاقَ</button>
    <button class="word-link" type="button" data-word="بِالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِالَّذينَ</button>
    <button class="word-link" type="button" data-word="سَخِروا" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/" data-context="مسخره کردند؛ رفتار گروهی در برابر پیامبران.">سَخِروا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه فعل بعدی، استمرار تمسخر در گذشته را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="مسخره می‌کردند؛ دربارهٔ آنچه سرانجام خود آنان را فراگرفت.">يَستَهزِءونَ</button>
  </p>
  <p class="farsi-verse">و پیش از تو نیز رسولانی مسخره شدند؛ پس آنچه مسخره‌اش می‌کردند، کسانی را که آنان را به ریشخند می‌گرفتند فرا گرفت.</p>
</section>
