<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۰۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="شُرَكاءَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">شُرَكاءَ</button>
    <button class="word-link" type="button" data-word="الجِنَّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/">الجِنَّ</button>
    <button class="word-link" type="button" data-word="وَخَلَقَهُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">وَخَلَقَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَخَرَقوا" data-root="خ ر ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَخَرَقوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="بَنينَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">بَنينَ</button>
    <button class="word-link" type="button" data-word="وَبَنٰتٍ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">وَبَنٰتٍ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">عِلمٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="سُبحٰنَهُ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/">سُبحٰنَهُ</button>
    <button class="word-link" type="button" data-word="وَتَعٰلىٰ" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَتَعٰلىٰ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="يَصِفونَ" data-root="و ص ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَصِفونَ</button>
  </p>
  <p class="farsi-verse">و جن را شریکان آن معبود یگانه قرار دادند، در حالی که او آنان را آفریده است؛ و بی‌هیچ دانشی پسران و دخترانی برای او به دروغ ساختند. او منزه و برتر است از آنچه وصف می‌کنند.</p>
</section>
