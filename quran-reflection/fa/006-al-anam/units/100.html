<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۰۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلوا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار دادند؛ نسبت دادن جایگاه شریک به جن.">وَجَعَلوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="شُرَكاءَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریکان؛ جایگاهی که به جن نسبت داده‌اند.">شُرَكاءَ</button>
    <button class="word-link" type="button" data-word="الجِنَّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="جن؛ موجوداتی که در ادعای یادشده شریک شمرده شدند.">الجِنَّ</button>
    <button class="word-link" type="button" data-word="وَخَلَقَهُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="و آنان را آفرید؛ یادآوری آفرینش در برابر شریک‌سازی.">وَخَلَقَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَخَرَقوا" data-root="خ ر ق" data-root-meaning="شکافتن، سوراخ کردن و گذشتن از میان چیزی؛ در شاخهٔ گفتاری، برساختن سخن و نسبت بی‌پشتوانه." data-context="و برساختند؛ نسبتِ پسران و دختران به آن معبود یگانه، بدون دانش." data-learn-more="/quran-terminology/fa/roots/kh-r-q/">وَخَرَقوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="بَنينَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="پسران؛ بخشی از نسبتِ برساخته و بی‌علم.">بَنينَ</button>
    <button class="word-link" type="button" data-word="وَبَنٰتٍ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار" data-context="و دختران؛ بخش دیگرِ نسبتِ برساخته.">وَبَنٰتٍ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="بدون؛ در ترکیب «بغیر علم»، نفی پشتوانهٔ علمی.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="دانش؛ پشتوانه‌ای که برای نسبت دادن فرزندان وجود ندارد.">عِلمٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="سُبحٰنَهُ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/" data-root-meaning="شناور بودن، حرکت روان در مسیر، دور شدن از فرو رفتن و خروج از مدار، و پاک دانستن آن معبود یگانه از هر نسبت ناروا" data-context="منزه است او؛ تنزیه از نسبت‌های ناروا.">سُبحٰنَهُ</button>
    <button class="word-link" type="button" data-word="وَتَعٰلىٰ" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن." data-context="و فراتر است؛ برتری از آنچه وصف می‌کنند.">وَتَعٰلىٰ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="يَصِفونَ" data-root="و ص ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-sad-f/" data-root-meaning="وصف و بیان ویژگی." data-context="وصف می‌کنند؛ وصف‌هایی که در نسبت‌های یادشده می‌گویند.">يَصِفونَ</button>
  </p>
  <p class="farsi-verse">و جن را شریکان آن معبود یگانه قرار دادند، در حالی که او آنان را آفریده است؛ و بی‌هیچ دانشی پسران و دخترانی برای او به دروغ ساختند. او منزه و برتر است از آنچه وصف می‌کنند.</p>
</section>
