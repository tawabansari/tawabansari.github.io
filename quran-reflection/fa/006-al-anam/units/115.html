  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَمَّت" data-root="ت م م" data-learn-more="/quran-terminology/fa/roots/t-m-m/">وَتَمَّت</button>

    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="صِدقًا" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/">صِدقًا</button>
    <button class="word-link" type="button" data-word="وَعَدلًا" data-root="ع د ل" data-learn-more="/quran-terminology/fa/roots/ayn-d-l/">وَعَدلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="مُبَدِّلَ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/">مُبَدِّلَ</button>

    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>

  </p>
  <p class="farsi-verse">و کلمه پروردگارت در راستی و داد کامل شد؛ هیچ دگرگون‌کننده‌ای برای کلمات او نیست؛ و او شنوا و داناست.</p>
