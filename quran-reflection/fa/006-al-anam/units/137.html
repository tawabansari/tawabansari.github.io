<section class="ayah-block" id="ayah-137" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="زَيَّنَ" data-root="ز ي ن" data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آراستگی؛ زیبا ساختن یا زیبا جلوه دادن چیزی." data-context="شریکان پنداری، کشتن فرزندان را در نظر آنان آراستند.">زَيَّنَ</button>
    <button class="word-link" type="button" data-word="لِكَثيرٍ" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/" data-root-meaning="فراوانی، افزایش، کثرت، انبوهی، خیر بسیار، و فزون‌خواهی فریبنده" data-context="برای شمار بسیاری از مشرکان.">لِكَثيرٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="کسانی که برای آن معبود یگانه شریک قرار می‌دادند.">المُشرِكينَ</button>
    <button class="word-link" type="button" data-word="قَتلَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="کشتن فرزندان؛ کرداری که برای آنان آراسته شده بود.">قَتلَ</button>
    <button class="word-link" type="button" data-word="أَولٰدِهِم" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد" data-context="فرزندان خودشان؛ کسانی که کشتنشان آراسته شده بود.">أَولٰدِهِم</button>
    <button class="word-link" type="button" data-word="شُرَكاؤُهُم" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریکان پنداری آنان؛ عامل آراستن کشتن فرزندان در ساخت جمله.">شُرَكاؤُهُم</button>
    <button class="word-link" type="button" data-word="لِيُردوهُم" data-root="ر د ي" data-learn-more="/quran-terminology/fa/roots/r-d-y/" data-root-meaning="فروافتادن و هلاکت؛ رَدِيَ: هلاک شدن؛ أَرْدَى: به هلاکت کشاندن؛ تَرَدَّى: سقوط یا به تباهی افتادن؛ در شاخه‌های دیگر، پرتاب و حرکت پرشتاب." data-context="تا مشرکان را با آراستن این کردار به نابودی بکشانند.">لِيُردوهُم</button>
    <button class="word-link" type="button" data-word="وَلِيَلبِسوا" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن" data-context="و تا دینشان را برای آنان درآمیزند و مشتبه سازند.">وَلِيَلبِسوا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="دينَهُم" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد" data-context="دینشان؛ آیین و راه دینی‌ای که برای آنان مشتبه می‌شد.">دينَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="اگر پروردگارت می‌خواست؛ خواستی که در جملهٔ شرطی مطرح است.">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فَعَلوهُ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="این کار را انجام داده بودند؛ در جملهٔ کامل، انجام آن در فرض یادشده نفی می‌شود.">فَعَلوهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذَرهُم" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="پس آنان را واگذار؛ فرمان به رها کردن آنان با آنچه می‌سازند.">فَذَرهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="آنچه به دروغ می‌سازند و نسبت می‌دهند.">يَفتَرونَ</button>
  </p>
  <p class="farsi-verse">و این‌گونه شریکانشان کشتن فرزندانشان را برای بسیاری از شریک‌گیرندگان آراستند تا آنان را به نابودی افکنند و دینشان را بر آنان مشتبه سازند. و اگر آن معبود یگانه می‌خواست، آن را انجام نمی‌دادند؛ پس آنان و آنچه به دروغ می‌سازند واگذار.</p>
</section>
