<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="صُمٌّ" data-root="ص م م" data-learn-more="/quran-terminology/fa/roots/sad-m-m/" data-root-meaning="کری، بسته بودن راه شنیدن، سختی، انسداد، و نفوذناپذیری نسبت به صدا یا پیام">صُمٌّ</button>
    <button class="word-link" type="button" data-word="وَبُكمٌ" data-root="ب ك م" data-learn-more="/quran-terminology/fa/roots/b-k-m/" data-root-meaning="گنگی، بسته شدن توان بیان، ناتوانی از سخن روشن، و بسته شدن راه خروج معنا از زبان">وَبُكمٌ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الظُّلُمٰتِ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظُّلُمٰتِ</button>
    ۗ
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يَشَإِ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشَإِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يُضلِلهُ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/">يُضلِلهُ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَشَأ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشَأ</button>
    <button class="word-link" type="button" data-word="يَجعَلهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">يَجعَلهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="ص ر ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">مُستَقيمٍ</button>
  </p>
  <p class="farsi-verse">و کسانی که نشانه‌های ما را دروغ شمردند، کر و گنگ در تاریکی‌هایند. آن معبود یگانه هرکه را بخواهد گمراه می‌کند و هرکه را بخواهد بر راهی راست قرار می‌دهد.</p>
</section>
