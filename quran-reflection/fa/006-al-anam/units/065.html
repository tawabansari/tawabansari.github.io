<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان بیان سخنِ پس از آن.">قُل</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="القادِرُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="توانا؛ کسی که توان فرستادن عذاب را دارد.">القادِرُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَبعَثَ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه." data-context="بفرستد و برانگیزد؛ دربارهٔ فرستادن عذاب.">يَبعَثَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذابی؛ رنج و کیفری که امکان فرستادنش بیان می‌شود.">عَذابًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِكُم" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="از بالای شما؛ یکی از جهت‌های رسیدن عذاب.">فَوقِكُم</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="از زیر؛ در ترکیب «از زیر پاهایتان».">تَحتِ</button>
    <button class="word-link" type="button" data-word="أَرجُلِكُم" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="پاهایتان؛ در بیان جهتِ زیرِ پاها.">أَرجُلِكُم</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="يَلبِسَكُم" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن" data-context="شما را درهم‌آمیزد و گرفتار سازد؛ دربارهٔ دسته‌های درگیر و پراکنده.">يَلبِسَكُم</button>
    <button class="word-link" type="button" data-word="شِيَعًا" data-root="ش ي ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-ayn/" data-root-meaning="پراکنده و رایج شدن؛ شیعه: گروه پیرو و پشتیبان." data-context="گروه‌ها و دسته‌ها؛ وضعیتِ پراکندگی و چنددستگی مخاطبان.">شِيَعًا</button>
    <button class="word-link" type="button" data-word="وَيُذيقَ" data-root="ذ و ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و از راه تجربه دریافتن، در خوشی یا رنج." data-context="و بچشاند؛ تجربه کردن شدت برخورد را با تصویر چشیدن بیان می‌کند.">وَيُذيقَ</button>
    <button class="word-link" type="button" data-word="بَعضَكُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="بعضی از شما را؛ کسانی که شدت برخورد دیگران را می‌چشند.">بَعضَكُم</button>
    <button class="word-link" type="button" data-word="بَأسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="شدت برخورد و نیروی قهر؛ آنچه گروهی از گروه دیگر می‌چشند.">بَأسَ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="بعضی دیگر؛ گروهی که شدت برخوردشان به دیگران می‌رسد.">بَعضٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="انظُر" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن" data-context="بنگر؛ دعوت به توجه به شیوهٔ بیان آیات.">انظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَيفَ</button>
    <button class="word-link" type="button" data-word="نُصَرِّفُ" data-root="ص ر ف" data-learn-more="/quran-terminology/fa/roots/sad-r-f/" data-root-meaning="گرداندن، بازگرداندن و تغییر جهت؛ در تصریف، گرداندن یا بیان کردن در صورت‌ها و شیوه‌های گوناگون" data-context="به شیوه‌های گوناگون بیان می‌کنیم؛ برای فراهم شدن فهم آیات.">نُصَرِّفُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات و نشانه‌ها؛ آنچه به شیوه‌های گوناگون بیان می‌شود.">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَفقَهونَ" data-root="ف ق ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-q-h2/" data-root-meaning="فهمیدن و دریافت دقیق سخن یا موضوع." data-context="بفهمند؛ هدفِ بیان گوناگون آیات.">يَفقَهونَ</button>
  </p>
  <p class="farsi-verse">بگو: او تواناست که عذابی از بالای شما یا از زیر پاهایتان بر شما بفرستد، یا شما را به‌صورت دسته‌های گوناگون درهم افکند و سختی برخی را به برخی دیگر بچشاند. بنگر چگونه نشانه‌ها را گوناگون بیان می‌کنیم، باشد که بفهمند.</p>
</section>
