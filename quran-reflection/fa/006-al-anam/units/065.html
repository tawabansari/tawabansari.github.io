  <p class="farsi-verse">بگو: او تواناست که عذابی از بالای شما یا از زیر پاهایتان بر شما بفرستد، یا شما را به‌صورت دسته‌های گوناگون درهم افکند و سختی برخی را به برخی دیگر بچشاند. بنگر چگونه نشانه‌ها را گوناگون بیان می‌کنیم، باشد که بفهمند.</p>
