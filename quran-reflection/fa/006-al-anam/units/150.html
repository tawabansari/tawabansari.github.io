  <p class="farsi-verse">بگو: گواهانتان را که گواهی می‌دهند آن معبود یگانه این را حرام کرده بیاورید. پس اگر گواهی دادند، تو با آنان گواهی مده؛ و از خواسته‌های کسانی که نشانه‌های ما را دروغ شمردند و کسانی که به آخرت ایمان ندارند و با پروردگارشان همتا می‌نهند پیروی نکن.</p>
