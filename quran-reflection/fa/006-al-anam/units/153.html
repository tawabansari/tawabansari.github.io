  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="صِرٰطى" data-root="ص ر ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صِرٰطى</button>
    <button class="word-link" type="button" data-word="مُستَقيمًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">مُستَقيمًا</button>

    ۖ

    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَتَّقونَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/">تَتَّقونَ</button>
  </p>
  <p class="farsi-verse">و این راه راست من است، پس از آن پیروی کنید؛ و از راه‌ها پیروی نکنید که شما را از راه او پراکنده می‌کنند. این است که شما را به آن سفارش کرده است، باشد که پروا کنید.</p>
