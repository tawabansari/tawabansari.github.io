<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَا</button>
    <button class="word-link" type="button" data-word="الحَيوٰةُ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="لَعِبٌ" data-root="ل ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-ayn-b/" data-root-meaning="بازی و کاری برای سرگرمی.">لَعِبٌ</button>
    <button class="word-link" type="button" data-word="وَلَهوٌ" data-root="ل ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-h2-w/" data-root-meaning="سرگرمی بازدارنده از امر مهم؛ الهاء: مشغول و غافل کردن.">وَلَهوٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَلدّارُ" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت">وَلَلدّارُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةُ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت">الـٔاخِرَةُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="يَتَّقونَ" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">يَتَّقونَ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی">تَعقِلونَ</button>
  </p>
  <p class="farsi-verse">و زندگی دنیا جز بازی و سرگرمی نیست؛ و سرای آخرت برای کسانی که پروا دارند بهتر است. آیا نمی‌اندیشید؟</p>
</section>
