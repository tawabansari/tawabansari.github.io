<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="ببینی؛ مشاهدهٔ صحنهٔ ایستادن آنان.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="وُقِفوا" data-root="و ق ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-f/" data-root-meaning="ایستادن و بازداشتن در جایگاه." data-context="نگه داشته شدند؛ ایستانده شدن در برابر پروردگارشان.">وُقِفوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ مرجع حضور و بازخواست آنان.">رَبِّهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ پرسش دربارهٔ حق بودن این صحنه.">قالَ</button>
    <button class="word-link" type="button" data-word="أَلَيسَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَيسَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ واقعی و درست بودن آنچه می‌بینند.">بِالحَقِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ پاسخ اقرار آنان.">قالوا</button>
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بَلىٰ</button>
    <button class="word-link" type="button" data-word="وَرَبِّنا" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="و به پروردگارمان؛ سوگند در تأیید پاسخ.">وَرَبِّنا</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز فرمان چشیدن عذاب.">قالَ</button>
    <button class="word-link" type="button" data-word="فَذوقُوا" data-root="ذ و ق" data-learn-more="/quran-terminology/fa/roots/dh-w-q/" data-root-meaning="چشیدن و دریافت مزه؛ در کاربرد گسترده، آزمودن و تجربه کردن؛ أَذَاقَ: چشاندن یا دیگری را در معرض تجربه قرار دادن." data-context="بچشید؛ فرمان به تجربهٔ عذاب در پی کفر.">فَذوقُوا</button>
    <button class="word-link" type="button" data-word="العَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ کیفری که به چشیدن آن فرمان داده می‌شود.">العَذابَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ بیان رفتار پیشین و مستمر.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر می‌ورزیدید؛ انکار و نپذیرفتن پیشین آنان.">تَكفُرونَ</button>
  </p>
  <p class="farsi-verse">و اگر می‌دیدی هنگامی که در برابر پروردگارشان نگاه داشته می‌شوند. می‌گوید: آیا این حق نیست؟ می‌گویند: چرا، سوگند به پروردگارمان. می‌گوید: پس عذاب را به سبب کفری که می‌ورزیدید بچشید.</p>
</section>
