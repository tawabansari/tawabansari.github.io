  <p class="farsi-verse">و اگر می‌دیدی هنگامی که در برابر پروردگارشان نگاه داشته می‌شوند. می‌گوید: آیا این حق نیست؟ می‌گویند: چرا، سوگند به پروردگارمان. می‌گوید: پس عذاب را به سبب کفری که می‌ورزیدید بچشید.</p>
