    <button class="word-link" type="button" data-word="الأُنثَيَينِ" data-root="أ ن ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="مادینه بودن؛ أُنثى نام جنس مؤنث است و به‌خودی‌خود داوری ارزشی ندارد.">الأُنثَيَينِ</button>
    <button class="word-link" type="button" data-word="أَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّا</button>

    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="أَرحامُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">أَرحامُ</button>
    <button class="word-link" type="button" data-word="الأُنثَيَينِ" data-root="أ ن ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="مادینه بودن؛ أُنثى نام جنس مؤنث است و به‌خودی‌خود داوری ارزشی ندارد.">الأُنثَيَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="نَبِّـٔونى" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">نَبِّـٔونى</button>

    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>

    <button class="word-link" type="button" data-word="صٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل">صٰدِقينَ</button>
  </p>
  <p class="farsi-verse">هشت تا، جفت‌جفت: از گوسفند دو و از بز دو. بگو: آیا دو نر را حرام کرده یا دو ماده را، یا آنچه رحم‌های دو ماده دربر گرفته است؟ اگر راست می‌گویید، از روی دانش به من خبر دهید.</p>
