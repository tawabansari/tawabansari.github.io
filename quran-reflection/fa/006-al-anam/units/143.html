<section class="ayah-block" id="ayah-143" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثَمٰنِيَةَ" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود" data-context="هشت؛ شمار افرادِ جفت‌های چارپایان.">ثَمٰنِيَةَ</button>
    <button class="word-link" type="button" data-word="أَزوٰجٍ" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند" data-context="جفت‌ها یا افرادِ دو سوی جفت؛ درباره چارپایان.">أَزوٰجٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الضَّأنِ" data-root="ض أ ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-a-n/" data-root-meaning="گوسفند، به‌ویژه در برابر بز." data-context="گوسفندان؛ گروه نخست چارپایانِ مورد بحث.">الضَّأنِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="ث ن ي" data-root-meaning="دوتایی‌شدن، بازگرداندن و تکرار" data-context="دو؛ یک نر و یک ماده از گروه چارپایان مورد بحث." data-learn-more="/quran-terminology/fa/roots/th-n-y/">اثنَينِ</button>
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="المَعزِ" data-root="م ع ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-ayn-z/" data-root-meaning="بز." data-context="بزها؛ یکی از گروه‌های چارپایان.">المَعزِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="ث ن ي" data-root-meaning="دوتایی‌شدن، بازگرداندن و تکرار" data-context="دو؛ یک نر و یک ماده از گروه چارپایان مورد بحث." data-learn-more="/quran-terminology/fa/roots/th-n-y/">اثنَينِ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمانِ طرح پرسش.">قُل</button>
    <button class="word-link" type="button" data-word="ءالذَّكَرَينِ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="آیا آن دو نر را؟ در پرسش درباره تحریم چارپایان.">ءالذَّكَرَينِ</button>
    <button class="word-link" type="button" data-word="حَرَّمَ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت" data-context="حرام کرده است؛ موضوع پرسش از ادعای تحریم چارپایان.">حَرَّمَ</button>
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمِ</button>
    <button class="word-link" type="button" data-word="الأُنثَيَينِ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="دو حیوان ماده، از گوسفند و بز؛ موضوع پرسش از تحریم، نه دو زن یا دختر.">الأُنثَيَينِ</button>
    <button class="word-link" type="button" data-word="أَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّا</button>
    <button class="word-link" type="button" data-word="اشتَمَلَت" data-root="ش م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-l/" data-root-meaning="چپ؛ نیز دربرگرفتن و پوشاندن." data-context="دربر گرفته است؛ آنچه رحم حیوان ماده حمل می‌کند.">اشتَمَلَت</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="أَرحامُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحم‌ها؛ در اینجا رحم حیوانات ماده.">أَرحامُ</button>
    <button class="word-link" type="button" data-word="الأُنثَيَينِ" data-root="أ ن ث" data-learn-more="/quran-terminology/fa/roots/a-n-th/" data-root-meaning="جنس ماده در برابر جنس نر، در انسان و دیگر جانداران؛ و در کاربردهای زبانی، مؤنث شمردن چیزی یا نسبت دادن جنس ماده به آن." data-context="آن دو حیوان ماده؛ در ترکیب رحم‌های دو ماده و آنچه حمل می‌کنند.">الأُنثَيَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="نَبِّـٔونى" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="به من خبر دهید؛ همراه با مطالبه دانش.">نَبِّـٔونى</button>
    <button class="word-link" type="button" data-word="بِعِلمٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="با دانش؛ پشتوانه‌ای که برای ادعا مطالبه می‌شود.">بِعِلمٍ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشید؛ در شرطِ راست‌گویی.">كُنتُم</button>
    <button class="word-link" type="button" data-word="صٰدِقينَ" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راست‌گویان؛ شرطِ مطالبه دانش و خبر.">صٰدِقينَ</button>
  </p>
  <p class="farsi-verse">هشت تا، جفت‌جفت: از گوسفند دو و از بز دو. بگو: آیا دو نر را حرام کرده یا دو ماده را، یا آنچه رحم‌های دو ماده دربر گرفته است؟ اگر راست می‌گویید، از روی دانش به من خبر دهید.</p>
</section>
