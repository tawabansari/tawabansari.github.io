  <p class="farsi-verse">و هنگامی که کسانی که به نشانه‌های ما ایمان دارند نزد تو می‌آیند، بگو: سلام بر شما؛ پروردگارتان رحمت را بر خود مقرر کرده است؛ هرکس از شما از روی نادانی بدی کند، سپس پس از آن بازگردد و اصلاح کند، او آمرزنده و رحیم است.</p>
