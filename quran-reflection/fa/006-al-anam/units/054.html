<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="جاءَكَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جاءَكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>

    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">فَقُل</button>
    <button class="word-link" type="button" data-word="سَلٰمٌ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت">سَلٰمٌ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="كَتَبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">كَتَبَ</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسِهِ</button>
    <button class="word-link" type="button" data-word="الرَّحمَةَ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">الرَّحمَةَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="عَمِلَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">عَمِلَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="سوءًا" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سوءًا</button>
    <button class="word-link" type="button" data-word="بِجَهٰلَةٍ" data-root="ج ه ل" data-learn-more="/quran-terminology/fa/roots/j-h2-l/" data-root-meaning="نادانی و ناآگاهی؛ و نیز سبک‌سری و رفتار بی‌سنجش برخاسته از فقدان علم، حلم یا طمأنینه.">بِجَهٰلَةٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="تابَ" data-root="ت و ب" data-learn-more="/quran-terminology/fa/roots/t-w-b/" data-root-meaning="بازگشت از مسیر نادرست، رو آوردن دوباره به آن معبود یگانه، و گشوده شدن راه اصلاح با رحمت الهی">تابَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدِهِ</button>
    <button class="word-link" type="button" data-word="وَأَصلَحَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">وَأَصلَحَ</button>
    <button class="word-link" type="button" data-word="فَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">و هنگامی که کسانی که به نشانه‌های ما ایمان دارند نزد تو می‌آیند، بگو: سلام بر شما؛ پروردگارتان رحمت را بر خود مقرر کرده است؛ هرکس از شما از روی نادانی بدی کند، سپس پس از آن بازگردد و اصلاح کند، او آمرزنده و رحیم است.</p>
</section>
