  <p class="farsi-verse">و اگر می‌دیدی هنگامی که بر آتش نگاه داشته می‌شوند و می‌گویند: ای کاش بازگردانده شویم و نشانه‌های پروردگارمان را دروغ نشماریم و از مؤمنان باشیم.</p>
