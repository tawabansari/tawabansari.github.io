<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نُفَصِّلُ" data-root="ف ص ل" data-root-meaning="جدا و مشخص ساختن چیزی از چیز دیگر، به‌گونه‌ای که مرز، تفاوت یا نتیجهٔ آن روشن شود." data-context="آیات را روشن و به‌تفصیل بیان می‌کنیم." data-learn-more="/quran-terminology/fa/roots/f-sad-l/">نُفَصِّلُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات و نشانه‌ها.">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="وَلِتَستَبينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="و تا آشکار و مشخص شود.">وَلِتَستَبينَ</button>
    <button class="word-link" type="button" data-word="سَبيلُ" data-root="س ب ل" data-learn-more="/quran-terminology/fa/roots/s-b-l/" data-root-meaning="سَبِيل؛ راهی که می‌توان در آن رفت" data-context="راهِ؛ مسیرِ گروهِ یادشده.">سَبيلُ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ مرتکبانِ جرم و گناه." data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمينَ</button>
  </p>
  <p class="farsi-verse">و این‌گونه نشانه‌ها را به‌تفصیل بیان می‌کنیم، و تا راه مجرمان آشکار شود.</p>
</section>
