<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَولا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="به آنان رسید؛ رسیدن سختیِ یادشده">جاءَهُم</button>
    <button class="word-link" type="button" data-word="بَأسُنا" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="سختی ما؛ رخدادی که باید زمینهٔ بازنگری می‌شد">بَأسُنا</button>
    <button class="word-link" type="button" data-word="تَضَرَّعوا" data-root="ض ر ع" data-learn-more="/quran-terminology/fa/roots/dad-r-ayn/" data-root-meaning="نرمی، فروتنی و اظهار نیاز؛ در کاربرد انسانی، زاری و روی آوردنِ فروتنانه. در کاربردهای دیگر، پستان شیرده دام، همانندی، و نام گیاهی ناخوشایند به نام ضریع." data-context="زاری کردند و فروتنی نشان دادند؛ در پرسش «چرا زاری نکردند؟»">تَضَرَّعوا</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="قَسَت" data-root="ق س و" data-learn-more="/quran-terminology/fa/roots/q-s-w/" data-root-meaning="سختی، صلابت، مقاومت در برابر تاثیر و کاهش پذیرندگی قلب" data-context="سخت شد؛ دربارهٔ دل‌های آنان">قَسَت</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌هایشان؛ جایگاه پذیرش یا سرسختی در سیاق آیه">قُلوبُهُم</button>
    <button class="word-link" type="button" data-word="وَزَيَّنَ" data-root="ز ي ن" data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آراستگی؛ زیبا ساختن یا زیبا جلوه دادن چیزی." data-context="و آراست؛ کارهای آنان را در نظرشان خوشایند جلوه داد">وَزَيَّنَ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ عامل آراستن کارهای نادرست در این جمله">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه فعل بعد برای بیان کردار پیشین">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دادند؛ کارهایی که برایشان آراسته شد">يَعمَلونَ</button>
  </p>
  <p class="farsi-verse">پس چرا هنگامی که سختی ما به آنان رسید زاری نکردند؟ ولی دل‌هایشان سخت شد و شیطان آنچه را انجام می‌دادند برایشان آراست.</p>
</section>
