<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۷۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نُرى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/">نُرى</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="مَلَكوتَ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/">مَلَكوتَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلِيَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">وَلِيَكونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الموقِنينَ" data-root="ي ق ن" data-learn-more="/quran-terminology/fa/roots/y-q-n/">الموقِنينَ</button>
  </p>
  <p class="farsi-verse">و این‌گونه فرمانروایی آسمان‌ها و زمین را به ابراهیم نشان می‌دهیم، و تا از اهل یقین باشد.</p>
