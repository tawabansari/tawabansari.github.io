  <p class="farsi-verse">و اوست که شب شما را به‌تمامی می‌گیرد و آنچه را روز به دست آورده‌اید می‌داند؛ سپس شما را در آن برمی‌انگیزد تا سرآمدی معین به پایان برسد. سپس بازگشت شما به سوی اوست؛ آنگاه شما را از آنچه انجام می‌دادید آگاه می‌کند.</p>
