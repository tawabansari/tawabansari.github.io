<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يَتَوَفّىٰكُم" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا" data-context="شما را به‌تمامی می‌گیرد؛ در سیاق شب و چرخهٔ خواب و بیداری.">يَتَوَفّىٰكُم</button>
    <button class="word-link" type="button" data-word="بِالَّيلِ" data-root="ل ي ل" data-learn-more="/quran-terminology/fa/roots/l-y-l/" data-root-meaning="شب، پوشیدگی روز، کاهش روشنایی، سکون نسبی و واحدهای زمانیِ شبانه" data-context="در شب؛ زمانِ گرفتنِ انسان‌ها که در برابر کردار روزانه آمده است.">بِالَّيلِ</button>
    <button class="word-link" type="button" data-word="وَيَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="و می‌داند؛ آگاهی خداوند از آنچه انسان‌ها در روز انجام می‌دهند.">وَيَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="جَرَحتُم" data-root="ج ر ح" data-root-meaning="زخمی کردن و ایجاد اثر بر بدن؛ و در شاخه‌ای دیگر، کسب کردن و انجام دادن عمل." data-context="انجام داده‌اید یا به دست آورده‌اید؛ کردارهایی که روز انجام می‌دهید و خداوند آنها را می‌داند." data-learn-more="/quran-terminology/fa/roots/j-r-h/">جَرَحتُم</button>
    <button class="word-link" type="button" data-word="بِالنَّهارِ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="در روز؛ زمان کردارهایی که آیه از آگاهی خداوند به آنها سخن می‌گوید.">بِالنَّهارِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَبعَثُكُم" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه." data-context="شما را برمی‌انگیزد؛ بازگرداندن به فعالیت در چرخهٔ روز و شب.">يَبعَثُكُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِ</button>
    <button class="word-link" type="button" data-word="لِيُقضىٰ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="تا به پایان برسد؛ کامل شدنِ سرآمد معین.">لِيُقضىٰ</button>
    <button class="word-link" type="button" data-word="أَجَلٌ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت یا موعد مقرر؛ در سیاق مناسب، پایان آن مدت." data-context="سرآمدی؛ مدتی که باید به پایان برسد.">أَجَلٌ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="معین؛ وصف سرآمدی که حد آن مشخص شده است.">مُسَمًّى</button>
    ۖ
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="مَرجِعُكُم" data-root="ر ج ع" data-learn-more="/quran-terminology/fa/roots/r-j-ayn/" data-root-meaning="بازگشتن، رجوع کردن، برگشتن از مسیر، بازآمدن اثر، و بازگشت به سوی مرجع" data-context="بازگشت شما؛ بازگشت انسان‌ها به سوی خداوند.">مَرجِعُكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُنَبِّئُكُم" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="شما را آگاه می‌کند؛ خبر دادن از آنچه انجام می‌دادید.">يُنَبِّئُكُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ همراه فعل بعد، بیان کردارهایی که پیش‌تر انجام می‌دادید.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دادید؛ کردارهایی که خداوند انسان‌ها را از آنها آگاه می‌کند.">تَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و اوست که شب شما را به‌تمامی می‌گیرد و آنچه را روز به دست آورده‌اید می‌داند؛ سپس شما را در آن برمی‌انگیزد تا سرآمدی معین به پایان برسد. سپس بازگشت شما به سوی اوست؛ آنگاه شما را از آنچه انجام می‌دادید آگاه می‌کند.</p>
</section>
