  <p class="farsi-verse">و کلیدهای غیب نزد اوست؛ جز او کسی آن‌ها را نمی‌داند. و آنچه را در خشکی و دریاست می‌داند؛ و هیچ برگی فرو نمی‌افتد مگر آنکه آن را می‌داند، و هیچ دانه‌ای در تاریکی‌های زمین و هیچ تر و خشکی نیست مگر در کتابی روشن.</p>
