  <p class="farsi-verse">پس هنگامی که آنچه را به آن یادآوری شده بودند فراموش کردند، درهای هر چیزی را بر آنان گشودیم؛ تا وقتی به آنچه داده شده بودند شاد شدند، ناگهان آنان را گرفتیم و همان دم نومید شدند.</p>
