<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۳۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="د ب ب" data-root-meaning="جنبیدن، حرکت کردن و جنبنده؛ از حرکت مورچه و راه رفتن انسان تا گستردگی جانداران، روزی آنان و دو کاربرد متفاوت «دابة الأرض» در قرآن" data-learn-more="/quran-terminology/fa/roots/d-b-b/">دابَّةٍ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="طٰئِرٍ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق.">طٰئِرٍ</button>
    <button class="word-link" type="button" data-word="يَطيرُ" data-root="ط ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-y-r/" data-root-meaning="پرواز و پرنده؛ تطیّر: بدشگونی؛ طائر: نیز سرنوشت یا کارنامه، بنا بر سیاق.">يَطيرُ</button>
    <button class="word-link" type="button" data-word="بِجَناحَيهِ" data-root="ج ن ح" data-root-meaning="بال، پهلو، متمایل شدن و گناه؛ از حرکت پرنده و فروتنی انسان تا «لا جناح» در احکام قرآن و گرایش به صلح" data-learn-more="/quran-terminology/fa/roots/j-n-h/">بِجَناحَيهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أُمَمٌ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أُمَمٌ</button>
    <button class="word-link" type="button" data-word="أَمثالُكُم" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">أَمثالُكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فَرَّطنا" data-root="ف ر ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-tt/" data-root-meaning="پیش افتادن یا از حد گذشتن؛ تفریط: کوتاهی؛ افراط: زیاده‌روی.">فَرَّطنا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="يُحشَرونَ" data-root="ح ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sh-r/" data-root-meaning="گرد آوردن و از جایگاه‌ها به سوی یک محل راندن.">يُحشَرونَ</button>
  </p>
  <p class="farsi-verse">و هیچ جنبنده‌ای در زمین و هیچ پرنده‌ای که با دو بالش پرواز می‌کند نیست مگر جماعت‌هایی مانند شما. هیچ چیزی را در کتاب فرو نگذاشته‌ایم؛ سپس به سوی پروردگارشان گرد آورده می‌شوند.</p>
</section>
