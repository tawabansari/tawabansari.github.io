<section class="ayah-block" id="ayah-135" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُل</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="اعمَلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">اعمَلوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَكانَتِكُم" data-root="م ك ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَكانَتِكُم</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="عامِلٌ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">عامِلٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَسَوفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَسَوفَ</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">تَعلَمونَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="تَكونُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكونُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="الدّارِ" data-root="د و ر" data-learn-more="/quran-terminology/fa/roots/d-w-r/" data-root-meaning="گردش، احاطه، دایره و جای اقامت">الدّارِ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمونَ</button>
  </p>
  <p class="farsi-verse">بگو: ای قوم من، بر جایگاه خود عمل کنید؛ من نیز عمل می‌کنم. پس به‌زودی خواهید دانست سرانجام سرا از آنِ چه کسی خواهد بود؛ بی‌گمان ستمکاران رستگار نمی‌شوند.</p>
</section>
