<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="رَأَيتَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="دیدی؛ مواجهه با کسانی که در آیات خوض می‌کنند.">رَأَيتَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَخوضونَ" data-root="خ و ض" data-root-meaning="وارد شدن و حرکت کردن در میان چیزی؛ و در کاربرد گفتاری، وارد بحث یا گفتگو شدن و درگیر شدن با آن." data-context="در آیات ما به گفتار نکوهیده بپردازند؛ در سیاق تکذیب و بازی گرفتن حقیقت." data-learn-more="/quran-terminology/fa/roots/kh-w-dad/">يَخوضونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات ما؛ نشانه‌هایی که موضوع گفتار نکوهیده قرار گرفته‌اند.">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَأَعرِض" data-root="ع ر ض" data-learn-more="/quran-terminology/fa/roots/ayn-r-dad/" data-root-meaning="عرضه کردن، پیش رو نهادن، در معرض مشاهده یا سنجش قرار دادن؛ پهنا، امر زودگذر، یا روی‌گردانی." data-context="پس روی بگردان؛ دستورِ فاصله گرفتن از این مجلس.">فَأَعرِض</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يَخوضوا" data-root="خ و ض" data-root-meaning="وارد شدن و حرکت کردن در میان چیزی؛ و در کاربرد گفتاری، وارد بحث یا گفتگو شدن و درگیر شدن با آن." data-context="به گفتگویی دیگر بپردازند؛ موضوع سخن خود را تغییر دهند." data-learn-more="/quran-terminology/fa/roots/kh-w-dad/">يَخوضوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="حَديثٍ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/" data-root-meaning="از پدید آمدن تا سخنی که بازگو می‌شود" data-context="سخن و گفتگو؛ موضوعی دیگر پس از پایانِ رفتار مورد نهی.">حَديثٍ</button>
    <button class="word-link" type="button" data-word="غَيرِهِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="غیر آن؛ موضوعی متفاوت از گفتار نکوهیده دربارهٔ آیات.">غَيرِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="يُنسِيَنَّكَ" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="تو را به فراموشی اندازد؛ دربارهٔ فراموش شدن این دستور.">يُنسِيَنَّكَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ عاملِ فراموشیِ مطرح‌شده در شرط جمله.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="تَقعُد" data-root="ق ع د" data-learn-more="/quran-terminology/fa/roots/q-ayn-d/" data-root-meaning="نشستن، بر جای ماندن، جایگاه و پایه استوار" data-context="منشین؛ نهی از ادامهٔ نشستن پس از یادآوری.">تَقعُد</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح" data-context="پس از؛ زمانِ پس از یادآوریِ دستور.">بَعدَ</button>
    <button class="word-link" type="button" data-word="الذِّكرىٰ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یادآوری؛ به یاد آوردنِ نهی از نشستن با آنان.">الذِّكرىٰ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروه و مردم؛ کسانی که در ادامه ستمکار خوانده می‌شوند.">القَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمکاران؛ وصفِ کسانی که گفتار نکوهیده دربارهٔ آیات دارند.">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">و چون کسانی را دیدی که در نشانه‌های ما به سخن بیهوده فرو می‌روند، از آنان روی بگردان تا به سخنی دیگر بپردازند. و اگر شیطان تو را به فراموشی انداخت، پس از به یاد آوردن با گروه ستمکاران منشین.</p>
</section>
