<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو.">قُل</button>
    <button class="word-link" type="button" data-word="أَرَءَيتَكُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="به من بگویید و بیندیشید.">أَرَءَيتَكُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="أَتىٰكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="به شما برسد.">أَتىٰكُم</button>
    <button class="word-link" type="button" data-word="عَذابُ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب خداوند.">عَذابُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="ب غ ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-gh-t/" data-root-meaning="ناگهان و بی‌انتظار فرا رسیدن." data-context="ناگهان و بی‌خبر.">بَغتَةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="جَهرَةً" data-root="ج ه ر" data-learn-more="/quran-terminology/fa/roots/j-h2-r/" data-root-meaning="آشکار و علنی بودن یا ساختن؛ و در گفتار، بلند کردن صدا به‌گونه‌ای که از حالت آهسته و پنهان بیرون آید." data-context="آشکارا.">جَهرَةً</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هَل</button>
    <button class="word-link" type="button" data-word="يُهلَكُ" data-root="ه ل ك" data-root-meaning="از میان رفتن یا پایان یافتن موجودیت، وضعیت یا توان اثرگذاری؛ و در باب افعال، سببِ چنین نابودی‌ای شدن." data-context="هلاک می‌شوند؛ فعل مجهول در پرسش دربارهٔ قوم ستمگر." data-learn-more="/quran-terminology/fa/roots/h2-l-k/">يُهلَكُ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="القَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی؛ و در کاربرد «قوم»، مردم، گروه یا جامعه‌ای با پیوند مشترک." data-context="گروهِ ستمگر.">القَومُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="ستمگران؛ وصفِ قوم.">الظّٰلِمونَ</button>
  </p>
  <p class="farsi-verse">بگو: به من بگویید، اگر عذاب آن معبود یگانه ناگهان یا آشکارا به شما برسد، آیا جز گروه ستمکاران نابود می‌شوند؟</p>
</section>
