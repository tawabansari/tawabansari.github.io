  </p>
  <p class="farsi-verse">و شما را چه شده است که از آنچه نام آن معبود یگانه بر آن یاد شده نمی‌خورید، در حالی که آنچه را بر شما حرام کرده به‌تفصیل برایتان بیان کرده است، مگر آنچه به آن ناچار شوید؟ و بسیاری بی‌هیچ دانشی با خواسته‌های خود گمراه می‌کنند؛ بی‌گمان پروردگارت به تجاوزگران داناتر است.</p>
