<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="يُصرَف" data-root="ص ر ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُصرَف</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="رَحِمَهُ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحِمَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="الفَوزُ" data-root="ف و ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الفَوزُ</button>
    <button class="word-link" type="button" data-word="المُبينُ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">المُبينُ</button>
  </p>
  <p class="farsi-verse">هرکس در آن روز عذاب از او برگردانده شود، بی‌گمان بر او رحمت آورده است؛ و این کامیابی آشکار است.</p>
</section>
