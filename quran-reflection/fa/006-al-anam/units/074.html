  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>

    <button class="word-link" type="button" data-word="إِبرٰهيمُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبرٰهيمُ</button>
    <button class="word-link" type="button" data-word="لِأَبيهِ" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/">لِأَبيهِ</button>

    <button class="word-link" type="button" data-word="أَصنامًا" data-root="ص ن م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَصنامًا</button>

    <button class="word-link" type="button" data-word="أَرىٰكَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/">أَرىٰكَ</button>

    <button class="word-link" type="button" data-word="ضَلٰلٍ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/">ضَلٰلٍ</button>

  <p class="farsi-verse">و هنگامی که ابراهیم به پدرش آزر گفت: آیا بت‌ها را معبود می‌گیری؟ من تو و قومت را در گمراهی آشکار می‌بینم.</p>
