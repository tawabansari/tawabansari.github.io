<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار دادیم؛ برای هر پیامبری دشمنی در میان انسان‌ها و جن قرار دادیم.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="برای هر؛ در اینجا هر پیامبر را دربرمی‌گیرد.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="نَبِىٍّ" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»" data-context="پیامبری؛ دریافت‌کننده و رسانندهٔ پیام الهی.">نَبِىٍّ</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمنی؛ در ادامه با شیاطین انسان و جن توضیح داده می‌شود.">عَدُوًّا</button>
    <button class="word-link" type="button" data-word="شَيٰطينَ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیاطین؛ سرکشانِ گمراه‌کننده از میان انسان‌ها و جن.">شَيٰطينَ</button>
    <button class="word-link" type="button" data-word="الإِنسِ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="انسان‌ها؛ در برابر جن در توصیف دشمنان پیامبران.">الإِنسِ</button>
    <button class="word-link" type="button" data-word="وَالجِنِّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="و جن؛ گروه دیگر در کنار انسان‌ها در این توصیف.">وَالجِنِّ</button>
    <button class="word-link" type="button" data-word="يوحى" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="القا می‌کند؛ برخی به برخی دیگر گفتار آراسته می‌رسانند.">يوحى</button>
    <button class="word-link" type="button" data-word="بَعضُهُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی از آنان؛ گروهی از همان دشمنان.">بَعضُهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی دیگر؛ دریافت‌کنندگان آن گفتار در میان آنان.">بَعضٍ</button>
    <button class="word-link" type="button" data-word="زُخرُفَ" data-root="ز خ ر ف" data-root-meaning="زر، زینت و آراستگیِ چشمگیر؛ نقش‌ونگار و جلوه‌ای که چیزی را زیبا و جلب‌توجه‌کننده می‌سازد." data-context="آرایش سخن؛ گفتار آراسته‌ای که در سیاق آیه برای فریب به کار می‌رود." data-learn-more="/quran-terminology/fa/roots/z-kh-r-f/">زُخرُفَ</button>
    <button class="word-link" type="button" data-word="القَولِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="سخن؛ گفتاری که آرایش یافته و وسیلهٔ فریب شده است.">القَولِ</button>
    <button class="word-link" type="button" data-word="غُرورًا" data-root="غ ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-r-r/" data-root-meaning="فریب و دل بستن به نمود گمراه‌کننده." data-context="برای فریب؛ هدف یا نتیجهٔ فریبندهٔ آن گفتار آراسته.">غُرورًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="می‌خواست؛ در ساخت شرطی دربارهٔ خواست پروردگار.">شاءَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارت؛ خطاب به پیامبر در بیان مشیت الهی.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فَعَلوهُ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="آن را انجام می‌دادند؛ اشاره به همان رفتارِ القای فریبنده.">فَعَلوهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذَرهُم" data-root="و ذ ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-dh-r/" data-root-meaning="واگذاشتن و رها کردن." data-context="پس آنان را واگذار؛ فرمان به پیامبر دربارهٔ این دشمنان.">فَذَرهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="ف ر ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-y/" data-root-meaning="بریدن و ساختن؛ افترا: ساختن سخن دروغ و نسبت ناروا." data-context="به دروغ می‌سازند؛ افتراها و ساخته‌های ناراست آنان.">يَفتَرونَ</button>
  </p>
  <p class="farsi-verse">و این‌گونه برای هر پیامبری دشمنی قرار دادیم: شیطان‌های انس و جن، که برخی به برخی دیگر سخن آراسته را برای فریب القا می‌کنند. و اگر پروردگارت می‌خواست، آن را انجام نمی‌دادند؛ پس آنان و آنچه به دروغ می‌سازند واگذار.</p>
</section>
