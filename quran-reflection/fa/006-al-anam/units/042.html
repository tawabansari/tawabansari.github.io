<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۴۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادیم؛ فرستادن پیام‌آوران به جماعت‌های پیشین در سیاق آیه">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أُمَمٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="جماعت‌ها و امت‌هایی پیش از مخاطب">أُمَمٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از تو؛ زمان امت‌های پیشین">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُم" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="پس آنان را گرفتیم و گرفتار کردیم">فَأَخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="بِالبَأساءِ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار" data-context="به سختی و تنگنای زندگی">بِالبَأساءِ</button>
    <button class="word-link" type="button" data-word="وَالضَّرّاءِ" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری" data-context="و رنج و آسیب؛ در کنار سختیِ یادشده">وَالضَّرّاءِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَضَرَّعونَ" data-root="ض ر ع" data-learn-more="/quran-terminology/fa/roots/dad-r-ayn/" data-root-meaning="نرمی، فروتنی و اظهار نیاز؛ در کاربرد انسانی، زاری و روی آوردنِ فروتنانه. در کاربردهای دیگر، پستان شیرده دام، همانندی، و نام گیاهی ناخوشایند به نام ضریع." data-context="زاری کنند و با فروتنی و احساس نیاز به پروردگار روی آورند">يَتَضَرَّعونَ</button>
  </p>
  <p class="farsi-verse">و به سوی جماعت‌هایی پیش از تو فرستادیم؛ پس آنان را به سختی و رنج گرفتار کردیم، باشد که زاری کنند.</p>
</section>
