    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/">الأَنعٰمِ</button>

  <p class="farsi-verse">و از چهارپایان، باربران و کوچک‌اندامان را. از آنچه آن معبود یگانه روزی شما کرده بخورید و از گام‌های شیطان پیروی نکنید؛ بی‌گمان او برای شما دشمنی آشکار است.</p>
