  <p class="farsi-verse">آیا جز این انتظار دارند که فرشتگان نزدشان بیایند یا پروردگارت بیاید یا برخی از نشانه‌های پروردگارت بیاید؟ روزی که برخی از نشانه‌های پروردگارت بیاید، ایمان هیچ نفسی که پیش‌تر ایمان نیاورده یا در ایمانش خیری به دست نیاورده است به او سود نمی‌رساند. بگو: منتظر باشید، ما نیز منتظریم.</p>
