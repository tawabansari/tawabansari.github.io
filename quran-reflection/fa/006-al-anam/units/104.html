<section class="ayah-block" id="ayah-104" data-translation-status="provisional">
  <h2 class="ayah-title">الانعام ۶:۱۰۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">قَد</button>
    <button class="word-link" type="button" data-word="جاءَكُم" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="به شما رسیده است؛ دربارهٔ بصیرت‌ها.">جاءَكُم</button>
    <button class="word-link" type="button" data-word="بَصائِرُ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بصیرت‌ها؛ نشانه‌ها و روشنگری‌های راهنما.">بَصائِرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارتان؛ سرچشمهٔ بصیرت‌ها.">رَبِّكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="أَبصَرَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن" data-context="بینش یافت؛ حقیقت را دید.">أَبصَرَ</button>
    <button class="word-link" type="button" data-word="فَلِنَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="پس به سودِ خودش.">فَلِنَفسِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="عَمِىَ" data-root="ع م ي" data-learn-more="/quran-terminology/fa/roots/ayn-m-y/" data-root-meaning="کوری، نادیدن، پوشیده شدن راه دیدن، ابهام، و از دست رفتن توان مشاهده یا تشخیص" data-context="نابینا ماند؛ از شناختِ حقیقت بازماند.">عَمِىَ</button>
    <button class="word-link" type="button" data-word="فَعَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَعَلَيها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنا۠</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="بِحَفيظٍ" data-root="ح ف ظ" data-root-meaning="نگه داشتن و مراقبت کردن از چیزی تا ضایع، فراموش، رها یا تباه نشود." data-context="نگهدارنده و مراقب بر شما؛ مسئولیتی که در این جمله نفی می‌شود." data-learn-more="/quran-terminology/fa/roots/h-f-zha/">بِحَفيظٍ</button>
  </p>
  <p class="farsi-verse">بینش‌هایی از پروردگارتان به شما رسیده است؛ پس هرکس ببیند به سود خودش است، و هرکس کور بماند به زیان خودش؛ و من نگهبان شما نیستم.</p>
</section>
