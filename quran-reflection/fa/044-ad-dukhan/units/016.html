<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روزی که برخوردِ قهرآمیزِ بزرگ رخ می‌دهد.">يَومَ</button>
    <button class="word-link" type="button" data-word="نَبطِشُ" data-root="ب ط ش" data-root-meaning="گرفتن یا برخورد کردن با قدرت، شدت و غلبه؛ و در کاربردهای گسترده‌تر، توانِ اعمال قهر و چیرگی." data-context="با قدرت و قهر فراگیریم؛ فعلِ برخوردِ بزرگِ الهی." data-learn-more="/quran-terminology/fa/roots/b-tt-sh/">نَبطِشُ</button>
    <button class="word-link" type="button" data-word="البَطشَةَ" data-root="ب ط ش" data-root-meaning="گرفتن یا برخورد کردن با قدرت، شدت و غلبه؛ و در کاربردهای گسترده‌تر، توانِ اعمال قهر و چیرگی." data-context="برخورد و فراگرفتنِ قهرآمیز که با «کبری» توصیف شده است." data-learn-more="/quran-terminology/fa/roots/b-tt-sh/">البَطشَةَ</button>
    <button class="word-link" type="button" data-word="الكُبرىٰ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار" data-context="بزرگ و عظیم؛ وصفِ «البطشة».">الكُبرىٰ</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="مُنتَقِمونَ" data-root="ن ق م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-q-m/" data-root-meaning="ناپسند داشتن و مؤاخذه؛ انتقام: کیفر دادن در پاسخ به کردار." data-context="بازخواست‌کنندگان و انتقام‌گیرندگان؛ وصفِ گویندهٔ الهی.">مُنتَقِمونَ</button>
  </p>
  <p class="farsi-verse">روزی که با آن گرفتنِ بزرگ بگیریم، ما انتقام‌گیرنده‌ایم.</p>
</section>
