<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۱۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="نَبطِشُ" data-root="ب ط ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نَبطِشُ</button>
    <button class="word-link" type="button" data-word="البَطشَةَ" data-root="ب ط ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">البَطشَةَ</button>
    <button class="word-link" type="button" data-word="الكُبرىٰ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">الكُبرىٰ</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="مُنتَقِمونَ" data-root="ن ق م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُنتَقِمونَ</button>
  </p>
  <p class="farsi-verse">روزی که با آن گرفتنِ بزرگ بگیریم، ما انتقام‌گیرنده‌ایم.</p>
