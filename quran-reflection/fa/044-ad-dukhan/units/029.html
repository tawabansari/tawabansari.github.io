<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="بَكَت" data-root="ب ك ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-k-y/" data-root-meaning="گریستن و اشک ریختن؛ أبكى: به گریه انداختن.">بَكَت</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="السَّماءُ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءُ</button>
    <button class="word-link" type="button" data-word="وَالأَرضُ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضُ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="مُنظَرينَ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">مُنظَرينَ</button>
  </p>
  <p class="farsi-verse">پس نه آسمان بر آنان گریست و نه زمین، و مهلت داده نشدند.</p>
</section>
