<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خُذوهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">خُذوهُ</button>
    <button class="word-link" type="button" data-word="فَاعتِلوهُ" data-root="ع ت ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَاعتِلوهُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="سَواءِ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">سَواءِ</button>
    <button class="word-link" type="button" data-word="الجَحيمِ" data-root="ج ح م" data-learn-more="/quran-terminology/fa/roots/j-h-m/" data-root-meaning="از شدت حرارت و افروختگی تا «جحیم»">الجَحيمِ</button>
  </p>
  <p class="farsi-verse">او را بگیرید و به میان آتش سوزان بکشید.</p>
</section>
