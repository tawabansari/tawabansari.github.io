<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَدَعا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">فَدَعا</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/">قَومٌ</button>
    <button class="word-link" type="button" data-word="مُجرِمونَ" data-root="ج ر م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُجرِمونَ</button>
  </p>
  <p class="farsi-verse">پس پروردگارش را خواند که اینان قومی مجرم‌اند.</p>
