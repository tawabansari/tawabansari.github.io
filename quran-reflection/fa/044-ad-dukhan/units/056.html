<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَذوقونَ" data-root="ذ و ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَذوقونَ</button>
    <button class="word-link" type="button" data-word="فيهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهَا</button>
    <button class="word-link" type="button" data-word="المَوتَ" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند">المَوتَ</button>

  <p class="farsi-verse">در آن جز مرگ نخست، مرگ را نمی‌چشند؛ و آنان را از عذاب آتش سوزان نگاه داشت،</p>
