<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۵۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَارتَقِب" data-root="ر ق ب" data-root-meaning="زیر نظر داشتن، مراقبت، انتظار و رعایت؛ رقبة: گردن و به کنایه، تمام شخص یا انسان در بند." data-context="پس چشم‌به‌راه باش؛ خطاب به پیامبر در برابر انتظار مخالفان، با توجه به فرجام رویارویی." data-learn-more="/quran-terminology/fa/roots/r-q-b/">فَارتَقِب</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="مُرتَقِبونَ" data-root="ر ق ب" data-root-meaning="زیر نظر داشتن، مراقبت، انتظار و رعایت؛ رقبة: گردن و به کنایه، تمام شخص یا انسان در بند." data-context="چشم‌به‌راه‌اند؛ اسم فاعل جمع برای مخالفان. خود واژه آنچه انتظار می‌کشند را مشخص نمی‌کند." data-learn-more="/quran-terminology/fa/roots/r-q-b/">مُرتَقِبونَ</button>
  </p>
  <p class="farsi-verse">پس منتظر باش؛ آنان نیز منتظرند.</p>
</section>
