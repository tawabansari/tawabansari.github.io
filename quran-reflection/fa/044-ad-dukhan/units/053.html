<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَلبَسونَ" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن">يَلبَسونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سُندُسٍ" data-context="سندس: ابریشم نازک." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">سُندُسٍ</button>
    <button class="word-link" type="button" data-word="وَإِستَبرَقٍ" data-context="استبرق: دیبای ضخیم." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">وَإِستَبرَقٍ</button>
    <button class="word-link" type="button" data-word="مُتَقٰبِلينَ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">مُتَقٰبِلينَ</button>
  </p>
  <p class="farsi-verse">از ابریشم نازک و دیبای ضخیم می‌پوشند و روبه‌روی هم‌اند.</p>
</section>
