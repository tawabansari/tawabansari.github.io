<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَضلًا" data-root="ف ض ل" data-learn-more="/quran-terminology/fa/roots/f-dad-l/" data-root-meaning="افزونی، عطای اضافه و بهره‌ای فراتر از اندازه پایه یا طرف مقایسه‌شده.">فَضلًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الفَوزُ" data-root="ف و ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الفَوزُ</button>
    <button class="word-link" type="button" data-word="العَظيمُ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">العَظيمُ</button>
  </p>
  <p class="farsi-verse">بخششی از پروردگارت؛ این همان کامیابی بزرگ است.</p>
</section>
