<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">يَدعونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="فٰكِهَةٍ" data-root="ف ك ه" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فٰكِهَةٍ</button>
    <button class="word-link" type="button" data-word="ءامِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامِنينَ</button>
  </p>
  <p class="farsi-verse">در آن با آسودگی هرگونه میوه‌ای می‌طلبند.</p>
</section>
