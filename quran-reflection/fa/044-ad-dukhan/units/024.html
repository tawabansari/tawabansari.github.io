<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاترُكِ" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی">وَاترُكِ</button>
    <button class="word-link" type="button" data-word="البَحرَ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان">البَحرَ</button>
    <button class="word-link" type="button" data-word="رَهوًا" data-root="ر ه و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-h2-w/" data-root-meaning="آرام و گشوده بودن؛ رهو در وصف دریا: آرام یا راه‌گشوده، بنا بر تفسیر.">رَهوًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="جُندٌ" data-root="ج ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-d/" data-root-meaning="جند و جنود: سپاه، نیروها و گروه‌های سازمان‌یافتهٔ پشتیبان.">جُندٌ</button>
    <button class="word-link" type="button" data-word="مُغرَقونَ" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب">مُغرَقونَ</button>
  </p>
  <p class="farsi-verse">و دریا را آرام رها کن؛ آنان سپاهی غرق‌شدنی‌اند.</p>
</section>
