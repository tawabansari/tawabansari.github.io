<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَهُم</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومُ</button>
    <button class="word-link" type="button" data-word="تُبَّعٍ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">تُبَّعٍ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="أَهلَكنٰهُم" data-root="ه ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-l-k/" data-root-meaning="از میان رفتن و نابود کردن؛ نیز از دست رفتن، بنا بر سیاق.">أَهلَكنٰهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="ج ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-r-m/" data-root-meaning="بریدن و به دست آوردن؛ إجرام: مرتکب شدن جرم یا گناه؛ «لا جرم» ساختی برای تأکید و قطعیت است.">مُجرِمينَ</button>
  </p>
  <p class="farsi-verse">آیا آنان بهترند یا قوم تُبّع و کسانی که پیش از آنان بودند؟ آنان را هلاک کردیم؛ بی‌گمان مجرم بودند.</p>
</section>
