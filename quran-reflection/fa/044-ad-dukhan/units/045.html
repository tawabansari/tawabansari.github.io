<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَالمُهلِ" data-root="م ه ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-h2-l/" data-root-meaning="آرامی و مهلت دادن؛ مُهل: ماده گداخته یا روغن‌مانند، بنا بر شرح لغوی." data-context="مانند مُهل؛ تصویر مایعِ گداخته یا غلیظ در وصفِ خوراک زقوم">كَالمُهلِ</button>
    <button class="word-link" type="button" data-word="يَغلى" data-root="غ ل ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-y/" data-root-meaning="جوشیدن و به جوش آمدن." data-context="می‌جوشد؛ خوراکِ توصیف‌شده در شکم‌ها">يَغلى</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="البُطونِ" data-root="ب ط ن" data-root-meaning="درون و سوی داخلی چیزی در برابر بیرون و رویهٔ آن؛ و در کاربردهای گسترده‌تر، جنبهٔ نهفته، کمتر آشکار یا در دسترس نزدیکان و آگاهان از یک امر." data-context="شکم‌ها؛ جای جوشیدنِ خوراک در تصویر عذاب" data-learn-more="/quran-terminology/fa/roots/b-tt-n/">البُطونِ</button>
  </p>
  <p class="farsi-verse">همچون فلز گداخته، در شکم‌ها می‌جوشد،</p>
</section>
