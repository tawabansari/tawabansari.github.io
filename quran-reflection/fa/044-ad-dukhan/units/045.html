<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَالمُهلِ" data-root="م ه ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-h2-l/" data-root-meaning="آرامی و مهلت دادن؛ مُهل: ماده گداخته یا روغن‌مانند، بنا بر شرح لغوی.">كَالمُهلِ</button>
    <button class="word-link" type="button" data-word="يَغلى" data-root="غ ل ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-y/" data-root-meaning="جوشیدن و به جوش آمدن.">يَغلى</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="البُطونِ" data-root="ب ط ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-tt-n/" data-root-meaning="شکم، درون و بخش نهان؛ باطن در برابر ظاهر است و بطانه به لایهٔ درونی یا نزدیکان گفته می‌شود.">البُطونِ</button>
  </p>
  <p class="farsi-verse">همچون فلز گداخته، در شکم‌ها می‌جوشد،</p>
</section>
