<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَعمَةٍ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">وَنَعمَةٍ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="فٰكِهينَ" data-root="ف ك ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-h2/" data-root-meaning="میوه؛ فاکه: شادمان و برخوردار؛ تفکّه: خوشی یا شگفتی و گفت‌وگو، بنا بر سیاق.">فٰكِهينَ</button>
  </p>
  <p class="farsi-verse">و نعمتی که در آن شادمان بودند.</p>
</section>
