<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">الدخان ۴۴:۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="صُبّوا" data-root="ص ب ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-b/" data-root-meaning="ریختن و سرازیر کردن." data-context="بریزید؛ فرمانِ ریختنِ مایع سوزان.">صُبّوا</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="ف و ق" data-learn-more="/quran-terminology/fa/roots/f-w-q/" data-root-meaning="بالا بودن نسبت به مرجع، فراز، چیرگی، رتبه، افزونی عددی، و فراتر بودن از نمونه یا حد" data-context="بالای؛ جهتِ ریختن نسبت به سر.">فَوقَ</button>
    <button class="word-link" type="button" data-word="رَأسِهِ" data-root="ر أ س" data-root-meaning="سر؛ و در گسترش معنا، بخش بالایی، آغازین یا اصلی چیزی؛ رأس المال: اصل دارایی." data-context="سر او؛ مایع سوزان بر بالای آن ریخته می‌شود." data-learn-more="/quran-terminology/fa/roots/r-a-s/">رَأسِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عَذابِ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ کیفرِ توصیف‌شده با مایع سوزان.">عَذابِ</button>
    <button class="word-link" type="button" data-word="الحَميمِ" data-root="ح م م" data-root-meaning="در شاخهٔ حرارت، آب گرم و بسیار داغ؛ در شاخهٔ نزدیکی، دوست یا خویشاوند صمیمی؛ و در شاخهٔ تیرگی، زغال و دود بسیار سیاه." data-context="مایع بسیار داغ و سوزان؛ متعلقِ فرمانِ ریختن." data-learn-more="/quran-terminology/fa/roots/h-m-m/">الحَميمِ</button>
  </p>
  <p class="farsi-verse">سپس بر سرش از عذاب آب سوزان بریزید.</p>
</section>
