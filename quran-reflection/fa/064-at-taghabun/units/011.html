<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">التغابن ۶۴:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَصابَ" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">أَصابَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="مُصيبَةٍ" data-root="ص و ب" data-learn-more="/quran-terminology/fa/roots/sad-w-b/" data-root-meaning="فرود آمدن، فرو ریختن، رسیدن، اصابت کردن، و برخورد چیزی با هدف یا محل خود">مُصيبَةٍ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِإِذنِ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/">بِإِذنِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُؤمِن" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">يُؤمِن</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="يَهدِ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">يَهدِ</button>

    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">عَليمٌ</button>
  </p>
  <p class="farsi-verse">هیچ مصیبتی جز به اذن آن معبود یگانه نمی‌رسد. و هر که به آن معبود یگانه ایمان آورد، دلش را هدایت می‌کند؛ و آن معبود یگانه به هر چیزی داناست.</p>
