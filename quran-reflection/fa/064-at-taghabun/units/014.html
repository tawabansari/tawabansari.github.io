<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">التغابن ۶۴:۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَزوٰجِكُم" data-root="ز و ج" data-learn-more="/quran-terminology/fa/roots/z-w-j/" data-root-meaning="جفت، قرین، هم‌ساخت، مکمل، و نسبت دوگانه یا هم‌پیوند">أَزوٰجِكُم</button>
    <button class="word-link" type="button" data-word="وَأَولٰدِكُم" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">وَأَولٰدِكُم</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">عَدُوًّا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="فَاحذَروهُم" data-root="ح ذ ر" data-learn-more="/quran-terminology/fa/roots/h-dh-r/" data-root-meaning="احتیاط، پرهیز، بیداری در برابر خطر، ترس آگاهانه از آسیب، و مراقبت عملی پیش از وقوع ضرر">فَاحذَروهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَعفوا" data-root="ع ف و" data-learn-more="/quran-terminology/fa/roots/ayn-f-w/" data-root-meaning="گذشتن از پیگیری خطا، برداشتن مؤاخذه، محوشدن اثر، و آنچه افزون بر نیاز باقی می‌ماند">تَعفوا</button>
    <button class="word-link" type="button" data-word="وَتَصفَحوا" data-root="ص ف ح" data-learn-more="/quran-terminology/fa/roots/sad-f-h/" data-root-meaning="صَفَحَ؛ روی و جانب گرداندن و از چیزی درگذشتن">وَتَصفَحوا</button>
    <button class="word-link" type="button" data-word="وَتَغفِروا" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">وَتَغفِروا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">رَحيمٌ</button>
  </p>
  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، برخی از همسران و فرزندانتان دشمن شما هستند؛ پس از آنان برحذر باشید. و اگر عفو کنید و چشم بپوشید و بیامرزید، همانا آن معبود یگانه آمرزنده و مهربان است.</p>
</section>
