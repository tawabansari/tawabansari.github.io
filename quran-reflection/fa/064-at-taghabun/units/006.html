  <h2 class="ayah-title">التغابن ۶۴:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَت</button>

    <button class="word-link" type="button" data-word="بِالبَيِّنٰتِ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/">بِالبَيِّنٰتِ</button>
    <button class="word-link" type="button" data-word="فَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">فَقالوا</button>
    <button class="word-link" type="button" data-word="أَبَشَرٌ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/">أَبَشَرٌ</button>
    <button class="word-link" type="button" data-word="يَهدونَنا" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">يَهدونَنا</button>
    <button class="word-link" type="button" data-word="فَكَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/">فَكَفَروا</button>

    ۚ
    <button class="word-link" type="button" data-word="وَاستَغنَى" data-root="غ ن ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَاستَغنَى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    ۚ

    <button class="word-link" type="button" data-word="غَنِىٌّ" data-root="غ ن ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غَنِىٌّ</button>
    <button class="word-link" type="button" data-word="حَميدٌ" data-root="ح م د" data-learn-more="/quran-terminology/fa/roots/h-m-d/">حَميدٌ</button>
  </p>
  <p class="farsi-verse">این از آن روست که فرستادگانشان با نشانه‌های روشن نزدشان می‌آمدند، ولی گفتند: «آیا آدمیان ما را هدایت می‌کنند؟» پس کفر ورزیدند و روی گرداندند؛ و آن معبود یگانه بی‌نیاز بود. و آن معبود یگانه بی‌نیاز و ستوده است.</p>
