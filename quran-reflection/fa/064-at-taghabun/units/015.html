<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">التغابن ۶۴:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أَموٰلُكُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">أَموٰلُكُم</button>
    <button class="word-link" type="button" data-word="وَأَولٰدُكُم" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">وَأَولٰدُكُم</button>
    <button class="word-link" type="button" data-word="فِتنَةٌ" data-root="ف ت ن" data-learn-more="/quran-terminology/fa/roots/f-t-n/" data-root-meaning="فَتَنَ؛ آزمون، فشار و در معرض تغییر جهت قرار گرفتن">فِتنَةٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عِندَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَهُ</button>
    <button class="word-link" type="button" data-word="أَجرٌ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">عَظيمٌ</button>
  </p>
  <p class="farsi-verse">دارایی‌ها و فرزندانتان تنها آزمونی هستند؛ و نزد آن معبود یگانه پاداشی بزرگ است.</p>
</section>
