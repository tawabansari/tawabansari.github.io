<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">التغابن ۶۴:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَصَوَّرَكُم" data-root="ص و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَصَوَّرَكُم</button>
    <button class="word-link" type="button" data-word="فَأَحسَنَ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/">فَأَحسَنَ</button>
    <button class="word-link" type="button" data-word="صُوَرَكُم" data-root="ص و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صُوَرَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="ص ي ر" data-learn-more="/quran-terminology/fa/roots/sad-y-r/">المَصيرُ</button>
  </p>
  <p class="farsi-verse">آسمان‌ها و زمین را به حق آفرید و شما را صورت بخشید و صورت‌هایتان را نیکو ساخت؛ و بازگشت به سوی اوست.</p>
