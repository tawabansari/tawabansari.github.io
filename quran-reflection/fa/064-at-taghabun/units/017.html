<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">التغابن ۶۴:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="تُقرِضُوا" data-root="ق ر ض" data-learn-more="/quran-terminology/fa/roots/q-r-dad/" data-root-meaning="بریدن بخشی از مال، جدا کردن و دادن آن با انتظار بازگشت یا پاداش، قرض دادن، و واگذاری موقت چیزی از دارایی">تُقرِضُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قَرضًا" data-root="ق ر ض" data-learn-more="/quran-terminology/fa/roots/q-r-dad/" data-root-meaning="بریدن بخشی از مال، جدا کردن و دادن آن با انتظار بازگشت یا پاداش، قرض دادن، و واگذاری موقت چیزی از دارایی">قَرضًا</button>
    <button class="word-link" type="button" data-word="حَسَنًا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">حَسَنًا</button>
    <button class="word-link" type="button" data-word="يُضٰعِفهُ" data-root="ض ع ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يُضٰعِفهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَيَغفِر" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">وَيَغفِر</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="شَكورٌ" data-root="ش ك ر" data-learn-more="/quran-terminology/fa/roots/sh-k-r/" data-root-meaning="شناختن عطا، نادیده‌نگرفتن آن، و نشان‌دادن پاسخی متناسب در آگاهی، سخن و عمل">شَكورٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="ح ل م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حَليمٌ</button>
  </p>
  <p class="farsi-verse">اگر به آن معبود یگانه وامی نیکو دهید، آن را برایتان چند برابر می‌کند و شما را می‌آمرزد؛ و آن معبود یگانه سپاسگزار و بردبار است.</p>
</section>
