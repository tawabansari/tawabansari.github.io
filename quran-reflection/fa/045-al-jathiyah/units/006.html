<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">تِلكَ</button>
    <button class="word-link" type="button" data-word="ءايٰتُ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="نَتلوها" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر">نَتلوها</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبِأَىِّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَبِأَىِّ</button>
    <button class="word-link" type="button" data-word="حَديثٍ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/" data-root-meaning="از پدید آمدن تا سخنی که بازگو می‌شود">حَديثٍ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَءايٰتِهِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">وَءايٰتِهِ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">يُؤمِنونَ</button>
  </p>
  <p class="farsi-verse">اینها نشانه‌های آن معبود یگانه است که به حق بر تو می‌خوانیم؛ پس بعد از آن معبود یگانه و نشانه‌هایش، به کدام سخن ایمان می‌آورند؟</p>
</section>
