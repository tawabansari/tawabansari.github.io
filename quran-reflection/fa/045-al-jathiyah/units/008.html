  <p class="farsi-verse">که نشانه‌های آن معبود یگانه را می‌شنود که بر او خوانده می‌شود، سپس با تکبر پافشاری می‌کند، گویی آنها را نشنیده است؛ پس او را به عذابی دردناک مژده بده.</p>
