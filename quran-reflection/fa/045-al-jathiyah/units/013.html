<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۱۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسَخَّرَ" data-root="س خ ر" data-root-meaning="ریشخند کردن، خوار شمردن و به خدمت گرفتن؛ از تحقیر انسان تا تسخیر نیروهای طبیعت، روابط اجتماعی و تفاوت «سِخْرِيّ» با «سُخْرِيّ» در قرآن" data-learn-more="/quran-terminology/fa/roots/s-kh-r/">وَسَخَّرَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">جَميعًا</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="ف ك ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-k-r/" data-root-meaning="اندیشه و به کار گرفتن فکر برای شناخت.">يَتَفَكَّرونَ</button>
  </p>
  <p class="farsi-verse">و آنچه را در آسمان‌ها و آنچه را در زمین است، همه را از سوی خود رام شما کرد؛ بی‌گمان در این نشانه‌هایی برای مردمی است که می‌اندیشند.</p>
</section>
