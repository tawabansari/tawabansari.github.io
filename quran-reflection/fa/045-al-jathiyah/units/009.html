<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="عَلِمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">عَلِمَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="اتَّخَذَها" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/">اتَّخَذَها</button>
    <button class="word-link" type="button" data-word="هُزُوًا" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/">هُزُوًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/">عَذابٌ</button>
    <button class="word-link" type="button" data-word="مُهينٌ" data-root="ه و ن" data-learn-more="/quran-terminology/fa/roots/h2-w-n/">مُهينٌ</button>
  </p>
  <p class="farsi-verse">و چون چیزی از نشانه‌های ما بداند، آنها را به مسخره می‌گیرد؛ برای آنان عذابی خوارکننده است.</p>
