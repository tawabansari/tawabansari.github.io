<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="حَسِبَ" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/" data-context="پنداشتند؛ گمانی که آیه آن را دربارهٔ یکسان قرار دادن دو گروه به پرسش می‌گیرد.">حَسِبَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اجتَرَحُوا" data-root="ج ر ح" data-root-meaning="زخمی کردن و ایجاد اثر بر بدن؛ و در شاخه‌ای دیگر، کسب کردن و انجام دادن عمل." data-context="مرتکب شدند؛ با مفعول «بدی‌ها»، کسانی که کردارهای ناپسند را انجام دادند." data-learn-more="/quran-terminology/fa/roots/j-r-h/">اجتَرَحُوا</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌ها؛ کردارهای ناپسند که مفعول «اجترحوا» هستند.">السَّيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="نَجعَلَهُم" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="آنان را قرار دهیم؛ یکسان قرار دادن گروه نخست با مؤمنانِ شایسته‌کار.">نَجعَلَهُم</button>
    <button class="word-link" type="button" data-word="كَالَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان آوردند؛ وصف گروه دوم در برابر مرتکبان بدی‌ها.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="و انجام دادند؛ کردارهای شایستهٔ گروه دوم.">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="کارهای شایسته؛ اعمالی که گروه ایمان‌آورده انجام دادند.">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="سَواءً" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="یکسان؛ برابریِ زندگی و مرگ که آیه آن را در این داوری به پرسش می‌گیرد.">سَواءً</button>
    <button class="word-link" type="button" data-word="مَحياهُم" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی‌شان؛ یکی از دو جنبهٔ مقایسه در کنار مرگشان.">مَحياهُم</button>
    <button class="word-link" type="button" data-word="وَمَماتُهُم" data-root="م و ت" data-learn-more="/quran-terminology/fa/roots/m-w-t/" data-root-meaning="موت، خاموشی یا توقف فعلیت حیات، خروج از حالت زندگی دنیوی، و انتقال موجود از وضعیت زنده و فعال به حالتی که حیات شناخته‌شده در آن کار نمی‌کند" data-context="و مرگشان؛ جنبهٔ دیگر مقایسه در کنار زندگی‌شان.">وَمَماتُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="ساءَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بد است؛ نکوهش داوری‌ای که در ادامه بیان می‌شود.">ساءَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَحكُمونَ" data-root="ح ك م" data-learn-more="/quran-terminology/fa/roots/h-k-m/" data-root-meaning="مهار کردن، استوار ساختن، بازداشتن از اختلال و قرار دادن هر چیز در جای درست" data-context="داوری می‌کنند؛ قضاوت دربارهٔ یکسان قرار دادن دو گروه.">يَحكُمونَ</button>
  </p>
  <p class="farsi-verse">آیا کسانی که بدی‌ها را مرتکب شدند پنداشتند آنان را همچون کسانی قرار می‌دهیم که ایمان آورده و کارهای شایسته کرده‌اند، زندگی و مرگشان یکسان باشد؟ چه بد داوری می‌کنند.</p>
</section>
