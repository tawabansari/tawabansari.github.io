<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">كَفَروا</button>
    <button class="word-link" type="button" data-word="أَفَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلَم</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكُن</button>
    <button class="word-link" type="button" data-word="ءايٰتى" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتى</button>
    <button class="word-link" type="button" data-word="تُتلىٰ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر">تُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="فَاستَكبَرتُم" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">فَاستَكبَرتُم</button>
    <button class="word-link" type="button" data-word="وَكُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكُنتُم</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومًا</button>
    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="ج ر م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-r-m/" data-root-meaning="بریدن و به دست آوردن؛ إجرام: مرتکب شدن جرم یا گناه؛ «لا جرم» ساختی برای تأکید و قطعیت است.">مُجرِمينَ</button>
  </p>
  <p class="farsi-verse">و اما کسانی که کفر ورزیدند: آیا نشانه‌های من بر شما خوانده نمی‌شد، پس تکبر ورزیدید و مردمی مجرم بودید؟</p>
</section>
