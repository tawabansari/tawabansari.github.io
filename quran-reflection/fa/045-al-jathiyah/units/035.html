  <p class="farsi-verse">این از آن روست که نشانه‌های آن معبود یگانه را به مسخره گرفتید و زندگی دنیا شما را فریفت؛ پس امروز از آن بیرون آورده نمی‌شوند و از آنان جبران خواسته نمی‌شود.</p>
