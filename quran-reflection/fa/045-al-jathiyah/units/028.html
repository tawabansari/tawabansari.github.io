<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرىٰ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و می‌بینی؛ مشاهده هر امت در حالت زانوزده.">وَتَرىٰ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ شامل همه امت‌ها در صحنه توصیف‌شده.">كُلَّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="امت؛ جماعتی که زانوزده دیده می‌شود.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="جاثِيَةً" data-root="ج ث و" data-root-meaning="بر زانو قرار گرفتن؛ حالتی که زانوها تکیه‌گاه بدن می‌شوند." data-context="زانوزده؛ وصف حالت هر امت هنگام فراخوانده شدن به سوی کتابش." data-learn-more="/quran-terminology/fa/roots/j-th-w/">جاثِيَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ فراخوانده شدن تک‌تک امت‌ها را فراگیر می‌سازد.">كُلُّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد" data-context="امت؛ جماعتی که به سوی کتاب خود فراخوانده می‌شود.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="تُدعىٰ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="فراخوانده می‌شود؛ هر امت به سوی کتاب خود.">تُدعىٰ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="كِتٰبِهَا" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی" data-context="کتابش؛ ثبت اعمال همان امت که به سوی آن فراخوانده می‌شود.">كِتٰبِهَا</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="امروز؛ روز داوری و جزای اعمال در این صحنه.">اليَومَ</button>
    <button class="word-link" type="button" data-word="تُجزَونَ" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب" data-context="جزا داده می‌شوید؛ پاسخ اعمال گذشته خود را دریافت می‌کنید.">تُجزَونَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ همراه فعل پس از خود، انجام دادن اعمال در گذشته را بیان می‌کند.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام می‌دادید؛ اعمالی که اکنون جزای آنها داده می‌شود.">تَعمَلونَ</button>
  </p>
  <p class="farsi-verse">و هر امتی را زانو زده می‌بینی؛ هر امتی به سوی کتاب خود فراخوانده می‌شود: امروز آنچه را انجام می‌دادید جزا داده می‌شوید.</p>
</section>
