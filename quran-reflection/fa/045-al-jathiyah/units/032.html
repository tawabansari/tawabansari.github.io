  <p class="farsi-verse">و چون گفته می‌شد: وعدهٔ آن معبود یگانه حق است و در ساعت شکی نیست، می‌گفتید: نمی‌دانیم ساعت چیست؛ جز گمانی نمی‌بریم و یقین نداریم.</p>
