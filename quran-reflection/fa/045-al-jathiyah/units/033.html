<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَدا" data-root="ب د و" data-learn-more="/quran-terminology/fa/roots/b-d-w/" data-root-meaning="آشکار شدن، پدیدار گشتن از پس پوشیدگی، و ورود چیزی به میدان دید یا آگاهی" data-context="و آشکار شد؛ دربارهٔ بدی‌های کردارشان.">وَبَدا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتُ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه" data-context="بدی‌ها؛ در پیوند با آنچه انجام داده بودند.">سَيِّـٔاتُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="انجام دادند؛ کردارهایی که بدی و پیامدشان مطرح است.">عَمِلوا</button>
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="ح ي ق" data-root-meaning="فرود آمدن و فراگرفتن چیزی، به‌ویژه پیامدی ناگوار که شخص را گرفتار می‌کند." data-context="فرا می‌گیرد؛ در صحنهٔ آشکار شدن بدی‌های کردار، آنچه مسخره می‌کردند گریبانشان را می‌گیرد." data-learn-more="/quran-terminology/fa/roots/h-y-q/">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ همراه فعل بعدی، رفتار پیشینِ تمسخر را بیان می‌کند.">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="مسخره می‌کردند؛ دربارهٔ آنچه آنان را فراگرفت.">يَستَهزِءونَ</button>
  </p>
  <p class="farsi-verse">و بدی‌های آنچه کرده بودند برایشان آشکار شد و آنچه مسخره‌اش می‌کردند آنان را فراگرفت.</p>
</section>
