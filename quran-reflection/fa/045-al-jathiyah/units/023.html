  <p class="farsi-verse">آیا کسی را دیده‌ای که خواهش خود را معبود خویش گرفته و آن معبود یگانه او را با علم گمراه کرده و بر شنوایی و دلش مهر زده و بر بینایی‌اش پرده‌ای نهاده است؟ پس بعد از آن معبود یگانه چه کسی او را هدایت می‌کند؟ آیا یادآور نمی‌شوید؟</p>
