    <button class="word-link" type="button" data-word="يُهلِكُنا" data-root="ه ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-l-k/" data-root-meaning="از میان رفتن و نابود کردن؛ نیز از دست رفتن، بنا بر سیاق.">يُهلِكُنا</button>

    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>

    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>

  </p>
  <p class="farsi-verse">و گفتند: جز همین زندگی دنیای ما نیست؛ می‌میریم و زندگی می‌کنیم و جز روزگار ما را هلاک نمی‌کند. و هیچ دانشی به این ندارند؛ جز گمان نمی‌برند.</p>
