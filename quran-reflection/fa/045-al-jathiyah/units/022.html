<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">الجاثیه ۴۵:۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَخَلَقَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">وَخَلَقَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَلِتُجزىٰ" data-root="ج ز ي" data-learn-more="/quran-terminology/fa/roots/j-z-y/" data-root-meaning="کفایت‌کردن، جایگزین‌شدن، و صاف‌کردن حساب یک عمل، حق یا تعهد از راه ادای پاسخ متناسب">وَلِتُجزىٰ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسٍ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="كَسَبَت" data-root="ك س ب" data-learn-more="/quran-terminology/fa/roots/k-s-b/" data-root-meaning="از طلب و به دست آوردن تا حاصل عمل و مسئولیت انسان">كَسَبَت</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">يُظلَمونَ</button>
  </p>
  <p class="farsi-verse">و آن معبود یگانه آسمان‌ها و زمین را به حق آفرید و تا هر نفسی به آنچه به دست آورده جزا داده شود، و به آنان ستم نمی‌شود.</p>
</section>
