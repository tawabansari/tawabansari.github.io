  <p class="farsi-verse">پاداششان نزد پروردگارشان باغ‌های اقامت است که از زیر آنها نهرها روان است؛ همیشه در آنها ماندگارند. خدا از آنان خشنود است و آنان از او خشنودند. این برای کسی است که از پروردگارش بیم دارد.</p>
