<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِأَنَّهُمُ</button>
    <button class="word-link" type="button" data-word="اتَّبَعوا" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">اتَّبَعوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَسخَطَ" data-root="س خ ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَسخَطَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَكَرِهوا" data-root="ك ر ه" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَكَرِهوا</button>
    <button class="word-link" type="button" data-word="رِضوٰنَهُ" data-root="ر ض و" data-learn-more="/quran-terminology/fa/roots/r-dad-w/" data-root-meaning="از خشنودی و پذیرش تا رضایت متقابل">رِضوٰنَهُ</button>
    <button class="word-link" type="button" data-word="فَأَحبَطَ" data-root="ح ب ط" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَحبَطَ</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">أَعمٰلَهُم</button>
  </p>
  <p class="farsi-verse">این از آن روست که از آنچه آن معبود یگانه را به خشم آورد پیروی کردند و خشنودی او را ناخوش داشتند، پس اعمالشان را بی‌ثمر کرد.</p>
