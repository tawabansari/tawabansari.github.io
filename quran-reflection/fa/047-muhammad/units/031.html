<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَنَبلُوَنَّكُم" data-root="ب ل و" data-learn-more="/quran-terminology/fa/roots/b-l-w/" data-root-meaning="آزمودن در واقعیت؛ از خیر و شر تا «بلاء» و فرسودگی">وَلَنَبلُوَنَّكُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="نَعلَمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">نَعلَمَ</button>
    <button class="word-link" type="button" data-word="المُجٰهِدينَ" data-root="ج ه د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-h2-d/" data-root-meaning="به کار گرفتن توان و کوشش در برابر دشواری؛ جهاد معنای خود را از هدف، شیوه و سیاق می‌گیرد.">المُجٰهِدينَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَالصّٰبِرينَ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">وَالصّٰبِرينَ</button>
    <button class="word-link" type="button" data-word="وَنَبلُوَا۟" data-root="ب ل و" data-learn-more="/quran-terminology/fa/roots/b-l-w/" data-root-meaning="آزمودن در واقعیت؛ از خیر و شر تا «بلاء» و فرسودگی">وَنَبلُوَا۟</button>
    <button class="word-link" type="button" data-word="أَخبارَكُم" data-root="خ ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-b-r/" data-root-meaning="خبر و آگاهی حاصل از شناخت و تجربه.">أَخبارَكُم</button>
  </p>
  <p class="farsi-verse">و بی‌گمان شما را می‌آزماییم تا مجاهدان و شکیبایان شما را بشناسیم و خبرهایتان را بیازماییم.</p>
