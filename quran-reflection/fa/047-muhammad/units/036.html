<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّمَا</button>
    <button class="word-link" type="button" data-word="الحَيوٰةُ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="لَعِبٌ" data-root="ل ع ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَعِبٌ</button>
    <button class="word-link" type="button" data-word="وَلَهوٌ" data-root="ل ه و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَلَهوٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">تُؤمِنوا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="يُؤتِكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يُؤتِكُم</button>
    <button class="word-link" type="button" data-word="أُجورَكُم" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أُجورَكُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَسـَٔلكُم" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">يَسـَٔلكُم</button>
    <button class="word-link" type="button" data-word="أَموٰلَكُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">أَموٰلَكُم</button>
  </p>
  <p class="farsi-verse">زندگی دنیا تنها بازی و سرگرمی است؛ و اگر ایمان آورید و پرهیزگار باشید، پاداش‌هایتان را به شما می‌دهد و اموالتان را از شما نمی‌خواهد.</p>
</section>
