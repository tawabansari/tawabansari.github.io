  <p class="farsi-verse">این شمایید که فراخوانده می‌شوید تا در راه آن معبود یگانه انفاق کنید؛ پس برخی از شما بخل می‌ورزند، و هرکس بخل ورزد، تنها به زیان خود بخل ورزیده است. و آن معبود یگانه بی‌نیاز است و شما نیازمندید؛ و اگر روی گردانید، قومی دیگر را جایگزین شما می‌کند، سپس آنان مانند شما نخواهند بود.</p>
