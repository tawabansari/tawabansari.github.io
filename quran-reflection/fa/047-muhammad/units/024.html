<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَفَلا</button>
    <button class="word-link" type="button" data-word="يَتَدَبَّرونَ" data-root="د ب ر" data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پسین؛ پشت کردن و سپری شدن؛ تدبیر، سامان دادن امور؛ تدبر، اندیشیدن سنجیده در سخن." data-context="تدبر می‌کنند؛ بررسیِ سنجیدهٔ قرآن.">يَتَدَبَّرونَ</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="ق ر أ" data-root-meaning="خواندن و به زبان آوردن سخنی منظم؛ و در شاخهٔ قَرْء، دوره‌های مربوط به چرخهٔ حیض و پاکی زنان." data-context="قرآن؛ متنِ موضوعِ پرسش دربارهٔ تدبر." data-learn-more="/quran-terminology/fa/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبٍ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل‌ها؛ جایگاهِ قفل‌های مورد پرسش.">قُلوبٍ</button>
    <button class="word-link" type="button" data-word="أَقفالُها" data-root="ق ف ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-f-l/" data-root-meaning="قفل و بستن با قفل." data-context="قفل‌هایشان؛ تصویرِ بسته بودنِ دل‌ها.">أَقفالُها</button>
  </p>
  <p class="farsi-verse">آیا در قرآن تدبر نمی‌کنند، یا بر دل‌هایی قفل‌هایشان نهاده شده است؟</p>
</section>
