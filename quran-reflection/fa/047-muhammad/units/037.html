<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="يَسـَٔلكُموها" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">يَسـَٔلكُموها</button>
    <button class="word-link" type="button" data-word="فَيُحفِكُم" data-root="ح ف و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَيُحفِكُم</button>
    <button class="word-link" type="button" data-word="تَبخَلوا" data-root="ب خ ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَبخَلوا</button>
    <button class="word-link" type="button" data-word="وَيُخرِج" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">وَيُخرِج</button>
    <button class="word-link" type="button" data-word="أَضغٰنَكُم" data-root="ض غ ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَضغٰنَكُم</button>
  </p>
  <p class="farsi-verse">اگر آن را از شما بخواهد و بر شما اصرار ورزد، بخل می‌ورزید و کینه‌هایتان را آشکار می‌کند.</p>
