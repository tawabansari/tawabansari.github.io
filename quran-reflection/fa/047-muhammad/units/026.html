  <p class="farsi-verse">این از آن روست که به کسانی که آنچه را آن معبود یگانه نازل کرده ناخوش داشتند گفتند: در بخشی از کار از شما فرمان خواهیم برد؛ و آن معبود یگانه رازهایشان را می‌داند.</p>
