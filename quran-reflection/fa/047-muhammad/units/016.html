  <p class="farsi-verse">و از آنان کسانی به تو گوش می‌دهند، تا چون از نزد تو بیرون روند به کسانی که دانش داده شده‌اند می‌گویند: همین الآن چه گفت؟ آنان کسانی‌اند که آن معبود یگانه بر دل‌هایشان مهر زده و از خواسته‌هایشان پیروی کرده‌اند.</p>
