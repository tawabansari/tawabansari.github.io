<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُدخِلُهُمُ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">وَيُدخِلُهُمُ</button>
    <button class="word-link" type="button" data-word="الجَنَّةَ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجَنَّةَ</button>
    <button class="word-link" type="button" data-word="عَرَّفَها" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی">عَرَّفَها</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
  </p>
  <p class="farsi-verse">و آنان را به بهشتی درمی‌آورد که به آنان شناسانده است.</p>
</section>
