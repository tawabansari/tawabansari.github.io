<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="تَوَفَّتهُمُ" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/" data-root-meaning="کامل کردن، تمام رساندن، ادا کردن حق چیزی به طور کامل، و کم نگذاشتن در پیمان، اندازه، حساب، وعده یا جزا">تَوَفَّتهُمُ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="يَضرِبونَ" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">يَضرِبونَ</button>
    <button class="word-link" type="button" data-word="وُجوهَهُم" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»">وُجوهَهُم</button>
    <button class="word-link" type="button" data-word="وَأَدبٰرَهُم" data-root="د ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-b-r/" data-root-meaning="پشت و بخش پایانی؛ روی گرداندن؛ تدبیر و تدبّر: توجه به پیامد و سامان دادن.">وَأَدبٰرَهُم</button>
  </p>
  <p class="farsi-verse">پس چگونه خواهد بود آنگاه که فرشتگان جانشان را بگیرند و بر چهره‌ها و پشت‌هایشان بزنند؟</p>
</section>
