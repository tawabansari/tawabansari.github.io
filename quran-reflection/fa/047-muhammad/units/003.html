  <p class="farsi-verse">این از آن روست که کافران از باطل پیروی کردند و مؤمنان از حقیقتی که از پروردگارشان است پیروی کردند؛ این‌گونه آن معبود یگانه برای مردم مَثَل‌هایشان را می‌زند.</p>
