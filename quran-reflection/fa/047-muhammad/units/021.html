<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۲۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="طاعَةٌ" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="فرمان‌برداری؛ رفتار مطلوب در برابر مسئولیت.">طاعَةٌ</button>
    <button class="word-link" type="button" data-word="وَقَولٌ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفتار؛ همراه فرمان‌برداری و با وصف پسندیده.">وَقَولٌ</button>
    <button class="word-link" type="button" data-word="مَعروفٌ" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/" data-root-meaning="شناختن، بازشناختن، تشخیص دادن، آشکار شدن نشانه، و بیرون آمدن چیزی از حالت ابهام و بیگانگی" data-context="پسندیده؛ وصف گفتار.">مَعروفٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذا</button>
    <button class="word-link" type="button" data-word="عَزَمَ" data-root="ع ز م" data-learn-more="/quran-terminology/fa/roots/ayn-z-m/" data-root-meaning="تصمیم جدی و استوار و پایداری در نگه داشتن آن؛ در «عَزَمَ الْأَمْرُ»، جدی و قطعی شدن کار." data-context="جدی و قطعی شد؛ فعل به خودِ کار و مسئولیت نسبت داده شده است.">عَزَمَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="کار و مسئولیت؛ فاعل دستوریِ جدی و قطعی شدن.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="فَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَو</button>
    <button class="word-link" type="button" data-word="صَدَقُوا" data-root="ص د ق" data-learn-more="/quran-terminology/fa/roots/sad-d-q/" data-root-meaning="راستی، مطابقت با حقیقت، و استواری انسان در گفتار، ایمان، عهد و عمل" data-context="راست بودند؛ صداقت در برابر آن معبود یگانه در شرط آیه.">صَدَقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="می‌بود؛ بیان نتیجهٔ بهتر بودن در پاسخ شرط.">لَكانَ</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهتر؛ وصف نتیجهٔ راست بودن با آن معبود یگانه برای آنان.">خَيرًا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
  </p>
  <p class="farsi-verse">فرمان‌بری و سخنی پسندیده؛ پس چون کار قطعی شد، اگر با آن معبود یگانه راست می‌بودند، برایشان بهتر بود.</p>
</section>
