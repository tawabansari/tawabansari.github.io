<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَيَهديهِم" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">سَيَهديهِم</button>
    <button class="word-link" type="button" data-word="وَيُصلِحُ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">وَيُصلِحُ</button>
    <button class="word-link" type="button" data-word="بالَهُم" data-root="ب و ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بالَهُم</button>
  </p>
  <p class="farsi-verse">آنان را هدایت خواهد کرد و حالشان را سامان خواهد داد،</p>
