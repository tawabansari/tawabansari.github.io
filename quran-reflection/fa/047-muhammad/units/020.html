  <p class="farsi-verse">و کسانی که ایمان آورده‌اند می‌گویند: چرا سوره‌ای نازل نشده است؟ پس چون سوره‌ای استوار نازل شود و در آن از جنگ سخن رود، کسانی را که در دل‌هایشان بیماری است می‌بینی که چون کسی که از مرگ بیهوش شده به تو می‌نگرند؛ پس وای بر آنان.</p>
