<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">محمد ۴۷:۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">نَشاءُ</button>
    <button class="word-link" type="button" data-word="لَأَرَينٰكَهُم" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/">لَأَرَينٰكَهُم</button>
    <button class="word-link" type="button" data-word="فَلَعَرَفتَهُم" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/">فَلَعَرَفتَهُم</button>
    <button class="word-link" type="button" data-word="بِسيمٰهُم" data-root="س و م" data-learn-more="/quran-terminology/fa/roots/s-w-m/">بِسيمٰهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَتَعرِفَنَّهُم" data-root="ع ر ف" data-learn-more="/quran-terminology/fa/roots/ayn-r-f/">وَلَتَعرِفَنَّهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="لَحنِ" data-root="ل ح ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لَحنِ</button>
    <button class="word-link" type="button" data-word="القَولِ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">القَولِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="أَعمٰلَكُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">أَعمٰلَكُم</button>
  </p>
  <p class="farsi-verse">و اگر بخواهیم آنان را به تو نشان می‌دهیم، پس آنان را از سیمایشان می‌شناسی؛ و بی‌گمان آنان را از لحن گفتار می‌شناسی؛ و آن معبود یگانه اعمالتان را می‌داند.</p>
</section>
