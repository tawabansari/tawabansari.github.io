<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الکوثر ۱۰۸:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="شانِئَكَ" data-root="ش ن أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-n-a/" data-root-meaning="دشمنی و بیزاری شدید." data-context="آن‌که تو را دشمن می‌دارد؛ اسم فاعل با ضمیر «تو» خطاب به محمد، نه نام شخصی معین در متن آیه.">شانِئَكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="الأَبتَرُ" data-root="ب ت ر" data-learn-more="/quran-terminology/fa/roots/b-t-r/" data-root-meaning="بریدن و قطع شدن دنباله یا ادامه؛ أبتر: بریده و بی‌دنباله." data-context="خود بریده و بی‌دنباله؛ وصف دشمن محمد در تقابل با عطای کوثر؛ در خوانش سیاقیِ این پژوهش، گسسته از ادامهٔ اثر نیک.">الأَبتَرُ</button>
  </p>
  <p class="farsi-verse">بی‌گمان آن‌که تو را دشمن می‌دارد، خود بریده است.</p>
</section>
