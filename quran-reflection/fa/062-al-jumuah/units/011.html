  <p class="farsi-verse">و هنگامی که تجارتی یا سرگرمی‌ای دیدند، به سوی آن پراکنده شدند و تو را ایستاده رها کردند. بگو: «آنچه نزد آن معبود یگانه است از سرگرمی و تجارت بهتر است؛ و آن معبود یگانه بهترین روزی‌دهندگان است.»</p>
