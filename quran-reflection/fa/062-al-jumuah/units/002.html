  <p class="farsi-verse">اوست که در میان درس‌ناخواندگان فرستاده‌ای از خودشان برانگیخت که آیات او را بر آنان می‌خواند و پاکشان می‌سازد و کتاب و حکمت به آنان می‌آموزد، هرچند پیش از آن در گمراهی آشکاری بودند.</p>
