  <p class="farsi-verse">و هنگامی که عیسی پسر مریم گفت: «ای بنی‌اسرائیل، من فرستادهٔ آن معبود یگانه به سوی شمایم، تصدیق‌کنندهٔ توراتی که پیش روی من است و مژده‌دهنده به فرستاده‌ای که پس از من می‌آید و نامش احمد است.» پس هنگامی که با نشانه‌های روشن نزد آنان آمد، گفتند: «این جادویی آشکار است.»</p>
