<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الصف ۶۱:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُريدونَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار">يُريدونَ</button>
    <button class="word-link" type="button" data-word="لِيُطفِـٔوا" data-root="ط ف أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-f-a/" data-root-meaning="خاموش کردن آتش یا روشنایی.">لِيُطفِـٔوا</button>
    <button class="word-link" type="button" data-word="نورَ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">نورَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="بِأَفوٰهِهِم" data-root="ف و ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-w-h2/" data-root-meaning="دهان و دهان‌ها.">بِأَفوٰهِهِم</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="مُتِمُّ" data-root="ت م م" data-learn-more="/quran-terminology/fa/roots/t-m-m/" data-root-meaning="رسیدن یا رساندن یک امر به حد مقرر، پس از کامل شدن مقدار، مدت، اجزا یا مراحل لازم">مُتِمُّ</button>
    <button class="word-link" type="button" data-word="نورِهِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">نورِهِ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَو</button>
    <button class="word-link" type="button" data-word="كَرِهَ" data-root="ك ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-r-h2/" data-root-meaning="ناخوش داشتن و دشواری؛ اکراه: واداشتن برخلاف خواست.">كَرِهَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">الكٰفِرونَ</button>
  </p>
  <p class="farsi-verse">می‌خواهند نور آن معبود یگانه را با دهان‌هایشان خاموش کنند، و آن معبود یگانه نور خود را کامل می‌کند، هرچند کافران ناخوش دارند.</p>
</section>
