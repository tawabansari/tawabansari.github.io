<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الناس ۱۱۴:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="شَرِّ" data-root="ش ر ر" data-root-meaning="شر، بدی یا زیانی است که می‌تواند به رفتار، وضعیت، رخداد یا فرجام چیزی نسبت داده شود؛ در ساخت مقایسه‌ای، بدتر بودن را بیان می‌کند؛ و شرر در شاخه مادی به پاره‌های فروزان و جهنده آتش اشاره دارد." data-learn-more="/quran-terminology/fa/roots/sh-r-r/">شَرِّ</button>
    <button class="word-link" type="button" data-word="الوَسواسِ" data-root="و س و س" data-root-meaning="وسوسه در کاربرد صوتی، صدای آرام و پنهان است؛ و در کاربرد مربوط به انسان، سخن یا اندیشه‌ای است که در درون می‌گذرد یا به شیوه‌ای نهانی القا می‌شود. این القا می‌تواند از نفس انسان یا عامل دیگری باشد و نادرستی، فریبندگی یا شیطانی بودن آن از فاعل، محتوا و سیاق تعیین می‌شود، نه از خود ریشه به تنهایی." data-learn-more="/quran-terminology/fa/roots/w-s-w-s/">الوَسواسِ</button>
    <button class="word-link" type="button" data-word="الخَنّاسِ" data-root="خ ن س" data-root-meaning="خنوس، عقب نشستن، جمع شدن یا کنار رفتن از جایگاه آشکار است که می‌تواند با پنهان شدن از دید همراه باشد. « خُنَّس » به واپس‌روندگان یا پنهان‌شوندگان اشاره می‌کند و « خَنَّاس » وصف کسی یا چیزی است که عقب‌نشینی و پنهان شدن در رفتار او برجسته است." data-learn-more="/quran-terminology/fa/roots/kh-n-s/">الخَنّاسِ</button>
  </p>
  <p class="farsi-verse">از شر وسوسه‌گرِ واپس‌کشنده،</p>
</section>
