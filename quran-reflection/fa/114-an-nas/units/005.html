<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">الناس ۱۱۴:۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُوَسوِسُ" data-root="و س و س" data-root-meaning="وسوسه در کاربرد صوتی، صدای آرام و پنهان است؛ و در کاربرد مربوط به انسان، سخن یا اندیشه‌ای است که در درون می‌گذرد یا به شیوه‌ای نهانی القا می‌شود. این القا می‌تواند از نفس انسان یا عامل دیگری باشد و نادرستی، فریبندگی یا شیطانی بودن آن از فاعل، محتوا و سیاق تعیین می‌شود، نه از خود ریشه به تنهایی." data-learn-more="/quran-terminology/fa/roots/w-s-w-s/">يُوَسوِسُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="صُدورِ" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/">صُدورِ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسِ</button>
  </p>
  <p class="farsi-verse">آن‌که در سینه‌های مردم وسوسه می‌کند،</p>
</section>
