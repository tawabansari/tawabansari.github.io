  <p class="farsi-verse">ای کسانی که ایمان آورده‌اید، هنگامی که با فرستاده گفت‌وگوی خصوصی می‌کنید، پیش از گفت‌وگویتان صدقه‌ای بدهید. این برای شما بهتر و پاکیزه‌تر است. پس اگر نیافتید، آن معبود یگانه آمرزنده و مهربان است.</p>
