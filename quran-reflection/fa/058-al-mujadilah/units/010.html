<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">المجادلة ۵۸:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّمَا</button>
    <button class="word-link" type="button" data-word="النَّجوىٰ" data-root="ن ج و" data-learn-more="/quran-terminology/fa/roots/n-j-w/" data-root-meaning="رهایی‌یافتن از خطر، بیرون‌آمدن از وضعیت زیان‌بار، و رسیدن به جایگاهی امن">النَّجوىٰ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت">الشَّيطٰنِ</button>
    <button class="word-link" type="button" data-word="لِيَحزُنَ" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون">لِيَحزُنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَلَيسَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَيسَ</button>
    <button class="word-link" type="button" data-word="بِضارِّهِم" data-root="ض ر ر" data-learn-more="/quran-terminology/fa/roots/dad-r-r/" data-root-meaning="ضَرَّ؛ زیان، سختی و ناگزیری">بِضارِّهِم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِإِذنِ" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن">بِإِذنِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَليَتَوَكَّلِ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">فَليَتَوَكَّلِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">المُؤمِنونَ</button>
  </p>
  <p class="farsi-verse">گفت‌وگوی نهانی از شیطان است تا کسانی را که ایمان آورده‌اند اندوهگین کند؛ ولی جز به اذن آن معبود یگانه هیچ زیانی به آنان نمی‌رساند. و مؤمنان باید بر آن معبود یگانه توکل کنند.</p>
</section>
