    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>

  </p>
  <p class="farsi-verse">کسانی از شما که همسرانشان را به پشت مادرانشان تشبیه می‌کنند، آنان مادرانشان نیستند. مادرانشان تنها زنانی هستند که ایشان را زاده‌اند. آنان سخنی ناپسند و دروغ می‌گویند؛ و آن معبود یگانه گذشت‌کننده و آمرزنده است.</p>
