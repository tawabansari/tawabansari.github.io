<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">المجادلة ۵۸:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَجِد" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="نیابد؛ امکان آزاد کردن بندهٔ ذکرشده در آیهٔ پیشین را نداشته باشد.">يَجِد</button>
    <button class="word-link" type="button" data-word="فَصِيامُ" data-root="ص و م" data-root-meaning="خودداری و بازایستادن از یک کار یا حرکت." data-context="پس روزه گرفتن دو ماه پیاپی، پیش از تماس جنسی، در وضعیت نیافتن امکان آزادسازی." data-learn-more="/quran-terminology/fa/roots/sad-w-m/">فَصِيامُ</button>
    <button class="word-link" type="button" data-word="شَهرَينِ" data-root="ش ه ر" data-root-meaning="ماه؛ دوره‌ای ماهانه و قابل شمارش از زمان در نظام شناخته‌شدهٔ ماه‌ها." data-context="دو ماه؛ مدت روزهٔ مقرر." data-learn-more="/quran-terminology/fa/roots/sh-h2-r/">شَهرَينِ</button>
    <button class="word-link" type="button" data-word="مُتَتابِعَينِ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="پیاپی؛ وصف پیوستگیِ دو ماه روزه.">مُتَتابِعَينِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پیش از؛ زمان مقدم بر تماس جنسی.">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَتَماسّا" data-root="م س س" data-learn-more="/quran-terminology/fa/roots/m-s-s/" data-root-meaning="از تماس مستقیم تا رسیدن اثر، خیر، ضرر و رابطه انسانی" data-context="با یکدیگر تماس یابند؛ در این سیاق، تماس جنسی.">يَتَماسّا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَستَطِع" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="نتواند؛ توان انجام روزهٔ بیان‌شده را نداشته باشد.">يَستَطِع</button>
    <button class="word-link" type="button" data-word="فَإِطعامُ" data-root="ط ع م" data-learn-more="/quran-terminology/fa/roots/tt-ayn-m/" data-root-meaning="چشیدن، خوردن، خوراک، خوراک‌رسانی و دسترسی واقعی به غذا" data-context="پس خوراک دادن؛ گزینهٔ جبرانی در وضعیت ناتوانی.">فَإِطعامُ</button>
    <button class="word-link" type="button" data-word="سِتّينَ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-context="شصت؛ شمار نیازمندانی که باید خوراک داده شوند." data-root="س ت ت" data-root-meaning="عدد شش و شصت؛ در تحلیل لغوی با «سدس» مرتبط است." data-learn-more="/quran-terminology/fa/roots/s-t-t/">سِتّينَ</button>
    <button class="word-link" type="button" data-word="مِسكينًا" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-context="نیازمند؛ دریافت‌کنندهٔ خوراک." data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن؛ و در شاخهٔ «مسکین»، نیازمندی و کم‌توانی بر اثر فشار نیاز.">مِسكينًا</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لِتُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="تا ایمان آورید؛ هدف بیان‌شده در نسبت با آن معبود یگانه و فرستاده‌اش.">لِتُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَرَسولِهِ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="و فرستادهٔ او؛ پیامبر در کنار یاد آن معبود یگانه.">وَرَسولِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="حُدودُ" data-root="ح د د" data-root-meaning="مرز و حد فاصل؛ بازداشتن، تیزی و برندگی." data-context="حدود؛ مرزها و مقررات بیان‌شده." data-learn-more="/quran-terminology/fa/roots/h-d-d/">حُدودُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَلِلكٰفِرينَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="و برای کافران؛ کسانی که با وصف کفر معرفی شده‌اند.">وَلِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب؛ پیامد رنج‌آورِ ذکرشده.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد" data-context="دردناک؛ وصف عذاب.">أَليمٌ</button>
  </p>
  <p class="farsi-verse">پس هر که نیابد، دو ماه پیاپی روزه بگیرد، پیش از آنکه با یکدیگر تماس یابند. و هر که نتواند، شصت نیازمند را خوراک دهد. این برای آن است که به آن معبود یگانه و فرستاده‌اش ایمان بیاورید. و اینها حدود آن معبود یگانه است؛ و برای کافران عذابی دردناک است.</p>
</section>
