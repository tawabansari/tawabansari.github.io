  <p class="farsi-verse">و کسانی که همسرانشان را به پشت مادرانشان تشبیه می‌کنند و سپس از آنچه گفته‌اند بازمی‌گردند، باید پیش از آنکه با یکدیگر تماس یابند برده‌ای آزاد کنند. این چیزی است که بدان پند داده می‌شوید؛ و آن معبود یگانه به آنچه می‌کنید آگاه است.</p>
