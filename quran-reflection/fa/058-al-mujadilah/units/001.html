  <p class="farsi-verse">آن معبود یگانه سخن زنی را که دربارهٔ شوهرش با تو گفت‌وگو می‌کند و به آن معبود یگانه شکایت می‌برد شنید؛ و آن معبود یگانه گفت‌وگوی شما دو تن را می‌شنود. همانا آن معبود یگانه شنوا و بیناست.</p>
