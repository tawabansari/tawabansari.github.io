<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">المجادلة ۵۸:۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَن</button>
    <button class="word-link" type="button" data-word="تُغنِىَ" data-root="غ ن ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تُغنِىَ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="أَموٰلُهُم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">أَموٰلُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="أَولٰدُهُم" data-root="و ل د" data-learn-more="/quran-terminology/fa/roots/w-l-d/" data-root-meaning="زادن، زاده شدن، فرزند و نسبت مستقیم تولد">أَولٰدُهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود">النّارِ</button>
    ۖ
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="خ ل د" data-learn-more="/quran-terminology/fa/roots/kh-l-d/" data-root-meaning="ماندن، پاییدن و دگرگون نشدن در یک حالت یا جایگاه">خٰلِدونَ</button>
  </p>
  <p class="farsi-verse">دارایی‌ها و فرزندانشان در برابر آن معبود یگانه هیچ سودی به آنان نمی‌رساند. آنان اصحاب آتش‌اند و در آن جاودان‌اند.</p>
</section>
