  <h2 class="ayah-title">المجادلة ۵۸:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَ</button>
    <button class="word-link" type="button" data-word="يَبعَثُهُمُ" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/">يَبعَثُهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/">جَميعًا</button>
    <button class="word-link" type="button" data-word="فَيُنَبِّئُهُم" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/">فَيُنَبِّئُهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/">عَمِلوا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَحصىٰهُ" data-root="ح ص ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَحصىٰهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَنَسوهُ" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/">وَنَسوهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/">كُلِّ</button>

    <button class="word-link" type="button" data-word="شَهيدٌ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/">شَهيدٌ</button>
  </p>
  <p class="farsi-verse">روزی که آن معبود یگانه همهٔ آنان را برانگیزد و از آنچه کرده‌اند آگاهشان سازد. آن معبود یگانه آن را برشمرده و آنان فراموشش کرده‌اند؛ و آن معبود یگانه بر هر چیزی گواه است.</p>
</section>
