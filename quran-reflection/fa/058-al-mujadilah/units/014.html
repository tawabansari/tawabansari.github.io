  <p class="farsi-verse">آیا کسانی را ندیده‌ای که با قومی دوستی کرده‌اند که آن معبود یگانه بر آنان خشم گرفته است؟ آنان نه از شمایند و نه از ایشان؛ و آگاهانه بر دروغ سوگند می‌خورند.</p>
