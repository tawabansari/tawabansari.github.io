  <p class="arabic-text">
    <button class="word-link" type="button" data-word="استَحوَذَ" data-root="ح و ذ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">استَحوَذَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/">الشَّيطٰنُ</button>

    <button class="word-link" type="button" data-word="ذِكرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/">ذِكرَ</button>

    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="حِزبُ" data-root="ح ز ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِزبُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/">الشَّيطٰنِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="حِزبَ" data-root="ح ز ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">حِزبَ</button>

    <button class="word-link" type="button" data-word="الخٰسِرونَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">الخٰسِرونَ</button>
  </p>
  <p class="farsi-verse">شیطان بر آنان چیره شده و یاد آن معبود یگانه را از یادشان برده است. آنان حزب شیطان‌اند. آگاه باشید که حزب شیطان زیانکاران‌اند.</p>
