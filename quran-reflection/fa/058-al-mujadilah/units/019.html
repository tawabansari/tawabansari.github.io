<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">المجادلة ۵۸:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="استَحوَذَ" data-root="ح و ذ" data-root-meaning="راندن و مهار کردن، گرد آوردن و چیره شدن؛ در کاربرد قرآنی، چیرگی و اعمال نفوذ بر دیگری." data-context="چیره شد؛ تسلط یافتن شیطان بر آنان." data-learn-more="/quran-terminology/fa/roots/h-w-dh/">استَحوَذَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ عامل چیرگی و فراموشاندن یاد خدا.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="فَأَنسىٰهُم" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل" data-context="پس از یادشان برد؛ فراموشاندن یاد خدا.">فَأَنسىٰهُم</button>
    <button class="word-link" type="button" data-word="ذِكرَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یاد؛ در این ترکیب، یاد خدا.">ذِكرَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="حِزبُ" data-root="ح ز ب" data-root-meaning="گرد آمدن و تشکیل مجموعه؛ گروهی از افراد با پیوند، موضع یا هدف مشترک." data-context="گروه شیطان؛ کسانی که در این سیاق شیطان بر آنان چیره شده است." data-learn-more="/quran-terminology/fa/roots/h-z-b/">حِزبُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ کسی که گروه به او نسبت داده شده است.">الشَّيطٰنِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="حِزبَ" data-root="ح ز ب" data-root-meaning="گرد آمدن و تشکیل مجموعه؛ گروهی از افراد با پیوند، موضع یا هدف مشترک." data-context="گروه شیطان؛ تکرار همان انتساب در بیان زیانکاری آنان." data-learn-more="/quran-terminology/fa/roots/h-z-b/">حِزبَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="ش ط ن" data-learn-more="/quran-terminology/fa/roots/sh-tt-n/" data-root-meaning="دور شدن از جایگاه درست، سرکشی از مسیر حق، و قرار گرفتن در نقش دورکننده از هدایت" data-context="شیطان؛ در تکرارِ انتساب گروه به او.">الشَّيطٰنِ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُمُ</button>
    <button class="word-link" type="button" data-word="الخٰسِرونَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش" data-context="زیانکاران؛ وصف سرانجام گروه شیطان.">الخٰسِرونَ</button>
  </p>
  <p class="farsi-verse">شیطان بر آنان چیره شده و یاد آن معبود یگانه را از یادشان برده است. آنان حزب شیطان‌اند. آگاه باشید که حزب شیطان زیانکاران‌اند.</p>
</section>
