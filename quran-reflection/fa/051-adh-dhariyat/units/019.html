<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَفى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفى</button>
    <button class="word-link" type="button" data-word="أَموٰلِهِم" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">أَموٰلِهِم</button>
    <button class="word-link" type="button" data-word="حَقٌّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت">حَقٌّ</button>
    <button class="word-link" type="button" data-word="لِلسّائِلِ" data-root="س أ ل" data-learn-more="/quran-terminology/fa/roots/s-a-l/" data-root-meaning="پرسیدن، درخواست کردن و بازخواست نمودن">لِلسّائِلِ</button>
    <button class="word-link" type="button" data-word="وَالمَحرومِ" data-root="ح ر م" data-learn-more="/quran-terminology/fa/roots/h-r-m/" data-root-meaning="منع، حرمت، حریم و محرومیت">وَالمَحرومِ</button>
  </p>
  <p class="farsi-verse">و در اموالشان حقی برای درخواست‌کننده و محروم بود.</p>
