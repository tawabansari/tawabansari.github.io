<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَعَتَوا" data-root="ع ت و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَعَتَوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="فَأَخَذَتهُمُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">فَأَخَذَتهُمُ</button>
    <button class="word-link" type="button" data-word="الصّٰعِقَةُ" data-root="ص ع ق" data-learn-more="/quran-terminology/fa/roots/sad-ayn-q/" data-root-meaning="صاعقه، ضربه کوبنده و ناگهانی، صدای شدید و لرزاننده، و حادثه‌ای که انسان را هلاک، بیهوش، یا از وضعیت عادی خارج می‌کند">الصّٰعِقَةُ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَنظُرونَ" data-root="ن ظ ر" data-learn-more="/quran-terminology/fa/roots/n-zha-r/" data-root-meaning="نگریستن، در چیزی تأمل‌کردن، انتظارکشیدن و مهلت‌دادن">يَنظُرونَ</button>
  </p>
  <p class="farsi-verse">پس از فرمان پروردگارشان سرپیچی کردند و صاعقه آنان را گرفت، درحالی‌که می‌نگریستند.</p>
</section>
