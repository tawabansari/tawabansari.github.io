<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَقبَلَتِ" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید" data-context="پس روی آورد یا آغاز به واکنش کرد؛ دربارهٔ همسر ابراهیم پس از بشارت فرزند.">فَأَقبَلَتِ</button>
    <button class="word-link" type="button" data-word="امرَأَتُهُ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود" data-context="همسر او؛ همسر ابراهیم که به بشارت فرزند واکنش نشان می‌دهد.">امرَأَتُهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="صَرَّةٍ" data-root="ص ر ر" data-learn-more="/quran-terminology/fa/roots/sad-r-r/" data-root-meaning="بستن و محکم کردن؛ پافشاری و دست نکشیدن؛ سرمای سخت؛ صدای تیز یا بانگ شدید" data-context="بانگی بلند؛ واکنش صوتی همسر ابراهیم پس از بشارت فرزند.">صَرَّةٍ</button>
    <button class="word-link" type="button" data-word="فَصَكَّت" data-root="ص ك ك" data-learn-more="/quran-terminology/fa/roots/sad-k-k/" data-root-meaning="برخورد دو چیز با یکدیگر، ضربه زدن یا تماس همراه با نیرو؛ در کاربردهای دیگر، برخورد بخش‌هایی از جسم یا محکم به هم رسیدن آنها." data-context="پس زد؛ دربارهٔ زدن همسر ابراهیم بر چهرهٔ خود در واکنش به بشارت.">فَصَكَّت</button>
    <button class="word-link" type="button" data-word="وَجهَها" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="چهرهٔ خود؛ جایی که همسر ابراهیم بر آن زد.">وَجهَها</button>
    <button class="word-link" type="button" data-word="وَقالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفت؛ سخن همسر ابراهیم دربارهٔ پیری و نازایی خود.">وَقالَت</button>
    <button class="word-link" type="button" data-word="عَجوزٌ" data-root="ع ج ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-j-z/" data-root-meaning="ناتوان شدن یا ناتوان ساختن؛ عجوز: زن سالخورده." data-context="پیرزن؛ وصفی که همسر ابراهیم برای خود بیان می‌کند.">عَجوزٌ</button>
    <button class="word-link" type="button" data-word="عَقيمٌ" data-root="ع ق م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-q-m/" data-root-meaning="نازا و بی‌ثمر بودن؛ عقیم: بی‌زایشی یا بی‌بازده." data-context="نازا؛ وصف همسر ابراهیم در سخن او دربارهٔ فرزنددار شدن.">عَقيمٌ</button>
  </p>
  <p class="farsi-verse">پس همسرش با فریادی پیش آمد و بر چهره‌اش زد و گفت: پیرزنی نازا!</p>
</section>
