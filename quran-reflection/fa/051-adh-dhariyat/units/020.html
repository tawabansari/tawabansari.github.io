<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَفِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَفِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="ءايٰتٌ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايٰتٌ</button>
    <button class="word-link" type="button" data-word="لِلموقِنينَ" data-root="ي ق ن" data-learn-more="/quran-terminology/fa/roots/y-q-n/" data-root-meaning="ثبات معرفت، اطمینان روشن، و عبور از گمان">لِلموقِنينَ</button>
  </p>
  <p class="farsi-verse">و در زمین نشانه‌هایی برای اهل یقین است،</p>
