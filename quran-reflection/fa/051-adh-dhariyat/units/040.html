<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۴۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="پس او را گرفتیم.">فَأَخَذنٰهُ</button>
    <button class="word-link" type="button" data-word="وَجُنودَهُ" data-root="ج ن د" data-root-meaning="نیروهای گردآمده برای یاری، پشتیبانی و اقدام مشترک؛ در کاربرد نظامی، سپاه." data-context="و سپاهیان او؛ نیروهای همراه فرعون." data-learn-more="/quran-terminology/fa/roots/j-n-d/">وَجُنودَهُ</button>
    <button class="word-link" type="button" data-word="فَنَبَذنٰهُم" data-root="ن ب ذ" data-learn-more="/quran-terminology/fa/roots/n-b-dh/" data-root-meaning="نَبَذَ؛ افکندن، کنار گذاشتن و جدا شدن از موقعیت پیشین" data-context="پس آنان را افکندیم.">فَنَبَذنٰهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="ي م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-m/" data-root-meaning="قصد و رو آوردن؛ تیمّم: به قصد چیزی رفتن؛ یمّ: دریا یا آب پهناور، در شاخه‌ای دیگر." data-context="دریا.">اليَمِّ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مُليمٌ" data-root="ل و م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-w-m/" data-root-meaning="ملامت و سرزنش." data-context="نکوهش‌پذیر؛ مرتکب کاری سزاوار سرزنش.">مُليمٌ</button>
  </p>
  <p class="farsi-verse">پس او و سپاهیانش را گرفتیم و آنان را در دریا افکندیم، درحالی‌که او سزاوار سرزنش بود.</p>
</section>
