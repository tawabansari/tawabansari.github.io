<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَما</button>
    <button class="word-link" type="button" data-word="وَجَدنا" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="یافتیم؛ در جملهٔ منفیِ نیافتنِ جز یک خانه.">وَجَدنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="جز و غیر از.">غَيرَ</button>
    <button class="word-link" type="button" data-word="بَيتٍ" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="یک خانه و خانوار از تسلیم‌شدگان." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بَيتٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُسلِمينَ" data-root="س ل م" data-learn-more="/quran-terminology/fa/roots/s-l-m/" data-root-meaning="سلامت، بی‌گزندی، صلح، تحویل کامل و کنارگذاشتن مقاومت" data-context="تسلیم‌شدگان و مسلمانان.">المُسلِمينَ</button>
  </p>
  <p class="farsi-verse">و در آن جز یک خانه از تسلیم‌شدگان نیافتیم.</p>
</section>
