<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالسَّماءَ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">وَالسَّماءَ</button>
    <button class="word-link" type="button" data-word="بَنَينٰها" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">بَنَينٰها</button>
    <button class="word-link" type="button" data-word="بِأَيي۟دٍ" data-root="أ ي د" data-learn-more="/quran-terminology/fa/roots/a-y-d/" data-root-meaning="قوت، استواری و قوت بخشیدن به دیگری">بِأَيي۟دٍ</button>
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَموسِعونَ" data-root="و س ع" data-learn-more="/quran-terminology/fa/roots/w-s-ayn/" data-root-meaning="از فراخی مکان تا گنجایش، توان و فراگیری">لَموسِعونَ</button>
  </p>
  <p class="farsi-verse">و آسمان را با توان بنا کردیم و بی‌گمان ما گسترش‌دهنده‌ایم.</p>
</section>
