<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُتِلَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="نفرین و نکوهش شدید؛ «نابود باد»، در این سیاق نه فرمانِ کشتن.">قُتِلَ</button>
    <button class="word-link" type="button" data-word="الخَرّٰصونَ" data-root="خ ر ص" data-root-meaning="برآورد و تخمین؛ در کاربرد نکوهیدهٔ گفتاری، گمان‌پردازی و ادعای بی‌پشتوانه." data-context="گمان‌پردازان بی‌پشتوانه؛ وصف مبالغه برای کسانی که دربارهٔ وعده و روز جزا بی‌علم سخن می‌گویند." data-learn-more="/quran-terminology/fa/roots/kh-r-sad/">الخَرّٰصونَ</button>
  </p>
  <p class="farsi-verse">مرگ بر گمان‌پردازان،</p>
