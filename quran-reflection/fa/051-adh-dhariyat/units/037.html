<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الذاریات ۵۱:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَكنا" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی">وَتَرَكنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايَةً</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="يَخافونَ" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">يَخافونَ</button>
    <button class="word-link" type="button" data-word="العَذابَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد">العَذابَ</button>
    <button class="word-link" type="button" data-word="الأَليمَ" data-root="أ ل م" data-learn-more="/quran-terminology/fa/roots/a-l-m/" data-root-meaning="درد، رنج، آزار، و چیزی که اثر دردناک و ناخوش بر انسان می‌گذارد">الأَليمَ</button>
  </p>
  <p class="farsi-verse">و در آن نشانه‌ای برای کسانی گذاشتیم که از عذاب دردناک می‌ترسند.</p>
</section>
