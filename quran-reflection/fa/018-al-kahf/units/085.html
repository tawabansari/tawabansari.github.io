<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۸۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَتبَعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="پس پی گرفت؛ راهی را برای حرکت دنبال کرد.">فَأَتبَعَ</button>
    <button class="word-link" type="button" data-word="سَبَبًا" data-root="س ب ب" data-root-meaning="سَبَب: راه، وسیله یا پیوندی که دسترسی و ارتباط میان دو چیز را فراهم می‌کند. سَبَّ: دشنام دادن و با سخن تحقیرآمیز اهانت کردن. این شاخه در فرهنگ‌های لغوی با معنای قطع کردن نیز ارتباط داده شده است." data-context="راهی؛ مسیری که ذوالقرنین آن را پی گرفت." data-learn-more="/quran-terminology/fa/roots/s-b-b/">سَبَبًا</button>
  </p>
  <p class="farsi-verse">پس راهی را پی گرفت.</p>
</section>
