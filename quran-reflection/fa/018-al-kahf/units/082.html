<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الجِدارُ" data-root="ج د ر" data-root-meaning="دیوار، پایه و حصار آن؛ در جدیر و أجدر، تناسب و شایستگی؛ در شاخه‌ای دیگر، برآمدن و آشکار شدن." data-context="آن دیوار؛ متعلق به دو پسر یتیم که گنجشان زیر آن بود." data-learn-more="/quran-terminology/fa/roots/j-d-r/">الجِدارُ</button>
    <button class="word-link" type="button" data-word="فَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ بیانِ تعلق همان دیوار به دو پسر.">فَكانَ</button>
    <button class="word-link" type="button" data-word="لِغُلٰمَينِ" data-root="غ ل م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-m/" data-root-meaning="پسر و نوجوان." data-context="از آنِ دو پسر؛ مالکان دیوار.">لِغُلٰمَينِ</button>
    <button class="word-link" type="button" data-word="يَتيمَينِ" data-root="ي ت م" data-learn-more="/quran-terminology/fa/roots/y-t-m/" data-root-meaning="فقدان پدر، وضعیت یتیم و مسئولیت در برابر حقوق او" data-context="یتیم؛ وصفِ دو پسری که دیوار و گنج از آنِ آنان بود.">يَتيمَينِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-d-n/" data-root-meaning="مدینه: شهر و آبادی؛ تحلیل آن از «مدن» یا «دین» اختلافی است." data-context="شهر؛ محل زندگی دو پسر و جای دیوار.">المَدينَةِ</button>
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ بیانِ وجود گنج زیر دیوار.">وَكانَ</button>
    <button class="word-link" type="button" data-word="تَحتَهُ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="زیر آن؛ جای گنج در زیر همان دیوار.">تَحتَهُ</button>
    <button class="word-link" type="button" data-word="كَنزٌ" data-root="ك ن ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-z/" data-root-meaning="گرد آوردن و ذخیره کردن مال." data-context="گنجی؛ داراییِ پنهان‌شدهٔ دو پسر زیر دیوار.">كَنزٌ</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُما</button>
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بود؛ بیانِ وصف پدرِ آن دو.">وَكانَ</button>
    <button class="word-link" type="button" data-word="أَبوهُما" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان" data-context="پدرشان؛ پدرِ دو پسر یتیم.">أَبوهُما</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته؛ وصفِ پدر دو پسر.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="فَأَرادَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="پس خواست؛ ارادهٔ پروردگار دربارهٔ آیندهٔ دو پسر.">فَأَرادَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار تو؛ صاحبِ ارادهٔ بیان‌شده دربارهٔ دو یتیم.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَبلُغا" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="برسند؛ رسیدنِ دو پسر به رشد و توانایی.">يَبلُغا</button>
    <button class="word-link" type="button" data-word="أَشُدَّهُما" data-root="ش د د" data-learn-more="/quran-terminology/fa/roots/sh-d-d/" data-root-meaning="نیرو یافتن، محکم شدن، استوار کردن، از میان بردن سستی و رسیدن اثر به درجه‌ای بالا" data-context="رشد و تواناییِ آن دو؛ مرحلهٔ بلوغ و استحکام توان.">أَشُدَّهُما</button>
    <button class="word-link" type="button" data-word="وَيَستَخرِجا" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="و بیرون آورند؛ استخراج گنج توسط دو پسر.">وَيَستَخرِجا</button>
    <button class="word-link" type="button" data-word="كَنزَهُما" data-root="ك ن ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-z/" data-root-meaning="گرد آوردن و ذخیره کردن مال." data-context="گنجشان؛ داراییِ متعلق به دو پسر.">كَنزَهُما</button>
    <button class="word-link" type="button" data-word="رَحمَةً" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت" data-context="رحمتی؛ لطف و حمایت از سوی پروردگار در این کار.">رَحمَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار تو؛ سرچشمهٔ رحمتِ یادشده.">رَبِّكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="فَعَلتُهُ" data-root="ف ع ل" data-learn-more="/quran-terminology/fa/roots/f-ayn-l/" data-root-meaning="انجام دادن، واقع ساختن کار، و عبور از نیت و امکان به میدان عمل" data-context="آن را انجام دادم؛ عملِ همراه موسی که از فرمان شخصی او نبود.">فَعَلتُهُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرى" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="فرمان خودم؛ تصمیم و دستور شخصی که منشأ عمل بودنش نفی می‌شود.">أَمرى</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="تَأويلُ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="تأویل؛ توضیحِ حقیقت و علتِ کارهایی که موسی بر آنها شکیبایی نداشت.">تَأويلُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَسطِع" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="توانستی؛ توانِ شکیبایی که در این جمله نفی شده است.">تَسطِع</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="صَبرًا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="شکیبایی؛ تحملِ کارهایی که علتشان هنوز روشن نشده بود.">صَبرًا</button>
  </p>
  <p class="farsi-verse">و اما دیوار، از آنِ دو پسر یتیم در شهر بود و زیر آن گنجی برای آن دو بود و پدرشان مردی شایسته بود؛ پس پروردگارت خواست آن دو به رشد خود برسند و گنجشان را بیرون آورند؛ رحمتی از پروردگارت؛ و آن را به فرمان خود نکردم؛ این تأویل چیزی است که نتوانستی بر آن شکیبایی کنی.</p>
</section>
