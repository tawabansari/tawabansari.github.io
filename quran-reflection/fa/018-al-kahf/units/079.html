<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۷۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمَّا</button>
    <button class="word-link" type="button" data-word="السَّفينَةُ" data-root="س ف ن" data-learn-more="/quran-terminology/fa/roots/s-f-n/" data-root-meaning="تراشیدن، ساییدن و برداشتن لایه‌ای از سطح؛ سفینه: کشتی و وسیله حمل‌ونقل بر آب." data-context="کشتی معین داستان؛ متعلق به نیازمندانی که در دریا کار می‌کردند.">السَّفينَةُ</button>
    <button class="word-link" type="button" data-word="فَكانَت" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="پس بود؛ بیان تعلق کشتی به نیازمندان.">فَكانَت</button>
    <button class="word-link" type="button" data-word="لِمَسٰكينَ" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن" data-context="از آن نیازمندان؛ کسانی که کشتی وسیله کارشان بود.">لِمَسٰكينَ</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="کار می‌کردند؛ فعالیت صاحبان کشتی در دریا.">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دریا؛ محل کار صاحبان کشتی.">البَحرِ</button>
    <button class="word-link" type="button" data-word="فَأَرَدتُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="پس خواستم؛ بیان قصد همراه موسی.">فَأَرَدتُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="أَعيبَها" data-root="ع ي ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-y-b/" data-root-meaning="نقص و آسیب؛ معیوب ساختن." data-context="آن را معیوب کنم؛ ایجاد نقص در کشتی.">أَعيبَها</button>
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بود؛ معرفی پادشاهی در ادامه توضیح.">وَكانَ</button>
    <button class="word-link" type="button" data-word="وَراءَهُم" data-root="و ر ي" data-learn-more="/quran-terminology/fa/roots/w-r-y/" data-root-meaning="پوشاندن و پنهان شدن؛ و در شاخه ای دیگر، برآمدن و برآوردن آتش" data-context="در پس یا آن‌سوی آنان؛ جایگاه پادشاه در مسیر خطر پیش رویشان.">وَراءَهُم</button>
    <button class="word-link" type="button" data-word="مَلِكٌ" data-root="م ل ك" data-learn-more="/quran-terminology/fa/roots/m-l-k/" data-root-meaning="مالکیت، فرمانروایی، اختیار، سلطنت، قدرت تصرف، و وابستگی هر مالکیت و مُلک به آن معبود یگانه" data-context="پادشاهی؛ کسی که کشتی‌ها را به زور می‌گرفت.">مَلِكٌ</button>
    <button class="word-link" type="button" data-word="يَأخُذُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="می‌گرفت؛ تصاحب کشتی‌ها به دست پادشاه.">يَأخُذُ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم." data-context="هر؛ شمول گرفتن کشتی‌ها در بیان رفتار پادشاه.">كُلَّ</button>
    <button class="word-link" type="button" data-word="سَفينَةٍ" data-root="س ف ن" data-learn-more="/quran-terminology/fa/roots/s-f-n/" data-root-meaning="تراشیدن، ساییدن و برداشتن لایه‌ای از سطح؛ سفینه: کشتی و وسیله حمل‌ونقل بر آب." data-context="کشتی؛ در عبارت هر کشتی که پادشاه به زور می‌گرفت.">سَفينَةٍ</button>
    <button class="word-link" type="button" data-word="غَصبًا" data-root="غ ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-sad-b/" data-root-meaning="به زور و ناحق گرفتن." data-context="به زور و ناحق؛ شیوه تصاحب کشتی‌ها.">غَصبًا</button>
  </p>
  <p class="farsi-verse">اما کشتی از آنِ نیازمندانی بود که در دریا کار می‌کردند؛ خواستم آن را معیوب کنم، زیرا در پس آنان پادشاهی بود که هر کشتی را به زور می‌گرفت.</p>
</section>
