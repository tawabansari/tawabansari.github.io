<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ پاسخ موسی دربارهٔ نشانهٔ یافته‌شده.">قالَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودیم؛ در بیانِ جست‌وجوی پیشین آن دو.">كُنّا</button>
    <button class="word-link" type="button" data-word="نَبغِ" data-root="ب غ ي" data-learn-more="/quran-terminology/fa/roots/b-gh-y/" data-root-meaning="طلب، پی‌جویی و فراتر رفتن از حد" data-context="می‌جستیم؛ چیزی که در پیِ یافتنش بودند.">نَبغِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَارتَدّا" data-root="ر د د" data-learn-more="/quran-terminology/fa/roots/r-d-d/" data-root-meaning="بازگرداندن، برگرداندن، دفع کردن و بازگشت از یک مسیر" data-context="پس آن دو بازگشتند؛ حرکت به سوی مسیر پیشین.">فَارتَدّا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ءاثارِهِما" data-root="أ ث ر" data-learn-more="/quran-terminology/fa/roots/a-th-r/" data-root-meaning="نشانه‌ها، ردپاها، بازمانده‌ها یا پیامدها." data-context="آثارشان؛ رد و نشانِ راهی که آن دو پیموده بودند.">ءاثارِهِما</button>
    <button class="word-link" type="button" data-word="قَصَصًا" data-root="ق ص ص" data-root-meaning="پی گرفتن اثر و بازگفتن؛ قصاص: مقابلهٔ متناسب با آسیب؛ در لغت، بریدن و کوتاه کردن نیز ثبت شده است." data-context="با پیگیری آثار مسیر؛ مصدر منصوب که شیوهٔ بازگشت موسی و همراهش را بیان می‌کند، نه داستان‌گویی." data-learn-more="/quran-terminology/fa/roots/q-sad-sad/">قَصَصًا</button>
  </p>
  <p class="farsi-verse">گفت: این همان است که می‌جستیم؛ پس رد پای خود را دنبال‌کنان بازگشتند.</p>
</section>
