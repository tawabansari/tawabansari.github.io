<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۴۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روزی که؛ زمان صحنهٔ حرکت کوه‌ها و گردآوری انسان‌ها.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="نُسَيِّرُ" data-root="س ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-r/" data-root-meaning="رفتن و حرکت در مسیر؛ سیره: روش یا حالت." data-context="به حرکت درمی‌آوریم؛ دربارهٔ راندن و حرکت دادن کوه‌ها.">نُسَيِّرُ</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند." data-context="کوه‌ها؛ موضوع فعلی که از حرکت دادن آنها سخن می‌گوید.">الجِبالَ</button>
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و می‌بینی؛ مشاهدهٔ زمین در حالت آشکار و نمایان.">وَتَرَى</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="زمین؛ چیزی که در ادامه با «بارزة» وصف می‌شود.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="بارِزَةً" data-root="ب ر ز" data-root-meaning="بیرون آمدن و نمایان شدن در فضای آشکار یا در برابر دید و مواجهه؛ در صورت گذرا، آشکار ساختن چیزی." data-learn-more="/quran-terminology/fa/roots/b-r-z/" data-context="آشکار و نمایان؛ حالِ زمین در هنگام دیده شدن، نه معنای مستقلِ حسابرسی یا همواری کامل.">بارِزَةً</button>
    <button class="word-link" type="button" data-word="وَحَشَرنٰهُم" data-root="ح ش ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sh-r/" data-root-meaning="گرد آوردن و از جایگاه‌ها به سوی یک محل راندن." data-context="و آنان را گرد آوردیم؛ جمع کردن انسان‌ها در صحنهٔ مورد اشاره.">وَحَشَرنٰهُم</button>
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَم</button>
    <button class="word-link" type="button" data-word="نُغادِر" data-root="غ د ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-r/" data-root-meaning="واگذاشتن و باقی گذاشتن؛ نیز پیمان‌شکنی در کاربرد دیگر." data-context="فرو نگذاشتیم و جا نگذاشتیم؛ هیچ‌کس از گردآوری کنار نمی‌ماند.">نُغادِر</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="أَحَدًا" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="هیچ‌کس؛ در ساخت نفی، فراگیریِ گردآوری را بیان می‌کند.">أَحَدًا</button>
  </p>
  <p class="farsi-verse">و روزی که کوه‌ها را به حرکت درمی‌آوریم و زمین را آشکار می‌بینی و آنان را گرد می‌آوریم و هیچ‌یک را فرو نمی‌گذاریم.</p>
</section>
