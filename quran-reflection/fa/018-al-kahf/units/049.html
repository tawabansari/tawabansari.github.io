  <p class="farsi-verse">و کتاب نهاده می‌شود؛ پس مجرمان را از آنچه در آن است هراسان می‌بینی و می‌گویند: وای بر ما، این چه کتابی است که هیچ کوچک و بزرگی را فرو نمی‌گذارد مگر آنکه شمرده است؟ و آنچه کرده‌اند حاضر می‌یابند؛ و پروردگارت به هیچ‌کس ستم نمی‌کند.</p>
