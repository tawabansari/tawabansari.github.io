  <p class="farsi-verse">و صف‌کشیده بر پروردگارت عرضه می‌شوند: به‌راستی نزد ما آمدید، همان‌گونه که نخستین بار شما را آفریدیم؛ بلکه پنداشتید که هرگز برایتان وعده‌گاهی قرار نمی‌دهیم.</p>
