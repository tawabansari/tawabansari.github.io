    <button class="word-link" type="button" data-word="أَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَمّا</button>

  <p class="farsi-verse">گفت: اما هر که ستم کند، او را عذاب خواهیم کرد؛ سپس به پروردگارش بازگردانده می‌شود و او عذابی سخت به او خواهد داد.</p>
