<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كِلتَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كِلتَا</button>
    <button class="word-link" type="button" data-word="الجَنَّتَينِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="دو باغ؛ آنچه محصول خود را می‌دهند.">الجَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="ءاتَت" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="داد؛ دربارهٔ محصول هر یک از دو باغ.">ءاتَت</button>
    <button class="word-link" type="button" data-word="أُكُلَها" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/" data-root-meaning="خوردن، مصرف کردن، بهره بردن، جذب کردن، و گاهی فرسودن یا نابود کردن از راه مصرف" data-context="محصول خود را؛ آنچه باغ به بار آورد.">أُكُلَها</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="تَظلِم" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست" data-context="کم نگذاشت؛ با نفیِ پیش از فعل، چیزی از محصول کاسته نشد.">تَظلِم</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیزی؛ در نفی هرگونه کم‌گذاشتن محصول.">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَفَجَّرنا" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/" data-root-meaning="شکافتن، گشودن راه، جاری‌شدن چیزی پس از شکاف، سپیده‌دم، و خروج اخلاقی از حدود درست." data-context="و جاری ساختیم؛ رودی را در میان دو باغ.">وَفَجَّرنا</button>
    <button class="word-link" type="button" data-word="خِلٰلَهُما" data-root="خ ل ل" data-root-meaning="فاصله و فضای میان چیزها؛ نفوذ و گذشتن از میان آنها؛ و در کاربرد انسانی، دوستی و پیوند نزدیک." data-context="در میان آن دو؛ دو باغ یادشده." data-learn-more="/quran-terminology/fa/roots/kh-l-l/">خِلٰلَهُما</button>
    <button class="word-link" type="button" data-word="نَهَرًا" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="رودی؛ آنچه در میان دو باغ جاری شد.">نَهَرًا</button>
  </p>
  <p class="farsi-verse">هر دو باغ محصول خود را دادند و چیزی از آن کم نگذاشتند؛ و میانشان نهری روان کردیم.</p>
</section>
