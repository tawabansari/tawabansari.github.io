<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۳۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كِلتَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كِلتَا</button>
    <button class="word-link" type="button" data-word="الجَنَّتَينِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/">الجَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="ءاتَت" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/">ءاتَت</button>
    <button class="word-link" type="button" data-word="أُكُلَها" data-root="أ ك ل" data-learn-more="/quran-terminology/fa/roots/a-k-l/">أُكُلَها</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="تَظلِم" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">تَظلِم</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَفَجَّرنا" data-root="ف ج ر" data-learn-more="/quran-terminology/fa/roots/f-j-r/">وَفَجَّرنا</button>
    <button class="word-link" type="button" data-word="خِلٰلَهُما" data-root="خ ل ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خِلٰلَهُما</button>
    <button class="word-link" type="button" data-word="نَهَرًا" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/">نَهَرًا</button>
  </p>
  <p class="farsi-verse">هر دو باغ محصول خود را دادند و چیزی از آن کم نگذاشتند؛ و میانشان نهری روان کردیم.</p>
