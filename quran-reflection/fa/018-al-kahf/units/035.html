<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۳۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَدَخَلَ" data-root="د خ ل" data-learn-more="/quran-terminology/fa/roots/d-kh-l/" data-root-meaning="از بیرون به درون یک مکان، جمع، حالت یا قلمرو درآمدن؛ یا دیگری را وارد آن ساختن.">وَدَخَلَ</button>
    <button class="word-link" type="button" data-word="جَنَّتَهُ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنَّتَهُ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="ظالِمٌ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">ظالِمٌ</button>
    <button class="word-link" type="button" data-word="لِنَفسِهِ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">لِنَفسِهِ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَظُنُّ" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد">أَظُنُّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَبيدَ" data-root="ب ي د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَبيدَ</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="أَبَدًا" data-root="أ ب د" data-learn-more="/quran-terminology/fa/roots/a-b-d/" data-root-meaning="أَبَدًا؛ استمرار در سراسر آیندهٔ مورد نظر">أَبَدًا</button>
  </p>
  <p class="farsi-verse">و به باغش درآمد، در حالی که به خود ستم می‌کرد؛ گفت: گمان نمی‌کنم این هرگز نابود شود.</p>
</section>
