<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَجٰعِلونَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قطعاً تبدیل خواهیم کرد؛ قرار دادن آنچه بر زمین است در وضعیتی دیگر.">لَجٰعِلونَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيها</button>
    <button class="word-link" type="button" data-word="صَعيدًا" data-root="ص ع د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-ayn-d/" data-root-meaning="بالا رفتن و پیش رفتن؛ صعید: سطح زمین یا خاک." data-context="سطح زمین؛ زمینی که در ادامه بی‌گیاه توصیف می‌شود.">صَعيدًا</button>
    <button class="word-link" type="button" data-word="جُرُزًا" data-root="ج ر ز" data-root-meaning="بریدن و از میان بردن چیزی؛ و در وصف زمین، بی‌گیاه بودن و نداشتن پوشش گیاهی." data-context="بی‌گیاه؛ وصف سطح زمینی که زینت و پوشش پیشین آن برچیده می‌شود." data-learn-more="/quran-terminology/fa/roots/j-r-z/">جُرُزًا</button>
  </p>
  <p class="farsi-verse">و بی‌گمان آنچه را بر آن است به زمینی بی‌گیاه تبدیل می‌کنیم.</p>
</section>
