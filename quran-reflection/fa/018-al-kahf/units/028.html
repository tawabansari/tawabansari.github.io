<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصبِر" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع" data-context="و شکیبا بدار؛ فرمان به پایدار ماندن در همراهی یادشده.">وَاصبِر</button>
    <button class="word-link" type="button" data-word="نَفسَكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="خودت را؛ آنچه به صبر و همراهی فراخوانده می‌شود.">نَفسَكَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین" data-context="می‌خوانند؛ دعای آنان به درگاه پروردگار.">يَدعونَ</button>
    <button class="word-link" type="button" data-word="رَبَّهُم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ مخاطب دعای آنان.">رَبَّهُم</button>
    <button class="word-link" type="button" data-word="بِالغَدوٰةِ" data-root="غ د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-w/" data-root-meaning="بامداد و بامداد رفتن؛ غد: فردا یا آینده." data-context="در بامداد؛ زمان خواندن پروردگار.">بِالغَدوٰةِ</button>
    <button class="word-link" type="button" data-word="وَالعَشِىِّ" data-root="ع ش و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sh-w/" data-root-meaning="بخش پایانی روز و شامگاه؛ عَشو: کم‌دیدن یا چشم پوشیدن." data-context="و شامگاه؛ در کنار بامداد.">وَالعَشِىِّ</button>
    <button class="word-link" type="button" data-word="يُريدونَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="می‌خواهند؛ خواست و قصد آنان در دعا.">يُريدونَ</button>
    <button class="word-link" type="button" data-word="وَجهَهُ" data-root="و ج ه" data-learn-more="/quran-terminology/fa/roots/w-j-h2/" data-root-meaning="از چهره و روبه‌رو بودن تا جهت، قصد و «وجه الله»" data-context="روی او؛ آنچه خواست آنان به سوی آن است.">وَجهَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعدُ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="نگذرد؛ در نهی از برگرفتن نگاه از آنان.">تَعدُ</button>
    <button class="word-link" type="button" data-word="عَيناكَ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="دو چشم تو؛ موضوع نهی از گذشتن نگاه.">عَيناكَ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنهُم</button>
    <button class="word-link" type="button" data-word="تُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="می‌خواهی؛ خواستن زینت زندگی دنیا در حالت مورد نهی.">تُريدُ</button>
    <button class="word-link" type="button" data-word="زينَةَ" data-root="ز ي ن" data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آراستگی؛ زیبا ساختن یا زیبا جلوه دادن چیزی." data-context="جلوه‌ها و آراستگی زندگی دنیا که نباید سبب کنار گذاشتن همراهی یادشده شود.">زينَةَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی؛ در ترکیب زندگی دنیا.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="دنیا؛ زندگی حاضر و نزدیک.">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُطِع" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/" data-context="اطاعت مکن؛ فرمان به پیروی نکردن از فرد توصیف‌شده.">تُطِع</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَن</button>
    <button class="word-link" type="button" data-word="أَغفَلنا" data-root="غ ف ل" data-learn-more="/quran-terminology/fa/roots/gh-f-l/" data-root-meaning="بیرون ماندن یا بیرون گذاشتن چیزی از حوزهٔ توجه، مراقبت و پیگیری" data-context="غافل ساخته‌ایم؛ دربارهٔ دلِ شخص از یاد خداوند.">أَغفَلنا</button>
    <button class="word-link" type="button" data-word="قَلبَهُ" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق" data-context="دل او؛ موضوع غفلت از یاد.">قَلبَهُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِنا" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت" data-context="یاد ما؛ آنچه دل از آن غافل است.">ذِكرِنا</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="و پیروی کرد؛ دنبال کردن خواهش خود.">وَاتَّبَعَ</button>
    <button class="word-link" type="button" data-word="هَوىٰهُ" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس" data-context="خواهش او؛ چیزی که از آن پیروی می‌کند.">هَوىٰهُ</button>
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="و بود؛ بیان وضعیت کار او.">وَكانَ</button>
    <button class="word-link" type="button" data-word="أَمرُهُ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="کار او؛ رفتار و روش شخص توصیف‌شده.">أَمرُهُ</button>
    <button class="word-link" type="button" data-word="فُرُطًا" data-root="ف ر ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-tt/" data-root-meaning="پیش افتادن یا از حد گذشتن؛ تفریط: کوتاهی؛ افراط: زیاده‌روی." data-context="از حد گذشته و تباه؛ وصف کار او.">فُرُطًا</button>
  </p>
  <p class="farsi-verse">و خود را با کسانی شکیبا بدار که صبح و شام پروردگارشان را می‌خوانند و روی او را می‌خواهند؛ و چشمانت از آنان نگذرد، در حالی که زیور زندگی دنیا را می‌خواهی؛ و از کسی پیروی مکن که دلش را از یاد خود غافل کرده‌ایم و از هوسش پیروی کرده و کارش از حد گذشته است.</p>
</section>
