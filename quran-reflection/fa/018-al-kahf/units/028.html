  <p class="farsi-verse">و خود را با کسانی شکیبا بدار که صبح و شام پروردگارشان را می‌خوانند و روی او را می‌خواهند؛ و چشمانت از آنان نگذرد، در حالی که زیور زندگی دنیا را می‌خواهی؛ و از کسی پیروی مکن که دلش را از یاد خود غافل کرده‌ایم و از هوسش پیروی کرده و کارش از حد گذشته است.</p>
