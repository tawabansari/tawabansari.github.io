  <p class="farsi-verse">پس راه افتادند تا چون بر کشتی سوار شدند، آن را سوراخ کرد؛ گفت: آیا آن را سوراخ کردی تا سرنشینانش را غرق کنی؟ به‌راستی کاری سخت ناپسند کردی.</p>
