<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۷۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانطَلَقا" data-root="ط ل ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-l-q/" data-root-meaning="رها ساختن و به راه افتادن؛ طلاق: گسستن پیوند زناشویی." data-context="پس آن دو به راه افتادند؛ آغاز ادامهٔ سفر موسی و همراهش.">فَانطَلَقا</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="رَكِبا" data-root="ر ك ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-k-b/" data-root-meaning="سوار شدن، برهم قرار گرفتن و ترکیب یافتن." data-context="سوار شدند؛ آن دو بر کشتی نشستند.">رَكِبا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="السَّفينَةِ" data-root="س ف ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-f-n/" data-root-meaning="تراشیدن سطح؛ سفینه: کشتی." data-context="کشتی؛ وسیلهٔ دریایی که بر آن سوار شدند.">السَّفينَةِ</button>
    <button class="word-link" type="button" data-word="خَرَقَها" data-root="خ ر ق" data-root-meaning="شکافتن، سوراخ کردن و گذشتن از میان چیزی؛ در شاخهٔ گفتاری، برساختن سخن و نسبت بی‌پشتوانه." data-context="آن را سوراخ کرد؛ همراه موسی در کشتی شکاف ایجاد کرد." data-learn-more="/quran-terminology/fa/roots/kh-r-q/">خَرَقَها</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز پرسش و اعتراض موسی.">قالَ</button>
    <button class="word-link" type="button" data-word="أَخَرَقتَها" data-root="خ ر ق" data-root-meaning="شکافتن، سوراخ کردن و گذشتن از میان چیزی؛ در شاخهٔ گفتاری، برساختن سخن و نسبت بی‌پشتوانه." data-context="آیا آن را سوراخ کردی؟ پرسش موسی از همراهش؛ همزه برای پرسش است." data-learn-more="/quran-terminology/fa/roots/kh-r-q/">أَخَرَقتَها</button>
    <button class="word-link" type="button" data-word="لِتُغرِقَ" data-root="غ ر ق" data-learn-more="/quran-terminology/fa/roots/gh-r-q/" data-root-meaning="فرو رفتن در آب، فراگرفته‌شدن به‌گونه‌ای که راه رهایی بسته شود، و غرق‌کردن از راه احاطه کامل آب" data-context="تا غرق کنی؛ خطری که موسی در پرسش خود مطرح می‌کند، نه گزارش غرق شدن.">لِتُغرِقَ</button>
    <button class="word-link" type="button" data-word="أَهلَها" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="اهل آن؛ سرنشینان کشتی که موسی دربارهٔ آنان نگران است.">أَهلَها</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="جِئتَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="انجام داده‌ای؛ در تعبیر «جئت شیئاً»، آوردن و مرتکب شدن کاری.">جِئتَ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="چیزی؛ در این ساخت، کارِ انجام‌شده.">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="إِمرًا" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="بزرگ و ناپسند؛ وصف موسی از کارِ سوراخ کردن کشتی.">إِمرًا</button>
  </p>
  <p class="farsi-verse">پس راه افتادند تا چون بر کشتی سوار شدند، آن را سوراخ کرد؛ گفت: آیا آن را سوراخ کردی تا سرنشینانش را غرق کنی؟ به‌راستی کاری سخت ناپسند کردی.</p>
</section>
