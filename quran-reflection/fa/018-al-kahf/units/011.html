<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَضَرَبنا" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">فَضَرَبنا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ءاذانِهِم" data-root="أ ذ ن" data-learn-more="/quran-terminology/fa/roots/a-dh-n/" data-root-meaning="گوش، شنیدن، آگاه ساختن و اجازه دادن">ءاذانِهِم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الكَهفِ" data-root="ك ه ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الكَهفِ</button>
    <button class="word-link" type="button" data-word="سِنينَ" data-root="س ن و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سِنينَ</button>
    <button class="word-link" type="button" data-word="عَدَدًا" data-root="ع د د" data-learn-more="/quran-terminology/fa/roots/ayn-d-d/" data-root-meaning="شمار، اندازه، مدت تعیین‌شده، و آماده‌سازی سامان‌یافته برای هدفی مشخص">عَدَدًا</button>
  </p>
  <p class="farsi-verse">پس در غار، سال‌هایی چند بر گوش‌هایشان پرده زدیم.</p>
