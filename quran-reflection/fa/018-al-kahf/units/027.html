<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاتلُ" data-root="ت ل و" data-learn-more="/quran-terminology/fa/roots/t-l-w/" data-root-meaning="پی‌درپی آمدن، در پی چیزی حرکت کردن، دنبال کردن، و قرار گرفتن یک چیز در امتداد چیز دیگر">وَاتلُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أوحِىَ" data-root="و ح ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أوحِىَ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="كِتابِ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">كِتابِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="مُبَدِّلَ" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">مُبَدِّلَ</button>
    <button class="word-link" type="button" data-word="لِكَلِمٰتِهِ" data-root="ك ل م" data-learn-more="/quran-terminology/fa/roots/k-l-m/" data-root-meaning="سخن حامل معنا و اثر؛ کلامی که در شنونده، عهد، حکم، تاریخ یا واقعیت اثر می‌گذارد">لِكَلِمٰتِهِ</button>
    <button class="word-link" type="button" data-word="وَلَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَن</button>
    <button class="word-link" type="button" data-word="تَجِدَ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">تَجِدَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِهِ</button>
    <button class="word-link" type="button" data-word="مُلتَحَدًا" data-root="ل ح د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُلتَحَدًا</button>
  </p>
  <p class="farsi-verse">و آنچه از کتاب پروردگارت به تو وحی شده بخوان؛ هیچ دگرگون‌کننده‌ای برای سخنان او نیست و جز او پناهگاهی نمی‌یابی.</p>
</section>
