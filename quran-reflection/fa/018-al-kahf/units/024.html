<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۲۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَشاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">يَشاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">وَاذكُر</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="نَسيتَ" data-root="ن س ي" data-learn-more="/quran-terminology/fa/roots/n-s-y/" data-root-meaning="فراموش کردن، از یاد بردن، رها کردن از توجه، و بیرون گذاشتن چیزی از میدان حضور ذهن و عمل">نَسيتَ</button>
    <button class="word-link" type="button" data-word="وَقُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقُل</button>
    <button class="word-link" type="button" data-word="عَسىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَسىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَهدِيَنِ" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدِيَنِ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبّى</button>
    <button class="word-link" type="button" data-word="لِأَقرَبَ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب">لِأَقرَبَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="رَشَدًا" data-root="ر ش د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">رَشَدًا</button>
  </p>
  <p class="farsi-verse">مگر اینکه آن معبود یگانه بخواهد؛ و چون فراموش کردی، پروردگارت را یاد کن و بگو: امید است پروردگارم مرا به راهی درست‌تر و نزدیک‌تر از این هدایت کند.</p>
</section>
