  <p class="farsi-verse">و او ثمره‌ای داشت؛ پس به همراه خود، در حالی که با او گفت‌وگو می‌کرد، گفت: من از تو دارایی بیشتری دارم و از نظر نفرات نیرومندترم.</p>
