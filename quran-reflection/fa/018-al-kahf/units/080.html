  <h2 class="ayah-title">الکهف ۱۸:۸۰</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="الغُلٰمُ" data-root="غ ل م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الغُلٰمُ</button>
    <button class="word-link" type="button" data-word="فَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">فَكانَ</button>
    <button class="word-link" type="button" data-word="أَبَواهُ" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/">أَبَواهُ</button>

  <p class="farsi-verse">و اما پسر، پدر و مادرش مؤمن بودند؛ پس بیم داشتیم که آن دو را به سرکشی و کفر گرفتار کند.</p>
