<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الغُلٰمُ" data-root="غ ل م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-m/" data-root-meaning="پسر و نوجوان.">الغُلٰمُ</button>
    <button class="word-link" type="button" data-word="فَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَكانَ</button>
    <button class="word-link" type="button" data-word="أَبَواهُ" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">أَبَواهُ</button>
    <button class="word-link" type="button" data-word="مُؤمِنَينِ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">مُؤمِنَينِ</button>
    <button class="word-link" type="button" data-word="فَخَشينا" data-root="خ ش ي" data-learn-more="/quran-terminology/fa/roots/kh-sh-y/" data-root-meaning="بیم و ملاحظهٔ آگاهانه در برابر خطری شناخته‌شده یا پیامدی جدی، و خشیت اثرگذار در برابر آن معبود یگانه">فَخَشينا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يُرهِقَهُما" data-root="ر ه ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-h2-q/" data-root-meaning="فراگرفتن با فشار و سنگینی؛ تحمیل کردن و به رنج انداختن.">يُرهِقَهُما</button>
    <button class="word-link" type="button" data-word="طُغيٰنًا" data-root="ط غ ي" data-learn-more="/quran-terminology/fa/roots/tt-gh-y/" data-root-meaning="از طغیان تا طاغوت؛ از حد گذشتن، شکستن مرز، و نشستن مرجع باطل در جای حق">طُغيٰنًا</button>
    <button class="word-link" type="button" data-word="وَكُفرًا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران">وَكُفرًا</button>
  </p>
  <p class="farsi-verse">و اما پسر، پدر و مادرش مؤمن بودند؛ پس بیم داشتیم که آن دو را به سرکشی و کفر گرفتار کند.</p>
</section>
