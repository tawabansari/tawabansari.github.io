<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۹۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ءاتونى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="برای من بیاورید؛ قطعه‌های آهن را.">ءاتونى</button>
    <button class="word-link" type="button" data-word="زُبَرَ" data-root="ز ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-b-r/" data-root-meaning="نوشتن و نوشته‌ها؛ زبور: کتاب؛ زُبَر: قطعات بزرگ، مانند پاره‌های آهن." data-context="قطعه‌ها و توده‌ها؛ بخش‌های آهنِ به‌کاررفته در سازه.">زُبَرَ</button>
    <button class="word-link" type="button" data-word="الحَديدِ" data-root="ح د د" data-root-meaning="مرز و حد فاصل؛ بازداشتن، تیزی و برندگی." data-context="آهن؛ مادهٔ قطعه‌هایی که در ساخت مانع به کار می‌روند." data-learn-more="/quran-terminology/fa/roots/h-d-d/">الحَديدِ</button>
    ۖ
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="ساوىٰ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="برابر و هم‌سطح ساخت؛ فاصلهٔ میان دو سوی گذرگاه را.">ساوىٰ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان؛ نسبت دو سوی کوه و سازهٔ میان آنها.">بَينَ</button>
    <button class="word-link" type="button" data-word="الصَّدَفَينِ" data-root="ص د ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-d-f/" data-root-meaning="روی گرداندن؛ صدفین: دو جانب یا دیواره مقابل." data-context="دو سوی کوه یا دو کنارهٔ گذرگاه.">الصَّدَفَينِ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ فرمان دمیدن در فرایند ساخت.">قالَ</button>
    <button class="word-link" type="button" data-word="انفُخوا" data-root="ن ف خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-kh/" data-root-meaning="دمیدن و به جریان انداختن هوا." data-context="بدمید؛ فرمان دمیدن در فرایند گرم کردن.">انفُخوا</button>
    ۖ
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="جَعَلَهُ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="آن را گردانید و به آن حالت رساند؛ چون آتش.">جَعَلَهُ</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ وصف شدت گرمای حاصل در سازه.">نارًا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ فرمان بعدی دربارهٔ ریختن مادهٔ گداخته.">قالَ</button>
    <button class="word-link" type="button" data-word="ءاتونى" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="برای من بیاورید؛ در ادامهٔ فرمان‌های ساخت.">ءاتونى</button>
    <button class="word-link" type="button" data-word="أُفرِغ" data-root="ف ر غ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-gh/" data-root-meaning="تهی شدن و از کار فارغ شدن؛ افراغ: فرو ریختن." data-context="بریزم و فرو ریزم؛ مادهٔ گداخته را بر سازه.">أُفرِغ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="قِطرًا" data-root="ق ط ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-tt-r/" data-root-meaning="چکیدن؛ قِطر: مس گداخته؛ قطران: ماده قیرمانند؛ اقطار: نواحی و کرانه‌ها." data-context="مس گداخته؛ مادهٔ ریخته‌شده بر سازه.">قِطرًا</button>
  </p>
  <p class="farsi-verse">پاره‌های آهن برایم بیاورید؛ تا هنگامی که میان دو دامنه را هم‌سطح کرد، گفت: بدمید؛ تا هنگامی که آن را آتش کرد، گفت: برایم بیاورید تا مس گداخته بر آن بریزم.</p>
</section>
