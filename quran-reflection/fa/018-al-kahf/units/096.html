  <p class="farsi-verse">پاره‌های آهن برایم بیاورید؛ تا هنگامی که میان دو دامنه را هم‌سطح کرد، گفت: بدمید؛ تا هنگامی که آن را آتش کرد، گفت: برایم بیاورید تا مس گداخته بر آن بریزم.</p>
