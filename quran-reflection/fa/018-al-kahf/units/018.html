<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَحسَبُهُم" data-root="ح س ب" data-root-meaning="حساب، شمردن و سنجیدن مقدار یا عملکرد است؛ « حَسِبَ »، پنداشتن و ارزیابی ذهنی است؛ حَسْب، کفایت و بسندگی است؛ و دیگر مشتق‌ها، مانند حسیب و حسبان، بر اساس ساخت و سیاق خود معنا می‌یابند." data-learn-more="/quran-terminology/fa/roots/h-s-b/">وَتَحسَبُهُم</button>
    <button class="word-link" type="button" data-word="أَيقاظًا" data-root="ي ق ظ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-q-zha/" data-root-meaning="بیداری و هشیاری.">أَيقاظًا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="رُقودٌ" data-root="ر ق د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-q-d/" data-root-meaning="خوابیدن و آرام گرفتن؛ مرقد: خوابگاه یا آرامگاه.">رُقودٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنُقَلِّبُهُم" data-root="ق ل ب" data-learn-more="/quran-terminology/fa/roots/q-l-b/" data-root-meaning="دگرگونی، برگشت، زیرورو شدن، مرکز درونی انسان، و جهت‌گیری در برابر حق">وَنُقَلِّبُهُم</button>
    <button class="word-link" type="button" data-word="ذاتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذاتَ</button>
    <button class="word-link" type="button" data-word="اليَمينِ" data-root="ي م ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/y-m-n/" data-root-meaning="سمت راست و دست راست؛ یمین: سوگند؛ نیز یُمن و نیک‌فرجامی.">اليَمينِ</button>
    <button class="word-link" type="button" data-word="وَذاتَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَذاتَ</button>
    <button class="word-link" type="button" data-word="الشِّمالِ" data-root="ش م ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-l/" data-root-meaning="چپ؛ نیز دربرگرفتن و پوشاندن.">الشِّمالِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَلبُهُم" data-root="ك ل ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-l-b/" data-root-meaning="سگ؛ تکلیب: تربیت جانور برای شکار.">وَكَلبُهُم</button>
    <button class="word-link" type="button" data-word="بٰسِطٌ" data-root="ب س ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-s-tt/" data-root-meaning="گشودن، گستردن و فراخ کردن؛ بسط می‌تواند مادی یا مربوط به توان و امکانات باشد.">بٰسِطٌ</button>
    <button class="word-link" type="button" data-word="ذِراعَيهِ" data-root="ذ ر ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-ayn/" data-root-meaning="ساعد و ذراع؛ نیز اندازه‌گیری و توان گنجایش یا تحمل.">ذِراعَيهِ</button>
    <button class="word-link" type="button" data-word="بِالوَصيدِ" data-root="و ص د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-sad-d/" data-root-meaning="بستن و محکم پوشاندن؛ وصید: آستانه یا فضای ورودی.">بِالوَصيدِ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَوِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَوِ</button>
    <button class="word-link" type="button" data-word="اطَّلَعتَ" data-root="ط ل ع" data-root-meaning="ط ل ع در هسته شناخته‌شده خود به برآمدن و آشکار شدن مربوط است. در کاربردهای طبیعی، پدیدار شدن خورشید و سر برآوردن محصول گیاه را بیان می‌کند؛ در کاربردهای مربوط به انسان، می‌تواند به مشاهده یا آگاه شدن از چیزی اشاره کند که پیش‌تر در دسترس او نبوده است؛ و در بعضی ساخت‌ها، معنای رسیدن به جایگاهی را می‌رساند." data-learn-more="/quran-terminology/fa/roots/tt-l-ayn/">اطَّلَعتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="لَوَلَّيتَ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">لَوَلَّيتَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="فِرارًا" data-root="ف ر ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-r/" data-root-meaning="گریختن و دور شدن.">فِرارًا</button>
    <button class="word-link" type="button" data-word="وَلَمُلِئتَ" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه.">وَلَمُلِئتَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="رُعبًا" data-root="ر ع ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-ayn-b/" data-root-meaning="ترس شدید و هراس.">رُعبًا</button>
  </p>
  <p class="farsi-verse">و آنان را بیدار می‌پنداری، در حالی که خوابیده‌اند؛ و آنان را به سمت راست و سمت چپ می‌گردانیم، و سگشان دو دست خود را بر آستانه گشوده است؛ اگر بر آنان آگاه می‌شدی، از آنان می‌گریختی و از آنان آکنده از ترس می‌شدی.</p>
</section>
