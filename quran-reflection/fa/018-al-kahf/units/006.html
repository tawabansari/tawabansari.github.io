<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَعَلَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَعَلَّكَ</button>
    <button class="word-link" type="button" data-word="بٰخِعٌ" data-root="ب خ ع" data-root-meaning="کشتن و از پا درآوردن؛ نیز فرسودن توان، کوشش تا سرحد توان و تسلیم شدن، بسته به ساخت و سیاق." data-learn-more="/quran-terminology/fa/roots/b-kh-ayn/" data-context="گویی از شدت اندوه، جان خود را به هلاکت می‌رسانی؛ خطاب به پیامبر">بٰخِعٌ</button>
    <button class="word-link" type="button" data-word="نَفسَكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="جانِ خودت؛ خویشتنِ مخاطب">نَفسَكَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ءاثٰرِهِم" data-root="أ ث ر" data-learn-more="/quran-terminology/fa/roots/a-th-r/" data-root-meaning="نشانه‌ها، ردپاها، بازمانده‌ها یا پیامدها." data-context="آثار آنان؛ در این ترکیب، در پیِ روی‌گردانی آنان">ءاثٰرِهِم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يُؤمِنوا" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="ایمان بیاورند؛ در بندِ شرطیِ منفی آمده است">يُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِهٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهٰذَا</button>
    <button class="word-link" type="button" data-word="الحَديثِ" data-root="ح د ث" data-learn-more="/quran-terminology/fa/roots/h-d-th/" data-root-meaning="از پدید آمدن تا سخنی که بازگو می‌شود" data-context="این سخن؛ گفتار وحی‌شده و در این سیاق قرآن">الحَديثِ</button>
    <button class="word-link" type="button" data-word="أَسَفًا" data-root="أ س ف" data-learn-more="/quran-terminology/fa/roots/a-s-f/" data-root-meaning="متاثر شدن شدید در برابر امری ناگوار، به‌گونه‌ای که این تاثیر به صورت اندوه، دریغ، آزردگی یا خشم آشکار شود." data-context="از اندوه و تأثر شدید بر ایمان نیاوردن آنان">أَسَفًا</button>
  </p>
  <p class="farsi-verse">پس شاید اگر به این سخن ایمان نیاورند، در پی آنان از اندوه جان خود را از دست بدهی.</p>
</section>
