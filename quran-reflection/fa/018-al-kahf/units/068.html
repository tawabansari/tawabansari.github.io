<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَيفَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَكَيفَ</button>
    <button class="word-link" type="button" data-word="تَصبِرُ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">تَصبِرُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تُحِط" data-root="ح و ط" data-learn-more="/quran-terminology/fa/roots/h-w-tt/" data-root-meaning="احاطه کردن، دربرگرفتن، پیرامون چیزی را گرفتن، از همه سو فراگرفتن؛ و در برخی کاربردها، نگاهبانی، مراقبت، یا محاصره">تُحِط</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>

  </p>
  <p class="farsi-verse">و چگونه بر چیزی که به آگاهی آن احاطه نداری شکیبایی می‌کنی؟</p>
