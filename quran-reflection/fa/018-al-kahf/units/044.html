    <button class="word-link" type="button" data-word="الحَقِّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/">الحَقِّ</button>

  <p class="farsi-verse">آنجا سرپرستی از آنِ آن معبود یگانه حق است؛ او در پاداش بهتر و در فرجام بهتر است.</p>
