<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="نُرسِلُ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="می‌فرستیم؛ دربارهٔ فرستادگان.">نُرسِلُ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادگان؛ مأمورانِ بشارت و هشدار.">المُرسَلينَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="مُبَشِّرينَ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="بشارت‌دهندگان؛ یکی از نقش‌های فرستادگان.">مُبَشِّرينَ</button>
    <button class="word-link" type="button" data-word="وَمُنذِرينَ" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="و هشداردهندگان؛ نقش دیگر فرستادگان.">وَمُنذِرينَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيُجٰدِلُ" data-root="ج د ل" data-root-meaning="رویارویی و رفت‌وبرگشت گفتار برای طرح، دفاع، پاسخ یا مقابله با یک موضع؛ ارزش آن به موضوع، دلیل و روش وابسته است." data-context="کافران با باطل مجادله می‌کنند تا حق را بی‌اعتبار جلوه دهند." data-learn-more="/quran-terminology/fa/roots/j-d-l/">وَيُجٰدِلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیده‌اند؛ وصفِ مجادله‌کنندگان با باطل.">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِالبٰطِلِ" data-root="ب ط ل" data-learn-more="/quran-terminology/fa/roots/b-tt-l/" data-root-meaning="بی‌پایه شدن، فروپاشیدن، بی‌اثر و بی‌حقیقت بودن" data-context="با باطل؛ وسیله و محتوای مجادله.">بِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="لِيُدحِضوا" data-root="د ح ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/d-h-dad/" data-root-meaning="لغزیدن؛ مجازاً از اعتبار انداختن یا باطل شدن حجت." data-context="تا از اعتبار بیندازند؛ هدفِ جدال با باطل.">لِيُدحِضوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="ح ق ق" data-learn-more="/quran-terminology/fa/roots/h-q-q/" data-root-meaning="ثبوت، تحقق، واقعیت پایدار، درستی مطابق با واقع، سهم ثابت، و الزام برخاسته از حقیقت" data-context="حق؛ آنچه می‌خواهند با باطل کنار بزنند.">الحَقَّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاتَّخَذوا" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="و گرفتند و قرار دادند؛ دربارهٔ موضوعِ تمسخر.">وَاتَّخَذوا</button>
    <button class="word-link" type="button" data-word="ءايٰتى" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="آیات من؛ آنچه به تمسخر گرفته‌اند.">ءايٰتى</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أُنذِروا" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد" data-context="هشدار داده شده‌اند؛ دربارهٔ امورِ مورد انذار.">أُنذِروا</button>
    <button class="word-link" type="button" data-word="هُزُوًا" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد" data-context="به تمسخر؛ نوعِ برخورد آنان با آیات و هشدارها.">هُزُوًا</button>
  </p>
  <p class="farsi-verse">و فرستادگان را جز بشارت‌دهنده و هشداردهنده نمی‌فرستیم؛ و کسانی که کافر شده‌اند با باطل جدال می‌کنند تا به‌وسیله آن حق را از میان ببرند؛ و نشانه‌های من و آنچه را با آن بیم داده شده‌اند به ریشخند گرفته‌اند.</p>
</section>
