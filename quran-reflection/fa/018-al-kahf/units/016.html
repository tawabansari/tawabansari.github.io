  <p class="farsi-verse">و چون از آنان و آنچه جز آن معبود یگانه می‌پرستند کناره گرفتید، به غار پناه برید تا پروردگارتان از رحمت خود بر شما بگستراند و در کارتان آسایشی برایتان فراهم کند.</p>
