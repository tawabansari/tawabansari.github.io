<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="بَعَثنٰهُم" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه.">بَعَثنٰهُم</button>
    <button class="word-link" type="button" data-word="لِنَعلَمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">لِنَعلَمَ</button>
    <button class="word-link" type="button" data-word="أَىُّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَىُّ</button>
    <button class="word-link" type="button" data-word="الحِزبَينِ" data-root="ح ز ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-z-b/" data-root-meaning="گروه و دسته‌ای که با هم پیوند یا همراهی دارند.">الحِزبَينِ</button>
    <button class="word-link" type="button" data-word="أَحصىٰ" data-root="ح ص ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sad-y/" data-root-meaning="ریگ و سنگ‌ریزه؛ احصاء: شمردن و به‌دقت در شمار آوردن.">أَحصىٰ</button>
    <button class="word-link" type="button" data-word="لِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِما</button>
    <button class="word-link" type="button" data-word="لَبِثوا" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان.">لَبِثوا</button>
    <button class="word-link" type="button" data-word="أَمَدًا" data-root="أ م د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-m-d/" data-root-meaning="مدت و فاصلهٔ زمانی با نظر به پایان یا حد آن.">أَمَدًا</button>
  </p>
  <p class="farsi-verse">سپس آنان را برانگیختیم تا بدانیم کدام‌یک از دو گروه مدت ماندنشان را بهتر شمرده است.</p>
</section>
