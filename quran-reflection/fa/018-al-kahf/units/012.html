<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۱۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="بَعَثنٰهُم" data-root="ب ع ث" data-learn-more="/quran-terminology/fa/roots/b-ayn-th/" data-root-meaning="برانگیختن و به حرکت درآوردن از حالتی از توقف، خواب، مرگ یا بی‌عملی؛ و روانه ساختن برای وضع یا مأموریتی تازه." data-context="سپس بیدارشان کردیم؛ بیرون آوردن اصحاب کهف از خواب، نه سخن مستقیم از رستاخیز مردگان.">بَعَثنٰهُم</button>
    <button class="word-link" type="button" data-word="لِنَعلَمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="تا بدانیم؛ غایت بیان‌شده برای بیدار کردن آنان، در پیوند با آشکار شدن نتیجه شناخت مدت درنگ.">لِنَعلَمَ</button>
    <button class="word-link" type="button" data-word="أَىُّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَىُّ</button>
    <button class="word-link" type="button" data-word="الحِزبَينِ" data-root="ح ز ب" data-root-meaning="گرد آمدن و تشکیل مجموعه؛ گروهی از افراد با پیوند، موضع یا هدف مشترک." data-context="دو گروه؛ گروه‌هایی که شناخت یا شمارش مدت درنگشان سنجیده می‌شود، بی‌آنکه هویت دقیقشان در این آیه نام برده شود." data-learn-more="/quran-terminology/fa/roots/h-z-b/">الحِزبَينِ</button>
    <button class="word-link" type="button" data-word="أَحصىٰ" data-root="ح ص ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h-sad-y/" data-root-meaning="ریگ و سنگ‌ریزه؛ احصاء: شمردن و به‌دقت در شمار آوردن." data-context="مدت را به‌درستی شمارش کرده است؛ یا در تحلیل تفضیلی، در شمارش دقیق‌تر بوده است.">أَحصىٰ</button>
    <button class="word-link" type="button" data-word="لِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِما</button>
    <button class="word-link" type="button" data-word="لَبِثوا" data-root="ل ب ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-b-th/" data-root-meaning="درنگ و ماندن در زمان یا مکان." data-context="درنگ کردند و ماندند؛ مدت ماندن اصحاب کهف موضوع آیه است.">لَبِثوا</button>
    <button class="word-link" type="button" data-word="أَمَدًا" data-root="أ م د" data-learn-more="/quran-terminology/fa/roots/a-m-d/" data-root-meaning="کرانه یا نهایتی که یک فاصله یا امتداد به آن می‌رسد؛ و در کاربرد زمانی، مدت یا فاصله‌ای که با توجه به آغاز، پایان یا نقطه مورد انتظار سنجیده می‌شود." data-context="مدت درنگ آنان؛ امتداد زمانی‌ای که موضوع شناخت و شمارش است، نه خودِ عدد.">أَمَدًا</button>
  </p>
  <p class="farsi-verse">سپس آنان را برانگیختیم تا بدانیم کدام‌یک از دو گروه مدت ماندنشان را بهتر شمرده است.</p>
</section>
