<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاضرِب" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت" data-context="و برای آنان مثال بیاور؛ فرمان به بیان نمونه‌ای برای روشن شدن موضوع.">وَاضرِب</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="مثالی؛ نمونه‌ای دربارهٔ دو مرد که موضوع گفتار بعدی است.">مَثَلًا</button>
    <button class="word-link" type="button" data-word="رَجُلَينِ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="دو مرد؛ دو شخصی که در این مثال با یکدیگر مقایسه می‌شوند.">رَجُلَينِ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="قرار دادیم و فراهم ساختیم؛ بیان بخشیدن دو باغ به یکی از آن دو مرد.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="لِأَحَدِهِما" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="برای یکی از آن دو؛ مشخص کردن شخص برخوردار از باغ‌ها.">لِأَحَدِهِما</button>
    <button class="word-link" type="button" data-word="جَنَّتَينِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="دو باغ؛ در اینجا دو باغ انگور که پیرامونشان نخل قرار دارد.">جَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَعنٰبٍ" data-root="ع ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-b/" data-root-meaning="انگور و تاک." data-context="انگورها و تاک‌ها؛ بیان نوع گیاهِ دو باغ.">أَعنٰبٍ</button>
    <button class="word-link" type="button" data-word="وَحَفَفنٰهُما" data-root="ح ف ف" data-root-meaning="در کاربرد قرآنی، قرار گرفتن یا قرار دادن چیزی در پیرامون چیز دیگر." data-context="و آن دو باغ را با نخل‌ها احاطه کردیم؛ نخل‌ها را در پیرامونشان قرار دادیم." data-learn-more="/quran-terminology/fa/roots/h-f-f/">وَحَفَفنٰهُما</button>
    <button class="word-link" type="button" data-word="بِنَخلٍ" data-root="ن خ ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-kh-l/" data-root-meaning="درخت خرما و نخلستان." data-context="با نخل‌ها؛ درختان خرمایی که پیرامون دو باغ قرار داده شده‌اند.">بِنَخلٍ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص" data-context="و قرار دادیم؛ فراهم ساختن کشتزار میان دو باغ.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="میان آن دو باغ؛ تعیین جای کشتزار نسبت به باغ‌ها.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="زَرعًا" data-root="ز ر ع" data-learn-more="/quran-terminology/fa/roots/z-r-ayn/" data-root-meaning="قرار دادن بذر، رویش، رشد گیاه و پیدایش محصول" data-context="کشتزاری؛ کشت و محصولی که میان دو باغ قرار داده شده است.">زَرعًا</button>
  </p>
  <p class="farsi-verse">و برای آنان مَثَل دو مرد را بزن که برای یکی از آن دو، دو باغ انگور قرار دادیم و آنها را با نخل‌ها احاطه کردیم و میانشان کشتزاری قرار دادیم.</p>
</section>
