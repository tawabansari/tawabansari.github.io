<section class="ayah-block" id="ayah-110" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۱۱۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="بگو؛ فرمان بیان پیام بعدی.">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنا۠</button>
    <button class="word-link" type="button" data-word="بَشَرٌ" data-root="ب ش ر" data-learn-more="/quran-terminology/fa/roots/b-sh-r/" data-root-meaning="ظاهر انسان، چهره آشکار، اثر خبر بر حال انسان، و تماس مستقیم" data-context="انسانی؛ وصف پیام‌آور در همانندی با مخاطبان.">بَشَرٌ</button>
    <button class="word-link" type="button" data-word="مِثلُكُم" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان" data-context="همانند شما؛ در بشر بودن.">مِثلُكُم</button>
    <button class="word-link" type="button" data-word="يوحىٰ" data-root="و ح ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-h-y/" data-root-meaning="اشاره و رساندن سریع و پوشیده پیام؛ وحی، با فاعل و گیرنده‌های گوناگون بنا بر سیاق." data-context="به من وحی می‌شود.">يوحىٰ</button>
    <button class="word-link" type="button" data-word="إِلَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَىَّ</button>
    <button class="word-link" type="button" data-word="أَنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّما</button>
    <button class="word-link" type="button" data-word="إِلٰهُكُم" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبود شما؛ در بیان یگانگی معبود.">إِلٰهُكُم</button>
    <button class="word-link" type="button" data-word="إِلٰهٌ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه" data-context="معبودی؛ در ترکیب معبود یگانه.">إِلٰهٌ</button>
    <button class="word-link" type="button" data-word="وٰحِدٌ" data-root="و ح د" data-learn-more="/quran-terminology/fa/roots/w-h-d/" data-root-meaning="یکی بودن، یگانه بودن، تنها بودن و یگانه شمردن" data-context="یگانه؛ وصف معبود.">وٰحِدٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشد؛ در شرط امید به لقاء.">كانَ</button>
    <button class="word-link" type="button" data-word="يَرجوا" data-root="ر ج و" data-learn-more="/quran-terminology/fa/roots/r-j-w/" data-root-meaning="امید و انتظار؛ رَجَا در شاخهٔ مکانی، کناره و جانب است. صورت‌های بدون همزهٔ تأخیر با إرجاء و ریشهٔ ر ج أ پیوند دارند و از امید جدا بررسی می‌شوند." data-context="به دیدار پروردگارش امید یا انتظار دارد.">يَرجوا</button>
    <button class="word-link" type="button" data-word="لِقاءَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="دیدار پروردگار؛ متعلق امید.">لِقاءَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار او؛ کسی که دیدارش را امید دارد.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="فَليَعمَل" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="پس باید کار شایسته انجام دهد.">فَليَعمَل</button>
    <button class="word-link" type="button" data-word="عَمَلًا" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="کاری؛ موضوع فرمانِ عمل شایسته.">عَمَلًا</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته؛ وصف عمل.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُشرِك" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریک قرار ندهد؛ در عبادت پروردگار.">يُشرِك</button>
    <button class="word-link" type="button" data-word="بِعِبادَةِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="در عبادت و پرستش؛ جایگاهی که شرکت در آن نفی می‌شود.">بِعِبادَةِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگار او؛ موضوع عبادت.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="أَحَدًا" data-root="أ ح د" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-context="هیچ‌کس؛ در نفی شریک قرار دادن.">أَحَدًا</button>
  </p>
  <p class="farsi-verse">بگو: من تنها انسانی همانند شما هستم؛ به من وحی می‌شود که معبود شما تنها معبودی یگانه است؛ پس هر که به دیدار پروردگارش امید دارد، باید کار شایسته کند و در پرستش پروردگارش هیچ‌کس را شریک نسازد.</p>
</section>
