<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۹۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَقَد</button>
    <button class="word-link" type="button" data-word="أَحَطنا" data-root="ح و ط" data-learn-more="/quran-terminology/fa/roots/h-w-tt/" data-root-meaning="احاطه کردن، دربرگرفتن، پیرامون چیزی را گرفتن، از همه سو فراگرفتن؛ و در برخی کاربردها، نگاهبانی، مراقبت، یا محاصره" data-context="احاطه یافتیم؛ علم فراگیر خداوند به آنچه نزد اوست.">أَحَطنا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="لَدَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَدَيهِ</button>
    <button class="word-link" type="button" data-word="خُبرًا" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="شناختی؛ آگاهی فراگیر خداوند به آنچه نزد ذوالقرنین است." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">خُبرًا</button>
  </p>
  <p class="farsi-verse">چنین بود؛ و ما به آنچه نزد او بود آگاهی کامل داشتیم.</p>
</section>
