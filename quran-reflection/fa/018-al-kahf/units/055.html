  <p class="farsi-verse">و چیزی مردم را، هنگامی که هدایت به آنان رسید، از ایمان آوردن و آمرزش خواستن از پروردگارشان بازنداشت، جز اینکه روش پیشینیان بر آنان بیاید یا عذاب رویاروی به آنان برسد.</p>
