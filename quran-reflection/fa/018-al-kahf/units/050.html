<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قُلنا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قُلنا</button>
    <button class="word-link" type="button" data-word="لِلمَلٰئِكَةِ" data-root="أ ل ك / م ل ك" data-learn-more="/quran-terminology/fa/roots/a-l-k/" data-root-note="اشتقاق «مَلَک / مَلائکه» مورد اختلاف است. این مطالعه پیوند احتمالی با أ ل ك را بررسی می‌کند؛ پیکرهٔ عربی قرآن این واژه‌ها را زیر م ل ك فهرست می‌کند." data-root-meaning="پیام و پیام‌آوری؛ نسبت احتمالی با مَلَك و جایگاه ملائکه در قرآن">لِلمَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="اسجُدوا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">اسجُدوا</button>
    <button class="word-link" type="button" data-word="لِـٔادَمَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">لِـٔادَمَ</button>
    <button class="word-link" type="button" data-word="فَسَجَدوا" data-root="س ج د" data-learn-more="/quran-terminology/fa/roots/s-j-d/" data-root-meaning="فرو آمدن، خضوع کردن، سر فرود آوردن، و قرار گرفتن در حالت تسلیم">فَسَجَدوا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="إِبليسَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبليسَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِنِّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">الجِنِّ</button>
    <button class="word-link" type="button" data-word="فَفَسَقَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن">فَفَسَقَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَفَتَتَّخِذونَهُ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">أَفَتَتَّخِذونَهُ</button>
    <button class="word-link" type="button" data-word="وَذُرِّيَّتَهُ" data-root="ذ ر ر" data-learn-more="/quran-terminology/fa/roots/dh-r-r/" data-root-meaning="ذَرَّة؛ کوچکی محسوس، و ذُرِّيَّة؛ نسل و مسئله منشأ واژه">وَذُرِّيَّتَهُ</button>
    <button class="word-link" type="button" data-word="أَولِياءَ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">أَولِياءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونى" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونى</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">عَدُوٌّ</button>
    ۚ
    <button class="word-link" type="button" data-word="بِئسَ" data-root="ب أ س" data-learn-more="/quran-terminology/fa/roots/b-a-s/" data-root-meaning="شدت، سختی و امر ناگوار">بِئسَ</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="بَدَلًا" data-root="ب د ل" data-learn-more="/quran-terminology/fa/roots/b-d-l/" data-root-meaning="عوض کردن، چیزی را به جای چیز دیگر نشاندن، تغییر جایگاه یا معنا.">بَدَلًا</button>
  </p>
  <p class="farsi-verse">و آنگاه که به فرشتگان گفتیم: برای آدم سجده کنید؛ پس سجده کردند جز ابلیس؛ او از جن بود و از فرمان پروردگارش سرپیچی کرد؛ آیا او و نسلش را به جای من سرپرست می‌گیرید، در حالی که دشمن شمایند؟ چه بد جایگزینی برای ستمگران‌اند.</p>
</section>
