<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانطَلَقا" data-root="ط ل ق" data-learn-more="/quran-terminology/fa/roots/tt-l-q/" data-root-meaning="رها ساختن و گشودن قید؛ به راه افتادن و روان شدن؛ در ازدواج، طلاق و پایان دادن به پیوند زناشویی." data-context="پس آن دو به راه افتادند؛ موسی و همراهش.">فَانطَلَقا</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="لَقِيا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="آن دو برخورد کردند؛ با پسری.">لَقِيا</button>
    <button class="word-link" type="button" data-word="غُلٰمًا" data-root="غ ل م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-m/" data-root-meaning="پسر و نوجوان." data-context="پسری؛ شخصی که با او روبه‌رو شدند.">غُلٰمًا</button>
    <button class="word-link" type="button" data-word="فَقَتَلَهُ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="پس او را کشت؛ همراه موسی آن پسر را.">فَقَتَلَهُ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ موسی در اعتراض.">قالَ</button>
    <button class="word-link" type="button" data-word="أَقَتَلتَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="آیا کشتی؛ پرسش اعتراضی موسی.">أَقَتَلتَ</button>
    <button class="word-link" type="button" data-word="نَفسًا" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="جانی؛ انسانی که کشته شد.">نَفسًا</button>
    <button class="word-link" type="button" data-word="زَكِيَّةً" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری" data-context="پاک و بی‌گناه؛ وصف آن جان در سخن موسی.">زَكِيَّةً</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین" data-context="بدون؛ در نبود قتلِ جان دیگری.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="جانی دیگر؛ در بیان نبود مقابله به قتل.">نَفسٍ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="جِئتَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="انجام دادی؛ به چنین کاری دست زدی.">جِئتَ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="کاری؛ عمل مورد اعتراض.">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="نُكرًا" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص" data-context="ناپسند و سخت نکوهیده؛ داوری موسی درباره آن کار.">نُكرًا</button>
  </p>
  <p class="farsi-verse">پس راه افتادند تا چون به پسری برخوردند، او را کشت؛ گفت: آیا جانی پاک را بی‌آنکه جانی کشته باشد کشتی؟ به‌راستی کاری زشت کردی.</p>
</section>
