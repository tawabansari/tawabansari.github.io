<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۷۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانطَلَقا" data-root="ط ل ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَانطَلَقا</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="لَقِيا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">لَقِيا</button>
    <button class="word-link" type="button" data-word="غُلٰمًا" data-root="غ ل م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">غُلٰمًا</button>
    <button class="word-link" type="button" data-word="فَقَتَلَهُ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">فَقَتَلَهُ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="أَقَتَلتَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان">أَقَتَلتَ</button>
    <button class="word-link" type="button" data-word="نَفسًا" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسًا</button>
    <button class="word-link" type="button" data-word="زَكِيَّةً" data-root="ز ك و / ز ك ي" data-learn-more="/quran-terminology/fa/roots/z-k-w/" data-root-meaning="پاک شدن، رشد کردن، بالیدن، افزوده شدن در حالت سالم، و رسیدن به صلاح و باروری">زَكِيَّةً</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسٍ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="جِئتَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه">جِئتَ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="نُكرًا" data-root="ن ك ر" data-learn-more="/quran-terminology/fa/roots/n-k-r/" data-root-meaning="ناشناختگی، بیگانگی، ناهمواری، ناپسندی، انکار، و دگرگون شدن از حالت آشنا و قابل تشخیص">نُكرًا</button>
  </p>
  <p class="farsi-verse">پس راه افتادند تا چون به پسری برخوردند، او را کشت؛ گفت: آیا جانی پاک را بی‌آنکه جانی کشته باشد کشتی؟ به‌راستی کاری زشت کردی.</p>
</section>
