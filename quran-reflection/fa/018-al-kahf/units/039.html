  <p class="farsi-verse">و چرا هنگامی که وارد باغت شدی نگفتی: آنچه آن معبود یگانه بخواهد؛ هیچ نیرویی جز به آن معبود یگانه نیست؟ اگر مرا در دارایی و فرزند کمتر از خود می‌بینی،</p>
