<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۵۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَرَءَا" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی" data-context="و دیدند">وَرَءَا</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="ج ر م" data-root-meaning="بریدن و جدا کردن؛ کسب کردن و به دست آوردن؛ و در شاخه‌ای دیگر، ارتکاب جرم و کردار ناپسند." data-context="مجرمان؛ کسانی که مرتکب کردار ناپسند شده‌اند" data-learn-more="/quran-terminology/fa/roots/j-r-m/">المُجرِمونَ</button>
    <button class="word-link" type="button" data-word="النّارَ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش">النّارَ</button>
    <button class="word-link" type="button" data-word="فَظَنّوا" data-root="ظ ن ن" data-learn-more="/quran-terminology/fa/roots/zha-n-n/" data-root-meaning="گمان، دریافت غالب، انتظار جدی، و محاسبه‌ای ذهنی که یکی از احتمال‌ها را سنگین‌تر می‌سازد" data-context="پس گمان و یقین کردند">فَظَنّوا</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="مُواقِعوها" data-root="و ق ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-q-ayn/" data-root-meaning="افتادن، رخ دادن و تحقق یافتن." data-context="در آن خواهند افتاد">مُواقِعوها</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="يَجِدوا" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="بیابند؛ در ساخت نفی، نیافتند">يَجِدوا</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَنها</button>
    <button class="word-link" type="button" data-word="مَصرِفًا" data-root="ص ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-f/" data-root-meaning="برگرداندن و دگرگون کردن؛ تصریف: گرداندن یا گوناگون بیان کردن." data-context="راه گریز و روی‌گرداندن">مَصرِفًا</button>
  </p>
  <p class="farsi-verse">و مجرمان آتش را می‌بینند و می‌دانند که در آن خواهند افتاد و راه گریزی از آن نمی‌یابند.</p>
</section>
