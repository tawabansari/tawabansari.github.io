<section class="ayah-block" id="ayah-099" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۹۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَكنا" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی">وَتَرَكنا</button>
    <button class="word-link" type="button" data-word="بَعضَهُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/">بَعضَهُم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَموجُ" data-root="م و ج" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَموجُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/">بَعضٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَنُفِخَ" data-root="ن ف خ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَنُفِخَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="ص و ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الصّورِ</button>
    <button class="word-link" type="button" data-word="فَجَمَعنٰهُم" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/">فَجَمَعنٰهُم</button>
    <button class="word-link" type="button" data-word="جَمعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/">جَمعًا</button>
  </p>
  <p class="farsi-verse">و در آن روز برخی را رها می‌کنیم که در برخی دیگر موج زنند؛ و در صور دمیده می‌شود، پس همه را گرد می‌آوریم.</p>
