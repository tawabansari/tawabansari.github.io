<section class="ayah-block" id="ayah-099" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۹۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَكنا" data-root="ت ر ك" data-learn-more="/quran-terminology/fa/roots/t-r-k/" data-root-meaning="رها کردن، واگذاشتن، دست کشیدن، باقی گذاشتن، و تغییر رابطه فعال با چیزی" data-context="و واگذاشتیم؛ در توصیف وضعیت گروه‌ها در آن روز">وَتَرَكنا</button>
    <button class="word-link" type="button" data-word="بَعضَهُم" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی از آنان؛ بخشی از جماعت یادشده">بَعضَهُم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="در آن روز؛ زمان صحنهٔ توصیف‌شده">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَموجُ" data-root="م و ج" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-w-j/" data-root-meaning="موج و حرکت موج‌وار." data-context="موج می‌زند و درهم می‌آمیزد؛ حرکت گروه‌ها در میان یکدیگر">يَموجُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="ب ع ض" data-learn-more="/quran-terminology/fa/roots/b-ayn-dad/" data-root-meaning="بخش، جزء، پاره‌ای از کل، نسبت میان اجزا، و پشه به عنوان نمونه‌ای کوچک در مثل الهی" data-context="برخی دیگر؛ در بیان حرکت آنان در میان یکدیگر">بَعضٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَنُفِخَ" data-root="ن ف خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-f-kh/" data-root-meaning="دمیدن و به جریان انداختن هوا." data-context="و دمیده شد؛ بیان دمیدن در صور">وَنُفِخَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="ص و ر" data-learn-more="/quran-terminology/fa/roots/sad-w-r/" data-root-meaning="صورت، شکل و هیئت؛ صورت بخشیدن و شکل دادن. در شاخه‌ای دیگر، مایل شدن و مایل کردن؛ و در کاربرد مستقل «الصُّور»، شیپور یا شاخِ دمیدنی." data-context="صور؛ آنچه در آن دمیده می‌شود و گردآوری انسان‌ها در پی آن می‌آید">الصّورِ</button>
    <button class="word-link" type="button" data-word="فَجَمَعنٰهُم" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="پس آنان را گرد آوردیم؛ جمع کردن همهٔ آنان">فَجَمَعنٰهُم</button>
    <button class="word-link" type="button" data-word="جَمعًا" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="گردآوردنی؛ تأکید بر گردآوری آنان">جَمعًا</button>
  </p>
  <p class="farsi-verse">و در آن روز برخی را رها می‌کنیم که در برخی دیگر موج زنند؛ و در صور دمیده می‌شود، پس همه را گرد می‌آوریم.</p>
</section>
