<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۵۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">يَقولُ</button>
    <button class="word-link" type="button" data-word="نادوا" data-root="ن د و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">نادوا</button>
    <button class="word-link" type="button" data-word="شُرَكاءِىَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد">شُرَكاءِىَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="زَعَمتُم" data-root="ز ع م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">زَعَمتُم</button>
    <button class="word-link" type="button" data-word="فَدَعَوهُم" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">فَدَعَوهُم</button>
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَم</button>
    <button class="word-link" type="button" data-word="يَستَجيبوا" data-root="ج و ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَستَجيبوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُم</button>
    <button class="word-link" type="button" data-word="مَوبِقًا" data-root="و ب ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَوبِقًا</button>
  </p>
  <p class="farsi-verse">و روزی که می‌گوید: شریکانی را که برای من می‌پنداشتید بخوانید؛ پس آنان را می‌خوانند، اما پاسخشان نمی‌دهند؛ و میانشان هلاکتگاهی قرار می‌دهیم.</p>
</section>
