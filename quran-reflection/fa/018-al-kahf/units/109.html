  <p class="farsi-verse">بگو: اگر دریا برای سخنان پروردگارم مرکب بود، پیش از آنکه سخنان پروردگارم پایان یابد دریا پایان می‌یافت، هرچند همانند آن را نیز برای افزودن می‌آوردیم.</p>
