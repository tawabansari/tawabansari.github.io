<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="المالُ" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت">المالُ</button>
    <button class="word-link" type="button" data-word="وَالبَنونَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">وَالبَنونَ</button>
    <button class="word-link" type="button" data-word="زينَةُ" data-root="ز ي ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">زينَةُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالبٰقِيٰتُ" data-root="ب ق ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَالبٰقِيٰتُ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتُ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">الصّٰلِحٰتُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٌ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ثَوابًا" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">ثَوابًا</button>
    <button class="word-link" type="button" data-word="وَخَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">وَخَيرٌ</button>
    <button class="word-link" type="button" data-word="أَمَلًا" data-root="أ م ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَمَلًا</button>
  </p>
  <p class="farsi-verse">دارایی و پسران زیور زندگی دنیایند؛ و کارهای شایسته ماندگار نزد پروردگارت در پاداش بهتر و در امید بهترند.</p>
</section>
