<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۴۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="المالُ" data-root="م و ل" data-learn-more="/quran-terminology/fa/roots/m-w-l/" data-root-meaning="مال و اموال؛ از دارایی و امکانات زندگی تا مالکیت، حقوق دیگران، انفاق و آزمون انسان با ثروت" data-context="مال و دارایی؛ در کنار فرزندان، زینت زندگی دنیا معرفی شده است.">المالُ</button>
    <button class="word-link" type="button" data-word="وَالبَنونَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن و بنا نهادن؛ در واژه‌های ابن، بنی و بنون: فرزند و پیوند نسل." data-context="و فرزندان؛ «بنون» جمعِ ابن و اشاره به پیوند فرزندی و نسل، در کنار مال.">وَالبَنونَ</button>
    <button class="word-link" type="button" data-word="زينَةُ" data-root="ز ي ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-y-n/" data-root-meaning="زیبایی و آرایش؛ آراستن یا زیبا جلوه دادن." data-context="زینت و آرایش زندگی دنیا؛ وصف مال و فرزندان، بدون آنکه ذاتا بد معرفی شوند.">زينَةُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت" data-context="زندگی؛ در ترکیب «الحياة الدنيا»، زندگی این‌جهانی که مال و فرزندان زینت آن‌اند.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن" data-context="نزدیک و این‌جهانی؛ صفت زندگی در برابر ارزش ماندگار نزد پروردگار.">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالبٰقِيٰتُ" data-root="ب ق ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-q-y/" data-root-meaning="ماندن و از میان نرفتن؛ بقية: آنچه باقی مانده است." data-context="ماندگارها؛ کارهایی که ارزش و حاصلشان نزد پروردگار باقی می‌ماند، همراه با وصف «صالحات».">وَالبٰقِيٰتُ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتُ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایسته‌ها؛ وصف نیکی و درستیِ کارهای ماندگار، نه صرف طولانی بودن دوام آنها.">الصّٰلِحٰتُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="بهترند؛ برتری کارهای شایسته و ماندگار نزد پروردگار از جهت پاداش.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="نزد پروردگار تو؛ جایگاه سنجش ارزش پاداش و امید به کردار شایسته.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ثَوابًا" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه" data-context="از نظر پاداش؛ «ثوابا» جهت نخستِ برتری را بیان می‌کند و از «أملا» جداست.">ثَوابًا</button>
    <button class="word-link" type="button" data-word="وَخَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار" data-context="و بهترند؛ تکرار مقایسه، این بار از جهت امید بستن.">وَخَيرٌ</button>
    <button class="word-link" type="button" data-word="أَمَلًا" data-root="أ م ل" data-learn-more="/quran-terminology/fa/roots/a-m-l/" data-root-meaning="امید و انتظار رسیدن به چیزی مطلوب که هنوز تحقق نیافته است؛ چشم داشتن به آینده با تصور امکان دستیابی به آن." data-context="از جهت امید بستن؛ کارهای شایسته و ماندگار مایه امید بهتری‌اند، نه تضمینی برای تحقق هر خواسته شخصی.">أَمَلًا</button>
  </p>
  <p class="farsi-verse">دارایی و پسران زیور زندگی دنیایند؛ و کارهای شایسته ماندگار نزد پروردگارت در پاداش بهتر و در امید بهترند.</p>
</section>
