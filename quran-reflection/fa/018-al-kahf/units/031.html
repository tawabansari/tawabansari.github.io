<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="جَنّٰتُ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش" data-context="بوستان‌ها؛ جایگاه پاداشِ یادشده.">جَنّٰتُ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="ع د ن" data-root-meaning="ریشه «ع د ن» در زبان عربی به اقامت، ماندن و استقرار در مکان مربوط است." data-learn-more="/quran-terminology/fa/roots/ayn-d-n/" data-context="عدن؛ در ترکیب بوستان‌های اقامت پایدار، با خوانشِ نام خاص نیز در منابع.">عَدنٍ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="ج ر ي" data-learn-more="/quran-terminology/fa/roots/j-r-y/" data-root-meaning="جاری شدن، روان بودن، حرکت پیوسته در بستر، و رفتن در مسیر مقرر" data-context="جاری می‌شوند؛ وصف نهرها در بوستان‌ها.">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهِمُ" data-root="ت ح ت" data-learn-more="/quran-terminology/fa/roots/t-h-t/" data-root-meaning="زیر، پایین، سطح فرودست، لایه پنهان، و جایگاه بنیادین یا نسبتی" data-context="زیرِ آنان؛ جایگاه جریان نهرها.">تَحتِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="ن ه ر" data-learn-more="/quran-terminology/fa/roots/n-h2-r/" data-root-meaning="جریان آشکار آب، نهر و رود، روز روشن، و دفع آشکار و تند" data-context="نهرها؛ آبراه‌های جاری در بوستان‌ها.">الأَنهٰرُ</button>
    <button class="word-link" type="button" data-word="يُحَلَّونَ" data-root="ح ل ي" data-root-meaning="زیور و آراستگی؛ آراستن انسان یا اشیا با چیزی که برای زیبایی به ظاهر آنها افزوده می‌شود." data-context="آراسته می‌شوند؛ فعل مجهول دربارهٔ زیورهای اهل بوستان‌ها." data-learn-more="/quran-terminology/fa/roots/h-l-y/">يُحَلَّونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد" data-context="دستبندها؛ زیورهایی که با آنها آراسته می‌شوند.">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذَهَبٍ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان" data-context="طلا؛ جنس دستبندهای یادشده.">ذَهَبٍ</button>
    <button class="word-link" type="button" data-word="وَيَلبَسونَ" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن" data-context="و می‌پوشند؛ پوشیدن لباس‌ها در کنار آراستگی با زیور.">وَيَلبَسونَ</button>
    <button class="word-link" type="button" data-word="ثِيابًا" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه" data-context="لباس‌ها؛ پوشاک اهل بوستان‌ها.">ثِيابًا</button>
    <button class="word-link" type="button" data-word="خُضرًا" data-root="خ ض ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-dad-r/" data-root-meaning="رنگ سبز و سبز شدن گیاه یا زمین." data-context="سبز؛ وصف رنگ لباس‌ها.">خُضرًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سُندُسٍ" data-context="سندس: ابریشم نازک." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">سُندُسٍ</button>
    <button class="word-link" type="button" data-word="وَإِستَبرَقٍ" data-context="استبرق: دیبای ضخیم." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">وَإِستَبرَقٍ</button>
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="و ك أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-a/" data-root-meaning="تکیه کردن و قرار گرفتن بر تکیه‌گاه." data-context="تکیه‌زنان؛ حالت قرار گرفتن آنان بر تخت‌های آراسته.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَرائِكِ" data-root="أ ر ك" data-learn-more="/quran-terminology/fa/roots/a-r-k/" data-root-meaning="تخت یا بستری آراسته و آماده برای نشستن، آسودن و تکیه زدن؛ غالبا همراه با پوشش یا آرایش ویژه." data-context="تخت‌های آراسته؛ جایگاه تکیه زدن آنان.">الأَرائِكِ</button>
    ۚ
    <button class="word-link" type="button" data-word="نِعمَ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید" data-context="نیکوست؛ بیان ستایش پاداش.">نِعمَ</button>
    <button class="word-link" type="button" data-word="الثَّوابُ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه" data-context="پاداش؛ برخورداری یادشده در آیه.">الثَّوابُ</button>
    <button class="word-link" type="button" data-word="وَحَسُنَت" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="و نیکوست؛ ستایش جایگاه آسایش.">وَحَسُنَت</button>
    <button class="word-link" type="button" data-word="مُرتَفَقًا" data-root="ر ف ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-f-q/" data-root-meaning="نرمی و همراهی؛ رفیق: همراه؛ مرفق: آرنج یا مایه آسایش." data-context="جایگاه آسایش و آرام گرفتن؛ وصف بوستان‌های پاداش.">مُرتَفَقًا</button>
  </p>
  <p class="farsi-verse">آنان باغ‌های ماندگار دارند که از زیرشان نهرها جاری است؛ در آن با دستبندهایی از طلا آراسته می‌شوند و جامه‌هایی سبز از ابریشم نازک و دیبا می‌پوشند، در حالی که در آن بر تخت‌ها تکیه زده‌اند؛ چه نیک پاداشی و چه نیک آسایشگاهی است.</p>
</section>
