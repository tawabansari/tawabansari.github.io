    <button class="word-link" type="button" data-word="عَدنٍ" data-root="ع د ن" data-root-meaning="ریشه «ع د ن» در زبان عربی به اقامت، ماندن و استقرار در مکان مربوط است." data-learn-more="/quran-terminology/fa/roots/ayn-d-n/">عَدنٍ</button>

    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="س و ر" data-learn-more="/quran-terminology/fa/roots/s-w-r/" data-root-meaning="دیوار، حصار، برج، ساختار مرزبندی‌شده، و چیزی که پیرامون یک فضا یا معنا را می‌گیرد و میان درون و بیرون فرق می‌گذارد">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="ذَهَبٍ" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">ذَهَبٍ</button>
    <button class="word-link" type="button" data-word="وَيَلبَسونَ" data-root="ل ب س" data-learn-more="/quran-terminology/fa/roots/l-b-s/" data-root-meaning="پوشیدن، پوشاندن، درآمیختن، و مشتبه ساختن">وَيَلبَسونَ</button>
    <button class="word-link" type="button" data-word="ثِيابًا" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">ثِيابًا</button>
    <button class="word-link" type="button" data-word="خُضرًا" data-root="خ ض ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-dad-r/" data-root-meaning="رنگ سبز و سبز شدن گیاه یا زمین.">خُضرًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سُندُسٍ" data-context="سندس: ابریشم نازک." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">سُندُسٍ</button>
    <button class="word-link" type="button" data-word="وَإِستَبرَقٍ" data-context="استبرق: دیبای ضخیم." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">وَإِستَبرَقٍ</button>
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="و ك أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-a/" data-root-meaning="تکیه کردن و قرار گرفتن بر تکیه‌گاه.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَرائِكِ" data-root="أ ر ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/a-r-k/" data-root-meaning="ماندن و استقرار؛ أریکه و أرائك: تخت‌ها یا نشیمن‌های آراسته و تکیه‌گاه‌دار.">الأَرائِكِ</button>
    ۚ

    <button class="word-link" type="button" data-word="الثَّوابُ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">الثَّوابُ</button>
    <button class="word-link" type="button" data-word="وَحَسُنَت" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">وَحَسُنَت</button>
    <button class="word-link" type="button" data-word="مُرتَفَقًا" data-root="ر ف ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-f-q/" data-root-meaning="نرمی و همراهی؛ رفیق: همراه؛ مرفق: آرنج یا مایه آسایش.">مُرتَفَقًا</button>
  </p>
  <p class="farsi-verse">آنان باغ‌های ماندگار دارند که از زیرشان نهرها جاری است؛ در آن با دستبندهایی از طلا آراسته می‌شوند و جامه‌هایی سبز از ابریشم نازک و دیبا می‌پوشند، در حالی که در آن بر تخت‌ها تکیه زده‌اند؛ چه نیک پاداشی و چه نیک آسایشگاهی است.</p>
</section>
