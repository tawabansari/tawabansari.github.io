<section class="ayah-block" id="ayah-105" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۱۰۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کفر ورزیدند؛ آیات پروردگار و ملاقات او را نپذیرفتند.">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="به آیات؛ نشانه‌های پروردگارشان.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت" data-context="پروردگارشان؛ مرجع پرورش و تدبیر آنان.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَلِقائِهِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="و ملاقات او؛ رویارویی با پروردگار در سرانجام.">وَلِقائِهِ</button>
    <button class="word-link" type="button" data-word="فَحَبِطَت" data-root="ح ب ط" data-root-meaning="تباه شدن و از دست رفتن حاصل و ارزش عمل؛ در باب افعال، تباه و بی‌اثر ساختن آن." data-context="پس تباه شد؛ اعمال کسانی که آیات و ملاقات پروردگار را نپذیرفتند." data-learn-more="/quran-terminology/fa/roots/h-b-tt/">فَحَبِطَت</button>
    <button class="word-link" type="button" data-word="أَعمٰلُهُم" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود" data-context="اعمالشان؛ کوشش‌های کسانی که آیات را نپذیرفتند.">أَعمٰلُهُم</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="نُقيمُ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="برپا می‌داریم؛ در اینجا برپا کردن وزن برای آنان نفی شده است.">نُقيمُ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمانِ برپایی قیامت.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="قیامت؛ برپاییِ رستاخیز و داوری.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="وَزنًا" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار" data-context="وزنی؛ اعتبار و سنگینی در سنجش نهایی، که برای آنان نفی شده است.">وَزنًا</button>
  </p>
  <p class="farsi-verse">آنان کسانی‌اند که نشانه‌های پروردگارشان و دیدار او را انکار کردند؛ پس کارهایشان تباه شد و روز قیامت برای آنان وزنی برپا نمی‌کنیم.</p>
</section>
