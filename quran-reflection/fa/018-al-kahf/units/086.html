<section class="ayah-block" id="ayah-086" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۸۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذا</button>
    <button class="word-link" type="button" data-word="بَلَغَ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="رسید؛ رسیدن ذوالقرنین به جایگاه غروب.">بَلَغَ</button>
    <button class="word-link" type="button" data-word="مَغرِبَ" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/" data-root-meaning="از غروب خورشید و دور شدن از دید تا مغرب، غربت و شاخه‌های دیگر" data-context="جایگاه یا سوی غروب؛ مقصد سفر در این بخش.">مَغرِبَ</button>
    <button class="word-link" type="button" data-word="الشَّمسِ" data-root="ش م س" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-m-s/" data-root-meaning="خورشید و روشنایی آن." data-context="خورشید؛ چیزی که غروب آن مشاهده می‌شود.">الشَّمسِ</button>
    <button class="word-link" type="button" data-word="وَجَدَها" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="آن را یافت؛ گزارش آنچه ذوالقرنین در آن موقعیت دید.">وَجَدَها</button>
    <button class="word-link" type="button" data-word="تَغرُبُ" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/" data-root-meaning="از غروب خورشید و دور شدن از دید تا مغرب، غربت و شاخه‌های دیگر" data-context="غروب می‌کند؛ ناپدید شدن خورشید در افق دید.">تَغرُبُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="عَينٍ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/" data-root-meaning="چشم، چشمه، مشاهده، مراقبت، و آب یا نوشیدنی آشکار و در دسترس." data-context="چشمه یا منبع آب؛ موصوفِ حمئة.">عَينٍ</button>
    <button class="word-link" type="button" data-word="حَمِئَةٍ" data-root="ح م أ" data-root-meaning="گل‌ولای تیره و رسوبی در آب یا محیط مرطوب؛ ماده‌ای که می‌تواند رنگ، شفافیت یا بوی آب را تغییر دهد." data-context="گل‌آلود و دارای گل‌ولای تیره؛ وصف چشمه در قرائت حمئة." data-learn-more="/quran-terminology/fa/roots/h-m-a/">حَمِئَةٍ</button>
    <button class="word-link" type="button" data-word="وَوَجَدَ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="و یافت؛ روبه‌رو شدن با مردمی در آن محل.">وَوَجَدَ</button>
    <button class="word-link" type="button" data-word="عِندَها" data-root="ع ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-d/" data-root-meaning="سرسختی و مخالفت؛ «عند» واژه‌ای دستوری برای نزدیکی مکانی یا منزلتی است." data-context="نزد آن؛ جایگاه مردمی که یافت.">عِندَها</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="گروهی از مردم؛ ساکنانِ محل یادشده.">قَومًا</button>
    ۗ
    <button class="word-link" type="button" data-word="قُلنا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتیم؛ آغاز خطاب به ذوالقرنین.">قُلنا</button>
    <button class="word-link" type="button" data-word="يٰذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">يٰذَا</button>
    <button class="word-link" type="button" data-word="القَرنَينِ" data-root="ق ر ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-r-n/" data-root-meaning="پیوستن و همراهی؛ قرین: همراه؛ قرن: نسل یا جماعت هم‌دوره." data-context="دو شاخ یا دو قرن؛ جزء لقب ذوالقرنین، بدون تعیین قطعی وجه نام‌گذاری در این آیه.">القَرنَينِ</button>
    <button class="word-link" type="button" data-word="إِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِمّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تُعَذِّبَ" data-root="ع ذ ب" data-learn-more="/quran-terminology/fa/roots/ayn-dh-b/" data-root-meaning="گوارایی، چشیدن کیفیت یک وضعیت، و پیامد تلخ انکار و فساد" data-context="عذاب کنی؛ یکی از دو شیوهٔ برخورد در خطاب.">تُعَذِّبَ</button>
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَتَّخِذَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری" data-context="در پیش بگیری؛ دربارهٔ شیوهٔ نیک رفتار با آنان.">تَتَّخِذَ</button>
    <button class="word-link" type="button" data-word="فيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيهِم</button>
    <button class="word-link" type="button" data-word="حُسنًا" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن." data-context="نیکی و رفتاری نیک؛ شیوهٔ دیگر برخورد با آن مردم.">حُسنًا</button>
  </p>
  <p class="farsi-verse">تا هنگامی که به محل غروب خورشید رسید، آن را یافت که در چشمه‌ای گل‌آلود فرو می‌رود و نزد آن مردمی یافت؛ گفتیم: ای ذوالقرنین، یا عذاب می‌کنی یا در میان آنان نیکی پیش می‌گیری.</p>
</section>
