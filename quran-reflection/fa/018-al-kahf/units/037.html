<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۳۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز پاسخ همراه صاحب باغ.">قالَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="صاحِبُهُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف" data-context="همراهش؛ کسی که در گفت‌وگو او را به پرسش می‌کشد.">صاحِبُهُ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="يُحاوِرُهُ" data-root="ح و ر" data-root-meaning="بازگشت و رفت‌وبرگشت گفتار؛ گردش و ویژگی‌های رنگ و چشم؛ حواریون، یاران ویژه عیسی." data-context="با او گفت‌وگو می‌کرد؛ این بار همراه صاحب باغ پاسخ می‌دهد." data-learn-more="/quran-terminology/fa/roots/h-w-r/">يُحاوِرُهُ</button>
    <button class="word-link" type="button" data-word="أَكَفَرتَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="آیا کفر ورزیدی؟ پرسش انتقادی درباره انکار آفریننده.">أَكَفَرتَ</button>
    <button class="word-link" type="button" data-word="بِالَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِالَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَكَ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="تو را آفرید؛ نسبت دادن آفرینش مخاطب به آفریننده.">خَلَقَكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="تُرابٍ" data-root="ت ر ب" data-learn-more="/quran-terminology/fa/roots/t-r-b/" data-root-meaning="خاک، نزدیکی شدید به خاک، هم‌سنی و هم‌مرحله بودن، و شاخه ویژه ترائب در ناحیه بالای سینه" data-context="خاک؛ مبدأیی که در یادآوری آفرینش انسان آمده است.">تُرابٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="نُطفَةٍ" data-root="ن ط ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-tt-f/" data-root-meaning="اندکی مایع؛ نطفه: مقدار اندک مایع تولیدمثل در سیاق آفرینش." data-context="نطفه؛ مرحله‌ای از آفرینش انسان که پس از خاک یاد شده است.">نُطفَةٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="سَوّىٰكَ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی" data-context="تو را سامان داد؛ به تو ساختار و صورت انسانی بخشید.">سَوّىٰكَ</button>
    <button class="word-link" type="button" data-word="رَجُلًا" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="مردی؛ صورت انسانی مخاطب پس از مراحل یادشده.">رَجُلًا</button>
  </p>
  <p class="farsi-verse">همراهش، در حالی که با او گفت‌وگو می‌کرد، به او گفت: آیا به کسی که تو را از خاک، سپس از نطفه آفرید و سپس مردی سامان داد، کافر شده‌ای؟</p>
</section>
