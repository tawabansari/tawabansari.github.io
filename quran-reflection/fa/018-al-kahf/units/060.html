<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۶۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="موسی به جوان همراهش گفت و تصمیم خود را برای ادامهٔ راه بیان کرد.">قالَ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="لِفَتىٰهُ" data-root="ف ت ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-y/" data-root-meaning="جوان و جوانی؛ فتوا: پاسخ و روشن کردن مسئله." data-context="به جوان همراهش؛ جوانی که در این سفر موسی را همراهی می‌کرد.">لِفَتىٰهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="أَبرَحُ" data-root="ب ر ح" data-root-meaning="ترک کردن و دور شدن از مکان یا حالت؛ در ساخت منفی، باقی ماندن یا ادامه دادن؛ و در شاخه‌های دیگر، آشکار شدن و سختی." data-learn-more="/quran-terminology/fa/roots/b-r-h/" data-context="از ادامهٔ راه دست نمی‌کشم؛ با نفی، استمرار سفر را بیان می‌کند، نه بی‌حرکت ماندن در یک مکان.">أَبرَحُ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="أَبلُغَ" data-root="ب ل غ" data-learn-more="/quran-terminology/fa/roots/b-l-gh/" data-root-meaning="رسیدن، به حد رسیدن، و رساندن پیام تا مقصد و اتمام حجت" data-context="برسم؛ رسیدن موسی به مقصدی که در ادامهٔ جمله مشخص شده است.">أَبلُغَ</button>
    <button class="word-link" type="button" data-word="مَجمَعَ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک" data-context="محل پیوستن یا گردآمدن؛ اینجا محل تلاقی دو دریا.">مَجمَعَ</button>
    <button class="word-link" type="button" data-word="البَحرَينِ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان" data-context="دو دریا؛ دو پهنهٔ آبی که محل پیوستنشان مقصد سفر معرفی شده است.">البَحرَينِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="أَمضِىَ" data-root="م ض ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-dad-y/" data-root-meaning="گذشتن و پیش رفتن." data-context="راه بپیمایم و پیش بروم؛ در این جمله با گذشت زمانی دراز همراه است.">أَمضِىَ</button>
    <button class="word-link" type="button" data-word="حُقُبًا" data-root="ح ق ب" data-root-meaning="در کاربرد قرآنی، دوره‌ای دراز از زمان، بدون تعیین شمار سال‌ها در خود آیه؛ «أحقاب» جمعِ دوره‌هاست و شمار نهایی آنها را به‌تنهایی تعیین نمی‌کند." data-context="زمانی دراز؛ خود آیه شمار معینی از سال‌ها را تعیین نمی‌کند." data-learn-more="/quran-terminology/fa/roots/h-q-b/">حُقُبًا</button>
  </p>
  <p class="farsi-verse">و آنگاه که موسی به جوان همراهش گفت: از رفتن بازنمی‌ایستم تا به محل پیوند دو دریا برسم، یا زمانی دراز بگذرانم.</p>
</section>
