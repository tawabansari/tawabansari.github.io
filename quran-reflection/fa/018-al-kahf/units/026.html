  <p class="farsi-verse">بگو: آن معبود یگانه به مدت ماندنشان داناتر است؛ نهان آسمان‌ها و زمین از آن اوست؛ چه بینا و چه شنواست؛ آنان جز او هیچ سرپرستی ندارند و او هیچ‌کس را در حکم خود شریک نمی‌کند.</p>
