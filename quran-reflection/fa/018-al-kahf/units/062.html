<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاوَزا" data-root="ج و ز" data-root-meaning="گذشتن و پشت سر گذاشتن؛ «تَجَاوَزَ عَنْ» در کاربرد قرآنی، درگذشتن از بدی‌ها و مؤاخذهٔ آنها." data-context="هر دو گذشتند؛ از جای پیشین" data-learn-more="/quran-terminology/fa/roots/j-w-z/">جاوَزا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ موسی">قالَ</button>
    <button class="word-link" type="button" data-word="لِفَتىٰهُ" data-root="ف ت ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-t-y/" data-root-meaning="جوان و جوانی؛ فتوا: پاسخ و روشن کردن مسئله." data-context="به همراه جوان خود">لِفَتىٰهُ</button>
    <button class="word-link" type="button" data-word="ءاتِنا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="برای ما بیاور">ءاتِنا</button>
    <button class="word-link" type="button" data-word="غَداءَنا" data-root="غ د و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-d-w/" data-root-meaning="بامداد و بامداد رفتن؛ غد: فردا یا آینده." data-context="خوراک چاشت و روزانهٔ ما">غَداءَنا</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَقَد</button>
    <button class="word-link" type="button" data-word="لَقينا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="برخورد کرده و دیده‌ایم؛ خستگی را">لَقينا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="سَفَرِنا" data-root="س ف ر" data-root-meaning="آشکار شدن و کنار رفتن پوشیدگی؛ و در شاخه‌های تثبیت‌شدهٔ آن، سفر کردن، روشن شدن، کتاب و رساندن نوشته یا پیام." data-context="سفرمان؛ مسافرت موسی و همراهش که از آن خستگی دیده‌اند." data-learn-more="/quran-terminology/fa/roots/s-f-r/">سَفَرِنا</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذا</button>
    <button class="word-link" type="button" data-word="نَصَبًا" data-root="ن ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-sad-b/" data-root-meaning="برپا کردن؛ نَصَب: رنج؛ نصیب: سهم؛ نُصُب: سنگ‌های آیینی." data-context="رنج و خستگی">نَصَبًا</button>
  </p>
  <p class="farsi-verse">پس چون گذشتند، به جوان همراهش گفت: غذایمان را بیاور؛ به‌راستی از این سفرمان خستگی دیده‌ایم.</p>
</section>
