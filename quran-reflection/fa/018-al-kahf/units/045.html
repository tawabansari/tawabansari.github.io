<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">الکهف ۱۸:۴۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاضرِب" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">وَاضرِب</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="مَثَلَ" data-root="م ث ل" data-learn-more="/quran-terminology/fa/roots/m-th-l/" data-root-meaning="مانند بودن، نمونه آوردن، پدیدار ساختن معنا، و نزدیک کردن حقیقت به فهم انسان">مَثَلَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="د ن و" data-learn-more="/quran-terminology/fa/roots/d-n-w/" data-root-meaning="نزدیک بودن، نزدیک شدن، پایین‌تر بودن و حاضرتر بودن">الدُّنيا</button>
    <button class="word-link" type="button" data-word="كَماءٍ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">كَماءٍ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءِ</button>
    <button class="word-link" type="button" data-word="فَاختَلَطَ" data-root="خ ل ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-l-tt/" data-root-meaning="آمیختن، درهم شدن و مشارکت داشتن.">فَاختَلَطَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="نَباتُ" data-root="ن ب ت" data-learn-more="/quran-terminology/fa/roots/n-b-t/" data-root-meaning="روییدن، رویاندن و آشکار شدن حیات از بستر مناسب">نَباتُ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="فَأَصبَحَ" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ.">فَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="هَشيمًا" data-root="ه ش م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-sh-m/" data-root-meaning="خرد شدن گیاه و خشکیده‌های شکسته.">هَشيمًا</button>
    <button class="word-link" type="button" data-word="تَذروهُ" data-root="ذ ر و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dh-r-w/" data-root-meaning="پراکندن و بر باد دادن؛ ذرّیه: نسل و فرزندان، با اختلاف در تحلیل اشتقاقی.">تَذروهُ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحُ" data-root="ر و ح" data-learn-more="/quran-terminology/fa/roots/r-w-h/" data-root-meaning="باد، نفس، گشایش و روح">الرِّيٰحُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه">شَىءٍ</button>
    <button class="word-link" type="button" data-word="مُقتَدِرًا" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود">مُقتَدِرًا</button>
  </p>
  <p class="farsi-verse">و برای آنان مَثَل زندگی دنیا را بزن: مانند آبی است که از آسمان نازل کردیم و گیاه زمین با آن درآمیخت، سپس خرده‌گیاهی خشک شد که بادها آن را پراکنده می‌کنند؛ و آن معبود یگانه بر هر چیزی تواناست.</p>
</section>
