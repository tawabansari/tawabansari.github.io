  </p>
  <p class="farsi-verse">و برای آنان مَثَل زندگی دنیا را بزن: مانند آبی است که از آسمان نازل کردیم و گیاه زمین با آن درآمیخت، سپس خرده‌گیاهی خشک شد که بادها آن را پراکنده می‌کنند؛ و آن معبود یگانه بر هر چیزی تواناست.</p>
