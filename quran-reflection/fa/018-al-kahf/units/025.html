  <h2 class="ayah-title">الکهف ۱۸:۲۵</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="كَهفِهِم" data-root="ك ه ف" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَهفِهِم</button>
    <button class="word-link" type="button" data-word="ثَلٰثَ" data-root="ث ل ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ثَلٰثَ</button>
    <button class="word-link" type="button" data-word="مِا۟ئَةٍ" data-root="م أ ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مِا۟ئَةٍ</button>
    <button class="word-link" type="button" data-word="سِنينَ" data-root="س ن و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">سِنينَ</button>

  <p class="farsi-verse">و در غارشان سیصد سال ماندند و نُه سال افزودند.</p>
