<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَالَّذى</button>
    <button class="word-link" type="button" data-word="أَطمَعُ" data-root="ط م ع" data-learn-more="/quran-terminology/fa/roots/tt-m-ayn/" data-root-meaning="چشم‌داشت و گرایش درونی به دستیابی به امر مطلوبی که ممکن پنداشته می‌شود">أَطمَعُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَغفِرَ" data-root="غ ف ر" data-learn-more="/quran-terminology/fa/roots/gh-f-r/" data-root-meaning="پوشاندن و آمرزیدن خطا، به‌گونه‌ای که انسان از کیفر و پیامد آن محفوظ بماند.">يَغفِرَ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لى</button>
    <button class="word-link" type="button" data-word="خَطيـَٔتى" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/" data-root-meaning="لغزیدن از مسیر درست، به هدف نخوردن، خطا رفتن؛ و در برخی صورت‌ها، انحراف آگاهانه از حق.">خَطيـَٔتى</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال">يَومَ</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="د ي ن" data-learn-more="/quran-terminology/fa/roots/d-y-n/" data-root-meaning="حساب، جزا، داوری، پاسخ‌گویی، بدهی، تعهد، نظم الزام‌آور، و راهی که انسان در برابر آن معبود یگانه به آن گردن می‌نهد">الدّينِ</button>
  </p>
  <p class="farsi-verse">و همان که امید دارم خطایم را در روز جزا بیامرزد.</p>
</section>
