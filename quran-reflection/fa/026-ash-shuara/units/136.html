<section class="ayah-block" id="ayah-136" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۳۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالوا</button>
    <button class="word-link" type="button" data-word="سَواءٌ" data-root="س و ي" data-learn-more="/quran-terminology/fa/roots/s-w-y/" data-root-meaning="راستی، تراز، تسویه، و استواری بی‌کژی">سَواءٌ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="أَوَعَظتَ" data-root="و ع ظ" data-learn-more="/quran-terminology/fa/roots/w-ayn-zha/" data-root-meaning="پند دادن، اندرز دادن، هشدار و یادآوری عواقب برای متوجه ساختن و اصلاح رفتار.">أَوَعَظتَ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَم</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">تَكُن</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الوٰعِظينَ" data-root="و ع ظ" data-learn-more="/quran-terminology/fa/roots/w-ayn-zha/" data-root-meaning="پند دادن، اندرز دادن، هشدار و یادآوری عواقب برای متوجه ساختن و اصلاح رفتار.">الوٰعِظينَ</button>
  </p>
  <p class="farsi-verse">گفتند: برای ما یکسان است که پند بدهی یا از پنددهندگان نباشی.</p>
