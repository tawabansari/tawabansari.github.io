<section class="ayah-block" id="ayah-225" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۲۲۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">تَرَ</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="وادٍ" data-root="و د ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-d-y/" data-root-meaning="وادی: دره یا آبراه؛ دیه: جبران مالی آسیب، در شاخه‌ای دیگر.">وادٍ</button>
    <button class="word-link" type="button" data-word="يَهيمونَ" data-root="ه ي م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/h2-y-m/" data-root-meaning="سرگردانی و تشنگی شدید؛ هیم: شتران بسیار تشنه.">يَهيمونَ</button>
  </p>
  <p class="farsi-verse">آیا ندیده‌ای که آنان در هر دره‌ای سرگردان‌اند،</p>
</section>
