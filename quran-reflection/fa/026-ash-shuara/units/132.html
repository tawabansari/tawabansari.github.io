<section class="ayah-block" id="ayah-132" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَمَدَّكُم" data-root="م د د" data-learn-more="/quran-terminology/fa/roots/m-d-d/" data-root-meaning="کشیدن، امتداد دادن، ادامه بخشیدن، مهلت دادن، افزودن پشتیبانی، و فراهم کردن میدان بیشتر">أَمَدَّكُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">تَعلَمونَ</button>
  </p>
  <p class="farsi-verse">و از آنکه شما را با آنچه می‌دانید یاری رساند پروا کنید؛</p>
</section>
