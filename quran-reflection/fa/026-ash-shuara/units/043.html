<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="أَلقوا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">أَلقوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُم</button>
    <button class="word-link" type="button" data-word="مُلقونَ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">مُلقونَ</button>
  </p>
  <p class="farsi-verse">موسی به آنان گفت: آنچه را می‌خواهید بیفکنید، بیفکنید.</p>
