<section class="ayah-block" id="ayah-151" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۵۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تُطيعوا" data-root="ط و ع" data-root-meaning="فرمان‌پذیری، همراهی، توانایی و اقدام داوطلبانه؛ از «طوعا و کرها» تا اطاعت، استطاعت و تطوع در قرآن" data-learn-more="/quran-terminology/fa/roots/tt-w-ayn/">تُطيعوا</button>
    <button class="word-link" type="button" data-word="أَمرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">أَمرَ</button>
    <button class="word-link" type="button" data-word="المُسرِفينَ" data-root="س ر ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-r-f/" data-root-meaning="از اندازه یا حد گذشتن؛ اسراف.">المُسرِفينَ</button>
  </p>
  <p class="farsi-verse">و از فرمان زیاده‌روان پیروی نکنید؛</p>
</section>
