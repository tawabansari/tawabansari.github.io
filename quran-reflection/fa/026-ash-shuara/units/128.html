<section class="ayah-block" id="ayah-128" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَتَبنونَ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">أَتَبنونَ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="ريعٍ" data-root="ر ي ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">ريعٍ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايَةً</button>
    <button class="word-link" type="button" data-word="تَعبَثونَ" data-root="ع ب ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَعبَثونَ</button>
  </p>
  <p class="farsi-verse">آیا بر هر بلندی نشانه‌ای می‌سازید، به بازیچه؟</p>
</section>
