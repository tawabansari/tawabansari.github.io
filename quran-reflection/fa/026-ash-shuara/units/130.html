<section class="ayah-block" id="ayah-130" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۳۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَإِذا</button>
    <button class="word-link" type="button" data-word="بَطَشتُم" data-root="ب ط ش" data-root-meaning="گرفتن یا برخورد کردن با قدرت، شدت و غلبه؛ و در کاربردهای گسترده‌تر، توانِ اعمال قهر و چیرگی." data-context="هرگاه با قهر و شدت اقدام می‌کنید؛ بخش نخستِ ساخت شرطی." data-learn-more="/quran-terminology/fa/roots/b-tt-sh/">بَطَشتُم</button>
    <button class="word-link" type="button" data-word="بَطَشتُم" data-root="ب ط ش" data-root-meaning="گرفتن یا برخورد کردن با قدرت، شدت و غلبه؛ و در کاربردهای گسترده‌تر، توانِ اعمال قهر و چیرگی." data-context="با قهر و شدت رفتار می‌کنید؛ «جبارین» شیوهٔ زورگویانهٔ آن را بیان می‌کند." data-learn-more="/quran-terminology/fa/roots/b-tt-sh/">بَطَشتُم</button>
    <button class="word-link" type="button" data-word="جَبّارينَ" data-root="ج ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-r/" data-root-meaning="ترمیم و استوار کردن همراه با اعمال قدرت؛ جبّار بسته به سیاق، صاحب اقتدار یا زورگو است." data-context="در حالِ زورگویی و تحمیل قدرت؛ وصفِ شیوهٔ بطشِ آنان.">جَبّارينَ</button>
  </p>
  <p class="farsi-verse">و چون دست به قهر می‌گشایید، چون زورگویان می‌گشایید.</p>
</section>
