<section class="ayah-block" id="ayah-155" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۵۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ پاسخِ صالح دربارهٔ ناقه و سهم آب.">قالَ</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="ناقَةٌ" data-root="ن و ق" data-learn-more="/quran-terminology/fa/roots/n-w-q/" data-root-meaning="نَاقَة، شتر ماده است؛ این خانواده جمع‌های نام آن، تربیت و رام کردن شتر و برخی کاربردهای دقت و ظرافت را نیز دربر می‌گیرد. در قرآن، ناقة همان شتر مادهٔ داستان صالح است." data-context="شتر ماده‌ای که برای آن سهم آب تعیین می‌شود.">ناقَةٌ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="شِربٌ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="سهم آب؛ سهمی که برای ناقه مقرر است.">شِربٌ</button>
    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَكُم</button>
    <button class="word-link" type="button" data-word="شِربُ" data-root="ش ر ب" data-learn-more="/quran-terminology/fa/roots/sh-r-b/" data-root-meaning="نوشیدن، نوشیدنی، سهم آب، و محل یا راه دسترسی به نوشیدن." data-context="سهم آب؛ سهمِ قوم در روز معین.">شِربُ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="روز؛ زمانِ تعیین‌شده برای سهم آب قوم.">يَومٍ</button>
    <button class="word-link" type="button" data-word="مَعلومٍ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند" data-context="معلوم؛ وصفِ روزِ مقرر برای آب‌خوردن.">مَعلومٍ</button>
  </p>
  <p class="farsi-verse">گفت: این ماده‌شتری است؛ برای او نوبت آبی است و برای شما نوبت آب روزی معلوم.</p>
</section>
