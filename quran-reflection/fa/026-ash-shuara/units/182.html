<section class="ayah-block" id="ayah-182" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَزِنوا" data-root="و ز ن" data-learn-more="/quran-terminology/fa/roots/w-z-n/" data-root-meaning="وزن کردن، سنجیدن، اندازه‌گیری با ترازو، برقرار کردن توازن، و تشخیص مقدار یا ارزش بر اساس معیار" data-context="و وزن کنید؛ فرمان شعیب به سنجیدن وزن با ترازوی درست.">وَزِنوا</button>
    <button class="word-link" type="button" data-word="بِالقِسطاسِ" data-root="ق س ط س" data-root-meaning="ترازو و وسیلهٔ سنجش وزن؛ در کاربرد لغوی، به‌ویژه ترازوی درست و قابل اعتماد که برای رعایت عدالت در وزن‌کردن به کار می‌رود." data-context="با ترازو؛ ابزار وزن‌کردن در فرمان شعیب، که وصفِ «المستقيم» بر درستیِ سنجش با آن تأکید دارد." data-learn-more="/quran-terminology/fa/roots/q-s-tt-s/">بِالقِسطاسِ</button>
    <button class="word-link" type="button" data-word="المُستَقيمِ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی" data-context="درست؛ وصفِ ترازو که بر قابل اعتماد بودنِ سنجش و نبودِ انحراف دلالت دارد.">المُستَقيمِ</button>
  </p>
  <p class="farsi-verse">و با ترازوی درست وزن کنید.</p>
</section>
