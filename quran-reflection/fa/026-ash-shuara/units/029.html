<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="لَئِنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِنِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذتَ" data-root="أ خ ذ" data-learn-more="/quran-terminology/fa/roots/a-kh-dh/" data-root-meaning="گرفتن، در اختیار آوردن، بازداشتن، و واردکردن چیزی در حوزه تصرف، تعهد یا پیگیری">اتَّخَذتَ</button>
    <button class="word-link" type="button" data-word="إِلٰهًا" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">إِلٰهًا</button>
    <button class="word-link" type="button" data-word="غَيرى" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">غَيرى</button>
    <button class="word-link" type="button" data-word="لَأَجعَلَنَّكَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">لَأَجعَلَنَّكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَسجونينَ" data-root="س ج ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">المَسجونينَ</button>
  </p>
  <p class="farsi-verse">گفت: اگر جز من معبودی بگیری، حتماً تو را از زندانیان قرار می‌دهم.</p>
