  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَضيقُ" data-root="ض ي ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَيَضيقُ</button>
    <button class="word-link" type="button" data-word="صَدرى" data-root="ص د ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">صَدرى</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يَنطَلِقُ" data-root="ن ط ق" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">يَنطَلِقُ</button>
    <button class="word-link" type="button" data-word="لِسانى" data-root="ل س ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لِسانى</button>

  <p class="farsi-verse">و سینه‌ام تنگ می‌شود و زبانم روان نمی‌گردد؛ پس به هارون پیام بفرست.</p>
