<section class="ayah-block" id="ayah-139" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۳۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَذَّبوهُ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/">فَكَذَّبوهُ</button>
    <button class="word-link" type="button" data-word="فَأَهلَكنٰهُم" data-root="ه ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَهلَكنٰهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">لَـٔايَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَ</button>
    <button class="word-link" type="button" data-word="أَكثَرُهُم" data-root="ك ث ر" data-learn-more="/quran-terminology/fa/roots/k-th-r/">أَكثَرُهُم</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/">مُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">پس او را تکذیب کردند و آنان را هلاک کردیم. بی‌گمان در این نشانه‌ای است؛ و بیشترشان مؤمن نبودند.</p>
