<section class="ayah-block" id="ayah-149" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۴۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَنحِتونَ" data-root="ن ح ت" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-h-t/" data-root-meaning="تراشیدن سنگ، چوب یا جسم سخت." data-context="و با تراشیدن پدید می‌آورید.">وَتَنحِتونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="ج ب ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-l/" data-root-meaning="جبل: کوه و تودهٔ برآمده؛ جِبِلّة در کاربرد انسانی به جماعت یا سرشت اشاره می‌کند." data-context="کوه‌ها.">الجِبالِ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="ب ي ت" data-root-meaning="«ب ي ت» در شاخه مکانی به خانه و جایگاهی اشاره دارد که برای سکونت، پناه و بازگشت فراهم شده است؛ و در شاخه زمانی به گذراندن شب مربوط می‌شود. از همین میدان، کاربردهای مربوط به انجام دادن، تدبیر کردن یا تدارک دیدن کاری در شب پدید آمده‌اند." data-context="خانه‌هایی که در کوه می‌تراشید." data-learn-more="/quran-terminology/fa/roots/b-y-t/">بُيوتًا</button>
    <button class="word-link" type="button" data-word="فٰرِهينَ" data-root="ف ر ه" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h2/" data-root-meaning="مهارت و چالاکی یا سرمستی از توانگری، بنا بر سیاق و قرائت." data-context="با مهارت و استادی؛ وصفِ تراشندگان خانه‌ها.">فٰرِهينَ</button>
  </p>
  <p class="farsi-verse">و با مهارت از کوه‌ها خانه‌هایی می‌تراشید.</p>
</section>
