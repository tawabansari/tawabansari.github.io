<section class="ayah-block" id="ayah-167" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۶۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفتند؛ تهدید مخالفان لوط.">قالوا</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="تَنتَهِ" data-root="ن ه ي" data-root-meaning="به پایان و نهایت رسیدن؛ بازداشتن از ادامهٔ کاری و دست کشیدن از آن." data-context="دست بکشی؛ در تهدید به اخراج لوط." data-learn-more="/quran-terminology/fa/roots/n-h2-y/">تَنتَهِ</button>
    <button class="word-link" type="button" data-word="يٰلوطُ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰلوطُ</button>
    <button class="word-link" type="button" data-word="لَتَكونَنَّ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="حتماً خواهی بود؛ نتیجهٔ تهدید در صورت دست نکشیدن.">لَتَكونَنَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُخرَجينَ" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="اخراج‌شدگان؛ سرنوشتی که لوط به آن تهدید می‌شود.">المُخرَجينَ</button>
  </p>
  <p class="farsi-verse">گفتند: ای لوط، اگر دست برنداری، حتماً از بیرون‌راندگان خواهی بود.</p>
</section>
