<section class="ayah-block" id="ayah-184" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۸۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="و ق ي" data-learn-more="/quran-terminology/fa/roots/w-q-y/" data-root-meaning="نگه داشتن، محافظت کردن، سپر ساختن، خود را از آسیب دور نگه داشتن، پرهیز آگاهانه، مراقبت مسئولانه، و قرار دادن فاصله میان خود و خطر" data-context="و پروا کنید؛ دعوت شعیب به تقوا.">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَكُم" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص" data-context="شما را آفرید؛ فعل آفرینشِ مخاطبان.">خَلَقَكُم</button>
    <button class="word-link" type="button" data-word="وَالجِبِلَّةَ" data-root="ج ب ل" data-root-meaning="کوه و تودهٔ برآمده؛ سرشت و آفرینش؛ جماعت بزرگ انسانی." data-context="آفریدگان و جماعت‌های پیشین؛ کسانی که پیش از مخاطبان آفریده شده‌اند." data-learn-more="/quran-terminology/fa/roots/j-b-l/">وَالجِبِلَّةَ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="پیشینیان؛ جماعت‌های پیش از مخاطبان.">الأَوَّلينَ</button>
  </p>
  <p class="farsi-verse">و از آنکه شما و آفریدگان پیشین را آفرید پروا کنید.</p>
</section>
