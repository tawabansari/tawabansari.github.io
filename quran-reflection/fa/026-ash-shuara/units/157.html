  <h2 class="ayah-title">الشعراء ۲۶:۱۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَعَقَروها" data-root="ع ق ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-q-r/" data-root-meaning="پی کردن و از پا درآوردن؛ عاقر: نازا، در شاخه‌ای دیگر.">فَعَقَروها</button>
    <button class="word-link" type="button" data-word="فَأَصبَحوا" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ.">فَأَصبَحوا</button>
    <button class="word-link" type="button" data-word="نٰدِمينَ" data-root="ن د م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/n-d-m/" data-root-meaning="پشیمانی از کار گذشته.">نٰدِمينَ</button>

  <p class="farsi-verse">پس او را پی کردند و پشیمان شدند.</p>
