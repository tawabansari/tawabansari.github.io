  <h2 class="ayah-title">الشعراء ۲۶:۱۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">قالَ</button>
    <button class="word-link" type="button" data-word="كَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَلّا</button>

    <button class="word-link" type="button" data-word="فَاذهَبا" data-root="ذ ه ب" data-learn-more="/quran-terminology/fa/roots/dh-h2-b/" data-root-meaning="رفتن، دور شدن، از حضور بیرون رفتن، سپری شدن، زایل شدن، و برده شدن چیزی از نزد انسان">فَاذهَبا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">بِـٔايٰتِنا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="مُستَمِعونَ" data-root="س م ع" data-learn-more="/quran-terminology/fa/roots/s-m-ayn/">مُستَمِعونَ</button>
  </p>
  <p class="farsi-verse">گفت: هرگز؛ پس هر دو با نشانه‌های ما بروید؛ ما با شماییم و گوش می‌سپاریم.</p>
