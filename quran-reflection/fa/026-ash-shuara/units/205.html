<section class="ayah-block" id="ayah-205" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۲۰۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَرَءَيتَ" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">أَفَرَءَيتَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="مَتَّعنٰهُم" data-root="م ت ع" data-learn-more="/quran-terminology/fa/roots/m-t-ayn/" data-root-meaning="بهره‌مندی، استفاده زمان‌دار، برخورداری محدود، و داشتن ابزار راه؛ متاع ابزار راه است، نه جایگاه قرار.">مَتَّعنٰهُم</button>
    <button class="word-link" type="button" data-word="سِنينَ" data-root="س ن و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-n-w/" data-root-meaning="سال و سالیان؛ سنا: درخشندگی؛ در واژه «سنة» تحلیل «سنه» نیز مطرح است.">سِنينَ</button>
  </p>
  <p class="farsi-verse">آیا دیده‌ای، اگر سال‌هایی برخوردارشان کنیم،</p>
</section>
