<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَعَلَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكَ</button>
    <button class="word-link" type="button" data-word="بٰخِعٌ" data-root="ب خ ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بٰخِعٌ</button>
    <button class="word-link" type="button" data-word="نَفسَكَ" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/">نَفسَكَ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَلّا</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكونوا</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">مُؤمِنينَ</button>
  </p>
  <p class="farsi-verse">شاید از اینکه مؤمن نمی‌شوند، خود را از اندوه هلاک کنی.</p>
</section>
