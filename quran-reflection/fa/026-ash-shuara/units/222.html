<section class="ayah-block" id="ayah-222" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۲۲۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَنَزَّلُ" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت">تَنَزَّلُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلِّ</button>
    <button class="word-link" type="button" data-word="أَفّاكٍ" data-root="أ ف ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَفّاكٍ</button>
    <button class="word-link" type="button" data-word="أَثيمٍ" data-root="أ ث م" data-learn-more="/quran-terminology/fa/roots/a-th-m/" data-root-meaning="گناه، مسئولیت اخلاقی و پیوند لغوی با کندی و بازماندن">أَثيمٍ</button>
  </p>
  <p class="farsi-verse">بر هر دروغ‌پرداز گناهکاری فرود می‌آیند.</p>
</section>
