<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۹۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكُبكِبوا" data-root="ك ب ك ب" data-root-meaning="سرنگون کردن، واژگون ساختن و غلتاندن؛ در بعضی کاربردها، فرو افکندن و درهم ریختنِ چیزها بر روی یکدیگر." data-context="پس سرنگون افکنده می‌شوند؛ فعل مجهول برای گروه‌هایی که در جحیم واژگون و درهم افکنده می‌شوند." data-learn-more="/quran-terminology/fa/roots/k-b-k-b/">فَكُبكِبوا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فيها</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُم</button>
    <button class="word-link" type="button" data-word="وَالغاوۥنَ" data-root="غ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-y/" data-root-meaning="گمراهی و منحرف ساختن از راه درست." data-context="و گمراهان؛ گروهی که همراهِ مرجعِ «هم» در همان سرنگون افکنده شدن شریک‌اند؛ تعیین دقیق مصداق از سیاق آیات بررسی می‌شود.">وَالغاوۥنَ</button>
  </p>
  <p class="farsi-verse">پس آنان و گمراهان در آن سرنگون افکنده می‌شوند؛</p>
</section>
