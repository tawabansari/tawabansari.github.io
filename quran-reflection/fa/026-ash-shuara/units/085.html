<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۸۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاجعَلنى" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَاجعَلنى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="وَرَثَةِ" data-root="و ر ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-r-th/" data-root-meaning="به ارث بردن و منتقل شدن دارایی یا جایگاه به جانشین.">وَرَثَةِ</button>
    <button class="word-link" type="button" data-word="جَنَّةِ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جَنَّةِ</button>
    <button class="word-link" type="button" data-word="النَّعيمِ" data-root="ن ع م" data-learn-more="/quran-terminology/fa/roots/n-ayn-m/" data-root-meaning="نعمت، برخورداری، گشایش، آسایش، فضل، روزی، بهره‌مندی، و مسئولیتی که از دریافت نعمت پدید می‌آید">النَّعيمِ</button>
  </p>
  <p class="farsi-verse">و مرا از وارثان باغ پرنعمت قرار ده.</p>
</section>
