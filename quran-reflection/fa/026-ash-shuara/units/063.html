<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۶۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَوحَينا" data-root="و ح ي" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">فَأَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنِ</button>
    <button class="word-link" type="button" data-word="اضرِب" data-root="ض ر ب" data-learn-more="/quran-terminology/fa/roots/dad-r-b/" data-root-meaning="اثرگذاری قاطع، برخورد، نهادن، حرکت، مثال آوردن، فاصله‌گذاری و تغییر وضعیت">اضرِب</button>
    <button class="word-link" type="button" data-word="بِعَصاكَ" data-root="ع ص و" data-learn-more="/quran-terminology/fa/roots/ayn-sad-w/" data-root-meaning="عصا، تکیه‌گاه، ابزار مهار، و وسیله‌ای برای جمع کردن توان و نظم دادن به حرکت.">بِعَصاكَ</button>
    <button class="word-link" type="button" data-word="البَحرَ" data-root="ب ح ر" data-learn-more="/quran-terminology/fa/roots/b-h-r/" data-root-meaning="پهنه گسترده آب، گشودگی و وسعت، و محیطی که هم مایه زندگی و حرکت است و هم محل خطر و ناتوانی انسان">البَحرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَانفَلَقَ" data-root="ف ل ق" data-root-meaning="فلق، شکافتن و از هم گشودن چیزی است؛ در کاربرد مادی، به ایجاد شکاف و جدا شدن بخش‌ها مربوط می‌شود؛ و در کاربرد مربوط به صبح، به پدیدار شدن سپیده و آشکار شدن روشنایی آغاز روز اشاره دارد. «فالق» شکافنده و گشاینده است، «انفلق» شکافته شدن را بیان می‌کند و «الفلق» در سوره فلق نام سپیده‌دم است." data-learn-more="/quran-terminology/fa/roots/f-l-q/">فَانفَلَقَ</button>
    <button class="word-link" type="button" data-word="فَكانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">فَكانَ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="ك ل ل" data-learn-more="/quran-terminology/fa/roots/k-l-l/" data-root-meaning="تمامیت، کلیت، فراگیری؛ و در برخی صورت‌ها احاطه از اطراف، فرسودگی، یا وضعیت بدون امتداد مستقیم.">كُلُّ</button>
    <button class="word-link" type="button" data-word="فِرقٍ" data-root="ف ر ق" data-learn-more="/quran-terminology/fa/roots/f-r-q/" data-root-meaning="جداکردن، متمایزساختن، شکافتن یک پیوستگی، و پدیدآوردن مرز میان دو چیز یا دو مسیر">فِرقٍ</button>
    <button class="word-link" type="button" data-word="كَالطَّودِ" data-root="ط و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">كَالطَّودِ</button>
    <button class="word-link" type="button" data-word="العَظيمِ" data-root="ع ظ م" data-learn-more="/quran-terminology/fa/roots/ayn-zha-m/" data-root-meaning="عظمت، قوام، وزن، شأن، و سنگینی اثر">العَظيمِ</button>
  </p>
  <p class="farsi-verse">پس به موسی وحی کردیم: با عصایت به دریا بزن. پس شکافت، و هر پاره چون کوهی بزرگ بود.</p>
</section>
