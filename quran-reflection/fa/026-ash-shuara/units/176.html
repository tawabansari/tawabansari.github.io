<section class="ayah-block" id="ayah-176" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۷۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذَّبَ" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="ص ح ب" data-learn-more="/quran-terminology/fa/roots/sad-h-b/" data-root-meaning="همراهی، مصاحبت، ملازمت، هم‌نشینی، همراه بودن در مسیر یا حالت، و نسبت پایدار میان دو طرف">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="لـَٔيكَةِ" data-context="ایکه: بیشه یا درختستان." data-root-note="پژوهش واژه به‌زودی افزوده می‌شود؛ ریشه‌ای نسبت داده نشده است.">لـَٔيكَةِ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند">المُرسَلينَ</button>
  </p>
  <p class="farsi-verse">اهل بیشه فرستادگان را تکذیب کردند.</p>
</section>
