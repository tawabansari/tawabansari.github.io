<section class="ayah-block" id="ayah-148" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۴۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَزُروعٍ" data-root="ز ر ع" data-learn-more="/quran-terminology/fa/roots/z-r-ayn/" data-root-meaning="قرار دادن بذر، رویش، رشد گیاه و پیدایش محصول">وَزُروعٍ</button>
    <button class="word-link" type="button" data-word="وَنَخلٍ" data-root="ن خ ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَنَخلٍ</button>
    <button class="word-link" type="button" data-word="طَلعُها" data-root="ط ل ع" data-root-meaning="ط ل ع در هسته شناخته‌شده خود به برآمدن و آشکار شدن مربوط است. در کاربردهای طبیعی، پدیدار شدن خورشید و سر برآوردن محصول گیاه را بیان می‌کند؛ در کاربردهای مربوط به انسان، می‌تواند به مشاهده یا آگاه شدن از چیزی اشاره کند که پیش‌تر در دسترس او نبوده است؛ و در بعضی ساخت‌ها، معنای رسیدن به جایگاهی را می‌رساند." data-learn-more="/quran-terminology/fa/roots/tt-l-ayn/">طَلعُها</button>
    <button class="word-link" type="button" data-word="هَضيمٌ" data-root="ه ض م" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">هَضيمٌ</button>
  </p>
  <p class="farsi-verse">و کشتزارها و نخل‌هایی که شکوفه‌شان لطیف است؟</p>
</section>
