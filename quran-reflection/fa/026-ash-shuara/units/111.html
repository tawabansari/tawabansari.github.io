<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="مخالفان نوح این اعتراض را گفتند.">قالوا</button>
    <button class="word-link" type="button" data-word="أَنُؤمِنُ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز" data-context="آیا دعوت تو را بپذیریم و به تو ایمان بیاوریم؟ پرسش اعتراضی مخالفان.">أَنُؤمِنُ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعَكَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن." data-context="در حالی که از تو پیروی کرده‌اند؛ اشارهٔ مخالفان به پیروان نوح.">وَاتَّبَعَكَ</button>
    <button class="word-link" type="button" data-word="الأَرذَلونَ" data-root="ر ذ ل" data-learn-more="/quran-terminology/fa/roots/r-dh-l/" data-root-meaning="فرودستی و نامرغوبیِ مرتبه یا کیفیت؛ در سخن مخالفان نوح، تحقیر اجتماعی پیروان؛ «أرذل العمر»: فرسوده‌ترین وضعیت عمر از نظر کاهش توانایی‌ها، نه ارزش اخلاقی شخص." data-context="فرودستان؛ عنوانی تحقیرآمیز که مخالفان نوح برای پیروان او به کار می‌برند.">الأَرذَلونَ</button>
  </p>
  <p class="farsi-verse">گفتند: آیا به تو ایمان بیاوریم، در حالی که فرومایگان از تو پیروی کرده‌اند؟</p>
</section>
