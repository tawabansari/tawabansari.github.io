<section class="ayah-block" id="ayah-181" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۸۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوفُوا" data-root="و ف ي" data-learn-more="/quran-terminology/fa/roots/w-f-y/">أَوفُوا</button>
    <button class="word-link" type="button" data-word="الكَيلَ" data-root="ك ي ل" data-learn-more="/quran-terminology/fa/roots/k-y-l/" data-root-meaning="پیمانه کردن، اندازه گرفتن با ظرف یا پیمانه، کامل ادا کردن مقدار، و سنجش حجمی در دادوستد">الكَيلَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكونوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">تَكونوا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُخسِرينَ" data-root="خ س ر" data-learn-more="/quran-terminology/fa/roots/kh-s-r/" data-root-meaning="زیان کردن، کم شدن، نقصان یافتن، از دست دادن سرمایه، و باختن نتیجه پس از سنجش">المُخسِرينَ</button>
  </p>
  <p class="farsi-verse">پیمانه را کامل بدهید و از کم‌فروشان نباشید.</p>
