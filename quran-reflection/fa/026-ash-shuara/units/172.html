<section class="ayah-block" id="ayah-172" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۷۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="دَمَّرنَا" data-root="د م ر" data-learn-more="/quran-terminology/fa/roots/d-m-r/" data-root-meaning="هلاکت و نابودی شدید؛ تدمیر: نابود کردن یا ویران ساختن. در شاخهٔ دیگری از عربی، دَمَرَ به وارد شدن یا هجوم بردن گفته می‌شود." data-context="نابود کردیم؛ دربارهٔ دیگران در برابر گروه نجات‌یافته در داستان لوط.">دَمَّرنَا</button>
    <button class="word-link" type="button" data-word="الـٔاخَرينَ" data-root="أ خ ر" data-learn-more="/quran-terminology/fa/roots/a-kh-r/" data-root-meaning="پسینی، تأخیر، دیگری بودن، و نهایت" data-context="دیگران؛ در این سیاق، گروه بیرون از نجات‌یافتگان داستان لوط.">الـٔاخَرينَ</button>
  </p>
  <p class="farsi-verse">سپس دیگران را نابود کردیم.</p>
</section>
