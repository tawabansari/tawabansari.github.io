<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۵۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَخرَجنٰهُم" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">فَأَخرَجنٰهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="وَعُيونٍ" data-root="ع ي ن" data-learn-more="/quran-terminology/fa/roots/ayn-y-n/">وَعُيونٍ</button>
  </p>
  <p class="farsi-verse">پس آنان را از باغ‌ها و چشمه‌ها بیرون آوردیم؛</p>
