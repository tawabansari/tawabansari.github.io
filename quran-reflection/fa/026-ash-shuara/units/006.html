<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَقَد</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="ك ذ ب" data-learn-more="/quran-terminology/fa/roots/k-dh-b/" data-root-meaning="خلاف واقع گفتن، ناراست دانستن، دروغ شمردن، نسبت ناراستی دادن، و شکستن اعتبار یک خبر، نشانه، وعده یا پیام">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="فَسَيَأتيهِم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">فَسَيَأتيهِم</button>
    <button class="word-link" type="button" data-word="أَنبٰؤُا۟" data-root="ن ب أ" data-learn-more="/quran-terminology/fa/roots/n-b-a/" data-root-meaning="خبر، آگاه ساختن و عنوان «نبی»">أَنبٰؤُا۟</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="ه ز أ" data-learn-more="/quran-terminology/fa/roots/h2-z-a/" data-root-meaning="مسخره کردن، سبک شمردن، تحقیر، بی‌وزن جلوه دادن، و برخورد بازی‌گونه با چیزی که جایگاه جدی دارد">يَستَهزِءونَ</button>
  </p>
  <p class="farsi-verse">پس تکذیب کردند؛ و به‌زودی خبرهای آنچه را مسخره می‌کردند دریافت خواهند کرد.</p>
</section>
