  <h2 class="ayah-title">الشعراء ۲۶:۲۱۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَوَكَّل" data-root="و ك ل" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَتَوَكَّل</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَى</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری">العَزيزِ</button>
    <button class="word-link" type="button" data-word="الرَّحيمِ" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">الرَّحيمِ</button>
  </p>
  <p class="farsi-verse">و بر آن شکست‌ناپذیرِ رحیم تکیه کن؛</p>
