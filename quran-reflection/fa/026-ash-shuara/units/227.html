  <p class="farsi-verse">مگر کسانی که ایمان آوردند و کارهای شایسته کردند و آن معبود یگانه را بسیار یاد کردند و پس از آنکه ستم دیدند از خود دفاع کردند؛ و کسانی که ستم کردند به‌زودی خواهند دانست به چه بازگشتگاهی بازمی‌گردند.</p>
