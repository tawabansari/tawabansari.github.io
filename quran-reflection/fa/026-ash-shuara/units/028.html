<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="رَبُّ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبُّ</button>
    <button class="word-link" type="button" data-word="المَشرِقِ" data-root="ش ر ق" data-learn-more="/quran-terminology/fa/roots/sh-r-q/" data-root-meaning="از برآمدن خورشید و روشن شدن افق تا مشرق و مشارق">المَشرِقِ</button>
    <button class="word-link" type="button" data-word="وَالمَغرِبِ" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/" data-root-meaning="از غروب خورشید و دور شدن از دید تا مغرب، غربت و شاخه‌های دیگر">وَالمَغرِبِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينَهُما</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ع ق ل" data-learn-more="/quran-terminology/fa/roots/ayn-q-l/" data-root-meaning="بستن، مهار کردن، فهمیدن، پیوند دادن معنا و بازداشتن داوری از پراکندگی">تَعقِلونَ</button>
  </p>
  <p class="farsi-verse">گفت: پروردگار مشرق و مغرب و آنچه میان آن دو است، اگر خرد به کار ببرید.</p>
</section>
