<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۹۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجُنودُ" data-root="ج ن د" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-d/" data-root-meaning="جند و جنود: سپاه، نیروها و گروه‌های سازمان‌یافتهٔ پشتیبان.">وَجُنودُ</button>
    <button class="word-link" type="button" data-word="إِبليسَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِبليسَ</button>
    <button class="word-link" type="button" data-word="أَجمَعونَ" data-root="ج م ع" data-learn-more="/quran-terminology/fa/roots/j-m-ayn/" data-root-meaning="گرد آوردن، کنار هم آوردن، و پایان دادن به پراکندگی در یک میدان مشترک">أَجمَعونَ</button>
  </p>
  <p class="farsi-verse">و سپاهیان ابلیس، همگی.</p>
</section>
