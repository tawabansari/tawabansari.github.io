<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="نَشَأ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">نَشَأ</button>
    <button class="word-link" type="button" data-word="نُنَزِّل" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/">نُنَزِّل</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/">ءايَةً</button>

    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="خٰضِعينَ" data-root="خ ض ع" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خٰضِعينَ</button>
  </p>
  <p class="farsi-verse">اگر بخواهیم، از آسمان نشانه‌ای بر آنان فرو می‌فرستیم که گردن‌هایشان در برابر آن فروتن بماند.</p>
