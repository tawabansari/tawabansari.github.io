<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="نَشَأ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهیم؛ خواست و مشیتِ الهی در جملهٔ شرط.">نَشَأ</button>
    <button class="word-link" type="button" data-word="نُنَزِّل" data-root="ن ز ل" data-learn-more="/quran-terminology/fa/roots/n-z-l/" data-root-meaning="فرود، منزل‌گرفتن، و دسترس‌پذیر شدن حقیقت" data-context="فرو می‌فرستیم؛ در اینجا فرستادن نشانه‌ای از آسمان بر آنان.">نُنَزِّل</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="س م و" data-learn-more="/quran-terminology/fa/roots/s-m-w/" data-root-meaning="بلندی، بالا بودن، رفعت، برتر قرار گرفتن، و جهت فراز" data-context="آسمان؛ در اینجا مبدأ فرود آمدن نشانهٔ یادشده.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد" data-context="نشانه‌ای؛ آنچه در این شرط بر آنان فرستاده می‌شود و در برابرش سر فرود می‌آورند.">ءايَةً</button>
    <button class="word-link" type="button" data-word="فَظَلَّت" data-root="ظ ل ل" data-learn-more="/quran-terminology/fa/roots/zha-l-l/" data-root-meaning="سایه و پوششی که مانع تابش مستقیم می‌شود؛ سایه‌افکندن و در فعل ظَلَّ، ادامه یافتن یا در حالتی باقی ماندن." data-context="بماند؛ استمرار حالت خضوع در ساخت «فظلت أعناقهم».">فَظَلَّت</button>
    <button class="word-link" type="button" data-word="أَعنٰقُهُم" data-root="ع ن ق" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-n-q/" data-root-meaning="گردن؛ گاه نماینده اشخاص یا حالت سر و گردن." data-context="گردن‌های آنان؛ نشانهٔ جسمانیِ سر فرود آوردنِ خود آنان.">أَعنٰقُهُم</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَها</button>
    <button class="word-link" type="button" data-word="خٰضِعينَ" data-root="خ ض ع" data-root-meaning="فروآمدن، سر فرود آوردن و تسلیم‌شدن؛ و در گفتار، نرمش و تمایل خاضعانه." data-context="خاضع و سر فرودآورده در برابر آن نشانهٔ الهی؛ وصفِ حال صاحبان گردن‌ها." data-learn-more="/quran-terminology/fa/roots/kh-dad-ayn/">خٰضِعينَ</button>
  </p>
  <p class="farsi-verse">اگر بخواهیم، از آسمان نشانه‌ای بر آنان فرو می‌فرستیم که گردن‌هایشان در برابر آن فروتن بماند.</p>
</section>
