<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="لَشِرذِمَةٌ" data-root="ش ر ذ م" data-root-meaning="پاره یا بخشی جداشده از چیزی؛ در کاربرد انسانی، جماعتی اندک یا گروهی محدود از یک مجموعهٔ بزرگ‌تر." data-context="به‌راستی گروهی اندک؛ توصیف فرعون از همراهان موسی، بدون بیان شمار دقیق آنان." data-learn-more="/quran-terminology/fa/roots/sh-r-dh-m/">لَشِرذِمَةٌ</button>
    <button class="word-link" type="button" data-word="قَليلونَ" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر" data-context="اندک‌اند؛ صفتی جمع که کم‌شمار بودن افرادِ همان گروه را در سخن فرعون تأکید می‌کند.">قَليلونَ</button>
  </p>
  <p class="farsi-verse">اینها گروهی اندک‌اند؛</p>
