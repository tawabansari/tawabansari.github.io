<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَلقَوا" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه" data-context="پس انداختند؛ طناب‌ها و عصاهایشان را.">فَأَلقَوا</button>
    <button class="word-link" type="button" data-word="حِبالَهُم" data-root="ح ب ل" data-root-meaning="ریسمان و رشتهٔ ممتد؛ پیوند، عهد و وسیلهٔ اتصال و حمایت." data-context="طناب‌هایشان؛ وسایلی که ساحران همراه عصاهای خود انداختند." data-learn-more="/quran-terminology/fa/roots/h-b-l/">حِبالَهُم</button>
    <button class="word-link" type="button" data-word="وَعِصِيَّهُم" data-root="ع ص و" data-learn-more="/quran-terminology/fa/roots/ayn-sad-w/" data-root-meaning="عصا، تکیه‌گاه، ابزار مهار، و وسیله‌ای برای جمع کردن توان و نظم دادن به حرکت." data-context="و عصاهایشان؛ وسایلی که همراه طناب‌ها انداختند.">وَعِصِيَّهُم</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="و گفتند؛ سخن ساحران پس از انداختن وسایل.">وَقالوا</button>
    <button class="word-link" type="button" data-word="بِعِزَّةِ" data-root="ع ز ز" data-learn-more="/quran-terminology/fa/roots/ayn-z-z/" data-root-meaning="قدرت، استواری، شکست‌ناپذیری، عزت و دشواری" data-context="به عزت و قدرت فرعون؛ عبارت سوگند در سخن ساحران.">بِعِزَّةِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّا</button>
    <button class="word-link" type="button" data-word="لَنَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَنَحنُ</button>
    <button class="word-link" type="button" data-word="الغٰلِبونَ" data-root="غ ل ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-l-b/" data-root-meaning="چیره شدن و غلبه یافتن." data-context="پیروزان و چیره‌شدگان؛ ادعای ساحران دربارهٔ نتیجهٔ رویارویی.">الغٰلِبونَ</button>
  </p>
  <p class="farsi-verse">پس ریسمان‌ها و عصاهایشان را افکندند و گفتند: به عزت فرعون، ما حتماً پیروزیم.</p>
</section>
