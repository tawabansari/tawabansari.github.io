<section class="ayah-block" id="ayah-197" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۱۹۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَكُن" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">يَكُن</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="أ ي ي" data-learn-more="/quran-terminology/fa/roots/a-y-y/" data-root-meaning="نشانه، علامت روشن، امر قابل توجه، و چیزی که انسان را به حقیقتی فراتر از خود راه می‌دهد">ءايَةً</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَعلَمَهُ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">يَعلَمَهُ</button>
    <button class="word-link" type="button" data-word="عُلَمٰؤُا۟" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">عُلَمٰؤُا۟</button>
    <button class="word-link" type="button" data-word="بَنى" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">بَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">إِسرٰءيلَ</button>
  </p>
  <p class="farsi-verse">آیا برای آنان نشانه‌ای نبود که دانشوران فرزندان اسرائیل آن را می‌دانند؟</p>
</section>
