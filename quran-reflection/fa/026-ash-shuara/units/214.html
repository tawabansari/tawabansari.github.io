<section class="ayah-block" id="ayah-214" data-translation-status="provisional">
  <h2 class="ayah-title">الشعراء ۲۶:۲۱۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنذِر" data-root="ن ذ ر" data-learn-more="/quran-terminology/fa/roots/n-dh-r/" data-root-meaning="نذر، هشدار، تعهد، و بیدارسازی پیش از پیامد">وَأَنذِر</button>
    <button class="word-link" type="button" data-word="عَشيرَتَكَ" data-root="ع ش ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَشيرَتَكَ</button>
    <button class="word-link" type="button" data-word="الأَقرَبينَ" data-root="ق ر ب" data-learn-more="/quran-terminology/fa/roots/q-r-b/" data-root-meaning="نزدیک شدن، نزدیک بودن، کم شدن فاصله، ورود به حریم، و مقام قرب">الأَقرَبينَ</button>
  </p>
  <p class="farsi-verse">و خویشاوندان نزدیکت را هشدار بده.</p>
