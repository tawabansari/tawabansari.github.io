  <p class="farsi-verse">و در هنگامی که مردم شهر بی‌خبر بودند به آن درآمد و دو مرد را یافت که با هم می‌جنگیدند؛ یکی از گروه او و دیگری از دشمنانش بود. پس آنکه از گروه او بود، علیه دشمنش از او یاری خواست؛ موسی او را مشت زد و کارش را تمام کرد. گفت: این از کار شیطان است؛ او دشمنی گمراه‌کننده و آشکار است.</p>
