  <p class="farsi-verse">و پروردگارت آبادی‌ها را هلاک نمی‌کرد تا در مرکز آنها فرستاده‌ای برانگیزد که آیات ما را بر آنان بخواند؛ و ما آبادی‌ها را هلاک نمی‌کردیم مگر آنکه مردمشان ستمگر بودند.</p>
