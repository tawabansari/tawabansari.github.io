  <h2 class="ayah-title">القصص ۲۸:۱۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>

    <button class="word-link" type="button" data-word="أَرادَ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="خواست و قصد کرد؛ در خوانش پایه، قصد موسی برای حمله به دشمن مشترک.">أَرادَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="يَبطِشَ" data-root="ب ط ش" data-root-meaning="گرفتن یا برخورد کردن با قدرت، شدت و غلبه؛ و در کاربردهای گسترده‌تر، توانِ اعمال قهر و چیرگی." data-context="با شدت بگیرد یا حمله کند؛ اقدام مورد قصد در آغاز آیه." data-learn-more="/quran-terminology/fa/roots/b-tt-sh/">يَبطِشَ</button>
    <button class="word-link" type="button" data-word="بِالَّذى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِالَّذى</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هُوَ</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن هر دو؛ کسی که قصد رویارویی با او مطرح است.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُما</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ هویت گوینده پس از این فعل صریحا نام برده نشده و دو خوانش مطرح است.">قالَ</button>
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰموسىٰ</button>

    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَقتُلَنى" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="مرا بکشی؛ ترس یا اعتراض گوینده درباره کشته شدن خودش.">تَقتُلَنى</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَما</button>
    <button class="word-link" type="button" data-word="قَتَلتَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="کشتی؛ یادآوری مرگ کسی در حادثه روز پیش.">قَتَلتَ</button>
    <button class="word-link" type="button" data-word="نَفسًا" data-root="ن ف س" data-learn-more="/quran-terminology/fa/roots/n-f-s/" data-root-meaning="نفس، خودِ صاحب وجود، خودِ یک حقیقت، عینِ صاحب نسبت، خویشتن، مسئولیت، و بازگشت عمل به خود" data-context="کسی، یک انسان؛ شخصی که روز پیش کشته شد.">نَفسًا</button>
    <button class="word-link" type="button" data-word="بِالأَمسِ" data-root="أ م س" data-learn-more="/quran-terminology/fa/roots/a-m-s/" data-root-meaning="روز پیش از روز حاضر یا روز مورد اشاره؛ و در کاربرد گسترده‌تر، گذشته نزدیک یا زمانی سپری‌شده که در برابر وضعیت کنونی قرار می‌گیرد." data-context="دیروز؛ همان روز پیش که قتل یادشده در آن رخ داد و در جریان قبلی داستان آمده است.">بِالأَمسِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="تُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="نمی‌خواهی جز اینکه؛ «إن تريد إلا» ساخت نفی و حصر در سخن گوینده است.">تُريدُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="باشی؛ در اتهام گوینده که موسی می‌خواهد زورگو باشد.">تَكونَ</button>
    <button class="word-link" type="button" data-word="جَبّارًا" data-root="ج ب ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-b-r/" data-root-meaning="ترمیم و استوار کردن همراه با اعمال قدرت؛ جبّار بسته به سیاق، صاحب اقتدار یا زورگو است." data-context="زورگو و سلطه‌گر؛ وصفی که گوینده در سخن انتقادی خود به کار می‌برد.">جَبّارًا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد" data-context="در زمین؛ عرصه رفتار زورگویانه‌ای که گوینده به موسی نسبت می‌دهد.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="تُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="و نمی‌خواهی؛ ادامه ادعای گوینده درباره قصد موسی، نه تعریف واژه «دیروز».">تُريدُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="از اصلاح‌گران باشی؛ وضعیتی که گوینده آن را از قصد موسی نفی می‌کند.">تَكونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُصلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="اصلاح‌گران؛ کسانی که به درست شدن امور می‌پردازند، در برابر زورگویی در سخن گوینده.">المُصلِحينَ</button>
  </p>
  <p class="farsi-verse">پس چون خواست به کسی که دشمن هر دوی آنان بود دست بگشاید، گفت: ای موسی، آیا می‌خواهی مرا بکشی، چنان‌که دیروز کسی را کشتی؟ تو جز این نمی‌خواهی که در زمین زورگو باشی و نمی‌خواهی از اصلاحگران باشی.</p>
</section>
