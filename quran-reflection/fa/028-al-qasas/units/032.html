<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۳۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اسلُك" data-root="س ل ك" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-l-k/" data-root-meaning="در راهی رفتن یا چیزی را در مسیر و جایگاهی درآوردن.">اسلُك</button>
    <button class="word-link" type="button" data-word="يَدَكَ" data-root="ي د ي" data-learn-more="/quran-terminology/fa/roots/y-d-y/" data-root-meaning="دست؛ ابزار تحقق اراده، عمل، اختیار، تصرف، مسئولیت، بخشش و پیمان.">يَدَكَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فى</button>
    <button class="word-link" type="button" data-word="جَيبِكَ" data-root="ج ي ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-y-b/" data-root-meaning="جیب و جیوب: گشودگیِ گریبان و بخش جلوی لباس در پیرامون سینه.">جَيبِكَ</button>
    <button class="word-link" type="button" data-word="تَخرُج" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر">تَخرُج</button>
    <button class="word-link" type="button" data-word="بَيضاءَ" data-root="ب ي ض" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/b-y-dad/" data-root-meaning="سفیدی و سفید شدن؛ بَیض در شاخه‌ای دیگر به تخم اشاره دارد.">بَيضاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="غَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">غَيرِ</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">سوءٍ</button>
    <button class="word-link" type="button" data-word="وَاضمُم" data-root="ض م م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-m-m/" data-root-meaning="پیوستن و نزدیک هم آوردن.">وَاضمُم</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="جَناحَكَ" data-root="ج ن ح" data-root-meaning="بال، پهلو، متمایل شدن و گناه؛ از حرکت پرنده و فروتنی انسان تا «لا جناح» در احکام قرآن و گرایش به صلح" data-learn-more="/quran-terminology/fa/roots/j-n-h/">جَناحَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الرَّهبِ" data-root="ر ه ب" data-learn-more="/quran-terminology/fa/roots/r-h2-b/" data-root-meaning="هیبت، پروا، مراقبت، و انقباض در برابر عظمت و پیامد">الرَّهبِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذٰنِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَذٰنِكَ</button>
    <button class="word-link" type="button" data-word="بُرهٰنانِ" data-root="ب ر ه ن" data-learn-more="/quran-terminology/fa/roots/b-r-h2-n/" data-root-meaning="برهان؛ دلیلی که چیزی را روشن و اثبات می‌کند">بُرهٰنانِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/" data-root-meaning="پروردگاری، پرورش، مالکیت همراه با تدبیر، رساندن موجود به مرحله رشد، و حقّ فرمانروایی بر اساس ربوبیت">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَمَلَإِي۟هِ" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه.">وَمَلَإِي۟هِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانوا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">قَومًا</button>
    <button class="word-link" type="button" data-word="فٰسِقينَ" data-root="ف س ق" data-learn-more="/quran-terminology/fa/roots/f-s-q/" data-root-meaning="بیرون رفتن از حد، خروج از عهد و فرمان، گسستن از امانت، و نافرمانی عملی در برابر حق روشن">فٰسِقينَ</button>
  </p>
  <p class="farsi-verse">دستت را در گریبانت ببر تا بی‌هیچ آسیبی سفید بیرون آید؛ و بالت را از ترس به خود بپیوند. این دو، دو برهان از پروردگارت به سوی فرعون و بزرگان اوست؛ آنان قومی نافرمان بودند.</p>
</section>
