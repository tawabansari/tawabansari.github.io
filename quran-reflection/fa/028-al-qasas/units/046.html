  <p class="farsi-verse">و تو در کنار کوه نبودی هنگامی که ندا دادیم؛ ولی رحمتی از پروردگارت بود تا قومی را هشدار دهی که پیش از تو هشداردهنده‌ای نزدشان نیامده بود، شاید یاد آورند.</p>
