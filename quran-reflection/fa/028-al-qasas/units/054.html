<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۵۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="يُؤتَونَ" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">يُؤتَونَ</button>
    <button class="word-link" type="button" data-word="أَجرَهُم" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">أَجرَهُم</button>
    <button class="word-link" type="button" data-word="مَرَّتَينِ" data-root="م ر ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَرَّتَينِ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِما</button>
    <button class="word-link" type="button" data-word="صَبَروا" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">صَبَروا</button>
    <button class="word-link" type="button" data-word="وَيَدرَءونَ" data-root="د ر أ" data-learn-more="/quran-terminology/fa/roots/d-r-a/" data-root-meaning="دور کردن، پس زدن، بازداشتن و جلوگیری از رسیدن یا اثر کردن چیزی">وَيَدرَءونَ</button>
    <button class="word-link" type="button" data-word="بِالحَسَنَةِ" data-root="ح س ن" data-learn-more="/quran-terminology/fa/roots/h-s-n/" data-root-meaning="نیکو، زیبا و شایسته بودن؛ یا چیزی را نیکو انجام دادن و نیکی را به دیگری رساندن.">بِالحَسَنَةِ</button>
    <button class="word-link" type="button" data-word="السَّيِّئَةَ" data-root="س و أ" data-learn-more="/quran-terminology/fa/roots/s-w-a/" data-root-meaning="از بدی و ناخوشایندی تا سیئه، آسیب و سوءه">السَّيِّئَةَ</button>
    <button class="word-link" type="button" data-word="وَمِمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="ن ف ق" data-learn-more="/quran-terminology/fa/roots/n-f-q/" data-root-meaning="انفاق، بیرون دادن از رزق و به جریان انداختن نعمت؛ و نفاق، دوگانگی پنهان، خروج از صدق، و ساختن راهی مخفی میان ظاهر و باطن">يُنفِقونَ</button>
  </p>
  <p class="farsi-verse">آنان به سبب شکیبایی‌شان دو بار پاداش می‌گیرند و بدی را با نیکی دفع می‌کنند و از آنچه روزی‌شان کرده‌ایم می‌بخشند.</p>
</section>
