<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۱۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَصبَحَ" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ." data-context="پس صبح کرد؛ موسی روز بعد را در شهر با بیم و مراقبت آغاز کرد.">فَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-d-n/" data-root-meaning="مدینه: شهر و آبادی؛ تحلیل آن از «مدن» یا «دین» اختلافی است." data-context="در شهر؛ صحنه ادامه داستان پس از حادثه روز پیش.">المَدينَةِ</button>
    <button class="word-link" type="button" data-word="خائِفًا" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید" data-context="بیمناک؛ حالت موسی پس از کشته شدن مرد در روز پیش.">خائِفًا</button>
    <button class="word-link" type="button" data-word="يَتَرَقَّبُ" data-root="ر ق ب" data-root-meaning="زیر نظر داشتن، مراقبت، انتظار و رعایت؛ رقبة: گردن و به کنایه، تمام شخص یا انسان در بند." data-context="مراقب و چشم‌به‌راه بود؛ موسی در شهر منتظر آنچه ممکن بود رخ دهد بود. ترس جداگانه با «خائفاً» بیان می‌شود." data-learn-more="/quran-terminology/fa/roots/r-q-b/">يَتَرَقَّبُ</button>
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="الَّذِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذِى</button>
    <button class="word-link" type="button" data-word="استَنصَرَهُ" data-root="ن ص ر" data-learn-more="/quran-terminology/fa/roots/n-sad-r/" data-root-meaning="یاری‌رساندن، پشتیبانی‌کردن در برابر فشار و دشمن، و رساندن نیرویی که به دفع آسیب یا غلبه می‌انجامد" data-context="از او یاری خواسته بود؛ همان مردی که روز پیش از موسی کمک خواست.">استَنصَرَهُ</button>
    <button class="word-link" type="button" data-word="بِالأَمسِ" data-root="أ م س" data-learn-more="/quran-terminology/fa/roots/a-m-s/" data-root-meaning="روز پیش از روز حاضر یا روز مورد اشاره؛ و در کاربرد گسترده‌تر، گذشته نزدیک یا زمانی سپری‌شده که در برابر وضعیت کنونی قرار می‌گیرد." data-context="دیروز؛ روز مشخص پیش از این صحنه که آن مرد از موسی یاری خواسته بود.">بِالأَمسِ</button>
    <button class="word-link" type="button" data-word="يَستَصرِخُهُ" data-root="ص ر خ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-r-kh/" data-root-meaning="فریاد و فریادرسی؛ صریخ: فریادخواه یا یاری‌رسان، بنا بر سیاق." data-context="با فریاد از او کمک می‌خواهد؛ درخواست تازه همان شخص از موسی.">يَستَصرِخُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ سخن موسی خطاب به کسی که دوباره از او کمک می‌خواست.">قالَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسىٰ</button>
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="لَغَوِىٌّ" data-root="غ و ي" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/gh-w-y/" data-root-meaning="گمراهی و منحرف ساختن از راه درست." data-context="آشکارا بی‌راهه‌رو؛ تعبیر انتقادی موسی خطاب به آن مرد.">لَغَوِىٌّ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز" data-context="آشکار؛ وصف روشن بودن بی‌راهگی در سخن موسی.">مُبينٌ</button>
  </p>
  <p class="farsi-verse">پس در شهر ترسان و مراقب بود؛ ناگهان همان کسی که روز پیش از او یاری خواسته بود، فریادزنان کمک خواست. موسی به او گفت: تو آشکارا گمراهی.</p>
</section>
