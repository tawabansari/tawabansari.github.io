<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۴۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتَ</button>
    <button class="word-link" type="button" data-word="بِجانِبِ" data-root="ج ن ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/j-n-b/" data-root-meaning="پهلو، کنار و ناحیه؛ اجتناب: کنار گرفتن و دوری کردن؛ جُنُب وضعیت آیینیِ مشخصی است.">بِجانِبِ</button>
    <button class="word-link" type="button" data-word="الغَربِىِّ" data-root="غ ر ب" data-learn-more="/quran-terminology/fa/roots/gh-r-b/" data-root-meaning="از غروب خورشید و دور شدن از دید تا مغرب، غربت و شاخه‌های دیگر">الغَربِىِّ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِذ</button>
    <button class="word-link" type="button" data-word="قَضَينا" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت">قَضَينا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="موسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسَى</button>
    <button class="word-link" type="button" data-word="الأَمرَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا">الأَمرَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كُنتَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشّٰهِدينَ" data-root="ش ه د" data-learn-more="/quran-terminology/fa/roots/sh-h2-d/" data-root-meaning="حضور آگاهانه، مشاهده مسئولانه، گواهی، و ایستادن در نسبت با حقیقت">الشّٰهِدينَ</button>
  </p>
  <p class="farsi-verse">و تو در سوی غربی نبودی هنگامی که فرمان را به موسی سپردیم، و از گواهان نبودی.</p>
