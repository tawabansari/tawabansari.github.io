<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۸۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَصبَحَ" data-root="ص ب ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sad-b-h/" data-root-meaning="صبح و آغاز روشنایی روز؛ مصباح: چراغ." data-context="و به وضع تازه درآمدند؛ کسانی که جایگاه قارون را می‌خواستند اکنون سخن دیگری می‌گویند؛ فعل می‌تواند رسیدن به صبح نیز برساند.">وَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="تَمَنَّوا" data-root="م ن ي" data-learn-more="/quran-terminology/fa/roots/m-n-y/" data-root-meaning="از تقدیر و آرزو تا تلاوت، امانی و منی" data-context="آرزو کرده بودند؛ میل پیشین آن گروه به برخورداری از جایگاه قارون.">تَمَنَّوا</button>
    <button class="word-link" type="button" data-word="مَكانَهُ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="جایگاه او؛ موقعیت قارون و برخورداری‌ای که آن گروه آرزو می‌کردند.">مَكانَهُ</button>
    <button class="word-link" type="button" data-word="بِالأَمسِ" data-root="أ م س" data-learn-more="/quran-terminology/fa/roots/a-m-s/" data-root-meaning="روز پیش از روز حاضر یا روز مورد اشاره؛ و در کاربرد گسترده‌تر، گذشته نزدیک یا زمانی سپری‌شده که در برابر وضعیت کنونی قرار می‌گیرد." data-context="دیروز یا گذشته نزدیک؛ زمان آرزوی پیشین آنان، در برابر داوری تازه پس از فرجام قارون.">بِالأَمسِ</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="می‌گویند؛ بازگویی دریافت تازه کسانی که پیش‌تر جایگاه قارون را می‌خواستند.">يَقولونَ</button>
    <button class="word-link" type="button" data-word="وَيكَأَنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَيكَأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَبسُطُ" data-root="ب س ط" data-root-meaning="گشودن، گستردن و امتداد دادن؛ در کاربردهای گوناگون، گشایش روزی یا وسعت دانش و توانایی نیز از سیاق روشن می‌شود." data-context="گشایش می‌دهد؛ گسترده ساختن روزی که در سخن ناظرانِ سرانجام قارون مطرح می‌شود." data-learn-more="/quran-terminology/fa/roots/b-s-tt/">يَبسُطُ</button>
    <button class="word-link" type="button" data-word="الرِّزقَ" data-root="ر ز ق" data-learn-more="/quran-terminology/fa/roots/r-z-q/" data-root-meaning="رزق، روزی، عطای رسانده‌شده، تأمین نیاز، و گشودن امکان زندگی و رشد" data-context="روزی و برخورداری؛ آنچه گشایش یا تنگی آن در سخن مردم مطرح است.">الرِّزقَ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهد؛ گشایش روزی به خواست آن معبود یگانه نسبت داده می‌شود.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ع ب د" data-learn-more="/quran-terminology/fa/roots/ayn-b-d/" data-root-meaning="بندگی، فروتنی عملی، اطاعت جهت‌دار، خدمت، وابستگی، تسلیم آگاهانه، و قرار دادن خود زیر فرمان و ربوبیت آن معبود یگانه" data-context="از بندگان او؛ کسانی که گشایش یا تنگی روزی درباره آنان بیان شده است.">عِبادِهِ</button>
    <button class="word-link" type="button" data-word="وَيَقدِرُ" data-root="ق د ر" data-learn-more="/quran-terminology/fa/roots/q-d-r/" data-root-meaning="توان داشتن، اندازه گرفتن، سنجش و اندازه‌گذاری کردن، تعیین حد، مرز و ظرفیت؛ و در میدان قرآنی، قدرت بر انجام امور و قرار دادن هر پدیده در اندازه، زمان، ظرفیت و ساختار مناسب خود" data-context="و تنگ می‌سازد؛ محدود کردن روزی در برابر فراخ گرداندن آن.">وَيَقدِرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَولا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَولا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="مَنَّ" data-root="م ن ن" data-learn-more="/quran-terminology/fa/roots/m-n-n/" data-root-meaning="رساندن عطا یا احسانی برجسته؛ به رخ کشیدن آن عطا؛ آزاد کردن بدون عوض؛ و بریدن، کاستن یا پایان یافتن." data-context="بر ما لطف کرد؛ آن گروه رهایی از فرجام قارون را نعمتی بر خود می‌دانند.">مَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَينا</button>
    <button class="word-link" type="button" data-word="لَخَسَفَ" data-root="خ س ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/kh-s-f/" data-root-meaning="فرو رفتن یا فرو بردن در زمین؛ نیز کاهش نور و گرفتگی ماه." data-context="ما را نیز در زمین فرو می‌برد؛ پیامد فرضیِ نبود آن لطف در سخن مردم.">لَخَسَفَ</button>
    <button class="word-link" type="button" data-word="بِنا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِنا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيكَأَنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَيكَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="ف ل ح" data-learn-more="/quran-terminology/fa/roots/f-l-h/" data-root-meaning="شکافتن مانع، به ثمر رسیدن، و رستگاری" data-context="رستگار نمی‌شوند؛ در ساخت منفی، نفی کامیابی نهایی کافران در سخن آنان.">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="ك ف ر" data-learn-more="/quran-terminology/fa/roots/k-f-r/" data-root-meaning="پوشاندن، پنهان کردن، پوشاندن حق و نعمت، و گاهی پوشاندن اثر خطا با جبران" data-context="کافران؛ کسانی که در پایان سخن، رستگاری از آنان نفی می‌شود.">الكٰفِرونَ</button>
  </p>
  <p class="farsi-verse">و کسانی که روز پیش جایگاه او را آرزو کرده بودند، گفتند: شگفتا، آن معبود یگانه روزی را برای هرکه از بندگانش بخواهد گسترش می‌دهد و تنگ می‌گیرد؛ اگر آن معبود یگانه بر ما منت ننهاده بود، ما را فرو می‌برد. شگفتا، انکارکنندگان رستگار نمی‌شوند.</p>
</section>
