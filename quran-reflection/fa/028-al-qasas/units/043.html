<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۴۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">ءاتَينا</button>
    <button class="word-link" type="button" data-word="موسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسَى</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="ك ت ب" data-learn-more="/quran-terminology/fa/roots/k-t-b/" data-root-meaning="نوشتن، به هم پیوستن معنا، ثبت کردن، مقرر ساختن، واجب شدن، سند داشتن، کتاب، نوشتار، و قرار گرفتن چیزی در نظام ثبت، حکم، یا وحی">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="ب ع د" data-learn-more="/quran-terminology/fa/roots/b-ayn-d/" data-root-meaning="دوری، فاصله، پس‌بودن در زمان یا ترتیب، و دورافتادن از رحمت و صلاح">بَعدِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="أَهلَكنَا" data-root="ه ل ك" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">أَهلَكنَا</button>
    <button class="word-link" type="button" data-word="القُرونَ" data-root="ق ر ن" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">القُرونَ</button>
    <button class="word-link" type="button" data-word="الأولىٰ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن">الأولىٰ</button>
    <button class="word-link" type="button" data-word="بَصائِرَ" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">بَصائِرَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="وَهُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">وَهُدًى</button>
    <button class="word-link" type="button" data-word="وَرَحمَةً" data-root="ر ح م" data-learn-more="/quran-terminology/fa/roots/r-h-m/" data-root-meaning="رحمت، مراقبت پرورنده، پیوند نزدیک، بخشایش، و گشودن راه رشد و بازگشت">وَرَحمَةً</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَذَكَّرونَ" data-root="ذ ك ر" data-learn-more="/quran-terminology/fa/roots/dh-k-r/" data-root-meaning="یادآوردن، یاد کردن، حاضر ساختن حقیقت در آگاهی، نگه داشتن نشانه در ذهن، زبان و عمل، و بیرون آوردن انسان از غفلت">يَتَذَكَّرونَ</button>
  </p>
  <p class="farsi-verse">و پس از آنکه نسل‌های پیشین را هلاک کردیم، به موسی کتاب دادیم؛ بینش‌هایی برای مردم و هدایت و رحمتی، شاید یاد آورند.</p>
</section>
