  <p class="farsi-verse">و کسانی که دانش یافته بودند گفتند: وای بر شما؛ پاداش آن معبود یگانه برای کسی که ایمان آورد و کار شایسته کند بهتر است؛ و جز شکیبایان آن را دریافت نمی‌کنند.</p>
