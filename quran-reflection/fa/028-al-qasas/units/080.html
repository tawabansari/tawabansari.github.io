<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۸۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر">أوتُوا</button>
    <button class="word-link" type="button" data-word="العِلمَ" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">العِلمَ</button>
    <button class="word-link" type="button" data-word="وَيلَكُم" data-root="و ي ل" data-learn-more="/quran-terminology/fa/roots/w-y-l/" data-root-meaning="از فریاد اندوه و هشدار تا اعلام بدفرجامی">وَيلَكُم</button>
    <button class="word-link" type="button" data-word="ثَوابُ" data-root="ث و ب" data-learn-more="/quran-terminology/fa/roots/th-w-b/" data-root-meaning="ثَابَ؛ بازگشت و بازآمدن نتیجه">ثَوابُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لِمَن</button>
    <button class="word-link" type="button" data-word="ءامَنَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">ءامَنَ</button>
    <button class="word-link" type="button" data-word="وَعَمِلَ" data-root="ع م ل" data-learn-more="/quran-terminology/fa/roots/ayn-m-l/" data-root-meaning="کار کردن، انجام دادن و آنچه از فاعل صادر می‌شود">وَعَمِلَ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="يُلَقّىٰها" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">يُلَقّىٰها</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الصّٰبِرونَ" data-root="ص ب ر" data-learn-more="/quran-terminology/fa/roots/sad-b-r/" data-root-meaning="نگه‌داشتن، بازداشتن، مهار کردن، و جلوگیری از رهاشدن یا پراکندگی نفس و موضع">الصّٰبِرونَ</button>
  </p>
  <p class="farsi-verse">و کسانی که دانش یافته بودند گفتند: وای بر شما؛ پاداش آن معبود یگانه برای کسی که ایمان آورد و کار شایسته کند بهتر است؛ و جز شکیبایان آن را دریافت نمی‌کنند.</p>
</section>
