    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الكُنوزِ" data-root="ك ن ز" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/k-n-z/" data-root-meaning="گرد آوردن و ذخیره کردن مال." data-context="گنجینه‌ها">الكُنوزِ</button>

    <button class="word-link" type="button" data-word="بِالعُصبَةِ" data-root="ع ص ب" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-sad-b/" data-root-meaning="بستن و استواری گروه؛ عصبه: گروه همبسته؛ عصیب: سخت و دشوار." data-context="بر گروهی نیرومند">بِالعُصبَةِ</button>
    <button class="word-link" type="button" data-word="أُولِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أُولِى</button>
    <button class="word-link" type="button" data-word="القُوَّةِ" data-root="ق و ي" data-learn-more="/quran-terminology/fa/roots/q-w-y/" data-root-meaning="نیرو، توان، قدرت و استحکام؛ توان انجام، تحمل، مقاومت یا اثرگذاری" data-context="توان">القُوَّةِ</button>

    <button class="word-link" type="button" data-word="لَهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُ</button>

    <button class="word-link" type="button" data-word="تَفرَح" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="سرمستی مکن">تَفرَح</button>
    ۖ

    <button class="word-link" type="button" data-word="اللَّهَ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>

    <button class="word-link" type="button" data-word="الفَرِحينَ" data-root="ف ر ح" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/f-r-h/" data-root-meaning="شادی و شادمانی؛ ارزش آن به سیاق وابسته است." data-context="سرمستانِ مغرور">الفَرِحينَ</button>

  <p class="farsi-verse">قارون از قوم موسی بود، پس بر آنان ستم کرد؛ و از گنج‌ها چنان به او داده بودیم که کلیدهایش بر گروهی نیرومند سنگینی می‌کرد. هنگامی که قومش به او گفتند: سرمستی مکن؛ آن معبود یگانه سرمستان را دوست ندارد.</p>
</section>
