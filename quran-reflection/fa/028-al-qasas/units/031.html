<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۳۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَأَن</button>
    <button class="word-link" type="button" data-word="أَلقِ" data-root="ل ق ي" data-learn-more="/quran-terminology/fa/roots/l-q-y/" data-root-meaning="ملاقات، برخورد، روبه‌رو شدن، رسیدن دو چیز به هم، و دریافت چیزی در لحظه مواجهه">أَلقِ</button>
    <button class="word-link" type="button" data-word="عَصاكَ" data-root="ع ص و" data-learn-more="/quran-terminology/fa/roots/ayn-sad-w/" data-root-meaning="عصا، تکیه‌گاه، ابزار مهار، و وسیله‌ای برای جمع کردن توان و نظم دادن به حرکت.">عَصاكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="رَءاها" data-root="ر أ ي" data-learn-more="/quran-terminology/fa/roots/r-a-y/" data-root-meaning="دیدن، مشاهده کردن، دریافت کردن با چشم یا آگاهی">رَءاها</button>
    <button class="word-link" type="button" data-word="تَهتَزُّ" data-root="ه ز ز" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَهتَزُّ</button>
    <button class="word-link" type="button" data-word="كَأَنَّها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">كَأَنَّها</button>
    <button class="word-link" type="button" data-word="جانٌّ" data-root="ج ن ن" data-learn-more="/quran-terminology/fa/roots/j-n-n/" data-root-meaning="پوشیدگی، پنهان بودن از دید، حریم محفوظ، و قرار گرفتن زیر پوشش">جانٌّ</button>
    <button class="word-link" type="button" data-word="وَلّىٰ" data-root="و ل ي" data-learn-more="/quran-terminology/fa/roots/w-l-y/" data-root-meaning="نزدیکی و پیوستگی؛ رابطه‌ای که می‌تواند به جهت‌گیری، حمایت، عهده‌داری، تعلق یا اولویت بینجامد.">وَلّىٰ</button>
    <button class="word-link" type="button" data-word="مُدبِرًا" data-root="د ب ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مُدبِرًا</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَم</button>
    <button class="word-link" type="button" data-word="يُعَقِّب" data-root="ع ق ب" data-learn-more="/quran-terminology/fa/roots/ayn-q-b/" data-root-meaning="پاشنه، پی‌آمدن، جانشینی و فرجام؛ از عاقبت و عقاب تا تعقیب و گذر از عقبه دشوار">يُعَقِّب</button>
    ۚ
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰموسىٰ</button>
    <button class="word-link" type="button" data-word="أَقبِل" data-root="ق ب ل" data-learn-more="/quran-terminology/fa/roots/q-b-l/" data-root-meaning="روبه‌رو قرارگرفتن، رو آوردن، پیشِ روی چیزی بودن، و پذیرفتن آنچه به سوی انسان می‌آید">أَقبِل</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلا</button>
    <button class="word-link" type="button" data-word="تَخَف" data-root="خ و ف" data-learn-more="/quran-terminology/fa/roots/kh-w-f/" data-root-meaning="ترس، بیم، آماده‌باش در برابر خطر آینده، و جهت‌گیری جان در برابر تهدید">تَخَف</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الـٔامِنينَ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">الـٔامِنينَ</button>
  </p>
  <p class="farsi-verse">و عصایت را بیفکن. پس چون آن را دید که می‌جنبد، گویی ماری است، پشت کرد و بازنگشت. ای موسی، پیش بیا و نترس؛ تو از ایمنانی.</p>
</section>
