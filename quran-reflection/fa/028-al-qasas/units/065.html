<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۶۵</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روزی؛ زمان فراخوان.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يُناديهِم" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="آنان را ندا می‌دهد؛ فراخوان پیش از پرسش دربارهٔ پاسخ به فرستادگان." data-learn-more="/quran-terminology/fa/roots/n-d-y/">يُناديهِم</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس می‌گوید؛ آغاز پرسش.">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="ماذا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ماذا</button>
    <button class="word-link" type="button" data-word="أَجَبتُمُ" data-root="ج و ب" data-root-meaning="جوب در کاربرد مادی، بریدن، شکافتن و گذشتن از میان چیزی است؛ و در کاربرد گفتاری و رفتاری، جواب و استجابت به پاسخ دادن در برابر سخن، درخواست یا دعوت اشاره دارند." data-learn-more="/quran-terminology/fa/roots/j-w-b/" data-context="پاسخ دادید؛ چگونگی پاسخ به فرستادگان.">أَجَبتُمُ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="ر س ل" data-learn-more="/quran-terminology/fa/roots/r-s-l/" data-root-meaning="فرستادن، رسالت و فرستاده‌ای که ماموریتی را به مقصد می‌رساند" data-context="فرستادگان؛ کسانی که پاسخ به آنان پرسیده می‌شود.">المُرسَلينَ</button>
  </p>
  <p class="farsi-verse">و روزی که آنان را ندا دهد و گوید: فرستادگان را چه پاسخ دادید؟</p>
</section>
