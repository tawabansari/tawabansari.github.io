    <button class="word-link" type="button" data-word="بَطِرَت" data-root="ب ط ر" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">بَطِرَت</button>
    <button class="word-link" type="button" data-word="مَعيشَتَها" data-root="ع ي ش" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">مَعيشَتَها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَتِلكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَتِلكَ</button>
    <button class="word-link" type="button" data-word="مَسٰكِنُهُم" data-root="س ك ن" data-learn-more="/quran-terminology/fa/roots/s-k-n/" data-root-meaning="آرام گرفتن، فروکش کردن حرکت یا اضطراب، قرار یافتن، و مأوا گرفتن">مَسٰكِنُهُم</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>

    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>

    <button class="word-link" type="button" data-word="إِلّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="ق ل ل" data-learn-more="/quran-terminology/fa/roots/q-l-l/" data-root-meaning="کم بودن، اندک شدن، ناچیز بودن، و سبک شمرده شدن در برابر امر بزرگ‌تر">قَليلًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">وَكُنّا</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">نَحنُ</button>
    <button class="word-link" type="button" data-word="الوٰرِثينَ" data-root="و ر ث" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">الوٰرِثينَ</button>
  </p>
  <p class="farsi-verse">و چه بسیار آبادی‌هایی را هلاک کردیم که به زندگی خود سرمست شده بودند؛ این خانه‌های آنان است که پس از آنان جز اندکی مسکون نشد؛ و ما وارث بودیم.</p>
</section>
