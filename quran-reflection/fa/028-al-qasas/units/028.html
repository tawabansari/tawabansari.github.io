<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۲۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بَينى" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">بَينى</button>
    <button class="word-link" type="button" data-word="وَبَينَكَ" data-root="ب ي ن" data-learn-more="/quran-terminology/fa/roots/b-y-n/" data-root-meaning="جدایی، میان‌داری، آشکار شدن مرزها، و روشن‌سازی معنا از راه تمایز">وَبَينَكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَيَّمَا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَيَّمَا</button>
    <button class="word-link" type="button" data-word="الأَجَلَينِ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="دو مدت مقرر؛ در این آیه، دو مدت قراردادی.">الأَجَلَينِ</button>
    <button class="word-link" type="button" data-word="قَضَيتُ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت">قَضَيتُ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلا</button>
    <button class="word-link" type="button" data-word="عُدوٰنَ" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی.">عُدوٰنَ</button>
    <button class="word-link" type="button" data-word="عَلَىَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَىَّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="نَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">نَقولُ</button>
    <button class="word-link" type="button" data-word="وَكيلٌ" data-root="و ك ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/w-k-l/" data-root-meaning="سپردن کار و اعتماد؛ وکیل: عهده‌دار و کارگزار.">وَكيلٌ</button>
  </p>
  <p class="farsi-verse">گفت: این میان من و تو باشد؛ هرکدام از دو مدت را به پایان رساندم، هیچ تعدی بر من نباشد؛ و آن معبود یگانه بر آنچه می‌گوییم نگهبان است.</p>
</section>
