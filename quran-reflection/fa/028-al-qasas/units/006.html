    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>

    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/">الأَرضِ</button>

  </p>
  <p class="farsi-verse">و آنان را در زمین استقرار دهیم و به فرعون و هامان و سپاهیان آن دو، از سوی آنان چیزی را نشان دهیم که از آن می‌ترسیدند.</p>
