  <p class="farsi-verse">کسانی که سخن بر آنان تحقق یافته گویند: پروردگارا، اینان کسانی‌اند که گمراه کردیم؛ آنان را همان‌گونه گمراه کردیم که خود گمراه شدیم. نزد تو بیزاری می‌جوییم؛ آنان ما را نمی‌پرستیدند.</p>
