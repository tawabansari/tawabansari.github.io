<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۶۲</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="ي و م" data-learn-more="/quran-terminology/fa/roots/y-w-m/" data-root-meaning="روز، زمان آشکار شدن امر، دوره معین، لحظه حساب، و میدان ظهور نتیجه اعمال" data-context="و روزی؛ زمان فراخوان و پرسش.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يُناديهِم" data-root="ن د و" data-root-meaning="فراخواندن و خطاب قرار دادن؛ و در شاخهٔ اسمی، مجلس و گردهمایی مردم." data-context="آنان را ندا می‌دهد؛ فراخوان پیش از پرسش از شریکان." data-learn-more="/quran-terminology/fa/roots/n-d-y/">يُناديهِم</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="پس می‌گوید؛ پرسش پس از ندا.">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="أَينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَينَ</button>
    <button class="word-link" type="button" data-word="شُرَكاءِىَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/" data-root-meaning="شریک شدن، سهم دادن، و وارد کردن غیر آن معبود یگانه در قلمرویی که باید خالص برای آن معبود یگانه باشد" data-context="شریکان من؛ شریکانِ ادعایی مخاطبان.">شُرَكاءِىَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودید؛ اشاره به ادعاهای گذشته.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَزعُمونَ" data-root="ز ع م" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/z-ayn-m/" data-root-meaning="ادعا و گفتار؛ زعیم: عهده‌دار یا ضامن، بنا بر سیاق." data-context="می‌پنداشتید؛ ادعای شریکان.">تَزعُمونَ</button>
  </p>
  <p class="farsi-verse">و روزی که آنان را ندا دهد و گوید: کجایند شریکان من که ادعا می‌کردید؟</p>
</section>
