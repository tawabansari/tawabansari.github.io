<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۲۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَت</button>
    <button class="word-link" type="button" data-word="إِحدىٰهُما" data-root="أ ح د" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-learn-more="/quran-terminology/fa/roots/a-h-d/">إِحدىٰهُما</button>
    <button class="word-link" type="button" data-word="يٰأَبَتِ" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">يٰأَبَتِ</button>
    <button class="word-link" type="button" data-word="استَـٔجِرهُ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">استَـٔجِرهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="خَيرَ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/" data-root-meaning="نیکی، سود و برتری واقعی، مال ارزشمند، برگزیدن و اختیار">خَيرَ</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مَنِ</button>
    <button class="word-link" type="button" data-word="استَـٔجَرتَ" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل">استَـٔجَرتَ</button>
    <button class="word-link" type="button" data-word="القَوِىُّ" data-root="ق و ي" data-learn-more="/quran-terminology/fa/roots/q-w-y/" data-root-meaning="نیرو، توان، قدرت و استحکام؛ توان انجام، تحمل، مقاومت یا اثرگذاری">القَوِىُّ</button>
    <button class="word-link" type="button" data-word="الأَمينُ" data-root="أ م ن" data-learn-more="/quran-terminology/fa/roots/a-m-n/" data-root-meaning="امنیت، اعتماد و ایمان؛ واژه‌های نزدیک با کاربردهای متمایز">الأَمينُ</button>
  </p>
  <p class="farsi-verse">یکی از آن دو گفت: پدرم، او را به کار بگیر؛ بهترین کسی که به کار می‌گیری، نیرومندِ امین است.</p>
</section>
