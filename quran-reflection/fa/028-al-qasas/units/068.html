<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۶۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَرَبُّكَ" data-root="ر ب ب" data-learn-more="/quran-terminology/fa/roots/r-b-b/">وَرَبُّكَ</button>
    <button class="word-link" type="button" data-word="يَخلُقُ" data-root="خ ل ق" data-learn-more="/quran-terminology/fa/roots/kh-l-q/" data-root-meaning="آفریدن، پدید آوردن، اندازه‌گذاری کردن، صورت دادن، و بیرون آوردن چیزی در قالب، اندازه و نظم مشخص">يَخلُقُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيَختارُ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/">وَيَختارُ</button>
    ۗ
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/">كانَ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الخِيَرَةُ" data-root="خ ي ر" data-learn-more="/quran-terminology/fa/roots/kh-y-r/">الخِيَرَةُ</button>
    ۚ
    <button class="word-link" type="button" data-word="سُبحٰنَ" data-root="س ب ح" data-learn-more="/quran-terminology/fa/roots/s-b-h/">سُبحٰنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَتَعٰلىٰ" data-root="ع ل و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَتَعٰلىٰ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَمّا</button>
    <button class="word-link" type="button" data-word="يُشرِكونَ" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">يُشرِكونَ</button>
  </p>
  <p class="farsi-verse">و پروردگارت هرچه بخواهد می‌آفریند و برمی‌گزیند؛ اختیار گزینش برای آنان نیست. پاک و برتر است آن معبود یگانه از آنچه شریک می‌گیرند.</p>
</section>
