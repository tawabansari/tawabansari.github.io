<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۸</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَالتَقَطَهُ" data-root="ل ق ط" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/l-q-tt/" data-root-meaning="پیدا کردن و از زمین برداشتن." data-context="پس او را برگرفت و یافت.">فَالتَقَطَهُ</button>
    <button class="word-link" type="button" data-word="ءالُ" data-root="أ و ل" data-learn-more="/quran-terminology/fa/roots/a-w-l/" data-root-meaning="پیش‌بودن، نخستین‌بودن، آغاز یک ترتیب، و بازگشت یا بازگرداندن چیزی به اصل، مرجع، یا فرجام نهایی آن" data-context="خاندان و وابستگانِ.">ءالُ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="لِيَكونَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="تا برای آنان بشود؛ بیان فرجام رخداد.">لِيَكونَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ع د و" data-learn-more="/quran-terminology/fa/roots/ayn-d-w/" data-root-meaning="حرکت تند، گذشتن از حد، عبور از مرز، تجاوز، و قرار گرفتن در موضع دشمنی." data-context="دشمن.">عَدُوًّا</button>
    <button class="word-link" type="button" data-word="وَحَزَنًا" data-root="ح ز ن" data-learn-more="/quran-terminology/fa/roots/h-z-n/" data-root-meaning="اندوه، سنگینی دل، و ناهموار شدن راه درون" data-context="و مایهٔ اندوه.">وَحَزَنًا</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَهٰمٰنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">وَهٰمٰنَ</button>
    <button class="word-link" type="button" data-word="وَجُنودَهُما" data-root="ج ن د" data-root-meaning="نیروهای گردآمده برای یاری، پشتیبانی و اقدام مشترک؛ در کاربرد نظامی، سپاه." data-context="و سپاهیان آن دو؛ نیروهای فرعون و هامان." data-learn-more="/quran-terminology/fa/roots/j-n-d/">وَجُنودَهُما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن" data-context="بودند؛ وصف وضعیت آنان.">كانوا</button>
    <button class="word-link" type="button" data-word="خٰطِـٔينَ" data-root="خ ط أ" data-learn-more="/quran-terminology/fa/roots/kh-tt-a/" data-root-meaning="لغزیدن از مسیر درست، به هدف نخوردن، خطا رفتن؛ و در برخی صورت‌ها، انحراف آگاهانه از حق." data-context="خطاکار و گناهکار.">خٰطِـٔينَ</button>
  </p>
  <p class="farsi-verse">پس خاندان فرعون او را برگرفتند تا برایشان دشمن و مایهٔ اندوه شود؛ فرعون و هامان و سپاهیان آن دو خطاکار بودند.</p>
</section>
