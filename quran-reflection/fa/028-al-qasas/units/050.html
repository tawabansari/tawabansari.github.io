<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۵۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَم</button>
    <button class="word-link" type="button" data-word="يَستَجيبوا" data-root="ج و ب" data-root-meaning="جوب در کاربرد مادی، بریدن، شکافتن و گذشتن از میان چیزی است؛ و در کاربرد گفتاری و رفتاری، جواب و استجابت به پاسخ دادن در برابر سخن، درخواست یا دعوت اشاره دارند." data-learn-more="/quran-terminology/fa/roots/j-w-b/">يَستَجيبوا</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="فَاعلَم" data-root="ع ل م" data-learn-more="/quran-terminology/fa/roots/ayn-l-m/" data-root-meaning="دانستن، شناخت، آشکار شدن حقیقت، تعلیم، نشانه، و جهان‌هایی که به شناخت و تمایز شناخته می‌شوند">فَاعلَم</button>
    <button class="word-link" type="button" data-word="أَنَّما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنَّما</button>
    <button class="word-link" type="button" data-word="يَتَّبِعونَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">يَتَّبِعونَ</button>
    <button class="word-link" type="button" data-word="أَهواءَهُم" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس">أَهواءَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَضَلُّ" data-root="ض ل ل" data-learn-more="/quran-terminology/fa/roots/dad-l-l/" data-root-meaning="ضَلَّ؛ گم شدن راه، جایگاه، دسترس یا نتیجه">أَضَلُّ</button>
    <button class="word-link" type="button" data-word="مِمَّنِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِمَّنِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَ" data-root="ت ب ع" data-learn-more="/quran-terminology/fa/roots/t-b-ayn/" data-root-meaning="قرار گرفتن در پیِ شخص، چیز، اثر یا مسیری و ادامه دادن حرکت در امتداد آن.">اتَّبَعَ</button>
    <button class="word-link" type="button" data-word="هَوىٰهُ" data-root="ه و ي" data-learn-more="/quran-terminology/fa/roots/h2-w-y/" data-root-meaning="سقوط، کشیده شدن به یک جهت و هوای نفس">هَوىٰهُ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="غ ي ر" data-learn-more="/quran-terminology/fa/roots/gh-y-r/" data-root-meaning="دیگری، جز این، غیر، جدا بودن از یک چیز، مرزبندی، تغییر دادن، دگرگون شدن، و خارج شدن از حالت پیشین">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">هُدًى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="أ ل ه" data-learn-more="/quran-terminology/fa/roots/a-l-h/" data-root-meaning="پرستش، روی‌آوردن، قرار دادن در مقام معبود، و شناخت آن معبود یگانه">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/" data-root-meaning="هدایت، راه‌نمایی، راه‌بری، رساندن به مسیر درست، پذیرش جهت حق، و آماده شدن انسان برای دریافت هدایت">يَهدِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="ق و م" data-learn-more="/quran-terminology/fa/roots/q-w-m/" data-root-meaning="برخاستن، ایستادن، برپا شدن، برپا داشتن، استوار شدن، قوام یافتن، نگه داشتن چیزی بر بنیاد درست، و فعال ساختن آن در زندگی">القَومَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="ظ ل م" data-learn-more="/quran-terminology/fa/roots/zha-l-m/" data-root-meaning="تاریکی، پوشیدگی، نبود روشنایی، پوشاندن حق، کاستن از حق، و بیرون گذاشتن چیز از جای درست">الظّٰلِمينَ</button>
  </p>
  <p class="farsi-verse">پس اگر تو را پاسخ ندادند، بدان که تنها از خواسته‌های خود پیروی می‌کنند؛ و چه کسی گمراه‌تر است از آنکه بدون هدایتی از آن معبود یگانه، از خواستهٔ خود پیروی کند؟ آن معبود یگانه قوم ستمگر را راه نمی‌نماید.</p>
</section>
