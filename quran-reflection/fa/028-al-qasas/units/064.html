  <h2 class="ayah-title">القصص ۲۸:۶۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/">وَقيلَ</button>
    <button class="word-link" type="button" data-word="ادعوا" data-root="د ع و" data-learn-more="/quran-terminology/fa/roots/d-ayn-w/" data-root-meaning="فرا خواندن، صدا زدن، دعوت کردن، خواندن برای یاری، درخواست کردن، و نسبت دادن یا خواندن کسی به نام و جایگاه معین">ادعوا</button>
    <button class="word-link" type="button" data-word="شُرَكاءَكُم" data-root="ش ر ك" data-learn-more="/quran-terminology/fa/roots/sh-r-k/">شُرَكاءَكُم</button>

  <p class="farsi-verse">و گفته شود: شریکانتان را بخوانید. پس آنان را می‌خوانند، ولی پاسخشان نمی‌دهند و عذاب را می‌بینند؛ کاش راه یافته بودند.</p>
