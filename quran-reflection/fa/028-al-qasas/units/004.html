<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۴</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="عَلا" data-root="ع ل و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/ayn-l-w/" data-root-meaning="بلندی و برتری؛ بالا رفتن و برکشیدن.">عَلا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="أ ر ض" data-learn-more="/quran-terminology/fa/roots/a-r-dad/" data-root-meaning="زمین، سرزمین و زمینی که زیر پا قرار دارد">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="ج ع ل" data-learn-more="/quran-terminology/fa/roots/j-ayn-l/" data-root-meaning="قرار دادن، گردانیدن، تعیین نقش، برقرار ساختن، و نشاندن چیزی در حالتی یا جایگاهی خاص">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="أَهلَها" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی">أَهلَها</button>
    <button class="word-link" type="button" data-word="شِيَعًا" data-root="ش ي ع" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/sh-y-ayn/" data-root-meaning="پراکنده و رایج شدن؛ شیعه: گروه پیرو و پشتیبان.">شِيَعًا</button>
    <button class="word-link" type="button" data-word="يَستَضعِفُ" data-root="ض ع ف" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/dad-ayn-f/" data-root-meaning="ناتوانی؛ در شاخه‌ای دیگر، چند برابر شدن و افزونی.">يَستَضعِفُ</button>
    <button class="word-link" type="button" data-word="طائِفَةً" data-root="ط و ف" data-learn-more="/quran-terminology/fa/roots/tt-w-f/" data-root-meaning="از گردیدن پیرامون تا احاطه، آمدوشد و گروهی از یک کل">طائِفَةً</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنهُم</button>
    <button class="word-link" type="button" data-word="يُذَبِّحُ" data-root="ذ ب ح" data-learn-more="/quran-terminology/fa/roots/dh-b-h/" data-root-meaning="بریدن گلو و پایان‌دادن به حیات از راه ذبح">يُذَبِّحُ</button>
    <button class="word-link" type="button" data-word="أَبناءَهُم" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار">أَبناءَهُم</button>
    <button class="word-link" type="button" data-word="وَيَستَحيۦ" data-root="ح ي ي" data-learn-more="/quran-terminology/fa/roots/h-y-y/" data-root-meaning="حیات، زنده بودن، طراوت، اثرپذیری، بیداری، حیا و تحیت">وَيَستَحيۦ</button>
    <button class="word-link" type="button" data-word="نِساءَهُم" data-root="ن س و" data-learn-more="/quran-terminology/fa/roots/n-s-w/" data-root-meaning="زنان و گروه زنان در زبان قرآن">نِساءَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="ك و ن" data-learn-more="/quran-terminology/fa/roots/k-w-n/" data-root-meaning="بودن، قرار داشتن در حالتی، تحقق یافتن، واقع شدن، یا به حالتی درآمدن">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="ف س د" data-learn-more="/quran-terminology/fa/roots/f-s-d/" data-root-meaning="تباهی، خرابی، برهم خوردن صلاح، و خروج از سلامت، اعتدال و حالت نافع">المُفسِدينَ</button>
  </p>
  <p class="farsi-verse">فرعون در زمین برتری جست و مردمش را دسته‌دسته کرد؛ گروهی از آنان را ناتوان می‌ساخت، پسرانشان را می‌کشت و زنانشان را زنده می‌گذاشت. او از فسادگران بود.</p>
</section>
