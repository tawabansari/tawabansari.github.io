  <p class="farsi-verse">پس چون موسی مدت را به پایان رساند و با خانواده‌اش به راه افتاد، از سوی کوه آتشی دید. به خانواده‌اش گفت: بمانید؛ من آتشی دیده‌ام، شاید از آن خبری یا پاره‌ای آتش برایتان بیاورم تا گرم شوید.</p>
