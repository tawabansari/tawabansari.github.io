<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۲۹</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="قَضىٰ" data-root="ق ض ي" data-learn-more="/quran-terminology/fa/roots/q-dad-y/" data-root-meaning="از تمام کردن تا فیصله، فرمان و قطعیت" data-context="به پایان رساند؛ موسی مدت توافق‌شده را کامل کرد.">قَضىٰ</button>
    <button class="word-link" type="button" data-word="موسَى" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">موسَى</button>
    <button class="word-link" type="button" data-word="الأَجَلَ" data-root="أ ج ل" data-learn-more="/quran-terminology/fa/roots/a-j-l/" data-root-meaning="مدت مقرر یک تعهد؛ دوره‌ای که به انجام می‌رسد." data-context="مدت؛ زمان توافق‌شده‌ای که موسی آن را به پایان رساند.">الأَجَلَ</button>
    <button class="word-link" type="button" data-word="وَسارَ" data-root="س ي ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/s-y-r/" data-root-meaning="رفتن و حرکت در مسیر؛ سیره: روش یا حالت." data-context="و به راه افتاد؛ موسی همراه خانواده‌اش سفر کرد.">وَسارَ</button>
    <button class="word-link" type="button" data-word="بِأَهلِهِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="با خانواده‌اش؛ همراهان خانوادگی موسی در سفر.">بِأَهلِهِ</button>
    <button class="word-link" type="button" data-word="ءانَسَ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="دید و متوجه شد؛ موسی آتشی را از سوی طور مشاهده کرد.">ءانَسَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="جانِبِ" data-root="ج ن ب" data-root-meaning="پهلو، کنار و جانب؛ فاصله گرفتن، دور ساختن و پرهیز کردن. «جُنُب» در سیاق طهارت، وضعیتِ نیازمند پاک شدن است." data-context="سو و جانب؛ جهتی از طور که موسی آتش را از آن دید." data-learn-more="/quran-terminology/fa/roots/j-n-b/">جانِبِ</button>
    <button class="word-link" type="button" data-word="الطّورِ" data-root="ط و ر" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/tt-w-r/" data-root-meaning="طور: کوه؛ اطوار: حالت‌ها و مرحله‌های گوناگون." data-context="کوه طور؛ کوهی که موسی از سوی آن آتشی دید.">الطّورِ</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتشی؛ چیزی که موسی در مسیر سفر از سوی طور دید.">نارًا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ موسی خانواده‌اش را خطاب کرد.">قالَ</button>
    <button class="word-link" type="button" data-word="لِأَهلِهِ" data-root="أ ه ل" data-learn-more="/quran-terminology/fa/roots/a-h2-l/" data-root-meaning="از خانواده و ساکنان خانه تا جماعت، تعلق و شایستگی" data-context="به خانواده‌اش؛ مخاطبانِ درخواست موسی برای ماندن.">لِأَهلِهِ</button>
    <button class="word-link" type="button" data-word="امكُثوا" data-root="م ك ث" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-k-th/" data-root-meaning="درنگ و ماندن." data-context="بمانید؛ درخواست موسی از خانواده‌اش برای درنگ در همان‌جا.">امكُثوا</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="ءانَستُ" data-root="أ ن س" data-learn-more="/quran-terminology/fa/roots/a-n-s/" data-root-meaning="انسان و اُنس؛ از دریافتن تا آشنایی و معاشرت" data-context="دیده‌ام؛ موسی مشاهدهٔ آتش را به خانواده‌اش خبر می‌دهد.">ءانَستُ</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتشی؛ آتشی که موسی می‌گوید آن را دیده است.">نارًا</button>
    <button class="word-link" type="button" data-word="لَعَلّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلّى</button>
    <button class="word-link" type="button" data-word="ءاتيكُم" data-root="أ ت ي" data-learn-more="/quran-terminology/fa/roots/a-t-y/" data-root-meaning="آمدن، رسیدن، آوردن، دادن، رساندن، و قطعی شدن وقوع یک امر" data-context="برایتان بیاورم؛ امید موسی به آوردن خبر یا پاره‌ای آتش برای خانواده‌اش.">ءاتيكُم</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنها</button>
    <button class="word-link" type="button" data-word="بِخَبَرٍ" data-root="خ ب ر" data-root-meaning="آگاهی و شناختِ حقیقت و وضعیت چیزی؛ خبر: اطلاعِ منتقل‌شده؛ خبير: آگاه." data-context="خبری؛ اطلاعاتی که موسی امید دارد از محل آتش برای خانواده‌اش بیاورد." data-learn-more="/quran-terminology/fa/roots/kh-b-r/">بِخَبَرٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَو</button>
    <button class="word-link" type="button" data-word="جَذوَةٍ" data-root="ج ذ و" data-root-meaning="پاره‌ای آتش یا چوب اخگردار؛ در شاخه‌ای دیگر، راست ایستادن و ملازمت جایگاه." data-context="پاره‌ای آتش یا چوب اخگردار؛ چیزی که موسی امید دارد برای گرم شدن خانواده‌اش بیاورد." data-learn-more="/quran-terminology/fa/roots/j-dh-w/">جَذوَةٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="ن و ر" data-learn-more="/quran-terminology/fa/roots/n-w-r/" data-root-meaning="نور، آتش و آنچه با روشنایی آشکار می‌شود" data-context="آتش؛ منبع پارهٔ اخگرداری که موسی امید دارد بیاورد.">النّارِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَصطَلونَ" data-root="ص ل ي" data-learn-more="/quran-terminology/fa/roots/sad-l-y/" data-root-meaning="از گرفتن گرمای آتش تا درآمدن در آتش" data-context="گرم شوید؛ هدف از آوردن پاره‌ای آتش برای خانوادهٔ موسی.">تَصطَلونَ</button>
  </p>
  <p class="farsi-verse">پس چون موسی مدت را به پایان رساند و با خانواده‌اش به راه افتاد، از سوی کوه آتشی دید. به خانواده‌اش گفت: بمانید؛ من آتشی دیده‌ام، شاید از آن خبری یا پاره‌ای آتش برایتان بیاورم تا گرم شوید.</p>
</section>
