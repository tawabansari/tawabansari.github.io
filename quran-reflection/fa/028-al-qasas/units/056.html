  <h2 class="ayah-title">القصص ۲۸:۵۶</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّكَ</button>

    <button class="word-link" type="button" data-word="تَهدى" data-root="ه د ي" data-learn-more="/quran-terminology/fa/roots/h2-d-y/">تَهدى</button>

    <button class="word-link" type="button" data-word="يَشاءُ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با خدا">يَشاءُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُوَ</button>

  </p>
  <p class="farsi-verse">تو هرکه را دوست داری هدایت نمی‌کنی، ولی آن معبود یگانه هرکه را بخواهد هدایت می‌کند؛ و او به راه‌یافتگان داناتر است.</p>
