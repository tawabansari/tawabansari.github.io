<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۲۳</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="وَرَدَ" data-root="و ر د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">وَرَدَ</button>
    <button class="word-link" type="button" data-word="ماءَ" data-root="م و ه" data-learn-more="/quran-terminology/fa/roots/m-w-h2/" data-root-meaning="آب؛ مایه حیات، پاکی، رویش، سیلان و تداوم زیست">ماءَ</button>
    <button class="word-link" type="button" data-word="مَديَنَ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">مَديَنَ</button>
    <button class="word-link" type="button" data-word="وَجَدَ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">وَجَدَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="أُمَّةً" data-root="أ م م" data-learn-more="/quran-terminology/fa/roots/a-m-m/" data-root-meaning="از مادر و اصل تا امت، امام، پیش رو و قصد کردن مقصد">أُمَّةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="ن و س" data-learn-more="/quran-terminology/fa/roots/n-w-s/" data-root-meaning="ناس، مردم، حرکت جمعی انسان‌ها، و میدان عمومی هدایت و وسوسه">النّاسِ</button>
    <button class="word-link" type="button" data-word="يَسقونَ" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب.">يَسقونَ</button>
    <button class="word-link" type="button" data-word="وَوَجَدَ" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن">وَوَجَدَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِمُ" data-root="د و ن" data-learn-more="/quran-terminology/fa/roots/d-w-n/" data-root-meaning="دُون؛ رابطه با یک مرجع، پیش از آن، فروتر از آن یا جدا از آن">دونِهِمُ</button>
    <button class="word-link" type="button" data-word="امرَأَتَينِ" data-root="م ر أ" data-learn-more="/quran-terminology/fa/roots/m-r-a/" data-root-meaning="شخص انسانی، زن انسانی، نسبت‌های روایی، و مسئولیت فردی که با قلب، کسب، سخن و عمل خود شناخته می‌شود">امرَأَتَينِ</button>
    <button class="word-link" type="button" data-word="تَذودانِ" data-root="ذ و د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">تَذودانِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">ما</button>
    <button class="word-link" type="button" data-word="خَطبُكُما" data-root="خ ط ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">خَطبُكُما</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَتا" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">قالَتا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="نَسقى" data-root="س ق ي" data-learn-more="/quran-terminology/fa/roots/s-q-y/" data-root-meaning="آب‌دادن، نوشاندن، رساندن نوشیدنی، فراهم‌کردن سیرابی و درخواست آب.">نَسقى</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يُصدِرَ" data-root="ص د ر" data-root-meaning="« صَدْر » سینه یا بخش پیشین چیزی است و در کاربردهای مربوط به انسان می‌تواند جایگاه بیان امور درونی او باشد؛ « صُدُور » در شاخه فعلی، بیرون رفتن، روانه شدن یا بازگشت از جایی است، به‌ویژه در برابر ورود به آن." data-learn-more="/quran-terminology/fa/roots/sad-d-r/">يُصدِرَ</button>
    <button class="word-link" type="button" data-word="الرِّعاءُ" data-root="ر ع ي" data-learn-more="/quran-terminology/fa/roots/r-ayn-y/" data-root-meaning="رَعَى؛ چرا، مراقبت و رعایت چیزی که به توجه سپرده شده است">الرِّعاءُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَبونا" data-root="أ ب و" data-learn-more="/quran-terminology/fa/roots/a-b-w/" data-root-meaning="پدر، پدران و نیاکان؛ از پیوند نسبی و پرورش تا نسبت خانوادگی و میراث پیشینیان">وَأَبونا</button>
    <button class="word-link" type="button" data-word="شَيخٌ" data-root="ش ي خ" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">شَيخٌ</button>
    <button class="word-link" type="button" data-word="كَبيرٌ" data-root="ك ب ر" data-learn-more="/quran-terminology/fa/roots/k-b-r/" data-root-meaning="بزرگی، بزرگ شمردن، عظمت حقیقی، و در شاخه منفی خودبزرگ‌بینی و استکبار">كَبيرٌ</button>
  </p>
  <p class="farsi-verse">و چون به آب مدین رسید، گروهی از مردم را یافت که آب می‌دادند، و کنار آنان دو زن را یافت که بازمی‌داشتند. گفت: کار شما چیست؟ گفتند: آب نمی‌دهیم تا چوپانان بازگردند، و پدر ما پیرمردی سالخورده است.</p>
</section>
