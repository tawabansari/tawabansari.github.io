  <p class="farsi-verse">پس چون حق از نزد ما به آنان رسید، گفتند: چرا مانند آنچه به موسی داده شد به او داده نشده؟ آیا پیش‌تر آنچه به موسی داده شد را انکار نکردند؟ گفتند: دو جادو که یکدیگر را پشتیبانی می‌کنند؛ و گفتند: ما هر دو را انکار می‌کنیم.</p>
