<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۲۷</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز پیشنهادِ ازدواج و خدمت.">قالَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="أُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="می‌خواهم؛ بیانِ قصدِ پیشنهاددهنده.">أُريدُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="أُنكِحَكَ" data-root="ن ك ح" data-learn-more="/quran-terminology/fa/roots/n-k-h/" data-root-meaning="ازدواج و برقراری پیوند همسری؛ به ازدواج درآوردن یا خواستن ازدواج، بسته به ساخت؛ کاربرد آمیزش نیز در عربی ثبت شده است." data-context="به همسری تو درآورم؛ موضوعِ پیشنهاد.">أُنكِحَكَ</button>
    <button class="word-link" type="button" data-word="إِحدَى" data-root="أ ح د" data-root-meaning="أَحَد؛ یک، یکی از، و هیچ‌کس در ساخت نفی" data-learn-more="/quran-terminology/fa/roots/a-h-d/" data-context="یکی از دو؛ انتخاب از میان دو دختر.">إِحدَى</button>
    <button class="word-link" type="button" data-word="ابنَتَىَّ" data-root="ب ن ي" data-learn-more="/quran-terminology/fa/roots/b-n-y/" data-context="دو دخترم؛ کسانی که پیشنهاد دربارهٔ یکی از آنان است." data-root-meaning="ساختن، برپا کردن، بنا نهادن، ایجاد ساختار منظم، و قرار دادن اجزا در پیوندی استوار؛ و در کاربرد نسبی، پسر، دختر، فرزندان و نسل.">ابنَتَىَّ</button>
    <button class="word-link" type="button" data-word="هٰتَينِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">هٰتَينِ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="تَأجُرَنى" data-root="أ ج ر" data-learn-more="/quran-terminology/fa/roots/a-j-r/" data-root-meaning="از مزد و حق کار تا پاداش عمل" data-context="برای من کار کنی؛ خدمت در مدتِ تعیین‌شده.">تَأجُرَنى</button>
    <button class="word-link" type="button" data-word="ثَمٰنِىَ" data-root="ث م ن" data-learn-more="/quran-terminology/fa/roots/th-m-n/" data-root-meaning="بها، قیمت، و چیزی که در برابر چیز دیگر گرفته می‌شود" data-context="هشت؛ شمارِ سال‌های خدمت.">ثَمٰنِىَ</button>
    <button class="word-link" type="button" data-word="حِجَجٍ" data-root="ح ج ج" data-learn-more="/quran-terminology/fa/roots/h-j-j/" data-context="سال‌ها؛ واحدِ مدت خدمت." data-root-meaning="از قصد کردن و حج تا حجت و رویارویی استدلالی؛ و در «حِجَج»، سال‌ها.">حِجَجٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَإِن</button>
    <button class="word-link" type="button" data-word="أَتمَمتَ" data-root="ت م م" data-learn-more="/quran-terminology/fa/roots/t-m-m/" data-root-meaning="رسیدن یا رساندن یک امر به حد مقرر، پس از کامل شدن مقدار، مدت، اجزا یا مراحل لازم" data-context="کامل کردی؛ افزودن مدت تا ده سال.">أَتمَمتَ</button>
    <button class="word-link" type="button" data-word="عَشرًا" data-root="ع ش ر" data-root-meaning="ده و صورت‌ها و نسبت‌های عددی آن؛ معاشرت، همراهی، خویشاوندی و جماعت؛ عشار: شتران مادهٔ نزدیک به زایمان." data-context="ده؛ تکمیل مدتِ خدمت تا ده سال." data-learn-more="/quran-terminology/fa/roots/ayn-sh-r/">عَشرًا</button>
    <button class="word-link" type="button" data-word="فَمِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">فَمِن</button>
    <button class="word-link" type="button" data-word="عِندِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عِندِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَما</button>
    <button class="word-link" type="button" data-word="أُريدُ" data-root="ر و د" data-learn-more="/quran-terminology/fa/roots/r-w-d/" data-root-meaning="خواستن، اراده کردن، قصد داشتن، رو آوردن به مقصود، و طلب همراه با کوشش یا اصرار" data-context="می‌خواهم؛ با نفی، قصدِ سخت گرفتن ندارد.">أُريدُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَن</button>
    <button class="word-link" type="button" data-word="أَشُقَّ" data-root="ش ق ق" data-learn-more="/quran-terminology/fa/roots/sh-q-q/" data-root-meaning="شکافتن، رخنه، جانب، مشقت، فاصله و گسست جبهه‌ساز" data-context="بر تو سخت گیرم؛ آنچه پیشنهاددهنده قصدش را نفی می‌کند.">أَشُقَّ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَلَيكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="سَتَجِدُنى" data-root="و ج د" data-learn-more="/quran-terminology/fa/roots/w-j-d/" data-root-meaning="یافتن، در دسترس داشتن و چیزی را در حوزه دریافت خود حاضر یافتن" data-context="مرا خواهی یافت؛ وعده دربارهٔ رفتارِ خود.">سَتَجِدُنى</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="ش ي أ" data-learn-more="/quran-terminology/fa/roots/sh-y-a/" data-root-meaning="خواستن، مشیت داشتن، اراده کردن؛ و در کاربرد قرآنی، قرار گرفتن یک امر در میدان خواست، امکان و تحقق، به‌ویژه در نسبت با آن معبود یگانه" data-context="بخواهد؛ وابسته کردن وعده به خواست الله.">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="ا ل ه" data-root-meaning="در خوانش زبانی ما، «الله» با «إله» و ریشه ا ل ه پیوند دارد. «إله» یعنی معبود؛ آن‌که انسان به سوی او توجه، پناه و بندگی می‌برد. پیشوند «الـ» واژه را معرفه می‌سازد و «الإله» را به معنای «آن معبود» نزدیک می‌کند. از ادغام این ساخت، صورت «الله» پدید آمده است." data-context="«الله» در این خوانش فقط یک اسم خاصِ غیرقابل ترجمه نیست، بلکه عنوانی مقامی برای حقیقت یگانه و شایسته مطلق بندگی است. از همین رو، در ترجمه فرقان آن را «آن معبود یگانه» می‌آوریم." data-learn-more="/quran-terminology/fa/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحينَ" data-root="ص ل ح" data-learn-more="/quran-terminology/fa/roots/sad-l-h/" data-root-meaning="صلاح، درستی، سلامت، سازگاری، اصلاح، و بازگرداندن چیزی به حالت درست" data-context="شایستگان؛ وصفی که برای رفتار خود وعده می‌دهد.">الصّٰلِحينَ</button>
  </p>
  <p class="farsi-verse">گفت: می‌خواهم یکی از این دو دخترم را به همسری تو درآورم، بر این شرط که هشت سال برایم کار کنی؛ و اگر ده سال را کامل کردی، از جانب خودت است. نمی‌خواهم بر تو سخت بگیرم؛ اگر آن معبود یگانه بخواهد، مرا از شایستگان خواهی یافت.</p>
</section>
