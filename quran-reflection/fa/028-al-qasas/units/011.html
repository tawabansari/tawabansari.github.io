<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۱۱</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَت" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن">وَقالَت</button>
    <button class="word-link" type="button" data-word="لِأُختِهِ" data-root="أ خ و" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">لِأُختِهِ</button>
    <button class="word-link" type="button" data-word="قُصّيهِ" data-root="ق ص ص" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">قُصّيهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبَصُرَت" data-root="ب ص ر" data-learn-more="/quran-terminology/fa/roots/b-sad-r/" data-root-meaning="دیدن، بینایی، آشکار شدن نشانه، و مسئولیت پس از دیدن">فَبَصُرَت</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِهِ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">عَن</button>
    <button class="word-link" type="button" data-word="جُنُبٍ" data-root="ج ن ب" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">جُنُبٍ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="ش ع ر" data-learn-more="/quran-terminology/fa/roots/sh-ayn-r/" data-root-meaning="شعور، دریافت لطیف، آگاهی موقعیتی، نشانه‌شناسی، و بی‌خبری از حقیقت نزدیک">يَشعُرونَ</button>
  </p>
  <p class="farsi-verse">و به خواهرش گفت: او را دنبال کن. پس از دور او را دید، در حالی که آنان درنمی‌یافتند.</p>
