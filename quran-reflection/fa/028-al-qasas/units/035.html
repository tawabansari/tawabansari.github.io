    <button class="word-link" type="button" data-word="عَضُدَكَ" data-root="ع ض د" data-root-note="پژوهش این ریشه به‌زودی افزوده می‌شود.">عَضُدَكَ</button>

    <button class="word-link" type="button" data-word="أَنتُما" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">أَنتُما</button>

  </p>
  <p class="farsi-verse">گفت: بازویت را با برادرت نیرومند می‌کنیم و به شما دو تن اقتداری می‌دهیم، پس به شما دست نمی‌یابند. با نشانه‌های ما، شما و پیروانتان پیروزید.</p>
