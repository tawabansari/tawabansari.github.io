<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">القصص ۲۸:۲۰</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="ج ي أ" data-learn-more="/quran-terminology/fa/roots/j-y-a/" data-root-meaning="آمدن، رسیدن و حاضر شدن شخص، چیز یا رویداد در نقطهٔ مرجع و میدان مواجهه" data-context="و آمد؛ رسیدن مردِ هشداردهنده.">وَجاءَ</button>
    <button class="word-link" type="button" data-word="رَجُلٌ" data-root="ر ج ل" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/r-j-l/" data-root-meaning="مرد؛ نیز پا و پیاده رفتن، در صورت‌های متفاوت واژه." data-context="مردی؛ شخصی که برای هشدار به موسی می‌آید.">رَجُلٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِن</button>
    <button class="word-link" type="button" data-word="أَقصَا" data-root="ق ص و" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/q-sad-w/" data-root-meaning="دوری و دورترین جانب." data-context="دورترین بخش؛ جایگاهی در شهر که مرد از آن می‌آید.">أَقصَا</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="م د ن" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-d-n/" data-root-meaning="مدینه: شهر و آبادی؛ تحلیل آن از «مدن» یا «دین» اختلافی است." data-context="شهر؛ آبادیِ محلِ رخداد.">المَدينَةِ</button>
    <button class="word-link" type="button" data-word="يَسعىٰ" data-root="س ع ي" data-learn-more="/quran-terminology/fa/roots/s-ayn-y/" data-root-meaning="از حرکت در یک مسیر تا کوشش برای رسیدن به نتیجه" data-context="شتابان می‌آید؛ حرکتِ همراه با کوشش برای رساندن هشدار.">يَسعىٰ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="ق و ل" data-learn-more="/quran-terminology/fa/roots/q-w-l/" data-root-meaning="گفتن، بیان، ادعا، فرمان، نسبت دادن، و مسئولیت سخن" data-context="گفت؛ آغاز هشدارِ مرد به موسی.">قالَ</button>
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="نام خاص؛ ریشه‌ای برای آن نسبت داده نشده است.">يٰموسىٰ</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنَّ</button>
    <button class="word-link" type="button" data-word="المَلَأَ" data-root="م ل أ" data-root-note="توضیح مقدماتی؛ پژوهش تفصیلی هنوز آماده نیست." data-learn-more="/quran-terminology/fa/roots/m-l-a/" data-root-meaning="پُر کردن؛ ملأ: سران و گروه برجسته جامعه." data-context="بزرگان و سران؛ گروهِ تصمیم‌گیرندهٔ مورد اشاره در هشدار.">المَلَأَ</button>
    <button class="word-link" type="button" data-word="يَأتَمِرونَ" data-root="أ م ر" data-learn-more="/quran-terminology/fa/roots/a-m-r/" data-root-meaning="فرمان دادن، جهت دادن، خواستن انجام کاری، و قرار دادن رفتار یا کار در مسیر اجرا" data-context="مشورت و تصمیم‌گیری می‌کنند؛ دربارهٔ موسی و کشتن او.">يَأتَمِرونَ</button>
    <button class="word-link" type="button" data-word="بِكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">بِكَ</button>
    <button class="word-link" type="button" data-word="لِيَقتُلوكَ" data-root="ق ت ل" data-learn-more="/quran-terminology/fa/roots/q-t-l/" data-root-meaning="کشتن، کشته‌شدن، نبرد متقابل و مسئولیت در برابر جان انسان" data-context="تا تو را بکشند؛ هدفِ خطرناکی که مرد از آن خبر می‌دهد.">لِيَقتُلوكَ</button>
    <button class="word-link" type="button" data-word="فَاخرُج" data-root="خ ر ج" data-learn-more="/quran-terminology/fa/roots/kh-r-j/" data-root-meaning="بیرون آمدن، بیرون آوردن، خارج ساختن از درون یا نهفتگی، آشکار کردن چیزی از پس پوشش، و انتقال دادن پدیده از محدوده بسته به عرصه ظهور و اثر" data-context="پس بیرون برو؛ فرمانِ هشداردهنده برای ترک جایگاه خطر.">فَاخرُج</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">إِنّى</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">لَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="واژهٔ دستوری؛ ریشهٔ اشتقاقی برای این کاربرد درج نمی‌شود.">مِنَ</button>
    <button class="word-link" type="button" data-word="النّٰصِحينَ" data-root="ن ص ح" data-learn-more="/quran-terminology/fa/roots/n-sad-h/" data-root-meaning="خلوص و خیرخواهیِ دور از غش و فریب؛ در شاخه‌ای دیگر، دوختن و پیوند دادن؛ نصوح در وصف توبه، خالص و راستین است." data-context="خیرخواهان؛ مردِ هشداردهنده خود را خیرخواه موسی معرفی می‌کند و او را از خطر آگاه می‌سازد.">النّٰصِحينَ</button>
  </p>
  <p class="farsi-verse">و مردی از دورترین بخش شهر شتابان آمد و گفت: ای موسی، بزرگان دربارهٔ تو رایزنی می‌کنند تا تو را بکشند؛ پس بیرون برو، من خیرخواه تو هستم.</p>
</section>
