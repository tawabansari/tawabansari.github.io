<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثانِىَ" data-root="TH N Y" data-root-meaning="twofoldness, turning back, and repetition" data-context="Turning: in the expression for turning one’s side away." data-learn-more="/quran-terminology/en/roots/th-n-y/">ثانِىَ</button>
    <button class="word-link" type="button" data-word="عِطفِهِ" data-root="AYN TT F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-tt-f/" data-root-meaning="Bending or turning; ʿiṭf is a side or flank." data-context="His side: in the expression for turning one’s body.">عِطفِهِ</button>
    <button class="word-link" type="button" data-word="لِيُضِلَّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="To mislead others.">لِيُضِلَّ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Way: the path from which he misleads.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="This world: the present life.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="خِزىٌ" data-root="KH Z Y" data-learn-more="/quran-terminology/en/roots/kh-z-y/" data-root-meaning="Humiliation, disgrace, and a fall in standing before others" data-context="Disgrace in this world.">خِزىٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَنُذيقُهُ" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="And We make him taste the consequence.">وَنُذيقُهُ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Day: the time of punishment.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Resurrection and reckoning.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment: the suffering described.">عَذابَ</button>
    <button class="word-link" type="button" data-word="الحَريقِ" data-root="H R Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-r-q/" data-root-meaning="Burning, setting alight, and the effects of fire." data-context="Burning: describing the punishment.">الحَريقِ</button>
  </p>
  <p class="english-verse">turning his side away to mislead from the way of The God. For him is disgrace in this world, and on the Day of Resurrection We will make him taste the punishment of burning.</p>
</section>
