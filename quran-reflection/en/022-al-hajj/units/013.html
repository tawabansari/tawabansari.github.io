<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَدعوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Invokes, turning toward other than Allah.">يَدعوا</button>
    <button class="word-link" type="button" data-word="لَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمَن</button>
    <button class="word-link" type="button" data-word="ضَرُّهُ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="Its harm, the nearer consequence of what is invoked.">ضَرُّهُ</button>
    <button class="word-link" type="button" data-word="أَقرَبُ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Nearer, comparing harm with benefit.">أَقرَبُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="نَفعِهِ" data-root="N F ʿ" data-learn-more="/quran-terminology/en/roots/n-f-ayn/" data-root-meaning="Nafaʿa: benefiting someone and producing a favorable outcome" data-context="Its benefit, the other term of the comparison.">نَفعِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="How evil, condemning the patron described.">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَولىٰ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Patron or support, described as evil.">المَولىٰ</button>
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="And how evil, condemning the companion described.">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="العَشيرُ" data-root="AYN SH R" data-root-meaning="Ten and its numerical forms and ratios; association, companionship, kindred, and an assembly. ʿIshār: she-camels approaching delivery." data-context="Companion or associate, condemned by la-biʾsa as harmful companionship." data-learn-more="/quran-terminology/en/roots/ayn-sh-r/">العَشيرُ</button>
  </p>
  <p class="english-verse">He calls upon one whose harm is nearer than his benefit. What a wretched protector and what a wretched companion!</p>
</section>
