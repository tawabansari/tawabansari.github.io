<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُصهَرُ" data-root="Ṣ H R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-h2-r/" data-root-meaning="Melting; ṣihr is kinship through marriage." data-context="Is melted, describing belly contents and skins.">يُصهَرُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُطونِهِم" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="Their bellies, whose contents are melted in the description of punishment." data-learn-more="/quran-terminology/en/roots/b-tt-n/">بُطونِهِم</button>
    <button class="word-link" type="button" data-word="وَالجُلودُ" data-root="J L D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-l-d/" data-root-meaning="The skin or bodily covering; jald: striking with a lash; related uses concern toughness." data-context="And the skins, exposed to melting along with the belly contents.">وَالجُلودُ</button>
  </p>
  <p class="english-verse">By it, what is in their bellies and their skins will be melted.</p>
