<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People, some of whom are described next.">النّاسِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يُجٰدِلُ" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="Disputes about The God without knowledge." data-learn-more="/quran-terminology/en/roots/j-d-l/">يُجٰدِلُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without; qualifying the absence of knowledge.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge; the support lacking in the stated disputation.">عِلمٍ</button>
    <button class="word-link" type="button" data-word="وَيَتَّبِعُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="And follows a rebellious satan.">وَيَتَّبِعُ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; describing following rebellious satans.">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَيطٰنٍ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="A satan; one drawing away from truth.">شَيطٰنٍ</button>
    <button class="word-link" type="button" data-word="مَريدٍ" data-root="M R D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-d/" data-root-meaning="Bareness or smoothness; tamarrud denotes defiance or persistence in disobedience." data-context="Rebellious; describing the satan.">مَريدٍ</button>
  </p>
  <p class="english-verse">Among people is one who disputes about The God without knowledge and follows every rebellious devil.</p>
</section>
