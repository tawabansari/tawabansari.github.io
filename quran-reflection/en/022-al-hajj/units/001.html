<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People: those addressed by the call to be mindful of their Lord.">النّاسُ</button>
    <button class="word-link" type="button" data-word="اتَّقوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Be mindful: a command to exercise responsible awareness before the Lord.">اتَّقوا</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord: the one of whom the addressees are called to be mindful.">رَبَّكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="زَلزَلَةَ" data-root="Z L Z L" data-root-meaning="Shaking and severe movement; disruption of stability and settledness, whether in the tangible world or in the human condition." data-context="The great shaking and upheaval associated with the Hour; zalzalah is linked to al-sāʿah in a genitive construction." data-learn-more="/quran-terminology/en/roots/z-l-z-l/">زَلزَلَةَ</button>
    <button class="word-link" type="button" data-word="السّاعَةِ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour: the time of the tremendous event to which the convulsion is related.">السّاعَةِ</button>
    <button class="word-link" type="button" data-word="شَىءٌ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="A thing: here, the event and convulsion just mentioned.">شَىءٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Tremendous: describing the convulsion of the Hour.">عَظيمٌ</button>
  </p>
  <p class="english-verse">O people, be mindful of your Lord. The shaking of the Hour is indeed a tremendous thing.</p>
</section>
