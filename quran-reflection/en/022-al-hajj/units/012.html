<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَدعوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">يَدعوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَضُرُّهُ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion">يَضُرُّهُ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَنفَعُهُ" data-root="N F ʿ" data-learn-more="/quran-terminology/en/roots/n-f-ayn/" data-root-meaning="Nafaʿa: benefiting someone and producing a favorable outcome">يَنفَعُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="الضَّلٰلُ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">الضَّلٰلُ</button>
    <button class="word-link" type="button" data-word="البَعيدُ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">البَعيدُ</button>
  </p>
  <p class="english-verse">He calls upon, apart from The God, what neither harms him nor benefits him. That is straying far away.</p>
</section>
