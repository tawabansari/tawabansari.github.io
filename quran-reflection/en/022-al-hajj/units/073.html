<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:73</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People; the comparison’s addressees">النّاسُ</button>
    <button class="word-link" type="button" data-word="ضُرِبَ" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="Was presented; introducing the comparison">ضُرِبَ</button>
    <button class="word-link" type="button" data-word="مَثَلٌ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="A comparison or illustrative example">مَثَلٌ</button>
    <button class="word-link" type="button" data-word="فَاستَمِعوا" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="So listen; commanding attention to the comparison">فَاستَمِعوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="تَدعونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="You call; concerning supposed deities">تَدعونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Besides; in the phrase besides The God">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="يَخلُقوا" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Create; negated by lan">يَخلُقوا</button>
    <button class="word-link" type="button" data-word="ذُبابًا" data-root="DH B B" data-learn-more="/quran-terminology/en/roots/dh-b-b/" data-root-meaning="Dhubāb is a fly; other branches concern repelling and defending, sharpness, and restless movement." data-context="A fly; the example they cannot create">ذُبابًا</button>
    <button class="word-link" type="button" data-word="وَلَوِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَوِ</button>
    <button class="word-link" type="button" data-word="اجتَمَعوا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="Gather; in the hypothetical cooperation to create">اجتَمَعوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَسلُبهُمُ" data-root="S L B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-l-b/" data-root-meaning="Taking or snatching something away from another." data-context="Takes from them; describing the fly’s action">يَسلُبهُمُ</button>
    <button class="word-link" type="button" data-word="الذُّبابُ" data-root="DH B B" data-learn-more="/quran-terminology/en/roots/dh-b-b/" data-root-meaning="Dhubāb is a fly; other branches concern repelling and defending, sharpness, and restless movement." data-context="The fly; what takes the thing mentioned">الذُّبابُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Something; what the fly takes">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَنقِذوهُ" data-root="N Q DH" data-learn-more="/quran-terminology/en/roots/n-q-dh/" data-root-meaning="Escaping, rescuing and recovering someone or something from danger, distress or another’s possession." data-context="Recover it; negated by lā">يَستَنقِذوهُ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ضَعُفَ" data-root="DAD AYN F" data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Insufficient capacity and weakness contrasted with strength; Form X concerns considering weak or placing in weakness. An independent branch concerns adding an equivalent to an original amount and doubling or multiplying it." data-context="Is weak; describing the seeker and the sought">ضَعُفَ</button>
    <button class="word-link" type="button" data-word="الطّالِبُ" data-root="TT L B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-l-b/" data-root-meaning="Seeking or requesting something." data-context="The seeker; one side described as weak">الطّالِبُ</button>
    <button class="word-link" type="button" data-word="وَالمَطلوبُ" data-root="TT L B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-l-b/" data-root-meaning="Seeking or requesting something." data-context="And the sought; the other side described as weak">وَالمَطلوبُ</button>
  </p>
  <p class="english-verse">O people, a parable is presented, so listen to it. Those you call upon apart from The God will never create a fly, even if they gather for it. If the fly takes something from them, they cannot recover it from it. Weak are the seeker and the sought.</p>
</section>
