<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَشهَدوا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">لِيَشهَدوا</button>
    <button class="word-link" type="button" data-word="مَنٰفِعَ" data-root="N F ʿ" data-learn-more="/quran-terminology/en/roots/n-f-ayn/" data-root-meaning="Nafaʿa: benefiting someone and producing a favorable outcome">مَنٰفِعَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَيَذكُرُوا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">وَيَذكُرُوا</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">اسمَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="مَعلومٰتٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">مَعلومٰتٍ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="رَزَقَهُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">رَزَقَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَهيمَةِ" data-root="B H2 M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-h2-m/" data-root-meaning="Obscurity or indistinctness; bahīmah in Qur’anic usage denotes a beast, particularly livestock.">بَهيمَةِ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">الأَنعٰمِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption">فَكُلوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنها</button>
    <button class="word-link" type="button" data-word="وَأَطعِمُوا" data-root="Ṭ AYN M (Ṭ ʿ M)" data-learn-more="/quran-terminology/en/roots/tt-ayn-m/" data-root-meaning="Tasting, eating, food, feeding, and real access to nourishment">وَأَطعِمُوا</button>
    <button class="word-link" type="button" data-word="البائِسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity">البائِسَ</button>
    <button class="word-link" type="button" data-word="الفَقيرَ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity.">الفَقيرَ</button>
  </p>
  <p class="english-verse">to witness benefits for themselves and mention the name of The God on known days over the livestock He has provided them. Eat from them and feed the distressed poor.</p>
</section>
