<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُدخِلُ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="He admits; bringing believers who do good into gardens.">يُدخِلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="They believed; the people promised admission to the gardens.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="And did; their deeds are mentioned alongside belief.">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Good deeds; the actions of those admitted to the gardens.">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-context="Gardens; the promised place of blessing." data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover; jannah: a garden covered with trees and vegetation.">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="J R Y" data-learn-more="/quran-terminology/en/roots/j-r-y/" data-root-meaning="Flowing, running, continuous movement in a channel, and moving along an appointed course" data-context="Flow; the running of the rivers.">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="T Ḥ T" data-learn-more="/quran-terminology/en/roots/t-h-t/" data-root-meaning="Under, beneath, lower position, hidden layer, and foundational or relational placement" data-context="Beneath them; the rivers’ position relative to the gardens.">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="The rivers flowing beneath the gardens.">الأَنهٰرُ</button>
    <button class="word-link" type="button" data-word="يُحَلَّونَ" data-root="H L Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-y/" data-root-meaning="Jewelry, adornment, and decorating with ornaments." data-context="They are adorned; the gardens’ inhabitants receive ornaments.">يُحَلَّونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="S W R" data-learn-more="/quran-terminology/en/roots/s-w-r/" data-context="Bracelets; ornaments with which they are adorned." data-root-meaning="A wall, enclosure, boundary, raised structure, or a form that surrounds something and distinguishes inside from outside; asāwir: bracelets or ornamental rings around the wrist.">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ذَهَبٍ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-context="Gold; the material of the bracelets mentioned." data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach; dhahab as a noun: gold, the familiar metal.">ذَهَبٍ</button>
    <button class="word-link" type="button" data-word="وَلُؤلُؤًا" data-root="L A L A" data-root-meaning="Pearls: gems known for their beauty and luster, used in the Qur’an both as adornment and a natural gift, and in similes concerning beauty." data-context="And pearls; among the ornaments of the gardens’ inhabitants." data-learn-more="/quran-terminology/en/roots/l-a-l-a/">وَلُؤلُؤًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِباسُهُم" data-root="L B S" data-learn-more="/quran-terminology/en/roots/l-b-s/" data-root-meaning="Wearing, covering, layering, mixing, and making something ambiguous." data-context="And their clothing; what they wear in those gardens.">وَلِباسُهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="حَريرٌ" data-root="H R R" data-root-meaning="Freedom, release, or exclusive dedication; in another branch, heat and scorching; ḥarīr: silk." data-context="Silk; the material of the promised gardens’ inhabitants’ clothing." data-learn-more="/quran-terminology/en/roots/h-r-r/">حَريرٌ</button>
  </p>
  <p class="english-verse">The God will indeed admit those who have believed and done righteous deeds into gardens beneath which rivers flow. There they will be adorned with bracelets of gold and pearls, and their clothing there will be silk.</p>
</section>
