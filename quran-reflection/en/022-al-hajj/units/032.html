<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُعَظِّم" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">يُعَظِّم</button>
    <button class="word-link" type="button" data-word="شَعٰئِرَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality">شَعٰئِرَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَإِنَّها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="تَقوَى" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">تَقوَى</button>
    <button class="word-link" type="button" data-word="القُلوبِ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">القُلوبِ</button>
  </p>
  <p class="english-verse">So it is. Whoever honors the symbols of The God, that is from the mindfulness of hearts.</p>
