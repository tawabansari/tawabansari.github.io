<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَستَعجِلونَكَ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">وَيَستَعجِلونَكَ</button>
    <button class="word-link" type="button" data-word="بِالعَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">بِالعَذابِ</button>
    <button class="word-link" type="button" data-word="وَلَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَن</button>
    <button class="word-link" type="button" data-word="يُخلِفَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">يُخلِفَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَعدَهُ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive">وَعدَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومًا</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="كَأَلفِ" data-root="ʾ L F" data-learn-more="/quran-terminology/en/roots/a-l-f/" data-root-meaning="Allafa: joining, becoming familiar, and establishing affinity and companionship">كَأَلفِ</button>
    <button class="word-link" type="button" data-word="سَنَةٍ" data-root="S N W" data-root-note="Root study coming soon.">سَنَةٍ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَعُدّونَ" data-root="ʿ D D (Ayn D D)" data-learn-more="/quran-terminology/en/roots/ayn-d-d/" data-root-meaning="Counting, measure, appointed duration, and ordered preparation for a defined purpose">تَعُدّونَ</button>
  </p>
  <p class="english-verse">They ask you to hasten the punishment, but The God will never break His promise. A day with your Lord is like a thousand years of what you count.</p>
</section>
