<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:34</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="And for every, expressing the scope of appointing rites for communities.">وَلِكُلِّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="A community, for which a rite has been appointed.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="We appointed or established, referring to each community’s rite.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="مَنسَكًا" data-root="N S K" data-learn-more="/quran-terminology/en/roots/n-s-k/" data-root-meaning="Ritual worship, sacrifice, and the performance of rites" data-context="A rite or act of worship, here associated with mentioning The God’s name over livestock.">مَنسَكًا</button>
    <button class="word-link" type="button" data-word="لِيَذكُرُوا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="That they may mention, speaking The God’s name over their livestock provision.">لِيَذكُرُوا</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The name, in “the name of The God,” mentioned over the livestock.">اسمَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="رَزَقَهُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="He has provided them, referring to the livestock made available to them.">رَزَقَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَهيمَةِ" data-root="B H2 M" data-root-meaning="In the main branch analysed by Ibn Fāris, B H M concerns blocked understanding or access and absence of clear distinguishing marks. In the animal branch, bahīmah names a quadruped; Qur’anic bahīmatu al-anʿāmi denotes the recognised livestock quadrupeds." data-context="A quadruped; in bahīmat al-anʿām, the recognised livestock provided for people and associated with mentioning The God’s name within rites." data-learn-more="/quran-terminology/en/roots/b-h2-m/">بَهيمَةِ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing Anʿām denotes livestock and domesticated grazing animals." data-context="The recognised livestock: camels, cattle, sheep, and goats in bahīmat al-anʿām.">الأَنعٰمِ</button>
    ۗ
    <button class="word-link" type="button" data-word="فَإِلٰهُكُم" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="So your deity, the One towards whom the addressees’ worship is directed.">فَإِلٰهُكُم</button>
    <button class="word-link" type="button" data-word="إِلٰهٌ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="A deity, within the declaration that the addressees’ deity is one.">إِلٰهٌ</button>
    <button class="word-link" type="button" data-word="وٰحِدٌ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="One, describing the deity in the declaration of divine unity.">وٰحِدٌ</button>
    <button class="word-link" type="button" data-word="فَلَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَهُ</button>
    <button class="word-link" type="button" data-word="أَسلِموا" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Submit, in “submit to Him,” directing receptive devotion towards Him.">أَسلِموا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="And give good news, addressing the humble mentioned next.">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُخبِتينَ" data-root="KH B T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-b-t/" data-root-meaning="Low, level ground; ikhbāt means humble, receptive submission." data-context="The humbly receptive, those who turn with humility and quiet acceptance.">المُخبِتينَ</button>
  </p>
  <p class="english-verse">For every community We appointed a rite, so that they may mention the name of The God over the livestock He has provided them. Your god is one God, so submit to Him, and give good news to the humble,</p>
</section>
