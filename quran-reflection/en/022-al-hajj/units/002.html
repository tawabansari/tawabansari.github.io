<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Day; the time when the terrifying event is seen.">يَومَ</button>
    <button class="word-link" type="button" data-word="تَرَونَها" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="You see it; witnessing the event mentioned.">تَرَونَها</button>
    <button class="word-link" type="button" data-word="تَذهَلُ" data-root="DH H2 L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-h2-l/" data-root-meaning="Being distracted or oblivious through preoccupation or terror." data-context="Becomes oblivious; forgetting the nursing infant amid the event’s severity.">تَذهَلُ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; encompassing nursing women in the verse’s scene.">كُلُّ</button>
    <button class="word-link" type="button" data-word="مُرضِعَةٍ" data-root="R DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-dad-ayn/" data-root-meaning="Suckling and nursing a child." data-context="A nursing woman; one engaged in suckling.">مُرضِعَةٍ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَمّا</button>
    <button class="word-link" type="button" data-word="أَرضَعَت" data-root="R DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-dad-ayn/" data-root-meaning="Suckling and nursing a child." data-context="She has nursed; referring to the child suckled by the woman.">أَرضَعَت</button>
    <button class="word-link" type="button" data-word="وَتَضَعُ" data-root="W DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dad-ayn/" data-root-meaning="Putting or setting down; childbirth; īḍāʿ denotes hurrying onward." data-context="And lays down; the ending of pregnancy in the terrifying scene.">وَتَضَعُ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; encompassing pregnant women in the scene.">كُلُّ</button>
    <button class="word-link" type="button" data-word="ذاتِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذاتِ</button>
    <button class="word-link" type="button" data-word="حَملٍ" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Pregnancy; in the expression every one bearing a pregnancy." data-learn-more="/quran-terminology/en/roots/h-m-l/">حَملٍ</button>
    <button class="word-link" type="button" data-word="حَملَها" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Her pregnancy; the unborn child laid down in the verse’s scene." data-learn-more="/quran-terminology/en/roots/h-m-l/">حَملَها</button>
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="And you see; observing the people’s condition.">وَتَرَى</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People; those whose condition is described next.">النّاسَ</button>
    <button class="word-link" type="button" data-word="سُكٰرىٰ" data-root="S K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-k-r/" data-root-meaning="Intoxication or impaired awareness; also obstruction of perception." data-context="As though intoxicated; people’s appearance amid intense fear.">سُكٰرىٰ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="بِسُكٰرىٰ" data-root="S K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-k-r/" data-root-meaning="Intoxication or impaired awareness; also obstruction of perception." data-context="Intoxicated; the condition denied of the people.">بِسُكٰرىٰ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; that whose severity is stated at the verse’s end.">عَذابَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شَديدٌ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="Severe; describing the punishment mentioned.">شَديدٌ</button>
  </p>
  <p class="english-verse">On the day you see it, every nursing woman will be distracted from what she nurses, and every pregnant woman will lay down her burden. You will see people drunk, though they are not drunk; but the punishment of The God is severe.</p>
</section>
