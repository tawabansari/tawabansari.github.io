<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believed.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="هادوا" data-root="H W D" data-learn-more="/quran-terminology/en/roots/h2-w-d/" data-root-meaning="From innā hudnā ilayka to alladhīna hādū" data-context="Became or are Jews; in the designation alladhīna hādū.">هادوا</button>
    <button class="word-link" type="button" data-word="وَالصّٰبِـٔينَ" data-root="Ṣ B A (SAD B A)" data-learn-more="/quran-terminology/en/roots/sad-b-a/" data-root-meaning="The community name “Sabians” in three Qur’anic verses" data-context="And the Sabians; a community designation.">وَالصّٰبِـٔينَ</button>
    <button class="word-link" type="button" data-word="وَالنَّصٰرىٰ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="And the Christians.">وَالنَّصٰرىٰ</button>
    <button class="word-link" type="button" data-word="وَالمَجوسَ" data-root-note="Proper name; no root has been assigned.">وَالمَجوسَ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="أَشرَكوا" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Associated partners.">أَشرَكوا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَفصِلُ" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="Judges and settles between them; concerning the Day of Resurrection." data-learn-more="/quran-terminology/en/roots/f-sad-l/">يَفصِلُ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between them; in the construction concerning judgment.">بَينَهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day of.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Resurrection.">القِيٰمَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; expressing comprehensiveness.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="A thing or matter under discussion." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God As the noun shayʾ, a thing or matter under discussion, distinct from the verb of willing.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="شَهيدٌ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="A witness, fully aware.">شَهيدٌ</button>
  </p>
  <p class="english-verse">Those who have believed, those who became Jews, the Sabians, the Christians, the Magians, and those who have associated partners—The God will judge between them on the Day of Resurrection. The God is witness over all things.</p>
</section>
