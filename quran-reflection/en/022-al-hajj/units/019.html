<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذانِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذانِ</button>
    <button class="word-link" type="button" data-word="خَصمانِ" data-root="KH SAD M" data-root-meaning="Two parties confronting and disputing over a claim, right, or contested issue; khasm denotes a party to the dispute." data-context="Two opposing parties disputing concerning their Lord." data-learn-more="/quran-terminology/en/roots/kh-sad-m/">خَصمانِ</button>
    <button class="word-link" type="button" data-word="اختَصَموا" data-root="KH SAD M" data-root-meaning="Two parties confronting and disputing over a claim, right, or contested issue; khasm denotes a party to the dispute." data-context="Disputed with one another concerning their Lord." data-learn-more="/quran-terminology/en/roots/kh-sad-m/">اختَصَموا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord, concerning whom the two parties dispute.">رَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved, the party whose punishment is described next.">كَفَروا</button>
    <button class="word-link" type="button" data-word="قُطِّعَت" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="Have been cut out, describing garments of fire prepared for them.">قُطِّعَت</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="ثِيابٌ" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-context="Garments, described as made of fire." data-root-meaning="Thāba: returning and the return of an outcome In the thiyāb branch, garments or clothing.">ثِيابٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="نارٍ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="Fire, from which the garments are described as made.">نارٍ</button>
    <button class="word-link" type="button" data-word="يُصَبُّ" data-root="SAD B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-b/" data-root-meaning="Pouring or letting flow down." data-context="Is poured, the scalding liquid flowing down from above.">يُصَبُّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِ" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above, the direction of pouring relative to the heads.">فَوقِ</button>
    <button class="word-link" type="button" data-word="رُءوسِهِمُ" data-root="R A S" data-root-meaning="The head; by extension, the upper, initial, or principal part of something. Raʾs al-māl: principal property." data-context="Their heads, from above which scalding liquid is poured." data-learn-more="/quran-terminology/en/roots/r-a-s/">رُءوسِهِمُ</button>
    <button class="word-link" type="button" data-word="الحَميمُ" data-root="H M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-m/" data-root-meaning="Intense heat; ḥamīm means very hot water or a close friend, according to context; yaḥmūm is black smoke." data-context="Scalding liquid, poured over the heads.">الحَميمُ</button>
  </p>
  <p class="english-verse">These are two adversaries who have disputed about their Lord. For those who disbelieved, garments of fire have been cut; boiling water will be poured over their heads.</p>
</section>
