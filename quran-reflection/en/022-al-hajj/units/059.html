<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:59</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَيُدخِلَنَّهُم" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it.">لَيُدخِلَنَّهُم</button>
    <button class="word-link" type="button" data-word="مُدخَلًا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it.">مُدخَلًا</button>
    <button class="word-link" type="button" data-word="يَرضَونَهُ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent">يَرضَونَهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَعَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">لَعَليمٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="H L M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-m/" data-root-meaning="Forbearance and self-restraint; also dreams, and maturity in the expression reaching ḥulum.">حَليمٌ</button>
  </p>
  <p class="english-verse">He will surely admit them to a place of entry with which they will be pleased. The God is knowing, forbearing.</p>
</section>
