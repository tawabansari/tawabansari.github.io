<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="بَوَّأنا" data-root="B W ʾ" data-learn-more="/quran-terminology/en/roots/b-w-a/" data-root-meaning="From returning and settling to providing a place and incurring consequences" data-context="We designated and prepared the place.">بَوَّأنا</button>
    <button class="word-link" type="button" data-word="لِإِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">لِإِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="مَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="The place and site.">مَكانَ</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="The House of worship whose site was designated for Abraham." data-learn-more="/quran-terminology/en/roots/b-y-t/">البَيتِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تُشرِك" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Associate a partner, in the prohibition of such association.">تُشرِك</button>
    <button class="word-link" type="button" data-word="بى" data-root-note="Grammatical word; no derivational root is assigned for this use.">بى</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="Anything taken as a partner." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God Shayʾ denotes a thing or matter being referred to.">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَطَهِّر" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state" data-context="And purify and keep ready for worship.">وَطَهِّر</button>
    <button class="word-link" type="button" data-word="بَيتِىَ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="My House, attributed to The God for worship." data-learn-more="/quran-terminology/en/roots/b-y-t/">بَيتِىَ</button>
    <button class="word-link" type="button" data-word="لِلطّائِفينَ" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="For those circling in circumambulation.">لِلطّائِفينَ</button>
    <button class="word-link" type="button" data-word="وَالقائِمينَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And those standing in worship.">وَالقائِمينَ</button>
    <button class="word-link" type="button" data-word="وَالرُّكَّعِ" data-root="R K ʿ (R K Ayn)" data-learn-more="/quran-terminology/en/roots/r-k-ayn/" data-root-meaning="Bending, lowering the body, coming down from uprightness, and showing submission through the body." data-context="And those bowing.">وَالرُّكَّعِ</button>
    <button class="word-link" type="button" data-word="السُّجودِ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Those prostrating.">السُّجودِ</button>
  </p>
  <p class="english-verse">When We established for Abraham the place of the House: associate nothing with Me, and purify My House for those who circle it, those who stand, those who bow, and those who prostrate.</p>
</section>
