<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:31</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حُنَفاءَ" data-root="Ḥ N F" data-learn-more="/quran-terminology/en/roots/h-n-f/" data-root-meaning="Ḥanīf: turning toward The God alone and away from shirk, with attention to inclination and the limits of historical evidence" data-context="Upright in devotion; turning toward the right way and away from associating partners.">حُنَفاءَ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Other than; here introducing the exclusion of associating partners.">غَيرَ</button>
    <button class="word-link" type="button" data-word="مُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Those associating partners; excluded by ghayr.">مُشرِكينَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُشرِك" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Associates partners; assigning partners to The God.">يُشرِك</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="فَكَأَنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَكَأَنَّما</button>
    <button class="word-link" type="button" data-word="خَرَّ" data-root="KH R R" data-root-meaning="Falling down and moving downward; in other lexical branches, flowing and its sound." data-context="Fell; falling from the sky in the simile describing someone who associates partners." data-learn-more="/quran-terminology/en/roots/kh-r-r/">خَرَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky; the starting point of the fall in the simile.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="فَتَخطَفُهُ" data-root="KH Ṭ F" data-learn-more="/quran-terminology/en/roots/kh-tt-f/" data-root-meaning="To snatch, seize suddenly, carry off swiftly, and separate something from its place before it has time to resist or stabilize" data-context="Then snatches him away; the person being seized in the falling image.">فَتَخطَفُهُ</button>
    <button class="word-link" type="button" data-word="الطَّيرُ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record." data-context="Birds, which snatch the person in one branch of the simile.">الطَّيرُ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَهوى" data-root="H W Y" data-learn-more="/quran-terminology/en/roots/h2-w-y/" data-root-meaning="Falling, being drawn in a direction, and personal desire" data-context="Casts down; the wind carries the person to a distant place.">تَهوى</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="الرّيحُ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit" data-context="The wind; the agent casting the person away in the other branch of the simile.">الرّيحُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="مَكانٍ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="A place; the remote location at the end of the image.">مَكانٍ</button>
    <button class="word-link" type="button" data-word="سَحيقٍ" data-root="S H Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-h-q/" data-root-meaning="Grinding or crushing; also remoteness or banishment." data-context="Far-distant; describing the place into which the wind casts the person.">سَحيقٍ</button>
  </p>
  <p class="english-verse">turning upright toward The God, associating no partners with Him. Whoever associates partners with The God is as though he had fallen from the sky and birds snatched him away, or the wind swept him into a distant place.</p>
</section>
