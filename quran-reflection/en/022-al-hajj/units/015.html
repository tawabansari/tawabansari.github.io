<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hajj 22:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Is: within the conditional description of the person.">كانَ</button>
    <button class="word-link" type="button" data-word="يَظُنُّ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="Supposes: the assumption that divine help will not come.">يَظُنُّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="يَنصُرَهُ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="Help him: the pronoun’s referent is discussed in interpretations of the verse.">يَنصُرَهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="This world: present life, contrasted with the Hereafter.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَالـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="And the Hereafter: the life to come, alongside this world.">وَالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="فَليَمدُد" data-root="M D D" data-learn-more="/quran-terminology/en/roots/m-d-d/" data-root-meaning="Stretching, extending, continuing, granting respite, adding support, and opening a wider field" data-context="Then let him extend: stretching out the rope in the verse’s image.">فَليَمدُد</button>
    <button class="word-link" type="button" data-word="بِسَبَبٍ" data-root="S B B" data-root-meaning="Sabab: A route, means, or bond enabling access and connection between two things. Sabba: To insult and offend through contemptuous speech. Lexical sources also connect this branch with cutting." data-context="With a rope: a means of extension and access in this verse’s image." data-learn-more="/quran-terminology/en/roots/s-b-b/">بِسَبَبٍ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky: the direction of the rope, interpreted as sky or ceiling in different readings.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="ليَقطَع" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="Let him cut: the object of cutting differs across interpretations of the sentence.">ليَقطَع</button>
    <button class="word-link" type="button" data-word="فَليَنظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Then let him see: examining the outcome of his scheme.">فَليَنظُر</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="يُذهِبَنَّ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach" data-context="Removes: questioning whether what enrages him is taken away.">يُذهِبَنَّ</button>
    <button class="word-link" type="button" data-word="كَيدُهُ" data-root="K Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-y-d/" data-root-meaning="Planning or subtle strategy; its evaluation depends on context." data-context="His scheme: the action attributed to that person.">كَيدُهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَغيظُ" data-root="GH Y ZHA" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-y-zha/" data-root-meaning="Intense anger or fury." data-context="Enrages: what provokes the person’s anger.">يَغيظُ</button>
  </p>
  <p class="english-verse">Whoever thinks that The God will not help him in this world and the hereafter, let him stretch a rope toward the sky, then cut; then let him see whether his scheme removes what enrages him.</p>
</section>
