<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Bayyinah 98:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَسولٌ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رَسولٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَتلوا" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another.">يَتلوا</button>
    <button class="word-link" type="button" data-word="صُحُفًا" data-root="SAD H F" data-root-meaning="Ṣuḥuf names written sheets and writings; ṣiḥāf names broad food dishes." data-learn-more="/quran-terminology/en/roots/sad-h-f/">صُحُفًا</button>
    <button class="word-link" type="button" data-word="مُطَهَّرَةً" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state">مُطَهَّرَةً</button>
  </p>
  <p class="english-verse">a messenger from The God, reciting purified pages,</p>
