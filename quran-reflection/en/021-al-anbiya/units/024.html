  <h2 class="ayah-title">Al-Anbiya 21:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it">دونِهِ</button>
    <button class="word-link" type="button" data-word="ءالِهَةً" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">ءالِهَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>
    <button class="word-link" type="button" data-word="هاتوا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هاتوا</button>
    <button class="word-link" type="button" data-word="بُرهٰنَكُم" data-root="B R H N" data-learn-more="/quran-terminology/en/roots/b-r-h2-n/" data-root-meaning="Burhān: evidence that clarifies and establishes something">بُرهٰنَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="ذِكرُ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">ذِكرُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="مَعِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعِىَ</button>

    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="قَبلى" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلى</button>

    <button class="word-link" type="button" data-word="أَكثَرُهُم" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">أَكثَرُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمونَ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">الحَقَّ</button>

    <button class="word-link" type="button" data-word="فَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهُم</button>
    <button class="word-link" type="button" data-word="مُعرِضونَ" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment">مُعرِضونَ</button>
  </p>
  <p class="english-verse">Have they taken gods apart from Him? Say, “Bring your proof. This is the remembrance of those with me and the remembrance of those before me.” But most of them do not know the truth, so they turn away.</p>
