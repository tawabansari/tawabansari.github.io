<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خُلِقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">خُلِقَ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company">الإِنسٰنُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عَجَلٍ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">عَجَلٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="سَأُو۟ريكُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">سَأُو۟ريكُم</button>
    <button class="word-link" type="button" data-word="ءايٰتى" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتى</button>

    <button class="word-link" type="button" data-word="تَستَعجِلونِ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">تَستَعجِلونِ</button>
  </p>
  <p class="english-verse">The human being was created of haste. I will show you My signs, so do not ask Me to hasten.</p>
