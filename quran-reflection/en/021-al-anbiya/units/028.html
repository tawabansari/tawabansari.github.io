<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="He knows what is before them and behind them.">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Before them, in the expression bayna aydīhim.">بَينَ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands; in this expression, what lies before them.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="خَلفَهُم" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Behind them; what lies behind them.">خَلفَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَشفَعونَ" data-root="SH F ʿ (SH F Ayn)" data-learn-more="/quran-terminology/en/roots/sh-f-ayn/" data-root-meaning="Pairing, joining, and placing one factor beside another to support or strengthen an effect" data-context="They intercede, only for someone He approves.">يَشفَعونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="لِمَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَنِ</button>
    <button class="word-link" type="button" data-word="ارتَضىٰ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent" data-context="He approved; someone who meets His approval.">ارتَضىٰ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خَشيَتِهِ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God" data-context="Awe of Him; reverent fear of The God.">خَشيَتِهِ</button>
    <button class="word-link" type="button" data-word="مُشفِقونَ" data-root="SH F Q" data-learn-more="/quran-terminology/en/roots/sh-f-q/" data-root-meaning="Shafaq: the light and redness of the horizon after sunset; ishfāq: apprehension and concern, and in some uses compassion and care for another." data-context="Apprehensive out of awe of Him; describing the honored servants.">مُشفِقونَ</button>
  </p>
  <p class="english-verse">He knows what is before them and what is behind them. They intercede only for one He approves of, and they are apprehensive in awe of Him.</p>
</section>
