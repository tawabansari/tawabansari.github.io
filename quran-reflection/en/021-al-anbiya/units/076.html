<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:76</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنوحًا" data-root-note="Proper name; no root has been assigned.">وَنوحًا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="Called, Noah’s appeal that was answered." data-learn-more="/quran-terminology/en/roots/n-d-y/">نادىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before, the time of Noah’s call.">قَبلُ</button>
    <button class="word-link" type="button" data-word="فَاستَجَبنا" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/" data-context="Then We answered Noah’s call.">فَاستَجَبنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="فَنَجَّينٰهُ" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety" data-context="Then We saved him, referring to Noah.">فَنَجَّينٰهُ</button>
    <button class="word-link" type="button" data-word="وَأَهلَهُ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="And his family, who were saved with him.">وَأَهلَهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الكَربِ" data-root="K R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-b/" data-root-meaning="Severe distress or anguish." data-context="Distress or affliction from which they were saved.">الكَربِ</button>
    <button class="word-link" type="button" data-word="العَظيمِ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Great, describing the distress.">العَظيمِ</button>
  </p>
  <p class="english-verse">And Noah, when he called before: We answered him and saved him and his family from the great distress.</p>
