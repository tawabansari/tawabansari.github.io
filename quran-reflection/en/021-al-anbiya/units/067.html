<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:67</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُفٍّ" data-root="A F F" data-learn-more="/quran-terminology/en/roots/a-f-f/" data-root-meaning="Expressing displeasure, impatience, or aversion toward someone or something through a short exclamation revealing the speaker’s dislike and irritation." data-context="Uff to you and your objects of worship; Ibrāhīm’s aversion and reproach in the critique of idol worship.">أُفٍّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَلِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلِما</button>
    <button class="word-link" type="button" data-word="تَعبُدونَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="You worship; devotion to things apart from The God, which Ibrāhīm condemns.">تَعبُدونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Apart from or other than; in min dūni allāh concerning other objects of worship.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ʿ Q L (Ayn Q L)" data-learn-more="/quran-terminology/en/roots/ayn-q-l/" data-root-meaning="Tying, restraining, understanding, connecting meaning, and holding judgment back from scattering" data-context="Will you not reason? Calling for rational consideration of the supposed gods’ powerlessness.">تَعقِلونَ</button>
  </p>
  <p class="english-verse">Uff to you and to what you worship apart from The God! Will you not reason?”</p>
</section>
