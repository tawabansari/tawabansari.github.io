<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لاهِيَةً" data-root="L H2 W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h2-w/" data-root-meaning="Diversion from an important matter; ilhāʾ means distracting.">لاهِيَةً</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">قُلوبُهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأَسَرُّوا" data-root="S R R" data-learn-more="/quran-terminology/en/roots/s-r-r/" data-root-meaning="Secrets and Hidden Matters, Joy and Ease, and Places of Rest">وَأَسَرُّوا</button>
    <button class="word-link" type="button" data-word="النَّجوَى" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety">النَّجوَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظَلَموا</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="بَشَرٌ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">بَشَرٌ</button>
    <button class="word-link" type="button" data-word="مِثلُكُم" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">مِثلُكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَتَأتونَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">أَفَتَأتونَ</button>
    <button class="word-link" type="button" data-word="السِّحرَ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn">السِّحرَ</button>
    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="تُبصِرونَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">تُبصِرونَ</button>
  </p>
  <p class="english-verse">their hearts distracted. Those who did wrong concealed their private conversation: “Is this not merely a human like you? Will you approach magic while you see?”</p>
</section>
