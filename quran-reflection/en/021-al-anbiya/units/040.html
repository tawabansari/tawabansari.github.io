<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="تَأتيهِم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes upon them, the event being warned of.">تَأتيهِم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="B GH T" data-root-meaning="Something arriving or happening suddenly at a time when its audience did not expect it or was unaware of its approach." data-context="Suddenly, describing the event’s arrival before it bewilders them." data-learn-more="/quran-terminology/en/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="فَتَبهَتُهُم" data-root="B H2 T" data-root-meaning="In one branch, B H T denotes bewilderment and inability to respond to something startling or an unanswerable argument. In another, buhtān denotes falsehood and wrongful attribution distorting truth and potentially exposing an innocent person to accusation or harm." data-context="Then bewilders them, describing their response to the event’s arrival." data-learn-more="/quran-terminology/en/roots/b-h2-t/">فَتَبهَتُهُم</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="Are able; negated to express inability to repel the event.">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="رَدَّها" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="Repelling or turning it back, which they cannot do.">رَدَّها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="يُنظَرونَ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Are granted respite; negated to deny further delay.">يُنظَرونَ</button>
  </p>
  <p class="english-verse">Rather, it will come upon them suddenly and bewilder them. They will not be able to repel it, nor will they be given respite.</p>
</section>
