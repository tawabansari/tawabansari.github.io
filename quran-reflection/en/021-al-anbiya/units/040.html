  <h2 class="ayah-title">Al-Anbiya 21:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="تَأتيهِم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">تَأتيهِم</button>

    <button class="word-link" type="button" data-word="فَتَبهَتُهُم" data-root="B H2 T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-h2-t/" data-root-meaning="Being confounded or stunned; buhtān: a shocking falsehood or false accusation.">فَتَبهَتُهُم</button>

    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="رَدَّها" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course">رَدَّها</button>

    <button class="word-link" type="button" data-word="يُنظَرونَ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay">يُنظَرونَ</button>
  </p>
  <p class="english-verse">Rather, it will come upon them suddenly and bewilder them. They will not be able to repel it, nor will they be given respite.</p>
