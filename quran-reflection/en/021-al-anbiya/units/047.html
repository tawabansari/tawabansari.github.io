<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَضَعُ" data-root="W DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dad-ayn/" data-root-meaning="Putting or setting down; childbirth; īḍāʿ denotes hurrying onward." data-context="and We set up">وَنَضَعُ</button>
    <button class="word-link" type="button" data-word="المَوٰزينَ" data-root="W Z N" data-learn-more="/quran-terminology/en/roots/w-z-n/" data-root-meaning="Weighing, measuring with a scale, establishing balance, and recognizing quantity or value through a criterion" data-context="the scales">المَوٰزينَ</button>
    <button class="word-link" type="button" data-word="القِسطَ" data-root="Q S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-tt/" data-root-meaning="Qisṭ and iqṣāṭ concern justice; qusūṭ concerns injustice or deviation; the form determines the sense." data-context="just">القِسطَ</button>
    <button class="word-link" type="button" data-word="لِيَومِ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="for the day">لِيَومِ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="resurrection">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تُظلَمُ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="is not wronged">تُظلَمُ</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="no soul">نَفسٌ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="at all">شَيـًٔا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="is">كانَ</button>
    <button class="word-link" type="button" data-word="مِثقالَ" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="the weight of" data-learn-more="/quran-terminology/en/roots/th-q-l/">مِثقالَ</button>
    <button class="word-link" type="button" data-word="حَبَّةٍ" data-root="H B B" data-root-meaning="Grain and seed; ḥabb denotes grain, and ḥabbah a single seed." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="a seed">حَبَّةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خَردَلٍ" data-root="KH R D L" data-root-meaning="Mustard, the plant and its small seeds, used in the Qur’an for comparison with a very slight amount." data-context="mustard" data-learn-more="/quran-terminology/en/roots/kh-r-d-l/">خَردَلٍ</button>
    <button class="word-link" type="button" data-word="أَتَينا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We bring">أَتَينا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="K F Y" data-learn-more="/quran-terminology/en/roots/k-f-y/" data-root-meaning="Sufficiency: meeting a need and handling another’s affairs; The God’s sufficiency in witnessing, reckoning, aid, and protection" data-context="and We suffice">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِنا</button>
    <button class="word-link" type="button" data-word="حٰسِبينَ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="reckoners">حٰسِبينَ</button>
  </p>
  <p class="english-verse">We will set up the scales of justice for the Day of Resurrection, and no soul will be wronged at all. Even if it is the weight of a mustard seed, We will bring it. We suffice as reckoners.</p>
</section>
