<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:87</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَذَا</button>
    <button class="word-link" type="button" data-word="النّونِ" data-root="N W N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-w-n/" data-root-meaning="Nūn is a letter name and denotes a fish in Dhū al-Nūn; isolated letters lack a certain lexical interpretation." data-context="The fish, within the designation of its companion.">النّونِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="ذَهَبَ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach" data-context="Went away, referring to the man of the fish.">ذَهَبَ</button>
    <button class="word-link" type="button" data-word="مُغٰضِبًا" data-root="GH Ḍ B" data-learn-more="/quran-terminology/en/roots/gh-dad-b/" data-root-meaning="Intense displeasure and a response to what is unacceptable" data-context="Angry, his state when leaving.">مُغٰضِبًا</button>
    <button class="word-link" type="button" data-word="فَظَنَّ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="Then supposed, his expectation of what would follow.">فَظَنَّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="نَقدِرَ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Constrain him, within this contextual interpretation.">نَقدِرَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="فَنادىٰ" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="Then called, the man of the fish addressing his Lord in the darkness." data-learn-more="/quran-terminology/en/roots/n-d-y/">فَنادىٰ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الظُّلُمٰتِ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Darknesses, the setting of his call.">الظُّلُمٰتِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="إِلٰهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="A deity, within the denial of any besides the addressee.">إِلٰهَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتَ</button>
    <button class="word-link" type="button" data-word="سُبحٰنَكَ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Glory be to You, declaring the addressee free of imperfection.">سُبحٰنَكَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="كُنتُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="I was, acknowledging his former state.">كُنتُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrongdoers, among whom the speaker places himself.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">And the companion of the fish, when he went away in anger and thought We would not constrain him. He called out in the darkness, “There is no god but You. Glory be to You! I was among the wrongdoers.”</p>
</section>
