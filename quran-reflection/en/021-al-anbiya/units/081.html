<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:81</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِسُلَيمٰنَ" data-root-note="Proper name; no root has been assigned.">وَلِسُلَيمٰنَ</button>
    <button class="word-link" type="button" data-word="الرّيحَ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit" data-context="The wind, made to flow for Solomon.">الرّيحَ</button>
    <button class="word-link" type="button" data-word="عاصِفَةً" data-root="AYN SAD F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-f/" data-root-meaning="Violent wind; ʿaṣf denotes crop leaves or dry stalks." data-context="Blowing strongly, describing the wind.">عاصِفَةً</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="J R Y" data-learn-more="/quran-terminology/en/roots/j-r-y/" data-root-meaning="Flowing, running, continuous movement in a channel, and moving along an appointed course" data-context="Flowed or traveled, referring to the wind.">تَجرى</button>
    <button class="word-link" type="button" data-word="بِأَمرِهِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="At his command, qualifying the wind’s movement.">بِأَمرِهِ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The land toward which the wind traveled.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="بٰرَكنا" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="We had placed blessing in that land, toward which the wind flowed at Solomon’s command." data-learn-more="/quran-terminology/en/roots/b-r-k/">بٰرَكنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="We were, in the expression of divine knowledge.">وَكُنّا</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every, expressing the scope of knowledge.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="Willing and wish; shayʾ denotes a thing, entity, or matter that can be referred to." data-context="Thing or matter, the object of knowledge.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عٰلِمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing, describing the divine speaker.">عٰلِمينَ</button>
  </p>
  <p class="english-verse">For Solomon, the stormy wind ran by his command toward the land We had blessed. We knew all things.</p>
</section>
