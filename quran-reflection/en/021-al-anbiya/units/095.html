<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:95</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَحَرٰمٌ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Forbidden or precluded, concerning the destroyed community’s return.">وَحَرٰمٌ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَريَةٍ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="A settlement that was destroyed.">قَريَةٍ</button>
    <button class="word-link" type="button" data-word="أَهلَكنٰها" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="A settlement and community We destroyed." data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَهلَكنٰها</button>

    <button class="word-link" type="button" data-word="يَرجِعونَ" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="Return; the negation’s scope requires contextual attention.">يَرجِعونَ</button>
  </p>
  <p class="english-verse">It is forbidden for a town We have destroyed that they should not return,</p>
