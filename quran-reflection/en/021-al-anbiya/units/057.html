<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:57</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَتَاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَأَكيدَنَّ" data-root="K Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-y-d/" data-root-meaning="Planning or subtle strategy; its evaluation depends on context.">لَأَكيدَنَّ</button>
    <button class="word-link" type="button" data-word="أَصنٰمَكُم" data-root="SAD N M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-n-m/" data-root-meaning="An idol or image worshipped.">أَصنٰمَكُم</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تُوَلّوا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">تُوَلّوا</button>
    <button class="word-link" type="button" data-word="مُدبِرينَ" data-root="D B R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back or end; turning away; planning or reflecting with attention to outcomes.">مُدبِرينَ</button>
  </p>
  <p class="english-verse">By The God, I will devise a plan against your idols after you turn your backs and leave.”</p>
</section>
