  <h2 class="ayah-title">Al-Anbiya 21:26</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="اتَّخَذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">اتَّخَذَ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">الرَّحمٰنُ</button>

  <p class="english-verse">They say, “The Entirely Merciful has taken a child.” Glory be to Him! Rather, they are honored servants.</p>
