<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="مَتَّعنا" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement.">مَتَّعنا</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="وَءاباءَهُم" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations">وَءاباءَهُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="طالَ" data-root="TT W L" data-root-note="Root study coming soon.">طالَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="العُمُرُ" data-root="ʿ M R" data-learn-more="/quran-terminology/en/roots/ayn-m-r/" data-root-meaning="ʿAmara: the continuation of life, inhabited places, and enduring presence">العُمُرُ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="يَرَونَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">يَرَونَ</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّا</button>
    <button class="word-link" type="button" data-word="نَأتِى" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">نَأتِى</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضَ</button>
    <button class="word-link" type="button" data-word="نَنقُصُها" data-root="N Q Ṣ" data-learn-more="/quran-terminology/en/roots/n-q-sad/" data-root-meaning="Decreasing, diminishing and deficiency: from losses of wealth and produce to withholding others’ rights, a reduced lifespan and changing territorial limits">نَنقُصُها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَطرافِها" data-root="TT R F" data-learn-more="/quran-terminology/en/roots/tt-r-f/" data-root-meaning="Edges, sides, parts of a whole, the gaze, and the movement of sight">أَطرافِها</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَهُمُ</button>
    <button class="word-link" type="button" data-word="الغٰلِبونَ" data-root="GH L B" data-root-note="Root study coming soon.">الغٰلِبونَ</button>
  </p>
  <p class="english-verse">We gave these people and their fathers enjoyment until their lives grew long. Do they not see that We come to the land, reducing it from its edges? Are they the victors?</p>
</section>
