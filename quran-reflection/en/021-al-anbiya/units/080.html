  <h2 class="ayah-title">Al-Anbiya 21:80</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَلَّمنٰهُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="And We taught him; David">وَعَلَّمنٰهُ</button>

    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="لِتُحصِنَكُم" data-root="H SAD N" data-root-meaning="In Arabic, ح ص ن denotes protection, safeguarding, and making something secure against access or violation. حِصْن is a place that protects what is inside it; taḥṣīn is the act of strengthening and securing; iḥṣān can apply in material, behavioral, and social contexts." data-context="To protect you from harm in battle, through the making of armor" data-learn-more="/quran-terminology/en/roots/h-sad-n/">لِتُحصِنَكُم</button>

    <button class="word-link" type="button" data-word="فَهَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهَل</button>

    <button class="word-link" type="button" data-word="شٰكِرونَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="Thankful for this teaching and benefit">شٰكِرونَ</button>

  <p class="english-verse">We taught him the making of armor for you, to protect you from your fighting. Will you be grateful?</p>
