<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلُّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/">نَفسٍ</button>
    <button class="word-link" type="button" data-word="ذائِقَةُ" data-root="DH W Q" data-root-note="Root study coming soon.">ذائِقَةُ</button>
    <button class="word-link" type="button" data-word="المَوتِ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">المَوتِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَنَبلوكُم" data-root="B L W" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away">وَنَبلوكُم</button>
    <button class="word-link" type="button" data-word="بِالشَّرِّ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/">بِالشَّرِّ</button>
    <button class="word-link" type="button" data-word="وَالخَيرِ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">وَالخَيرِ</button>
    <button class="word-link" type="button" data-word="فِتنَةً" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction">فِتنَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِلَينا</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference">تُرجَعونَ</button>
  </p>
  <p class="english-verse">Every soul will taste death. We test you with evil and good as a trial, and to Us you will be returned.</p>
</section>
