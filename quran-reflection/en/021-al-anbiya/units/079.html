<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:79</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَفَهَّمنٰها" data-root="F H2 M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-h2-m/" data-root-meaning="Understanding or grasping meaning." data-context="We gave him understanding of it; Solomon’s understanding of the judgment.">فَفَهَّمنٰها</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنَ" data-root-note="Proper name; no root has been assigned.">سُلَيمٰنَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلًّا" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Each; referring to both figures mentioned.">وَكُلًّا</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We gave; granting judgment and knowledge.">ءاتَينا</button>
    <button class="word-link" type="button" data-word="حُكمًا" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Judgment; a gift granted to both.">حُكمًا</button>
    <button class="word-link" type="button" data-word="وَعِلمًا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge; understanding granted alongside judgment.">وَعِلمًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَسَخَّرنا" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/" data-context="And subjected; making the mountains join David.">وَسَخَّرنا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="Proper name; no root has been assigned.">داوۥدَ</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; described as glorifying together with David." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجِبالَ</button>
    <button class="word-link" type="button" data-word="يُسَبِّحنَ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="They glorify; describing the mountains with David.">يُسَبِّحنَ</button>
    <button class="word-link" type="button" data-word="وَالطَّيرَ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record." data-context="And the birds; alongside the mountains joining David.">وَالطَّيرَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And We were; introducing the assertion of agency.">وَكُنّا</button>
    <button class="word-link" type="button" data-word="فٰعِلينَ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="The doers; emphasizing divine accomplishment of the action.">فٰعِلينَ</button>
  </p>
  <p class="english-verse">We gave Solomon understanding of it, and gave each judgment and knowledge. We subjected the mountains and birds to glorify with David. We were the doers.</p>
</section>
