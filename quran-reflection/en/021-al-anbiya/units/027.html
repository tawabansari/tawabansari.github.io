<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَسبِقونَهُ" data-root="S B Q" data-learn-more="/quran-terminology/en/roots/s-b-q/" data-root-meaning="Preceding, getting ahead and outstripping: from racing and temporal priority to taking the lead in good deeds and the impossibility of outstripping The God’s will">يَسبِقونَهُ</button>
    <button class="word-link" type="button" data-word="بِالقَولِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">بِالقَولِ</button>

    <button class="word-link" type="button" data-word="بِأَمرِهِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">بِأَمرِهِ</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">يَعمَلونَ</button>
  </p>
  <p class="english-verse">They do not precede Him in speech, and they act by His command.</p>
