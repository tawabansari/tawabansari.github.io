  <h2 class="ayah-title">Al-Anbiya 21:104</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>

    <button class="word-link" type="button" data-word="خَلقٍ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">خَلقٍ</button>

  <p class="english-verse">On the day We roll up the sky as a scroll is rolled up for writings. As We began the first creation, We will restore it—a promise binding upon Us. We will do it.</p>
