  <h2 class="ayah-title">Al-Anbiya 21:104</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day or time of the described event">يَومَ</button>
    <button class="word-link" type="button" data-word="نَطوِى" data-root="TT W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-w-y/" data-root-meaning="Folding or rolling up; Ṭuwā is a valley&#x27;s proper name." data-context="We roll up">نَطوِى</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heaven">السَّماءَ</button>
    <button class="word-link" type="button" data-word="كَطَىِّ" data-root="TT W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-w-y/" data-root-meaning="Folding or rolling up; Ṭuwā is a valley&#x27;s proper name." data-context="Like the rolling up">كَطَىِّ</button>
    <button class="word-link" type="button" data-word="السِّجِلِّ" data-root="S J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-j-l/" data-root-meaning="Sijill is a written record or scroll; sijjīl denotes stones of punishment, with disputed etymology." data-context="A scroll or written sheet">السِّجِلِّ</button>
    <button class="word-link" type="button" data-word="لِلكُتُبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="For writings">لِلكُتُبِ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَما</button>
    <button class="word-link" type="button" data-word="بَدَأنا" data-root="B D A" data-root-meaning="Beginning, doing something initially or starting an activity or process; in creation contexts, bringing forth initially." data-learn-more="/quran-terminology/en/roots/b-d-a/" data-context="We began, bringing forth the first creation">بَدَأنا</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="First">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="خَلقٍ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Creation">خَلقٍ</button>
    <button class="word-link" type="button" data-word="نُعيدُهُ" data-root="AYN W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-d/" data-root-meaning="Returning or repeating; ʿīd is a recurring occasion; ʿĀd is also a people&#x27;s proper name." data-context="We restore it">نُعيدُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعدًا" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="A promise or commitment binding upon the speaker">وَعدًا</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, within the assurance of fulfilment">كُنّا</button>
    <button class="word-link" type="button" data-word="فٰعِلينَ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="Those who perform or fulfil that promise">فٰعِلينَ</button>
  </p>
  <p class="english-verse">On the day We roll up the sky as a scroll is rolled up for writings. As We began the first creation, We will restore it—a promise binding upon Us. We will do it.</p>
</section>
