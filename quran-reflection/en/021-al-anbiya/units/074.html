<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:74</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلوطًا" data-root-note="Proper name; no root has been assigned.">وَلوطًا</button>
    <button class="word-link" type="button" data-word="ءاتَينٰهُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We gave him; the granting of judgment and knowledge to Lot.">ءاتَينٰهُ</button>
    <button class="word-link" type="button" data-word="حُكمًا" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Judgment and the capacity to judge, granted together with knowledge.">حُكمًا</button>
    <button class="word-link" type="button" data-word="وَعِلمًا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="And knowledge; the understanding given to Lot.">وَعِلمًا</button>
    <button class="word-link" type="button" data-word="وَنَجَّينٰهُ" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety" data-context="And We rescued him; delivered him from that town.">وَنَجَّينٰهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَريَةِ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="The town; its inhabitants whose conduct is being described.">القَريَةِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; in the construction describing their practice of those deeds.">كانَت</button>
    <button class="word-link" type="button" data-word="تَعمَلُ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Committed; the conduct of the town’s inhabitants.">تَعمَلُ</button>
    <button class="word-link" type="button" data-word="الخَبٰئِثَ" data-root="KH B TH" data-learn-more="/quran-terminology/en/roots/kh-b-th/" data-root-meaning="In its basic sense, khabīth describes something undesirable and unworthy in quality, effect, conduct, or value." data-context="Foul, wrongful deeds; the object of “committed.”">الخَبٰئِثَ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were; describing those people’s condition and conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="قَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life; A people, group, or society standing upon a shared bond." data-context="A people; the community described as evil in conduct.">قَومَ</button>
    <button class="word-link" type="button" data-word="سَوءٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evil; in the description “an evil people.”">سَوءٍ</button>
    <button class="word-link" type="button" data-word="فٰسِقينَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command" data-context="Defiantly disobedient, departing from the bounds of right.">فٰسِقينَ</button>
  </p>
  <p class="english-verse">We gave Lot judgment and knowledge, and saved him from the town that practiced foul deeds. They were an evil, defiant people.</p>
</section>
