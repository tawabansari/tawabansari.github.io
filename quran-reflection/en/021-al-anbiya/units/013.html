<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَركُضوا" data-root="R K DAD" data-learn-more="/quran-terminology/en/roots/r-k-dad/" data-root-meaning="Foot movement and striking with it; setting in motion, running and hastening, and in other uses stirring or jolting." data-context="With prohibitive lā: do not flee; a prohibition on continuing hurried flight.">تَركُضوا</button>
    <button class="word-link" type="button" data-word="وَارجِعوا" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="And return, to your former luxury and dwellings.">وَارجِعوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أُترِفتُم" data-root="T R F" data-learn-more="/quran-terminology/en/roots/t-r-f/" data-root-meaning="Expanded ease, luxury, pampered entitlement, and the habit of having desires answered without limit or responsibility." data-context="You were afforded luxury in it, referring to their former comfortable life.">أُترِفتُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="وَمَسٰكِنِكُم" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling" data-context="And your dwellings, the homes from which you were fleeing.">وَمَسٰكِنِكُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُسـَٔلونَ" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="You may be questioned or asked for something; the phrase does not specify what is asked.">تُسـَٔلونَ</button>
  </p>
  <p class="english-verse">“Do not flee. Return to the luxury you enjoyed and to your homes, so that you may be questioned.”</p>
</section>
