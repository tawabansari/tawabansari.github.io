<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:91</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّتى</button>
    <button class="word-link" type="button" data-word="أَحصَنَت" data-root="H SAD N" data-root-meaning="In Arabic, ح ص ن denotes protection, safeguarding, and making something secure against access or violation. حِصْن is a place that protects what is inside it; taḥṣīn is the act of strengthening and securing; iḥṣān can apply in material, behavioral, and social contexts." data-context="She guarded; Mary safeguarded her chastity" data-learn-more="/quran-terminology/en/roots/h-sad-n/">أَحصَنَت</button>
    <button class="word-link" type="button" data-word="فَرجَها" data-root="F R J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-j/" data-root-meaning="An opening or gap; farj also denotes private parts, according to context." data-context="Her sexual privacy and chastity">فَرجَها</button>
    <button class="word-link" type="button" data-word="فَنَفَخنا" data-root="N F KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-kh/" data-root-meaning="Blowing or setting air in motion." data-context="Then We breathed; in the account of Jesus’s creation">فَنَفَخنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="روحِنا" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit" data-context="Of Our spirit, in the verse’s expression of breathing">روحِنا</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰها" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We made her">وَجَعَلنٰها</button>
    <button class="word-link" type="button" data-word="وَابنَها" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="And her son; Jesus">وَابنَها</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="A sign; Mary and her son together">ءايَةً</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="For all worlds">لِلعٰلَمينَ</button>
  </p>
  <p class="english-verse">And the woman who guarded her chastity: We breathed into her of Our spirit and made her and her son a sign for all peoples.</p>
</section>
