<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:98</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَعبُدونَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="You worship; referring to the addressees’ objects of worship.">تَعبُدونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Apart from God; in the expression min dūni Allāh.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="حَصَبُ" data-root="H SAD B" data-root-meaning="The root’s concrete core concerns gravel, pebbles, and pelting with them; its fire-related branch concerns material cast into a fire and burned. Both branches can be distinguished in Qur’anic usage, and accurate translation requires interpreting each derivative through its own structure and context." data-context="Hell’s fuel; what is cast into Jahannam." data-learn-more="/quran-terminology/en/roots/h-sad-b/">حَصَبُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتُم</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَها</button>
    <button class="word-link" type="button" data-word="وٰرِدونَ" data-root="W R D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-r-d/" data-root-meaning="Arriving at water or a destination; wird denotes arrival or an allotted portion." data-context="You will enter it; addressing the people described.">وٰرِدونَ</button>
  </p>
  <p class="english-verse">You and what you worship apart from The God are fuel for Hell. You will come to it.</p>
</section>
