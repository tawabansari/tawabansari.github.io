<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anbiya 21:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="زالَت" data-root="Z W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-w-l/" data-root-meaning="Moving from a place or ceasing to remain." data-context="Continued; with mā, expressing that their cry did not cease.">زالَت</button>
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">تِلكَ</button>
    <button class="word-link" type="button" data-word="دَعوىٰهُم" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Their cry and declaration, the confession they kept repeating.">دَعوىٰهُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="جَعَلنٰهُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="We made them; the resulting condition follows.">جَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="حَصيدًا" data-root="H SAD D" data-root-meaning="Arabic records two branches of ح ص د: cutting and reaping, and making firm or strong. The first is familiar in cutting stalks and harvesting crops; the second concerns tightly made ropes, armor, and similar structures." data-context="Like a reaped field, depicting their destruction and being laid low." data-learn-more="/quran-terminology/en/roots/h-sad-d/">حَصيدًا</button>
    <button class="word-link" type="button" data-word="خٰمِدينَ" data-root="KH M D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-m-d/" data-root-meaning="Becoming extinguished or motionless, like a dying fire." data-context="Extinguished and still, the second image after being reaped.">خٰمِدينَ</button>
  </p>
  <p class="english-verse">That remained their cry until We made them like a harvested field, extinguished.</p>
