<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan; the one identified as an enemy.">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="An enemy; Satan’s relationship to those addressed.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="فَاتَّخِذوهُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="So take him; in the instruction to treat him as an enemy.">فَاتَّخِذوهُ</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="An enemy; how Satan should be regarded.">عَدُوًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يَدعوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Calls; Satan inviting his followers.">يَدعوا</button>
    <button class="word-link" type="button" data-word="حِزبَهُ" data-root="H Z B" data-root-meaning="Gathering and forming a collective; people joined by a shared affiliation, position, or purpose." data-context="His group; Satan’s followers whom he calls towards the fire." data-learn-more="/quran-terminology/en/roots/h-z-b/">حِزبَهُ</button>
    <button class="word-link" type="button" data-word="لِيَكونوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="So that they may be; the outcome or aim of that invitation.">لِيَكونوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَصحٰبِ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="Companions or inhabitants; here, of the blazing fire.">أَصحٰبِ</button>
    <button class="word-link" type="button" data-word="السَّعيرِ" data-root="S AYN R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-ayn-r/" data-root-meaning="Kindling fire; saʿīr is blazing fire; suʿur in some contexts denotes derangement." data-context="The blazing fire; the destination of Satan’s invitation.">السَّعيرِ</button>
  </p>
  <p class="english-verse">Indeed, Satan is an enemy to you, so take him as an enemy. He only calls his party so that they may be among the companions of the blaze.</p>
</section>
