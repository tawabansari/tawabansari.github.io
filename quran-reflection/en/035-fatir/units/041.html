<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُمسِكُ" data-root="M S K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-k/" data-root-meaning="Grasping, retaining, or holding firmly." data-context="Sustains the heavens and earth against passing away.">يُمسِكُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; one of the objects sustained in the sentence.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; sustained together with the heavens.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَزولا" data-root="Z W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-w-l/" data-root-meaning="Moving from a place or ceasing to remain." data-context="Pass away; what the heavens and earth are sustained against.">تَزولا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="زالَتا" data-root="Z W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-w-l/" data-root-meaning="Moving from a place or ceasing to remain." data-context="They passed away; in the condition concerning the heavens and earth.">زالَتا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="أَمسَكَهُما" data-root="M S K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-k/" data-root-meaning="Grasping, retaining, or holding firmly." data-context="Sustained them both; denying another’s ability to sustain them.">أَمسَكَهُما</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَحَدٍ" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="Anyone; within the denial of another sustainer.">أَحَدٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After Him; in the denial of another able to sustain them both.">بَعدِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Is; introducing His forbearance and forgiveness.">كانَ</button>
    <button class="word-link" type="button" data-word="حَليمًا" data-root="H L M" data-root-meaning="Dreams and visions in sleep; puberty in بُلُوغُ الْحُلُمِ; reason, forbearance, and self-restraint against rashness." data-context="Forbearing; alongside forgiveness after the account of sustaining the heavens and earth." data-learn-more="/quran-terminology/en/roots/h-l-m/">حَليمًا</button>
    <button class="word-link" type="button" data-word="غَفورًا" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving; alongside Forbearing at the verse’s end.">غَفورًا</button>
  </p>
  <p class="english-verse">Indeed, The God holds the heavens and the earth lest they cease to be; and if they were to cease, no one after Him could hold them. Indeed, He is Forbearing, Forgiving.</p>
</section>
