<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَرسَلَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="He sent; concerning the winds.">أَرسَلَ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit" data-context="The winds; stirring the clouds in the sentence.">الرِّيٰحَ</button>
    <button class="word-link" type="button" data-word="فَتُثيرُ" data-root="TH W R" data-learn-more="/quran-terminology/en/roots/th-w-r/" data-root-meaning="Rising, stirring up, turning over, and setting in motion" data-context="They stir up; setting cloud in motion.">فَتُثيرُ</button>
    <button class="word-link" type="button" data-word="سَحابًا" data-root="S H B" data-root-meaning="Dragging, extending and cloud: from drawing something over the ground to clouds moving through the sky and people dragged in punishment" data-learn-more="/quran-terminology/en/roots/s-h-b/" data-context="Cloud; what the winds stir up.">سَحابًا</button>
    <button class="word-link" type="button" data-word="فَسُقنٰهُ" data-root="S W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-q/" data-root-meaning="Driving or leading; sūq is a market; sāq is the lower leg." data-context="Then We drove; directing the cloud to a dead land.">فَسُقنٰهُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَلَدٍ" data-root="B L D" data-learn-more="/quran-terminology/en/roots/b-l-d/" data-root-meaning="From a tract of land to a territory, settlement, and a secure place" data-context="A land; the destination of the driven cloud.">بَلَدٍ</button>
    <button class="word-link" type="button" data-word="مَيِّتٍ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="Dead; describing land without living growth.">مَيِّتٍ</button>
    <button class="word-link" type="button" data-word="فَأَحيَينا" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Then We revived; the earth’s vegetation through rain.">فَأَحيَينا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; what was revived after its death.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After; the revival following the earth’s death.">بَعدَ</button>
    <button class="word-link" type="button" data-word="مَوتِها" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="Its death; the dry, lifeless condition before revival.">مَوتِها</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="النُّشورُ" data-root="N SH R" data-learn-more="/quran-terminology/en/roots/n-sh-r/" data-root-meaning="Opening, spreading, and dispersing; in revival contexts, rising and returning to life." data-context="Resurrection; human rising after death, compared with the earth’s revival.">النُّشورُ</button>
  </p>
  <p class="english-verse">And The God is the One who sends the winds, and they stir up a cloud; then We drive it to a dead land and revive the earth with it after its death. Such is the resurrection.</p>
</section>
