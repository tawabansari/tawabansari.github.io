<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَرسَلَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">أَرسَلَ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit">الرِّيٰحَ</button>
    <button class="word-link" type="button" data-word="فَتُثيرُ" data-root="TH W R" data-learn-more="/quran-terminology/en/roots/th-w-r/" data-root-meaning="Rising, stirring up, turning over, and setting in motion">فَتُثيرُ</button>
    <button class="word-link" type="button" data-word="سَحابًا" data-root="S H B" data-root-meaning="Dragging, extending and cloud: from drawing something over the ground to clouds moving through the sky and people dragged in punishment" data-learn-more="/quran-terminology/en/roots/s-h-b/">سَحابًا</button>

    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَلَدٍ" data-root="B L D" data-learn-more="/quran-terminology/en/roots/b-l-d/" data-root-meaning="From a tract of land to a territory, settlement, and a secure place">بَلَدٍ</button>

    <button class="word-link" type="button" data-word="فَأَحيَينا" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">فَأَحيَينا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدَ</button>

    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="النُّشورُ" data-root="N SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-r/" data-root-meaning="Spreading or dispersing; nushūr denotes rising or resurrection.">النُّشورُ</button>
  </p>
  <p class="english-verse">And The God is the One who sends the winds, and they stir up a cloud; then We drive it to a dead land and revive the earth with it after its death. Such is the resurrection.</p>
</section>
