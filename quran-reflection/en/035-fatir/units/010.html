<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="العِزَّةَ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">العِزَّةَ</button>
    <button class="word-link" type="button" data-word="فَلِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">فَلِلَّهِ</button>
    <button class="word-link" type="button" data-word="العِزَّةُ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">العِزَّةُ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field">جَميعًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="يَصعَدُ" data-root="SAD AYN D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-ayn-d/" data-root-meaning="Ascending or moving onward; ṣaʿīd is the earth&#x27;s surface or soil.">يَصعَدُ</button>
    <button class="word-link" type="button" data-word="الكَلِمُ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality">الكَلِمُ</button>
    <button class="word-link" type="button" data-word="الطَّيِّبُ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant.">الطَّيِّبُ</button>
    <button class="word-link" type="button" data-word="وَالعَمَلُ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">وَالعَمَلُ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحُ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state">الصّٰلِحُ</button>
    <button class="word-link" type="button" data-word="يَرفَعُهُ" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one.">يَرفَعُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يَمكُرونَ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context.">يَمكُرونَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">السَّيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابٌ</button>
    <button class="word-link" type="button" data-word="شَديدٌ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">شَديدٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَكرُ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context.">وَمَكرُ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="يَبورُ" data-root="B W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-w-r/" data-root-meaning="Coming to ruin, becoming unproductive, or perishing.">يَبورُ</button>
  </p>
  <p class="english-verse">Whoever desires might, all might belongs to The God. To Him good words ascend, and righteous action raises them. And those who plot evil deeds will have a severe punishment, and their plotting will perish.</p>
</section>
