  <h2 class="ayah-title">Fatir 35:12</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="عَذبٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="fresh">عَذبٌ</button>
    <button class="word-link" type="button" data-word="فُراتٌ" data-root="F R T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-t/" data-root-meaning="Fresh, pleasantly drinkable water." data-context="pleasantly sweet">فُراتٌ</button>

    <button class="word-link" type="button" data-word="شَرابُهُ" data-root="SH R B" data-learn-more="/quran-terminology/en/roots/sh-r-b/" data-root-meaning="Drinking, drink, a share of water, and a place or path of access to drinking." data-context="its drink">شَرابُهُ</button>

    <button class="word-link" type="button" data-word="كُلٍّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="each">كُلٍّ</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="you eat">تَأكُلونَ</button>
    <button class="word-link" type="button" data-word="لَحمًا" data-root="L H M" data-root-meaning="Flesh or meat, the body’s fleshy tissue; laḥm is singular and luḥūm plural. Its use as food and other roles follow from context." data-learn-more="/quran-terminology/en/roots/l-h-m/" data-context="meat">لَحمًا</button>
    <button class="word-link" type="button" data-word="طَرِيًّا" data-root="TT R W" data-learn-more="/quran-terminology/en/roots/tt-r-w/" data-root-meaning="Freshness, liveliness, softness, and the preservation of a thing&#x27;s natural quality before staleness, dryness, or corruption." data-context="fresh and tender">طَرِيًّا</button>

    <button class="word-link" type="button" data-word="تَلبَسونَها" data-root="L B S" data-learn-more="/quran-terminology/en/roots/l-b-s/" data-root-meaning="Wearing, covering, layering, mixing, and making something ambiguous." data-context="you wear them">تَلبَسونَها</button>

    <button class="word-link" type="button" data-word="وَتَرَى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="and you see">وَتَرَى</button>
    <button class="word-link" type="button" data-word="الفُلكَ" data-root="F L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-l-k/" data-root-meaning="Fulk means a ship; falak is an orbit or circular course." data-context="the ships">الفُلكَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="مَواخِرَ" data-root="M KH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-kh-r/" data-root-meaning="Cleaving water in motion, especially a ship&#x27;s passage." data-context="cleaving through the water">مَواخِرَ</button>
    <button class="word-link" type="button" data-word="لِتَبتَغوا" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="so that you seek">لِتَبتَغوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="His bounty">فَضلِهِ</button>
    <button class="word-link" type="button" data-word="وَلَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="you give thanks">تَشكُرونَ</button>
  </p>
  <p class="english-verse">And the two seas are not alike: one is fresh and sweet, pleasant to drink, and the other salty and bitter. From each you eat fresh flesh and extract ornaments that you wear. And you see ships plowing through it, so that you may seek His bounty and perhaps give thanks.</p>
</section>
