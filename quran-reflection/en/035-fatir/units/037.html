<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَصطَرِخونَ" data-root="SAD R KH" data-learn-more="/quran-terminology/en/roots/sad-r-kh/" data-root-meaning="Loud crying; calling for help; answering a cry and providing aid, according to form and context." data-context="They cry out in it; raise their voices asking to be brought out of the punishment.">يَصطَرِخونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord; the cryers’ address in seeking release.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَخرِجنا" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Bring us out; asks for release from the place of punishment.">أَخرِجنا</button>
    <button class="word-link" type="button" data-word="نَعمَل" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="We may do; the action they promise after release.">نَعمَل</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Righteous; describes the deed they say they will do.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Different from; unlike what they used to do.">غَيرَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="We used to; with the following verb, expresses their former conduct.">كُنّا</button>
    <button class="word-link" type="button" data-word="نَعمَلُ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="We used to do; their former deeds.">نَعمَلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="نُعَمِّركُم" data-root="ʿ M R" data-learn-more="/quran-terminology/en/roots/ayn-m-r/" data-root-meaning="ʿAmara: the continuation of life, inhabited places, and enduring presence" data-context="We gave you life; allowed you a span of life.">نُعَمِّركُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَتَذَكَّرُ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Take heed; remember and make use of the opportunity.">يَتَذَكَّرُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="تَذَكَّرَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Took heed; describes the person who would heed the reminder.">تَذَكَّرَ</button>
    <button class="word-link" type="button" data-word="وَجاءَكُمُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="And came to you; the warner reached you.">وَجاءَكُمُ</button>
    <button class="word-link" type="button" data-word="النَّذيرُ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="The warner; the one who had come to warn you.">النَّذيرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذوقوا" data-root="DH W Q" data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting and perceiving flavor; more broadly, testing and experiencing; adhāqa means making another taste or undergo an experience." data-context="So taste; experience the painful consequence.">فَذوقوا</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="For the wrongdoers; those for whom a helper is denied.">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="نَصيرٍ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="A helper; one whose aid to the wrongdoers in this situation is denied.">نَصيرٍ</button>
  </p>
  <p class="english-verse">And they cry out in it: Our Lord, bring us out, and we will do righteousness, unlike what we used to do. Did We not give you a life long enough for whoever would take heed to take heed, and the warner came to you? So taste; the wrongdoers have no helper.</p>
</section>
