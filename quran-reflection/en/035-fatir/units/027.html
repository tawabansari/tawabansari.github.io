<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">تَرَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَخرَجنا" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">فَأَخرَجنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="ثَمَرٰتٍ" data-root="TH M R" data-learn-more="/quran-terminology/en/roots/th-m-r/" data-root-meaning="Fruit and produce, with extensions to yield and wealth">ثَمَرٰتٍ</button>
    <button class="word-link" type="button" data-word="مُختَلِفًا" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">مُختَلِفًا</button>
    <button class="word-link" type="button" data-word="أَلوٰنُها" data-root="L W N" data-learn-more="/quran-terminology/en/roots/l-w-n/" data-root-meaning="Color, visible appearance, and distinction among kinds">أَلوٰنُها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="J B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-b-l/" data-root-meaning="Jabal: a mountain or elevated mass; jibillah can concern a multitude or natural disposition.">الجِبالِ</button>
    <button class="word-link" type="button" data-word="جُدَدٌ" data-root="J D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-d-d/" data-root-meaning="Distinct branches include cutting, newness, visible streaks or paths, and jadd as greatness or majesty.">جُدَدٌ</button>
    <button class="word-link" type="button" data-word="بيضٌ" data-root="B Y DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-y-dad/" data-root-meaning="Whiteness or becoming white; bayḍ in another branch denotes eggs.">بيضٌ</button>
    <button class="word-link" type="button" data-word="وَحُمرٌ" data-root="H M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-r/" data-root-meaning="Redness or red color; in another branch, ḥimār and ḥumur mean donkey and donkeys.">وَحُمرٌ</button>
    <button class="word-link" type="button" data-word="مُختَلِفٌ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">مُختَلِفٌ</button>
    <button class="word-link" type="button" data-word="أَلوٰنُها" data-root="L W N" data-learn-more="/quran-terminology/en/roots/l-w-n/" data-root-meaning="Color, visible appearance, and distinction among kinds">أَلوٰنُها</button>
    <button class="word-link" type="button" data-word="وَغَرابيبُ" data-root="GH R B" data-learn-more="/quran-terminology/en/roots/gh-r-b/" data-root-meaning="From sunset and disappearance from view to the west, estrangement, and other branches">وَغَرابيبُ</button>
    <button class="word-link" type="button" data-word="سودٌ" data-root="S W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-d/" data-root-meaning="Blackness; in another branch, leadership or mastery.">سودٌ</button>
  </p>
  <p class="english-verse">Have you not seen that The God sent down water from the sky, and with it We brought forth fruits of differing colors? And among the mountains are streaks, white and red, of differing colors, and intensely black.</p>
</section>
