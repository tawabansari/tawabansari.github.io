<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd">الحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="فاطِرِ" data-root="F TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-tt-r/" data-root-meaning="Splitting; faṭr denotes originating; fiṭrah is an original disposition.">فاطِرِ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="جاعِلِ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جاعِلِ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="رُسُلًا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رُسُلًا</button>
    <button class="word-link" type="button" data-word="أُولى" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولى</button>
    <button class="word-link" type="button" data-word="أَجنِحَةٍ" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/">أَجنِحَةٍ</button>
    <button class="word-link" type="button" data-word="مَثنىٰ" data-root="TH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-n-y/" data-root-meaning="Doubling, repeating, or folding; ithnān and mathnā denote two or two by two.">مَثنىٰ</button>
    <button class="word-link" type="button" data-word="وَثُلٰثَ" data-root="TH L TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-l-th/" data-root-meaning="The number three and related forms, including threefold and one-third.">وَثُلٰثَ</button>
    <button class="word-link" type="button" data-word="وَرُبٰعَ" data-root="R B AYN (R B ʿ)" data-learn-more="/quran-terminology/en/roots/r-b-ayn/" data-root-meaning="Four, fourfold grouping, one-fourth, forty, and the semantic field of counting and division">وَرُبٰعَ</button>
    ۚ
    <button class="word-link" type="button" data-word="يَزيدُ" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure">يَزيدُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الخَلقِ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">الخَلقِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="قَديرٌ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">قَديرٌ</button>
  </p>
  <p class="english-verse">Praise belongs to The God, Originator of the heavens and the earth, who makes the angels messengers with wings, two, three, and four. He adds to creation whatever He wills. Indeed, The God is capable of all things.</p>
</section>
