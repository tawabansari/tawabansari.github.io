<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَتلونَ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another. Tilāwah also denotes reading or reciting speech or verses in sequence." data-context="They recite, referring to The God’s Book.">يَتلونَ</button>
    <button class="word-link" type="button" data-word="كِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Book, attributed to The God and recited.">كِتٰبَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And they have established, referring to ṣalāh.">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Ṣalāh, the bond of worship with The God that is established in the verse.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَنفَقوا" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="And they have spent or given, from the provision received.">وَأَنفَقوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="We have provided them, referring to what they spend from.">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="سِرًّا" data-root="S R R" data-learn-more="/quran-terminology/en/roots/s-r-r/" data-root-meaning="Secrets and Hidden Matters, Joy and Ease, and Places of Rest" data-context="Secretly, describing the manner of giving.">سِرًّا</button>
    <button class="word-link" type="button" data-word="وَعَلانِيَةً" data-root="ʿ L N (Ayn L N)" data-learn-more="/quran-terminology/en/roots/ayn-l-n/" data-root-meaning="Being Open and Making Manifest in Contrast to What Is Hidden" data-context="And openly, alongside giving in secret.">وَعَلانِيَةً</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="R J W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-w/" data-root-meaning="Hope or expectation; also an edge or side; postponement in some forms is also analyzed under r-j-ʾ." data-context="They hope for a trade that will not stagnate or prove fruitless.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="تِجٰرَةً" data-root="T J R" data-learn-more="/quran-terminology/en/roots/t-j-r/" data-root-meaning="Entering exchange and putting property or capital into circulation in pursuit of profit and benefit." data-context="A trade, an image of exchange for the actions mentioned and hope for their return and reward.">تِجٰرَةً</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="تَبورَ" data-root="B W R" data-root-meaning="In its principal Qur’anic branch, B W R concerns becoming ruined and losing an intended result, benefit, or desirable condition. According to context, it can denote stagnation, fruitlessness, corruption, or destruction." data-context="Stagnate or prove fruitless; with lan, a trade that will not meet that outcome." data-learn-more="/quran-terminology/en/roots/b-w-r/">تَبورَ</button>
  </p>
  <p class="english-verse">Indeed, those who recite the Book of The God, establish prayer, and spend secretly and openly from what We have provided them hope for a trade that will never perish,</p>
</section>
