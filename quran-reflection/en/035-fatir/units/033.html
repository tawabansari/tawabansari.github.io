<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَنّٰتُ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-context="Gardens; the setting of abiding and blessing." data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover; jannah: a garden covered with trees and vegetation.">جَنّٰتُ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="AYN D N" data-root-meaning="In Arabic, ع د ن concerns residence, remaining and settling in a place." data-learn-more="/quran-terminology/en/roots/ayn-d-n/" data-context="Abiding; gardens of lasting residence.">عَدنٍ</button>
    <button class="word-link" type="button" data-word="يَدخُلونَها" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="They enter them; admission to the gardens of abiding.">يَدخُلونَها</button>
    <button class="word-link" type="button" data-word="يُحَلَّونَ" data-root="H L Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-y/" data-root-meaning="Jewelry, adornment, and decorating with ornaments." data-context="They are adorned; the gardens’ inhabitants receive ornaments.">يُحَلَّونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="S W R" data-learn-more="/quran-terminology/en/roots/s-w-r/" data-context="Bracelets; the promised ornaments." data-root-meaning="A wall, enclosure, boundary, raised structure, or a form that surrounds something and distinguishes inside from outside; asāwir: bracelets or ornamental rings around the wrist.">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ذَهَبٍ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-context="Gold; the material of the bracelets mentioned." data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach; dhahab as a noun: gold, the familiar metal.">ذَهَبٍ</button>
    <button class="word-link" type="button" data-word="وَلُؤلُؤًا" data-root="L A L A" data-root-meaning="Pearls: gems known for their beauty and luster, used in the Qur’an both as adornment and a natural gift, and in similes concerning beauty." data-context="And pearls; among the ornaments of the gardens’ inhabitants." data-learn-more="/quran-terminology/en/roots/l-a-l-a/">وَلُؤلُؤًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِباسُهُم" data-root="L B S" data-learn-more="/quran-terminology/en/roots/l-b-s/" data-root-meaning="Wearing, covering, layering, mixing, and making something ambiguous." data-context="And their clothing; what they wear in those gardens.">وَلِباسُهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="حَريرٌ" data-root="H R R" data-root-meaning="Freedom, release, or exclusive dedication; in another branch, heat and scorching; ḥarīr: silk." data-context="Silk; the clothing of those admitted to the gardens of abiding." data-learn-more="/quran-terminology/en/roots/h-r-r/">حَريرٌ</button>
  </p>
  <p class="english-verse">Gardens of lasting residence which they enter, adorned therein with bracelets of gold and pearls, and their clothing therein is silk.</p>
</section>
