<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">Fatir 35:42</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَقسَموا" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="And they swore; claiming they would accept a warner.">وَأَقسَموا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="جَهدَ" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="Utmost emphasis; describing the intensity of their oath about accepting a warner." data-learn-more="/quran-terminology/en/roots/j-h2-d/">جَهدَ</button>
    <button class="word-link" type="button" data-word="أَيمٰنِهِم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Their oaths; the stated forceful oaths.">أَيمٰنِهِم</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَئِن</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Comes to them; the arrival of a warner.">جاءَهُم</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="A warner; the person whose arrival conditions the claim.">نَذيرٌ</button>
    <button class="word-link" type="button" data-word="لَيَكونُنَّ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They will certainly be; emphasizing their claimed guidance.">لَيَكونُنَّ</button>
    <button class="word-link" type="button" data-word="أَهدىٰ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Better guided; claiming greater guidance than other communities.">أَهدىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="إِحدَى" data-root="A Ḥ D" data-root-meaning="Aḥad: one, one of, and no one under negation" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-context="One; in comparison with other communities.">إِحدَى</button>
    <button class="word-link" type="button" data-word="الأُمَمِ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="Communities; the groups in the comparison.">الأُمَمِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to them; the warner’s actual arrival.">جاءَهُم</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="A warner; the messenger who reached them.">نَذيرٌ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="زادَهُم" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="Increased; their growing aversion.">زادَهُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="نُفورًا" data-root="N F R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Setting out; also aversion or fleeing away." data-context="Aversion; turning away after the warner arrived.">نُفورًا</button>
  </p>
  <p class="english-verse">And they swore by The God their strongest oaths that, if a warner came to them, they would surely be better guided than one of the communities. But when a warner came to them, it increased them only in aversion,</p>
</section>
