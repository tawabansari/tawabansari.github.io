<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Alaq 96:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="يَعلَم" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَم</button>
    <button class="word-link" type="button" data-word="بِأَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَرىٰ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">يَرىٰ</button>
  </p>
  <p class="english-verse">Does he not know that The God sees?</p>
