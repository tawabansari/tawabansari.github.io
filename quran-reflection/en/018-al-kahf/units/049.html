  <h2 class="ayah-title">Al-Kahf 18:49</h2>

    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">الكِتٰبِ</button>

    <button class="word-link" type="button" data-word="يَظلِمُ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">يَظلِمُ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="أَحَدًا" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation">أَحَدًا</button>

  <p class="english-verse">The Book will be placed, and you will see the guilty fearful of what is in it. They will say, “Woe to us! What is this book that leaves nothing small or great without counting it?” They will find what they did present, and your Lord wrongs no one.</p>
