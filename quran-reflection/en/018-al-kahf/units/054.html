<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:54</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="صَرَّفنا" data-root="SAD R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-f/" data-root-meaning="Turning or changing; taṣrīf denotes varying, directing, or presenting in different ways." data-context="We varied: presenting examples differently in the Qur’an.">صَرَّفنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذَا</button>
    <button class="word-link" type="button" data-word="القُرءانِ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text presenting varied examples for people." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانِ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="For people: the audience of the examples.">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every: encompassing the examples.">كُلِّ</button>
    <button class="word-link" type="button" data-word="مَثَلٍ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="An example: the stated illustration.">مَثَلٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Is: introducing a description of humanity.">وَكانَ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being: the subject of the description of disputing.">الإِنسٰنُ</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Most: comparing the propensity to dispute.">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="A thing: in comparing humanity with other beings." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God As the noun shayʾ, a thing or matter under discussion, distinct from the verb of willing.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="جَدَلًا" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="Disputing: the respect in which the comparison is made." data-learn-more="/quran-terminology/en/roots/j-d-l/">جَدَلًا</button>
  </p>
  <p class="english-verse">We have certainly presented every kind of example in varied ways for people in this Qur’an. The human being is, above all things, most argumentative.</p>
</section>
