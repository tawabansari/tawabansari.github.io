<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="أَوَى" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="Joining and taking a place with someone or somewhere; seeking shelter or stopping, according to context." data-context="Took refuge and lodged in the cave.">أَوَى</button>
    <button class="word-link" type="button" data-word="الفِتيَةُ" data-root="F T Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-t-y/" data-root-meaning="A youth and youthfulness; fatwā is an answer clarifying a question." data-context="The young men who took refuge in the cave.">الفِتيَةُ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="الكَهفِ" data-root="K H2 F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-h2-f/" data-root-meaning="A cave or shelter in a mountain." data-context="The cave, the place of refuge and lodging.">الكَهفِ</button>
    <button class="word-link" type="button" data-word="فَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="So they said, introducing their supplication.">فَقالوا</button>

    <button class="word-link" type="button" data-word="ءاتِنا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Grant or give us.">ءاتِنا</button>

    <button class="word-link" type="button" data-word="لَدُنكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدُنكَ</button>
    <button class="word-link" type="button" data-word="رَحمَةً" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Mercy, what they request.">رَحمَةً</button>
    <button class="word-link" type="button" data-word="وَهَيِّئ" data-root="H2 Y A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-y-a/" data-root-meaning="Form or condition; tahyiʾah means preparing or providing." data-context="And prepare or make ready.">وَهَيِّئ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَمرِنا" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Our affair or situation.">أَمرِنا</button>
    <button class="word-link" type="button" data-word="رَشَدًا" data-root="R SH D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-sh-d/" data-root-meaning="Sound direction and judgment, as opposed to error." data-context="A right and sound course.">رَشَدًا</button>
  </p>
  <p class="english-verse">When the young men took refuge in the cave and said, “Our Lord, grant us mercy from Yourself and prepare right guidance for us in our affair.”</p>
