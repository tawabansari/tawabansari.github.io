<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:81</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَرَدنا" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">فَأَرَدنا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُبدِلَهُما" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">يُبدِلَهُما</button>
    <button class="word-link" type="button" data-word="رَبُّهُما" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّهُما</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرًا</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="زَكوٰةً" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness.">زَكوٰةً</button>
    <button class="word-link" type="button" data-word="وَأَقرَبَ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness">وَأَقرَبَ</button>
    <button class="word-link" type="button" data-word="رُحمًا" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رُحمًا</button>
  </p>
  <p class="english-verse">We wanted their Lord to replace him for them with one better in purity and closer in affection.</p>
