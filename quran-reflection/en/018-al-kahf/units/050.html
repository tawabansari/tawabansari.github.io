  <p class="english-verse">When We said to the angels, “Prostrate before Adam,” they prostrated, except Iblis. He was of the jinn and departed from his Lord’s command. Will you take him and his descendants as guardians instead of Me, when they are your enemies? What an evil exchange for the wrongdoers!</p>
