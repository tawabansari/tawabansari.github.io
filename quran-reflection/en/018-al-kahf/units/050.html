    <button class="word-link" type="button" data-word="بِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity">بِئسَ</button>

    <button class="word-link" type="button" data-word="بَدَلًا" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">بَدَلًا</button>
  </p>
  <p class="english-verse">When We said to the angels, “Prostrate before Adam,” they prostrated, except Iblis. He was of the jinn and departed from his Lord’s command. Will you take him and his descendants as guardians instead of Me, when they are your enemies? What an evil exchange for the wrongdoers!</p>
