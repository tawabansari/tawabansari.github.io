<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:59</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="The settlements mentioned.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="أَهلَكنٰهُم" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="We destroyed those communities when they did wrong." data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَهلَكنٰهُم</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمّا</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="When they did wrong.">ظَلَموا</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We appointed.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="لِمَهلِكِهِم" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="For their destruction or its time, alongside an appointed term." data-learn-more="/quran-terminology/en/roots/h2-l-k/">لِمَهلِكِهِم</button>
    <button class="word-link" type="button" data-word="مَوعِدًا" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="An appointed time.">مَوعِدًا</button>
  </p>
  <p class="english-verse">Those towns—We destroyed them when they did wrong, and We appointed a time for their destruction.</p>
