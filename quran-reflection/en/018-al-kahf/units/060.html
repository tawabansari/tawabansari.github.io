<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Moses said to his young companion, stating his determination to continue the journey.">قالَ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="لِفَتىٰهُ" data-root="F T Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-t-y/" data-root-meaning="A youth and youthfulness; fatwā is an answer clarifying a question." data-context="To his young companion: the young man accompanying Moses on this journey.">لِفَتىٰهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="أَبرَحُ" data-root="B R H" data-root-meaning="Leaving or departing from a place or condition; under negation, remaining or continuing; in other branches, emergence and hardship." data-learn-more="/quran-terminology/en/roots/b-r-h/" data-context="I will not give up traveling: with negation, continuing the journey, rather than remaining motionless in one place.">أَبرَحُ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="أَبلُغَ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="I reach: Moses’ arrival at the destination specified next in the sentence.">أَبلُغَ</button>
    <button class="word-link" type="button" data-word="مَجمَعَ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="The meeting place or place of coming together; here, the meeting of the two seas.">مَجمَعَ</button>
    <button class="word-link" type="button" data-word="البَحرَينِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation" data-context="The two seas: the two bodies of water whose meeting place is given as the journey’s destination.">البَحرَينِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="أَمضِىَ" data-root="M DAD Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-dad-y/" data-root-meaning="Passing or proceeding onward." data-context="I journey on or proceed; in this sentence, over a long period of time.">أَمضِىَ</button>
    <button class="word-link" type="button" data-word="حُقُبًا" data-root="H Q B" data-root-meaning="In Qur’anic usage, a long period without the verse specifying a number of years; aḥqāb is the plural of periods and does not alone determine their final count." data-context="A long period; the verse itself specifies no fixed number of years." data-learn-more="/quran-terminology/en/roots/h-q-b/">حُقُبًا</button>
  </p>
  <p class="english-verse">When Moses said to his young companion, “I will not stop until I reach the junction of the two seas, or go on for a long time.”</p>
</section>
