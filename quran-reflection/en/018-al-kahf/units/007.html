  <h2 class="ayah-title">Al-Kahf 18:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="We made; making what is on the earth its adornment.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>

    <button class="word-link" type="button" data-word="زينَةً" data-root="Z Y N" data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; making something beautiful or making it appear attractive." data-context="An adornment for the earth: what has been placed upon it.">زينَةً</button>

  <p class="english-verse">We made what is on the earth an adornment for it, to test them as to which of them is best in deeds.</p>
