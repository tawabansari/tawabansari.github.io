  <h2 class="ayah-title">Al-Kahf 18:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">نَحنُ</button>
    <button class="word-link" type="button" data-word="نَقُصُّ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="We recount; relating the cave companions’ account, qualified separately by bi-al-ḥaqq." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">نَقُصُّ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>

    <button class="word-link" type="button" data-word="فِتيَةٌ" data-root="F T Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-t-y/" data-root-meaning="A youth and youthfulness; fatwā is an answer clarifying a question." data-context="Young people; describing the cave companions.">فِتيَةٌ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believed; their response to their Lord.">ءامَنوا</button>

    <button class="word-link" type="button" data-word="وَزِدنٰهُم" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="And We increased; augmenting their guidance.">وَزِدنٰهُم</button>

  </p>
  <p class="english-verse">We relate their account to you in truth. They were young men who believed in their Lord, and We increased them in guidance.</p>
