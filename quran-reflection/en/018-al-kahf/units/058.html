  <h2 class="ayah-title">Al-Kahf 18:58</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="الغَفورُ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">الغَفورُ</button>
    <button class="word-link" type="button" data-word="ذُو" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذُو</button>

    <button class="word-link" type="button" data-word="كَسَبوا" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility">كَسَبوا</button>

  <p class="english-verse">Your Lord is the Forgiving, the Possessor of mercy. If He took them to account for what they earned, He would hasten the punishment for them. But they have an appointed time from which they will find no refuge.</p>
