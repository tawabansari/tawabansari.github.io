<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="المالُ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="Wealth and possessions, identified alongside children as worldly life’s adornment.">المالُ</button>
    <button class="word-link" type="button" data-word="وَالبَنونَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting and founding; in ibn, banī and banūn: children and descent." data-context="And children: banūn is a plural of ibn, concerning offspring and descent, alongside wealth.">وَالبَنونَ</button>
    <button class="word-link" type="button" data-word="زينَةُ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="The adornment of worldly life: a description of wealth and children, without declaring them inherently evil.">زينَةُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life: in al-ḥayāh al-dunyā, worldly life whose adornments include wealth and children.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="The nearer, worldly life, contrasted with lasting value with the Lord.">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالبٰقِيٰتُ" data-root="B Q Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-q-y/" data-root-meaning="Remaining or continuing to exist; baqiyyah: what is left over." data-context="The lasting things: deeds whose value and outcome remain with the Lord, qualified by ṣāliḥāt.">وَالبٰقِيٰتُ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتُ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="The righteous things: the goodness and rightness of lasting deeds, beyond mere duration.">الصّٰلِحٰتُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Are better: the superiority of lasting righteous deeds with the Lord in reward.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="With your Lord: the reference for assessing righteous deeds’ reward and the hope placed in them.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ثَوابًا" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="In reward: thawāban specifies the first respect of superiority, distinct from amalan.">ثَوابًا</button>
    <button class="word-link" type="button" data-word="وَخَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="And are better: repeating the comparison, this time with respect to hope.">وَخَيرٌ</button>
    <button class="word-link" type="button" data-word="أَمَلًا" data-root="A M L" data-learn-more="/quran-terminology/en/roots/a-m-l/" data-root-meaning="Hope and expectation of attaining something desirable that has not yet occurred; looking toward the future while envisaging the possibility of attainment." data-context="As a basis for hope: lasting righteous deeds offer a better ground for hope, rather than a guarantee of every personal wish.">أَمَلًا</button>
  </p>
  <p class="english-verse">Wealth and sons are the adornment of worldly life. Lasting righteous deeds are better with your Lord in reward and better in hope.</p>
</section>
