  <h2 class="ayah-title">Al-Kahf 18:86</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="بَلَغَ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="Reached; Dhū al-Qarnayn arriving at the place of sunset.">بَلَغَ</button>
    <button class="word-link" type="button" data-word="مَغرِبَ" data-root="GH R B" data-learn-more="/quran-terminology/en/roots/gh-r-b/" data-root-meaning="From sunset and disappearance from view to the west, estrangement, and other branches" data-context="The place or direction of sunset; the destination in this part of the journey.">مَغرِبَ</button>
    <button class="word-link" type="button" data-word="الشَّمسِ" data-root="SH M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-m-s/" data-root-meaning="The sun and its light." data-context="The sun; whose setting is observed.">الشَّمسِ</button>
    <button class="word-link" type="button" data-word="وَجَدَها" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="He found it; describing what Dhū al-Qarnayn encountered in that setting.">وَجَدَها</button>
    <button class="word-link" type="button" data-word="تَغرُبُ" data-root="GH R B" data-learn-more="/quran-terminology/en/roots/gh-r-b/" data-root-meaning="From sunset and disappearance from view to the west, estrangement, and other branches" data-context="Setting; the sun disappearing from view at the horizon.">تَغرُبُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="عَينٍ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="A spring or water source; modified by muddy.">عَينٍ</button>
    <button class="word-link" type="button" data-word="حَمِئَةٍ" data-root="H M A" data-root-meaning="Dark mud and sediment in water or damp surroundings; material that can alter water’s colour, clarity, or smell." data-context="Muddy and containing dark sediment; describing the spring in the ḥamiʾah reading." data-learn-more="/quran-terminology/en/roots/h-m-a/">حَمِئَةٍ</button>
    <button class="word-link" type="button" data-word="وَوَجَدَ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="And he found; encountering people there.">وَوَجَدَ</button>
    <button class="word-link" type="button" data-word="عِندَها" data-root="AYN N D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-d/" data-root-meaning="Obstinacy or opposition; ʿinda is a grammatical word denoting proximity in place or standing." data-context="Near it; the location of the people he found.">عِندَها</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="A people; the inhabitants of the place mentioned.">قَومًا</button>
    ۗ
    <button class="word-link" type="button" data-word="قُلنا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="We said; introducing the address to Dhū al-Qarnayn.">قُلنا</button>
    <button class="word-link" type="button" data-word="يٰذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰذَا</button>
    <button class="word-link" type="button" data-word="القَرنَينِ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="The two horns or qarns; part of Dhū al-Qarnayn’s title, whose precise naming basis is not established here.">القَرنَينِ</button>
    <button class="word-link" type="button" data-word="إِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِمّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تُعَذِّبَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="You punish; one of the two courses in the address.">تُعَذِّبَ</button>
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَتَّخِذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="You adopt; concerning a good course among them.">تَتَّخِذَ</button>
    <button class="word-link" type="button" data-word="فيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِم</button>
    <button class="word-link" type="button" data-word="حُسنًا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Goodness or a good course; the other way of dealing with those people.">حُسنًا</button>
  </p>
  <p class="english-verse">until, when he reached the setting place of the sun, he found it setting in a muddy spring and found a people beside it. We said, “Dhul-Qarnayn, either punish or adopt goodness toward them.”</p>
</section>
