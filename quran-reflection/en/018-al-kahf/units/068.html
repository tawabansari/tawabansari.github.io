  <h2 class="ayah-title">Al-Kahf 18:68</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَيفَ</button>
    <button class="word-link" type="button" data-word="تَصبِرُ" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="You remain patient; the question about Moses’ patience.">تَصبِرُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>

    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>

  <p class="english-verse">How can you bear patiently with something you do not encompass in knowledge?”</p>
