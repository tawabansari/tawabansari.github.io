  <h2 class="ayah-title">Al-Kahf 18:106</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>

    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>

  <p class="english-verse">That is their recompense—Hell—because they disbelieved and took My signs and My messengers in mockery.</p>
