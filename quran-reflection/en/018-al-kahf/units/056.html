<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:56</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="نُرسِلُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">نُرسِلُ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">المُرسَلينَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مُبَشِّرينَ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">مُبَشِّرينَ</button>
    <button class="word-link" type="button" data-word="وَمُنذِرينَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">وَمُنذِرينَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيُجٰدِلُ" data-root="J D L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-d-l/" data-root-meaning="Twisting firmly or making secure; jidāl: verbal or argumentative contest.">وَيُجٰدِلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِالبٰطِلِ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth.">بِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="لِيُدحِضوا" data-root="D H DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-h-dad/" data-root-meaning="Slipping; figuratively, defeating or invalidating an argument.">لِيُدحِضوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">الحَقَّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاتَّخَذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">وَاتَّخَذوا</button>
    <button class="word-link" type="button" data-word="ءايٰتى" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتى</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أُنذِروا" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">أُنذِروا</button>
    <button class="word-link" type="button" data-word="هُزُوًا" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game">هُزُوًا</button>
  </p>
  <p class="english-verse">We send the messengers only as bearers of good news and warners. Those who disbelieve argue with falsehood to defeat the truth with it, and they take My signs and what they are warned of in mockery.</p>
</section>
