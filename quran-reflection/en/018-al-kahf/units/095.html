<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:95</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Dhū al-Qarnayn said in response to the people’s request.">قالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="مَكَّنّى" data-root="M K N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-n/" data-root-meaning="Firmness or capacity; tamkīn means establishing or empowering securely." data-context="My Lord has established and empowered me in it.">مَكَّنّى</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord, who has nurtured and empowered me.">رَبّى</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Is better: what my Lord has granted me is better than your proposed payment.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="فَأَعينونى" data-root="AYN W N (ʿ W N)" data-learn-more="/quran-terminology/en/roots/ayn-w-n/" data-root-meaning="Help, adding strength, seeking support, and reaching the middle stage" data-context="So help me to construct the barrier.">فَأَعينونى</button>
    <button class="word-link" type="button" data-word="بِقُوَّةٍ" data-root="Q W Y" data-learn-more="/quran-terminology/en/roots/q-w-y/" data-root-meaning="Force, ability, power, and firmness; the capacity to act, endure, resist, or have an effect." data-context="With strength that you provide to carry out this work.">بِقُوَّةٍ</button>
    <button class="word-link" type="button" data-word="أَجعَل" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="That I may construct and establish a barrier, as the consequence of your helping.">أَجعَل</button>
    <button class="word-link" type="button" data-word="بَينَكُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between you: in the space separating you from them.">بَينَكُم</button>
    <button class="word-link" type="button" data-word="وَبَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="And them: the other side of the space in which the barrier is built.">وَبَينَهُم</button>
    <button class="word-link" type="button" data-word="رَدمًا" data-root="R D M" data-learn-more="/quran-terminology/en/roots/r-d-m/" data-root-meaning="Closing breaches and filling openings; radm names the closing act or a barrier built to block a passage; in clothing usage, patching and repair." data-context="A constructed barrier closing the passage between you and them.">رَدمًا</button>
  </p>
  <p class="english-verse">He said, “What my Lord has established me in is better. Help me with strength, and I will make a solid barrier between you and them.</p>
</section>
