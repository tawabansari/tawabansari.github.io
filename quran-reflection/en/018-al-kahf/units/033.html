<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كِلتَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">كِلتَا</button>
    <button class="word-link" type="button" data-word="الجَنَّتَينِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The two gardens, which yield their produce.">الجَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="ءاتَت" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Yielded, concerning each garden’s produce.">ءاتَت</button>
    <button class="word-link" type="button" data-word="أُكُلَها" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Its produce, what the garden yielded.">أُكُلَها</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَم</button>
    <button class="word-link" type="button" data-word="تَظلِم" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Withheld or fell short, negated here concerning the produce.">تَظلِم</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Anything, in denying any shortfall in produce.">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَفَجَّرنا" data-root="F J R" data-learn-more="/quran-terminology/en/roots/f-j-r/" data-root-meaning="Splitting, opening a path, flow after an opening, dawn, and ethical departure from proper limits." data-context="And We caused a river to flow between the gardens.">وَفَجَّرنا</button>
    <button class="word-link" type="button" data-word="خِلٰلَهُما" data-root="KH L L" data-root-meaning="Intervals and spaces between things; penetration and passage among them; and, in human relationships, friendship and close bonds." data-context="Between the two stated gardens." data-learn-more="/quran-terminology/en/roots/kh-l-l/">خِلٰلَهُما</button>
    <button class="word-link" type="button" data-word="نَهَرًا" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="A river, caused to flow between the two gardens.">نَهَرًا</button>
  </p>
  <p class="english-verse">Both gardens yielded their produce without falling short at all, and We made a river flow through them.</p>
</section>
