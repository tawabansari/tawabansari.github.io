  <h2 class="ayah-title">Al-Kahf 18:74</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>

    <button class="word-link" type="button" data-word="نُكرًا" data-root="N K R" data-learn-more="/quran-terminology/en/roots/n-k-r/" data-root-meaning="Unfamiliarity, alienness, roughness, reprehensibility, denial, and being changed from a familiar and recognizable state.">نُكرًا</button>

  <p class="english-verse">They set out until, when they met a boy, he killed him. He said, “Have you killed a pure soul without its having killed another? You have done a terrible thing!”</p>
