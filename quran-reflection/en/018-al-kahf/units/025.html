<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَبِثوا" data-root="L B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-th/" data-root-meaning="Staying or remaining for a period or in a place." data-context="And they remained; concerning the duration of the stay in the cave.">وَلَبِثوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="كَهفِهِم" data-root="K H2 F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-h2-f/" data-root-meaning="A cave or shelter in a mountain." data-context="Their cave, the place of their stay.">كَهفِهِم</button>
    <button class="word-link" type="button" data-word="ثَلٰثَ" data-root="TH L TH" data-root-meaning="Three and its related forms: a count of three, third position, one-third and two-thirds, and distribution in threes." data-context="Three in “three hundred years,” describing the stay in the cave." data-learn-more="/quran-terminology/en/roots/th-l-th/">ثَلٰثَ</button>
    <button class="word-link" type="button" data-word="مِا۟ئَةٍ" data-root="M A Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-a-y/" data-root-meaning="One hundred and its related forms." data-context="Hundred; in the expression three hundred years.">مِا۟ئَةٍ</button>
    <button class="word-link" type="button" data-word="سِنينَ" data-root="S N W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-w/" data-root-meaning="A year or years; sanā means radiance; sanah is also analyzed under s-n-h." data-context="Years; the unit of the duration of the stay.">سِنينَ</button>
    <button class="word-link" type="button" data-word="وَازدادوا" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="And they added; nine years beyond three hundred.">وَازدادوا</button>
    <button class="word-link" type="button" data-word="تِسعًا" data-root="T S AYN" data-learn-more="/quran-terminology/en/roots/t-s-ayn/" data-root-meaning="The number nine, ninety, ninety-nine, and nineteen; a numerical root whose meaning is quantity, while each verse gives that quantity its role." data-context="Nine; the number of additional years.">تِسعًا</button>
  </p>
  <p class="english-verse">They remained in their cave for three hundred years, and added nine.</p>
</section>
