    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَرائِكِ" data-root="A R K" data-learn-more="/quran-terminology/en/roots/a-r-k/" data-root-meaning="An adorned couch or bed prepared for sitting, resting, and reclining, often with a covering or special furnishing." data-context="Adorned couches; where they recline.">الأَرائِكِ</button>

  <p class="english-verse">They will have gardens of lasting abode, with rivers flowing beneath them. There they will be adorned with bracelets of gold and wear green garments of fine silk and brocade, reclining on couches. What an excellent reward and a beautiful resting place!</p>
