<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the day when: the time of mountains moving and people being gathered.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="نُسَيِّرُ" data-root="S Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-r/" data-root-meaning="Traveling or moving along a course; sīrah denotes a way or condition." data-context="We set in motion: moving or driving the mountains.">نُسَيِّرُ</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="J B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-b-l/" data-root-meaning="Jabal: a mountain or elevated mass; jibillah can concern a multitude or natural disposition." data-context="The mountains: what is said to be set in motion.">الجِبالَ</button>
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="And you see: observing the earth in an exposed condition.">وَتَرَى</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth: what is described next by bārizatan.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="بارِزَةً" data-root="B R Z" data-root-meaning="Coming forth and becoming visible in open space or before sight and confrontation; in transitive forms, making something visible." data-learn-more="/quran-terminology/en/roots/b-r-z/" data-context="Exposed and apparent: the earth’s condition when seen; the word itself does not mean accountability or perfect flatness.">بارِزَةً</button>
    <button class="word-link" type="button" data-word="وَحَشَرنٰهُم" data-root="H SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sh-r/" data-root-meaning="Gathering and driving people or creatures together from their places." data-context="And We gathered them: bringing people together in the described scene.">وَحَشَرنٰهُم</button>
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَم</button>
    <button class="word-link" type="button" data-word="نُغادِر" data-root="GH D R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-d-r/" data-root-meaning="Leaving behind; also treachery in another usage." data-context="We left none out: no one is omitted from the gathering.">نُغادِر</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="أَحَدًا" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="Anyone: under negation, expressing that the gathering leaves no one out.">أَحَدًا</button>
  </p>
  <p class="english-verse">On the day We set the mountains in motion, you will see the earth laid bare. We will gather them and leave none of them behind.</p>
</section>
