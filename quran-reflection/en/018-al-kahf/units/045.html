<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاضرِب" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state">وَاضرِب</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="مَثَلَ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">مَثَلَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="كَماءٍ" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence">كَماءٍ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّماءِ</button>
    <button class="word-link" type="button" data-word="فَاختَلَطَ" data-root="KH L TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-l-tt/" data-root-meaning="Mixing, mingling, or sharing in an association.">فَاختَلَطَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="نَباتُ" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed.">نَباتُ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="فَأَصبَحَ" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp.">فَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="هَشيمًا" data-root="H2 SH M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-sh-m/" data-root-meaning="Crumbling vegetation or broken dry stalks.">هَشيمًا</button>
    <button class="word-link" type="button" data-word="تَذروهُ" data-root="DH R W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-r-w/" data-root-meaning="Scattering or dispersing in the wind; dhurriyyah means descendants, with disputed derivation.">تَذروهُ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحُ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit">الرِّيٰحُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="مُقتَدِرًا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">مُقتَدِرًا</button>
  </p>
  <p class="english-verse">Set forth for them the likeness of worldly life: it is like water We send down from the sky, with which the vegetation of the earth mingles, then becomes dry fragments scattered by the winds. The God has power over all things.</p>
</section>
