<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَشاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills; the will of The God.">يَشاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And remember your Lord.">وَاذكُر</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, whom you are to remember.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="نَسيتَ" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence." data-context="You forgot.">نَسيتَ</button>
    <button class="word-link" type="button" data-word="وَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And say.">وَقُل</button>
    <button class="word-link" type="button" data-word="عَسىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use." data-learn-more="/quran-terminology/en/roots/ayn-s-y/">عَسىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَهدِيَنِ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="May guide me.">يَهدِيَنِ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord, whose guidance is hoped for.">رَبّى</button>
    <button class="word-link" type="button" data-word="لِأَقرَبَ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="To something nearer in right guidance.">لِأَقرَبَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="رَشَدًا" data-root="R SH D" data-learn-more="/quran-terminology/en/roots/r-sh-d/" data-root-meaning="Finding the right course, sound judgment, and proper direction in affairs; according to context, religious guidance, competence to manage property, or sound decisions; irshād guides another to the right way." data-context="Right guidance, in asking for a nearer course toward it.">رَشَدًا</button>
  </p>
  <p class="english-verse">except, “If The God wills.” Remember your Lord when you forget, and say, “Perhaps my Lord will guide me to something nearer to right guidance than this.”</p>
</section>
