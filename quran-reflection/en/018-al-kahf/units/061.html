<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="بَلَغا" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="The two reached; Moses and his companion arrived at the junction.">بَلَغا</button>
    <button class="word-link" type="button" data-word="مَجمَعَ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="The junction or meeting place where the two expanses met.">مَجمَعَ</button>
    <button class="word-link" type="button" data-word="بَينِهِما" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between the two; relating the junction to the two expanses mentioned.">بَينِهِما</button>
    <button class="word-link" type="button" data-word="نَسِيا" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence." data-context="The two forgot; they forgot their fish at that place.">نَسِيا</button>
    <button class="word-link" type="button" data-word="حوتَهُما" data-root="H W T" data-root-meaning="Fish; in non-Qur’anic uses of this family, circling and changing course." data-context="The fish of the two of them, Moses and his companion; a singular noun with a dual pronoun." data-learn-more="/quran-terminology/en/roots/h-w-t/">حوتَهُما</button>
    <button class="word-link" type="button" data-word="فَاتَّخَذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="It took; the fish took its way into the sea.">فَاتَّخَذَ</button>
    <button class="word-link" type="button" data-word="سَبيلَهُ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Its way; the fish’s path into the sea.">سَبيلَهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation" data-context="The sea into which the fish took its way.">البَحرِ</button>
    <button class="word-link" type="button" data-word="سَرَبًا" data-root="S R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-b/" data-root-meaning="A course and moving along it; sarab is a passage; sarāb is a mirage." data-context="Like a tunnel; describing the fish’s path into the sea.">سَرَبًا</button>
  </p>
  <p class="english-verse">When they reached the junction between them, they forgot their fish, and it took its way into the sea like a tunnel.</p>
</section>
