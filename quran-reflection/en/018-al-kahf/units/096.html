<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:96</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ءاتونى" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Bring me the pieces of iron.">ءاتونى</button>
    <button class="word-link" type="button" data-word="زُبَرَ" data-root="Z B R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-b-r/" data-root-meaning="Writing and writings; zabūr is a book; zubar are large pieces, such as lumps of iron." data-context="Pieces or masses of iron used in the construction.">زُبَرَ</button>
    <button class="word-link" type="button" data-word="الحَديدِ" data-root="H D D" data-root-meaning="Boundary and limit; prevention, sharpness, and cutting." data-context="Iron, the material of the pieces used in building the barrier." data-learn-more="/quran-terminology/en/roots/h-d-d/">الحَديدِ</button>
    ۖ
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="ساوىٰ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Leveled or made equal the space between the passage’s two sides.">ساوىٰ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between, relating the two mountain sides and the structure.">بَينَ</button>
    <button class="word-link" type="button" data-word="الصَّدَفَينِ" data-root="SAD D F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-d-f/" data-root-meaning="Turning away; ṣadafayn denotes two opposing sides or slopes." data-context="The two mountain sides or sides of the passage.">الصَّدَفَينِ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said, introducing the instruction to blow during construction.">قالَ</button>
    <button class="word-link" type="button" data-word="انفُخوا" data-root="N F KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-kh/" data-root-meaning="Blowing or setting air in motion." data-context="Blow, the instruction given in the heating process.">انفُخوا</button>
    ۖ
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="جَعَلَهُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Made it or brought it to that condition, like fire.">جَعَلَهُ</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="Fire, describing the heated condition of the construction.">نارًا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said, introducing the next instruction concerning pouring molten material.">قالَ</button>
    <button class="word-link" type="button" data-word="ءاتونى" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Bring it to me, continuing the construction instructions.">ءاتونى</button>
    <button class="word-link" type="button" data-word="أُفرِغ" data-root="F R GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-gh/" data-root-meaning="Becoming empty or finishing an occupation; ifrāgh means pouring out." data-context="I pour the molten material over the structure.">أُفرِغ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="قِطرًا" data-root="Q TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-tt-r/" data-root-meaning="Dripping; qiṭr is molten copper; qaṭirān is tar-like material; aqṭār denotes regions or sides." data-context="Molten copper, the material poured over the structure.">قِطرًا</button>
  </p>
  <p class="english-verse">Bring me blocks of iron.” When he had leveled the space between the two slopes, he said, “Blow!” When he had made it fire, he said, “Bring me molten copper to pour over it.”</p>
</section>
