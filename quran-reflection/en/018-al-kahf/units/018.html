<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَحسَبُهُم" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="And you think them; the observer’s impression of the sleepers.">وَتَحسَبُهُم</button>
    <button class="word-link" type="button" data-word="أَيقاظًا" data-root="Y Q ZHA" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-q-zha/" data-root-meaning="Wakefulness or alertness." data-context="Awake; the condition the observer supposes.">أَيقاظًا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="رُقودٌ" data-root="R Q D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-q-d/" data-root-meaning="Sleeping or resting; marqad is a sleeping or resting place." data-context="Asleep; their actual condition.">رُقودٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنُقَلِّبُهُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="And We turn them; movement to right and left.">وَنُقَلِّبُهُم</button>
    <button class="word-link" type="button" data-word="ذاتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذاتَ</button>
    <button class="word-link" type="button" data-word="اليَمينِ" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Right; one direction of turning.">اليَمينِ</button>
    <button class="word-link" type="button" data-word="وَذاتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَذاتَ</button>
    <button class="word-link" type="button" data-word="الشِّمالِ" data-root="SH M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-m-l/" data-root-meaning="The left side; also encompassing or covering." data-context="Left; the other direction of turning.">الشِّمالِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَلبُهُم" data-root="K L B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-l-b/" data-root-meaning="A dog; taklīb concerns training animals to hunt." data-context="And their dog; the animal with outstretched limbs.">وَكَلبُهُم</button>
    <button class="word-link" type="button" data-word="بٰسِطٌ" data-root="B S TT" data-root-meaning="Opening, spreading, and extending; context can apply this to ample provision or breadth of knowledge and capacity." data-context="Holding outstretched; an active participle describing the dog’s two extended forelegs at the entrance." data-learn-more="/quran-terminology/en/roots/b-s-tt/">بٰسِطٌ</button>
    <button class="word-link" type="button" data-word="ذِراعَيهِ" data-root="DH R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-r-ayn/" data-root-meaning="The forearm or cubit; also measuring and capacity or endurance." data-context="Its two forelegs; the dog’s outstretched limbs.">ذِراعَيهِ</button>
    <button class="word-link" type="button" data-word="بِالوَصيدِ" data-root="W SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-sad-d/" data-root-meaning="Closing securely; waṣīd is a threshold or entrance area." data-context="At the entrance; the dog’s position.">بِالوَصيدِ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَوِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَوِ</button>
    <button class="word-link" type="button" data-word="اطَّلَعتَ" data-root="TT L AYN" data-root-meaning="In its familiar semantic core, Ṭ L ʿ concerns rising and becoming apparent. In natural uses, it describes the sun appearing and plant produce emerging. In human uses, it can concern observing or learning something previously beyond a person’s access. In some constructions, it conveys reaching a particular place." data-learn-more="/quran-terminology/en/roots/tt-l-ayn/" data-context="You looked upon them; if you saw and became aware of them.">اطَّلَعتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="لَوَلَّيتَ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="You would turn away; the observer’s hypothetical response.">لَوَلَّيتَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="فِرارًا" data-root="F R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-r/" data-root-meaning="Fleeing or escaping." data-context="In flight; the manner of leaving them.">فِرارًا</button>
    <button class="word-link" type="button" data-word="وَلَمُلِئتَ" data-root="M L A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-l-a/" data-root-meaning="Filling; malaʾ denotes leading members or notables of a community." data-context="And you would be filled; passive concerning dread.">وَلَمُلِئتَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="رُعبًا" data-root="R AYN B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-ayn-b/" data-root-meaning="Intense fear or terror." data-context="Dread; what fills the observer.">رُعبًا</button>
  </p>
  <p class="english-verse">You would think them awake, though they are asleep. We turn them to the right and the left, while their dog stretches its forelegs across the threshold. If you had looked upon them, you would have turned away in flight and been filled with fear of them.</p>
</section>
