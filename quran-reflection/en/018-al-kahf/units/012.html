<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Kahf 18:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="بَعَثنٰهُم" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task." data-context="We awakened them: bringing the Companions of the Cave out of sleep; not a direct reference here to resurrection from death.">بَعَثنٰهُم</button>
    <button class="word-link" type="button" data-word="لِنَعلَمَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="So that We may know: the stated purpose of awakening them, connected with the disclosure of the reckoning of their stay.">لِنَعلَمَ</button>
    <button class="word-link" type="button" data-word="أَىُّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَىُّ</button>
    <button class="word-link" type="button" data-word="الحِزبَينِ" data-root="H Z B" data-root-meaning="Gathering and forming a collective; people joined by a shared affiliation, position, or purpose." data-context="The two groups whose reckoning or knowledge of the stay is assessed; their precise identities are not named here." data-learn-more="/quran-terminology/en/roots/h-z-b/">الحِزبَينِ</button>
    <button class="word-link" type="button" data-word="أَحصىٰ" data-root="H SAD Y" data-root-meaning="The Qur’anic branch’s semantic core is accurate, comprehensive counting and accounting for the number, quantity, or parts of something; in relevant contexts it conveys complete recording without omission." data-context="Correctly reckoned the duration; or, under the elative analysis, was more accurate in reckoning it." data-learn-more="/quran-terminology/en/roots/h-sad-y/">أَحصىٰ</button>
    <button class="word-link" type="button" data-word="لِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِما</button>
    <button class="word-link" type="button" data-word="لَبِثوا" data-root="L B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-th/" data-root-meaning="Staying or remaining for a period or in a place." data-context="They remained or stayed: the duration of the Companions of the Cave’s stay is in question.">لَبِثوا</button>
    <button class="word-link" type="button" data-word="أَمَدًا" data-root="A M D" data-learn-more="/quran-terminology/en/roots/a-m-d/" data-root-meaning="A limit or endpoint reached by a distance or extent; temporally, a duration or interval measured with reference to a beginning, an end, or an anticipated point." data-context="The duration of their stay: the temporal extent being known or reckoned, rather than the number itself.">أَمَدًا</button>
  </p>
  <p class="english-verse">Then We raised them up to know which of the two groups had more accurately counted the time they had remained.</p>
</section>
