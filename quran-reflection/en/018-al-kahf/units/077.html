    <button class="word-link" type="button" data-word="أَجرًا" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">أَجرًا</button>
  </p>
  <p class="english-verse">They set out until, when they came to the people of a town, they asked its people for food, but they refused to host them. There they found a wall about to collapse, and he set it upright. He said, “If you wished, you could have taken payment for it.”</p>
