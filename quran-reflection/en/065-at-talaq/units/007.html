<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">At-Talaq 65:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيُنفِق" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="Let him spend: the command to provide from one’s means.">لِيُنفِق</button>
    <button class="word-link" type="button" data-word="ذو" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذو</button>
    <button class="word-link" type="button" data-word="سَعَةٍ" data-root="W S ʿ" data-learn-more="/quran-terminology/en/roots/w-s-ayn/" data-root-meaning="From spaciousness to capacity, ability and encompassing" data-context="Abundance: ample financial means.">سَعَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سَعَتِهِ" data-root="W S ʿ" data-learn-more="/quran-terminology/en/roots/w-s-ayn/" data-root-meaning="From spaciousness to capacity, ability and encompassing" data-context="His abundance: the means from which he spends.">سَعَتِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="قُدِرَ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Is restricted: provision being limited in measure.">قُدِرَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="رِزقُهُ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="His provision: the resources described as restricted.">رِزقُهُ</button>
    <button class="word-link" type="button" data-word="فَليُنفِق" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="Then let him spend: providing within what he has been given.">فَليُنفِق</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="ءاتىٰهُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Has given him: the resources bestowed upon the person.">ءاتىٰهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُكَلِّفُ" data-root="K L F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-l-f/" data-root-meaning="Assigning a task or obligation; takalluf means undertaking with strain or affectation." data-context="Charges: with la, denying a duty beyond what has been given.">يُكَلِّفُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="نَفسًا" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="A person: the individual bearing responsibility.">نَفسًا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="ءاتىٰها" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Has given that person: the gift setting the measure of responsibility.">ءاتىٰها</button>
    ۚ
    <button class="word-link" type="button" data-word="سَيَجعَلُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Will bring about: the promise of ease.">سَيَجعَلُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After: hardship preceding ease.">بَعدَ</button>
    <button class="word-link" type="button" data-word="عُسرٍ" data-root="AYN S R" data-root-meaning="Hardship and constraint that make performing an undertaking, enduring a situation, or obtaining a result difficult." data-context="Hardship: constrained means after which ease is promised." data-learn-more="/quran-terminology/en/roots/ayn-s-r/">عُسرٍ</button>
    <button class="word-link" type="button" data-word="يُسرًا" data-root="Y S R" data-learn-more="/quran-terminology/en/roots/y-s-r/" data-root-meaning="Ease, opening, availability, smoothness of action, capacity and access; and in the branch of maysir, using ease or chance to gain benefit" data-context="Ease: relief following hardship.">يُسرًا</button>
  </p>
  <p class="english-verse">Let one with ample means spend from his abundance; and let one whose provision is restricted spend from what The God has given him. The God burdens no soul beyond what He has given it. The God will bring ease after hardship.</p>
</section>
