  <h2 class="ayah-title">At-Talaq 65:7</h2>

    <button class="word-link" type="button" data-word="فَليُنفِق" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">فَليُنفِق</button>

  <p class="english-verse">Let one with ample means spend from his abundance; and let one whose provision is restricted spend from what The God has given him. The God burdens no soul beyond what He has given it. The God will bring ease after hardship.</p>
