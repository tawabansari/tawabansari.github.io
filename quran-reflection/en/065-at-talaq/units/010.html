<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">At-Talaq 65:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَعَدَّ" data-root="ʿ D D (Ayn D D)" data-learn-more="/quran-terminology/en/roots/ayn-d-d/" data-root-meaning="Counting, measure, appointed duration, and ordered preparation for a defined purpose" data-context="Has prepared; making ready the punishment mentioned.">أَعَدَّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; the severe consequence for the group described.">عَذابًا</button>
    <button class="word-link" type="button" data-word="شَديدًا" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="Severe; describing the punishment’s intensity.">شَديدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="So be mindful; calling the addressees to care and restraint.">فَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يٰأُولِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأُولِى</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="L B B" data-root-meaning="The core or pure, choice part of something; in human use, reason and the faculty of understanding." data-context="Understanding; in the address to believing people of understanding, called to mindfulness." data-learn-more="/quran-terminology/en/roots/l-b-b/">الأَلبٰبِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="You have believed; describing the people of understanding addressed.">ءامَنوا</button>
    ۚ
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Has sent down; delivering a reminder to the addressees.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="ذِكرًا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="A reminder; the message sent down to the addressees.">ذِكرًا</button>
  </p>
  <p class="english-verse">The God has prepared a severe punishment for them. So be mindful of The God, people of understanding who believe. The God has sent down to you a reminder:</p>
</section>
