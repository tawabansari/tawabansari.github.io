<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Insan 76:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَعتَدنا" data-root="AYN T D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-t-d/" data-root-meaning="Preparing or being ready and present." data-context="We have prepared; making ready chains, shackles, and blazing fire.">أَعتَدنا</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="For the disbelievers; those for whom the described punishment has been prepared.">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="سَلٰسِلَا۟" data-root="S L S L" data-root-meaning="Connection and continuous extension of components; silsilah is a chain made of joined links or components. Related lexical uses also record smoothly flowing, pleasant water." data-context="Chains; among what the verse describes as prepared for the disbelievers." data-learn-more="/quran-terminology/en/roots/s-l-s-l/">سَلٰسِلَا۟</button>
    <button class="word-link" type="button" data-word="وَأَغلٰلًا" data-root="GH L L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-l-l/" data-root-meaning="A fetter; ghill is resentment; ghulūl is misappropriation of entrusted property." data-context="And shackles; restraining devices accompanying the chains.">وَأَغلٰلًا</button>
    <button class="word-link" type="button" data-word="وَسَعيرًا" data-root="S AYN R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-ayn-r/" data-root-meaning="Kindling fire; saʿīr is blazing fire; suʿur in some contexts denotes derangement." data-context="And a blazing fire; flaming fire mentioned beside chains and shackles.">وَسَعيرًا</button>
  </p>
  <p class="english-verse">We have prepared chains, shackles, and a blazing fire for the disbelievers.</p>
</section>
