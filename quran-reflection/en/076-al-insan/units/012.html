<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Insan 76:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَزىٰهُم" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="And rewarded them; granting recompense for their patience.">وَجَزىٰهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="صَبَروا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="They were patient; the reason for the reward of a garden and silk.">صَبَروا</button>
    <button class="word-link" type="button" data-word="جَنَّةً" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-context="A garden; part of the reward for their patience." data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover; jannah: a garden covered with trees and vegetation.">جَنَّةً</button>
    <button class="word-link" type="button" data-word="وَحَريرًا" data-root="H R R" data-root-meaning="Freedom, release, or exclusive dedication; in another branch, heat and scorching; ḥarīr: silk." data-context="And silk; alongside a garden, the reward for their patience." data-learn-more="/quran-terminology/en/roots/h-r-r/">وَحَريرًا</button>
  </p>
  <p class="english-verse">and rewarded them for their patience with a garden and silk.</p>
