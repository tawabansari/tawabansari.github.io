<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Insan 76:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يوفونَ" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense">يوفونَ</button>
    <button class="word-link" type="button" data-word="بِالنَّذرِ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">بِالنَّذرِ</button>
    <button class="word-link" type="button" data-word="وَيَخافونَ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat">وَيَخافونَ</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومًا</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="شَرُّهُ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/">شَرُّهُ</button>

  </p>
  <p class="english-verse">They fulfill their vows and fear a day whose harm spreads far,</p>
