<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Insan 76:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">نَحنُ</button>
    <button class="word-link" type="button" data-word="خَلَقنٰهُم" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">خَلَقنٰهُم</button>
    <button class="word-link" type="button" data-word="وَشَدَدنا" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">وَشَدَدنا</button>
    <button class="word-link" type="button" data-word="أَسرَهُم" data-root="A S R" data-learn-more="/quran-terminology/en/roots/a-s-r/" data-root-meaning="From binding and taking into custody to captives and bodily cohesion">أَسرَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="شِئنا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شِئنا</button>
    <button class="word-link" type="button" data-word="بَدَّلنا" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">بَدَّلنا</button>
    <button class="word-link" type="button" data-word="أَمثٰلَهُم" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">أَمثٰلَهُم</button>
    <button class="word-link" type="button" data-word="تَبديلًا" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">تَبديلًا</button>
  </p>
  <p class="english-verse">We created them and strengthened their bodily frame. Whenever We will, We can replace them with others like them.</p>
