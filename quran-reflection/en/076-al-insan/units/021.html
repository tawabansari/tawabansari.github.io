<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Insan 76:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عٰلِيَهُم" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting." data-context="Upon them; the position of the garments described.">عٰلِيَهُم</button>
    <button class="word-link" type="button" data-word="ثِيابُ" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="Garments; the clothing of sundus and istabraq.">ثِيابُ</button>
    <button class="word-link" type="button" data-word="سُندُسٍ" data-context="Sundus: fine silk." data-root-note="Word study coming soon; no root has been assigned.">سُندُسٍ</button>
    <button class="word-link" type="button" data-word="خُضرٌ" data-root="KH DAD R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-dad-r/" data-root-meaning="The color green and the greening of plants or land." data-context="Green; describing the garments of sundus.">خُضرٌ</button>
    <button class="word-link" type="button" data-word="وَإِستَبرَقٌ" data-context="Istabraq: heavy brocade." data-root-note="Word study coming soon; no root has been assigned.">وَإِستَبرَقٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَحُلّوا" data-root="H L Y" data-root-meaning="Ornaments and adornment; adorning people or objects with something added to their appearance for beauty." data-context="They have been adorned; a passive perfect concerning silver bracelets." data-learn-more="/quran-terminology/en/roots/h-l-y/">وَحُلّوا</button>
    <button class="word-link" type="button" data-word="أَساوِرَ" data-root="S W R" data-learn-more="/quran-terminology/en/roots/s-w-r/" data-root-meaning="A wall, enclosure, boundary, raised structure, or a form that surrounds something and distinguishes inside from outside" data-context="Bracelets; the ornaments with which they have been adorned.">أَساوِرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فِضَّةٍ" data-root="F DAD DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-dad-dad/" data-root-meaning="Breaking apart or dispersing; fiḍḍah is silver." data-context="Silver; the material of this verse’s bracelets.">فِضَّةٍ</button>
    <button class="word-link" type="button" data-word="وَسَقىٰهُم" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="And gave them to drink; their Lord providing the drink.">وَسَقىٰهُم</button>
    <button class="word-link" type="button" data-word="رَبُّهُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord; the One giving the purifying drink.">رَبُّهُم</button>
    <button class="word-link" type="button" data-word="شَرابًا" data-root="SH R B" data-learn-more="/quran-terminology/en/roots/sh-r-b/" data-root-meaning="Drinking, drink, a share of water, and a place or path of access to drinking." data-context="A drink; what their Lord gives them.">شَرابًا</button>
    <button class="word-link" type="button" data-word="طَهورًا" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state" data-context="Pure and purifying; describing the drink.">طَهورًا</button>
  </p>
  <p class="english-verse">Upon them are green garments of fine silk and brocade. They will be adorned with silver bracelets, and their Lord will give them a pure drink.</p>
</section>
