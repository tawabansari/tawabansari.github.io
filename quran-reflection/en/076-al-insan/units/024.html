  <h2 class="ayah-title">Al-Insan 76:24</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="لِحُكمِ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">لِحُكمِ</button>

    <button class="word-link" type="button" data-word="تُطِع" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">تُطِع</button>

    <button class="word-link" type="button" data-word="كَفورًا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفورًا</button>

  <p class="english-verse">Be patient for your Lord’s judgment, and obey no sinner or ungrateful one among them.</p>
