<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Insan 76:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُرِ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And remember; a command to remember the Lord’s name.">وَاذكُرِ</button>
    <button class="word-link" type="button" data-word="اسمَ" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-context="The name; the Lord’s name that the addressee is commanded to remember." data-root="S M W / W S M" data-root-meaning="Raising into the level of recognition, and marking for identification">اسمَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; the One whose name is to be remembered.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="B K R" data-learn-more="/quran-terminology/en/roots/b-k-r/" data-root-meaning="From the beginning of the day and coming early to remaining in the first stage." data-context="Morning; one of the two times for remembering the Lord’s name.">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَأَصيلًا" data-root="A SAD L" data-learn-more="/quran-terminology/en/roots/a-sad-l/" data-root-meaning="a thing’s root or foundation, and late afternoon as a particular part of the day." data-context="And late afternoon approaching sunset; paired with morning for remembering the Lord’s name.">وَأَصيلًا</button>
  </p>
  <p class="english-verse">Remember your Lord’s name morning and evening,</p>
