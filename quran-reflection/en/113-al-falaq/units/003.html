<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Falaq 113:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="شَرِّ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/">شَرِّ</button>
    <button class="word-link" type="button" data-word="غاسِقٍ" data-root="GH S Q" data-root-meaning="in its use concerning night, ghasaq is night becoming dark and darkness arriving or spreading. Another Arabic branch uses this family for liquids flowing and pouring. Ghāsiq describes something becoming dark or, in an appropriate context, flowing; ghassāq in the Qur’an names something punitive whose precise nature remains disputed in the lexical tradition." data-learn-more="/quran-terminology/en/roots/gh-s-q/">غاسِقٍ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="وَقَبَ" data-root="W Q B" data-root-meaning="wuqūb is something entering, sinking into, or disappearing into a location. In uses concerning the sun, moon, and darkness, it can express setting, disappearing, arriving, or enveloping. Waqb also names a hollow or depression in which something rests." data-learn-more="/quran-terminology/en/roots/w-q-b/">وَقَبَ</button>
  </p>
  <p class="english-verse">and from the evil of darkness when it falls,</p>
