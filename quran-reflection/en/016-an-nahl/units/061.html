<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="يُؤاخِذُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Were He to take to task; holding people accountable for their wrongdoing.">يُؤاخِذُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People; those whose being taken to task is discussed.">النّاسَ</button>
    <button class="word-link" type="button" data-word="بِظُلمِهِم" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="For their wrongdoing; because of the wrong they have done.">بِظُلمِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَرَكَ" data-root="T R K" data-learn-more="/quran-terminology/en/roots/t-r-k/" data-root-meaning="Leaving, abandoning, letting go, leaving something behind, and changing one’s active relation to it" data-context="Would leave none; leaving no creature in the stated condition.">تَرَكَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="D B B" data-root-meaning="Moving, creeping and the moving creature: from ants and human footsteps to the range of living creatures, their provision and two different earthly creatures in the Qur’an" data-learn-more="/quran-terminology/en/roots/d-b-b/" data-context="A moving creature; a living creature moving upon the earth.">دابَّةٍ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="يُؤَخِّرُهُم" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="He grants them respite; deferring their reckoning until an appointed time.">يُؤَخِّرُهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَجَلٍ" data-root="A J L" data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period or time; where appropriate, the end of that period." data-context="A term; the endpoint of the granted respite.">أَجَلٍ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Appointed; describing the term that has been set.">مُسَمًّى</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Arrives; the appointed term coming.">جاءَ</button>
    <button class="word-link" type="button" data-word="أَجَلُهُم" data-root="A J L" data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period or time; where appropriate, the end of that period." data-context="Their term; the end of their allotted respite.">أَجَلُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَـٔخِرونَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="They cannot delay; they cannot postpone the end of their respite.">يَستَـٔخِرونَ</button>
    <button class="word-link" type="button" data-word="ساعَةً" data-root="S W AYN" data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A portion of time or an appointed time; al-sāʿah in resurrection contexts is the promised Hour. Suwāʿ is a deity’s proper name of uncertain derivation." data-context="Even a short interval; denying the possibility of shifting the appointment.">ساعَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَستَقدِمونَ" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="They cannot advance it; they cannot bring the term forward.">يَستَقدِمونَ</button>
  </p>
  <p class="english-verse">If The God were to take people to task for their wrongdoing, He would leave no living creature upon it. But He delays them until a specified term. When their term comes, they neither delay it an hour nor advance it.</p>
</section>
