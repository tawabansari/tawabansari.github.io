<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="يُؤاخِذُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">يُؤاخِذُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسَ</button>
    <button class="word-link" type="button" data-word="بِظُلمِهِم" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">بِظُلمِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَرَكَ" data-root="T R K" data-learn-more="/quran-terminology/en/roots/t-r-k/" data-root-meaning="Leaving, abandoning, letting go, leaving something behind, and changing one’s active relation to it">تَرَكَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="D B B" data-root-meaning="Moving, creeping and the moving creature: from ants and human footsteps to the range of living creatures, their provision and two different earthly creatures in the Qur’an" data-learn-more="/quran-terminology/en/roots/d-b-b/">دابَّةٍ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="يُؤَخِّرُهُم" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">يُؤَخِّرُهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَجَلٍ" data-root="A J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period and its endpoint, including a deadline or the end of life.">أَجَلٍ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">مُسَمًّى</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَ</button>
    <button class="word-link" type="button" data-word="أَجَلُهُم" data-root="A J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period and its endpoint, including a deadline or the end of life.">أَجَلُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَـٔخِرونَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">يَستَـٔخِرونَ</button>
    <button class="word-link" type="button" data-word="ساعَةً" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name.">ساعَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَستَقدِمونَ" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history">يَستَقدِمونَ</button>
  </p>
  <p class="english-verse">If The God were to take people to task for their wrongdoing, He would leave no living creature upon it. But He delays them until a specified term. When their term comes, they neither delay it an hour nor advance it.</p>
</section>
