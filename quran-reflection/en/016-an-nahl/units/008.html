<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالخَيلَ" data-root="KH Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-y-l/" data-root-meaning="Mental imagery; ikhtiyāl is conceit; khayl denotes horses.">وَالخَيلَ</button>
    <button class="word-link" type="button" data-word="وَالبِغالَ" data-root="B GH L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-gh-l/" data-root-meaning="Baghl and bighāl: a mule or mules, the offspring of a horse and donkey.">وَالبِغالَ</button>
    <button class="word-link" type="button" data-word="وَالحَميرَ" data-root="H M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-r/" data-root-meaning="Redness or red color; in another branch, ḥimār and ḥumur mean donkey and donkeys.">وَالحَميرَ</button>
    <button class="word-link" type="button" data-word="لِتَركَبوها" data-root="R K B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-k-b/" data-root-meaning="Riding, mounting, or being layered or combined.">لِتَركَبوها</button>
    <button class="word-link" type="button" data-word="وَزينَةً" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive.">وَزينَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَخلُقُ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">وَيَخلُقُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">تَعلَمونَ</button>
  </p>
  <p class="english-verse">And horses, mules, and donkeys, for you to ride and as adornment. And He creates what you do not know.</p>
</section>
