<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَنعٰمَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="And the livestock, whose creation and benefits are recalled.">وَالأَنعٰمَ</button>
    <button class="word-link" type="button" data-word="خَلَقَها" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="He created them: the creation of livestock.">خَلَقَها</button>
    ۗ
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="دِفءٌ" data-root="D F A" data-learn-more="/quran-terminology/en/roots/d-f-a/" data-root-meaning="Warmth in contrast with cold; becoming and remaining warm, and clothing or items providing and preserving warmth." data-context="Warmth, especially through warming clothes and coverings made from livestock products.">دِفءٌ</button>
    <button class="word-link" type="button" data-word="وَمَنٰفِعُ" data-root="N F ʿ" data-learn-more="/quran-terminology/en/roots/n-f-ayn/" data-root-meaning="Nafaʿa: benefiting someone and producing a favorable outcome" data-context="And various benefits, alongside the warmth named among livestock provisions.">وَمَنٰفِعُ</button>
    <button class="word-link" type="button" data-word="وَمِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنها</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="You eat: use of livestock for food, mentioned separately.">تَأكُلونَ</button>
  </p>
  <p class="english-verse">And the livestock—He created them for you; in them are warmth and benefits, and from them you eat.</p>
