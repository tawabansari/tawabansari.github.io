<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:81</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Made; providing shade for you.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="He created; the things from which shade is provided.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="ظِلٰلًا" data-root="Ẓ L L (Zha L L)" data-learn-more="/quran-terminology/en/roots/zha-l-l/" data-root-meaning="Shade, a covering that blocks direct exposure, casting shade, and in the verb ظَلَّ, continuing or remaining in a state." data-context="Shade; shelter from direct sunlight provided through creation.">ظِلٰلًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And made; providing shelters.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="The mountains, where natural shelters are found." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجِبالِ</button>
    <button class="word-link" type="button" data-word="أَكنٰنًا" data-root="K N N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-n/" data-root-meaning="Covering or sheltering securely." data-context="Shelters; covered, protected places in the mountains.">أَكنٰنًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And made; providing protective clothing.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="سَرٰبيلَ" data-root="S R B L" data-root-meaning="A body garment, shirt, or clothing covering the body; in military usage, armor and protective dress." data-context="Garments that protect against heat." data-learn-more="/quran-terminology/en/roots/s-r-b-l/">سَرٰبيلَ</button>
    <button class="word-link" type="button" data-word="تَقيكُمُ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="They protect you; the garments’ protection against heat.">تَقيكُمُ</button>
    <button class="word-link" type="button" data-word="الحَرَّ" data-root="H R R" data-root-meaning="Freedom, release, or exclusive dedication; in another branch, heat and scorching; ḥarīr: silk." data-context="Heat, from whose harm the garments protect you." data-learn-more="/quran-terminology/en/roots/h-r-r/">الحَرَّ</button>
    <button class="word-link" type="button" data-word="وَسَرٰبيلَ" data-root="S R B L" data-root-meaning="A body garment, shirt, or clothing covering the body; in military usage, armor and protective dress." data-context="And garments; protective clothing against the harm of fighting." data-learn-more="/quran-terminology/en/roots/s-r-b-l/">وَسَرٰبيلَ</button>
    <button class="word-link" type="button" data-word="تَقيكُم" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="They protect you; the protective function of clothing in battle.">تَقيكُم</button>
    <button class="word-link" type="button" data-word="بَأسَكُم" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="The violence of your fighting; the harm and blows of battle.">بَأسَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يُتِمُّ" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete." data-context="He completes; bringing the favor to fullness.">يُتِمُّ</button>
    <button class="word-link" type="button" data-word="نِعمَتَهُ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="His favor; the beneficial provisions made for you.">نِعمَتَهُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُسلِمونَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="You may submit; responding with acceptance and willing obedience.">تُسلِمونَ</button>
  </p>
  <p class="english-verse">The God made shade for you from what He created, shelters for you in the mountains, garments that protect you from heat, and garments that protect you in your fighting. Thus He completes His favor upon you so that you may submit.</p>
</section>
