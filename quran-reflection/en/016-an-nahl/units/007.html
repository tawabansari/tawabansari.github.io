<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَحمِلُ" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="And they carry: livestock transport the loads." data-learn-more="/quran-terminology/en/roots/h-m-l/">وَتَحمِلُ</button>
    <button class="word-link" type="button" data-word="أَثقالَكُم" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="Your loads: portable effects and baggage for travel." data-learn-more="/quran-terminology/en/roots/th-q-l/">أَثقالَكُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَلَدٍ" data-root="B L D" data-learn-more="/quran-terminology/en/roots/b-l-d/" data-root-meaning="From a tract of land to a territory, settlement, and a secure place" data-context="A land: the destination of the journey and loads.">بَلَدٍ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="تَكونوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You would not be: concerning reaching the destination without hardship.">تَكونوا</button>
    <button class="word-link" type="button" data-word="بٰلِغيهِ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="Reaching it: arriving at the destination.">بٰلِغيهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِشِقِّ" data-root="SH Q Q" data-learn-more="/quran-terminology/en/roots/sh-q-q/" data-root-meaning="Splitting, breach, side, hardship, distance, and oppositional rupture" data-context="With hardship: the strenuous effort of travel.">بِشِقِّ</button>
    <button class="word-link" type="button" data-word="الأَنفُسِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Selves: the people enduring the journey’s hardship.">الأَنفُسِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, who sustains and orders your affairs.">رَبَّكُم</button>
    <button class="word-link" type="button" data-word="لَرَءوفٌ" data-root="R A F" data-learn-more="/quran-terminology/en/roots/r-a-f/" data-root-meaning="Compassion and raʾūf: tenderness, kindness and consideration for another, from human feeling to descriptions of The God and the Prophet in the Qur’an" data-context="Tenderly caring: describing the Lord’s solicitude.">لَرَءوفٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful: describing the Lord’s mercy.">رَحيمٌ</button>
  </p>
  <p class="english-verse">They carry your loads to a land you could not reach except with great exertion. Surely your Lord is Kind, Merciful.</p>
</section>
