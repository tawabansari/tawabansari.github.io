<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:72</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Appointed or provided; He provided spouses from among yourselves for you.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَنفُسِكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Yourselves; from your own human kind, describing the spouses.">أَنفُسِكُم</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Spouses, joined with you in marriage.">أَزوٰجًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And He appointed; He provided sons and ḥafadah in connection with your spouses.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَزوٰجِكُم" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Your spouses; min azwājikum supplies the family connection of sons and ḥafadah.">أَزوٰجِكُم</button>
    <button class="word-link" type="button" data-word="بَنينَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="Sons, the offspring term occurring before ḥafadah.">بَنينَ</button>
    <button class="word-link" type="button" data-word="وَحَفَدَةً" data-root="H F D" data-root-meaning="Speed and agility in performing work and, in human relationships, service and assistance." data-context="Helpers, the plural of ḥāfid, in a context of spouses and family. Children, grandchildren, and sons-in-law are transmitted referents; interpretations differ over its full scope." data-learn-more="/quran-terminology/en/roots/h-f-d/">وَحَفَدَةً</button>
    <button class="word-link" type="button" data-word="وَرَزَقَكُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="And He provided for you, supplying good things for your life.">وَرَزَقَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الطَّيِّبٰتِ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant." data-context="Good, wholesome things, from which you are provided in this verse.">الطَّيِّبٰتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَبِالبٰطِلِ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="Do they then believe in falsehood; what lacks a sound basis, within the reproachful question.">أَفَبِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="They believe; the verse questions their belief and trust in falsehood.">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="وَبِنِعمَتِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="And in the blessing; divine gifts and benefits mentioned in contrast with belief in falsehood.">وَبِنِعمَتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="يَكفُرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="They deny or are ungrateful; in this context, they reject The God’s blessing and fail to acknowledge it gratefully.">يَكفُرونَ</button>
  </p>
  <p class="english-verse">The God made for you spouses from among yourselves, and from your spouses made sons and grandchildren for you, and provided you with good things. Do they then believe in falsehood and disbelieve in the favor of The God?</p>
</section>
