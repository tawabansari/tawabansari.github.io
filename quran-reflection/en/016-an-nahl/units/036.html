<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:36</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="بَعَثنا" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task." data-context="We raised; sending a messenger in every community.">بَعَثنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; the scope of raising messengers among communities.">كُلِّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="Community; the people among whom a messenger was raised.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="رَسولًا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Messenger; one sent with the call to worship and avoid ṭāghūt.">رَسولًا</button>
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنِ</button>
    <button class="word-link" type="button" data-word="اعبُدُوا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worship; the command to serve The God.">اعبُدُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَاجتَنِبُوا" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="And avoid; a command to keep away from serving and following ṭāghūt." data-learn-more="/quran-terminology/en/roots/j-n-b/">وَاجتَنِبُوا</button>
    <button class="word-link" type="button" data-word="الطّٰغوتَ" data-root="Ṭ GH Y" data-learn-more="/quran-terminology/en/roots/tt-gh-y/" data-root-meaning="From transgression to Taghut: passing beyond the limit, breaking the boundary, and a false reference sitting in the place of truth" data-context="Ṭāghūt; a transgressive object of wrongful allegiance or worship, commanded to be avoided.">الطّٰغوتَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="هَدَى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guided; the guidance received by some among them.">هَدَى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="حَقَّت" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Became established; misguidance taking effect upon others.">حَقَّت</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="الضَّلٰلَةُ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Misguidance; the condition of those contrasted with the guided.">الضَّلٰلَةُ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَسيروا" data-root="S Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-r/" data-root-meaning="Traveling or moving along a course; sīrah denotes a way or condition." data-context="So travel; the command to journey and observe through the earth.">فَسيروا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; the setting for travel and observing earlier peoples’ outcomes.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="فَانظُروا" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="So observe; considering the outcome of those who denied.">فَانظُروا</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; describing the outcome of earlier people.">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass" data-context="Outcome; the end reached by those who denied.">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="المُكَذِّبينَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Those who denied; people who treated the message as false.">المُكَذِّبينَ</button>
  </p>
  <p class="english-verse">We certainly raised a messenger in every community: “Worship The God and avoid tyranny.” Among them were those whom The God guided and those upon whom error became established. So travel through the earth and see how the deniers ended.</p>
</section>
