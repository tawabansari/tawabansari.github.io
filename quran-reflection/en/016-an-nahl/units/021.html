<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَموٰتٌ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">أَموٰتٌ</button>
    <button class="word-link" type="button" data-word="غَيرُ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state">غَيرُ</button>
    <button class="word-link" type="button" data-word="أَحياءٍ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">أَحياءٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality">يَشعُرونَ</button>
    <button class="word-link" type="button" data-word="أَيّانَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَيّانَ</button>
    <button class="word-link" type="button" data-word="يُبعَثونَ" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task.">يُبعَثونَ</button>
  </p>
  <p class="english-verse">They are dead, not living, and they do not perceive when they will be raised.</p>
</section>
