<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:125</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ادعُ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Invite to your Lord’s way.">ادعُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The Lord’s way, the destination of invitation.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, whose way is the subject of invitation.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="بِالحِكمَةِ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="With wisdom; the judicious manner of invitation.">بِالحِكمَةِ</button>
    <button class="word-link" type="button" data-word="وَالمَوعِظَةِ" data-root="W AYN ZH (W ʿ Ẓ)" data-learn-more="/quran-terminology/en/roots/w-ayn-zha/" data-root-meaning="Admonishing, counseling, warning, and reminding of consequences in order to make one attentive and reform conduct." data-context="And with counsel; good reminder and admonition.">وَالمَوعِظَةِ</button>
    <button class="word-link" type="button" data-word="الحَسَنَةِ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Good; describing the counsel.">الحَسَنَةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَجٰدِلهُم" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="Dispute with them in the manner that is better." data-learn-more="/quran-terminology/en/roots/j-d-l/">وَجٰدِلهُم</button>
    <button class="word-link" type="button" data-word="بِالَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِالَّتى</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Better; describing the manner of disputation.">أَحسَنُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, who knows the misguided and guided.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing best; concerning whoever strays from His way.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِمَن</button>
    <button class="word-link" type="button" data-word="ضَلَّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Has strayed from the Lord’s way.">ضَلَّ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِهِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="His way, from which they have strayed.">سَبيلِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing best; concerning the guided.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِالمُهتَدينَ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="The guided, who have accepted the way.">بِالمُهتَدينَ</button>
  </p>
  <p class="english-verse">Call to the path of your Lord with wisdom and good admonition, and argue with them in the best manner. Surely your Lord knows best who has strayed from His path, and He knows best those who are guided.</p>
</section>
