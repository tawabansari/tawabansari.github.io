<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="قَصدُ" data-root="Q SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-sad-d/" data-root-meaning="Purposeful direction; also moderation or a middle course." data-context="Straightness and correctness; the course contrasted with a deviating way.">قَصدُ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; the course discussed in terms of guidance and deviation.">السَّبيلِ</button>
    <button class="word-link" type="button" data-word="وَمِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنها</button>
    <button class="word-link" type="button" data-word="جائِرٌ" data-root="J W R" data-root-meaning="Neighborhood and adjacency; granting refuge and protection; jawr concerns departure from a right course or justice." data-context="Deviating; describing a way departing from the correct course." data-learn-more="/quran-terminology/en/roots/j-w-r/">جائِرٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Willed; the will stated in the condition.">شاءَ</button>
    <button class="word-link" type="button" data-word="لَهَدىٰكُم" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Would certainly have guided you; the consequence of the stated condition.">لَهَدىٰكُم</button>
    <button class="word-link" type="button" data-word="أَجمَعينَ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="All; the scope of guidance in the conditional sentence.">أَجمَعينَ</button>
  </p>
  <p class="english-verse">Upon The God is the direction of the way, and some ways are deviating. Had He willed, He would have guided you all.</p>
</section>
