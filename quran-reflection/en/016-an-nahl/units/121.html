<section class="ayah-block" id="ayah-121" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:121</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="شاكِرًا" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="Grateful; describing Abraham’s response to divine favors.">شاكِرًا</button>
    <button class="word-link" type="button" data-word="لِأَنعُمِهِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="For His favors; the gifts and benefits for which Abraham was grateful.">لِأَنعُمِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="اجتَبىٰهُ" data-root="J B Y" data-root-meaning="gathering and bringing something together; in ijtibāʾ, choosing and setting someone or something apart." data-context="He chose him; Abraham’s selection, mentioned alongside gratitude and guidance." data-learn-more="/quran-terminology/en/roots/j-b-y/">اجتَبىٰهُ</button>
    <button class="word-link" type="button" data-word="وَهَدىٰهُ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="And guided him; directed Abraham to a straight path.">وَهَدىٰهُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/" data-context="A path; the way of Abraham’s guidance.">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Straight and upright; describing the path to which Abraham was guided.">مُستَقيمٍ</button>
  </p>
  <p class="english-verse">Grateful for His favors. He chose him and guided him to a straight path.</p>
</section>
