<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَادخُلوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="So enter: the command to enter the gates of Hell.">فَادخُلوا</button>
    <button class="word-link" type="button" data-word="أَبوٰبَ" data-root="B W B" data-learn-more="/quran-terminology/en/roots/b-w-b/" data-root-meaning="Door, gate, entrance, and threshold of passage between outside and inside." data-context="Gates: the gates of Hell.">أَبوٰبَ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="خٰلِدينَ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place" data-context="Abiding there: describing their stay in Hell.">خٰلِدينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity; biʾsa: a fixed verb of condemnation, “how evil”." data-context="How evil, then: condemnation of the arrogant people’s abode.">فَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="مَثوَى" data-root="TH W Y" data-root-meaning="Staying and residing" data-context="The abode of the arrogant." data-learn-more="/quran-terminology/en/roots/th-w-y/">مَثوَى</button>
    <button class="word-link" type="button" data-word="المُتَكَبِّرينَ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="The arrogant: those whose abode the verse condemns.">المُتَكَبِّرينَ</button>
  </p>
  <p class="english-verse">So enter the gates of Hell, remaining there. Wretched indeed is the abode of the arrogant.</p>
</section>
