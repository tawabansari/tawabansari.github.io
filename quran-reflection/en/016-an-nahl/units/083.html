<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:83</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعرِفونَ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity.">يَعرِفونَ</button>
    <button class="word-link" type="button" data-word="نِعمَتَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">نِعمَتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُنكِرونَها" data-root="N K R" data-learn-more="/quran-terminology/en/roots/n-k-r/" data-root-meaning="Unfamiliarity, alienness, roughness, reprehensibility, denial, and being changed from a familiar and recognizable state.">يُنكِرونَها</button>
    <button class="word-link" type="button" data-word="وَأَكثَرُهُمُ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">وَأَكثَرُهُمُ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">الكٰفِرونَ</button>
  </p>
  <p class="english-verse">They recognize the favor of The God, then deny it, and most of them are disbelievers.</p>
</section>
