<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:112</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَضَرَبَ" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="And set forth a comparison; introducing the town’s image">وَضَرَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="A comparison; the town’s example illustrating the message">مَثَلًا</button>
    <button class="word-link" type="button" data-word="قَريَةً" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="A town; the community whose blessings and ingratitude are described">قَريَةً</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; describing the town’s former condition">كانَت</button>
    <button class="word-link" type="button" data-word="ءامِنَةً" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Secure; describing the town’s condition">ءامِنَةً</button>
    <button class="word-link" type="button" data-word="مُطمَئِنَّةً" data-root="TT M A N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-m-a-n/" data-root-meaning="Becoming calm or reassured after disturbance; also indexed under the shorter analysis ṭ-m-n." data-context="At ease and tranquil; describing the town">مُطمَئِنَّةً</button>
    <button class="word-link" type="button" data-word="يَأتيها" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Came to it; concerning the town’s provision">يَأتيها</button>
    <button class="word-link" type="button" data-word="رِزقُها" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="Its provision; what reached the town">رِزقُها</button>
    <button class="word-link" type="button" data-word="رَغَدًا" data-root="R GH D" data-learn-more="/quran-terminology/en/roots/r-gh-d/" data-root-meaning="Ease, spaciousness, comfort, and freedom from constriction in provision and benefit" data-context="Abundantly and plentifully; describing the provision">رَغَدًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; within every place">كُلِّ</button>
    <button class="word-link" type="button" data-word="مَكانٍ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Place; a source from which provision came">مَكانٍ</button>
    <button class="word-link" type="button" data-word="فَكَفَرَت" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Then was ungrateful for the blessings">فَكَفَرَت</button>
    <button class="word-link" type="button" data-word="بِأَنعُمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="For the blessings; the object of ingratitude">بِأَنعُمِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَأَذٰقَهَا" data-root="DH W Q" data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting and perceiving flavor; more broadly, testing and experiencing; adhāqa means making another taste or undergo an experience." data-context="Then made it taste; the experience of hunger and fear">فَأَذٰقَهَا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لِباسَ" data-root="L B S" data-learn-more="/quran-terminology/en/roots/l-b-s/" data-root-meaning="Wearing, covering, layering, mixing, and making something ambiguous." data-context="A covering; the image of hunger and fear enveloping the community">لِباسَ</button>
    <button class="word-link" type="button" data-word="الجوعِ" data-root="J W ʿ" data-learn-more="/quran-terminology/en/roots/j-w-ayn/" data-root-meaning="Hunger and the need for food: from bodily distress and famine to life’s testing, food security, and hunger that even food does not relieve" data-context="Hunger; part of the described consequence">الجوعِ</button>
    <button class="word-link" type="button" data-word="وَالخَوفِ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="And fear; part of the enveloping condition">وَالخَوفِ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were; within the expression of past ongoing conduct">كانوا</button>
    <button class="word-link" type="button" data-word="يَصنَعونَ" data-root="SAD N AYN" data-learn-more="/quran-terminology/en/roots/sad-n-ayn/" data-root-meaning="Making, crafting, and doing work that produces a result or effect; in other uses, nurturing, preparing, and performing various deeds." data-context="Were doing; the town’s conduct in the context of ingratitude">يَصنَعونَ</button>
  </p>
  <p class="english-verse">The God sets forth a likeness of a town that was secure and at ease, its provision coming abundantly from every place. But it was ungrateful for the favors of The God, so The God made it taste the covering of hunger and fear because of what they used to do.</p>
</section>
