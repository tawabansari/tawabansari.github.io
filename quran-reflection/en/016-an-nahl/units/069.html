<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:69</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="TH M R" data-learn-more="/quran-terminology/en/roots/th-m-r/" data-root-meaning="Fruit and produce, with extensions to yield and wealth">الثَّمَرٰتِ</button>
    <button class="word-link" type="button" data-word="فَاسلُكى" data-root="S L K" data-root-note="Root study coming soon.">فَاسلُكى</button>
    <button class="word-link" type="button" data-word="سُبُلَ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سُبُلَ</button>
    <button class="word-link" type="button" data-word="رَبِّكِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكِ</button>
    <button class="word-link" type="button" data-word="ذُلُلًا" data-root="DH L L" data-learn-more="/quran-terminology/en/roots/dh-l-l/" data-root-meaning="Being tamed, made accessible, humbled, or lowered from honor.">ذُلُلًا</button>

    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">يَخرُجُ</button>

    <button class="word-link" type="button" data-word="بُطونِها" data-root="B TT N" data-root-note="Root study coming soon.">بُطونِها</button>
    <button class="word-link" type="button" data-word="شَرابٌ" data-root="SH R B" data-learn-more="/quran-terminology/en/roots/sh-r-b/" data-root-meaning="Drinking, drink, a share of water, and a place or path of access to drinking.">شَرابٌ</button>

    <button class="word-link" type="button" data-word="شِفاءٌ" data-root="SH F Y" data-root-note="Root study coming soon.">شِفاءٌ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">لِلنّاسِ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">لَـٔايَةً</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="F K R" data-root-note="Root study coming soon.">يَتَفَكَّرونَ</button>
  </p>
  <p class="english-verse">“Then eat from all the fruits and follow your Lord’s paths, made easy.” From their bellies comes a drink of varying colors in which there is healing for people. Surely in that is a sign for people who reflect.</p>
</section>
