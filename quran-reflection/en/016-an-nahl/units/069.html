<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:69</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="كُلى" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Eat; addressed to the bee.">كُلى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every kind, expressing the range of fruits involved.">كُلِّ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="TH M R" data-learn-more="/quran-terminology/en/roots/th-m-r/" data-root-meaning="Fruit and produce, with extensions to yield and wealth" data-context="The fruits and plant produce used by the bee.">الثَّمَرٰتِ</button>
    <button class="word-link" type="button" data-word="فَاسلُكى" data-root="S L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-l-k/" data-root-meaning="Following a path or inserting something into a course or place." data-context="Then follow and traverse your Lord’s paths.">فَاسلُكى</button>
    <button class="word-link" type="button" data-word="سُبُلَ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Your Lord’s paths, available to be followed.">سُبُلَ</button>
    <button class="word-link" type="button" data-word="رَبِّكِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, addressed to the bee in describing His paths.">رَبِّكِ</button>
    <button class="word-link" type="button" data-word="ذُلُلًا" data-root="DH L L" data-learn-more="/quran-terminology/en/roots/dh-l-l/" data-root-meaning="Being tamed, made accessible, humbled, or lowered from honor." data-context="Made easy or submissive, describing the paths or the manner of following them.">ذُلُلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Emerges; describing the drink coming from within the bees.">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بُطونِها" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="The interior of the bees’ bodies, from which the described drink emerges." data-learn-more="/quran-terminology/en/roots/b-tt-n/">بُطونِها</button>
    <button class="word-link" type="button" data-word="شَرابٌ" data-root="SH R B" data-learn-more="/quran-terminology/en/roots/sh-r-b/" data-root-meaning="Drinking, drink, a share of water, and a place or path of access to drinking." data-context="A drink that emerges from within the bees.">شَرابٌ</button>
    <button class="word-link" type="button" data-word="مُختَلِفٌ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Varied, describing the drink’s differing colors.">مُختَلِفٌ</button>
    <button class="word-link" type="button" data-word="أَلوٰنُهُ" data-root="L W N" data-learn-more="/quran-terminology/en/roots/l-w-n/" data-root-meaning="Color, visible appearance, and distinction among kinds" data-context="The colors of that drink.">أَلوٰنُهُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="شِفاءٌ" data-root="SH F Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-f-y/" data-root-meaning="Healing or restoring health." data-context="Healing for people, describing the drink.">شِفاءٌ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="For people, the recipients of the described healing.">لِلنّاسِ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Indeed a sign in this phenomenon for those who reflect.">لَـٔايَةً</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond." data-context="For people who reflect.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="F K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-k-r/" data-root-meaning="Thinking or reflection in pursuit of understanding." data-context="Reflect upon the sign being described.">يَتَفَكَّرونَ</button>
  </p>
  <p class="english-verse">“Then eat from all the fruits and follow your Lord’s paths, made easy.” From their bellies comes a drink of varying colors in which there is healing for people. Surely in that is a sign for people who reflect.</p>
</section>
