<section class="ayah-block" id="ayah-108" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:108</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="طَبَعَ" data-root="TT B AYN" data-learn-more="/quran-terminology/en/roots/tt-b-ayn/" data-root-meaning="Sealing, imprinting, and fixing a lasting mark upon the channels of reception after a settled human direction.">طَبَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="وَسَمعِهِم" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">وَسَمعِهِم</button>
    <button class="word-link" type="button" data-word="وَأَبصٰرِهِم" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">وَأَبصٰرِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الغٰفِلونَ" data-root="GH F L" data-learn-more="/quran-terminology/en/roots/gh-f-l/" data-root-meaning="Something remaining outside, or being left outside, the field of attention, watchfulness, and follow-up">الغٰفِلونَ</button>
  </p>
  <p class="english-verse">They are those whose hearts, hearing, and sight The God has sealed. They are the heedless.</p>
