<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:49</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَلِلَّهِ</button>
    <button class="word-link" type="button" data-word="يَسجُدُ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank">يَسجُدُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="D B B" data-root-meaning="Moving, creeping and the moving creature: from ants and human footsteps to the range of living creatures, their provision and two different earthly creatures in the Qur’an" data-learn-more="/quran-terminology/en/roots/d-b-b/">دابَّةٍ</button>
    <button class="word-link" type="button" data-word="وَالمَلٰئِكَةُ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">وَالمَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَكبِرونَ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">يَستَكبِرونَ</button>
  </p>
  <p class="english-verse">To The God prostrates whatever living creature is in the heavens and on earth, and the angels, and they are not arrogant.</p>
</section>
