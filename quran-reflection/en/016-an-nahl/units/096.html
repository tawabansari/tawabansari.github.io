  <h2 class="ayah-title">An-Nahl 16:96</h2>

    <button class="word-link" type="button" data-word="يَنفَدُ" data-root="N F D" data-root-note="Root study coming soon.">يَنفَدُ</button>

  <p class="english-verse">What is with you runs out, and what is with The God remains. We will surely reward those who endured patiently according to the best of what they used to do.</p>
