<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:96</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عِندَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَكُم</button>
    <button class="word-link" type="button" data-word="يَنفَدُ" data-root="N F D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-d/" data-root-meaning="Running out or being exhausted." data-context="Comes to an end, of what people possess being exhausted.">يَنفَدُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="باقٍ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="Remains, what is with The God contrasted with people’s exhaustible resources." data-learn-more="/quran-terminology/en/roots/b-q-y/">باقٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَلَنَجزِيَنَّ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="And We will certainly recompense, an emphatic promise to the steadfast.">وَلَنَجزِيَنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="صَبَروا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="Were steadfast, those who persisted in right conduct.">صَبَروا</button>
    <button class="word-link" type="button" data-word="أَجرَهُم" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action" data-context="Their reward, the recompense of the steadfast.">أَجرَهُم</button>
    <button class="word-link" type="button" data-word="بِأَحسَنِ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="According to the best, the stated standard for rewarding their conduct.">بِأَحسَنِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to, marking their past conduct with the following verb.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They were doing, the actions being rewarded.">يَعمَلونَ</button>
  </p>
  <p class="english-verse">What is with you runs out, and what is with The God remains. We will surely reward those who endured patiently according to the best of what they used to do.</p>
</section>
