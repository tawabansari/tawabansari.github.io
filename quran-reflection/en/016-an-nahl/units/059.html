<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:59</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَتَوٰرىٰ" data-root="W R Y" data-learn-more="/quran-terminology/en/roots/w-r-y/" data-root-meaning="Covering and concealment; and, in another branch, the emergence and production of fire" data-context="He hides from the people, withdrawing from their sight.">يَتَوٰرىٰ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="The people whom he avoids facing.">القَومِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سوءِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="The perceived badness of the news in his judgment, not the Qur’an’s judgment of a daughter.">سوءِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="بُشِّرَ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="He was given news, in context of a daughter’s birth.">بُشِّرَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَيُمسِكُهُ" data-root="M S K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-k/" data-root-meaning="Grasping, retaining, or holding firmly." data-context="Should he keep the child? The question concerns retaining her.">أَيُمسِكُهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="هونٍ" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status" data-context="In humiliation; how the man views keeping the daughter. Interpretations relate the humiliation to the father or the child.">هونٍ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="يَدُسُّهُ" data-root="D S S" data-learn-more="/quran-terminology/en/roots/d-s-s/" data-root-meaning="Inserting something beneath or among a covering so that it remains concealed." data-context="Hide it; concealing the child in earth within criticism of treatment of daughters.">يَدُسُّهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="التُّرابِ" data-root="T R B" data-learn-more="/quran-terminology/en/roots/t-r-b/" data-root-meaning="Dust, nearness to dust, severe poverty, equal age or stage, and the special anatomical branch of tara&#x27;ib." data-context="Earth, the location specified by fī for concealing the child.">التُّرابِ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="ساءَ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="How bad it is; condemning their judgment.">ساءَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَحكُمونَ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="They judge; their condemned evaluation of daughters.">يَحكُمونَ</button>
  </p>
  <p class="english-verse">He hides from the people because of the bad news he has been given. Will he keep it in humiliation or bury it in the dust? How evil is their judgment!</p>
</section>
