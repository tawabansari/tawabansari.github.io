<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:51</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said: introducing the divine instruction.">وَقالَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَتَّخِذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Do not take: prohibiting the adoption of two deities.">تَتَّخِذوا</button>
    <button class="word-link" type="button" data-word="إِلٰهَينِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Two deities: the objects of the prohibition.">إِلٰهَينِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="TH N Y" data-root-meaning="twofoldness, turning back, and repetition" data-context="Two: the deities whose adoption is prohibited." data-learn-more="/quran-terminology/en/roots/th-n-y/">اثنَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="إِلٰهٌ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="A deity, the object of worship.">إِلٰهٌ</button>
    <button class="word-link" type="button" data-word="وٰحِدٌ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="One: excluding a plurality of deities.">وٰحِدٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِيّٰىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِيّٰىَ</button>
    <button class="word-link" type="button" data-word="فَارهَبونِ" data-root="R H B" data-learn-more="/quran-terminology/en/roots/r-h2-b/" data-root-meaning="Awe, wary reverence, vigilance, and inward contraction before greatness and consequence." data-context="Then fear Me: directing reverent fear toward Me.">فَارهَبونِ</button>
  </p>
  <p class="english-verse">The God said, “Do not take two gods. He is only One God, so fear Me alone.”</p>
</section>
