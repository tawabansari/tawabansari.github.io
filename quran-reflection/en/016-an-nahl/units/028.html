<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="تَتَوَفّىٰهُمُ" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense">تَتَوَفّىٰهُمُ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="ظالِمى" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظالِمى</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/">أَنفُسِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَلقَوُا" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter">فَأَلقَوُا</button>
    <button class="word-link" type="button" data-word="السَّلَمَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender">السَّلَمَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنّا</button>
    <button class="word-link" type="button" data-word="نَعمَلُ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">نَعمَلُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">سوءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَلىٰ</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">تَعمَلونَ</button>
  </p>
  <p class="english-verse">Those whom the angels take while they are wronging themselves will offer surrender: “We were doing no evil.” Yes indeed, The God knows what you used to do.</p>
</section>
