<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:31</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَنّٰتُ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">جَنّٰتُ</button>
    <button class="word-link" type="button" data-word="عَدنٍ" data-root="AYN D N" data-root-meaning="In Arabic, ع د ن concerns residence, remaining and settling in a place." data-learn-more="/quran-terminology/en/roots/ayn-d-n/">عَدنٍ</button>
    <button class="word-link" type="button" data-word="يَدخُلونَها" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it.">يَدخُلونَها</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="J R Y" data-learn-more="/quran-terminology/en/roots/j-r-y/" data-root-meaning="Flowing, running, continuous movement in a channel, and moving along an appointed course">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="T Ḥ T" data-learn-more="/quran-terminology/en/roots/t-h-t/" data-root-meaning="Under, beneath, lower position, hidden layer, and foundational or relational placement">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling">الأَنهٰرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءونَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَجزِى" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response">يَجزِى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">المُتَّقينَ</button>
  </p>
  <p class="english-verse">Gardens of lasting residence which they enter, beneath which rivers flow. They have in them whatever they wish. Thus The God rewards the mindful.</p>
</section>
