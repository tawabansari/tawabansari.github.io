<section class="ayah-block" id="ayah-115" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:115</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="حَرَّمَ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="has forbidden">حَرَّمَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُمُ</button>
    <button class="word-link" type="button" data-word="المَيتَةَ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="carrion">المَيتَةَ</button>
    <button class="word-link" type="button" data-word="وَالدَّمَ" data-root="D M W" data-root-meaning="Blood, the vital fluid of human and animal bodies. Dam is singular and dimāʾ its plural; bloodshed, dietary rulings and other implications follow from construction and context. The third radical has been analysed as either D M W or D M Y." data-learn-more="/quran-terminology/en/roots/d-m-w/" data-context="and blood">وَالدَّمَ</button>
    <button class="word-link" type="button" data-word="وَلَحمَ" data-root="L H M" data-context="and the flesh" data-root-meaning="Flesh or meat, the body’s fleshy tissue; laḥm is singular and luḥūm plural. Its use as food and other roles follow from context." data-learn-more="/quran-terminology/en/roots/l-h-m/">وَلَحمَ</button>
    <button class="word-link" type="button" data-word="الخِنزيرِ" data-root="KH N Z R" data-context="of swine" data-root-meaning="Pig or swine; khinzīr is the animal’s name and khanāzīr its plural. Its historical derivation is disputed; it does not itself mean decay or disease." data-learn-more="/quran-terminology/en/roots/kh-n-z-r/">الخِنزيرِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أُهِلَّ" data-root="H2 L L" data-context="a name has been invoked" data-root-meaning="Raising a voice and making an utterance; ihlāl in ritual usage is a declaration or invocation." data-learn-more="/quran-terminology/en/roots/h2-l-l/">أُهِلَّ</button>
    <button class="word-link" type="button" data-word="لِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="for other than">لِغَيرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَنِ</button>
    <button class="word-link" type="button" data-word="اضطُرَّ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="is compelled">اضطُرَّ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="without being">غَيرَ</button>
    <button class="word-link" type="button" data-word="باغٍ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="seeking transgression">باغٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="عادٍ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="exceeding the limit">عادٍ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="forgiving">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="merciful">رَحيمٌ</button>
  </p>
  <p class="english-verse">He has only forbidden you carrion, blood, the flesh of swine, and what has been dedicated to other than The God. But whoever is compelled, neither seeking it nor exceeding the limit—The God is Forgiving, Merciful.</p>
</section>
