<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَحمِلوا" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy." data-context="So that they bear: carrying their own burdens and the consequence of misleading others.">لِيَحمِلوا</button>
    <button class="word-link" type="button" data-word="أَوزارَهُم" data-root="W Z R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-z-r/" data-root-meaning="A heavy burden or liability for sin; wazar is refuge; wazīr is a helper." data-context="Their burdens: responsibility for their own wrongdoing.">أَوزارَهُم</button>
    <button class="word-link" type="button" data-word="كامِلَةً" data-root="K M L" data-root-meaning="Attaining the prescribed or necessary wholeness of something, or bringing it to that measure." data-context="In full: bearing the whole of their own burdens." data-learn-more="/quran-terminology/en/roots/k-m-l/">كامِلَةً</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day: the time of bearing the burdens at resurrection.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Resurrection: the rising for account when responsibility becomes manifest.">القِيٰمَةِ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="أَوزارِ" data-root="W Z R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-z-r/" data-root-meaning="A heavy burden or liability for sin; wazar is refuge; wazīr is a helper." data-context="Burdens: the responsibilities of those they mislead.">أَوزارِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُضِلّونَهُم" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="They mislead them: the conduct giving rise to additional responsibility.">يُضِلّونَهُم</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without: in bi-ghayri ʿilm, the absence of knowledge.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge: what is absent in misleading or being misled, depending on how the phrase is attached.">عِلمٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="ساءَ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="How evil: condemning the burden borne.">ساءَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَزِرونَ" data-root="W Z R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-z-r/" data-root-meaning="A heavy burden or liability for sin; wazar is refuge; wazīr is a helper." data-context="They bear: carrying the burden of wrongdoing and responsibility.">يَزِرونَ</button>
  </p>
  <p class="english-verse">So that they may carry their burdens in full on the Day of Resurrection, and some of the burdens of those whom they lead astray without knowledge. How evil is what they bear!</p>
</section>
