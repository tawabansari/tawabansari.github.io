  <h2 class="ayah-title">An-Nahl 16:124</h2>
  <p class="arabic-text">

  <p class="english-verse">The Sabbath was imposed only upon those who differed about it. Your Lord will surely judge between them on the Day of Resurrection concerning what they differed about.</p>
