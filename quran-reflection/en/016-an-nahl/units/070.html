<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nahl 16:70</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَلَقَكُم" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Created and brought you into being.">خَلَقَكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَتَوَفّىٰكُم" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense" data-context="Then takes you in death.">يَتَوَفّىٰكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنكُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يُرَدُّ" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="Is returned: a passive verb concerning reaching a diminished condition of later life.">يُرَدُّ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَرذَلِ" data-root="R DH L" data-learn-more="/quran-terminology/en/roots/r-dh-l/" data-root-meaning="Inferiority in rank or quality; in Noah’s opponents’ speech, social contempt toward his followers; ardhal al-ʿumur: life’s most diminished condition in ability, not the person’s moral worth." data-context="The most diminished stage of life in ability and knowledge, not in the person’s moral worth.">أَرذَلِ</button>
    <button class="word-link" type="button" data-word="العُمُرِ" data-root="ʿ M R" data-learn-more="/quran-terminology/en/roots/ayn-m-r/" data-root-meaning="ʿAmara: the continuation of life, inhabited places, and enduring presence" data-context="Life or lifespan: a stage of life in ardhali al-ʿumur.">العُمُرِ</button>
    <button class="word-link" type="button" data-word="لِكَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِكَى</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Know or recognize: the full phrase describes severe loss of that capacity.">يَعلَمَ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After: the temporal sequence of losing knowledge previously possessed.">بَعدَ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge and understanding previously possessed.">عِلمٍ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God; also shayʾ: a thing or matter, plural ashyāʾ." data-context="Anything: the object of knowing in the description of lost knowledge.">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing: an attribute of The God at the end of the verse.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="قَديرٌ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Powerful: an attribute of The God, whose power encompasses human creation and change.">قَديرٌ</button>
  </p>
  <p class="english-verse">The God created you, then takes you. Among you is one who is returned to the most feeble age, so that after knowledge he knows nothing. Surely The God is Knowing, Powerful.</p>
</section>
