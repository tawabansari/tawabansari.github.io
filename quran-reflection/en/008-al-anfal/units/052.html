<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:52</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَدَأبِ" data-root="D A B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-a-b/" data-root-meaning="Continuity in effort or habit; daʾb is an established pattern.">كَدَأبِ</button>
    <button class="word-link" type="button" data-word="ءالِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome.">ءالِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَأَخَذَهُمُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">فَأَخَذَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِذُنوبِهِم" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share.">بِذُنوبِهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قَوِىٌّ" data-root="Q W Y" data-learn-more="/quran-terminology/en/roots/q-w-y/" data-root-meaning="Force, ability, power, and firmness; the capacity to act, endure, resist, or have an effect.">قَوِىٌّ</button>
    <button class="word-link" type="button" data-word="شَديدُ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">شَديدُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">العِقابِ</button>
  </p>
  <p class="english-verse">Like the way of Pharaoh’s people and those before them. They disbelieved in the signs of The God, so The God seized them for their sins. The God is Strong, severe in punishment.</p>
</section>
