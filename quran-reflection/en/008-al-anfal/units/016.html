<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُوَلِّهِم" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">يُوَلِّهِم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="دُبُرَهُ" data-root="D B R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back or end; turning away; planning or reflecting with attention to outcomes.">دُبُرَهُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مُتَحَرِّفًا" data-root="Ḥ R F (H R F)" data-learn-more="/quran-terminology/en/roots/h-r-f/" data-root-meaning="Edge and boundary; standing on a side or turning away from the first direction and position">مُتَحَرِّفًا</button>
    <button class="word-link" type="button" data-word="لِقِتالٍ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">لِقِتالٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="مُتَحَيِّزًا" data-root="H W Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-w-z/" data-root-meaning="Gathering or occupying a space; taḥayyuz means joining a group or taking a position.">مُتَحَيِّزًا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="فِئَةٍ" data-root="F A Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-a-y/" data-root-meaning="Fiʾah means a group or company; dictionaries differ on its derivation.">فِئَةٍ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَد</button>
    <button class="word-link" type="button" data-word="باءَ" data-root="B W ʾ" data-learn-more="/quran-terminology/en/roots/b-w-a/" data-root-meaning="From returning and settling to providing a place and incurring consequences">باءَ</button>
    <button class="word-link" type="button" data-word="بِغَضَبٍ" data-root="GH Ḍ B" data-learn-more="/quran-terminology/en/roots/gh-dad-b/" data-root-meaning="Intense displeasure and a response to what is unacceptable">بِغَضَبٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَمَأوىٰهُ" data-root="A W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="Taking shelter or finding lodging; īwāʾ: sheltering; maʾwā: a refuge or dwelling.">وَمَأوىٰهُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="Ṣ Y R" data-learn-more="/quran-terminology/en/roots/sad-y-r/" data-root-meaning="Reaching an end: maṣīr as the outcome to which affairs lead">المَصيرُ</button>
  </p>
  <p class="english-verse">Whoever turns his back on them that day, unless maneuvering for battle or joining a group, has incurred anger from The God. His refuge is Hell, an evil destination.</p>
</section>
