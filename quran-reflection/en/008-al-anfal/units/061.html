  <h2 class="ayah-title">Al-Anfal 8:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="جَنَحوا" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/">جَنَحوا</button>

    <button class="word-link" type="button" data-word="لَها" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَها</button>

    <button class="word-link" type="button" data-word="العَليمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">العَليمُ</button>

  <p class="english-verse">If they incline to peace, incline to it and rely on The God. He is the Hearing, the Knowing.</p>
