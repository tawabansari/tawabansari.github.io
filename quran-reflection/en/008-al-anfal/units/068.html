<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:68</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="سَبَقَ" data-root="S B Q" data-learn-more="/quran-terminology/en/roots/s-b-q/" data-root-meaning="Preceding, getting ahead and outstripping: from racing and temporal priority to taking the lead in good deeds and the impossibility of outstripping The God’s will">سَبَقَ</button>
    <button class="word-link" type="button" data-word="لَمَسَّكُم" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy">لَمَسَّكُم</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيما</button>
    <button class="word-link" type="button" data-word="أَخَذتُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">أَخَذتُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمٌ</button>
  </p>
  <p class="english-verse">Had a decree from The God not preceded, a great punishment would have touched you for what you took.</p>
</section>
