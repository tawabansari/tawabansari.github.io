<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="يَمكُرُ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context." data-context="Plots and schemes, describing the opponents.">يَمكُرُ</button>
    <button class="word-link" type="button" data-word="بِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved.">كَفَروا</button>
    <button class="word-link" type="button" data-word="لِيُثبِتوكَ" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="To hold you captive and prevent movement, the aim of the opponents’ plot." data-learn-more="/quran-terminology/en/roots/th-b-t/">لِيُثبِتوكَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يَقتُلوكَ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="Kill you.">يَقتُلوكَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يُخرِجوكَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Expel you.">يُخرِجوكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَمكُرونَ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context." data-context="And they plot.">وَيَمكُرونَ</button>
    <button class="word-link" type="button" data-word="وَيَمكُرُ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context." data-context="And plans, countering the opponents’ scheme.">وَيَمكُرُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="The best and superior.">خَيرُ</button>
    <button class="word-link" type="button" data-word="المٰكِرينَ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context." data-context="Those planning and devising strategies.">المٰكِرينَ</button>
  </p>
  <p class="english-verse">When those who disbelieved schemed against you to restrain you, kill you, or expel you. They plan, and The God plans; The God is the best of planners.</p>
</section>
