<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:39</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقٰتِلوهُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="And fight them, the command in the context of ending persecution or turmoil.">وَقٰتِلوهُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Be, in the denial that persecution should remain.">تَكونَ</button>
    <button class="word-link" type="button" data-word="فِتنَةٌ" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction" data-context="Persecution or turmoil, the condition to be ended.">فِتنَةٌ</button>
    <button class="word-link" type="button" data-word="وَيَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And be, introducing the stated condition of religion.">وَيَكونَ</button>
    <button class="word-link" type="button" data-word="الدّينُ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God" data-context="Religion, whose complete orientation to The God is stated.">الدّينُ</button>
    <button class="word-link" type="button" data-word="كُلُّهُ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="All of it, emphasizing the entirety of religion.">كُلُّهُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنِ</button>
    <button class="word-link" type="button" data-word="انتَهَوا" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="Desisted, in the context of conflict and ending persecution." data-learn-more="/quran-terminology/en/roots/n-h2-y/">انتَهَوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Do, the conduct observed after desisting.">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Seeing, The God’s awareness of their conduct.">بَصيرٌ</button>
  </p>
  <p class="english-verse">Fight them until there is no trial and religion is entirely for The God. If they desist, The God sees what they do.</p>
</section>
