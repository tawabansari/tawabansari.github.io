<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">تَوَلَّوا</button>
    <button class="word-link" type="button" data-word="فَاعلَموا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">فَاعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مَولىٰكُم" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">مَولىٰكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="نِعمَ" data-root="N AYN M (N ʿ M)" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-learn-more="/quran-terminology/en/roots/n-ayn-m/">نِعمَ</button>
    <button class="word-link" type="button" data-word="المَولىٰ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">المَولىٰ</button>
    <button class="word-link" type="button" data-word="وَنِعمَ" data-root="N AYN M (N ʿ M)" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-learn-more="/quran-terminology/en/roots/n-ayn-m/">وَنِعمَ</button>
    <button class="word-link" type="button" data-word="النَّصيرُ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing">النَّصيرُ</button>
  </p>
  <p class="english-verse">If they turn away, know that The God is your protector. An excellent protector and an excellent helper.</p>
</section>
