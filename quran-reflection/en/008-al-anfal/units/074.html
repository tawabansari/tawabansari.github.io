<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:74</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believed or came to faith.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَهاجَروا" data-root="H2 J R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-j-r/" data-root-meaning="Separating or leaving; hijrah is migration from a place." data-context="And migrated, leaving their former land.">وَهاجَروا</button>
    <button class="word-link" type="button" data-word="وَجٰهَدوا" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="And strove or exerted themselves." data-learn-more="/quran-terminology/en/roots/j-h2-d/">وَجٰهَدوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way, in the way of The God.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءاوَوا" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="Receiving and lodging another, or providing shelter and a place for them." data-context="They sheltered, paired with helping in the sentence.">ءاوَوا</button>
    <button class="word-link" type="button" data-word="وَنَصَروا" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="And helped and supported.">وَنَصَروا</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers, those who have faith.">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="حَقًّا" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Truly and in reality.">حَقًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="مَغفِرَةٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiveness and pardon for wrongdoing.">مَغفِرَةٌ</button>
    <button class="word-link" type="button" data-word="وَرِزقٌ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="And provision, a granted sustenance.">وَرِزقٌ</button>
    <button class="word-link" type="button" data-word="كَريمٌ" data-root="K R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-m/" data-root-meaning="Nobility, honor, or generosity." data-context="Generous and honorable, describing the provision.">كَريمٌ</button>
  </p>
  <p class="english-verse">Those who believe, migrate, and strive in the way of The God, and those who shelter and help them, are truly the believers. They have forgiveness and a generous provision.</p>
</section>
