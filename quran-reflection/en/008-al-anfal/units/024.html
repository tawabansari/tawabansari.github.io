<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="استَجيبوا" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/">استَجيبوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="وَلِلرَّسولِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَلِلرَّسولِ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="دَعاكُم" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">دَعاكُم</button>
    <button class="word-link" type="button" data-word="لِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِما</button>
    <button class="word-link" type="button" data-word="يُحييكُم" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">يُحييكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاعلَموا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">وَاعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَحولُ" data-root="H W L" data-learn-more="/quran-terminology/en/roots/h-w-l/" data-root-meaning="Aroundness, surrounding relation, turning, change of state, transfer, and becoming a barrier between things">يَحولُ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَ</button>
    <button class="word-link" type="button" data-word="المَرءِ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action.">المَرءِ</button>
    <button class="word-link" type="button" data-word="وَقَلبِهِ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">وَقَلبِهِ</button>
    <button class="word-link" type="button" data-word="وَأَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُحشَرونَ" data-root="H SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sh-r/" data-root-meaning="Gathering and driving people or creatures together from their places.">تُحشَرونَ</button>
  </p>
  <p class="english-verse">You who believe, respond to The God and the Messenger when he calls you to what gives you life. Know that The God comes between a person and his heart, and that to Him you will be gathered.</p>
</section>
