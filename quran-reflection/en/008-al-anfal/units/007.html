<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="يَعِدُكُمُ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="Promised you; concerning one of the two groups.">يَعِدُكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="إِحدَى" data-root="A Ḥ D" data-root-meaning="Aḥad: one, one of, and no one under negation" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-context="One of the two groups.">إِحدَى</button>
    <button class="word-link" type="button" data-word="الطّائِفَتَينِ" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="The two groups, one of which was promised.">الطّائِفَتَينِ</button>
    <button class="word-link" type="button" data-word="أَنَّها" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّها</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَتَوَدّونَ" data-root="W D D" data-learn-more="/quran-terminology/en/roots/w-d-d/" data-root-meaning="Wadda: affection, wanting, and wishing something to happen" data-context="You wished; concerning the group without armed strength.">وَتَوَدّونَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without; describing the group lacking armed strength.">غَيرَ</button>
    <button class="word-link" type="button" data-word="ذاتِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذاتِ</button>
    <button class="word-link" type="button" data-word="الشَّوكَةِ" data-root="SH W K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-w-k/" data-root-meaning="A thorn; figuratively, weapons or military strength." data-context="Armed strength; describing one of the two groups.">الشَّوكَةِ</button>
    <button class="word-link" type="button" data-word="تَكونُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Should be; concerning that group becoming theirs.">تَكونُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَيُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Wills; concerning the divine will to establish truth.">وَيُريدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُحِقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Establish or vindicate; concerning truth.">يُحِقَّ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="The truth established through divine words.">الحَقَّ</button>
    <button class="word-link" type="button" data-word="بِكَلِمٰتِهِ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="Through His words; establishing truth.">بِكَلِمٰتِهِ</button>
    <button class="word-link" type="button" data-word="وَيَقطَعَ" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="And cut off; the rejecters’ remainder in this confrontation.">وَيَقطَعَ</button>
    <button class="word-link" type="button" data-word="دابِرَ" data-root="D B R" data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back and latter part; turning away and passing; tadbīr, governing affairs; tadabbur, careful reflection on discourse." data-context="The rejecters’ last remainder in the confrontation described.">دابِرَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="The rejecters in the confrontation described.">الكٰفِرينَ</button>
  </p>
  <p class="english-verse">When The God promised you that one of the two groups would be yours, you wished the one without armed strength to be yours. The God wished to establish the truth by His words and cut off the last of the disbelievers.</p>
</section>
