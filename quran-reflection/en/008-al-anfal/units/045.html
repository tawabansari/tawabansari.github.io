<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="لَقيتُم" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="You encounter.">لَقيتُم</button>
    <button class="word-link" type="button" data-word="فِئَةً" data-root="F A Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-a-y/" data-root-meaning="Fiʾah means a group or company; dictionaries differ on its derivation." data-context="A group in confrontation.">فِئَةً</button>
    <button class="word-link" type="button" data-word="فَاثبُتوا" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="So remain firm in confrontation." data-learn-more="/quran-terminology/en/roots/th-b-t/">فَاثبُتوا</button>
    <button class="word-link" type="button" data-word="وَاذكُرُوا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And remember and keep in awareness.">وَاذكُرُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Abundantly and often.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُفلِحونَ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success" data-context="You prosper and succeed.">تُفلِحونَ</button>
  </p>
  <p class="english-verse">You who believe, when you encounter a group, stand firm and remember The God often, so that you may succeed.</p>
</section>
