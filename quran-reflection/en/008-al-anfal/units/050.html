  <h2 class="ayah-title">Al-Anfal 8:50</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>

  <p class="english-verse">If you could see when the angels take those who disbelieve in death, striking their faces and their backs: “Taste the punishment of burning.”</p>
