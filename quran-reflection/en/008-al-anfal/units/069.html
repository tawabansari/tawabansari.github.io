<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:69</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Then eat">فَكُلوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="غَنِمتُم" data-root="GH N M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-m/" data-root-meaning="Obtaining gains or spoils; ghanam denotes sheep and goats." data-context="You have gained as spoils">غَنِمتُم</button>
    <button class="word-link" type="button" data-word="حَلٰلًا" data-root="H L L" data-root-meaning="Opening and undoing a binding; permissibility and removal of prohibition; alighting and settling." data-context="Lawful, qualifying consumption of the spoils." data-learn-more="/quran-terminology/en/roots/h-l-l/">حَلٰلًا</button>
    <button class="word-link" type="button" data-word="طَيِّبًا" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant." data-context="Wholesome, describing the provision">طَيِّبًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="And be mindful">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving, describing The God">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful, describing The God">رَحيمٌ</button>
  </p>
  <p class="english-verse">Eat of what you have gained as spoils, lawful and good, and be mindful of The God. The God is Forgiving, Merciful.</p>
</section>
