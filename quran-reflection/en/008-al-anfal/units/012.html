<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="يوحى" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="Revealed: the Lord communicating to the angels in this scene.">يوحى</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, the one revealing to the angels.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="The angels, receiving the revelation and the address at the verse’s opening.">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="أَنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّى</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="فَثَبِّتُوا" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="So make firm: a command to strengthen the believers and their steadfastness." data-learn-more="/quran-terminology/en/roots/th-b-t/">فَثَبِّتُوا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believed: those whom the command to strengthen concerns.">ءامَنوا</button>
    ۚ
    <button class="word-link" type="button" data-word="سَأُلقى" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter Ilqa also denotes casting, throwing, or bringing something into a field of encounter." data-context="I shall cast: placing terror in the opposing group’s hearts in this confrontation.">سَأُلقى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Hearts, the inward seat of fear in this expression.">قُلوبِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَرُوا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved, describing the opposing group in this battle context.">كَفَرُوا</button>
    <button class="word-link" type="button" data-word="الرُّعبَ" data-root="R AYN B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-ayn-b/" data-root-meaning="Intense fear or terror." data-context="Terror: the intense fear described as being cast into hearts.">الرُّعبَ</button>
    <button class="word-link" type="button" data-word="فَاضرِبوا" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="So strike: a command in this verse’s context of armed confrontation.">فَاضرِبوا</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above, relating the place of striking to the necks.">فَوقَ</button>
    <button class="word-link" type="button" data-word="الأَعناقِ" data-root="AYN N Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-q/" data-root-meaning="The neck; sometimes representing persons or their posture." data-context="The necks, relative to which the place of striking is described.">الأَعناقِ</button>
    <button class="word-link" type="button" data-word="وَاضرِبوا" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="And strike: the subsequent command concerning banān in the same battle context.">وَاضرِبوا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="All, expressing the comprehensiveness of banān in the phrase.">كُلَّ</button>
    <button class="word-link" type="button" data-word="بَنانٍ" data-root="B N N" data-root-meaning="Banān denotes fingers and toes, particularly their end portions. In some extended uses it can also include bodily extremities." data-context="Digits and fingertips, in “all banān” within the battle context. Some early explanations extend the expression to extremities or joints." data-learn-more="/quran-terminology/en/roots/b-n-n/">بَنانٍ</button>
  </p>
  <p class="english-verse">When your Lord revealed to the angels, “I am with you, so strengthen those who believe. I will cast terror into the hearts of those who disbelieve. Strike above the necks and strike every fingertip of theirs.”</p>
</section>
