<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed; the people addressed by the prohibition of betrayal.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَخونُوا" data-root="KH W N" data-root-meaning="Diminution and taking away; in human conduct, violating trust, an entrusted responsibility, or fidelity, and infringing a right that should be respected." data-context="Do not betray; do not violate fidelity to God and the Messenger." data-learn-more="/quran-terminology/en/roots/kh-w-n/">تَخونُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَالرَّسولَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And the Messenger; the one whose trust must likewise not be betrayed.">وَالرَّسولَ</button>
    <button class="word-link" type="button" data-word="وَتَخونوا" data-root="KH W N" data-root-meaning="Diminution and taking away; in human conduct, violating trust, an entrusted responsibility, or fidelity, and infringing a right that should be respected." data-context="Or betray your trusts; do not violate entrusted confidence and responsibility." data-learn-more="/quran-terminology/en/roots/kh-w-n/">وَتَخونوا</button>
    <button class="word-link" type="button" data-word="أَمٰنٰتِكُم" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Your trusts; the deposits and responsibilities you are obliged to honor.">أَمٰنٰتِكُم</button>
    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="You know; the addressees’ awareness when warned against betrayal.">تَعلَمونَ</button>
  </p>
  <p class="english-verse">You who believe, do not betray The God and the Messenger or betray your trusts while you know.</p>
</section>
