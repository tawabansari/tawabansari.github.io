    <button class="word-link" type="button" data-word="لِيَصُدّوا" data-root="SAD D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-d-d/" data-root-meaning="Turning away or preventing another.">لِيَصُدّوا</button>

  <p class="english-verse">Those who disbelieve spend their wealth to bar others from the way of The God. They will spend it, then it will become a regret for them, then they will be overcome. Those who disbelieve will be gathered into Hell.</p>
