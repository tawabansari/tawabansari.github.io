<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُجٰدِلونَكَ" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="They dispute with you over truth after it has become clear." data-learn-more="/quran-terminology/en/roots/j-d-l/">يُجٰدِلونَكَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Truth; the subject of disputation after becoming clear.">الحَقِّ</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After; concerning truth becoming clear.">بَعدَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَبَيَّنَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Has become clear; concerning truth.">تَبَيَّنَ</button>
    <button class="word-link" type="button" data-word="كَأَنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّما</button>
    <button class="word-link" type="button" data-word="يُساقونَ" data-root="S W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-q/" data-root-meaning="Driving or leading; sūq is a market; sāq is the lower leg." data-context="They are driven; in the comparison with being driven toward death.">يُساقونَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="المَوتِ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="Death; the destination in the comparison.">المَوتِ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَنظُرونَ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="They look on, seeing themselves being driven.">يَنظُرونَ</button>
  </p>
  <p class="english-verse">They argue with you about the truth after it has become clear, as though they were being driven toward death while looking on.</p>
