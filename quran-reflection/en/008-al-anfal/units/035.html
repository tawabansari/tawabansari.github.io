<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was, in the statement denying worth to their worship.">كانَ</button>
    <button class="word-link" type="button" data-word="صَلاتُهُم" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Their prayer and worship beside the House.">صَلاتُهُم</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="The recognised House of worship." data-learn-more="/quran-terminology/en/roots/b-y-t/">البَيتِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مُكاءً" data-root="M K W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-w/" data-root-meaning="Whistling or a whistling sound." data-context="Whistling.">مُكاءً</button>
    <button class="word-link" type="button" data-word="وَتَصدِيَةً" data-root="SAD D Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-d-y/" data-root-meaning="Taṣdiyah means clapping; taṣaddī means turning toward or attending to." data-context="And clapping.">وَتَصدِيَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="فَذوقُوا" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="So taste and experience the consequence.">فَذوقُوا</button>
    <button class="word-link" type="button" data-word="العَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment and suffering.">العَذابَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You were, referring to their conduct.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="You rejected and disbelieved.">تَكفُرونَ</button>
  </p>
  <p class="english-verse">Their prayer at the House was nothing but whistling and clapping. Taste the punishment for your disbelief.</p>
</section>
