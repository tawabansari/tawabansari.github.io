<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:54</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَدَأبِ" data-root="D A B" data-root-note="Root study coming soon.">كَدَأبِ</button>
    <button class="word-link" type="button" data-word="ءالِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome.">ءالِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="فَأَهلَكنٰهُم" data-root="H2 L K" data-root-note="Root study coming soon.">فَأَهلَكنٰهُم</button>
    <button class="word-link" type="button" data-word="بِذُنوبِهِم" data-root="DH N B" data-root-note="Root study coming soon.">بِذُنوبِهِم</button>
    <button class="word-link" type="button" data-word="وَأَغرَقنا" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water">وَأَغرَقنا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome.">ءالَ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلٌّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">وَكُلٌّ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانوا</button>
    <button class="word-link" type="button" data-word="ظٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظٰلِمينَ</button>
  </p>
  <p class="english-verse">Like the way of Pharaoh’s people and those before them. They denied their Lord’s signs, so We destroyed them for their sins and drowned Pharaoh’s people. All were unjust.</p>
</section>
