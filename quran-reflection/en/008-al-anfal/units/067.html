<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:67</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="In mā kāna li-nabiyyin, the construction denies the fittingness of that situation for a prophet.">كانَ</button>
    <button class="word-link" type="button" data-word="لِنَبِىٍّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="For a prophet, the bearer of a prophetic message in this statement.">لِنَبِىٍّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="That he should have captives, in the clause governed by an.">يَكونَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="أَسرىٰ" data-root="A S R" data-learn-more="/quran-terminology/en/roots/a-s-r/" data-root-meaning="From binding and taking into custody to captives and bodily cohesion" data-context="Captives, people taken and held in battle.">أَسرىٰ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يُثخِنَ" data-root="TH KH N" data-root-meaning="Thickness, density, and heaviness; in Form IV, producing a severe effect or thoroughly incapacitating." data-context="Achieving decisive and established dominance during battle; severe killing is also a recorded lexical interpretation." data-learn-more="/quran-terminology/en/roots/th-kh-n/">يُثخِنَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The land or field in which ithkhān and dominance occur.">الأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="تُريدونَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="You desire, addressing the inclination towards passing worldly gain.">تُريدونَ</button>
    <button class="word-link" type="button" data-word="عَرَضَ" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="Passing goods and temporary gain, in ʿaraḍ al-dunyā.">عَرَضَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="This world or nearer life, qualifying the passing gain desired.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="The God desires the Hereafter, contrasted with desiring worldly goods.">يُريدُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The Hereafter, contrasted with passing worldly gain.">الـٔاخِرَةَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَزيزٌ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="Mighty and unconquerable, describing The God.">عَزيزٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise, possessing sound judgment and governance, describing The God.">حَكيمٌ</button>
  </p>
  <p class="english-verse">It is not for a prophet to have captives until he has thoroughly prevailed in the land. You desire the goods of this world, while The God desires the Hereafter. The God is Mighty, Wise.</p>
</section>
