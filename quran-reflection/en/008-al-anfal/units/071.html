<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Anfal 8:71</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يُريدوا" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="They intend; the possible intention to betray the addressee.">يُريدوا</button>
    <button class="word-link" type="button" data-word="خِيانَتَكَ" data-root="KH W N" data-root-meaning="Diminution and taking away; in human conduct, violating trust, an entrusted responsibility, or fidelity, and infringing a right that should be respected." data-context="Betrayal of you; the conduct they may intend." data-learn-more="/quran-terminology/en/roots/kh-w-n/">خِيانَتَكَ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَد</button>
    <button class="word-link" type="button" data-word="خانُوا" data-root="KH W N" data-root-meaning="Diminution and taking away; in human conduct, violating trust, an entrusted responsibility, or fidelity, and infringing a right that should be respected." data-context="They betrayed; their earlier conduct toward God." data-learn-more="/quran-terminology/en/roots/kh-w-n/">خانُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Previously; before the possible intention just mentioned.">قَبلُ</button>
    <button class="word-link" type="button" data-word="فَأَمكَنَ" data-root="M K N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-n/" data-root-meaning="Firmness or capacity; tamkīn means establishing or empowering securely." data-context="So He gave power over them; God enabled the addressee to prevail over them.">فَأَمكَنَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; describing God’s knowledge at the verse’s conclusion.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise; describing God’s wisdom at the verse’s conclusion.">حَكيمٌ</button>
  </p>
  <p class="english-verse">If they intend to betray you, they have already betrayed The God before, so He gave power over them. The God is Knowing, Wise.</p>
</section>
