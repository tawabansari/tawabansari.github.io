  <h2 class="ayah-title">Adh-Dhariyat 51:29</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="امرَأَتُهُ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="His wife; Abraham’s wife responding to the good news of a child.">امرَأَتُهُ</button>

  <p class="english-verse">His wife came forward with a cry, struck her face, and said: A barren old woman!</p>
