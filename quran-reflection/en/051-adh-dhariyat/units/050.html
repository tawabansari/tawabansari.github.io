<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">Adh-Dhariyat 51:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَفِرّوا" data-root="F R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-r/" data-root-meaning="Fleeing or escaping.">فَفِرّوا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">نَذيرٌ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">مُبينٌ</button>
  </p>
  <p class="english-verse">So flee to The God; I am a clarifying warner to you from Him.</p>
