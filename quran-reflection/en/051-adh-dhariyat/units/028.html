  <h2 class="ayah-title">Adh-Dhariyat 51:28</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="خيفَةً" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat">خيفَةً</button>

  <p class="english-verse">He felt fear of them. They said: Do not fear, and gave him good news of a knowledgeable boy.</p>
