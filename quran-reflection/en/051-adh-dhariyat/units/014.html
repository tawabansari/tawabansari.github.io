  <h2 class="ayah-title">Adh-Dhariyat 51:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذوقوا" data-root="DH W Q" data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting and perceiving flavor; more broadly, testing and experiencing; adhāqa means making another taste or undergo an experience." data-context="Taste; experience the trial and punishment they sought to hasten.">ذوقوا</button>

  </p>
  <p class="english-verse">Taste your torment; this is what you sought to hasten.</p>
