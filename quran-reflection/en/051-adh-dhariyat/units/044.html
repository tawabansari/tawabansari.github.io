<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Adh-Dhariyat 51:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَعَتَوا" data-root="AYN T W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-t-w/" data-root-meaning="Defiance or exceeding bounds; also extreme decrepitude in old age.">فَعَتَوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">أَمرِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="فَأَخَذَتهُمُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">فَأَخَذَتهُمُ</button>
    <button class="word-link" type="button" data-word="الصّٰعِقَةُ" data-root="Ṣ AYN Q (Ṣ ʿ Q)" data-learn-more="/quran-terminology/en/roots/sad-ayn-q/" data-root-meaning="Thunderbolt, sudden crushing strike, severe sound and shock, and an event that kills, stuns, or disables normal function">الصّٰعِقَةُ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَنظُرونَ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay">يَنظُرونَ</button>
  </p>
  <p class="english-verse">But they defied their Lord’s command, and the thunderbolt seized them while they looked on.</p>
