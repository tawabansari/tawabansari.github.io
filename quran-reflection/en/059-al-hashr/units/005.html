<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hashr 59:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="قَطَعتُم" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="You cut down; cutting date palms in the event described.">قَطَعتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="لينَةٍ" data-root="L Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-y-n/" data-root-meaning="Softness or becoming gentle; līnah denotes a kind of date palm, variously explained." data-context="A date palm; explanations differ about its precise coverage among palm varieties.">لينَةٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَرَكتُموها" data-root="T R K" data-learn-more="/quran-terminology/en/roots/t-r-k/" data-root-meaning="Leaving, abandoning, letting go, leaving something behind, and changing one’s active relation to it" data-context="Or left it; allowing the tree to remain standing.">تَرَكتُموها</button>
    <button class="word-link" type="button" data-word="قائِمَةً" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Standing upright; the condition of a tree not cut down.">قائِمَةً</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أُصولِها" data-root="A SAD L" data-learn-more="/quran-terminology/en/roots/a-sad-l/" data-root-meaning="a thing’s root or foundation, and late afternoon as a particular part of the day." data-context="On its roots; the actual bases of the date palm left standing.">أُصولِها</button>
    <button class="word-link" type="button" data-word="فَبِإِذنِ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Then by permission; cutting or leaving the tree in this event was by The God’s leave.">فَبِإِذنِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلِيُخزِىَ" data-root="KH Z Y" data-learn-more="/quran-terminology/en/roots/kh-z-y/" data-root-meaning="Humiliation, disgrace, and a fall in standing before others" data-context="And so that He might disgrace; the stated purpose concerning the defiantly disobedient.">وَلِيُخزِىَ</button>
    <button class="word-link" type="button" data-word="الفٰسِقينَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command" data-context="The defiantly disobedient; the group described as transgressing in this event.">الفٰسِقينَ</button>
  </p>
  <p class="english-verse">Whatever palm tree you cut down or left standing on its roots was by the permission of The God, and so that He might disgrace the defiantly disobedient.</p>
</section>
