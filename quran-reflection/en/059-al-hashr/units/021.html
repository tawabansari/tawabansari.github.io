<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hashr 59:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="أَنزَلنا" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="We sent down; within the hypothetical statement “had We sent this Qur’an down ...”.">أَنزَلنا</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذَا</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an; the recited revelation referred to here." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="جَبَلٍ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="A mountain; the subject of the verse’s hypothetical example." data-learn-more="/quran-terminology/en/roots/j-b-l/">جَبَلٍ</button>
    <button class="word-link" type="button" data-word="لَرَأَيتَهُ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="You would have seen it; addressing the observer of the hypothetical example.">لَرَأَيتَهُ</button>
    <button class="word-link" type="button" data-word="خٰشِعًا" data-root="KH SH ʿ (KH SH Ayn)" data-learn-more="/quran-terminology/en/roots/kh-sh-ayn/" data-root-meaning="Lowering, subsiding, softening, becoming still, and moving out of hardness, raisedness, noise, or resistance before truth and greatness." data-context="Humbled; describing the mountain’s state in the example.">خٰشِعًا</button>
    <button class="word-link" type="button" data-word="مُتَصَدِّعًا" data-root="SAD D AYN" data-root-meaning="Splitting and breaking continuity; in use, physical fissures, groups separating, open proclamation, and headache." data-context="Splitting apart or riven; describing the mountain’s state in the verse’s hypothetical example." data-learn-more="/quran-terminology/en/roots/sad-d-ayn/">مُتَصَدِّعًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خَشيَةِ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God" data-context="Awe and conscious fear; in relation to The God.">خَشيَةِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="الأَمثٰلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="The examples; illustrations conveying meaning to people.">الأَمثٰلُ</button>
    <button class="word-link" type="button" data-word="نَضرِبُها" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="We set them forth as examples; in naḍribuhā li-al-nās.">نَضرِبُها</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="For people; the recipients of the examples.">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="F K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-k-r/" data-root-meaning="Thinking or reflection in pursuit of understanding." data-context="May reflect; the stated purpose of the examples.">يَتَفَكَّرونَ</button>
  </p>
  <p class="english-verse">Had We sent this Quran down upon a mountain, you would have seen it humbled and split apart from fear of The God. We set forth these examples for people, so that they may reflect.</p>
</section>
