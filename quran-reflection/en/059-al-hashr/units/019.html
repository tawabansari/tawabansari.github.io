  <h2 class="ayah-title">Al-Hashr 59:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكونوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">تَكونوا</button>
    <button class="word-link" type="button" data-word="كَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَالَّذينَ</button>
    <button class="word-link" type="button" data-word="نَسُوا" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">نَسُوا</button>

  <p class="english-verse">Do not be like those who forgot The God, so He made them forget themselves. They are the defiantly disobedient.</p>
