<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hashr 59:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="إِلٰهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="A deity; in the negation of any deity besides The God.">إِلٰهَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="المَلِكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="The Sovereign; describing The God’s kingship and rule.">المَلِكُ</button>
    <button class="word-link" type="button" data-word="القُدّوسُ" data-root="Q D S" data-learn-more="/quran-terminology/en/roots/q-d-s/" data-root-meaning="Purity, purification, separating a pure domain from contamination, and preserving sacred boundary" data-context="The Holy; a divine description of purity from defilement and deficiency.">القُدّوسُ</button>
    <button class="word-link" type="button" data-word="السَّلٰمُ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="The Sound; a divine description of soundness and freedom from deficiency.">السَّلٰمُ</button>
    <button class="word-link" type="button" data-word="المُؤمِنُ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The Giver of Security; a divine description among this verse’s names.">المُؤمِنُ</button>
    <button class="word-link" type="button" data-word="المُهَيمِنُ" data-root="H2 M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-m-n/" data-root-meaning="Muhaymin means witness, guardian, or overseer; derivation from ʾ-m-n or a quadriliteral form is disputed." data-context="The Guardian and Overseer; a divine description of witnessing and safeguarding.">المُهَيمِنُ</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="The Invincible and Mighty; describing divine might and strength.">العَزيزُ</button>
    <button class="word-link" type="button" data-word="الجَبّارُ" data-root="J B R" data-root-meaning="repairing fractures and remedying deficiencies; firmness, power, dominance, and compulsion." data-context="Possessor of overmastering power; a divine description alongside al-ʿAzīz and al-Mutakabbir, without implying human oppression or tyranny." data-learn-more="/quran-terminology/en/roots/j-b-r/">الجَبّارُ</button>
    <button class="word-link" type="button" data-word="المُتَكَبِّرُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Possessor of Greatness; a divine description without the sense of wrongful human self-exaltation.">المُتَكَبِّرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="سُبحٰنَ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Exalted and free of imperfection; declaring The God above the partners they ascribe.">سُبحٰنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَمّا</button>
    <button class="word-link" type="button" data-word="يُشرِكونَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="They associate partners; attributing partners to The God.">يُشرِكونَ</button>
  </p>
  <p class="english-verse">He is The God, besides whom there is no deity: the Sovereign, the Holy, the Source of Peace, the Giver of Security, the Guardian, the Mighty, the Compeller, the Supremely Great. Glory be to The God above what they associate with Him.</p>
</section>
