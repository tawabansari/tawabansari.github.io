<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Maarij 70:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خٰشِعَةً" data-root="KH SH ʿ (KH SH Ayn)" data-learn-more="/quran-terminology/en/roots/kh-sh-ayn/" data-root-meaning="Lowering, subsiding, softening, becoming still, and moving out of hardness, raisedness, noise, or resistance before truth and greatness.">خٰشِعَةً</button>
    <button class="word-link" type="button" data-word="أَبصٰرُهُم" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">أَبصٰرُهُم</button>
    <button class="word-link" type="button" data-word="تَرهَقُهُم" data-root="R H2 Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-h2-q/" data-root-meaning="Overwhelming with pressure; burdening or distressing.">تَرهَقُهُم</button>
    <button class="word-link" type="button" data-word="ذِلَّةٌ" data-root="DH L L" data-learn-more="/quran-terminology/en/roots/dh-l-l/" data-root-meaning="Being tamed, made accessible, humbled, or lowered from honor.">ذِلَّةٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="اليَومُ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">اليَومُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانوا</button>
    <button class="word-link" type="button" data-word="يوعَدونَ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive">يوعَدونَ</button>
  </p>
  <p class="english-verse">their eyes downcast, humiliation covering them. That is the day they were promised.</p>
