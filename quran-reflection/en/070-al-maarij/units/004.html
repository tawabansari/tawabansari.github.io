<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Maarij 70:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَعرُجُ" data-root="AYN R J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-j/" data-root-meaning="Ascending; maʿārij are ways of ascent; aʿraj denotes lameness." data-context="Ascend, describing the angels and the Spirit going up to Him.">تَعرُجُ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="The angels, among those ascending in the verse.">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="وَالرّوحُ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit" data-context="And the Spirit, mentioned alongside the angels in the ascent.">وَالرّوحُ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day, whose measure is specified next.">يَومٍ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Is, expressing the measure of that day.">كانَ</button>
    <button class="word-link" type="button" data-word="مِقدارُهُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Its measure, the measure of the mentioned day.">مِقدارُهُ</button>
    <button class="word-link" type="button" data-word="خَمسينَ" data-root="KH M S" data-root-meaning="Five: a count of five, the fifth position, and the proportion one fifth of a whole." data-context="Fifty, with “thousand years,” giving fifty thousand years." data-learn-more="/quran-terminology/en/roots/kh-m-s/">خَمسينَ</button>
    <button class="word-link" type="button" data-word="أَلفَ" data-root="ʾ L F" data-learn-more="/quran-terminology/en/roots/a-l-f/" data-root-meaning="Allafa: joining, becoming familiar, and establishing affinity and companionship" data-context="Thousand; with fifty, giving fifty thousand.">أَلفَ</button>
    <button class="word-link" type="button" data-word="سَنَةٍ" data-root="S N W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-w/" data-root-meaning="A year or years; sanā means radiance; sanah is also analyzed under s-n-h." data-context="Years, the unit of the measure fifty thousand.">سَنَةٍ</button>
  </p>
  <p class="english-verse">The angels and the Spirit ascend to Him in a day whose measure is fifty thousand years.</p>
</section>
