  <h2 class="ayah-title">Al-Maarij 70:11</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="بِبَنيهِ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">بِبَنيهِ</button>

  <p class="english-verse">though they are shown one another. The guilty one will wish to ransom himself from that day’s punishment with his sons,</p>
