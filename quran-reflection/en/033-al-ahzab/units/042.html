  <h2 class="ayah-title">Al-Ahzab 33:42</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسَبِّحوهُ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="And glorify Him; a command to declare The God free of deficiency.">وَسَبِّحوهُ</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="B K R" data-learn-more="/quran-terminology/en/roots/b-k-r/" data-root-meaning="From the beginning of the day and coming early to remaining in the first stage." data-context="Morning; the early-day time of glorification.">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَأَصيلًا" data-root="A SAD L" data-learn-more="/quran-terminology/en/roots/a-sad-l/" data-root-meaning="a thing’s root or foundation, and late afternoon as a particular part of the day." data-context="And late afternoon approaching sunset; paired with morning as a time of glorification.">وَأَصيلًا</button>
  </p>
  <p class="english-verse">and glorify Him morning and evening.</p>
