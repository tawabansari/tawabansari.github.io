  <h2 class="ayah-title">Al-Ahzab 33:20</h2>

    <button class="word-link" type="button" data-word="يَحسَبونَ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">يَحسَبونَ</button>

    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَأتِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">يَأتِ</button>
    <button class="word-link" type="button" data-word="الأَحزابُ" data-root="H Z B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-z-b/" data-root-meaning="A group or party united by affiliation or support.">الأَحزابُ</button>

    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter.">قَليلًا</button>

  <p class="english-verse">They think the confederates have not gone. And if the confederates come, they would wish to be out among the desert Arabs, asking about your news. And if they were among you, they would fight only a little.</p>
</section>
