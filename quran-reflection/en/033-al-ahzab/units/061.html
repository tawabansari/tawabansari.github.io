<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَلعونينَ" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion" data-context="Cast out and removed from mercy, describing the group warned in the preceding context.">مَلعونينَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَينَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَينَما</button>
    <button class="word-link" type="button" data-word="ثُقِفوا" data-root="TH Q F" data-root-meaning="Finding or gaining access to a person in a particular situation, sometimes with dominance or control over them." data-context="Wherever access is gained to them; a passive perfect in a conditional construction, distinct from the following seizing and killing." data-learn-more="/quran-terminology/en/roots/th-q-f/">ثُقِفوا</button>
    <button class="word-link" type="button" data-word="أُخِذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="They are seized; the independent verb of seizing following gaining access.">أُخِذوا</button>
    <button class="word-link" type="button" data-word="وَقُتِّلوا" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="They are killed with severity; a passive Form II perfect within the warning.">وَقُتِّلوا</button>
    <button class="word-link" type="button" data-word="تَقتيلًا" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="An emphatic killing; the verbal noun emphasizing quttilū, without the word itself specifying a particular method.">تَقتيلًا</button>
  </p>
  <p class="english-verse">accursed; wherever they are found, they will be seized and killed utterly.</p>
