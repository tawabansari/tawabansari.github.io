<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَورَثَكُم" data-root="W R TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-r-th/" data-root-meaning="Inheriting or receiving property or position from a predecessor.">وَأَورَثَكُم</button>
    <button class="word-link" type="button" data-word="أَرضَهُم" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">أَرضَهُم</button>
    <button class="word-link" type="button" data-word="وَدِيٰرَهُم" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">وَدِيٰرَهُم</button>
    <button class="word-link" type="button" data-word="وَأَموٰلَهُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">وَأَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="وَأَرضًا" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">وَأَرضًا</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="تَطَـٔوها" data-root="W TT A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-tt-a/" data-root-meaning="Treading or trampling; muwāṭaʾah denotes agreement or making coincide.">تَطَـٔوها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="قَديرًا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">قَديرًا</button>
  </p>
  <p class="english-verse">And He made you inherit their land, their homes, their possessions, and a land you had not trodden. And The God is capable of all things.</p>
</section>
