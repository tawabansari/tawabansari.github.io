  <h2 class="ayah-title">Al-Ahzab 33:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُنالِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُنالِكَ</button>
    <button class="word-link" type="button" data-word="ابتُلِىَ" data-root="B L W" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away" data-context="Were tested: the believers underwent trial in those difficult circumstances.">ابتُلِىَ</button>

  <p class="english-verse">There the believers were tested and shaken with a severe shaking.</p>
