<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَجزِىَ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response">لِيَجزِىَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الصّٰدِقينَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">الصّٰدِقينَ</button>
    <button class="word-link" type="button" data-word="بِصِدقِهِم" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">بِصِدقِهِم</button>
    <button class="word-link" type="button" data-word="وَيُعَذِّبَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">وَيُعَذِّبَ</button>
    <button class="word-link" type="button" data-word="المُنٰفِقينَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">المُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شاءَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يَتوبَ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy">يَتوبَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="غَفورًا" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">غَفورًا</button>
    <button class="word-link" type="button" data-word="رَحيمًا" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحيمًا</button>
  </p>
  <p class="english-verse">So that The God may reward the truthful for their truthfulness and punish the hypocrites if He wills, or turn to them. Indeed, The God is Forgiving, Merciful.</p>
</section>
