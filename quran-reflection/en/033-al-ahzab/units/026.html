  <h2 class="ayah-title">Al-Ahzab 33:26</h2>

    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>

    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَهلِ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="People or adherents; in the expression People of the Book">أَهلِ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Book; in the designation People of the Book">الكِتٰبِ</button>

    <button class="word-link" type="button" data-word="وَتَأسِرونَ" data-root="A S R" data-learn-more="/quran-terminology/en/roots/a-s-r/" data-root-meaning="From binding and taking into custody to captives and bodily cohesion" data-context="And were taking captive; the reported action concerning the other group">وَتَأسِرونَ</button>
    <button class="word-link" type="button" data-word="فَريقًا" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="A group; those whose capture is reported">فَريقًا</button>
  </p>
  <p class="english-verse">And He brought down from their fortresses those of the People of the Book who supported them, and cast terror into their hearts; a group you killed, and a group you took captive.</p>
