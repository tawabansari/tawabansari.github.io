<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:55</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="جُناحَ" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/" data-context="Blame or restriction, denied by lā concerning the specified relations.">جُناحَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ءابائِهِنَّ" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="Their fathers, among the relatives specified.">ءابائِهِنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَبنائِهِنَّ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="Their sons, among the relatives specified.">أَبنائِهِنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="إِخوٰنِهِنَّ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brothers, close friends, or associates in a bond." data-context="Their brothers, among the relatives specified.">إِخوٰنِهِنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَبناءِ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="Sons, within their brothers’ sons.">أَبناءِ</button>
    <button class="word-link" type="button" data-word="إِخوٰنِهِنَّ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brothers, close friends, or associates in a bond." data-context="Their brothers, within the expression for their brothers’ sons.">إِخوٰنِهِنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَبناءِ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="Sons, within their sisters’ sons.">أَبناءِ</button>
    <button class="word-link" type="button" data-word="أَخَوٰتِهِنَّ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Sisters." data-context="Their sisters, within the expression for their sisters’ sons.">أَخَوٰتِهِنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="نِسائِهِنَّ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="Their women, the group of women related to them in the verse’s wording.">نِسائِهِنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="مَلَكَت" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Possess, within the expression mā malakat aymānuhunna.">مَلَكَت</button>
    <button class="word-link" type="button" data-word="أَيمٰنُهُنَّ" data-root="Y M N" data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right hand and right side; related uses concern oaths and covenants, ability and control, and good fortune. Each form’s meaning follows its construction and context." data-context="Their right hands, in the possession expression mā malakat aymānuhunna.">أَيمٰنُهُنَّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="And be mindful, addressing women in the plural.">وَاتَّقينَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Has ever been, concerning The God being witness.">كانَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every, expressing the scope of divine witnessing.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing, in the expression witness over everything.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="شَهيدًا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="A witness, describing The God concerning everything.">شَهيدًا</button>
  </p>
  <p class="english-verse">There is no blame upon them concerning their fathers, their sons, their brothers, their brothers’ sons, their sisters’ sons, their women, or what their right hands possess. And be mindful of The God. Indeed, The God is Witness over all things.</p>
</section>
