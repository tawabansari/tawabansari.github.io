<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="جاءوكُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="They came upon you; referring to the approaching attacking forces.">جاءوكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِكُم" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="From above you; the direction from which some forces approached.">فَوقِكُم</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="أَسفَلَ" data-root="S F L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-f-l/" data-root-meaning="Being lower or beneath, as opposed to above." data-context="Below you; the direction from which other forces approached.">أَسفَلَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="زاغَتِ" data-root="Z Y GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-gh/" data-root-meaning="Inclining or deviating from a course or uprightness." data-context="Deviated from their ordinary condition; describing the eyes in extreme fear.">زاغَتِ</button>
    <button class="word-link" type="button" data-word="الأَبصٰرُ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Eyes or gazes; within the portrayal of dread during the siege.">الأَبصٰرُ</button>
    <button class="word-link" type="button" data-word="وَبَلَغَتِ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="And reached; the verb describing hearts reaching the throats in the verse’s image.">وَبَلَغَتِ</button>
    <button class="word-link" type="button" data-word="القُلوبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Hearts; within the image of intense fear and inner distress.">القُلوبُ</button>
    <button class="word-link" type="button" data-word="الحَناجِرَ" data-root="H N J R" data-root-meaning="The laryngeal region and throat; the area associated with breathing and voice." data-context="Throats; within the image of hearts reaching the throats through intense dread in a military situation." data-learn-more="/quran-terminology/en/roots/h-n-j-r/">الحَناجِرَ</button>
    <button class="word-link" type="button" data-word="وَتَظُنّونَ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="And you entertained thoughts; concerning The God in the dangerous situation.">وَتَظُنّونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="الظُّنونا۠" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="Thoughts or suppositions; the various expectations concerning The God.">الظُّنونا۠</button>
  </p>
  <p class="english-verse">When they came against you from above you and from below you, and when eyes swerved and hearts reached the throats, and you thought various thoughts about The God.</p>
</section>
