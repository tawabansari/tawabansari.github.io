<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:34</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُرنَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And remember and recount, addressing the Prophet’s wives.">وَاذكُرنَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُتلىٰ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-context="Is recited and conveyed." data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another. Tilāwah also denotes reading or reciting speech or verses in sequence.">يُتلىٰ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُيوتِكُنَّ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="Your houses, addressing the Prophet’s wives." data-learn-more="/quran-terminology/en/roots/b-y-t/">بُيوتِكُنَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ءايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Signs and verses.">ءايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَالحِكمَةِ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="And wisdom and sound judgment.">وَالحِكمَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Has ever been so.">كانَ</button>
    <button class="word-link" type="button" data-word="لَطيفًا" data-root="L TT F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-tt-f/" data-root-meaning="Fineness or subtlety; luṭf denotes delicate, attentive kindness." data-context="Subtly aware and gracious in ordering affairs.">لَطيفًا</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Fully informed." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرًا</button>
  </p>
  <p class="english-verse">And remember what is recited in your homes of the verses of The God and wisdom. Indeed, The God is Subtle, Aware.</p>
</section>
