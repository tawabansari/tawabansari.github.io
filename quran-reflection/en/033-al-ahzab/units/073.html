  <h2 class="ayah-title">Al-Ahzab 33:73</h2>

    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>

  <p class="english-verse">So that The God may punish the hypocritical men and hypocritical women, the men who associate partners and the women who associate partners, and turn to the believing men and believing women. And The God is Forgiving, Merciful.</p>
