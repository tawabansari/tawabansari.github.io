  <h2 class="ayah-title">Al-Ahzab 33:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The Prophet, addressed in the command.">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say.">قُل</button>
    <button class="word-link" type="button" data-word="لِأَزوٰجِكَ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="To your wives.">لِأَزوٰجِكَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>

    <button class="word-link" type="button" data-word="تُرِدنَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="You desire.">تُرِدنَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةَ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="The life.">الحَيوٰةَ</button>

    <button class="word-link" type="button" data-word="فَتَعالَينَ" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting." data-context="Then come.">فَتَعالَينَ</button>

    <button class="word-link" type="button" data-word="وَأُسَرِّحكُنَّ" data-root="S R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-h/" data-root-meaning="Releasing or sending forth; of livestock, sending to pasture." data-context="And release you, in the context of ending the marital relationship.">وَأُسَرِّحكُنَّ</button>

    <button class="word-link" type="button" data-word="جَميلًا" data-root="J M L" data-root-meaning="Beauty and goodness; in another branch, a whole and largeness; jamal names the camel." data-context="Gracious and fitting, describing release and separation." data-learn-more="/quran-terminology/en/roots/j-m-l/">جَميلًا</button>

  <p class="english-verse">O Prophet, say to your wives: If you desire the worldly life and its adornment, then come, I will provide for you and release you with a gracious release.</p>
