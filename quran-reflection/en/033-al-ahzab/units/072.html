<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:72</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="عَرَضنَا" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="We offered; presenting the trust to the named created beings.">عَرَضنَا</button>
    <button class="word-link" type="button" data-word="الأَمانَةَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The trust; what is offered and borne in the verse.">الأَمانَةَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; among those to whom the trust was offered.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; alongside heavens and mountains.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَالجِبالِ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; alongside heavens and earth in the offering of the trust." data-learn-more="/quran-terminology/en/roots/j-b-l/">وَالجِبالِ</button>
    <button class="word-link" type="button" data-word="فَأَبَينَ" data-root="A B Y" data-learn-more="/quran-terminology/en/roots/a-b-y/" data-root-meaning="Refusing, declining, or withholding acceptance; the motive and moral value depend on the object, subject, and context." data-context="They declined; refusing to undertake the trust.">فَأَبَينَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَحمِلنَها" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Bear it; undertaking the trust." data-learn-more="/quran-terminology/en/roots/h-m-l/">يَحمِلنَها</button>
    <button class="word-link" type="button" data-word="وَأَشفَقنَ" data-root="SH F Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-f-q/" data-root-meaning="Concern mingled with fear; shafaq is the afterglow at sunset." data-context="And feared it; apprehension concerning the trust.">وَأَشفَقنَ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنها</button>
    <button class="word-link" type="button" data-word="وَحَمَلَهَا" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="And bore it; humanity undertaking the trust." data-learn-more="/quran-terminology/en/roots/h-m-l/">وَحَمَلَهَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنُ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being; the bearer of the trust.">الإِنسٰنُ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; introducing the concluding description of humanity.">كانَ</button>
    <button class="word-link" type="button" data-word="ظَلومًا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Greatly unjust; an intensive description of wrongdoing.">ظَلومًا</button>
    <button class="word-link" type="button" data-word="جَهولًا" data-root="J H L" data-learn-more="/quran-terminology/en/roots/j-h2-l/" data-root-meaning="Ignorance and unawareness; also rashness and unmeasured conduct arising from lack of knowledge, forbearance, or settled calm." data-context="Greatly ignorant; an intensive description of ignorance.">جَهولًا</button>
  </p>
  <p class="english-verse">We offered the trust to the heavens, the earth, and the mountains, but they refused to bear it and were apprehensive of it; and the human being bore it. Indeed, he was most unjust, most ignorant.</p>
</section>
