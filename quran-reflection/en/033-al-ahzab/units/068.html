<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:68</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord; addressed in the request">رَبَّنا</button>
    <button class="word-link" type="button" data-word="ءاتِهِم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Give; requesting punishment for the leaders">ءاتِهِم</button>
    <button class="word-link" type="button" data-word="ضِعفَينِ" data-root="DAD AYN F" data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Insufficient capacity and weakness contrasted with strength; Form X concerns considering weak or placing in weakness. An independent branch concerns adding an equivalent to an original amount and doubling or multiplying it." data-context="Twice as much; the amount of punishment requested">ضِعفَينِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; what they ask to be increased">العَذابِ</button>
    <button class="word-link" type="button" data-word="وَالعَنهُم" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion" data-context="And curse them; requesting exclusion from mercy">وَالعَنهُم</button>
    <button class="word-link" type="button" data-word="لَعنًا" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion" data-context="A curse; emphasizing the request to curse">لَعنًا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Great; describing the requested curse">كَبيرًا</button>
  </p>
  <p class="english-verse">Our Lord, give them double the punishment, and curse them with a great curse.</p>
