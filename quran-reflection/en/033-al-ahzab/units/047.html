  <h2 class="ayah-title">Al-Ahzab 33:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">المُؤمِنينَ</button>

    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>

    <button class="word-link" type="button" data-word="كَبيرًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">كَبيرًا</button>

  <p class="english-verse">And give the believers good tidings that they will have a great bounty from The God.</p>
