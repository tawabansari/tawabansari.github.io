<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَرنَ" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness.">وَقَرنَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُيوتِكُنَّ" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/">بُيوتِكُنَّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبَرَّجنَ" data-root="B R J" data-root-note="Root study coming soon.">تَبَرَّجنَ</button>
    <button class="word-link" type="button" data-word="تَبَرُّجَ" data-root="B R J" data-root-note="Root study coming soon.">تَبَرُّجَ</button>
    <button class="word-link" type="button" data-word="الجٰهِلِيَّةِ" data-root="J H L" data-learn-more="/quran-terminology/en/roots/j-h2-l/" data-root-meaning="Ignorance and unawareness; also rashness and unmeasured conduct arising from lack of knowledge, forbearance, or settled calm.">الجٰهِلِيَّةِ</button>
    <button class="word-link" type="button" data-word="الأولىٰ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome.">الأولىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَقِمنَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَأَقِمنَ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَءاتينَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَءاتينَ</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةَ" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness.">الزَّكوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَطِعنَ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">وَأَطِعنَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَرَسولَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لِيُذهِبَ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach">لِيُذهِبَ</button>
    <button class="word-link" type="button" data-word="عَنكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنكُمُ</button>
    <button class="word-link" type="button" data-word="الرِّجسَ" data-root="R J S" data-root-note="Root study coming soon.">الرِّجسَ</button>
    <button class="word-link" type="button" data-word="أَهلَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness">أَهلَ</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/">البَيتِ</button>
    <button class="word-link" type="button" data-word="وَيُطَهِّرَكُم" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state">وَيُطَهِّرَكُم</button>
    <button class="word-link" type="button" data-word="تَطهيرًا" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state">تَطهيرًا</button>
  </p>
  <p class="english-verse">And remain in your homes, and do not display yourselves as in the display of the former ignorance. And establish prayer, give zakat, and obey The God and His messenger. The God only intends to remove impurity from you, people of the household, and to purify you thoroughly.</p>
</section>
