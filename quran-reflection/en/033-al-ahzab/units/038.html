<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:38</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Has been, within the expression denying constraint upon the Prophet.">كانَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="النَّبِىِّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The Prophet, the subject of exemption in the specified matter.">النَّبِىِّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="حَرَجٍ" data-root="H R J" data-root-meaning="Constraint, pressure, and restriction; being caught in difficulty or liability." data-context="Constraint and blame concerning what is ordained for the Prophet, with the denial limited to that matter." data-learn-more="/quran-terminology/en/roots/h-r-j/">حَرَجٍ</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيما</button>
    <button class="word-link" type="button" data-word="فَرَضَ" data-root="F R DAD (F R Ḍ)" data-learn-more="/quran-terminology/en/roots/f-r-dad/" data-root-meaning="From marking and assigning a share to an appointed matter." data-context="Ordained, what The God has prescribed or allotted for the Prophet.">فَرَضَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="سُنَّةَ" data-root="S N N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-n/" data-root-meaning="A tooth; sunnah is an established way; masnūn has differing explanations, including shaped or altered." data-context="Established way, The God’s practice concerning those before.">سُنَّةَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="خَلَوا" data-root="KH L W" data-learn-more="/quran-terminology/en/roots/kh-l-w/" data-root-meaning="Becoming empty, withdrawing into privacy, leaving the public field, being alone, becoming free of obstruction, and separating from open visibility" data-context="Passed away, those who lived before.">خَلَوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before, the time of those preceding the Prophet.">قَبلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And has been, describing the command as a determined decree.">وَكانَ</button>
    <button class="word-link" type="button" data-word="أَمرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Command, The God’s decree.">أَمرُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="قَدَرًا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="A decree, what has been determined and measured.">قَدَرًا</button>
    <button class="word-link" type="button" data-word="مَقدورًا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Determined, describing the decree of The God’s command.">مَقدورًا</button>
  </p>
  <p class="english-verse">There is no constraint upon the Prophet in what The God has ordained for him. Such was the practice of The God among those who passed before. And the command of The God is a determined decree.</p>
</section>
