<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:58</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُؤذونَ" data-root="A DH Y" data-learn-more="/quran-terminology/en/roots/a-dh-y/" data-root-meaning="Causing or inflicting hurt and harm on another; its kind, severity, and ethical assessment are determined by context." data-context="Harm, wrongfully injuring believing men and women.">يُؤذونَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believing men, among those subjected to harm.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤمِنٰتِ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="And believing women, named alongside the men as those harmed.">وَالمُؤمِنٰتِ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without, denying a basis for the harm in their actual conduct.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَا</button>
    <button class="word-link" type="button" data-word="اكتَسَبوا" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="They have earned or done, their own conduct for which the harm has no rightful basis.">اكتَسَبوا</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="احتَمَلوا" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Have borne, placing calumny and sin’s responsibility on those causing harm." data-learn-more="/quran-terminology/en/roots/h-m-l/">احتَمَلوا</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="B H2 T" data-root-meaning="In one branch, B H T denotes bewilderment and inability to respond to something startling or an unanswerable argument. In another, buhtān denotes falsehood and wrongful attribution distorting truth and potentially exposing an innocent person to accusation or harm." data-context="Calumny, the burden of wrongful attribution and harm against believing men and women." data-learn-more="/quran-terminology/en/roots/b-h2-t/">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="وَإِثمًا" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="And sin, borne alongside calumny by those causing harm.">وَإِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Manifest, describing the sin of wrongful harm.">مُبينًا</button>
  </p>
  <p class="english-verse">And those who hurt believing men and believing women for what they have not earned have borne a slander and a clear sin.</p>
</section>
