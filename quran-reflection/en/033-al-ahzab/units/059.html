<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:59</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The Prophet; addressed with the command he is to convey to his wives, daughters, and the women of the believers.">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say or tell; the command for the Prophet to convey the message to the women named.">قُل</button>
    <button class="word-link" type="button" data-word="لِأَزوٰجِكَ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="To your wives; the first group of women named as recipients of the Prophet’s message.">لِأَزوٰجِكَ</button>
    <button class="word-link" type="button" data-word="وَبَناتِكَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="And your daughters; the second group of women named.">وَبَناتِكَ</button>
    <button class="word-link" type="button" data-word="وَنِساءِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="And the women; in “the women of the believers,” another group receiving the message.">وَنِساءِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers; in “the women of the believers,” identifying the women addressed.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="يُدنينَ" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="They are to draw near or down over themselves; the women’s action with their outer garments, distinct from the noun jilbāb itself.">يُدنينَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِنَّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="جَلٰبيبِهِنَّ" data-root="J L B" data-root-meaning="Bringing and gathering, mobilizing; and, in another branch, covering and enclosing." data-context="Their outer garments; the plural of jilbāb with a feminine possessive pronoun. Drawing these coverings over themselves is expressed separately by yudnīna." data-learn-more="/quran-terminology/en/roots/j-l-b/">جَلٰبيبِهِنَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَدنىٰ" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="More likely or more conducive; this practice is more conducive to their being recognized and not harmed.">أَدنىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُعرَفنَ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="They be recognized; a passive verb concerning the women, without this phrase specifying the precise kind of social recognition.">يُعرَفنَ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="يُؤذَينَ" data-root="A DH Y" data-learn-more="/quran-terminology/en/roots/a-dh-y/" data-root-meaning="Suffering hurt or being subjected to harm; its kind and severity are determined by context." data-context="They be harmed; a passive verb negated by fa-lā: so that they are not harmed.">يُؤذَينَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And was/is; in the statement of divine forgiveness and mercy.">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورًا" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving; a description of The God at the verse’s end.">غَفورًا</button>
    <button class="word-link" type="button" data-word="رَحيمًا" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful; describing The God’s mercy alongside forgiveness.">رَحيمًا</button>
  </p>
  <p class="english-verse">O Prophet, tell your wives, your daughters, and the women of the believers to draw their outer garments over themselves. That is more likely that they will be recognized and not harmed. And The God is Forgiving, Merciful.</p>
</section>
