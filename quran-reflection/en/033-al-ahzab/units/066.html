<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:66</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>
    <button class="word-link" type="button" data-word="تُقَلَّبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">تُقَلَّبُ</button>
    <button class="word-link" type="button" data-word="وُجوهُهُم" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh">وُجوهُهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّارِ</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">يَقولونَ</button>
    <button class="word-link" type="button" data-word="يٰلَيتَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰلَيتَنا</button>
    <button class="word-link" type="button" data-word="أَطَعنَا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">أَطَعنَا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَأَطَعنَا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">وَأَطَعنَا</button>
    <button class="word-link" type="button" data-word="الرَّسولا۠" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرَّسولا۠</button>
  </p>
  <p class="english-verse">On the day their faces are turned about in the Fire, they will say: If only we had obeyed The God and obeyed the messenger.</p>
</section>
