<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰنِساءَ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="O women, the Prophet’s wives">يٰنِساءَ</button>
    <button class="word-link" type="button" data-word="النَّبِىِّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The Prophet, addressing his wives">النَّبِىِّ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَأتِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Commits, the conditional verb">يَأتِ</button>
    <button class="word-link" type="button" data-word="مِنكُنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُنَّ</button>
    <button class="word-link" type="button" data-word="بِفٰحِشَةٍ" data-root="F H SH" data-root-meaning="Gross ugliness and reprehensibility: conduct or speech exceeding decent and acceptable bounds." data-context="A grossly shameful act, qualified as manifest in addressing the Prophet’s wives." data-learn-more="/quran-terminology/en/roots/f-h-sh/">بِفٰحِشَةٍ</button>
    <button class="word-link" type="button" data-word="مُبَيِّنَةٍ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Manifest, describing the shameful act">مُبَيِّنَةٍ</button>
    <button class="word-link" type="button" data-word="يُضٰعَف" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase." data-context="The punishment is doubled">يُضٰعَف</button>
    <button class="word-link" type="button" data-word="لَهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهَا</button>
    <button class="word-link" type="button" data-word="العَذابُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment">العَذابُ</button>
    <button class="word-link" type="button" data-word="ضِعفَينِ" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase." data-context="Twice">ضِعفَينِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And is, describing its ease">وَكانَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَسيرًا" data-root="Y S R" data-learn-more="/quran-terminology/en/roots/y-s-r/" data-root-meaning="Ease, opening, availability, smoothness of action, capacity and access; and in the branch of maysir, using ease or chance to gain benefit" data-context="Easy for The God">يَسيرًا</button>
  </p>
  <p class="english-verse">O wives of the Prophet, whoever among you commits a clear indecency, the punishment will be doubled for her. And that is easy for The God.</p>
</section>
