<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahzab 33:67</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبَّنا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَطَعنا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">أَطَعنا</button>
    <button class="word-link" type="button" data-word="سادَتَنا" data-root="S W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-d/" data-root-meaning="Blackness; in another branch, leadership or mastery.">سادَتَنا</button>
    <button class="word-link" type="button" data-word="وَكُبَراءَنا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">وَكُبَراءَنا</button>
    <button class="word-link" type="button" data-word="فَأَضَلّونَا" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">فَأَضَلّونَا</button>
    <button class="word-link" type="button" data-word="السَّبيلا۠" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">السَّبيلا۠</button>
  </p>
  <p class="english-verse">And they will say: Our Lord, we obeyed our masters and our great ones, and they led us astray from the way.</p>
