  <h2 class="ayah-title">Al-Ahqaf 46:32</h2>

    <button class="word-link" type="button" data-word="يُجِب" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/">يُجِب</button>

  <p class="english-verse">Whoever does not answer the caller of The God cannot thwart Him on earth and has no protectors besides Him. Those are in clear error.</p>
