<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahqaf 46:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذى</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said; introducing the child’s reported speech to his parents.">قالَ</button>
    <button class="word-link" type="button" data-word="لِوٰلِدَيهِ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth" data-context="To his parents; the two people whom the child answers impatiently.">لِوٰلِدَيهِ</button>
    <button class="word-link" type="button" data-word="أُفٍّ" data-root="A F F" data-learn-more="/quran-terminology/en/roots/a-f-f/" data-root-meaning="Expressing displeasure, impatience, or aversion toward someone or something through a short exclamation revealing the speaker’s dislike and irritation." data-context="Uff to you both; the child’s impatient, contemptuous reaction to the parents’ invitation.">أُفٍّ</button>
    <button class="word-link" type="button" data-word="لَكُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُما</button>
    <button class="word-link" type="button" data-word="أَتَعِدانِنى" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="Do you both promise me? The child’s rejecting question about resurrection.">أَتَعِدانِنى</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="أُخرَجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="I be brought out; a passive verb concerning being raised after death.">أُخرَجَ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="خَلَتِ" data-root="KH L W" data-learn-more="/quran-terminology/en/roots/kh-l-w/" data-root-meaning="Becoming empty, withdrawing into privacy, leaving the public field, being alone, becoming free of obstruction, and separating from open visibility" data-context="Have passed away; the passing of earlier generations.">خَلَتِ</button>
    <button class="word-link" type="button" data-word="القُرونُ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="Generations; earlier peoples whose passing the child cites.">القُرونُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلى" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before me; earlier generations’ temporal precedence over the speaker.">قَبلى</button>
    <button class="word-link" type="button" data-word="وَهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُما</button>
    <button class="word-link" type="button" data-word="يَستَغيثانِ" data-root="GH W TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-w-th/" data-root-meaning="Rescue or aid in distress." data-context="The two seek help; the parents asking The God for aid.">يَستَغيثانِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَيلَكَ" data-root="W Y L" data-learn-more="/quran-terminology/en/roots/w-y-l/" data-root-meaning="From Cries of Grief and Warning to the Announcement of a Dire Outcome" data-context="Woe to you; the parents’ strong warning and concern addressed to the child.">وَيلَكَ</button>
    <button class="word-link" type="button" data-word="ءامِن" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believe; the parents’ call to accept The God’s promise.">ءامِن</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="وَعدَ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="The promise; The God’s promise of resurrection, which the parents affirm as true.">وَعدَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="حَقٌّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Is true; describing The God’s promise in the parents’ speech.">حَقٌّ</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then he says; continuing the child’s reply that dismisses the promise as tales.">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَسٰطيرُ" data-root="S TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-tt-r/" data-root-meaning="A line and writing; asāṭīr denotes transmitted tales; muṣayṭir means a controller or overseer." data-context="Tales or stories; the child’s dismissive description of what he is told.">أَسٰطيرُ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="The ancients; earlier people to whom the child attributes these tales.">الأَوَّلينَ</button>
  </p>
  <p class="english-verse">But the one who says to his parents: Uff to you both! Do you promise me that I will be brought out, when generations have passed before me? They seek help from The God: Woe to you! Believe; the promise of The God is true. But he says: These are only tales of the ancients.</p>
</section>
