<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahqaf 46:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="نَتَقَبَّلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="We accept; concerning acceptance of the best of their deeds.">نَتَقَبَّلُ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="The best of; describing what is accepted of their deeds.">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They did; the deeds they performed.">عَمِلوا</button>
    <button class="word-link" type="button" data-word="وَنَتَجاوَزُ" data-root="J W Z" data-root-meaning="Passing and leaving behind; Qur’anic tajāwaza ʿan means passing over misdeeds and refraining from holding them to account." data-context="And We pass over; We overlook their misdeeds and refrain from holding them to account for them." data-learn-more="/quran-terminology/en/roots/j-w-z/">وَنَتَجاوَزُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِهِم" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Their misdeeds; the wrongs that are passed over.">سَيِّـٔاتِهِم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَصحٰبِ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="Companions or inhabitants of; here, the inhabitants of the Garden.">أَصحٰبِ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The Garden; the abode promised to them.">الجَنَّةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَعدَ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="A promise; the promise made to them.">وَعدَ</button>
    <button class="word-link" type="button" data-word="الصِّدقِ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Truth; qualifying the promise as true.">الصِّدقِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were; with yūʿadūna, it describes what they had been promised.">كانوا</button>
    <button class="word-link" type="button" data-word="يوعَدونَ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="They were promised; what had previously been promised to them.">يوعَدونَ</button>
  </p>
  <p class="english-verse">They are those from whom We accept the best of what they have done and whose evil deeds We overlook, among the people of the Garden: the true promise they were given.</p>
</section>
