    <button class="word-link" type="button" data-word="مُنذِرينَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">مُنذِرينَ</button>

  <p class="english-verse">When We directed a group of jinn to you to listen to the Quran, then when they attended it, they said: Be silent. When it was finished, they returned to their people as warners.</p>
