<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahqaf 46:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يُعرَضُ" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment">يُعرَضُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّارِ</button>
    <button class="word-link" type="button" data-word="أَذهَبتُم" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach">أَذهَبتُم</button>
    <button class="word-link" type="button" data-word="طَيِّبٰتِكُم" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant.">طَيِّبٰتِكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="حَياتِكُمُ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">حَياتِكُمُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَاستَمتَعتُم" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement.">وَاستَمتَعتُم</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="فَاليَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">فَاليَومَ</button>
    <button class="word-link" type="button" data-word="تُجزَونَ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response">تُجزَونَ</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابَ</button>
    <button class="word-link" type="button" data-word="الهونِ" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status">الهونِ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَستَكبِرونَ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">تَستَكبِرونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">الحَقِّ</button>
    <button class="word-link" type="button" data-word="وَبِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَبِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَفسُقونَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command">تَفسُقونَ</button>
  </p>
  <p class="english-verse">On the day those who disbelieved are presented to the Fire: You exhausted your good things in your worldly life and enjoyed them. Today you are repaid with humiliating punishment because you were arrogant on earth without right and because you were defiant.</p>
</section>
