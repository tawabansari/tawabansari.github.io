  <h2 class="ayah-title">Al-Ahqaf 46:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِهِ</button>
    <button class="word-link" type="button" data-word="كِتٰبُ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">كِتٰبُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="إِمامًا" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination">إِمامًا</button>
    <button class="word-link" type="button" data-word="وَرَحمَةً" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">وَرَحمَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="مُصَدِّقٌ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">مُصَدِّقٌ</button>
    <button class="word-link" type="button" data-word="لِسانًا" data-root="L S N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-s-n/" data-root-meaning="The tongue as an organ, speech, or a people&#x27;s language.">لِسانًا</button>
    <button class="word-link" type="button" data-word="عَرَبِيًّا" data-root="AYN R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-b/" data-root-meaning="ʿArabī relates to Arabic or Arabs; aʿrāb are desert dwellers; ʿurub means affectionate or devoted.">عَرَبِيًّا</button>
    <button class="word-link" type="button" data-word="لِيُنذِرَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">لِيُنذِرَ</button>

    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظَلَموا</button>
    <button class="word-link" type="button" data-word="وَبُشرىٰ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">وَبُشرىٰ</button>
    <button class="word-link" type="button" data-word="لِلمُحسِنينَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">لِلمُحسِنينَ</button>
  </p>
  <p class="english-verse">Before it was the Book of Moses, a guide and a mercy. This is a confirming Book in the Arabic language, to warn those who have done wrong and as good news for those who do good.</p>
