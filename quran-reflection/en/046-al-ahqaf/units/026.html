<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahqaf 46:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="مَكَّنّٰهُم" data-root="M K N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-n/" data-root-meaning="Firmness or capacity; tamkīn means establishing or empowering securely." data-context="We had established them, granting the earlier people capacity and means.">مَكَّنّٰهُم</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيما</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="مَكَّنّٰكُم" data-root="M K N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-n/" data-root-meaning="Firmness or capacity; tamkīn means establishing or empowering securely." data-context="We have established you; negated here in comparison with the earlier people’s capacities.">مَكَّنّٰكُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We gave them, providing faculties of perception.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="سَمعًا" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Hearing, one of the faculties granted to them.">سَمعًا</button>
    <button class="word-link" type="button" data-word="وَأَبصٰرًا" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="And eyes, their granted faculties of sight.">وَأَبصٰرًا</button>
    <button class="word-link" type="button" data-word="وَأَفـِٔدَةً" data-root="F A D" data-root-meaning="“heart” is the most appropriate basic equivalent for fuʾād: a heart that Qur’anic usage can connect with reception, understanding, inclination, responsiveness, and steadfastness." data-learn-more="/quran-terminology/en/roots/f-a-d/" data-context="And hearts, faculties of understanding among the capacities granted.">وَأَفـِٔدَةً</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="أَغنىٰ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting." data-context="Availed; negated here, their faculties offering no protection against denial’s consequences.">أَغنىٰ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    <button class="word-link" type="button" data-word="سَمعُهُم" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Their hearing, which did not avail them in that situation.">سَمعُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَبصٰرُهُم" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Their eyes, which did not avert denial’s consequences.">أَبصٰرُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَفـِٔدَتُهُم" data-root="F A D" data-root-meaning="“heart” is the most appropriate basic equivalent for fuʾād: a heart that Qur’anic usage can connect with reception, understanding, inclination, responsiveness, and steadfastness." data-learn-more="/quran-terminology/en/roots/f-a-d/" data-context="Their hearts, whose understanding did not avail them there.">أَفـِٔدَتُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Anything; within the negation, no help from their faculties in that situation.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to, marking denial of the signs as past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَجحَدونَ" data-root="J H D" data-root-meaning="Denying or refusing to accept something that calls for acknowledgment; in its prominent sense, denial despite recognizing the truth." data-context="They denied the signs of The God while possessing faculties of perception." data-learn-more="/quran-terminology/en/roots/j-h-d/">يَجحَدونَ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Signs, the object of their denial.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="H Y Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-y-q/" data-root-meaning="Enveloping or befalling, especially an adverse consequence." data-context="And surrounded them, what they mocked coming upon and encompassing them.">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to, marking mockery as past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game" data-context="They mocked what eventually surrounded them.">يَستَهزِءونَ</button>
  </p>
  <p class="english-verse">We had established them in what We have not established you in, and gave them hearing, eyes, and hearts. Yet neither their hearing nor their eyes nor their hearts availed them at all, since they denied the signs of The God. What they used to mock surrounded them.</p>
</section>
