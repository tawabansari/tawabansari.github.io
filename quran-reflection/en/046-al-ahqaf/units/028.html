<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahqaf 46:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَولا</button>
    <button class="word-link" type="button" data-word="نَصَرَهُمُ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing">نَصَرَهُمُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>

    <button class="word-link" type="button" data-word="ءالِهَةً" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">ءالِهَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="ضَلّوا" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">ضَلّوا</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>

    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانوا</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="F R Y" data-root-note="Root study coming soon.">يَفتَرونَ</button>
  </p>
  <p class="english-verse">Why did those they had taken as gods besides The God, as a means of nearness, not help them? Rather, they vanished from them. That was their falsehood and what they used to fabricate.</p>
