<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ahqaf 46:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And remember, an instruction to recall and recount the story of ʿĀd’s messenger.">وَاذكُر</button>
    <button class="word-link" type="button" data-word="أَخا" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Their people’s brother; here, a communal or social bond with the audience, not shared faith among them all." data-context="The brother of ʿĀd, their fellow tribesman and messenger, identified as Hūd by other verses.">أَخا</button>
    <button class="word-link" type="button" data-word="عادٍ" data-root-note="Proper name; no root has been assigned.">عادٍ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="أَنذَرَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="He warned, alerting his people to the consequences of rejection and a tremendous day’s punishment.">أَنذَرَ</button>
    <button class="word-link" type="button" data-word="قَومَهُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="His people, the community addressed by ʿĀd’s messenger.">قَومَهُ</button>
    <button class="word-link" type="button" data-word="بِالأَحقافِ" data-root="H Q F" data-root-meaning="Bending and curvature; ḥiqf is an elongated, curved sand ridge; aḥqāf is its plural and the name of a region in ʿĀd’s story." data-context="In Al-Aḥqāf, the sandy region where the messenger warned ʿĀd; the word itself does not establish its precise historical location." data-learn-more="/quran-terminology/en/roots/h-q-f/">بِالأَحقافِ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="خَلَتِ" data-root="KH L W" data-learn-more="/quran-terminology/en/roots/kh-l-w/" data-root-meaning="Becoming empty, withdrawing into privacy, leaving the public field, being alone, becoming free of obstruction, and separating from open visibility" data-context="Had passed, describing the warners mentioned in the following phrase.">خَلَتِ</button>
    <button class="word-link" type="button" data-word="النُّذُرُ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="The warners, messengers who had come before him and after him.">النُّذُرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Within min bayni yadayhi, referring to what is before him, here those preceding him.">بَينِ</button>
    <button class="word-link" type="button" data-word="يَدَيهِ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="His two hands; within min bayni yadayhi, an expression for before him, here those preceding him.">يَدَيهِ</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="خَلفِهِ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Behind him, here referring to warners after him.">خَلفِهِ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعبُدوا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worship or serve in devotion; the prohibition rejects worship of any besides The God.">تَعبُدوا</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَخافُ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="I fear, expressing the messenger’s concern about punishment reaching his people.">أَخافُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, the suffering of which the messenger warns his people.">عَذابَ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day, identifying the time of the threatened punishment in a tremendous day.">يَومٍ</button>
    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Tremendous, describing the day whose punishment the messenger fears for his people.">عَظيمٍ</button>
  </p>
  <p class="english-verse">Remember the brother of Ad, when he warned his people among the sand dunes—and warners had passed before him and after him—saying: Worship none but The God. I fear for you the punishment of a great day.</p>
</section>
