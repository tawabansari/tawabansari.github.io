  <h2 class="ayah-title">Al-Ahqaf 46:21</h2>

    <button class="word-link" type="button" data-word="قَومَهُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">قَومَهُ</button>

    <button class="word-link" type="button" data-word="النُّذُرُ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">النُّذُرُ</button>

    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمٍ</button>
  </p>
  <p class="english-verse">Remember the brother of Ad, when he warned his people among the sand dunes—and warners had passed before him and after him—saying: Worship none but The God. I fear for you the punishment of a great day.</p>
</section>
