    <button class="word-link" type="button" data-word="الفٰسِقونَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command">الفٰسِقونَ</button>

  <p class="english-verse">So be patient, as the messengers of firm resolve were patient, and do not seek to hasten it for them. On the day they see what they are promised, it will be as though they had stayed only an hour of a day. A proclamation. Will any but the defiant people be destroyed?</p>
