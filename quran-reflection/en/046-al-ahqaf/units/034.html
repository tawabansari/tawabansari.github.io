  <h2 class="ayah-title">Al-Ahqaf 46:34</h2>

    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">تَكفُرونَ</button>

  <p class="english-verse">On the day those who disbelieved are presented to the Fire: Is this not the truth? They will say: Yes, by our Lord. He will say: Then taste the punishment because you disbelieved.</p>
