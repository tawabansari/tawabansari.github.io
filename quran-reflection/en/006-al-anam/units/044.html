<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="نَسوا" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence." data-context="Forgot and disregarded in practice what they had been reminded of.">نَسوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="ذُكِّروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Had been reminded, referring to previous admonition.">ذُكِّروا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="فَتَحنا" data-root="F T Ḥ" data-learn-more="/quran-terminology/en/roots/f-t-h/" data-root-meaning="From Opening What Is Closed to Access, Judgment, and a Decisive Opening" data-context="Then We opened the doors of opportunity and prosperity to them.">فَتَحنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="أَبوٰبَ" data-root="B W B" data-learn-more="/quran-terminology/en/roots/b-w-b/" data-root-meaning="Door, gate, entrance, and threshold of passage between outside and inside." data-context="Doors, an image of access to opportunities.">أَبوٰبَ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every, expressing the breadth of what was opened to them.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing, concerning the resources whose doors were opened to them.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="فَرِحوا" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context." data-context="Rejoiced in what they had been given.">فَرِحوا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="أوتوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Were given resources and prosperity.">أوتوا</button>
    <button class="word-link" type="button" data-word="أَخَذنٰهُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="We seized them, following their disregard of the reminder.">أَخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="B GH T" data-root-meaning="Something arriving or happening suddenly at a time when its audience did not expect it or was unaware of its approach." data-context="Suddenly, describing their being seized after reminders and prosperity." data-learn-more="/quran-terminology/en/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="مُبلِسونَ" data-root="B L S" data-learn-more="/quran-terminology/en/roots/b-l-s/" data-root-meaning="Despair, being cut off, losing the path of response, and falling silent from helplessness" data-context="Despairing and helpless, their condition after being seized.">مُبلِسونَ</button>
  </p>
  <p class="english-verse">When they forgot what they had been reminded of, We opened the gates of everything to them. When they rejoiced in what they had been given, We seized them suddenly, and they were left in despair.</p>
</section>
