<section class="ayah-block" id="ayah-165" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:165</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="جَعَلَكُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Made you successors on earth.">جَعَلَكُم</button>
    <button class="word-link" type="button" data-word="خَلٰئِفَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Successors, describing people on earth.">خَلٰئِفَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, the setting of the stated succession.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَرَفَعَ" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one." data-context="And raised, concerning differences in degrees.">وَرَفَعَ</button>
    <button class="word-link" type="button" data-word="بَعضَكُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Some of you, those placed above others.">بَعضَكُم</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above, describing differences in degrees.">فَوقَ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Others, the other side of the difference in degrees.">بَعضٍ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="D R J" data-learn-more="/quran-terminology/en/roots/d-r-j/" data-root-meaning="Stepwise movement and passage; steps and rank; istidrāj: progressively leading onward." data-context="Degrees or ranks, part of the setting of the trial.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="لِيَبلُوَكُم" data-root="B L W" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away" data-context="To test you through what He has given you.">لِيَبلُوَكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="ءاتىٰكُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="He has given you, referring to the means of the trial.">ءاتىٰكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, described as swift in punishment.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="سَريعُ" data-root="S R AYN" data-root-meaning="Speed in movement or action as opposed to slowness; in musāraʿah, prompt initiative toward a goal whose value is determined by context." data-context="Swift in punishment, alongside forgiveness and mercy." data-learn-more="/quran-terminology/en/roots/s-r-ayn/">سَريعُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass" data-context="Punishment, to which swiftness relates.">العِقابِ</button>
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَغَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Indeed most forgiving, alongside the warning of punishment.">لَغَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful, describing The God.">رَحيمٌ</button>
  </p>
  <p class="english-verse">He is the One who made you successors on the earth and raised some of you above others in degrees, to test you in what He has given you. Your Lord is swift in punishment, and He is Forgiving, Merciful.</p>
</section>
