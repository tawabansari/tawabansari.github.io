  <h2 class="ayah-title">Al-An’am 6:165</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="جَعَلَكُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلَكُم</button>
    <button class="word-link" type="button" data-word="خَلٰئِفَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">خَلٰئِفَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَرَفَعَ" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one.">وَرَفَعَ</button>
    <button class="word-link" type="button" data-word="بَعضَكُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضَكُم</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number">فَوقَ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضٍ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="D R J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-r-j/" data-root-meaning="A step or rank; advancing or drawing along by degrees.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="لِيَبلُوَكُم" data-root="B L W" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away">لِيَبلُوَكُم</button>

    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>

    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="سَريعُ" data-root="S R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-ayn/" data-root-meaning="Speed or haste, as opposed to slowness.">سَريعُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">العِقابِ</button>
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَغَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">لَغَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحيمٌ</button>
  </p>
  <p class="english-verse">He is the One who made you successors on the earth and raised some of you above others in degrees, to test you in what He has given you. Your Lord is swift in punishment, and He is Forgiving, Merciful.</p>
</section>
