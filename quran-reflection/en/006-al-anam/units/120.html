<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:120</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَذَروا" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="Leave and abandon; a command to avoid sin.">وَذَروا</button>
    <button class="word-link" type="button" data-word="ظٰهِرَ" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support" data-context="The outward aspect of sin, opposed to its hidden aspect.">ظٰهِرَ</button>
    <button class="word-link" type="button" data-word="الإِثمِ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Sin, whose outward and hidden aspects must both be abandoned.">الإِثمِ</button>
    <button class="word-link" type="button" data-word="وَباطِنَهُ" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="And its hidden aspect: sin concealed from others." data-learn-more="/quran-terminology/en/roots/b-tt-n/">وَباطِنَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Earn sin through their own conduct.">يَكسِبونَ</button>
    <button class="word-link" type="button" data-word="الإِثمَ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Sin incurred through committing it.">الإِثمَ</button>
    <button class="word-link" type="button" data-word="سَيُجزَونَ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Will be recompensed for their conduct.">سَيُجزَونَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were; with yaqtarifūna, describing conduct they used to commit.">كانوا</button>
    <button class="word-link" type="button" data-word="يَقتَرِفونَ" data-root="Q R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-f/" data-root-meaning="Acquiring or committing, good or bad according to context." data-context="Used to commit the sinful acts in question.">يَقتَرِفونَ</button>
  </p>
  <p class="english-verse">Leave both the outward and the inward of sin. Those who earn sin will be repaid for what they used to commit.</p>
</section>
