<section class="ayah-block" id="ayah-105" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:105</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نُصَرِّفُ" data-root="SAD R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-f/" data-root-meaning="Turning or changing; taṣrīf denotes varying, directing, or presenting in different ways.">نُصَرِّفُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="وَلِيَقولوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَلِيَقولوا</button>
    <button class="word-link" type="button" data-word="دَرَستَ" data-root="D R S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-r-s/" data-root-meaning="Studying or repeatedly reading; also wearing away or effacing a trace.">دَرَستَ</button>
    <button class="word-link" type="button" data-word="وَلِنُبَيِّنَهُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">وَلِنُبَيِّنَهُ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمونَ</button>
  </p>
  <p class="english-verse">Thus We present the signs in varied ways, and so that they may say, “You have studied,” and so that We may make it clear to people who know.</p>
