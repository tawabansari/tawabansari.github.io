<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command introducing the following statement.">قُل</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="القادِرُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="The One able; able to send punishment.">القادِرُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَبعَثَ" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task." data-context="To send; concerning the sending of punishment.">يَبعَثَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="A punishment; the suffering that can be sent.">عَذابًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِكُم" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="From above you; one direction from which punishment may come.">فَوقِكُم</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِ" data-root="T Ḥ T" data-learn-more="/quran-terminology/en/roots/t-h-t/" data-root-meaning="Under, beneath, lower position, hidden layer, and foundational or relational placement" data-context="From beneath; in the expression “from beneath your feet.”">تَحتِ</button>
    <button class="word-link" type="button" data-word="أَرجُلِكُم" data-root="R J L" data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="Man; foot or leg; and walking or people on foot in distinct branches. Each form’s meaning follows its structure and context." data-context="Your feet; identifying the direction beneath them.">أَرجُلِكُم</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يَلبِسَكُم" data-root="L B S" data-learn-more="/quran-terminology/en/roots/l-b-s/" data-root-meaning="Wearing, covering, layering, mixing, and making something ambiguous." data-context="To embroil you; concerning divided, contending groups.">يَلبِسَكُم</button>
    <button class="word-link" type="button" data-word="شِيَعًا" data-root="SH Y AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-y-ayn/" data-root-meaning="Spreading or becoming widespread; shīʿah is a group of followers or supporters." data-context="Groups and factions; the audience’s division.">شِيَعًا</button>
    <button class="word-link" type="button" data-word="وَيُذيقَ" data-root="DH W Q" data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting and perceiving flavor; more broadly, testing and experiencing; adhāqa means making another taste or undergo an experience." data-context="And cause to taste; expressing the experience of violent conflict through tasting.">وَيُذيقَ</button>
    <button class="word-link" type="button" data-word="بَعضَكُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Some of you; those made to experience others’ violence.">بَعضَكُم</button>
    <button class="word-link" type="button" data-word="بَأسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="Violence and force; what some experience from others.">بَأسَ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Others; those whose violence reaches the rest.">بَعضٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="انظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="See; attending to how the signs are presented.">انظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="نُصَرِّفُ" data-root="SAD R F" data-learn-more="/quran-terminology/en/roots/sad-r-f/" data-root-meaning="Turning, turning back, and changing direction; in taṣrīf, directing or presenting through varied forms and ways" data-context="We present in varied ways; so that the signs may be understood.">نُصَرِّفُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The signs; what is presented in varied ways.">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَفقَهونَ" data-root="F Q H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-h2/" data-root-meaning="Understanding or comprehending speech or a matter." data-context="They might understand; the purpose of presenting the signs in varied ways.">يَفقَهونَ</button>
  </p>
  <p class="english-verse">Say, “He is able to send punishment upon you from above you or from beneath your feet, or to embroil you in factions and make some of you taste the violence of others.” See how We present the signs in varied ways, so that they may understand.</p>
</section>
