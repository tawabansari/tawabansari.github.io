<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:77</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="رَءَا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="He saw, observing the moon as it rose.">رَءَا</button>
    <button class="word-link" type="button" data-word="القَمَرَ" data-root="Q M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-r/" data-root-meaning="The moon." data-context="The moon, the heavenly body discussed at this stage.">القَمَرَ</button>
    <button class="word-link" type="button" data-word="بازِغًا" data-root="B Z GH" data-root-meaning="Emerging and becoming visible; in celestial use, beginning to rise; another branch concerns incising skin." data-context="Rising; an accusative active participle describing the moon when observed." data-learn-more="/quran-terminology/en/roots/b-z-gh/">بازِغًا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said, Ibrāhīm’s statement after seeing the rising moon.">قالَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord, in “This is my Lord.”">رَبّى</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَفَلَ" data-root="A F L" data-learn-more="/quran-terminology/en/roots/a-f-l/" data-root-meaning="Becoming absent and passing out of sight after being visible, especially the disappearance of heavenly bodies from an observer’s visible horizon." data-context="It disappeared or set; a masculine singular perfect concerning the moon.">أَفَلَ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said, Ibrāhīm’s statement about guidance after the moon set.">قالَ</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَهدِنى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guide me; negated and jussive after lam: “Unless my Lord guides me.”">يَهدِنى</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord, the subject of guiding in Ibrāhīm’s conditional statement.">رَبّى</button>
    <button class="word-link" type="button" data-word="لَأَكونَنَّ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="I shall surely be, the emphatic consequence in Ibrāhīm’s statement.">لَأَكونَنَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="The people or group, in “among the people who go astray.”" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">القَومِ</button>
    <button class="word-link" type="button" data-word="الضّالّينَ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Those who go astray, describing people who have lost the right way.">الضّالّينَ</button>
  </p>
  <p class="english-verse">When he saw the moon rising, he said, “This is my Lord.” But when it set, he said, “Unless my Lord guides me, I will surely be among the people who go astray.”</p>
</section>
