<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; directing the messenger to state the limits of his claims.">قُل</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="أَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="I say; negated by lā when disclaiming the assertion.">أَقولُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="عِندى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندى</button>
    <button class="word-link" type="button" data-word="خَزائِنُ" data-root="KH Z N" data-root-meaning="Keeping and safeguarding; a treasury is a repository or resources in custody, and a khāzin is their keeper." data-context="Treasuries; divine resources the messenger does not claim to hold." data-learn-more="/quran-terminology/en/roots/kh-z-n/">خَزائِنُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="I know; negated by lā concerning the unseen.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="الغَيبَ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="The unseen; what is hidden from manifest knowledge.">الغَيبَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="I say; negated by lā regarding being an angel.">أَقولُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="مَلَكٌ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="An angel; a status the messenger disclaims.">مَلَكٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="أَتَّبِعُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="I follow; restricted here to following revelation.">أَتَّبِعُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يوحىٰ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="Is revealed; what is communicated to the messenger.">يوحىٰ</button>
    <button class="word-link" type="button" data-word="إِلَىَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَىَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; introducing the following question.">قُل</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="يَستَوِى" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Is equal; questioning the equality of blind and seeing.">يَستَوِى</button>
    <button class="word-link" type="button" data-word="الأَعمىٰ" data-root="AYN M Y" data-learn-more="/quran-terminology/en/roots/ayn-m-y/" data-root-meaning="Blindness, not seeing, the covered path of sight, ambiguity, and the loss of observation or discernment" data-context="The blind; one side of the comparison.">الأَعمىٰ</button>
    <button class="word-link" type="button" data-word="وَالبَصيرُ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="And the seeing; the other side of the comparison.">وَالبَصيرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَتَفَكَّرونَ" data-root="F K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-k-r/" data-root-meaning="Thinking or reflection in pursuit of understanding." data-context="You reflect; a critical question about reflection.">تَتَفَكَّرونَ</button>
  </p>
  <p class="english-verse">Say, “I do not tell you that I possess the treasuries of The God, nor do I know the unseen, nor do I tell you that I am an angel. I follow only what is revealed to me.” Say, “Are the blind and the seeing equal? Will you not reflect?”</p>
</section>
