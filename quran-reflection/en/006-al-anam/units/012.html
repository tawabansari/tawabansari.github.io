  <p class="english-verse">Say, “To whom belongs whatever is in the heavens and the earth?” Say, “To The God.” He has prescribed mercy for Himself. He will surely gather you to the Day of Resurrection, about which there is no doubt. Those who have lost themselves do not believe.</p>
