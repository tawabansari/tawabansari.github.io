<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:96</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فالِقُ" data-root="F L Q" data-root-meaning="falq is splitting or opening something apart. Materially it concerns producing a cleft and separating portions; in relation to morning, it concerns dawn appearing and early daylight becoming manifest. Fāliq is a splitter or opener, infalaqa expresses becoming split, and al-falaq in Sūrat Al-Falaq names daybreak." data-learn-more="/quran-terminology/en/roots/f-l-q/">فالِقُ</button>
    <button class="word-link" type="button" data-word="الإِصباحِ" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp.">الإِصباحِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time">الَّيلَ</button>
    <button class="word-link" type="button" data-word="سَكَنًا" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling">سَكَنًا</button>
    <button class="word-link" type="button" data-word="وَالشَّمسَ" data-root="SH M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-m-s/" data-root-meaning="The sun and its light.">وَالشَّمسَ</button>
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="Q M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-r/" data-root-meaning="The moon.">وَالقَمَرَ</button>
    <button class="word-link" type="button" data-word="حُسبانًا" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">حُسبانًا</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="تَقديرُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">تَقديرُ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">العَزيزِ</button>
    <button class="word-link" type="button" data-word="العَليمِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">العَليمِ</button>
  </p>
  <p class="english-verse">The splitter of dawn; He made the night for rest, and the sun and the moon for reckoning. That is the determination of the Mighty, the Knowing.</p>
</section>
