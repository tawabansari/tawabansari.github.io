<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:87</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="ءابائِهِم" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="Their fathers; those among the fathers of the prophets mentioned.">ءابائِهِم</button>
    <button class="word-link" type="button" data-word="وَذُرِّيّٰتِهِم" data-root="DH R R" data-learn-more="/quran-terminology/en/roots/dh-r-r/" data-root-meaning="Dharrah: perceptible smallness; dhurriyyah: descendants and the question of origin" data-context="And their descendants; those among the offspring of the prophets mentioned.">وَذُرِّيّٰتِهِم</button>
    <button class="word-link" type="button" data-word="وَإِخوٰنِهِم" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brothers, close friends, or associates in a bond." data-context="And their brothers; those among the brothers of the prophets mentioned.">وَإِخوٰنِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاجتَبَينٰهُم" data-root="J B Y" data-root-meaning="gathering and bringing something together; in ijtibāʾ, choosing and setting someone or something apart." data-context="And We chose them; selecting those among the prophets and relatives identified in this context." data-learn-more="/quran-terminology/en/roots/j-b-y/">وَاجتَبَينٰهُم</button>
    <button class="word-link" type="button" data-word="وَهَدَينٰهُم" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="And We guided them; directed them to a straight path.">وَهَدَينٰهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/" data-context="A path; the way toward which they were guided.">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Straight and upright; describing the path to which they were guided.">مُستَقيمٍ</button>
  </p>
  <p class="english-verse">And from among their fathers, their descendants, and their brothers. We chose them and guided them to a straight path.</p>
</section>
