<section class="ayah-block" id="ayah-143" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:143</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثَمٰنِيَةَ" data-root="TH M N" data-learn-more="/quran-terminology/en/roots/th-m-n/" data-root-meaning="Price, value in exchange, and what is taken in return for something else." data-context="Eight: counting the individual livestock counterparts.">ثَمٰنِيَةَ</button>
    <button class="word-link" type="button" data-word="أَزوٰجٍ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Counterparts or members of pairs, concerning livestock.">أَزوٰجٍ</button>

    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الضَّأنِ" data-root="DAD A N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-a-n/" data-root-meaning="Sheep, distinguished from goats." data-context="Sheep: the first livestock group discussed.">الضَّأنِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="TH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-n-y/" data-root-meaning="Doubling, repeating, or folding; ithnān and mathnā denote two or two by two." data-context="Two: a male and a female from the livestock group discussed.">اثنَينِ</button>
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="المَعزِ" data-root="M AYN Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-ayn-z/" data-root-meaning="Goats." data-context="Goats: one of the livestock groups.">المَعزِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="TH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-n-y/" data-root-meaning="Doubling, repeating, or folding; ithnān and mathnā denote two or two by two." data-context="Two: a male and a female from the livestock group discussed.">اثنَينِ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say: the command introducing a question.">قُل</button>
    <button class="word-link" type="button" data-word="ءالذَّكَرَينِ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="The two males? In the question about forbidding livestock.">ءالذَّكَرَينِ</button>
    <button class="word-link" type="button" data-word="حَرَّمَ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Has forbidden: the questioned claim concerning livestock.">حَرَّمَ</button>
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمِ</button>
    <button class="word-link" type="button" data-word="الأُنثَيَينِ" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="The two female animals, of sheep and goats, in the question about prohibition; not two women or girls.">الأُنثَيَينِ</button>
    <button class="word-link" type="button" data-word="أَمَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمَّا</button>
    <button class="word-link" type="button" data-word="اشتَمَلَت" data-root="SH M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-m-l/" data-root-meaning="The left side; also encompassing or covering." data-context="Contains: what the female animal’s womb carries.">اشتَمَلَت</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="أَرحامُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Wombs: here, those of female animals.">أَرحامُ</button>
    <button class="word-link" type="button" data-word="الأُنثَيَينِ" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="Those two female animals, in the expression concerning their wombs and what they carry.">الأُنثَيَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="نَبِّـٔونى" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="Inform me, with knowledge demanded.">نَبِّـٔونى</button>
    <button class="word-link" type="button" data-word="بِعِلمٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="With knowledge: the support demanded for the claim.">بِعِلمٍ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You are, within the condition of truthfulness.">كُنتُم</button>
    <button class="word-link" type="button" data-word="صٰدِقينَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Truthful, in the condition attached to the demand for knowledge.">صٰدِقينَ</button>
  </p>
  <p class="english-verse">Eight in pairs: two of sheep and two of goats. Say, “Has He forbidden the two males, or the two females, or what the wombs of the two females contain? Inform me with knowledge, if you are truthful.”</p>
</section>
