<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَدِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَدِ</button>
    <button class="word-link" type="button" data-word="استُهزِئَ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game" data-context="Were mocked; a passive verb concerning earlier messengers.">استُهزِئَ</button>
    <button class="word-link" type="button" data-word="بِرُسُلٍ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Messengers; those mocked before the addressee.">بِرُسُلٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before you; addressed to the Prophet concerning earlier messengers.">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="فَحاقَ" data-root="H Y Q" data-root-meaning="Something befalling and encompassing someone, especially an adverse consequence in which the person becomes caught." data-context="Encompassed them; what they previously mocked befell them." data-learn-more="/quran-terminology/en/roots/h-y-q/">فَحاقَ</button>
    <button class="word-link" type="button" data-word="بِالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِالَّذينَ</button>
    <button class="word-link" type="button" data-word="سَخِروا" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/" data-context="They ridiculed; the group’s conduct toward the messengers.">سَخِروا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>

    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to; with the following verb, expressing their former practice of mockery.">كانوا</button>

    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game" data-context="They mocked; concerning what eventually encompassed them.">يَستَهزِءونَ</button>
  </p>
  <p class="english-verse">Messengers before you were ridiculed, and what they used to ridicule engulfed those who mocked them.</p>
