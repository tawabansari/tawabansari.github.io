<section class="ayah-block" id="ayah-146" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:146</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هادوا" data-root="H W D" data-learn-more="/quran-terminology/en/roots/h2-w-d/" data-root-meaning="From innā hudnā ilayka to alladhīna hādū" data-context="Became Jews; the group to whom the stated dietary restrictions apply.">هادوا</button>
    <button class="word-link" type="button" data-word="حَرَّمنا" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="We forbade; stating a dietary prohibition for that group.">حَرَّمنا</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; encompassing the animals described as having ẓufur.">كُلَّ</button>
    <button class="word-link" type="button" data-word="ذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذى</button>
    <button class="word-link" type="button" data-word="ظُفُرٍ" data-root="ZHA F R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/zha-f-r/" data-root-meaning="A nail or claw; iẓfār means granting victory or mastery." data-context="Hoof or claw; the feature identifying the animals in the dietary prohibition.">ظُفُرٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="البَقَرِ" data-root="B Q R" data-learn-more="/quran-terminology/en/roots/b-q-r/" data-root-meaning="Cow, cows, the cattle-kind of cows; with the Qur&#x27;anic use distinguished from the broader Arabic branch of splitting and opening." data-context="Cattle; one of the two livestock groups in the following restriction.">البَقَرِ</button>
    <button class="word-link" type="button" data-word="وَالغَنَمِ" data-root="GH N M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-m/" data-root-meaning="Obtaining gains or spoils; ghanam denotes sheep and goats." data-context="And sheep; the second livestock group mentioned.">وَالغَنَمِ</button>
    <button class="word-link" type="button" data-word="حَرَّمنا" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="We forbade; the restriction concerning the two animal groups’ fat.">حَرَّمنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="شُحومَهُما" data-root="SH H M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h-m/" data-root-meaning="Animal body fat." data-context="The fat of the two; the subject of the prohibition and following exceptions.">شُحومَهُما</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="حَمَلَت" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Have borne; the fat carried on the backs of the two animal groups." data-learn-more="/quran-terminology/en/roots/h-m-l/">حَمَلَت</button>
    <button class="word-link" type="button" data-word="ظُهورُهُما" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support" data-context="The backs of the two; the location of some exempted fat.">ظُهورُهُما</button>
    <button class="word-link" type="button" data-word="أَوِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوِ</button>
    <button class="word-link" type="button" data-word="الحَوايا" data-root="H W Y" data-root-meaning="in its gathering uses, ḥawā concerns collecting and containing, while ḥawāyā names coiled parts inside the abdomen; in the color branch, aḥwā describes darkness and a color tending toward black, in some applications indicating very deep green." data-learn-more="/quran-terminology/en/roots/h-w-y/" data-context="The entrails or coiled internal parts; in the exception concerning fat.">الحَوايا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَا</button>
    <button class="word-link" type="button" data-word="اختَلَطَ" data-root="KH L TT" data-root-meaning="Mixing and intermingling two or more things; socially, association, companionship, and partnership." data-context="Became mixed; fat mixed with bone." data-learn-more="/quran-terminology/en/roots/kh-l-tt/">اختَلَطَ</button>
    <button class="word-link" type="button" data-word="بِعَظمٍ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="With bone; that with which the fat is mixed.">بِعَظمٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="جَزَينٰهُم" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="We recompensed them; expressing the consequence of that group’s conduct.">جَزَينٰهُم</button>
    <button class="word-link" type="button" data-word="بِبَغيِهِم" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="Because of their transgression; the stated reason for the recompense.">بِبَغيِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَصٰدِقونَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Indeed We are truthful; emphasizing the account’s truthfulness.">لَصٰدِقونَ</button>
  </p>
  <p class="english-verse">To those who became Jews We forbade every animal with a claw. Of cattle and sheep We forbade them the fat, except what their backs or entrails carry, or what is mixed with bone. Thus We repaid them for their transgression, and We are truthful.</p>
</section>
