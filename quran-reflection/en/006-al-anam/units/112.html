<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:112</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلنا</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="نَبِىٍّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”">نَبِىٍّ</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity.">عَدُوًّا</button>
    <button class="word-link" type="button" data-word="شَيٰطينَ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">شَيٰطينَ</button>
    <button class="word-link" type="button" data-word="الإِنسِ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company">الإِنسِ</button>
    <button class="word-link" type="button" data-word="وَالجِنِّ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">وَالجِنِّ</button>
    <button class="word-link" type="button" data-word="يوحى" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context.">يوحى</button>
    <button class="word-link" type="button" data-word="بَعضُهُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضُهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضٍ</button>
    <button class="word-link" type="button" data-word="زُخرُفَ" data-root="Z KH R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-kh-r-f/" data-root-meaning="Gold or elaborate adornment; zukhruf al-qawl is embellished speech.">زُخرُفَ</button>
    <button class="word-link" type="button" data-word="القَولِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">القَولِ</button>
    <button class="word-link" type="button" data-word="غُرورًا" data-root="GH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-r/" data-root-meaning="Deception or reliance on a misleading appearance.">غُرورًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شاءَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فَعَلوهُ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action">فَعَلوهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذَرهُم" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be.">فَذَرهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations.">يَفتَرونَ</button>
  </p>
  <p class="english-verse">Thus We made for every prophet an enemy: devils among humans and jinn, inspiring one another with embellished speech to deceive. Had your Lord willed, they would not have done it; so leave them and what they invent.</p>
</section>
