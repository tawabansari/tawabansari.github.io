  <h2 class="ayah-title">Al-An’am 6:119</h2>

    <button class="word-link" type="button" data-word="اسمُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-context="The name; here, the name of The God mentioned over what is eaten." data-root-meaning="Raising into the level of recognition, and marking for identification">اسمُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="فَصَّلَ" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="He has clearly explained; concerning what He has forbidden." data-learn-more="/quran-terminology/en/roots/f-sad-l/">فَصَّلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="حَرَّمَ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Has forbidden.">حَرَّمَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَا</button>
    <button class="word-link" type="button" data-word="اضطُرِرتُم" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="You have been compelled by necessity.">اضطُرِرتُم</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Many people.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="لَيُضِلّونَ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Surely mislead.">لَيُضِلّونَ</button>
    <button class="word-link" type="button" data-word="بِأَهوائِهِم" data-root="H W Y" data-learn-more="/quran-terminology/en/roots/h2-w-y/" data-root-meaning="Falling, being drawn in a direction, and personal desire" data-context="Through their own desires.">بِأَهوائِهِم</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without; denying the following qualification.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge.">عِلمٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing best.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِالمُعتَدينَ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="Concerning those who transgress.">بِالمُعتَدينَ</button>
  </p>
  <p class="english-verse">Why should you not eat of that over which the name of The God has been mentioned, when He has explained in detail what He has forbidden you, except what you are compelled to? Many lead others astray by their desires without knowledge. Your Lord knows the transgressors best.</p>
</section>
