<section class="ayah-block" id="ayah-142" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:142</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="حَمولَةً" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy.">حَمولَةً</button>
    <button class="word-link" type="button" data-word="وَفَرشًا" data-root="F R SH" data-learn-more="/quran-terminology/en/roots/f-r-sh/" data-root-meaning="Spreading out, laying down, preparing a surface, and making a field suitable for settling, resting, living, or moving">وَفَرشًا</button>
    ۚ
    <button class="word-link" type="button" data-word="كُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption">كُلوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقَكُمُ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">رَزَقَكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَّبِعوا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">تَتَّبِعوا</button>
    <button class="word-link" type="button" data-word="خُطُوٰتِ" data-root="KH TT W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-tt-w/" data-root-meaning="Taking steps; khuṭuwāt denotes steps or stages of following.">خُطُوٰتِ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">الشَّيطٰنِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">مُبينٌ</button>
  </p>
  <p class="english-verse">And of livestock, those that carry burdens and those low to the ground. Eat of what The God has provided you, and do not follow the footsteps of Satan; he is a clear enemy to you.</p>
</section>
