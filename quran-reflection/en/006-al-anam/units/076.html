<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:76</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جَنَّ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="Covered or enveloped; night’s darkness covered Ibrāhīm.">جَنَّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="الَّيلُ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Night, the subject of the covering at the ayah’s beginning.">الَّيلُ</button>
    <button class="word-link" type="button" data-word="رَءا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="He saw, concerning a kawkab in the night sky.">رَءا</button>
    <button class="word-link" type="button" data-word="كَوكَبًا" data-root="K W K B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-w-k-b/" data-root-meaning="A bright celestial object; kawkab does not necessarily specify a modern astronomical classification." data-context="A kawkab, a bright celestial body seen without a more specific identification.">كَوكَبًا</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said, Ibrāhīm’s statement after seeing the kawkab: “This is my Lord.”">قالَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord, in “This is my Lord,” whose role requires the argument’s context.">رَبّى</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَفَلَ" data-root="A F L" data-learn-more="/quran-terminology/en/roots/a-f-l/" data-root-meaning="Becoming absent and passing out of sight after being visible, especially the disappearance of heavenly bodies from an observer’s visible horizon." data-context="It disappeared or set; a masculine singular perfect concerning the kawkab.">أَفَلَ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said, Ibrāhīm’s statement after the kawkab set.">قالَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="أُحِبُّ" data-root="H B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-root-meaning="Ḥubb: love or affection; ḥabb and ḥabbah: grain or a seed. These branches are not interchangeable." data-context="I love; negated here by lā: “I do not love.”">أُحِبُّ</button>
    <button class="word-link" type="button" data-word="الـٔافِلينَ" data-root="A F L" data-learn-more="/quran-terminology/en/roots/a-f-l/" data-root-meaning="Becoming absent and passing out of sight after being visible, especially the disappearance of heavenly bodies from an observer’s visible horizon." data-context="Those that set; a plural description in Ibrāhīm’s judgment concerning lordship.">الـٔافِلينَ</button>
  </p>
  <p class="english-verse">When night covered him, he saw a star. He said, “This is my Lord.” But when it set, he said, “I do not love those that set.”</p>
</section>
