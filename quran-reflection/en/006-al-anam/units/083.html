<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:83</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="حُجَّتُنا" data-root="Ḥ J J" data-learn-more="/quran-terminology/en/roots/h-j-j/" data-root-meaning="From Intending a Destination and Hajj to Argument and Reasoned Confrontation" data-context="Our proof; the argument given to Abraham.">حُجَّتُنا</button>
    <button class="word-link" type="button" data-word="ءاتَينٰها" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We gave it; granting the proof to Abraham.">ءاتَينٰها</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="His people; those Abraham addressed with the argument.">قَومِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="نَرفَعُ" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one." data-context="We raise; concerning the ranks of whom We will.">نَرفَعُ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="D R J" data-learn-more="/quran-terminology/en/roots/d-r-j/" data-root-meaning="Stepwise movement and passage; steps and rank; istidrāj: progressively leading onward." data-context="Degrees; ranks raised in the context of Abraham’s proof.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="We will; divine willing concerning elevation in rank.">نَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; described as wise and knowing in the ending.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise; describing the Lord.">حَكيمٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; describing the Lord.">عَليمٌ</button>
  </p>
  <p class="english-verse">That is Our argument, which We gave Abraham against his people. We raise in degrees whomever We will. Your Lord is Wise, Knowing.</p>
</section>
