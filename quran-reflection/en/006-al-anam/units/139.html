<section class="ayah-block" id="ayah-139" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:139</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said; introducing their claims about livestock and food.">وَقالوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُطونِ" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="The bellies of these livestock, concerning whose contents they imposed dietary claims." data-learn-more="/quran-terminology/en/roots/b-tt-n/">بُطونِ</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="These livestock, concerning whose belly contents they made rulings.">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="خالِصَةٌ" data-root="KH L Ṣ" data-learn-more="/quran-terminology/en/roots/kh-l-sad/" data-root-meaning="Separation from admixture: from purity to exclusive dedication" data-context="Reserved exclusively, in their claim, for the community’s males.">خالِصَةٌ</button>
    <button class="word-link" type="button" data-word="لِذُكورِنا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="For our males, to whom they claimed the food was restricted.">لِذُكورِنا</button>
    <button class="word-link" type="button" data-word="وَمُحَرَّمٌ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="And forbidden, according to their claimed restriction.">وَمُحَرَّمٌ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَزوٰجِنا" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Our wives, whom their claim excluded from that food.">أَزوٰجِنا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَكُن" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Be; concerning whether the livestock’s offspring is dead.">يَكُن</button>
    <button class="word-link" type="button" data-word="مَيتَةً" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="Dead; the offspring obtained without life.">مَيتَةً</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="شُرَكاءُ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Joint participants, according to their claim, in eating the dead offspring.">شُرَكاءُ</button>
    ۚ
    <button class="word-link" type="button" data-word="سَيَجزيهِم" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="He will recompense them for this assertion and attribution.">سَيَجزيهِم</button>
    <button class="word-link" type="button" data-word="وَصفَهُم" data-root="W SAD F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-sad-f/" data-root-meaning="Describing or stating a quality." data-context="Their assertions and attributions concerning what is allowed or forbidden.">وَصفَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise, describing The God’s judgment and recompense.">حَكيمٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing, describing The God’s awareness of their claims and conduct.">عَليمٌ</button>
  </p>
  <p class="english-verse">They said, “What is in the bellies of these livestock is exclusively for our males and forbidden to our wives; but if it is dead, they share in it.” He will repay them for their description. He is Wise, Knowing.</p>
</section>
