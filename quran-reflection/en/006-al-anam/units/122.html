    <button class="word-link" type="button" data-word="فَأَحيَينٰهُ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">فَأَحيَينٰهُ</button>

    <button class="word-link" type="button" data-word="يَمشى" data-root="M SH Y" data-learn-more="/quran-terminology/en/roots/m-sh-y/" data-root-meaning="Walking, stepping, moving upon the earth; and more broadly, moving forward in a path, manner, behavior, or way of life">يَمشى</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>

    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">يَعمَلونَ</button>
  </p>
  <p class="english-verse">Is one who was dead, whom We gave life and a light by which to walk among people, like one whose likeness is in darknesses from which he cannot emerge? Thus what the disbelievers used to do has been made attractive to them.</p>
