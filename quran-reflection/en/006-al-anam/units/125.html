<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:125</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="يُرِدِ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Wills, The God’s will to guide someone.">يُرِدِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَهدِيَهُ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guide that person, directing them toward guidance.">يَهدِيَهُ</button>
    <button class="word-link" type="button" data-word="يَشرَح" data-root="SH R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-r-h/" data-root-meaning="Opening and expanding; sharḥ al-ṣadr denotes inward openness or spaciousness." data-context="Opens or expands, opening the breast to accepting Islam.">يَشرَح</button>
    <button class="word-link" type="button" data-word="صَدرَهُ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="That person’s breast, picturing inward readiness to accept Islam.">صَدرَهُ</button>
    <button class="word-link" type="button" data-word="لِلإِسلٰمِ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="To Islam, the orientation of the opened breast and acceptance of submission.">لِلإِسلٰمِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُرِد" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Wills, the will mentioned in the clause concerning straying.">يُرِد</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُضِلَّهُ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Lead that person astray, opposite guidance in the first clause.">يُضِلَّهُ</button>
    <button class="word-link" type="button" data-word="يَجعَل" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Makes, putting the breast into a constricted state.">يَجعَل</button>
    <button class="word-link" type="button" data-word="صَدرَهُ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="That person’s breast, picturing inward pressure and constriction.">صَدرَهُ</button>
    <button class="word-link" type="button" data-word="ضَيِّقًا" data-root="DAD Y Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-y-q/" data-root-meaning="Narrowness, constraint, or causing distress." data-context="Narrow, describing the breast in contrast to its opening.">ضَيِّقًا</button>
    <button class="word-link" type="button" data-word="حَرَجًا" data-root="H R J" data-root-meaning="Constraint, pressure, and restriction; being caught in difficulty or liability." data-context="Constricted and under pressure, describing the breast opposite its opening to guidance." data-learn-more="/quran-terminology/en/roots/h-r-j/">حَرَجًا</button>
    <button class="word-link" type="button" data-word="كَأَنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّما</button>
    <button class="word-link" type="button" data-word="يَصَّعَّدُ" data-root="SAD AYN D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-ayn-d/" data-root-meaning="Ascending or moving onward; ṣaʿīd is the earth&#x27;s surface or soil." data-context="Laboriously ascends, the comparison with ascent into the sky.">يَصَّعَّدُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky, the setting of the difficult ascent in the comparison.">السَّماءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَجعَلُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Places, referring to defilement upon those who do not believe.">يَجعَلُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الرِّجسَ" data-root="R J S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-s/" data-root-meaning="Physical or moral uncleanness, according to context." data-context="Defilement, what is placed upon those who do not believe.">الرِّجسَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believe, in the expression denying belief.">يُؤمِنونَ</button>
  </p>
  <p class="english-verse">Whomever The God wills to guide, He opens his breast to submission; and whomever He wills to lead astray, He makes his breast tight and constricted, as though he were struggling to ascend into the sky. Thus The God places defilement upon those who do not believe.</p>
</section>
