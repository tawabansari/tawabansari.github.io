<section class="ayah-block" id="ayah-108" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:108</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَسُبُّوا" data-root="S B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-b-b/" data-root-meaning="A cord or means of connection or access; in another branch, insulting.">تَسُبُّوا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">يَدعونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَيَسُبُّوا" data-root="S B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-b-b/" data-root-meaning="A cord or means of connection or access; in another branch, insulting.">فَيَسُبُّوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَدوًا" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity.">عَدوًا</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عِلمٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="زَيَّنّا" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive.">زَيَّنّا</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="عَمَلَهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">عَمَلَهُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="مَرجِعُهُم" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference">مَرجِعُهُم</button>
    <button class="word-link" type="button" data-word="فَيُنَبِّئُهُم" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”">فَيُنَبِّئُهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">يَعمَلونَ</button>
  </p>
  <p class="english-verse">Do not insult those they call upon apart from The God, lest they insult The God in hostility without knowledge. Thus We have made every community’s deeds attractive to them. Then to their Lord is their return, and He will inform them of what they used to do.</p>
</section>
