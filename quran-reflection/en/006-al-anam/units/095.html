<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:95</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="فالِقُ" data-root="F L Q" data-root-meaning="falq is splitting or opening something apart. Materially it concerns producing a cleft and separating portions; in relation to morning, it concerns dawn appearing and early daylight becoming manifest. Fāliq is a splitter or opener, infalaqa expresses becoming split, and al-falaq in Sūrat Al-Falaq names daybreak." data-learn-more="/quran-terminology/en/roots/f-l-q/" data-context="The splitter, describing The God in relation to grain and fruit stones.">فالِقُ</button>
    <button class="word-link" type="button" data-word="الحَبِّ" data-root="H B B" data-context="Grain or seed, paired with fruit stones as what is split." data-root-meaning="Grain and seed; ḥabb denotes grain, and ḥabbah a single seed." data-learn-more="/quran-terminology/en/roots/h-b-b/">الحَبِّ</button>
    <button class="word-link" type="button" data-word="وَالنَّوىٰ" data-root="N W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-w-y/" data-root-meaning="A fruit stone; in another branch, intention or destination." data-context="And fruit stones, paired with grain.">وَالنَّوىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="يُخرِجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="He brings forth the living from the dead.">يُخرِجُ</button>
    <button class="word-link" type="button" data-word="الحَىَّ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="The living, brought forth from the dead.">الحَىَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَيِّتِ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="The dead, contrasted with the living here.">المَيِّتِ</button>
    <button class="word-link" type="button" data-word="وَمُخرِجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="And the bringer forth, describing who brings the dead from the living.">وَمُخرِجُ</button>
    <button class="word-link" type="button" data-word="المَيِّتِ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="The dead, contrasted with the living here.">المَيِّتِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الحَىِّ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="The living, from which the dead is brought forth.">الحَىِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَنّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأَنّىٰ</button>
    <button class="word-link" type="button" data-word="تُؤفَكونَ" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="How are you turned away after the account of creation and bringing forth the living and dead?">تُؤفَكونَ</button>
  </p>
  <p class="english-verse">The God is the splitter of grain and date stones. He brings the living out of the dead and brings the dead out of the living. That is The God; how then are you turned away?</p>
</section>
