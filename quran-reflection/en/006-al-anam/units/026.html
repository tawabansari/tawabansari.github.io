<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَنهَونَ" data-root="N H2 Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-h2-y/" data-root-meaning="Preventing or ending; nuhā denotes restraining understanding or reason." data-context="They deter others.">يَنهَونَ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُ</button>
    <button class="word-link" type="button" data-word="وَيَنـَٔونَ" data-root="N A Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-a-y/" data-root-meaning="Distancing oneself or withdrawing." data-context="They themselves keep away.">وَيَنـَٔونَ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يُهلِكونَ" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="They destroy only themselves; their conduct’s consequences return upon them." data-learn-more="/quran-terminology/en/roots/h2-l-k/">يُهلِكونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Themselves, the objects of destroying.">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality" data-context="They do not realize it.">يَشعُرونَ</button>
  </p>
  <p class="english-verse">They forbid it and keep away from it. They destroy only themselves, yet they do not perceive.</p>
