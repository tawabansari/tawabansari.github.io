<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say.">قُل</button>
    <button class="word-link" type="button" data-word="أَرَءَيتَكُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Consider and tell me.">أَرَءَيتَكُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="أَتىٰكُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes to you.">أَتىٰكُم</button>
    <button class="word-link" type="button" data-word="عَذابُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="God’s punishment.">عَذابُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="B GH T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-gh-t/" data-root-meaning="Arriving suddenly or unexpectedly." data-context="Suddenly and unexpectedly.">بَغتَةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="جَهرَةً" data-root="J H R" data-learn-more="/quran-terminology/en/roots/j-h2-r/" data-root-meaning="Being apparent and public; and in speech, raising the voice so that it leaves softness and concealment." data-context="Openly.">جَهرَةً</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="يُهلَكُ" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="Are destroyed, a passive verb in the question concerning the wrongdoing people." data-learn-more="/quran-terminology/en/roots/h2-l-k/">يُهلَكُ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="القَومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond." data-context="The wrongdoing people.">القَومُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrongdoers, describing the people.">الظّٰلِمونَ</button>
  </p>
  <p class="english-verse">Say, “Tell me: if the punishment of The God comes upon you suddenly or openly, will any be destroyed except the unjust people?”</p>
</section>
