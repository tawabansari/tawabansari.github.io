<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:57</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command to present the reply.">قُل</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَيِّنَةٍ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Clear evidence; what the speaker stands upon.">بَيِّنَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord; the source of the clear evidence.">رَبّى</button>
    <button class="word-link" type="button" data-word="وَكَذَّبتُم" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="And you have denied; rejecting what is presented.">وَكَذَّبتُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عِندى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندى</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَستَعجِلونَ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf" data-context="You seek to hasten; demanding the quick arrival of what is threatened.">تَستَعجِلونَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنِ</button>
    <button class="word-link" type="button" data-word="الحُكمُ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Judgment; stated to belong only to The God.">الحُكمُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَقُصُّ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="He declares the truth; according to yaquṣṣu from Q Ṣ Ṣ, distinct from the alternative yaqḍi from Q Ḍ Y." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">يَقُصُّ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="The truth; what is declared in the yaquṣṣu recitation.">الحَقَّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="The best; expressing excellence in distinguishing and judging.">خَيرُ</button>
    <button class="word-link" type="button" data-word="الفٰصِلينَ" data-root="F SAD L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-sad-l/" data-root-meaning="Separating or detailing; faṣl denotes distinction or decisive judgment." data-context="Those who distinguish and judge; concerning separation of truth from falsehood.">الفٰصِلينَ</button>
  </p>
  <p class="english-verse">Say, “I stand upon clear evidence from my Lord, and you have denied it. What you seek to hasten is not with me. Judgment belongs only to The God. He relates the truth, and He is the best of deciders.”</p>
</section>
