<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:92</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The revealed book being described.">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="We sent it down, referring to the book’s revelation.">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="مُبارَكٌ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="The revealed book, endowed with good and blessing, alongside its confirmation of what preceded it." data-learn-more="/quran-terminology/en/roots/b-r-k/">مُبارَكٌ</button>
    <button class="word-link" type="button" data-word="مُصَدِّقُ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Confirming what precedes the book.">مُصَدِّقُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="In mā bayna yadayhi, what is before it or has preceded it.">بَينَ</button>
    <button class="word-link" type="button" data-word="يَدَيهِ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="In bayna yadayhi, the expression for what is before or precedes the book.">يَدَيهِ</button>
    <button class="word-link" type="button" data-word="وَلِتُنذِرَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="So that you may warn, a stated purpose of revelation.">وَلِتُنذِرَ</button>
    <button class="word-link" type="button" data-word="أُمَّ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="In umm al-qurā, the principal settlement being addressed.">أُمَّ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="Settlements, within the expression umm al-qurā.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="حَولَها" data-root="H W L" data-learn-more="/quran-terminology/en/roots/h-w-l/" data-root-meaning="Aroundness, surrounding relation, turning, change of state, transfer, and becoming a barrier between things" data-context="Around that settlement, including its surrounding inhabitants.">حَولَها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believe, describing belief in the Hereafter.">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِالـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The Hereafter, the life and outcome beyond this world.">بِالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="They believe in this book.">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="صَلاتِهِم" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Their ṣalāh, which they carefully maintain.">صَلاتِهِم</button>
    <button class="word-link" type="button" data-word="يُحافِظونَ" data-root="H F ZHA" data-root-meaning="Keeping and caring for something so that it is not lost, forgotten, abandoned, or ruined." data-context="They maintain and guard their ṣalāh." data-learn-more="/quran-terminology/en/roots/h-f-zha/">يُحافِظونَ</button>
  </p>
  <p class="english-verse">This is a blessed Book We have sent down, confirming what came before it, and so that you may warn the Mother of Towns and those around it. Those who believe in the Hereafter believe in it, and they guard their prayer.</p>
</section>
