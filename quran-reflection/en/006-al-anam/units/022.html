<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the day when gathering and questioning occur.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="نَحشُرُهُم" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="We gather them all before questioning them about their claimed partners." data-learn-more="/quran-terminology/en/roots/h-sh-r/">نَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="All together, describing those gathered.">جَميعًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="نَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="We say, introducing the question about claimed partners.">نَقولُ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="أَشرَكوا" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Associated partners, identifying those questioned.">أَشرَكوا</button>
    <button class="word-link" type="button" data-word="أَينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَينَ</button>
    <button class="word-link" type="button" data-word="شُرَكاؤُكُمُ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Your partners, those you claimed.">شُرَكاؤُكُمُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You used to, introducing earlier claims.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَزعُمونَ" data-root="Z AYN M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-ayn-m/" data-root-meaning="An assertion or claim; zaʿīm means a responsible party or guarantor, according to context." data-context="You claimed, concerning partners.">تَزعُمونَ</button>
  </p>
  <p class="english-verse">On the day We gather them all, We will say to those who associated partners, “Where are your partners whom you used to claim?”</p>
</section>
