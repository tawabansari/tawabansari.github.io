<section class="ayah-block" id="ayah-115" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:115</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَمَّت" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete.">وَتَمَّت</button>
    <button class="word-link" type="button" data-word="كَلِمَتُ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality">كَلِمَتُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="صِدقًا" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">صِدقًا</button>
    <button class="word-link" type="button" data-word="وَعَدلًا" data-root="ʿ D L (Ayn D L)" data-learn-more="/quran-terminology/en/roots/ayn-d-l/" data-root-meaning="Making things correspond, setting straight, equalizing, and placing each thing in a relation that prevents crookedness and one-sidedness">وَعَدلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="مُبَدِّلَ" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">مُبَدِّلَ</button>
    <button class="word-link" type="button" data-word="لِكَلِمٰتِهِ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality">لِكَلِمٰتِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="السَّميعُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">السَّميعُ</button>
    <button class="word-link" type="button" data-word="العَليمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">العَليمُ</button>
  </p>
  <p class="english-verse">The word of your Lord has been fulfilled in truth and justice. None can change His words. He is the Hearing, the Knowing.</p>
