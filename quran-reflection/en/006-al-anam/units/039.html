  <h2 class="ayah-title">Al-An’am 6:39</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/">كَذَّبوا</button>

  <p class="english-verse">Those who deny Our signs are deaf and mute in darknesses. Whomever The God wills, He leads astray; and whomever He wills, He places on a straight path.</p>
