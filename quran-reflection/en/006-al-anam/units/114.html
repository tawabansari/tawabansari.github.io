<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:114</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَغَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Is it other than; asking about seeking a judge other than The God.">أَفَغَيرَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="أَبتَغى" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="I seek.">أَبتَغى</button>
    <button class="word-link" type="button" data-word="حَكَمًا" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="A judge; one who adjudicates.">حَكَمًا</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Sent down.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="إِلَيكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكُمُ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Book referred to.">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="مُفَصَّلًا" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="Distinctly and clearly explained; describing the Book." data-learn-more="/quran-terminology/en/roots/f-sad-l/">مُفَصَّلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءاتَينٰهُمُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We gave them.">ءاتَينٰهُمُ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Book referred to.">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="They know.">يَعلَمونَ</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="مُنَزَّلٌ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Sent down or revealed.">مُنَزَّلٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="In truth; in accordance with truth.">بِالحَقِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَكونَنَّ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Be; within an emphatic prohibition.">تَكونَنَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُمتَرينَ" data-root="M R Y" data-learn-more="/quran-terminology/en/roots/m-r-y/" data-root-meaning="Doubt, uncertainty and disputation: from drawing out milk to contesting truth, and the boundary between questioning and mirāʾ in the Qur’an" data-context="Those who doubt.">المُمتَرينَ</button>
  </p>
  <p class="english-verse">Shall I seek a judge other than The God, when He is the One who sent down to you the Book explained in detail? Those to whom We have given the Book know that it has been sent down from your Lord in truth; so never be among those who doubt.</p>
</section>
