<section class="ayah-block" id="ayah-137" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:137</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="زَيَّنَ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive.">زَيَّنَ</button>
    <button class="word-link" type="button" data-word="لِكَثيرٍ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">لِكَثيرٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">المُشرِكينَ</button>
    <button class="word-link" type="button" data-word="قَتلَ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">قَتلَ</button>
    <button class="word-link" type="button" data-word="أَولٰدِهِم" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth">أَولٰدِهِم</button>
    <button class="word-link" type="button" data-word="شُرَكاؤُهُم" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">شُرَكاؤُهُم</button>
    <button class="word-link" type="button" data-word="لِيُردوهُم" data-root="R D Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-d-y/" data-root-meaning="Falling and perishing; taraddī means falling down or coming to ruin.">لِيُردوهُم</button>
    <button class="word-link" type="button" data-word="وَلِيَلبِسوا" data-root="L B S" data-learn-more="/quran-terminology/en/roots/l-b-s/" data-root-meaning="Wearing, covering, layering, mixing, and making something ambiguous.">وَلِيَلبِسوا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="دينَهُم" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God">دينَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فَعَلوهُ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action">فَعَلوهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَذَرهُم" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be.">فَذَرهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations.">يَفتَرونَ</button>
  </p>
  <p class="english-verse">Thus their partners made the killing of their children attractive to many of those who associate partners, to bring them to ruin and confuse their religion for them. Had The God willed, they would not have done it; so leave them and what they invent.</p>
</section>
