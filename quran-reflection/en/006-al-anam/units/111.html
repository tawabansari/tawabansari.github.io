  <h2 class="ayah-title">Al-An’am 6:111</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>

    <button class="word-link" type="button" data-word="نَزَّلنا" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">نَزَّلنا</button>
    <button class="word-link" type="button" data-word="إِلَيهِمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِمُ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="وَكَلَّمَهُمُ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality">وَكَلَّمَهُمُ</button>
    <button class="word-link" type="button" data-word="المَوتىٰ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">المَوتىٰ</button>
    <button class="word-link" type="button" data-word="وَحَشَرنا" data-root="H SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sh-r/" data-root-meaning="Gathering and driving people or creatures together from their places.">وَحَشَرنا</button>

    <button class="word-link" type="button" data-word="قُبُلًا" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قُبُلًا</button>

    <button class="word-link" type="button" data-word="لِيُؤمِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">لِيُؤمِنوا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>

    <button class="word-link" type="button" data-word="يَشاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>

    <button class="word-link" type="button" data-word="أَكثَرَهُم" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">أَكثَرَهُم</button>
    <button class="word-link" type="button" data-word="يَجهَلونَ" data-root="J H L" data-learn-more="/quran-terminology/en/roots/j-h2-l/" data-root-meaning="Ignorance and unawareness; also rashness and unmeasured conduct arising from lack of knowledge, forbearance, or settled calm.">يَجهَلونَ</button>
  </p>
  <p class="english-verse">Even if We sent the angels down to them, and the dead spoke to them, and We gathered everything before them face to face, they would not believe unless The God willed; but most of them are ignorant.</p>
</section>
