<section class="ayah-block" id="ayah-155" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:155</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The book referred to in the verse.">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="We sent it down, referring to the book.">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="مُبارَكٌ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="A book endowed with good and blessing, followed by the command to follow it." data-learn-more="/quran-terminology/en/roots/b-r-k/">مُبارَكٌ</button>
    <button class="word-link" type="button" data-word="فَاتَّبِعوهُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="Follow it, an instruction concerning the book.">فَاتَّبِعوهُ</button>
    <button class="word-link" type="button" data-word="وَاتَّقوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Practice taqwā, an instruction of mindful guarding.">وَاتَّقوا</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُرحَمونَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="You may receive mercy, a passive verb expressing the prospect of mercy.">تُرحَمونَ</button>
  </p>
  <p class="english-verse">This is a blessed Book We have sent down; so follow it and be mindful, so that you may receive mercy.</p>
</section>
