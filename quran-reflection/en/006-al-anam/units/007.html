<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="نَزَّلنا" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="We had sent down: sending writing to the Prophet in the verse’s hypothetical situation.">نَزَّلنا</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="كِتٰبًا" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="A writing: a written text presented on a qirṭās in the hypothetical situation.">كِتٰبًا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="قِرطاسٍ" data-root="Q R TT S" data-root-meaning="A writing sheet or page; a surface bearing recorded writing, such as papyrus, prepared skin, or paper. In another use, qirṭās also names an archery surface or target." data-context="A qirṭās: a writing sheet or material bearing the writing hypothetically sent down and touched by hand in this verse." data-learn-more="/quran-terminology/en/roots/q-r-tt-s/">قِرطاسٍ</button>
    <button class="word-link" type="button" data-word="فَلَمَسوهُ" data-root="L M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-m-s/" data-root-meaning="Touching; iltimās means seeking; some contexts imply sexual contact." data-context="Then they had touched it: direct hand contact with the writing or its material carrier in the hypothetical situation.">فَلَمَسوهُ</button>
    <button class="word-link" type="button" data-word="بِأَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="With their hands: the means of directly touching the material writing.">بِأَيديهِم</button>
    <button class="word-link" type="button" data-word="لَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They would certainly have said: the deniers’ projected response to the hypothetical situation.">لَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Those who disbelieved: the group who would still call the tangible writing magic.">كَفَروا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="سِحرٌ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn" data-context="Magic: the description the deniers would apply to the writing.">سِحرٌ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Evident: qualifying “magic” in the deniers’ claim, rather than endorsing that claim.">مُبينٌ</button>
  </p>
  <p class="english-verse">Even if We sent down to you a writing on parchment and they touched it with their hands, those who disbelieve would say, “This is nothing but clear magic.”</p>
</section>
