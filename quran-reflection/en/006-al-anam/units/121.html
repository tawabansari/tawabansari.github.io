<section class="ayah-block" id="ayah-121" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:121</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَأكُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption">تَأكُلوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يُذكَرِ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">يُذكَرِ</button>
    <button class="word-link" type="button" data-word="اسمُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">اسمُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَفِسقٌ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command">لَفِسقٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينَ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">الشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="لَيوحونَ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context.">لَيوحونَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَولِيائِهِم" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">أَولِيائِهِم</button>
    <button class="word-link" type="button" data-word="لِيُجٰدِلوكُم" data-root="J D L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-d-l/" data-root-meaning="Twisting firmly or making secure; jidāl: verbal or argumentative contest.">لِيُجٰدِلوكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَطَعتُموهُم" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">أَطَعتُموهُم</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="لَمُشرِكونَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">لَمُشرِكونَ</button>
  </p>
  <p class="english-verse">Do not eat of that over which the name of The God has not been mentioned; it is disobedience. The devils inspire their allies to argue with you. If you obey them, you are indeed associators of partners.</p>
</section>
