<section class="ayah-block" id="ayah-153" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:153</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="صِرٰطى" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/">صِرٰطى</button>
    <button class="word-link" type="button" data-word="مُستَقيمًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">مُستَقيمًا</button>
    <button class="word-link" type="button" data-word="فَاتَّبِعوهُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">فَاتَّبِعوهُ</button>

    <button class="word-link" type="button" data-word="تَتَّبِعُوا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">تَتَّبِعُوا</button>

    <button class="word-link" type="button" data-word="بِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكُم</button>

    <button class="word-link" type="button" data-word="ذٰلِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكُم</button>

    <button class="word-link" type="button" data-word="تَتَّقونَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">تَتَّقونَ</button>
  </p>
  <p class="english-verse">This is My path, straight, so follow it. Do not follow other ways, lest they separate you from His way. This He has enjoined upon you, so that you may be mindful.</p>
