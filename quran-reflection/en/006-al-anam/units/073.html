<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:73</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="He created; bringing the stated creation into existence.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; the domain mentioned in the verse.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; an object of creation.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="In truth; describing the creation of heavens and earth.">بِالحَقِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the day; the time of the following event.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He says; the command of bringing into existence.">يَقولُ</button>
    <button class="word-link" type="button" data-word="كُن" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Be; the command to exist.">كُن</button>
    <button class="word-link" type="button" data-word="فَيَكونُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Then it becomes and exists.">فَيَكونُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قَولُهُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="His word; what is attributed to Him.">قَولُهُ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="The truth; the stated word or text’s truth.">الحَقُّ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُ</button>
    <button class="word-link" type="button" data-word="المُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Dominion; what belongs to God.">المُلكُ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day; when the trumpet is blown.">يَومَ</button>
    <button class="word-link" type="button" data-word="يُنفَخُ" data-root="N F KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-kh/" data-root-meaning="Blowing or setting air in motion." data-context="It is blown; the passive verb concerning the trumpet.">يُنفَخُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="SAD W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Forming or giving shape; ṣūr is a trumpet; ṣur in al-Baqarah has explanations involving drawing near or gathering." data-context="The trumpet; what is blown into.">الصّورِ</button>
    ۚ
    <button class="word-link" type="button" data-word="عٰلِمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="The knower; of the unseen and apparent.">عٰلِمُ</button>
    <button class="word-link" type="button" data-word="الغَيبِ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="The unseen; what is absent from observation.">الغَيبِ</button>
    <button class="word-link" type="button" data-word="وَالشَّهٰدَةِ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="And the apparent; contrasted with the unseen.">وَالشَّهٰدَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise; describing The God.">الحَكيمُ</button>
    <button class="word-link" type="button" data-word="الخَبيرُ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware; describing The God’s knowledge in the verse’s context." data-learn-more="/quran-terminology/en/roots/kh-b-r/">الخَبيرُ</button>
  </p>
  <p class="english-verse">He is the One who created the heavens and the earth in truth. On the day He says, “Be,” it is. His word is the truth. His is the dominion on the day the trumpet is blown; Knower of the unseen and the witnessed, He is the Wise, the Aware.</p>
</section>
