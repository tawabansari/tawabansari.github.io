  <h2 class="ayah-title">Al-An’am 6:73</h2>

    <button class="word-link" type="button" data-word="يَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">يَقولُ</button>
    <button class="word-link" type="button" data-word="كُن" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُن</button>
    <button class="word-link" type="button" data-word="فَيَكونُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">فَيَكونُ</button>

    <button class="word-link" type="button" data-word="قَولُهُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قَولُهُ</button>

    <button class="word-link" type="button" data-word="المُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God">المُلكُ</button>

    <button class="word-link" type="button" data-word="الصّورِ" data-root="SAD W R" data-root-note="Root study coming soon.">الصّورِ</button>

    <button class="word-link" type="button" data-word="عٰلِمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عٰلِمُ</button>
    <button class="word-link" type="button" data-word="الغَيبِ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God">الغَيبِ</button>

    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">الحَكيمُ</button>
    <button class="word-link" type="button" data-word="الخَبيرُ" data-root="KH B R" data-root-note="Root study coming soon.">الخَبيرُ</button>
  </p>
  <p class="english-verse">He is the One who created the heavens and the earth in truth. On the day He says, “Be,” it is. His word is the truth. His is the dominion on the day the trumpet is blown; Knower of the unseen and the witnessed, He is the Wise, the Aware.</p>
