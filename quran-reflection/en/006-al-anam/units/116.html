<section class="ayah-block" id="ayah-116" data-translation-status="provisional">
  <h2 class="ayah-title">Al-An’am 6:116</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُطِع" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="You obey; the addressee’s following of the group in the condition.">تُطِع</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Most; the greater number of those on earth.">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; where the people mentioned live.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="يُضِلّوكَ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="They lead you astray; turning the addressee away from the way of The God.">يُضِلّوكَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; the way of The God from which they lead astray.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="يَتَّبِعونَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="They follow; the group’s following of conjecture.">يَتَّبِعونَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الظَّنَّ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="Conjecture; the basis followed by the group criticized here.">الظَّنَّ</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="يَخرُصونَ" data-root="KH R SAD" data-root-meaning="Assessment and estimation; in censured speech, conjecture and unsupported assertion." data-context="They conjecture; unsupported speech and judgment accompanying their following of conjecture." data-learn-more="/quran-terminology/en/roots/kh-r-sad/">يَخرُصونَ</button>
  </p>
  <p class="english-verse">If you obey most of those on earth, they will lead you away from the path of The God. They follow only conjecture and do nothing but guess.</p>
</section>
