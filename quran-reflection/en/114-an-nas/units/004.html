<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nas 114:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَرِّ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/">شَرِّ</button>
    <button class="word-link" type="button" data-word="الوَسواسِ" data-root="W S W S" data-root-meaning="in acoustic usage, waswasah is quiet, hidden sound; in relation to a person, it is speech or thought that passes within them or is suggested in a concealed way. Such prompting may come from the person’s own self or another agent. Whether it is wrong, deceptive, or satanic is determined by the agent, content, and context, rather than by the root alone." data-learn-more="/quran-terminology/en/roots/w-s-w-s/">الوَسواسِ</button>
    <button class="word-link" type="button" data-word="الخَنّاسِ" data-root="KH N S" data-root-meaning="khunūs is drawing back, contracting, or withdrawing from an exposed position, which may be accompanied by disappearing from view. Khunnas denotes those that retreat or become hidden; khannās describes someone or something whose conduct is characterized by retreat and concealment." data-learn-more="/quran-terminology/en/roots/kh-n-s/">الخَنّاسِ</button>
  </p>
  <p class="english-verse">from the evil of the whisperer who withdraws,</p>
