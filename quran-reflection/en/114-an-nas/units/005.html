<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nas 114:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُوَسوِسُ" data-root="W S W S" data-root-meaning="in acoustic usage, waswasah is quiet, hidden sound; in relation to a person, it is speech or thought that passes within them or is suggested in a concealed way. Such prompting may come from the person’s own self or another agent. Whether it is wrong, deceptive, or satanic is determined by the agent, content, and context, rather than by the root alone." data-learn-more="/quran-terminology/en/roots/w-s-w-s/">يُوَسوِسُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="صُدورِ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/">صُدورِ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
  </p>
  <p class="english-verse">who whispers in the breasts of mankind,</p>
