<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naba 78:39</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="اليَومُ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="That Day, the true Day.">اليَومُ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="True and certain; describing that Day.">الحَقُّ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Whoever wills.">شاءَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Takes a way of return to the Lord.">اتَّخَذَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord, toward whom the return is directed.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="مَـٔابًا" data-root="A W B" data-learn-more="/quran-terminology/en/roots/a-w-b/" data-root-meaning="Returning and bringing back; awwāb: one who repeatedly returns or turns toward; maʾāb: return or a place of return." data-context="Return to the Lord, in the expression of choosing it.">مَـٔابًا</button>
  </p>
  <p class="english-verse">That is the true day. So whoever wills may take a way of return to his Lord.</p>
</section>
