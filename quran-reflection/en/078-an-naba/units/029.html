<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naba 78:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="And every, expressing comprehensive scope">وَكُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing, the object of comprehensive accounting">شَىءٍ</button>
    <button class="word-link" type="button" data-word="أَحصَينٰهُ" data-root="H SAD Y" data-root-meaning="The Qur’anic branch’s semantic core is accurate, comprehensive counting and accounting for the number, quantity, or parts of something; in relevant contexts it conveys complete recording without omission." data-context="We have fully committed it to a record; everything" data-learn-more="/quran-terminology/en/roots/h-sad-y/">أَحصَينٰهُ</button>
    <button class="word-link" type="button" data-word="كِتٰبًا" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="A written record, associated with complete accounting">كِتٰبًا</button>
  </p>
  <p class="english-verse">We have enumerated everything in a record.</p>
