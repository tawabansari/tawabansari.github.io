<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naba 78:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لٰبِثينَ" data-root="L B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-th/" data-root-meaning="Staying or remaining for a period or in a place." data-context="Remaining there; an active participle describing the people staying in Hell, with their duration expressed by aḥqāban.">لٰبِثينَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="أَحقابًا" data-root="H Q B" data-root-meaning="In Qur’anic usage, a long period without the verse specifying a number of years; aḥqāb is the plural of periods and does not alone determine their final count." data-context="Long ages, expressing how long the people mentioned remain in Hell, without the word itself specifying a final count of periods." data-learn-more="/quran-terminology/en/roots/h-q-b/">أَحقابًا</button>
  </p>
  <p class="english-verse">where they remain for ages.</p>
</section>
