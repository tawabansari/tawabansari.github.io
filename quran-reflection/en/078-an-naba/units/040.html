<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naba 78:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَنذَرنٰكُم" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">أَنذَرنٰكُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابًا</button>
    <button class="word-link" type="button" data-word="قَريبًا" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness">قَريبًا</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>
    <button class="word-link" type="button" data-word="يَنظُرُ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay">يَنظُرُ</button>
    <button class="word-link" type="button" data-word="المَرءُ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action.">المَرءُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="قَدَّمَت" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history">قَدَّمَت</button>
    <button class="word-link" type="button" data-word="يَداهُ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">يَداهُ</button>
    <button class="word-link" type="button" data-word="وَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَيَقولُ</button>
    <button class="word-link" type="button" data-word="الكافِرُ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">الكافِرُ</button>
    <button class="word-link" type="button" data-word="يٰلَيتَنى" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰلَيتَنى</button>
    <button class="word-link" type="button" data-word="كُنتُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُ</button>
    <button class="word-link" type="button" data-word="تُرٰبًا" data-root="T R B" data-learn-more="/quran-terminology/en/roots/t-r-b/" data-root-meaning="Dust, nearness to dust, severe poverty, equal age or stage, and the special anatomical branch of tara&#x27;ib.">تُرٰبًا</button>
  </p>
  <p class="english-verse">We have warned you of a near punishment, on the day when a person sees what his hands have sent ahead, and the disbeliever says, “If only I were dust!”</p>
</section>
