<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naba 78:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَذوقونَ" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="They do not taste: having no experience or share of coolness and drink in that place.">يَذوقونَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="بَردًا" data-root="B R D" data-root-meaning="Coldness or coolness as opposed to heat; barad means hail; some extended uses concern subsiding intensity and relief." data-learn-more="/quran-terminology/en/roots/b-r-d/" data-context="Coolness: the preferred reading in the heat-and-drink context; sleep is also attested lexically and reported in interpretation.">بَردًا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="شَرابًا" data-root="SH R B" data-learn-more="/quran-terminology/en/roots/sh-r-b/" data-root-meaning="Drinking, drink, a share of water, and a place or path of access to drinking." data-context="Drink: read with the next verse’s exception, they are deprived of refreshing drink that relieves thirst.">شَرابًا</button>
  </p>
  <p class="english-verse">There they taste neither coolness nor drink,</p>
