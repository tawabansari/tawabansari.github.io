  <h2 class="ayah-title">An-Naba 78:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسُيِّرَتِ" data-root="S Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-r/" data-root-meaning="Traveling or moving along a course; sīrah denotes a way or condition." data-context="And were set in motion; the mountains being moved.">وَسُيِّرَتِ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; set in motion and becoming like a mirage." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجِبالُ</button>
    <button class="word-link" type="button" data-word="فَكانَت" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And became; the mountains’ changed condition.">فَكانَت</button>
    <button class="word-link" type="button" data-word="سَرابًا" data-root="S R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-b/" data-root-meaning="A course and moving along it; sarab is a passage; sarāb is a mirage." data-context="A mirage; the description of mountains’ resulting condition.">سَرابًا</button>
  </p>
  <p class="english-verse">and the mountains are set in motion and become a mirage.</p>
