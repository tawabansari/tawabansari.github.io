<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naba 78:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Lord; here, Lord of the heavens, the earth, and what is between them.">رَبِّ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; part of the domain of lordship described.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; alongside the heavens and what is between them.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُمَا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between the two; what lies between the heavens and the earth.">بَينَهُمَا</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="The Entirely Merciful; the divine name following the description of the Lord of the heavens and earth.">الرَّحمٰنِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَملِكونَ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="They possess authority; negated here, the absence of independent authority to address.">يَملِكونَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="خِطابًا" data-root="KH TT B" data-root-meaning="Speaking to an addressee and raising or pursuing a matter; in other uses, an affair or occurrence, and requesting marriage." data-context="Addressing Him; here, without independent authority to speak." data-learn-more="/quran-terminology/en/roots/kh-tt-b/">خِطابًا</button>
  </p>
  <p class="english-verse">the Lord of the heavens and the earth and what is between them, the Entirely Merciful. They have no authority to address Him.</p>
</section>
