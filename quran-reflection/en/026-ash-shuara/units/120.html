<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shuara 26:120</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَغرَقنا" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water" data-context="We drowned, the fate of those left after another group was rescued.">أَغرَقنا</button>
    <button class="word-link" type="button" data-word="بَعدُ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="Afterward, locating the event after the earlier rescue.">بَعدُ</button>
    <button class="word-link" type="button" data-word="الباقينَ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="Those remaining, left after the rescued group and then drowned." data-learn-more="/quran-terminology/en/roots/b-q-y/">الباقينَ</button>
  </p>
  <p class="english-verse">Then afterward We drowned those who remained.</p>
