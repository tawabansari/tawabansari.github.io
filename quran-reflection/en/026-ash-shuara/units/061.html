<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shuara 26:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="تَرٰءَا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="They came into sight of one another; the two groups becoming mutually visible.">تَرٰءَا</button>
    <button class="word-link" type="button" data-word="الجَمعانِ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="The two groups; the Israelites and the pursuing army.">الجَمعانِ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said; introducing Moses’ companions’ statement.">قالَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="Companions; those accompanying Moses.">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="لَمُدرَكونَ" data-root="D R K" data-learn-more="/quran-terminology/en/roots/d-r-k/" data-root-meaning="Reaching and attaining; sensory or cognitive apprehension, joining and timely intervention; dark also denotes a lower level." data-context="We will certainly be overtaken; Moses’ companions’ expectation of the enemy catching them.">لَمُدرَكونَ</button>
  </p>
  <p class="english-verse">When the two groups saw each other, Moses’ companions said: We will surely be overtaken.</p>
