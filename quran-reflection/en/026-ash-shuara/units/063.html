<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shuara 26:63</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَوحَينا" data-root="W H Y" data-root-note="Root study coming soon.">فَأَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنِ</button>
    <button class="word-link" type="button" data-word="اضرِب" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state">اضرِب</button>
    <button class="word-link" type="button" data-word="بِعَصاكَ" data-root="AYN Ṣ W (ʿ Ṣ W)" data-learn-more="/quran-terminology/en/roots/ayn-sad-w/" data-root-meaning="Staff, support, tool of control, and a means for gathering strength and ordering movement.">بِعَصاكَ</button>
    <button class="word-link" type="button" data-word="البَحرَ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation">البَحرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَانفَلَقَ" data-root="F L Q" data-root-meaning="falq is splitting or opening something apart. Materially it concerns producing a cleft and separating portions; in relation to morning, it concerns dawn appearing and early daylight becoming manifest. Fāliq is a splitter or opener, infalaqa expresses becoming split, and al-falaq in Sūrat Al-Falaq names daybreak." data-learn-more="/quran-terminology/en/roots/f-l-q/">فَانفَلَقَ</button>
    <button class="word-link" type="button" data-word="فَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">فَكانَ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلُّ</button>
    <button class="word-link" type="button" data-word="فِرقٍ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths">فِرقٍ</button>
    <button class="word-link" type="button" data-word="كَالطَّودِ" data-root="TT W D" data-root-note="Root study coming soon.">كَالطَّودِ</button>
    <button class="word-link" type="button" data-word="العَظيمِ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">العَظيمِ</button>
  </p>
  <p class="english-verse">Then We revealed to Moses: Strike the sea with your staff. So it split, and each part was like a great mountain.</p>
</section>
