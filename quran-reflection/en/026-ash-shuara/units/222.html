  <h2 class="ayah-title">Ash-Shuara 26:222</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَنَزَّلُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="They descend, with the subject referring to the devils in the preceding context.">تَنَزَّلُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every or all, expressing scope over what follows.">كُلِّ</button>

    <button class="word-link" type="button" data-word="أَثيمٍ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Sinful, describing the person alongside “fabricator of lies.”">أَثيمٍ</button>

  <p class="english-verse">They descend upon every sinful liar.</p>
