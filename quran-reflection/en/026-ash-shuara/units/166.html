  <h2 class="ayah-title">Ash-Shuara 26:166</h2>

    <button class="word-link" type="button" data-word="عادونَ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity.">عادونَ</button>
  </p>
  <p class="english-verse">And leave what your Lord created for you of your spouses? Rather, you are a transgressing people.</p>
