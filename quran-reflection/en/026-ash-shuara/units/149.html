  <h2 class="ayah-title">Ash-Shuara 26:149</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَنحِتونَ" data-root="N H T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-h-t/" data-root-meaning="Carving stone, wood, or another hard material." data-context="And you carve out.">وَتَنحِتونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِبالِ" data-root="J B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-b-l/" data-root-meaning="Jabal: a mountain or elevated mass; jibillah can concern a multitude or natural disposition." data-context="The mountains.">الجِبالِ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="Houses that you carve into mountains." data-learn-more="/quran-terminology/en/roots/b-y-t/">بُيوتًا</button>
    <button class="word-link" type="button" data-word="فٰرِهينَ" data-root="F R H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h2/" data-root-meaning="Skill or agility, or self-indulgent exuberance, according to context and reading." data-context="Skilfully and expertly, describing the house carvers.">فٰرِهينَ</button>
  </p>
  <p class="english-verse">And you skillfully carve houses out of the mountains.</p>
