<section class="ayah-block" id="ayah-183" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shuara 26:183</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبخَسُوا" data-root="B KH S" data-root-meaning="Reducing or giving less; especially wrongfully diminishing a due, share or value." data-learn-more="/quran-terminology/en/roots/b-kh-s/" data-context="Do not diminish people’s things or dues">تَبخَسُوا</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People, the holders of things and dues">النّاسَ</button>
    <button class="word-link" type="button" data-word="أَشياءَهُم" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God; also shayʾ: a thing or matter, plural ashyāʾ." data-context="Their things, property and associated dues">أَشياءَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعثَوا" data-root="AYN TH W (ʿ TH W)" data-learn-more="/quran-terminology/en/roots/ayn-th-w/" data-root-meaning="Engaging in corruption and disturbing sound order in a way that harms people’s rights and collective life." data-context="Do not act corruptly">تَعثَوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مُفسِدينَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order" data-context="Spreading corruption">مُفسِدينَ</button>
  </p>
  <p class="english-verse">And do not deprive people of their things, or act corruptly in the earth, spreading disorder.</p>
</section>
