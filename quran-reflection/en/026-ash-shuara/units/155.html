  <h2 class="ayah-title">Ash-Shuara 26:155</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said; Ṣāliḥ’s reply concerning the she-camel and water shares.">قالَ</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="ناقَةٌ" data-root="N W Q" data-learn-more="/quran-terminology/en/roots/n-w-q/" data-root-meaning="Nāqah means a female camel. The family also includes its plurals, training and taming camels, and some uses involving care and refinement. In the Qur’an, nāqah denotes the she-camel in Ṣāliḥ’s story." data-context="The she-camel assigned a share of water.">ناقَةٌ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَها</button>

    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَكُم</button>

    <button class="word-link" type="button" data-word="يَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day; the appointed time for the people’s water share.">يَومٍ</button>

  </p>
  <p class="english-verse">He said: This is a she-camel. She has a share of water, and you have a share of water on a known day.</p>
