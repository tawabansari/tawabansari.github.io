<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Ad-Dukhan 44:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="عُذتُ" data-root="AYN W DH (ʿ W DH)" data-learn-more="/quran-terminology/en/roots/ayn-w-dh/" data-root-meaning="Seeking refuge, taking shelter, turning toward a safe place, and coming under its protection." data-context="I have sought refuge, Moses’ words in the face of the threat.">عُذتُ</button>
    <button class="word-link" type="button" data-word="بِرَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="With my Lord, with whom Moses seeks refuge.">بِرَبّى</button>
    <button class="word-link" type="button" data-word="وَرَبِّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="And your Lord, the same Lord with whom Moses seeks refuge.">وَرَبِّكُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَرجُمونِ" data-root="R J M" data-learn-more="/quran-terminology/en/roots/r-j-m/" data-root-meaning="Pelting and targeting with stones; in other usages, threats, verbal assault, conjectural speech, and exclusion or expulsion, according to form and context." data-context="Subject me to rajm, a threat of stoning or verbal assault against which Moses seeks refuge.">تَرجُمونِ</button>
  </p>
  <p class="english-verse">I have sought refuge in my Lord and your Lord from your stoning me.</p>
