<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Ad-Dukhan 44:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَارتَقِب" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="So await; a command to await the day when the sky brings manifest smoke, rather than to produce the smoke." data-learn-more="/quran-terminology/en/roots/r-q-b/">فَارتَقِب</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day; the time of the anticipated event.">يَومَ</button>
    <button class="word-link" type="button" data-word="تَأتِى" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Brings; the action attributed to the sky concerning smoke.">تَأتِى</button>
    <button class="word-link" type="button" data-word="السَّماءُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky; the subject bringing smoke in the expression.">السَّماءُ</button>
    <button class="word-link" type="button" data-word="بِدُخانٍ" data-root="D KH N" data-learn-more="/quran-terminology/en/roots/d-kh-n/" data-root-meaning="Smoke and its rising; in other uses, darkness, the effects of smoke, and murkiness." data-context="Smoke; what the sky brings on the awaited day.">بِدُخانٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Manifest; describing the smoke.">مُبينٍ</button>
  </p>
  <p class="english-verse">So watch for the day when the sky brings a visible smoke,</p>
