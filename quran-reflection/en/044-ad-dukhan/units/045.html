  <h2 class="ayah-title">Ad-Dukhan 44:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَالمُهلِ" data-root="M H2 L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-h2-l/" data-root-meaning="Deliberateness or granting respite; muhl is molten or oil-like material in lexical explanations." data-context="Like muhl, an image of molten or thick liquid describing the food of zaqqūm.">كَالمُهلِ</button>
    <button class="word-link" type="button" data-word="يَغلى" data-root="GH L Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-l-y/" data-root-meaning="Boiling or seething." data-context="Boils, describing the food within the bellies.">يَغلى</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="البُطونِ" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="The bellies, where the food boils in the description of punishment." data-learn-more="/quran-terminology/en/roots/b-tt-n/">البُطونِ</button>
  </p>
  <p class="english-verse">Like molten metal, boiling in the bellies,</p>
