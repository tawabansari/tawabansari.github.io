<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">Ad-Dukhan 44:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَهُم</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Are they better?">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond." data-context="The people of Tubba.">قَومُ</button>
    <button class="word-link" type="button" data-word="تُبَّعٍ" data-root-note="Proper name; no root has been assigned.">تُبَّعٍ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before them.">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="أَهلَكنٰهُم" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="We destroyed them because they were offenders." data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَهلَكنٰهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, attributing wrongdoing.">كانوا</button>
    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="Those committing offenses." data-learn-more="/quran-terminology/en/roots/j-r-m/">مُجرِمينَ</button>
  </p>
  <p class="english-verse">Are they better, or the people of Tubba and those before them? We destroyed them; they were guilty.</p>
