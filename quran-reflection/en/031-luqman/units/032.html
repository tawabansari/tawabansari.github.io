<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">Luqman 31:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="غَشِيَهُم" data-root="GH SH Y" data-learn-more="/quran-terminology/en/roots/gh-sh-w/" data-root-meaning="Covering, enveloping, being surrounded, and a changed state through covering">غَشِيَهُم</button>
    <button class="word-link" type="button" data-word="مَوجٌ" data-root="M W J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-w-j/" data-root-meaning="A wave or surging movement.">مَوجٌ</button>
    <button class="word-link" type="button" data-word="كَالظُّلَلِ" data-root="Ẓ L L (Zha L L)" data-learn-more="/quran-terminology/en/roots/zha-l-l/" data-root-meaning="Shade, a covering that blocks direct exposure, casting shade, and in the verb ظَلَّ, continuing or remaining in a state.">كَالظُّلَلِ</button>
    <button class="word-link" type="button" data-word="دَعَوُا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">دَعَوُا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مُخلِصينَ" data-root="KH L Ṣ" data-learn-more="/quran-terminology/en/roots/kh-l-sad/" data-root-meaning="Separation from admixture: from purity to exclusive dedication">مُخلِصينَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="الدّينَ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God">الدّينَ</button>
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="نَجّىٰهُم" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety">نَجّىٰهُم</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="B R R" data-learn-more="/quran-terminology/en/roots/b-r-r/" data-root-meaning="Expansive goodness, upright conduct, faithfulness, beneficence, openness in good, and standing on firm moral ground.">البَرِّ</button>
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="مُقتَصِدٌ" data-root="Q SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-sad-d/" data-root-meaning="Purposeful direction; also moderation or a middle course.">مُقتَصِدٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَجحَدُ" data-root="J H D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-h-d/" data-root-meaning="Denying or repudiating, especially something known or recognized by the person denying it.">يَجحَدُ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلُّ</button>
    <button class="word-link" type="button" data-word="خَتّارٍ" data-root="KH T R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-t-r/" data-root-meaning="Treachery and grave betrayal.">خَتّارٍ</button>
    <button class="word-link" type="button" data-word="كَفورٍ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفورٍ</button>
  </p>
  <p class="english-verse">And when a wave like canopies covers them, they call upon The God, making religion sincere for Him. Then when He delivers them to land, some of them are moderate. And none rejects Our signs except everyone treacherous and ungrateful.</p>
</section>
