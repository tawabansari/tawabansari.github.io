    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَشتَرى" data-root="SH R Y" data-learn-more="/quran-terminology/en/roots/sh-r-y/" data-root-meaning="Buying, selling, exchanging, and giving up one thing in return for another">يَشتَرى</button>

    <button class="word-link" type="button" data-word="مُهينٌ" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status">مُهينٌ</button>

  <p class="english-verse">And among people is one who buys distracting talk to lead astray from the way of The God without knowledge and to take it in mockery. Those will have a humiliating punishment.</p>
