  </p>
  <p class="english-verse">O people, be mindful of your Lord and fear a day when no parent will avail his child, nor will any child avail his parent at all. Indeed, the promise of The God is true. So let not the worldly life deceive you, and let not the deceiver deceive you about The God.</p>
