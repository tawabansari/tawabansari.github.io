<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">Luqman 31:34</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عِندَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَهُ</button>
    <button class="word-link" type="button" data-word="عِلمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge; concerning the Hour.">عِلمُ</button>
    <button class="word-link" type="button" data-word="السّاعَةِ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour; here the time of resurrection.">السّاعَةِ</button>
    <button class="word-link" type="button" data-word="وَيُنَزِّلُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="And He sends down; concerning rain.">وَيُنَزِّلُ</button>
    <button class="word-link" type="button" data-word="الغَيثَ" data-root="GH Y TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-y-th/" data-root-meaning="Beneficial rain and the coming of rain." data-context="Rain; what is sent down.">الغَيثَ</button>
    <button class="word-link" type="button" data-word="وَيَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="And He knows; divine knowledge of what is in wombs.">وَيَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرحامِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Wombs; the locations stated in the expression.">الأَرحامِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَدرى" data-root="D R Y" data-learn-more="/quran-terminology/en/roots/d-r-y/" data-root-meaning="Knowing or being aware of a matter; in Form IV, informing another." data-context="Knows; negated: no person knows.">تَدرى</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="A person or self; the responsible human being in context.">نَفسٌ</button>
    <button class="word-link" type="button" data-word="ماذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">ماذا</button>
    <button class="word-link" type="button" data-word="تَكسِبُ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="It earns; the person’s future acquisition.">تَكسِبُ</button>
    <button class="word-link" type="button" data-word="غَدًا" data-root="GH D W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-d-w/" data-root-meaning="Morning or going early; ghad is tomorrow or the future." data-context="Tomorrow; the future time of earning.">غَدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَدرى" data-root="D R Y" data-learn-more="/quran-terminology/en/roots/d-r-y/" data-root-meaning="Knowing or being aware of a matter; in Form IV, informing another." data-context="Knows; negated: no person knows.">تَدرى</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="A person or self; the responsible human being in context.">نَفسٌ</button>
    <button class="word-link" type="button" data-word="بِأَىِّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَىِّ</button>
    <button class="word-link" type="button" data-word="أَرضٍ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="A land; the place of a person’s death.">أَرضٍ</button>
    <button class="word-link" type="button" data-word="تَموتُ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="It dies; the end of the person’s life.">تَموتُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; describing The God.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware; describing The God’s knowledge in the verse’s context." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرٌ</button>
  </p>
  <p class="english-verse">Indeed, with The God is knowledge of the Hour, and He sends down the rain and knows what is in the wombs. And no soul knows what it will earn tomorrow, and no soul knows in which land it will die. Indeed, The God is Knowing, Aware.</p>
</section>
