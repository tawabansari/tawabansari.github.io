<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Luqman 31:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="تُتلىٰ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another." data-context="Are recited; referring to Our signs">تُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="ءايٰتُنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs; what is recited to him">ءايٰتُنا</button>
    <button class="word-link" type="button" data-word="وَلّىٰ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Turns away; his response to the recited signs">وَلّىٰ</button>
    <button class="word-link" type="button" data-word="مُستَكبِرًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Arrogantly; his manner of turning away">مُستَكبِرًا</button>
    <button class="word-link" type="button" data-word="كَأَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَسمَعها" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Hear them; referring to the recited signs">يَسمَعها</button>
    <button class="word-link" type="button" data-word="كَأَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أُذُنَيهِ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="His two ears, in the comparison with heaviness in hearing">أُذُنَيهِ</button>
    <button class="word-link" type="button" data-word="وَقرًا" data-root="W Q R" data-learn-more="/quran-terminology/en/roots/w-q-r/" data-root-meaning="Heaviness and a load; in hearing, heaviness in the ears; in conduct and standing, dignity, grandeur, and honor." data-context="Heaviness in his two ears; comparing an arrogant response with not hearing">وَقرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبَشِّرهُ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="Then give him tidings; an ominous use of announcing news">فَبَشِّرهُ</button>
    <button class="word-link" type="button" data-word="بِعَذابٍ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Of a punishment; the subject of the tidings">بِعَذابٍ</button>
    <button class="word-link" type="button" data-word="أَليمٍ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful; describing the punishment">أَليمٍ</button>
  </p>
  <p class="english-verse">And when Our verses are recited to him, he turns away arrogantly, as though he had not heard them, as though there were heaviness in his ears. So give him tidings of a painful punishment.</p>
</section>
