  <h2 class="ayah-title">Luqman 31:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>

    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>

    <button class="word-link" type="button" data-word="أَليمٍ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being">أَليمٍ</button>
  </p>
  <p class="english-verse">And when Our verses are recited to him, he turns away arrogantly, as though he had not heard them, as though there were heaviness in his ears. So give him tidings of a painful punishment.</p>
