<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Luqman 31:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰبُنَىَّ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="My dear child, Luqmān’s affectionate address to his son.">يٰبُنَىَّ</button>
    <button class="word-link" type="button" data-word="أَقِمِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Establish, the instruction concerning ṣalāh.">أَقِمِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Ṣalāh, the first responsibility in Luqmān’s advice.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأمُر" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="And command, the instruction to enjoin right.">وَأمُر</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="Right, the subject of the command advised.">بِالمَعروفِ</button>
    <button class="word-link" type="button" data-word="وَانهَ" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="And restrain, Luqmān advising his child to forbid wrong." data-learn-more="/quran-terminology/en/roots/n-h2-y/">وَانهَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُنكَرِ" data-root="N K R" data-learn-more="/quran-terminology/en/roots/n-k-r/" data-root-meaning="Unfamiliarity, alienness, roughness, reprehensibility, denial, and being changed from a familiar and recognizable state." data-context="Wrong, what the child is told to restrain.">المُنكَرِ</button>
    <button class="word-link" type="button" data-word="وَاصبِر" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="And endure patiently, remaining steadfast through difficulty.">وَاصبِر</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَصابَكَ" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="Befalls you, what the child is told to endure.">أَصابَكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عَزمِ" data-root="AYN Z M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-z-m/" data-root-meaning="Firm resolve to carry out an action." data-context="Resolve, describing the responsibilities mentioned.">عَزمِ</button>
    <button class="word-link" type="button" data-word="الأُمورِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Matters, the responsibilities requiring resolve.">الأُمورِ</button>
  </p>
  <p class="english-verse">My dear son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over what befalls you. Indeed, that is among matters requiring resolve.</p>
</section>
