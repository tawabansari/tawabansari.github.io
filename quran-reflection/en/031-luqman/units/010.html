<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Luqman 31:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="He created; brought the heavens into being.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without; in the phrase concerning pillars you see.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="عَمَدٍ" data-root="AYN M D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-m-d/" data-root-meaning="A pillar or support; ʿamd denotes intention or deliberate action." data-context="Pillars or supports.">عَمَدٍ</button>
    <button class="word-link" type="button" data-word="تَرَونَها" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="You see them; in the description of no visible pillars.">تَرَونَها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَلقىٰ" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="And He placed in the earth.">وَأَلقىٰ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, containing mountains and living creatures.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="R S W" data-learn-more="/quran-terminology/en/roots/r-s-w/" data-root-meaning="Settling, becoming fixed, and remaining firm; establishing firmly. Qur’anic uses concern firm mountains, fixed pots, a ship coming to rest, and the time of the Hour." data-context="Firmly established mountains.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَميدَ" data-root="M Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-y-d/" data-root-meaning="Swaying or oscillating; māʾidah is a table or spread of food." data-context="It sway with you; in a construction expressing prevention.">تَميدَ</button>
    <button class="word-link" type="button" data-word="بِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكُم</button>
    <button class="word-link" type="button" data-word="وَبَثَّ" data-root="B TH TH" data-root-meaning="Dispersing, spreading and disclosing: from creatures distributed across the earth to the distress Jacob voices to The God" data-learn-more="/quran-terminology/en/roots/b-th-th/" data-context="And He dispersed throughout the earth.">وَبَثَّ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; encompassing kinds of living creatures.">كُلِّ</button>
    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="D B B" data-root-meaning="Moving, creeping and the moving creature: from ants and human footsteps to the range of living creatures, their provision and two different earthly creatures in the Qur’an" data-learn-more="/quran-terminology/en/roots/d-b-b/" data-context="A moving living creature.">دابَّةٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَنزَلنا" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="And We sent down from the sky.">وَأَنزَلنا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky, from which the water descends in this description.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Water; the water sent down.">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَنبَتنا" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed." data-context="Then We caused to grow in the earth.">فَأَنبَتنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; encompassing the kinds grown.">كُلِّ</button>
    <button class="word-link" type="button" data-word="زَوجٍ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="A kind or variety of growing things.">زَوجٍ</button>
    <button class="word-link" type="button" data-word="كَريمٍ" data-root="K R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-m/" data-root-meaning="Nobility, honor, or generosity." data-context="Good and excellent; describing the kinds grown.">كَريمٍ</button>
  </p>
  <p class="english-verse">He created the heavens without pillars that you see, and cast firm mountains into the earth lest it sway with you, and scattered in it every kind of creature. And We sent down water from the sky and caused every noble pair to grow in it.</p>
</section>
