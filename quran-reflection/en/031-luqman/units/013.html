<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Luqman 31:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="لُقمٰنُ" data-root-note="Proper name; no root has been assigned.">لُقمٰنُ</button>
    <button class="word-link" type="button" data-word="لِابنِهِ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">لِابنِهِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="يَعِظُهُ" data-root="W AYN ZH (W ʿ Ẓ)" data-learn-more="/quran-terminology/en/roots/w-ayn-zha/" data-root-meaning="Admonishing, counseling, warning, and reminding of consequences in order to make one attentive and reform conduct.">يَعِظُهُ</button>
    <button class="word-link" type="button" data-word="يٰبُنَىَّ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">يٰبُنَىَّ</button>

    <button class="word-link" type="button" data-word="تُشرِك" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">تُشرِك</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الشِّركَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">الشِّركَ</button>
    <button class="word-link" type="button" data-word="لَظُلمٌ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">لَظُلمٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمٌ</button>
  </p>
  <p class="english-verse">And when Luqman said to his son, while advising him: My dear son, do not associate partners with The God. Indeed, associating partners is a great wrong.</p>
</section>
