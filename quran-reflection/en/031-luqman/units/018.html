<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Luqman 31:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُصَعِّر" data-root="SAD AYN R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-ayn-r/" data-root-meaning="Turning the neck aside or looking away arrogantly." data-context="do not turn away disdainfully">تُصَعِّر</button>
    <button class="word-link" type="button" data-word="خَدَّكَ" data-root="KH D D" data-root-meaning="The cheek and side of the face; in other uses, a long furrow or hollow." data-context="your cheek" data-learn-more="/quran-terminology/en/roots/kh-d-d/">خَدَّكَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="from people">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَمشِ" data-root="M SH Y" data-learn-more="/quran-terminology/en/roots/m-sh-y/" data-root-meaning="Walking, stepping, moving upon the earth; and more broadly, moving forward in a path, manner, behavior, or way of life" data-context="do not walk">تَمشِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="the land">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مَرَحًا" data-root="M R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-h/" data-root-meaning="Exuberant self-indulgence or boastful behavior." data-context="exultantly">مَرَحًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="does not love">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="any; in the negation">كُلَّ</button>
    <button class="word-link" type="button" data-word="مُختالٍ" data-root="KH Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-y-l/" data-root-meaning="Mental imagery; ikhtiyāl is conceit; khayl denotes horses." data-context="conceited">مُختالٍ</button>
    <button class="word-link" type="button" data-word="فَخورٍ" data-root="F KH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-kh-r/" data-root-meaning="Boasting or taking pride; fakhkhār is fired pottery in another branch." data-context="boastful">فَخورٍ</button>
  </p>
  <p class="english-verse">And do not turn your cheek away from people, and do not walk exultantly upon the earth. Indeed, The God does not love anyone conceited and boastful.</p>
</section>
