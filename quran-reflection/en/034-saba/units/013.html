<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They made; producing the things desired for Solomon.">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="He wishes; what Solomon wanted made.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="مَحٰريبَ" data-root="H R B" data-root-meaning="War and hostile confrontation; dispossession; in the miḥrāb branch, an elevated, distinguished place." data-context="Sanctuaries or elevated chambers; structures included among the things made." data-learn-more="/quran-terminology/en/roots/h-r-b/">مَحٰريبَ</button>
    <button class="word-link" type="button" data-word="وَتَمٰثيلَ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="And statues; fashioned figures and representations.">وَتَمٰثيلَ</button>
    <button class="word-link" type="button" data-word="وَجِفانٍ" data-root="J F N" data-root-meaning="Covering and containing; jafnah is a large food bowl." data-context="And great bowls; food vessels compared to basins." data-learn-more="/quran-terminology/en/roots/j-f-n/">وَجِفانٍ</button>
    <button class="word-link" type="button" data-word="كَالجَوابِ" data-root="J B Y" data-root-meaning="gathering and bringing something together; in ijtibāʾ, choosing and setting someone or something apart." data-context="Like large basins; comparing the food bowls’ size and capacity, not referring to answers." data-learn-more="/quran-terminology/en/roots/j-b-y/">كَالجَوابِ</button>
    <button class="word-link" type="button" data-word="وَقُدورٍ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="And cooking pots; large cooking vessels among the things made.">وَقُدورٍ</button>
    <button class="word-link" type="button" data-word="راسِيٰتٍ" data-root="R S W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-s-w/" data-root-meaning="Becoming firmly settled; anchoring or coming to rest." data-context="Firmly set; describing pots standing securely in place.">راسِيٰتٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="اعمَلوا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Work; an instruction to David’s household to act gratefully.">اعمَلوا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="Household; David’s family.">ءالَ</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="Proper name; no root has been assigned.">داوۥدَ</button>
    <button class="word-link" type="button" data-word="شُكرًا" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="Gratefully; acting in gratitude and appreciation.">شُكرًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَقَليلٌ" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="And few; describing the number of deeply grateful servants.">وَقَليلٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِىَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="My servants; those belonging to the divine speaker.">عِبادِىَ</button>
    <button class="word-link" type="button" data-word="الشَّكورُ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="Deeply grateful; describing a servant who gives thanks.">الشَّكورُ</button>
  </p>
  <p class="english-verse">They made for him whatever he wished of sanctuaries, statues, bowls like reservoirs, and firmly set cauldrons. Work in gratitude, family of David. And few of My servants are grateful.</p>
</section>
