  <h2 class="ayah-title">Saba 34:14</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="دَلَّهُم" data-root="D L L" data-learn-more="/quran-terminology/en/roots/d-l-l/" data-root-meaning="From showing the way to a sign through which something is known" data-context="Indicated to them; within negation and exception, revealing the death.">دَلَّهُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَوتِهِ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="His death; Solomon’s death, previously hidden from them.">مَوتِهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="دابَّةُ" data-root="D B B" data-root-meaning="Moving, creeping and the moving creature: from ants and human footsteps to the range of living creatures, their provision and two different earthly creatures in the Qur’an" data-learn-more="/quran-terminology/en/roots/d-b-b/" data-context="A creature; the being eating Solomon’s staff.">دابَّةُ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, in the expression “a creature of the earth.”">الأَرضِ</button>
    <button class="word-link" type="button" data-word="تَأكُلُ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Eats; the creature eating the staff.">تَأكُلُ</button>
    <button class="word-link" type="button" data-word="مِنسَأَتَهُ" data-root="N S A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-s-a/" data-root-meaning="Postponing; nasīʾ concerns shifting sacred-month observance; minsaʾah is a staff." data-context="His staff; Solomon’s support, which the creature was eating.">مِنسَأَتَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="خَرَّ" data-root="KH R R" data-root-meaning="Falling down and moving downward; in other lexical branches, flowing and its sound." data-context="He fell; Solomon’s body falling after his death and the damage to his staff." data-learn-more="/quran-terminology/en/roots/kh-r-r/">خَرَّ</button>
    <button class="word-link" type="button" data-word="تَبَيَّنَتِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Became clear; the matter becoming evident to the jinn after the fall.">تَبَيَّنَتِ</button>
    <button class="word-link" type="button" data-word="الجِنُّ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The jinn; those whose lack of knowledge of the unseen becomes evident.">الجِنُّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>

    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were; with yaʿlamūna in the hypothetical condition of knowing the unseen.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knew; knowledge of the unseen posited hypothetically.">يَعلَمونَ</button>
    <button class="word-link" type="button" data-word="الغَيبَ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="The unseen; what remained beyond the jinn’s knowledge.">الغَيبَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَبِثوا" data-root="L B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-th/" data-root-meaning="Staying or remaining for a period or in a place." data-context="Would have remained; negated by mā in the consequence of the condition.">لَبِثوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; the suffering in which the jinn remained.">العَذابِ</button>
    <button class="word-link" type="button" data-word="المُهينِ" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status" data-context="Humiliating; describing the punishment mentioned.">المُهينِ</button>
  </p>
  <p class="english-verse">Then when We decreed death for him, nothing indicated his death to them except a creature of the earth eating his staff. Then when he fell, it became clear to the jinn that, had they known the unseen, they would not have remained in the humiliating punishment.</p>
</section>
