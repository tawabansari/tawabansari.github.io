<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We gave; granting David favour.">ءاتَينا</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="Proper name; no root has been assigned.">داوۥدَ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="فَضلًا" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="Favour; a special grant to David.">فَضلًا</button>
    ۖ
    <button class="word-link" type="button" data-word="يٰجِبالُ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; directly addressed to join David." data-learn-more="/quran-terminology/en/roots/j-b-l/">يٰجِبالُ</button>
    <button class="word-link" type="button" data-word="أَوِّبى" data-root="A W B" data-learn-more="/quran-terminology/en/roots/a-w-b/" data-root-meaning="Returning and bringing back; awwāb: one who repeatedly returns or turns toward; maʾāb: return or a place of return." data-context="Return with him; the command for mountains to join David, explained through glorification.">أَوِّبى</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="وَالطَّيرَ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record." data-context="And the birds; alongside mountains in the verse’s address.">وَالطَّيرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَلَنّا" data-root="L Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-y-n/" data-root-meaning="Softness or becoming gentle; līnah denotes a kind of date palm, variously explained." data-context="And We softened; making iron soft for David.">وَأَلَنّا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="الحَديدَ" data-root="H D D" data-root-meaning="Boundary and limit; prevention, sharpness, and cutting." data-context="Iron; what was softened for David." data-learn-more="/quran-terminology/en/roots/h-d-d/">الحَديدَ</button>
  </p>
  <p class="english-verse">And We certainly gave David bounty from Us: O mountains, echo with him, and the birds too. And We softened iron for him,</p>
</section>
