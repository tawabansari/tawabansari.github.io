<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَعرَضوا" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="Then they turned away, the response of Sabaʾ’s people to the blessing and the call to gratitude.">فَأَعرَضوا</button>
    <button class="word-link" type="button" data-word="فَأَرسَلنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Then We sent, referring to sending the flood upon them.">فَأَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="سَيلَ" data-root="S Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-l/" data-root-meaning="Flowing or causing to flow; sayl is a flood or abundant watercourse." data-context="The flood, the abundant flow of water sent upon them.">سَيلَ</button>
    <button class="word-link" type="button" data-word="العَرِمِ" data-root="AYN R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-m/" data-root-meaning="Force or unruliness; ʿarim in Sabaʾ is explained in connection with a powerful flood or dam." data-context="ʿArim, a description or name associated with the flood; early explanations connect it with the flood’s force, a dam, or a watercourse.">العَرِمِ</button>
    <button class="word-link" type="button" data-word="وَبَدَّلنٰهُم" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning." data-context="And We substituted for them, giving two other gardens in place of their former ones.">وَبَدَّلنٰهُم</button>
    <button class="word-link" type="button" data-word="بِجَنَّتَيهِم" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="In place of their two gardens, the former gardens of Sabaʾ’s people.">بِجَنَّتَيهِم</button>
    <button class="word-link" type="button" data-word="جَنَّتَينِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="Two gardens, the replacements with the produce and vegetation described next.">جَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="ذَواتَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذَواتَى</button>
    <button class="word-link" type="button" data-word="أُكُلٍ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Edible produce or fruit, what the two replacement gardens yielded.">أُكُلٍ</button>
    <button class="word-link" type="button" data-word="خَمطٍ" data-root="KH M TT" data-root-meaning="In botanical usage, a kind of tree or bitter, undesirable produce; elsewhere, changes in flavor and smell, skinning, and roaring or forceful movement." data-context="A kind of plant produce, whose tree or quality is variously identified in the lexicons; here, produce of Sabaʾ’s replacement gardens." data-learn-more="/quran-terminology/en/roots/kh-m-tt/">خَمطٍ</button>
    <button class="word-link" type="button" data-word="وَأَثلٍ" data-root="A TH L" data-learn-more="/quran-terminology/en/roots/a-th-l/" data-root-meaning="and tamarisk trees; a tree resembling ṭarfāʾ, with useful wood, forming part of the vegetation of Sabaʾ’s replacement gardens in this verse." data-context="And athl or tamarisk trees, part of the replacement gardens’ vegetation.">وَأَثلٍ</button>
    <button class="word-link" type="button" data-word="وَشَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="And some, here a quantity of lote trees.">وَشَىءٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سِدرٍ" data-root="S D R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-d-r/" data-root-meaning="The lote tree, or sidr." data-context="Lote trees, present in a small quantity among the replacement gardens’ vegetation.">سِدرٍ</button>
    <button class="word-link" type="button" data-word="قَليلٍ" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="Little, qualifying the quantity of lote trees in the replacement gardens.">قَليلٍ</button>
  </p>
  <p class="english-verse">But they turned away, so We sent upon them the flood of the dam, and exchanged their two gardens for two gardens bearing bitter fruit, tamarisks, and a few lote trees.</p>
</section>
