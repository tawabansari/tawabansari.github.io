<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Have they not looked: a call to consider the heaven and earth around them.">يَرَوا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="In bayna aydīhim, before them.">بَينَ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands; in bayna aydīhim, expresses what lies before them.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="خَلفَهُم" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Behind them, in contrast with what lies before them.">خَلفَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Heaven, part of the expanse they are called to consider.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth, together with heaven forming their surroundings.">وَالأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="نَشَأ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="We will; in the conditional clause, makes the consequence dependent on divine will.">نَشَأ</button>
    <button class="word-link" type="button" data-word="نَخسِف" data-root="KH S F" data-root-meaning="Sinking or being made to sink into the earth; of the moon, diminished or disappearing light." data-context="We cause them to be swallowed by the earth if We will: the response to the condition." data-learn-more="/quran-terminology/en/roots/kh-s-f/">نَخسِف</button>
    <button class="word-link" type="button" data-word="بِهِمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, the place of sinking in one of the two possibilities presented.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="نُسقِط" data-root="S Q TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-q-tt/" data-root-meaning="Falling or causing to fall." data-context="Cause to fall: here, fragments from heaven upon them.">نُسقِط</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="كِسَفًا" data-root="K S F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-s-f/" data-root-meaning="A piece or fragment." data-context="Pieces or fragments from heaven, distinct from khasf, causing to sink.">كِسَفًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Heaven, from which the falling fragments in this warning are described as coming.">السَّماءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Surely a sign, for a servant who turns back and pays attention.">لَـٔايَةً</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="For every: extends the sign to every servant who turns back.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="عَبدٍ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="A servant, a person in a relation of service to the Lord.">عَبدٍ</button>
    <button class="word-link" type="button" data-word="مُنيبٍ" data-root="N W B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-w-b/" data-root-meaning="Repeated return; inābah is returning or turning toward." data-context="Turning back: a servant who turns toward the Lord.">مُنيبٍ</button>
  </p>
  <p class="english-verse">Have they not looked at what is before them and behind them of heaven and earth? If We will, We can make the earth swallow them, or cause pieces of the sky to fall upon them. Indeed, in that is a sign for every servant who turns back.</p>
</section>
