    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>

    <button class="word-link" type="button" data-word="ءايَةٌ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايَةٌ</button>

    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">غَفورٌ</button>

  <p class="english-verse">There was certainly a sign for Sheba in their dwelling place: two gardens, on the right and the left. Eat of your Lord’s provision and be grateful to Him. A good land and a forgiving Lord.</p>
