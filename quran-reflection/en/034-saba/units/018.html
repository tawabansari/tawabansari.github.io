<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="We established, concerning settlements between the regions.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between them, locating the settlements.">بَينَهُم</button>
    <button class="word-link" type="button" data-word="وَبَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between, connecting the place to the blessed settlements.">وَبَينَ</button>
    <button class="word-link" type="button" data-word="القُرَى" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="The settlements endowed with blessing.">القُرَى</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="بٰرَكنا" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="The settlements We had blessed, described in the account of travel routes." data-learn-more="/quran-terminology/en/roots/b-r-k/">بٰرَكنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="قُرًى" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="Settlements along the intervening route.">قُرًى</button>
    <button class="word-link" type="button" data-word="ظٰهِرَةً" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support" data-context="Visible or apparent, describing the settlements.">ظٰهِرَةً</button>
    <button class="word-link" type="button" data-word="وَقَدَّرنا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="We apportioned, concerning traveling stages.">وَقَدَّرنا</button>
    <button class="word-link" type="button" data-word="فيهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهَا</button>
    <button class="word-link" type="button" data-word="السَّيرَ" data-root="S Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-r/" data-root-meaning="Traveling or moving along a course; sīrah denotes a way or condition." data-context="Travel or passage along the route.">السَّيرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="سيروا" data-root="S Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-r/" data-root-meaning="Traveling or moving along a course; sīrah denotes a way or condition." data-context="Travel, an instruction to journey.">سيروا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="لَيالِىَ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Nights, one of the traveling times.">لَيالِىَ</button>
    <button class="word-link" type="button" data-word="وَأَيّامًا" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Days, alongside nights.">وَأَيّامًا</button>
    <button class="word-link" type="button" data-word="ءامِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="In safety, describing the travelers.">ءامِنينَ</button>
  </p>
  <p class="english-verse">And between them and the towns We had blessed, We placed visible towns and measured the journey between them: Travel through them by night and day in safety.</p>
</section>
