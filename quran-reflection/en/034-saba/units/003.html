<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said: reporting the deniers’ statement.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved: those denying the Hour’s coming.">كَفَروا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَأتينَا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes to us: the coming of the Hour denied in their claim.">تَأتينَا</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour: the time of resurrection and reckoning.">السّاعَةُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say: an instruction to answer the denial.">قُل</button>
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَلىٰ</button>
    <button class="word-link" type="button" data-word="وَرَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="By my Lord: emphasizing the Hour’s coming.">وَرَبّى</button>
    <button class="word-link" type="button" data-word="لَتَأتِيَنَّكُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="It will certainly come to you: affirming the Hour’s occurrence.">لَتَأتِيَنَّكُم</button>
    <button class="word-link" type="button" data-word="عٰلِمِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knower: describing the Lord’s knowledge.">عٰلِمِ</button>
    <button class="word-link" type="button" data-word="الغَيبِ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="The unseen: what is hidden from human sight and knowledge.">الغَيبِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعزُبُ" data-root="AYN Z B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-z-b/" data-root-meaning="Being distant or hidden from awareness or reach." data-context="Does not escape: nothing lies beyond His knowledge.">يَعزُبُ</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُ</button>
    <button class="word-link" type="button" data-word="مِثقالُ" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="The weight of: even a tiny particle’s amount does not escape His knowledge." data-learn-more="/quran-terminology/en/roots/th-q-l/">مِثقالُ</button>
    <button class="word-link" type="button" data-word="ذَرَّةٍ" data-root="DH R R" data-learn-more="/quran-terminology/en/roots/dh-r-r/" data-root-meaning="Dharrah: perceptible smallness; dhurriyyah: descendants and the question of origin" data-context="A tiny particle, illustrating a minute amount.">ذَرَّةٍ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens, within the scope of divine knowledge.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, where nothing escapes His knowledge.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَصغَرُ" data-root="SAD GH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-gh-r/" data-root-meaning="Smallness; ṣaghār denotes humiliation or subjection." data-context="Smaller: even less than the particle’s amount.">أَصغَرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Larger: even more than the particle’s amount.">أَكبَرُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="كِتٰبٍ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="A record comprehensively registering matters.">كِتٰبٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Clear: describing the record.">مُبينٍ</button>
  </p>
  <p class="english-verse">And those who disbelieved said: The Hour will not come to us. Say: Yes, by my Lord, the Knower of the unseen, it will surely come to you. Not the weight of a particle in the heavens or the earth escapes Him, nor anything smaller or greater, except that it is in a clear Book,</p>
</section>
