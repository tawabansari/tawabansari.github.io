<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the day when gathering and questioning occur.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يَحشُرُهُم" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="He gathers them all before questioning the angels." data-learn-more="/quran-terminology/en/roots/h-sh-r/">يَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="All together, emphasizing the gathering’s scope.">جَميعًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He says, addressing the angels.">يَقولُ</button>
    <button class="word-link" type="button" data-word="لِلمَلٰئِكَةِ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="To the angels, who are questioned.">لِلمَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="أَهٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَهٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="إِيّاكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِيّاكُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to, asking about past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعبُدونَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worshipped, the subject of the question to the angels.">يَعبُدونَ</button>
  </p>
  <p class="english-verse">And on the day He gathers them all, then says to the angels: Was it you these people used to worship?</p>
</section>
