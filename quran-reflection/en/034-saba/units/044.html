<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Saba 34:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="ءاتَينٰهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We have not given them; denying the grant of books for study.">ءاتَينٰهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُتُبٍ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="Books; texts whose grant to this audience is denied.">كُتُبٍ</button>
    <button class="word-link" type="button" data-word="يَدرُسونَها" data-root="D R S" data-learn-more="/quran-terminology/en/roots/d-r-s/" data-root-meaning="Studying and rereading a text; in another branch, wearing away and fading traces." data-context="They study them; the pronoun refers to books that had not been given to them.">يَدرُسونَها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="We have not sent; denying a warner sent to them before the addressee.">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="قَبلَكَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before you; earlier than the prophet addressed.">قَبلَكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="نَذيرٍ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="A warner; a messenger warning about consequences.">نَذيرٍ</button>
  </p>
  <p class="english-verse">And We have not given them books which they study, nor sent them any warner before you.</p>
