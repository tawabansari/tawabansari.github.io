<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rahman 55:54</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="W K A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-a/" data-root-meaning="Leaning or reclining on a support." data-context="Reclining, describing those resting on the bedding.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="فُرُشٍ" data-root="F R SH" data-learn-more="/quran-terminology/en/roots/f-r-sh/" data-root-meaning="Spreading out, laying down, preparing a surface, and making a field suitable for settling, resting, living, or moving" data-context="Bedding whose linings are of rich brocade.">فُرُشٍ</button>
    <button class="word-link" type="button" data-word="بَطائِنُها" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="The bedding’s linings, described as being of rich brocade." data-learn-more="/quran-terminology/en/roots/b-tt-n/">بَطائِنُها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="إِستَبرَقٍ" data-context="Istabraq: heavy brocade." data-root-note="Word study coming soon; no root has been assigned.">إِستَبرَقٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَجَنَى" data-root="J N Y" data-root-meaning="Picking and gathering a yield from its source; Qur’anic uses concern pickable fruit and fruit fresh or ready for gathering." data-context="And fruit ready to be picked, the accessible produce of the two gardens." data-learn-more="/quran-terminology/en/roots/j-n-y/">وَجَنَى</button>
    <button class="word-link" type="button" data-word="الجَنَّتَينِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The two gardens whose fruit is close at hand.">الجَنَّتَينِ</button>
    <button class="word-link" type="button" data-word="دانٍ" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Near and accessible, describing the two gardens’ fruit.">دانٍ</button>
  </p>
  <p class="english-verse">They recline on couches whose linings are of heavy brocade, and the fruit of the two gardens is within reach.</p>
</section>
