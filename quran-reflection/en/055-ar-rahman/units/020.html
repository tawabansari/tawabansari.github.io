<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rahman 55:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between the two bodies of water whose meeting is mentioned in the preceding verse.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="بَرزَخٌ" data-root="B R Z KH" data-root-meaning="A limit, interval, or barrier between things or conditions; its nature and whether passage is possible depend on context." data-context="A barrier between the meeting bodies of water, which do not transgress the stated limit." data-learn-more="/quran-terminology/en/roots/b-r-z-kh/" data-root-note="Consonants used to index the word; its historical derivation and possible borrowing remain disputed.">بَرزَخٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَبغِيانِ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="With lā: the two do not transgress the stated limit; the verb refers to both bodies of water.">يَبغِيانِ</button>
  </p>
  <p class="english-verse">between them is a barrier they do not overstep.</p>
