<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rahman 55:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَبقىٰ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="Remains, the Lord’s wajh continuing against creatures passing away." data-learn-more="/quran-terminology/en/roots/b-q-y/">وَيَبقىٰ</button>
    <button class="word-link" type="button" data-word="وَجهُ" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh" data-context="Wajh, in this divine description, requiring interpretation in relation to the Lord rather than establishing a bodily organ.">وَجهُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, whose continuance is contrasted with passing away.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ذُو" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذُو</button>
    <button class="word-link" type="button" data-word="الجَلٰلِ" data-root="J L L" data-root-meaning="Greatness, magnitude, and majesty; in other Arabic branches, covering and encompassing." data-context="Majesty, the Lord’s greatness." data-learn-more="/quran-terminology/en/roots/j-l-l/">الجَلٰلِ</button>
    <button class="word-link" type="button" data-word="وَالإِكرامِ" data-root="K R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-m/" data-root-meaning="Nobility, honor, or generosity." data-context="And honor, the dignity and honoring expressed in the divine description.">وَالإِكرامِ</button>
  </p>
  <p class="english-verse">and the face of your Lord, possessed of majesty and honor, remains.</p>
</section>
