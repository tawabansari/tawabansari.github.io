<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rahman 55:76</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُتَّكِـٔينَ" data-root="W K A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-a/" data-root-meaning="Leaning or reclining on a support.">مُتَّكِـٔينَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="رَفرَفٍ" data-root="R F R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-f-r-f/" data-root-meaning="Spreading or gentle fluttering; rafraf in descriptions of blessing denotes decorated spreads or cushions.">رَفرَفٍ</button>
    <button class="word-link" type="button" data-word="خُضرٍ" data-root="KH DAD R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-dad-r/" data-root-meaning="The color green and the greening of plants or land.">خُضرٍ</button>
    <button class="word-link" type="button" data-word="وَعَبقَرِىٍّ" data-root="AYN B Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-b-q-r/" data-root-meaning="Something outstanding or fine; ʿabqarī Qurʾanically denotes fine furnishings.">وَعَبقَرِىٍّ</button>
    <button class="word-link" type="button" data-word="حِسانٍ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">حِسانٍ</button>
  </p>
  <p class="english-verse">They recline on green cushions and beautiful, fine carpets.</p>
