<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rahman 55:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth: the realm set in place here for created beings, whose fruit and plants are mentioned in the following verses.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَضَعَها" data-root="W DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dad-ayn/" data-root-meaning="Putting or setting down; childbirth; īḍāʿ denotes hurrying onward." data-context="He set it in place: providing the earth for created beings, without the verb itself specifying its geometrical shape or private ownership.">وَضَعَها</button>
    <button class="word-link" type="button" data-word="لِلأَنامِ" data-root="A N M" data-learn-more="/quran-terminology/en/roots/a-n-m/" data-root-meaning="Anām collectively names created beings, especially those living on or associated with the earth." data-context="For created beings: those for whom the earth has been set in place. Humans and jinn are prominent in context, while the broader reading also includes other earthly living beings.">لِلأَنامِ</button>
  </p>
  <p class="english-verse">He laid out the earth for the creatures.</p>
</section>
