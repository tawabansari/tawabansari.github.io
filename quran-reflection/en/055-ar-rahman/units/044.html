<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rahman 55:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَطوفونَ" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="They circulate: they move between the fire referred to and scalding water.">يَطوفونَ</button>
    <button class="word-link" type="button" data-word="بَينَها" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between it: the fire referred to in context is one side of the movement.">بَينَها</button>
    <button class="word-link" type="button" data-word="وَبَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="And between: connecting the other side of the movement to scalding water.">وَبَينَ</button>
    <button class="word-link" type="button" data-word="حَميمٍ" data-root="H M M" data-root-meaning="In the heat branch, warm or intensely hot water; in the closeness branch, an intimate friend or relative; in the darkness branch, charcoal and dense black smoke." data-context="Scalding water: the noun modified by ānin, rather than a close friend." data-learn-more="/quran-terminology/en/roots/h-m-m/">حَميمٍ</button>
    <button class="word-link" type="button" data-word="ءانٍ" data-root="A N Y" data-learn-more="/quran-terminology/en/roots/a-n-y/" data-root-meaning="The arrival of a time, portions of time, deliberation and delay, and reaching readiness or a limit." data-context="Having reached an extreme of heat: describing the scalding water, rather than meaning late or waiting.">ءانٍ</button>
  </p>
  <p class="english-verse">They will go round between it and intensely boiling water.</p>
</section>
