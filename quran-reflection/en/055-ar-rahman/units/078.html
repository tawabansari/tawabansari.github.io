<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rahman 55:78</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَبٰرَكَ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="Exalted and abounding in blessing is your Lord’s name; here “name” is the grammatical subject." data-learn-more="/quran-terminology/en/roots/b-r-k/">تَبٰرَكَ</button>
    <button class="word-link" type="button" data-word="اسمُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Your Lord’s name, the grammatical subject of tabāraka in this verse.">اسمُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, whose name is praised.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ذِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذِى</button>
    <button class="word-link" type="button" data-word="الجَلٰلِ" data-root="J L L" data-root-meaning="Greatness, magnitude, and majesty; in other Arabic branches, covering and encompassing." data-context="Majesty, in the description Possessor of majesty." data-learn-more="/quran-terminology/en/roots/j-l-l/">الجَلٰلِ</button>
    <button class="word-link" type="button" data-word="وَالإِكرامِ" data-root="K R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-m/" data-root-meaning="Nobility, honor, or generosity." data-context="Honor or generosity, alongside majesty.">وَالإِكرامِ</button>
  </p>
  <p class="english-verse">Blessed is the name of your Lord, possessed of majesty and honor.</p>
</section>
