  <h2 class="ayah-title">Ar-Rahman 55:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Created; concerning human creation from ṣalṣāl.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being whose creation is reported in this verse.">الإِنسٰنَ</button>

    <button class="word-link" type="button" data-word="صَلصٰلٍ" data-root="SAD L SAD L" data-root-meaning="A clear, resonant, sometimes repeated sound; ṣalṣāl denotes dried clay that produces such a sound on impact." data-context="Dried, sounding clay compared with pottery in condition or resonance; the comparison does not establish that the material was fired." data-learn-more="/quran-terminology/en/roots/sad-l-sad-l/">صَلصٰلٍ</button>

  <p class="english-verse">He created the human being from ringing clay, like pottery,</p>
