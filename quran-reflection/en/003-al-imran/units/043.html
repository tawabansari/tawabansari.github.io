  <h2 class="ayah-title">Al-Imran 3:43</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰمَريَمُ" data-root-note="Proper name; no root has been assigned.">يٰمَريَمُ</button>
    <button class="word-link" type="button" data-word="اقنُتى" data-root="Q N T" data-learn-more="/quran-terminology/en/roots/q-n-t/" data-root-meaning="From obedience and commitment to steadfastness in worship">اقنُتى</button>
    <button class="word-link" type="button" data-word="لِرَبِّكِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">لِرَبِّكِ</button>
    <button class="word-link" type="button" data-word="وَاسجُدى" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank">وَاسجُدى</button>

  </p>
  <p class="english-verse">Mary, be devoted to your Lord, prostrate, and bow with those who bow.</p>
