<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:107</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ابيَضَّت" data-root="B Y DAD" data-root-meaning="B Y Ḍ fundamentally denotes whiteness as a colour characteristic, from which descriptions of being white and verbs of becoming white derive. Bayḍah names a bird’s egg, assigned to this family in early Arabic and extended to similes and resembling objects." data-context="Have become white, describing the faces of those in mercy." data-learn-more="/quran-terminology/en/roots/b-y-dad/">ابيَضَّت</button>
    <button class="word-link" type="button" data-word="وُجوهُهُم" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh" data-context="Their faces.">وُجوهُهُم</button>
    <button class="word-link" type="button" data-word="فَفى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَفى</button>
    <button class="word-link" type="button" data-word="رَحمَةِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="The mercy and care of The God.">رَحمَةِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place" data-context="Abiding and remaining in that mercy.">خٰلِدونَ</button>
  </p>
  <p class="english-verse">As for those whose faces turn white, they will be in The God’s mercy, remaining in it.</p>
</section>
