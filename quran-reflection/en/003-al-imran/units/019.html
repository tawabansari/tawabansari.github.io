<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الدّينَ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God">الدّينَ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الإِسلٰمُ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender">الإِسلٰمُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَا</button>
    <button class="word-link" type="button" data-word="اختَلَفَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">اختَلَفَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">أوتُوا</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="جاءَهُمُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَهُمُ</button>
    <button class="word-link" type="button" data-word="العِلمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">العِلمُ</button>
    <button class="word-link" type="button" data-word="بَغيًا" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit">بَغيًا</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَكفُر" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">يَكفُر</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="سَريعُ" data-root="S R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-ayn/" data-root-meaning="Speed or haste, as opposed to slowness.">سَريعُ</button>
    <button class="word-link" type="button" data-word="الحِسابِ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">الحِسابِ</button>
  </p>
  <p class="english-verse">Indeed, religion with The God is submission. Those given the Book differed only after knowledge came to them, through mutual transgression. Whoever disbelieves in the signs of The God—indeed, The God is swift in reckoning.</p>
</section>
