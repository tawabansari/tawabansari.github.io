<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:46</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="The people to whom Jesus speaks.">النّاسَ</button>

    <button class="word-link" type="button" data-word="المَهدِ" data-root="M H2 D" data-root-meaning="Preparing and making a place or conditions suitable for settling, living, or acting; mahd and mihad denote a cradle, bed, or prepared place." data-context="Jesus’s cradle in infancy, contrasted with maturity." data-learn-more="/quran-terminology/en/roots/m-h2-d/">المَهدِ</button>

    <button class="word-link" type="button" data-word="الصّٰلِحينَ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="The righteous and those acting rightly.">الصّٰلِحينَ</button>

  <p class="english-verse">He will speak to people in the cradle and in maturity, and will be among the righteous.</p>
