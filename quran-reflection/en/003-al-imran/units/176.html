<section class="ayah-block" id="ayah-176" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:176</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَحزُنكَ" data-root="Ḥ Z N" data-learn-more="/quran-terminology/en/roots/h-z-n/" data-root-meaning="Grief, heaviness of the heart, and the inner path becoming rough and difficult">يَحزُنكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُسٰرِعونَ" data-root="S R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-ayn/" data-root-meaning="Speed or haste, as opposed to slowness.">يُسٰرِعونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الكُفرِ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">الكُفرِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="يَضُرُّوا" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion">يَضُرُّوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَيـًٔا</button>
    ۗ
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="يَجعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">يَجعَلَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="حَظًّا" data-root="H ZHA ZHA" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-zha-zha/" data-root-meaning="A share, portion, or allotment.">حَظًّا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">الـٔاخِرَةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمٌ</button>
  </p>
  <p class="english-verse">Do not let those who hasten into disbelief grieve you. They will not harm The God at all. The God intends to give them no share in the Hereafter, and theirs is a great punishment.</p>
</section>
