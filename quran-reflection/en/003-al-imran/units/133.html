  <h2 class="ayah-title">Al-Imran 3:133</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>

  <p class="english-verse">Hasten toward forgiveness from your Lord and a garden as wide as the heavens and the earth, prepared for the mindful:</p>
