<section class="ayah-block" id="ayah-191" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:191</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَذكُرونَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="They remember; remembering The God in different bodily positions.">يَذكُرونَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قِيٰمًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Standing; one of the positions of remembrance.">قِيٰمًا</button>
    <button class="word-link" type="button" data-word="وَقُعودًا" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="And sitting; another position of remembrance.">وَقُعودًا</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="جُنوبِهِم" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="Their sides; among the bodily positions in which they remember The God." data-learn-more="/quran-terminology/en/roots/j-n-b/">جُنوبِهِم</button>
    <button class="word-link" type="button" data-word="وَيَتَفَكَّرونَ" data-root="F K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-k-r/" data-root-meaning="Thinking or reflection in pursuit of understanding." data-context="And they reflect; considering the creation of the heavens and earth.">وَيَتَفَكَّرونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="خَلقِ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Creation; the bringing into being of the heavens and earth.">خَلقِ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; in the expression concerning their creation with the earth.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; alongside the heavens as the subject of reflection on creation.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord; the prayerful address of those reflecting.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="خَلَقتَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="You created; addressing the Lord concerning this creation.">خَلَقتَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="بٰطِلًا" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="In vain; the description denied of creation.">بٰطِلًا</button>
    <button class="word-link" type="button" data-word="سُبحٰنَكَ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Glory be to You; declaring the Lord free from purposelessness.">سُبحٰنَكَ</button>
    <button class="word-link" type="button" data-word="فَقِنا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="So protect us; asking to be guarded against the Fire’s punishment.">فَقِنا</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; that from which protection is requested.">عَذابَ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="The Fire; in the expression concerning its punishment.">النّارِ</button>
  </p>
  <p class="english-verse">those who remember The God standing, sitting, and on their sides, and reflect on the creation of the heavens and the earth: “Our Lord, You did not create this in vain. Glory be to You; protect us from the punishment of the Fire.</p>
</section>
