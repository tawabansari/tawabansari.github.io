<section class="ayah-block" id="ayah-193" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:193</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord, addressed in the believers’ prayer.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="إِنَّنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّنا</button>
    <button class="word-link" type="button" data-word="سَمِعنا" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="We heard the call to faith.">سَمِعنا</button>
    <button class="word-link" type="button" data-word="مُنادِيًا" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="A caller summoning to faith." data-learn-more="/quran-terminology/en/roots/n-d-y/">مُنادِيًا</button>
    <button class="word-link" type="button" data-word="يُنادى" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="Calling, the caller’s summons to faith." data-learn-more="/quran-terminology/en/roots/n-d-y/">يُنادى</button>
    <button class="word-link" type="button" data-word="لِلإيمٰنِ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="To faith, the caller’s summons.">لِلإيمٰنِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="ءامِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believe, the call’s content.">ءامِنوا</button>
    <button class="word-link" type="button" data-word="بِرَبِّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="In your Lord, the object of belief.">بِرَبِّكُم</button>
    <button class="word-link" type="button" data-word="فَـٔامَنّا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="So we believed, responding to the call.">فَـٔامَنّا</button>
    ۚ
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord, addressed in the request for forgiveness.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="فَاغفِر" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="So forgive, the request concerning sins.">فَاغفِر</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    <button class="word-link" type="button" data-word="ذُنوبَنا" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share." data-context="Our sins, for which forgiveness is sought.">ذُنوبَنا</button>
    <button class="word-link" type="button" data-word="وَكَفِّر" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="And remove or expiate the misdeeds.">وَكَفِّر</button>
    <button class="word-link" type="button" data-word="عَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنّا</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِنا" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Our misdeeds or wrongful acts.">سَيِّـٔاتِنا</button>
    <button class="word-link" type="button" data-word="وَتَوَفَّنا" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense" data-context="And take us in death at life’s end.">وَتَوَفَّنا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="الأَبرارِ" data-root="B R R" data-learn-more="/quran-terminology/en/roots/b-r-r/" data-root-meaning="Expansive goodness, upright conduct, faithfulness, beneficence, openness in good, and standing on firm moral ground." data-context="The righteous, whose company is requested.">الأَبرارِ</button>
  </p>
  <p class="english-verse">Our Lord, we heard a caller calling to faith: ‘Believe in your Lord,’ and we believed. Our Lord, forgive our sins, remove our misdeeds, and take us with the righteous.</p>
</section>
