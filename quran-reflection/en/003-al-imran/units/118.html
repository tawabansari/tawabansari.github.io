<section class="ayah-block" id="ayah-118" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:118</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="You have believed: the verse addresses believers.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَتَّخِذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="In lā tattakhidhū: do not take or appoint as intimates of your affairs.">تَتَّخِذوا</button>
    <button class="word-link" type="button" data-word="بِطانَةً" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="An intimate admitted to private affairs and the circle of trust." data-learn-more="/quran-terminology/en/roots/b-tt-n/">بِطانَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِكُم" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="From outside your circle, concerning people whose harmful conduct the verse then describes.">دونِكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَألونَكُم" data-root="A L W" data-learn-more="/quran-terminology/en/roots/a-l-w/" data-root-meaning="Effort and falling short: carrying out or neglecting an undertaking in relation to ability and the effort applied." data-context="In lā yaʾlūnakum khabālan: they spare no effort to harm you and corrupt your affairs.">يَألونَكُم</button>
    <button class="word-link" type="button" data-word="خَبالًا" data-root="KH B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-b-l/" data-root-meaning="Harm, corruption, and disorder." data-context="Harmful ruin and disorder: what they spare no effort to bring upon you.">خَبالًا</button>
    <button class="word-link" type="button" data-word="وَدّوا" data-root="W D D" data-learn-more="/quran-terminology/en/roots/w-d-d/" data-root-meaning="Wadda: affection, wanting, and wishing something to happen" data-context="They desire and wish for the addressees’ hardship.">وَدّوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عَنِتُّم" data-root="AYN N T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-t/" data-root-meaning="Hardship, distress, or causing difficulty." data-context="Your hardship and distress, which the group under discussion desires.">عَنِتُّم</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="بَدَتِ" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="Has become apparent: hostility emerging in their speech.">بَدَتِ</button>
    <button class="word-link" type="button" data-word="البَغضاءُ" data-root="B GH DAD" data-root-meaning="B GH Ḍ denotes aversion or hatred toward someone or something, opposite attraction and love. Baghḍāʾ expresses the intensity of this aversion, which may exist inwardly, appear in words and conduct, and affect relations among people or groups." data-context="Hatred and hostility made apparent in their words." data-learn-more="/quran-terminology/en/roots/b-gh-dad/">البَغضاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَفوٰهِهِم" data-root="F W H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-w-h2/" data-root-meaning="The mouth or mouths." data-context="Their mouths: the words through which their hostility has become apparent.">أَفوٰهِهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تُخفى" data-root="KH F Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-f-y/" data-root-meaning="Being hidden or concealing; some forms and readings carry the sense of revealing." data-context="Conceals: the hostility their breasts keep hidden.">تُخفى</button>
    <button class="word-link" type="button" data-word="صُدورُهُم" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="Their breasts: the inward hostility they conceal.">صُدورُهُم</button>
    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Is greater: their concealed hostility exceeds what has become apparent.">أَكبَرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="بَيَّنّا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="We have made clear: explaining the signs to the addressees.">بَيَّنّا</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The signs made clear for the addressees’ understanding and judgment.">الـٔايٰتِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="If you are: part of the conditional expression in kuntum taʿqilūn.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ʿ Q L (Ayn Q L)" data-learn-more="/quran-terminology/en/roots/ayn-q-l/" data-root-meaning="Tying, restraining, understanding, connecting meaning, and holding judgment back from scattering" data-context="You reason: applying understanding to the signs made clear.">تَعقِلونَ</button>
  </p>
  <p class="english-verse">You who believe, do not take as intimates those outside yourselves who spare no effort to corrupt you and wish for your hardship. Hatred has appeared from their mouths, and what their breasts conceal is greater. We have made the signs clear to you, if you reason.</p>
</section>
