<section class="ayah-block" id="ayah-148" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:148</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَـٔاتىٰهُمُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="then gave them">فَـٔاتىٰهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ثَوابَ" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="reward">ثَوابَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="the present world">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَحُسنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="and goodness">وَحُسنَ</button>
    <button class="word-link" type="button" data-word="ثَوابِ" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="reward">ثَوابِ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="the Hereafter">الـٔاخِرَةِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="loves">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="those who do good">المُحسِنينَ</button>
  </p>
  <p class="english-verse">So The God gave them the reward of this world and the excellence of the reward of the Hereafter. The God loves those who do good.</p>
</section>
