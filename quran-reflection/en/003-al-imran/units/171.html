<section class="ayah-block" id="ayah-171" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:171</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَستَبشِرونَ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">يَستَبشِرونَ</button>
    <button class="word-link" type="button" data-word="بِنِعمَةٍ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">بِنِعمَةٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَفَضلٍ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party.">وَفَضلٍ</button>
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُضيعُ" data-root="Ḍ Y ʿ" data-learn-more="/quran-terminology/en/roots/dad-y-ayn/" data-root-meaning="Loss, neglect and letting something go to waste: from an abandoned right or responsibility to faith, deeds and reward preserved with The God">يُضيعُ</button>
    <button class="word-link" type="button" data-word="أَجرَ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">أَجرَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">المُؤمِنينَ</button>
  </p>
  <p class="english-verse">They rejoice in favor and bounty from The God, and that The God does not let the believers’ reward be lost.</p>
</section>
