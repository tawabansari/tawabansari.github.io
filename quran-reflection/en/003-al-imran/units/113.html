<section class="ayah-block" id="ayah-113" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:113</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَيسوا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَيسوا</button>
    <button class="word-link" type="button" data-word="سَواءً" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Equal or alike: the verse opens by denying that all the People of the Book are alike.">سَواءً</button>
    ۗ
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَهلِ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="People or members: in “People of the Book,” a community associated with scripture.">أَهلِ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="Scripture, in the designation “People of the Book.”">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="A community: a group among the People of the Book described by what follows.">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="قائِمَةٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Upright and steadfast: describing the community whose recitation and prostration follow.">قائِمَةٌ</button>
    <button class="word-link" type="button" data-word="يَتلونَ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another." data-context="They recite: they read the signs in sequence.">يَتلونَ</button>
    <button class="word-link" type="button" data-word="ءايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Signs or verses: what is recited here.">ءايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ءاناءَ" data-root="A N Y" data-learn-more="/quran-terminology/en/roots/a-n-y/" data-root-meaning="The arrival of a time, portions of time, deliberation and delay, and reaching readiness or a limit." data-context="Portions or hours of the night: the time of recitation, without fixing a number of hours or requiring the whole night.">ءاناءَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="The night: the time during which that community recites the signs.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَسجُدونَ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="They prostrate: the community’s humble prostration in the verse’s closing description.">يَسجُدونَ</button>
  </p>
  <p class="english-verse">They are not alike. Among the People of the Book is an upright community, reciting The God’s signs during the hours of the night and prostrating.</p>
</section>
