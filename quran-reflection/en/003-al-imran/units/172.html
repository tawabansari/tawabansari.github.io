<section class="ayah-block" id="ayah-172" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:172</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="استَجابوا" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/">استَجابوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="وَالرَّسولِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَالرَّسولِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَصابَهُمُ" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place">أَصابَهُمُ</button>
    <button class="word-link" type="button" data-word="القَرحُ" data-root="Q R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-h/" data-root-meaning="A wound or suffering from injury.">القَرحُ</button>
    ۚ
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="أَحسَنوا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">أَحسَنوا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="وَاتَّقَوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">وَاتَّقَوا</button>
    <button class="word-link" type="button" data-word="أَجرٌ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">أَجرٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمٌ</button>
  </p>
  <p class="english-verse">Those who responded to The God and the messenger after wounds had struck them—for those among them who did good and were mindful is a great reward.</p>
</section>
