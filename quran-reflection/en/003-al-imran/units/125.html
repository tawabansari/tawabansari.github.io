<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:125</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَلىٰ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="تَصبِروا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">تَصبِروا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="وَيَأتوكُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَيَأتوكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَورِهِم" data-root="F W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-w-r/" data-root-meaning="Boiling or surging; fawr denotes immediacy or the initial moment.">فَورِهِم</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="يُمدِدكُم" data-root="M D D" data-learn-more="/quran-terminology/en/roots/m-d-d/" data-root-meaning="Stretching, extending, continuing, granting respite, adding support, and opening a wider field">يُمدِدكُم</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="بِخَمسَةِ" data-root="KH M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-m-s/" data-root-meaning="Five and related numerical forms, including fifty and one-fifth.">بِخَمسَةِ</button>
    <button class="word-link" type="button" data-word="ءالٰفٍ" data-root="ʾ L F" data-learn-more="/quran-terminology/en/roots/a-l-f/" data-root-meaning="Allafa: joining, becoming familiar, and establishing affinity and companionship">ءالٰفٍ</button>

    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="مُسَوِّمينَ" data-root="S W M" data-learn-more="/quran-terminology/en/roots/s-w-m/" data-root-meaning="Sending forth, placing under exposure, continual imposition, and marking for distinction">مُسَوِّمينَ</button>
  </p>
  <p class="english-verse">Yes, if you are patient and mindful, and they come upon you in this sudden rush, your Lord will reinforce you with five thousand marked angels.</p>
