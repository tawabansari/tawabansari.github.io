<section class="ayah-block" id="ayah-147" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:147</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was, introducing what they said.">كانَ</button>
    <button class="word-link" type="button" data-word="قَولَهُم" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Their speech and words.">قَولَهُم</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said.">قالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنَا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord.">رَبَّنَا</button>
    <button class="word-link" type="button" data-word="اغفِر" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgive and pardon wrongdoing.">اغفِر</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    <button class="word-link" type="button" data-word="ذُنوبَنا" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share." data-context="Our sins.">ذُنوبَنا</button>
    <button class="word-link" type="button" data-word="وَإِسرافَنا" data-root="S R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-f/" data-root-meaning="Exceeding a measure or limit; excess." data-context="And our excess.">وَإِسرافَنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَمرِنا" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Our affairs and conduct.">أَمرِنا</button>
    <button class="word-link" type="button" data-word="وَثَبِّت" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="And make our feet firm." data-learn-more="/quran-terminology/en/roots/th-b-t/">وَثَبِّت</button>
    <button class="word-link" type="button" data-word="أَقدامَنا" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="Our feet and footing.">أَقدامَنا</button>
    <button class="word-link" type="button" data-word="وَانصُرنا" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="And help us.">وَانصُرنا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="The people and group being confronted." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. Qawm denotes a people, group, or community with a shared connection.">القَومِ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Those disbelieving and rejecting.">الكٰفِرينَ</button>
  </p>
  <p class="english-verse">Their words were only: “Our Lord, forgive us our sins and our excesses in our affairs, make our feet firm, and help us against the disbelieving people.”</p>
</section>
