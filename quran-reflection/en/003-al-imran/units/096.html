<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:96</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="First, in the sequence of establishing a house for people.">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="بَيتٍ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="The house established for people." data-learn-more="/quran-terminology/en/roots/b-y-t/">بَيتٍ</button>
    <button class="word-link" type="button" data-word="وُضِعَ" data-root="W DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dad-ayn/" data-root-meaning="Putting or setting down; childbirth; īḍāʿ denotes hurrying onward." data-context="Was established, a passive verb concerning the house.">وُضِعَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="For people, those for whom the house was established.">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="لَلَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَلَّذى</button>
    <button class="word-link" type="button" data-word="بِبَكَّةَ" data-root-note="Proper name; no root has been assigned.">بِبَكَّةَ</button>
    <button class="word-link" type="button" data-word="مُبارَكًا" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="The house endowed with good and blessing, alongside its description as guidance for all peoples." data-learn-more="/quran-terminology/en/roots/b-r-k/">مُبارَكًا</button>
    <button class="word-link" type="button" data-word="وَهُدًى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guidance, alongside the house’s blessedness.">وَهُدًى</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="For all peoples, the stated reach of the guidance.">لِلعٰلَمينَ</button>
  </p>
  <p class="english-verse">The first House established for people is the one at Bakkah, blessed and a guidance for all worlds.</p>
</section>
