<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:101</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَيفَ</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">تَكفُرونَ</button>
    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="تُتلىٰ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another.">تُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="ءايٰتُ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَفيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفيكُم</button>
    <button class="word-link" type="button" data-word="رَسولُهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رَسولُهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَعتَصِم" data-root="AYN SAD M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-m/" data-root-meaning="Protecting or preventing harm; iʿtiṣām means holding firmly to.">يَعتَصِم</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَد</button>
    <button class="word-link" type="button" data-word="هُدِىَ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">هُدِىَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="Ṣ R Ṭ" data-learn-more="/quran-terminology/en/roots/s-r-t/" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">مُستَقيمٍ</button>
  </p>
  <p class="english-verse">How can you disbelieve when The God’s signs are recited to you and His messenger is among you? Whoever holds firmly to The God has been guided to a straight path.</p>
</section>
