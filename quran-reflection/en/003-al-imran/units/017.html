<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الصّٰبِرينَ" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">الصّٰبِرينَ</button>
    <button class="word-link" type="button" data-word="وَالصّٰدِقينَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">وَالصّٰدِقينَ</button>
    <button class="word-link" type="button" data-word="وَالقٰنِتينَ" data-root="Q N T" data-learn-more="/quran-terminology/en/roots/q-n-t/" data-root-meaning="From obedience and commitment to steadfastness in worship">وَالقٰنِتينَ</button>
    <button class="word-link" type="button" data-word="وَالمُنفِقينَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">وَالمُنفِقينَ</button>
    <button class="word-link" type="button" data-word="وَالمُستَغفِرينَ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">وَالمُستَغفِرينَ</button>
    <button class="word-link" type="button" data-word="بِالأَسحارِ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn">بِالأَسحارِ</button>
  </p>
  <p class="english-verse">The patient, the truthful, the devoted, those who spend, and those who seek forgiveness before dawn.</p>
</section>
