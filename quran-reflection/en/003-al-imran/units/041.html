<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Zechariah said.">قالَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord; Zechariah’s address.">رَبِّ</button>
    <button class="word-link" type="button" data-word="اجعَل" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Appoint for me.">اجعَل</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لى</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="A sign for Zechariah.">ءايَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="The answer to Zechariah’s request.">قالَ</button>
    <button class="word-link" type="button" data-word="ءايَتُكَ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Your sign.">ءايَتُكَ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="تُكَلِّمَ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="Speak to people; used in a negative construction.">تُكَلِّمَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="The people whom Zechariah would address.">النّاسَ</button>
    <button class="word-link" type="button" data-word="ثَلٰثَةَ" data-root="TH L TH" data-root-meaning="Three and its related forms: a count of three, third position, one-third and two-thirds, and distribution in threes." data-context="Three days during which Zechariah’s sign is not speaking except by gesture." data-learn-more="/quran-terminology/en/roots/th-l-th/">ثَلٰثَةَ</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Days; the unit of the three-day period.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="رَمزًا" data-root="R M Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-m-z/" data-root-meaning="Signaling by gesture without explicit speech." data-context="By gesture instead of ordinary speech.">رَمزًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاذكُر" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Remember; the instruction to remember the Lord.">وَاذكُر</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Abundantly; describing remembrance of the Lord.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="وَسَبِّح" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Declare Him free of imperfection.">وَسَبِّح</button>
    <button class="word-link" type="button" data-word="بِالعَشِىِّ" data-root="AYN SH W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sh-w/" data-root-meaning="Late day or evening; ʿashw denotes dim sight or turning a blind eye." data-context="In the latter part of the day and evening.">بِالعَشِىِّ</button>
    <button class="word-link" type="button" data-word="وَالإِبكٰرِ" data-root="B K R" data-learn-more="/quran-terminology/en/roots/b-k-r/" data-root-meaning="From the beginning of the day and coming early to remaining in the first stage." data-context="In the early morning.">وَالإِبكٰرِ</button>
  </p>
  <p class="english-verse">He said: My Lord, appoint a sign for me. He said: Your sign is that you will not speak to people for three days except by gesture. Remember your Lord much, and glorify Him in the evening and early morning.</p>
</section>
