<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:54</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَكَروا" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context.">وَمَكَروا</button>
    <button class="word-link" type="button" data-word="وَمَكَرَ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context.">وَمَكَرَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرُ</button>
    <button class="word-link" type="button" data-word="المٰكِرينَ" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context.">المٰكِرينَ</button>
  </p>
  <p class="english-verse">They devised a plan, and The God devised a plan; and The God is the best of planners.</p>
</section>
