<section class="ayah-block" id="ayah-181" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:181</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَقَد</button>
    <button class="word-link" type="button" data-word="سَمِعَ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Has heard; hearing the statement of those identified next.">سَمِعَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="قَولَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="The statement attributed to its speakers.">قَولَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said; reporting their claim about God and themselves.">قالوا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="فَقيرٌ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity." data-context="Poor and needy; the speakers’ allegation about God, without endorsing it.">فَقيرٌ</button>
    <button class="word-link" type="button" data-word="وَنَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَنَحنُ</button>
    <button class="word-link" type="button" data-word="أَغنِياءُ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting." data-context="Rich and self-sufficient; the speakers’ claim about themselves.">أَغنِياءُ</button>
    ۘ
    <button class="word-link" type="button" data-word="سَنَكتُبُ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="We will record; writing down the speech and deeds mentioned.">سَنَكتُبُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said; the speech that will be recorded.">قالوا</button>
    <button class="word-link" type="button" data-word="وَقَتلَهُمُ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="And their killing; the killing of prophets attributed to this group in the verse.">وَقَتلَهُمُ</button>
    <button class="word-link" type="button" data-word="الأَنبِياءَ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The prophets whose wrongful killing is mentioned.">الأَنبِياءَ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without; in “without right.”">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="حَقٍّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Right or just warrant; absent from this killing.">حَقٍّ</button>
    <button class="word-link" type="button" data-word="وَنَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And We will say; introducing the command to taste punishment.">وَنَقولُ</button>
    <button class="word-link" type="button" data-word="ذوقوا" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="Taste; experience the punishment mentioned.">ذوقوا</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; the searing penalty they are told to taste.">عَذابَ</button>
    <button class="word-link" type="button" data-word="الحَريقِ" data-root="H R Q" data-root-meaning="Burning and setting alight; fire and intense heat; and, in an early use, abrading and wearing away." data-context="Burning fire; in “the punishment of burning,” a searing punishment." data-learn-more="/quran-terminology/en/roots/h-r-q/">الحَريقِ</button>
  </p>
  <p class="english-verse">The God has heard the words of those who said, “The God is poor, and we are rich.” We will record what they said and their killing of the prophets without right, and We will say, “Taste the punishment of burning.”</p>
</section>
