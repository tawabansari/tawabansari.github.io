<section class="ayah-block" id="ayah-197" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:197</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَتٰعٌ" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="Temporary enjoyment and benefit.">مَتٰعٌ</button>
    <button class="word-link" type="button" data-word="قَليلٌ" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="Few or little, expressing small quantity.">قَليلٌ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="مَأوىٰهُم" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="An abode, dwelling, or place of refuge, without necessarily implying safety or comfort." data-context="Their abode, Hell.">مَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="And how evil it is, expressing condemnation of this place.">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المِهادُ" data-root="M H2 D" data-root-meaning="Preparing and making a place or conditions suitable for settling, living, or acting; mahd and mihad denote a cradle, bed, or prepared place." data-context="A resting place or bed, here a condemned abode." data-learn-more="/quran-terminology/en/roots/m-h2-d/">المِهادُ</button>
  </p>
  <p class="english-verse">A little enjoyment; then their refuge is Hell. What a wretched resting place.</p>
</section>
