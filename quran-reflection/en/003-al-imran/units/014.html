<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="زُيِّنَ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="has been made attractive">زُيِّنَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="for people">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="حُبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="love of">حُبُّ</button>
    <button class="word-link" type="button" data-word="الشَّهَوٰتِ" data-root="SH H2 W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h2-w/" data-root-meaning="A strong desire or appetite for something." data-context="desirable things">الشَّهَوٰتِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="women">النِّساءِ</button>
    <button class="word-link" type="button" data-word="وَالبَنينَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole; also sons, children and descendants in lineage usage." data-context="and sons">وَالبَنينَ</button>
    <button class="word-link" type="button" data-word="وَالقَنٰطيرِ" data-root="Q N Ṭ R" data-root-meaning="Qinṭār: a large weight unit whose value varied across historical systems; in Qur’anic usage, a substantial amount of wealth or property." data-context="and great quantities of wealth" data-learn-more="/quran-terminology/en/roots/q-n-tt-r/">وَالقَنٰطيرِ</button>
    <button class="word-link" type="button" data-word="المُقَنطَرَةِ" data-root="Q N Ṭ R" data-root-meaning="Qinṭār: a large weight unit whose value varied across historical systems; in Qur’anic usage, a substantial amount of wealth or property." data-context="heaped up" data-learn-more="/quran-terminology/en/roots/q-n-tt-r/">المُقَنطَرَةِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الذَّهَبِ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-context="gold" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach; dhahab is also the noun for gold; its connection with going should be explained cautiously.">الذَّهَبِ</button>
    <button class="word-link" type="button" data-word="وَالفِضَّةِ" data-root="F DAD DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-dad-dad/" data-root-meaning="Breaking apart or dispersing; fiḍḍah is silver." data-context="and silver">وَالفِضَّةِ</button>
    <button class="word-link" type="button" data-word="وَالخَيلِ" data-root="KH Y L" data-learn-more="/quran-terminology/en/roots/kh-y-l/" data-root-meaning="The appearance or conception of something in the mind or before the eyes; movement accompanied by display. Specific derivatives denote horses, producing an impression, and arrogant ostentation." data-context="and horses">وَالخَيلِ</button>
    <button class="word-link" type="button" data-word="المُسَوَّمَةِ" data-root="S W M" data-learn-more="/quran-terminology/en/roots/s-w-m/" data-root-meaning="Sending forth, placing under exposure, continual imposition, and marking for distinction" data-context="marked or well-bred">المُسَوَّمَةِ</button>
    <button class="word-link" type="button" data-word="وَالأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing; also livestock and grazing animals in anʿām." data-context="and livestock">وَالأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="وَالحَرثِ" data-root="Ḥ R TH (H R TH)" data-learn-more="/quran-terminology/en/roots/h-r-th/" data-root-meaning="Purposeful work, preparing a bed, nurturing, and awaiting yield" data-context="and cultivated land">وَالحَرثِ</button>
    ۗ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مَتٰعُ" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="enjoyment">مَتٰعُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="life">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="the present world">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عِندَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَهُ</button>
    <button class="word-link" type="button" data-word="حُسنُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="goodness">حُسنُ</button>
    <button class="word-link" type="button" data-word="المَـٔابِ" data-root="A W B" data-learn-more="/quran-terminology/en/roots/a-w-b/" data-root-meaning="Returning and bringing back; awwāb: one who repeatedly returns or turns toward; maʾāb: return or a place of return." data-context="return and destination">المَـٔابِ</button>
  </p>
  <p class="english-verse">Love of desired things has been adorned for people: women, sons, amassed heaps of gold and silver, marked horses, livestock, and cultivated land. That is the enjoyment of worldly life; with The God is the best return.</p>
</section>
