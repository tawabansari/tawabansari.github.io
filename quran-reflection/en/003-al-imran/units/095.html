<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:95</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>
    <button class="word-link" type="button" data-word="صَدَقَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">صَدَقَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="فَاتَّبِعوا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">فَاتَّبِعوا</button>
    <button class="word-link" type="button" data-word="مِلَّةَ" data-root="M L L" data-learn-more="/quran-terminology/en/roots/m-l-l/" data-root-meaning="Dictation and millah: two uses and their historical relationship">مِلَّةَ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="حَنيفًا" data-root="Ḥ N F" data-learn-more="/quran-terminology/en/roots/h-n-f/" data-root-meaning="Ḥanīf: turning toward The God alone and away from shirk, with attention to inclination and the limits of historical evidence">حَنيفًا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">المُشرِكينَ</button>
  </p>
  <p class="english-verse">Say, “The God has spoken the truth. So follow the way of Abraham, upright; he was not among those who associate partners.”</p>
</section>
