  <h2 class="ayah-title">Al-Imran 3:188</h2>

    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="أَتَوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">أَتَوا</button>
    <button class="word-link" type="button" data-word="وَيُحِبّونَ" data-root="H B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-root-meaning="Ḥubb: love or affection; ḥabb and ḥabbah: grain or a seed. These branches are not interchangeable.">وَيُحِبّونَ</button>

  </p>
  <p class="english-verse">Do not think that those who rejoice in what they have done and love to be praised for what they have not done—do not think they will escape the punishment. Theirs is a painful punishment.</p>
