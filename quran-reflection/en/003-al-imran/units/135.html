<section class="ayah-block" id="ayah-135" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:135</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="فَعَلوا" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action">فَعَلوا</button>
    <button class="word-link" type="button" data-word="فٰحِشَةً" data-root="F H SH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-h-sh/" data-root-meaning="Gross indecency in conduct or speech.">فٰحِشَةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظَلَموا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="ذَكَرُوا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">ذَكَرُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="فَاستَغفَروا" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">فَاستَغفَروا</button>
    <button class="word-link" type="button" data-word="لِذُنوبِهِم" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share.">لِذُنوبِهِم</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَغفِرُ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">يَغفِرُ</button>
    <button class="word-link" type="button" data-word="الذُّنوبَ" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share.">الذُّنوبَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَم</button>
    <button class="word-link" type="button" data-word="يُصِرّوا" data-root="SAD R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-r/" data-root-meaning="Binding tightly or persisting; ṣirr is severe cold; ṣarrah is a cry or clamor.">يُصِرّوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فَعَلوا" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action">فَعَلوا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمونَ</button>
  </p>
  <p class="english-verse">And those who, when they commit an indecency or wrong themselves, remember The God and ask forgiveness for their sins—and who forgives sins except The God?—and do not knowingly persist in what they have done.</p>
</section>
