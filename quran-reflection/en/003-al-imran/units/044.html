  <h2 class="ayah-title">Al-Imran 3:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَنباءِ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="Among the accounts of the unseen concerning Mary’s story.">أَنباءِ</button>
    <button class="word-link" type="button" data-word="الغَيبِ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="Matters hidden from the addressee’s direct observation, conveyed through revelation.">الغَيبِ</button>
    <button class="word-link" type="button" data-word="نوحيهِ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="We reveal those accounts of the unseen to you.">نوحيهِ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You were not present with them when they cast their pens.">كُنتَ</button>
    <button class="word-link" type="button" data-word="لَدَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدَيهِم</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="يُلقونَ" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="They cast their pens to determine who would take charge of Mary.">يُلقونَ</button>
    <button class="word-link" type="button" data-word="أَقلٰمَهُم" data-root="Q L M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-l-m/" data-root-meaning="Trimming; qalam is a writing pen." data-context="Their pens, cast in determining Mary’s guardianship.">أَقلٰمَهُم</button>
    <button class="word-link" type="button" data-word="أَيُّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَيُّهُم</button>
    <button class="word-link" type="button" data-word="يَكفُلُ" data-root="K F L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-f-l/" data-root-meaning="Responsibility or guarantee; kifl is a share or portion." data-context="Would undertake Mary’s care and guardianship.">يَكفُلُ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="Proper name; no root has been assigned.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>

    <button class="word-link" type="button" data-word="لَدَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدَيهِم</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="يَختَصِمونَ" data-root="KH SAD M" data-root-meaning="Two parties confronting and disputing over a claim, right, or contested issue; khasm denotes a party to the dispute." data-context="They disputed with one another over Mary’s guardianship." data-learn-more="/quran-terminology/en/roots/kh-sad-m/">يَختَصِمونَ</button>
  </p>
  <p class="english-verse">This is news of the unseen which We reveal to you. You were not with them when they cast their pens to decide which of them would care for Mary, nor were you with them when they disputed.</p>
