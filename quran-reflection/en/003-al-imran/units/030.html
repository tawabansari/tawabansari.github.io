<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>
    <button class="word-link" type="button" data-word="تَجِدُ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception">تَجِدُ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلُّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">نَفسٍ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عَمِلَت" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">عَمِلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خَيرٍ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٍ</button>
    <button class="word-link" type="button" data-word="مُحضَرًا" data-root="Ḥ Ḍ R" data-learn-more="/quran-terminology/en/roots/h-dad-r/" data-root-meaning="Presence, arrival, proximity, and bringing into presence: from everyday life to confronting deeds in the Hereafter">مُحضَرًا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="عَمِلَت" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">عَمِلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">سوءٍ</button>
    <button class="word-link" type="button" data-word="تَوَدُّ" data-root="W D D" data-learn-more="/quran-terminology/en/roots/w-d-d/" data-root-meaning="Wadda: affection, wanting, and wishing something to happen">تَوَدُّ</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="بَينَها" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَها</button>
    <button class="word-link" type="button" data-word="وَبَينَهُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">وَبَينَهُ</button>
    <button class="word-link" type="button" data-word="أَمَدًا" data-root="A M D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-m-d/" data-root-meaning="A period or stretch of time considered in relation to its limit or endpoint.">أَمَدًا</button>
    <button class="word-link" type="button" data-word="بَعيدًا" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعيدًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَيُحَذِّرُكُمُ" data-root="Ḥ DH R" data-learn-more="/quran-terminology/en/roots/h-dh-r/" data-root-meaning="Caution, alertness before danger, conscious fear of harm, practical readiness, and protective vigilance before damage occurs">وَيُحَذِّرُكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="نَفسَهُ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">نَفسَهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="رَءوفٌ" data-root="R A F" data-learn-more="/quran-terminology/en/roots/r-a-f/" data-root-meaning="Compassion and raʾūf: tenderness, kindness and consideration for another, from human feeling to descriptions of The God and the Prophet in the Qur’an">رَءوفٌ</button>
    <button class="word-link" type="button" data-word="بِالعِبادِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">بِالعِبادِ</button>
  </p>
  <p class="english-verse">The day every soul finds present whatever good it has done; as for the evil it has done, it wishes there were a great distance between itself and it. The God warns you of Himself, and The God is compassionate toward the servants.</p>
</section>
