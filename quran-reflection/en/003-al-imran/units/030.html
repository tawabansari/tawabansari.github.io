<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day each person confronts their deeds: the scene of reckoning and deeds being brought forth.">يَومَ</button>
    <button class="word-link" type="button" data-word="تَجِدُ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="Finds: each person finds the good they have done present before them.">تَجِدُ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every: the statement encompasses every person.">كُلُّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Each person, the self confronting its own deeds.">نَفسٍ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عَمِلَت" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="What the person has done of good: their own actions.">عَمِلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خَيرٍ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="The good the person has done and finds brought before them.">خَيرٍ</button>
    <button class="word-link" type="button" data-word="مُحضَرًا" data-root="Ḥ Ḍ R" data-learn-more="/quran-terminology/en/roots/h-dad-r/" data-root-meaning="Presence, arrival, proximity, and bringing into presence: from everyday life to confronting deeds in the Hereafter" data-context="Brought forth and made present: the good deed is before the person who performed it.">مُحضَرًا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="عَمِلَت" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="What the person has done of evil: their own wrongdoing.">عَمِلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="The evil or wrongdoing from which the person wishes to be far removed.">سوءٍ</button>
    <button class="word-link" type="button" data-word="تَوَدُّ" data-root="W D D" data-learn-more="/quran-terminology/en/roots/w-d-d/" data-root-meaning="Wadda: affection, wanting, and wishing something to happen" data-context="Wishes: desires a great interval between themselves and the evil deed.">تَوَدُّ</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="بَينَها" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between the person: one side of the desired interval is the person themselves.">بَينَها</button>
    <button class="word-link" type="button" data-word="وَبَينَهُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="And it: in the base reading, the evil deed; another reading refers to the Day of Reckoning.">وَبَينَهُ</button>
    <button class="word-link" type="button" data-word="أَمَدًا" data-root="A M D" data-learn-more="/quran-terminology/en/roots/a-m-d/" data-root-meaning="A limit or endpoint reached by a distance or extent; temporally, a duration or interval measured with reference to a beginning, an end, or an anticipated point." data-context="The interval the person wishes would separate them from their evil deed; its great remoteness comes from baʿīdan.">أَمَدًا</button>
    <button class="word-link" type="button" data-word="بَعيدًا" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="Far distant: describes the interval the person desires.">بَعيدًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَيُحَذِّرُكُمُ" data-root="Ḥ DH R" data-learn-more="/quran-terminology/en/roots/h-dh-r/" data-root-meaning="Caution, alertness before danger, conscious fear of harm, practical readiness, and protective vigilance before damage occurs" data-context="And warns you: The God cautions the addressees concerning Himself.">وَيُحَذِّرُكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="نَفسَهُ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Himself: in “warns you of Himself,” the pronoun refers to The God.">نَفسَهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="رَءوفٌ" data-root="R A F" data-learn-more="/quran-terminology/en/roots/r-a-f/" data-root-meaning="Compassion and raʾūf: tenderness, kindness and consideration for another, from human feeling to descriptions of The God and the Prophet in the Qur’an" data-context="Kind and compassionate toward His servants: a description of The God at the verse’s close.">رَءوفٌ</button>
    <button class="word-link" type="button" data-word="بِالعِبادِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Toward His servants: those toward whom The God’s kindness is expressed.">بِالعِبادِ</button>
  </p>
  <p class="english-verse">The day every soul finds present whatever good it has done; as for the evil it has done, it wishes there were a great distance between itself and it. The God warns you of Himself, and The God is compassionate toward the servants.</p>
</section>
