<section class="ayah-block" id="ayah-134" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:134</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">يُنفِقونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّرّاءِ" data-root="S R R" data-learn-more="/quran-terminology/en/roots/s-r-r/" data-root-meaning="Secrets and Hidden Matters, Joy and Ease, and Places of Rest">السَّرّاءِ</button>
    <button class="word-link" type="button" data-word="وَالضَّرّاءِ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion">وَالضَّرّاءِ</button>
    <button class="word-link" type="button" data-word="وَالكٰظِمينَ" data-root="K ZHA M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-zha-m/" data-root-meaning="Holding in or suppressing, especially anger or grief.">وَالكٰظِمينَ</button>
    <button class="word-link" type="button" data-word="الغَيظَ" data-root="GH Y ZHA" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-y-zha/" data-root-meaning="Intense anger or fury.">الغَيظَ</button>
    <button class="word-link" type="button" data-word="وَالعافينَ" data-root="ʿ F W" data-learn-more="/quran-terminology/en/roots/ayn-f-w/" data-root-meaning="Passing over pursuit of a fault, lifting censure, effacing a trace, and what remains beyond need">وَالعافينَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-root-meaning="Ḥubb: love or affection; ḥabb and ḥabbah: grain or a seed. These branches are not interchangeable.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">المُحسِنينَ</button>
  </p>
  <p class="english-verse">those who spend in ease and hardship, restrain anger, and pardon people. The God loves those who do good.</p>
</section>
