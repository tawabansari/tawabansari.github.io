<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:120</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="تَمسَسكُم" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy">تَمسَسكُم</button>
    <button class="word-link" type="button" data-word="حَسَنَةٌ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">حَسَنَةٌ</button>
    <button class="word-link" type="button" data-word="تَسُؤهُم" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">تَسُؤهُم</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُصِبكُم" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place">تُصِبكُم</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="يَفرَحوا" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context.">يَفرَحوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَصبِروا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">تَصبِروا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَضُرُّكُم" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion">يَضُرُّكُم</button>
    <button class="word-link" type="button" data-word="كَيدُهُم" data-root="K Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-y-d/" data-root-meaning="Planning or subtle strategy; its evaluation depends on context.">كَيدُهُم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَيـًٔا</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="مُحيطٌ" data-root="Ḥ W Ṭ (H W TT)" data-learn-more="/quran-terminology/en/roots/h-w-tt/" data-root-meaning="To surround, encompass, take something from all sides, enclose it fully; and in some uses, to guard, watch over, or besiege">مُحيطٌ</button>
  </p>
  <p class="english-verse">If good touches you, it grieves them; if harm befalls you, they rejoice in it. If you are patient and mindful, their scheming will not harm you at all. The God encompasses what they do.</p>
</section>
