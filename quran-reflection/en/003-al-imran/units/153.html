<section class="ayah-block" id="ayah-153" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:153</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="تُصعِدونَ" data-root="SAD AYN D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-ayn-d/" data-root-meaning="Ascending or moving onward; ṣaʿīd is the earth&#x27;s surface or soil." data-context="You were moving away; in the battle scene.">تُصعِدونَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَلوۥنَ" data-root="L W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-w-y/" data-root-meaning="Twisting or bending; in speech, distortion or evasion." data-context="You turn toward or attend; negated here: you attended to no one.">تَلوۥنَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَحَدٍ" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="Anyone; in the negated statement of attending to others.">أَحَدٍ</button>
    <button class="word-link" type="button" data-word="وَالرَّسولُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And the messenger; the one calling you.">وَالرَّسولُ</button>
    <button class="word-link" type="button" data-word="يَدعوكُم" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="He calls you; the messenger addressing the addressees.">يَدعوكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أُخرىٰكُم" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="At your rear; the messenger’s position while calling.">أُخرىٰكُم</button>
    <button class="word-link" type="button" data-word="فَأَثٰبَكُم" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="So He recompensed you; here with grief.">فَأَثٰبَكُم</button>
    <button class="word-link" type="button" data-word="غَمًّا" data-root="GH M M" data-learn-more="/quran-terminology/en/roots/gh-m-m/" data-root-meaning="Covering and enveloping; cloud, ambiguity, and grief or pressure that surrounds a human being." data-context="Grief; what followed the addressees’ conduct.">غَمًّا</button>
    <button class="word-link" type="button" data-word="بِغَمٍّ" data-root="GH M M" data-learn-more="/quran-terminology/en/roots/gh-m-m/" data-root-meaning="Covering and enveloping; cloud, ambiguity, and grief or pressure that surrounds a human being." data-context="With grief; in the expression of grief upon grief.">بِغَمٍّ</button>
    <button class="word-link" type="button" data-word="لِكَيلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِكَيلا</button>
    <button class="word-link" type="button" data-word="تَحزَنوا" data-root="Ḥ Z N" data-learn-more="/quran-terminology/en/roots/h-z-n/" data-root-meaning="Grief, heaviness of the heart, and the inner path becoming rough and difficult" data-context="You grieve; with the sentence’s accompanying negation.">تَحزَنوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فاتَكُم" data-root="F W T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-w-t/" data-root-meaning="Passing beyond reach; tafāwut denotes disparity or inconsistency." data-context="It escaped you; what you did not obtain.">فاتَكُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَصٰبَكُم" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="It befell you; the adversity mentioned.">أَصٰبَكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware; describing The God’s knowledge in the verse’s context." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You do; the addressees’ actions.">تَعمَلونَ</button>
  </p>
  <p class="english-verse">When you were moving away, turning toward no one, while the messenger called you from behind, He repaid you with grief upon grief, so that you would not grieve over what escaped you or what befell you. The God is aware of what you do.</p>
</section>
