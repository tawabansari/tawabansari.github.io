<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:68</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="أَولَى" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">أَولَى</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
    <button class="word-link" type="button" data-word="بِإِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">بِإِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="لَلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَلَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّبَعوهُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">اتَّبَعوهُ</button>
    <button class="word-link" type="button" data-word="وَهٰذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهٰذَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">ءامَنوا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="وَلِىُّ" data-root="W L Y" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-learn-more="/quran-terminology/en/roots/w-l-y/">وَلِىُّ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">المُؤمِنينَ</button>
  </p>
  <p class="english-verse">The people nearest to Abraham are those who followed him, this prophet, and those who believe. And The God is the guardian of the believers.</p>
</section>
