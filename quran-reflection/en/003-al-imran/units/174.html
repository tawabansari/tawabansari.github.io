<section class="ayah-block" id="ayah-174" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:174</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانقَلَبوا" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">فَانقَلَبوا</button>

    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمٍ</button>

  <p class="english-verse">So they returned with favor and bounty from The God, untouched by harm, and followed The God’s pleasure. The God is the possessor of great bounty.</p>
