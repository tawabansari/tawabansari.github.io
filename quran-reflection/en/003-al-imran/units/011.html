<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَدَأبِ" data-root="D A B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-a-b/" data-root-meaning="Continuity in effort or habit; daʾb is an established pattern.">كَدَأبِ</button>
    <button class="word-link" type="button" data-word="ءالِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome.">ءالِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَأَخَذَهُمُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">فَأَخَذَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِذُنوبِهِم" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share.">بِذُنوبِهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="شَديدُ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">شَديدُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">العِقابِ</button>
  </p>
  <p class="english-verse">Like the practice of Pharaoh’s people and those before them: they denied Our signs, so The God seized them for their sins. The God is severe in punishment.</p>
</section>
