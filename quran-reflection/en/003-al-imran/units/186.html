<section class="ayah-block" id="ayah-186" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:186</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَتُبلَوُنَّ" data-root="B L W" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away">لَتُبلَوُنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَموٰلِكُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">أَموٰلِكُم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسِكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">وَأَنفُسِكُم</button>
    <button class="word-link" type="button" data-word="وَلَتَسمَعُنَّ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">وَلَتَسمَعُنَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">أوتُوا</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكُم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِكُم</button>
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أَشرَكوا" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">أَشرَكوا</button>
    <button class="word-link" type="button" data-word="أَذًى" data-root="A DH Y" data-learn-more="/quran-terminology/en/roots/a-dh-y/" data-root-meaning="Suffering, discomfort, or harm arising from something or conduct that is adverse; in verbal use, causing or inflicting such hurt and harm on another. Its kind, severity, and ethical assessment are determined by context.">أَذًى</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">كَثيرًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَصبِروا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">تَصبِروا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عَزمِ" data-root="AYN Z M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-z-m/" data-root-meaning="Firm resolve to carry out an action.">عَزمِ</button>
    <button class="word-link" type="button" data-word="الأُمورِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">الأُمورِ</button>
  </p>
  <p class="english-verse">You will surely be tested in your wealth and your lives. You will surely hear much hurt from those who were given the Book before you and from those who associate partners. If you are patient and mindful, that is among matters requiring resolve.</p>
</section>
