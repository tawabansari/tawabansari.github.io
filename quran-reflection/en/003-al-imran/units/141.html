<section class="ayah-block" id="ayah-141" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:141</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِيُمَحِّصَ" data-root="M H SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-h-sad/" data-root-meaning="Purifying from admixture or testing to reveal quality.">وَلِيُمَحِّصَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَيَمحَقَ" data-root="M H Q" data-learn-more="/quran-terminology/en/roots/m-h-q/" data-root-meaning="Erasing, gradual reduction, wearing away, removing blessing, and the disappearance of a thing until it reaches decrease or complete effacement">وَيَمحَقَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">الكٰفِرينَ</button>
  </p>
  <p class="english-verse">And so that The God may purify those who believe and wipe out the disbelievers.</p>
</section>
