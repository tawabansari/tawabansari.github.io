  <h2 class="ayah-title">Al-Imran 3:111</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="يَضُرّوكُم" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion">يَضُرّوكُم</button>

    <button class="word-link" type="button" data-word="أَذًى" data-root="A DH Y" data-learn-more="/quran-terminology/en/roots/a-dh-y/" data-root-meaning="Suffering, discomfort, or harm arising from something or conduct that is adverse; in verbal use, causing or inflicting such hurt and harm on another. Its kind, severity, and ethical assessment are determined by context.">أَذًى</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يُقٰتِلوكُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">يُقٰتِلوكُم</button>
    <button class="word-link" type="button" data-word="يُوَلّوكُمُ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">يُوَلّوكُمُ</button>

    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُنصَرونَ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing">يُنصَرونَ</button>
  </p>
  <p class="english-verse">They will not harm you beyond hurt. If they fight you, they will turn their backs to you; then they will not be helped.</p>
