<section class="ayah-block" id="ayah-155" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:155</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Turned away; the group’s conduct on the day of confrontation.">تَوَلَّوا</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day; the time when the two forces met.">يَومَ</button>
    <button class="word-link" type="button" data-word="التَقَى" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="Met; the encounter of the two forces.">التَقَى</button>
    <button class="word-link" type="button" data-word="الجَمعانِ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="The two forces that confronted one another that day.">الجَمعانِ</button>
    <button class="word-link" type="button" data-word="إِنَّمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّمَا</button>
    <button class="word-link" type="button" data-word="استَزَلَّهُمُ" data-root="Z L L" data-learn-more="/quran-terminology/en/roots/z-l-l/" data-root-meaning="Slipping, losing stability, and sliding away from a firm place" data-context="Caused them to slip; Satan’s effect upon their conduct.">استَزَلَّهُمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan; the agent of their slipping in this clause.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="بِبَعضِ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Because of some of what they had earned.">بِبَعضِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كَسَبوا" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="They earned; their earlier conduct in the explanation of their slipping.">كَسَبوا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="عَفَا" data-root="ʿ F W" data-learn-more="/quran-terminology/en/roots/ayn-f-w/" data-root-meaning="Passing over pursuit of a fault, lifting censure, effacing a trace, and what remains beyond need" data-context="Pardoned; The God’s pardon of them.">عَفَا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving; together with Forbearing.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="H L M" data-root-meaning="Dreams and visions in sleep; puberty in بُلُوغُ الْحُلُمِ; reason, forbearance, and self-restraint against rashness." data-context="Forbearing; describing The God after mention of pardoning the group’s slipping." data-learn-more="/quran-terminology/en/roots/h-l-m/">حَليمٌ</button>
  </p>
  <p class="english-verse">Those of you who turned away on the day the two forces met—Satan caused them to slip only because of some of what they had earned. The God has pardoned them. The God is Forgiving, Forbearing.</p>
</section>
