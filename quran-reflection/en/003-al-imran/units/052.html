<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:52</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَحَسَّ" data-root="H S S" data-root-meaning="In Arabic, ح س س has several semantic branches: perceiving and becoming aware of something; seeking news and signs; sound and sensory reaction; and killing or destroying. In the Qur’an, each form’s meaning follows its morphology and context. أَحَسَّ concerns perceiving, تَحَسَّسَ seeking news, حَسِيس a faint sound, and حَسَّ in a battle context killing and destroying." data-context="Jesus perceived and became aware of their disbelief." data-learn-more="/quran-terminology/en/roots/h-s-s/">أَحَسَّ</button>
    <button class="word-link" type="button" data-word="عيسىٰ" data-root-note="Proper name; no root has been assigned.">عيسىٰ</button>
    <button class="word-link" type="button" data-word="مِنهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُمُ</button>
    <button class="word-link" type="button" data-word="الكُفرَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="The disbelief that became apparent from them.">الكُفرَ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Jesus said.">قالَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَنصارى" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="My helpers and supporters.">أَنصارى</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="The disciples said.">قالَ</button>
    <button class="word-link" type="button" data-word="الحَوارِيّونَ" data-root="H W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-w-r/" data-root-meaning="Returning and responding in dialogue; ḥūr describes striking, beautiful eyes; ḥawāriyyūn are close supporters or disciples." data-context="The disciples, Jesus’s close companions.">الحَوارِيّونَ</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">نَحنُ</button>
    <button class="word-link" type="button" data-word="أَنصارُ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="God’s helpers and supporters.">أَنصارُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="We have believed.">ءامَنّا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَاشهَد" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="And bear witness.">وَاشهَد</button>
    <button class="word-link" type="button" data-word="بِأَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَنّا</button>
    <button class="word-link" type="button" data-word="مُسلِمونَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Those who submit.">مُسلِمونَ</button>
  </p>
  <p class="english-verse">When Jesus sensed disbelief from them, he said, “Who are my helpers toward The God?” The disciples said, “We are The God’s helpers. We believe in The God; bear witness that we submit.</p>
</section>
