<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:98</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>
    <button class="word-link" type="button" data-word="يٰأَهلَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness">يٰأَهلَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="لِمَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَ</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">تَكفُرونَ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="شَهيدٌ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">شَهيدٌ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">تَعمَلونَ</button>
  </p>
  <p class="english-verse">Say, “People of the Book, why do you deny The God’s signs, while The God is witness to what you do?”</p>
</section>
