<section class="ayah-block" id="ayah-151" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:151</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَنُلقى" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="We shall cast.">سَنُلقى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Hearts, where fear is cast in this sentence.">قُلوبِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَرُوا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved, those who rejected faith.">كَفَرُوا</button>
    <button class="word-link" type="button" data-word="الرُّعبَ" data-root="R AYN B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-ayn-b/" data-root-meaning="Intense fear or terror." data-context="Terror and intense fear.">الرُّعبَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="أَشرَكوا" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Associated partners, setting others alongside The God.">أَشرَكوا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يُنَزِّل" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Has sent down, negated in this construction.">يُنَزِّل</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="سُلطٰنًا" data-root="S L TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-l-tt/" data-root-meaning="Power to prevail; sulṭān denotes authority, power, or compelling proof, according to context." data-context="Authority or evidence supporting that claim.">سُلطٰنًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُمُ" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="An abode, dwelling, or place of refuge, without necessarily implying safety or comfort." data-context="Their abode, the Fire.">وَمَأوىٰهُمُ</button>
    <button class="word-link" type="button" data-word="النّارُ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="The Fire, the stated place of punishment.">النّارُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity; biʾsa: a fixed verb of condemnation, “how evil”." data-context="And how evil it is, expressing condemnation of this place.">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="مَثوَى" data-root="TH W Y" data-root-meaning="Staying and residing" data-context="A dwelling place, where the wrongdoers remain." data-learn-more="/quran-terminology/en/roots/th-w-y/">مَثوَى</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers, those who act unjustly.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">We will cast terror into the hearts of those who disbelieve, because they associated with The God that for which He sent down no authority. Their refuge is the Fire; how wretched is the abode of the wrongdoers.</p>
</section>
