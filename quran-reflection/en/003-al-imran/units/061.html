<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Imran 3:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="حاجَّكَ" data-root="Ḥ J J" data-learn-more="/quran-terminology/en/roots/h-j-j/" data-root-meaning="From Intending a Destination and Hajj to Argument and Reasoned Confrontation" data-context="Disputes or argues with you concerning the subject after knowledge has arrived.">حاجَّكَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After, referring to the knowledge that has come to the addressee.">بَعدِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="جاءَكَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Has come to you, referring to the knowledge mentioned.">جاءَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="العِلمِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="The knowledge received concerning the disputed subject.">العِلمِ</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then say, introducing the command to state the following invitation.">فَقُل</button>
    <button class="word-link" type="button" data-word="تَعالَوا" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting. Taʿāla is also an invitation to come or attend." data-context="Come, inviting the other party to attend and take part in the proposed action.">تَعالَوا</button>
    <button class="word-link" type="button" data-word="نَدعُ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Let us summon, inviting the children, women, and people themselves from both parties to attend.">نَدعُ</button>
    <button class="word-link" type="button" data-word="أَبناءَنا" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole Ibn and its plurals denote a child or descendant in a family line." data-context="Our children, those of the inviting party, to be summoned.">أَبناءَنا</button>
    <button class="word-link" type="button" data-word="وَأَبناءَكُم" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole Ibn and its plurals denote a child or descendant in a family line." data-context="And your children, those of the other party, to be summoned.">وَأَبناءَكُم</button>
    <button class="word-link" type="button" data-word="وَنِساءَنا" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="And our women, those of the inviting party in this summons.">وَنِساءَنا</button>
    <button class="word-link" type="button" data-word="وَنِساءَكُم" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="And your women, those of the other party in this summons.">وَنِساءَكُم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسَنا" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="And ourselves, the people of the inviting party, corresponding to “yourselves.”">وَأَنفُسَنا</button>
    <button class="word-link" type="button" data-word="وَأَنفُسَكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="And yourselves, the people of the other party, corresponding to “ourselves.”">وَأَنفُسَكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="نَبتَهِل" data-root="B H2 L" data-root-meaning="In one branch, B H L denotes letting go and leaving a person or thing without restraint or care. In supplication, ibtihāl denotes earnest requesting with humility and persistence; in imprecatory use, the family concerns invoking a curse, including mutual prayer between disputing parties. A rare branch also uses bahl for a small quantity of water or property." data-context="Let us pray with humility and persistence; here, requesting The God’s curse upon whichever party lies in the dispute." data-learn-more="/quran-terminology/en/roots/b-h2-l/">نَبتَهِل</button>
    <button class="word-link" type="button" data-word="فَنَجعَل" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Then let us place, within prayer requesting that the divine curse fall upon the liars.">فَنَجعَل</button>
    <button class="word-link" type="button" data-word="لَعنَتَ" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion" data-context="The curse, attributed to The God, whose exclusion and distancing are invoked upon the liars.">لَعنَتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الكٰذِبينَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="The liars, those of either party who speak falsely concerning the disputed subject.">الكٰذِبينَ</button>
  </p>
  <p class="english-verse">Whoever argues with you about him after the knowledge that has come to you, say, “Come, let us call our sons and your sons, our women and your women, ourselves and yourselves; then let us pray earnestly and place The God’s curse upon the liars.”</p>
</section>
