<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed; those being addressed.">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="اذكُروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Remember; the command to recall the favor.">اذكُروا</button>
    <button class="word-link" type="button" data-word="نِعمَتَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="Favor; the benefit recalled in restraining hostile hands.">نِعمَتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="هَمَّ" data-root-note="Preliminary meaning; a full root study is not yet available." data-root="H M M" data-learn-more="/quran-terminology/en/roots/h2-m-m/" data-root-meaning="Distress or preoccupation; hamm can denote intention or resolve." data-context="Intended; the group’s resolve to extend their hands.">هَمَّ</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="A people; those intending harm." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومٌ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَبسُطوا" data-root="B S TT" data-root-meaning="Opening, spreading, and extending; context can apply this to ample provision or breadth of knowledge and capacity." data-context="Extend; the group’s intention to stretch hands toward the addressees to harm them." data-learn-more="/quran-terminology/en/roots/b-s-tt/">يَبسُطوا</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands; what they intended to extend toward the addressees.">أَيدِيَهُم</button>
    <button class="word-link" type="button" data-word="فَكَفَّ" data-root="K F F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-f-f/" data-root-meaning="The palm; restraining or desisting; kāffah means all together." data-context="Then He restrained; preventing their hands from reaching.">فَكَفَّ</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands; the hands restrained.">أَيدِيَهُم</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="And be mindful; the command of care toward The God.">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَليَتَوَكَّلِ" data-root="W K L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-l/" data-root-meaning="Entrusting or relying; wakīl is an agent or responsible guardian." data-context="Let them rely; directing trust and entrustment.">فَليَتَوَكَّلِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers; those directed to rely.">المُؤمِنونَ</button>
  </p>
  <p class="english-verse">O you who believe, remember The God’s favor upon you when a people intended to stretch their hands toward you, and He restrained their hands from you. Be mindful of The God, and let the believers put their trust in The God.</p>
</section>
