  <h2 class="ayah-title">Al-Ma’idah 5:39</h2>
  <p class="arabic-text">

  <p class="english-verse">Whoever repents after his wrongdoing and makes amends, The God turns to him. Indeed, The God is forgiving, merciful.</p>
