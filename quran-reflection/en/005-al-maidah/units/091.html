<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:91</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يوقِعَ" data-root="W Q AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-q-ayn/" data-root-meaning="Falling, occurring, or coming to pass.">يوقِعَ</button>
    <button class="word-link" type="button" data-word="بَينَكُمُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَكُمُ</button>
    <button class="word-link" type="button" data-word="العَدٰوَةَ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity.">العَدٰوَةَ</button>
    <button class="word-link" type="button" data-word="وَالبَغضاءَ" data-root="B GH DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-gh-dad/" data-root-meaning="Aversion, hatred, or dislike toward someone or something; the opposite of love.">وَالبَغضاءَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الخَمرِ" data-root="KH M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-m-r/" data-root-meaning="Covering; khamr is an intoxicating drink; khimār is a head covering in established usage.">الخَمرِ</button>
    <button class="word-link" type="button" data-word="وَالمَيسِرِ" data-root="Y S R" data-learn-more="/quran-terminology/en/roots/y-s-r/" data-root-meaning="Ease, opening, availability, smoothness of action, capacity and access; and in the branch of maysir, using ease or chance to gain benefit">وَالمَيسِرِ</button>
    <button class="word-link" type="button" data-word="وَيَصُدَّكُم" data-root="SAD D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-d-d/" data-root-meaning="Turning away or preventing another.">وَيَصُدَّكُم</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">ذِكرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَعَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَنِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةِ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">الصَّلوٰةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهَل</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتُم</button>
    <button class="word-link" type="button" data-word="مُنتَهونَ" data-root="N H2 Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-h2-y/" data-root-meaning="Preventing or ending; nuhā denotes restraining understanding or reason.">مُنتَهونَ</button>
  </p>
  <p class="english-verse">Satan only wishes to cause enmity and hatred among you through wine and gambling, and to hinder you from remembering The God and from prayer. Will you then desist?</p>
</section>
