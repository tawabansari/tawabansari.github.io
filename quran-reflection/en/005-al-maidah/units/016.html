<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَهدى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">يَهدى</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَنِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">اتَّبَعَ</button>
    <button class="word-link" type="button" data-word="رِضوٰنَهُ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent">رِضوٰنَهُ</button>
    <button class="word-link" type="button" data-word="سُبُلَ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سُبُلَ</button>
    <button class="word-link" type="button" data-word="السَّلٰمِ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender">السَّلٰمِ</button>
    <button class="word-link" type="button" data-word="وَيُخرِجُهُم" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">وَيُخرِجُهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الظُّلُمٰتِ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">الظُّلُمٰتِ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="النّورِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّورِ</button>
    <button class="word-link" type="button" data-word="بِإِذنِهِ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission">بِإِذنِهِ</button>
    <button class="word-link" type="button" data-word="وَيَهديهِم" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">وَيَهديهِم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطٍ" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/">صِرٰطٍ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">مُستَقيمٍ</button>
  </p>
  <p class="english-verse">Through it The God guides those who follow His pleasure to ways of peace, brings them out of darkness into light by His permission, and guides them to a straight path.</p>
</section>
