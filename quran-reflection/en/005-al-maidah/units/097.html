<section class="ayah-block" id="ayah-097" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:97</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Has made: assigning the mentioned things a role in sustaining people.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الكَعبَةَ" data-root="K AYN B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-ayn-b/" data-root-meaning="Prominence; kaʿb is an ankle; Kaʿbah is a cubic structure; kawāʿib describes bodily maturity." data-context="The Kaʿbah: the structure identified as the inviolable House.">الكَعبَةَ</button>
    <button class="word-link" type="button" data-word="البَيتَ" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/" data-root-meaning="A house or dwelling; bāta: spending the night; tabyīt: arranging something by night or in secret." data-root-note="Preliminary meaning; a full root study is not yet available." data-context="The House: identifying the Kaʿbah in the expression.">البَيتَ</button>
    <button class="word-link" type="button" data-word="الحَرامَ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Inviolable: describing the House.">الحَرامَ</button>
    <button class="word-link" type="button" data-word="قِيٰمًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="A support: a means of sustaining and ordering people’s life.">قِيٰمًا</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="For people: those sustained by the arrangements described.">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="وَالشَّهرَ" data-root="SH H2 R" data-root-meaning="A month: a countable monthly period within the recognized system of months." data-context="And the month: the inviolable month alongside the House and ritual signs." data-learn-more="/quran-terminology/en/roots/sh-h2-r/">وَالشَّهرَ</button>
    <button class="word-link" type="button" data-word="الحَرامَ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Inviolable: describing the month.">الحَرامَ</button>
    <button class="word-link" type="button" data-word="وَالهَدىَ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-context="And the offerings: sacrificial offerings or animals connected with the rites." data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided In the hady branch, a ritual offering or sacrificial animal.">وَالهَدىَ</button>
    <button class="word-link" type="button" data-word="وَالقَلٰئِدَ" data-root="Q L D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-l-d/" data-root-meaning="A necklace and hanging around the neck; maqālīd denotes keys or control of stores." data-context="And the garlands: neck markings and the ritually marked offerings.">وَالقَلٰئِدَ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لِتَعلَموا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="So that you may know: recognizing the knowledge of The God.">لِتَعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knows: His knowledge of what is in the heavens and on earth.">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens: one of the two realms included in the stated knowledge.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth: the other realm included in the stated knowledge.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَأَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Of every: expressing the comprehensiveness of knowledge.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="Thing: every matter or being within divine knowledge." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God As the noun shayʾ, a thing or matter under discussion, distinct from the verb of willing.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing: describing The God’s comprehensive knowledge.">عَليمٌ</button>
  </p>
  <p class="english-verse">The God has made the Kaaba, the Sacred House, a support for people, and the sacred month, the offerings, and the garlands. That is so you may know that The God knows whatever is in the heavens and whatever is in the earth, and that The God knows all things.</p>
</section>
