<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="say">قُل</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="أُنَبِّئُكُم" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="shall I inform you">أُنَبِّئُكُم</button>
    <button class="word-link" type="button" data-word="بِشَرٍّ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/" data-context="of worse">بِشَرٍّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مَثوبَةً" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="in recompense and outcome">مَثوبَةً</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="لَعَنَهُ" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion" data-context="He has cursed him">لَعَنَهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَغَضِبَ" data-root="GH Ḍ B" data-learn-more="/quran-terminology/en/roots/gh-dad-b/" data-root-meaning="Intense displeasure and a response to what is unacceptable" data-context="and has become angry with him">وَغَضِبَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="and has made">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="مِنهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُمُ</button>
    <button class="word-link" type="button" data-word="القِرَدَةَ" data-root="Q R D" data-learn-more="/quran-terminology/en/roots/q-r-d/" data-root-meaning="Ape, monkey; with the lexical meaning kept distinct from the contextual message of the verses." data-context="apes">القِرَدَةَ</button>
    <button class="word-link" type="button" data-word="وَالخَنازيرَ" data-root="KH N Z R" data-root-meaning="Pig or swine; khinzīr is the animal’s name and khanāzīr its plural. Its historical derivation is disputed; it does not itself mean decay or disease." data-learn-more="/quran-terminology/en/roots/kh-n-z-r/" data-context="and pigs">وَالخَنازيرَ</button>
    <button class="word-link" type="button" data-word="وَعَبَدَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship; the same root is also used linguistically for worship of other objects of worship." data-context="and worshipped">وَعَبَدَ</button>
    <button class="word-link" type="button" data-word="الطّٰغوتَ" data-root="Ṭ GH Y" data-learn-more="/quran-terminology/en/roots/tt-gh-y/" data-root-meaning="From transgression to Taghut: passing beyond the limit, breaking the boundary, and a false reference sitting in the place of truth" data-context="al-ṭāghūt; a false object of worship or rebellious power in this context">الطّٰغوتَ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="شَرٌّ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/" data-context="worse">شَرٌّ</button>
    <button class="word-link" type="button" data-word="مَكانًا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization; also makān: a place or position." data-context="in position">مَكانًا</button>
    <button class="word-link" type="button" data-word="وَأَضَلُّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="and further astray">وَأَضَلُّ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="سَواءِ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="the even course of">سَواءِ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="the path">السَّبيلِ</button>
  </p>
  <p class="english-verse">Say, “Shall I inform you of what is worse than that in recompense with The God? Those whom The God has cursed and with whom He is angry, and from whom He has made apes and swine, and those who worship taghut. Those are worse in position and further astray from the sound way.”</p>
</section>
