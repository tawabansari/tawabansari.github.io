<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="My people; Moses addressing his people.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="ادخُلُوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="Enter; the command to enter the land.">ادخُلُوا</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The land they are commanded to enter.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="المُقَدَّسَةَ" data-root="Q D S" data-learn-more="/quran-terminology/en/roots/q-d-s/" data-root-meaning="Purity, purification, separating a pure domain from contamination, and preserving sacred boundary" data-context="Holy or sanctified; describing that land.">المُقَدَّسَةَ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="كَتَبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="Has prescribed; concerning the land for the audience.">كَتَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَرتَدّوا" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="Do not turn back; prohibiting retreat.">تَرتَدّوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَدبارِكُم" data-root="D B R" data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back and latter part; turning away and passing; tadbīr, governing affairs; tadabbur, careful reflection on discourse." data-context="Your backs; in the prohibition against turning backward.">أَدبارِكُم</button>
    <button class="word-link" type="button" data-word="فَتَنقَلِبوا" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Then turn back, ending in a state of loss.">فَتَنقَلِبوا</button>
    <button class="word-link" type="button" data-word="خٰسِرينَ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="Losers; the resulting state of turning back.">خٰسِرينَ</button>
  </p>
  <p class="english-verse">My people, enter the holy land which The God has prescribed for you, and do not turn back on your heels, lest you return as losers.”</p>
</section>
