<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:31</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَبَعَثَ" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task." data-context="So He sent">فَبَعَثَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="غُرابًا" data-root="GH R B" data-learn-more="/quran-terminology/en/roots/gh-r-b/" data-root-meaning="From sunset and disappearance from view to the west, estrangement, and other branches; also ghurāb: the name of the raven or crow." data-context="A raven">غُرابًا</button>
    <button class="word-link" type="button" data-word="يَبحَثُ" data-root="B H TH" data-root-meaning="Digging and turning over, especially soil; also searching and inquiring to find something or learn about a matter." data-learn-more="/quran-terminology/en/roots/b-h-th/" data-context="Was digging in the ground, moving soil aside">يَبحَثُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The ground in which the raven was digging">الأَرضِ</button>
    <button class="word-link" type="button" data-word="لِيُرِيَهُ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="To show him">لِيُرِيَهُ</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="يُوٰرى" data-root="W R Y" data-learn-more="/quran-terminology/en/roots/w-r-y/" data-root-meaning="Covering and concealment; and, in another branch, the emergence and production of fire" data-context="Covers and conceals from view">يُوٰرى</button>
    <button class="word-link" type="button" data-word="سَوءَةَ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah; sawʾah: something of the body or bodily condition whose exposure is undesirable and whose covering is wanted." data-context="His brother’s body, as something to be covered from view">سَوءَةَ</button>
    <button class="word-link" type="button" data-word="أَخيهِ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother; where context warrants, a fellow member of one’s people or an associate." data-context="His brother">أَخيهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said">قالَ</button>
    <button class="word-link" type="button" data-word="يٰوَيلَتىٰ" data-root="W Y L" data-learn-more="/quran-terminology/en/roots/w-y-l/" data-root-meaning="From Cries of Grief and Warning to the Announcement of a Dire Outcome" data-context="Woe is me: an exclamation of grief and self-reproach">يٰوَيلَتىٰ</button>
    <button class="word-link" type="button" data-word="أَعَجَزتُ" data-root="AYN J Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-j-z/" data-root-meaning="Being unable or rendering powerless; ʿajūz is an elderly woman." data-context="Was I unable?">أَعَجَزتُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="أَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="To be, in being like this raven">أَكونَ</button>
    <button class="word-link" type="button" data-word="مِثلَ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like, in comparison with this raven">مِثلَ</button>
    <button class="word-link" type="button" data-word="هٰذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذَا</button>
    <button class="word-link" type="button" data-word="الغُرابِ" data-root="GH R B" data-learn-more="/quran-terminology/en/roots/gh-r-b/" data-root-meaning="From sunset and disappearance from view to the west, estrangement, and other branches; also ghurāb: the name of the raven or crow." data-context="The raven, the bird that was digging in the ground">الغُرابِ</button>
    <button class="word-link" type="button" data-word="فَأُوٰرِىَ" data-root="W R Y" data-learn-more="/quran-terminology/en/roots/w-r-y/" data-root-meaning="Covering and concealment; and, in another branch, the emergence and production of fire" data-context="So that I cover and conceal from view">فَأُوٰرِىَ</button>
    <button class="word-link" type="button" data-word="سَوءَةَ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah; sawʾah: something of the body or bodily condition whose exposure is undesirable and whose covering is wanted." data-context="My brother’s body, as something to be covered from view">سَوءَةَ</button>
    <button class="word-link" type="button" data-word="أَخى" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother; where context warrants, a fellow member of one’s people or an associate." data-context="My brother">أَخى</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَصبَحَ" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp; aṣbaḥa in some constructions: becoming or entering a state." data-context="Then he became, entering that state">فَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="النّٰدِمينَ" data-root="N D M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-d-m/" data-root-meaning="Regret for a past action." data-context="The regretful: those who feel remorse for what they have done">النّٰدِمينَ</button>
  </p>
  <p class="english-verse">The God sent a raven scratching in the earth to show him how to cover his brother’s body. He said, “Woe to me! Am I unable to be like this raven and cover my brother’s body?” He became one of the regretful.</p>
</section>
