    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="You have believed; the people addressed by the command of avoidance.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="إِنَّمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّمَا</button>

  <p class="english-verse">O you who believe, wine, gambling, sacrificial stones, and divining arrows are an abomination from Satan’s work. Avoid it, so that you may prosper.</p>
