  <h2 class="ayah-title">Al-Ma’idah 5:34</h2>

    <button class="word-link" type="button" data-word="تَقدِروا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">تَقدِروا</button>

  <p class="english-verse">Except those who repent before you gain power over them. Know that The God is forgiving, merciful.</p>
