<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:63</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="يَنهىٰهُمُ" data-root="N H2 Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-h2-y/" data-root-meaning="Preventing or ending; nuhā denotes restraining understanding or reason." data-context="They restrain them; from sinful speech and consuming unlawful wealth.">يَنهىٰهُمُ</button>
    <button class="word-link" type="button" data-word="الرَّبّٰنِيّونَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="The rabbānī scholars; a religious and scholarly group mentioned alongside the aḥbār.">الرَّبّٰنِيّونَ</button>
    <button class="word-link" type="button" data-word="وَالأَحبارُ" data-root="H B R" data-root-meaning="Traces and adornment; ḥabr/ḥibr: a religious scholar; ḥubūr: joy and enjoyment of blessings." data-context="And the religious scholars; those responsible for restraining sinful speech and unlawful consumption of wealth." data-learn-more="/quran-terminology/en/roots/h-b-r/">وَالأَحبارُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="قَولِهِمُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Their speech; the speech characterized as sinful.">قَولِهِمُ</button>
    <button class="word-link" type="button" data-word="الإِثمَ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Sin; characterizing the speech being condemned.">الإِثمَ</button>
    <button class="word-link" type="button" data-word="وَأَكلِهِمُ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="And their consuming; appropriating and using unlawful wealth.">وَأَكلِهِمُ</button>
    <button class="word-link" type="button" data-word="السُّحتَ" data-root="S H T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-h-t/" data-root-meaning="Eradicating; suḥt denotes wrongful, corrupting gain." data-context="Unlawful gain; what they acquire and consume wrongfully.">السُّحتَ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="How evil; condemnation of what they were doing.">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were; with yaṣnaʿūna, describing their past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَصنَعونَ" data-root="SAD N AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-n-ayn/" data-root-meaning="Making or performing with skill and care." data-context="They were doing; the conduct condemned in the verse.">يَصنَعونَ</button>
  </p>
  <p class="english-verse">Why do the devoted teachers and scholars not restrain them from sinful speech and consuming illicit gain? How evil is what they used to do.</p>
</section>
