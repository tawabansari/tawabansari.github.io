<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:101</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believe: describing those addressed.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَسـَٔلوا" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="Do not ask: prohibiting the described harmful questioning.">تَسـَٔلوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="أَشياءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="Things: the subjects of the prohibited questioning." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God As the noun shayʾ, a thing or matter under discussion, distinct from the verb of willing.">أَشياءَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="تُبدَ" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="Are disclosed: the questioned matters becoming apparent.">تُبدَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="تَسُؤكُم" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Distress you: the consequence of their disclosure.">تَسُؤكُم</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَسـَٔلوا" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="Ask: questioning while the Qur’an is being sent down.">تَسـَٔلوا</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنها</button>
    <button class="word-link" type="button" data-word="حينَ" data-root="H Y N" data-learn-more="/quran-terminology/en/roots/h-y-n/" data-root-meaning="A time, moment, interval, period, deadline, or bounded segment within the flow of time." data-context="The time: when the Qur’an is being sent down.">حينَ</button>
    <button class="word-link" type="button" data-word="يُنَزَّلُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Is sent down: the descent of the Qur’an.">يُنَزَّلُ</button>
    <button class="word-link" type="button" data-word="القُرءانُ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the revelation whose descent forms the setting for questioning." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانُ</button>
    <button class="word-link" type="button" data-word="تُبدَ" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="Are disclosed: the matters becoming clear to you.">تُبدَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَفَا" data-root="ʿ F W" data-learn-more="/quran-terminology/en/roots/ayn-f-w/" data-root-meaning="Passing over pursuit of a fault, lifting censure, effacing a trace, and what remains beyond need" data-context="Has pardoned: the pardon stated in the verse.">عَفَا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving: describing The God.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="H L M" data-root-meaning="Dreams and visions in sleep; puberty in بُلُوغُ الْحُلُمِ; reason, forbearance, and self-restraint against rashness." data-context="Forbearing: describing The God." data-learn-more="/quran-terminology/en/roots/h-l-m/">حَليمٌ</button>
  </p>
  <p class="english-verse">O you who believe, do not ask about things which, if disclosed to you, would distress you. If you ask about them while the Quran is being sent down, they will be disclosed to you. The God has pardoned them. The God is forgiving, forbearing.</p>
</section>
