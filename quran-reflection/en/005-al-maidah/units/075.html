  <h2 class="ayah-title">Al-Ma’idah 5:75</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَا</button>
    <button class="word-link" type="button" data-word="المَسيحُ" data-root="M S H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-h/" data-root-meaning="Wiping or rubbing; also measuring a surface.">المَسيحُ</button>
    <button class="word-link" type="button" data-word="ابنُ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">ابنُ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="Proper name; no root has been assigned.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="رَسولٌ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رَسولٌ</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="خَلَت" data-root="KH L W" data-learn-more="/quran-terminology/en/roots/kh-l-w/" data-root-meaning="Becoming empty, withdrawing into privacy, leaving the public field, being alone, becoming free of obstruction, and separating from open visibility">خَلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِهِ</button>
    <button class="word-link" type="button" data-word="الرُّسُلُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرُّسُلُ</button>
    <button class="word-link" type="button" data-word="وَأُمُّهُ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination">وَأُمُّهُ</button>
    <button class="word-link" type="button" data-word="صِدّيقَةٌ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">صِدّيقَةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="كانا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانا</button>
    <button class="word-link" type="button" data-word="يَأكُلانِ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption">يَأكُلانِ</button>
    <button class="word-link" type="button" data-word="الطَّعامَ" data-root="Ṭ AYN M (Ṭ ʿ M)" data-learn-more="/quran-terminology/en/roots/tt-ayn-m/" data-root-meaning="Tasting, eating, food, feeding, and real access to nourishment">الطَّعامَ</button>
    ۗ

    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="نُبَيِّنُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">نُبَيِّنُ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="انظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay">انظُر</button>
    <button class="word-link" type="button" data-word="أَنّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="A F K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something from its proper direction; ifk: falsehood or distortion; muʾtafikah: overturned.">يُؤفَكونَ</button>
  </p>
  <p class="english-verse">The Messiah, son of Mary, is only a messenger; messengers passed before him. His mother was a woman of truth. They both ate food. Look how We make the signs clear to them; then look how they are turned away.</p>
</section>
