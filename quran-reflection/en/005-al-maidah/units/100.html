<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:100</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command to state this distinction.">قُل</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَوِى" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Is not equal; the bad and the good do not have equal worth.">يَستَوِى</button>
    <button class="word-link" type="button" data-word="الخَبيثُ" data-root="KH B TH" data-learn-more="/quran-terminology/en/roots/kh-b-th/" data-root-meaning="In its basic sense, khabīth describes something undesirable and unworthy in quality, effect, conduct, or value." data-context="The bad or unworthy, contrasted with the good and worthy; a distinction in value.">الخَبيثُ</button>
    <button class="word-link" type="button" data-word="وَالطَّيِّبُ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant." data-context="The good and worthy, contrasted with khabīth in this comparison.">وَالطَّيِّبُ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَعجَبَكَ" data-root="AYN J B" data-root-meaning="Wonder and finding something significant or unusual; iʿjāb denotes pleasing or impressing, and ʿujb self-admiration." data-context="Impresses you or catches your admiration." data-learn-more="/quran-terminology/en/roots/ayn-j-b/">أَعجَبَكَ</button>
    <button class="word-link" type="button" data-word="كَثرَةُ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Abundance; the quantity of the bad that may appear impressive.">كَثرَةُ</button>
    <button class="word-link" type="button" data-word="الخَبيثِ" data-root="KH B TH" data-learn-more="/quran-terminology/en/roots/kh-b-th/" data-root-meaning="In its basic sense, khabīth describes something undesirable and unworthy in quality, effect, conduct, or value." data-context="The same bad or unworthy things, whose abundance does not alter their worth.">الخَبيثِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَاتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="So be mindful of The God and act with responsible care.">فَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يٰأُولِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأُولِى</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="L B B" data-root-meaning="The core or pure, choice part of something; in human use, reason and the faculty of understanding." data-context="Understanding; in the address to people of discernment." data-learn-more="/quran-terminology/en/roots/l-b-b/">الأَلبٰبِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُفلِحونَ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success" data-context="Prosper and reach a good outcome.">تُفلِحونَ</button>
  </p>
  <p class="english-verse">Say, “The impure and the pure are not equal, even if the abundance of the impure impresses you.” Be mindful of The God, O people of understanding, so that you may prosper.</p>
</section>
