<section class="ayah-block" id="ayah-109" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:109</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>
    <button class="word-link" type="button" data-word="يَجمَعُ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field">يَجمَعُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الرُّسُلَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرُّسُلَ</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="ماذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">ماذا</button>
    <button class="word-link" type="button" data-word="أُجِبتُم" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/">أُجِبتُم</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="عِلمَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عِلمَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتَ</button>
    <button class="word-link" type="button" data-word="عَلّٰمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَلّٰمُ</button>
    <button class="word-link" type="button" data-word="الغُيوبِ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God">الغُيوبِ</button>
  </p>
  <p class="english-verse">On the day The God gathers the messengers and says, “What response were you given?” they say, “We have no knowledge. Indeed, You are the Knower of the unseen.”</p>
</section>
