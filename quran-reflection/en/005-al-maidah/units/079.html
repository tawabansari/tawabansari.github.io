<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:79</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were, introducing their past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَتَناهَونَ" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="Restrain one another, negated here concerning wrong, also related to the people themselves not desisting." data-learn-more="/quran-terminology/en/roots/n-h2-y/">يَتَناهَونَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="مُنكَرٍ" data-root="N K R" data-learn-more="/quran-terminology/en/roots/n-k-r/" data-root-meaning="Unfamiliarity, alienness, roughness, reprehensibility, denial, and being changed from a familiar and recognizable state." data-context="Wrong, the conduct they committed.">مُنكَرٍ</button>
    <button class="word-link" type="button" data-word="فَعَلوهُ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="They did it, committing that wrong.">فَعَلوهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="Evil indeed, condemning their conduct.">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to, expressing repeated past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَفعَلونَ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="Do, referring to their condemned conduct.">يَفعَلونَ</button>
  </p>
  <p class="english-verse">They did not restrain one another from the wrong they committed. How evil is what they used to do.</p>
</section>
