<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:62</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرىٰ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="And you see the conduct of many of them.">وَتَرىٰ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Many of them, described as hastening in sin.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="يُسٰرِعونَ" data-root="S R AYN" data-root-meaning="Speed in movement or action as opposed to slowness; in musāraʿah, prompt initiative toward a goal whose value is determined by context." data-context="They hasten in sin, aggression, and consuming illicit gain." data-learn-more="/quran-terminology/en/roots/s-r-ayn/">يُسٰرِعونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الإِثمِ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Sin, one field of the criticized haste.">الإِثمِ</button>
    <button class="word-link" type="button" data-word="وَالعُدوٰنِ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="And aggression, alongside sin.">وَالعُدوٰنِ</button>
    <button class="word-link" type="button" data-word="وَأَكلِهِمُ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="And their consuming illicit gain.">وَأَكلِهِمُ</button>
    <button class="word-link" type="button" data-word="السُّحتَ" data-root="S H T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-h-t/" data-root-meaning="Eradicating; suḥt denotes wrongful, corrupting gain." data-context="Illicit or corrupt gain, which they consume.">السُّحتَ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="How evil it is, condemning their conduct.">لَبِئسَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were, in describing their conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They used to do, referring to the condemned conduct.">يَعمَلونَ</button>
  </p>
  <p class="english-verse">You see many of them hastening into sin, aggression, and consuming illicit gain. How evil is what they used to do.</p>
</section>
