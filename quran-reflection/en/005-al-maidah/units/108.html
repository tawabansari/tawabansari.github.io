    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَأتوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">يَأتوا</button>
    <button class="word-link" type="button" data-word="بِالشَّهٰدَةِ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">بِالشَّهٰدَةِ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="وَجهِها" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh">وَجهِها</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يَخافوا" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat">يَخافوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تُرَدَّ" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course">تُرَدَّ</button>

    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدَ</button>

    <button class="word-link" type="button" data-word="وَاسمَعوا" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">وَاسمَعوا</button>

    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>

    <button class="word-link" type="button" data-word="القَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القَومَ</button>
    <button class="word-link" type="button" data-word="الفٰسِقينَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command">الفٰسِقينَ</button>

  <p class="english-verse">That is nearer to their giving testimony in its proper form, or fearing that oaths may be countered after their oaths. Be mindful of The God and listen. The God does not guide the disobedient people.</p>
</section>
