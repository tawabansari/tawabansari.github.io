<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:53</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they say; the believers’ words about those who swore.">وَيَقولُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed; the people asking the question.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="أَهٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَهٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أَقسَموا" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="Swore; emphatically claiming solidarity.">أَقسَموا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="جَهدَ" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="Utmost emphasis; expressing the intensity of their oaths." data-learn-more="/quran-terminology/en/roots/j-h2-d/">جَهدَ</button>
    <button class="word-link" type="button" data-word="أَيمٰنِهِم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Their oaths; what receives forceful emphasis.">أَيمٰنِهِم</button>
    ۙ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَمَعَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمَعَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="حَبِطَت" data-root="H B TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-tt/" data-root-meaning="An action becoming void or fruitless; iḥbāṭ: nullifying its effect or result." data-context="Came to nothing; their deeds becoming fruitless.">حَبِطَت</button>
    <button class="word-link" type="button" data-word="أَعمٰلُهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Their deeds; the actions rendered fruitless.">أَعمٰلُهُم</button>
    <button class="word-link" type="button" data-word="فَأَصبَحوا" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp." data-context="Thus became; introducing their losing outcome.">فَأَصبَحوا</button>
    <button class="word-link" type="button" data-word="خٰسِرينَ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="Losers; those whose deeds came to nothing.">خٰسِرينَ</button>
  </p>
  <p class="english-verse">Those who believe say, “Are these the ones who swore their strongest oaths by The God that they were surely with you?” Their works have come to nothing, and they have become losers.</p>
</section>
