<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed, the addressees">ءامَنوا</button>
    <button class="word-link" type="button" data-word="أَوفوا" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense" data-context="Fulfill the contracts">أَوفوا</button>
    <button class="word-link" type="button" data-word="بِالعُقودِ" data-root="AYN Q D" data-learn-more="/quran-terminology/en/roots/ayn-q-d/" data-root-meaning="ʿAqd is binding and establishing a connection that joins its parts and makes them firm to some degree." data-context="Contracts and obligations">بِالعُقودِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُحِلَّت" data-root="H L L" data-root-meaning="Opening and undoing a binding; permissibility and removal of prohibition; alighting and settling." data-context="Was made lawful: livestock with the stated exceptions." data-learn-more="/quran-terminology/en/roots/h-l-l/">أُحِلَّت</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="بَهيمَةُ" data-root="B H2 M" data-root-meaning="In the main branch analysed by Ibn Fāris, B H M concerns blocked understanding or access and absence of clear distinguishing marks. In the animal branch, bahīmah names a quadruped; Qur’anic bahīmatu al-anʿāmi denotes the recognised livestock quadrupeds." data-context="Beasts, in the livestock expression" data-learn-more="/quran-terminology/en/roots/b-h2-m/">بَهيمَةُ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-context="Livestock" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing In anʿām, livestock and grazing animals.">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُتلىٰ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-context="Is recited, stating exceptions" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another. Tilāwah also denotes reading or reciting speech or verses in sequence.">يُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Not, introducing an exclusion">غَيرَ</button>
    <button class="word-link" type="button" data-word="مُحِلِّى" data-root="H L L" data-root-meaning="Opening and undoing a binding; permissibility and removal of prohibition; alighting and settling." data-context="Those treating hunting as permissible, excluded by ghayra while consecrated." data-learn-more="/quran-terminology/en/roots/h-l-l/">مُحِلِّى</button>
    <button class="word-link" type="button" data-word="الصَّيدِ" data-root="SAD Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-y-d/" data-root-meaning="Hunting and hunted game." data-context="Game or hunting, subject to restriction">الصَّيدِ</button>
    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="حُرُمٌ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="In ritual consecration">حُرُمٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَحكُمُ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Prescribes or judges">يَحكُمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Wills">يُريدُ</button>
  </p>
  <p class="english-verse">O you who believe, fulfill the contracts. Livestock animals are lawful for you, except what is recited to you, without treating hunting as lawful while you are in a state of consecration. Indeed, The God decrees what He wills.</p>
</section>
