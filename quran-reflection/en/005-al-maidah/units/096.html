<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:96</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُحِلَّ" data-root="H L L" data-root-meaning="Opening and undoing a binding; permissibility and removal of prohibition; alighting and settling." data-context="Was made lawful: sea game and its food." data-learn-more="/quran-terminology/en/roots/h-l-l/">أُحِلَّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="صَيدُ" data-root="SAD Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-y-d/" data-root-meaning="Hunting and hunted game." data-context="Game, animals caught">صَيدُ</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation" data-context="The sea">البَحرِ</button>
    <button class="word-link" type="button" data-word="وَطَعامُهُ" data-root="Ṭ AYN M (Ṭ ʿ M)" data-learn-more="/quran-terminology/en/roots/tt-ayn-m/" data-root-meaning="Tasting, eating, food, feeding, and real access to nourishment" data-context="And its food">وَطَعامُهُ</button>
    <button class="word-link" type="button" data-word="مَتٰعًا" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="A provision for use">مَتٰعًا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَلِلسَّيّارَةِ" data-root="S Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-r/" data-root-meaning="Traveling or moving along a course; sīrah denotes a way or condition." data-context="And for travelers">وَلِلسَّيّارَةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَحُرِّمَ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="And was prohibited">وَحُرِّمَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="صَيدُ" data-root="SAD Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-y-d/" data-root-meaning="Hunting and hunted game." data-context="Game or hunting, subject to prohibition">صَيدُ</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="B R R" data-learn-more="/quran-terminology/en/roots/b-r-r/" data-context="The land" data-root-meaning="Expansive goodness, upright conduct, faithfulness, beneficence, openness in good, and standing on firm moral ground. Barr, opposed to the sea, means land.">البَرِّ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="دُمتُم" data-root="D W M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-w-m/" data-root-meaning="Enduring, remaining, and continuing." data-context="Remain in consecration">دُمتُم</button>
    <button class="word-link" type="button" data-word="حُرُمًا" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Consecrated">حُرُمًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="And be mindful">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُحشَرونَ" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="You will be gathered" data-learn-more="/quran-terminology/en/roots/h-sh-r/">تُحشَرونَ</button>
  </p>
  <p class="english-verse">The game of the sea and its food are lawful for you, as provision for you and travelers. The game of the land is forbidden to you while you remain in a state of consecration. Be mindful of The God, to whom you will be gathered.</p>
</section>
