<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَعلَم" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">تَعلَم</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="مُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God">مُلكُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="يُعَذِّبُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">يُعَذِّبُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيَغفِرُ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">وَيَغفِرُ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="قَديرٌ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">قَديرٌ</button>
  </p>
  <p class="english-verse">Do you not know that to The God belongs the dominion of the heavens and the earth? He punishes whom He wills and forgives whom He wills. The God is capable of all things.</p>
</section>
