<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ma’idah 5:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَتَبنا" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="And We prescribed for them in that book: the provision recorded in the Torah.">وَكَتَبنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="النَّفسَ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="A human life or person: in the provision recounted here, a life for a life.">النَّفسَ</button>
    <button class="word-link" type="button" data-word="بِالنَّفسِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="For a life: the corresponding life in the provision concerning retribution.">بِالنَّفسِ</button>
    <button class="word-link" type="button" data-word="وَالعَينَ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="And the eye: the actual bodily organ among those covered by retribution.">وَالعَينَ</button>
    <button class="word-link" type="button" data-word="بِالعَينِ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="For an eye: the matching organ in the construction expressing organ for organ.">بِالعَينِ</button>
    <button class="word-link" type="button" data-word="وَالأَنفَ" data-root="A N F" data-learn-more="/quran-terminology/en/roots/a-n-f/" data-root-meaning="The nose of a human or animal and, by extension, the head or front part of something." data-context="And the nose: the actual bodily organ in the provision concerning retribution, rather than a metaphor for honor or arrogance.">وَالأَنفَ</button>
    <button class="word-link" type="button" data-word="بِالأَنفِ" data-root="A N F" data-learn-more="/quran-terminology/en/roots/a-n-f/" data-root-meaning="The nose of a human or animal and, by extension, the head or front part of something." data-context="For a nose: the corresponding nose in the construction concerning retribution for bodily injury.">بِالأَنفِ</button>
    <button class="word-link" type="button" data-word="وَالأُذُنَ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="And the ear: the organ of hearing among the bodily organs covered by retribution.">وَالأُذُنَ</button>
    <button class="word-link" type="button" data-word="بِالأُذُنِ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="For an ear: the matching ear in the organ-for-organ construction.">بِالأُذُنِ</button>
    <button class="word-link" type="button" data-word="وَالسِّنَّ" data-root="S N N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-n/" data-root-meaning="A tooth; sunnah is an established way; masnūn has differing explanations, including shaped or altered." data-context="And the tooth: an actual bodily tooth, rather than an established way or practice.">وَالسِّنَّ</button>
    <button class="word-link" type="button" data-word="بِالسِّنِّ" data-root="S N N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-n/" data-root-meaning="A tooth; sunnah is an established way; masnūn has differing explanations, including shaped or altered." data-context="For a tooth: the corresponding tooth in the provision concerning retribution.">بِالسِّنِّ</button>
    <button class="word-link" type="button" data-word="وَالجُروحَ" data-root="J R H" data-root-meaning="Wounding and producing an injury on the body; in another branch, acquiring and performing an act." data-context="And wounds: bodily injuries for which the provision concerning equivalent retribution is stated." data-learn-more="/quran-terminology/en/roots/j-r-h/">وَالجُروحَ</button>
    <button class="word-link" type="button" data-word="قِصاصٌ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="Qiṣāṣ, proportionate response concerning wounds, in the account of a provision prescribed for them in the Torah." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">قِصاصٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="تَصَدَّقَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Gives up the right to retribution as charity: pardon expressed as a voluntary relinquishment.">تَصَدَّقَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="فَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهُوَ</button>
    <button class="word-link" type="button" data-word="كَفّارَةٌ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="An expiation that covers the effect of wrongdoing. Exegetes differ on whether “for him” refers to the person granting pardon or the person pardoned.">كَفّارَةٌ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَحكُم" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Does not judge: in the conditional statement about failing to judge by what has been sent down.">يَحكُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Has sent down: the communication of the provision and revelation by The God.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers: the verse’s closing description of those who do not judge by what has been sent down.">الظّٰلِمونَ</button>
  </p>
  <p class="english-verse">We prescribed for them in it: life for life, eye for eye, nose for nose, ear for ear, tooth for tooth, and retribution for wounds. Whoever waives it as charity, it is an expiation for him. Whoever does not judge by what The God has sent down, those are the wrongdoers.</p>
</section>
