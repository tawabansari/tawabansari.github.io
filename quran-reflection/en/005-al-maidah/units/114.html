  <h2 class="ayah-title">Al-Ma’idah 5:114</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="عيسَى" data-root-note="Proper name; no root has been assigned.">عيسَى</button>
    <button class="word-link" type="button" data-word="ابنُ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">ابنُ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="Proper name; no root has been assigned.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="اللَّهُمَّ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُمَّ</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَنزِل" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">أَنزِل</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    <button class="word-link" type="button" data-word="مائِدَةً" data-root="M Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-y-d/" data-root-meaning="Swaying or oscillating; māʾidah is a table or spread of food.">مائِدَةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّماءِ</button>
    <button class="word-link" type="button" data-word="تَكونُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">تَكونُ</button>

    <button class="word-link" type="button" data-word="وَءاخِرِنا" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">وَءاخِرِنا</button>

    <button class="word-link" type="button" data-word="مِنكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَارزُقنا" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">وَارزُقنا</button>
    <button class="word-link" type="button" data-word="وَأَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتَ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرُ</button>
    <button class="word-link" type="button" data-word="الرّٰزِقينَ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">الرّٰزِقينَ</button>
  </p>
  <p class="english-verse">Jesus son of Mary said, “O The God, our Lord, send down to us a table spread from heaven to be a feast for us, for our first and our last, and a sign from You. Provide for us; You are the best of providers.”</p>
</section>
