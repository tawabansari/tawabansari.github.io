<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاعلَم" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">فَاعلَم</button>

    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>

  <p class="english-verse">Know that there is no god but The God, and seek forgiveness for your sin and for believing men and women. The God knows your movements and your resting place.</p>
