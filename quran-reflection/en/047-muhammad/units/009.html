<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="كَرِهوا" data-root="K R H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-h2/" data-root-meaning="Dislike or hardship; ikrāh means compulsion against one&#x27;s will.">كَرِهوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="فَأَحبَطَ" data-root="H B TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-tt/" data-root-meaning="An action becoming void or fruitless; iḥbāṭ: nullifying its effect or result.">فَأَحبَطَ</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">أَعمٰلَهُم</button>
  </p>
  <p class="english-verse">That is because they disliked what The God sent down, so He made their deeds fruitless.</p>
