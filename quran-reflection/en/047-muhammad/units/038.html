<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:38</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰأَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰأَنتُم</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="تُدعَونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="You are called upon">تُدعَونَ</button>
    <button class="word-link" type="button" data-word="لِتُنفِقوا" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="To spend from your resources">لِتُنفِقوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way, the direction or cause of the expenditure">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَمِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمِنكُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَبخَلُ" data-root="B KH L" data-root-meaning="Withholding or refusing to give, especially where fulfilling a due or generosity is appropriate." data-learn-more="/quran-terminology/en/roots/b-kh-l/" data-context="Withholds, refusing to spend">يَبخَلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَبخَل" data-root="B KH L" data-root-meaning="Withholding or refusing to give, especially where fulfilling a due or generosity is appropriate." data-learn-more="/quran-terminology/en/roots/b-kh-l/" data-context="Withholds, within the conditional clause">يَبخَل</button>
    <button class="word-link" type="button" data-word="فَإِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّما</button>
    <button class="word-link" type="button" data-word="يَبخَلُ" data-root="B KH L" data-root-meaning="Withholding or refusing to give, especially where fulfilling a due or generosity is appropriate." data-learn-more="/quran-terminology/en/roots/b-kh-l/" data-context="Withholds, here to their own detriment">يَبخَلُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Their own self, the person who withholds">نَفسِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="الغَنِىُّ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting." data-context="Free of need, not needing your wealth or expenditure">الغَنِىُّ</button>
    <button class="word-link" type="button" data-word="وَأَنتُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتُمُ</button>
    <button class="word-link" type="button" data-word="الفُقَراءُ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity." data-context="The needy, you who need Him">الفُقَراءُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تَتَوَلَّوا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="You turn away">تَتَوَلَّوا</button>
    <button class="word-link" type="button" data-word="يَستَبدِل" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning." data-context="Replaces, bringing a people in your place">يَستَبدِل</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life; also qawm: a people or community sharing a connection." data-context="A people, another community">قَومًا</button>
    <button class="word-link" type="button" data-word="غَيرَكُم" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Other than you">غَيرَكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Be, negated here as will not be">يَكونوا</button>
    <button class="word-link" type="button" data-word="أَمثٰلَكُم" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like you, in the conduct described">أَمثٰلَكُم</button>
  </p>
  <p class="english-verse">Here you are, called to spend in the way of The God, yet some of you are miserly. Whoever is miserly is miserly only against himself. The God is free of need, while you are needy. If you turn away, He will replace you with another people, and they will not be like you.</p>
</section>
