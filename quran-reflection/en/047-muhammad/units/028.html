<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَنَّهُمُ</button>
    <button class="word-link" type="button" data-word="اتَّبَعوا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="They followed; what brings anger.">اتَّبَعوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَسخَطَ" data-root="S KH TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-kh-tt/" data-root-meaning="Displeasure and anger." data-context="Angered; what provokes divine displeasure.">أَسخَطَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَكَرِهوا" data-root="K R H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-h2/" data-root-meaning="Dislike or hardship; ikrāh means compulsion against one&#x27;s will." data-context="And they disliked; disapproving of His pleasure.">وَكَرِهوا</button>
    <button class="word-link" type="button" data-word="رِضوٰنَهُ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent" data-context="His pleasure; the approval of The God.">رِضوٰنَهُ</button>
    <button class="word-link" type="button" data-word="فَأَحبَطَ" data-root="H B TT" data-root-meaning="A deed losing its fruit and value; in Form IV, rendering it fruitless and ineffective." data-context="So He rendered fruitless; the deeds of those who followed divine displeasure." data-learn-more="/quran-terminology/en/roots/h-b-tt/">فَأَحبَطَ</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Their deeds; the conduct of that group.">أَعمٰلَهُم</button>
  </p>
  <p class="english-verse">That is because they followed what angered The God and disliked His pleasure, so He made their deeds fruitless.</p>
</section>
