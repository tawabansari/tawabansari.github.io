<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَستَمِعُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Listens to you: hearing Muḥammad in the gathering, without hearing alone guaranteeing understanding or acceptance.">يَستَمِعُ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="خَرَجوا" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="They went out: they left the addressee’s presence and the gathering in which he spoke.">خَرَجوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِندِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندِكَ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said: they put their question to those who had been given knowledge.">قالوا</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Have been given: the passive verb describing those endowed with knowledge.">أوتُوا</button>
    <button class="word-link" type="button" data-word="العِلمَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge: what the people addressed by the question have been given, distinguishing them as able to explain the speech.">العِلمَ</button>
    <button class="word-link" type="button" data-word="ماذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">ماذا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said: the past-tense verb concerning what Muḥammad said a short while earlier.">قالَ</button>
    <button class="word-link" type="button" data-word="ءانِفًا" data-root="A N F" data-learn-more="/quran-terminology/en/roots/a-n-f/" data-root-meaning="The first part of an undertaking, beginning anew, or a time that has only recently passed." data-context="Just a short while ago: the recent past of the words spoken, rather than arrogance or restarting speech.">ءانِفًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="طَبَعَ" data-root="TT B AYN" data-learn-more="/quran-terminology/en/roots/tt-b-ayn/" data-root-meaning="Sealing, imprinting, and fixing a lasting mark upon the channels of reception after a settled human direction." data-context="Has set a seal: describing obstructed reception in the hearts of those whom the verse also describes as following their desires.">طَبَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Their hearts: the inner centers of their reception and orientation in the description of sealing.">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعوا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="And they have followed: they have pursued their own desires.">وَاتَّبَعوا</button>
    <button class="word-link" type="button" data-word="أَهواءَهُم" data-root="H W Y" data-learn-more="/quran-terminology/en/roots/h2-w-y/" data-root-meaning="Falling, being drawn in a direction, and personal desire" data-context="Their own desires: the inclinations they have followed in this context of condemnation.">أَهواءَهُم</button>
  </p>
  <p class="english-verse">Among them are those who listen to you, until, when they leave you, they say to those given knowledge: What did he say just now? They are those whose hearts The God has sealed, and they have followed their desires.</p>
</section>
