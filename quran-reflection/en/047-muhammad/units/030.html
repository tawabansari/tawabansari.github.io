<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">نَشاءُ</button>
    <button class="word-link" type="button" data-word="لَأَرَينٰكَهُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">لَأَرَينٰكَهُم</button>
    <button class="word-link" type="button" data-word="فَلَعَرَفتَهُم" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity.">فَلَعَرَفتَهُم</button>
    <button class="word-link" type="button" data-word="بِسيمٰهُم" data-root="S W M" data-learn-more="/quran-terminology/en/roots/s-w-m/" data-root-meaning="Sending forth, placing under exposure, continual imposition, and marking for distinction">بِسيمٰهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَتَعرِفَنَّهُم" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity.">وَلَتَعرِفَنَّهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="لَحنِ" data-root="L H N" data-root-note="Root study coming soon.">لَحنِ</button>
    <button class="word-link" type="button" data-word="القَولِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">القَولِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="أَعمٰلَكُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">أَعمٰلَكُم</button>
  </p>
  <p class="english-verse">If We will, We can show them to you, and you would recognize them by their marks. You will surely recognize them by the tone of their speech. The God knows your deeds.</p>
</section>
