<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="طاعَةٌ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">طاعَةٌ</button>
    <button class="word-link" type="button" data-word="وَقَولٌ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقَولٌ</button>

    <button class="word-link" type="button" data-word="عَزَمَ" data-root="AYN Z M" data-root-note="Root study coming soon.">عَزَمَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="فَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَو</button>
    <button class="word-link" type="button" data-word="صَدَقُوا" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">صَدَقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">لَكانَ</button>

    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
  </p>
  <p class="english-verse">Obedience and proper speech. Then, when the matter is resolved, being true to The God would be better for them.</p>
