<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="طاعَةٌ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="Obedience, the desired response to responsibility.">طاعَةٌ</button>
    <button class="word-link" type="button" data-word="وَقَولٌ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And speech, paired with obedience and described as fitting.">وَقَولٌ</button>
    <button class="word-link" type="button" data-word="مَعروفٌ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="Fitting or right, describing the speech.">مَعروفٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="عَزَمَ" data-root="AYN Z M" data-learn-more="/quran-terminology/en/roots/ayn-z-m/" data-root-meaning="Serious, firm resolve and steadfastness in maintaining it; in ʿazama al-amr, a matter becoming serious and definite." data-context="Becomes serious and definite; the verb is assigned to the matter or responsibility itself.">عَزَمَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="The matter or responsibility, the grammatical subject of becoming serious and definite.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="فَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَو</button>
    <button class="word-link" type="button" data-word="صَدَقُوا" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Were true, concerning sincerity toward The God in the verse’s condition.">صَدَقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Would be, introducing the better outcome of the condition.">لَكانَ</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better, describing the outcome for them of being true to The God.">خَيرًا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
  </p>
  <p class="english-verse">Obedience and proper speech. Then, when the matter is resolved, being true to The God would be better for them.</p>
</section>
