<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَيَهديهِم" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="He will guide them, promising guidance to those mentioned in context.">سَيَهديهِم</button>
    <button class="word-link" type="button" data-word="وَيُصلِحُ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="And will set right, referring to their condition and affairs within the preceding promise.">وَيُصلِحُ</button>
    <button class="word-link" type="button" data-word="بالَهُم" data-root="B W L" data-root-meaning="Bāl denotes the condition, affairs, or matter concerning a person or group; its broader Arabic range also connects with thought and attention. Mā bālu asks about someone’s situation or affair; aṣlaḥa bālahu describes setting their condition and affairs right." data-context="Their condition and affairs, the object of promised rectification; in the qutilū reading and Paradise context, beyond worldly comfort alone." data-learn-more="/quran-terminology/en/roots/b-w-l/">بالَهُم</button>
  </p>
  <p class="english-verse">He will guide them and set their condition right,</p>
