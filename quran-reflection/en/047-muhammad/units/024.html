    <button class="word-link" type="button" data-word="القُرءانَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text in the question about reflection." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانَ</button>

  <p class="english-verse">Do they not reflect upon the Quran, or are there locks upon hearts?</p>
