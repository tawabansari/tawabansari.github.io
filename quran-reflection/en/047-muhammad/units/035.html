<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَهِنوا" data-root="W H2 N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h2-n/" data-root-meaning="Weakness or frailty.">تَهِنوا</button>
    <button class="word-link" type="button" data-word="وَتَدعوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">وَتَدعوا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="السَّلمِ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender">السَّلمِ</button>
    <button class="word-link" type="button" data-word="وَأَنتُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتُمُ</button>
    <button class="word-link" type="button" data-word="الأَعلَونَ" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting.">الأَعلَونَ</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="وَلَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَن</button>
    <button class="word-link" type="button" data-word="يَتِرَكُم" data-root="W T R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-t-r/" data-root-meaning="Singleness; diminishing a due; tatrā means one after another.">يَتِرَكُم</button>
    <button class="word-link" type="button" data-word="أَعمٰلَكُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">أَعمٰلَكُم</button>
  </p>
  <p class="english-verse">So do not weaken and call for peace while you have the upper hand. The God is with you and will not diminish your deeds.</p>
</section>
