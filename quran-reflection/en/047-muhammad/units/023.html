<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لَعَنَهُمُ" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion">لَعَنَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="فَأَصَمَّهُم" data-root="Ṣ M M" data-learn-more="/quran-terminology/en/roots/sad-m-m/" data-root-meaning="Deafness, blocked hearing, hardness, closure, and being impenetrable to sound or message">فَأَصَمَّهُم</button>
    <button class="word-link" type="button" data-word="وَأَعمىٰ" data-root="AYN M Y" data-learn-more="/quran-terminology/en/roots/ayn-m-y/" data-root-meaning="Blindness, not seeing, the covered path of sight, ambiguity, and the loss of observation or discernment">وَأَعمىٰ</button>
    <button class="word-link" type="button" data-word="أَبصٰرَهُم" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">أَبصٰرَهُم</button>
  </p>
  <p class="english-verse">They are those whom The God has cursed, making them deaf and blinding their eyes.</p>
</section>
