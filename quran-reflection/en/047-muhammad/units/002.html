<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believed, referring to the people subsequently described.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَمِلُوا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="And did, referring to righteous deeds.">وَعَمِلُوا</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتِ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Righteous or worthy deeds, the object of “did.”">الصّٰلِحٰتِ</button>
    <button class="word-link" type="button" data-word="وَءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="And believed, specifically in what was sent down upon Muḥammad.">وَءامَنوا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="نُزِّلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Was sent down, referring to the revelation given to Muḥammad.">نُزِّلَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مُحَمَّدٍ" data-root-note="Proper name; no root has been assigned.">مُحَمَّدٍ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="The truth, describing what has come from their Lord.">الحَقُّ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord, the source of the truth sent down.">رَبِّهِم</button>
    ۙ
    <button class="word-link" type="button" data-word="كَفَّرَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Removed or covered over, referring to their wrongs and removal of their adverse consequence.">كَفَّرَ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِهِم" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Their wrongs or evil deeds, the object of removal.">سَيِّـٔاتِهِم</button>
    <button class="word-link" type="button" data-word="وَأَصلَحَ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="And set right or rectified, referring to their condition and affairs.">وَأَصلَحَ</button>
    <button class="word-link" type="button" data-word="بالَهُم" data-root="B W L" data-root-meaning="Bāl denotes the condition, affairs, or matter concerning a person or group; its broader Arabic range also connects with thought and attention. Mā bālu asks about someone’s situation or affair; aṣlaḥa bālahu describes setting their condition and affairs right." data-context="Their condition and affairs, the object of aṣlaḥa, set right for the believers described." data-learn-more="/quran-terminology/en/roots/b-w-l/">بالَهُم</button>
  </p>
  <p class="english-verse">Those who believed, did good deeds, and believed in what was sent down to Muhammad—and it is the truth from their Lord—He removed their evil deeds and set their condition right.</p>
</section>
