<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Muhammad 47:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلَم</button>
    <button class="word-link" type="button" data-word="يَسيروا" data-root="S Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-r/" data-root-meaning="Traveling or moving along a course; sīrah denotes a way or condition." data-context="Travel through the earth: journeying to observe earlier peoples’ outcomes.">يَسيروا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth: the setting of travel and observation of earlier peoples’ remains.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="فَيَنظُروا" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Then see: observing and considering predecessors’ outcomes.">فَيَنظُروا</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was: concerning the predecessors’ outcome.">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass" data-context="The outcome: the fate of those who came before.">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before them: earlier peoples and groups.">قَبلِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="دَمَّرَ" data-root="D M R" data-learn-more="/quran-terminology/en/roots/d-m-r/" data-root-meaning="Severe destruction and ruin; tadmīr: destroying or laying waste. Another Arabic branch uses damara for entering or bursting in." data-context="Brought destruction: upon earlier peoples, in the construction with ʿalā, “upon.”">دَمَّرَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِلكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="And for the disbelievers: those concerned by the closing warning.">وَلِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="أَمثٰلُها" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Similar outcomes: counterparts to the destruction just described.">أَمثٰلُها</button>
  </p>
  <p class="english-verse">Have they not traveled through the earth to see how those before them ended? The God brought destruction upon them, and for the disbelievers is its like.</p>
</section>
