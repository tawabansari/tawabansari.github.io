<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Nuh 71:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord.">رَبِّ</button>
    <button class="word-link" type="button" data-word="اغفِر" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgive and pardon wrongdoing.">اغفِر</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لى</button>
    <button class="word-link" type="button" data-word="وَلِوٰلِدَىَّ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth" data-context="And for my parents.">وَلِوٰلِدَىَّ</button>
    <button class="word-link" type="button" data-word="وَلِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلِمَن</button>
    <button class="word-link" type="button" data-word="دَخَلَ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="Entered.">دَخَلَ</button>
    <button class="word-link" type="button" data-word="بَيتِىَ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="My house, entered by a believer." data-learn-more="/quran-terminology/en/roots/b-y-t/">بَيتِىَ</button>
    <button class="word-link" type="button" data-word="مُؤمِنًا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="As a believer.">مُؤمِنًا</button>
    <button class="word-link" type="button" data-word="وَلِلمُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="And for believing men.">وَلِلمُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤمِنٰتِ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="And believing women.">وَالمُؤمِنٰتِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَزِدِ" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="Increase, in the prayer for increase only in ruin.">تَزِدِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Those who do wrong.">الظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="تَبارًا" data-root="T B R" data-learn-more="/quran-terminology/en/roots/t-b-r/" data-root-meaning="Breaking apart and eliminating a body or order so that it loses the ability to continue in its previous form." data-context="Destruction and ruin.">تَبارًا</button>
  </p>
  <p class="english-verse">My Lord, forgive me and my parents, and whoever enters my house as a believer, and the believing men and women. Increase the wrongdoers only in ruin.”</p>
</section>
