<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Nuh 71:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Made; presenting Earth as a spread-out expanse.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="Earth; what is made an expanse for people.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="بِساطًا" data-root="B S TT" data-root-meaning="Opening, spreading, and extending; context can apply this to ample provision or breadth of knowledge and capacity." data-context="A spread-out expanse; an accusative noun and second object of jaʿala describing Earth for human use." data-learn-more="/quran-terminology/en/roots/b-s-tt/">بِساطًا</button>
  </p>
  <p class="english-verse">The God made the earth a spread for you,</p>
</section>
