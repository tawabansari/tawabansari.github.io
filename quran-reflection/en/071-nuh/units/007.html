<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Nuh 71:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="كُلَّما" data-root="K L L" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-learn-more="/quran-terminology/en/roots/k-l-l/" data-context="Whenever; each occasion of Noah’s call and his people’s response.">كُلَّما</button>
    <button class="word-link" type="button" data-word="دَعَوتُهُم" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="I called them; inviting his people in connection with forgiveness.">دَعَوتُهُم</button>
    <button class="word-link" type="button" data-word="لِتَغفِرَ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="So that You might forgive; the purpose of Noah’s call as he addresses his Lord.">لِتَغفِرَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="جَعَلوا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="They put; placing their fingers in their ears.">جَعَلوا</button>
    <button class="word-link" type="button" data-word="أَصٰبِعَهُم" data-root="Ṣ B AYN" data-learn-more="/quran-terminology/en/roots/sad-b-ayn/" data-root-meaning="Fingers; the slender branching parts of hand or foot used for touch, grasping, pointing, measuring, and sometimes closing an opening" data-context="Their fingers; what they put in their ears to avoid hearing the call.">أَصٰبِعَهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ءاذانِهِم" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Their ears; where they put their fingers in response to Noah’s call.">ءاذانِهِم</button>
    <button class="word-link" type="button" data-word="وَاستَغشَوا" data-root="GH SH Y" data-learn-more="/quran-terminology/en/roots/gh-sh-w/" data-root-meaning="Covering, enveloping, being surrounded, and a changed state through covering" data-context="And they covered themselves; drawing their garments over themselves to avoid hearing and accepting the call.">وَاستَغشَوا</button>
    <button class="word-link" type="button" data-word="ثِيابَهُم" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="Their garments; the covering they drew over themselves.">ثِيابَهُم</button>
    <button class="word-link" type="button" data-word="وَأَصَرّوا" data-root="SAD R R" data-learn-more="/quran-terminology/en/roots/sad-r-r/" data-root-meaning="Binding and securing; persisting and not desisting; bitter cold; shrill sound or a loud cry" data-context="And they persisted; maintaining their opposition and refusal to accept Noah’s call.">وَأَصَرّوا</button>
    <button class="word-link" type="button" data-word="وَاستَكبَرُوا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="And they acted arrogantly; showing self-importance in response to Noah’s call.">وَاستَكبَرُوا</button>
    <button class="word-link" type="button" data-word="استِكبارًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="With great arrogance; a cognate verbal noun emphasizing their self-importance.">استِكبارًا</button>
  </p>
  <p class="english-verse">Whenever I called them so that You might forgive them, they put their fingers in their ears, covered themselves with their garments, persisted, and grew utterly arrogant.</p>
</section>
