<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Nuh 71:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَنبَتَكُم" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed.">أَنبَتَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="نَباتًا" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed.">نَباتًا</button>
  </p>
  <p class="english-verse">The God caused you to grow from the earth,</p>
</section>
