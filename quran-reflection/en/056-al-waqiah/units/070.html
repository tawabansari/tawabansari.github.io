  <h2 class="ayah-title">Al-Waqiah 56:70</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>

    <button class="word-link" type="button" data-word="جَعَلنٰهُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلنٰهُ</button>

  <p class="english-verse">If We wished, We would make it bitter and salty. Why, then, do you not give thanks?</p>
