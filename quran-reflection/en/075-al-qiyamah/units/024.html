<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qiyamah 75:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوُجوهٌ" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh" data-context="And faces; the faces whose grim condition is stated in this sentence.">وَوُجوهٌ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that Day; referring to the Day of Resurrection in this passage.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="باسِرَةٌ" data-root="B S R" data-root-meaning="Scowling, sourness, and grimness of face; other branches concern freshness and unripeness, premature action, and standing still." data-context="Grim and scowling; a feminine nominative active participle predicating the condition of the faces on that Day." data-learn-more="/quran-terminology/en/roots/b-s-r/">باسِرَةٌ</button>
  </p>
  <p class="english-verse">And faces that day will be grim,</p>
