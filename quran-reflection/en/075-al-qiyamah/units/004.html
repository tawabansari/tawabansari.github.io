<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qiyamah 75:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَلىٰ</button>
    <button class="word-link" type="button" data-word="قٰدِرينَ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="We are able, affirming power in response to the supposition that human bones will not be gathered.">قٰدِرينَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="نُسَوِّىَ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Form properly and arrange, concerning human digits in the context of re-creation.">نُسَوِّىَ</button>
    <button class="word-link" type="button" data-word="بَنانَهُ" data-root="B N N" data-root-meaning="Banān denotes fingers and toes, particularly their end portions. In some extended uses it can also include bodily extremities." data-context="His digits, the object of proper formation in the response to denial of human re-creation." data-learn-more="/quran-terminology/en/roots/b-n-n/">بَنانَهُ</button>
  </p>
  <p class="english-verse">Yes indeed, We are able even to restore his fingertips.</p>
</section>
