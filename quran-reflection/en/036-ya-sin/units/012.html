<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">نَحنُ</button>
    <button class="word-link" type="button" data-word="نُحىِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="We bring to life; the dead">نُحىِ</button>
    <button class="word-link" type="button" data-word="المَوتىٰ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="The dead">المَوتىٰ</button>
    <button class="word-link" type="button" data-word="وَنَكتُبُ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="And We write; their deeds and traces">وَنَكتُبُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="قَدَّموا" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="Sent ahead; what they have done">قَدَّموا</button>
    <button class="word-link" type="button" data-word="وَءاثٰرَهُم" data-root="A TH R" data-learn-more="/quran-terminology/en/roots/a-th-r/" data-root-meaning="Traces, footprints, remnants, or consequences." data-context="And their remaining traces and effects">وَءاثٰرَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="And every, expressing comprehensive scope">وَكُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing, in the expression everything">شَىءٍ</button>
    <button class="word-link" type="button" data-word="أَحصَينٰهُ" data-root="H SAD Y" data-root-meaning="The Qur’anic branch’s semantic core is accurate, comprehensive counting and accounting for the number, quantity, or parts of something; in relevant contexts it conveys complete recording without omission." data-context="We have fully recorded and accounted for it; everything" data-learn-more="/quran-terminology/en/roots/h-sad-y/">أَحصَينٰهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="إِمامٍ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="Imām, the reference or framework of recording in this verse">إِمامٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Clear and clarifying, describing the imām">مُبينٍ</button>
  </p>
  <p class="english-verse">Indeed, We give life to the dead and write down what they sent ahead and their traces. And We have enumerated everything in a clear register.</p>
</section>
