    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ثَمَرِهِ" data-root="TH M R" data-learn-more="/quran-terminology/en/roots/th-m-r/" data-root-meaning="Fruit and produce, with extensions to yield and wealth">ثَمَرِهِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="عَمِلَتهُ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">عَمِلَتهُ</button>

    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="يَشكُرونَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action">يَشكُرونَ</button>
  </p>
  <p class="english-verse">so that they may eat of its fruit, though their hands did not make it. Will they not then give thanks?</p>
