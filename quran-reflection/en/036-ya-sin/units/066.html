<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:66</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">نَشاءُ</button>
    <button class="word-link" type="button" data-word="لَطَمَسنا" data-root="TT M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-m-s/" data-root-meaning="Effacing or obliterating a trace or light.">لَطَمَسنا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَعيُنِهِم" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink.">أَعيُنِهِم</button>
    <button class="word-link" type="button" data-word="فَاستَبَقُوا" data-root="S B Q" data-learn-more="/quran-terminology/en/roots/s-b-q/" data-root-meaning="Preceding, getting ahead and outstripping: from racing and temporal priority to taking the lead in good deeds and the impossibility of outstripping The God’s will">فَاستَبَقُوا</button>
    <button class="word-link" type="button" data-word="الصِّرٰطَ" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/">الصِّرٰطَ</button>
    <button class="word-link" type="button" data-word="فَأَنّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُبصِرونَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">يُبصِرونَ</button>
  </p>
  <p class="english-verse">And if We willed, We could obliterate their eyes; then they would race toward the path, but how would they see?</p>
