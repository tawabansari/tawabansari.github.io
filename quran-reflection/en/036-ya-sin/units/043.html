<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:43</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="نَشَأ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="We will; within the condition concerning their drowning.">نَشَأ</button>
    <button class="word-link" type="button" data-word="نُغرِقهُم" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water" data-context="We drown them; cause them to be overwhelmed by water.">نُغرِقهُم</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="صَريخَ" data-root="SAD R KH" data-learn-more="/quran-terminology/en/roots/sad-r-kh/" data-root-meaning="Loud crying; calling for help; answering a cry and providing aid, according to form and context." data-context="A rescuer; one who could save them from drowning, whose presence is denied in the sentence.">صَريخَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="يُنقَذونَ" data-root="N Q DH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-q-dh/" data-root-meaning="Rescuing from danger or distress." data-context="Are rescued; their deliverance from drowning is denied in the sentence.">يُنقَذونَ</button>
  </p>
  <p class="english-verse">And if We will, We drown them, and there will be no one to answer their cry, nor will they be rescued,</p>
