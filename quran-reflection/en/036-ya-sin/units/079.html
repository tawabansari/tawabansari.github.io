  <h2 class="ayah-title">Ya-Sin 36:79</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the instruction to answer the question about bones.">قُل</button>

    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>

  <p class="english-verse">Say: The One who originated them the first time will give them life, and He knows every creation,</p>
