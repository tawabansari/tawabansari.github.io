<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:38</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالشَّمسُ" data-root="SH M S" data-learn-more="/quran-terminology/en/roots/sh-m-s/" data-root-meaning="The sun, the celestial body. A separate Arabic branch concerns skittishness and resistance to restraint; that branch does not occur in the Quran." data-context="And the sun, whose motion toward an appointed place or term is described.">وَالشَّمسُ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="J R Y" data-learn-more="/quran-terminology/en/roots/j-r-y/" data-root-meaning="Flowing, running, continuous movement in a channel, and moving along an appointed course" data-context="Runs or moves, describing the sun.">تَجرى</button>
    <button class="word-link" type="button" data-word="لِمُستَقَرٍّ" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness." data-context="To an appointed resting place or term, interpreted in context.">لِمُستَقَرٍّ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَها</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="تَقديرُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Determination or ordering of the sun’s course.">تَقديرُ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="The Almighty, describing the One who determines this order.">العَزيزِ</button>
    <button class="word-link" type="button" data-word="العَليمِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="The Knowing, describing the One who determines this order.">العَليمِ</button>
  </p>
  <p class="english-verse">And the sun runs toward its resting place. That is the determination of the Mighty, the Knowing.</p>
</section>
