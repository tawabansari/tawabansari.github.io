<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:54</h2>

    <button class="word-link" type="button" data-word="نَفسٌ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/">نَفسٌ</button>

  <p class="english-verse">So today no soul will be wronged at all, and you will be repaid only for what you used to do.</p>
