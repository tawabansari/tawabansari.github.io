  <h2 class="ayah-title">Ya-Sin 36:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ءَأَتَّخِذُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">ءَأَتَّخِذُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it">دونِهِ</button>

    <button class="word-link" type="button" data-word="يُرِدنِ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُرِدنِ</button>

    <button class="word-link" type="button" data-word="شَفٰعَتُهُم" data-root="SH F ʿ (SH F Ayn)" data-learn-more="/quran-terminology/en/roots/sh-f-ayn/" data-root-meaning="Pairing, joining, and placing one factor beside another to support or strengthen an effect">شَفٰعَتُهُم</button>

    <button class="word-link" type="button" data-word="يُنقِذونِ" data-root="N Q DH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-q-dh/" data-root-meaning="Rescuing from danger or distress.">يُنقِذونِ</button>
  </p>
  <p class="english-verse">Shall I take deities besides Him? If the Entirely Merciful intends harm for me, their intercession will not avail me at all, nor will they rescue me.</p>
