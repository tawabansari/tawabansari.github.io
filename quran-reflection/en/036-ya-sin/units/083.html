<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:83</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَسُبحٰنَ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution">فَسُبحٰنَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="بِيَدِهِ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">بِيَدِهِ</button>
    <button class="word-link" type="button" data-word="مَلَكوتُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God">مَلَكوتُ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="تُرجَعونَ" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference">تُرجَعونَ</button>
  </p>
  <p class="english-verse">So glory be to the One in whose hand is the dominion of all things, and to whom you will be returned.</p>
</section>
