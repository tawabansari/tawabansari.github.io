<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said, the people’s threatening reply to the messengers.">قالوا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="تَطَيَّرنا" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record." data-context="We see an evil omen, attributing ill fortune to the messengers.">تَطَيَّرنا</button>
    <button class="word-link" type="button" data-word="بِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="تَنتَهوا" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="You desist, in the people’s threat against the messengers." data-learn-more="/quran-terminology/en/roots/n-h2-y/">تَنتَهوا</button>
    <button class="word-link" type="button" data-word="لَنَرجُمَنَّكُم" data-root="R J M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-m/" data-root-meaning="Pelting with stones; also expelling or making conjectural claims, according to context." data-context="We will surely stone you, the threat if they do not desist.">لَنَرجُمَنَّكُم</button>
    <button class="word-link" type="button" data-word="وَلَيَمَسَّنَّكُم" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="And will surely touch you, the threatened punishment.">وَلَيَمَسَّنَّكُم</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="A punishment, the suffering threatened by the people.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful, describing the threatened punishment.">أَليمٌ</button>
  </p>
  <p class="english-verse">They said: We consider you a bad omen. If you do not desist, we will surely stone you, and a painful punishment from us will touch you.</p>
