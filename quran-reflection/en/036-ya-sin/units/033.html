<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءايَةٌ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="and a sign">وَءايَةٌ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُمُ</button>

    <button class="word-link" type="button" data-word="المَيتَةُ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="lifeless">المَيتَةُ</button>

  </p>
  <p class="english-verse">And a sign for them is the dead earth. We give it life and bring forth grain from it, from which they eat.</p>
