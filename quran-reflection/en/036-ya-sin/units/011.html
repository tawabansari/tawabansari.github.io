<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="تُنذِرُ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">تُنذِرُ</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَنِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">اتَّبَعَ</button>
    <button class="word-link" type="button" data-word="الذِّكرَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">الذِّكرَ</button>
    <button class="word-link" type="button" data-word="وَخَشِىَ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God">وَخَشِىَ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">الرَّحمٰنَ</button>
    <button class="word-link" type="button" data-word="بِالغَيبِ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God">بِالغَيبِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبَشِّرهُ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">فَبَشِّرهُ</button>
    <button class="word-link" type="button" data-word="بِمَغفِرَةٍ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">بِمَغفِرَةٍ</button>
    <button class="word-link" type="button" data-word="وَأَجرٍ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">وَأَجرٍ</button>
    <button class="word-link" type="button" data-word="كَريمٍ" data-root="K R M" data-root-note="Root study coming soon.">كَريمٍ</button>
  </p>
  <p class="english-verse">You only warn one who follows the reminder and fears the Entirely Merciful unseen. So give him good tidings of forgiveness and a noble reward.</p>
</section>
