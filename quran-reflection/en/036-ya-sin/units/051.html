<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">Ya-Sin 36:51</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنُفِخَ" data-root="N F KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-kh/" data-root-meaning="Blowing or setting air in motion." data-context="And the trumpet is blown, a passive verb.">وَنُفِخَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="SAD W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Forming or giving shape; ṣūr is a trumpet; ṣur in al-Baqarah has explanations involving drawing near or gathering." data-context="The trumpet into which the blast is blown.">الصّورِ</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَجداثِ" data-root="J D TH" data-root-meaning="A grave; the place where a dead person is buried." data-context="The graves, from which people emerge." data-learn-more="/quran-terminology/en/roots/j-d-th/">الأَجداثِ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord, the stated destination of movement in the resurrection scene.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="يَنسِلونَ" data-root="N S L" data-root-meaning="Emergence and separation from a source; nasl denotes offspring and continuing descent, while yansiluna denotes swift movement." data-context="They come forth swiftly from the graves toward their Lord." data-learn-more="/quran-terminology/en/roots/n-s-l/">يَنسِلونَ</button>
  </p>
  <p class="english-verse">And the trumpet will be blown, and suddenly they will hurry from the graves to their Lord.</p>
</section>
