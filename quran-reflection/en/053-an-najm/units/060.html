  <h2 class="ayah-title">An-Najm 53:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَضحَكونَ" data-root="DAD H K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-h-k/" data-root-meaning="Laughing or showing joy." data-context="And you laugh: the audience’s response, rebuked in this context.">وَتَضحَكونَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبكونَ" data-root="B K Y" data-root-meaning="B K Y denotes weeping: the manifestation of a state that may involve tears, lamenting sounds, or sorrow and emotional response. In its causative form, it expresses making someone weep or causing weeping." data-context="You do not weep, contrasted with the audience’s laughter in a rebuke of their response." data-learn-more="/quran-terminology/en/roots/b-k-y/">تَبكونَ</button>
  </p>
  <p class="english-verse">And laugh and do not weep,</p>
