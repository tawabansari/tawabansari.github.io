<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">An-Najm 53:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَجتَنِبونَ" data-root="J N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-n-b/" data-root-meaning="A side, flank, or region; ijtināb: keeping away; junub denotes a particular ritual condition." data-context="Avoid">يَجتَنِبونَ</button>
    <button class="word-link" type="button" data-word="كَبٰئِرَ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Major, describing sins">كَبٰئِرَ</button>
    <button class="word-link" type="button" data-word="الإِثمِ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Sin">الإِثمِ</button>
    <button class="word-link" type="button" data-word="وَالفَوٰحِشَ" data-root="F H SH" data-root-meaning="Gross ugliness and reprehensibility: conduct or speech exceeding decent and acceptable bounds." data-context="And grossly shameful acts, alongside major sins and the distinct question of lamam." data-learn-more="/quran-terminology/en/roots/f-h-sh/">وَالفَوٰحِشَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="اللَّمَمَ" data-root="L M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-m-m/" data-root-meaning="Gathering or approaching; lamam denotes limited lapses, with differing explanations of its scope." data-context="Lamam, limited lapses, with disputed precise referents">اللَّمَمَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="وٰسِعُ" data-root="W S ʿ" data-learn-more="/quran-terminology/en/roots/w-s-ayn/" data-root-meaning="From spaciousness to capacity, ability and encompassing" data-context="Abundant, describing forgiveness">وٰسِعُ</button>
    <button class="word-link" type="button" data-word="المَغفِرَةِ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiveness">المَغفِرَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="More knowing of your condition">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكُم</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="أَنشَأَكُم" data-root="N SH A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-a/" data-root-meaning="Originating, growing, or nurturing." data-context="Brought you forth">أَنشَأَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتُم</button>
    <button class="word-link" type="button" data-word="أَجِنَّةٌ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="Embryos">أَجِنَّةٌ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُطونِ" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="Wombs or bellies" data-learn-more="/quran-terminology/en/roots/b-tt-n/">بُطونِ</button>
    <button class="word-link" type="button" data-word="أُمَّهٰتِكُم" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="Your mothers">أُمَّهٰتِكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تُزَكّوا" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness." data-context="Do not declare pure">تُزَكّوا</button>
    <button class="word-link" type="button" data-word="أَنفُسَكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Yourselves">أَنفُسَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="More knowing of the mindful">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="بِمَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِمَنِ</button>
    <button class="word-link" type="button" data-word="اتَّقىٰ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Was mindful of prescribed bounds">اتَّقىٰ</button>
  </p>
  <p class="english-verse">Those who avoid major sins and indecencies, except minor lapses. Your Lord is vast in forgiveness. He knows you best, when He brought you forth from the earth and when you were embryos in your mothers’ wombs. So do not declare yourselves pure; He knows best who is mindful.</p>
</section>
