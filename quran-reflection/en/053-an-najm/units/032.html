  <p class="english-verse">Those who avoid major sins and indecencies, except minor lapses. Your Lord is vast in forgiveness. He knows you best, when He brought you forth from the earth and when you were embryos in your mothers’ wombs. So do not declare yourselves pure; He knows best who is mindful.</p>
