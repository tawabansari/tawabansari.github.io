  <h2 class="ayah-title">Yunus 10:73</h2>

    <button class="word-link" type="button" data-word="المُنذَرينَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">المُنذَرينَ</button>

  <p class="english-verse">They denied him, so We saved him and those with him in the ship, made them successors, and drowned those who denied Our signs. Look, then, at how those who were warned ended.</p>
