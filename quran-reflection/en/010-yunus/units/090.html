    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>

    <button class="word-link" type="button" data-word="المُسلِمينَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Those who submit.">المُسلِمينَ</button>
  </p>
  <p class="english-verse">We brought the Children of Israel across the sea, and Pharaoh and his troops pursued them in transgression and hostility. When drowning overtook him, he said, “I believe that there is no god except the One in whom the Children of Israel believe, and I am among those who submit.”</p>
</section>
