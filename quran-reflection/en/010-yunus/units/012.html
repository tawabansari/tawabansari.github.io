<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="مَسَّ" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="Touches; the arrival of distress upon the human being.">مَسَّ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being; whose conduct in distress and after relief is described.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="الضُّرُّ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="Distress; the harm that prompts a person to call for help.">الضُّرُّ</button>
    <button class="word-link" type="button" data-word="دَعانا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="He calls upon Us; seeking help during distress.">دَعانا</button>
    <button class="word-link" type="button" data-word="لِجَنبِهِ" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="On his side; the reclining position of a person calling upon God in distress." data-learn-more="/quran-terminology/en/roots/j-n-b/">لِجَنبِهِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="قاعِدًا" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Sitting; one of the bodily positions of calling upon God.">قاعِدًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="قائِمًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Standing; another bodily position of calling upon God.">قائِمًا</button>
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="كَشَفنا" data-root="K SH F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-sh-f/" data-root-meaning="Uncovering or revealing; also removing distress." data-context="We removed; lifting the person’s distress.">كَشَفنا</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُ</button>
    <button class="word-link" type="button" data-word="ضُرَّهُ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="His distress; the harm that is removed.">ضُرَّهُ</button>
    <button class="word-link" type="button" data-word="مَرَّ" data-root="M R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing or recurrence; also bitterness or strength in different forms." data-context="He goes on; proceeding after relief as though he had not called for help.">مَرَّ</button>
    <button class="word-link" type="button" data-word="كَأَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَدعُنا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="He had called upon Us; the earlier plea disregarded in his later conduct.">يَدعُنا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ضُرٍّ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="Distress; the harm about which help had been sought.">ضُرٍّ</button>
    <button class="word-link" type="button" data-word="مَسَّهُ" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="Had touched him; describing the earlier distress.">مَسَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="زُيِّنَ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="Was made attractive; the excessive finding their deeds appealing.">زُيِّنَ</button>
    <button class="word-link" type="button" data-word="لِلمُسرِفينَ" data-root="S R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-f/" data-root-meaning="Exceeding a measure or limit; excess." data-context="For the excessive; those who overstep bounds.">لِلمُسرِفينَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to; part of the construction describing their former conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They did; the deeds made attractive to them.">يَعمَلونَ</button>
  </p>
  <p class="english-verse">When harm touches a person, he calls upon Us on his side, sitting, or standing. When We remove his harm, he passes on as though he had never called upon Us concerning a harm that touched him. Thus what the excessive used to do has been made fair to them.</p>
</section>
