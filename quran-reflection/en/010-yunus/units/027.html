<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَسَبُوا" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Acquired, referring to evil deeds.">كَسَبُوا</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evil deeds they acquired.">السَّيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="جَزاءُ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Recompense or penalty for an evil deed.">جَزاءُ</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="An evil deed whose recompense is stated.">سَيِّئَةٍ</button>
    <button class="word-link" type="button" data-word="بِمِثلِها" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="With its like; expressing correspondence between the deed and recompense.">بِمِثلِها</button>
    <button class="word-link" type="button" data-word="وَتَرهَقُهُم" data-root="R H2 Q" data-learn-more="/quran-terminology/en/roots/r-h2-q/" data-root-meaning="Approaching, reaching, and overtaking; burdening with difficulty or pressure. The noun rahaq can denote injustice, transgression, or distress in particular uses." data-context="And overtakes them; humiliation is the subject.">وَتَرهَقُهُم</button>
    <button class="word-link" type="button" data-word="ذِلَّةٌ" data-root="DH L L" data-learn-more="/quran-terminology/en/roots/dh-l-l/" data-root-meaning="Being tamed, made accessible, humbled, or lowered from honor." data-context="Humiliation, the condition overtaking them.">ذِلَّةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عاصِمٍ" data-root="AYN SAD M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-m/" data-root-meaning="Protecting or preventing harm; iʿtiṣām means holding firmly to." data-context="A protector against punishment, whose presence is negated.">عاصِمٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="كَأَنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّما</button>
    <button class="word-link" type="button" data-word="أُغشِيَت" data-root="GH SH Y" data-learn-more="/quran-terminology/en/roots/gh-sh-w/" data-root-meaning="Covering, enveloping, being surrounded, and a changed state through covering" data-context="Were covered; the passive verb describing the faces.">أُغشِيَت</button>
    <button class="word-link" type="button" data-word="وُجوهُهُم" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh" data-context="Their faces, in the comparison with covering by darkness.">وُجوهُهُم</button>
    <button class="word-link" type="button" data-word="قِطَعًا" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="Portions of night in the verse’s image.">قِطَعًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="The night, supplying the image of darkness.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="مُظلِمًا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Dark; describing the night in this image.">مُظلِمًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="The inhabitants, in the expression “people of the fire.”">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="The fire, the place of the stated punishment.">النّارِ</button>
    ۖ
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place" data-context="Remaining there; describing their stay in the fire.">خٰلِدونَ</button>
  </p>
  <p class="english-verse">For those who earn evil deeds, the recompense of an evil deed is its like, and humiliation covers them. They have no protector against The God. It is as though their faces have been covered with pieces of a dark night. They are companions of the Fire, remaining in it.</p>
</section>
