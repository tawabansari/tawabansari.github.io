  <p class="english-verse">Moses said, “Our Lord, You have given Pharaoh and his chiefs adornment and wealth in the worldly life, our Lord, so that they lead astray from Your way. Our Lord, obliterate their wealth and harden their hearts, so that they do not believe until they see the painful punishment.”</p>
