<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="أَظلَمُ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="More unjust">أَظلَمُ</button>
    <button class="word-link" type="button" data-word="مِمَّنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمَّنِ</button>
    <button class="word-link" type="button" data-word="افتَرىٰ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations." data-context="Fabricated">افتَرىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كَذِبًا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="A lie">كَذِبًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="كَذَّبَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Denied">كَذَّبَ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِهِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="His signs">بِـٔايٰتِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success" data-context="Succeeds; negated here, does not succeed">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="Wrongdoers; those who commit wrongful acts" data-learn-more="/quran-terminology/en/roots/j-r-m/">المُجرِمونَ</button>
  </p>
  <p class="english-verse">Who is more unjust than one who invents a lie about The God or denies His signs? The guilty do not succeed.</p>
</section>
