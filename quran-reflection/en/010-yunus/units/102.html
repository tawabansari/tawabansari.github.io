  <h2 class="ayah-title">Yunus 10:102</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهَل</button>

    <button class="word-link" type="button" data-word="مِثلَ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">مِثلَ</button>

  <p class="english-verse">Do they await anything but the like of the days of those who passed before them? Say, “Wait, then; I am waiting with you.”</p>
