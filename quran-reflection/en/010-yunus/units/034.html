<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:34</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; directing the addressee to put the question.">قُل</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شُرَكائِكُم" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Your partners, those whom the audience claims as partners.">شُرَكائِكُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَبدَؤُا۟" data-root="B D A" data-context="Begins or originates, concerning creation." data-root-meaning="Beginning, doing something initially or starting an activity or process; in creation contexts, bringing forth initially." data-learn-more="/quran-terminology/en/roots/b-d-a/">يَبدَؤُا۟</button>
    <button class="word-link" type="button" data-word="الخَلقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Creation, which is originated and then brought back.">الخَلقَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُعيدُهُ" data-root="AYN W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-d/" data-root-meaning="Returning or repeating; ʿīd is a recurring occasion; ʿĀd is also a people&#x27;s proper name." data-context="Brings it back, with “it” referring to creation.">يُعيدُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُلِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command to state the answer.">قُلِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَبدَؤُا۟" data-root="B D A" data-context="Begins or originates, concerning creation." data-root-meaning="Beginning, doing something initially or starting an activity or process; in creation contexts, bringing forth initially." data-learn-more="/quran-terminology/en/roots/b-d-a/">يَبدَؤُا۟</button>
    <button class="word-link" type="button" data-word="الخَلقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Creation, which is originated and then brought back.">الخَلقَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُعيدُهُ" data-root="AYN W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-d/" data-root-meaning="Returning or repeating; ʿīd is a recurring occasion; ʿĀd is also a people&#x27;s proper name." data-context="Brings it back, with “it” referring to creation.">يُعيدُهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَنّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأَنّىٰ</button>
    <button class="word-link" type="button" data-word="تُؤفَكونَ" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="How are you turned away after the question about originating and repeating creation?">تُؤفَكونَ</button>
  </p>
  <p class="english-verse">Say, “Is there any among your partners who begins creation, then repeats it?” Say, “The God begins creation, then repeats it. How, then, are you turned away?”</p>
</section>
