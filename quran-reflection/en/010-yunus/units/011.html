<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="يُعَجِّلُ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">يُعَجِّلُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="الشَّرَّ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/">الشَّرَّ</button>
    <button class="word-link" type="button" data-word="استِعجالَهُم" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">استِعجالَهُم</button>
    <button class="word-link" type="button" data-word="بِالخَيرِ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">بِالخَيرِ</button>
    <button class="word-link" type="button" data-word="لَقُضِىَ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination">لَقُضِىَ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="أَجَلُهُم" data-root="A J L" data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period or time; where appropriate, the end of that period.">أَجَلُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَنَذَرُ" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be.">فَنَذَرُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="R J W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-w/" data-root-meaning="Hope or expectation; also an edge or side; postponement in some forms is also analyzed under r-j-ʾ.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="لِقاءَنا" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter">لِقاءَنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="طُغيٰنِهِم" data-root="Ṭ GH Y" data-learn-more="/quran-terminology/en/roots/tt-gh-y/" data-root-meaning="From transgression to Taghut: passing beyond the limit, breaking the boundary, and a false reference sitting in the place of truth">طُغيٰنِهِم</button>
    <button class="word-link" type="button" data-word="يَعمَهونَ" data-root="AYN M H" data-learn-more="/quran-terminology/en/roots/ayn-m-h2/" data-root-meaning="Wandering in confusion, moving without direction, and inward blindness toward the right path">يَعمَهونَ</button>
  </p>
  <p class="english-verse">If The God hastened evil for people as they seek to hasten good, their term would have been concluded. So We leave those who do not hope to meet Us wandering blindly in their transgression.</p>
</section>
