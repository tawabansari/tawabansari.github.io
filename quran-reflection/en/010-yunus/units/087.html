<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:87</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَوحَينا" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="And We conveyed revelation and guidance.">وَأَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="وَأَخيهِ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother; where context warrants, a fellow member of one’s people or an associate." data-context="And his brother, Aaron.">وَأَخيهِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَبَوَّءا" data-root="B W ʾ" data-learn-more="/quran-terminology/en/roots/b-w-a/" data-root-meaning="From returning and settling to providing a place and incurring consequences" data-context="You two provide and adopt places of dwelling.">تَبَوَّءا</button>
    <button class="word-link" type="button" data-word="لِقَومِكُما" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="For the people of you both." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. Qawm denotes a people, group, or community with a shared connection.">لِقَومِكُما</button>
    <button class="word-link" type="button" data-word="بِمِصرَ" data-root-note="Proper name; no root has been assigned.">بِمِصرَ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="Houses and dwelling places for the people." data-learn-more="/quran-terminology/en/roots/b-y-t/">بُيوتًا</button>
    <button class="word-link" type="button" data-word="وَاجعَلوا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And make.">وَاجعَلوا</button>
    <button class="word-link" type="button" data-word="بُيوتَكُم" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="Your houses, to be oriented toward worship." data-learn-more="/quran-terminology/en/roots/b-y-t/">بُيوتَكُم</button>
    <button class="word-link" type="button" data-word="قِبلَةً" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Places of orientation in worship, describing their houses.">قِبلَةً</button>
    <button class="word-link" type="button" data-word="وَأَقيمُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And establish.">وَأَقيمُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Prayer and worship.">الصَّلوٰةَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="And give good news.">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers.">المُؤمِنينَ</button>
  </p>
  <p class="english-verse">We revealed to Moses and his brother, “Settle your people in houses in Egypt, make your houses a direction of prayer, and establish prayer. Give good news to the believers.”</p>
</section>
