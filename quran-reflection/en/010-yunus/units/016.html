<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command to explain the Quran’s relation to divine will.">قُل</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Willed; within the counterfactual concerning divine will.">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَلَوتُهُ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another." data-context="I would have recited it; reciting the Quran to the audience, negated in the counterfactual.">تَلَوتُهُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَدرىٰكُم" data-root="D R Y" data-learn-more="/quran-terminology/en/roots/d-r-y/" data-root-meaning="Knowing or being aware of a matter; in Form IV, informing another." data-context="He would have made it known to you; negated within the counterfactual about divine will and the Quran.">أَدرىٰكُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَد</button>
    <button class="word-link" type="button" data-word="لَبِثتُ" data-root="L B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-th/" data-root-meaning="Staying or remaining for a period or in a place." data-context="I lived or remained; the messenger’s earlier life among the audience.">لَبِثتُ</button>
    <button class="word-link" type="button" data-word="فيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيكُم</button>
    <button class="word-link" type="button" data-word="عُمُرًا" data-root="ʿ M R" data-learn-more="/quran-terminology/en/roots/ayn-m-r/" data-root-meaning="ʿAmara: the continuation of life, inhabited places, and enduring presence" data-context="A lifetime; the earlier period of life among them.">عُمُرًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before it; the period before this Quran and its recitation.">قَبلِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ʿ Q L (Ayn Q L)" data-learn-more="/quran-terminology/en/roots/ayn-q-l/" data-root-meaning="Tying, restraining, understanding, connecting meaning, and holding judgment back from scattering" data-context="You reason; the question calling for reflection on that earlier life.">تَعقِلونَ</button>
  </p>
  <p class="english-verse">Say, “Had The God willed, I would not have recited it to you, nor would He have made it known to you. I have lived a lifetime among you before it. Will you not reason?”</p>
</section>
