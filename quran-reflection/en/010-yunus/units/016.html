  <h2 class="ayah-title">Yunus 10:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>

    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>

    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ʿ Q L (Ayn Q L)" data-learn-more="/quran-terminology/en/roots/ayn-q-l/" data-root-meaning="Tying, restraining, understanding, connecting meaning, and holding judgment back from scattering">تَعقِلونَ</button>

  <p class="english-verse">Say, “Had The God willed, I would not have recited it to you, nor would He have made it known to you. I have lived a lifetime among you before it. Will you not reason?”</p>
