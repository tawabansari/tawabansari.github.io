<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَهلَكنَا" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="We destroyed earlier generations when they did wrong." data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَهلَكنَا</button>
    <button class="word-link" type="button" data-word="القُرونَ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="Earlier generations and communities.">القُرونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكُم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before you.">قَبلِكُم</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمّا</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="When they did wrong.">ظَلَموا</button>
    ۙ
    <button class="word-link" type="button" data-word="وَجاءَتهُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to them.">وَجاءَتهُم</button>
    <button class="word-link" type="button" data-word="رُسُلُهُم" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Their messengers.">رُسُلُهُم</button>
    <button class="word-link" type="button" data-word="بِالبَيِّنٰتِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="With clear proofs.">بِالبَيِّنٰتِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were not, in the denial of belief.">كانوا</button>
    <button class="word-link" type="button" data-word="لِيُؤمِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="To believe.">لِيُؤمِنوا</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَجزِى" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Thus We recompense.">نَجزِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond." data-context="The offending people.">القَومَ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="J R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-r-m/" data-root-meaning="Cutting and acquiring; ijrām: committing an offense; lā jarama is an expression of certainty." data-context="Those committing offenses.">المُجرِمينَ</button>
  </p>
  <p class="english-verse">We destroyed generations before you when they did wrong. Their messengers came to them with clear proofs, but they would not believe. Thus We recompense the guilty people.</p>
