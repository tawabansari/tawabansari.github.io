<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَفىٰ" data-root="K F Y" data-learn-more="/quran-terminology/en/roots/k-f-y/" data-root-meaning="Sufficiency: meeting a need and handling another’s affairs; The God’s sufficiency in witnessing, reckoning, aid, and protection">فَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="شَهيدًا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">شَهيدًا</button>
    <button class="word-link" type="button" data-word="بَينَنا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَنا</button>

    <button class="word-link" type="button" data-word="عِبادَتِكُم" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">عِبادَتِكُم</button>

  <p class="english-verse">The God is sufficient as a witness between us and you. We were unaware of your worship.</p>
