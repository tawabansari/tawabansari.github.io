<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلَ</button>
    <button class="word-link" type="button" data-word="الشَّمسَ" data-root="SH M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-m-s/" data-root-meaning="The sun and its light.">الشَّمسَ</button>
    <button class="word-link" type="button" data-word="ضِياءً" data-root="Ḍ W ʾ" data-learn-more="/quran-terminology/en/roots/dad-w-a/" data-root-meaning="Lighting, shining, radiating, and making things visible through active brightness">ضِياءً</button>
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="Q M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-r/" data-root-meaning="The moon.">وَالقَمَرَ</button>
    <button class="word-link" type="button" data-word="نورًا" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">نورًا</button>
    <button class="word-link" type="button" data-word="وَقَدَّرَهُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">وَقَدَّرَهُ</button>
    <button class="word-link" type="button" data-word="مَنازِلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">مَنازِلَ</button>
    <button class="word-link" type="button" data-word="لِتَعلَموا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">لِتَعلَموا</button>
    <button class="word-link" type="button" data-word="عَدَدَ" data-root="ʿ D D (Ayn D D)" data-learn-more="/quran-terminology/en/roots/ayn-d-d/" data-root-meaning="Counting, measure, appointed duration, and ordered preparation for a defined purpose">عَدَدَ</button>
    <button class="word-link" type="button" data-word="السِّنينَ" data-root="S N W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-w/" data-root-meaning="A year or years; sanā means radiance; sanah is also analyzed under s-n-h.">السِّنينَ</button>
    <button class="word-link" type="button" data-word="وَالحِسابَ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">وَالحِسابَ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">خَلَقَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">بِالحَقِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="يُفَصِّلُ" data-root="F SAD L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-sad-l/" data-root-meaning="Separating or detailing; faṣl denotes distinction or decisive judgment.">يُفَصِّلُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمونَ</button>
  </p>
  <p class="english-verse">He is the One who made the sun a radiance and the moon a light, and measured out stages for it so that you may know the number of years and the reckoning. The God created this only in truth. He sets out the signs in detail for people who know.</p>
</section>
