  <p class="english-verse">You are engaged in no affair, recite no portion of Qur’an from it, and do no deed without Our being witnesses over you as you enter into it. Nothing of an atom’s weight on earth or in heaven escapes your Lord, nor anything smaller or greater, except that it is in a clear Book.</p>
