<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">Yunus 10:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَحزُنكَ" data-root="Ḥ Z N" data-learn-more="/quran-terminology/en/roots/h-z-n/" data-root-meaning="Grief, heaviness of the heart, and the inner path becoming rough and difficult">يَحزُنكَ</button>
    <button class="word-link" type="button" data-word="قَولُهُم" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قَولُهُم</button>
    ۘ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="العِزَّةَ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">العِزَّةَ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field">جَميعًا</button>
    ۚ
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="السَّميعُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">السَّميعُ</button>
    <button class="word-link" type="button" data-word="العَليمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">العَليمُ</button>
  </p>
  <p class="english-verse">Do not let their words grieve you. All might belongs to The God. He is the Hearing, the Knowing.</p>
</section>
