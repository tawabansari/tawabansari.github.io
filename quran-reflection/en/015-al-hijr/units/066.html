  <h2 class="ayah-title">Al-Hijr 15:66</h2>

    <button class="word-link" type="button" data-word="الأَمرَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="This matter; the definite announcement of that group’s end.">الأَمرَ</button>

  <p class="english-verse">We conveyed this matter to him: the last remnant of these people would be cut off by morning.</p>
