  <h2 class="ayah-title">Al-Hijr 15:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>

    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>

    <button class="word-link" type="button" data-word="بُروجًا" data-root="B R J" data-root-meaning="Prominence and visibility; burj, a high protected structure or celestial station; tabarruj, display and making adornment and beauty visible." data-learn-more="/quran-terminology/en/roots/b-r-j/" data-context="Celestial buruj, stations or prominent features of the sky, without a particular astronomical model being established by the word alone.">بُروجًا</button>

  <p class="english-verse">We certainly placed constellations in the sky and adorned it for those who look.</p>
