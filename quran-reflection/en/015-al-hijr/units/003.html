<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hijr 15:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذَرهُم" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="Leave them: a singular command to Muḥammad concerning the opponents under discussion, rather than a universal command to abandon everyone.">ذَرهُم</button>
    <button class="word-link" type="button" data-word="يَأكُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Let them eat: following the command to leave them, within the portrayal of enjoyment accompanied by heedlessness.">يَأكُلوا</button>
    <button class="word-link" type="button" data-word="وَيَتَمَتَّعوا" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="And enjoy themselves: benefiting from life, here accompanied by distraction from its outcome.">وَيَتَمَتَّعوا</button>
    <button class="word-link" type="button" data-word="وَيُلهِهِمُ" data-root="L H2 W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h2-w/" data-root-meaning="Diversion from an important matter; ilhāʾ means distracting." data-context="And distract them and make them heedless: al-amal is the subject, while hum is the object pronoun.">وَيُلهِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَمَلُ" data-root="A M L" data-learn-more="/quran-terminology/en/roots/a-m-l/" data-root-meaning="Hope and expectation of attaining something desirable that has not yet occurred; looking toward the future while envisaging the possibility of attainment." data-context="Their hope and expectation for the future, which here distracts them from truth; heedlessness comes from yulhihim rather than amal itself.">الأَمَلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَسَوفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَسَوفَ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="They will come to know: future awareness of their conduct’s outcome, without an exact date or necessary immediacy specified here.">يَعلَمونَ</button>
  </p>
  <p class="english-verse">Leave them to eat and enjoy themselves and let hope distract them; they will soon know.</p>
</section>
