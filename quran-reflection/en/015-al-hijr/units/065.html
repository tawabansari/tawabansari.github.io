<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hijr 15:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَسرِ" data-root="S R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-y/" data-root-meaning="Traveling by night; sariyy in Mary&#x27;s passage is explained as a stream or a noble person.">فَأَسرِ</button>
    <button class="word-link" type="button" data-word="بِأَهلِكَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness">بِأَهلِكَ</button>

    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time">الَّيلِ</button>

    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>

    <button class="word-link" type="button" data-word="أَحَدٌ" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation">أَحَدٌ</button>

    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَيثُ</button>
    <button class="word-link" type="button" data-word="تُؤمَرونَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">تُؤمَرونَ</button>
  </p>
  <p class="english-verse">“Set out with your family during a part of the night, and follow behind them. Let none of you look back, and proceed where you are commanded.”</p>
