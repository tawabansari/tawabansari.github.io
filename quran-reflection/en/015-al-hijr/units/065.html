<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hijr 15:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَسرِ" data-root="S R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-y/" data-root-meaning="Traveling by night; sariyy in Mary&#x27;s passage is explained as a stream or a noble person." data-context="Then set out and travel by night.">فَأَسرِ</button>
    <button class="word-link" type="button" data-word="بِأَهلِكَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="With your household and dependents.">بِأَهلِكَ</button>
    <button class="word-link" type="button" data-word="بِقِطعٍ" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="During a portion of the night.">بِقِطعٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="The night, the time specified for departure.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَاتَّبِع" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="And follow behind them.">وَاتَّبِع</button>
    <button class="word-link" type="button" data-word="أَدبٰرَهُم" data-root="D B R" data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back and latter part; turning away and passing; tadbīr, governing affairs; tadabbur, careful reflection on discourse." data-context="Their rear, behind the company.">أَدبٰرَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَلتَفِت" data-root="L F T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-f-t/" data-root-meaning="Turning or directing toward a side." data-context="Let none turn around or look back.">يَلتَفِت</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="أَحَدٌ" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="Any one of you.">أَحَدٌ</button>
    <button class="word-link" type="button" data-word="وَامضوا" data-root="M DAD Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-dad-y/" data-root-meaning="Passing or proceeding onward." data-context="And proceed, continuing on your way.">وَامضوا</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="To the place or direction you are instructed to go." data-learn-more="/quran-terminology/en/roots/h-y-th/" data-root-note="Brief word meaning: A place or position specified by the accompanying clause; with min, an origin or source, and in generalizing use, wherever. Ḥaythu is largely a non-derived adverbial noun.">حَيثُ</button>
    <button class="word-link" type="button" data-word="تُؤمَرونَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Where you are instructed to go.">تُؤمَرونَ</button>
  </p>
  <p class="english-verse">“Set out with your family during a part of the night, and follow behind them. Let none of you look back, and proceed where you are commanded.”</p>
</section>
