  <h2 class="ayah-title">Al-Hijr 15:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَرسَلنَا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَأَرسَلنَا</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit">الرِّيٰحَ</button>

  <p class="english-verse">We sent the winds as fertilizing winds, then sent down water from the sky and gave it to you to drink. You are not its keepers.</p>
