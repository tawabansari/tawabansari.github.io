<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hijr 15:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَزَعنا" data-root="N Z AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-z-ayn/" data-root-meaning="Pulling out or removing; tanāzuʿ is contention or dispute.">وَنَزَعنا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="صُدورِهِم" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/">صُدورِهِم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="غِلٍّ" data-root="GH L L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-l-l/" data-root-meaning="A fetter; ghill is resentment; ghulūl is misappropriation of entrusted property.">غِلٍّ</button>
    <button class="word-link" type="button" data-word="إِخوٰنًا" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brothers, close friends, or associates in a bond.">إِخوٰنًا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="سُرُرٍ" data-root="S R R" data-learn-more="/quran-terminology/en/roots/s-r-r/" data-root-meaning="Secrets and Hidden Matters, Joy and Ease, and Places of Rest">سُرُرٍ</button>
    <button class="word-link" type="button" data-word="مُتَقٰبِلينَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">مُتَقٰبِلينَ</button>
  </p>
  <p class="english-verse">We remove whatever rancor is in their breasts; as brothers, they are on couches facing one another.</p>
