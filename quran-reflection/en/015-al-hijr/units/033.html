  <h2 class="ayah-title">Al-Hijr 15:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said; Iblīs is the speaker here.">قالَ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="أَكُن" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="I was not and am not one to; within Iblīs’s denial that he would prostrate.">أَكُن</button>

    <button class="word-link" type="button" data-word="خَلَقتَهُ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="You created him; Iblīs addressing the Lord about human creation.">خَلَقتَهُ</button>

  <p class="english-verse">He said, “I am not one to prostrate before a human whom You created from sounding clay, from altered dark mud.”</p>
