<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hijr 15:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="A thing; the broad scope of the statement about treasuries.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="عِندَنا" data-root="AYN N D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-d/" data-root-meaning="Obstinacy or opposition; ʿinda is a grammatical word denoting proximity in place or standing." data-context="With Us; locating the treasuries with the divine speaker.">عِندَنا</button>
    <button class="word-link" type="button" data-word="خَزائِنُهُ" data-root="KH Z N" data-root-meaning="Keeping and safeguarding; a treasury is a repository or resources in custody, and a khāzin is their keeper." data-context="Its treasuries; the resources or stores of each thing, described as being with the divine speaker." data-learn-more="/quran-terminology/en/roots/kh-z-n/">خَزائِنُهُ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="نُنَزِّلُهُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="We send it down; restricted by mā…illā to a known measure.">نُنَزِّلُهُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِقَدَرٍ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="In a measure; the determination accompanying sending down.">بِقَدَرٍ</button>
    <button class="word-link" type="button" data-word="مَعلومٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Known; describing the measure of sending down.">مَعلومٍ</button>
  </p>
  <p class="english-verse">There is nothing whose treasuries are not with Us, and We send it down only in a known measure.</p>
</section>
