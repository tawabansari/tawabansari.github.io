  <h2 class="ayah-title">Al-Munafiqun 63:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="رَأَيتَهُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">رَأَيتَهُم</button>
    <button class="word-link" type="button" data-word="تُعجِبُكَ" data-root="AYN J B" data-root-note="Root study coming soon.">تُعجِبُكَ</button>
    <button class="word-link" type="button" data-word="أَجسامُهُم" data-root="J S M" data-root-note="Root study coming soon.">أَجسامُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَقولوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">يَقولوا</button>
    <button class="word-link" type="button" data-word="تَسمَع" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">تَسمَع</button>
    <button class="word-link" type="button" data-word="لِقَولِهِم" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">لِقَولِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="خُشُبٌ" data-root="KH SH B" data-root-note="Root study coming soon.">خُشُبٌ</button>
    <button class="word-link" type="button" data-word="مُسَنَّدَةٌ" data-root="S N D" data-root-note="Root study coming soon.">مُسَنَّدَةٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَحسَبونَ" data-root="H S B" data-root-note="Root study coming soon.">يَحسَبونَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلَّ</button>
    <button class="word-link" type="button" data-word="صَيحَةٍ" data-root="SAD Y H" data-root-note="Root study coming soon.">صَيحَةٍ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="العَدُوُّ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity.">العَدُوُّ</button>
    <button class="word-link" type="button" data-word="فَاحذَرهُم" data-root="Ḥ DH R" data-learn-more="/quran-terminology/en/roots/h-dh-r/" data-root-meaning="Caution, alertness before danger, conscious fear of harm, practical readiness, and protective vigilance before damage occurs">فَاحذَرهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="قٰتَلَهُمُ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">قٰتَلَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَنّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّىٰ</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="A F K" data-root-note="Root study coming soon.">يُؤفَكونَ</button>
  </p>
  <p class="english-verse">When you see them, their bodies impress you; and if they speak, you listen to their words. They are like propped-up timbers. They think every shout is against them. They are the enemy, so beware of them. May The God fight them! How they are turned away!</p>
</section>
