<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Munafiqun 63:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="جاءَكَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَكَ</button>
    <button class="word-link" type="button" data-word="المُنٰفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">المُنٰفِقونَ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>
    <button class="word-link" type="button" data-word="نَشهَدُ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">نَشهَدُ</button>
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكَ</button>

    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>

    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="لَرَسولُهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">لَرَسولُهُ</button>

    <button class="word-link" type="button" data-word="يَشهَدُ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">يَشهَدُ</button>

    <button class="word-link" type="button" data-word="المُنٰفِقينَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">المُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="لَكٰذِبونَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">لَكٰذِبونَ</button>
  </p>
  <p class="english-verse">When the hypocrites come to you, they say, “We testify that you are The God’s messenger.” The God knows that you are His messenger, and The God testifies that the hypocrites are liars.</p>
