<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Haqqah 69:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَعَصَوا" data-root="ʿ Ṣ Y" data-learn-more="/quran-terminology/en/roots/ayn-sad-y/" data-root-meaning="Disobeying a command, refusing an instruction, and acting against the path of obedience.">فَعَصَوا</button>
    <button class="word-link" type="button" data-word="رَسولَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رَسولَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="فَأَخَذَهُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">فَأَخَذَهُم</button>
    <button class="word-link" type="button" data-word="أَخذَةً" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">أَخذَةً</button>
    <button class="word-link" type="button" data-word="رابِيَةً" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level">رابِيَةً</button>
  </p>
  <p class="english-verse">They disobeyed their Lord’s messenger, so He seized them with an overwhelming seizure.</p>
