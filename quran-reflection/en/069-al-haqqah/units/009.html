<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Haqqah 69:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="And came, in the expression for committing the grave wrong.">وَجاءَ</button>
    <button class="word-link" type="button" data-word="فِرعَونُ" data-root-note="Proper name; no root has been assigned.">فِرعَونُ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="قَبلَهُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before him, concerning those before Firʿawn.">قَبلَهُ</button>
    <button class="word-link" type="button" data-word="وَالمُؤتَفِكٰتُ" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="And the overturned settlements, plural, alongside peoples who did wrong.">وَالمُؤتَفِكٰتُ</button>
    <button class="word-link" type="button" data-word="بِالخاطِئَةِ" data-root="KH Ṭ A" data-learn-more="/quran-terminology/en/roots/kh-tt-a/" data-root-meaning="Slipping from the right path, missing the mark, going wrong; and in some forms, conscious deviation from truth." data-context="With the grave wrong, in the expression meaning to commit it.">بِالخاطِئَةِ</button>
  </p>
  <p class="english-verse">Pharaoh, those before him, and the overturned towns committed wrongdoing.</p>
</section>
