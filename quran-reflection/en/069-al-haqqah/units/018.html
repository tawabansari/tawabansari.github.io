<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Haqqah 69:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day: a compound of yawm and idh specifying the time of presentation.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="تُعرَضونَ" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="You are presented, in the scene of accountability.">تُعرَضونَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَخفىٰ" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="Remains hidden, negated here concerning people’s affairs." data-learn-more="/quran-terminology/en/roots/kh-f-y/">تَخفىٰ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="خافِيَةٌ" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="A hidden matter that will not remain concealed on the day of presentation." data-learn-more="/quran-terminology/en/roots/kh-f-y/">خافِيَةٌ</button>
  </p>
  <p class="english-verse">On that day you will be presented; nothing hidden about you will remain hidden.</p>
</section>
