<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Haqqah 69:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالمَلَكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God">وَالمَلَكُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَرجائِها" data-root="R J W" data-root-note="Root study coming soon.">أَرجائِها</button>
    ۚ

    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَوقَهُم" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number">فَوقَهُم</button>

    <button class="word-link" type="button" data-word="ثَمٰنِيَةٌ" data-root="TH M N" data-learn-more="/quran-terminology/en/roots/th-m-n/" data-root-meaning="Price, value in exchange, and what is taken in return for something else.">ثَمٰنِيَةٌ</button>

  <p class="english-verse">The angels will be at its edges, and eight will bear your Lord’s throne above them that day.</p>
