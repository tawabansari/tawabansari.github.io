<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Haqqah 69:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالمَلَكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="The angels; those stationed at the edges.">وَالمَلَكُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَرجائِها" data-root="R J W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-w/" data-root-meaning="Hope or expectation; also an edge or side; postponement in some forms is also analyzed under r-j-ʾ." data-context="Its edges; where the angels are stationed.">أَرجائِها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَحمِلُ" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Will bear; in the scene of eight bearing the Throne." data-learn-more="/quran-terminology/en/roots/h-m-l/">وَيَحمِلُ</button>
    <button class="word-link" type="button" data-word="عَرشَ" data-root="AYN R SH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-sh/" data-root-meaning="A roof or raised structure; ʿarsh is a throne or seat of sovereignty." data-context="The Throne; what is carried in the verse’s scene.">عَرشَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; in the expression your Lord’s Throne.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَوقَهُم" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above them; the spatial relation in the verse’s image.">فَوقَهُم</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day; the time of the scene of bearing the Throne.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="ثَمٰنِيَةٌ" data-root="TH M N" data-learn-more="/quran-terminology/en/roots/th-m-n/" data-root-meaning="Price, value in exchange, and what is taken in return for something else." data-context="Eight; the number of bearers mentioned.">ثَمٰنِيَةٌ</button>
  </p>
  <p class="english-verse">The angels will be at its edges, and eight will bear your Lord’s throne above them that day.</p>
</section>
