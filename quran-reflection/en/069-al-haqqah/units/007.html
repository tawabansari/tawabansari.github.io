<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Haqqah 69:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَخَّرَها" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/" data-context="Subjected it against them, concerning the destructive wind.">سَخَّرَها</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="S B ʿ (S B Ayn)" data-root-meaning="Seven and its related numerical forms; in a separate branch, sabuʿ: a predatory animal." data-context="Seven, the nights of the wind alongside eight days." data-learn-more="/quran-terminology/en/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="لَيالٍ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Nights, the seven nighttime units.">لَيالٍ</button>
    <button class="word-link" type="button" data-word="وَثَمٰنِيَةَ" data-root="TH M N" data-learn-more="/quran-terminology/en/roots/th-m-n/" data-root-meaning="Price, value in exchange, and what is taken in return for something else." data-context="And eight, the number of days.">وَثَمٰنِيَةَ</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Days, the eight daytime units.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="حُسومًا" data-root="H S M" data-root-meaning="ح س م means cutting off, stopping something’s continuation, and ending its effect. حُسام, a cutting sword, and حسم, cutting off or settling, belong to this family. In the Qur’an, حُسُومًا describes the seven nights and eight days of ʿĀd’s punishment and preferably means consecutive and uninterrupted, while the eradicating reading also warrants lexical and contextual consideration." data-context="Consecutive or decisive, describing the period or effect of the wind." data-learn-more="/quran-terminology/en/roots/h-s-m/">حُسومًا</button>
    <button class="word-link" type="button" data-word="فَتَرَى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Then you see, observing the people’s fate.">فَتَرَى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="The people whose fate is described." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">القَومَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="صَرعىٰ" data-root="SAD R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-ayn/" data-root-meaning="Throwing down or laying low." data-context="Fallen, describing the people’s bodies.">صَرعىٰ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="أَعجازُ" data-root="AYN J Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-j-z/" data-context="Bases or trunks, in the comparison with fallen palms." data-root-meaning="Being unable or rendering powerless; ʿajūz is an elderly woman. In the nominal branch, the rear or base of something; aʿjāz nakhl: palm bases or trunks.">أَعجازُ</button>
    <button class="word-link" type="button" data-word="نَخلٍ" data-root="N KH L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-kh-l/" data-root-meaning="A date palm or date palms." data-context="Palm trees, the objects of comparison.">نَخلٍ</button>
    <button class="word-link" type="button" data-word="خاوِيَةٍ" data-root="KH W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-w-y/" data-root-meaning="Becoming empty, deserted, or fallen down." data-context="Hollow or fallen, describing the palms in the comparison.">خاوِيَةٍ</button>
  </p>
  <p class="english-verse">He subjected them to it for seven nights and eight days without respite. You would see the people lying fallen, like hollow trunks of palm trees.</p>
</section>
