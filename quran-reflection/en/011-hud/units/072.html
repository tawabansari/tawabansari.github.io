<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:72</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="She said, introducing Ibrāhīm’s wife’s words.">قالَت</button>
    <button class="word-link" type="button" data-word="يٰوَيلَتىٰ" data-root="W Y L" data-learn-more="/quran-terminology/en/roots/w-y-l/" data-root-meaning="From Cries of Grief and Warning to the Announcement of a Dire Outcome" data-context="Oh, woe to me, an exclamation of astonishment here.">يٰوَيلَتىٰ</button>
    <button class="word-link" type="button" data-word="ءَأَلِدُ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth" data-context="Shall I bear a child, expressing astonishment.">ءَأَلِدُ</button>
    <button class="word-link" type="button" data-word="وَأَنا۠" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنا۠</button>
    <button class="word-link" type="button" data-word="عَجوزٌ" data-root="AYN J Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-j-z/" data-root-meaning="Being unable or rendering powerless; ʿajūz is an elderly woman." data-context="An old woman, describing the speaker.">عَجوزٌ</button>
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="بَعلى" data-root="B AYN L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-ayn-l/" data-root-meaning="Baʿl: a husband or master; in Al-Ṣāffāt, the name of a particular worshipped deity." data-context="My husband, her elderly spouse.">بَعلى</button>
    <button class="word-link" type="button" data-word="شَيخًا" data-root="SH Y KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-y-kh/" data-root-meaning="Old age; shaykh denotes an elderly man." data-context="An old man, describing the husband.">شَيخًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="لَشَىءٌ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Indeed a thing, the subject described as astonishing.">لَشَىءٌ</button>
    <button class="word-link" type="button" data-word="عَجيبٌ" data-root="AYN J B" data-root-meaning="Wonder and finding something significant or unusual; iʿjāb denotes pleasing or impressing, and ʿujb self-admiration." data-context="Astonishing, describing childbirth in old age." data-learn-more="/quran-terminology/en/roots/ayn-j-b/">عَجيبٌ</button>
  </p>
  <p class="english-verse">She said, “Woe to me! Shall I bear a child when I am an old woman and this husband of mine is an old man? This is a wondrous thing.”</p>
</section>
