  <p class="english-verse">I do not tell you that I possess the treasures of The God, nor do I know the unseen, nor do I say that I am an angel. Nor do I say of those your eyes disdain that The God will never give them good. The God knows best what is within them. Then I would indeed be among the unjust.”</p>
