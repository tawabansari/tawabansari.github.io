<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="أَذَقنَا" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="We let someone taste, granting an experience of mercy.">أَذَقنَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being whose receipt and subsequent loss are described.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="رَحمَةً" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Mercy, a benefit from The God that is experienced.">رَحمَةً</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="نَزَعنٰها" data-root="N Z AYN" data-learn-more="/quran-terminology/en/roots/n-z-ayn/" data-root-meaning="Drawing, extraction, and removal; tanāzuʿ can mean contention or exchanging something, according to context." data-context="We withdrew it, taking back the mercy the person had tasted.">نَزَعنٰها</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَيَـٔوسٌ" data-root="Y A S" data-learn-more="/quran-terminology/en/roots/y-a-s/" data-root-meaning="Giving up hope or ceasing to expect an outcome. Istayʾasa means losing or reaching the end of hope; yaʾūs makes despair prominent. Knowing or becoming aware is a disputed contextual reading in Al-Raʿd 13:31." data-context="Deeply despairing, the person’s response to mercy being withdrawn.">لَيَـٔوسٌ</button>
    <button class="word-link" type="button" data-word="كَفورٌ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Very ungrateful, describing the response to deprivation.">كَفورٌ</button>
  </p>
  <p class="english-verse">If We let a person taste mercy from Us, then withdraw it from him, he becomes despairing and ungrateful.</p>
</section>
