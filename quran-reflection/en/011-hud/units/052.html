  <h2 class="ayah-title">Hud 11:52</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And my people">وَيٰقَومِ</button>
    <button class="word-link" type="button" data-word="استَغفِروا" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Seek forgiveness">استَغفِروا</button>
    <button class="word-link" type="button" data-word="رَبَّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord">رَبَّكُم</button>

    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="Wrongdoers; those who commit wrongful acts" data-learn-more="/quran-terminology/en/roots/j-r-m/">مُجرِمينَ</button>

  <p class="english-verse">My people, ask your Lord for forgiveness, then turn back to Him. He will send the sky upon you in abundant rain and add strength to your strength. Do not turn away as guilty ones.”</p>
