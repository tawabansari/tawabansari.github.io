<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:82</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came or arrived; here, the arrival of Our command.">جاءَ</button>
    <button class="word-link" type="button" data-word="أَمرُنا" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Our command, whose arrival precedes the event described.">أَمرُنا</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="We made or turned; making its upper part its lower part.">جَعَلنا</button>
    <button class="word-link" type="button" data-word="عٰلِيَها" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting." data-context="Its upper part, in relation to the lower part of the same settlement.">عٰلِيَها</button>
    <button class="word-link" type="button" data-word="سافِلَها" data-root="S F L" data-learn-more="/quran-terminology/en/roots/s-f-l/" data-root-meaning="Being low or lower relative to another position or rank; inferiority whose sense depends on context." data-context="Its lower part; what the settlement’s upper part was made into.">سافِلَها</button>
    <button class="word-link" type="button" data-word="وَأَمطَرنا" data-root="M TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-tt-r/" data-root-meaning="Rain or raining; its benefit or harm is determined by context." data-context="And We rained down; sending stones down upon the settlement.">وَأَمطَرنا</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="حِجارَةً" data-root="Ḥ J R (H J R)" data-learn-more="/quran-terminology/en/roots/h-j-r/" data-root-meaning="Stone, hardness, enclosure, prohibition, firm boundary, and restraint" data-context="Stones, rained down upon the settlement in this event.">حِجارَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سِجّيلٍ" data-root-note="The historical derivation of sijjil is disputed; its morphological indexing under S J L does not by itself establish its historical root." data-root="S J L" data-learn-more="/quran-terminology/en/roots/s-j-l/" data-root-meaning="Water buckets and pouring; sijill: scroll or document; sijjil: stone material, of disputed historical origin." data-context="Sijjil, the material from which the stones are described as coming and which mandud qualifies; the name’s origin and historical meaning are debated.">سِجّيلٍ</button>
    <button class="word-link" type="button" data-word="مَنضودٍ" data-root="N DAD D" data-learn-more="/quran-terminology/en/roots/n-dad-d/" data-root-meaning="Arranging parts closely beside or upon one another in order." data-context="Layered and closely arranged; describing sijjil and the disposition of its parts.">مَنضودٍ</button>
  </p>
  <p class="english-verse">When Our command came, We turned its upper part beneath it and rained upon it stones of baked clay, layer upon layer—</p>
</section>
