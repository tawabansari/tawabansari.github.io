<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:59</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتِلكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَتِلكَ</button>
    <button class="word-link" type="button" data-word="عادٌ" data-root-note="Proper name; no root has been assigned.">عادٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="جَحَدوا" data-root="J H D" data-root-note="Root study coming soon.">جَحَدوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَعَصَوا" data-root="ʿ Ṣ Y" data-learn-more="/quran-terminology/en/roots/ayn-sad-y/" data-root-meaning="Disobeying a command, refusing an instruction, and acting against the path of obedience.">وَعَصَوا</button>
    <button class="word-link" type="button" data-word="رُسُلَهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رُسُلَهُ</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعوا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">وَاتَّبَعوا</button>
    <button class="word-link" type="button" data-word="أَمرَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">أَمرَ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="جَبّارٍ" data-root="J B R" data-root-note="Root study coming soon.">جَبّارٍ</button>
    <button class="word-link" type="button" data-word="عَنيدٍ" data-root="AYN N D" data-root-note="Root study coming soon.">عَنيدٍ</button>
  </p>
  <p class="english-verse">That was Aad. They rejected the signs of their Lord, disobeyed His messengers, and followed the command of every stubborn tyrant.</p>
