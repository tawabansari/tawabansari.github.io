  <h2 class="ayah-title">Hud 11:43</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>

    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جَبَلٍ" data-root="J B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-b-l/" data-root-meaning="Jabal: a mountain or elevated mass; jibillah can concern a multitude or natural disposition.">جَبَلٍ</button>
    <button class="word-link" type="button" data-word="يَعصِمُنى" data-root="AYN SAD M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-m/" data-root-meaning="Protecting or preventing harm; iʿtiṣām means holding firmly to.">يَعصِمُنى</button>

    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="عاصِمَ" data-root="AYN SAD M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-m/" data-root-meaning="Protecting or preventing harm; iʿtiṣām means holding firmly to.">عاصِمَ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">اليَومَ</button>

    <button class="word-link" type="button" data-word="أَمرِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">أَمرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="رَحِمَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحِمَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَحالَ" data-root="H W L" data-learn-more="/quran-terminology/en/roots/h-w-l/" data-root-meaning="Aroundness, surrounding relation, turning, change of state, transfer, and becoming a barrier between things">وَحالَ</button>
    <button class="word-link" type="button" data-word="بَينَهُمَا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَهُمَا</button>
    <button class="word-link" type="button" data-word="المَوجُ" data-root="M W J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-w-j/" data-root-meaning="A wave or surging movement.">المَوجُ</button>
    <button class="word-link" type="button" data-word="فَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">فَكانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُغرَقينَ" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water">المُغرَقينَ</button>
  </p>
  <p class="english-verse">He said, “I will take refuge on a mountain that will protect me from the water.” He said, “Today there is no protector against the command of The God, except one who shows mercy.” The wave came between them, and he was among the drowned.</p>
</section>
