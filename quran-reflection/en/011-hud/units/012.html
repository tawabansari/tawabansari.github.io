  <h2 class="ayah-title">Hud 11:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَعَلَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَعَلَّكَ</button>
    <button class="word-link" type="button" data-word="تارِكٌ" data-root="T R K" data-learn-more="/quran-terminology/en/roots/t-r-k/" data-root-meaning="Leaving, abandoning, letting go, leaving something behind, and changing one’s active relation to it">تارِكٌ</button>
    <button class="word-link" type="button" data-word="بَعضَ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يوحىٰ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context.">يوحىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>

    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="صَدرُكَ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/">صَدرُكَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَقولوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">يَقولوا</button>
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="أُنزِلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">أُنزِلَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="كَنزٌ" data-root="K N Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-z/" data-root-meaning="Accumulating or storing wealth.">كَنزٌ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَ</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="مَلَكٌ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">مَلَكٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتَ</button>
    <button class="word-link" type="button" data-word="نَذيرٌ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">نَذيرٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="وَكيلٌ" data-root="W K L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-l/" data-root-meaning="Entrusting or relying; wakīl is an agent or responsible guardian.">وَكيلٌ</button>
  </p>
  <p class="english-verse">Perhaps you would leave aside some of what is revealed to you, and your breast is constrained by it because they say, “Why has no treasure been sent down to him, or an angel come with him?” You are only a warner, and The God is trustee over all things.</p>
</section>
