<section class="ayah-block" id="ayah-116" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:116</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَولا</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="There were, asking about reformers’ presence in earlier generations.">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="القُرونِ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="Generations or communities of the past under discussion.">القُرونِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكُم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before you, locating those generations in time.">قَبلِكُم</button>
    <button class="word-link" type="button" data-word="أُولوا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولوا</button>
    <button class="word-link" type="button" data-word="بَقِيَّةٍ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="A retained resource of goodness and discernment, in the description of people opposing corruption." data-learn-more="/quran-terminology/en/roots/b-q-y/">بَقِيَّةٍ</button>
    <button class="word-link" type="button" data-word="يَنهَونَ" data-root="N H2 Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-h2-y/" data-root-meaning="Preventing or ending; nuhā denotes restraining understanding or reason." data-context="They forbade, actively opposing corruption in the land.">يَنهَونَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="الفَسادِ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order" data-context="Corruption, the wrongdoing opposed by those retaining goodness.">الفَسادِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The land, the setting of corruption and corrective action.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="A few, the limited number of rescued people excepted.">قَليلًا</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمَّن</button>
    <button class="word-link" type="button" data-word="أَنجَينا" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety" data-context="We saved, rescuing that small number.">أَنجَينا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاتَّبَعَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="And pursued, of wrongdoers following their luxury and enjoyment.">وَاتَّبَعَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Acted unjustly, identifying the group pursuing their corrupt luxury.">ظَلَموا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أُترِفوا" data-root="T R F" data-learn-more="/quran-terminology/en/roots/t-r-f/" data-root-meaning="Expanded ease, luxury, pampered entitlement, and the habit of having desires answered without limit or responsibility." data-context="They had been given luxury, the enjoyment they pursued.">أُترِفوا</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And they were, describing their condition as offenders.">وَكانوا</button>
    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="Offenders, those committing the stated wrongdoing." data-learn-more="/quran-terminology/en/roots/j-r-m/">مُجرِمينَ</button>
  </p>
  <p class="english-verse">Why were there not, among the generations before you, people of remaining virtue who forbade corruption on earth, except a few of those We saved among them? Those who did wrong pursued the luxury they had been given, and they were guilty.</p>
</section>
