<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="يَثنونَ" data-root="TH N Y" data-root-meaning="twofoldness, turning back, and repetition" data-context="They bend or fold their breasts in an attempt to hide." data-learn-more="/quran-terminology/en/roots/th-n-y/">يَثنونَ</button>
    <button class="word-link" type="button" data-word="صُدورَهُم" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="Their breasts: the bodily interior and seat of intentions.">صُدورَهُم</button>
    <button class="word-link" type="button" data-word="لِيَستَخفوا" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="To hide: the purpose of folding their breasts." data-learn-more="/quran-terminology/en/roots/kh-f-y/">لِيَستَخفوا</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="حينَ" data-root="H Y N" data-learn-more="/quran-terminology/en/roots/h-y-n/" data-root-meaning="A time, moment, interval, period, deadline, or bounded segment within the flow of time." data-context="When: the time of covering themselves with garments.">حينَ</button>
    <button class="word-link" type="button" data-word="يَستَغشونَ" data-root="GH SH Y" data-learn-more="/quran-terminology/en/roots/gh-sh-w/" data-root-meaning="Covering, enveloping, being surrounded, and a changed state through covering" data-context="They cover themselves with their garments.">يَستَغشونَ</button>
    <button class="word-link" type="button" data-word="ثِيابَهُم" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="Their garments covering the body.">ثِيابَهُم</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knows what is concealed and disclosed.">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُسِرّونَ" data-root="S R R" data-learn-more="/quran-terminology/en/roots/s-r-r/" data-root-meaning="Secrets and Hidden Matters, Joy and Ease, and Places of Rest" data-context="They conceal and keep secret.">يُسِرّونَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يُعلِنونَ" data-root="ʿ L N (Ayn L N)" data-learn-more="/quran-terminology/en/roots/ayn-l-n/" data-root-meaning="Being Open and Making Manifest in Contrast to What Is Hidden" data-context="They disclose and make public.">يُعلِنونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing: describing comprehensive knowledge.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="بِذاتِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِذاتِ</button>
    <button class="word-link" type="button" data-word="الصُّدورِ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="Breasts: the seat of hidden inward matters.">الصُّدورِ</button>
  </p>
  <p class="english-verse">Indeed, they fold their breasts to hide from Him. Indeed, when they cover themselves with their garments, He knows what they conceal and what they reveal. He knows what is within the breasts.</p>
</section>
