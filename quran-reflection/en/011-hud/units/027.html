<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then the chiefs of the people gave this response.">فَقالَ</button>
    <button class="word-link" type="button" data-word="المَلَأُ" data-root="M L A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-l-a/" data-root-meaning="Filling; malaʾ denotes leading members or notables of a community." data-context="The influential chiefs and leading members of Noah’s people.">المَلَأُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Those chiefs who disbelieved in Noah’s call.">كَفَروا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="His people, among whom Noah was making his call.">قَومِهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="نَرىٰكَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="We see and assess you thus: the opponents’ judgment of Noah.">نَرىٰكَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="بَشَرًا" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="A human being like us: the opponents’ description of Noah.">بَشَرًا</button>
    <button class="word-link" type="button" data-word="مِثلَنا" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like us: denying the distinction they expected in a messenger.">مِثلَنا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="نَرىٰكَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="We do not see anyone following you except the stated group.">نَرىٰكَ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَكَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="Has followed you: the belief and allegiance of Noah’s followers as described by the opponents.">اتَّبَعَكَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="أَراذِلُنا" data-root="R DH L" data-learn-more="/quran-terminology/en/roots/r-dh-l/" data-root-meaning="Inferiority in rank or quality; in Noah’s opponents’ speech, social contempt toward his followers; ardhal al-ʿumur: life’s most diminished condition in ability, not the person’s moral worth." data-context="Our lowly people: the chiefs’ contemptuous description of Noah’s followers, not an endorsement of that valuation.">أَراذِلُنا</button>
    <button class="word-link" type="button" data-word="بادِىَ" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="In outward appearance or at first sight, in bādiya al-raʾyi and the opponents’ assessment.">بادِىَ</button>
    <button class="word-link" type="button" data-word="الرَّأىِ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Opinion or assessment: the view or initial judgment in bādiya al-raʾyi.">الرَّأىِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="نَرىٰ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="We see no superiority in you over us: the opponents’ further assessment.">نَرىٰ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلٍ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="An advantage or superiority of yours over us, which the opponents deny.">فَضلٍ</button>
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="نَظُنُّكُم" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="We consider you to be so: the opponents’ allegation of lying.">نَظُنُّكُم</button>
    <button class="word-link" type="button" data-word="كٰذِبينَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Liars: the accusation the opponents direct at Noah and his companions.">كٰذِبينَ</button>
  </p>
  <p class="english-verse">The chiefs of his people who disbelieved said, “We see you only as a human like us, and we see that only the lowliest among us follow you, at first sight. We see no merit in you over us. Rather, we think you are liars.”</p>
</section>
