<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:69</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="جاءَت" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came or arrived; describing the messengers’ arrival before Abraham.">جاءَت</button>
    <button class="word-link" type="button" data-word="رُسُلُنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Our messengers; those who came to Abraham with good news.">رُسُلُنا</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="بِالبُشرىٰ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="With good news; the glad tidings brought to Abraham.">بِالبُشرىٰ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said; introducing the messengers’ greeting.">قالوا</button>
    <button class="word-link" type="button" data-word="سَلٰمًا" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Peace; the messengers’ greeting to Abraham.">سَلٰمًا</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said; introducing Abraham’s response to the guests’ greeting.">قالَ</button>
    <button class="word-link" type="button" data-word="سَلٰمٌ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Peace; Abraham’s answering greeting.">سَلٰمٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="لَبِثَ" data-root="L B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-th/" data-root-meaning="Staying or remaining for a period or in a place." data-context="Delayed or tarried; negated in fa-mā labitha, indicating his short delay in bringing food.">لَبِثَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came bringing; in jāʾa bi-ʿijlin, bringing a calf for the guests.">جاءَ</button>
    <button class="word-link" type="button" data-word="بِعِجلٍ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf" data-context="A calf; the young animal brought roasted as food for the guests.">بِعِجلٍ</button>
    <button class="word-link" type="button" data-word="حَنيذٍ" data-root="H N DH" data-root-meaning="Roasting and cooking through heat, especially with heated stones; in other usages, the effects of intense heat and inducing sweat." data-context="Roasted; describing the calf Abraham brought for his guests. Roasting with heated stones is an established lexical usage, but the verse does not specify the cooking details." data-learn-more="/quran-terminology/en/roots/h-n-dh/">حَنيذٍ</button>
  </p>
  <p class="english-verse">Our messengers came to Abraham with good news. They said, “Peace.” He said, “Peace,” and soon brought a roasted calf.</p>
</section>
