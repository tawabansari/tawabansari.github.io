<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:78</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءَهُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Lot’s people came to him.">وَجاءَهُ</button>
    <button class="word-link" type="button" data-word="قَومُهُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="His people, who came towards him.">قَومُهُ</button>
    <button class="word-link" type="button" data-word="يُهرَعونَ" data-root="H2 R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-r-ayn/" data-root-meaning="Hurrying onward, sometimes under pressure or agitation." data-context="They came rushing towards him.">يُهرَعونَ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before this event.">قَبلُ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, in the account of their previous conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They did, concerning their previous evil conduct.">يَعمَلونَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evil deeds.">السَّيِّـٔاتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Lot said to his people.">قالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="My people, in Lot’s address.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="بَناتى" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="My daughters, in Lot’s address to his people.">بَناتى</button>
    <button class="word-link" type="button" data-word="هُنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُنَّ</button>
    <button class="word-link" type="button" data-word="أَطهَرُ" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state" data-context="Purer for you, in Lot’s words.">أَطهَرُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Then be mindful of The God.">فَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُخزونِ" data-root="KH Z Y" data-learn-more="/quran-terminology/en/roots/kh-z-y/" data-root-meaning="Humiliation, disgrace, and a fall in standing before others" data-context="Do not disgrace me.">تُخزونِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ضَيفى" data-root="DAD Y F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-y-f/" data-root-meaning="A guest and offering hospitality." data-context="My guests, whose dignity Lot defends.">ضَيفى</button>
    ۖ
    <button class="word-link" type="button" data-word="أَلَيسَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَيسَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="رَجُلٌ" data-root="R J L" data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="Man; foot or leg; and walking or people on foot in distinct branches. Each form’s meaning follows its structure and context." data-context="A man, in Lot’s question about a right-minded individual among his people.">رَجُلٌ</button>
    <button class="word-link" type="button" data-word="رَشيدٌ" data-root="R SH D" data-learn-more="/quran-terminology/en/roots/r-sh-d/" data-root-meaning="Finding the right course, sound judgment, and proper direction in affairs; according to context, religious guidance, competence to manage property, or sound decisions; irshād guides another to the right way." data-context="Right-minded, describing the man for whom Lot asks.">رَشيدٌ</button>
  </p>
  <p class="english-verse">His people came rushing toward him; before this they used to do evil deeds. He said, “My people, these are my daughters; they are purer for you. Be mindful of The God, and do not disgrace me concerning my guests. Is there no right-minded man among you?”</p>
</section>
