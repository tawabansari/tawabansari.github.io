<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:93</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="And, my people; Shuʿayb’s address to his community." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">وَيٰقَومِ</button>
    <button class="word-link" type="button" data-word="اعمَلوا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Act; an imperative in a confrontation and warning.">اعمَلوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَكانَتِكُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-context="Your position and way; the basis of the people’s conduct in this warning." data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization In makān and makānah, a place, position, or capacity to act.">مَكانَتِكُم</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="عٰمِلٌ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="One who acts; Shuʿayb describes his own conduct.">عٰمِلٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="سَوفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">سَوفَ</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="You will know; knowledge of the future outcome.">تَعلَمونَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَأتيهِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes to him; the punishment reaching a person.">يَأتيهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; the consequence announced in the warning.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="يُخزيهِ" data-root="KH Z Y" data-learn-more="/quran-terminology/en/roots/kh-z-y/" data-root-meaning="Humiliation, disgrace, and a fall in standing before others" data-context="Humiliates him; describing the punishment’s effect.">يُخزيهِ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="كٰذِبٌ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="A liar; describing the person whose falsehood becomes clear.">كٰذِبٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَارتَقِبوا" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="And wait; Shuʿayb’s plural command to his people to await the outcome of their confrontation." data-learn-more="/quran-terminology/en/roots/r-q-b/">وَارتَقِبوا</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="رَقيبٌ" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="One who waits; Shuʿayb awaits the outcome alongside his people, rather than claiming to protect them as a guardian." data-learn-more="/quran-terminology/en/roots/r-q-b/">رَقيبٌ</button>
  </p>
  <p class="english-verse">My people, act according to your position; I too am acting. You will come to know whom a punishment will disgrace, and who is a liar. Watch; I too am watching with you.”</p>
</section>
