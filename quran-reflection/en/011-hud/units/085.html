<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:85</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَيٰقَومِ</button>
    <button class="word-link" type="button" data-word="أَوفُوا" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense">أَوفُوا</button>
    <button class="word-link" type="button" data-word="المِكيالَ" data-root="K Y L" data-learn-more="/quran-terminology/en/roots/k-y-l/" data-root-meaning="Measuring by container, measuring with a measure, delivering the full amount, and volumetric measurement in exchange">المِكيالَ</button>
    <button class="word-link" type="button" data-word="وَالميزانَ" data-root="W Z N" data-learn-more="/quran-terminology/en/roots/w-z-n/" data-root-meaning="Weighing, measuring with a scale, establishing balance, and recognizing quantity or value through a criterion">وَالميزانَ</button>
    <button class="word-link" type="button" data-word="بِالقِسطِ" data-root="Q S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-tt/" data-root-meaning="Qisṭ and iqṣāṭ concern justice; qusūṭ concerns injustice or deviation; the form determines the sense.">بِالقِسطِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبخَسُوا" data-root="B KH S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-kh-s/" data-root-meaning="Unjustly reducing a due, value, quantity, or measure.">تَبخَسُوا</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسَ</button>
    <button class="word-link" type="button" data-word="أَشياءَهُم" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">أَشياءَهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعثَوا" data-root="AYN TH W (ʿ TH W)" data-learn-more="/quran-terminology/en/roots/ayn-th-w/" data-root-meaning="Engaging in corruption and disturbing sound order in a way that harms people’s rights and collective life.">تَعثَوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مُفسِدينَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order">مُفسِدينَ</button>
  </p>
  <p class="english-verse">My people, give full measure and weight with justice. Do not deprive people of their things, and do not act wickedly on earth, spreading corruption.</p>
</section>
