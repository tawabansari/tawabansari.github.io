  <h2 class="ayah-title">Hud 11:115</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصبِر" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">وَاصبِر</button>

  <p class="english-verse">Be patient, for The God does not let the reward of those who do good go to waste.</p>
