<section class="ayah-block" id="ayah-123" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:123</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِلَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَلِلَّهِ</button>
    <button class="word-link" type="button" data-word="غَيبُ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God">غَيبُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="يُرجَعُ" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference">يُرجَعُ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="كُلُّهُ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلُّهُ</button>
    <button class="word-link" type="button" data-word="فَاعبُدهُ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">فَاعبُدهُ</button>
    <button class="word-link" type="button" data-word="وَتَوَكَّل" data-root="W K L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-l/" data-root-meaning="Entrusting or relying; wakīl is an agent or responsible guardian.">وَتَوَكَّل</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="بِغٰفِلٍ" data-root="GH F L" data-learn-more="/quran-terminology/en/roots/gh-f-l/" data-root-meaning="Something remaining outside, or being left outside, the field of attention, watchfulness, and follow-up">بِغٰفِلٍ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَمّا</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">تَعمَلونَ</button>
  </p>
  <p class="english-verse">The unseen of the heavens and the earth belongs to The God, and to Him the whole affair is returned. Worship Him and rely on Him. Your Lord is not heedless of what you do.</p>
</section>
