<section class="ayah-block" id="ayah-105" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:105</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>

    <button class="word-link" type="button" data-word="وَسَعيدٌ" data-root="S AYN D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-ayn-d/" data-root-meaning="Well-being and happiness.">وَسَعيدٌ</button>

  <p class="english-verse">On the day it comes, no soul will speak except by His permission. Some of them will be wretched, and some happy.</p>
