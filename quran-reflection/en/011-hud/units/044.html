<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And it was said, introducing the command addressed to earth and heaven at the flood’s conclusion.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="يٰأَرضُ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="O earth, addressed by the command to swallow the water.">يٰأَرضُ</button>
    <button class="word-link" type="button" data-word="ابلَعى" data-root="B L AYN" data-root-meaning="B L ʿ denotes taking something inward by swallowing, so that it passes from an exposed or previous position into an interior space. The meaning applies concretely to water and food and, in extended usage, to the earth and water channels." data-context="Swallow: the command to the earth to take its water inward at the flood’s conclusion." data-learn-more="/quran-terminology/en/roots/b-l-ayn/">ابلَعى</button>
    <button class="word-link" type="button" data-word="ماءَكِ" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Your water: water associated with the earth in the flood scene, the object of iblaʿī.">ماءَكِ</button>
    <button class="word-link" type="button" data-word="وَيٰسَماءُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="And O heaven, addressed by the command to cease raining.">وَيٰسَماءُ</button>
    <button class="word-link" type="button" data-word="أَقلِعى" data-root="Q L AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-l-ayn/" data-root-meaning="Uprooting or pulling out; also ceasing." data-context="Cease: the command to heaven to stop raining.">أَقلِعى</button>
    <button class="word-link" type="button" data-word="وَغيضَ" data-root="GH Y DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-y-dad/" data-root-meaning="Diminishing or subsiding of liquid." data-context="And the water was made to recede: the floodwater diminishing, expressed by a passive verb.">وَغيضَ</button>
    <button class="word-link" type="button" data-word="الماءُ" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="The water: the passive subject of ghīḍa, receding at the flood’s conclusion.">الماءُ</button>
    <button class="word-link" type="button" data-word="وَقُضِىَ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination" data-context="And was concluded: the matter reaching completion in the flood narrative.">وَقُضِىَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution. The noun amr also denotes an affair, matter, or event." data-context="The matter in question: the flood and the fate of the wrongdoing group in this context.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="وَاستَوَت" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness Istawa can also mean settling or coming to rest, according to context." data-context="And it came to rest: the vessel settled upon Al-Jūdī.">وَاستَوَت</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الجودِىِّ" data-root-note="Proper name; no root has been assigned.">الجودِىِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And it was said, introducing the concluding expression concerning the wrongdoing people.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="بُعدًا" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="Away with them: an expression of removal and rejection concerning the wrongdoing people.">بُعدًا</button>
    <button class="word-link" type="button" data-word="لِلقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. Qawm denotes a group of people or community." data-context="For those people, identified by the description “wrongdoers.”">لِلقَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers, describing the people addressed by the concluding expression.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">It was said, “Earth, swallow your water; sky, cease.” The water subsided, the affair was concluded, and it settled upon Judi. It was said, “Away with the unjust people.”</p>
</section>
