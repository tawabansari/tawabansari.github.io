<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَيٰقَومِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَنصُرُنى" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing">يَنصُرُنى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="طَرَدتُهُم" data-root="TT R D" data-learn-more="/quran-terminology/en/roots/tt-r-d/" data-root-meaning="Driving away, pursuing, and forcing someone or something to move away from a place, group, or field of access.">طَرَدتُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَذَكَّرونَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">تَذَكَّرونَ</button>
  </p>
  <p class="english-verse">My people, who would help me against The God if I drove them away? Will you not take heed?</p>
</section>
