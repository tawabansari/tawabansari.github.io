<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:73</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said, introducing the visitors’ words to the household.">قالوا</button>
    <button class="word-link" type="button" data-word="أَتَعجَبينَ" data-root="AYN J B" data-root-meaning="Wonder and finding something significant or unusual; iʿjāb denotes pleasing or impressing, and ʿujb self-admiration." data-context="Are you astonished, a question to the addressee." data-learn-more="/quran-terminology/en/roots/ayn-j-b/">أَتَعجَبينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="The command or act of The God.">أَمرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="رَحمَتُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="The mercy of The God, alongside His blessings.">رَحمَتُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَبَرَكٰتُهُ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="His blessings upon the household; the plural with a pronoun, alongside mercy." data-learn-more="/quran-terminology/en/roots/b-r-k/">وَبَرَكٰتُهُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="أَهلَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="The people or family of this house.">أَهلَ</button>
    <button class="word-link" type="button" data-word="البَيتِ" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/" data-root-meaning="A house or dwelling; bāta: spending the night; tabyīt: arranging something by night or in secret." data-root-note="Preliminary meaning; a full root study is not yet available." data-context="The house, in the address to its household.">البَيتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="حَميدٌ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd" data-context="Praiseworthy and worthy of praise.">حَميدٌ</button>
    <button class="word-link" type="button" data-word="مَجيدٌ" data-root="M J D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-j-d/" data-root-meaning="Glory, nobility, or abundant goodness." data-context="Glorious and majestic.">مَجيدٌ</button>
  </p>
  <p class="english-verse">They said, “Do you wonder at the command of The God? The mercy of The God and His blessings be upon you, people of the house. He is Praiseworthy, Glorious.”</p>
</section>
