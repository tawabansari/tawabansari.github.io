<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصنَعِ" data-root="SAD N AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-n-ayn/" data-root-meaning="Making or performing with skill and care." data-context="And build; the command to construct the ship.">وَاصنَعِ</button>
    <button class="word-link" type="button" data-word="الفُلكَ" data-root="F L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-l-k/" data-root-meaning="Fulk means a ship; falak is an orbit or circular course." data-context="The ship; the vessel Noah is commanded to build.">الفُلكَ</button>
    <button class="word-link" type="button" data-word="بِأَعيُنِنا" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="Under Our eyes; expressing divine oversight of the ship’s construction.">بِأَعيُنِنا</button>
    <button class="word-link" type="button" data-word="وَوَحيِنا" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="And through Our revelation; divine guidance for building the ship.">وَوَحيِنا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُخٰطِبنى" data-root="KH TT B" data-root-meaning="Speaking to an addressee and raising or pursuing a matter; in other uses, an affair or occurrence, and requesting marriage." data-context="Do not address Me concerning those who have wronged, in this particular situation." data-learn-more="/quran-terminology/en/roots/kh-tt-b/">تُخٰطِبنى</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Have wronged; describing the group about whom addressing is prohibited.">ظَلَموا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="مُغرَقونَ" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water" data-context="Are to be drowned; stating the fate of that group.">مُغرَقونَ</button>
  </p>
  <p class="english-verse">Build the ship under Our eyes and by Our revelation, and do not address Me concerning those who did wrong. They will be drowned.”</p>
</section>
