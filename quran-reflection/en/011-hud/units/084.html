<section class="ayah-block" id="ayah-084" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:84</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِلىٰ</button>
    <button class="word-link" type="button" data-word="مَديَنَ" data-root-note="Proper name; no root has been assigned.">مَديَنَ</button>
    <button class="word-link" type="button" data-word="أَخاهُم" data-root="A KH W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother and sister, extended to kinship, companionship, or shared affiliation.">أَخاهُم</button>
    <button class="word-link" type="button" data-word="شُعَيبًا" data-root-note="Proper name; no root has been assigned.">شُعَيبًا</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="اعبُدُوا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">اعبُدُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="إِلٰهٍ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">إِلٰهٍ</button>
    <button class="word-link" type="button" data-word="غَيرُهُ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state">غَيرُهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَنقُصُوا" data-root="N Q Ṣ" data-learn-more="/quran-terminology/en/roots/n-q-sad/" data-root-meaning="Decreasing, diminishing and deficiency: from losses of wealth and produce to withholding others’ rights, a reduced lifespan and changing territorial limits">تَنقُصُوا</button>
    <button class="word-link" type="button" data-word="المِكيالَ" data-root="K Y L" data-learn-more="/quran-terminology/en/roots/k-y-l/" data-root-meaning="Measuring by container, measuring with a measure, delivering the full amount, and volumetric measurement in exchange">المِكيالَ</button>
    <button class="word-link" type="button" data-word="وَالميزانَ" data-root="W Z N" data-learn-more="/quran-terminology/en/roots/w-z-n/" data-root-meaning="Weighing, measuring with a scale, establishing balance, and recognizing quantity or value through a criterion">وَالميزانَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَرىٰكُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">أَرىٰكُم</button>
    <button class="word-link" type="button" data-word="بِخَيرٍ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">بِخَيرٍ</button>
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="أَخافُ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat">أَخافُ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابَ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومٍ</button>
    <button class="word-link" type="button" data-word="مُحيطٍ" data-root="Ḥ W Ṭ (H W TT)" data-learn-more="/quran-terminology/en/roots/h-w-tt/" data-root-meaning="To surround, encompass, take something from all sides, enclose it fully; and in some uses, to guard, watch over, or besiege">مُحيطٍ</button>
  </p>
  <p class="english-verse">And to Midian, their brother Shuayb. He said, “My people, worship The God. You have no god other than Him. Do not diminish the measure or the balance. I see you in prosperity, and I fear for you the punishment of an encompassing day.</p>
</section>
