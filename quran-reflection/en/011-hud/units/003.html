    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">تَوَلَّوا</button>

    <button class="word-link" type="button" data-word="كَبيرٍ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">كَبيرٍ</button>
  </p>
  <p class="english-verse">Ask your Lord for forgiveness, then turn back to Him. He will grant you good enjoyment until an appointed term and give every possessor of merit his merit. If you turn away, I fear for you the punishment of a great day.</p>
