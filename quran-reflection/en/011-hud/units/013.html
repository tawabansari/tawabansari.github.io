<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They say, introducing the allegation of fabrication.">يَقولونَ</button>
    <button class="word-link" type="button" data-word="افتَرىٰهُ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations." data-context="He fabricated it, the opponents’ allegation.">افتَرىٰهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say, the command to answer the allegation.">قُل</button>
    <button class="word-link" type="button" data-word="فَأتوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Then bring, the challenge to produce ten surahs.">فَأتوا</button>
    <button class="word-link" type="button" data-word="بِعَشرِ" data-root="AYN SH R" data-root-meaning="Ten and its numerical forms and ratios; association, companionship, kindred, and an assembly. ʿIshār: she-camels approaching delivery." data-context="Ten, the number of surahs requested." data-learn-more="/quran-terminology/en/roots/ayn-sh-r/">بِعَشرِ</button>
    <button class="word-link" type="button" data-word="سُوَرٍ" data-root="S W R" data-learn-more="/quran-terminology/en/roots/s-w-r/" data-context="Surahs, ten of which are requested." data-root-meaning="A wall, enclosure, boundary, raised structure, or a form that surrounds something and distinguishes inside from outside Sūrah: a distinct unit of Qur’anic text with a beginning and end.">سُوَرٍ</button>
    <button class="word-link" type="button" data-word="مِثلِهِ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like it, describing the surahs requested.">مِثلِهِ</button>
    <button class="word-link" type="button" data-word="مُفتَرَيٰتٍ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations." data-context="Fabricated, describing the surahs in the challenge answering the allegation.">مُفتَرَيٰتٍ</button>
    <button class="word-link" type="button" data-word="وَادعوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="And call, summoning helpers.">وَادعوا</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَنِ</button>
    <button class="word-link" type="button" data-word="استَطَعتُم" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="You can, concerning those they are able to summon.">استَطَعتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Other than, in the phrase excluding Allah.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Are, in the condition of truthfulness.">كُنتُم</button>
    <button class="word-link" type="button" data-word="صٰدِقينَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Truthful, the condition posed to the claimants.">صٰدِقينَ</button>
  </p>
  <p class="english-verse">Or do they say, “He fabricated it”? Say, “Then bring ten fabricated surahs like it, and call upon whoever you can apart from The God, if you are truthful.”</p>
</section>
