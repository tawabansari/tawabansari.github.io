<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الفَريقَينِ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/">الفَريقَينِ</button>
    <button class="word-link" type="button" data-word="كَالأَعمىٰ" data-root="AYN M Y" data-learn-more="/quran-terminology/en/roots/ayn-m-y/" data-root-meaning="Blindness, not seeing, the covered path of sight, ambiguity, and the loss of observation or discernment">كَالأَعمىٰ</button>
    <button class="word-link" type="button" data-word="وَالأَصَمِّ" data-root="Ṣ M M" data-learn-more="/quran-terminology/en/roots/sad-m-m/" data-root-meaning="Deafness, blocked hearing, hardness, closure, and being impenetrable to sound or message">وَالأَصَمِّ</button>
    <button class="word-link" type="button" data-word="وَالبَصيرِ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/">وَالبَصيرِ</button>
    <button class="word-link" type="button" data-word="وَالسَّميعِ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/">وَالسَّميعِ</button>
    ۚ
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="يَستَوِيانِ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/">يَستَوِيانِ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">مَثَلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تَذَكَّرونَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/">تَذَكَّرونَ</button>
  </p>
  <p class="english-verse">The likeness of the two groups is that of the blind and deaf, and the seeing and hearing. Are the two equal in likeness? Will you not take heed?</p>
