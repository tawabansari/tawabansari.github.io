<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:114</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَقِمِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Establish; the command to maintain ṣalāh.">وَأَقِمِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Ṣalāh, commanded at the stated times.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="طَرَفَىِ" data-root="TT R F" data-learn-more="/quran-terminology/en/roots/tt-r-f/" data-root-meaning="Edges, sides, parts of a whole, the gaze, and the movement of sight" data-context="The two ends of the day.">طَرَفَىِ</button>
    <button class="word-link" type="button" data-word="النَّهارِ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="Day, in specifying the times of ṣalāh.">النَّهارِ</button>
    <button class="word-link" type="button" data-word="وَزُلَفًا" data-root="Z L F" data-learn-more="/quran-terminology/en/roots/z-l-f/" data-root-meaning="Drawing near, advancing and bringing near; proximity in place, time or standing." data-context="Portions of the night, with temporal proximity in the use of zulaf.">وَزُلَفًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Night, portions of which are mentioned for ṣalāh.">الَّيلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الحَسَنٰتِ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Good deeds.">الحَسَنٰتِ</button>
    <button class="word-link" type="button" data-word="يُذهِبنَ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach" data-context="Remove; describing the effect of good deeds on bad deeds.">يُذهِبنَ</button>
    <button class="word-link" type="button" data-word="السَّيِّـٔاتِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Bad deeds.">السَّيِّـٔاتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="ذِكرىٰ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="A reminder for those who remember.">ذِكرىٰ</button>
    <button class="word-link" type="button" data-word="لِلذّٰكِرينَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Those who remember and take heed.">لِلذّٰكِرينَ</button>
  </p>
  <p class="english-verse">Establish prayer at the two ends of the day and in the near parts of the night. Good deeds remove evil deeds. That is a reminder for those who remember.</p>
</section>
