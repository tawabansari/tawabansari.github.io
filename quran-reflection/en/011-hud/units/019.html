<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Hud 11:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَصُدّونَ" data-root="SAD D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-d-d/" data-root-meaning="Turning away or preventing another.">يَصُدّونَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَيَبغونَها" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit">وَيَبغونَها</button>
    <button class="word-link" type="button" data-word="عِوَجًا" data-root="AYN W J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-j/" data-root-meaning="Crookedness or deviation from straightness.">عِوَجًا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="بِالـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">بِالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="كٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كٰفِرونَ</button>
  </p>
  <p class="english-verse">Those who hinder from the way of The God and seek to make it crooked, and who disbelieve in the Hereafter.</p>
