<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَعلَمَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">لِيَعلَمَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="أَبلَغوا" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof">أَبلَغوا</button>
    <button class="word-link" type="button" data-word="رِسٰلٰتِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رِسٰلٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَأَحاطَ" data-root="Ḥ W Ṭ (H W TT)" data-learn-more="/quran-terminology/en/roots/h-w-tt/" data-root-meaning="To surround, encompass, take something from all sides, enclose it fully; and in some uses, to guard, watch over, or besiege">وَأَحاطَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="لَدَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدَيهِم</button>
    <button class="word-link" type="button" data-word="وَأَحصىٰ" data-root="H SAD Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sad-y/" data-root-meaning="Pebbles; iḥṣāʾ means counting or comprehensively enumerating.">وَأَحصىٰ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَدَدًا" data-root="ʿ D D (Ayn D D)" data-learn-more="/quran-terminology/en/roots/ayn-d-d/" data-root-meaning="Counting, measure, appointed duration, and ordered preparation for a defined purpose">عَدَدًا</button>
  </p>
  <p class="english-verse">so that He may know that they have conveyed their Lord’s messages. He encompasses what is with them and has counted everything in number.</p>
