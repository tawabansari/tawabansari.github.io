<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say: the command to Muḥammad to state the limit of his knowledge about the promise’s timing.">قُل</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="أَدرى" data-root="D R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-r-y/" data-root-meaning="Knowing and becoming aware." data-context="I do not know: in in adrī, in is negative; the clause is not conditional.">أَدرى</button>
    <button class="word-link" type="button" data-word="أَقَريبٌ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Is it near? A question about the nearness of what the addressees are promised.">أَقَريبٌ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="توعَدونَ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="What you are promised: a passive verb addressing a plural audience; the promise’s referent comes from context.">توعَدونَ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="يَجعَلُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Appoints a period for it: setting the temporal interval or endpoint is attributed to the Lord.">يَجعَلُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord: the One to whom appointing a period for the promise is attributed.">رَبّى</button>
    <button class="word-link" type="button" data-word="أَمَدًا" data-root="A M D" data-learn-more="/quran-terminology/en/roots/a-m-d/" data-root-meaning="A limit or endpoint reached by a distance or extent; temporally, a duration or interval measured with reference to a beginning, an end, or an anticipated point." data-context="A period or temporal endpoint before the promise is fulfilled; its length is unknown to the speaker, and the word need not mean a very long time.">أَمَدًا</button>
  </p>
  <p class="english-verse">Say, “I do not know whether what you are promised is near, or whether my Lord will set a term for it.”</p>
