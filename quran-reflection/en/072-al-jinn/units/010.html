<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="نَدرى" data-root="D R Y" data-learn-more="/quran-terminology/en/roots/d-r-y/" data-root-meaning="Knowing or being aware of a matter; in Form IV, informing another." data-context="We do not know; the jinn’s statement about harm or guidance intended for earth’s inhabitants.">نَدرى</button>
    <button class="word-link" type="button" data-word="أَشَرٌّ" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/" data-context="Whether harm; one side of the jinn’s question about the event’s purpose.">أَشَرٌّ</button>
    <button class="word-link" type="button" data-word="أُريدَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Was intended; harm for earth’s inhabitants, in a passive construction.">أُريدَ</button>
    <button class="word-link" type="button" data-word="بِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِمَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; the dwelling of those discussed in the question.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="أَرادَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Has intended; the Lord’s will concerning their guidance.">أَرادَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِم</button>
    <button class="word-link" type="button" data-word="رَبُّهُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord; the one to whom intending their guidance is attributed.">رَبُّهُم</button>
    <button class="word-link" type="button" data-word="رَشَدًا" data-root="R SH D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-sh-d/" data-root-meaning="Sound direction and judgment, as opposed to error." data-context="Right guidance; the other possibility contrasted with harm.">رَشَدًا</button>
  </p>
  <p class="english-verse">We do not know whether harm is intended for those on earth, or whether their Lord intends right guidance for them.</p>
</section>
