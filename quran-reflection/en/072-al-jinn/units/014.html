<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="مِنَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَّا</button>
    <button class="word-link" type="button" data-word="المُسلِمونَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Those who submit; the group among the jinn contrasted with the unjust.">المُسلِمونَ</button>
    <button class="word-link" type="button" data-word="وَمِنَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَّا</button>
    <button class="word-link" type="button" data-word="القٰسِطونَ" data-root="Q S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-tt/" data-root-meaning="Qisṭ and iqṣāṭ concern justice; qusūṭ concerns injustice or deviation; the form determines the sense." data-context="The unjust and those deviating from what is right; the group contrasted with those who submit.">القٰسِطونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="أَسلَمَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Submits; the conditional verb concerning whoever has sought sound guidance.">أَسلَمَ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="تَحَرَّوا" data-root="H R Y" data-root-meaning="In the branch involving ḥariyy and taḥarrā, Ḥ R Y concerns suitability, intention, and purposeful seeking. Taḥarrā means seeking or aiming for something attentively and earnestly, particularly what is considered more suitable or fitting. Qur’anic تَحَرَّوْا رَشَدًا expresses seeking sound guidance and purposefully turning toward it." data-context="They have deliberately and earnestly sought sound guidance and turned toward it." data-learn-more="/quran-terminology/en/roots/h-r-y/">تَحَرَّوا</button>
    <button class="word-link" type="button" data-word="رَشَدًا" data-root="R SH D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-sh-d/" data-root-meaning="Sound direction and judgment, as opposed to error." data-context="Sound guidance and right direction; what they have sought and aimed for.">رَشَدًا</button>
  </p>
  <p class="english-verse">Some of us submit, and some of us turn aside from right. Those who submit have sought right guidance.</p>
