<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنّا</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="We were, in the construction describing former practice.">كُنّا</button>
    <button class="word-link" type="button" data-word="نَقعُدُ" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Used to sit, taking positions for listening.">نَقعُدُ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنها</button>
    <button class="word-link" type="button" data-word="مَقٰعِدَ" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Sitting places, the positions taken for listening.">مَقٰعِدَ</button>
    <button class="word-link" type="button" data-word="لِلسَّمعِ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="For listening, the purpose of taking those positions.">لِلسَّمعِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="يَستَمِعِ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Listens, now attempting to hear.">يَستَمِعِ</button>
    <button class="word-link" type="button" data-word="الـٔانَ" data-context="Now; the current situation of listening contrasted with the speakers’ former practice." data-root-note="A temporal noun functioning as an indeclinable adverbial; al-ān’s historical derivation is disputed." data-learn-more="/quran-terminology/en/roots/a-w-n/">الـٔانَ</button>
    <button class="word-link" type="button" data-word="يَجِد" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="Finds, encountering what lies in wait for him.">يَجِد</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="شِهابًا" data-root="SH H2 B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h2-b/" data-root-meaning="A flame or brilliant luminous object in the sky." data-context="A bright flame, what the listener finds lying in wait.">شِهابًا</button>
    <button class="word-link" type="button" data-word="رَصَدًا" data-root="R SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-sad-d/" data-root-meaning="Watching or lying in wait." data-context="Lying in wait and watchful, describing the flame.">رَصَدًا</button>
  </p>
  <p class="english-verse">We used to sit in places there to listen, but whoever listens now finds a flaming meteor lying in wait for him.</p>
</section>
