  <h2 class="ayah-title">Al-Jinn 72:17</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>

  <p class="english-verse">to test them through it. Whoever turns away from the remembrance of his Lord, He will put him into a grueling punishment.</p>
