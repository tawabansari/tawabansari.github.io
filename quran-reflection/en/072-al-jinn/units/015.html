<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="القٰسِطونَ" data-root="Q S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-tt/" data-root-meaning="Qisṭ and iqṣāṭ concern justice; qusūṭ concerns injustice or deviation; the form determines the sense." data-context="The unjust, in the context of the jinn’s speech">القٰسِطونَ</button>
    <button class="word-link" type="button" data-word="فَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They are destined as firewood for Hell, stating their outcome">فَكانوا</button>
    <button class="word-link" type="button" data-word="لِجَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">لِجَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="حَطَبًا" data-root="H TT B" data-root-meaning="The root’s semantic core is firewood and providing woody material to kindle a fire. From this tangible usage arise the image of persons as firewood and the comparison of inflammatory conduct to providing fuel for hostility’s fire." data-context="Firewood, describing the fate of the unjust in the jinn’s speech as fuel for Hell" data-learn-more="/quran-terminology/en/roots/h-tt-b/">حَطَبًا</button>
  </p>
  <p class="english-verse">As for those who turn aside from right, they will be firewood for Hell.”</p>
</section>
