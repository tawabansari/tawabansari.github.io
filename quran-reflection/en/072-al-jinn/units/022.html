<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command to declare the absence of an independent protector.">قُل</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="يُجيرَنى" data-root="J W R" data-root-meaning="Neighborhood and adjacency; granting refuge and protection; jawr concerns departure from a right course or justice." data-context="Will protect me; the protection against God denied in the sentence." data-learn-more="/quran-terminology/en/roots/j-w-r/">يُجيرَنى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="أَحَدٌ" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="Anyone; denying any protector against Him.">أَحَدٌ</button>
    <button class="word-link" type="button" data-word="وَلَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَن</button>
    <button class="word-link" type="button" data-word="أَجِدَ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="Will find; the finding denied in the sentence.">أَجِدَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Apart from Him; any alternative to Him.">دونِهِ</button>
    <button class="word-link" type="button" data-word="مُلتَحَدًا" data-root="L H D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h-d/" data-root-meaning="Inclining or deviating; multaḥad is a refuge or place to turn aside." data-context="A refuge; a place to turn for shelter and escape.">مُلتَحَدًا</button>
  </p>
  <p class="english-verse">Say, “No one will shelter me from The God, and I will find no refuge apart from Him,</p>
