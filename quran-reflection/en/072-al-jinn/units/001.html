<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jinn 72:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say: the command to report revelation.">قُل</button>
    <button class="word-link" type="button" data-word="أوحِىَ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="Was revealed: informing the addressee of the jinn’s listening.">أوحِىَ</button>
    <button class="word-link" type="button" data-word="إِلَىَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَىَّ</button>

    <button class="word-link" type="button" data-word="نَفَرٌ" data-root="N F R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-r/" data-context="A group: a company of jinn." data-root-meaning="Setting out; also aversion or fleeing away. As the noun nafar, a group of individuals.">نَفَرٌ</button>

    <button class="word-link" type="button" data-word="الجِنِّ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The jinn: the listeners described.">الجِنِّ</button>
    <button class="word-link" type="button" data-word="فَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then they said: reporting the listeners’ response.">فَقالوا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>

    <button class="word-link" type="button" data-word="قُرءانًا" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="A wondrous recitation: the text heard by the jinn." data-learn-more="/quran-terminology/en/roots/q-r-a/">قُرءانًا</button>
    <button class="word-link" type="button" data-word="عَجَبًا" data-root="AYN J B" data-root-meaning="Wonder and finding something significant or unusual; iʿjāb denotes pleasing or impressing, and ʿujb self-admiration." data-context="Wonderful: the listeners’ description of the Qur’an." data-learn-more="/quran-terminology/en/roots/ayn-j-b/">عَجَبًا</button>

  <p class="english-verse">Say, “It has been revealed to me that a group of jinn listened and said: We have heard a wondrous Quran,</p>
