<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُسَبِّحُ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution">وَيُسَبِّحُ</button>
    <button class="word-link" type="button" data-word="الرَّعدُ" data-root="R AYN D" data-learn-more="/quran-terminology/en/roots/r-ayn-d/" data-root-meaning="Thunder, the roar of the sky, severe shaking sound, and trembling caused by sound, fear, or turbulence">الرَّعدُ</button>
    <button class="word-link" type="button" data-word="بِحَمدِهِ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd">بِحَمدِهِ</button>
    <button class="word-link" type="button" data-word="وَالمَلٰئِكَةُ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">وَالمَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خيفَتِهِ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat">خيفَتِهِ</button>
    <button class="word-link" type="button" data-word="وَيُرسِلُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَيُرسِلُ</button>
    <button class="word-link" type="button" data-word="الصَّوٰعِقَ" data-root="Ṣ AYN Q (Ṣ ʿ Q)" data-learn-more="/quran-terminology/en/roots/sad-ayn-q/" data-root-meaning="Thunderbolt, sudden crushing strike, severe sound and shock, and an event that kills, stuns, or disables normal function">الصَّوٰعِقَ</button>
    <button class="word-link" type="button" data-word="فَيُصيبُ" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place">فَيُصيبُ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يُجٰدِلونَ" data-root="J D L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-d-l/" data-root-meaning="Twisting firmly or making secure; jidāl: verbal or argumentative contest.">يُجٰدِلونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="شَديدُ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">شَديدُ</button>
    <button class="word-link" type="button" data-word="المِحالِ" data-root="M H L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-h-l/" data-root-meaning="Miḥāl denotes formidable power or contrivance; its derivation is debated.">المِحالِ</button>
  </p>
  <p class="english-verse">Thunder glorifies Him with praise, as do the angels in awe of Him. He sends thunderbolts and strikes with them whomever He wills, while they dispute about The God. He is mighty in power.</p>
</section>
