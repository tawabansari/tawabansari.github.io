<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَستَعجِلونَكَ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">وَيَستَعجِلونَكَ</button>
    <button class="word-link" type="button" data-word="بِالسَّيِّئَةِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">بِالسَّيِّئَةِ</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلَ</button>
    <button class="word-link" type="button" data-word="الحَسَنَةِ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">الحَسَنَةِ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="خَلَت" data-root="KH L W" data-learn-more="/quran-terminology/en/roots/kh-l-w/" data-root-meaning="Becoming empty, withdrawing into privacy, leaving the public field, being alone, becoming free of obstruction, and separating from open visibility">خَلَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِمُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِهِمُ</button>
    <button class="word-link" type="button" data-word="المَثُلٰتُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">المَثُلٰتُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="لَذو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَذو</button>
    <button class="word-link" type="button" data-word="مَغفِرَةٍ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">مَغفِرَةٍ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ظُلمِهِم" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظُلمِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="لَشَديدُ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">لَشَديدُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">العِقابِ</button>
  </p>
  <p class="english-verse">They ask you to hasten evil before good, though exemplary punishments have passed before them. Your Lord possesses forgiveness for people despite their wrongdoing, and your Lord is severe in punishment.</p>
</section>
