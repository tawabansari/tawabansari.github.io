  </p>
  <p class="english-verse">Thus We have sent you among a community before which communities have passed, to recite to them what We have revealed to you, while they disbelieve in the Entirely Merciful. Say, “He is my Lord. There is no god but Him. On Him I have relied, and to Him is my return.”</p>
