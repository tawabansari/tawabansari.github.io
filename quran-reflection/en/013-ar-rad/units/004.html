  <h2 class="ayah-title">Ar-Rad 13:4</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="وَزَرعٌ" data-root="Z R AYN" data-learn-more="/quran-terminology/en/roots/z-r-ayn/" data-root-meaning="Placing seed, sprouting, plant growth, and the appearance of produce" data-context="And crops; cultivated vegetation.">وَزَرعٌ</button>

    <button class="word-link" type="button" data-word="وَغَيرُ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="And other than; introducing palms without a shared root.">وَغَيرُ</button>
    <button class="word-link" type="button" data-word="صِنوانٍ" data-root="SAD N W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-n-w/" data-root-meaning="A tree or stem sharing a root; ṣinw denotes a counterpart from the same origin." data-context="Sharing a root; the feature denied of the second group by ghayr.">صِنوانٍ</button>
    <button class="word-link" type="button" data-word="يُسقىٰ" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="Is watered; the vegetation receiving water.">يُسقىٰ</button>

    <button class="word-link" type="button" data-word="وٰحِدٍ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="One; describing the irrigation water.">وٰحِدٍ</button>
    <button class="word-link" type="button" data-word="وَنُفَضِّلُ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="And We favor; distinguishing the vegetation’s yields.">وَنُفَضِّلُ</button>
    <button class="word-link" type="button" data-word="بَعضَها" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Some of them; part of the vegetation being compared.">بَعضَها</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Others; the other side of the comparison of yield.">بَعضٍ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأُكُلِ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Food and yield; what is said to differ.">الأُكُلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Signs; what the variations and growth point to.">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="For a people; those benefiting from the signs.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعقِلونَ" data-root="ʿ Q L (Ayn Q L)" data-learn-more="/quran-terminology/en/roots/ayn-q-l/" data-root-meaning="Tying, restraining, understanding, connecting meaning, and holding judgment back from scattering" data-context="Reason; using understanding regarding the signs.">يَعقِلونَ</button>
  </p>
  <p class="english-verse">On earth are neighboring tracts, gardens of grapevines, crops, and date palms sharing a root or standing separately, watered with one water. We favor some over others in what they yield to eat. In that are signs for people who reason.</p>
