<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُريكُمُ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Shows you the lightning.">يُريكُمُ</button>
    <button class="word-link" type="button" data-word="البَرقَ" data-root="B R Q" data-learn-more="/quran-terminology/en/roots/b-r-q/" data-root-meaning="Flashing, lightning, sudden brightness, and a sharp momentary disclosure through intense light" data-context="Lightning, accompanied by fear and hope.">البَرقَ</button>
    <button class="word-link" type="button" data-word="خَوفًا" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Fear in response to possible danger.">خَوفًا</button>
    <button class="word-link" type="button" data-word="وَطَمَعًا" data-root="Ṭ M ʿ (TT M Ayn)" data-learn-more="/quran-terminology/en/roots/tt-m-ayn/" data-root-meaning="Expectation and inner inclination toward attaining a desired matter thought possible" data-context="And hope for rain and benefit.">وَطَمَعًا</button>
    <button class="word-link" type="button" data-word="وَيُنشِئُ" data-root="N SH A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-a/" data-root-meaning="Originating, growing, or nurturing." data-context="And brings into being the heavy clouds.">وَيُنشِئُ</button>
    <button class="word-link" type="button" data-word="السَّحابَ" data-root="S H B" data-root-meaning="Dragging, extending and cloud: from drawing something over the ground to clouds moving through the sky and people dragged in punishment" data-learn-more="/quran-terminology/en/roots/s-h-b/" data-context="The clouds described as heavy.">السَّحابَ</button>
    <button class="word-link" type="button" data-word="الثِّقالَ" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="Heavy: describing clouds in the context of fear and hope of rain." data-learn-more="/quran-terminology/en/roots/th-q-l/">الثِّقالَ</button>
  </p>
  <p class="english-verse">He is the One who shows you lightning, bringing fear and hope, and raises the heavy clouds.</p>
