<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَلِلَّهِ</button>
    <button class="word-link" type="button" data-word="يَسجُدُ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Prostrates; expressing beings’ submission before The God.">يَسجُدُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; one of the two encompassing realms named here.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; the other realm whose inhabitants are mentioned.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="طَوعًا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="Willingly and with acceptance; paired with unwillingly.">طَوعًا</button>
    <button class="word-link" type="button" data-word="وَكَرهًا" data-root="K R H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-h2/" data-root-meaning="Dislike or hardship; ikrāh means compulsion against one&#x27;s will." data-context="And unwillingly; contrasted with willing action.">وَكَرهًا</button>
    <button class="word-link" type="button" data-word="وَظِلٰلُهُم" data-root="Ẓ L L (Zha L L)" data-learn-more="/quran-terminology/en/roots/zha-l-l/" data-root-meaning="Shade, a covering that blocks direct exposure, casting shade, and in the verb ظَلَّ, continuing or remaining in a state." data-context="And their shadows; the ayah also attributes prostration to the shadows.">وَظِلٰلُهُم</button>
    <button class="word-link" type="button" data-word="بِالغُدُوِّ" data-root="GH D W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-d-w/" data-root-meaning="Morning or going early; ghad is tomorrow or the future." data-context="In the morning; one of the times specified for the shadows.">بِالغُدُوِّ</button>
    <button class="word-link" type="button" data-word="وَالـٔاصالِ" data-root="A SAD L" data-learn-more="/quran-terminology/en/roots/a-sad-l/" data-root-meaning="a thing’s root or foundation, and late afternoon as a particular part of the day." data-context="And in the late afternoons approaching sunset; the specified time of the shadows’ prostration.">وَالـٔاصالِ</button>
    ۩
  </p>
  <p class="english-verse">To The God prostrates whoever is in the heavens and the earth, willingly or unwillingly, as do their shadows in the mornings and evenings.</p>
</section>
