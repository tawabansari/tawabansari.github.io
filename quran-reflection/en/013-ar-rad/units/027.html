<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they say; reporting the words of those who deny.">وَيَقولُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved; describing those demanding a sign.">كَفَروا</button>
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="أُنزِلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Was sent down; in the question about a sign being revealed.">أُنزِلَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="ءايَةٌ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="A sign; what they demand from the Lord.">ءايَةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord; in their words about the source of the sign.">رَبِّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; an instruction to respond.">قُل</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُضِلُّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Lets go astray; concerning the one subject to the divine will.">يُضِلُّ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills; expressing will in the statement about misguidance.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيَهدى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="And guides; directing toward Himself.">وَيَهدى</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَنابَ" data-root="N W B" data-learn-more="/quran-terminology/en/roots/n-w-b/" data-root-meaning="Returning and visiting, with repeated visits, turns, or substitution in some uses. Qur’anic anāba denotes turning to The God; munīb describes a person or heart that turns toward Him." data-context="Turns back; turning to The God in connection with guidance.">أَنابَ</button>
  </p>
  <p class="english-verse">Those who disbelieve say, “Why has no sign from his Lord been sent down to him?” Say, “The God leads astray whomever He wills and guides to Himself whoever turns back—</p>
</section>
