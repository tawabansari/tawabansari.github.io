<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">يَرَوا</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّا</button>
    <button class="word-link" type="button" data-word="نَأتِى" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">نَأتِى</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضَ</button>
    <button class="word-link" type="button" data-word="نَنقُصُها" data-root="N Q Ṣ" data-learn-more="/quran-terminology/en/roots/n-q-sad/" data-root-meaning="Decreasing, diminishing and deficiency: from losses of wealth and produce to withholding others’ rights, a reduced lifespan and changing territorial limits">نَنقُصُها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَطرافِها" data-root="TT R F" data-learn-more="/quran-terminology/en/roots/tt-r-f/" data-root-meaning="Edges, sides, parts of a whole, the gaze, and the movement of sight">أَطرافِها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَحكُمُ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">يَحكُمُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="مُعَقِّبَ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">مُعَقِّبَ</button>
    <button class="word-link" type="button" data-word="لِحُكمِهِ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">لِحُكمِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="سَريعُ" data-root="S R AYN" data-root-note="Root study coming soon.">سَريعُ</button>
    <button class="word-link" type="button" data-word="الحِسابِ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">الحِسابِ</button>
  </p>
  <p class="english-verse">Have they not seen that We come to the land, reducing it from its edges? The God judges; none can reverse His judgment. He is swift in reckoning.</p>
</section>
