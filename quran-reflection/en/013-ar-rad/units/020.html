<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يوفونَ" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense">يوفونَ</button>
    <button class="word-link" type="button" data-word="بِعَهدِ" data-root="ʿ H D" data-learn-more="/quran-terminology/en/roots/ayn-h2-d/" data-root-meaning="Knowing with obligation, covenant, care, preservation, and accountability">بِعَهدِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَنقُضونَ" data-root="N Q Ḍ" data-learn-more="/quran-terminology/en/roots/n-q-dad/" data-root-meaning="Unraveling a bond that had already been tied, twisted, strengthened, or built">يَنقُضونَ</button>
    <button class="word-link" type="button" data-word="الميثٰقَ" data-root="W TH Q" data-learn-more="/quran-terminology/en/roots/w-th-q/" data-root-meaning="Firmness, reliability, secure binding, and a commitment that is not loose or abandoned">الميثٰقَ</button>
  </p>
  <p class="english-verse">Those who fulfill the covenant of The God and do not break the pledge;</p>
</section>
