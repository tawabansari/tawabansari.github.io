    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>

    <button class="word-link" type="button" data-word="فَلِلَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">فَلِلَّهِ</button>

    <button class="word-link" type="button" data-word="وَسَيَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">وَسَيَعلَمُ</button>

    <button class="word-link" type="button" data-word="عُقبَى" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">عُقبَى</button>
    <button class="word-link" type="button" data-word="الدّارِ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">الدّارِ</button>

  <p class="english-verse">Those before them schemed, but all planning belongs to The God. He knows what every soul earns, and the disbelievers will come to know to whom the final abode belongs.</p>
