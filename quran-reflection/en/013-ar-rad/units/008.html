<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knows, concerning pregnancy or people’s circumstances.">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَحمِلُ" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy." data-context="Carries offspring or conceives: the female is the subject.">تَحمِلُ</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every or all: expressing comprehensiveness.">كُلُّ</button>
    <button class="word-link" type="button" data-word="أُنثىٰ" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="Every female carrying offspring, within kullu unthā; humans and animals in the pregnancy context.">أُنثىٰ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَغيضُ" data-root="GH Y DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-y-dad/" data-root-meaning="Diminishing or subsiding of liquid." data-context="Diminish, concerning the wombs.">تَغيضُ</button>
    <button class="word-link" type="button" data-word="الأَرحامُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="The wombs, within knowledge of pregnancy, diminution and increase.">الأَرحامُ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَزدادُ" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="Increase, concerning wombs and what they contain.">تَزدادُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="And every, expressing comprehensiveness.">وَكُلُّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Something or a thing, within the sentence’s measure, knowledge or remission.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عِندَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَهُ</button>
    <button class="word-link" type="button" data-word="بِمِقدارٍ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="With a measure: everything with Him has its measure.">بِمِقدارٍ</button>
  </p>
  <p class="english-verse">The God knows what every female bears, and what the wombs diminish and what they increase. Everything with Him has a measure.</p>
</section>
