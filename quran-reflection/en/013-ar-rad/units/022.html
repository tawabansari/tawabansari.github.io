<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="صَبَرُوا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">صَبَرُوا</button>
    <button class="word-link" type="button" data-word="ابتِغاءَ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit">ابتِغاءَ</button>
    <button class="word-link" type="button" data-word="وَجهِ" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh">وَجهِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَنفَقوا" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">وَأَنفَقوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="سِرًّا" data-root="S R R" data-learn-more="/quran-terminology/en/roots/s-r-r/" data-root-meaning="Secrets and Hidden Matters, Joy and Ease, and Places of Rest">سِرًّا</button>
    <button class="word-link" type="button" data-word="وَعَلانِيَةً" data-root="ʿ L N (Ayn L N)" data-learn-more="/quran-terminology/en/roots/ayn-l-n/" data-root-meaning="Being Open and Making Manifest in Contrast to What Is Hidden">وَعَلانِيَةً</button>
    <button class="word-link" type="button" data-word="وَيَدرَءونَ" data-root="D R A" data-learn-more="/quran-terminology/en/roots/d-r-a/" data-root-meaning="Warding off, pushing back, restraining, and preventing something from reaching or taking effect">وَيَدرَءونَ</button>
    <button class="word-link" type="button" data-word="بِالحَسَنَةِ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">بِالحَسَنَةِ</button>
    <button class="word-link" type="button" data-word="السَّيِّئَةَ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">السَّيِّئَةَ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="عُقبَى" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">عُقبَى</button>
    <button class="word-link" type="button" data-word="الدّارِ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">الدّارِ</button>
  </p>
  <p class="english-verse">Those who are patient, seeking the face of their Lord, establish prayer, spend secretly and openly from what We have provided them, and repel evil with good. For them is the final abode—</p>
</section>
