<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَبسُطُ" data-root="B S TT" data-root-meaning="Opening, spreading, and extending; context can apply this to ample provision or breadth of knowledge and capacity." data-context="Widens; making provision ample for whomever He wills." data-learn-more="/quran-terminology/en/roots/b-s-tt/">يَبسُطُ</button>
    <button class="word-link" type="button" data-word="الرِّزقَ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="Provision; what is widened or restricted.">الرِّزقَ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="He wills; His willing concerning ample provision.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيَقدِرُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="And restricts; contrasted with widening provision.">وَيَقدِرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَفَرِحوا" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context." data-context="And they rejoiced; their delight in worldly life.">وَفَرِحوا</button>
    <button class="word-link" type="button" data-word="بِالحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="In life; within the expression worldly life.">بِالحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Worldly; describing present, nearer life.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَا</button>
    <button class="word-link" type="button" data-word="الحَيوٰةُ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life; worldly life compared with the Hereafter.">الحَيوٰةُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Worldly; describing the life being compared.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The Hereafter; the comparison with worldly life.">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَتٰعٌ" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="An enjoyment; the limited benefit of worldly life.">مَتٰعٌ</button>
  </p>
  <p class="english-verse">The God expands provision for whomever He wills and restricts it. They rejoice in the worldly life, though the worldly life compared with the Hereafter is only an enjoyment.</p>
</section>
