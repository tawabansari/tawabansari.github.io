<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يَنقُضونَ" data-root="N Q Ḍ" data-learn-more="/quran-terminology/en/roots/n-q-dad/" data-root-meaning="Unraveling a bond that had already been tied, twisted, strengthened, or built">يَنقُضونَ</button>
    <button class="word-link" type="button" data-word="عَهدَ" data-root="ʿ H D" data-learn-more="/quran-terminology/en/roots/ayn-h2-d/" data-root-meaning="Knowing with obligation, covenant, care, preservation, and accountability">عَهدَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدِ</button>
    <button class="word-link" type="button" data-word="ميثٰقِهِ" data-root="W TH Q" data-learn-more="/quran-terminology/en/roots/w-th-q/" data-root-meaning="Firmness, reliability, secure binding, and a commitment that is not loose or abandoned">ميثٰقِهِ</button>
    <button class="word-link" type="button" data-word="وَيَقطَعونَ" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection">وَيَقطَعونَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَمَرَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">أَمَرَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يوصَلَ" data-root="W Ṣ L" data-learn-more="/quran-terminology/en/roots/w-sad-l/" data-root-meaning="Joining, connecting, conveying, and preserving bonds that should not be severed">يوصَلَ</button>
    <button class="word-link" type="button" data-word="وَيُفسِدونَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order">وَيُفسِدونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    ۙ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّعنَةُ" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion">اللَّعنَةُ</button>
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="سوءُ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">سوءُ</button>
    <button class="word-link" type="button" data-word="الدّارِ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">الدّارِ</button>
  </p>
  <p class="english-verse">Those who break the covenant of The God after its confirmation, sever what The God has commanded to be joined, and spread corruption on earth—for them are the curse and the evil abode.</p>
</section>
