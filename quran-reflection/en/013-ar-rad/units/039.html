<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rad 13:39</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَمحُوا" data-root="M H W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-h-w/" data-root-meaning="Erasing or effacing a trace.">يَمحُوا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيُثبِتُ" data-root="TH B T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-b-t/" data-root-meaning="Remaining firm, being stable, or making steadfast.">وَيُثبِتُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَعِندَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعِندَهُ</button>
    <button class="word-link" type="button" data-word="أُمُّ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination">أُمُّ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">الكِتٰبِ</button>
  </p>
  <p class="english-verse">The God erases what He wills and establishes, and with Him is the source of the Book.</p>
</section>
