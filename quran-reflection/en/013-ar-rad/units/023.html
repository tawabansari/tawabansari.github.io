  <h2 class="ayah-title">Ar-Rad 13:23</h2>
  <p class="arabic-text">

  <p class="english-verse">Gardens of lasting residence, which they will enter along with the righteous among their fathers, spouses, and descendants. The angels will enter upon them through every gate:</p>
