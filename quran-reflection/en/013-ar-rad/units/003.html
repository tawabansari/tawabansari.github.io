  <h2 class="ayah-title">Ar-Rad 13:3</h2>

    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="مَدَّ" data-root="M D D" data-learn-more="/quran-terminology/en/roots/m-d-d/" data-root-meaning="Stretching, extending, continuing, granting respite, adding support, and opening a wider field" data-context="Spread out the earth.">مَدَّ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth: the land of human life.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And placed mountains and rivers in the earth.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="R S W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-s-w/" data-root-meaning="Becoming firmly settled; anchoring or coming to rest." data-context="Firmly set mountains.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="وَأَنهٰرًا" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="And rivers flowing through the land.">وَأَنهٰرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every: encompassing kinds of fruit.">كُلِّ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="TH M R" data-learn-more="/quran-terminology/en/roots/th-m-r/" data-root-meaning="Fruit and produce, with extensions to yield and wealth" data-context="Fruits and plant produce.">الثَّمَرٰتِ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Made: establishing the twofoldness described.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="زَوجَينِ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="A pair: the members or categories described among fruits.">زَوجَينِ</button>
    <button class="word-link" type="button" data-word="اثنَينِ" data-root="TH N Y" data-root-meaning="twofoldness, turning back, and repetition" data-context="Two: with zawjayn concerning fruits." data-learn-more="/quran-terminology/en/roots/th-n-y/">اثنَينِ</button>

    <button class="word-link" type="button" data-word="يُغشِى" data-root="GH SH Y" data-learn-more="/quran-terminology/en/roots/gh-sh-w/" data-root-meaning="Covering, enveloping, being surrounded, and a changed state through covering" data-context="Covers: spreading night over day.">يُغشِى</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Night, covering day in this expression.">الَّيلَ</button>
    <button class="word-link" type="button" data-word="النَّهارَ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="Day, which night covers.">النَّهارَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Signs for recognition and reflection.">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="For people who reflect.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="F K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-k-r/" data-root-meaning="Thinking or reflection in pursuit of understanding." data-context="They reflect on the signs.">يَتَفَكَّرونَ</button>
  </p>
  <p class="english-verse">He is the One who spread out the earth and placed firm mountains and rivers in it, and made in it two mates of every fruit. He covers the day with the night. In that are signs for people who reflect.</p>
</section>
