<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jumuah 62:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="A likeness or comparison">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="حُمِّلُوا" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Were entrusted with the Torah" data-learn-more="/quran-terminology/en/roots/h-m-l/">حُمِّلُوا</button>
    <button class="word-link" type="button" data-word="التَّورىٰةَ" data-root-note="Proper name; no root has been assigned.">التَّورىٰةَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَحمِلوها" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Bore its responsibility, under negation" data-learn-more="/quran-terminology/en/roots/h-m-l/">يَحمِلوها</button>
    <button class="word-link" type="button" data-word="كَمَثَلِ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like the example of">كَمَثَلِ</button>
    <button class="word-link" type="button" data-word="الحِمارِ" data-root="H M R" data-root-meaning="Redness and the colour red; in another branch, ḥimār means donkey, with the plural forms ḥamīr and ḥumur." data-context="An ass carrying books in the comparison" data-learn-more="/quran-terminology/en/roots/h-m-r/">الحِمارِ</button>
    <button class="word-link" type="button" data-word="يَحمِلُ" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Carries books" data-learn-more="/quran-terminology/en/roots/h-m-l/">يَحمِلُ</button>
    <button class="word-link" type="button" data-word="أَسفارًا" data-root="S F R" data-root-meaning="Uncovering and becoming visible; established branches include traveling, brightening, books, and conveying writing or messages." data-context="Books, plural of sifr, in the comparison with an ass carrying books." data-learn-more="/quran-terminology/en/roots/s-f-r/">أَسفارًا</button>
    ۚ
    <button class="word-link" type="button" data-word="بِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="How evil, censuring the example">بِئسَ</button>
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="The likeness or example">مَثَلُ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="The people" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">القَومِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Denied">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The divine signs">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guides, under negation">يَهدِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="The people" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">القَومَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrongdoing, describing the people">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">The likeness of those entrusted with the Torah who then did not bear it is that of a donkey carrying books. How bad is the likeness of the people who denied The God’s verses. The God does not guide the wrongdoing people.</p>
</section>
