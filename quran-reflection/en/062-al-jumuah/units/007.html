<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jumuah 62:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَتَمَنَّونَهُ" data-root="M N Y" data-learn-more="/quran-terminology/en/roots/m-n-y/" data-root-meaning="From Apportioning and Wishing to Recitation, Amānī, and Semen">يَتَمَنَّونَهُ</button>
    <button class="word-link" type="button" data-word="أَبَدًا" data-root="ʾ B D" data-learn-more="/quran-terminology/en/roots/a-b-d/" data-root-meaning="Abadan: continuance throughout the future in view">أَبَدًا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="قَدَّمَت" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history">قَدَّمَت</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">أَيديهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
    <button class="word-link" type="button" data-word="بِالظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">بِالظّٰلِمينَ</button>
  </p>
  <p class="english-verse">They will never wish for it because of what their hands have sent ahead. The God knows the wrongdoers.</p>
</section>
