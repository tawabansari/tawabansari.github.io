<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:43</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مُهطِعينَ" data-root="H2 TT AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-tt-ayn/" data-root-meaning="Hurrying with an extended neck or fixed gaze.">مُهطِعينَ</button>
    <button class="word-link" type="button" data-word="مُقنِعى" data-root="Q N AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-n-ayn/" data-root-meaning="Qāniʿ is explained as content or asking; iqnāʿ of the head means raising it.">مُقنِعى</button>
    <button class="word-link" type="button" data-word="رُءوسِهِم" data-root="R A S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-a-s/" data-root-meaning="The head or uppermost or foremost part.">رُءوسِهِم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَرتَدُّ" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course">يَرتَدُّ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="طَرفُهُم" data-root="TT R F" data-learn-more="/quran-terminology/en/roots/tt-r-f/" data-root-meaning="Edges, sides, parts of a whole, the gaze, and the movement of sight">طَرفُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَفـِٔدَتُهُم" data-root="F A D" data-root-meaning="“heart” is the most appropriate basic equivalent for fuʾād: a heart that Qur’anic usage can connect with reception, understanding, inclination, responsiveness, and steadfastness." data-learn-more="/quran-terminology/en/roots/f-a-d/">وَأَفـِٔدَتُهُم</button>
    <button class="word-link" type="button" data-word="هَواءٌ" data-root="H W Y" data-learn-more="/quran-terminology/en/roots/h2-w-y/" data-root-meaning="Falling, being drawn in a direction, and personal desire">هَواءٌ</button>
  </p>
  <p class="english-verse">Rushing forward with their heads raised, their gaze does not return to them, and their hearts are empty.</p>
