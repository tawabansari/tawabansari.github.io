<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:38</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord, the address in the supplication.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="تَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="You know what we conceal and disclose.">تَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="نُخفى" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="We conceal, concerning what the supplication says He knows." data-learn-more="/quran-terminology/en/roots/kh-f-y/">نُخفى</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="نُعلِنُ" data-root="ʿ L N (Ayn L N)" data-learn-more="/quran-terminology/en/roots/ayn-l-n/" data-root-meaning="Being Open and Making Manifest in Contrast to What Is Hidden" data-context="We disclose, contrasted with what we conceal.">نُعلِنُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَخفىٰ" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="Remains hidden, negated here: nothing escapes His knowledge." data-learn-more="/quran-terminology/en/roots/kh-f-y/">يَخفىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Anything, in denying that anything is hidden from His knowledge.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, one of the realms named in the verse.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Heaven, alongside the earth.">السَّماءِ</button>
  </p>
  <p class="english-verse">“Our Lord, You know what we conceal and what we reveal. Nothing on the earth or in the sky is hidden from The God.”</p>
</section>
