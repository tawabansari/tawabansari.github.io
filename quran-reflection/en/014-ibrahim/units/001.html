<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الر" data-context="Separate letters: Alif, Lam, Ra." data-learn-more="/en/quran-terminology/huruf-muqattaat/">الر</button>
    ۚ
    <button class="word-link" type="button" data-word="كِتٰبٌ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">كِتٰبٌ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="لِتُخرِجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">لِتُخرِجَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>

    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="النّورِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّورِ</button>
    <button class="word-link" type="button" data-word="بِإِذنِ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission">بِإِذنِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="صِرٰطِ" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/">صِرٰطِ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">العَزيزِ</button>
    <button class="word-link" type="button" data-word="الحَميدِ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd">الحَميدِ</button>
  </p>
  <p class="english-verse">Alif, Lam, Ra. A Book We sent down to you so that you may bring people out of darkness into light, by their Lord’s permission, to the path of the Mighty, the Praiseworthy.</p>
</section>
