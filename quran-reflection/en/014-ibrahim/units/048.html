<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day when: the time of earth and heavens changing and people emerging.">يَومَ</button>
    <button class="word-link" type="button" data-word="تُبَدَّلُ" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning." data-context="Is changed or replaced: a passive form concerning the earth.">تُبَدَّلُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth: what is first identified as undergoing change.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Other or different: distinguishing the changed earth from the one mentioned.">غَيرَ</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth: in ghayra al-arḍ, the reference against which difference is expressed.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="وَالسَّمٰوٰتُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="And the heavens: joined with the earth in the image of transformation.">وَالسَّمٰوٰتُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبَرَزوا" data-root="B R Z" data-root-meaning="Coming forth and becoming visible in open space or before sight and confrontation; in transitive forms, making something visible." data-learn-more="/quran-terminology/en/roots/b-r-z/" data-context="They came forth: people appearing before The God, distinct from the earth’s transformation.">وَبَرَزوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الوٰحِدِ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="The One: describing the oneness of The God.">الوٰحِدِ</button>
    <button class="word-link" type="button" data-word="القَهّارِ" data-root="Q H2 R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-h2-r/" data-root-meaning="Overpowering or bringing under control; qahr does not inherently denote the emotion of anger." data-context="The Overpowering: describing the encompassing mastery of The God.">القَهّارِ</button>
  </p>
  <p class="english-verse">On the day the earth is changed to another earth, and the heavens as well, they will appear before The God, the One, the Overpowering.</p>
</section>
