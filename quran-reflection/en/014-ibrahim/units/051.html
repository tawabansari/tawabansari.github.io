<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:51</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَجزِىَ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="So that He may recompense each person for what they earned.">لِيَجزِىَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every, encompassing those recompensed.">كُلَّ</button>
    <button class="word-link" type="button" data-word="نَفسٍ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="A person or soul receiving recompense for deeds.">نَفسٍ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كَسَبَت" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Has earned, referring to each person’s deeds.">كَسَبَت</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="سَريعُ" data-root="S R AYN" data-root-meaning="Speed in movement or action as opposed to slowness; in musāraʿah, prompt initiative toward a goal whose value is determined by context." data-context="Swift in reckoning, describing The God in this verse." data-learn-more="/quran-terminology/en/roots/s-r-ayn/">سَريعُ</button>
    <button class="word-link" type="button" data-word="الحِسابِ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="Reckoning in the context of recompense for deeds.">الحِسابِ</button>
  </p>
  <p class="english-verse">So that The God may recompense every soul for what it has earned. Surely The God is swift in reckoning.</p>
</section>
