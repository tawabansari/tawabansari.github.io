<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسَخَّرَ" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/" data-context="Subjected to your service, concerning the sun and moon.">وَسَخَّرَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الشَّمسَ" data-root="SH M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-m-s/" data-root-meaning="The sun and its light." data-context="The sun, one of the two described as working continuously.">الشَّمسَ</button>
    <button class="word-link" type="button" data-word="وَالقَمَرَ" data-root="Q M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-r/" data-root-meaning="The moon." data-context="And the moon, the other body described as working continuously.">وَالقَمَرَ</button>
    <button class="word-link" type="button" data-word="دائِبَينِ" data-root="D A B" data-learn-more="/quran-terminology/en/roots/d-a-b/" data-root-meaning="Adherence and continuity in action or movement; sustained effort, and a habitual or established pattern through repetition." data-context="Both working continuously, describing the sun and moon.">دائِبَينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَخَّرَ" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/" data-context="Subjected to your service, concerning night and day.">وَسَخَّرَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الَّيلَ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Night, one of the two periods mentioned.">الَّيلَ</button>
    <button class="word-link" type="button" data-word="وَالنَّهارَ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="And day, mentioned alongside night among the blessings.">وَالنَّهارَ</button>
  </p>
  <p class="english-verse">He subjected the sun and the moon to you, both working continuously, and He subjected the night and the day to you.</p>
</section>
