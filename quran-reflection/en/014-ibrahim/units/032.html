<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَأَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">وَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَخرَجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">فَأَخرَجَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الثَّمَرٰتِ" data-root="TH M R" data-learn-more="/quran-terminology/en/roots/th-m-r/" data-root-meaning="Fruit and produce, with extensions to yield and wealth">الثَّمَرٰتِ</button>
    <button class="word-link" type="button" data-word="رِزقًا" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">رِزقًا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَخَّرَ" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/">وَسَخَّرَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الفُلكَ" data-root="F L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-l-k/" data-root-meaning="Fulk means a ship; falak is an orbit or circular course.">الفُلكَ</button>
    <button class="word-link" type="button" data-word="لِتَجرِىَ" data-root="J R Y" data-learn-more="/quran-terminology/en/roots/j-r-y/" data-root-meaning="Flowing, running, continuous movement in a channel, and moving along an appointed course">لِتَجرِىَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation">البَحرِ</button>
    <button class="word-link" type="button" data-word="بِأَمرِهِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">بِأَمرِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَخَّرَ" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/">وَسَخَّرَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الأَنهٰرَ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling">الأَنهٰرَ</button>
  </p>
  <p class="english-verse">The God is the One who created the heavens and the earth and sent down water from the sky, bringing forth fruits with it as provision for you. He subjected the ships to you to sail upon the sea by His command, and He subjected the rivers to you.</p>
</section>
