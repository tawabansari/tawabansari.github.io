    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="They disbelieved.">كَفَروا</button>

  <p class="english-verse">Those who disbelieved said to their messengers, “We will surely expel you from our land, or you will surely return to our way of belief.” Then their Lord revealed to them, “We will surely destroy the wrongdoers.”</p>
