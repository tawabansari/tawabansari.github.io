<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="A likeness or illustration of the condition of the described group&#x27;s deeds.">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved; together with bi-rabbihim, disbelieved in their Lord.">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِرَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="In their Lord; completing the expression “disbelieved.”">بِرَبِّهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="أَعمٰلُهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Their deeds, which are compared to ashes.">أَعمٰلُهُم</button>
    <button class="word-link" type="button" data-word="كَرَمادٍ" data-root="R M D" data-learn-more="/quran-terminology/en/roots/r-m-d/" data-root-meaning="Ashes and residues of burning; in other branches, gray coloration, eye inflammation, and destruction." data-context="Like ashes; their deeds are compared to ashes scattered by a violent wind on a stormy day.">كَرَمادٍ</button>
    <button class="word-link" type="button" data-word="اشتَدَّت" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="Became violent; here, the wind blew fiercely upon the ashes.">اشتَدَّت</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="الرّيحُ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit" data-context="The wind, which scatters the ashes in the verse&#x27;s image.">الرّيحُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day, the time of the wind&#x27;s action, described as stormy.">يَومٍ</button>
    <button class="word-link" type="button" data-word="عاصِفٍ" data-root="AYN SAD F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-f/" data-root-meaning="Violent wind; ʿaṣf denotes crop leaves or dry stalks." data-context="Stormy; describing a day of violently blowing wind.">عاصِفٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَقدِرونَ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Have power; with lā, they have no power over anything of what they earned.">يَقدِرونَ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="كَسَبوا" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Earned; what they acquired through their deeds.">كَسَبوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Anything; in the negative sentence, anything of what they earned.">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="الضَّلٰلُ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Error or going astray; the verse&#x27;s concluding judgment on the described condition.">الضَّلٰلُ</button>
    <button class="word-link" type="button" data-word="البَعيدُ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="Far-reaching; describing error and great distance from the right way.">البَعيدُ</button>
  </p>
  <p class="english-verse">The likeness of those who disbelieve in their Lord: their deeds are like ashes over which the wind blows fiercely on a stormy day. They have no power over anything they have earned. That is the far-reaching error.</p>
</section>
