<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="See, in the verse’s question">تَرَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="بَدَّلوا" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning." data-context="Exchanged">بَدَّلوا</button>
    <button class="word-link" type="button" data-word="نِعمَتَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="The divine favor">نِعمَتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كُفرًا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelief or ingratitude">كُفرًا</button>
    <button class="word-link" type="button" data-word="وَأَحَلّوا" data-root="H L L" data-root-meaning="Opening and undoing a binding; permissibility and removal of prohibition; alighting and settling." data-context="And brought down: they led their people into the abode of ruin." data-learn-more="/quran-terminology/en/roots/h-l-l/">وَأَحَلّوا</button>
    <button class="word-link" type="button" data-word="قَومَهُم" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="Their people" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومَهُم</button>
    <button class="word-link" type="button" data-word="دارَ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence" data-context="An abode">دارَ</button>
    <button class="word-link" type="button" data-word="البَوارِ" data-root="B W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-w-r/" data-root-meaning="Coming to ruin, becoming unproductive, or perishing." data-context="Ruin">البَوارِ</button>
  </p>
  <p class="english-verse">Have you not considered those who exchanged the favor of The God for disbelief and brought their people into the abode of ruin?</p>
</section>
