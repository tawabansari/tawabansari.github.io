  <h2 class="ayah-title">Ibrahim 14:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>

    <button class="word-link" type="button" data-word="القَرارُ" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness.">القَرارُ</button>

  <p class="english-verse">Hell, which they enter to burn—and a wretched resting place it is.</p>
