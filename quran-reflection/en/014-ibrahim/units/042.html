<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">Ibrahim 14:42</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَحسَبَنَّ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="Never suppose: an emphatic prohibition against thinking that The God is unaware of the wrongdoers&#x27; deeds.">تَحسَبَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غٰفِلًا" data-root="GH F L" data-learn-more="/quran-terminology/en/roots/gh-f-l/" data-root-meaning="Something remaining outside, or being left outside, the field of attention, watchfulness, and follow-up" data-context="Unaware of their deeds: the state the verse forbids attributing to The God.">غٰفِلًا</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَمّا</button>
    <button class="word-link" type="button" data-word="يَعمَلُ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="What they do: the deeds of the wrongdoers.">يَعمَلُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers whose deeds are addressed in this warning.">الظّٰلِمونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يُؤَخِّرُهُم" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="He grants them respite, postponing their reckoning until that day.">يُؤَخِّرُهُم</button>
    <button class="word-link" type="button" data-word="لِيَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Until a day when eyes stare fixedly.">لِيَومٍ</button>
    <button class="word-link" type="button" data-word="تَشخَصُ" data-root="SH KH SAD" data-learn-more="/quran-terminology/en/roots/sh-kh-sad/" data-root-meaning="A visible figure, rising, or departing from a place; in Quranic use, eyes or a gaze raised or held open and fixed." data-context="The eyes remain open and fixed in a stare on that day.">تَشخَصُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="الأَبصٰرُ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="The eyes and gazes that remain fixed on that day.">الأَبصٰرُ</button>
  </p>
  <p class="english-verse">Never think The God is unaware of what the wrongdoers do. He only delays them until a day when eyes will stare fixedly.</p>
</section>
