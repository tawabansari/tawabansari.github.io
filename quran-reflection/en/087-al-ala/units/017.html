  <h2 class="ayah-title">Al-Ala 87:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالـٔاخِرَةُ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="And the Hereafter, compared here with worldly life.">وَالـٔاخِرَةُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better, the Hereafter’s superiority in the comparison.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="More lasting, describing the Hereafter compared with worldly life." data-learn-more="/quran-terminology/en/roots/b-q-y/">وَأَبقىٰ</button>
  </p>
  <p class="english-verse">while the Hereafter is better and more lasting.</p>
