<section class="ayah-block" id="ayah-280" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:280</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="ذو" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذو</button>
    <button class="word-link" type="button" data-word="عُسرَةٍ" data-root="AYN S R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-s-r/" data-root-meaning="Difficulty or hardship, as opposed to ease.">عُسرَةٍ</button>
    <button class="word-link" type="button" data-word="فَنَظِرَةٌ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay">فَنَظِرَةٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="مَيسَرَةٍ" data-root="Y S R" data-learn-more="/quran-terminology/en/roots/y-s-r/" data-root-meaning="Ease, opening, availability, smoothness of action, capacity and access; and in the branch of maysir, using ease or chance to gain benefit">مَيسَرَةٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَن</button>
    <button class="word-link" type="button" data-word="تَصَدَّقوا" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">تَصَدَّقوا</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">تَعلَمونَ</button>
  </p>
  <p class="english-verse">If one is in hardship, then respite until ease. To give in charity is better for you, if you know.</p>
