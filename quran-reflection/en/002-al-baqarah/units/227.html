<section class="ayah-block" id="ayah-227" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:227</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="عَزَمُوا" data-root="AYN Z M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-z-m/" data-root-meaning="Firm resolve to carry out an action.">عَزَمُوا</button>
    <button class="word-link" type="button" data-word="الطَّلٰقَ" data-root="TT L Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-l-q/" data-root-meaning="Releasing or setting out; ṭalāq is dissolution of a marriage.">الطَّلٰقَ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="سَميعٌ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">سَميعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
  </p>
  <p class="english-verse">If they resolve upon divorce, indeed, The God is hearing, knowing.</p>
