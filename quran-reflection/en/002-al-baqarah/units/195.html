<section class="ayah-block" id="ayah-195" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:195</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنفِقوا" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="and spend">وَأَنفِقوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="the way; in the way of The God">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُلقوا" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="do not cast">تُلقوا</button>
    <button class="word-link" type="button" data-word="بِأَيديكُم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="with your own hands">بِأَيديكُم</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="التَّهلُكَةِ" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="destruction" data-learn-more="/quran-terminology/en/roots/h2-l-k/">التَّهلُكَةِ</button>
    ۛ
    <button class="word-link" type="button" data-word="وَأَحسِنوا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="and do good">وَأَحسِنوا</button>
    ۛ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="loves">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="those who do good">المُحسِنينَ</button>
  </p>
  <p class="english-verse">Spend in the way of The God, and do not cast yourselves with your own hands into destruction. Do good; indeed, The God loves those who do good.</p>
</section>
