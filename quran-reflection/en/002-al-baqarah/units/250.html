  <h2 class="ayah-title">Al-Baqarah 2:250</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَمّا</button>

    <button class="word-link" type="button" data-word="لِجالوتَ" data-root-note="Proper name; no root has been assigned.">لِجالوتَ</button>
    <button class="word-link" type="button" data-word="وَجُنودِهِ" data-root="J N D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-n-d/" data-root-meaning="Jund and junūd: troops, forces, or organized supporting groups.">وَجُنودِهِ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبَّنا</button>

    <button class="word-link" type="button" data-word="أَقدامَنا" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history">أَقدامَنا</button>

    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">الكٰفِرينَ</button>

  <p class="english-verse">When they came forth against Jalut and his troops, they said: Our Lord, pour patience upon us, make our feet firm, and help us against the disbelieving people.</p>
