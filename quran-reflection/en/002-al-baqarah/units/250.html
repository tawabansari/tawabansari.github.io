<section class="ayah-block" id="ayah-250" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:250</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="بَرَزوا" data-root="B R Z" data-root-meaning="Coming forth and becoming visible in open space or before sight and confrontation; in transitive forms, making something visible." data-learn-more="/quran-terminology/en/roots/b-r-z/" data-context="They came forth: the forces appeared before Goliath and his army for confrontation.">بَرَزوا</button>
    <button class="word-link" type="button" data-word="لِجالوتَ" data-root-note="Proper name; no root has been assigned.">لِجالوتَ</button>
    <button class="word-link" type="button" data-word="وَجُنودِهِ" data-root="J N D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-n-d/" data-root-meaning="Jund and junūd: troops, forces, or organized supporting groups." data-context="And his forces: Goliath’s accompanying army, whom they face.">وَجُنودِهِ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said: introducing the forces’ appeal to their Lord.">قالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord: their address when asking for patience, steadfastness, and help.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَفرِغ" data-root="F R GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-gh/" data-root-meaning="Becoming empty or finishing an occupation; ifrāgh means pouring out." data-context="Pour out: asking for abundant patience through the image of pouring.">أَفرِغ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    <button class="word-link" type="button" data-word="صَبرًا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="Patience and self-restraint: remaining steadfast under the pressure of facing the enemy.">صَبرًا</button>
    <button class="word-link" type="button" data-word="وَثَبِّت" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="And make firm: asking for their footing to remain steady in confrontation." data-learn-more="/quran-terminology/en/roots/th-b-t/">وَثَبِّت</button>
    <button class="word-link" type="button" data-word="أَقدامَنا" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and prior history; qadam means foot, and aqdam means feet or steps." data-context="Our feet or steps: the footing they ask to be made firm.">أَقدامَنا</button>
    <button class="word-link" type="button" data-word="وَانصُرنا" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="And help us: asking for support and victory against the opposing forces.">وَانصُرنا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, and establishing; qawm denotes a people or community." data-context="The people or group: the opposing community in this scene.">القَومِ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Those who practice kufr: describing the opposing group in this context.">الكٰفِرينَ</button>
  </p>
  <p class="english-verse">When they came forth against Jalut and his troops, they said: Our Lord, pour patience upon us, make our feet firm, and help us against the disbelieving people.</p>
</section>
