<section class="ayah-block" id="ayah-263" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:263</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قَولٌ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قَولٌ</button>
    <button class="word-link" type="button" data-word="مَعروفٌ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity.">مَعروفٌ</button>
    <button class="word-link" type="button" data-word="وَمَغفِرَةٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">وَمَغفِرَةٌ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="صَدَقَةٍ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">صَدَقَةٍ</button>
    <button class="word-link" type="button" data-word="يَتبَعُها" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">يَتبَعُها</button>
    <button class="word-link" type="button" data-word="أَذًى" data-root="A DH Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-dh-y/" data-root-meaning="Hurt, distress, or injury affecting a person or living being.">أَذًى</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="غَنِىٌّ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting.">غَنِىٌّ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="H L M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-m/" data-root-meaning="Forbearance and self-restraint; also dreams, and maturity in the expression reaching ḥulum.">حَليمٌ</button>
  </p>
  <p class="english-verse">An honourable word and forgiveness are better than charity followed by hurt. The God is self-sufficient, forbearing.</p>
</section>
