<section class="ayah-block" id="ayah-254" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:254</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed, identifying those addressed by the command to spend.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="أَنفِقوا" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="Spend out of what We have provided you.">أَنفِقوا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰكُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="We have provided you, concerning what is to be spent.">رَزَقنٰكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before, specifying the opportunity before that day arrives.">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَأتِىَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes, referring to the stated day.">يَأتِىَ</button>
    <button class="word-link" type="button" data-word="يَومٌ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day on which trade, friendship, and intercession are negated.">يَومٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="بَيعٌ" data-root="B Y AYN" data-learn-more="/quran-terminology/en/roots/b-y-ayn/" data-root-meaning="Selling, buying and selling, transferring something in exchange for compensation, and completing a clear transaction between two sides" data-context="Trade, negated for that day by the preceding particle.">بَيعٌ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="خُلَّةٌ" data-root="KH L L" data-root-meaning="Intervals and spaces between things; penetration and passage among them; and, in human relationships, friendship and close bonds." data-context="Friendship, in the expression negating friendship on the day of account." data-learn-more="/quran-terminology/en/roots/kh-l-l/">خُلَّةٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="شَفٰعَةٌ" data-root="SH F ʿ (SH F Ayn)" data-learn-more="/quran-terminology/en/roots/sh-f-ayn/" data-root-meaning="Pairing, joining, and placing one factor beside another to support or strengthen an effect" data-context="Intercession, negated in this expression.">شَفٰعَةٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالكٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="And the disbelievers, the group described at the verse’s close.">وَالكٰفِرونَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers, describing the disbelievers in the closing expression.">الظّٰلِمونَ</button>
  </p>
  <p class="english-verse">O you who believe, spend from what We have provided you before a day comes in which there is no trade, friendship, or intercession. The disbelievers are the wrongdoers.</p>
</section>
