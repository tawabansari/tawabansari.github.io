<section class="ayah-block" id="ayah-273" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:273</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلفُقَراءِ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity." data-context="For the needy, the group to whom spending is directed in this context.">لِلفُقَراءِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أُحصِروا" data-root="H SAD R" data-root-meaning="Preventing or restricting movement, access, action, or expression of behavior, through external obstacles, personal circumstances, or self-restraint." data-context="They have been restricted; limited movement and activity for the needy in the way of The God, followed by inability to travel through the land." data-learn-more="/quran-terminology/en/roots/h-sad-r/">أُحصِروا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Way, in “in the way of The God,” the setting of these needy people’s restriction.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَطيعونَ" data-root="TT W AYN" data-root-meaning="becoming compliant and receptive to an action, or yielding to a command or wish, with a related branch foregrounding the capacity and possibility of performing an act." data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="They are unable to travel through the land; the verb itself does not specify the cause.">يَستَطيعونَ</button>
    <button class="word-link" type="button" data-word="ضَربًا" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="Traveling or moving about, in ḍarban fī al-arḍ, rather than striking.">ضَربًا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The land, through which this group’s travel is restricted.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="يَحسَبُهُمُ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="He thinks them, describing the uninformed person’s judgment of their condition.">يَحسَبُهُمُ</button>
    <button class="word-link" type="button" data-word="الجاهِلُ" data-root="J H L" data-learn-more="/quran-terminology/en/roots/j-h2-l/" data-root-meaning="Ignorance and unawareness; also rashness and unmeasured conduct arising from lack of knowledge, forbearance, or settled calm." data-context="The uninformed person, unaware of their hidden need.">الجاهِلُ</button>
    <button class="word-link" type="button" data-word="أَغنِياءَ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting." data-context="Wealthy or free of need, the description mistakenly attributed to them.">أَغنِياءَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="التَّعَفُّفِ" data-root="AYN F F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-f-f/" data-root-meaning="Self-restraint in desire or asking, and preserving chastity." data-context="Because of restraint, why their need remains hidden from the uninformed observer.">التَّعَفُّفِ</button>
    <button class="word-link" type="button" data-word="تَعرِفُهُم" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="You recognize them, knowing their condition from their signs.">تَعرِفُهُم</button>
    <button class="word-link" type="button" data-word="بِسيمٰهُم" data-root="S W M" data-learn-more="/quran-terminology/en/roots/s-w-m/" data-root-meaning="Sending forth, placing under exposure, continual imposition, and marking for distinction" data-context="By their signs, through which their condition is recognized.">بِسيمٰهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَسـَٔلونَ" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="They do not ask, in the expression about not pressing people with requests.">يَسـَٔلونَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People, who are not pressed with insistent requests.">النّاسَ</button>
    <button class="word-link" type="button" data-word="إِلحافًا" data-root="L H F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h-f/" data-root-meaning="Covering; ilḥāf in asking means insistence or persistence." data-context="Insistently, qualifying asking people within the negative clause.">إِلحافًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تُنفِقوا" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="You spend, concerning whatever good is given from resources in this context.">تُنفِقوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خَيرٍ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Good, what is spent and known to The God.">خَيرٍ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing, describing The God’s knowledge of what is spent.">عَليمٌ</button>
  </p>
  <p class="english-verse">For the poor who are restricted in the way of The God and cannot travel through the land. The unaware suppose them wealthy because of their restraint. You recognize them by their marks; they do not ask people insistently. Whatever good you spend, indeed, The God knows it.</p>
</section>
