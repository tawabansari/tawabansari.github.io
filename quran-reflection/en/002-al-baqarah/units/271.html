<section class="ayah-block" id="ayah-271" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:271</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="تُبدُوا" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness">تُبدُوا</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتِ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">الصَّدَقٰتِ</button>
    <button class="word-link" type="button" data-word="فَنِعِمّا" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">فَنِعِمّا</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هِىَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُخفوها" data-root="KH F Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-f-y/" data-root-meaning="Being hidden or concealing; some forms and readings carry the sense of revealing.">تُخفوها</button>
    <button class="word-link" type="button" data-word="وَتُؤتوهَا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَتُؤتوهَا</button>
    <button class="word-link" type="button" data-word="الفُقَراءَ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity.">الفُقَراءَ</button>
    <button class="word-link" type="button" data-word="فَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهُوَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيُكَفِّرُ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">وَيُكَفِّرُ</button>
    <button class="word-link" type="button" data-word="عَنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِكُم" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">سَيِّـٔاتِكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-b-r/" data-root-meaning="News and knowledge gained through familiarity or experience.">خَبيرٌ</button>
  </p>
  <p class="english-verse">If you disclose your charities, that is good. If you conceal them and give them to the poor, that is better for you, and He removes some of your misdeeds from you. The God is aware of what you do.</p>
</section>
