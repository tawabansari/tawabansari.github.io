<section class="ayah-block" id="ayah-279" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:279</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="تَفعَلوا" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="Do; with lam, the condition of failing to abandon ribā.">تَفعَلوا</button>
    <button class="word-link" type="button" data-word="فَأذَنوا" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Then be informed, a warning of war from Allah and His Messenger.">فَأذَنوا</button>
    <button class="word-link" type="button" data-word="بِحَربٍ" data-root="H R B" data-root-meaning="War and hostile confrontation; dispossession; in the miḥrāb branch, an elevated, distinguished place." data-context="War or confrontation, the warning if ribā is not abandoned." data-learn-more="/quran-terminology/en/roots/h-r-b/">بِحَربٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَرَسولِهِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And His Messenger, named with Allah in the warning.">وَرَسولِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُبتُم" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy" data-context="You turn back, abandoning the demand for ribā.">تُبتُم</button>
    <button class="word-link" type="button" data-word="فَلَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَكُم</button>
    <button class="word-link" type="button" data-word="رُءوسُ" data-root="R A S" data-root-meaning="The head; by extension, the upper, initial, or principal part of something. Raʾs al-māl: principal property." data-context="The principal of your assets, distinguished from ribā additions." data-learn-more="/quran-terminology/en/roots/r-a-s/">رُءوسُ</button>
    <button class="word-link" type="button" data-word="أَموٰلِكُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="Your assets, whose principal remains yours.">أَموٰلِكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَظلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrong others; with lā, the prohibition of doing injustice.">تَظلِمونَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُظلَمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Are wronged; with lā, denying injustice against those entitled to the principal.">تُظلَمونَ</button>
  </p>
  <p class="english-verse">If you do not, be notified of war from The God and His messenger. If you repent, your principal is yours: you neither wrong nor are wronged.</p>
</section>
