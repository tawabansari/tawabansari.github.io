<section class="ayah-block" id="ayah-194" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:194</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الشَّهرُ" data-root="SH H2 R" data-root-meaning="A month: a countable monthly period within the recognized system of months." data-context="The month; in the expression sacred month." data-learn-more="/quran-terminology/en/roots/sh-h2-r/">الشَّهرُ</button>
    <button class="word-link" type="button" data-word="الحَرامُ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Sacred or inviolable; describing the month.">الحَرامُ</button>
    <button class="word-link" type="button" data-word="بِالشَّهرِ" data-root="SH H2 R" data-root-meaning="A month: a countable monthly period within the recognized system of months." data-context="For the month; expressing correspondence through bi." data-learn-more="/quran-terminology/en/roots/sh-h2-r/">بِالشَّهرِ</button>
    <button class="word-link" type="button" data-word="الحَرامِ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Sacred; describing the second month in the correspondence.">الحَرامِ</button>
    <button class="word-link" type="button" data-word="وَالحُرُمٰتُ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="And sanctities; inviolable matters within the response provision.">وَالحُرُمٰتُ</button>
    <button class="word-link" type="button" data-word="قِصاصٌ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="Proportionate response concerning sanctities, with the response’s limit specified by bi-mithli mā iʿtadā ʿalaykum." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">قِصاصٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَنِ</button>
    <button class="word-link" type="button" data-word="اعتَدىٰ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="Attacks or transgresses; the conditional verb concerning initial aggression.">اعتَدىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="فَاعتَدوا" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="Then respond; a response limited by the following requirement of correspondence.">فَاعتَدوا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="بِمِثلِ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="In proportion to; specifying the response’s correspondence and limit.">بِمِثلِ</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَا</button>
    <button class="word-link" type="button" data-word="اعتَدىٰ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="Attacked; the initial aggression determining the response’s limit.">اعتَدىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="And be reverent; the command accompanying permission to respond.">وَاتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَاعلَموا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="And know; the command concerning The God’s being with the reverent.">وَاعلَموا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="The reverent; those with whom The God is stated to be.">المُتَّقينَ</button>
  </p>
  <p class="english-verse">The sacred month for the sacred month, and sacred restrictions are subject to retribution. Whoever transgresses against you, respond against him in the same measure as he transgressed against you. Be mindful of The God, and know that The God is with the mindful.</p>
</section>
