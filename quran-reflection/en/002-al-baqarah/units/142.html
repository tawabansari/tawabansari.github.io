  <h2 class="ayah-title">Al-Baqarah 2:142</h2>

    <button class="word-link" type="button" data-word="قِبلَتِهِمُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/">قِبلَتِهِمُ</button>

    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="المَشرِقُ" data-root="SH R Q" data-learn-more="/quran-terminology/en/roots/sh-r-q/">المَشرِقُ</button>

    <button class="word-link" type="button" data-word="يَهدى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/">يَهدى</button>

    <button class="word-link" type="button" data-word="مُستَقيمٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/">مُستَقيمٍ</button>
  </p>
  <p class="english-verse">The foolish among the people will say: What turned them away from the direction they had faced? Say: To The God belong the east and the west. He guides whom He wills to a straight path.</p>
