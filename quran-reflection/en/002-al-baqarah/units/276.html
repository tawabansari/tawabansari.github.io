<section class="ayah-block" id="ayah-276" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:276</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَمحَقُ" data-root="M H Q" data-learn-more="/quran-terminology/en/roots/m-h-q/" data-root-meaning="Erasing, gradual reduction, wearing away, removing blessing, and the disappearance of a thing until it reaches decrease or complete effacement">يَمحَقُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الرِّبوٰا۟" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level">الرِّبوٰا۟</button>
    <button class="word-link" type="button" data-word="وَيُربِى" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level">وَيُربِى</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتِ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">الصَّدَقٰتِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-root-meaning="Ḥubb: love or affection; ḥabb and ḥabbah: grain or a seed. These branches are not interchangeable.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلَّ</button>
    <button class="word-link" type="button" data-word="كَفّارٍ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفّارٍ</button>
    <button class="word-link" type="button" data-word="أَثيمٍ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind">أَثيمٍ</button>
  </p>
  <p class="english-verse">The God wipes out riba and makes charities grow. The God does not love any persistently ungrateful sinner.</p>
</section>
