<section class="ayah-block" id="ayah-261" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:261</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="the likeness">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="spend">يُنفِقونَ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="their wealth">أَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="the way; in the way of The God">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كَمَثَلِ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="like the likeness">كَمَثَلِ</button>
    <button class="word-link" type="button" data-word="حَبَّةٍ" data-root="H B B" data-root-meaning="Grain and seed; ḥabb denotes grain, and ḥabbah a single seed." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="a seed">حَبَّةٍ</button>
    <button class="word-link" type="button" data-word="أَنبَتَت" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed." data-context="grew">أَنبَتَت</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="S B ʿ (S B Ayn)" data-root-meaning="Seven and its related numerical forms; in a separate branch, sabuʿ: a predatory animal." data-context="seven" data-learn-more="/quran-terminology/en/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="سَنابِلَ" data-root="S N B L" data-root-meaning="An ear or head of grain: the grain-bearing part of a plant in which the crop’s grains develop and lie together." data-context="ears of grain" data-learn-more="/quran-terminology/en/roots/s-n-b-l/">سَنابِلَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="each">كُلِّ</button>
    <button class="word-link" type="button" data-word="سُنبُلَةٍ" data-root="S N B L" data-root-meaning="An ear or head of grain: the grain-bearing part of a plant in which the crop’s grains develop and lie together." data-context="ear of grain" data-learn-more="/quran-terminology/en/roots/s-n-b-l/">سُنبُلَةٍ</button>
    <button class="word-link" type="button" data-word="مِا۟ئَةُ" data-root-note="Preliminary meaning; a full root study is not yet available." data-root="M A Y" data-learn-more="/quran-terminology/en/roots/m-a-y/" data-root-meaning="One hundred and its related forms." data-context="a hundred">مِا۟ئَةُ</button>
    <button class="word-link" type="button" data-word="حَبَّةٍ" data-root="H B B" data-root-meaning="Grain and seed; ḥabb denotes grain, and ḥabbah a single seed." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="seeds">حَبَّةٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُضٰعِفُ" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase." data-context="multiplies">يُضٰعِفُ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="He wills">يَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="وٰسِعٌ" data-root="W S ʿ" data-learn-more="/quran-terminology/en/roots/w-s-ayn/" data-root-meaning="From spaciousness to capacity, ability and encompassing" data-context="all-encompassing in bounty">وٰسِعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="knowing">عَليمٌ</button>
  </p>
  <p class="english-verse">The likeness of those who spend their wealth in the way of The God is that of a grain growing seven ears, in every ear a hundred grains. The God multiplies for whom He wills. The God is all-encompassing, knowing.</p>
</section>
