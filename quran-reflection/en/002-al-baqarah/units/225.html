<section class="ayah-block" id="ayah-225" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:225</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُؤاخِذُكُمُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Holds you accountable; here accountability for idle oaths is denied.">يُؤاخِذُكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِاللَّغوِ" data-root="L GH W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-gh-w/" data-root-meaning="Idle or inconsequential speech or action." data-context="For idle or unbinding speech in your oaths.">بِاللَّغوِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَيمٰنِكُم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Your oaths; distinguished according to idle speech and the heart’s responsibility.">أَيمٰنِكُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="يُؤاخِذُكُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Holds you accountable for what your hearts have earned.">يُؤاخِذُكُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كَسَبَت" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Has earned; concerning what the hearts have acquired.">كَسَبَت</button>
    <button class="word-link" type="button" data-word="قُلوبُكُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Your hearts; associated with intention and acquisition here.">قُلوبُكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving; a description alongside divine forbearance.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="H L M" data-root-meaning="Dreams and visions in sleep; puberty in بُلُوغُ الْحُلُمِ; reason, forbearance, and self-restraint against rashness." data-context="Forbearing; describing The God alongside forgiveness and accountability for what hearts earn." data-learn-more="/quran-terminology/en/roots/h-l-m/">حَليمٌ</button>
  </p>
  <p class="english-verse">The God does not hold you accountable for idle words in your oaths, but holds you accountable for what your hearts have earned. The God is forgiving, forbearing.</p>
</section>
