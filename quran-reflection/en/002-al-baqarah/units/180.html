  <h2 class="ayah-title">Al-Baqarah 2:180</h2>

  <p class="english-verse">It is prescribed for you, when death approaches one of you, if he leaves wealth, to make a bequest for parents and close relatives in fairness—a duty upon the mindful.</p>
