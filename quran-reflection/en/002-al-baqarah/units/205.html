<section class="ayah-block" id="ayah-205" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:205</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="تَوَلّىٰ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="turns away or gains power; two contextual readings">تَوَلّىٰ</button>
    <button class="word-link" type="button" data-word="سَعىٰ" data-root="S ʿ Y" data-learn-more="/quran-terminology/en/roots/s-ayn-y/" data-root-meaning="From movement along a course to effort directed toward a result" data-context="strove">سَعىٰ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="the land">الأَرضِ</button>
    <button class="word-link" type="button" data-word="لِيُفسِدَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order" data-context="to spread corruption">لِيُفسِدَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="وَيُهلِكَ" data-root="H2 L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-l-k/" data-root-meaning="Perishing or destroying; also loss, according to context." data-context="and destroy">وَيُهلِكَ</button>
    <button class="word-link" type="button" data-word="الحَرثَ" data-root="Ḥ R TH (H R TH)" data-learn-more="/quran-terminology/en/roots/h-r-th/" data-root-meaning="Purposeful work, preparing a bed, nurturing, and awaiting yield" data-context="crops">الحَرثَ</button>
    <button class="word-link" type="button" data-word="وَالنَّسلَ" data-root="N S L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-s-l/" data-root-meaning="Separating or issuing forth rapidly; nasl means offspring or descendants." data-context="and offspring">وَالنَّسلَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="does not love">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="الفَسادَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order" data-context="corruption">الفَسادَ</button>
  </p>
  <p class="english-verse">When he turns away, he strives through the land to corrupt it and destroy crops and offspring. The God does not love corruption.</p>
</section>
