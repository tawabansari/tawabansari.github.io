<section class="ayah-block" id="ayah-256" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:256</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="إِكراهَ" data-root="K R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-h2/" data-root-meaning="Dislike or hardship; ikrāh means compulsion against one&#x27;s will.">إِكراهَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God">الدّينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="تَبَيَّنَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">تَبَيَّنَ</button>
    <button class="word-link" type="button" data-word="الرُّشدُ" data-root="R SH D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-sh-d/" data-root-meaning="Sound direction and judgment, as opposed to error.">الرُّشدُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغَىِّ" data-root="GH W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-w-y/" data-root-meaning="Error or leading away from sound guidance.">الغَىِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="يَكفُر" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">يَكفُر</button>
    <button class="word-link" type="button" data-word="بِالطّٰغوتِ" data-root="Ṭ GH Y" data-learn-more="/quran-terminology/en/roots/tt-gh-y/" data-root-meaning="From transgression to Taghut: passing beyond the limit, breaking the boundary, and a false reference sitting in the place of truth">بِالطّٰغوتِ</button>
    <button class="word-link" type="button" data-word="وَيُؤمِن" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">وَيُؤمِن</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="استَمسَكَ" data-root="M S K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-k/" data-root-meaning="Grasping, retaining, or holding firmly.">استَمسَكَ</button>
    <button class="word-link" type="button" data-word="بِالعُروَةِ" data-root="AYN R W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-w/" data-root-meaning="A handle or handhold; iʿtirāʾ means befalling or afflicting.">بِالعُروَةِ</button>
    <button class="word-link" type="button" data-word="الوُثقىٰ" data-root="W TH Q" data-learn-more="/quran-terminology/en/roots/w-th-q/" data-root-meaning="Firmness, reliability, secure binding, and a commitment that is not loose or abandoned">الوُثقىٰ</button>
    <button class="word-link" type="button" data-word="لَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَا</button>
    <button class="word-link" type="button" data-word="انفِصامَ" data-root="F SAD M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-sad-m/" data-root-meaning="A crack or break in a connection.">انفِصامَ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="سَميعٌ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">سَميعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
  </p>
  <p class="english-verse">There is no compulsion in religion. Sound guidance has become distinct from error. Whoever rejects taghut and believes in The God has grasped the firmest handhold, which does not break. The God is hearing, knowing.</p>
</section>
