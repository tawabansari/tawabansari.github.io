    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>

  </p>
  <p class="english-verse">They ask you about wine and gambling. Say: In both is great sin and benefits for people, but their sin is greater than their benefit. They ask you what they should spend. Say: The surplus. Thus The God makes the signs clear to you, so that you may reflect,</p>
</section>
