<section class="ayah-block" id="ayah-211" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:211</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَل" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability.">سَل</button>
    <button class="word-link" type="button" data-word="بَنى" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">بَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="Proper name; no root has been assigned.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="كَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَم</button>
    <button class="word-link" type="button" data-word="ءاتَينٰهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">ءاتَينٰهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ءايَةٍ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايَةٍ</button>
    <button class="word-link" type="button" data-word="بَيِّنَةٍ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَيِّنَةٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُبَدِّل" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">يُبَدِّل</button>
    <button class="word-link" type="button" data-word="نِعمَةَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">نِعمَةَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="جاءَتهُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَتهُ</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="شَديدُ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">شَديدُ</button>
    <button class="word-link" type="button" data-word="العِقابِ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">العِقابِ</button>
  </p>
  <p class="english-verse">Ask the Children of Israel how many clear signs We gave them. Whoever changes the favour of The God after it has come to him—indeed, The God is severe in punishment.</p>
</section>
