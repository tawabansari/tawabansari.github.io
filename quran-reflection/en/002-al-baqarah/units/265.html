<section class="ayah-block" id="ayah-265" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:265</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَثَلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="And the likeness and illustrative comparison.">وَمَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="Spend and give.">يُنفِقونَ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُمُ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="Their wealth and possessions.">أَموٰلَهُمُ</button>
    <button class="word-link" type="button" data-word="ابتِغاءَ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="Seeking and pursuing, the purpose of giving.">ابتِغاءَ</button>
    <button class="word-link" type="button" data-word="مَرضاتِ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent" data-context="Pleasure and approval.">مَرضاتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَتَثبيتًا" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="Strengthening from within themselves, concerning giving and inward resolve." data-learn-more="/quran-terminology/en/roots/th-b-t/">وَتَثبيتًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Their own selves, the source of strengthening in this reading.">أَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="كَمَثَلِ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like the likeness and image.">كَمَثَلِ</button>
    <button class="word-link" type="button" data-word="جَنَّةٍ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="A garden.">جَنَّةٍ</button>
    <button class="word-link" type="button" data-word="بِرَبوَةٍ" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level" data-context="On elevated ground.">بِرَبوَةٍ</button>
    <button class="word-link" type="button" data-word="أَصابَها" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="Reached it, the rain reaching the garden.">أَصابَها</button>
    <button class="word-link" type="button" data-word="وابِلٌ" data-root="W B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-b-l/" data-root-meaning="Heaviness or severity; wābil is heavy rain; wabāl is an adverse consequence." data-context="Abundant, heavy rain.">وابِلٌ</button>
    <button class="word-link" type="button" data-word="فَـٔاتَت" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Then gave and produced.">فَـٔاتَت</button>
    <button class="word-link" type="button" data-word="أُكُلَها" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Its yield and fruit.">أُكُلَها</button>
    <button class="word-link" type="button" data-word="ضِعفَينِ" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase." data-context="Double, describing the yield.">ضِعفَينِ</button>
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يُصِبها" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="Reaches it, negated here concerning rain.">يُصِبها</button>
    <button class="word-link" type="button" data-word="وابِلٌ" data-root="W B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-b-l/" data-root-meaning="Heaviness or severity; wābil is heavy rain; wabāl is an adverse consequence." data-context="Abundant, heavy rain.">وابِلٌ</button>
    <button class="word-link" type="button" data-word="فَطَلٌّ" data-root="TT L L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-l-l/" data-root-meaning="Light rain or drizzle." data-context="Then light rain or dew, contrasted with heavy rain.">فَطَلٌّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You do.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Seeing and aware of deeds.">بَصيرٌ</button>
  </p>
  <p class="english-verse">The likeness of those who spend their wealth seeking the pleasure of The God and with firmness from within themselves is that of a garden on a height: a downpour strikes it, and it yields double its fruit. If no downpour strikes it, then a light rain. The God sees what you do.</p>
</section>
