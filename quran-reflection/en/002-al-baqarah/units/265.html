  <p class="english-verse">The likeness of those who spend their wealth seeking the pleasure of The God and with firmness from within themselves is that of a garden on a height: a downpour strikes it, and it yields double its fruit. If no downpour strikes it, then a light rain. The God sees what you do.</p>
