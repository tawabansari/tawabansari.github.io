  <h2 class="ayah-title">Al-Baqarah 2:265</h2>

    <button class="word-link" type="button" data-word="ابتِغاءَ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit">ابتِغاءَ</button>
    <button class="word-link" type="button" data-word="مَرضاتِ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent">مَرضاتِ</button>

    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">أَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="كَمَثَلِ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">كَمَثَلِ</button>
    <button class="word-link" type="button" data-word="جَنَّةٍ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">جَنَّةٍ</button>
    <button class="word-link" type="button" data-word="بِرَبوَةٍ" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level">بِرَبوَةٍ</button>
    <button class="word-link" type="button" data-word="أَصابَها" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place">أَصابَها</button>

    <button class="word-link" type="button" data-word="فَـٔاتَت" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">فَـٔاتَت</button>

    <button class="word-link" type="button" data-word="ضِعفَينِ" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase.">ضِعفَينِ</button>
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>

    <button class="word-link" type="button" data-word="يُصِبها" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place">يُصِبها</button>
    <button class="word-link" type="button" data-word="وابِلٌ" data-root="W B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-b-l/" data-root-meaning="Heaviness or severity; wābil is heavy rain; wabāl is an adverse consequence.">وابِلٌ</button>
    <button class="word-link" type="button" data-word="فَطَلٌّ" data-root="TT L L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-l-l/" data-root-meaning="Light rain or drizzle.">فَطَلٌّ</button>

    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">بَصيرٌ</button>
  </p>
  <p class="english-verse">The likeness of those who spend their wealth seeking the pleasure of The God and with firmness from within themselves is that of a garden on a height: a downpour strikes it, and it yields double its fruit. If no downpour strikes it, then a light rain. The God sees what you do.</p>
</section>
