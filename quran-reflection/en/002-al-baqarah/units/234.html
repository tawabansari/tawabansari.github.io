<section class="ayah-block" id="ayah-234" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:234</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُتَوَفَّونَ" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense" data-context="Die: their lives are taken in full.">يُتَوَفَّونَ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَيَذَرونَ" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="And leave behind: leaving wives after death.">وَيَذَرونَ</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Wives: the women left after their husbands’ death.">أَزوٰجًا</button>
    <button class="word-link" type="button" data-word="يَتَرَبَّصنَ" data-root="R B SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-b-sad/" data-root-meaning="Waiting and watching for an event." data-context="They wait: observing the specified period concerning themselves.">يَتَرَبَّصنَ</button>
    <button class="word-link" type="button" data-word="بِأَنفُسِهِنَّ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Concerning themselves: referring to the women’s waiting.">بِأَنفُسِهِنَّ</button>
    <button class="word-link" type="button" data-word="أَربَعَةَ" data-root="R B AYN (R B ʿ)" data-learn-more="/quran-terminology/en/roots/r-b-ayn/" data-root-meaning="Four, fourfold grouping, one-fourth, forty, and the semantic field of counting and division" data-context="Four: the number of months in the waiting period.">أَربَعَةَ</button>
    <button class="word-link" type="button" data-word="أَشهُرٍ" data-root="SH H2 R" data-root-meaning="A month: a countable monthly period within the recognized system of months." data-context="Months: four months of the waiting period following a husband’s death." data-learn-more="/quran-terminology/en/roots/sh-h2-r/">أَشهُرٍ</button>
    <button class="word-link" type="button" data-word="وَعَشرًا" data-root="AYN SH R" data-root-meaning="Ten and its numerical forms and ratios; association, companionship, kindred, and an assembly. ʿIshār: she-camels approaching delivery." data-context="And ten: the additional duration beyond four months, conventionally ten days." data-learn-more="/quran-terminology/en/roots/ayn-sh-r/">وَعَشرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="بَلَغنَ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="They reach: the women reaching the end of their waiting period.">بَلَغنَ</button>
    <button class="word-link" type="button" data-word="أَجَلَهُنَّ" data-root="A J L" data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period or time; where appropriate, the end of that period." data-context="Their term: the end of the appointed waiting period.">أَجَلَهُنَّ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="جُناحَ" data-root="J N H" data-root-meaning="inclining or turning towards one side; the wing and lateral part of a body or thing; and sin or responsibility that incurs blame and accountability." data-learn-more="/quran-terminology/en/roots/j-n-h/" data-context="Blame or fault: what does not rest upon you under the stated condition.">جُناحَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيما</button>
    <button class="word-link" type="button" data-word="فَعَلنَ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="They do: the women’s actions concerning themselves after the period ends.">فَعَلنَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِنَّ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Themselves: the persons concerned in the women’s acceptable actions.">أَنفُسِهِنَّ</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="In an accepted manner: qualifying their actions concerning themselves.">بِالمَعروفِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You do: the audience’s actions, known to The God.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware: describing The God’s knowledge of your actions." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرٌ</button>
  </p>
  <p class="english-verse">Those among you who die and leave wives—their wives shall wait four months and ten days. When they reach their term, there is no blame upon you for what they do concerning themselves in fairness. The God is aware of what you do.</p>
</section>
