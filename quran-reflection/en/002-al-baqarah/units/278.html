<section class="ayah-block" id="ayah-278" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:278</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="You have believed, identifying those commanded to heed The God and abandon usury.">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="اتَّقُوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Be mindful, observing responsibility before The God in giving up usury.">اتَّقُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَذَروا" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="Give up, abandoning the outstanding claim to usury.">وَذَروا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="بَقِىَ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="Remains, the outstanding usury that must be relinquished." data-learn-more="/quran-terminology/en/roots/b-q-y/">بَقِىَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الرِّبوٰا۟" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level" data-context="Usury, whose outstanding portion must be relinquished.">الرِّبوٰا۟</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You are, within the condition concerning belief.">كُنتُم</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believers, with belief invoked as the basis for obeying this command.">مُؤمِنينَ</button>
  </p>
  <p class="english-verse">O you who believe, be mindful of The God and leave what remains of riba, if you are believers.</p>
</section>
