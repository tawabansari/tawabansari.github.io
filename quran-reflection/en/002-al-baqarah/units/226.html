<section class="ayah-block" id="ayah-226" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:226</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="يُؤلونَ" data-root="A L W" data-learn-more="/quran-terminology/en/roots/a-l-w/" data-root-meaning="Oath and commitment: binding oneself through an oath to do or refrain from something." data-context="They swear to abstain from marital intercourse with their wives; the verb expresses the oath and the context identifies the abstention.">يُؤلونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="نِسائِهِم" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="Their wives, in relation to whom the oath and marital abstention are discussed.">نِسائِهِم</button>
    <button class="word-link" type="button" data-word="تَرَبُّصُ" data-root="R B SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-b-sad/" data-root-meaning="Waiting and watching for an event." data-context="A waiting period assigned to the situation arising from this oath.">تَرَبُّصُ</button>
    <button class="word-link" type="button" data-word="أَربَعَةِ" data-root="R B AYN (R B ʿ)" data-learn-more="/quran-terminology/en/roots/r-b-ayn/" data-root-meaning="Four, fourfold grouping, one-fourth, forty, and the semantic field of counting and division" data-context="Four: the number of months in the waiting period stated here.">أَربَعَةِ</button>
    <button class="word-link" type="button" data-word="أَشهُرٍ" data-root="SH H2 R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h2-r/" data-root-meaning="A month as a period of time." data-context="Months: the time unit of the four-month waiting period.">أَشهُرٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="فاءو" data-root="F Y A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-y-a/" data-root-meaning="Returning; fayʾ denotes returning shade or returned property, according to context." data-context="If they return from the marital abstention under discussion.">فاءو</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving: describing The God after the possibility of return is stated.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful: describing The God in this context.">رَحيمٌ</button>
  </p>
  <p class="english-verse">For those who swear abstinence from their wives, a waiting period of four months. If they return, indeed, The God is forgiving, merciful.</p>
</section>
