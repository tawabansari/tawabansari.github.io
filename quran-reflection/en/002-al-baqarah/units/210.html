  <h2 class="ayah-title">Al-Baqarah 2:210</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>

    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>

    <button class="word-link" type="button" data-word="الأُمورُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">الأُمورُ</button>

  <p class="english-verse">Are they waiting for anything but that The God should come to them in canopies of cloud, and the angels, and the matter be decided? To The God all matters are returned.</p>
