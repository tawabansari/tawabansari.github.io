<section class="ayah-block" id="ayah-191" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:191</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاقتُلوهُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="And kill them; the independent verb of killing, with its pronoun and wartime qualifications determined by context.">وَاقتُلوهُم</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَيثُ</button>
    <button class="word-link" type="button" data-word="ثَقِفتُموهُم" data-root="TH Q F" data-root-meaning="Finding or gaining access to a person in a particular situation, sometimes with dominance or control over them." data-context="Wherever you gain access to them; reaching the group concerned in the martial context, distinct from the verb of killing." data-learn-more="/quran-terminology/en/roots/th-q-f/">ثَقِفتُموهُم</button>
    <button class="word-link" type="button" data-word="وَأَخرِجوهُم" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="And expel them, connected with their earlier expulsion of you.">وَأَخرِجوهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَيثُ</button>
    <button class="word-link" type="button" data-word="أَخرَجوكُم" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="They expelled you; the earlier expulsion referenced by the corresponding action.">أَخرَجوكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالفِتنَةُ" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction" data-context="And fitnah, in the context of persecution, expulsion, and confrontation; its precise sense requires separate study.">وَالفِتنَةُ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="More severe, comparing fitnah with killing.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَتلِ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="Killing, with which fitnah is compared.">القَتلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُقٰتِلوهُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="Do not fight them; the prohibition qualified by the location of the Sacred Mosque.">تُقٰتِلوهُم</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="المَسجِدِ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Mosque, in “the Sacred Mosque,” the place qualifying the fighting.">المَسجِدِ</button>
    <button class="word-link" type="button" data-word="الحَرامِ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Sacred, qualifying the mosque’s protected sanctity.">الحَرامِ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يُقٰتِلوكُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="They fight you, the condition concerning fighting at that location.">يُقٰتِلوكُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="قٰتَلوكُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="They fight you, in the conditional clause fa-in qātalūkum.">قٰتَلوكُم</button>
    <button class="word-link" type="button" data-word="فَاقتُلوهُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="Then kill them; the response to the condition of the other side fighting there.">فَاقتُلوهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="جَزاءُ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Recompense for conduct, concluding the description of this confrontation.">جَزاءُ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="The disbelievers concerned, whose identity and conduct are established by the context.">الكٰفِرينَ</button>
  </p>
  <p class="english-verse">Kill them wherever you encounter them, and drive them out from where they drove you out. Trial is more severe than killing. Do not fight them at the Sacred Mosque unless they fight you there; if they fight you, kill them. Such is the recompense of the disbelievers.</p>
</section>
