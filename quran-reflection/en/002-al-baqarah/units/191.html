  <p class="english-verse">Kill them wherever you encounter them, and drive them out from where they drove you out. Trial is more severe than killing. Do not fight them at the Sacred Mosque unless they fight you there; if they fight you, kill them. Such is the recompense of the disbelievers.</p>
