<section class="ayah-block" id="ayah-206" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Baqarah 2:206</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He is told, a passive verb.">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="اتَّقِ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Be mindful and guard against disobedience.">اتَّقِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَخَذَتهُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Seizes and drives him.">أَخَذَتهُ</button>
    <button class="word-link" type="button" data-word="العِزَّةُ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="Pride that prevents accepting admonition.">العِزَّةُ</button>
    <button class="word-link" type="button" data-word="بِالإِثمِ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Into sin and in connection with it.">بِالإِثمِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَحَسبُهُ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="Then sufficient for him is.">فَحَسبُهُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="And what an evil, a verb of blame.">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="المِهادُ" data-root="M H2 D" data-root-meaning="Preparing and making a place or conditions suitable for settling, living, or acting; mahd and mihad denote a cradle, bed, or prepared place." data-context="Hell’s bed or place, within the expression of blame: what an evil bed." data-learn-more="/quran-terminology/en/roots/m-h2-d/">المِهادُ</button>
  </p>
  <p class="english-verse">When he is told: Be mindful of The God, pride drives him into sin. Hell is sufficient for him—what an evil resting place!</p>
</section>
