<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muminun 23:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَخَذَتهُمُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">فَأَخَذَتهُمُ</button>
    <button class="word-link" type="button" data-word="الصَّيحَةُ" data-root="SAD Y H" data-root-note="Root study coming soon.">الصَّيحَةُ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="فَجَعَلنٰهُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">فَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="غُثاءً" data-root="GH TH W" data-root-meaning="ghuthāʾ, debris and light, weathered remains, particularly what a flood carries or gathers on the water’s surface; in its botanical use, vegetation reduced to debris after drying and losing its freshness." data-learn-more="/quran-terminology/en/roots/gh-th-w/">غُثاءً</button>
    ۚ
    <button class="word-link" type="button" data-word="فَبُعدًا" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">فَبُعدًا</button>
    <button class="word-link" type="button" data-word="لِلقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">لِلقَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">The cry seized them in truth, and We made them debris. Away with the wrongdoing people!</p>
</section>
