<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muminun 23:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say, an instruction to utter the prayer.">وَقُل</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord, the prayer’s address.">رَبِّ</button>
    <button class="word-link" type="button" data-word="أَنزِلنى" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Cause me to descend, a request for a landing.">أَنزِلنى</button>
    <button class="word-link" type="button" data-word="مُنزَلًا" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="A descent or landing place.">مُنزَلًا</button>
    <button class="word-link" type="button" data-word="مُبارَكًا" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="A descent or landing place accompanied by good and blessing, describing munzal." data-learn-more="/quran-terminology/en/roots/b-r-k/">مُبارَكًا</button>
    <button class="word-link" type="button" data-word="وَأَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتَ</button>
    <button class="word-link" type="button" data-word="خَيرُ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Best, qualifying those who cause descent.">خَيرُ</button>
    <button class="word-link" type="button" data-word="المُنزِلينَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Those who cause descent, at the prayer’s close.">المُنزِلينَ</button>
  </p>
  <p class="english-verse">And say: my Lord, let me land at a blessed landing place. You are the best of those who bring to land.</p>
