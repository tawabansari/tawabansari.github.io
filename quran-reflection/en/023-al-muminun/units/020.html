  <h2 class="ayah-title">Al-Muminun 23:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَشَجَرَةً" data-root="SH J R" data-learn-more="/quran-terminology/en/roots/sh-j-r/" data-root-meaning="Branching, ramification, interweaving, and complex extension from a single origin">وَشَجَرَةً</button>

  <p class="english-verse">and a tree growing from Mount Sinai, yielding oil and a relish for those who eat.</p>
