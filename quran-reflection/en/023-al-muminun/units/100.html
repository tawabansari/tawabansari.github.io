<section class="ayah-block" id="ayah-100" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muminun 23:100</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَعَلّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلّى</button>
    <button class="word-link" type="button" data-word="أَعمَلُ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="That I might do something; spoken by the person asking to return to life.">أَعمَلُ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="A righteous, fitting deed that the speaker wishes to perform upon returning.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيما</button>
    <button class="word-link" type="button" data-word="تَرَكتُ" data-root="T R K" data-learn-more="/quran-terminology/en/roots/t-r-k/" data-root-meaning="Leaving, abandoning, letting go, leaving something behind, and changing one’s active relation to it" data-context="What I left behind or neglected in my previous life.">تَرَكتُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَلّا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّها" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّها</button>
    <button class="word-link" type="button" data-word="كَلِمَةٌ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="An utterance he speaks, referring to his request to return.">كَلِمَةٌ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="قائِلُها" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="The one speaking that utterance; he voices the request.">قائِلُها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="وَرائِهِم" data-root="W R Y" data-learn-more="/quran-terminology/en/roots/w-r-y/" data-root-meaning="Covering and concealment; in another branch, kindling fire. Wara denotes the far side or beyond, with its derivational relationship disputed." data-context="Beyond them; in this context, the barrier lies before them and blocks return.">وَرائِهِم</button>
    <button class="word-link" type="button" data-word="بَرزَخٌ" data-root="B R Z KH" data-root-meaning="A limit, interval, or barrier between things or conditions; its nature and whether passage is possible depend on context." data-context="A barrier beyond them until resurrection; in context, preventing return to the previous life." data-learn-more="/quran-terminology/en/roots/b-r-z-kh/" data-root-note="Consonants used to index the word; its historical derivation and possible borrowing remain disputed.">بَرزَخٌ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day of resurrection, marking the end of the stated interval.">يَومِ</button>
    <button class="word-link" type="button" data-word="يُبعَثونَ" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task." data-context="They are raised; a passive verb referring to their resurrection.">يُبعَثونَ</button>
  </p>
  <p class="english-verse">so that I may do righteousness in what I left behind. No! It is only a word he speaks. Behind them is a barrier until the day they are raised.</p>
</section>
