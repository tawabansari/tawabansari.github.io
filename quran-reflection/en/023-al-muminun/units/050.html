<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muminun 23:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنَا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We made or appointed.">وَجَعَلنَا</button>
    <button class="word-link" type="button" data-word="ابنَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="Son, expressing the relationship to Mary.">ابنَ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="Proper name; no root has been assigned.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="وَأُمَّهُ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="And his mother, Mary.">وَأُمَّهُ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="A sign, describing Mary’s son and his mother.">ءايَةً</button>
    <button class="word-link" type="button" data-word="وَءاوَينٰهُما" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="Receiving and lodging another, or providing shelter and a place for them." data-context="We lodged the two, Mary’s son and his mother, on elevated ground.">وَءاوَينٰهُما</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبوَةٍ" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level" data-context="Elevated ground or a high place.">رَبوَةٍ</button>
    <button class="word-link" type="button" data-word="ذاتِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذاتِ</button>
    <button class="word-link" type="button" data-word="قَرارٍ" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness." data-context="A place to settle or remain.">قَرارٍ</button>
    <button class="word-link" type="button" data-word="وَمَعينٍ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="And flowing, accessible water.">وَمَعينٍ</button>
  </p>
  <p class="english-verse">We made the son of Mary and his mother a sign, and sheltered them on a height with a resting place and flowing water.</p>
</section>
