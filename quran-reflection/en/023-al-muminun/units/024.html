    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>

    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>

    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>

    <button class="word-link" type="button" data-word="ءابائِنَا" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations">ءابائِنَا</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome.">الأَوَّلينَ</button>
  </p>
  <p class="english-verse">The chiefs of his people who disbelieved said: this is only a human like you, wanting to gain superiority over you. Had The God willed, He would have sent down angels. We have not heard of this among our earliest fathers.</p>
</section>
