<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muminun 23:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="Livestock, the subject of the verse’s lesson, drink, and benefits.">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="لَعِبرَةً" data-root="AYN B R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-b-r/" data-root-meaning="Crossing from one side to another; learning or interpreting through a sign." data-context="A lesson from which understanding may be gained.">لَعِبرَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="نُسقيكُم" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="We give you to drink from what is within livestock.">نُسقيكُم</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُطونِها" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="The interior of livestock bodies, in the context of providing milk to drink." data-learn-more="/quran-terminology/en/roots/b-tt-n/">بُطونِها</button>
    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَكُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="مَنٰفِعُ" data-root="N F ʿ" data-learn-more="/quran-terminology/en/roots/n-f-ayn/" data-root-meaning="Nafaʿa: benefiting someone and producing a favorable outcome" data-context="Benefits obtained from livestock.">مَنٰفِعُ</button>
    <button class="word-link" type="button" data-word="كَثيرَةٌ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Many, describing the benefits of livestock.">كَثيرَةٌ</button>
    <button class="word-link" type="button" data-word="وَمِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنها</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Eat; obtaining food from livestock.">تَأكُلونَ</button>
  </p>
  <p class="english-verse">In livestock there is indeed a lesson for you. We give you drink from what is in their bellies, you have many benefits in them, and from them you eat.</p>
</section>
