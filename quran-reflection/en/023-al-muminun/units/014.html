  <h2 class="ayah-title">Al-Muminun 23:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="خَلَقنَا" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="We created">خَلَقنَا</button>
    <button class="word-link" type="button" data-word="النُّطفَةَ" data-root="N TT F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-tt-f/" data-root-meaning="A small quantity of liquid; nuṭfah denotes reproductive fluid in creation passages." data-context="the nuṭfah; the initial drop">النُّطفَةَ</button>
    <button class="word-link" type="button" data-word="عَلَقَةً" data-root="AYN L Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-q/" data-root-meaning="Clinging or hanging; ʿalaq and ʿalaqah denote clinging matter or congealed blood in lexical explanations." data-context="an ʿalaqah; a clinging stage">عَلَقَةً</button>
    <button class="word-link" type="button" data-word="فَخَلَقنَا" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="then We created">فَخَلَقنَا</button>
    <button class="word-link" type="button" data-word="العَلَقَةَ" data-root="AYN L Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-q/" data-root-meaning="Clinging or hanging; ʿalaq and ʿalaqah denote clinging matter or congealed blood in lexical explanations." data-context="the ʿalaqah">العَلَقَةَ</button>
    <button class="word-link" type="button" data-word="مُضغَةً" data-root="M DAD GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-dad-gh/" data-root-meaning="Chewing; muḍghah is a small, chewable-sized piece of substance or flesh." data-context="a muḍghah; a chewed-like lump">مُضغَةً</button>
    <button class="word-link" type="button" data-word="فَخَلَقنَا" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="then We created">فَخَلَقنَا</button>
    <button class="word-link" type="button" data-word="المُضغَةَ" data-root="M DAD GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-dad-gh/" data-root-meaning="Chewing; muḍghah is a small, chewable-sized piece of substance or flesh." data-context="the muḍghah">المُضغَةَ</button>
    <button class="word-link" type="button" data-word="عِظٰمًا" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect; also ʿaẓm and ʿiẓām: bone and bones." data-context="bones">عِظٰمًا</button>
    <button class="word-link" type="button" data-word="فَكَسَونَا" data-root="K S W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-s-w/" data-root-meaning="Clothing or providing garments; more broadly, covering something, including clothing bones with flesh." data-context="then We clothed">فَكَسَونَا</button>
    <button class="word-link" type="button" data-word="العِظٰمَ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect; also ʿaẓm and ʿiẓām: bone and bones." data-context="the bones">العِظٰمَ</button>
    <button class="word-link" type="button" data-word="لَحمًا" data-root="L H M" data-root-meaning="Flesh or meat, the body’s fleshy tissue; laḥm is singular and luḥūm plural. Its use as food and other roles follow from context." data-learn-more="/quran-terminology/en/roots/l-h-m/" data-context="with flesh">لَحمًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَنشَأنٰهُ" data-root="N SH A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-a/" data-root-meaning="Originating, growing, or nurturing." data-context="We brought him forth">أَنشَأنٰهُ</button>
    <button class="word-link" type="button" data-word="خَلقًا" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="a creation">خَلقًا</button>
    <button class="word-link" type="button" data-word="ءاخَرَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="another">ءاخَرَ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَتَبارَكَ" data-root="B R K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-r-k/" data-root-meaning="Stability and continuance; barakah: enduring, abundant good; mubārak: endowed with such good." data-context="blessed and exalted, then, is He">فَتَبارَكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="the best">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="الخٰلِقينَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="of creators">الخٰلِقينَ</button>
  </p>
  <p class="english-verse">Then We made the drop a clinging thing, then made the clinging thing a lump of flesh, then made the lump of flesh bones, then clothed the bones with flesh. Then We brought him forth as another creation. Blessed is The God, the best of creators.</p>
</section>
