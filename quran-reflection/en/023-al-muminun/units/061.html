  <h2 class="ayah-title">Al-Muminun 23:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>

    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>

  </p>
  <p class="english-verse">those hasten in good deeds and are foremost in them.</p>
