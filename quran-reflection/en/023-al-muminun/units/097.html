<section class="ayah-block" id="ayah-097" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muminun 23:97</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقُل</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّ</button>
    <button class="word-link" type="button" data-word="أَعوذُ" data-root="AYN W DH (ʿ W DH)" data-learn-more="/quran-terminology/en/roots/ayn-w-dh/" data-root-meaning="Seeking refuge, taking shelter, turning toward a safe place, and coming under its protection.">أَعوذُ</button>
    <button class="word-link" type="button" data-word="بِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="هَمَزٰتِ" data-root="H2 M Z" data-root-meaning="In physical usage, hamz concerns applying pressure, a prick, or a blow; in human behaviour it denotes injurious faultfinding and taunting; and in “the hamazāt of devils” it concerns incitements and pressures from which a person seeks refuge in The God." data-learn-more="/quran-terminology/en/roots/h2-m-z/">هَمَزٰتِ</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينِ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">الشَّيٰطينِ</button>
  </p>
  <p class="english-verse">And say: my Lord, I seek refuge in You from the incitements of the devils,</p>
