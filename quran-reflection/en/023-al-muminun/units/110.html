  <h2 class="ayah-title">Al-Muminun 23:110</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاتَّخَذتُموهُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">فَاتَّخَذتُموهُم</button>
    <button class="word-link" type="button" data-word="سِخرِيًّا" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/">سِخرِيًّا</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="أَنسَوكُم" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">أَنسَوكُم</button>
    <button class="word-link" type="button" data-word="ذِكرى" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">ذِكرى</button>
    <button class="word-link" type="button" data-word="وَكُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكُنتُم</button>

    <button class="word-link" type="button" data-word="تَضحَكونَ" data-root="DAD H K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-h-k/" data-root-meaning="Laughing or showing joy.">تَضحَكونَ</button>
  </p>
  <p class="english-verse">You took them in mockery until they made you forget My remembrance, and you used to laugh at them.</p>
