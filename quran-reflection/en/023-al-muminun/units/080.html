<section class="ayah-block" id="ayah-080" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muminun 23:80</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُحيۦ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">يُحيۦ</button>
    <button class="word-link" type="button" data-word="وَيُميتُ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">وَيُميتُ</button>
    <button class="word-link" type="button" data-word="وَلَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُ</button>

    <button class="word-link" type="button" data-word="تَعقِلونَ" data-root="ʿ Q L (Ayn Q L)" data-learn-more="/quran-terminology/en/roots/ayn-q-l/" data-root-meaning="Tying, restraining, understanding, connecting meaning, and holding judgment back from scattering">تَعقِلونَ</button>

  <p class="english-verse">He is the One who gives life and causes death, and to Him belongs the alternation of night and day. Will you not reason?</p>
