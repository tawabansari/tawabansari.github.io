<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And say: introducing the objection.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieve: describing the objectors.">كَفَروا</button>
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="نُزِّلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Was sent down: the demand for a single descent.">نُزِّلَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="القُرءانُ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text discussed in the demand for a single descent." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانُ</button>
    <button class="word-link" type="button" data-word="جُملَةً" data-root="J M L" data-root-meaning="Beauty and goodness; in another branch, a whole and largeness; jamal names the camel." data-context="All together: the demanded manner of revelation." data-learn-more="/quran-terminology/en/roots/j-m-l/">جُملَةً</button>
    <button class="word-link" type="button" data-word="وٰحِدَةً" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="One: qualifying the single whole.">وٰحِدَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لِنُثَبِّتَ" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="So that We may strengthen: the purpose concerning the heart." data-learn-more="/quran-terminology/en/roots/th-b-t/">لِنُثَبِّتَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="فُؤادَكَ" data-root="F A D" data-root-meaning="“heart” is the most appropriate basic equivalent for fuʾād: a heart that Qur’anic usage can connect with reception, understanding, inclination, responsiveness, and steadfastness." data-learn-more="/quran-terminology/en/roots/f-a-d/" data-context="Your heart: what is strengthened.">فُؤادَكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَرَتَّلنٰهُ" data-root="R T L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-t-l/" data-root-meaning="Articulating in an orderly, clear, measured manner." data-context="And We articulated it in order: the measured presentation of the Qur’an.">وَرَتَّلنٰهُ</button>
    <button class="word-link" type="button" data-word="تَرتيلًا" data-root="R T L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-t-l/" data-root-meaning="Articulating in an orderly, clear, measured manner." data-context="Measured articulation: emphasizing orderly delivery.">تَرتيلًا</button>
  </p>
  <p class="english-verse">Those who disbelieved said: why was the Qur’an not sent down upon him all at once? Thus, so that We may strengthen your heart with it, and We recited it in measured sequence.</p>
</section>
