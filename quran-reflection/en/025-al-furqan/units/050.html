  <h2 class="ayah-title">Al-Furqan 25:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="صَرَّفنٰهُ" data-root="SAD R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-f/" data-root-meaning="Turning or changing; taṣrīf denotes varying, directing, or presenting in different ways.">صَرَّفنٰهُ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَهُم</button>
    <button class="word-link" type="button" data-word="لِيَذَّكَّروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">لِيَذَّكَّروا</button>
    <button class="word-link" type="button" data-word="فَأَبىٰ" data-root="A B Y" data-learn-more="/quran-terminology/en/roots/a-b-y/" data-root-meaning="Refusing, declining, or withholding acceptance; the motive and moral value depend on the object, subject, and context.">فَأَبىٰ</button>
    <button class="word-link" type="button" data-word="أَكثَرُ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">أَكثَرُ</button>

    <button class="word-link" type="button" data-word="كُفورًا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كُفورًا</button>
  </p>
  <p class="english-verse">We have certainly distributed it among them so that they may remember, yet most people refuse anything but ingratitude.</p>
