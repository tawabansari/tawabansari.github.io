<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day">يَومَ</button>
    <button class="word-link" type="button" data-word="يَرَونَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="They see">يَرَونَ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="The angels">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="بُشرىٰ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="Good news; negated here, no good news">بُشرىٰ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="لِلمُجرِمينَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="Wrongdoers; those who commit wrongful acts" data-learn-more="/quran-terminology/en/roots/j-r-m/">لِلمُجرِمينَ</button>
    <button class="word-link" type="button" data-word="وَيَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they say">وَيَقولونَ</button>
    <button class="word-link" type="button" data-word="حِجرًا" data-root="Ḥ J R (H J R)" data-learn-more="/quran-terminology/en/roots/h-j-r/" data-root-meaning="Stone, hardness, enclosure, prohibition, firm boundary, and restraint" data-context="Forbidden">حِجرًا</button>
    <button class="word-link" type="button" data-word="مَحجورًا" data-root="Ḥ J R (H J R)" data-learn-more="/quran-terminology/en/roots/h-j-r/" data-root-meaning="Stone, hardness, enclosure, prohibition, firm boundary, and restraint" data-context="Utterly forbidden">مَحجورًا</button>
  </p>
  <p class="english-verse">On the day they see the angels, there will be no good news that day for the guilty, and they will say: forbidden, utterly forbidden!</p>
</section>
