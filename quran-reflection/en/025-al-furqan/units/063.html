<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:63</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعِبادُ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="And the servants; those of the Entirely Merciful described by these behaviors.">وَعِبادُ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="The Entirely Merciful; the divine name to which the servants are related in this construction.">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَمشونَ" data-root="M SH Y" data-learn-more="/quran-terminology/en/roots/m-sh-y/" data-root-meaning="Walking, stepping, moving upon the earth; and more broadly, moving forward in a path, manner, behavior, or way of life" data-context="They walk; describing their manner of moving upon the earth.">يَمشونَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; where the servants walk.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="هَونًا" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status" data-context="With ease and humility; describing the manner of walking here.">هَونًا</button>
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="خاطَبَهُمُ" data-root="KH TT B" data-root-meaning="Speaking to an addressee and raising or pursuing a matter; in other uses, an affair or occurrence, and requesting marriage." data-context="They addressed them; the ignorant speaking to the servants of the Entirely Merciful." data-learn-more="/quran-terminology/en/roots/kh-tt-b/">خاطَبَهُمُ</button>
    <button class="word-link" type="button" data-word="الجٰهِلونَ" data-root="J H L" data-learn-more="/quran-terminology/en/roots/j-h2-l/" data-root-meaning="Ignorance and unawareness; also rashness and unmeasured conduct arising from lack of knowledge, forbearance, or settled calm." data-context="The ignorant; those who address the servants of the Entirely Merciful.">الجٰهِلونَ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They say; the servants’ response to the ignorant addressing them.">قالوا</button>
    <button class="word-link" type="button" data-word="سَلٰمًا" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Peace; a peaceful utterance in response to the ignorant.">سَلٰمًا</button>
  </p>
  <p class="english-verse">The servants of the Entirely Merciful are those who walk gently upon the earth and, when the ignorant address them, say: peace.</p>
</section>
