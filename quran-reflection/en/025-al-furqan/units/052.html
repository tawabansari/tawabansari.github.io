<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:52</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تُطِعِ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="Obey; the compliance prohibited by lā.">تُطِعِ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Those who deny; opponents whom he must not obey.">الكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="وَجٰهِدهُم" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="And strive against them; exert effort through the means referred to by bihi." data-learn-more="/quran-terminology/en/roots/j-h2-d/">وَجٰهِدهُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="جِهادًا" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="Serious striving; an emphatic verbal noun whose greatness is expressed by kabīran." data-learn-more="/quran-terminology/en/roots/j-h2-d/">جِهادًا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Great; describing the striving through the divine message.">كَبيرًا</button>
  </p>
  <p class="english-verse">Do not obey the disbelievers, and strive against them with it in a great striving.</p>
