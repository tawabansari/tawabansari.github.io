  <h2 class="ayah-title">Al-Furqan 25:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰوَيلَتىٰ" data-root="W Y L" data-learn-more="/quran-terminology/en/roots/w-y-l/" data-root-meaning="From Cries of Grief and Warning to the Announcement of a Dire Outcome" data-context="Alas for me, a cry of regret and remorse.">يٰوَيلَتىٰ</button>
    <button class="word-link" type="button" data-word="لَيتَنى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَيتَنى</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="أَتَّخِذ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Taken, negated here in the wish not to have befriended so-and-so.">أَتَّخِذ</button>

  <p class="english-verse">Woe to me! If only I had not taken so-and-so as a close friend!</p>
