<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="It is said; introducing the invitation addressed to them.">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="اسجُدوا" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Prostrate; the invitation to prostrate to al-Raḥmān.">اسجُدوا</button>
    <button class="word-link" type="button" data-word="لِلرَّحمٰنِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="To al-Raḥmān; the One to whom they are invited to prostrate.">لِلرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said; their response to the invitation to prostrate.">قالوا</button>
    <button class="word-link" type="button" data-word="وَمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَا</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Al-Raḥmān; the name questioned in their response.">الرَّحمٰنُ</button>
    <button class="word-link" type="button" data-word="أَنَسجُدُ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Shall we prostrate; their challenging question about prostration.">أَنَسجُدُ</button>
    <button class="word-link" type="button" data-word="لِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِما</button>

    <button class="word-link" type="button" data-word="وَزادَهُم" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="And it increased them; increasing their aversion.">وَزادَهُم</button>
    <button class="word-link" type="button" data-word="نُفورًا" data-root="N F R" data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Moving away, withdrawing and setting out; bolting and turning away. In nominal uses, a group of companions or supporters." data-context="Turning away; their increased withdrawal in response to the call to prostrate.">نُفورًا</button>
    ۩
  </p>
  <p class="english-verse">When they are told to prostrate to the Entirely Merciful, they say: what is the Entirely Merciful? Shall we prostrate to what you command us? It increases their aversion.</p>
</section>
