  <h2 class="ayah-title">Al-Furqan 25:72</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَشهَدونَ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="They bear witness or attend; their doing so in relation to falsehood is denied.">يَشهَدونَ</button>
    <button class="word-link" type="button" data-word="الزّورَ" data-root="Z W R" data-learn-more="/quran-terminology/en/roots/z-w-r/" data-root-meaning="Inclining and changing direction; visiting; in speech, falsehood and departure from truth." data-context="Falsehood; what they do not bear witness to or attend.">الزّورَ</button>
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="مَرّوا" data-root="M R R" data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing and elapsing; one time or occasion; in other branches, bitterness and unpleasantness, strength and firmness." data-context="They pass by idle speech or conduct.">مَرّوا</button>

    <button class="word-link" type="button" data-word="مَرّوا" data-root="M R R" data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing and elapsing; one time or occasion; in other branches, bitterness and unpleasantness, strength and firmness." data-context="They pass; the repeated verb introduces how they pass by.">مَرّوا</button>
    <button class="word-link" type="button" data-word="كِرامًا" data-root="K R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-m/" data-root-meaning="Nobility, honor, or generosity." data-context="With dignity, describing their manner of passing by idle speech or conduct.">كِرامًا</button>
  </p>
  <p class="english-verse">Those who do not witness falsehood and, when they pass by idle talk, pass with dignity,</p>
