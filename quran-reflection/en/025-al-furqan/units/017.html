<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يَحشُرُهُم" data-root="H SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sh-r/" data-root-meaning="Gathering and driving people or creatures together from their places.">يَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَعبُدونَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">يَعبُدونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="ءَأَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">ءَأَنتُم</button>
    <button class="word-link" type="button" data-word="أَضلَلتُم" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">أَضلَلتُم</button>
    <button class="word-link" type="button" data-word="عِبادى" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">عِبادى</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="ضَلُّوا" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">ضَلُّوا</button>
    <button class="word-link" type="button" data-word="السَّبيلَ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">السَّبيلَ</button>
  </p>
  <p class="english-verse">On the day He gathers them and what they worship apart from The God, He will say: did you mislead these servants of Mine, or did they themselves stray from the way?</p>
</section>
