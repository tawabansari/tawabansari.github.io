<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="قَبلَكَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">المُرسَلينَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَيَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption">لَيَأكُلونَ</button>
    <button class="word-link" type="button" data-word="الطَّعامَ" data-root="Ṭ AYN M (Ṭ ʿ M)" data-learn-more="/quran-terminology/en/roots/tt-ayn-m/" data-root-meaning="Tasting, eating, food, feeding, and real access to nourishment">الطَّعامَ</button>
    <button class="word-link" type="button" data-word="وَيَمشونَ" data-root="M SH Y" data-learn-more="/quran-terminology/en/roots/m-sh-y/" data-root-meaning="Walking, stepping, moving upon the earth; and more broadly, moving forward in a path, manner, behavior, or way of life">وَيَمشونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَسواقِ" data-root="S W Q" data-root-note="Root study coming soon.">الأَسواقِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="بَعضَكُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضَكُم</button>
    <button class="word-link" type="button" data-word="لِبَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">لِبَعضٍ</button>
    <button class="word-link" type="button" data-word="فِتنَةً" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction">فِتنَةً</button>
    <button class="word-link" type="button" data-word="أَتَصبِرونَ" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">أَتَصبِرونَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكانَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="بَصيرًا" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">بَصيرًا</button>
  </p>
  <p class="english-verse">We sent no messengers before you but that they ate food and walked in the markets. We made some of you a trial for others. Will you be patient? Your Lord is seeing.</p>
</section>
