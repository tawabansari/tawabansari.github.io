<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:59</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="He created; bringing the stated creation into existence.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; the domain mentioned in the verse.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; an object of creation.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between the two mentioned in the verse.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سِتَّةِ" data-root="S D S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-d-s/" data-root-meaning="One-sixth and sixth." data-context="Six; the number of days mentioned.">سِتَّةِ</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Days; the units of creation’s time in the expression.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="استَوىٰ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="He established Himself; upon the Throne in the creation context.">استَوىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="العَرشِ" data-root="AYN R SH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-sh/" data-root-meaning="A roof or raised structure; ʿarsh is a throne or seat of sovereignty." data-context="The Throne; in the expression of establishment.">العَرشِ</button>
    ۚ
    <button class="word-link" type="button" data-word="الرَّحمٰنُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="The Entirely Merciful; describing The God in the verse.">الرَّحمٰنُ</button>
    <button class="word-link" type="button" data-word="فَسـَٔل" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="Then ask; consulting one who knows in the debated construction.">فَسـَٔل</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="One who knows; in the asking construction, with differing interpretations of its referent." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرًا</button>
  </p>
  <p class="english-verse">the One who created the heavens, the earth, and what is between them in six days, then established Himself upon the throne—the Entirely Merciful. Ask about Him one who knows.</p>
</section>
