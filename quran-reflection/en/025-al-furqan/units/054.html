<section class="ayah-block" id="ayah-054" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:54</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Created; bringing a human being into existence from water">خَلَقَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الماءِ" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Water; what the verse names as the source of human creation">الماءِ</button>
    <button class="word-link" type="button" data-word="بَشَرًا" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="A human being; the creature given family relationships">بَشَرًا</button>
    <button class="word-link" type="button" data-word="فَجَعَلَهُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Then made him; describing the establishment of family ties">فَجَعَلَهُ</button>
    <button class="word-link" type="button" data-word="نَسَبًا" data-root="N S B" data-learn-more="/quran-terminology/en/roots/n-s-b/" data-root-meaning="Kinship through birth and descent; more broadly, attributing a person or thing to its origin or owner." data-context="Ties of descent; kinship through birth and lineage">نَسَبًا</button>
    <button class="word-link" type="button" data-word="وَصِهرًا" data-root="Ṣ H R" data-learn-more="/quran-terminology/en/roots/sad-h2-r/" data-root-meaning="Kinship and family connection through marriage; in another branch, melting or liquefying something through heat." data-context="And kinship through marriage; alongside descent">وَصِهرًا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And is; expressing the Lord’s abiding description">وَكانَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; within the verse’s address">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="قَديرًا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Powerful; describing the Lord’s ability">قَديرًا</button>
  </p>
  <p class="english-verse">He is the One who created a human from water and gave him kinship by descent and by marriage. Your Lord is powerful.</p>
</section>
