<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said; reporting the opponents’ speech without endorsing it.">وَقالوا</button>
    <button class="word-link" type="button" data-word="أَسٰطيرُ" data-root="S TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-tt-r/" data-root-meaning="A line and writing; asāṭīr denotes transmitted tales; muṣayṭir means a controller or overseer." data-context="Stories or tales; the opponents’ designation for what the Prophet brings.">أَسٰطيرُ</button>
    <button class="word-link" type="button" data-word="الأَوَّلينَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="The ancients; earlier people to whom the stories are attributed.">الأَوَّلينَ</button>
    <button class="word-link" type="button" data-word="اكتَتَبَها" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="He has procured or had them written; part of the reported accusation.">اكتَتَبَها</button>
    <button class="word-link" type="button" data-word="فَهِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهِىَ</button>
    <button class="word-link" type="button" data-word="تُملىٰ" data-root="M L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-l-w/" data-root-meaning="An extended time or respite; imlāʾ means granting time or extension." data-context="Are dictated or read out; a passive verb within the opponents’ allegation.">تُملىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="B K R" data-learn-more="/quran-terminology/en/roots/b-k-r/" data-root-meaning="From the beginning of the day and coming early to remaining in the first stage." data-context="Morning; one of the alleged times of dictation.">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَأَصيلًا" data-root="A SAD L" data-learn-more="/quran-terminology/en/roots/a-sad-l/" data-root-meaning="a thing’s root or foundation, and late afternoon as a particular part of the day." data-context="And late afternoon approaching sunset; the other time of dictation in the opponents’ claim.">وَأَصيلًا</button>
  </p>
  <p class="english-verse">They said: tales of the earlier peoples that he has had written down, dictated to him morning and evening.</p>
</section>
