<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَقَومَ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="Proper name; no root has been assigned.">نوحٍ</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمّا</button>
    <button class="word-link" type="button" data-word="كَذَّبُوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">كَذَّبُوا</button>
    <button class="word-link" type="button" data-word="الرُّسُلَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرُّسُلَ</button>
    <button class="word-link" type="button" data-word="أَغرَقنٰهُم" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water">أَغرَقنٰهُم</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰهُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">وَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَعتَدنا" data-root="AYN T D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-t-d/" data-root-meaning="Preparing or being ready and present.">وَأَعتَدنا</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being">أَليمًا</button>
  </p>
  <p class="english-verse">The people of Noah, when they denied the messengers, We drowned them and made them a sign for people. We have prepared a painful punishment for the wrongdoers.</p>
</section>
