<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَبارَكَ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="Great and abounding in blessing is the One who revealed the Criterion; an expression of praise." data-learn-more="/quran-terminology/en/roots/b-r-k/">تَبارَكَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="نَزَّلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Sent down, referring to the Criterion.">نَزَّلَ</button>
    <button class="word-link" type="button" data-word="الفُرقانَ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="The Criterion, that which distinguishes truth from falsehood.">الفُرقانَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="عَبدِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="His servant, the recipient of the Criterion.">عَبدِهِ</button>
    <button class="word-link" type="button" data-word="لِيَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="So that he may be, expressing the purpose.">لِيَكونَ</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="For all peoples, the recipients of warning.">لِلعٰلَمينَ</button>
    <button class="word-link" type="button" data-word="نَذيرًا" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="A warner, the stated role.">نَذيرًا</button>
  </p>
  <p class="english-verse">Blessed is the One who sent down the Criterion upon His servant, so that he may be a warner to the worlds,</p>
</section>
