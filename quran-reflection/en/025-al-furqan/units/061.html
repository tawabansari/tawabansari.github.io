<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَبارَكَ" data-root="B R K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-r-k/" data-root-meaning="Stability and continuance; barakah: enduring, abundant good; mubārak: endowed with such good." data-context="Abundant in blessing and enduring good; describing the One who ordered the sky.">تَبارَكَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Placed in the sky; referring to celestial buruj.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky, the setting of the buruj, lamp, and moon in this statement.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="بُروجًا" data-root="B R J" data-root-meaning="Prominence and visibility; burj, a high protected structure or celestial station; tabarruj, display and making adornment and beauty visible." data-learn-more="/quran-terminology/en/roots/b-r-j/" data-context="Celestial buruj, stations or prominent features mentioned alongside the lamp and moon.">بُروجًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And placed within it; referring to the lamp and illuminating moon.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="سِرٰجًا" data-root="S R J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-j/" data-root-meaning="A lamp or source of light." data-context="A light-giving lamp, connected with the sun in this context.">سِرٰجًا</button>
    <button class="word-link" type="button" data-word="وَقَمَرًا" data-root="Q M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-r/" data-root-meaning="The moon." data-context="And a moon, the celestial body mentioned alongside the lamp.">وَقَمَرًا</button>
    <button class="word-link" type="button" data-word="مُنيرًا" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="Illuminating and giving light; describing the moon.">مُنيرًا</button>
  </p>
  <p class="english-verse">Blessed is the One who placed constellations in the sky and placed in it a lamp and an illuminating moon.</p>
