<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Furqan 25:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="أُلقوا" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-context="They are cast into a confined place within the fire." data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter Ilqāʾ denotes casting, placing, or conveying something.">أُلقوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنها</button>
    <button class="word-link" type="button" data-word="مَكانًا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="A place within the fire, described as confined.">مَكانًا</button>
    <button class="word-link" type="button" data-word="ضَيِّقًا" data-root="DAD Y Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-y-q/" data-root-meaning="Narrowness, constraint, or causing distress." data-context="Narrow and confined, describing the place into which they are cast.">ضَيِّقًا</button>
    <button class="word-link" type="button" data-word="مُقَرَّنينَ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="While bound or linked together.">مُقَرَّنينَ</button>
    <button class="word-link" type="button" data-word="دَعَوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="They cry out there, calling for destruction.">دَعَوا</button>
    <button class="word-link" type="button" data-word="هُنالِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُنالِكَ</button>
    <button class="word-link" type="button" data-word="ثُبورًا" data-root="TH B R" data-root-meaning="TH B R in its Qur’anic branch denotes destruction, ruin, and a disastrous outcome. Mathbūr describes someone facing that condition; thubūr names the destruction and ruin that become the object of people’s cries and lamentation in the Hereafter passages." data-context="Destruction and ruin, cried out by those cast into that confined place of punishment; the word itself names destruction." data-learn-more="/quran-terminology/en/roots/th-b-r/">ثُبورًا</button>
  </p>
  <p class="english-verse">When they are cast into a narrow place in it, bound together, they will call there for destruction.</p>
</section>
