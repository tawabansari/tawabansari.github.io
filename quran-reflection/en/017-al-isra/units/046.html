<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We placed: establishing the coverings.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Their hearts: where the stated coverings lie.">قُلوبِهِم</button>
    <button class="word-link" type="button" data-word="أَكِنَّةً" data-root="K N N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-n/" data-root-meaning="Covering or sheltering securely." data-context="Coverings: barriers to understanding the message.">أَكِنَّةً</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَفقَهوهُ" data-root="F Q H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-h2/" data-root-meaning="Understanding or comprehending speech or a matter." data-context="Understand it: what the coverings impede.">يَفقَهوهُ</button>
    <button class="word-link" type="button" data-word="وَفى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفى</button>
    <button class="word-link" type="button" data-word="ءاذانِهِم" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Their ears: the place of the stated heaviness.">ءاذانِهِم</button>
    <button class="word-link" type="button" data-word="وَقرًا" data-root="W Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-q-r/" data-root-meaning="Heaviness; waqr is impaired hearing; wiqr is a load; tawqīr is honoring." data-context="Heaviness: an impediment to receptive hearing.">وَقرًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="ذَكَرتَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="You mention: speaking of the Lord in the Qur’an.">ذَكَرتَ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord: the one mentioned.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="القُرءانِ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text in which the Lord alone is mentioned." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانِ</button>
    <button class="word-link" type="button" data-word="وَحدَهُ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="Alone: the Lord’s exclusive mention.">وَحدَهُ</button>
    <button class="word-link" type="button" data-word="وَلَّوا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="They turn away: the group’s response.">وَلَّوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَدبٰرِهِم" data-root="D B R" data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back and latter part; turning away and passing; tadbīr, governing affairs; tadabbur, careful reflection on discourse." data-context="Their backs: in the expression of turning away.">أَدبٰرِهِم</button>
    <button class="word-link" type="button" data-word="نُفورًا" data-root="N F R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Setting out; also aversion or fleeing away." data-context="In aversion: describing their withdrawal.">نُفورًا</button>
  </p>
  <p class="english-verse">We have placed coverings over their hearts lest they understand it, and heaviness in their ears. When you mention your Lord alone in the Quran, they turn their backs in aversion.</p>
</section>
