  <h2 class="ayah-title">Al-Isra 17:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَسىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَسىٰ</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَرحَمَكُم" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">يَرحَمَكُم</button>

    <button class="word-link" type="button" data-word="عُدتُم" data-root="AYN W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-d/" data-root-meaning="Returning or repeating; ʿīd is a recurring occasion; ʿĀd is also a people&#x27;s proper name.">عُدتُم</button>
    <button class="word-link" type="button" data-word="عُدنا" data-root="AYN W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-d/" data-root-meaning="Returning or repeating; ʿīd is a recurring occasion; ʿĀd is also a people&#x27;s proper name.">عُدنا</button>

    <button class="word-link" type="button" data-word="حَصيرًا" data-root="H SAD R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sad-r/" data-root-meaning="Restricting, preventing, and confining; ḥaṣūr means self-restrained.">حَصيرًا</button>
  </p>
  <p class="english-verse">Perhaps your Lord will have mercy on you. If you return, We will return. We have made Hell a prison for the disbelievers.</p>
