<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَصفىٰكُم" data-root="Ṣ F W" data-learn-more="/quran-terminology/en/roots/sad-f-w/" data-root-meaning="Clarity and purity, choosing, refinement, and smooth stone" data-context="Has He favored you exclusively? The critical question about sons and angels.">أَفَأَصفىٰكُم</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, the source of relief and mercy.">رَبُّكُم</button>
    <button class="word-link" type="button" data-word="بِالبَنينَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="Sons, in the critical question about claimed preference.">بِالبَنينَ</button>
    <button class="word-link" type="button" data-word="وَاتَّخَذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="And took, within the critical question concerning angels.">وَاتَّخَذَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةِ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="The angels, the subject of claims of feminine naming or female creation.">المَلٰئِكَةِ</button>
    <button class="word-link" type="button" data-word="إِنٰثًا" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="Females: the criticized claim concerning angels and their attribution to The God.">إِنٰثًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="لَتَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="You certainly say: emphasizing the criticized statement.">لَتَقولونَ</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="A statement, described as grave and wrongful.">قَولًا</button>
    <button class="word-link" type="button" data-word="عَظيمًا" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Grave: qualifying the wrongful statement.">عَظيمًا</button>
  </p>
  <p class="english-verse">Has your Lord favored you with sons and taken females from among the angels? Surely you speak a tremendous word.</p>
</section>
