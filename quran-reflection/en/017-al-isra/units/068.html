<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:68</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَمِنتُم" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Do you feel secure; questioning a sense of safety from danger.">أَفَأَمِنتُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَخسِفَ" data-root="KH S F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-s-f/" data-root-meaning="Sinking into the earth; also dimming or eclipsing of the moon." data-context="He causes to sink; the danger of being swallowed by the earth.">يَخسِفَ</button>
    <button class="word-link" type="button" data-word="بِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكُم</button>
    <button class="word-link" type="button" data-word="جانِبَ" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="A part or side of the land; the place where the danger of being swallowed up is mentioned." data-learn-more="/quran-terminology/en/roots/j-n-b/">جانِبَ</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="B R R" data-learn-more="/quran-terminology/en/roots/b-r-r/" data-root-meaning="Expansive goodness, upright conduct, faithfulness, beneficence, openness in good, and standing on firm moral ground." data-context="The land; contrasted with the sea as a setting of danger.">البَرِّ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يُرسِلَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="He sends; the sending of the stated pelting storm.">يُرسِلَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="حاصِبًا" data-root="H SAD B" data-root-meaning="The root’s concrete core concerns gravel, pebbles, and pelting with them; its fire-related branch concerns material cast into a fire and burned. Both branches can be distinguished in Qur’anic usage, and accurate translation requires interpreting each derivative through its own structure and context." data-context="A pelting storm; that which drives stones or gravel upon the addressees." data-learn-more="/quran-terminology/en/roots/h-sad-b/">حاصِبًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَجِدوا" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="You find; finding a protector, denied in the concluding clause.">تَجِدوا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَكيلًا" data-root="W K L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-l/" data-root-meaning="Entrusting or relying; wakīl is an agent or responsible guardian." data-context="Protector; one who could take charge of their affairs and defend them.">وَكيلًا</button>
  </p>
  <p class="english-verse">Do you feel secure that He will not make a tract of land swallow you or send a storm of stones against you, and then you will find no trustee for yourselves?</p>
</section>
