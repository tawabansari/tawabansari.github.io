<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَم</button>
    <button class="word-link" type="button" data-word="أَهلَكنا" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="We destroyed many generations after Noah." data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَهلَكنا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="القُرونِ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="Past generations.">القُرونِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After Noah.">بَعدِ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="Proper name; no root has been assigned.">نوحٍ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="K F Y" data-learn-more="/quran-terminology/en/roots/k-f-y/" data-root-meaning="Sufficiency: meeting a need and handling another’s affairs; The God’s sufficiency in witnessing, reckoning, aid, and protection" data-context="And sufficient is.">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِرَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, in knowing His servants.">بِرَبِّكَ</button>
    <button class="word-link" type="button" data-word="بِذُنوبِ" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share." data-context="Concerning the servants’ sins.">بِذُنوبِ</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="His servants.">عِبادِهِ</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Fully informed of the details." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرًا</button>
    <button class="word-link" type="button" data-word="بَصيرًا" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Seeing their actions.">بَصيرًا</button>
  </p>
  <p class="english-verse">How many generations We destroyed after Noah! Your Lord suffices as One aware of and seeing His servants’ sins.</p>
</section>
