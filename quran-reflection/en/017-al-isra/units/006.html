<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="رَدَدنا" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="We restored; gave the addressees the turn of confrontation and ascendancy again.">رَدَدنا</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الكَرَّةَ" data-root="K R R" data-root-meaning="Returning and repeating a movement, action or condition; karrah denotes one instance of such returning or repetition." data-learn-more="/quran-terminology/en/roots/k-r-r/" data-context="The renewed turn of ascendancy over them; regaining the ability to confront the earlier opponents.">الكَرَّةَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَأَمدَدنٰكُم" data-root="M D D" data-learn-more="/quran-terminology/en/roots/m-d-d/" data-root-meaning="Stretching, extending, continuing, granting respite, adding support, and opening a wider field" data-context="And We reinforced you; supplied additional resources and support.">وَأَمدَدنٰكُم</button>
    <button class="word-link" type="button" data-word="بِأَموٰلٍ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="With wealth; possessions supplied as reinforcement and support.">بِأَموٰلٍ</button>
    <button class="word-link" type="button" data-word="وَبَنينَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole; also son, children and descendants in the family’s lineage sense." data-context="And sons; offspring forming part of their population and strength in this context.">وَبَنينَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰكُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We made you; changed your condition with respect to numbers of people.">وَجَعَلنٰكُم</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="More numerous; greater in manpower than the opposing group.">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="نَفيرًا" data-root="N F R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Setting out; also aversion or fleeing away." data-context="Manpower or mobilized forces; the people who set out for confrontation.">نَفيرًا</button>
  </p>
  <p class="english-verse">Then We restored your turn against them, reinforced you with wealth and sons, and made you greater in number.</p>
</section>
