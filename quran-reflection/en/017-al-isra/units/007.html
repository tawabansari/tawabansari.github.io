<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="أَحسَنتُم" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="If you do good; righteous conduct by those addressed.">أَحسَنتُم</button>
    <button class="word-link" type="button" data-word="أَحسَنتُم" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="You do good; its benefit returns to yourselves.">أَحسَنتُم</button>
    <button class="word-link" type="button" data-word="لِأَنفُسِكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="For yourselves; those who receive the consequences of doing good.">لِأَنفُسِكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَسَأتُم" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="You do evil; wrongdoing whose consequences return to the self.">أَسَأتُم</button>
    <button class="word-link" type="button" data-word="فَلَها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَها</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Comes; referring to the promise of the later occasion.">جاءَ</button>
    <button class="word-link" type="button" data-word="وَعدُ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="Promise; the announced time of the event.">وَعدُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The later occasion; contrasted with the first in the context.">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="لِيَسـۥـٔوا" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="To distress and humiliate; referring to the faces of those addressed.">لِيَسـۥـٔوا</button>
    <button class="word-link" type="button" data-word="وُجوهَكُم" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh" data-context="Your faces; where distress and humiliation become visible.">وُجوهَكُم</button>
    <button class="word-link" type="button" data-word="وَلِيَدخُلُوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="And to enter; the sanctuary.">وَلِيَدخُلُوا</button>
    <button class="word-link" type="button" data-word="المَسجِدَ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="The sanctuary; the place entered.">المَسجِدَ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَما</button>
    <button class="word-link" type="button" data-word="دَخَلوهُ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="They entered it; on the first occasion.">دَخَلوهُ</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="First; identifying the earlier entry.">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="M R R" data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing and elapsing; one time or occasion; in other branches, bitterness and unpleasantness, strength and firmness." data-context="Time; in “the first time,” referring to the earlier entry into the sanctuary.">مَرَّةٍ</button>
    <button class="word-link" type="button" data-word="وَلِيُتَبِّروا" data-root="T B R" data-learn-more="/quran-terminology/en/roots/t-b-r/" data-root-meaning="Breaking apart and eliminating a body or order so that it loses the ability to continue in its previous form." data-context="And to destroy; what they gained power over.">وَلِيُتَبِّروا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عَلَوا" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting." data-context="They gained power over; specifying the scope of destruction.">عَلَوا</button>
    <button class="word-link" type="button" data-word="تَتبيرًا" data-root="T B R" data-learn-more="/quran-terminology/en/roots/t-b-r/" data-root-meaning="Breaking apart and eliminating a body or order so that it loses the ability to continue in its previous form." data-context="Utter destruction; emphasizing the act of destroying.">تَتبيرًا</button>
  </p>
  <p class="english-verse">If you do good, you do good for yourselves; if you do evil, it is against yourselves. When the latter promise came, that they might bring sorrow to your faces, enter the mosque as they entered it the first time, and utterly destroy whatever they overcame.</p>
</section>
