<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاخفِض" data-root="KH F DAD" data-learn-more="/quran-terminology/en/roots/kh-f-dad/" data-root-meaning="Lowering and bringing down; in “lowering the wing,” humility and gentleness in conduct." data-context="Lower the wing of humility to both parents out of mercy.">وَاخفِض</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُما</button>
    <button class="word-link" type="button" data-word="جَناحَ" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/" data-context="The wing, in the image of the wing of humility.">جَناحَ</button>
    <button class="word-link" type="button" data-word="الذُّلِّ" data-root="DH L L" data-learn-more="/quran-terminology/en/roots/dh-l-l/" data-root-meaning="Being tamed, made accessible, humbled, or lowered from honor." data-context="Humility toward both parents, arising from mercy.">الذُّلِّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الرَّحمَةِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Mercy and kindness, the source of humble conduct.">الرَّحمَةِ</button>
    <button class="word-link" type="button" data-word="وَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And say; a command to pray for both parents.">وَقُل</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord; the address in the prayer.">رَبِّ</button>
    <button class="word-link" type="button" data-word="ارحَمهُما" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Have mercy on them both; a prayer for the parents.">ارحَمهُما</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَما</button>
    <button class="word-link" type="button" data-word="رَبَّيانى" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level" data-context="They both raised and nurtured me.">رَبَّيانى</button>
    <button class="word-link" type="button" data-word="صَغيرًا" data-root="SAD GH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-gh-r/" data-root-meaning="Smallness; ṣaghār denotes humiliation or subjection." data-context="When I was small, as a child.">صَغيرًا</button>
  </p>
  <p class="english-verse">Lower to them the wing of humility out of mercy, and say, “My Lord, have mercy on them as they raised me when I was small.”</p>
</section>
