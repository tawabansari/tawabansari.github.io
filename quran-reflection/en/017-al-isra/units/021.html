<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="انظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Look; directing attention to differing positions.">انظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="فَضَّلنا" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="We favored; describing differences among people.">فَضَّلنا</button>
    <button class="word-link" type="button" data-word="بَعضَهُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Some of them; one side of the comparison.">بَعضَهُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Others; the other side of the comparison.">بَعضٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَلـٔاخِرَةُ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="And the hereafter; where degrees are described as greater.">وَلَلـٔاخِرَةُ</button>
    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Greater; concerning otherworldly degrees.">أَكبَرُ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="D R J" data-learn-more="/quran-terminology/en/roots/d-r-j/" data-root-meaning="Stepwise movement and passage; steps and rank; istidrāj: progressively leading onward." data-context="Degrees; otherworldly ranks described as greater.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="وَأَكبَرُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="And greater; concerning preference in the hereafter.">وَأَكبَرُ</button>
    <button class="word-link" type="button" data-word="تَفضيلًا" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="Preference; the difference of standing in the comparison.">تَفضيلًا</button>
  </p>
  <p class="english-verse">Look how We have favored some over others. The Hereafter is greater in degrees and greater in distinction.</p>
</section>
