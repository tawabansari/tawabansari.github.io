  <h2 class="ayah-title">Al-Isra 17:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قَرَأتَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="You recite: reading the Qur’an to the audience." data-learn-more="/quran-terminology/en/roots/q-r-a/">قَرَأتَ</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text being recited in the verse’s condition." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="We place: establishing the stated barrier.">جَعَلنا</button>

    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>

    <button class="word-link" type="button" data-word="بِالـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="In the hereafter: the object of the denied belief.">بِالـٔاخِرَةِ</button>

    <button class="word-link" type="button" data-word="مَستورًا" data-root="S T R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-t-r/" data-root-meaning="Covering or concealing from view." data-context="Concealed: describing the barrier.">مَستورًا</button>

  <p class="english-verse">When you recite the Quran, We place a concealed barrier between you and those who do not believe in the Hereafter.</p>
