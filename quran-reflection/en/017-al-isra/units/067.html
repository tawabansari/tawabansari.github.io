  <h2 class="ayah-title">Al-Isra 17:67</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="مَسَّكُمُ" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy">مَسَّكُمُ</button>
    <button class="word-link" type="button" data-word="الضُّرُّ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion">الضُّرُّ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation">البَحرِ</button>

    <button class="word-link" type="button" data-word="البَرِّ" data-root="B R R" data-learn-more="/quran-terminology/en/roots/b-r-r/" data-root-meaning="Expansive goodness, upright conduct, faithfulness, beneficence, openness in good, and standing on firm moral ground.">البَرِّ</button>

    <button class="word-link" type="button" data-word="كَفورًا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفورًا</button>
  </p>
  <p class="english-verse">When harm touches you at sea, those you call upon vanish from your thoughts except Him. But when He brings you safely to land, you turn away. The human being is ever ungrateful.</p>
