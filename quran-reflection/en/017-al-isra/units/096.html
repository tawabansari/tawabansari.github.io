<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:96</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command to convey the following statement.">قُل</button>
    <button class="word-link" type="button" data-word="كَفىٰ" data-root="K F Y" data-learn-more="/quran-terminology/en/roots/k-f-y/" data-root-meaning="Sufficiency: meeting a need and handling another’s affairs; The God’s sufficiency in witnessing, reckoning, aid, and protection" data-context="Sufficient; concerning God’s witness.">كَفىٰ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="شَهيدًا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="A witness; describing God between the two sides.">شَهيدًا</button>
    <button class="word-link" type="button" data-word="بَينى" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between me; one side of the testimony.">بَينى</button>
    <button class="word-link" type="button" data-word="وَبَينَكُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="And you; the other side of the testimony.">وَبَينَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Has been and is; describing The God.">كانَ</button>
    <button class="word-link" type="button" data-word="بِعِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Of His servants; the objects of divine knowledge and sight.">بِعِبادِهِ</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware; describing The God’s knowledge in the verse’s context." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرًا</button>
    <button class="word-link" type="button" data-word="بَصيرًا" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Seeing; describing The God.">بَصيرًا</button>
  </p>
  <p class="english-verse">Say, “The God suffices as a witness between me and you. He is indeed fully aware of His servants and sees them.”</p>
</section>
