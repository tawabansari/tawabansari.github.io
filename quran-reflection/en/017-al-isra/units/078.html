<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:78</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَقِمِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Establish: the command concerning prayer.">أَقِمِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Prayer: what is to be established.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="لِدُلوكِ" data-root="D L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-l-k/" data-root-meaning="Rubbing; the sun&#x27;s dulūk is its declining, with differing explanations of the precise time." data-context="From the decline: the sun’s movement or decline as stated in the verse.">لِدُلوكِ</button>
    <button class="word-link" type="button" data-word="الشَّمسِ" data-root="SH M S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-m-s/" data-root-meaning="The sun and its light." data-context="The sun: what determines the stated decline.">الشَّمسِ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="غَسَقِ" data-root="GH S Q" data-root-meaning="in its use concerning night, ghasaq is night becoming dark and darkness arriving or spreading. Another Arabic branch uses this family for liquids flowing and pouring. Ghāsiq describes something becoming dark or, in an appropriate context, flowing; ghassāq in the Qur’an names something punitive whose precise nature remains disputed in the lexical tradition." data-learn-more="/quran-terminology/en/roots/gh-s-q/" data-context="Darkness: the coming of night’s darkness.">غَسَقِ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Night: the time of that darkness.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="وَقُرءانَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="Recitation: the dawn reading within the context of prayer." data-learn-more="/quran-terminology/en/roots/q-r-a/">وَقُرءانَ</button>
    <button class="word-link" type="button" data-word="الفَجرِ" data-root="F J R" data-learn-more="/quran-terminology/en/roots/f-j-r/" data-root-meaning="Splitting, opening a path, flow after an opening, dawn, and ethical departure from proper limits." data-context="Dawn: the time of the stated recitation.">الفَجرِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="قُرءانَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="Recitation: the dawn reading within the context of prayer." data-learn-more="/quran-terminology/en/roots/q-r-a/">قُرءانَ</button>
    <button class="word-link" type="button" data-word="الفَجرِ" data-root="F J R" data-learn-more="/quran-terminology/en/roots/f-j-r/" data-root-meaning="Splitting, opening a path, flow after an opening, dawn, and ethical departure from proper limits." data-context="Dawn: qualifying recitation in the second clause.">الفَجرِ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Is: introducing the quality of dawn recitation.">كانَ</button>
    <button class="word-link" type="button" data-word="مَشهودًا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Witnessed: describing the dawn recitation.">مَشهودًا</button>
  </p>
  <p class="english-verse">Establish prayer from the sun’s decline until the darkness of night, and the recitation at dawn. The recitation at dawn is indeed witnessed.</p>
</section>
