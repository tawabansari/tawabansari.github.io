<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَمشِ" data-root="M SH Y" data-learn-more="/quran-terminology/en/roots/m-sh-y/" data-root-meaning="Walking, stepping, moving upon the earth; and more broadly, moving forward in a path, manner, behavior, or way of life" data-context="Do not walk; forbidding an exultant manner of walking.">تَمشِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; where a person walks.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مَرَحًا" data-root="M R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-h/" data-root-meaning="Exuberant self-indulgence or boastful behavior." data-context="With exultant self-display; the condemned manner of walking.">مَرَحًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="تَخرِقَ" data-root="KH R Q" data-root-meaning="Splitting, piercing, and passing through something; in speech, fabricating a statement or unsupported attribution." data-context="You will not split; the limitation stated concerning the earth." data-learn-more="/quran-terminology/en/roots/kh-r-q/">تَخرِقَ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; what the addressee will not split.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="وَلَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَن</button>
    <button class="word-link" type="button" data-word="تَبلُغَ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="You will not attain; failing to reach mountain height.">تَبلُغَ</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; their height provides a comparison showing human limitation." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجِبالَ</button>
    <button class="word-link" type="button" data-word="طولًا" data-root="TT W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-w-l/" data-root-meaning="Length or extension; ṭawl denotes means, abundance, or bounty." data-context="In height; the respect in which mountains and humans are compared.">طولًا</button>
  </p>
  <p class="english-verse">Do not walk on earth exultantly. You will never tear the earth apart, nor reach the mountains in height.</p>
