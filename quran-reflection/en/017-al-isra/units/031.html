<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:31</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَقتُلوا" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">تَقتُلوا</button>
    <button class="word-link" type="button" data-word="أَولٰدَكُم" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth">أَولٰدَكُم</button>
    <button class="word-link" type="button" data-word="خَشيَةَ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God">خَشيَةَ</button>

    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">نَحنُ</button>
    <button class="word-link" type="button" data-word="نَرزُقُهُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">نَرزُقُهُم</button>
    <button class="word-link" type="button" data-word="وَإِيّاكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِيّاكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="قَتلَهُم" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">قَتلَهُم</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="خِطـًٔا" data-root="KH Ṭ A" data-learn-more="/quran-terminology/en/roots/kh-tt-a/" data-root-meaning="Slipping from the right path, missing the mark, going wrong; and in some forms, conscious deviation from truth.">خِطـًٔا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">كَبيرًا</button>
  </p>
  <p class="english-verse">Do not kill your children for fear of poverty. We provide for them and for you. Surely killing them is a great sin.</p>
