<section class="ayah-block" id="ayah-109" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:109</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَخِرّونَ" data-root="KH R R" data-root-meaning="Falling down and moving downward; in other lexical branches, flowing and its sound." data-context="And they fall down, responding to the recited signs while weeping." data-learn-more="/quran-terminology/en/roots/kh-r-r/">وَيَخِرّونَ</button>
    <button class="word-link" type="button" data-word="لِلأَذقانِ" data-root="DH Q N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-q-n/" data-root-meaning="The chin or lower part of the face." data-context="Upon their chins: an expression of lowering the face as they fall down.">لِلأَذقانِ</button>
    <button class="word-link" type="button" data-word="يَبكونَ" data-root="B K Y" data-root-meaning="B K Y denotes weeping: the manifestation of a state that may involve tears, lamenting sounds, or sorrow and emotional response. In its causative form, it expresses making someone weep or causing weeping." data-context="Weeping: their state as they fall down in response to hearing the signs." data-learn-more="/quran-terminology/en/roots/b-k-y/">يَبكونَ</button>
    <button class="word-link" type="button" data-word="وَيَزيدُهُم" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="And it increases them: hearing the signs deepens their humility.">وَيَزيدُهُم</button>
    <button class="word-link" type="button" data-word="خُشوعًا" data-root="KH SH ʿ (KH SH Ayn)" data-learn-more="/quran-terminology/en/roots/kh-sh-ayn/" data-root-meaning="Lowering, subsiding, softening, becoming still, and moving out of hardness, raisedness, noise, or resistance before truth and greatness." data-context="Humility and submission, increased in them by hearing the signs.">خُشوعًا</button>
    ۩
  </p>
  <p class="english-verse">They fall upon their chins, weeping, and it increases them in humility.</p>
</section>
