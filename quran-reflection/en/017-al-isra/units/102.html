<section class="ayah-block" id="ayah-102" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:102</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Moses said in reply to Pharaoh.">قالَ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَقَد</button>
    <button class="word-link" type="button" data-word="عَلِمتَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="You, Pharaoh, have known the source of these signs.">عَلِمتَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Sent down and made these signs available.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="رَبُّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="The Lord of the heavens and the earth, the source of the signs in question.">رَبُّ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens in “the Lord of the heavens and the earth.”">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth, paired with the heavens in describing the scope of lordship.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="بَصائِرَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Illuminating signs that enable recognition of the truth.">بَصائِرَ</button>
    <button class="word-link" type="button" data-word="وَإِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنّى</button>
    <button class="word-link" type="button" data-word="لَأَظُنُّكَ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="I do indeed think or judge that you face ruin: Moses’ address to Pharaoh.">لَأَظُنُّكَ</button>
    <button class="word-link" type="button" data-word="يٰفِرعَونُ" data-root-note="Proper name; no root has been assigned.">يٰفِرعَونُ</button>
    <button class="word-link" type="button" data-word="مَثبورًا" data-root="TH B R" data-root-meaning="TH B R in its Qur’anic branch denotes destruction, ruin, and a disastrous outcome. Mathbūr describes someone facing that condition; thubūr names the destruction and ruin that become the object of people’s cries and lamentation in the Hereafter passages." data-context="Facing destruction and ruin: Pharaoh’s condition in Moses’ reply, with deprivation of good and a ruinous outcome in view." data-learn-more="/quran-terminology/en/roots/th-b-r/">مَثبورًا</button>
  </p>
  <p class="english-verse">He said, “You certainly know that none but the Lord of the heavens and the earth sent these down as insights. And I think you, Pharaoh, are doomed.”</p>
</section>
