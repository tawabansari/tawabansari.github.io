    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>

  <p class="english-verse">Do not kill the soul which The God has made inviolable except by right. Whoever is killed unjustly, We have given his guardian authority, so let him not exceed limits in killing. Surely he is supported.</p>
