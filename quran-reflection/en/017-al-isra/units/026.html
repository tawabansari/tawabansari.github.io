<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="And give or deliver; commanding the payment of the due identified next.">وَءاتِ</button>
    <button class="word-link" type="button" data-word="ذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذَا</button>
    <button class="word-link" type="button" data-word="القُربىٰ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Kinship; in dhā al-qurbā, the person related to you.">القُربىٰ</button>
    <button class="word-link" type="button" data-word="حَقَّهُ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="His due; what must be observed or delivered for the relative.">حَقَّهُ</button>
    <button class="word-link" type="button" data-word="وَالمِسكينَ" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling; in miskīn and maskanah, need, weakness, and a condition lowered by poverty." data-context="And the needy person, whose circumstances of need limit the means of living.">وَالمِسكينَ</button>
    <button class="word-link" type="button" data-word="وَابنَ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole; ibn, banūn and banī denote son, children, and lineage." data-context="And ibn in ibn al-sabīl, an expression for the needy or stranded traveler, not a biological child of the road.">وَابنَ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; in ibn al-sabīl, a traveler in need of help along the journey.">السَّبيلِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُبَذِّر" data-root="B DH R" data-root-meaning="Scattering and dispersing; in agriculture, sowing seed; in tabdhīr, misplaced spending and wrongful dissipation of wealth and resources." data-learn-more="/quran-terminology/en/roots/b-dh-r/" data-context="Do not spend wastefully or dissipate resources wrongfully; a prohibition addressed to a singular person.">تُبَذِّر</button>
    <button class="word-link" type="button" data-word="تَبذيرًا" data-root="B DH R" data-root-meaning="Scattering and dispersing; in agriculture, sowing seed; in tabdhīr, misplaced spending and wrongful dissipation of wealth and resources." data-learn-more="/quran-terminology/en/roots/b-dh-r/" data-context="Squandering; the cognate verbal noun emphasizing the preceding prohibition, not specifying an amount or number of repetitions.">تَبذيرًا</button>
  </p>
  <p class="english-verse">Give the relative his due, and the needy and the traveler, and do not squander wastefully.</p>
</section>
