<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَضىٰ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination" data-context="And has decreed; the Lord’s command concerning worship and goodness toward parents.">وَقَضىٰ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; the source of the command stated in this ayah.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعبُدوا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worship none but Him; directing worship exclusively to the Lord.">تَعبُدوا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="إِيّاهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِيّاهُ</button>
    <button class="word-link" type="button" data-word="وَبِالوٰلِدَينِ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth" data-context="And toward parents; both parents to whom goodness is commanded.">وَبِالوٰلِدَينِ</button>
    <button class="word-link" type="button" data-word="إِحسٰنًا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Goodness and kind conduct; what is commanded toward parents.">إِحسٰنًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِمّا</button>
    <button class="word-link" type="button" data-word="يَبلُغَنَّ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="Reaches old age; the condition concerning one or both parents.">يَبلُغَنَّ</button>
    <button class="word-link" type="button" data-word="عِندَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَكَ</button>
    <button class="word-link" type="button" data-word="الكِبَرَ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Old age; the stage of the parents’ lives foregrounded here.">الكِبَرَ</button>
    <button class="word-link" type="button" data-word="أَحَدُهُما" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="One of the two; either parent, contrasted with both.">أَحَدُهُما</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="كِلاهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كِلاهُما</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Do not say; prohibiting uff addressed to parents.">تَقُل</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُما</button>
    <button class="word-link" type="button" data-word="أُفٍّ" data-root="A F F" data-learn-more="/quran-terminology/en/roots/a-f-f/" data-root-meaning="Expressing displeasure, impatience, or aversion toward someone or something through a short exclamation revealing the speaker’s dislike and irritation." data-context="Uff; a brief expression of impatience or displeasure forbidden when addressed to parents.">أُفٍّ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَنهَرهُما" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="Do not rebuke them; prohibiting harsh or verbally aggressive treatment of parents.">تَنهَرهُما</button>
    <button class="word-link" type="button" data-word="وَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And speak; the positive command to address parents respectfully.">وَقُل</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُما</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Words or speech, qualified as honorable and respectful.">قَولًا</button>
    <button class="word-link" type="button" data-word="كَريمًا" data-root="K R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-m/" data-root-meaning="Nobility, honor, or generosity." data-context="Honorable and respectful; describing how to speak to parents.">كَريمًا</button>
  </p>
  <p class="english-verse">Your Lord has decreed that you worship none but Him and do good to parents. If one or both of them reach old age with you, do not say “Uff” to them or rebuke them, but speak to them a noble word.</p>
</section>
