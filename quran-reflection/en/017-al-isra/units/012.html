    <button class="word-link" type="button" data-word="ءايَةَ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The sign of.">ءايَةَ</button>
    <button class="word-link" type="button" data-word="النَّهارِ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="The day.">النَّهارِ</button>

    <button class="word-link" type="button" data-word="لِتَبتَغوا" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="So that you may seek.">لِتَبتَغوا</button>

    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="A thing or matter under discussion." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God As the noun shayʾ, a thing or matter under discussion, distinct from the verb of willing.">شَىءٍ</button>

    <button class="word-link" type="button" data-word="تَفصيلًا" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="And clear, distinct exposition; clarifying the specified subject’s components and limits." data-learn-more="/quran-terminology/en/roots/f-sad-l/">تَفصيلًا</button>

  <p class="english-verse">We made the night and the day two signs. We erased the sign of the night and made the sign of the day illuminating, so that you may seek bounty from your Lord and know the number of years and the reckoning. We have set out everything in detail.</p>
