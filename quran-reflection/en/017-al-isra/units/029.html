<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَجعَل" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Do not make; prohibiting the conduct pictured as a bound hand.">تَجعَل</button>
    <button class="word-link" type="button" data-word="يَدَكَ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Your hand; the means of receiving and giving in the image.">يَدَكَ</button>
    <button class="word-link" type="button" data-word="مَغلولَةً" data-root="GH L L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-l-l/" data-root-meaning="A fetter; ghill is resentment; ghulūl is misappropriation of entrusted property." data-context="Bound; an image of severe withholding from giving.">مَغلولَةً</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="عُنُقِكَ" data-root="AYN N Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-q/" data-root-meaning="The neck; sometimes representing persons or their posture." data-context="Your neck; the bound hand against it forms the image of miserliness.">عُنُقِكَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبسُطها" data-root="B S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-s-tt/" data-root-meaning="Unfolding, spreading, or extending; expansion can concern space, capacity, or resources." data-context="Do not extend it; prohibiting giving without retaining resources or capacity.">تَبسُطها</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Complete; expressing the unrestricted extent of opening the hand.">كُلَّ</button>
    <button class="word-link" type="button" data-word="البَسطِ" data-root="B S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-s-tt/" data-root-meaning="Unfolding, spreading, or extending; expansion can concern space, capacity, or resources." data-context="Extension; here, the hand&#x27;s complete extension in giving and spending.">البَسطِ</button>
    <button class="word-link" type="button" data-word="فَتَقعُدَ" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Then remain; the outcome of unrestrained expenditure.">فَتَقعُدَ</button>
    <button class="word-link" type="button" data-word="مَلومًا" data-root="L W M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-w-m/" data-root-meaning="Blame or reproach." data-context="Blamed; describing someone reproached for that conduct.">مَلومًا</button>
    <button class="word-link" type="button" data-word="مَحسورًا" data-root="H S R" data-root-meaning="Uncovering and exposure; depleted strength and exhaustion; also intense regret or grief over loss or an unwelcome outcome." data-learn-more="/quran-terminology/en/roots/h-s-r/" data-context="Depleted and without resources; unable to continue giving or meet needs after unrestrained spending.">مَحسورًا</button>
  </p>
  <p class="english-verse">Do not keep your hand bound to your neck, nor extend it to its fullest extent, lest you sit blamed and exhausted.</p>
</section>
