  <h2 class="ayah-title">Al-Isra 17:100</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>

    <button class="word-link" type="button" data-word="تَملِكونَ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God">تَملِكونَ</button>

  <p class="english-verse">Say, “If you possessed the treasures of my Lord’s mercy, you would hold them back for fear of spending.” The human being is ever stingy.</p>
