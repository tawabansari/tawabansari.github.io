<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سُبحٰنَ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Glorification of the One who took His servant by night.">سُبحٰنَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَسرىٰ" data-root="S R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-y/" data-root-meaning="Traveling by night; sariyy in Mary&#x27;s passage is explained as a stream or a noble person." data-context="Took by night, referring to the servant’s journey.">أَسرىٰ</button>
    <button class="word-link" type="button" data-word="بِعَبدِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="His servant, the person taken on the journey.">بِعَبدِهِ</button>
    <button class="word-link" type="button" data-word="لَيلًا" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="By night, specifying the journey’s time.">لَيلًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المَسجِدِ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="The mosque, in al-Masjid al-Ḥarām.">المَسجِدِ</button>
    <button class="word-link" type="button" data-word="الحَرامِ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Inviolable, describing the mosque.">الحَرامِ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="المَسجِدِ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="The mosque, in al-Masjid al-Aqṣā.">المَسجِدِ</button>
    <button class="word-link" type="button" data-word="الأَقصَا" data-root="Q SAD W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-sad-w/" data-root-meaning="Remoteness or the farthest side." data-context="Farther or farthest, describing the destination mosque.">الأَقصَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="بٰرَكنا" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="We blessed the surroundings of al-Masjid al-Aqṣā; ḥawlahu specifies the area concerned." data-learn-more="/quran-terminology/en/roots/b-r-k/">بٰرَكنا</button>
    <button class="word-link" type="button" data-word="حَولَهُ" data-root="H W L" data-learn-more="/quran-terminology/en/roots/h-w-l/" data-root-meaning="Aroundness, surrounding relation, turning, change of state, transfer, and becoming a barrier between things" data-context="Its surroundings, the area described as blessed.">حَولَهُ</button>
    <button class="word-link" type="button" data-word="لِنُرِيَهُ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="So that We may show him, the stated purpose.">لِنُرِيَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs, what the servant is shown.">ءايٰتِنا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="السَّميعُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="The Hearing, an attribute of The God.">السَّميعُ</button>
    <button class="word-link" type="button" data-word="البَصيرُ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="The Seeing, alongside the Hearing.">البَصيرُ</button>
  </p>
  <p class="english-verse">Glory be to the One who took His servant by night from the Sacred Mosque to the Farthest Mosque, whose surroundings We have blessed, to show him some of Our signs. Surely He is the Hearing, the Seeing.</p>
</section>
