<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:91</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="There be, in the demand for a garden.">تَكونَ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    <button class="word-link" type="button" data-word="جَنَّةٌ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="A garden, one of the stated demands.">جَنَّةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="نَخيلٍ" data-root="N KH L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-kh-l/" data-root-meaning="A date palm or date palms." data-context="Date palms, part of the requested garden’s plants.">نَخيلٍ</button>
    <button class="word-link" type="button" data-word="وَعِنَبٍ" data-root="AYN N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-b/" data-root-meaning="Grapes or grapevines." data-context="And grapevines, alongside the date palms.">وَعِنَبٍ</button>
    <button class="word-link" type="button" data-word="فَتُفَجِّرَ" data-root="F J R" data-learn-more="/quran-terminology/en/roots/f-j-r/" data-root-meaning="Splitting, opening a path, flow after an opening, dawn, and ethical departure from proper limits." data-context="Then cause rivers to flow through the garden.">فَتُفَجِّرَ</button>
    <button class="word-link" type="button" data-word="الأَنهٰرَ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="Rivers, whose flow through the garden is demanded.">الأَنهٰرَ</button>
    <button class="word-link" type="button" data-word="خِلٰلَها" data-root="KH L L" data-root-meaning="Intervals and spaces between things; penetration and passage among them; and, in human relationships, friendship and close bonds." data-context="Within it, the requested garden." data-learn-more="/quran-terminology/en/roots/kh-l-l/">خِلٰلَها</button>
    <button class="word-link" type="button" data-word="تَفجيرًا" data-root="F J R" data-learn-more="/quran-terminology/en/roots/f-j-r/" data-root-meaning="Splitting, opening a path, flow after an opening, dawn, and ethical departure from proper limits." data-context="Abundantly causing to flow, the emphatic verbal noun of the preceding verb.">تَفجيرًا</button>
  </p>
  <p class="english-verse">or you have a garden of palms and grapevines and make rivers gush abundantly through it,</p>
