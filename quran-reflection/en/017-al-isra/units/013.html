<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">وَكُلَّ</button>
    <button class="word-link" type="button" data-word="إِنسٰنٍ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company">إِنسٰنٍ</button>
    <button class="word-link" type="button" data-word="أَلزَمنٰهُ" data-root="L Z M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-z-m/" data-root-meaning="Adhering or remaining inseparable; ilzām means binding or imposing.">أَلزَمنٰهُ</button>
    <button class="word-link" type="button" data-word="طٰئِرَهُ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record.">طٰئِرَهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="عُنُقِهِ" data-root="AYN N Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-q/" data-root-meaning="The neck; sometimes representing persons or their posture.">عُنُقِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَنُخرِجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">وَنُخرِجُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="كِتٰبًا" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">كِتٰبًا</button>
    <button class="word-link" type="button" data-word="يَلقىٰهُ" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter">يَلقىٰهُ</button>
    <button class="word-link" type="button" data-word="مَنشورًا" data-root="N SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-r/" data-root-meaning="Spreading or dispersing; nushūr denotes rising or resurrection.">مَنشورًا</button>
  </p>
  <p class="english-verse">We have fastened every human being’s record to his neck, and on the Day of Resurrection We will bring out for him a book which he will find spread open.</p>
</section>
