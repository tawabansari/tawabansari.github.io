<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:64</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاستَفزِز" data-root="F Z Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-z-z/" data-root-meaning="Agitating, provoking, or dislodging." data-context="And stir up; rouse whomever you can among them with your voice.">وَاستَفزِز</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَنِ</button>
    <button class="word-link" type="button" data-word="استَطَعتَ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="You can; those among them whom you have the ability to rouse.">استَطَعتَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="بِصَوتِكَ" data-root="SAD W T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-t/" data-root-meaning="Sound or voice." data-context="With your voice; the means of rousing in the address to Satan, without the verse itself specifying one kind of sound.">بِصَوتِكَ</button>
    <button class="word-link" type="button" data-word="وَأَجلِب" data-root="J L B" data-root-meaning="Bringing and gathering, mobilizing; and, in another branch, covering and enclosing." data-context="And mobilize forces against them; with cavalry and infantry, gathering and deploying forces for an attack." data-learn-more="/quran-terminology/en/roots/j-l-b/">وَأَجلِب</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِخَيلِكَ" data-root="KH Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-y-l/" data-root-meaning="Mental imagery; ikhtiyāl is conceit; khayl denotes horses." data-context="With your horses or cavalry; mounted forces beside infantry in the depiction of Satan’s mobilization.">بِخَيلِكَ</button>
    <button class="word-link" type="button" data-word="وَرَجِلِكَ" data-root="R J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="A man; also a foot and walking on foot, in different forms." data-context="And your infantry; foot soldiers alongside mounted forces.">وَرَجِلِكَ</button>
    <button class="word-link" type="button" data-word="وَشارِكهُم" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="And share with them; in wealth and children, within the context of Satan’s misleading activity.">وَشارِكهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَموٰلِ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="Wealth and possessions; the property in which Satan’s sharing with human beings is mentioned.">الأَموٰلِ</button>
    <button class="word-link" type="button" data-word="وَالأَولٰدِ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth" data-context="And children; continuing the subject of Satan’s sharing with human beings.">وَالأَولٰدِ</button>
    <button class="word-link" type="button" data-word="وَعِدهُم" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="And make them promises; addressed to Satan, whose promises are identified as delusion at the verse’s end.">وَعِدهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَعِدُهُمُ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="He promises them; describing Satan’s promises in a construction of negation and exception.">يَعِدُهُمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan; the misleading figure addressed in the preceding commands.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="غُرورًا" data-root="GH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-r/" data-root-meaning="Deception or reliance on a misleading appearance." data-context="Delusion; the nature of Satan’s promises, offering them only a deceptive appearance.">غُرورًا</button>
  </p>
  <p class="english-verse">Stir up whomever you can among them with your voice, rally your cavalry and infantry against them, share in their wealth and children, and make them promises.” Satan promises them nothing but delusion.</p>
</section>
