  <h2 class="ayah-title">Al-Isra 17:82</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="القُرءانِ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text described as healing and mercy for believers." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانِ</button>

  <p class="english-verse">We send down of the Qur’an what is healing and mercy for the believers, but it increases the wrongdoers only in loss.</p>
