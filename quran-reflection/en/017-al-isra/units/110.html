<section class="ayah-block" id="ayah-110" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:110</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُلِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُلِ</button>

    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَوِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوِ</button>
    <button class="word-link" type="button" data-word="ادعُوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">ادعُوا</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">الرَّحمٰنَ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَيًّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَيًّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَدعوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">تَدعوا</button>
    <button class="word-link" type="button" data-word="فَلَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَهُ</button>
    <button class="word-link" type="button" data-word="الأَسماءُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">الأَسماءُ</button>
    <button class="word-link" type="button" data-word="الحُسنىٰ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">الحُسنىٰ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَجهَر" data-root="J H R" data-learn-more="/quran-terminology/en/roots/j-h2-r/" data-root-meaning="Being apparent and public; and in speech, raising the voice so that it leaves softness and concealment.">تَجهَر</button>
    <button class="word-link" type="button" data-word="بِصَلاتِكَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">بِصَلاتِكَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُخافِت" data-root="KH F T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-f-t/" data-root-meaning="Speaking quietly or secretly, or lowering the voice.">تُخافِت</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="وَابتَغِ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit">وَابتَغِ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سَبيلًا</button>
  </p>
  <p class="english-verse">Say, “Call upon The God or call upon the Entirely Merciful. Whichever you call upon, to Him belong the most beautiful names.” Do not be loud in your prayer or quiet in it, but seek a way between the two.</p>
</section>
