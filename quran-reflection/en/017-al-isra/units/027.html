<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Isra 17:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="المُبَذِّرينَ" data-root="B DH R" data-root-meaning="Scattering and dispersing; in agriculture, sowing seed; in tabdhīr, misplaced spending and wrongful dissipation of wealth and resources." data-learn-more="/quran-terminology/en/roots/b-dh-r/" data-context="The squanderers, those who wrongfully spend and waste wealth and resources.">المُبَذِّرينَ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Have been; here stating the squanderers’ relationship with the devils, without establishing that it has ceased in the present.">كانوا</button>
    <button class="word-link" type="button" data-word="إِخوٰنَ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="akh and ukht denote brother and sister, initially in a familial bond and, more broadly, people or things connected through descent, peoplehood, religion, a path, cooperation, or a shared characteristic. Ikhwah and ikhwān are two plural forms in this family whose ranges of use overlap." data-context="Brothers of the devils; association or similarity in conduct and path, not biological kinship.">إِخوٰنَ</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينِ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="The devils; in brothers of the devils, expressing the squanderers’ association with their path and conduct.">الشَّيٰطينِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And has been; linking Satan’s ingratitude to the preceding description, without specifying its ending.">وَكانَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan, the rebellious being described next as deeply ungrateful to his Lord.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="لِرَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="To his Lord; identifying the relationship against which Satan’s ingratitude is condemned.">لِرَبِّهِ</button>
    <button class="word-link" type="button" data-word="كَفورًا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Deeply ungrateful; an intensive description of Satan’s ingratitude to his Lord in this context.">كَفورًا</button>
  </p>
  <p class="english-verse">Surely the squanderers are brothers of the devils, and Satan is deeply ungrateful to his Lord.</p>
</section>
