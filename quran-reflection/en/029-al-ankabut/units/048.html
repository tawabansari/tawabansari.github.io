<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You were; in ma kunta, expressing the negated past situation.">كُنتَ</button>
    <button class="word-link" type="button" data-word="تَتلوا" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another." data-context="You recited or read; an activity negated for the preceding period.">تَتلوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before it; in context, before the revelation of the Book described.">قَبلِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كِتٰبٍ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="A book; in the negative construction min kitabin, any book.">كِتٰبٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَخُطُّهُ" data-root="KH TT TT" data-root-meaning="Making a line or extended trace on a surface; marking and writing." data-context="You wrote it; the verse negates writing a book with the right hand before it." data-learn-more="/quran-terminology/en/roots/kh-tt-tt/">تَخُطُّهُ</button>
    <button class="word-link" type="button" data-word="بِيَمينِكَ" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="With your right hand; specifying direct writing by hand here.">بِيَمينِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِذًا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذًا</button>
    <button class="word-link" type="button" data-word="لَارتابَ" data-root="R Y B" data-learn-more="/quran-terminology/en/roots/r-y-b/" data-root-meaning="Unsettled doubt, distrust, suspicion, destabilizing uncertainty, anxiety before truth, and a state that blocks confidence and rational submission before proof" data-context="Would certainly have doubted; the hypothetical consequence at the verse’s end.">لَارتابَ</button>
    <button class="word-link" type="button" data-word="المُبطِلونَ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="Those promoting falsehood; the people to whom the hypothetical doubt is attributed.">المُبطِلونَ</button>
  </p>
  <p class="english-verse">Before it, you did not recite any book, nor write it with your right hand. Otherwise, those who pursue falsehood would have doubted.</p>
</section>
