<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَذَّبوهُ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Then they denied him; rejected Shuayb’s message as false.">فَكَذَّبوهُ</button>
    <button class="word-link" type="button" data-word="فَأَخَذَتهُمُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Then it seized them; the quake overtook those who denied him.">فَأَخَذَتهُمُ</button>
    <button class="word-link" type="button" data-word="الرَّجفَةُ" data-root="R J F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-f/" data-root-meaning="Trembling and disturbance; irjāf is spreading alarming reports." data-context="The violent shaking; the event that overtook them.">الرَّجفَةُ</button>
    <button class="word-link" type="button" data-word="فَأَصبَحوا" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp." data-context="Then they became; introducing the resulting condition after the quake.">فَأَصبَحوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="دارِهِم" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence" data-context="Their dwelling; the place where they lived and were left fallen.">دارِهِم</button>
    <button class="word-link" type="button" data-word="جٰثِمينَ" data-root="J TH M" data-root-meaning="settling down, keeping close to the ground, and remaining in the same place; of humans and animals." data-context="Lying fallen and motionless upon the ground; describing those who denied Shuayb after the quake in their dwelling." data-learn-more="/quran-terminology/en/roots/j-th-m/">جٰثِمينَ</button>
  </p>
  <p class="english-verse">They denied him, and the quake seized them, leaving them fallen in their dwelling.</p>
