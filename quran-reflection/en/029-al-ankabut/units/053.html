<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:53</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَستَعجِلونَكَ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf" data-context="And ask you to hasten it, demanding punishment sooner.">وَيَستَعجِلونَكَ</button>
    <button class="word-link" type="button" data-word="بِالعَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, whose hastening they demand.">بِالعَذابِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَولا</button>
    <button class="word-link" type="button" data-word="أَجَلٌ" data-root="A J L" data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period or time; where appropriate, the end of that period." data-context="A term or appointed time for punishment’s arrival.">أَجَلٌ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="S M W / W S M" data-root-meaning="Raising into the level of recognition, and marking for identification" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-context="Specified or designated, qualifying the appointed term.">مُسَمًّى</button>
    <button class="word-link" type="button" data-word="لَجاءَهُمُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Would certainly have reached them, were there no appointed term.">لَجاءَهُمُ</button>
    <button class="word-link" type="button" data-word="العَذابُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, the event governed by an appointed term.">العَذابُ</button>
    <button class="word-link" type="button" data-word="وَلَيَأتِيَنَّهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="And it will certainly reach them, emphasizing future occurrence.">وَلَيَأتِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="B GH T" data-root-meaning="Something arriving or happening suddenly at a time when its audience did not expect it or was unaware of its approach." data-context="Suddenly, punishment arriving at its appointed time, unknown to its audience." data-learn-more="/quran-terminology/en/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality" data-context="Perceive; negated to express unawareness of punishment’s arrival.">يَشعُرونَ</button>
  </p>
  <p class="english-verse">They ask you to hasten the punishment. Were it not for an appointed term, the punishment would have come to them. It will surely come upon them suddenly, while they are unaware.</p>
</section>
