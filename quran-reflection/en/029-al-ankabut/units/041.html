<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَثَلُ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="The likeness and illustrative comparison.">مَثَلُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Adopted and took as protectors.">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Apart from, in the expression for other than The God.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="أَولِياءَ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Protectors and trusted supports.">أَولِياءَ</button>
    <button class="word-link" type="button" data-word="كَمَثَلِ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like the likeness and image.">كَمَثَلِ</button>
    <button class="word-link" type="button" data-word="العَنكَبوتِ" data-root="AYN N K B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-k-b/" data-root-meaning="A spider, the web-spinning animal." data-context="The spider, the web-spinning creature.">العَنكَبوتِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذَت" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Adopted and made for itself.">اتَّخَذَت</button>
    <button class="word-link" type="button" data-word="بَيتًا" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="The house and shelter the spider has made for itself." data-learn-more="/quran-terminology/en/roots/b-y-t/">بَيتًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="أَوهَنَ" data-root="W H2 N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h2-n/" data-root-meaning="Weakness or frailty." data-context="The weakest and least substantial.">أَوهَنَ</button>
    <button class="word-link" type="button" data-word="البُيوتِ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="Houses and shelters, compared for weakness." data-learn-more="/quran-terminology/en/roots/b-y-t/">البُيوتِ</button>
    <button class="word-link" type="button" data-word="لَبَيتُ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="Indeed the spider’s house and shelter." data-learn-more="/quran-terminology/en/roots/b-y-t/">لَبَيتُ</button>
    <button class="word-link" type="button" data-word="العَنكَبوتِ" data-root="AYN N K B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-k-b/" data-root-meaning="A spider, the web-spinning animal." data-context="The spider.">العَنكَبوتِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, in the conditional expression about knowing.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="They knew.">يَعلَمونَ</button>
  </p>
  <p class="english-verse">The likeness of those who take protectors apart from The God is that of the spider that made a house. The frailest of houses is the spider’s house, if they knew.</p>
</section>
