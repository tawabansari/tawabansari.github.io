    <button class="word-link" type="button" data-word="تَنهىٰ" data-root="N H2 Y" data-root-note="Root study coming soon.">تَنهىٰ</button>

    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">أَكبَرُ</button>

  <p class="english-verse">Recite what has been revealed to you of the Book and establish prayer. Prayer restrains indecency and wrongdoing, and remembrance of The God is greater. The God knows what you do.</p>
