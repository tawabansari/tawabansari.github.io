<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوَصَّينَا" data-root="W Ṣ Y" data-learn-more="/quran-terminology/en/roots/w-sad-y/" data-root-meaning="Enjoining, entrusting responsibility, and passing on a commitment: from individual instructions to mutual exhortation" data-context="And We enjoined; the instruction to treat parents well.">وَوَصَّينَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being; the subject of responsibility toward parents.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="بِوٰلِدَيهِ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth" data-context="Toward his parents; the parental relationship addressed.">بِوٰلِدَيهِ</button>
    <button class="word-link" type="button" data-word="حُسنًا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Goodness; the manner of treating parents.">حُسنًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="جٰهَداكَ" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="They both press you hard; the parents’ effort to make their child associate others with God." data-learn-more="/quran-terminology/en/roots/j-h2-d/">جٰهَداكَ</button>
    <button class="word-link" type="button" data-word="لِتُشرِكَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="That you associate; the goal of parental pressure.">لِتُشرِكَ</button>
    <button class="word-link" type="button" data-word="بى" data-root-note="Grammatical word; no derivational root is assigned for this use.">بى</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَيسَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَيسَ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="عِلمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge; the warrant absent for associating partners.">عِلمٌ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تُطِعهُما" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="Obey them; the compliance prohibited here.">تُطِعهُما</button>
    ۚ
    <button class="word-link" type="button" data-word="إِلَىَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَىَّ</button>
    <button class="word-link" type="button" data-word="مَرجِعُكُم" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="Your return; everyone’s return for accountability.">مَرجِعُكُم</button>
    <button class="word-link" type="button" data-word="فَأُنَبِّئُكُم" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="Then I will inform you; reporting your conduct.">فَأُنَبِّئُكُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You used to; part of the construction about former deeds.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You did; the actions to be reported.">تَعمَلونَ</button>
  </p>
  <p class="english-verse">We enjoined the human being to treat his parents well. But if they strive to make you associate with Me what you have no knowledge of, do not obey them. To Me is your return, and I will tell you what you used to do.</p>
</section>
