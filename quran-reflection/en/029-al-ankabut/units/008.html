    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company">الإِنسٰنَ</button>

    <button class="word-link" type="button" data-word="حُسنًا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">حُسنًا</button>

  <p class="english-verse">We enjoined the human being to treat his parents well. But if they strive to make you associate with Me what you have no knowledge of, do not obey them. To Me is your return, and I will tell you what you used to do.</p>
