<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكُلًّا" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Each of the groups mentioned.">فَكُلًّا</button>
    <button class="word-link" type="button" data-word="أَخَذنا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="We seized and punished.">أَخَذنا</button>
    <button class="word-link" type="button" data-word="بِذَنبِهِ" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share." data-context="For his or that group’s sin.">بِذَنبِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="We sent; referring to the pelting phenomenon.">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="حاصِبًا" data-root="H SAD B" data-root-meaning="The root’s concrete core concerns gravel, pebbles, and pelting with them; its fire-related branch concerns material cast into a fire and burned. Both branches can be distinguished in Qur’anic usage, and accurate translation requires interpreting each derivative through its own structure and context." data-context="A stone-pelting punishment or phenomenon sent upon some of them." data-learn-more="/quran-terminology/en/roots/h-sad-b/">حاصِبًا</button>
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَخَذَتهُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Seized him or that group.">أَخَذَتهُ</button>
    <button class="word-link" type="button" data-word="الصَّيحَةُ" data-root="SAD Y H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-y-h/" data-root-meaning="A loud cry or shout." data-context="The mighty cry that seized them.">الصَّيحَةُ</button>
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="خَسَفنا" data-root="KH S F" data-root-meaning="Sinking or being made to sink into the earth; of the moon, diminished or disappearing light." data-context="We caused him or that group to be swallowed by the earth." data-learn-more="/quran-terminology/en/roots/kh-s-f/">خَسَفنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, into which some were swallowed.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="وَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنهُم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَغرَقنا" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water" data-context="We drowned them.">أَغرَقنا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="In the negation that God would wrong them.">كانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لِيَظلِمَهُم" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrong them; the action denied of God.">لِيَظلِمَهُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were; expressing their continuing conduct in the clause.">كانوا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Their own selves.">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="يَظلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="They were wronging themselves.">يَظلِمونَ</button>
  </p>
  <p class="english-verse">We seized each for his sin. Upon some We sent a stone-bearing storm; some were seized by the cry; some We made the earth swallow; and some We drowned. The God was not wronging them, but they were wronging themselves.</p>
</section>
