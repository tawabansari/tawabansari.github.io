  <h2 class="ayah-title">Al-Ankabut 29:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُجٰدِلوا" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="Do not dispute with the people of the Scripture except in the better manner, with the exception stated in the verse." data-learn-more="/quran-terminology/en/roots/j-d-l/">تُجٰدِلوا</button>
    <button class="word-link" type="button" data-word="أَهلَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="People, in the expression people of the Scripture.">أَهلَ</button>

    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>

    <button class="word-link" type="button" data-word="هِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Better; describing the manner of disputation.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Have acted unjustly; the excepted group among the people of the Scripture.">ظَلَموا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>

    <button class="word-link" type="button" data-word="وَقولوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And say; introducing the statement prescribed for discussion.">وَقولوا</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="We believe in the revelation sent down.">ءامَنّا</button>
    <button class="word-link" type="button" data-word="بِالَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِالَّذى</button>
    <button class="word-link" type="button" data-word="أُنزِلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Has been sent down to us.">أُنزِلَ</button>

    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="وَإِلٰهُنا" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Our deity; in the affirmation of oneness.">وَإِلٰهُنا</button>
    <button class="word-link" type="button" data-word="وَإِلٰهُكُم" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="And your deity; in the statement of one deity.">وَإِلٰهُكُم</button>
    <button class="word-link" type="button" data-word="وٰحِدٌ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="One; describing the deity.">وٰحِدٌ</button>
    <button class="word-link" type="button" data-word="وَنَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَنَحنُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="مُسلِمونَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="We submit to Him.">مُسلِمونَ</button>
  </p>
  <p class="english-verse">Do not dispute with the People of the Book except in the best manner, apart from those among them who do wrong. Say: We believe in what was sent down to us and what was sent down to you. Our god and your god are one, and we submit to Him.</p>
</section>
