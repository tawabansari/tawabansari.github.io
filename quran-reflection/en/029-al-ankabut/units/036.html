  <h2 class="ayah-title">Al-Ankabut 29:36</h2>
  <p class="arabic-text">

  </p>
  <p class="english-verse">And to Midian, their brother Shuayb. He said: My people, worship The God, look forward to the Last Day, and do not act corruptly in the earth, spreading disorder.</p>
