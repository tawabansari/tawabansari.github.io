<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَيَحمِلُنَّ" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy." data-context="They will surely carry their own and additional burdens.">وَلَيَحمِلُنَّ</button>
    <button class="word-link" type="button" data-word="أَثقالَهُم" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="Their own burdens: responsibility and consequences of their conduct." data-learn-more="/quran-terminology/en/roots/th-q-l/">أَثقالَهُم</button>
    <button class="word-link" type="button" data-word="وَأَثقالًا" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="And additional burdens arising from misleading others." data-learn-more="/quran-terminology/en/roots/th-q-l/">وَأَثقالًا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="أَثقالِهِم" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="Their burdens, alongside which the additional burdens are carried." data-learn-more="/quran-terminology/en/roots/th-q-l/">أَثقالِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَيُسـَٔلُنَّ" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="They will certainly be questioned about their fabrications.">وَلَيُسـَٔلُنَّ</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Day: the time of questioning.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Resurrection: the time of reckoning and accountability.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَمّا</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to: with the following verb, describing their past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations." data-context="They fabricated false claims.">يَفتَرونَ</button>
  </p>
  <p class="english-verse">They will surely carry their own burdens and other burdens along with them, and on the Day of Resurrection they will be questioned about what they used to invent.</p>
</section>
