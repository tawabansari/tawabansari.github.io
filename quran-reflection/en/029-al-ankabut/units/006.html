<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="جٰهَدَ" data-root="J H2 D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-h2-d/" data-root-meaning="Exerting effort or capacity against difficulty; jihād takes its particular meaning from purpose, means, and context.">جٰهَدَ</button>
    <button class="word-link" type="button" data-word="فَإِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّما</button>
    <button class="word-link" type="button" data-word="يُجٰهِدُ" data-root="J H2 D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-h2-d/" data-root-meaning="Exerting effort or capacity against difficulty; jihād takes its particular meaning from purpose, means, and context.">يُجٰهِدُ</button>
    <button class="word-link" type="button" data-word="لِنَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">لِنَفسِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَغَنِىٌّ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting.">لَغَنِىٌّ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">العٰلَمينَ</button>
  </p>
  <p class="english-verse">Whoever strives, strives only for himself. The God is independent of all worlds.</p>
