<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:67</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">يَرَوا</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّا</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلنا</button>
    <button class="word-link" type="button" data-word="حَرَمًا" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation">حَرَمًا</button>
    <button class="word-link" type="button" data-word="ءامِنًا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">ءامِنًا</button>
    <button class="word-link" type="button" data-word="وَيُتَخَطَّفُ" data-root="KH Ṭ F" data-learn-more="/quran-terminology/en/roots/kh-tt-f/" data-root-meaning="To snatch, seize suddenly, carry off swiftly, and separate something from its place before it has time to resist or stabilize">وَيُتَخَطَّفُ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="حَولِهِم" data-root="H W L" data-learn-more="/quran-terminology/en/roots/h-w-l/" data-root-meaning="Aroundness, surrounding relation, turning, change of state, transfer, and becoming a barrier between things">حَولِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="أَفَبِالبٰطِلِ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth.">أَفَبِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="وَبِنِعمَةِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">وَبِنِعمَةِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يَكفُرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">يَكفُرونَ</button>
  </p>
  <p class="english-verse">Have they not seen that We made a secure sanctuary, while people are snatched away around them? Do they believe in falsehood and deny The God’s favor?</p>
</section>
