<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Ankabut 29:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَنجَينٰهُ" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety" data-context="So We saved him, Noah’s deliverance from the flood.">فَأَنجَينٰهُ</button>
    <button class="word-link" type="button" data-word="وَأَصحٰبَ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="And the companions, those associated with the ship.">وَأَصحٰبَ</button>
    <button class="word-link" type="button" data-word="السَّفينَةِ" data-root="S F N" data-learn-more="/quran-terminology/en/roots/s-f-n/" data-root-meaning="Scraping, abrasion, and removing a surface layer; safīnah: a ship or vessel for transport over water." data-context="Noah’s ship, whose companions were saved with him.">السَّفينَةِ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنٰها" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We made it, establishing it as a sign.">وَجَعَلنٰها</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="A sign, something inviting attention and reflection in the rescue account.">ءايَةً</button>
    <button class="word-link" type="button" data-word="لِلعٰلَمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="For the worlds, those to whom the sign is directed.">لِلعٰلَمينَ</button>
  </p>
  <p class="english-verse">We saved him and the companions of the ship, and made it a sign for all worlds.</p>
