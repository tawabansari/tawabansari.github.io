  <h2 class="ayah-title">Al-Qamar 54:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَلِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَلِ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name.">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="مَوعِدُهُم" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive">مَوعِدُهُم</button>
    <button class="word-link" type="button" data-word="وَالسّاعَةُ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name.">وَالسّاعَةُ</button>

    <button class="word-link" type="button" data-word="وَأَمَرُّ" data-root="M R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing or recurrence; also bitterness or strength in different forms.">وَأَمَرُّ</button>

  <p class="english-verse">Rather, the Hour is their appointed time, and the Hour is more grievous and more bitter.</p>
