<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qamar 54:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَنادَوا" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="Then called their companion." data-learn-more="/quran-terminology/en/roots/n-d-y/">فَنادَوا</button>
    <button class="word-link" type="button" data-word="صاحِبَهُم" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="Their companion, the member of the people summoned.">صاحِبَهُم</button>
    <button class="word-link" type="button" data-word="فَتَعاطىٰ" data-root="AYN TT W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-tt-w/" data-root-meaning="Giving or bestowing; taʿāṭī means undertaking or taking something." data-context="Then undertook the act of killing the she-camel.">فَتَعاطىٰ</button>
    <button class="word-link" type="button" data-word="فَعَقَرَ" data-root="AYN Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-q-r/" data-root-meaning="Hamstringing or disabling; ʿāqir means barren in another branch." data-context="Then hamstrung or killed the she-camel.">فَعَقَرَ</button>
  </p>
  <p class="english-verse">They called their companion, and he undertook it and hamstrung her.</p>
