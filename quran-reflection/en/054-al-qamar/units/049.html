  <h2 class="ayah-title">Al-Qamar 54:49</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="خَلَقنٰهُ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">خَلَقنٰهُ</button>
    <button class="word-link" type="button" data-word="بِقَدَرٍ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">بِقَدَرٍ</button>
  </p>
  <p class="english-verse">We have created everything according to a measure.</p>
