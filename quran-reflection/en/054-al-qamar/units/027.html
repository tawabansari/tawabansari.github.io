<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qamar 54:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="مُرسِلُوا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="We are sending; the sending of the she-camel in divine speech.">مُرسِلُوا</button>
    <button class="word-link" type="button" data-word="النّاقَةِ" data-root="N W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-w-q/" data-root-meaning="A she-camel." data-context="The she-camel; what is sent as a trial for the people.">النّاقَةِ</button>
    <button class="word-link" type="button" data-word="فِتنَةً" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction" data-context="A trial; the she-camel’s role concerning the people.">فِتنَةً</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="فَارتَقِبهُم" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="So watch them; addressed to Ṣāliḥ concerning his people’s conduct in the she-camel’s trial. Iṣṭabir separately commands patience." data-learn-more="/quran-terminology/en/roots/r-q-b/">فَارتَقِبهُم</button>
    <button class="word-link" type="button" data-word="وَاصطَبِر" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="And be patient; a separate command alongside keeping watch.">وَاصطَبِر</button>
  </p>
  <p class="english-verse">We are sending the she-camel as a trial for them. So watch them and be patient.</p>
</section>
