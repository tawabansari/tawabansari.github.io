<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qamar 54:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خُشَّعًا" data-root="KH SH ʿ (KH SH Ayn)" data-learn-more="/quran-terminology/en/roots/kh-sh-ayn/" data-root-meaning="Lowering, subsiding, softening, becoming still, and moving out of hardness, raisedness, noise, or resistance before truth and greatness." data-context="Downcast, describing the eyes of those emerging.">خُشَّعًا</button>
    <button class="word-link" type="button" data-word="أَبصٰرُهُم" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Their eyes, those of the people emerging from graves.">أَبصٰرُهُم</button>
    <button class="word-link" type="button" data-word="يَخرُجونَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="They emerge, people coming forth from the graves.">يَخرُجونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَجداثِ" data-root="J D TH" data-root-meaning="A grave; the place where a dead person is buried." data-context="The graves from which people emerge in the Resurrection scene." data-learn-more="/quran-terminology/en/roots/j-d-th/">الأَجداثِ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّهُم</button>
    <button class="word-link" type="button" data-word="جَرادٌ" data-root="J R D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-r-d/" data-root-meaning="Becoming bare or stripped; jarād in the Qur’an denotes locusts." data-context="Locusts, the comparison used for the emerging multitude.">جَرادٌ</button>
    <button class="word-link" type="button" data-word="مُنتَشِرٌ" data-root="N SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-r/" data-root-meaning="Spreading or dispersing; nushūr denotes rising or resurrection." data-context="Scattered, describing the locusts in the comparison with those emerging.">مُنتَشِرٌ</button>
  </p>
  <p class="english-verse">they will emerge from the graves with downcast eyes, as though they were scattered locusts,</p>
</section>
