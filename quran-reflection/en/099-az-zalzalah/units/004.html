  <h2 class="ayah-title">Az-Zalzalah 99:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day; the time of the stated event.">يَومَئِذٍ</button>

  </p>
  <p class="english-verse">on that day it will recount its news,</p>
