<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zalzalah 99:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="That day: the day of the events described in the surah.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَصدُرُ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="Come forth or depart: the people’s movement that day.">يَصدُرُ</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="The people: those who will be shown their deeds.">النّاسُ</button>
    <button class="word-link" type="button" data-word="أَشتاتًا" data-root="SH T T" data-learn-more="/quran-terminology/en/roots/sh-t-t/" data-root-meaning="Separation, dispersion, or diversity in position, kind, or direction; shatta: diverse or divided; ashtatan: separately or dispersed." data-context="Separately or dispersed: the people’s condition when coming forth or departing.">أَشتاتًا</button>
    <button class="word-link" type="button" data-word="لِيُرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="So that they may be shown: passive, concerning the viewing of deeds.">لِيُرَوا</button>
    <button class="word-link" type="button" data-word="أَعمٰلَهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Their deeds: what they did and will be shown.">أَعمٰلَهُم</button>
  </p>
  <p class="english-verse">On that day people will come forth in scattered groups to be shown their deeds.</p>
</section>
