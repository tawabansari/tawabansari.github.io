<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And she said; Moses’ mother giving the instruction.">وَقالَت</button>
    <button class="word-link" type="button" data-word="لِأُختِهِ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Sister; figuratively, a feminine counterpart or member of the same set." data-context="To his sister; the addressee of the command to follow.">لِأُختِهِ</button>
    <button class="word-link" type="button" data-word="قُصّيهِ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="Follow him; a feminine singular imperative with a pronoun referring to Moses. The verb itself does not specify the method." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">قُصّيهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبَصُرَت" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Then she saw; observation expressed separately from following.">فَبَصُرَت</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="جُنُبٍ" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="A distance or side; within the expression of seeing from afar." data-learn-more="/quran-terminology/en/roots/j-n-b/">جُنُبٍ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality" data-context="In lā yashʿurūn: they were unaware; denying their awareness of the connection and following.">يَشعُرونَ</button>
  </p>
  <p class="english-verse">She said to his sister: Follow him. So she watched him from a distance while they were unaware.</p>
