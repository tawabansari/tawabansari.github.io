<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="وَرَدَ" data-root="W R D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-r-d/" data-root-meaning="Arriving at water or a destination; wird denotes arrival or an allotted portion." data-context="He came to; Moses arriving at the water of Midian.">وَرَدَ</button>
    <button class="word-link" type="button" data-word="ماءَ" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Water; here, the watering place in Midian.">ماءَ</button>
    <button class="word-link" type="button" data-word="مَديَنَ" data-root-note="Proper name; no root has been assigned.">مَديَنَ</button>
    <button class="word-link" type="button" data-word="وَجَدَ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="He found; encountering a group of people at the water.">وَجَدَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="أُمَّةً" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="A group; people engaged in watering.">أُمَّةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People; those forming the group of waterers.">النّاسِ</button>
    <button class="word-link" type="button" data-word="يَسقونَ" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="They were watering; in context, watering their animals.">يَسقونَ</button>
    <button class="word-link" type="button" data-word="وَوَجَدَ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="And he found; encountering the two women apart from the group.">وَوَجَدَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِمُ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Apart from them or at a distance from them; the women’s position relative to the group.">دونِهِمُ</button>
    <button class="word-link" type="button" data-word="امرَأَتَينِ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="Two women; those Moses sees holding back.">امرَأَتَينِ</button>
    <button class="word-link" type="button" data-word="تَذودانِ" data-root="DH W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-d/" data-root-meaning="Driving away or holding back." data-context="They were holding back; in context, keeping their animals away from the water.">تَذودانِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said; introducing Moses’ question to the women.">قالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="خَطبُكُما" data-root="KH TT B" data-root-meaning="Speaking to an addressee and raising or pursuing a matter; in other uses, an affair or occurrence, and requesting marriage." data-context="Your business or difficulty, you two; Moses asking about the two women at the water of Midian." data-learn-more="/quran-terminology/en/roots/kh-tt-b/">خَطبُكُما</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَتا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="The two said; the women’s reply to Moses.">قالَتا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="نَسقى" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="We water; negated here until the shepherds leave with their flocks.">نَسقى</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يُصدِرَ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="Take away; in Hafs’s reading, the shepherds taking the animals away from the water.">يُصدِرَ</button>
    <button class="word-link" type="button" data-word="الرِّعاءُ" data-root="R ʿ Y" data-learn-more="/quran-terminology/en/roots/r-ayn-y/" data-root-meaning="Raʿā: grazing, care, and attending to what has been entrusted to one’s concern" data-context="The shepherds; those whose departure with their animals precedes the women’s watering.">الرِّعاءُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَبونا" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="And our father; the women’s father, whose condition they explain.">وَأَبونا</button>
    <button class="word-link" type="button" data-word="شَيخٌ" data-root="SH Y KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-y-kh/" data-root-meaning="Old age; shaykh denotes an elderly man." data-context="An elderly man; describing the women’s father.">شَيخٌ</button>
    <button class="word-link" type="button" data-word="كَبيرٌ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Advanced in age; in shaykh kabir, describing their father.">كَبيرٌ</button>
  </p>
  <p class="english-verse">When he reached the water of Midian, he found a group of people watering, and apart from them two women holding back. He said: What is your situation? They said: We do not water until the shepherds depart, and our father is an elderly man.</p>
</section>
