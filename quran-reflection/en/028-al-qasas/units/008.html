<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَالتَقَطَهُ" data-root="L Q TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-q-tt/" data-root-meaning="Finding and picking up." data-context="Then picked him up.">فَالتَقَطَهُ</button>
    <button class="word-link" type="button" data-word="ءالُ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="The household of.">ءالُ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="لِيَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="To become for them, expressing the event’s outcome.">لِيَكونَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَدُوًّا" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="An enemy.">عَدُوًّا</button>
    <button class="word-link" type="button" data-word="وَحَزَنًا" data-root="Ḥ Z N" data-learn-more="/quran-terminology/en/roots/h-z-n/" data-root-meaning="Grief, heaviness of the heart, and the inner path becoming rough and difficult" data-context="And a cause of grief.">وَحَزَنًا</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَهٰمٰنَ" data-root-note="Proper name; no root has been assigned.">وَهٰمٰنَ</button>
    <button class="word-link" type="button" data-word="وَجُنودَهُما" data-root="J N D" data-root-meaning="Forces gathered for assistance, support, and joint action; in military use, an army." data-context="And their troops, the forces of Pharaoh and Hāmān." data-learn-more="/quran-terminology/en/roots/j-n-d/">وَجُنودَهُما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, describing their condition.">كانوا</button>
    <button class="word-link" type="button" data-word="خٰطِـٔينَ" data-root="KH Ṭ A" data-learn-more="/quran-terminology/en/roots/kh-tt-a/" data-root-meaning="Slipping from the right path, missing the mark, going wrong; and in some forms, conscious deviation from truth." data-context="In the wrong and sinful.">خٰطِـٔينَ</button>
  </p>
  <p class="english-verse">Pharaoh’s household picked him up, so that he would become an enemy and a sorrow to them. Pharaoh, Haman, and their soldiers were wrongdoers.</p>
