<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:85</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="فَرَضَ" data-root="F R DAD (F R Ḍ)" data-learn-more="/quran-terminology/en/roots/f-r-dad/" data-root-meaning="From marking and assigning a share to an appointed matter." data-context="Prescribed: laying the Qur’an’s responsibility on the addressee.">فَرَضَ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text whose responsibility is laid upon the addressee." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانَ</button>
    <button class="word-link" type="button" data-word="لَرادُّكَ" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="Will return you: the promise of return.">لَرادُّكَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="مَعادٍ" data-root="AYN W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-d/" data-root-meaning="Returning or repeating; ʿīd is a recurring occasion; ʿĀd is also a people&#x27;s proper name." data-context="A place of return: the destination promised.">مَعادٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say: introducing the response.">قُل</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord: the possessor of the stated knowledge.">رَبّى</button>
    <button class="word-link" type="button" data-word="أَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knows best: knowledge of guidance and error.">أَعلَمُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Comes: bringing guidance in the following expression.">جاءَ</button>
    <button class="word-link" type="button" data-word="بِالهُدىٰ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="With guidance: the guiding message.">بِالهُدىٰ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ضَلٰلٍ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Error: the state of straying.">ضَلٰلٍ</button>
    <button class="word-link" type="button" data-word="مُبينٍ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Clear: describing that error.">مُبينٍ</button>
  </p>
  <p class="english-verse">The One who ordained the Quran for you will return you to a place of return. Say: My Lord knows best who has brought guidance and who is in clear error.</p>
</section>
