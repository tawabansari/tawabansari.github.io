  <h2 class="ayah-title">Al-Qasas 28:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَصبَحَ" data-root="SAD B H" data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning and the beginning of daylight; aṣbaḥa: entering morning or becoming; miṣbāḥ: a lamp." data-context="Became: the heart of Moses’ mother entering the described condition.">وَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="فُؤادُ" data-root="F A D" data-root-meaning="“heart” is the most appropriate basic equivalent for fuʾād: a heart that Qur’anic usage can connect with reception, understanding, inclination, responsiveness, and steadfastness." data-learn-more="/quran-terminology/en/roots/f-a-d/" data-context="The heart: the inward condition of Moses’ mother.">فُؤادُ</button>
    <button class="word-link" type="button" data-word="أُمِّ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="Mother: identifying Moses’ mother.">أُمِّ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="فٰرِغًا" data-root="F R GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-gh/" data-root-meaning="Becoming empty or finishing an occupation; ifrāgh means pouring out." data-context="Empty: describing the heart’s condition.">فٰرِغًا</button>

    <button class="word-link" type="button" data-word="كادَت" data-root="K W D" data-learn-more="/quran-terminology/en/roots/k-w-d/" data-root-meaning="To come close to the threshold of occurrence, to stand at the edge of doing or becoming, and to show intense readiness or pressure toward an event" data-context="Was on the point of: nearly disclosing the matter.">كادَت</button>
    <button class="word-link" type="button" data-word="لَتُبدى" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="Disclose it: the possible revealing of the matter concerning Moses.">لَتُبدى</button>

    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="رَبَطنا" data-root="R B TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-b-tt/" data-root-meaning="Tying or securing; ribāṭ and murābaṭah involve readiness and steadfast stationing." data-context="We strengthened: firming and steadying her heart.">رَبَطنا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَلبِها" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Her heart: the seat of the steadiness described.">قَلبِها</button>

    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believers: the condition supported by the strengthening of her heart.">المُؤمِنينَ</button>
  </p>
  <p class="english-verse">Moses’ mother’s heart became empty. She almost disclosed him, had We not strengthened her heart so that she would be among the believers.</p>
