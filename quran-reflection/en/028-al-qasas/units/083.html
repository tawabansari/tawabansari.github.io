  <h2 class="ayah-title">Al-Qasas 28:83</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">تِلكَ</button>
    <button class="word-link" type="button" data-word="الدّارُ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">الدّارُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةُ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">الـٔاخِرَةُ</button>
    <button class="word-link" type="button" data-word="نَجعَلُها" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">نَجعَلُها</button>

    <button class="word-link" type="button" data-word="يُريدونَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدونَ</button>

    <button class="word-link" type="button" data-word="وَالعٰقِبَةُ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">وَالعٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="لِلمُتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">لِلمُتَّقينَ</button>
  </p>
  <p class="english-verse">That abode of the Hereafter We assign to those who seek neither supremacy in the earth nor corruption. And the final outcome belongs to the mindful.</p>
