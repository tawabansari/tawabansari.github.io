<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Then We seized him.">فَأَخَذنٰهُ</button>
    <button class="word-link" type="button" data-word="وَجُنودَهُ" data-root="J N D" data-root-meaning="Forces gathered for assistance, support, and joint action; in military use, an army." data-context="And his troops, the forces accompanying Pharaoh." data-learn-more="/quran-terminology/en/roots/j-n-d/">وَجُنودَهُ</button>
    <button class="word-link" type="button" data-word="فَنَبَذنٰهُم" data-root="N B DH" data-learn-more="/quran-terminology/en/roots/n-b-dh/" data-root-meaning="Nabadha: casting, setting aside, and separation from a previous position" data-context="Then We cast them.">فَنَبَذنٰهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="Y M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-m/" data-root-meaning="Intending or directing oneself; tayammum means aiming for; yamm is a sea or great body of water in another branch." data-context="The sea.">اليَمِّ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَانظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Then look.">فَانظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was, in the question about the outcome.">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass" data-context="The outcome of.">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">So We seized him and his soldiers and cast them into the water. See how the wrongdoers ended.</p>
</section>
