<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:79</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَخَرَجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Then he came out; Qārūn appeared before his people.">فَخَرَجَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="His people, before whom Qārūn appeared.">قَومِهِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="زينَتِهِ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="His adornment and splendor, in which Qārūn appeared.">زينَتِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said; introducing the speech of those wishing for Qārūn’s advantages.">قالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُريدونَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="They desire; those who seek worldly life.">يُريدونَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةَ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life; with al-dunyā, the life of this world.">الحَيوٰةَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Nearer; describing the life of this world in al-ḥayāt al-dunyā.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="يٰلَيتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰلَيتَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    <button class="word-link" type="button" data-word="مِثلَ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="The like or equivalent; wishing to possess the like of what Qārūn has been given.">مِثلَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أوتِىَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Was given; a form IV passive verb concerning what Qārūn has received.">أوتِىَ</button>
    <button class="word-link" type="button" data-word="قٰرونُ" data-root-note="Proper name; no root has been assigned.">قٰرونُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَذو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَذو</button>
    <button class="word-link" type="button" data-word="حَظٍّ" data-root="H ZHA ZHA" data-root-meaning="A share or portion that reaches someone or is assigned to them. It may be material, legal, spiritual, or related to the Hereafter, and may vary in amount and value." data-context="A share or endowment; in the speech of those desiring worldly life, Qārūn’s great share of wealth and worldly splendor." data-learn-more="/quran-terminology/en/roots/h-zha-zha/">حَظٍّ</button>
    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Great; describing the portion the speakers see in Qārūn’s advantages.">عَظيمٍ</button>
  </p>
  <p class="english-verse">He came out before his people in his adornment. Those who desired worldly life said: If only we had the like of what Qarun has been given. He has a great share indeed.</p>
</section>
