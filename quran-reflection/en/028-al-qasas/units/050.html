<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَستَجيبوا" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/">يَستَجيبوا</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    <button class="word-link" type="button" data-word="فَاعلَم" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">فَاعلَم</button>
    <button class="word-link" type="button" data-word="أَنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّما</button>
    <button class="word-link" type="button" data-word="يَتَّبِعونَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">يَتَّبِعونَ</button>
    <button class="word-link" type="button" data-word="أَهواءَهُم" data-root="H W Y" data-learn-more="/quran-terminology/en/roots/h2-w-y/" data-root-meaning="Falling, being drawn in a direction, and personal desire">أَهواءَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَضَلُّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">أَضَلُّ</button>
    <button class="word-link" type="button" data-word="مِمَّنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمَّنِ</button>
    <button class="word-link" type="button" data-word="اتَّبَعَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">اتَّبَعَ</button>
    <button class="word-link" type="button" data-word="هَوىٰهُ" data-root="H W Y" data-learn-more="/quran-terminology/en/roots/h2-w-y/" data-root-meaning="Falling, being drawn in a direction, and personal desire">هَوىٰهُ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">هُدًى</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">يَهدِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القَومَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">If they do not answer you, know that they only follow their desires. Who is more astray than one who follows his desire without guidance from The God? The God does not guide the wrongdoing people.</p>
</section>
