<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَصبَحَ" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp." data-context="Then entered the morning: Moses began the following day in the city, fearful and watchful.">فَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="المَدينَةِ" data-root="M D N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-d-n/" data-root-meaning="Madīnah is a town or city; its derivation from m-d-n or d-y-n is disputed." data-context="In the city: the setting after the previous day’s incident.">المَدينَةِ</button>
    <button class="word-link" type="button" data-word="خائِفًا" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Fearful: Moses’ condition after the previous day’s killing.">خائِفًا</button>
    <button class="word-link" type="button" data-word="يَتَرَقَّبُ" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="He kept watch and waited; Moses was alert for what might happen in the city. Khāʾifan separately expresses fear." data-learn-more="/quran-terminology/en/roots/r-q-b/">يَتَرَقَّبُ</button>
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="الَّذِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذِى</button>
    <button class="word-link" type="button" data-word="استَنصَرَهُ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="Had sought his help: the same man who requested Moses’ aid the previous day.">استَنصَرَهُ</button>
    <button class="word-link" type="button" data-word="بِالأَمسِ" data-root="A M S" data-learn-more="/quran-terminology/en/roots/a-m-s/" data-root-meaning="The day preceding the present day or the day under discussion; more broadly, the recent past or an elapsed time contrasted with the present situation." data-context="Yesterday: the particular preceding day when the man had sought Moses’ help.">بِالأَمسِ</button>
    <button class="word-link" type="button" data-word="يَستَصرِخُهُ" data-root="SAD R KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-kh/" data-root-meaning="Crying out and answering a cry; ṣarīkh can mean one seeking or providing help." data-context="Cries out to him for help: the same man’s renewed request to Moses.">يَستَصرِخُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said: Moses addressing the man who again sought his help.">قالَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="إِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكَ</button>
    <button class="word-link" type="button" data-word="لَغَوِىٌّ" data-root="GH W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-w-y/" data-root-meaning="Error or leading away from sound guidance." data-context="Clearly astray: Moses’ critical description of that man.">لَغَوِىٌّ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Manifest or clear: qualifying the waywardness in Moses’ statement.">مُبينٌ</button>
  </p>
  <p class="english-verse">He was in the city, fearful and watchful, when the one who had sought his help the day before cried out to him. Moses said to him: You are clearly astray.</p>
</section>
