  <h2 class="ayah-title">Al-Qasas 28:43</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ءاتَينا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We gave to Moses.">ءاتَينا</button>
    <button class="word-link" type="button" data-word="موسَى" data-root-note="Proper name; no root has been assigned.">موسَى</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Book given to Moses.">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After.">بَعدِ</button>

    <button class="word-link" type="button" data-word="أَهلَكنَا" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="We destroyed the earlier generations." data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَهلَكنَا</button>

    <button class="word-link" type="button" data-word="بَصائِرَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="Insights and means of discernment.">بَصائِرَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="For people.">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="وَهُدًى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="And guidance.">وَهُدًى</button>

    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَذَكَّرونَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="So that they may take heed.">يَتَذَكَّرونَ</button>
  </p>
  <p class="english-verse">After We destroyed the earlier generations, We gave Moses the Book as insights for people, guidance and mercy, so that they might remember.</p>
