<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنٰهُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">وَجَعَلنٰهُم</button>
    <button class="word-link" type="button" data-word="أَئِمَّةً" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination">أَئِمَّةً</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">يَدعونَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّارِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">وَيَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُنصَرونَ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing">يُنصَرونَ</button>
  </p>
  <p class="english-verse">We made them leaders calling to the Fire, and on the Day of Resurrection they will not be helped.</p>
