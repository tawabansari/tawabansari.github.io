<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:64</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقيلَ</button>

    <button class="word-link" type="button" data-word="شُرَكاءَكُم" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">شُرَكاءَكُم</button>

    <button class="word-link" type="button" data-word="يَستَجيبوا" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/">يَستَجيبوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَرَأَوُا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">وَرَأَوُا</button>

    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُم</button>

    <button class="word-link" type="button" data-word="يَهتَدونَ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">يَهتَدونَ</button>
  </p>
  <p class="english-verse">It will be said: Call your partners. They will call them, but they will not answer them, and they will see the punishment. If only they had been guided.</p>
