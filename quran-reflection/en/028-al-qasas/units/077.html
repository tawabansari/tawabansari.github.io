<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:77</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَابتَغِ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit">وَابتَغِ</button>
    <button class="word-link" type="button" data-word="فيما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيما</button>
    <button class="word-link" type="button" data-word="ءاتىٰكَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">ءاتىٰكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الدّارَ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">الدّارَ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">الـٔاخِرَةَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَنسَ" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">تَنسَ</button>
    <button class="word-link" type="button" data-word="نَصيبَكَ" data-root="N Ṣ B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sad-b/" data-root-meaning="Setting up; naṣab is fatigue; naṣīb is a share; nuṣub are cultic stones.">نَصيبَكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَحسِن" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">وَأَحسِن</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَما</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَبغِ" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit">تَبغِ</button>
    <button class="word-link" type="button" data-word="الفَسادَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order">الفَسادَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-root-meaning="Ḥubb: love or affection; ḥabb and ḥabbah: grain or a seed. These branches are not interchangeable.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order">المُفسِدينَ</button>
  </p>
  <p class="english-verse">Seek the abode of the Hereafter through what The God has given you, and do not forget your share of this world. Do good as The God has done good to you, and do not seek corruption in the earth. The God does not love the corrupters.</p>
</section>
