<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="أَتىٰها" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="He reached it, referring to Moses.">أَتىٰها</button>
    <button class="word-link" type="button" data-word="نودِىَ" data-root="N D W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-d-y/" data-root-meaning="Calling or gathering; nādī and nadiyy denote an assembly; also moisture or dew." data-context="A call was made, introducing the address to Moses.">نودِىَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شٰطِئِ" data-root="SH TT A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-tt-a/" data-root-meaning="A waterside or bank; shaṭʾ is a plant&#x27;s new shoot." data-context="The bank or side of the valley.">شٰطِئِ</button>
    <button class="word-link" type="button" data-word="الوادِ" data-root="W D Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-d-y/" data-root-meaning="Wādī is a valley or watercourse; diyah is financial compensation for injury in another branch." data-context="The valley where the call occurs.">الوادِ</button>
    <button class="word-link" type="button" data-word="الأَيمَنِ" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="The right-hand side of the valley.">الأَيمَنِ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="البُقعَةِ" data-root="B Q AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-q-ayn/" data-root-meaning="A patch or portion of land distinguishable from its surroundings." data-context="A spot or patch of ground.">البُقعَةِ</button>
    <button class="word-link" type="button" data-word="المُبٰرَكَةِ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="The spot or patch of ground endowed with good and blessing at Moses’ call." data-learn-more="/quran-terminology/en/roots/b-r-k/">المُبٰرَكَةِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشَّجَرَةِ" data-root="SH J R" data-learn-more="/quran-terminology/en/roots/sh-j-r/" data-root-meaning="Branching, ramification, interweaving, and complex extension from a single origin" data-context="The tree, mentioned in locating the call.">الشَّجَرَةِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="Proper name; no root has been assigned.">يٰموسىٰ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَنَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="رَبُّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Lord, identifying the divine speaker.">رَبُّ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="All worlds.">العٰلَمينَ</button>
  </p>
  <p class="english-verse">When he reached it, a call came from the right bank of the valley, in the blessed place, from the tree: Moses, I am The God, Lord of all worlds.</p>
</section>
