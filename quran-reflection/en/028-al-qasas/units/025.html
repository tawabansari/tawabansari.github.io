<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَجاءَتهُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Then she came to him; one of the women approaching Moses.">فَجاءَتهُ</button>
    <button class="word-link" type="button" data-word="إِحدىٰهُما" data-root="A Ḥ D" data-root-meaning="Aḥad: one, one of, and no one under negation" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-context="One of the two; the woman bringing her father’s invitation.">إِحدىٰهُما</button>
    <button class="word-link" type="button" data-word="تَمشى" data-root="M SH Y" data-learn-more="/quran-terminology/en/roots/m-sh-y/" data-root-meaning="Walking, stepping, moving upon the earth; and more broadly, moving forward in a path, manner, behavior, or way of life" data-context="Walking; the woman’s manner of movement.">تَمشى</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="استِحياءٍ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Modesty; describing the woman’s approach.">استِحياءٍ</button>
    <button class="word-link" type="button" data-word="قالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="She said; conveying her father’s invitation.">قالَت</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="أَبى" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="My father; the person inviting Moses.">أَبى</button>
    <button class="word-link" type="button" data-word="يَدعوكَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Invites you; calling Moses to the father.">يَدعوكَ</button>
    <button class="word-link" type="button" data-word="لِيَجزِيَكَ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="To reward you; the invitation’s purpose in her statement.">لِيَجزِيَكَ</button>
    <button class="word-link" type="button" data-word="أَجرَ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action" data-context="A reward; for the watering.">أَجرَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="سَقَيتَ" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="You watered; Moses’ earlier help for the two women.">سَقَيتَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَهُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to him; Moses’ arrival at the father.">جاءَهُ</button>
    <button class="word-link" type="button" data-word="وَقَصَّ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="And he recounted; Moses related his circumstances to the two women’s father." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">وَقَصَّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="القَصَصَ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="The account; what Moses recounted to his listener." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">القَصَصَ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said; the father’s reply to Moses’ account.">قالَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَخَف" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="In lā takhaf: do not fear; a reassuring command.">تَخَف</button>
    ۖ
    <button class="word-link" type="button" data-word="نَجَوتَ" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety" data-context="You have escaped; Moses’ deliverance from the wrongdoing group.">نَجَوتَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="The people; those from whom Moses has escaped." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">القَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrongdoers; describing that group.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">Then one of the two came to him, walking modestly. She said: My father calls you to reward you for watering for us. When he came to him and recounted the story, he said: Do not fear. You have escaped the wrongdoing people.</p>
</section>
