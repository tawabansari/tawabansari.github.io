<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:74</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the day of calling and questioning.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يُناديهِم" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="He calls them, asking about alleged partners." data-learn-more="/quran-terminology/en/roots/n-d-y/">يُناديهِم</button>
    <button class="word-link" type="button" data-word="فَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then says, questioning about partners.">فَيَقولُ</button>
    <button class="word-link" type="button" data-word="أَينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَينَ</button>
    <button class="word-link" type="button" data-word="شُرَكاءِىَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="My partners, the alleged associates.">شُرَكاءِىَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, referring to past claims.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَزعُمونَ" data-root="Z AYN M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-ayn-m/" data-root-meaning="An assertion or claim; zaʿīm means a responsible party or guarantor, according to context." data-context="You alleged, concerning partnership.">تَزعُمونَ</button>
  </p>
  <p class="english-verse">And the day He calls them and says: Where are My partners whom you used to claim?</p>
