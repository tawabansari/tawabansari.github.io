<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said, introducing the proposal of marriage and service.">قالَ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="أُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="I intend, expressing the proposer’s wish.">أُريدُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="أُنكِحَكَ" data-root="N K H" data-learn-more="/quran-terminology/en/roots/n-k-h/" data-root-meaning="Marriage and establishing a marital bond; marrying someone to another or seeking marriage, according to form; a use for intercourse is also attested in Arabic." data-context="Marry to you, the proposed arrangement.">أُنكِحَكَ</button>
    <button class="word-link" type="button" data-word="إِحدَى" data-root="A Ḥ D" data-root-meaning="Aḥad: one, one of, and no one under negation" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-context="One of two, the choice between two daughters.">إِحدَى</button>
    <button class="word-link" type="button" data-word="ابنَتَىَّ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-context="My two daughters, one of whom is the subject of the proposal." data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole In kinship uses, a son, daughter, children, or descendants.">ابنَتَىَّ</button>
    <button class="word-link" type="button" data-word="هٰتَينِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰتَينِ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَأجُرَنى" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action" data-context="Work for me, service for the specified term.">تَأجُرَنى</button>
    <button class="word-link" type="button" data-word="ثَمٰنِىَ" data-root="TH M N" data-learn-more="/quran-terminology/en/roots/th-m-n/" data-root-meaning="Price, value in exchange, and what is taken in return for something else." data-context="Eight, the number of years of service.">ثَمٰنِىَ</button>
    <button class="word-link" type="button" data-word="حِجَجٍ" data-root="Ḥ J J" data-learn-more="/quran-terminology/en/roots/h-j-j/" data-context="Years, the unit of the service period." data-root-meaning="From Intending a Destination and Hajj to Argument and Reasoned Confrontation In ḥijaj, years.">حِجَجٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="أَتمَمتَ" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete." data-context="Complete, extending the period to ten years.">أَتمَمتَ</button>
    <button class="word-link" type="button" data-word="عَشرًا" data-root="AYN SH R" data-root-meaning="Ten and its numerical forms and ratios; association, companionship, kindred, and an assembly. ʿIshār: she-camels approaching delivery." data-context="Ten, completing the period of service to ten years." data-learn-more="/quran-terminology/en/roots/ayn-sh-r/">عَشرًا</button>
    <button class="word-link" type="button" data-word="فَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمِن</button>
    <button class="word-link" type="button" data-word="عِندِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندِكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Intend; negated, denying an intention to impose hardship.">أُريدُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="أَشُقَّ" data-root="SH Q Q" data-learn-more="/quran-terminology/en/roots/sh-q-q/" data-root-meaning="Splitting, breach, side, hardship, distance, and oppositional rupture" data-context="Make things difficult for you, the intention denied by the proposer.">أَشُقَّ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="سَتَجِدُنى" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="You will find me, the assurance concerning his conduct.">سَتَجِدُنى</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills, qualifying the assurance by Allah’s will.">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحينَ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="The righteous, the conduct he promises to display.">الصّٰلِحينَ</button>
  </p>
  <p class="english-verse">He said: I wish to marry one of these two daughters of mine to you, on condition that you work for me for eight years. If you complete ten, that is from you. I do not wish to make things hard for you. You will find me, if The God wills, among the righteous.</p>
</section>
