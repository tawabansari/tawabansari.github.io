<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qasas 28:82</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَصبَحَ" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp." data-context="And entered a new condition: those who envied Qārūn now speak differently; the verb can also express entering the morning.">وَأَصبَحَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="تَمَنَّوا" data-root="M N Y" data-learn-more="/quran-terminology/en/roots/m-n-y/" data-root-meaning="From Apportioning and Wishing to Recitation, Amānī, and Semen" data-context="Had wished: the group’s earlier desire to possess Qārūn’s position.">تَمَنَّوا</button>
    <button class="word-link" type="button" data-word="مَكانَهُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="His position: Qārūn’s situation and advantages that the group had desired.">مَكانَهُ</button>
    <button class="word-link" type="button" data-word="بِالأَمسِ" data-root="A M S" data-learn-more="/quran-terminology/en/roots/a-m-s/" data-root-meaning="The day preceding the present day or the day under discussion; more broadly, the recent past or an elapsed time contrasted with the present situation." data-context="Yesterday or the recent past: the time of their earlier wish, contrasted with their new judgment after Qārūn’s fate.">بِالأَمسِ</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say: reporting the new understanding of those who had desired Qārūn’s position.">يَقولونَ</button>
    <button class="word-link" type="button" data-word="وَيكَأَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَيكَأَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَبسُطُ" data-root="B S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-s-tt/" data-root-meaning="Unfolding, spreading, or extending; expansion can concern space, capacity, or resources." data-context="Expands: The God’s widening of provision for whichever of His servants He wills.">يَبسُطُ</button>
    <button class="word-link" type="button" data-word="الرِّزقَ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="Provision and material means, whose expansion or restriction the people discuss.">الرِّزقَ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills: expansion of provision is attributed to The God’s will.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Of His servants: those whose provision is expanded or restricted.">عِبادِهِ</button>
    <button class="word-link" type="button" data-word="وَيَقدِرُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="And restricts: limiting provision, contrasted with expanding it.">وَيَقدِرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="مَنَّ" data-root="M N N" data-learn-more="/quran-terminology/en/roots/m-n-n/" data-root-meaning="Granting a marked favor; holding that favor over someone; releasing without compensation; and cutting off, diminishing, or ending." data-context="Favored us: the group regards escaping Qārūn’s fate as a favor to them.">مَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    <button class="word-link" type="button" data-word="لَخَسَفَ" data-root="KH S F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-s-f/" data-root-meaning="Sinking into the earth; also dimming or eclipsing of the moon." data-context="Would have caused the earth to swallow us too: the stated consequence had that favor been absent.">لَخَسَفَ</button>
    <button class="word-link" type="button" data-word="بِنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِنا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيكَأَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَيكَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success" data-context="Do not prosper: within the negative clause concerning the disbelievers’ ultimate outcome.">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="The disbelievers, whose prosperity is denied at the close of the speech.">الكٰفِرونَ</button>
  </p>
  <p class="english-verse">Those who had wished for his position the day before began saying: Ah, The God expands provision for whom He wills of His servants and restricts it. Had The God not favored us, He would have made the earth swallow us. Ah, the disbelievers do not prosper.</p>
</section>
