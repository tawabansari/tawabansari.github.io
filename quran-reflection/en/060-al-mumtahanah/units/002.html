<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mumtahanah 60:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="يَثقَفوكُم" data-root="TH Q F" data-root-meaning="Finding or gaining access to a person in a particular situation, sometimes with dominance or control over them." data-context="They gain the upper hand over you; the enemies obtaining power over the addressees." data-learn-more="/quran-terminology/en/roots/th-q-f/">يَثقَفوكُم</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They will be; expressing their hostile stance.">يَكونوا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَعداءً" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="Enemies; their stance toward the addressees.">أَعداءً</button>
    <button class="word-link" type="button" data-word="وَيَبسُطوا" data-root="B S TT" data-root-meaning="Opening, spreading, and extending; context can apply this to ample provision or breadth of knowledge and capacity." data-context="And extend; the enemies’ hands and tongues reaching toward the addressees with evil." data-learn-more="/quran-terminology/en/roots/b-s-tt/">وَيَبسُطوا</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands; the means of harm in the threat.">أَيدِيَهُم</button>
    <button class="word-link" type="button" data-word="وَأَلسِنَتَهُم" data-root="L S N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-s-n/" data-root-meaning="The tongue as an organ, speech, or a people&#x27;s language." data-context="And their tongues; harmful speech alongside the hands.">وَأَلسِنَتَهُم</button>
    <button class="word-link" type="button" data-word="بِالسّوءِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="With evil; the direction of their hands and tongues.">بِالسّوءِ</button>
    <button class="word-link" type="button" data-word="وَوَدّوا" data-root="W D D" data-learn-more="/quran-terminology/en/roots/w-d-d/" data-root-meaning="Wadda: affection, wanting, and wishing something to happen" data-context="And they wished; their desire for the addressees’ disbelief.">وَوَدّوا</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="تَكفُرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="You disbelieve; what the enemies desire for the addressees.">تَكفُرونَ</button>
  </p>
  <p class="english-verse">If they gain the upper hand over you, they will be your enemies and stretch out their hands and tongues against you with harm; they wish that you would disbelieve.</p>
</section>
