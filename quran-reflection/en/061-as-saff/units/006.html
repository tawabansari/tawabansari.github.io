  <p class="english-verse">When Jesus, son of Mary, said, “Children of Israel, I am The God’s messenger to you, confirming the Torah before me and giving good news of a messenger to come after me whose name is Ahmad.” Then, when he came to them with clear signs, they said, “This is obvious magic.”</p>
