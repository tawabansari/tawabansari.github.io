<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saff 61:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأُخرىٰ" data-root="A KH R" data-root-meaning="After-ness, delay, otherness, and finality" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-context="and another; another benefit">وَأُخرىٰ</button>
    <button class="word-link" type="button" data-word="تُحِبّونَها" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="you love it">تُحِبّونَها</button>
    ۖ
    <button class="word-link" type="button" data-word="نَصرٌ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="help">نَصرٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَفَتحٌ" data-root="F T Ḥ" data-learn-more="/quran-terminology/en/roots/f-t-h/" data-root-meaning="From Opening What Is Closed to Access, Judgment, and a Decisive Opening" data-context="and an opening">وَفَتحٌ</button>
    <button class="word-link" type="button" data-word="قَريبٌ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="near">قَريبٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="and give glad tidings">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="the believers">المُؤمِنينَ</button>
  </p>
  <p class="english-verse">And another thing you love: help from The God and a near victory. Give the believers good news.</p>
</section>
