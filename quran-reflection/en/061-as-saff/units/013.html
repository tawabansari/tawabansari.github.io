  <h2 class="ayah-title">As-Saff 61:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأُخرىٰ" data-root="A KH R" data-root-meaning="After-ness, delay, otherness, and finality" data-learn-more="/quran-terminology/en/roots/a-kh-r/">وَأُخرىٰ</button>

    <button class="word-link" type="button" data-word="نَصرٌ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing">نَصرٌ</button>

  <p class="english-verse">And another thing you love: help from The God and a near victory. Give the believers good news.</p>
