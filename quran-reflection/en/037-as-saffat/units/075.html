<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:75</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="نادىٰنا" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="Called upon Us, Noah’s appeal and its answer." data-learn-more="/quran-terminology/en/roots/n-d-y/">نادىٰنا</button>
    <button class="word-link" type="button" data-word="نوحٌ" data-root-note="Proper name; no root has been assigned.">نوحٌ</button>
    <button class="word-link" type="button" data-word="فَلَنِعمَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="How excellent, praising those who answer.">فَلَنِعمَ</button>
    <button class="word-link" type="button" data-word="المُجيبونَ" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/" data-context="Those who answer, describing the response to Noah’s call.">المُجيبونَ</button>
  </p>
  <p class="english-verse">And Noah called to Us; how excellent We are at answering!</p>
