<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="زَيَّنَّا" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="We adorned; beautifying the nearer heaven with the stars’ adornment.">زَيَّنَّا</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heaven; in “the nearer heaven,” what is adorned with the stars.">السَّماءَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Nearer; qualifying the heaven described in the verse.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="بِزينَةٍ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="With an adornment; the stars specify what that adornment is.">بِزينَةٍ</button>
    <button class="word-link" type="button" data-word="الكَواكِبِ" data-root="K W K B" data-root-meaning="A star or visible bright celestial body; broader Arabic usages also apply the name to brilliance, a conspicuous blossom, or a great or prominent part of something." data-context="The stars; specifying the adornment of the nearer heaven here." data-learn-more="/quran-terminology/en/roots/k-w-k-b/">الكَواكِبِ</button>
  </p>
  <p class="english-verse">We adorned the nearest heaven with the adornment of the stars,</p>
