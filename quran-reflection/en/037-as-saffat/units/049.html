<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:49</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَأَنَّهُنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّهُنَّ</button>
    <button class="word-link" type="button" data-word="بَيضٌ" data-root="B Y DAD" data-root-meaning="B Y Ḍ fundamentally denotes whiteness as a colour characteristic, from which descriptions of being white and verbs of becoming white derive. Bayḍah names a bird’s egg, assigned to this family in early Arabic and extended to similes and resembling objects." data-context="Eggs, the image to which the heavenly companions are likened as protected eggs." data-learn-more="/quran-terminology/en/roots/b-y-dad/">بَيضٌ</button>
    <button class="word-link" type="button" data-word="مَكنونٌ" data-root="K N N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-n/" data-root-meaning="Covering or sheltering securely." data-context="Covered and protected from contact and harm.">مَكنونٌ</button>
  </p>
  <p class="english-verse">as though they were sheltered eggs.</p>
