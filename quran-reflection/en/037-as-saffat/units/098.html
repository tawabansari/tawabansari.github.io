  <h2 class="ayah-title">As-Saffat 37:98</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَرادوا" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="They intended, referring to their plan against Abraham.">فَأَرادوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="كَيدًا" data-root="K Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-y-d/" data-root-meaning="Planning or subtle strategy; its evaluation depends on context." data-context="A plot, their scheme against Abraham.">كَيدًا</button>
    <button class="word-link" type="button" data-word="فَجَعَلنٰهُمُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="So We made them, bringing them into a lower position.">فَجَعَلنٰهُمُ</button>

  <p class="english-verse">They intended a plot against him, so We made them the lowest.</p>
