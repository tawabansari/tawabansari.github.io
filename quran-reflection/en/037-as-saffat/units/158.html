<section class="ayah-block" id="ayah-158" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:158</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلوا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And they established; they claimed and attributed this relationship to Him.">وَجَعَلوا</button>
    <button class="word-link" type="button" data-word="بَينَهُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between Him, in the claimed relationship attributed to The God.">بَينَهُ</button>
    <button class="word-link" type="button" data-word="وَبَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="And between, introducing the other party in the claimed relationship.">وَبَينَ</button>
    <button class="word-link" type="button" data-word="الجِنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The jinn, the other party in the claimed kinship; interpretations of the precise referent differ.">الجِنَّةِ</button>
    <button class="word-link" type="button" data-word="نَسَبًا" data-root="N S B" data-learn-more="/quran-terminology/en/roots/n-s-b/" data-root-meaning="Kinship through birth and descent; more broadly, attributing a person or thing to its origin or owner." data-context="Claimed kinship between The God and the jinn, rejected in the surrounding passage.">نَسَبًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="عَلِمَتِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Have known; knowledge is attributed to the jinn.">عَلِمَتِ</button>
    <button class="word-link" type="button" data-word="الجِنَّةُ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The jinn, in the statement of their knowledge of being brought forth.">الجِنَّةُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَمُحضَرونَ" data-root="Ḥ Ḍ R" data-learn-more="/quran-terminology/en/roots/h-dad-r/" data-root-meaning="Presence, arrival, proximity, and bringing into presence: from everyday life to confronting deeds in the Hereafter" data-context="Will certainly be brought forth, in the context of judgment or punishment.">لَمُحضَرونَ</button>
  </p>
  <p class="english-verse">And they made a kinship between Him and the jinn; and the jinn know that they will be brought forth.</p>
</section>
