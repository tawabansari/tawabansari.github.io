  <h2 class="ayah-title">As-Saffat 37:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="خَطِفَ" data-root="KH Ṭ F" data-learn-more="/quran-terminology/en/roots/kh-tt-f/" data-root-meaning="To snatch, seize suddenly, carry off swiftly, and separate something from its place before it has time to resist or stabilize" data-context="Snatched; seizing something briefly in the context of listening.">خَطِفَ</button>
    <button class="word-link" type="button" data-word="الخَطفَةَ" data-root="KH Ṭ F" data-learn-more="/quran-terminology/en/roots/kh-tt-f/" data-root-meaning="To snatch, seize suddenly, carry off swiftly, and separate something from its place before it has time to resist or stabilize" data-context="A sudden snatch; what is seized in haste.">الخَطفَةَ</button>
    <button class="word-link" type="button" data-word="فَأَتبَعَهُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="Then followed him; the act of pursuit, with the shihāb as its subject.">فَأَتبَعَهُ</button>

    <button class="word-link" type="button" data-word="ثاقِبٌ" data-root="TH Q B" data-root-meaning="Piercing or penetrating something; describing light, brilliant and penetrating brightness." data-context="Piercing and brilliant; qualifying the shihāb, while pursuit is expressed by a separate verb." data-learn-more="/quran-terminology/en/roots/th-q-b/">ثاقِبٌ</button>

  <p class="english-verse">except one who snatches a fragment, then a piercing flame pursues him.</p>
