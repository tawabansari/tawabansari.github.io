<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="طَلعُها" data-root="TT L AYN" data-root-meaning="In its familiar semantic core, Ṭ L ʿ concerns rising and becoming apparent. In natural uses, it describes the sun appearing and plant produce emerging. In human uses, it can concern observing or learning something previously beyond a person’s access. In some constructions, it conveys reaching a particular place." data-learn-more="/quran-terminology/en/roots/tt-l-ayn/" data-context="Its fruit cluster, the emerging produce of the Zaqqūm tree.">طَلعُها</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="رُءوسُ" data-root="R A S" data-root-meaning="The head; by extension, the upper, initial, or principal part of something. Raʾs al-māl: principal property." data-context="Heads, in the comparison of Zaqqūm’s fruit cluster to the heads of devils." data-learn-more="/quran-terminology/en/roots/r-a-s/">رُءوسُ</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينِ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Devils, whose heads form the comparison for Zaqqūm’s fruit.">الشَّيٰطينِ</button>
  </p>
  <p class="english-verse">Its emerging fruit is like the heads of devils.</p>
</section>
