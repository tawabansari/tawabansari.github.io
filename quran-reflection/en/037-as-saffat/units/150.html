<section class="ayah-block" id="ayah-150" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:150</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="خَلَقنَا" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="We created, in the question concerning angels.">خَلَقنَا</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="The angels, the subject of claims of feminine naming or female creation.">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="إِنٰثًا" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="Female, within the critical question about the angels’ creation and the claimants’ witnessing it.">إِنٰثًا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="شٰهِدونَ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Witnessing or present, within the question about angels’ creation.">شٰهِدونَ</button>
  </p>
  <p class="english-verse">Or did We create the angels female while they were witnesses?</p>
