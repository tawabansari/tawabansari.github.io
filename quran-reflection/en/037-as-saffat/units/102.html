  <h2 class="ayah-title">As-Saffat 37:102</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="بَلَغَ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof">بَلَغَ</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="السَّعىَ" data-root="S ʿ Y" data-learn-more="/quran-terminology/en/roots/s-ayn-y/" data-root-meaning="From movement along a course to effort directed toward a result">السَّعىَ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>

    <button class="word-link" type="button" data-word="أَرىٰ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">أَرىٰ</button>

    <button class="word-link" type="button" data-word="أَذبَحُكَ" data-root="DH B H" data-learn-more="/quran-terminology/en/roots/dh-b-h/" data-root-meaning="Cutting the throat and ending life through slaughter">أَذبَحُكَ</button>
    <button class="word-link" type="button" data-word="فَانظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay">فَانظُر</button>

    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="يٰأَبَتِ" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations">يٰأَبَتِ</button>
    <button class="word-link" type="button" data-word="افعَل" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action">افعَل</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تُؤمَرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">تُؤمَرُ</button>

    <button class="word-link" type="button" data-word="سَتَجِدُنى" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception">سَتَجِدُنى</button>

    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰبِرينَ" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">الصّٰبِرينَ</button>
  </p>
  <p class="english-verse">When he reached the age of striving alongside him, he said, “My son, I see in sleep that I am slaughtering you; consider what you think.” He said, “My father, do what you are commanded. You will find me, if The God wills, among the patient.”</p>
</section>
