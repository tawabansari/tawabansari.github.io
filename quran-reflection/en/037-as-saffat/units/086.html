<section class="ayah-block" id="ayah-086" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:86</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَئِفكًا" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="Falsehood prefixed by interrogative hamzah, in Ibrāhīm’s question about desiring other gods.">أَئِفكًا</button>
    <button class="word-link" type="button" data-word="ءالِهَةً" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Gods, what people desire or take apart from The God.">ءالِهَةً</button>
    <button class="word-link" type="button" data-word="دونَ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Apart from or instead of, concerning desiring other gods.">دونَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="تُريدونَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="You desire, in Ibrāhīm’s question to his people about gods.">تُريدونَ</button>
  </p>
  <p class="english-verse">Do you desire, as a falsehood, gods apart from The God?</p>
</section>
