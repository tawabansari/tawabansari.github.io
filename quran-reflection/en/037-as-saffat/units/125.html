<section class="ayah-block" id="ayah-125" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:125</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَتَدعونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Do you invoke, Elijah’s challenge about invoking Baal as a deity.">أَتَدعونَ</button>
    <button class="word-link" type="button" data-word="بَعلًا" data-root="B AYN L" data-root-meaning="In family usage, baʿl means husband, the male marital partner. In Elijah’s account, Baal is the name or title of a deity invoked instead of The God." data-context="Baal, the name or title of the deity Elijah’s people invoked instead of The God, rather than husband." data-learn-more="/quran-terminology/en/roots/b-ayn-l/" data-root-note="A deity’s name or title in Elijah’s account.">بَعلًا</button>
    <button class="word-link" type="button" data-word="وَتَذَرونَ" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="And leave, turning away from the best of creators.">وَتَذَرونَ</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="The best, qualifying the creator who should be invoked instead of Baal.">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="الخٰلِقينَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Creators, within the phrase the best of creators.">الخٰلِقينَ</button>
  </p>
  <p class="english-verse">Do you call upon Baal and leave the best of creators,</p>
</section>
