<section class="ayah-block" id="ayah-113" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:113</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبٰرَكنا" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="We bestowed blessing upon him and Isaac, without guaranteeing every descendant’s goodness." data-learn-more="/quran-terminology/en/roots/b-r-k/">وَبٰرَكنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="إِسحٰقَ" data-root-note="Proper name; no root has been assigned.">إِسحٰقَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتِهِما" data-root="DH R R" data-learn-more="/quran-terminology/en/roots/dh-r-r/" data-root-meaning="Dharrah: perceptible smallness; dhurriyyah: descendants and the question of origin" data-context="Their descendants, concerning Abraham and Isaac.">ذُرِّيَّتِهِما</button>
    <button class="word-link" type="button" data-word="مُحسِنٌ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="A doer of good, one group among their descendants.">مُحسِنٌ</button>
    <button class="word-link" type="button" data-word="وَظالِمٌ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="A wrongdoer, here someone wronging himself.">وَظالِمٌ</button>
    <button class="word-link" type="button" data-word="لِنَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Against himself, the object of the wrongdoing.">لِنَفسِهِ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Plain or evident, qualifying the wrongdoing.">مُبينٌ</button>
  </p>
  <p class="english-verse">And We blessed him and Isaac. Among their descendants are those who do good and those who clearly wrong themselves.</p>
</section>
