<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">As-Saffat 37:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="احشُرُوا" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="Gather the wrongdoers, their associates, and what they worshipped." data-learn-more="/quran-terminology/en/roots/h-sh-r/">احشُرُوا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Did wrong, identifying those to be gathered.">ظَلَموا</button>
    <button class="word-link" type="button" data-word="وَأَزوٰجَهُم" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="And their counterparts or associates.">وَأَزوٰجَهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to, describing former worship.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعبُدونَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worshipped, concerning what is gathered with them.">يَعبُدونَ</button>
  </p>
  <p class="english-verse">Gather those who wronged, their counterparts, and what they used to worship</p>
