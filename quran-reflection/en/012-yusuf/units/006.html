<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَجتَبيكَ" data-root="J B Y" data-root-meaning="gathering and bringing something together; in ijtibāʾ, choosing and setting someone or something apart." data-context="Chooses you; Jacob’s statement about Joseph’s selection, followed by teaching and completion of favor." data-learn-more="/quran-terminology/en/roots/j-b-y/">يَجتَبيكَ</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; the one who chooses and teaches Joseph.">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="وَيُعَلِّمُكَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="And teaches you; teaching Joseph some interpretation of sayings and events.">وَيُعَلِّمُكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="تَأويلِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="Interpretation; understanding the meaning and underlying reality or outcome of sayings and events here.">تَأويلِ</button>
    <button class="word-link" type="button" data-word="الأَحاديثِ" data-root="H D TH" data-learn-more="/quran-terminology/en/roots/h-d-th/" data-root-meaning="From Coming into Being to Speech That Is Recounted" data-context="Sayings and events; the subject of the interpretation taught to Joseph.">الأَحاديثِ</button>
    <button class="word-link" type="button" data-word="وَيُتِمُّ" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete." data-context="And completes; brings His favor upon Joseph and Jacob’s household to completion.">وَيُتِمُّ</button>
    <button class="word-link" type="button" data-word="نِعمَتَهُ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="His favor; the gift and benefit completed upon Joseph and his household.">نِعمَتَهُ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="ءالِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="Household; Jacob’s family.">ءالِ</button>
    <button class="word-link" type="button" data-word="يَعقوبَ" data-root-note="Proper name; no root has been assigned.">يَعقوبَ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَما</button>
    <button class="word-link" type="button" data-word="أَتَمَّها" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete." data-context="He completed it; the earlier completion of that favor upon Abraham and Isaac.">أَتَمَّها</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَبَوَيكَ" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="Your two forefathers; Joseph’s ancestors Abraham and Isaac.">أَبَوَيكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before; earlier than Joseph and the situation addressed.">قَبلُ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="وَإِسحٰقَ" data-root-note="Proper name; no root has been assigned.">وَإِسحٰقَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبَّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; the one described as knowing and wise at the verse’s close.">رَبَّكَ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; aware of the matters involved in this selection and favor.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise; acting with wisdom in ordering affairs and choosing.">حَكيمٌ</button>
  </p>
  <p class="english-verse">Thus your Lord will choose you, teach you something of the interpretation of accounts, and complete His favor upon you and the family of Jacob, as He completed it upon your two forefathers, Abraham and Isaac, before. Your Lord is Knowing, Wise.”</p>
</section>
