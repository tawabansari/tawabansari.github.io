<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:43</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said, introducing the king’s dream.">وَقالَ</button>
    <button class="word-link" type="button" data-word="المَلِكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="The king, reporting the dream.">المَلِكُ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَرىٰ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="I see, the scenes within the dream.">أَرىٰ</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="S B ʿ (S B Ayn)" data-root-meaning="Seven and its related numerical forms; in a separate branch, sabuʿ: a predatory animal." data-context="Seven, the fat cows in the dream." data-learn-more="/quran-terminology/en/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="بَقَرٰتٍ" data-root="B Q R" data-learn-more="/quran-terminology/en/roots/b-q-r/" data-root-meaning="Cow, cows, the cattle-kind of cows; with the Qur&#x27;anic use distinguished from the broader Arabic branch of splitting and opening." data-context="Cows, the fat animals in the dream.">بَقَرٰتٍ</button>
    <button class="word-link" type="button" data-word="سِمانٍ" data-root="S M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-m-n/" data-root-meaning="Fatness or becoming well-fed." data-context="Fat, describing the first seven cows.">سِمانٍ</button>
    <button class="word-link" type="button" data-word="يَأكُلُهُنَّ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Eat them, the lean cows eating the fat ones.">يَأكُلُهُنَّ</button>
    <button class="word-link" type="button" data-word="سَبعٌ" data-root="S B ʿ (S B Ayn)" data-root-meaning="Seven and its related numerical forms; in a separate branch, sabuʿ: a predatory animal." data-context="Seven, the lean cows eating the others in the dream." data-learn-more="/quran-terminology/en/roots/s-b-ayn/">سَبعٌ</button>
    <button class="word-link" type="button" data-word="عِجافٌ" data-root="AYN J F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-j-f/" data-root-meaning="Severe leanness or emaciation." data-context="Lean, describing the seven cows that eat.">عِجافٌ</button>
    <button class="word-link" type="button" data-word="وَسَبعَ" data-root="S B ʿ (S B Ayn)" data-root-meaning="Seven and its related numerical forms; in a separate branch, sabuʿ: a predatory animal." data-context="Seven, the green ears of grain in the dream." data-learn-more="/quran-terminology/en/roots/s-b-ayn/">وَسَبعَ</button>
    <button class="word-link" type="button" data-word="سُنبُلٰتٍ" data-root="S N B L" data-root-meaning="An ear or head of grain: the grain-bearing part of a plant in which the crop’s grains develop and lie together." data-context="Ears of grain, the green ears in the dream." data-learn-more="/quran-terminology/en/roots/s-n-b-l/">سُنبُلٰتٍ</button>
    <button class="word-link" type="button" data-word="خُضرٍ" data-root="KH DAD R" data-root-meaning="Greenness and the color green; in botanical usage, freshness and vitality." data-context="Green, describing the ears of grain." data-learn-more="/quran-terminology/en/roots/kh-dad-r/">خُضرٍ</button>
    <button class="word-link" type="button" data-word="وَأُخَرَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="And others, ears contrasted with the green ones.">وَأُخَرَ</button>
    <button class="word-link" type="button" data-word="يابِسٰتٍ" data-root="Y B S" data-learn-more="/quran-terminology/en/roots/y-b-s/" data-root-meaning="Becoming dry or being dry; standing opposite moisture and wetness." data-context="Dry, describing the other ears.">يابِسٰتٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="المَلَأُ" data-root="M L A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-l-a/" data-root-meaning="Filling; malaʾ denotes leading members or notables of a community." data-context="Council or notables, addressed by the king.">المَلَأُ</button>
    <button class="word-link" type="button" data-word="أَفتونى" data-root="F T Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-t-y/" data-root-meaning="A youth and youthfulness; fatwā is an answer clarifying a question." data-context="Give me an answer, requesting interpretation of the dream.">أَفتونى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="رُءيٰىَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="My dream, the subject of the requested answer.">رُءيٰىَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Are, in the condition concerning interpreters.">كُنتُم</button>
    <button class="word-link" type="button" data-word="لِلرُّءيا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Dreams, the object of interpretation.">لِلرُّءيا</button>
    <button class="word-link" type="button" data-word="تَعبُرونَ" data-root="AYN B R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-b-r/" data-root-meaning="Crossing from one side to another; learning or interpreting through a sign." data-context="Interpret, understanding and explaining the dream’s significance.">تَعبُرونَ</button>
  </p>
  <p class="english-verse">The king said, “I see seven fat cows being eaten by seven lean ones, and seven green ears of grain and others dry. Chiefs, give me an answer about my dream, if you interpret dreams.”</p>
</section>
