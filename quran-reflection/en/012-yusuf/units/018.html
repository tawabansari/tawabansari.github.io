<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجاءو" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="and they brought">وَجاءو</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَميصِهِ" data-root="Q M SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-sad/" data-root-meaning="A shirt or tunic." data-context="his shirt">قَميصِهِ</button>
    <button class="word-link" type="button" data-word="بِدَمٍ" data-root="D M W" data-root-meaning="Blood, the vital fluid of human and animal bodies. Dam is singular and dimāʾ its plural; bloodshed, dietary rulings and other implications follow from construction and context. The third radical has been analysed as either D M W or D M Y." data-learn-more="/quran-terminology/en/roots/d-m-w/" data-context="with blood">بِدَمٍ</button>
    <button class="word-link" type="button" data-word="كَذِبٍ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="false; used as evidence for a false claim">كَذِبٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="he said">قالَ</button>
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="سَوَّلَت" data-root="S W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-l/" data-root-meaning="A desire of the self; taswīl means making something seem attractive or desirable." data-context="has made seem fair and easy">سَوَّلَت</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَنفُسُكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="your own selves">أَنفُسُكُم</button>
    <button class="word-link" type="button" data-word="أَمرًا" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution; also an affair, matter or event in nominal use." data-context="a matter">أَمرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَصَبرٌ" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="so patience">فَصَبرٌ</button>
    <button class="word-link" type="button" data-word="جَميلٌ" data-root="J M L" data-root-meaning="Beauty and goodness; in another branch, a whole and largeness; jamal names the camel." data-context="beautiful and fitting" data-learn-more="/quran-terminology/en/roots/j-m-l/">جَميلٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="المُستَعانُ" data-root="AYN W N (ʿ W N)" data-learn-more="/quran-terminology/en/roots/ayn-w-n/" data-root-meaning="Help, adding strength, seeking support, and reaching the middle stage" data-context="the One whose help is sought">المُستَعانُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَصِفونَ" data-root="W SAD F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-sad-f/" data-root-meaning="Describing or stating a quality." data-context="you describe">تَصِفونَ</button>
  </p>
  <p class="english-verse">They brought false blood upon his shirt. He said, “Rather, your souls have made a deed seem fair to you. So, beautiful patience. The God is the One whose help is sought against what you describe.”</p>
</section>
