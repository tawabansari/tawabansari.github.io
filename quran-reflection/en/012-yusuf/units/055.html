  <h2 class="ayah-title">Yusuf 12:55</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said, introducing the quoted speech.">قالَ</button>

    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="خَزائِنِ" data-root="KH Z N" data-root-meaning="Keeping and safeguarding; a treasury is a repository or resources in custody, and a khāzin is their keeper." data-context="The storehouses or stores of the land." data-learn-more="/quran-terminology/en/roots/kh-z-n/">خَزائِنِ</button>

  <p class="english-verse">He said, “Appoint me over the storehouses of the land. I am a knowledgeable guardian.”</p>
