  <h2 class="ayah-title">Yusuf 12:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>

    <button class="word-link" type="button" data-word="قُرءٰنًا" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="A Qur’an: revelation sent down in Arabic." data-learn-more="/quran-terminology/en/roots/q-r-a/">قُرءٰنًا</button>

  <p class="english-verse">We sent it down as an Arabic Qur’an so that you may reason.</p>
