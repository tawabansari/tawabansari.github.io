<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said, introducing the king’s command.">وَقالَ</button>
    <button class="word-link" type="button" data-word="المَلِكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="The king, the ruler summoning Joseph.">المَلِكُ</button>
    <button class="word-link" type="button" data-word="ائتونى" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Bring him to me, commanding that Joseph be brought.">ائتونى</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَهُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to him, describing the messenger’s arrival at Joseph.">جاءَهُ</button>
    <button class="word-link" type="button" data-word="الرَّسولُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="The messenger, the king’s emissary in this affair.">الرَّسولُ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said, introducing Joseph’s reply to the messenger.">قالَ</button>
    <button class="word-link" type="button" data-word="ارجِع" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="Return, Joseph’s instruction to the messenger to go back to his master.">ارجِع</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your master, here the king who sent the messenger.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَسـَٔلهُ" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="Then ask him, instructing inquiry with the king about the women’s affair.">فَسـَٔلهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="بالُ" data-root="B W L" data-root-meaning="Bāl denotes the condition, affairs, or matter concerning a person or group; its broader Arabic range also connects with thought and attention. Mā bālu asks about someone’s situation or affair; aṣlaḥa bālahu describes setting their condition and affairs right." data-context="Condition or affair; in mā bālu al-niswati, inquiry about the women who cut their hands." data-learn-more="/quran-terminology/en/roots/b-w-l/">بالُ</button>
    <button class="word-link" type="button" data-word="النِّسوَةِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="The women, those involved in cutting their hands.">النِّسوَةِ</button>
    <button class="word-link" type="button" data-word="الّٰتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الّٰتى</button>
    <button class="word-link" type="button" data-word="قَطَّعنَ" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="Cut, referring to the women’s own hands in the earlier event.">قَطَّعنَ</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُنَّ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands, the bodily members the women cut in that affair.">أَيدِيَهُنَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord, the One declared at the end of Joseph’s reply to know the women’s scheming.">رَبّى</button>
    <button class="word-link" type="button" data-word="بِكَيدِهِنَّ" data-root="K Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-y-d/" data-root-meaning="Planning or subtle strategy; its evaluation depends on context." data-context="Their scheming, the women’s plan or strategy in this affair.">بِكَيدِهِنَّ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing, describing the Lord’s knowledge of their scheming.">عَليمٌ</button>
  </p>
  <p class="english-verse">The king said, “Bring him to me.” When the messenger came to him, he said, “Return to your lord and ask him about the women who cut their hands. My Lord knows their scheming.”</p>
</section>
