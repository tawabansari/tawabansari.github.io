<section class="ayah-block" id="ayah-075" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:75</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said; the brothers’ answer about the penalty if the cup is found in someone’s baggage.">قالوا</button>
    <button class="word-link" type="button" data-word="جَزٰؤُهُ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Its penalty; the subject of the question and answer concerning the missing cup.">جَزٰؤُهُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="وُجِدَ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="Is found; a passive verb referring to the cup in a person’s baggage.">وُجِدَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="رَحلِهِ" data-root="R H L" data-learn-more="/quran-terminology/en/roots/r-h-l/" data-root-meaning="Departure and travel; saddling a mount; raḥl denotes riding equipment, a traveler’s baggage and belongings, and in some uses a dwelling or shelter." data-context="The baggage and traveling belongings of the person in whose baggage the cup is found.">رَحلِهِ</button>
    <button class="word-link" type="button" data-word="فَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهُوَ</button>
    <button class="word-link" type="button" data-word="جَزٰؤُهُ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Its penalty; their answer identifies that person himself as the penalty.">جَزٰؤُهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَجزِى" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="We recompense; the brothers’ statement of their manner of punishment.">نَجزِى</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrongdoers; those described as subject to punishment in this answer.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">They said, “Its penalty is the one in whose baggage it is found; he himself is its penalty. Thus we recompense the unjust.”</p>
