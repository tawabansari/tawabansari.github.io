<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَرٰوَدَتهُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">وَرٰوَدَتهُ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بَيتِها" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/" data-root-meaning="A house or dwelling; bāta: spending the night; tabyīt: arranging something by night or in secret." data-root-note="Preliminary meaning; a full root study is not yet available.">بَيتِها</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">نَفسِهِ</button>
    <button class="word-link" type="button" data-word="وَغَلَّقَتِ" data-root="GH L Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-l-q/" data-root-meaning="Closing or locking securely.">وَغَلَّقَتِ</button>
    <button class="word-link" type="button" data-word="الأَبوٰبَ" data-root="B W B" data-learn-more="/quran-terminology/en/roots/b-w-b/" data-root-meaning="Door, gate, entrance, and threshold of passage between outside and inside.">الأَبوٰبَ</button>
    <button class="word-link" type="button" data-word="وَقالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقالَت</button>
    <button class="word-link" type="button" data-word="هَيتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَيتَ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="مَعاذَ" data-root="AYN W DH (ʿ W DH)" data-learn-more="/quran-terminology/en/roots/ayn-w-dh/" data-root-meaning="Seeking refuge, taking shelter, turning toward a safe place, and coming under its protection.">مَعاذَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبّى</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="مَثواىَ" data-root="TH W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-w-y/" data-root-meaning="Remaining or residing; mathwā: a place of residence or abiding.">مَثواىَ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">الظّٰلِمونَ</button>
  </p>
  <p class="english-verse">The woman in whose house he was sought to seduce him. She closed the doors and said, “Come.” He said, “Refuge in The God! He is my lord; he has made my lodging good. The unjust do not succeed.”</p>
</section>
