<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:70</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جَهَّزَهُم" data-root="J H2 Z" data-root-meaning="Providing requisites and preparing for a specific purpose; jahāz: the assembled baggage, equipment, and supplies." data-context="He equipped them; providing the brothers’ baggage and supplies again." data-learn-more="/quran-terminology/en/roots/j-h2-z/">جَهَّزَهُم</button>
    <button class="word-link" type="button" data-word="بِجَهازِهِم" data-root="J H2 Z" data-root-meaning="Providing requisites and preparing for a specific purpose; jahāz: the assembled baggage, equipment, and supplies." data-context="With their baggage and provisions; the supplies prepared for the caravan." data-learn-more="/quran-terminology/en/roots/j-h2-z/">بِجَهازِهِم</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="He placed; putting the vessel in his brother’s baggage.">جَعَلَ</button>

    <button class="word-link" type="button" data-word="أَذَّنَ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Proclaimed; making an announcement addressed to the caravan.">أَذَّنَ</button>

    <button class="word-link" type="button" data-word="أَيَّتُهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَيَّتُهَا</button>

    <button class="word-link" type="button" data-word="لَسٰرِقونَ" data-root="S R Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-q/" data-root-meaning="Secretly taking what one has no right to take." data-context="Certainly thieves; the accusation announced by the caller to those addressed.">لَسٰرِقونَ</button>
  </p>
  <p class="english-verse">When he had supplied them with their provisions, he placed the drinking cup in his brother’s baggage. Then a caller called out, “Caravan, you are thieves!”</p>
