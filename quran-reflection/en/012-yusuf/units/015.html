<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="ذَهَبوا" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach" data-context="Went away; taking Joseph with them, away from his father.">ذَهَبوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="وَأَجمَعوا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="Agreed and resolved; reaching a common decision to put Joseph in the well’s hidden part.">وَأَجمَعوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَجعَلوهُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Put him; placing Joseph in the well’s hidden part.">يَجعَلوهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="غَيٰبَتِ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="The hidden part; the concealed part of the well where Joseph is to be placed.">غَيٰبَتِ</button>
    <button class="word-link" type="button" data-word="الجُبِّ" data-root="J B B" data-root-meaning="cutting and gathering; jubb: a well." data-context="The well; the same well in whose hidden part the brothers agreed to put Joseph." data-learn-more="/quran-terminology/en/roots/j-b-b/">الجُبِّ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَوحَينا" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="We revealed to him; communicating the divine message to Joseph in this situation.">وَأَوحَينا</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="لَتُنَبِّئَنَّهُم" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="You will certainly inform them; Joseph’s future telling of the brothers’ deed.">لَتُنَبِّئَنَّهُم</button>
    <button class="word-link" type="button" data-word="بِأَمرِهِم" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-context="Of this deed of theirs; what the brothers did concerning Joseph." data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.; amr also denotes an affair, matter, concern, or event">بِأَمرِهِم</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality" data-context="Are unaware; lacking the awareness attributed to them as absent in the verse.">يَشعُرونَ</button>
  </p>
  <p class="english-verse">When they took him away and agreed to put him into the hidden depths of the well, We revealed to him, “You will surely inform them of this deed of theirs while they are unaware.”</p>
</section>
