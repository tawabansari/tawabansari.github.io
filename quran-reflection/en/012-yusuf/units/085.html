<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:85</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Jacob’s sons said.">قالوا</button>
    <button class="word-link" type="button" data-word="تَاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">تَاللَّهِ</button>
    <button class="word-link" type="button" data-word="تَفتَؤُا۟" data-root="F T A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-t-a/" data-root-meaning="Ceasing or stopping; in a negative construction, continuing to do something." data-context="You do not cease, with negation understood in the sentence.">تَفتَؤُا۟</button>
    <button class="word-link" type="button" data-word="تَذكُرُ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="You remember Joseph.">تَذكُرُ</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="Proper name; no root has been assigned.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Until you become so.">تَكونَ</button>
    <button class="word-link" type="button" data-word="حَرَضًا" data-root="H R DAD" data-root-meaning="Severe wasting and weakness to the verge of destruction; in Form II, urging and prompting action." data-context="Severely weakened and ailing." data-learn-more="/quran-terminology/en/roots/h-r-dad/">حَرَضًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Or become one of those who perish.">تَكونَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الهٰلِكينَ" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="Become one of those who perish or die, the outcome described by Jacob’s sons." data-learn-more="/quran-terminology/en/roots/h2-l-k/">الهٰلِكينَ</button>
  </p>
  <p class="english-verse">They said, “By The God, you will keep remembering Joseph until you waste away or perish.”</p>
</section>
