<section class="ayah-block" id="ayah-099" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:99</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="دَخَلوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="They entered Joseph’s presence.">دَخَلوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="Proper name; no root has been assigned.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="ءاوىٰ" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="Receiving and lodging another, or providing shelter and a place for them." data-context="He received and lodged his parents with him.">ءاوىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="أَبَوَيهِ" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="His parents, Joseph’s father and mother.">أَبَوَيهِ</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said, introducing reported speech.">وَقالَ</button>
    <button class="word-link" type="button" data-word="ادخُلوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="Enter, an invitation to come in.">ادخُلوا</button>
    <button class="word-link" type="button" data-word="مِصرَ" data-root-note="Proper name; no root has been assigned.">مِصرَ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="He wills, the matter depending on His will.">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ءامِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="In safety and security.">ءامِنينَ</button>
  </p>
  <p class="english-verse">When they entered before Joseph, he took his parents close to him and said, “Enter Egypt, if The God wills, in safety.”</p>
</section>
