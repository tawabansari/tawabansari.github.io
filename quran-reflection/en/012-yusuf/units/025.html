<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاستَبَقَا" data-root="S B Q" data-learn-more="/quran-terminology/en/roots/s-b-q/" data-root-meaning="Preceding, getting ahead and outstripping: from racing and temporal priority to taking the lead in good deeds and the impossibility of outstripping The God’s will" data-context="And the two raced towards the door: a form VIII verb for Joseph and the woman, with the door as their destination.">وَاستَبَقَا</button>
    <button class="word-link" type="button" data-word="البابَ" data-root="B W B" data-learn-more="/quran-terminology/en/roots/b-w-b/" data-root-meaning="Door, gate, entrance, and threshold of passage between outside and inside." data-context="The door: the object of the racing verb in this construction and the destination of their movement.">البابَ</button>
    <button class="word-link" type="button" data-word="وَقَدَّت" data-root="Q D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-d-d/" data-root-meaning="Cutting or tearing lengthwise; qidad denotes separate divisions or ways." data-context="And she tore: a verb with a feminine subject, concerning the tearing of Joseph’s shirt.">وَقَدَّت</button>
    <button class="word-link" type="button" data-word="قَميصَهُ" data-root="Q M SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-sad/" data-root-meaning="A shirt or tunic." data-context="His shirt: the suffix refers to Joseph, and the shirt is the object of tearing.">قَميصَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دُبُرٍ" data-root="D B R" data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back and latter part; turning away and passing; tadbīr, governing affairs; tadabbur, careful reflection on discourse." data-context="From behind: dubur specifies the direction of the shirt’s tearing in min dubur.">دُبُرٍ</button>
    <button class="word-link" type="button" data-word="وَأَلفَيا" data-root="L F W" data-root-meaning="Finding or encountering an existing person, thing or situation, without inherently implying acceptance or following." data-learn-more="/quran-terminology/en/roots/l-f-w/" data-context="And the two found: Joseph and the woman found her husband at the door, without the verb alone establishing a previous search.">وَأَلفَيا</button>
    <button class="word-link" type="button" data-word="سَيِّدَها" data-root="S W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-d/" data-root-meaning="Blackness; in another branch, leadership or mastery." data-context="The woman’s husband: sayyid denotes her husband in this context, with the suffix referring to the woman.">سَيِّدَها</button>
    <button class="word-link" type="button" data-word="لَدَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدَا</button>
    <button class="word-link" type="button" data-word="البابِ" data-root="B W B" data-learn-more="/quran-terminology/en/roots/b-w-b/" data-root-meaning="Door, gate, entrance, and threshold of passage between outside and inside." data-context="The door: the location of finding her husband in lada al-bab.">البابِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="She said: a feminine perfect verb introducing the woman’s words to her husband.">قالَت</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="جَزاءُ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Recompense or punishment: the subject of the woman’s question about someone she accuses of an evil intention.">جَزاءُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَرادَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="Intended: the intention attributed by the woman to the accused person, rather than the verb itself confirming the accusation.">أَرادَ</button>
    <button class="word-link" type="button" data-word="بِأَهلِكَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="Towards your household: in this address, concerning the addressee’s wife as part of his household.">بِأَهلِكَ</button>
    <button class="word-link" type="button" data-word="سوءًا" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evil or harm: the object of intending in the woman’s accusatory speech.">سوءًا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُسجَنَ" data-root="S J N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-j-n/" data-root-meaning="Imprisonment and prison; sijjīn names a place or record of wrongdoers, with differing explanations." data-context="Be imprisoned: a passive imperfect expressing one proposed punishment in the woman’s speech.">يُسجَنَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="A punishment: the other proposed consequence in the woman’s speech, alongside imprisonment.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful: describing the punishment and its distressing effect.">أَليمٌ</button>
  </p>
  <p class="english-verse">They raced to the door, and she tore his shirt from behind. They found her husband at the door. She said, “What is the recompense of one who intended evil toward your family, except imprisonment or a painful punishment?”</p>
</section>
