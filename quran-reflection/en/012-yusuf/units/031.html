  <p class="english-verse">When she heard of their scheming, she sent for them, prepared a reclining place for them, gave each one a knife, and said, “Come out before them.” When they saw him, they marveled at him and cut their hands, saying, “Glory to The God! This is no human; this is only a noble angel.”</p>
