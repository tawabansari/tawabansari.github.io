<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:36</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَدَخَلَ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="And entered, concerning the two young men entering prison with Joseph.">وَدَخَلَ</button>
    <button class="word-link" type="button" data-word="مَعَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَهُ</button>
    <button class="word-link" type="button" data-word="السِّجنَ" data-root="S J N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-j-n/" data-root-meaning="Imprisonment and prison; sijjīn names a place or record of wrongdoers, with differing explanations." data-context="The prison where the two young men enter and speak with Joseph.">السِّجنَ</button>
    <button class="word-link" type="button" data-word="فَتَيانِ" data-root="F T Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-t-y/" data-root-meaning="A youth and youthfulness; fatwā is an answer clarifying a question." data-context="Two young men, Joseph’s prison companions.">فَتَيانِ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said, introducing the first young man’s dream.">قالَ</button>
    <button class="word-link" type="button" data-word="أَحَدُهُما" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="One of the two, who describes pressing wine.">أَحَدُهُما</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَرىٰنى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="I see myself, reporting the first young man’s dream.">أَرىٰنى</button>
    <button class="word-link" type="button" data-word="أَعصِرُ" data-root="AYN SAD R" data-root-meaning="In material usage, ʿaṣr is pressing to draw out liquid; in temporal usage, it denotes time or an age; and in forms concerning wind and rain, each derivative’s particular meaning must be recognized from its morphology and context." data-learn-more="/quran-terminology/en/roots/ayn-sad-r/" data-context="I press, concerning what is pressed for wine in the dream.">أَعصِرُ</button>
    <button class="word-link" type="button" data-word="خَمرًا" data-root="KH M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-m-r/" data-root-meaning="Covering; khamr is an intoxicating drink; khimār is a head covering in established usage." data-context="Wine, the drink mentioned in the dream.">خَمرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said, introducing the other young man’s account.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الـٔاخَرُ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The other, the second of the two young men.">الـٔاخَرُ</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="أَرىٰنى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="I see myself, reporting the second young man’s dream.">أَرىٰنى</button>
    <button class="word-link" type="button" data-word="أَحمِلُ" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="I carry, concerning bread above the head in the dream." data-learn-more="/quran-terminology/en/roots/h-m-l/">أَحمِلُ</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above, locating the bread relative to the head.">فَوقَ</button>
    <button class="word-link" type="button" data-word="رَأسى" data-root="R A S" data-root-meaning="The head; by extension, the upper, initial, or principal part of something. Raʾs al-māl: principal property." data-context="My head, above which bread is carried in the dream." data-learn-more="/quran-terminology/en/roots/r-a-s/">رَأسى</button>
    <button class="word-link" type="button" data-word="خُبزًا" data-root="KH B Z" data-root-meaning="Bread and preparing and baking it; other early uses include striking and forceful driving." data-context="Bread, carried above the head in the dream." data-learn-more="/quran-terminology/en/roots/kh-b-z/">خُبزًا</button>
    <button class="word-link" type="button" data-word="تَأكُلُ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Eat, describing the birds eating the bread.">تَأكُلُ</button>
    <button class="word-link" type="button" data-word="الطَّيرُ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record." data-context="The birds eating the bread in the dream.">الطَّيرُ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="نَبِّئنا" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="Inform us, requesting an explanation of the dream from Joseph.">نَبِّئنا</button>
    <button class="word-link" type="button" data-word="بِتَأويلِهِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="Of its interpretation, explaining the reported dream’s significance and outcome.">بِتَأويلِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="نَرىٰكَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="We see or recognize you, the young men’s assessment of Joseph.">نَرىٰكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Those who do good, the quality the young men recognize in Joseph.">المُحسِنينَ</button>
  </p>
  <p class="english-verse">Two young men entered prison with him. One said, “I see myself pressing wine.” The other said, “I see myself carrying bread upon my head, from which birds eat. Tell us its interpretation. We see you among those who do good.”</p>
</section>
