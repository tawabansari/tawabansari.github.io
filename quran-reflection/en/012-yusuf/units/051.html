<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:51</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said; the questioner asks the women about their affair.">قالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="خَطبُكُنَّ" data-root="KH TT B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-tt-b/" data-root-meaning="Addressing or conversing; a speech, marriage proposal, or serious matter, according to form." data-context="Your affair, the matter concerning that incident.">خَطبُكُنَّ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="رٰوَدتُنَّ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="You sought to entice him and win his compliance.">رٰوَدتُنَّ</button>
    <button class="word-link" type="button" data-word="يوسُفَ" data-root-note="Proper name; no root has been assigned.">يوسُفَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Himself, in the expression concerning the attempt to entice Joseph.">نَفسِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُلنَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said, the women’s reply to the question.">قُلنَ</button>
    <button class="word-link" type="button" data-word="حٰشَ" data-root="H W SH" data-root-meaning="Gathering, driving, and encompassing; ḥāsha li-llāh expresses disavowal and denial, and its derivation from this root is disputed." data-context="In ḥāsha li-llāh, disavowal of the allegation; the women say they know of no wrongdoing by Joseph." data-learn-more="/quran-terminology/en/roots/h-w-sh/" data-root-note="The derivation of ḥāsha li-llāh from Ḥ W SH is uncertain; Ḥ SH W / Ḥ SH Y analyses are also proposed.">حٰشَ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="عَلِمنا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="We know of none, denying knowledge of any evil on his part.">عَلِمنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evil, any wrongful conduct they deny knowing of Joseph.">سوءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="قالَتِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="She said, introducing the official’s wife’s admission.">قالَتِ</button>
    <button class="word-link" type="button" data-word="امرَأَتُ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="Woman or wife, in “the official’s wife.”">امرَأَتُ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="Al-ʿAzīz, the title of the official whose wife is speaking.">العَزيزِ</button>
    <button class="word-link" type="button" data-word="الـٰٔنَ" data-context="Now; when the truth becomes clear in the official’s wife’s statement." data-root-note="A temporal noun functioning as an indeclinable adverbial; al-ān’s historical derivation is disputed." data-learn-more="/quran-terminology/en/roots/a-w-n/">الـٰٔنَ</button>
    <button class="word-link" type="button" data-word="حَصحَصَ" data-root="H SAD H SAD" data-root-meaning="Becoming clear after concealment; settling or becoming distinct; and, in other uses, movement and shifting." data-context="Has become fully clear, the truth now openly disclosed." data-learn-more="/quran-terminology/en/roots/h-sad-h-sad/">حَصحَصَ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="The truth, whose disclosure the official’s wife acknowledges.">الحَقُّ</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنا۠</button>
    <button class="word-link" type="button" data-word="رٰوَدتُهُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="I sought to entice him and win his compliance.">رٰوَدتُهُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Himself, in the wife’s admission of seeking to entice Joseph.">نَفسِهِ</button>
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰدِقينَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="The truthful, acknowledging Joseph’s truthfulness.">الصّٰدِقينَ</button>
  </p>
  <p class="english-verse">He said, “What was your affair when you sought to seduce Joseph?” They said, “Glory to The God! We know no evil of him.” The wife of the Aziz said, “Now the truth has become clear. I sought to seduce him, and he is among the truthful.”</p>
</section>
