<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:62</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And Joseph told his attendants.">وَقالَ</button>

    <button class="word-link" type="button" data-word="يَرجِعونَ" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="They return again to Joseph.">يَرجِعونَ</button>
  </p>
  <p class="english-verse">He said to his young men, “Put their merchandise into their baggage, so that they may recognize it when they return to their family, and perhaps come back.”</p>
</section>
