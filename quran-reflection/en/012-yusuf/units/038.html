<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:38</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاتَّبَعتُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">وَاتَّبَعتُ</button>
    <button class="word-link" type="button" data-word="مِلَّةَ" data-root="M L L" data-learn-more="/quran-terminology/en/roots/m-l-l/" data-root-meaning="Dictation and millah: two uses and their historical relationship">مِلَّةَ</button>
    <button class="word-link" type="button" data-word="ءاباءى" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations">ءاباءى</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="وَإِسحٰقَ" data-root-note="Proper name; no root has been assigned.">وَإِسحٰقَ</button>
    <button class="word-link" type="button" data-word="وَيَعقوبَ" data-root-note="Proper name; no root has been assigned.">وَيَعقوبَ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="نُشرِكَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">نُشرِكَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party.">فَضلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَشكُرونَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action">يَشكُرونَ</button>
  </p>
  <p class="english-verse">I have followed the way of my fathers, Abraham, Isaac, and Jacob. It is not for us to associate anything with The God. That is of the bounty of The God upon us and upon people, but most people do not give thanks.</p>
</section>
