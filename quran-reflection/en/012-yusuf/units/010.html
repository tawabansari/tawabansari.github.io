  <h2 class="ayah-title">Yusuf 12:10</h2>

    <button class="word-link" type="button" data-word="قائِلٌ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="A speaker; one of them who expressed his proposal.">قائِلٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>

  <p class="english-verse">One of them said, “Do not kill Joseph. Throw him into the hidden depths of the well, and some travelers will pick him up, if you are going to act.”</p>
