<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَشَرَوهُ" data-root="SH R Y" data-learn-more="/quran-terminology/en/roots/sh-r-y/" data-root-meaning="Buying, selling, exchanging, and giving up one thing in return for another" data-context="And they sold him">وَشَرَوهُ</button>
    <button class="word-link" type="button" data-word="بِثَمَنٍ" data-root="TH M N" data-learn-more="/quran-terminology/en/roots/th-m-n/" data-root-meaning="Price, value in exchange, and what is taken in return for something else." data-context="For a price">بِثَمَنٍ</button>
    <button class="word-link" type="button" data-word="بَخسٍ" data-root="B KH S" data-root-meaning="Reducing or giving less; especially wrongfully diminishing a due, share or value." data-learn-more="/quran-terminology/en/roots/b-kh-s/" data-context="Paltry or undervalued; also interpreted as wrongful">بَخسٍ</button>
    <button class="word-link" type="button" data-word="دَرٰهِمَ" data-root-note="Preliminary meaning; a full root study is not yet available." data-root="D R H M" data-learn-more="/quran-terminology/en/roots/d-r-h2-m/" data-root-meaning="Dirham is a coin or monetary unit of borrowed origin." data-context="Dirhams, units of money">دَرٰهِمَ</button>

  <p class="english-verse">They sold him for a low price, a few counted dirhams, having little interest in him.</p>
