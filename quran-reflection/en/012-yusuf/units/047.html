<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said, introducing Joseph’s answer and plan.">قالَ</button>
    <button class="word-link" type="button" data-word="تَزرَعونَ" data-root="Z R AYN" data-learn-more="/quran-terminology/en/roots/z-r-ayn/" data-root-meaning="Placing seed, sprouting, plant growth, and the appearance of produce" data-context="You cultivate, the work of the first seven years.">تَزرَعونَ</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="S B ʿ (S B Ayn)" data-root-meaning="Seven and its related numerical forms; in a separate branch, sabuʿ: a predatory animal." data-context="Seven, the years of cultivation in Joseph’s plan." data-learn-more="/quran-terminology/en/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="سِنينَ" data-root="S N W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-w/" data-root-meaning="A year or years; sanā means radiance; sanah is also analyzed under s-n-h." data-context="Years, the units counted as seven.">سِنينَ</button>
    <button class="word-link" type="button" data-word="دَأَبًا" data-root="D A B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-a-b/" data-root-meaning="Continuity in effort or habit; daʾb is an established pattern." data-context="Continuously and diligently, describing cultivation.">دَأَبًا</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="حَصَدتُم" data-root="H SAD D" data-root-meaning="Arabic records two branches of ح ص د: cutting and reaping, and making firm or strong. The first is familiar in cutting stalks and harvesting crops; the second concerns tightly made ropes, armor, and similar structures." data-context="You harvest, gathering the crop." data-learn-more="/quran-terminology/en/roots/h-sad-d/">حَصَدتُم</button>
    <button class="word-link" type="button" data-word="فَذَروهُ" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="Then leave it, preserving the crop in its ears.">فَذَروهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سُنبُلِهِ" data-root="S N B L" data-root-meaning="An ear or head of grain: the grain-bearing part of a plant in which the crop’s grains develop and lie together." data-context="Its ear, where the grain is to be kept." data-learn-more="/quran-terminology/en/roots/s-n-b-l/">سُنبُلِهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="A little, the portion excepted for eating.">قَليلًا</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="You eat, consuming the excepted portion.">تَأكُلونَ</button>
  </p>
  <p class="english-verse">He said, “You will sow for seven years steadily. Leave what you harvest in its ear, except a little of what you eat.</p>
</section>
