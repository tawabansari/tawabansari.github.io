<section class="ayah-block" id="ayah-091" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:91</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>
    <button class="word-link" type="button" data-word="تَاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">تَاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَقَد</button>
    <button class="word-link" type="button" data-word="ءاثَرَكَ" data-root="A TH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-th-r/" data-root-meaning="A remaining trace or mark, following a trace, and giving preference to someone or something.">ءاثَرَكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنّا</button>
    <button class="word-link" type="button" data-word="لَخٰطِـٔينَ" data-root="KH Ṭ A" data-learn-more="/quran-terminology/en/roots/kh-tt-a/" data-root-meaning="Slipping from the right path, missing the mark, going wrong; and in some forms, conscious deviation from truth.">لَخٰطِـٔينَ</button>
  </p>
  <p class="english-verse">They said, “By The God, He has preferred you over us, and we were at fault.”</p>
</section>
