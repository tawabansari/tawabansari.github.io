<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:39</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰصٰحِبَىِ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides">يٰصٰحِبَىِ</button>
    <button class="word-link" type="button" data-word="السِّجنِ" data-root="S J N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-j-n/" data-root-meaning="Imprisonment and prison; sijjīn names a place or record of wrongdoers, with differing explanations.">السِّجنِ</button>
    <button class="word-link" type="button" data-word="ءَأَربابٌ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">ءَأَربابٌ</button>
    <button class="word-link" type="button" data-word="مُتَفَرِّقونَ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths">مُتَفَرِّقونَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الوٰحِدُ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one.">الوٰحِدُ</button>
    <button class="word-link" type="button" data-word="القَهّارُ" data-root="Q H2 R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-h2-r/" data-root-meaning="Overpowering or bringing under control; qahr does not inherently denote the emotion of anger.">القَهّارُ</button>
  </p>
  <p class="english-verse">My two prison companions, are scattered lords better, or The God, the One, the Overpowering?</p>
