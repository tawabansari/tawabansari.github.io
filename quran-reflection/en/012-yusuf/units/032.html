<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="She said, introducing the woman’s account of Joseph and her threat.">قالَت</button>
    <button class="word-link" type="button" data-word="فَذٰلِكُنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَذٰلِكُنَّ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="لُمتُنَّنى" data-root="L W M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-w-m/" data-root-meaning="Blame or reproach." data-context="You blamed me, the woman addressing the other women concerning Joseph.">لُمتُنَّنى</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="رٰوَدتُهُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="I sought to induce him to comply with my desire, the woman’s statement about Joseph.">رٰوَدتُهُ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="نَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="His self, in the expression concerning seeking to induce Joseph.">نَفسِهِ</button>
    <button class="word-link" type="button" data-word="فَاستَعصَمَ" data-root="AYN SAD M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-m/" data-root-meaning="Protecting or preventing harm; iʿtiṣām means holding firmly to." data-context="He held himself back, Joseph resisting the woman’s demand.">فَاستَعصَمَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَفعَل" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="Do, in the condition “if he does not do what I command.”">يَفعَل</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="ءامُرُهُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="I command him, expressing the woman’s demand of Joseph.">ءامُرُهُ</button>
    <button class="word-link" type="button" data-word="لَيُسجَنَنَّ" data-root="S J N" data-learn-more="/quran-terminology/en/roots/s-j-n/" data-root-meaning="Confinement and detention; restricting freedom to move or leave; sijn: prison." data-context="He will surely be imprisoned, the first part of the woman’s threat.">لَيُسجَنَنَّ</button>
    <button class="word-link" type="button" data-word="وَلَيَكونًا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="He will surely be, in the threat that he will be among the abased.">وَلَيَكونًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الصّٰغِرينَ" data-root="SAD GH R" data-learn-more="/quran-terminology/en/roots/sad-gh-r/" data-root-meaning="Smallness in size, age, or quantity; in ṣaghār and ṣāghir, abasement and subordination" data-context="The abased, in the woman’s threat to imprison and abase Joseph.">الصّٰغِرينَ</button>
  </p>
  <p class="english-verse">She said, “This is the one about whom you blamed me. I did seek to seduce him, but he held himself back. If he does not do what I command him, he will surely be imprisoned and be among the humbled.”</p>
</section>
