<section class="ayah-block" id="ayah-090" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:90</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>
    <button class="word-link" type="button" data-word="أَءِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَءِنَّكَ</button>
    <button class="word-link" type="button" data-word="لَأَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَأَنتَ</button>
    <button class="word-link" type="button" data-word="يوسُفُ" data-root-note="Proper name; no root has been assigned.">يوسُفُ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنا۠</button>
    <button class="word-link" type="button" data-word="يوسُفُ" data-root-note="Proper name; no root has been assigned.">يوسُفُ</button>
    <button class="word-link" type="button" data-word="وَهٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهٰذا</button>
    <button class="word-link" type="button" data-word="أَخى" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother; where context warrants, a fellow member of one’s people or an associate.">أَخى</button>
    ۖ
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="مَنَّ" data-root="M N N" data-learn-more="/quran-terminology/en/roots/m-n-n/" data-root-meaning="Granting a marked favor; holding that favor over someone; releasing without compensation; and cutting off, diminishing, or ending.">مَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَتَّقِ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">يَتَّقِ</button>
    <button class="word-link" type="button" data-word="وَيَصبِر" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">وَيَصبِر</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُضيعُ" data-root="Ḍ Y ʿ" data-learn-more="/quran-terminology/en/roots/dad-y-ayn/" data-root-meaning="Loss, neglect and letting something go to waste: from an abandoned right or responsibility to faith, deeds and reward preserved with The God">يُضيعُ</button>
    <button class="word-link" type="button" data-word="أَجرَ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">أَجرَ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">المُحسِنينَ</button>
  </p>
  <p class="english-verse">They said, “Are you indeed Joseph?” He said, “I am Joseph, and this is my brother. The God has favored us. Whoever is mindful and patient—The God does not let the reward of those who do good go to waste.”</p>
</section>
