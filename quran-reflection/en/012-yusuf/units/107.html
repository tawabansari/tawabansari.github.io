<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:107</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَأَمِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Do they feel secure, questioning their sense of safety from punishment or the Hour.">أَفَأَمِنوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَأتِيَهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes upon them, concerning an enveloping punishment.">تَأتِيَهُم</button>
    <button class="word-link" type="button" data-word="غٰشِيَةٌ" data-root="GH SH Y" data-learn-more="/quran-terminology/en/roots/gh-sh-w/" data-root-meaning="Covering, enveloping, being surrounded, and a changed state through covering" data-context="An enveloping thing, punishment that covers them.">غٰشِيَةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, which may arrive as an enveloping calamity.">عَذابِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَأتِيَهُمُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes upon them, concerning the Hour.">تَأتِيَهُمُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour, the time of resurrection in this context.">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="B GH T" data-root-meaning="Something arriving or happening suddenly at a time when its audience did not expect it or was unaware of its approach." data-context="Suddenly, concerning the Hour’s arrival upon the unaware audience." data-learn-more="/quran-terminology/en/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality" data-context="Perceive; negated here concerning the Hour’s approach.">يَشعُرونَ</button>
  </p>
  <p class="english-verse">Do they feel secure from an enveloping punishment of The God coming upon them, or the Hour coming upon them suddenly while they are unaware?</p>
</section>
