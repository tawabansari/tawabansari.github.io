<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰصٰحِبَىِ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="O my two companions; Joseph addressing his fellow prisoners.">يٰصٰحِبَىِ</button>
    <button class="word-link" type="button" data-word="السِّجنِ" data-root="S J N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-j-n/" data-root-meaning="Imprisonment and prison; sijjīn names a place or record of wrongdoers, with differing explanations." data-context="Prison; in the expression for the two prison companions.">السِّجنِ</button>
    <button class="word-link" type="button" data-word="أَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمّا</button>
    <button class="word-link" type="button" data-word="أَحَدُكُما" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="One of you two.">أَحَدُكُما</button>
    <button class="word-link" type="button" data-word="فَيَسقى" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="Will serve a drink; concerning service to a master.">فَيَسقى</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His master; here, the prisoner’s human lord or master.">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="خَمرًا" data-root="KH M R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-m-r/" data-root-meaning="Covering; khamr is an intoxicating drink; khimār is a head covering in established usage." data-context="Wine; an intoxicating drink.">خَمرًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَمَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَمَّا</button>
    <button class="word-link" type="button" data-word="الـٔاخَرُ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The other; the second of the two prisoners.">الـٔاخَرُ</button>
    <button class="word-link" type="button" data-word="فَيُصلَبُ" data-root="SAD L B" data-root-meaning="Hardness and firmness; ṣulb: the backbone and, in genealogical expressions, descent; ṣalb: crucifying a human being." data-context="Then he will be crucified; concerning one of the two prisoners’ fate." data-learn-more="/quran-terminology/en/roots/sad-l-b/">فَيُصلَبُ</button>
    <button class="word-link" type="button" data-word="فَتَأكُلُ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Then eat; referring to the birds.">فَتَأكُلُ</button>
    <button class="word-link" type="button" data-word="الطَّيرُ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record." data-context="The birds.">الطَّيرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَأسِهِ" data-root="R A S" data-root-meaning="The head; by extension, the upper, initial, or principal part of something. Raʾs al-māl: principal property." data-context="His head." data-learn-more="/quran-terminology/en/roots/r-a-s/">رَأسِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُضِىَ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination" data-context="Has been decided or settled; a passive verb.">قُضِىَ</button>
    <button class="word-link" type="button" data-word="الأَمرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-context="The matter about which the two prisoners asked." data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution. As a noun, the affair, matter, or concern under discussion.">الأَمرُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="تَستَفتِيانِ" data-root="F T Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-t-y/" data-root-meaning="A youth and youthfulness; fatwā is an answer clarifying a question." data-context="You two seek a judgment or answer.">تَستَفتِيانِ</button>
  </p>
  <p class="english-verse">My two prison companions, one of you will serve wine to his lord; the other will be crucified, and birds will eat from his head. The affair about which you seek an answer has been decided.”</p>
</section>
