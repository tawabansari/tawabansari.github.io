<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:88</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="دَخَلوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="They entered Joseph’s presence.">دَخَلوا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="The brothers said.">قالوا</button>
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="O mighty one, addressing Joseph as a person in authority.">العَزيزُ</button>
    <button class="word-link" type="button" data-word="مَسَّنا" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="Has touched and afflicted us.">مَسَّنا</button>
    <button class="word-link" type="button" data-word="وَأَهلَنَا" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="And our family.">وَأَهلَنَا</button>
    <button class="word-link" type="button" data-word="الضُّرُّ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="Hardship, deprivation, and affliction affecting them.">الضُّرُّ</button>
    <button class="word-link" type="button" data-word="وَجِئنا" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="And we have come with goods for exchange.">وَجِئنا</button>
    <button class="word-link" type="button" data-word="بِبِضٰعَةٍ" data-root="B DAD AYN" data-root-meaning="Cutting and separating a piece; biḍāʿah: trading assets or merchandise; biḍʿ: a limited number of units, ordinarily three to nine." data-context="With trading goods whose low value or inadequacy is expressed by muzjah." data-learn-more="/quran-terminology/en/roots/b-dad-ayn/">بِبِضٰعَةٍ</button>
    <button class="word-link" type="button" data-word="مُزجىٰةٍ" data-root="Z J W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-j-w/" data-root-meaning="Driving or sending onward; muzjāh denotes something scant or of little value." data-context="Of little value or difficult to get accepted in trade, describing the goods.">مُزجىٰةٍ</button>
    <button class="word-link" type="button" data-word="فَأَوفِ" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense" data-context="So give in full without short measure.">فَأَوفِ</button>
    <button class="word-link" type="button" data-word="لَنَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنَا</button>
    <button class="word-link" type="button" data-word="الكَيلَ" data-root="K Y L" data-learn-more="/quran-terminology/en/roots/k-y-l/" data-root-meaning="Measuring by container, measuring with a measure, delivering the full amount, and volumetric measurement in exchange" data-context="The measure of provisions they request.">الكَيلَ</button>
    <button class="word-link" type="button" data-word="وَتَصَدَّق" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="And be charitable and generous to us.">وَتَصَدَّق</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يَجزِى" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Rewards those who give charity.">يَجزِى</button>
    <button class="word-link" type="button" data-word="المُتَصَدِّقينَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Those who give charity.">المُتَصَدِّقينَ</button>
  </p>
  <p class="english-verse">When they entered before him, they said, “Aziz, hardship has touched us and our family, and we have brought scant merchandise. Give us full measure and give us charity. The God rewards those who give charity.”</p>
</section>
