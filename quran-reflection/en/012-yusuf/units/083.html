    <button class="word-link" type="button" data-word="سَوَّلَت" data-root="S W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-l/" data-root-meaning="A desire of the self; taswīl means making something seem attractive or desirable.">سَوَّلَت</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>

    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">الحَكيمُ</button>

  <p class="english-verse">He said, “Rather, your souls have made a deed seem fair to you. So, beautiful patience. Perhaps The God will bring them all to me. He is the Knowing, the Wise.”</p>
