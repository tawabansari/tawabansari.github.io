<section class="ayah-block" id="ayah-072" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:72</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said, introducing the vessel seekers’ reply to the caravan.">قالوا</button>
    <button class="word-link" type="button" data-word="نَفقِدُ" data-root="F Q D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-d/" data-root-meaning="Missing or losing something; tafaqqūd means checking or looking for it." data-context="We are missing and seeking the king’s measuring vessel.">نَفقِدُ</button>
    <button class="word-link" type="button" data-word="صُواعَ" data-root="SAD W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-ayn/" data-root-meaning="Ṣuwāʿ is a measuring cup or vessel; another branch concerns dispersal." data-context="The king’s measuring vessel or cup, announced as missing.">صُواعَ</button>
    <button class="word-link" type="button" data-word="المَلِكِ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="The king, owner of the vessel being sought.">المَلِكِ</button>
    <button class="word-link" type="button" data-word="وَلِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلِمَن</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Brings or returns the missing vessel.">جاءَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="حِملُ" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy." data-context="A load, the cargo a camel carries, promised as a reward.">حِملُ</button>
    <button class="word-link" type="button" data-word="بَعيرٍ" data-root="B AYN R" data-root-meaning="Baʿīr names a male or female camel; its carrying capacity expresses a quantity of provisions or a reward in the two Qur’anic uses. The root’s other branch, baʿr meaning dung, does not occur in the Qur’an." data-context="A camel, whose load expresses the quantity of the promised reward." data-learn-more="/quran-terminology/en/roots/b-ayn-r/">بَعيرٍ</button>
    <button class="word-link" type="button" data-word="وَأَنا۠" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنا۠</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="زَعيمٌ" data-root="Z AYN M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-ayn-m/" data-root-meaning="An assertion or claim; zaʿīm means a responsible party or guarantor, according to context." data-context="A guarantor who undertakes to deliver the promised reward.">زَعيمٌ</button>
  </p>
  <p class="english-verse">They said, “We are missing the king’s cup. Whoever brings it will have a camel-load, and I guarantee it.”</p>
</section>
