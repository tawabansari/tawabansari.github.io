<section class="ayah-block" id="ayah-086" data-translation-status="provisional">
  <h2 class="ayah-title">Yusuf 12:86</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أَشكوا" data-root="SH K W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-k-w/" data-root-meaning="Complaint and expressing distress; mishkāh is a lamp niche, with debated etymology.">أَشكوا</button>
    <button class="word-link" type="button" data-word="بَثّى" data-root="B TH TH" data-root-meaning="Dispersing, spreading and disclosing: from creatures distributed across the earth to the distress Jacob voices to The God" data-learn-more="/quran-terminology/en/roots/b-th-th/">بَثّى</button>
    <button class="word-link" type="button" data-word="وَحُزنى" data-root="Ḥ Z N" data-learn-more="/quran-terminology/en/roots/h-z-n/" data-root-meaning="Grief, heaviness of the heart, and the inner path becoming rough and difficult">وَحُزنى</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَأَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">وَأَعلَمُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">تَعلَمونَ</button>
  </p>
  <p class="english-verse">He said, “I complain of my anguish and grief only to The God, and I know from The God what you do not know.</p>
</section>
