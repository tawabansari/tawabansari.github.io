  <h2 class="ayah-title">Yusuf 12:56</h2>
  <p class="arabic-text">

  <p class="english-verse">Thus We established Joseph in the land, settling wherever he wished. We bestow Our mercy upon whomever We will, and We do not let the reward of those who do good go to waste.</p>
