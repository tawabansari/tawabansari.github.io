<section class="ayah-block" id="ayah-051" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:51</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنادىٰ" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="And called, Pharaoh addressing his people." data-learn-more="/quran-terminology/en/roots/n-d-y/">وَنادىٰ</button>
    <button class="word-link" type="button" data-word="فِرعَونُ" data-root-note="Proper name; no root has been assigned.">فِرعَونُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="His people, whom Pharaoh addresses." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومِهِ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said, introducing Pharaoh’s speech.">قالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="My people, Pharaoh’s address." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="أَلَيسَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَيسَ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لى</button>
    <button class="word-link" type="button" data-word="مُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Dominion, the claimed rule over Egypt.">مُلكُ</button>
    <button class="word-link" type="button" data-word="مِصرَ" data-root-note="Proper name; no root has been assigned.">مِصرَ</button>
    <button class="word-link" type="button" data-word="وَهٰذِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهٰذِهِ</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="Rivers, the waterways invoked in boasting.">الأَنهٰرُ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="J R Y" data-learn-more="/quran-terminology/en/roots/j-r-y/" data-root-meaning="Flowing, running, continuous movement in a channel, and moving along an appointed course" data-context="Flow, describing the rivers.">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتى" data-root="T Ḥ T" data-learn-more="/quran-terminology/en/roots/t-h-t/" data-root-meaning="Under, beneath, lower position, hidden layer, and foundational or relational placement" data-context="Beneath me, relating the rivers to Pharaoh’s position.">تَحتى</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="تُبصِرونَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="See, inviting observation of outward power.">تُبصِرونَ</button>
  </p>
  <p class="english-verse">Pharaoh called out among his people, saying: My people, do I not possess the kingdom of Egypt and these rivers flowing beneath me? Do you not see?</p>
</section>
