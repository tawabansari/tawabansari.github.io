<section class="ayah-block" id="ayah-079" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:79</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="أَبرَموا" data-root="B R M" data-root-meaning="Twisting firmly and making secure; ibrām of an undertaking means firmly settling a decision or plan." data-context="They have firmly settled an undertaking; a perfect verb about the opponents, without the word alone specifying their plan." data-learn-more="/quran-terminology/en/roots/b-r-m/">أَبرَموا</button>
    <button class="word-link" type="button" data-word="أَمرًا" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding; as a noun, an undertaking, affair, matter, or event being discussed." data-context="An undertaking or matter upon which they have firmly decided; the object of abramū, rather than the act of commanding here.">أَمرًا</button>
    <button class="word-link" type="button" data-word="فَإِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنّا</button>
    <button class="word-link" type="button" data-word="مُبرِمونَ" data-root="B R M" data-root-meaning="Twisting firmly and making secure; ibrām of an undertaking means firmly settling a decision or plan." data-context="We are firmly determining; a plural active participle in the divine response, whose object is unexpressed." data-learn-more="/quran-terminology/en/roots/b-r-m/">مُبرِمونَ</button>
  </p>
  <p class="english-verse">Or have they firmly resolved a matter? We too are firmly resolving.</p>
</section>
