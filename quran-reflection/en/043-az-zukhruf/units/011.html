  <h2 class="ayah-title">Az-Zukhruf 43:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذى</button>
    <button class="word-link" type="button" data-word="نَزَّلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">نَزَّلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّماءِ</button>

    <button class="word-link" type="button" data-word="بِقَدَرٍ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">بِقَدَرٍ</button>

  </p>
  <p class="english-verse">And the One who sent down water from the sky in measure; then with it We revived a dead land. Thus you will be brought out.</p>
