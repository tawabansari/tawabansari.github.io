<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاختَلَفَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Then differed; the groups taking different positions.">فَاختَلَفَ</button>
    <button class="word-link" type="button" data-word="الأَحزابُ" data-root="H Z B" data-root-meaning="Gathering and forming a collective; people joined by a shared affiliation, position, or purpose." data-context="The groups differing over Jesus in the passage." data-learn-more="/quran-terminology/en/roots/h-z-b/">الأَحزابُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِهِم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Among them; where their differences arose.">بَينِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَوَيلٌ" data-root="W Y L" data-learn-more="/quran-terminology/en/roots/w-y-l/" data-root-meaning="From Cries of Grief and Warning to the Announcement of a Dire Outcome" data-context="Then woe; a warning to those who acted unjustly.">فَوَيلٌ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ظَلَموا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Acted unjustly; those warned of punishment.">ظَلَموا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; the penalty of the painful Day.">عَذابِ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Day; the time of the punishment mentioned.">يَومٍ</button>
    <button class="word-link" type="button" data-word="أَليمٍ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful; describing the Day and its suffering.">أَليمٍ</button>
  </p>
  <p class="english-verse">Then the factions among them differed. Woe to those who did wrong, from the punishment of a painful day.</p>
