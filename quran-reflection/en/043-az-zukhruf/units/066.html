<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:66</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="يَنظُرونَ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Await, in the question concerning the Hour’s arrival.">يَنظُرونَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="السّاعَةَ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour, whose coming is at issue.">السّاعَةَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَأتِيَهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes upon them, referring to the Hour.">تَأتِيَهُم</button>
    <button class="word-link" type="button" data-word="بَغتَةً" data-root="B GH T" data-root-meaning="Something arriving or happening suddenly at a time when its audience did not expect it or was unaware of its approach." data-context="Suddenly, describing the Hour’s arrival while its audience is unaware." data-learn-more="/quran-terminology/en/roots/b-gh-t/">بَغتَةً</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality" data-context="Perceive; negated to express unawareness of the Hour’s arrival.">يَشعُرونَ</button>
  </p>
  <p class="english-verse">Do they await anything but the Hour coming upon them suddenly while they are unaware?</p>
</section>
