<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَزُخرُفًا" data-root="Z KH R F" data-root-meaning="Gold, ornament, and striking adornment; decorative patterns and display that make something beautiful and conspicuous." data-context="And gold and ornament: gold or splendid adornment, continuing the conditional account of worldly luxury." data-learn-more="/quran-terminology/en/roots/z-kh-r-f/">وَزُخرُفًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="All: the whole of the amenities and luxuries mentioned.">كُلُّ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمّا</button>
    <button class="word-link" type="button" data-word="مَتٰعُ" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="Enjoyment or provision: here, the limited enjoyment of worldly life.">مَتٰعُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life: the worldly life to which those luxuries belong.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Worldly: describing the present, nearer life in contrast to the Hereafter.">الدُّنيا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالـٔاخِرَةُ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="And the Hereafter: the life to come, contrasted with worldly enjoyment.">وَالـٔاخِرَةُ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord: with whom the Hereafter is for the God-conscious.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="لِلمُتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="For the God-conscious: those who guard their conduct against disobedience and harm.">لِلمُتَّقينَ</button>
  </p>
  <p class="english-verse">And gold adornment. All that is merely the enjoyment of the worldly life; the Hereafter with your Lord is for the mindful.</p>
</section>
