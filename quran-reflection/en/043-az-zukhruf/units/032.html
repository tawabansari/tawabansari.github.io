<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَهُم</button>
    <button class="word-link" type="button" data-word="يَقسِمونَ" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="Distribute; asking about apportioning the Lord’s mercy.">يَقسِمونَ</button>
    <button class="word-link" type="button" data-word="رَحمَتَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Mercy; whose distribution is questioned.">رَحمَتَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; the source of that mercy.">رَبِّكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">نَحنُ</button>
    <button class="word-link" type="button" data-word="قَسَمنا" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="We have apportioned; concerning people’s livelihood.">قَسَمنا</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Among them; the relationship within which livelihood is apportioned.">بَينَهُم</button>
    <button class="word-link" type="button" data-word="مَعيشَتَهُم" data-root="AYN Y SH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-y-sh/" data-root-meaning="Living and the means of livelihood." data-context="Their livelihood; their means of living.">مَعيشَتَهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life; in the expression worldly life.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Worldly; describing present, nearer life.">الدُّنيا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَرَفَعنا" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one." data-context="And We have raised; describing differing positions.">وَرَفَعنا</button>
    <button class="word-link" type="button" data-word="بَعضَهُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Some of them; those placed higher in the comparison.">بَعضَهُم</button>
    <button class="word-link" type="button" data-word="فَوقَ" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above; relating positions in the comparison.">فَوقَ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Others; the other side of the comparison of ranks.">بَعضٍ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="D R J" data-learn-more="/quran-terminology/en/roots/d-r-j/" data-root-meaning="Stepwise movement and passage; steps and rank; istidrāj: progressively leading onward." data-context="Degrees; differing positions and livelihood in worldly life.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="لِيَتَّخِذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="So they may employ; the stated purpose within this relationship.">لِيَتَّخِذَ</button>
    <button class="word-link" type="button" data-word="بَعضُهُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Some of them; those employing others.">بَعضُهُم</button>
    <button class="word-link" type="button" data-word="بَعضًا" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Others; those employed in service.">بَعضًا</button>
    <button class="word-link" type="button" data-word="سُخرِيًّا" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/" data-context="In service; within the relationship of employing others.">سُخرِيًّا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَرَحمَتُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="And mercy; described as better than accumulated possessions.">وَرَحمَتُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; the source of mercy in the ending.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better; comparing mercy with what they accumulate.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="يَجمَعونَ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="They gather; worldly possessions and resources.">يَجمَعونَ</button>
  </p>
  <p class="english-verse">Do they distribute your Lord’s mercy? We have distributed their livelihood among them in the worldly life and raised some above others in degrees, so that some may take others into service. Your Lord’s mercy is better than what they gather.</p>
</section>
