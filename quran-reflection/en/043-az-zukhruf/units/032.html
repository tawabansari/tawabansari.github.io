  <h2 class="ayah-title">Az-Zukhruf 43:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَهُم</button>
    <button class="word-link" type="button" data-word="يَقسِمونَ" data-root="Q S M" data-root-note="Root study coming soon.">يَقسِمونَ</button>
    <button class="word-link" type="button" data-word="رَحمَتَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحمَتَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكَ</button>

    <button class="word-link" type="button" data-word="قَسَمنا" data-root="Q S M" data-root-note="Root study coming soon.">قَسَمنا</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَهُم</button>
    <button class="word-link" type="button" data-word="مَعيشَتَهُم" data-root="AYN Y SH" data-root-note="Root study coming soon.">مَعيشَتَهُم</button>

    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَرَفَعنا" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one.">وَرَفَعنا</button>

    <button class="word-link" type="button" data-word="فَوقَ" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number">فَوقَ</button>

    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="D R J" data-root-note="Root study coming soon.">دَرَجٰتٍ</button>
    <button class="word-link" type="button" data-word="لِيَتَّخِذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">لِيَتَّخِذَ</button>

    <button class="word-link" type="button" data-word="سُخرِيًّا" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/">سُخرِيًّا</button>
    ۗ
    <button class="word-link" type="button" data-word="وَرَحمَتُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">وَرَحمَتُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٌ</button>

    <button class="word-link" type="button" data-word="يَجمَعونَ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field">يَجمَعونَ</button>
  </p>
  <p class="english-verse">Do they distribute your Lord’s mercy? We have distributed their livelihood among them in the worldly life and raised some above others in degrees, so that some may take others into service. Your Lord’s mercy is better than what they gather.</p>
</section>
