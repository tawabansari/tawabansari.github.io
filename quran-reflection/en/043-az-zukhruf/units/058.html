<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:58</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said; introducing the criticized comparison.">وَقالوا</button>
    <button class="word-link" type="button" data-word="ءَأٰلِهَتُنا" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Our deities; in the speakers’ question.">ءَأٰلِهَتُنا</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better; the alleged comparison between their deities and the person mentioned.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="ضَرَبوهُ" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="They presented it as an example and comparison.">ضَرَبوهُ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="جَدَلًا" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="Disputation and contention; the motive for the comparison raised by the contentious group." data-learn-more="/quran-terminology/en/roots/j-d-l/">جَدَلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="A people or group; describing the speakers." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومٌ</button>
    <button class="word-link" type="button" data-word="خَصِمونَ" data-root="KH SAD M" data-root-meaning="Two parties confronting and disputing over a claim, right, or contested issue; khasm denotes a party to the dispute." data-context="Contentious; describing those raising the comparison for argument." data-learn-more="/quran-terminology/en/roots/kh-sad-m/">خَصِمونَ</button>
  </p>
  <p class="english-verse">They said: Are our gods better, or he? They presented it to you only for argument. Rather, they are a contentious people.</p>
</section>
