<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلوا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="They assigned or attributed; assigning Him a portion from among His servants.">وَجَعَلوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="His servants; those from among whom a portion is attributed to Him.">عِبادِهِ</button>
    <button class="word-link" type="button" data-word="جُزءًا" data-root="J Z A" data-root-meaning="A part or share of a whole; in another verbal branch, sufficing and making do." data-context="A portion from among His servants, attributed to Him." data-learn-more="/quran-terminology/en/roots/j-z-a/">جُزءًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being, described in the following words as ungrateful.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="لَكَفورٌ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Indeed deeply ungrateful; describing the human being’s ingratitude toward Him.">لَكَفورٌ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Manifest or clear; qualifying the human being’s ingratitude.">مُبينٌ</button>
  </p>
  <p class="english-verse">Yet they assigned to Him a portion of His servants. Indeed, the human being is clearly ungrateful.</p>
