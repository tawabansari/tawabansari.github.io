  <h2 class="ayah-title">Az-Zukhruf 43:64</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبّى</button>
    <button class="word-link" type="button" data-word="وَرَبُّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">وَرَبُّكُم</button>
    <button class="word-link" type="button" data-word="فَاعبُدوهُ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">فَاعبُدوهُ</button>

    <button class="word-link" type="button" data-word="صِرٰطٌ" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/">صِرٰطٌ</button>

  <p class="english-verse">The God is my Lord and your Lord, so worship Him. This is a straight path.</p>
