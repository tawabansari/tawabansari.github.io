  <h2 class="ayah-title">Az-Zukhruf 43:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَعِلمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">لَعِلمٌ</button>

    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَمتَرُنَّ" data-root="M R Y" data-learn-more="/quran-terminology/en/roots/m-r-y/" data-root-meaning="Doubt, uncertainty and disputation: from drawing out milk to contesting truth, and the boundary between questioning and mirāʾ in the Qur’an">تَمتَرُنَّ</button>

    <button class="word-link" type="button" data-word="صِرٰطٌ" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/">صِرٰطٌ</button>
    <button class="word-link" type="button" data-word="مُستَقيمٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">مُستَقيمٌ</button>
  </p>
  <p class="english-verse">He is surely knowledge of the Hour; so do not doubt it, and follow me. This is a straight path.</p>
