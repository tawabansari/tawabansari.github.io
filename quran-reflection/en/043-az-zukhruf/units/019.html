<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلُوا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And designated or considered: they attributed female sex to angels.">وَجَعَلُوا</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةَ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="The angels, the subject of claims of feminine naming or female creation.">المَلٰئِكَةَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="عِبٰدُ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="An enslaved person, in the retaliation provision.">عِبٰدُ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="The Entirely Merciful, whose servants the angels are described as being.">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="إِنٰثًا" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="Female: the description people attribute to angels, whose grounds of knowledge are challenged.">إِنٰثًا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَشَهِدوا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Did they witness? Questioning presence at the angels’ creation.">أَشَهِدوا</button>
    <button class="word-link" type="button" data-word="خَلقَهُم" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Their creation, concerning the angels.">خَلقَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="سَتُكتَبُ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="Will be recorded: passive, concerning the claimants’ testimony.">سَتُكتَبُ</button>
    <button class="word-link" type="button" data-word="شَهٰدَتُهُم" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Their testimony, which is recorded and questioned.">شَهٰدَتُهُم</button>
    <button class="word-link" type="button" data-word="وَيُسـَٔلونَ" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="And they will be questioned: passive, concerning the claimants.">وَيُسـَٔلونَ</button>
  </p>
  <p class="english-verse">They made the angels, who are servants of the Entirely Merciful, female. Did they witness their creation? Their testimony will be recorded, and they will be questioned.</p>
</section>
