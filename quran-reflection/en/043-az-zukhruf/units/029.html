<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zukhruf 43:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>

    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰؤُلاءِ</button>

    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="جاءَهُمُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَهُمُ</button>

    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">مُبينٌ</button>
  </p>
  <p class="english-verse">Rather, I let these people and their fathers enjoy themselves until the truth and a clarifying messenger came to them.</p>
