<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mujadilah 58:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed; the believers addressed by the instruction to make room in gatherings.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="It is said; when you are asked to make room in gatherings.">قيلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="تَفَسَّحوا" data-root="F S H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-s-h/" data-root-meaning="Making room or providing spaciousness." data-context="Make room; widen the available space so others can attend the gathering.">تَفَسَّحوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="المَجٰلِسِ" data-root="J L S" data-root-meaning="Sitting; a sitting place and gathering; and, in other early usages, elevated ground." data-context="Gatherings and sitting places; here, assemblies in which believers are asked to make room for others." data-learn-more="/quran-terminology/en/roots/j-l-s/">المَجٰلِسِ</button>
    <button class="word-link" type="button" data-word="فَافسَحوا" data-root="F S H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-s-h/" data-root-meaning="Making room or providing spaciousness." data-context="Then make room; respond to the request to provide space for others.">فَافسَحوا</button>
    <button class="word-link" type="button" data-word="يَفسَحِ" data-root="F S H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-s-h/" data-root-meaning="Making room or providing spaciousness." data-context="Grants spaciousness; God grants you spaciousness in response to making room for others, without this expression restricting its precise form.">يَفسَحِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="It is said; when you are asked to rise.">قيلَ</button>
    <button class="word-link" type="button" data-word="انشُزوا" data-root="N SH Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-z/" data-root-meaning="Rising or moving up; nushūz in relationships denotes estrangement or discord." data-context="Rise; get up from your seats. The verb itself does not specify the precise reason for rising.">انشُزوا</button>
    <button class="word-link" type="button" data-word="فَانشُزوا" data-root="N SH Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-z/" data-root-meaning="Rising or moving up; nushūz in relationships denotes estrangement or discord." data-context="Then rise; comply with the instruction to get up.">فَانشُزوا</button>
    <button class="word-link" type="button" data-word="يَرفَعِ" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one." data-context="Raises; God elevates believers and those given knowledge by degrees.">يَرفَعِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed; those among you whose elevation the verse describes.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتُوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Have been given; those who have been given knowledge. The verb is passive.">أوتُوا</button>
    <button class="word-link" type="button" data-word="العِلمَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge; what the verse describes as given to people whose ranks God raises.">العِلمَ</button>
    <button class="word-link" type="button" data-word="دَرَجٰتٍ" data-root="D R J" data-learn-more="/quran-terminology/en/roots/d-r-j/" data-root-meaning="Stepwise movement and passage; steps and rank; istidrāj: progressively leading onward." data-context="Degrees or ranks; the levels of elevation of believers and those given knowledge in this verse.">دَرَجٰتٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You do; the actions you perform, of which God is fully aware.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Fully aware; describing God’s awareness of what you do." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرٌ</button>
  </p>
  <p class="english-verse">O you who believe, when you are told to make room in gatherings, make room; The God will make room for you. When you are told to rise, rise. The God will raise those among you who believe and those given knowledge by degrees. The God is aware of what you do.</p>
</section>
