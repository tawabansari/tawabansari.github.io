<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mujadilah 58:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يُظٰهِرونَ" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support" data-context="Pronounce ẓihār; concerning their wives.">يُظٰهِرونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="نِسائِهِم" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="Their wives; those concerning whom ẓihār is pronounced.">نِسائِهِم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَعودونَ" data-root="AYN W D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-d/" data-root-meaning="Returning or repeating; ʿīd is a recurring occasion; ʿĀd is also a people&#x27;s proper name." data-context="Return or go back on; concerning the earlier statement, in the context of resuming intimacy.">يَعودونَ</button>
    <button class="word-link" type="button" data-word="لِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِما</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said; the earlier pronouncement of ẓihār.">قالوا</button>
    <button class="word-link" type="button" data-word="فَتَحريرُ" data-root="H R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-r-r/" data-root-meaning="Freedom and liberation; also heat and, in another branch, silk." data-context="Then emancipation; the obligation before marital contact.">فَتَحريرُ</button>
    <button class="word-link" type="button" data-word="رَقَبَةٍ" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="A person in bondage; emancipation is required before marital contact in the provision concerning ẓihār." data-learn-more="/quran-terminology/en/roots/r-q-b/">رَقَبَةٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before; the timing qualification for emancipation.">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَتَماسّا" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="The two touch one another; referring to marital intimacy.">يَتَماسّا</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكُم</button>
    <button class="word-link" type="button" data-word="توعَظونَ" data-root="W AYN ZH (W ʿ Ẓ)" data-learn-more="/quran-terminology/en/roots/w-ayn-zha/" data-root-meaning="Admonishing, counseling, warning, and reminding of consequences in order to make one attentive and reform conduct." data-context="You are admonished by it; the provision’s admonitory function.">توعَظونَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You do; the addressees’ conduct, which does not escape divine knowledge.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-b-r/" data-root-meaning="News and knowledge gained through familiarity or experience." data-context="Fully aware; describing The God’s detailed knowledge of conduct.">خَبيرٌ</button>
  </p>
  <p class="english-verse">Those who liken their wives to their mothers’ backs and then go back on what they said must free a slave before the two touch one another. That is what you are admonished with; The God is aware of what you do.</p>
</section>
