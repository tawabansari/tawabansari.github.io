<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mujadilah 58:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="تُغنِىَ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting.">تُغنِىَ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    <button class="word-link" type="button" data-word="أَموٰلُهُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">أَموٰلُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="أَولٰدُهُم" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth">أَولٰدُهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="أَصحٰبُ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides">أَصحٰبُ</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّارِ</button>
    ۖ
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place">خٰلِدونَ</button>
  </p>
  <p class="english-verse">Their wealth and children will avail them nothing against The God. They are the companions of the Fire, remaining in it forever.</p>
</section>
