<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mujadilah 58:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="أَيمٰنَهُم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing.">أَيمٰنَهُم</button>
    <button class="word-link" type="button" data-word="جُنَّةً" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">جُنَّةً</button>
    <button class="word-link" type="button" data-word="فَصَدّوا" data-root="SAD D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-d-d/" data-root-meaning="Turning away or preventing another.">فَصَدّوا</button>

    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سَبيلِ</button>

    <button class="word-link" type="button" data-word="مُهينٌ" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status">مُهينٌ</button>
  </p>
  <p class="english-verse">They have taken their oaths as a shield and barred the way of The God; for them there is a humiliating punishment.</p>
