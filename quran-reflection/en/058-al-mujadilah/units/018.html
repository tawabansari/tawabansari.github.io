<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mujadilah 58:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day; the time of their being raised together.">يَومَ</button>
    <button class="word-link" type="button" data-word="يَبعَثُهُمُ" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task." data-context="He raises them; in the resurrection scene.">يَبعَثُهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="All together; including the entire group mentioned.">جَميعًا</button>
    <button class="word-link" type="button" data-word="فَيَحلِفونَ" data-root="H L F" data-root-meaning="Swearing an oath to affirm a claim or strengthen a commitment; حَلَّاف describes someone who swears frequently." data-context="Then they swear to Him in the resurrection scene." data-learn-more="/quran-terminology/en/roots/h-l-f/">فَيَحلِفونَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَما</button>
    <button class="word-link" type="button" data-word="يَحلِفونَ" data-root="H L F" data-root-meaning="Swearing an oath to affirm a claim or strengthen a commitment; حَلَّاف describes someone who swears frequently." data-context="They swear; their conduct before their worldly audience, used for comparison." data-learn-more="/quran-terminology/en/roots/h-l-f/">يَحلِفونَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَيَحسَبونَ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="And they suppose; their assessment of their position’s standing.">وَيَحسَبونَ</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Something; in their supposition that their position has substance.">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الكٰذِبونَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="The liars; the description the verse explicitly assigns to them.">الكٰذِبونَ</button>
  </p>
  <p class="english-verse">On the day The God raises them all, they will swear to Him as they swear to you, thinking they stand on something. Indeed, they are the liars.</p>
</section>
