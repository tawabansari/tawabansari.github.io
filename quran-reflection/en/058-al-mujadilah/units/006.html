<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mujadilah 58:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>
    <button class="word-link" type="button" data-word="يَبعَثُهُمُ" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task.">يَبعَثُهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field">جَميعًا</button>
    <button class="word-link" type="button" data-word="فَيُنَبِّئُهُم" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”">فَيُنَبِّئُهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">عَمِلوا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَحصىٰهُ" data-root="H SAD Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sad-y/" data-root-meaning="Pebbles; iḥṣāʾ means counting or comprehensively enumerating.">أَحصىٰهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="وَنَسوهُ" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">وَنَسوهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="شَهيدٌ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">شَهيدٌ</button>
  </p>
  <p class="english-verse">On the day The God raises them all, He will inform them of what they did. The God has counted it, while they have forgotten it; The God is witness over all things.</p>
</section>
