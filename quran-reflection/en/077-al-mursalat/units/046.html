<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mursalat 77:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Eat">كُلوا</button>
    <button class="word-link" type="button" data-word="وَتَمَتَّعوا" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="And enjoy">وَتَمَتَّعوا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="For a little while">قَليلًا</button>
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="مُجرِمونَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="Wrongdoers; those who commit wrongful acts" data-learn-more="/quran-terminology/en/roots/j-r-m/">مُجرِمونَ</button>
  </p>
  <p class="english-verse">Eat and enjoy yourselves a little; you are guilty.</p>
