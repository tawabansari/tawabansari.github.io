<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mursalat 77:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And We placed in the earth.">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="R S W" data-learn-more="/quran-terminology/en/roots/r-s-w/" data-root-meaning="Settling, becoming fixed, and remaining firm; establishing firmly. Qur’anic uses concern firm mountains, fixed pots, a ship coming to rest, and the time of the Hour." data-context="Firmly established mountains.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="شٰمِخٰتٍ" data-root="SH M KH" data-learn-more="/quran-terminology/en/roots/sh-m-kh/" data-root-meaning="Height, elevation, and loftiness; in the Quran, mountain height; in certain human expressions, arrogance or elevated standing." data-context="Lofty and towering; describing the mountains.">شٰمِخٰتٍ</button>
    <button class="word-link" type="button" data-word="وَأَسقَينٰكُم" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="And We supplied you with water to drink.">وَأَسقَينٰكُم</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Water, supplied for drinking.">ماءً</button>
    <button class="word-link" type="button" data-word="فُراتًا" data-root="F R T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-t/" data-root-meaning="Fresh, pleasantly drinkable water." data-context="Fresh and sweet; describing the water.">فُراتًا</button>
  </p>
  <p class="english-verse">We placed lofty, firmly set mountains in it and gave you sweet water to drink.</p>
</section>
