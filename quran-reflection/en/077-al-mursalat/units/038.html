<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mursalat 77:38</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="يَومُ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day of.">يَومُ</button>
    <button class="word-link" type="button" data-word="الفَصلِ" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="Judgment or decisive settlement; in “the Day of Judgment.”" data-learn-more="/quran-terminology/en/roots/f-sad-l/">الفَصلِ</button>
    ۖ
    <button class="word-link" type="button" data-word="جَمَعنٰكُم" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="We gathered you.">جَمَعنٰكُم</button>
    <button class="word-link" type="button" data-word="وَالأَوَّلينَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="And those of former times.">وَالأَوَّلينَ</button>
  </p>
  <p class="english-verse">This is the Day of Decision. We have gathered you and the earlier peoples.</p>
