<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hadid 57:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاليَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">فَاليَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُؤخَذُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">يُؤخَذُ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="فِديَةٌ" data-root="F D Y" data-learn-more="/quran-terminology/en/roots/f-d-y/" data-root-meaning="Release in exchange for something placed in another’s stead">فِديَةٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>
    ۚ
    <button class="word-link" type="button" data-word="مَأوىٰكُمُ" data-root="A W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="Taking shelter or finding lodging; īwāʾ: sheltering; maʾwā: a refuge or dwelling.">مَأوىٰكُمُ</button>
    <button class="word-link" type="button" data-word="النّارُ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّارُ</button>
    ۖ
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هِىَ</button>
    <button class="word-link" type="button" data-word="مَولىٰكُم" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">مَولىٰكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="Ṣ Y R" data-learn-more="/quran-terminology/en/roots/sad-y-r/" data-root-meaning="Reaching an end: maṣīr as the outcome to which affairs lead">المَصيرُ</button>
  </p>
  <p class="english-verse">Today no ransom will be accepted from you or from those who disbelieved. Your refuge is the Fire; it is your protector. What an evil destination!”</p>
