  <h2 class="ayah-title">Al-Hadid 57:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="نوحًا" data-root-note="Proper name; no root has been assigned.">نوحًا</button>
    <button class="word-link" type="button" data-word="وَإِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">وَإِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">وَجَعَلنا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتِهِمَا" data-root="DH R R" data-learn-more="/quran-terminology/en/roots/dh-r-r/" data-root-meaning="Dharrah: perceptible smallness; dhurriyyah: descendants and the question of origin">ذُرِّيَّتِهِمَا</button>
    <button class="word-link" type="button" data-word="النُّبُوَّةَ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”">النُّبُوَّةَ</button>
    <button class="word-link" type="button" data-word="وَالكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">وَالكِتٰبَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمِنهُم</button>
    <button class="word-link" type="button" data-word="مُهتَدٍ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">مُهتَدٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَثيرٌ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">وَكَثيرٌ</button>

    <button class="word-link" type="button" data-word="فٰسِقونَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command">فٰسِقونَ</button>
  </p>
  <p class="english-verse">We sent Noah and Abraham and placed prophethood and the Book among their descendants. Some of them are guided, while many of them are defiantly disobedient.</p>
