  <h2 class="ayah-title">Al-Hadid 57:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِكَيلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِكَيلا</button>

    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>

    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>

    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلَّ</button>

    <button class="word-link" type="button" data-word="فَخورٍ" data-root="F KH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-kh-r/" data-root-meaning="Boasting or taking pride; fakhkhār is fired pottery in another branch.">فَخورٍ</button>

  <p class="english-verse">so that you do not grieve over what has escaped you or exult in what He has given you. The God does not love anyone conceited and boastful,</p>
