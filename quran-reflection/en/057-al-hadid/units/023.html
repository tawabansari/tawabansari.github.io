<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hadid 57:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِكَيلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِكَيلا</button>
    <button class="word-link" type="button" data-word="تَأسَوا" data-root="A S Y" data-learn-more="/quran-terminology/en/roots/a-s-w/" data-root-meaning="being affected by loss, an unfulfilled hope, or people’s conduct; a branch whose derivational relationship to A S W is not classified uniformly in lexical sources." data-context="do not grieve">تَأسَوا</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فاتَكُم" data-root="F W T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-w-t/" data-root-meaning="Passing beyond reach; tafāwut denotes disparity or inconsistency." data-context="has escaped you">فاتَكُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَفرَحوا" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context." data-context="do not exult">تَفرَحوا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="ءاتىٰكُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="has given you">ءاتىٰكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="does not love">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="any; in the negation">كُلَّ</button>
    <button class="word-link" type="button" data-word="مُختالٍ" data-root="KH Y L" data-learn-more="/quran-terminology/en/roots/kh-y-l/" data-root-meaning="The appearance or conception of something in the mind or before the eyes; movement accompanied by display. Specific derivatives denote horses, producing an impression, and arrogant ostentation." data-context="conceited">مُختالٍ</button>
    <button class="word-link" type="button" data-word="فَخورٍ" data-root="F KH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-kh-r/" data-root-meaning="Boasting or taking pride; fakhkhār is fired pottery in another branch." data-context="boastful">فَخورٍ</button>
  </p>
  <p class="english-verse">so that you do not grieve over what has escaped you or exult in what He has given you. The God does not love anyone conceited and boastful,</p>
</section>
