<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hadid 57:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="مُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/">مُلكُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/">وَالأَرضِ</button>
    ۖ
    <button class="word-link" type="button" data-word="يُحيۦ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/">يُحيۦ</button>
    <button class="word-link" type="button" data-word="وَيُميتُ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">وَيُميتُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="قَديرٌ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">قَديرٌ</button>
  </p>
  <p class="english-verse">His is the dominion of the heavens and the earth. He gives life and causes death, and He is able to do all things.</p>
