  <h2 class="ayah-title">Al-Hadid 57:12</h2>

  <p class="english-verse">On the day you see believing men and women, their light running before them and to their right: “Your good news today is gardens beneath which rivers flow, where you will remain forever.” That is the great triumph.</p>
