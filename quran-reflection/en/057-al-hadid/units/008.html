<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hadid 57:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">تُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    ۙ
    <button class="word-link" type="button" data-word="وَالرَّسولُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَالرَّسولُ</button>
    <button class="word-link" type="button" data-word="يَدعوكُم" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity">يَدعوكُم</button>
    <button class="word-link" type="button" data-word="لِتُؤمِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">لِتُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِرَبِّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">بِرَبِّكُم</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="أَخَذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">أَخَذَ</button>
    <button class="word-link" type="button" data-word="ميثٰقَكُم" data-root="W TH Q" data-learn-more="/quran-terminology/en/roots/w-th-q/" data-root-meaning="Firmness, reliability, secure binding, and a commitment that is not loose or abandoned">ميثٰقَكُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُم</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">مُؤمِنينَ</button>
  </p>
  <p class="english-verse">What is the matter with you that you do not believe in The God, while the messenger calls you to believe in your Lord and He has taken your covenant, if you are believers?</p>
</section>
