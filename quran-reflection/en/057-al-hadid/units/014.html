<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hadid 57:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُنادونَهُم" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="They call to them, one group addressing another in the hereafter." data-learn-more="/quran-terminology/en/roots/n-d-y/">يُنادونَهُم</button>
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="نَكُن" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, asking about previous companionship.">نَكُن</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said, the addressed group’s reply.">قالوا</button>
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَلىٰ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنَّكُم</button>
    <button class="word-link" type="button" data-word="فَتَنتُم" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction" data-context="You put to trial or led astray, concerning yourselves.">فَتَنتُم</button>
    <button class="word-link" type="button" data-word="أَنفُسَكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Yourselves, the object of the trial or misguidance.">أَنفُسَكُم</button>
    <button class="word-link" type="button" data-word="وَتَرَبَّصتُم" data-root="R B SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-b-sad/" data-root-meaning="Waiting and watching for an event." data-context="And waited or held back.">وَتَرَبَّصتُم</button>
    <button class="word-link" type="button" data-word="وَارتَبتُم" data-root="R Y B" data-learn-more="/quran-terminology/en/roots/r-y-b/" data-root-meaning="Unsettled doubt, distrust, suspicion, destabilizing uncertainty, anxiety before truth, and a state that blocks confidence and rational submission before proof" data-context="And doubted or became uncertain.">وَارتَبتُم</button>
    <button class="word-link" type="button" data-word="وَغَرَّتكُمُ" data-root="GH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-r/" data-root-meaning="Deception or reliance on a misleading appearance." data-context="And deceived you, the effect of wishes.">وَغَرَّتكُمُ</button>
    <button class="word-link" type="button" data-word="الأَمانِىُّ" data-root="M N Y" data-learn-more="/quran-terminology/en/roots/m-n-y/" data-root-meaning="From Apportioning and Wishing to Recitation, Amānī, and Semen" data-context="Wishes or hopes that deceived.">الأَمانِىُّ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came, the arrival of The God’s decree.">جاءَ</button>
    <button class="word-link" type="button" data-word="أَمرُ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-context="The decree or appointed outcome." data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution. As a noun, the affair, matter, or concern under discussion.">أَمرُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَغَرَّكُم" data-root="GH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-r/" data-root-meaning="Deception or reliance on a misleading appearance." data-context="And deceived you concerning The God.">وَغَرَّكُم</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="الغَرورُ" data-root="GH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-r/" data-root-meaning="Deception or reliance on a misleading appearance." data-context="The deceiver, the agent of deception.">الغَرورُ</button>
  </p>
  <p class="english-verse">They call out to them, “Were we not with you?” They say, “Yes, but you put yourselves into temptation, waited, and doubted. Wishes deceived you until the command of The God came, and the deceiver deceived you about The God.</p>
</section>
