<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hadid 57:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="المُصَّدِّقينَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">المُصَّدِّقينَ</button>
    <button class="word-link" type="button" data-word="وَالمُصَّدِّقٰتِ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">وَالمُصَّدِّقٰتِ</button>
    <button class="word-link" type="button" data-word="وَأَقرَضُوا" data-root="Q R DAD" data-learn-more="/quran-terminology/en/roots/q-r-dad/" data-root-meaning="Cutting off a portion of wealth, separating it and giving it with expectation of return or reward, lending, and temporarily transferring something from one’s possession">وَأَقرَضُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قَرضًا" data-root="Q R DAD" data-learn-more="/quran-terminology/en/roots/q-r-dad/" data-root-meaning="Cutting off a portion of wealth, separating it and giving it with expectation of return or reward, lending, and temporarily transferring something from one’s possession">قَرضًا</button>
    <button class="word-link" type="button" data-word="حَسَنًا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">حَسَنًا</button>
    <button class="word-link" type="button" data-word="يُضٰعَفُ" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase.">يُضٰعَفُ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="أَجرٌ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">أَجرٌ</button>
    <button class="word-link" type="button" data-word="كَريمٌ" data-root="K R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-m/" data-root-meaning="Nobility, honor, or generosity.">كَريمٌ</button>
  </p>
  <p class="english-verse">For the men and women who give charity and lend The God a good loan, it will be multiplied, and they will have a noble reward.</p>
</section>
