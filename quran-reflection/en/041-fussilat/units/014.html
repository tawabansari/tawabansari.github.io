<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="جاءَتهُمُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَتهُمُ</button>
    <button class="word-link" type="button" data-word="الرُّسُلُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرُّسُلُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينِ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="خَلفِهِم" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">خَلفِهِم</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعبُدوا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">تَعبُدوا</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شاءَ</button>
    <button class="word-link" type="button" data-word="رَبُّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّنا</button>
    <button class="word-link" type="button" data-word="لَأَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">لَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="مَلٰئِكَةً" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an">مَلٰئِكَةً</button>
    <button class="word-link" type="button" data-word="فَإِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنّا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="أُرسِلتُم" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">أُرسِلتُم</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="كٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كٰفِرونَ</button>
  </p>
  <p class="english-verse">When the messengers came to them from before them and behind them, saying, “Worship none but The God,” they said, “Had our Lord willed, He would have sent down angels. We reject what you have been sent with.”</p>
</section>
