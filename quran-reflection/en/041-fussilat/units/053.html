<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:53</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَنُريهِم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="We shall show them; a future showing, with “We” as subject and “them” as object.">سَنُريهِم</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs, which will be shown to them in the world’s regions and in themselves.">ءايٰتِنا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الـٔافاقِ" data-root="A F Q" data-learn-more="/quran-terminology/en/roots/a-f-q/" data-root-meaning="A horizon or region within an expanse, especially the farthest reach of sight in the relation between sky and earth; in the plural, different regions and reaches of the world." data-context="In the āfāq: the world’s regions and reaches, contrasted with “in themselves.”">الـٔافاقِ</button>
    <button class="word-link" type="button" data-word="وَفى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفى</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="In themselves; the people addressed are also a field where signs will be shown.">أَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يَتَبَيَّنَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Until it becomes clear to them that what “it” refers to is the truth.">يَتَبَيَّنَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="The truth; what the audience is to recognize the pronoun’s referent as being.">الحَقُّ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَكفِ" data-root="K F Y" data-learn-more="/quran-terminology/en/roots/k-f-y/" data-root-meaning="Sufficiency: meeting a need and handling another’s affairs; The God’s sufficiency in witnessing, reckoning, aid, and protection" data-context="Be sufficient; the question concerns the sufficiency of the Lord’s being witness over everything.">يَكفِ</button>
    <button class="word-link" type="button" data-word="بِرَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, whose being witness over everything is stated here.">بِرَبِّكَ</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every or all; with “thing,” it expresses the comprehensive scope of witnessing.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing; in “every thing,” whatever falls within the Lord’s witnessing.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="شَهيدٌ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Witness; the Lord is witness over everything.">شَهيدٌ</button>
  </p>
  <p class="english-verse">We will show them Our signs on the horizons and within themselves until it becomes clear to them that it is the truth. Is it not sufficient that your Lord is witness over all things?</p>
</section>
