<section class="ayah-block" id="ayah-047" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:47</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="يُرَدُّ" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="Is referred back to Him: knowledge of the Hour.">يُرَدُّ</button>
    <button class="word-link" type="button" data-word="عِلمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge: here, knowledge of the Hour.">عِلمُ</button>
    <button class="word-link" type="button" data-word="السّاعَةِ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour, knowledge of which is referred to The God.">السّاعَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَخرُجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Emerges: fruit coming from its covering.">تَخرُجُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ثَمَرٰتٍ" data-root="TH M R" data-learn-more="/quran-terminology/en/roots/th-m-r/" data-root-meaning="Fruit and produce, with extensions to yield and wealth" data-context="Fruits, described as emerging from coverings.">ثَمَرٰتٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَكمامِها" data-root="K M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-m-m/" data-root-meaning="Covering; akmām are coverings of fruit or blossom." data-context="The fruits’ coverings or sheaths, rather than clothing sleeves.">أَكمامِها</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَحمِلُ" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy." data-context="Carries offspring or conceives: the female is the subject.">تَحمِلُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أُنثىٰ" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="A female carrying offspring and giving birth, within His knowledge; not a description of the fetus’s sex.">أُنثىٰ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَضَعُ" data-root="W DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dad-ayn/" data-root-meaning="Putting or setting down; childbirth; īḍāʿ denotes hurrying onward." data-context="Gives birth, alongside carrying offspring.">تَضَعُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="بِعِلمِهِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="With His knowledge, concerning pregnancy and birth.">بِعِلمِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the day when: the time of the call and question.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يُناديهِم" data-root="N D W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-d-y/" data-root-meaning="Calling or gathering; nādī and nadiyy denote an assembly; also moisture or dew." data-context="Calls to them when questioning supposed partners.">يُناديهِم</button>
    <button class="word-link" type="button" data-word="أَينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَينَ</button>
    <button class="word-link" type="button" data-word="شُرَكاءى" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="My supposed partners: in a reproachful question, not an endorsement of partners.">شُرَكاءى</button>
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said: the questioned people’s speech.">قالوا</button>
    <button class="word-link" type="button" data-word="ءاذَنّٰكَ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="We have declared to You, in the addressees’ speech to The God.">ءاذَنّٰكَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَهيدٍ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="A witness, within the denial of witnesses for supposed partners.">شَهيدٍ</button>
  </p>
  <p class="english-verse">To Him is referred knowledge of the Hour. No fruits emerge from their coverings, and no female conceives or gives birth, except with His knowledge. On the day He calls to them, “Where are My partners?” they will say, “We declare to You that none of us is a witness.”</p>
</section>
