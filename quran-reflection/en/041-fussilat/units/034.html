<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:34</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَستَوِى" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Are equal; within the denial that good and evil are equal.">تَستَوِى</button>
    <button class="word-link" type="button" data-word="الحَسَنَةُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Goodness; one side of the comparison.">الحَسَنَةُ</button>
    <button class="word-link" type="button" data-word="وَلَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَا</button>
    <button class="word-link" type="button" data-word="السَّيِّئَةُ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evil; the other side of the comparison with goodness.">السَّيِّئَةُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ادفَع" data-root="D F AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-f-ayn/" data-root-meaning="Repelling, defending, or handing something over." data-context="Repel; responding by the better course.">ادفَع</button>
    <button class="word-link" type="button" data-word="بِالَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِالَّتى</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هِىَ</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Better; describing the course recommended for repelling.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="بَينَكَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between you; one side of the hostile relationship.">بَينَكَ</button>
    <button class="word-link" type="button" data-word="وَبَينَهُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="And him; the other side of the hostile relationship.">وَبَينَهُ</button>
    <button class="word-link" type="button" data-word="عَدٰوَةٌ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="Enmity; the relationship contrasted with the ensuing likeness to intimacy.">عَدٰوَةٌ</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="وَلِىٌّ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="A close ally; the person described as intimate by ḥamīm.">وَلِىٌّ</button>
    <button class="word-link" type="button" data-word="حَميمٌ" data-root="H M M" data-root-meaning="In the heat branch, warm or intensely hot water; in the closeness branch, an intimate friend or relative; in the darkness branch, charcoal and dense black smoke." data-context="Intimate and very close; describing the ally in the image of a relationship following enmity." data-learn-more="/quran-terminology/en/roots/h-m-m/">حَميمٌ</button>
  </p>
  <p class="english-verse">Good and evil are not equal. Repel with what is better, and suddenly the one between whom and you there is enmity is like a close friend.</p>
</section>
