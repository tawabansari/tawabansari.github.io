<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="قَولًا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قَولًا</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمَّن</button>

    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَعَمِلَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">وَعَمِلَ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقالَ</button>

    <button class="word-link" type="button" data-word="المُسلِمينَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender">المُسلِمينَ</button>
  </p>
  <p class="english-verse">Who is better in speech than one who calls to The God, does righteousness, and says, “I am among those who submit”?</p>
