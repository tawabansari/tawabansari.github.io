<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يُلَقّىٰها" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="It is granted or imparted to someone; a form II passive verb concerning the quality of responding well to evil.">يُلَقّىٰها</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>

    <button class="word-link" type="button" data-word="صَبَروا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="They persevered; those who maintained good conduct and restraint in facing difficulty.">صَبَروا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يُلَقّىٰها" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="It is granted or imparted to someone; the passive verb repeated, here in relation to someone possessing a great portion.">يُلَقّىٰها</button>

    <button class="word-link" type="button" data-word="حَظٍّ" data-root="H ZHA ZHA" data-root-meaning="A share or portion that reaches someone or is assigned to them. It may be material, legal, spiritual, or related to the Hereafter, and may vary in amount and value." data-context="A share or endowment; a great portion in the context of perseverance and responding well to evil, rather than a direct name for wealth or random luck." data-learn-more="/quran-terminology/en/roots/h-zha-zha/">حَظٍّ</button>
    <button class="word-link" type="button" data-word="عَظيمٍ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Great; describing the portion in a context of perseverance and a better response to evil.">عَظيمٍ</button>

  <p class="english-verse">None are granted this except those who are patient, and none are granted it except one with a great share.</p>
