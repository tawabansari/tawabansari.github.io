<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأَمّا</button>
    <button class="word-link" type="button" data-word="عادٌ" data-root-note="Proper name; no root has been assigned.">عادٌ</button>
    <button class="word-link" type="button" data-word="فَاستَكبَروا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="They acted arrogantly, describing Ad’s conduct.">فَاستَكبَروا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="Earth, where they acted arrogantly.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without, in the expression denying rightfulness to their arrogance.">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="الحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Right, which their arrogance lacked.">الحَقِّ</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said, introducing their claim about their power.">وَقالوا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="Stronger, in their question about who exceeds them in power.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="قُوَّةً" data-root="Q W Y" data-learn-more="/quran-terminology/en/roots/q-w-y/" data-root-meaning="Force, ability, power, and firmness; the capacity to act, endure, resist, or have an effect." data-context="Power, the respect in which they boasted of superiority.">قُوَّةً</button>
    ۖ
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Did they not see, a reproachful question about overlooking the Creator’s power.">يَرَوا</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَهُم" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Created them, the very people boasting of their power.">خَلَقَهُم</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="Stronger, the Creator exceeding them in power.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="قُوَّةً" data-root="Q W Y" data-learn-more="/quran-terminology/en/roots/q-w-y/" data-root-meaning="Force, ability, power, and firmness; the capacity to act, endure, resist, or have an effect." data-context="Power, the respect in which Creator and creatures are compared.">قُوَّةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And they used to, marking their denial as past conduct.">وَكانوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs, which Ad denied.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="يَجحَدونَ" data-root="J H D" data-root-meaning="Denying or refusing to accept something that calls for acknowledgment; in its prominent sense, denial despite recognizing the truth." data-context="They denied; Ad rejected Our signs." data-learn-more="/quran-terminology/en/roots/j-h-d/">يَجحَدونَ</button>
  </p>
  <p class="english-verse">As for Ad, they acted arrogantly on earth without right and said, “Who is stronger than us in power?” Did they not see that The God who created them is stronger than them in power? Yet they denied Our signs.</p>
</section>
