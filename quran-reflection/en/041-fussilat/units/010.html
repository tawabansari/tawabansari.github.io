<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Placed, referring to mountains.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="R S W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-s-w/" data-root-meaning="Becoming firmly settled; anchoring or coming to rest." data-context="Firmly set mountains, placed upon the earth.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَوقِها" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above it, locating mountains relative to the earth.">فَوقِها</button>
    <button class="word-link" type="button" data-word="وَبٰرَكَ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="He placed blessing in the earth, alongside mountains and the apportioning of sustenance." data-learn-more="/quran-terminology/en/roots/b-r-k/">وَبٰرَكَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="وَقَدَّرَ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="Apportioned, concerning sustenance.">وَقَدَّرَ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="أَقوٰتَها" data-root="Q W T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-w-t/" data-root-meaning="Sustenance; muqīt is explained as provider, powerful, or guardian." data-context="Its sustenance or food supplies.">أَقوٰتَها</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَربَعَةِ" data-root="R B AYN (R B ʿ)" data-learn-more="/quran-terminology/en/roots/r-b-ayn/" data-root-meaning="Four, fourfold grouping, one-fourth, forty, and the semantic field of counting and division" data-context="Four, the stated number of days.">أَربَعَةِ</button>
    <button class="word-link" type="button" data-word="أَيّامٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The stated days or periods.">أَيّامٍ</button>
    <button class="word-link" type="button" data-word="سَواءً" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Equal or complete, concerning the stated measure of days.">سَواءً</button>
    <button class="word-link" type="button" data-word="لِلسّائِلينَ" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="For those who ask or request, in the closing phrase.">لِلسّائِلينَ</button>
  </p>
  <p class="english-verse">He placed firm mountains upon it from above, blessed it, and apportioned its provisions in four days, equally for those who ask.</p>
</section>
