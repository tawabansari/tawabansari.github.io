<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقَضىٰهُنَّ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination" data-context="He completed and ordered them.">فَقَضىٰهُنَّ</button>
    <button class="word-link" type="button" data-word="سَبعَ" data-root="S B ʿ (S B Ayn)" data-root-meaning="Seven and its related numerical forms; in a separate branch, sabuʿ: a predatory animal." data-context="Seven; the number of heavens." data-learn-more="/quran-terminology/en/roots/s-b-ayn/">سَبعَ</button>
    <button class="word-link" type="button" data-word="سَمٰواتٍ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Heavens, which were ordered.">سَمٰواتٍ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="يَومَينِ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Two days; the period mentioned.">يَومَينِ</button>
    <button class="word-link" type="button" data-word="وَأَوحىٰ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="And communicated the command of each heaven.">وَأَوحىٰ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; expressing inclusion of the following noun.">كُلِّ</button>
    <button class="word-link" type="button" data-word="سَماءٍ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Heaven; each one in the clause.">سَماءٍ</button>
    <button class="word-link" type="button" data-word="أَمرَها" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Its command or affair, assigned to each heaven.">أَمرَها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَزَيَّنَّا" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="And We adorned the nearest heaven.">وَزَيَّنَّا</button>
    <button class="word-link" type="button" data-word="السَّماءَ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heaven, the object of protection or adornment.">السَّماءَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Nearest; qualifying the heaven.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="بِمَصٰبيحَ" data-root="SAD B H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-b-h/" data-root-meaning="Morning or daybreak; miṣbāḥ is a lamp." data-context="With lamps, adorning the nearest heaven.">بِمَصٰبيحَ</button>
    <button class="word-link" type="button" data-word="وَحِفظًا" data-root="H F ZHA" data-root-meaning="Keeping and caring for something so that it is not lost, forgotten, abandoned, or ruined." data-context="And for protection, in the setting of adorning the nearest heaven." data-learn-more="/quran-terminology/en/roots/h-f-zha/">وَحِفظًا</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="تَقديرُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="The determination and ordering.">تَقديرُ</button>
    <button class="word-link" type="button" data-word="العَزيزِ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="The Mighty; describing The God.">العَزيزِ</button>
    <button class="word-link" type="button" data-word="العَليمِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="The Knowing; describing The God.">العَليمِ</button>
  </p>
  <p class="english-verse">He completed them as seven heavens in two days and revealed to each heaven its affair. We adorned the nearest heaven with lamps and provided protection. That is the determination of the Mighty, the Knowing.</p>
</section>
