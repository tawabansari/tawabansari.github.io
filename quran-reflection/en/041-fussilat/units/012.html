    <button class="word-link" type="button" data-word="يَومَينِ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَينِ</button>
    <button class="word-link" type="button" data-word="وَأَوحىٰ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context.">وَأَوحىٰ</button>

    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>

  <p class="english-verse">He completed them as seven heavens in two days and revealed to each heaven its affair. We adorned the nearest heaven with lamps and provided protection. That is the determination of the Mighty, the Knowing.</p>
