<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Fussilat 41:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَضَلَّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="And vanished from their reach; concerning what they used to invoke.">وَضَلَّ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to; with yadʿūna, expressing their former practice of invoking.">كانوا</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="They invoked; concerning what they formerly turned to for worship or help.">يَدعونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Previously; referring to the time before this encounter.">قَبلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَظَنّوا" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="And they thought or realized; its content is their lack of escape, and this context has also been interpreted as certainty.">وَظَنّوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="مَحيصٍ" data-root="H Y SAD" data-root-meaning="Turning aside and changing direction to move away from something; escaping and seeking a way out. Maḥīṣ: escape or a way of escape." data-context="A way of escape; after what they once invoked has vanished, the sentence states that they have none." data-learn-more="/quran-terminology/en/roots/h-y-sad/">مَحيصٍ</button>
  </p>
  <p class="english-verse">What they used to call upon before will vanish from them, and they will realize that they have no escape.</p>
</section>
