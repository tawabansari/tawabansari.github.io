<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:39</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>
    <button class="word-link" type="button" data-word="أَعمٰلُهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">أَعمٰلُهُم</button>
    <button class="word-link" type="button" data-word="كَسَرابٍ" data-root="S R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-b/" data-root-meaning="A course and moving along it; sarab is a passage; sarāb is a mirage.">كَسَرابٍ</button>
    <button class="word-link" type="button" data-word="بِقيعَةٍ" data-root="Q W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-w-ayn/" data-root-meaning="Level, open ground.">بِقيعَةٍ</button>
    <button class="word-link" type="button" data-word="يَحسَبُهُ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">يَحسَبُهُ</button>
    <button class="word-link" type="button" data-word="الظَّمـٔانُ" data-root="ZHA M A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/zha-m-a/" data-root-meaning="Thirst.">الظَّمـٔانُ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence">ماءً</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="جاءَهُ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَهُ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَجِدهُ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception">يَجِدهُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَوَجَدَ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception">وَوَجَدَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="عِندَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَهُ</button>
    <button class="word-link" type="button" data-word="فَوَفّىٰهُ" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense">فَوَفّىٰهُ</button>
    <button class="word-link" type="button" data-word="حِسابَهُ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">حِسابَهُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="سَريعُ" data-root="S R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-ayn/" data-root-meaning="Speed or haste, as opposed to slowness.">سَريعُ</button>
    <button class="word-link" type="button" data-word="الحِسابِ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">الحِسابِ</button>
  </p>
  <p class="english-verse">Those who disbelieved—their deeds are like a mirage on a plain, which the thirsty person thinks is water, until he reaches it and finds it nothing, but finds The God there, who settles his account in full. The God is swift in reckoning.</p>
</section>
