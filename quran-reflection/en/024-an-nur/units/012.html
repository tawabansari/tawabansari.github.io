<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="سَمِعتُموهُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="You heard it, concerning the audience hearing the slander.">سَمِعتُموهُ</button>
    <button class="word-link" type="button" data-word="ظَنَّ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="Thought or supposed, concerning believers thinking well of one another.">ظَنَّ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believing men, expected to think well of others.">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤمِنٰتُ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="And the believing women, alongside believing men.">وَالمُؤمِنٰتُ</button>
    <button class="word-link" type="button" data-word="بِأَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Of themselves or one another, within the believers’ shared community.">بِأَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Good, what believing men and women should think of themselves or one another.">خَيرًا</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said, introducing the reported statement.">وَقالوا</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِفكٌ" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="Slander, the false accusation believers are expected to reject as manifestly false.">إِفكٌ</button>
    <button class="word-link" type="button" data-word="مُبينٌ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Clear or manifest, describing slander or the alleged sorcery in context.">مُبينٌ</button>
  </p>
  <p class="english-verse">Why, when you heard it, did the believing men and women not think well of their own people and say: this is a clear slander?</p>
