<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنكِحُوا" data-root="N K H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-h/" data-root-meaning="Nikāḥ denotes marriage or intercourse, according to construction and context." data-context="Arrange or facilitate marriage: a Form IV imperative concerning others’ marriages.">وَأَنكِحُوا</button>
    <button class="word-link" type="button" data-word="الأَيٰمىٰ" data-root="A Y M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-y-m/" data-root-meaning="Ayyim and ayāmā: a person or people without a spouse, male or female." data-context="Unmarried people: women or men without spouses, not only widows; from A Y M, distinct from imāʾ.">الأَيٰمىٰ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَالصّٰلِحينَ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Those who are righteous; alternatively, those suitable and ready for marriage.">وَالصّٰلِحينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِكُم" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="The enslaved men whom you own: identified contextually alongside imāʾikum, rather than simply servants of The God.">عِبادِكُم</button>
    <button class="word-link" type="button" data-word="وَإِمائِكُم" data-root="A M W" data-learn-more="/quran-terminology/en/roots/a-m-w/" data-root-meaning="A woman in slavery, held as another human being’s property, contrasted with a free woman; the designation itself does not judge her faith, character, morality, or abilities." data-context="And the enslaved women whom you own: a genitive plural with “your,” within the marriage command; not “your wives.”">وَإِمائِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="يَكونوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="If they are poor: the conditional verb concerns those whose marriage is being discussed.">يَكونوا</button>
    <button class="word-link" type="button" data-word="فُقَراءَ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity." data-context="Poor: the people’s financial circumstances, distinct from slavery or unmarried status.">فُقَراءَ</button>
    <button class="word-link" type="button" data-word="يُغنِهِمُ" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting." data-context="Will enrich them: relief from The God’s bounty, without a specified amount or date in this verse.">يُغنِهِمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="From His bounty: the source of the enrichment described.">فَضلِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="وٰسِعٌ" data-root="W S ʿ" data-learn-more="/quran-terminology/en/roots/w-s-ayn/" data-root-meaning="From spaciousness to capacity, ability and encompassing" data-context="Ample in bounty: a description of The God at the verse’s close.">وٰسِعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing: a description of The God alongside wāsiʿ.">عَليمٌ</button>
  </p>
  <p class="english-verse">Marry off the unmarried among you and the righteous among your male and female slaves. If they are poor, The God will enrich them from His favor. The God is expansive, knowing.</p>
</section>
