<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالخٰمِسَةُ" data-root="KH M S" data-root-meaning="Five: a count of five, the fifth position, and the proportion one fifth of a whole." data-context="And the fifth testimony, in the sequence of the man’s declarations." data-learn-more="/quran-terminology/en/roots/kh-m-s/">وَالخٰمِسَةُ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="لَعنَتَ" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion" data-context="A curse, invoked in the man’s fifth declaration if he is lying.">لَعنَتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Is, in the condition that the man is lying.">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الكٰذِبينَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Liars, those among whom the man would belong if untruthful.">الكٰذِبينَ</button>
  </p>
  <p class="english-verse">and the fifth, that the curse of The God be upon him if he is among the liars.</p>
</section>
