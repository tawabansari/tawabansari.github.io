<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَولا</button>
    <button class="word-link" type="button" data-word="فَضلُ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="The God’s bounty, which prevented the stated punishment from reaching them.">فَضلُ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="وَرَحمَتُهُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="And His mercy toward you in this world and the Hereafter.">وَرَحمَتُهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="This worldly life, one of the two settings of the stated bounty and mercy.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَالـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="And the Hereafter, the life to come alongside this world.">وَالـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="لَمَسَّكُم" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="Would certainly have touched or reached you, describing the punishment connected with the stated discourse.">لَمَسَّكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَفَضتُم" data-root="F Y DAD" data-root-meaning="Flowing or streaming, sometimes with abundance and overflow; in extended uses, collective departure or engagement in discourse and activity." data-context="You entered into and developed discussion of it, in the context of an accusation and unsupported speech." data-learn-more="/quran-terminology/en/roots/f-y-dad/">أَفَضتُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, the consequence of the speech and conduct criticized by the verse.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Tremendous or great, describing the stated punishment.">عَظيمٌ</button>
  </p>
  <p class="english-verse">Were it not for the favor of The God upon you and His mercy in this world and the hereafter, a tremendous punishment would have touched you for what you plunged into,</p>
</section>
