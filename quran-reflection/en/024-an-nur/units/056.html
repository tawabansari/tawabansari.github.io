<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:56</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَقيمُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَأَقيمُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَءاتُوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَءاتُوا</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةَ" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness.">الزَّكوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَطيعُوا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">وَأَطيعُوا</button>
    <button class="word-link" type="button" data-word="الرَّسولَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرَّسولَ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُرحَمونَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">تُرحَمونَ</button>
  </p>
  <p class="english-verse">Establish prayer, give zakat, and obey the messenger, so that you may receive mercy.</p>
