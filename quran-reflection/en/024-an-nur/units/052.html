<section class="ayah-block" id="ayah-052" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:52</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُطِعِ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">يُطِعِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="وَيَخشَ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God">وَيَخشَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَيَتَّقهِ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">وَيَتَّقهِ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الفائِزونَ" data-root="F W Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-w-z/" data-root-meaning="Success or attainment together with escape from danger.">الفائِزونَ</button>
  </p>
  <p class="english-verse">Whoever obeys The God and His messenger, fears The God, and is mindful of Him—those are the successful ones.</p>
</section>
