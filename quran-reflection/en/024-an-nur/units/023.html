  <h2 class="ayah-title">An-Nur 24:23</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="المُحصَنٰتِ" data-root="H SAD N" data-root-meaning="In Arabic, ح ص ن denotes protection, safeguarding, and making something secure against access or violation. حِصْن is a place that protects what is inside it; taḥṣīn is the act of strengthening and securing; iḥṣān can apply in material, behavioral, and social contexts." data-context="Chaste women, one of three descriptions of the women accused" data-learn-more="/quran-terminology/en/roots/h-sad-n/">المُحصَنٰتِ</button>

  <p class="english-verse">Those who accuse chaste, unsuspecting, believing women are cursed in this world and the hereafter, and have a tremendous punishment,</p>
