<section class="ayah-block" id="ayah-029" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:29</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَيسَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَيسَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="جُناحٌ" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/">جُناحٌ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>

    <button class="word-link" type="button" data-word="بُيوتًا" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/">بُيوتًا</button>

    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>

  <p class="english-verse">There is no blame upon you for entering uninhabited houses in which there is some use for you. The God knows what you reveal and what you conceal.</p>
