<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَولا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="سَمِعتُموهُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="You heard it, hearing the statement and accusation under discussion.">سَمِعتُموهُ</button>
    <button class="word-link" type="button" data-word="قُلتُم" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Did you not say, the response that should have followed hearing it.">قُلتُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَكونُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="It is not for us, in the construction denying that speaking of this allegation is fitting.">يَكونُ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="نَتَكَلَّمَ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="To speak, discussing the accusation they heard.">نَتَكَلَّمَ</button>
    <button class="word-link" type="button" data-word="بِهٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهٰذا</button>
    <button class="word-link" type="button" data-word="سُبحٰنَكَ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Glory be to You, addressing The God in rejection of the wrongful statement.">سُبحٰنَكَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="بُهتٰنٌ" data-root="B H2 T" data-root-meaning="In one branch, B H T denotes bewilderment and inability to respond to something startling or an unanswerable argument. In another, buhtān denotes falsehood and wrongful attribution distorting truth and potentially exposing an innocent person to accusation or harm." data-context="A grave calumny, describing the wrongful allegation that should not have been repeated." data-learn-more="/quran-terminology/en/roots/b-h2-t/">بُهتٰنٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Grave and great, describing the calumny under discussion.">عَظيمٌ</button>
  </p>
  <p class="english-verse">Why, when you heard it, did you not say: it is not for us to speak of this. Glory be to You! This is a tremendous slander.</p>
</section>
