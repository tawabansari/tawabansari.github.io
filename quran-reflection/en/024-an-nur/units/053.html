<section class="ayah-block" id="ayah-053" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:53</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَقسَموا" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="And they swore; claiming readiness to go out.">وَأَقسَموا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="جَهدَ" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="Utmost emphasis; describing the intensity of their oath to go forth." data-learn-more="/quran-terminology/en/roots/j-h2-d/">جَهدَ</button>
    <button class="word-link" type="button" data-word="أَيمٰنِهِم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Their oaths; the stated emphatic assertions.">أَيمٰنِهِم</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَئِن</button>
    <button class="word-link" type="button" data-word="أَمَرتَهُم" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="You command them; the instruction to go out.">أَمَرتَهُم</button>
    <button class="word-link" type="button" data-word="لَيَخرُجُنَّ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="They will certainly go out; the oath-makers’ emphatic claim.">لَيَخرُجُنَّ</button>
    ۖ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the command to answer the oath.">قُل</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تُقسِموا" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="Swear; the act prohibited by lā.">تُقسِموا</button>
    ۖ
    <button class="word-link" type="button" data-word="طاعَةٌ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="Obedience; compliance contrasted with verbal assertion.">طاعَةٌ</button>
    <button class="word-link" type="button" data-word="مَعروفَةٌ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="Recognized; describing the stated obedience.">مَعروفَةٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware; knowing the addressees’ actions." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You do; the addressees’ actual conduct.">تَعمَلونَ</button>
  </p>
  <p class="english-verse">They swore by The God their strongest oaths that, if you commanded them, they would surely go out. Say: do not swear. Recognized obedience. The God is aware of what you do.</p>
</section>
