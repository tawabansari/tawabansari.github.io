<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَأتَلِ" data-root="A L W" data-learn-more="/quran-terminology/en/roots/a-l-w/" data-root-meaning="Effort and falling short: carrying out or neglecting an undertaking in relation to ability and the effort applied.; Oath and commitment: binding oneself through an oath to do or refrain from something." data-context="They should not swear to withdraw assistance; in the other analysis, they should not fall short in giving.">يَأتَلِ</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولُوا</button>
    <button class="word-link" type="button" data-word="الفَضلِ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="Bounty and resources: the capacity of those able to give in this context.">الفَضلِ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَالسَّعَةِ" data-root="W S ʿ" data-learn-more="/quran-terminology/en/roots/w-s-ayn/" data-root-meaning="From spaciousness to capacity, ability and encompassing" data-context="Affluence and ample means enabling assistance.">وَالسَّعَةِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُؤتوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Give and provide assistance to the groups named.">يُؤتوا</button>
    <button class="word-link" type="button" data-word="أُولِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولِى</button>
    <button class="word-link" type="button" data-word="القُربىٰ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Kinship: those related by family ties.">القُربىٰ</button>
    <button class="word-link" type="button" data-word="وَالمَسٰكينَ" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling" data-context="The needy, named among the recipients of assistance.">وَالمَسٰكينَ</button>
    <button class="word-link" type="button" data-word="وَالمُهٰجِرينَ" data-root="H2 J R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-j-r/" data-root-meaning="Separating or leaving; hijrah is migration from a place." data-context="Emigrants: those who migrated in the way of The God.">وَالمُهٰجِرينَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Way: in fī sabīli allāhi, the purpose and direction of the emigration.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَليَعفوا" data-root="ʿ F W" data-learn-more="/quran-terminology/en/roots/ayn-f-w/" data-root-meaning="Passing over pursuit of a fault, lifting censure, effacing a trace, and what remains beyond need" data-context="Let them pardon: the command to forgive alongside continued giving.">وَليَعفوا</button>
    <button class="word-link" type="button" data-word="وَليَصفَحوا" data-root="Ṣ F Ḥ" data-learn-more="/quran-terminology/en/roots/sad-f-h/" data-root-meaning="Ṣafaḥa: turning one’s face or side away, and passing over something" data-context="Let them overlook the wrongdoing under discussion.">وَليَصفَحوا</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="تُحِبّونَ" data-root="H B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-root-meaning="Ḥubb: love or affection; ḥabb and ḥabbah: grain or a seed. These branches are not interchangeable." data-context="Do you not love: asking about the desire for forgiveness from The God.">تُحِبّونَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَغفِرَ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgive: the forgiveness the addressees desire for themselves.">يَغفِرَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving: describing The God after the call to pardon.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful: describing The God at the end of the verse.">رَحيمٌ</button>
  </p>
  <p class="english-verse">Let not those among you of bounty and means swear not to give to relatives, the needy, and emigrants in the way of The God. Let them pardon and overlook. Do you not love that The God should forgive you? The God is forgiving, merciful.</p>
</section>
