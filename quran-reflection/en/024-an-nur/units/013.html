  <h2 class="ayah-title">An-Nur 24:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="جاءو" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءو</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="بِأَربَعَةِ" data-root="R B AYN (R B ʿ)" data-learn-more="/quran-terminology/en/roots/r-b-ayn/" data-root-meaning="Four, fourfold grouping, one-fourth, forty, and the semantic field of counting and division">بِأَربَعَةِ</button>
    <button class="word-link" type="button" data-word="شُهَداءَ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">شُهَداءَ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذ</button>

    <button class="word-link" type="button" data-word="بِالشُّهَداءِ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">بِالشُّهَداءِ</button>

    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>

  </p>
  <p class="english-verse">Why did they not bring four witnesses to it? Since they did not bring the witnesses, they are the liars before The God.</p>
