<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="جاءو" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="They brought, concerning slander or an unjust statement.">جاءو</button>
    <button class="word-link" type="button" data-word="بِالإِفكِ" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="The slander, the false accusation brought by a group from among the audience.">بِالإِفكِ</button>
    <button class="word-link" type="button" data-word="عُصبَةٌ" data-root="AYN SAD B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sad-b/" data-root-meaning="Binding or group solidarity; ʿuṣbah is a close group; ʿaṣīb means severe or difficult." data-context="A group acting together, those who brought the slander.">عُصبَةٌ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَحسَبوهُ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="Consider it; preceded here by the prohibition “do not.”">تَحسَبوهُ</button>
    <button class="word-link" type="button" data-word="شَرًّا" data-root="SH R R" data-root-meaning="sharr is evil or harm attributable to conduct, a condition, an event, or something’s outcome; comparatively, it expresses being worse. In the material branch, sharar denotes glowing fragments that leap from fire." data-learn-more="/quran-terminology/en/roots/sh-r-r/" data-context="Evil or harm, what the audience is told not to consider the affair.">شَرًّا</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Good, describing the affair for the audience here.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="For each or every, including the persons that follow.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="امرِئٍ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="A person, each member of the group that brought the slander.">امرِئٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="مَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَا</button>
    <button class="word-link" type="button" data-word="اكتَسَبَ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Earned, concerning each person’s share of sin.">اكتَسَبَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الإِثمِ" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="Sin, what each has earned through conduct.">الإِثمِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذى</button>
    <button class="word-link" type="button" data-word="تَوَلّىٰ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Undertook, concerning the person responsible for the slander’s greatest share.">تَوَلّىٰ</button>
    <button class="word-link" type="button" data-word="كِبرَهُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Its greatest share, the major part in the slander affair.">كِبرَهُ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, stated as that person’s consequence.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="عَظيمٌ" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Great, describing the punishment’s magnitude.">عَظيمٌ</button>
  </p>
  <p class="english-verse">Those who brought the slander are indeed a group among you. Do not think it bad for you; rather, it is good for you. Each of them has what he earned of the sin, and the one among them who took on its greater part has a tremendous punishment.</p>
</section>
