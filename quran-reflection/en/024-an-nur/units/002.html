<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الزّانِيَةُ" data-root="Z N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-n-y/" data-root-meaning="Unlawful sexual intercourse and a woman or man engaging in it." data-context="The woman who commits unlawful sexual intercourse; one of the two people addressed by the ruling.">الزّانِيَةُ</button>
    <button class="word-link" type="button" data-word="وَالزّانى" data-root="Z N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-n-y/" data-root-meaning="Unlawful sexual intercourse and a woman or man engaging in it." data-context="And the man who commits unlawful sexual intercourse; the second person named.">وَالزّانى</button>
    <button class="word-link" type="button" data-word="فَاجلِدوا" data-root="J L D" data-root-meaning="Skin and the body’s outer covering; firmness and endurance; and, in the relevant verbal use, flogging." data-context="Flog; an imperative followed by the specified number of lashes." data-learn-more="/quran-terminology/en/roots/j-l-d/">فَاجلِدوا</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Each; in “each one of the two.”">كُلَّ</button>
    <button class="word-link" type="button" data-word="وٰحِدٍ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="One; in “each one of the two.”">وٰحِدٍ</button>
    <button class="word-link" type="button" data-word="مِنهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُما</button>
    <button class="word-link" type="button" data-word="مِا۟ئَةَ" data-root="M A Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-a-y/" data-root-meaning="One hundred and its related forms." data-context="A hundred; the number of lashes in the command.">مِا۟ئَةَ</button>
    <button class="word-link" type="button" data-word="جَلدَةٍ" data-root="J L D" data-root-meaning="Skin and the body’s outer covering; firmness and endurance; and, in the relevant verbal use, flogging." data-context="A lash; the counting unit in “a hundred lashes,” rather than a piece of skin." data-learn-more="/quran-terminology/en/roots/j-l-d/">جَلدَةٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَأخُذكُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Take hold of you; in the prohibition concerning pity for the two affecting the command.">تَأخُذكُم</button>
    <button class="word-link" type="button" data-word="بِهِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِما</button>
    <button class="word-link" type="button" data-word="رَأفَةٌ" data-root="R A F" data-learn-more="/quran-terminology/en/roots/r-a-f/" data-root-meaning="Compassion and raʾūf: tenderness, kindness and consideration for another, from human feeling to descriptions of The God and the Prophet in the Qur’an" data-context="Pity or compassion; the feeling whose bearing on the command is discussed.">رَأفَةٌ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="دينِ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God" data-context="Religion or ordinance; in “the religion of The God.”">دينِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You are; in the condition “if you believe.”">كُنتُم</button>
    <button class="word-link" type="button" data-word="تُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="You believe; in the condition concerning belief in The God and the Last Day.">تُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَاليَومِ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the Day; in “the Last Day.”">وَاليَومِ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="Last; qualifying the Day.">الـٔاخِرِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَليَشهَد" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="And let them witness; requiring a group of believers to be present as witnesses.">وَليَشهَد</button>
    <button class="word-link" type="button" data-word="عَذابَهُما" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="The punishment of the two; that which a group of believers witnesses.">عَذابَهُما</button>
    <button class="word-link" type="button" data-word="طائِفَةٌ" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="A group; some believers who witness the punishment.">طائِفَةٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers; from whom the witnessing group comes.">المُؤمِنينَ</button>
  </p>
  <p class="english-verse">The woman who commits zina and the man who commits zina: lash each of them a hundred lashes. Let no pity for them take hold of you in the religion of The God, if you believe in The God and the Last Day. Let a group of believers witness their punishment.</p>
</section>
