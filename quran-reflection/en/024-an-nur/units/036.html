<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:36</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُيوتٍ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="Houses; places where The God’s name is remembered and He is glorified." data-learn-more="/quran-terminology/en/roots/b-y-t/">بُيوتٍ</button>
    <button class="word-link" type="button" data-word="أَذِنَ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Has permitted; allowing the houses to be raised and His name remembered there.">أَذِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تُرفَعَ" data-root="R F ʿ" data-learn-more="/quran-terminology/en/roots/r-f-ayn/" data-root-meaning="Raising, lifting, and elevating from a lower level or rank to a higher one." data-context="To be raised or held in honor; describing the houses’ elevation.">تُرفَعَ</button>
    <button class="word-link" type="button" data-word="وَيُذكَرَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And be remembered; a passive verb concerning The God’s name.">وَيُذكَرَ</button>
    <button class="word-link" type="button" data-word="فيهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهَا</button>
    <button class="word-link" type="button" data-word="اسمُهُ" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-context="His name; The God’s name remembered in these houses." data-root="S M W / W S M" data-root-meaning="Raising into the level of recognition, and marking for identification">اسمُهُ</button>
    <button class="word-link" type="button" data-word="يُسَبِّحُ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="They glorify Him, declaring The God free of deficiency and improper attribution.">يُسَبِّحُ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="بِالغُدُوِّ" data-root="GH D W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-d-w/" data-root-meaning="Morning or going early; ghad is tomorrow or the future." data-context="In the morning; one of the two times specified for glorification.">بِالغُدُوِّ</button>
    <button class="word-link" type="button" data-word="وَالـٔاصالِ" data-root="A SAD L" data-learn-more="/quran-terminology/en/roots/a-sad-l/" data-root-meaning="a thing’s root or foundation, and late afternoon as a particular part of the day." data-context="And in the late afternoons approaching sunset; a time of glorification in the houses described.">وَالـٔاصالِ</button>
  </p>
  <p class="english-verse">In houses that The God has permitted to be raised and His name mentioned therein, He is glorified morning and evening</p>
</section>
