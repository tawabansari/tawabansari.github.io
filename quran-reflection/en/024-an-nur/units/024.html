<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day when bodily members testify.">يَومَ</button>
    <button class="word-link" type="button" data-word="تَشهَدُ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Testifies, concerning tongues, hands, and feet.">تَشهَدُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="أَلسِنَتُهُم" data-root="L S N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-s-n/" data-root-meaning="The tongue as an organ, speech, or a people&#x27;s language." data-context="Their tongues.">أَلسِنَتُهُم</button>
    <button class="word-link" type="button" data-word="وَأَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="And their hands.">وَأَيديهِم</button>
    <button class="word-link" type="button" data-word="وَأَرجُلُهُم" data-root="R J L" data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="Man; foot or leg; and walking or people on foot in distinct branches. Each form’s meaning follows its structure and context." data-context="And their feet, among the bodily members testifying to their deeds.">وَأَرجُلُهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, in the account of their previous deeds.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They did, the actions to which their bodily members testify.">يَعمَلونَ</button>
  </p>
  <p class="english-verse">on the day their tongues, hands, and feet testify against them concerning what they used to do.</p>
