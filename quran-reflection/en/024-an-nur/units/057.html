<section class="ayah-block" id="ayah-057" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:57</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَحسَبَنَّ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="Do not suppose, in the prohibition.">تَحسَبَنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved and rejected faith.">كَفَروا</button>
    <button class="word-link" type="button" data-word="مُعجِزينَ" data-root="AYN J Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-j-z/" data-root-meaning="Being unable or rendering powerless; ʿajūz is an elderly woman." data-context="Able to frustrate power or escape its reach.">مُعجِزينَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth or land, where the stated life or event occurs.">الأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُمُ" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="An abode, dwelling, or place of refuge, without necessarily implying safety or comfort." data-context="Their abode, the Fire.">وَمَأوىٰهُمُ</button>
    <button class="word-link" type="button" data-word="النّارُ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="The Fire, the stated place of punishment.">النّارُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="And how evil indeed, condemning the outcome.">وَلَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="Ṣ Y R" data-learn-more="/quran-terminology/en/roots/sad-y-r/" data-root-meaning="Reaching an end: maṣīr as the outcome to which affairs lead" data-context="The final outcome or destination reached.">المَصيرُ</button>
  </p>
  <p class="english-verse">Do not think that those who disbelieved can thwart on earth. Their refuge is the Fire. What a wretched destination!</p>
</section>
