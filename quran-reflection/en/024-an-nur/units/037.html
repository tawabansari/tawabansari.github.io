<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رِجالٌ" data-root="R J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="A man; also a foot and walking on foot, in different forms.">رِجالٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تُلهيهِم" data-root="L H2 W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h2-w/" data-root-meaning="Diversion from an important matter; ilhāʾ means distracting.">تُلهيهِم</button>
    <button class="word-link" type="button" data-word="تِجٰرَةٌ" data-root="T J R" data-learn-more="/quran-terminology/en/roots/t-j-r/" data-root-meaning="Entering exchange and putting property or capital into circulation in pursuit of profit and benefit.">تِجٰرَةٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="بَيعٌ" data-root="B Y AYN" data-learn-more="/quran-terminology/en/roots/b-y-ayn/" data-root-meaning="Selling, buying and selling, transferring something in exchange for compensation, and completing a clear transaction between two sides">بَيعٌ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">ذِكرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَإِقامِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَإِقامِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةِ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">الصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="وَإيتاءِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَإيتاءِ</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةِ" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness.">الزَّكوٰةِ</button>
    ۙ
    <button class="word-link" type="button" data-word="يَخافونَ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat">يَخافونَ</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومًا</button>
    <button class="word-link" type="button" data-word="تَتَقَلَّبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">تَتَقَلَّبُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="القُلوبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">القُلوبُ</button>
    <button class="word-link" type="button" data-word="وَالأَبصٰرُ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">وَالأَبصٰرُ</button>
  </p>
  <p class="english-verse">by men whom neither trade nor sale distracts from remembrance of The God, establishing prayer, and giving zakat. They fear a day on which hearts and eyes will turn about,</p>
</section>
