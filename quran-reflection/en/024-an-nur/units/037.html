<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رِجالٌ" data-root="R J L" data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="Man; foot or leg; and walking or people on foot in distinct branches. Each form’s meaning follows its structure and context." data-context="Men whom trade and sale do not distract from remembering The God.">رِجالٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تُلهيهِم" data-root="L H2 W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h2-w/" data-root-meaning="Diversion from an important matter; ilhāʾ means distracting." data-context="Does not distract, the effect denied of trade and sale.">تُلهيهِم</button>
    <button class="word-link" type="button" data-word="تِجٰرَةٌ" data-root="T J R" data-learn-more="/quran-terminology/en/roots/t-j-r/" data-root-meaning="Entering exchange and putting property or capital into circulation in pursuit of profit and benefit." data-context="Trade, which does not distract them from remembering The God.">تِجٰرَةٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="بَيعٌ" data-root="B Y AYN" data-learn-more="/quran-terminology/en/roots/b-y-ayn/" data-root-meaning="Selling, buying and selling, transferring something in exchange for compensation, and completing a clear transaction between two sides" data-context="Sale and exchange, which do not distract them.">بَيعٌ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="ذِكرِ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Remembrance of The God.">ذِكرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَإِقامِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And establishing prayer.">وَإِقامِ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةِ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Prayer, which they establish.">الصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="وَإيتاءِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="And giving zakāh.">وَإيتاءِ</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةِ" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness." data-context="Zakāh, which they give.">الزَّكوٰةِ</button>
    ۙ
    <button class="word-link" type="button" data-word="يَخافونَ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="They fear the day when hearts and eyes turn about.">يَخافونَ</button>
    <button class="word-link" type="button" data-word="يَومًا" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day on which hearts and eyes turn about.">يَومًا</button>
    <button class="word-link" type="button" data-word="تَتَقَلَّبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Turn about, concerning hearts and eyes.">تَتَقَلَّبُ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="القُلوبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Hearts, which turn about that day.">القُلوبُ</button>
    <button class="word-link" type="button" data-word="وَالأَبصٰرُ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="And eyes, which turn about that day.">وَالأَبصٰرُ</button>
  </p>
  <p class="english-verse">by men whom neither trade nor sale distracts from remembrance of The God, establishing prayer, and giving zakat. They fear a day on which hearts and eyes will turn about,</p>
</section>
