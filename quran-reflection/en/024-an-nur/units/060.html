<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nur 24:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالقَوٰعِدُ" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations; qawāʿid, building foundations or, in a separate use, older women." data-context="Older women, further described as no longer expecting marriage.">وَالقَوٰعِدُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="Women, the group addressed by this provision.">النِّساءِ</button>
    <button class="word-link" type="button" data-word="الّٰتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الّٰتى</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَرجونَ" data-root="R J W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-w/" data-root-meaning="Hope or expectation; also an edge or side; postponement in some forms is also analyzed under r-j-ʾ." data-context="Hope or expect; with la, they no longer expect marriage.">يَرجونَ</button>
    <button class="word-link" type="button" data-word="نِكاحًا" data-root="N K H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-h/" data-root-meaning="Nikāḥ denotes marriage or intercourse, according to construction and context." data-context="Marriage, which these women no longer expect.">نِكاحًا</button>
    <button class="word-link" type="button" data-word="فَلَيسَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَيسَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِنَّ</button>
    <button class="word-link" type="button" data-word="جُناحٌ" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/" data-context="Blame or wrongdoing; negated for them under the conditions stated.">جُناحٌ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَضَعنَ" data-root="W DAD AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dad-ayn/" data-root-meaning="Putting or setting down; childbirth; īḍāʿ denotes hurrying onward." data-context="Set aside, referring to their garments within the verse’s condition.">يَضَعنَ</button>
    <button class="word-link" type="button" data-word="ثِيابَهُنَّ" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome; in another branch, thawb and thiyāb mean a garment and clothing." data-context="Their garments; the type and extent of covering require context and are not specified by this noun alone.">ثِيابَهُنَّ</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without; excluding the condition of display in the following circumstantial phrase.">غَيرَ</button>
    <button class="word-link" type="button" data-word="مُتَبَرِّجٰتٍ" data-root="B R J" data-root-meaning="Prominence and visibility; burj, a high protected structure or celestial station; tabarruj, display and making adornment and beauty visible." data-learn-more="/quran-terminology/en/roots/b-r-j/" data-context="Those displaying adornment; after ghayr, without displaying it.">مُتَبَرِّجٰتٍ</button>
    <button class="word-link" type="button" data-word="بِزينَةٍ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="With adornment, the object of the display excluded here.">بِزينَةٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَن</button>
    <button class="word-link" type="button" data-word="يَستَعفِفنَ" data-root="AYN F F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-f-f/" data-root-meaning="Self-restraint in desire or asking, and preserving chastity." data-context="Exercise restraint, the course described as better after the permission.">يَستَعفِفنَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better; expressing the preference for their restraint.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَهُنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُنَّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="سَميعٌ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Hearing; describing The God at the verse’s close.">سَميعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; describing The God at the verse’s close.">عَليمٌ</button>
  </p>
  <p class="english-verse">Women past childbearing who have no expectation of marriage incur no blame in putting aside their garments without displaying adornment. To remain restrained is better for them. The God is hearing, knowing.</p>
</section>
