<section class="ayah-block" id="ayah-126" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:126</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَنقِمُ" data-root="N Q M" data-learn-more="/quran-terminology/en/roots/n-q-m/" data-root-meaning="Displeasure, disapproval, and faultfinding; in intiqām, a punitive response to conduct considered objectionable." data-context="Find fault, addressed to Pharaoh concerning his resentment of the magicians’ faith.">تَنقِمُ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="We believed, the magicians’ acceptance of their Lord’s signs.">ءامَنّا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="In the signs, their Lord’s signs that came to them.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord, in the statement of belief in His signs.">رَبِّنا</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمّا</button>
    <button class="word-link" type="button" data-word="جاءَتنا" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to us, concerning their Lord’s signs.">جاءَتنا</button>
    ۚ
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord, opening the magicians’ prayer after their statement of faith.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَفرِغ" data-root="F R GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-gh/" data-root-meaning="Becoming empty or finishing an occupation; ifrāgh means pouring out." data-context="Pour out, asking that patience be bestowed abundantly upon them.">أَفرِغ</button>
    <button class="word-link" type="button" data-word="عَلَينا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَينا</button>
    <button class="word-link" type="button" data-word="صَبرًا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="Patience, what they ask of their Lord in the face of Pharaoh’s threat.">صَبرًا</button>
    <button class="word-link" type="button" data-word="وَتَوَفَّنا" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense" data-context="Take us in death, in the request to end life in submission.">وَتَوَفَّنا</button>
    <button class="word-link" type="button" data-word="مُسلِمينَ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Submitting, the condition they ask to be in at death.">مُسلِمينَ</button>
  </p>
  <p class="english-verse">You resent us only because we believed in our Lord’s signs when they came to us. Our Lord, pour patience upon us and take us in submission.</p>
</section>
