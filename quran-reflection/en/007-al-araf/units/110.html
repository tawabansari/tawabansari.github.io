<section class="ayah-block" id="ayah-110" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:110</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُخرِجَكُم" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">يُخرِجَكُم</button>

    <button class="word-link" type="button" data-word="أَرضِكُم" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">أَرضِكُم</button>

    <button class="word-link" type="button" data-word="تَأمُرونَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">تَأمُرونَ</button>
  </p>
  <p class="english-verse">He wants to drive you out of your land. What, then, do you command?</p>
