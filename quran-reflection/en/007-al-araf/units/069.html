<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:69</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَعَجِبتُم" data-root="AYN J B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-j-b/" data-root-meaning="Wonder; iʿjāb denotes admiration or astonishment.">أَوَعَجِبتُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="جاءَكُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَكُم</button>
    <button class="word-link" type="button" data-word="ذِكرٌ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">ذِكرٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="رَجُلٍ" data-root="R J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="A man; also a foot and walking on foot, in different forms.">رَجُلٍ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="لِيُنذِرَكُم" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">لِيُنذِرَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاذكُروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">وَاذكُروا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="جَعَلَكُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلَكُم</button>
    <button class="word-link" type="button" data-word="خُلَفاءَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">خُلَفاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدِ</button>
    <button class="word-link" type="button" data-word="قَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">قَومِ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="Proper name; no root has been assigned.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَزادَكُم" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure">وَزادَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الخَلقِ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">الخَلقِ</button>
    <button class="word-link" type="button" data-word="بَصۜطَةً" data-root="B S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-s-tt/" data-root-meaning="Unfolding, spreading, or extending; expansion can concern space, capacity, or resources.">بَصۜطَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاذكُروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">فَاذكُروا</button>
    <button class="word-link" type="button" data-word="ءالاءَ" data-root="A L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-l-w/" data-root-meaning="Distinct uses concern falling short, swearing an oath, and ālāʾ meaning blessings or favors.">ءالاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُفلِحونَ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success">تُفلِحونَ</button>
  </p>
  <p class="english-verse">Are you astonished that a reminder from your Lord has come to you upon a man from among you, to warn you? Remember when He made you successors after the people of Noah and increased you in stature. Remember the favors of The God, so that you may prosper.</p>
</section>
