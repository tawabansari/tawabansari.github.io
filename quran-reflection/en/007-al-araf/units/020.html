<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَسوَسَ" data-root="W S W S" data-root-meaning="in acoustic usage, waswasah is quiet, hidden sound; in relation to a person, it is speech or thought that passes within them or is suggested in a concealed way. Such prompting may come from the person’s own self or another agent. Whether it is wrong, deceptive, or satanic is determined by the agent, content, and context, rather than by the root alone." data-learn-more="/quran-terminology/en/roots/w-s-w-s/" data-context="Then whispered, Satan’s deceptive suggestion to the two.">فَوَسوَسَ</button>
    <button class="word-link" type="button" data-word="لَهُمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُمَا</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan, the agent of whispering in the account.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="لِيُبدِىَ" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="To expose, the stated aim of the whispering.">لِيُبدِىَ</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُما</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="وۥرِىَ" data-root="W R Y" data-learn-more="/quran-terminology/en/roots/w-r-y/" data-root-meaning="Covering and concealment; and, in another branch, the emergence and production of fire" data-context="Had been concealed, what was hidden from the two.">وۥرِىَ</button>
    <button class="word-link" type="button" data-word="عَنهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُما</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سَوءٰتِهِما" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Their private parts, what would be exposed.">سَوءٰتِهِما</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said, introducing Satan’s deceptive claim.">وَقالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="نَهىٰكُما" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="Forbade you both, Satan’s report of the Lord’s prohibition with a deceptive claim about its reason." data-learn-more="/quran-terminology/en/roots/n-h2-y/">نَهىٰكُما</button>
    <button class="word-link" type="button" data-word="رَبُّكُما" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, the two people’s Lord in Satan’s reported speech.">رَبُّكُما</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="الشَّجَرَةِ" data-root="SH J R" data-learn-more="/quran-terminology/en/roots/sh-j-r/" data-root-meaning="Branching, ramification, interweaving, and complex extension from a single origin" data-context="The tree, the subject of prohibition in the account.">الشَّجَرَةِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَكونا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Become, in the claim about the two becoming angels.">تَكونا</button>
    <button class="word-link" type="button" data-word="مَلَكَينِ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="Two angels, the status mentioned in the deceptive claim.">مَلَكَينِ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَكونا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Become, in the claim about lasting existence.">تَكونا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الخٰلِدينَ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place" data-context="Those who endure, the other status in Satan’s claim.">الخٰلِدينَ</button>
  </p>
  <p class="english-verse">Satan whispered to them to expose what had been concealed from them of their private parts. He said, “Your Lord only forbade you this tree lest you become two angels or become among those who remain forever.”</p>
</section>
