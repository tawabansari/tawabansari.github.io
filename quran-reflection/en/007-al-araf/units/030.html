<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَريقًا" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths">فَريقًا</button>
    <button class="word-link" type="button" data-word="هَدىٰ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">هَدىٰ</button>
    <button class="word-link" type="button" data-word="وَفَريقًا" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths">وَفَريقًا</button>
    <button class="word-link" type="button" data-word="حَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">حَقَّ</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الضَّلٰلَةُ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">الضَّلٰلَةُ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُمُ</button>
    <button class="word-link" type="button" data-word="اتَّخَذُوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">اتَّخَذُوا</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينَ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">الشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="أَولِياءَ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">أَولِياءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَيَحسَبونَ" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">وَيَحسَبونَ</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="مُهتَدونَ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">مُهتَدونَ</button>
  </p>
  <p class="english-verse">A group He guided, and a group deserved error. They took the devils as guardians apart from The God, and they think they are guided.</p>
