<section class="ayah-block" id="ayah-204" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:204</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="قُرِئَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="Is recited: the passive reading of the Qur’an." data-learn-more="/quran-terminology/en/roots/q-r-a/">قُرِئَ</button>
    <button class="word-link" type="button" data-word="القُرءانُ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text whose recitation and hearing are discussed." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانُ</button>
    <button class="word-link" type="button" data-word="فَاستَمِعوا" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Listen: attending to the recited Qur’an.">فَاستَمِعوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="وَأَنصِتوا" data-root="N SAD T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sad-t/" data-root-meaning="Remaining silent to listen." data-context="Remain silent: silence during recitation.">وَأَنصِتوا</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُرحَمونَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Receive mercy: the stated prospect of listening.">تُرحَمونَ</button>
  </p>
  <p class="english-verse">When the Qur’an is recited, listen to it and be silent, so that you may receive mercy.</p>
