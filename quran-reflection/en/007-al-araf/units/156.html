  <p class="english-verse">Prescribe good for us in this world and in the Hereafter; we have turned to You. He said, “My punishment—I afflict with it whomever I will, and My mercy encompasses everything. I will prescribe it for those who are mindful, give zakat, and believe in Our signs.”</p>
