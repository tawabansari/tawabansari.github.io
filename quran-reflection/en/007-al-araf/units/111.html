<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:111</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said, proposing action to Pharaoh.">قالوا</button>
    <button class="word-link" type="button" data-word="أَرجِه" data-root="R J A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-a/" data-root-meaning="Postponing or deferring; the hamzah is unpronounced in some forms." data-context="Give him respite or postpone dealing with him.">أَرجِه</button>
    <button class="word-link" type="button" data-word="وَأَخاهُ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother; where context warrants, a fellow member of one’s people or an associate." data-context="And his brother, alongside the person given respite.">وَأَخاهُ</button>
    <button class="word-link" type="button" data-word="وَأَرسِل" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And send agents of gathering.">وَأَرسِل</button>

    <button class="word-link" type="button" data-word="المَدائِنِ" data-root="M D N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-d-n/" data-root-meaning="Madīnah is a town or city; its derivation from m-d-n or d-y-n is disputed." data-context="The cities through which agents are sent.">المَدائِنِ</button>
    <button class="word-link" type="button" data-word="حٰشِرينَ" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="Gatherers, agents sent through the cities to collect people." data-learn-more="/quran-terminology/en/roots/h-sh-r/">حٰشِرينَ</button>
  </p>
  <p class="english-verse">They said, “Put him and his brother off, and send gatherers into the cities.”</p>
