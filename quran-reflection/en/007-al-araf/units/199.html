<section class="ayah-block" id="ayah-199" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:199</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خُذِ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">خُذِ</button>
    <button class="word-link" type="button" data-word="العَفوَ" data-root="ʿ F W" data-learn-more="/quran-terminology/en/roots/ayn-f-w/" data-root-meaning="Passing over pursuit of a fault, lifting censure, effacing a trace, and what remains beyond need">العَفوَ</button>
    <button class="word-link" type="button" data-word="وَأمُر" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">وَأمُر</button>
    <button class="word-link" type="button" data-word="بِالعُرفِ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity.">بِالعُرفِ</button>
    <button class="word-link" type="button" data-word="وَأَعرِض" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment">وَأَعرِض</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="الجٰهِلينَ" data-root="J H L" data-learn-more="/quran-terminology/en/roots/j-h2-l/" data-root-meaning="Ignorance and unawareness; also rashness and unmeasured conduct arising from lack of knowledge, forbearance, or settled calm.">الجٰهِلينَ</button>
  </p>
  <p class="english-verse">Take to pardon, command what is right, and turn away from the ignorant.</p>
