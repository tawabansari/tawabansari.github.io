<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>

    <button class="word-link" type="button" data-word="بَعضُكُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضُكُم</button>

    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity.">عَدُوٌّ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>

    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="حينٍ" data-root="H Y N" data-learn-more="/quran-terminology/en/roots/h-y-n/" data-root-meaning="A time, moment, interval, period, deadline, or bounded segment within the flow of time.">حينٍ</button>

  <p class="english-verse">He said, “Descend, some of you enemies to others. On the earth you will have a place of settlement and enjoyment for a time.”</p>
