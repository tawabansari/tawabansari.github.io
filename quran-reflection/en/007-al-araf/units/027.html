<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰبَنى" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="Children and descendants of Adam.">يٰبَنى</button>
    <button class="word-link" type="button" data-word="ءادَمَ" data-root-note="Proper name; no root has been assigned.">ءادَمَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَفتِنَنَّكُمُ" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction" data-context="Let him not tempt you or lead you into a trial that causes you to stumble.">يَفتِنَنَّكُمُ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan, the agent of temptation in this context.">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="كَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَما</button>
    <button class="word-link" type="button" data-word="أَخرَجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="He brought your parents out.">أَخرَجَ</button>
    <button class="word-link" type="button" data-word="أَبَوَيكُم" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="Your two parents, the parental pair referred to.">أَبَوَيكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The garden from which humanity’s parents were brought out.">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="يَنزِعُ" data-root="N Z AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-z-ayn/" data-root-meaning="Pulling out or removing; tanāzuʿ is contention or dispute." data-context="Stripping their covering from them.">يَنزِعُ</button>
    <button class="word-link" type="button" data-word="عَنهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُما</button>
    <button class="word-link" type="button" data-word="لِباسَهُما" data-root="L B S" data-learn-more="/quran-terminology/en/roots/l-b-s/" data-root-meaning="Wearing, covering, layering, mixing, and making something ambiguous." data-context="The clothing or covering of the two.">لِباسَهُما</button>
    <button class="word-link" type="button" data-word="لِيُرِيَهُما" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="To show the two of them.">لِيُرِيَهُما</button>
    <button class="word-link" type="button" data-word="سَوءٰتِهِما" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Their private bodily parts that had been covered.">سَوءٰتِهِما</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="يَرىٰكُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="He sees you.">يَرىٰكُم</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="وَقَبيلُهُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="And his company or associates.">وَقَبيلُهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="In min ḥaythu lā tarawnahum, from a position or direction from which you do not see them." data-learn-more="/quran-terminology/en/roots/h-y-th/" data-root-note="Brief word meaning: A place or position specified by the accompanying clause; with min, an origin or source, and in generalizing use, wherever. Ḥaythu is largely a non-derived adverbial noun.">حَيثُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَرَونَهُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="You do not see them.">تَرَونَهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="جَعَلنَا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="We have placed them in the relationship described next.">جَعَلنَا</button>
    <button class="word-link" type="button" data-word="الشَّيٰطينَ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="The devils, misleading agents in this context.">الشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="أَولِياءَ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Allies or patrons of those who do not believe.">أَولِياءَ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="They do not believe or enter into faithful trust.">يُؤمِنونَ</button>
  </p>
  <p class="english-verse">Children of Adam, do not let Satan tempt you, as he drove your parents out of the Garden, stripping them of their clothing to show them their private parts. He and his company see you from where you do not see them. We have made the devils guardians of those who do not believe.</p>
</section>
