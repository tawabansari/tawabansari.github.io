<section class="ayah-block" id="ayah-096" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:96</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="أَهلَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="The people or inhabitants of the settlements.">أَهلَ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="The settlements and their resident communities.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Had believed, part of the opening condition.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَاتَّقَوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Had practiced taqwā, within the same condition.">وَاتَّقَوا</button>
    <button class="word-link" type="button" data-word="لَفَتَحنا" data-root="F T Ḥ" data-learn-more="/quran-terminology/en/roots/f-t-h/" data-root-meaning="From Opening What Is Closed to Access, Judgment, and a Decisive Opening" data-context="We would surely have opened, the conditional outcome concerning blessings.">لَفَتَحنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بَرَكٰتٍ" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="Blessings and good from heaven and earth; plural barakah in a condition involving belief and taqwā." data-learn-more="/quran-terminology/en/roots/b-r-k/">بَرَكٰتٍ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Heaven, a stated source of blessings.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="Earth, alongside heaven.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="They denied, the response attributed to those people.">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="فَأَخَذنٰهُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="We seized or called them to account.">فَأَخَذنٰهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="In kānū yaksibūn, the continuance of past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="They earned, referring to the outcome of their conduct.">يَكسِبونَ</button>
  </p>
  <p class="english-verse">Had the people of the towns believed and been mindful, We would have opened blessings from heaven and earth for them. But they denied, so We seized them for what they used to earn.</p>
</section>
