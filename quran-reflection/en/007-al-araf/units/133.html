<section class="ayah-block" id="ayah-133" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:133</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَرسَلنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="so We sent">فَأَرسَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الطّوفانَ" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="the flood">الطّوفانَ</button>
    <button class="word-link" type="button" data-word="وَالجَرادَ" data-root="J R D" data-root-meaning="Removing or lacking a covering and exposing a surface; jarād names locusts." data-context="and locusts" data-learn-more="/quran-terminology/en/roots/j-r-d/">وَالجَرادَ</button>
    <button class="word-link" type="button" data-word="وَالقُمَّلَ" data-root="Q M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-m-l/" data-root-meaning="Qummal denotes pest insects, variously identified; qaml means lice." data-context="and qummal; harmful small creatures, interpreted among other ways as lice">وَالقُمَّلَ</button>
    <button class="word-link" type="button" data-word="وَالضَّفادِعَ" data-root="DAD F D AYN" data-root-meaning="Frog; the familiar amphibian associated with water and moist environments." data-context="and frogs" data-learn-more="/quran-terminology/en/roots/dad-f-d-ayn/">وَالضَّفادِعَ</button>
    <button class="word-link" type="button" data-word="وَالدَّمَ" data-root="D M W" data-root-meaning="Blood, the vital fluid of human and animal bodies. Dam is singular and dimāʾ its plural; bloodshed, dietary rulings and other implications follow from construction and context. The third radical has been analysed as either D M W or D M Y." data-learn-more="/quran-terminology/en/roots/d-m-w/" data-context="and blood">وَالدَّمَ</button>
    <button class="word-link" type="button" data-word="ءايٰتٍ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="signs">ءايٰتٍ</button>
    <button class="word-link" type="button" data-word="مُفَصَّلٰتٍ" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="distinct and clear" data-learn-more="/quran-terminology/en/roots/f-sad-l/">مُفَصَّلٰتٍ</button>
    <button class="word-link" type="button" data-word="فَاستَكبَروا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="yet they acted arrogantly">فَاستَكبَروا</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="and they were">وَكانوا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="a people" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومًا</button>
    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="criminal and sinful" data-learn-more="/quran-terminology/en/roots/j-r-m/">مُجرِمينَ</button>
  </p>
  <p class="english-verse">We sent upon them the flood, locusts, lice, frogs, and blood as distinct signs. They were arrogant and were a guilty people.</p>
</section>
