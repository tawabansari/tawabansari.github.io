  <h2 class="ayah-title">Al-A’raf 7:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَنَقُصَّنَّ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="Then We will surely recount to them; an emphatic verb, followed by the qualification of knowledge." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">فَلَنَقُصَّنَّ</button>

  <p class="english-verse">We will surely recount to them with knowledge; We were not absent.</p>
