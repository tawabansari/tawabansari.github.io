<section class="ayah-block" id="ayah-161" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:161</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="It was said to them.">قيلَ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="اسكُنوا" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling" data-context="Dwell and take up residence.">اسكُنوا</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="القَريَةَ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="The settlement being indicated.">القَريَةَ</button>
    <button class="word-link" type="button" data-word="وَكُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="And eat and partake.">وَكُلوا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنها</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="Wherever you wish, within the settlement referred to." data-learn-more="/quran-terminology/en/roots/h-y-th/" data-root-note="Brief word meaning: A place or position specified by the accompanying clause; with min, an origin or source, and in generalizing use, wherever. Ḥaythu is largely a non-derived adverbial noun.">حَيثُ</button>
    <button class="word-link" type="button" data-word="شِئتُم" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wherever you wish.">شِئتُم</button>
    <button class="word-link" type="button" data-word="وَقولوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And say, expressing the request.">وَقولوا</button>
    <button class="word-link" type="button" data-word="حِطَّةٌ" data-root="Ḥ Ṭ Ṭ (Ḥ TT TT)" data-learn-more="/quran-terminology/en/roots/h-tt-tt/" data-root-meaning="Lowering and setting down; and in the Qur’anic use of ḥiṭṭah, asking that the burden of errors be set down and forgiven." data-context="Ḥiṭṭah, a request for the burden of wrongdoing to be removed.">حِطَّةٌ</button>
    <button class="word-link" type="button" data-word="وَادخُلُوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="And enter.">وَادخُلُوا</button>
    <button class="word-link" type="button" data-word="البابَ" data-root="B W B" data-learn-more="/quran-terminology/en/roots/b-w-b/" data-root-meaning="Door, gate, entrance, and threshold of passage between outside and inside." data-context="The gate or entrance referred to.">البابَ</button>
    <button class="word-link" type="button" data-word="سُجَّدًا" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="In prostration and humility.">سُجَّدًا</button>
    <button class="word-link" type="button" data-word="نَغفِر" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="We will forgive your errors.">نَغفِر</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="خَطيـٰٔتِكُم" data-root="KH Ṭ A" data-learn-more="/quran-terminology/en/roots/kh-tt-a/" data-root-meaning="Slipping from the right path, missing the mark, going wrong; and in some forms, conscious deviation from truth." data-context="Your errors and wrongdoings.">خَطيـٰٔتِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="سَنَزيدُ" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="We will give them more.">سَنَزيدُ</button>
    <button class="word-link" type="button" data-word="المُحسِنينَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Those who do good and act well.">المُحسِنينَ</button>
  </p>
  <p class="english-verse">When it was said to them, “Dwell in this town and eat from it wherever you wish, say, ‘A lowering of the burden,’ and enter the gate in prostration. We will forgive your errors and increase the doers of good.”</p>
</section>
