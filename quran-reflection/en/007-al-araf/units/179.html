  <h2 class="ayah-title">Al-A’raf 7:179</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="ذَرَأنا" data-root="DH R A" data-learn-more="/quran-terminology/en/roots/dh-r-a/" data-root-meaning="Bringing creatures into being and creation; in contexts of pairs and generations, multiplication and increase." data-context="We brought into being, referring to many jinn and humans whose characteristics follow.">ذَرَأنا</button>
    <button class="word-link" type="button" data-word="لِجَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">لِجَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Many; a large number of jinn and humans.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجِنِّ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The jinn; one of the two groups discussed in the verse.">الجِنِّ</button>
    <button class="word-link" type="button" data-word="وَالإِنسِ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="And humans; the other group alongside jinn.">وَالإِنسِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="قُلوبٌ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Hearts; faculties of understanding that this group does not use.">قُلوبٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَفقَهونَ" data-root="F Q H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-h2/" data-root-meaning="Understanding or comprehending speech or a matter." data-context="They do not understand with their hearts.">يَفقَهونَ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="أَعيُنٌ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="Eyes with which they do not see.">أَعيُنٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُبصِرونَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="They do not see; they gain no insight through their eyes.">يُبصِرونَ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="وَلَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُم</button>
    <button class="word-link" type="button" data-word="ءاذانٌ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Ears; faculties of hearing that they do not put to use.">ءاذانٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَسمَعونَ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="They do not hear; they do not listen with their ears.">يَسمَعونَ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="كَالأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="Like livestock; the comparison applied to this group.">كَالأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="أَضَلُّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Further astray, in comparison with the livestock just mentioned.">أَضَلُّ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الغٰفِلونَ" data-root="GH F L" data-learn-more="/quran-terminology/en/roots/gh-f-l/" data-root-meaning="Something remaining outside, or being left outside, the field of attention, watchfulness, and follow-up" data-context="The heedless; those lacking the required awareness and attention.">الغٰفِلونَ</button>
  </p>
  <p class="english-verse">We have brought forth for Hell many of the jinn and humans. They have hearts with which they do not understand, eyes with which they do not see, and ears with which they do not hear. They are like livestock, but more astray. They are the heedless.</p>
</section>
