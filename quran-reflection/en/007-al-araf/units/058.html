<section class="ayah-block" id="ayah-058" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:58</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالبَلَدُ" data-root="B L D" data-learn-more="/quran-terminology/en/roots/b-l-d/" data-root-meaning="From a tract of land to a territory, settlement, and a secure place" data-context="The land, whose capacity for growth is being described.">وَالبَلَدُ</button>
    <button class="word-link" type="button" data-word="الطَّيِّبُ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant." data-context="Good-quality land suitable for vegetation to grow.">الطَّيِّبُ</button>
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Comes forth; vegetation grows out of the land.">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="نَباتُهُ" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed." data-context="Its vegetation; what grows from that land.">نَباتُهُ</button>
    <button class="word-link" type="button" data-word="بِإِذنِ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="By the permission of its Lord.">بِإِذنِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Its Lord; the One who nurtures and governs it.">رَبِّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذى</button>
    <button class="word-link" type="button" data-word="خَبُثَ" data-root="KH B TH" data-learn-more="/quran-terminology/en/roots/kh-b-th/" data-root-meaning="In its basic sense, khabīth describes something undesirable and unworthy in quality, effect, conduct, or value." data-context="Is poor in quality; land unsuitable for productive growth.">خَبُثَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Comes forth; the meager, difficult growth from poor land.">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="نَكِدًا" data-root="N K D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-d/" data-root-meaning="Difficulty, poor yield, or scant return obtained with hardship." data-context="With difficulty and scant yield; describing the growth.">نَكِدًا</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نُصَرِّفُ" data-root="SAD R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-f/" data-root-meaning="Turning or changing; taṣrīf denotes varying, directing, or presenting in different ways." data-context="We explain in varied ways.">نُصَرِّفُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The signs, explained to invite recognition and gratitude.">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life; A people, group, or society standing upon a shared bond." data-context="For a people; the human community addressed by the signs.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَشكُرونَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="Give thanks and respond fittingly to the gift.">يَشكُرونَ</button>
  </p>
  <p class="english-verse">The good land brings forth its vegetation by its Lord’s permission; what is bad brings forth only scantily. Thus We present the signs in varied ways for people who give thanks.</p>
</section>
