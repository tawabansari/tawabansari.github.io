  <h2 class="ayah-title">Al-A’raf 7:70</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>

  <p class="english-verse">They said, “Have you come to us so that we worship The God alone and leave what our fathers worshipped? Bring us what you promise us, if you are truthful.”</p>
