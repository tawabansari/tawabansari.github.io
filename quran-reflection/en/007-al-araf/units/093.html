<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:93</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَوَلّىٰ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">فَتَوَلّىٰ</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَقَد</button>
    <button class="word-link" type="button" data-word="أَبلَغتُكُم" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof">أَبلَغتُكُم</button>
    <button class="word-link" type="button" data-word="رِسٰلٰتِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رِسٰلٰتِ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبّى</button>
    <button class="word-link" type="button" data-word="وَنَصَحتُ" data-root="N SAD H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sad-h/" data-root-meaning="Sincere goodwill or counsel; naṣūḥ means genuine or wholehearted.">وَنَصَحتُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="ءاسىٰ" data-root="A S Y" data-learn-more="/quran-terminology/en/roots/a-s-w/" data-root-meaning="being affected by loss, an unfulfilled hope, or people’s conduct; a branch whose derivational relationship to A S W is not classified uniformly in lexical sources.">ءاسىٰ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">قَومٍ</button>
    <button class="word-link" type="button" data-word="كٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كٰفِرينَ</button>
  </p>
  <p class="english-verse">He turned away from them and said, “My people, I conveyed my Lord’s messages to you and advised you sincerely. How, then, should I grieve for a disbelieving people?”</p>
