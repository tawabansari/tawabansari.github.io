<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَينَهُما" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="And between the two groups or destinations.">وَبَينَهُما</button>
    <button class="word-link" type="button" data-word="حِجابٌ" data-root="H J B" data-root-meaning="Covering, obstructing, and separating; preventing sight or access." data-context="A partition separating the two sides." data-learn-more="/quran-terminology/en/roots/h-j-b/">حِجابٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="الأَعرافِ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="The Heights between the destinations.">الأَعرافِ</button>
    <button class="word-link" type="button" data-word="رِجالٌ" data-root="R J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="A man; also a foot and walking on foot, in different forms." data-context="Men present on the Heights.">رِجالٌ</button>
    <button class="word-link" type="button" data-word="يَعرِفونَ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="Recognize each group by their marks.">يَعرِفونَ</button>
    <button class="word-link" type="button" data-word="كُلًّا" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Each one, the people or groups concerned.">كُلًّا</button>
    <button class="word-link" type="button" data-word="بِسيمىٰهُم" data-root="S W M" data-learn-more="/quran-terminology/en/roots/s-w-m/" data-root-meaning="Sending forth, placing under exposure, continual imposition, and marking for distinction" data-context="By their identifying marks.">بِسيمىٰهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنادَوا" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="And called to the Garden’s people from the Heights." data-learn-more="/quran-terminology/en/roots/n-d-y/">وَنادَوا</button>
    <button class="word-link" type="button" data-word="أَصحٰبَ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="The people addressed, belonging to the Garden.">أَصحٰبَ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The Garden, the addressees’ destination.">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="سَلٰمٌ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Peace, a greeting of safety to the addressees.">سَلٰمٌ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَدخُلوها" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="Enter it, with entry not yet having occurred.">يَدخُلوها</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="يَطمَعونَ" data-root="Ṭ M ʿ (TT M Ayn)" data-learn-more="/quran-terminology/en/roots/tt-m-ayn/" data-root-meaning="Expectation and inner inclination toward attaining a desired matter thought possible" data-context="Hope or long to enter.">يَطمَعونَ</button>
  </p>
  <p class="english-verse">Between the two is a barrier, and on the heights are men who recognize each by their marks. They call to the companions of the Garden, “Peace be upon you.” They have not entered it, though they hope to.</p>
</section>
