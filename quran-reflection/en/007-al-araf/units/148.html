<section class="ayah-block" id="ayah-148" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:148</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاتَّخَذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="They took or adopted; Moses’s people adopting the calf as a deity.">وَاتَّخَذَ</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Moses’s people, who adopted the calf in his absence.">قَومُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After him; during Moses’s absence.">بَعدِهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="حُلِيِّهِم" data-root="H L Y" data-root-meaning="Ornaments and adornment; adorning people or objects with something added to their appearance for beauty." data-context="Their ornaments, from which the calf’s bodily form was fashioned." data-learn-more="/quran-terminology/en/roots/h-l-y/">حُلِيِّهِم</button>
    <button class="word-link" type="button" data-word="عِجلًا" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf" data-context="A calf; the form of the body the people adopted.">عِجلًا</button>
    <button class="word-link" type="button" data-word="جَسَدًا" data-root="J S D" data-root-meaning="A body or bodily form; the word alone does not determine life, death, or awareness." data-context="A bodily form; describing the calf fashioned from the people’s ornaments and possessing a lowing sound." data-learn-more="/quran-terminology/en/roots/j-s-d/">جَسَدًا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="خُوارٌ" data-root="KH W R" data-root-meaning="In one branch, an animal call, especially cattle and calf lowing; in another, weakness, slackness, and reduced firmness." data-context="Lowing; the bovine sound attributed to the calf-shaped body." data-learn-more="/quran-terminology/en/roots/kh-w-r/">خُوارٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="See or perceive; within “did they not see” concerning the calf’s incapacity.">يَرَوا</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُكَلِّمُهُم" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="Speaks to them; an ability denied of the calf here.">يُكَلِّمُهُم</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَهديهِم" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guides them; a capacity denied of the calf.">يَهديهِم</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="A way or path, which the calf cannot show them.">سَبيلًا</button>
    ۘ
    <button class="word-link" type="button" data-word="اتَّخَذوهُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="They adopted it; taking that calf as a deity.">اتَّخَذوهُ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were; introducing the description of the people as wrongdoers.">وَكانوا</button>
    <button class="word-link" type="button" data-word="ظٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Wrongdoers; describing those who adopted the calf as a deity.">ظٰلِمينَ</button>
  </p>
  <p class="english-verse">After Moses, his people took from their ornaments a calf, a body with a lowing sound. Did they not see that it neither spoke to them nor guided them to a way? They took it and were unjust.</p>
</section>
