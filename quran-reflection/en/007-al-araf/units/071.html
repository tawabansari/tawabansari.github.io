<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:71</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Hūd said; his response to his people.">قالَ</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="وَقَعَ" data-root="W Q AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-q-ayn/" data-root-meaning="Falling, occurring, or coming to pass." data-context="Has fallen or become due; concerning defilement and wrath.">وَقَعَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; in the attribution of defilement and wrath.">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="رِجسٌ" data-root="R J S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-s/" data-root-meaning="Physical or moral uncleanness, according to context." data-context="Defilement or afflicting punishment; in Hūd’s warning.">رِجسٌ</button>
    <button class="word-link" type="button" data-word="وَغَضَبٌ" data-root="GH Ḍ B" data-learn-more="/quran-terminology/en/roots/gh-dad-b/" data-root-meaning="Intense displeasure and a response to what is unacceptable" data-context="And wrath, in the warning about the people’s conduct.">وَغَضَبٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="أَتُجٰدِلونَنى" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="Do you dispute with me over unsupported names of alleged deities?" data-learn-more="/quran-terminology/en/roots/j-d-l/">أَتُجٰدِلونَنى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="أَسماءٍ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="Names for alleged deities; the subject of the people’s disputation.">أَسماءٍ</button>
    <button class="word-link" type="button" data-word="سَمَّيتُموها" data-root="S M W" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="You have named them; attributing the naming to the addressees.">سَمَّيتُموها</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتُم</button>
    <button class="word-link" type="button" data-word="وَءاباؤُكُم" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="And your fathers and ancestors, who participated in the naming.">وَءاباؤُكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="نَزَّلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Has sent down; the verse denies any revealed authority for the claim.">نَزَّلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سُلطٰنٍ" data-root="S L TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-l-tt/" data-root-meaning="Power to prevail; sulṭān denotes authority, power, or compelling proof, according to context." data-context="Evidence and valid authority, denied in this case.">سُلطٰنٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَانتَظِروا" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Then wait; for the warned consequence.">فَانتَظِروا</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُنتَظِرينَ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="Those waiting; Hūd too awaits the outcome with them.">المُنتَظِرينَ</button>
  </p>
  <p class="english-verse">He said, “Defilement and anger from your Lord have fallen upon you. Do you argue with me about names that you and your fathers have named, for which The God has sent down no authority? Wait, then; I too am waiting with you.”</p>
</section>
