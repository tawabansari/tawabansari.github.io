<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:34</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="And for every; extending the statement to each community.">وَلِكُلِّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="Community; each community with an appointed term.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="أَجَلٌ" data-root="A J L" data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period or time; where appropriate, the end of that period." data-context="An appointed term; the community’s allotted endpoint.">أَجَلٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="جاءَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Arrives; their appointed term reaching its end.">جاءَ</button>
    <button class="word-link" type="button" data-word="أَجَلُهُم" data-root="A J L" data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period or time; where appropriate, the end of that period." data-context="Their term; the appointed endpoint for them.">أَجَلُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَأخِرونَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="They cannot delay; they cannot postpone the appointed term.">يَستَأخِرونَ</button>
    <button class="word-link" type="button" data-word="ساعَةً" data-root="S W AYN" data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A portion of time or an appointed time; al-sāʿah in resurrection contexts is the promised Hour. Suwāʿ is a deity’s proper name of uncertain derivation." data-context="Even a short interval; denying any delay in the term.">ساعَةً</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَستَقدِمونَ" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="They cannot advance it; they cannot bring the appointment forward.">يَستَقدِمونَ</button>
  </p>
  <p class="english-verse">Every community has a term. When their term comes, they can neither delay it an hour nor advance it.</p>
</section>
