<section class="ayah-block" id="ayah-171" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:171</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="نَتَقنَا" data-root="N T Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-t-q/" data-root-meaning="Uprooting, lifting, or shaking." data-context="We uprooted and raised; the action described for the mountain above them.">نَتَقنَا</button>
    <button class="word-link" type="button" data-word="الجَبَلَ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="The mountain; raised above a group of Israelites." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجَبَلَ</button>
    <button class="word-link" type="button" data-word="فَوقَهُم" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number" data-context="Above them; the mountain’s position relative to them.">فَوقَهُم</button>
    <button class="word-link" type="button" data-word="كَأَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّهُ</button>
    <button class="word-link" type="button" data-word="ظُلَّةٌ" data-root="Ẓ L L (Zha L L)" data-learn-more="/quran-terminology/en/roots/zha-l-l/" data-root-meaning="Shade, a covering that blocks direct exposure, casting shade, and in the verb ظَلَّ, continuing or remaining in a state." data-context="A canopy; the comparison for the mountain overhead.">ظُلَّةٌ</button>
    <button class="word-link" type="button" data-word="وَظَنّوا" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action." data-context="And thought; their expectation that the mountain would fall on them.">وَظَنّوا</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="واقِعٌ" data-root="W Q AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-q-ayn/" data-root-meaning="Falling, occurring, or coming to pass." data-context="Falling; what they thought would come down upon them.">واقِعٌ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِم</button>
    <button class="word-link" type="button" data-word="خُذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Take; the command to receive what they were given.">خُذوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="ءاتَينٰكُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We gave you; what they are to take firmly.">ءاتَينٰكُم</button>
    <button class="word-link" type="button" data-word="بِقُوَّةٍ" data-root="Q W Y" data-learn-more="/quran-terminology/en/roots/q-w-y/" data-root-meaning="Force, ability, power, and firmness; the capacity to act, endure, resist, or have an effect." data-context="With strength and resolve; how they are to receive the divine gift.">بِقُوَّةٍ</button>
    <button class="word-link" type="button" data-word="وَاذكُروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And remember; the command to keep its contents in mind.">وَاذكُروا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تَتَّقونَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Be mindful; the intended result of remembrance and firm reception.">تَتَّقونَ</button>
  </p>
  <p class="english-verse">When We raised the mountain above them as though it were a canopy, and they thought it would fall upon them: “Take what We have given you firmly and remember what is in it, so that you may be mindful.”</p>
</section>
