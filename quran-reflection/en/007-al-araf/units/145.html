  <h2 class="ayah-title">Al-A’raf 7:145</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَتَبنا" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="And We wrote.">وَكَتَبنا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَلواحِ" data-root="L W H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-w-h/" data-root-meaning="A board or tablet; also appearing, scorching, or altering color." data-context="The tablets.">الأَلواحِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; expressing comprehensiveness.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="A thing or matter under discussion." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God As the noun shayʾ, a thing or matter under discussion, distinct from the verb of willing.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="مَوعِظَةً" data-root="W AYN ZH (W ʿ Ẓ)" data-learn-more="/quran-terminology/en/roots/w-ayn-zha/" data-root-meaning="Admonishing, counseling, warning, and reminding of consequences in order to make one attentive and reform conduct." data-context="Admonition.">مَوعِظَةً</button>
    <button class="word-link" type="button" data-word="وَتَفصيلًا" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="And clear, distinct exposition; clarifying the specified subject’s components and limits." data-learn-more="/quran-terminology/en/roots/f-sad-l/">وَتَفصيلًا</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="For every; expressing comprehensiveness.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="A thing or matter under discussion." data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God As the noun shayʾ, a thing or matter under discussion, distinct from the verb of willing.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="فَخُذها" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="So take them.">فَخُذها</button>
    <button class="word-link" type="button" data-word="بِقُوَّةٍ" data-root="Q W Y" data-learn-more="/quran-terminology/en/roots/q-w-y/" data-root-meaning="Force, ability, power, and firmness; the capacity to act, endure, resist, or have an effect." data-context="With strength and resolve.">بِقُوَّةٍ</button>
    <button class="word-link" type="button" data-word="وَأمُر" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="And command.">وَأمُر</button>
    <button class="word-link" type="button" data-word="قَومَكَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="Your people." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومَكَ</button>
    <button class="word-link" type="button" data-word="يَأخُذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="They take or hold to.">يَأخُذوا</button>
    <button class="word-link" type="button" data-word="بِأَحسَنِها" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="To the best of them.">بِأَحسَنِها</button>
    ۚ
    <button class="word-link" type="button" data-word="سَأُو۟ريكُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="I will show you.">سَأُو۟ريكُم</button>
    <button class="word-link" type="button" data-word="دارَ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence" data-context="The abode of.">دارَ</button>
    <button class="word-link" type="button" data-word="الفٰسِقينَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command" data-context="Those who disobey or transgress.">الفٰسِقينَ</button>
  </p>
  <p class="english-verse">We wrote for him on the tablets an admonition concerning everything and an explanation of everything. Take them firmly and command your people to take the best of them. I will show you the abode of the disobedient.</p>
</section>
