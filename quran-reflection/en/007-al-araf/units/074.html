<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:74</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">وَاذكُروا</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="جَعَلَكُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلَكُم</button>
    <button class="word-link" type="button" data-word="خُلَفاءَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">خُلَفاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدِ</button>
    <button class="word-link" type="button" data-word="عادٍ" data-root-note="Proper name; no root has been assigned.">عادٍ</button>
    <button class="word-link" type="button" data-word="وَبَوَّأَكُم" data-root="B W ʾ" data-learn-more="/quran-terminology/en/roots/b-w-a/" data-root-meaning="From returning and settling to providing a place and incurring consequences">وَبَوَّأَكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="تَتَّخِذونَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">تَتَّخِذونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سُهولِها" data-root="S H2 L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-h2-l/" data-root-meaning="Levelness and ease; sahl denotes level ground.">سُهولِها</button>
    <button class="word-link" type="button" data-word="قُصورًا" data-root="Q SAD R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-sad-r/" data-root-meaning="Shortening or restricting; qaṣr is a palace or large building.">قُصورًا</button>
    <button class="word-link" type="button" data-word="وَتَنحِتونَ" data-root="N H T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-h-t/" data-root-meaning="Carving stone, wood, or another hard material.">وَتَنحِتونَ</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="J B L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-b-l/" data-root-meaning="Jabal: a mountain or elevated mass; jibillah can concern a multitude or natural disposition.">الجِبالَ</button>
    <button class="word-link" type="button" data-word="بُيوتًا" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/" data-root-meaning="A house or dwelling; bāta: spending the night; tabyīt: arranging something by night or in secret." data-root-note="Preliminary meaning; a full root study is not yet available.">بُيوتًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَاذكُروا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">فَاذكُروا</button>
    <button class="word-link" type="button" data-word="ءالاءَ" data-root="A L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-l-w/" data-root-meaning="Distinct uses concern falling short, swearing an oath, and ālāʾ meaning blessings or favors.">ءالاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعثَوا" data-root="AYN TH W (ʿ TH W)" data-learn-more="/quran-terminology/en/roots/ayn-th-w/" data-root-meaning="Engaging in corruption and disturbing sound order in a way that harms people’s rights and collective life.">تَعثَوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضِ</button>
    <button class="word-link" type="button" data-word="مُفسِدينَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order">مُفسِدينَ</button>
  </p>
  <p class="english-verse">Remember when He made you successors after Aad and settled you on the earth. You build palaces on its plains and carve the mountains into homes. Remember the favors of The God, and do not act wickedly on the earth, spreading corruption.</p>
</section>
