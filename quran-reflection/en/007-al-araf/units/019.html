<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيٰـٔادَمُ" data-root-note="Proper name; no root has been assigned.">وَيٰـٔادَمُ</button>
    <button class="word-link" type="button" data-word="اسكُن" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling" data-context="Dwell and take up residence.">اسكُن</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتَ</button>
    <button class="word-link" type="button" data-word="وَزَوجُكَ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="And your spouse, addressed together with Adam.">وَزَوجُكَ</button>
    <button class="word-link" type="button" data-word="الجَنَّةَ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The garden designated as their dwelling.">الجَنَّةَ</button>

    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="In min ḥaythu shiʾtumā, wherever you two wish within the garden." data-learn-more="/quran-terminology/en/roots/h-y-th/" data-root-note="Brief word meaning: A place or position specified by the accompanying clause; with min, an origin or source, and in generalizing use, wherever. Ḥaythu is largely a non-derived adverbial noun.">حَيثُ</button>

    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَقرَبا" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Do not approach, either of you.">تَقرَبا</button>
    <button class="word-link" type="button" data-word="هٰذِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذِهِ</button>
    <button class="word-link" type="button" data-word="الشَّجَرَةَ" data-root="SH J R" data-learn-more="/quran-terminology/en/roots/sh-j-r/" data-root-meaning="Branching, ramification, interweaving, and complex extension from a single origin" data-context="The particular tree they are forbidden to approach.">الشَّجَرَةَ</button>
    <button class="word-link" type="button" data-word="فَتَكونا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Then you would become members of the following group.">فَتَكونا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Those who transgress what is right and commit wrong.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">Adam, dwell in the Garden, you and your spouse, and eat from wherever you wish; but do not approach this tree, lest you become among the unjust.</p>
</section>
