<section class="ayah-block" id="ayah-101" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:101</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تِلكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">تِلكَ</button>
    <button class="word-link" type="button" data-word="القُرىٰ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="Settlements; the communities whose reports are recounted.">القُرىٰ</button>
    <button class="word-link" type="button" data-word="نَقُصُّ" data-root="Q SAD SAD" data-root-meaning="Following traces and recounting; qiṣāṣ: proportionate response to harm; cutting and trimming are also recorded lexical uses." data-context="We recount; relating some reports of the settlements to the addressee." data-learn-more="/quran-terminology/en/roots/q-sad-sad/">نَقُصُّ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَنبائِها" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="Their reports; the contents of part of the account.">أَنبائِها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="جاءَتهُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to them; the messengers’ arrival among the communities.">جاءَتهُم</button>
    <button class="word-link" type="button" data-word="رُسُلُهُم" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Their messengers; those bringing clear proofs.">رُسُلُهُم</button>
    <button class="word-link" type="button" data-word="بِالبَيِّنٰتِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="With clear proofs; what accompanied the messengers.">بِالبَيِّنٰتِ</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="In mā kānū: they were not; part of the negation of belief.">كانوا</button>
    <button class="word-link" type="button" data-word="لِيُؤمِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="To believe; the act negated in the sentence.">لِيُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="They had denied; the earlier rejection.">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Previously; the time of the rejection.">قَبلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="يَطبَعُ" data-root="TT B AYN" data-learn-more="/quran-terminology/en/roots/tt-b-ayn/" data-root-meaning="Sealing, imprinting, and fixing a lasting mark upon the channels of reception after a settled human direction." data-context="Seals; the image concerning closed hearts.">يَطبَعُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبِ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Hearts; what is sealed.">قُلوبِ</button>
    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelievers; those whose hearts the statement concerns.">الكٰفِرينَ</button>
  </p>
  <p class="english-verse">Those towns—We relate to you some of their news. Their messengers came to them with clear proofs, but they would not believe in what they had denied before. Thus The God seals the hearts of the disbelievers.</p>
</section>
