<section class="ayah-block" id="ayah-147" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:147</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="They denied; rejecting the signs and the meeting of the Hereafter.">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs; those they denied.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="وَلِقاءِ" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="And the meeting; in the expression “the meeting of the Hereafter.”">وَلِقاءِ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The Hereafter; the final meeting they denied.">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="حَبِطَت" data-root="H B TT" data-root-meaning="A deed losing its fruit and value; in Form IV, rendering it fruitless and ineffective." data-context="Have come to nothing; the deeds of those who denied the signs and the meeting of the Hereafter." data-learn-more="/quran-terminology/en/roots/h-b-tt/">حَبِطَت</button>
    <button class="word-link" type="button" data-word="أَعمٰلُهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Their deeds; the actions of those who denied the signs.">أَعمٰلُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="يُجزَونَ" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="They are recompensed; receiving the consequence of their deeds.">يُجزَونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were; with yaʿmalūna, describing past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They used to do; the deeds to which recompense relates.">يَعمَلونَ</button>
  </p>
  <p class="english-verse">Those who deny Our signs and the meeting of the Hereafter—their deeds have come to nothing. Are they repaid for anything but what they used to do?</p>
</section>
