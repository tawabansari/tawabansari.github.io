<section class="ayah-block" id="ayah-200" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:200</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="يَنزَغَنَّكَ" data-root="N Z GH" data-learn-more="/quran-terminology/en/roots/n-z-gh/" data-root-meaning="Harmful provocation and incitement: prompting wrongful conduct or sowing discord and corruption between people." data-context="Should provoke you toward a wrongful reaction; an emphatic conditional verb.">يَنزَغَنَّكَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنِ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan, the source of harmful incitement in this verse.">الشَّيطٰنِ</button>
    <button class="word-link" type="button" data-word="نَزغٌ" data-root="N Z GH" data-learn-more="/quran-terminology/en/roots/n-z-gh/" data-root-meaning="Harmful provocation and incitement: prompting wrongful conduct or sowing discord and corruption between people." data-context="An incitement from Satan that may divert a person from right conduct.">نَزغٌ</button>
    <button class="word-link" type="button" data-word="فَاستَعِذ" data-root="AYN W DH (ʿ W DH)" data-learn-more="/quran-terminology/en/roots/ayn-w-dh/" data-root-meaning="Seeking refuge, taking shelter, turning toward a safe place, and coming under its protection." data-context="Seek refuge against this incitement.">فَاستَعِذ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="سَميعٌ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Hearing; an attribute of The God following the command to seek refuge.">سَميعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; an attribute of The God at the verse’s conclusion.">عَليمٌ</button>
  </p>
  <p class="english-verse">If an incitement from Satan provokes you, seek refuge in The God. He is Hearing, Knowing.</p>
</section>
