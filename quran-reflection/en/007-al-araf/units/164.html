<section class="ayah-block" id="ayah-164" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:164</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذ</button>
    <button class="word-link" type="button" data-word="قالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَت</button>
    <button class="word-link" type="button" data-word="أُمَّةٌ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination">أُمَّةٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="لِمَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَ</button>
    <button class="word-link" type="button" data-word="تَعِظونَ" data-root="W AYN ZH (W ʿ Ẓ)" data-learn-more="/quran-terminology/en/roots/w-ayn-zha/" data-root-meaning="Admonishing, counseling, warning, and reminding of consequences in order to make one attentive and reform conduct.">تَعِظونَ</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">قَومًا</button>
    ۙ
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مُهلِكُهُم" data-root="H2 L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-l-k/" data-root-meaning="Perishing or destroying; also loss, according to context.">مُهلِكُهُم</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="مُعَذِّبُهُم" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">مُعَذِّبُهُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابًا</button>
    <button class="word-link" type="button" data-word="شَديدًا" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">شَديدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالوا</button>
    <button class="word-link" type="button" data-word="مَعذِرَةً" data-root="AYN DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-dh-r/" data-root-meaning="An excuse or explanation seeking to remove blame.">مَعذِرَةً</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="وَلَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَّقونَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">يَتَّقونَ</button>
  </p>
  <p class="english-verse">When a community among them said, “Why do you admonish people whom The God will destroy or punish severely?” They said, “As an excuse before your Lord, and so that they may be mindful.”</p>
</section>
