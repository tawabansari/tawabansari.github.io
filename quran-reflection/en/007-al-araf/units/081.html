<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:81</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="لَتَأتونَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="You approach men, in the condemnation of the people’s conduct.">لَتَأتونَ</button>
    <button class="word-link" type="button" data-word="الرِّجالَ" data-root="R J L" data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="Man; foot or leg; and walking or people on foot in distinct branches. Each form’s meaning follows its structure and context." data-context="Men, in the condemnation of approaching them with desire.">الرِّجالَ</button>
    <button class="word-link" type="button" data-word="شَهوَةً" data-root="SH H2 W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h2-w/" data-root-meaning="A strong desire or appetite for something." data-context="With sexual desire.">شَهوَةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Instead of women, in the expression min dūn.">دونِ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="Women, contrasted with men in this sentence.">النِّساءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="أَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="The people whom Lot addresses.">قَومٌ</button>
    <button class="word-link" type="button" data-word="مُسرِفونَ" data-root="S R F" data-learn-more="/quran-terminology/en/roots/s-r-f/" data-root-meaning="Exceeding the proper limit or measure; excess in conduct or use." data-context="Exceeding bounds, describing the people’s condemned conduct.">مُسرِفونَ</button>
  </p>
  <p class="english-verse">You approach men with desire instead of women. Rather, you are an excessive people.</p>
