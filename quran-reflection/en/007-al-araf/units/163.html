<section class="ayah-block" id="ayah-163" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:163</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَسـَٔلهُم" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="Ask them about the account of the town beside the sea.">وَسـَٔلهُم</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="القَريَةِ" data-root="Q R Y" data-learn-more="/quran-terminology/en/roots/q-r-y/" data-root-meaning="A habitation, settlement, or place where a human community resides; its exact size and structure must be known from context." data-context="The town inhabited by the people in the Sabbath account.">القَريَةِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; describing the town’s location beside the sea.">كانَت</button>
    <button class="word-link" type="button" data-word="حاضِرَةَ" data-root="Ḥ Ḍ R" data-learn-more="/quran-terminology/en/roots/h-dad-r/" data-root-meaning="Presence, arrival, proximity, and bringing into presence: from everyday life to confronting deeds in the Hereafter" data-context="Situated beside the sea, near and adjoining the water.">حاضِرَةَ</button>
    <button class="word-link" type="button" data-word="البَحرِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation" data-context="The sea beside which the town was situated.">البَحرِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="يَعدونَ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="They transgressed, violating the limits concerning the Sabbath.">يَعدونَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّبتِ" data-root="S B T" data-learn-more="/quran-terminology/en/roots/s-b-t/" data-root-meaning="Stopping, ceasing, cutting activity, and leaving work; from the historical Sabbath to sleep as subat." data-context="The Sabbath, whose limits the townspeople were bound to observe.">السَّبتِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="تَأتيهِم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="They came to them; the fish’s coming to the townspeople.">تَأتيهِم</button>
    <button class="word-link" type="button" data-word="حيتانُهُم" data-root="H W T" data-root-meaning="Fish; in non-Qur’anic uses of this family, circling and changing course." data-context="Their fish; the fish that came openly to the townspeople on the Sabbath." data-learn-more="/quran-terminology/en/roots/h-w-t/">حيتانُهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day on which the fish came openly, the Sabbath.">يَومَ</button>
    <button class="word-link" type="button" data-word="سَبتِهِم" data-root="S B T" data-learn-more="/quran-terminology/en/roots/s-b-t/" data-root-meaning="Stopping, ceasing, cutting activity, and leaving work; from the historical Sabbath to sleep as subat." data-context="Their Sabbath, associated with that community and its observance.">سَبتِهِم</button>
    <button class="word-link" type="button" data-word="شُرَّعًا" data-root="SH R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-r-ayn/" data-root-meaning="A clear way or establishing a course; sharīʿah is a way or ordinance; shurraʿ describes openly approaching." data-context="Openly visible and within reach; describing how the fish appeared.">شُرَّعًا</button>
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And on a day; another time contrasted with the Sabbath day.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَسبِتونَ" data-root="S B T" data-learn-more="/quran-terminology/en/roots/s-b-t/" data-root-meaning="Stopping, ceasing, cutting activity, and leaving work; from the historical Sabbath to sleep as subat." data-context="They kept Sabbath; with lā, a day when they did not observe Sabbath.">يَسبِتونَ</button>
    ۙ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَأتيهِم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="They came to them; negated by lā, the fish did not come on that day.">تَأتيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَبلوهُم" data-root="B L W" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away" data-context="We tested them; this situation provided the setting of their trial.">نَبلوهُم</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were; with the following verb, describing their continuing conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَفسُقونَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command" data-context="They disobeyed, departing from their limits and obligations.">يَفسُقونَ</button>
  </p>
  <p class="english-verse">Ask them about the town by the sea, when they transgressed on the Sabbath: their fish came openly to them on their Sabbath day, but on the day they did not keep Sabbath, they did not come. Thus We tested them because of their disobedience.</p>
</section>
