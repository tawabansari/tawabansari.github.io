    <button class="word-link" type="button" data-word="الماءَ" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence">الماءَ</button>
    <button class="word-link" type="button" data-word="فَأَخرَجنا" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">فَأَخرَجنا</button>

    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>

    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>

  </p>
  <p class="english-verse">He is the One who sends the winds as good news ahead of His mercy. When they carry heavy clouds, We drive them to a dead land and send down water with them; with it We bring forth every kind of fruit. Thus We bring forth the dead, so that you may take heed.</p>
</section>
