<section class="ayah-block" id="ayah-173" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:173</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَقولوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Or you might say.">تَقولوا</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أَشرَكَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="They associated partners with God.">أَشرَكَ</button>
    <button class="word-link" type="button" data-word="ءاباؤُنا" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="Our fathers and ancestors.">ءاباؤُنا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before us.">قَبلُ</button>
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And we were.">وَكُنّا</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّةً" data-root="DH R R" data-learn-more="/quran-terminology/en/roots/dh-r-r/" data-root-meaning="Dharrah: perceptible smallness; dhurriyyah: descendants and the question of origin" data-context="Descendants after the fathers.">ذُرِّيَّةً</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِم" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After them.">بَعدِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَتُهلِكُنا" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="Will You destroy us for what the followers of falsehood did, in the addressees’ hypothetical plea?" data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَفَتُهلِكُنا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="فَعَلَ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="What they did.">فَعَلَ</button>
    <button class="word-link" type="button" data-word="المُبطِلونَ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="Those engaged in falsehood.">المُبطِلونَ</button>
  </p>
  <p class="english-verse">Or say, “Our fathers associated partners before us, and we were descendants after them. Will You destroy us for what the followers of falsehood did?”</p>
</section>
