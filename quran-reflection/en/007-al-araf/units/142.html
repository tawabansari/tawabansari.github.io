<section class="ayah-block" id="ayah-142" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:142</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوٰعَدنا" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="We appointed a meeting with Moses for thirty nights, completed with ten more.">وَوٰعَدنا</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="ثَلٰثينَ" data-root="TH L TH" data-root-meaning="Three and its related forms: a count of three, third position, one-third and two-thirds, and distribution in threes." data-context="Thirty, the initial number of nights in Moses’ appointment." data-learn-more="/quran-terminology/en/roots/th-l-th/">ثَلٰثينَ</button>
    <button class="word-link" type="button" data-word="لَيلَةً" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Nights, the unit counted in the thirty-night period.">لَيلَةً</button>
    <button class="word-link" type="button" data-word="وَأَتمَمنٰها" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete." data-context="And We completed it, adding ten nights to thirty.">وَأَتمَمنٰها</button>
    <button class="word-link" type="button" data-word="بِعَشرٍ" data-root="AYN SH R" data-root-meaning="Ten and its numerical forms and ratios; association, companionship, kindred, and an assembly. ʿIshār: she-camels approaching delivery." data-context="With ten, the additional nights added to the first period." data-learn-more="/quran-terminology/en/roots/ayn-sh-r/">بِعَشرٍ</button>
    <button class="word-link" type="button" data-word="فَتَمَّ" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete." data-context="Thus it was completed; the appointed period reached forty nights.">فَتَمَّ</button>
    <button class="word-link" type="button" data-word="ميقٰتُ" data-root="W Q T" data-root-meaning="A specified time or temporal limit, and appointing it for an undertaking, appointment, or event." data-context="His Lord’s appointment, Moses’ appointed period completed as forty nights." data-learn-more="/quran-terminology/en/roots/w-q-t/">ميقٰتُ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord, to whom Moses’ appointment is attributed.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="أَربَعينَ" data-root="R B AYN (R B ʿ)" data-learn-more="/quran-terminology/en/roots/r-b-ayn/" data-root-meaning="Four, fourfold grouping, one-fourth, forty, and the semantic field of counting and division" data-context="Forty, the total nights of the completed appointment.">أَربَعينَ</button>
    <button class="word-link" type="button" data-word="لَيلَةً" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Nights, specifying the duration of forty nights.">لَيلَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And he said; Moses’ address to his brother Aaron.">وَقالَ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="لِأَخيهِ" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother; where context warrants, a fellow member of one’s people or an associate." data-context="To his brother, Aaron, whom Moses addresses.">لِأَخيهِ</button>
    <button class="word-link" type="button" data-word="هٰرونَ" data-root-note="Proper name; no root has been assigned.">هٰرونَ</button>
    <button class="word-link" type="button" data-word="اخلُفنى" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Take my place among my people; Moses’ instruction to Aaron.">اخلُفنى</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="قَومى" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="My people, among whom Moses asks Aaron to take his place." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومى</button>
    <button class="word-link" type="button" data-word="وَأَصلِح" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="And set things right; attend to the people’s affairs.">وَأَصلِح</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَّبِع" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="Do not follow; in the prohibition against following the corrupters’ way.">تَتَّبِع</button>
    <button class="word-link" type="button" data-word="سَبيلَ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way attributed to those who cause corruption.">سَبيلَ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order" data-context="Those who cause corruption, whose way must not be followed.">المُفسِدينَ</button>
  </p>
  <p class="english-verse">We appointed thirty nights for Moses and completed them with ten, so his Lord’s appointed time was fulfilled in forty nights. Moses said to his brother Aaron, “Take my place among my people, set things right, and do not follow the way of the corrupters.”</p>
</section>
