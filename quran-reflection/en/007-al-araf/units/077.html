<section class="ayah-block" id="ayah-077" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:77</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَعَقَرُوا" data-root="AYN Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-q-r/" data-root-meaning="Hamstringing or disabling; ʿāqir means barren in another branch." data-context="Then they hamstrung her; the people’s attack on the she-camel.">فَعَقَرُوا</button>
    <button class="word-link" type="button" data-word="النّاقَةَ" data-root="N W Q" data-learn-more="/quran-terminology/en/roots/n-w-q/" data-root-meaning="Nāqah means a female camel. The family also includes its plurals, training and taming camels, and some uses involving care and refinement. In the Qur’an, nāqah denotes the she-camel in Ṣāliḥ’s story." data-context="The same she-camel; the object of hamstringing in defiance of the command.">النّاقَةَ</button>
    <button class="word-link" type="button" data-word="وَعَتَوا" data-root="AYN T W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-t-w/" data-root-meaning="Defiance or exceeding bounds; also extreme decrepitude in old age." data-context="Defied; acting rebelliously against the command.">وَعَتَوا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="أَمرِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="The command; what the people defied.">أَمرِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord; whose command was violated.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said; introducing the people’s defiant demand.">وَقالوا</button>
    <button class="word-link" type="button" data-word="يٰصٰلِحُ" data-root-note="Proper name; no root has been assigned.">يٰصٰلِحُ</button>
    <button class="word-link" type="button" data-word="ائتِنا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Bring us; their demand that Ṣāliḥ produce what was promised.">ائتِنا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعِدُنا" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="You promise us; concerning the announced consequence.">تَعِدُنا</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Are; in “if you are among the messengers.”">كُنتَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُرسَلينَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="The messengers; the status whose truth the people challenge.">المُرسَلينَ</button>
  </p>
  <p class="english-verse">They hamstrung the she-camel, defied their Lord’s command, and said, “Salih, bring us what you promise us, if you are among the messengers.”</p>
</section>
