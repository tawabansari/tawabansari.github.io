<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:31</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰبَنى" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">يٰبَنى</button>
    <button class="word-link" type="button" data-word="ءادَمَ" data-root-note="Proper name; no root has been assigned.">ءادَمَ</button>
    <button class="word-link" type="button" data-word="خُذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">خُذوا</button>

    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="مَسجِدٍ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank">مَسجِدٍ</button>

    <button class="word-link" type="button" data-word="وَاشرَبوا" data-root="SH R B" data-learn-more="/quran-terminology/en/roots/sh-r-b/" data-root-meaning="Drinking, drink, a share of water, and a place or path of access to drinking.">وَاشرَبوا</button>

  <p class="english-verse">Children of Adam, take your adornment at every place of prostration. Eat and drink, but do not be excessive; He does not love the excessive.</p>
