<section class="ayah-block" id="ayah-128" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:128</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="لِقَومِهِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">لِقَومِهِ</button>
    <button class="word-link" type="button" data-word="استَعينوا" data-root="AYN W N (ʿ W N)" data-learn-more="/quran-terminology/en/roots/ayn-w-n/" data-root-meaning="Help, adding strength, seeking support, and reaching the middle stage">استَعينوا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَاصبِروا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">وَاصبِروا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضَ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="يورِثُها" data-root="W R TH" data-root-note="Root study coming soon.">يورِثُها</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">عِبادِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَالعٰقِبَةُ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">وَالعٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="لِلمُتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">لِلمُتَّقينَ</button>
  </p>
  <p class="english-verse">Moses said to his people, “Seek help from The God and be patient. The earth belongs to The God; He gives it as an inheritance to whomever He wills among His servants. The final outcome belongs to the mindful.”</p>
</section>
