  <p class="english-verse">The companions of the Garden will call to the companions of the Fire, “We have found what our Lord promised us to be true. Have you found what your Lord promised to be true?” They will say, “Yes.” An announcer among them will proclaim, “The curse of The God is upon the unjust.”</p>
