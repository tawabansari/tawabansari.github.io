  <p class="english-verse">When your Lord took from the Children of Adam, from their backs, their descendants, and made them testify concerning themselves: “Am I not your Lord?” They said, “Yes, we testify.” Lest you say on the Day of Resurrection, “We were unaware of this.”</p>
