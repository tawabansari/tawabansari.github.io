<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَـٔاتِيَنَّهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="I will surely approach them, the speaker’s claim concerning misleading people.">لَـٔاتِيَنَّهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَينِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="In front of them, in bayni aydīhim.">بَينِ</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands, within the expression meaning before them.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="وَمِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِن</button>
    <button class="word-link" type="button" data-word="خَلفِهِم" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Behind them, one direction of approach.">خَلفِهِم</button>
    <button class="word-link" type="button" data-word="وَعَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَن</button>
    <button class="word-link" type="button" data-word="أَيمٰنِهِم" data-root="Y M N" data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right hand and right side; related uses concern oaths and covenants, ability and control, and good fortune. Each form’s meaning follows its construction and context." data-context="Their right sides, one direction of approach in the speaker’s claim.">أَيمٰنِهِم</button>
    <button class="word-link" type="button" data-word="وَعَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَن</button>
    <button class="word-link" type="button" data-word="شَمائِلِهِم" data-root="SH M L" data-learn-more="/quran-terminology/en/roots/sh-m-l/" data-root-meaning="Encompassing, covering and gathering; in another branch, the left hand or side as opposed to the right." data-context="Their left sides, contrasted with their right sides.">شَمائِلِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَجِدُ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="You will not find, with lā, concerning most of them being grateful.">تَجِدُ</button>
    <button class="word-link" type="button" data-word="أَكثَرَهُم" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Most of them, the scope of the speaker’s claim.">أَكثَرَهُم</button>
    <button class="word-link" type="button" data-word="شٰكِرينَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="Grateful, the condition the speaker denies of most of them.">شٰكِرينَ</button>
  </p>
  <p class="english-verse">Then I will come upon them from before them and from behind them, from their right and from their left. You will not find most of them grateful.</p>
</section>
