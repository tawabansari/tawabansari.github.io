<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالوَزنُ" data-root="W Z N" data-learn-more="/quran-terminology/en/roots/w-z-n/" data-root-meaning="Weighing, measuring with a scale, establishing balance, and recognizing quantity or value through a criterion" data-context="And the weighing: assessment on the reckoning day.">وَالوَزنُ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day: the day of assessment.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="True and rightful: describing that day’s weighing.">الحَقُّ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="ثَقُلَت" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="Became heavy: describing the scales in the assessment." data-learn-more="/quran-terminology/en/roots/th-q-l/">ثَقُلَت</button>
    <button class="word-link" type="button" data-word="مَوٰزينُهُ" data-root="W Z N" data-learn-more="/quran-terminology/en/roots/w-z-n/" data-root-meaning="Weighing, measuring with a scale, establishing balance, and recognizing quantity or value through a criterion" data-context="His scales: the instruments or criteria of assessment.">مَوٰزينُهُ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="المُفلِحونَ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success" data-context="The successful: those who attain a favorable outcome in the weighing.">المُفلِحونَ</button>
  </p>
  <p class="english-verse">The weighing that day is the truth. Those whose scales are heavy are the successful.</p>
</section>
