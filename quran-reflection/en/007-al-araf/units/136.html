<section class="ayah-block" id="ayah-136" data-translation-status="provisional">
  <h2 class="ayah-title">Al-A’raf 7:136</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَانتَقَمنا" data-root="N Q M" data-learn-more="/quran-terminology/en/roots/n-q-m/" data-root-meaning="Displeasure, disapproval, and faultfinding; in intiqām, a punitive response to conduct considered objectionable." data-context="So We punished them; the divine response realized through drowning in the continuation.">فَانتَقَمنا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="فَأَغرَقنٰهُم" data-root="GH R Q" data-learn-more="/quran-terminology/en/roots/gh-r-q/" data-root-meaning="Sinking into water, being overwhelmed so that escape is closed, and causing drowning through the complete surrounding of water" data-context="So We drowned them, the manner of punishment in this event.">فَأَغرَقنٰهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="Y M M" data-learn-more="/quran-terminology/en/roots/y-m-m/" data-root-meaning="Two semantic branches: intending, targeting, or turning toward; and yamm, a great body of water such as a sea or great river. Purification passages pair tayammum with a separate wiping instruction." data-context="The sea, where the group was drowned.">اليَمِّ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Denied, concerning their response to the signs.">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs, the object of the group’s denial.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Were, describing their heedlessness of the signs.">وَكانوا</button>
    <button class="word-link" type="button" data-word="عَنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنها</button>
    <button class="word-link" type="button" data-word="غٰفِلينَ" data-root="GH F L" data-learn-more="/quran-terminology/en/roots/gh-f-l/" data-root-meaning="Something remaining outside, or being left outside, the field of attention, watchfulness, and follow-up" data-context="Heedless, concerning the signs mentioned.">غٰفِلينَ</button>
  </p>
  <p class="english-verse">We took retribution from them and drowned them in the sea because they denied Our signs and were heedless of them.</p>
</section>
