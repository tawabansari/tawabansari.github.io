  <h2 class="ayah-title">Ta-Ha 20:51</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said, introducing Pharaoh’s question in response to Moses.">قالَ</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="بالُ" data-root="B W L" data-root-meaning="Bāl denotes the condition, affairs, or matter concerning a person or group; its broader Arabic range also connects with thought and attention. Mā bālu asks about someone’s situation or affair; aṣlaḥa bālahu describes setting their condition and affairs right." data-context="Condition and history, in Pharaoh’s question concerning former generations." data-learn-more="/quran-terminology/en/roots/b-w-l/">بالُ</button>
    <button class="word-link" type="button" data-word="القُرونِ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="Generations or contemporary communities, the earlier human groups.">القُرونِ</button>

  </p>
  <p class="english-verse">He said, “What, then, of the former generations?”</p>
