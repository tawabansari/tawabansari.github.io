<section class="ayah-block" id="ayah-071" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:71</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said; here introducing Pharaoh’s speech.">قالَ</button>
    <button class="word-link" type="button" data-word="ءامَنتُم" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="You believed; in Pharaoh’s objection to the magicians.">ءامَنتُم</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before; concerning the giving of permission.">قَبلَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="ءاذَنَ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="I give permission; the speaker’s verb in Pharaoh’s speech.">ءاذَنَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لَكَبيرُكُمُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Surely your chief; Pharaoh’s allegation concerning Moses.">لَكَبيرُكُمُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="عَلَّمَكُمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Taught you; within Pharaoh’s allegation.">عَلَّمَكُمُ</button>
    <button class="word-link" type="button" data-word="السِّحرَ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn" data-context="Magic; within Pharaoh’s allegation.">السِّحرَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلَأُقَطِّعَنَّ" data-root="Q Ṭ AYN" data-learn-more="/quran-terminology/en/roots/q-tt-ayn/" data-root-meaning="Cutting, separating, severing, interrupting, and ending a path of connection" data-context="Then I will certainly cut off; Pharaoh’s emphatic threat.">فَلَأُقَطِّعَنَّ</button>
    <button class="word-link" type="button" data-word="أَيدِيَكُم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Your hands.">أَيدِيَكُم</button>
    <button class="word-link" type="button" data-word="وَأَرجُلَكُم" data-root="R J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="A man; also a foot and walking on foot, in different forms." data-context="And your feet.">وَأَرجُلَكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خِلٰفٍ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-context="Opposite sides; in min khilāf concerning hands and feet." data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it In ikhtilāf and khilāf, difference, opposition, or being on an opposite side.">خِلٰفٍ</button>
    <button class="word-link" type="button" data-word="وَلَأُصَلِّبَنَّكُم" data-root="SAD L B" data-root-meaning="Hardness and firmness; ṣulb: the backbone and, in genealogical expressions, descent; ṣalb: crucifying a human being." data-context="And I will certainly crucify you; Pharaoh’s threat, followed by the mention of palm trunks." data-learn-more="/quran-terminology/en/roots/sad-l-b/">وَلَأُصَلِّبَنَّكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="جُذوعِ" data-root="J DH AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-dh-ayn/" data-root-meaning="Jidhʿ and judhūʿ: a tree trunk or trunks, especially of palms." data-context="The trunks of; introducing palm trunks.">جُذوعِ</button>
    <button class="word-link" type="button" data-word="النَّخلِ" data-root="N KH L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-kh-l/" data-root-meaning="A date palm or date palms." data-context="The date palms.">النَّخلِ</button>
    <button class="word-link" type="button" data-word="وَلَتَعلَمُنَّ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="And you will certainly know; continuing Pharaoh’s threat.">وَلَتَعلَمُنَّ</button>
    <button class="word-link" type="button" data-word="أَيُّنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَيُّنا</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="Harsher or more severe; in Pharaoh’s comparison.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="In punishment; the aspect of Pharaoh’s comparison.">عَذابًا</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="And more enduring; continuing Pharaoh’s comparison." data-learn-more="/quran-terminology/en/roots/b-q-y/">وَأَبقىٰ</button>
  </p>
  <p class="english-verse">He said, “You believed him before I gave you permission? He must be your chief who taught you magic. I will cut off your hands and feet on opposite sides and crucify you on palm trunks. You will know which of us is more severe and lasting in punishment.”</p>
</section>
