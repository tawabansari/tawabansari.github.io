<section class="ayah-block" id="ayah-102" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:102</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day when the Trumpet is blown.">يَومَ</button>
    <button class="word-link" type="button" data-word="يُنفَخُ" data-root="N F KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-kh/" data-root-meaning="Blowing or setting air in motion." data-context="Is blown, referring to the Trumpet.">يُنفَخُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="SAD W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Forming or giving shape; ṣūr is a trumpet; ṣur in al-Baqarah has explanations involving drawing near or gathering." data-context="The Trumpet into which the blast is blown.">الصّورِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَنَحشُرُ" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="We gather the offenders on the day the Trumpet is blown." data-learn-more="/quran-terminology/en/roots/h-sh-r/">وَنَحشُرُ</button>
    <button class="word-link" type="button" data-word="المُجرِمينَ" data-root="J R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-r-m/" data-root-meaning="Cutting and acquiring; ijrām: committing an offense; lā jarama is an expression of certainty." data-context="The offenders who are gathered.">المُجرِمينَ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day, the time of gathering the offenders.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="زُرقًا" data-root="Z R Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-r-q/" data-root-meaning="Blueness; zurq in the resurrection passage has differing precise interpretations." data-context="Described as zurq, a color or condition requiring separate study.">زُرقًا</button>
  </p>
  <p class="english-verse">On the day the trumpet is blown, We will gather the guilty that day, blue-eyed.</p>
