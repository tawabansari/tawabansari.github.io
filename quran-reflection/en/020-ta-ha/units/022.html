<section class="ayah-block" id="ayah-022" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاضمُم" data-root="DAD M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-m-m/" data-root-meaning="Joining or drawing together." data-context="And bring close and draw in.">وَاضمُم</button>
    <button class="word-link" type="button" data-word="يَدَكَ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Your hand.">يَدَكَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جَناحِكَ" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/" data-context="Your side, where the hand is drawn close.">جَناحِكَ</button>
    <button class="word-link" type="button" data-word="تَخرُج" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Comes out.">تَخرُج</button>
    <button class="word-link" type="button" data-word="بَيضاءَ" data-root="B Y DAD" data-root-meaning="B Y Ḍ fundamentally denotes whiteness as a colour characteristic, from which descriptions of being white and verbs of becoming white derive. Bayḍah names a bird’s egg, assigned to this family in early Arabic and extended to similes and resembling objects." data-context="White, the condition in which Moses’ hand emerges, without harm." data-learn-more="/quran-terminology/en/roots/b-y-dad/">بَيضاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="غَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without, excluding harm.">غَيرِ</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Harm or affliction, here excluded.">سوءٍ</button>
    <button class="word-link" type="button" data-word="ءايَةً" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="A sign.">ءايَةً</button>
    <button class="word-link" type="button" data-word="أُخرىٰ" data-root="A KH R" data-root-meaning="After-ness, delay, otherness, and finality" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-context="Another, an additional sign.">أُخرىٰ</button>
  </p>
  <p class="english-verse">Draw your hand to your side; it will come out white, without harm, as another sign,</p>
</section>
