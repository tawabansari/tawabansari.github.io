<section class="ayah-block" id="ayah-094" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:94</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said; Aaron’s reply to Moses.">قالَ</button>
    <button class="word-link" type="button" data-word="يَبنَؤُمَّ" data-context="Vocative expression: son of my mother; ibn is from B N Y and umm from A M M." data-root="B N Y / A M M" data-root-meaning="Ibn: Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole; umm: From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-note="This compound contains two nouns: ibn from B N Y and umm from A M M.">يَبنَؤُمَّ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَأخُذ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="In lā taʾkhudh: do not seize; the prohibition concerns taking hold of the beard.">تَأخُذ</button>
    <button class="word-link" type="button" data-word="بِلِحيَتى" data-root="L H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h-y/" data-root-meaning="The beard or hair of the chin and jaw." data-context="My beard; what Aaron asks Moses not to seize.">بِلِحيَتى</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="بِرَأسى" data-root="R A S" data-root-meaning="The head; by extension, the upper, initial, or principal part of something. Raʾs al-māl: principal property." data-context="My head; the other body part mentioned in the prohibition." data-learn-more="/quran-terminology/en/roots/r-a-s/">بِرَأسى</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="خَشيتُ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God" data-context="I feared; Aaron’s concern about possible blame from Moses.">خَشيتُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَقولَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="You would say; Moses’ possible statement that Aaron feared.">تَقولَ</button>
    <button class="word-link" type="button" data-word="فَرَّقتَ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="You divided; the possible accusation concerning the Children of Israel.">فَرَّقتَ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between; the relationship of those being divided.">بَينَ</button>
    <button class="word-link" type="button" data-word="بَنى" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-context="Children; in the designation Children of Israel." data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole In kinship uses, a son, children, or descendants.">بَنى</button>
    <button class="word-link" type="button" data-word="إِسرٰءيلَ" data-root-note="Proper name; no root has been assigned.">إِسرٰءيلَ</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَم</button>
    <button class="word-link" type="button" data-word="تَرقُب" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="In lam tarqub qawlī: you did not observe my instruction; Aaron anticipates possible blame for disregarding Moses’ earlier words." data-learn-more="/quran-terminology/en/roots/r-q-b/">تَرقُب</button>
    <button class="word-link" type="button" data-word="قَولى" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="My statement or instruction; Moses’ words in the anticipated reproach.">قَولى</button>
  </p>
  <p class="english-verse">He said, “Son of my mother, do not seize my beard or my head. I feared you would say, ‘You divided the children of Israel and did not heed my word.’”</p>
</section>
