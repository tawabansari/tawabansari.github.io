<section class="ayah-block" id="ayah-113" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:113</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَنزَلنٰهُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="We sent it down: presenting an Arabic Qur’an.">أَنزَلنٰهُ</button>
    <button class="word-link" type="button" data-word="قُرءانًا" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="An Arabic Qur’an: the text containing varied warnings." data-learn-more="/quran-terminology/en/roots/q-r-a/">قُرءانًا</button>
    <button class="word-link" type="button" data-word="عَرَبِيًّا" data-root="AYN R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-b/" data-root-meaning="ʿArabī relates to Arabic or Arabs; aʿrāb are desert dwellers; ʿurub means affectionate or devoted." data-context="Arabic: the language of the revealed Qur’an.">عَرَبِيًّا</button>
    <button class="word-link" type="button" data-word="وَصَرَّفنا" data-root="SAD R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-f/" data-root-meaning="Turning or changing; taṣrīf denotes varying, directing, or presenting in different ways." data-context="And We varied: presenting warnings in different ways.">وَصَرَّفنا</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الوَعيدِ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="Warning: notice of adverse consequences.">الوَعيدِ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَّقونَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Become mindful: the aim of conscious restraint.">يَتَّقونَ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يُحدِثُ" data-root="H D TH" data-learn-more="/quran-terminology/en/roots/h-d-th/" data-root-meaning="From Coming into Being to Speech That Is Recounted" data-context="Produces: bringing about a reminder for them.">يُحدِثُ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="ذِكرًا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="A reminder: the anticipated effect of the warnings.">ذِكرًا</button>
  </p>
  <p class="english-verse">In this way We sent it down as an Arabic Qur’an and varied the warnings in it, so that they may be mindful or it may bring them remembrance.</p>
</section>
