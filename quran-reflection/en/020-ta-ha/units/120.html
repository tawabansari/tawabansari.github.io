<section class="ayah-block" id="ayah-120" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:120</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَسوَسَ" data-root="W S W S" data-root-meaning="in acoustic usage, waswasah is quiet, hidden sound; in relation to a person, it is speech or thought that passes within them or is suggested in a concealed way. Such prompting may come from the person’s own self or another agent. Whether it is wrong, deceptive, or satanic is determined by the agent, content, and context, rather than by the root alone." data-learn-more="/quran-terminology/en/roots/w-s-w-s/">فَوَسوَسَ</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنُ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">الشَّيطٰنُ</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="يٰـٔادَمُ" data-root-note="Proper name; no root has been assigned.">يٰـٔادَمُ</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="أَدُلُّكَ" data-root="D L L" data-learn-more="/quran-terminology/en/roots/d-l-l/" data-root-meaning="From showing the way to a sign through which something is known">أَدُلُّكَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="شَجَرَةِ" data-root="SH J R" data-learn-more="/quran-terminology/en/roots/sh-j-r/" data-root-meaning="Branching, ramification, interweaving, and complex extension from a single origin">شَجَرَةِ</button>
    <button class="word-link" type="button" data-word="الخُلدِ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place">الخُلدِ</button>

    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَبلىٰ" data-root="B L Y" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away">يَبلىٰ</button>
  </p>
  <p class="english-verse">Satan whispered to him, saying, “Adam, shall I guide you to the tree of eternity and a kingdom that never decays?”</p>
