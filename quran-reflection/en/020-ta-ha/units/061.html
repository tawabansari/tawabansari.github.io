<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Moses said to them.">قالَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="وَيلَكُم" data-root="W Y L" data-learn-more="/quran-terminology/en/roots/w-y-l/" data-root-meaning="From Cries of Grief and Warning to the Announcement of a Dire Outcome" data-context="Woe to you; Moses’s warning and rebuke addressed to them.">وَيلَكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَفتَروا" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations." data-context="Do not fabricate and attribute false speech to The God.">تَفتَروا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كَذِبًا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="A lie whose attribution to The God is forbidden.">كَذِبًا</button>
    <button class="word-link" type="button" data-word="فَيُسحِتَكُم" data-root="S H T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-h-t/" data-root-meaning="Eradicating; suḥt denotes wrongful, corrupting gain." data-context="Lest He destroy and eradicate you.">فَيُسحِتَكُم</button>
    <button class="word-link" type="button" data-word="بِعَذابٍ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="With a punishment; the means of destruction in this warning.">بِعَذابٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="خابَ" data-root="KH Y B" data-root-meaning="Failing and remaining deprived of the expected result or benefit; not attaining something one pursued or hoped for." data-context="Failed; whoever fabricates against The God." data-learn-more="/quran-terminology/en/roots/kh-y-b/">خابَ</button>
    <button class="word-link" type="button" data-word="مَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَنِ</button>
    <button class="word-link" type="button" data-word="افتَرىٰ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations." data-context="Fabricated; invented and attributed false speech.">افتَرىٰ</button>
  </p>
  <p class="english-verse">Moses said to them, “Woe to you! Do not invent a lie against The God, lest He destroy you with punishment. Whoever invents a lie has failed.”</p>
</section>
