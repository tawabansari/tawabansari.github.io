<section class="ayah-block" id="ayah-073" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:73</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="We believed, the magicians’ declaration of belief in their Lord.">ءامَنّا</button>
    <button class="word-link" type="button" data-word="بِرَبِّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="In our Lord, the object of belief and source of forgiveness.">بِرَبِّنا</button>
    <button class="word-link" type="button" data-word="لِيَغفِرَ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="So that He may forgive, seeking the Lord’s forgiveness.">لِيَغفِرَ</button>
    <button class="word-link" type="button" data-word="لَنا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَنا</button>
    <button class="word-link" type="button" data-word="خَطٰيٰنا" data-root="KH Ṭ A" data-learn-more="/quran-terminology/en/roots/kh-tt-a/" data-root-meaning="Slipping from the right path, missing the mark, going wrong; and in some forms, conscious deviation from truth." data-context="Our faults, the deeds for which they seek forgiveness.">خَطٰيٰنا</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أَكرَهتَنا" data-root="K R H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-h2/" data-root-meaning="Dislike or hardship; ikrāh means compulsion against one&#x27;s will." data-context="You compelled us, concerning Pharaoh’s coercion in sorcery.">أَكرَهتَنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السِّحرِ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn" data-context="Sorcery, the practice they say they were compelled to perform.">السِّحرِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better, asserting The God’s superiority over Pharaoh’s limited power.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="More lasting, the believers’ answer contrasting their Lord’s continuance with Pharaoh’s limited power." data-learn-more="/quran-terminology/en/roots/b-q-y/">وَأَبقىٰ</button>
  </p>
  <p class="english-verse">We have believed in our Lord so that He may forgive our sins and the magic you forced us to perform. The God is better and more lasting.”</p>
</section>
