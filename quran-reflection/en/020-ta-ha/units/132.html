<section class="ayah-block" id="ayah-132" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:132</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأمُر" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">وَأمُر</button>
    <button class="word-link" type="button" data-word="أَهلَكَ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness">أَهلَكَ</button>
    <button class="word-link" type="button" data-word="بِالصَّلوٰةِ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">بِالصَّلوٰةِ</button>
    <button class="word-link" type="button" data-word="وَاصطَبِر" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">وَاصطَبِر</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="نَسـَٔلُكَ" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability.">نَسـَٔلُكَ</button>
    <button class="word-link" type="button" data-word="رِزقًا" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">رِزقًا</button>
    ۖ
    <button class="word-link" type="button" data-word="نَحنُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">نَحنُ</button>
    <button class="word-link" type="button" data-word="نَرزُقُكَ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">نَرزُقُكَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالعٰقِبَةُ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">وَالعٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="لِلتَّقوىٰ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">لِلتَّقوىٰ</button>
  </p>
  <p class="english-verse">Command your family to prayer and persevere in it. We do not ask you for provision; We provide for you. The final outcome belongs to mindfulness.</p>
</section>
