<section class="ayah-block" id="ayah-097" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:97</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Said; Moses addressing the Samaritan.">قالَ</button>
    <button class="word-link" type="button" data-word="فَاذهَب" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach" data-context="Then go; the command addressed to the Samaritan.">فَاذهَب</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life; the addressee’s earthly lifetime.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَقولَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="To say; introducing the words “no contact.”">تَقولَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="مِساسَ" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="Contact or touching; negated in “no contact.”">مِساسَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    <button class="word-link" type="button" data-word="مَوعِدًا" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="An appointed time; the appointment assigned to the addressee.">مَوعِدًا</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="تُخلَفَهُ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="It will not be broken for you; the appointed promise will certainly be fulfilled.">تُخلَفَهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَانظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="And look; directing attention to the object of the addressee’s worship.">وَانظُر</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="إِلٰهِكَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Your deity; here, the calf to which the Samaritan had devoted himself.">إِلٰهِكَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="ظَلتَ" data-root="Ẓ L L (Zha L L)" data-learn-more="/quran-terminology/en/roots/zha-l-l/" data-root-meaning="Shade, a covering that blocks direct exposure, casting shade, and in the verb ظَلَّ, continuing or remaining in a state." data-context="You remained; continuing in devotion to that deity.">ظَلتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="عاكِفًا" data-root="ʿ K F" data-learn-more="/quran-terminology/en/roots/ayn-k-f/" data-root-meaning="Remaining in attendance, residing, and being held back" data-context="Remaining devoted; describing the addressee’s persistent worship of the calf.">عاكِفًا</button>
    ۖ
    <button class="word-link" type="button" data-word="لَنُحَرِّقَنَّهُ" data-root="H R Q" data-root-meaning="Burning and setting alight; fire and intense heat; and, in an early use, abrading and wearing away." data-context="We will certainly burn the calf, according to the familiar Form II reading." data-learn-more="/quran-terminology/en/roots/h-r-q/">لَنُحَرِّقَنَّهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَنَنسِفَنَّهُ" data-root="N S F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-s-f/" data-root-meaning="Uprooting, scattering, or dispersing." data-context="We will certainly scatter it; dispersing the calf’s remains in the water.">لَنَنسِفَنَّهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="اليَمِّ" data-root="Y M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-m/" data-root-meaning="Intending or directing oneself; tayammum means aiming for; yamm is a sea or great body of water in another branch." data-context="The body of water in which the calf’s remains will be scattered.">اليَمِّ</button>
    <button class="word-link" type="button" data-word="نَسفًا" data-root="N S F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-s-f/" data-root-meaning="Uprooting, scattering, or dispersing." data-context="A thorough scattering; the verbal noun emphasizing dispersal of the remains.">نَسفًا</button>
  </p>
  <p class="english-verse">He said, “Go! In this life you will say, ‘No touching.’ You have an appointment that will not be broken. Look at your god to which you remained devoted: we will burn it, then scatter it into the sea.</p>
</section>
