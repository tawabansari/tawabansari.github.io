<section class="ayah-block" id="ayah-127" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:127</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="نَجزى" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="We recompense, describing the consequence of the stated conduct.">نَجزى</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَسرَفَ" data-root="S R F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-r-f/" data-root-meaning="Exceeding a measure or limit; excess." data-context="Transgressed, of someone exceeding proper bounds.">أَسرَفَ</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَم</button>
    <button class="word-link" type="button" data-word="يُؤمِن" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believes, negated here concerning acceptance of the Lord’s signs.">يُؤمِن</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="In the signs, the object of the belief being refused.">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord, whose signs were not accepted.">رَبِّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَعَذابُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="And punishment, the Hereafter’s chastisement compared with the worldly consequence.">وَلَعَذابُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The Hereafter, whose punishment is called more severe and lasting.">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="More severe, describing the greater intensity of the Hereafter’s punishment.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="More lasting, comparatively describing the Hereafter’s punishment." data-learn-more="/quran-terminology/en/roots/b-q-y/">وَأَبقىٰ</button>
  </p>
  <p class="english-verse">In this way We recompense whoever exceeds bounds and does not believe in his Lord’s signs. The punishment of the Hereafter is more severe and more lasting.</p>
</section>
