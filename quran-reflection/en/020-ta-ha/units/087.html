<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:87</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said; the people’s answer to Moses.">قالوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَخلَفنا" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="We broke; within their denial of breaking the promise by their own choice.">أَخلَفنا</button>
    <button class="word-link" type="button" data-word="مَوعِدَكَ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="Your promise; the commitment Moses had required of the people.">مَوعِدَكَ</button>
    <button class="word-link" type="button" data-word="بِمَلكِنا" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="By our own choice; concerning control and choice in breaking the promise.">بِمَلكِنا</button>
    <button class="word-link" type="button" data-word="وَلٰكِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنّا</button>
    <button class="word-link" type="button" data-word="حُمِّلنا" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="We were made to carry; in the people’s account of the ornaments they bore." data-learn-more="/quran-terminology/en/roots/h-m-l/">حُمِّلنا</button>
    <button class="word-link" type="button" data-word="أَوزارًا" data-root="W Z R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-z-r/" data-root-meaning="A heavy burden or liability for sin; wazar is refuge; wazīr is a helper." data-context="Burdens; here, loads consisting of the people’s ornaments.">أَوزارًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="زينَةِ" data-root="Z Y N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-n/" data-root-meaning="Beauty and adornment; decorating or making something appear attractive." data-context="Ornaments; what the stated loads consisted of.">زينَةِ</button>
    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="The people; those associated with the ornaments mentioned.">القَومِ</button>
    <button class="word-link" type="button" data-word="فَقَذَفنٰها" data-root="Q DH F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-dh-f/" data-root-meaning="Casting or throwing forcefully." data-context="Then we cast them; the people’s account concerning the ornaments.">فَقَذَفنٰها</button>
    <button class="word-link" type="button" data-word="فَكَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَكَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَلقَى" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="Cast; the action subsequently attributed to the Samaritan.">أَلقَى</button>
    <button class="word-link" type="button" data-word="السّامِرِىُّ" data-root-note="Proper name; no root has been assigned.">السّامِرِىُّ</button>
  </p>
  <p class="english-verse">They said, “We did not break our promise to you by our own choice. We were made to carry burdens of the people’s ornaments, and we threw them down. The Samiri threw likewise.”</p>
</section>
