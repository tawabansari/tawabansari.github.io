<section class="ayah-block" id="ayah-122" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:122</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="اجتَبٰهُ" data-root="J B Y" data-root-meaning="gathering and bringing something together; in ijtibāʾ, choosing and setting someone or something apart." data-context="He chose him; Adam’s selection after the preceding event, followed by acceptance of repentance and guidance." data-learn-more="/quran-terminology/en/roots/j-b-y/">اجتَبٰهُ</button>
    <button class="word-link" type="button" data-word="رَبُّهُ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord; the one who chose Adam and turned toward him.">رَبُّهُ</button>
    <button class="word-link" type="button" data-word="فَتابَ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy" data-context="Then accepted his repentance; divine acceptance and merciful turning toward Adam.">فَتابَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="وَهَدىٰ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="And guided; directed Adam.">وَهَدىٰ</button>
  </p>
  <p class="english-verse">Then his Lord chose him, turned toward him, and guided him.</p>
