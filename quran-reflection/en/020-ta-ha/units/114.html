<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:114</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَعٰلَى" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting." data-context="Exalted: declaring The God’s transcendence.">فَتَعٰلَى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="المَلِكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="The sovereign: describing The God.">المَلِكُ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="The true: describing the sovereign.">الحَقُّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعجَل" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf" data-context="Do not hasten: prohibiting haste concerning the Qur’an.">تَعجَل</button>
    <button class="word-link" type="button" data-word="بِالقُرءانِ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the revelation concerning which haste is prohibited." data-learn-more="/quran-terminology/en/roots/q-r-a/">بِالقُرءانِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before: the temporal relation to revelation’s completion.">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُقضىٰ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination" data-context="Is completed: the completion of its revelation.">يُقضىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="وَحيُهُ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="Its revelation: the Qur’an’s communication to the addressee.">وَحيُهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And say: the command to ask for knowledge.">وَقُل</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord: the address in the prayer.">رَبِّ</button>
    <button class="word-link" type="button" data-word="زِدنى" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="Increase me: requesting an increase.">زِدنى</button>
    <button class="word-link" type="button" data-word="عِلمًا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge: what is requested to increase.">عِلمًا</button>
  </p>
  <p class="english-verse">Exalted is The God, the True Sovereign. Do not hasten with the Qur’an before its revelation to you is completed, and say, “My Lord, increase me in knowledge.”</p>
</section>
