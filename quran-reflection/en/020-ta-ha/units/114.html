<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:114</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَعٰلَى" data-root="AYN L W" data-root-note="Root study coming soon.">فَتَعٰلَى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="المَلِكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God">المَلِكُ</button>
    <button class="word-link" type="button" data-word="الحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">الحَقُّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَعجَل" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">تَعجَل</button>
    <button class="word-link" type="button" data-word="بِالقُرءانِ" data-root="Q R A" data-root-note="Root study coming soon.">بِالقُرءانِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُقضىٰ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination">يُقضىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="وَحيُهُ" data-root="W H Y" data-root-note="Root study coming soon.">وَحيُهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقُل</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّ</button>
    <button class="word-link" type="button" data-word="زِدنى" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure">زِدنى</button>
    <button class="word-link" type="button" data-word="عِلمًا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عِلمًا</button>
  </p>
  <p class="english-verse">Exalted is The God, the True Sovereign. Do not hasten with the Qur’an before its revelation to you is completed, and say, “My Lord, increase me in knowledge.”</p>
</section>
