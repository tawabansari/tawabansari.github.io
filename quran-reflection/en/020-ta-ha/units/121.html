<section class="ayah-block" id="ayah-121" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:121</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَكَلا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="So the two ate: Adam and his spouse ate from the tree in question.">فَأَكَلا</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنها</button>
    <button class="word-link" type="button" data-word="فَبَدَت" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="Then became visible: what had been concealed of their bodies was exposed.">فَبَدَت</button>
    <button class="word-link" type="button" data-word="لَهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُما</button>
    <button class="word-link" type="button" data-word="سَوءٰتُهُما" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Their private parts or nakedness, which became visible to them.">سَوءٰتُهُما</button>
    <button class="word-link" type="button" data-word="وَطَفِقا" data-root="TT F Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-f-q/" data-root-meaning="Beginning or setting about an action." data-context="And the two began: the start of joining leaves and covering themselves.">وَطَفِقا</button>
    <button class="word-link" type="button" data-word="يَخصِفانِ" data-root="KH SAD F" data-root-meaning="Joining and attaching things to one another, especially overlaying, patching, or weaving pieces." data-context="They joined garden leaves together and placed them over themselves to cover their bodies." data-learn-more="/quran-terminology/en/roots/kh-sad-f/">يَخصِفانِ</button>
    <button class="word-link" type="button" data-word="عَلَيهِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِما</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="وَرَقِ" data-root="W R Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-r-q/" data-root-meaning="A tree leaf; wariq denotes silver or silver money." data-context="Leaves of the garden, the material they joined to cover themselves.">وَرَقِ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="The garden from which the leaves were taken.">الجَنَّةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَعَصىٰ" data-root="ʿ Ṣ Y" data-learn-more="/quran-terminology/en/roots/ayn-sad-y/" data-root-meaning="Disobeying a command, refusing an instruction, and acting against the path of obedience." data-context="And disobeyed: Adam departed from his Lord’s command.">وَعَصىٰ</button>
    <button class="word-link" type="button" data-word="ءادَمُ" data-root-note="Proper name; no root has been assigned.">ءادَمُ</button>
    <button class="word-link" type="button" data-word="رَبَّهُ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord, whose command he disobeyed.">رَبَّهُ</button>
    <button class="word-link" type="button" data-word="فَغَوىٰ" data-root="GH W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-w-y/" data-root-meaning="Error or leading away from sound guidance." data-context="Then went astray or lost the right course: the consequence of disobedience in this account.">فَغَوىٰ</button>
  </p>
  <p class="english-verse">They both ate from it, and their nakedness became apparent to them. They began covering themselves with leaves from the Garden. Adam disobeyed his Lord and went astray.</p>
</section>
