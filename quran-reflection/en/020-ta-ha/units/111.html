<section class="ayah-block" id="ayah-111" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:111</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَنَتِ" data-root="AYN N W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-n-w/" data-root-meaning="Submitting or becoming humbled; also hardship or captivity.">وَعَنَتِ</button>
    <button class="word-link" type="button" data-word="الوُجوهُ" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh">الوُجوهُ</button>
    <button class="word-link" type="button" data-word="لِلحَىِّ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">لِلحَىِّ</button>
    <button class="word-link" type="button" data-word="القَيّومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القَيّومِ</button>

    <button class="word-link" type="button" data-word="خابَ" data-root="KH Y B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-y-b/" data-root-meaning="Failing or being deprived of the desired outcome.">خابَ</button>

    <button class="word-link" type="button" data-word="حَمَلَ" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy.">حَمَلَ</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظُلمًا</button>
  </p>
  <p class="english-verse">Faces will be humbled before the Living, the Self-Sustaining. Whoever bears wrongdoing has failed.</p>
