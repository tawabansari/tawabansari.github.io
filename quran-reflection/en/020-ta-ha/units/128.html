  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلَم</button>

  <p class="english-verse">Has it not become clear to them how many generations We destroyed before them, whose dwellings they walk through? In this are signs for those of understanding.</p>
