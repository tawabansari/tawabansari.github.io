<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:88</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَخرَجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="He brought forth; producing the calf-shaped body for the people.">فَأَخرَجَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="عِجلًا" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf" data-context="A calf; the shape of the body brought forth for them.">عِجلًا</button>
    <button class="word-link" type="button" data-word="جَسَدًا" data-root="J S D" data-root-meaning="A body or bodily form; the word alone does not determine life, death, or awareness." data-context="A bodily form; describing the calf brought forth by Al-Sāmirī, with a lowing sound." data-learn-more="/quran-terminology/en/roots/j-s-d/">جَسَدًا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="خُوارٌ" data-root="KH W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-w-r/" data-root-meaning="The lowing of cattle; in another branch, weakness." data-context="Lowing; the bovine sound heard from the calf-shaped body.">خُوارٌ</button>
    <button class="word-link" type="button" data-word="فَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said; introducing their claim that the calf was a deity.">فَقالوا</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="إِلٰهُكُم" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Your deity; the status the speakers attribute to the calf.">إِلٰهُكُم</button>
    <button class="word-link" type="button" data-word="وَإِلٰهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="And the deity; continuing the speakers’ claim concerning Moses’s deity.">وَإِلٰهُ</button>
    <button class="word-link" type="button" data-word="موسىٰ" data-root-note="Proper name; no root has been assigned.">موسىٰ</button>
    <button class="word-link" type="button" data-word="فَنَسِىَ" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence." data-context="Then he forgot; the closing verb, whose subject and object of forgetting require contextual interpretation.">فَنَسِىَ</button>
  </p>
  <p class="english-verse">He brought out for them a calf, a body with a lowing sound. They said, “This is your god and the god of Moses, but he forgot.”</p>
</section>
