<section class="ayah-block" id="ayah-131" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:131</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَمُدَّنَّ" data-root="M D D" data-learn-more="/quran-terminology/en/roots/m-d-d/" data-root-meaning="Stretching, extending, continuing, granting respite, adding support, and opening a wider field" data-context="Do not extend, forbidding longing looks toward others’ enjoyments.">تَمُدَّنَّ</button>
    <button class="word-link" type="button" data-word="عَينَيكَ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="Your eyes, in the expression for looking longingly at worldly enjoyments.">عَينَيكَ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="مَتَّعنا" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement." data-context="We granted enjoyment, the benefits given to certain groups.">مَتَّعنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Groups, the categories of people granted enjoyment.">أَزوٰجًا</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="زَهرَةَ" data-root="Z H2 R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-h2-r/" data-root-meaning="Brightness and blooming; zahrah denotes blossom or splendor." data-context="The bloom or splendor of worldly life.">زَهرَةَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life, within the expression worldly life.">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Worldly, describing this present life.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="لِنَفتِنَهُم" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction" data-context="To test them, through the stated enjoyment.">لِنَفتِنَهُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَرِزقُ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="And provision, the Lord’s gift described as better and more lasting.">وَرِزقُ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, the source of that provision.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better, the Lord’s provision surpassing transient worldly splendor.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="More lasting, describing the Lord’s provision against transient worldly splendor." data-learn-more="/quran-terminology/en/roots/b-q-y/">وَأَبقىٰ</button>
  </p>
  <p class="english-verse">Do not stretch your eyes toward what We have given some groups of them to enjoy—the bloom of worldly life—so that We may test them through it. Your Lord’s provision is better and more lasting.</p>
</section>
