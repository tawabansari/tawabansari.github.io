  <h2 class="ayah-title">Ta-Ha 20:106</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَيَذَرُها" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="Then He leaves it; leaving the land or the mountains’ sites in the level condition described.">فَيَذَرُها</button>
    <button class="word-link" type="button" data-word="قاعًا" data-root="Q W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-w-ayn/" data-root-meaning="Level, open ground." data-context="An open, level expanse; the condition remaining after the mountains are removed.">قاعًا</button>
    <button class="word-link" type="button" data-word="صَفصَفًا" data-root="SAD F SAD F" data-root-meaning="Smooth, level, even ground; an expanse without perceptible unevenness. Certain lexical uses also call vegetation-free land ṣafṣaf." data-context="Smooth and level; describing the land or the mountains’ sites after their removal, with an even surface and no unevenness." data-learn-more="/quran-terminology/en/roots/sad-f-sad-f/">صَفصَفًا</button>
  </p>
  <p class="english-verse">and leave it a level plain,</p>
