<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">Ta-Ha 20:69</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَلقِ" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="And cast or throw down.">وَأَلقِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="يَمينِكَ" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Your right hand, holding what you are instructed to cast.">يَمينِكَ</button>
    <button class="word-link" type="button" data-word="تَلقَف" data-root="L Q F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-q-f/" data-root-meaning="Seizing or swallowing swiftly." data-context="It will swallow what they have made.">تَلقَف</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="صَنَعوا" data-root="SAD N AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-n-ayn/" data-root-meaning="Making or performing with skill and care." data-context="What they have made or fashioned.">صَنَعوا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="صَنَعوا" data-root="SAD N AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-n-ayn/" data-root-meaning="Making or performing with skill and care." data-context="What they have fashioned and put into practice.">صَنَعوا</button>
    <button class="word-link" type="button" data-word="كَيدُ" data-root="K Y D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-y-d/" data-root-meaning="Planning or subtle strategy; its evaluation depends on context." data-context="A magician’s scheme or trick.">كَيدُ</button>
    <button class="word-link" type="button" data-word="سٰحِرٍ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn" data-context="A magician, in the expression describing the trick.">سٰحِرٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يُفلِحُ" data-root="F L H" data-learn-more="/quran-terminology/en/roots/f-l-h/" data-root-meaning="Breaking through obstruction, coming to fruit, and true success" data-context="He does not succeed or prosper.">يُفلِحُ</button>
    <button class="word-link" type="button" data-word="السّاحِرُ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn" data-context="The magician under discussion.">السّاحِرُ</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-context="Wherever he comes or goes, extending the statement about the magician spatially." data-learn-more="/quran-terminology/en/roots/h-y-th/" data-root-note="Brief word meaning: A place or position specified by the accompanying clause; with min, an origin or source, and in generalizing use, wherever. Ḥaythu is largely a non-derived adverbial noun.">حَيثُ</button>
    <button class="word-link" type="button" data-word="أَتىٰ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Wherever he comes or goes.">أَتىٰ</button>
  </p>
  <p class="english-verse">Throw what is in your right hand; it will swallow what they have made. What they have made is only a magician’s trick. A magician does not succeed wherever he comes.”</p>
</section>
