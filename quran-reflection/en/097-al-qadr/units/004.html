<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qadr 97:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَنَزَّلُ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">تَنَزَّلُ</button>

    <button class="word-link" type="button" data-word="وَالرّوحُ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit">وَالرّوحُ</button>

    <button class="word-link" type="button" data-word="بِإِذنِ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission">بِإِذنِ</button>

  <p class="english-verse">The angels and the Spirit descend in it, by their Lord’s permission, for every matter.</p>
