<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muzzammil 73:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day when; the time of earth and mountains shaking.">يَومَ</button>
    <button class="word-link" type="button" data-word="تَرجُفُ" data-root="R J F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-f/" data-root-meaning="Trembling and disturbance; irjāf is spreading alarming reports." data-context="Shake; the trembling of earth and mountains.">تَرجُفُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; shaking together with mountains.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="وَالجِبالُ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; shaking together with the earth." data-learn-more="/quran-terminology/en/roots/j-b-l/">وَالجِبالُ</button>
    <button class="word-link" type="button" data-word="وَكانَتِ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And become; expressing mountains’ changed condition.">وَكانَتِ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; becoming a heap of loose sand." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجِبالُ</button>
    <button class="word-link" type="button" data-word="كَثيبًا" data-root="K TH B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-th-b/" data-root-meaning="Heaping; kathīb is a sand dune or heap." data-context="A heap of sand; what the mountains become.">كَثيبًا</button>
    <button class="word-link" type="button" data-word="مَهيلًا" data-root="H2 Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-y-l/" data-root-meaning="Pouring loose material; mahīl describes loose, collapsing sand." data-context="Loose and flowing; describing the unstable sand.">مَهيلًا</button>
  </p>
  <p class="english-verse">on the day the earth and mountains tremble, and the mountains become a heap of shifting sand.</p>
