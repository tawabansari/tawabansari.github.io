  <h2 class="ayah-title">Al-Muzzammil 73:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>

    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Night; the time of rising or the successive hours.">الَّيلِ</button>

  <p class="english-verse">Rising at night is firmer in impact and more upright in speech.</p>
