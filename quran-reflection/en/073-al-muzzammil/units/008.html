<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Muzzammil 73:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاذكُرِ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Remember or mention: an imperative to keep the Lord’s name present in speech and awareness.">وَاذكُرِ</button>
    <button class="word-link" type="button" data-word="اسمَ" data-root="S M W / W S M" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Raising into the level of recognition, and marking for identification" data-context="Of their names; the identifiers and signs that make the reality, features, and function of those beings or phenomena knowable.">اسمَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord: the suffix addresses Muḥammad, and the name is attributed to his Lord.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="وَتَبَتَّل" data-root="B T L" data-learn-more="/quran-terminology/en/roots/b-t-l/" data-root-meaning="Separating and making independent or dedicated; tabattul in worship: turning wholly to the Lord." data-context="And turn wholly to Him: a form V imperative in remembrance and worship, with ilayhi specifying its destination.">وَتَبَتَّل</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="تَبتيلًا" data-root="B T L" data-learn-more="/quran-terminology/en/roots/b-t-l/" data-root-meaning="Separating and making independent or dedicated; tabattul in worship: turning wholly to the Lord." data-context="With complete dedication: a form II verbal noun emphasizing the command to practise tabattul, rather than an independent command.">تَبتيلًا</button>
  </p>
  <p class="english-verse">Remember your Lord’s name and devote yourself wholly to Him.</p>
