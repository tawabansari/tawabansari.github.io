  <h2 class="ayah-title">Al-Muzzammil 73:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="السَّماءُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّماءُ</button>
