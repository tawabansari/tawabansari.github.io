<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="مَقاليدُ" data-root="Q L D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-l-d/" data-root-meaning="A necklace and hanging around the neck; maqālīd denotes keys or control of stores." data-context="The keys; authority over the heavens’ and Earth’s treasuries in this expression.">مَقاليدُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; part of the realm whose keys are mentioned.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And Earth; the other part of that realm.">وَالأَرضِ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَبسُطُ" data-root="B S TT" data-root-meaning="Opening, spreading, and extending; context can apply this to ample provision or breadth of knowledge and capacity." data-context="Widens; ample provision after the statement of authority over the heavens and Earth." data-learn-more="/quran-terminology/en/roots/b-s-tt/">يَبسُطُ</button>
    <button class="word-link" type="button" data-word="الرِّزقَ" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="Provision; what is widened or restricted.">الرِّزقَ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="He wills; concerning provision’s recipient.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيَقدِرُ" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure" data-context="And restricts; contrasted with widening provision.">وَيَقدِرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Of every; the comprehensive scope of His knowledge.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-context="Thing; what His comprehensive knowledge concerns." data-root-meaning="Willing and intending; as the noun shayʾ, a thing or matter under discussion, distinct in use from the verb of willing.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; His description concerning everything.">عَليمٌ</button>
  </p>
  <p class="english-verse">His are the keys of the heavens and the earth. He expands provision for whom He wills and restricts it. He knows all things.</p>
</section>
