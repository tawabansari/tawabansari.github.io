<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="شُرَكٰؤُا۟" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Partners.">شُرَكٰؤُا۟</button>
    <button class="word-link" type="button" data-word="شَرَعوا" data-root="SH R AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-r-ayn/" data-root-meaning="A clear way or establishing a course; sharīʿah is a way or ordinance; shurraʿ describes openly approaching." data-context="Prescribed or legislated.">شَرَعوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God" data-context="The religion or way under discussion.">الدّينِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَأذَن" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Permits; negated here.">يَأذَن</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَولا</button>
    <button class="word-link" type="button" data-word="كَلِمَةُ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="The word or decree of.">كَلِمَةُ</button>
    <button class="word-link" type="button" data-word="الفَصلِ" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="Decisive settlement; in kalimat al-faṣl, a determining decree." data-learn-more="/quran-terminology/en/roots/f-sad-l/">الفَصلِ</button>
    <button class="word-link" type="button" data-word="لَقُضِىَ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination" data-context="Judgment would have been passed; within the conditional response.">لَقُضِىَ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between them; in the construction concerning judgment.">بَينَهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers.">الظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="أَليمٌ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful.">أَليمٌ</button>
  </p>
  <p class="english-verse">Or do they have partners who prescribed for them of religion what The God has not permitted? Had it not been for the word of separation, judgment would have been made between them. The wrongdoers have a painful punishment.</p>
</section>
