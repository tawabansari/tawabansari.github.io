<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَزٰؤُا۟" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="and the recompense">وَجَزٰؤُا۟</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="an evil">سَيِّئَةٍ</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="an equivalent ill">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="مِثلُها" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="like it">مِثلُها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَن</button>
    <button class="word-link" type="button" data-word="عَفا" data-root="ʿ F W" data-learn-more="/quran-terminology/en/roots/ayn-f-w/" data-root-meaning="Passing over pursuit of a fault, lifting censure, effacing a trace, and what remains beyond need" data-context="pardoned">عَفا</button>
    <button class="word-link" type="button" data-word="وَأَصلَحَ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="and reconciled">وَأَصلَحَ</button>
    <button class="word-link" type="button" data-word="فَأَجرُهُ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action" data-context="then his reward">فَأَجرُهُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="does not love">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="wrongdoers">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">The recompense of an evil is an evil like it. But whoever pardons and makes amends, his reward rests with The God. He does not love the wrongdoers.</p>
</section>
