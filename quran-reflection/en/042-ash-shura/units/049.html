<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:49</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="مُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Dominion over the heavens and earth.">مُلكُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens, in the statement of dominion.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth, within dominion.">وَالأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="يَخلُقُ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Creates what He wills.">يَخلُقُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills, within creation and granting offspring.">يَشاءُ</button>
    ۚ
    <button class="word-link" type="button" data-word="يَهَبُ" data-root="W H2 B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h2-b/" data-root-meaning="Giving or granting freely." data-context="Grants: gives daughters.">يَهَبُ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills, within creation and granting offspring.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="إِنٰثًا" data-root="A N TH" data-learn-more="/quran-terminology/en/roots/a-n-th/" data-root-meaning="The female sex contrasted with the male, in humans and other living beings; in linguistic use, considering or naming something feminine, or attributing female sex to it." data-context="Daughters: offspring whose granting is expressed by yahabu.">إِنٰثًا</button>
    <button class="word-link" type="button" data-word="وَيَهَبُ" data-root="W H2 B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h2-b/" data-root-meaning="Giving or granting freely." data-context="And grants offspring.">وَيَهَبُ</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills, within creation and granting offspring.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="الذُّكورَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Sons, in the context of granting offspring.">الذُّكورَ</button>
  </p>
  <p class="english-verse">To The God belongs the dominion of the heavens and the earth. He creates what He wills. He grants females to whom He wills and grants males to whom He wills,</p>
</section>
