  <h2 class="ayah-title">Ash-Shura 42:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>

    <button class="word-link" type="button" data-word="وَيَجعَلُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">وَيَجعَلُ</button>

  <p class="english-verse">or gives them both males and females, and makes whom He wills barren. He is Knowing, Powerful.</p>
