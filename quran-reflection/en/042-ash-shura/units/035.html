<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:35</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يُجٰدِلونَ" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="They dispute over Our signs, in a statement that they have no escape." data-learn-more="/quran-terminology/en/roots/j-d-l/">يُجٰدِلونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ءايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs, the subject of disputation.">ءايٰتِنا</button>

    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>

    <button class="word-link" type="button" data-word="مَحيصٍ" data-root="H Y SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-y-sad/" data-root-meaning="Turning aside or escaping; maḥīṣ is an escape route." data-context="A way of escape, denied to them.">مَحيصٍ</button>

  <p class="english-verse">And so that those who dispute about Our signs may know that they have no escape.</p>
