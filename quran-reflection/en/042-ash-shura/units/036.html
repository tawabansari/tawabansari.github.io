<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:36</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="أوتيتُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">أوتيتُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="فَمَتٰعُ" data-root="M T ʿ (M T Ayn)" data-learn-more="/quran-terminology/en/roots/m-t-ayn/" data-root-meaning="Time-bound benefit, usable provision, temporary enjoyment, and tools for the road; matāʿ is equipment for the journey, not the place of final settlement.">فَمَتٰعُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٌ</button>
    <button class="word-link" type="button" data-word="وَأَبقىٰ" data-root="B Q Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-q-y/" data-root-meaning="Remaining or continuing to exist; baqiyyah: what is left over.">وَأَبقىٰ</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="يَتَوَكَّلونَ" data-root="W K L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-l/" data-root-meaning="Entrusting or relying; wakīl is an agent or responsible guardian.">يَتَوَكَّلونَ</button>
  </p>
  <p class="english-verse">Whatever you have been given is an enjoyment of worldly life. What is with The God is better and more lasting for those who believe and trust in their Lord,</p>
</section>
