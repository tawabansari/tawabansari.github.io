<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="يَشَأ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشَأ</button>
    <button class="word-link" type="button" data-word="يُسكِنِ" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling">يُسكِنِ</button>
    <button class="word-link" type="button" data-word="الرّيحَ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit">الرّيحَ</button>
    <button class="word-link" type="button" data-word="فَيَظلَلنَ" data-root="Ẓ L L (Zha L L)" data-learn-more="/quran-terminology/en/roots/zha-l-l/" data-root-meaning="Shade, a covering that blocks direct exposure, casting shade, and in the verb ظَلَّ, continuing or remaining in a state.">فَيَظلَلنَ</button>
    <button class="word-link" type="button" data-word="رَواكِدَ" data-root="R K D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-k-d/" data-root-meaning="Remaining still or motionless.">رَواكِدَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ظَهرِهِ" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support">ظَهرِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="صَبّارٍ" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">صَبّارٍ</button>
    <button class="word-link" type="button" data-word="شَكورٍ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action">شَكورٍ</button>
  </p>
  <p class="english-verse">If He wills, He stills the wind, and they remain motionless upon its surface. In this are signs for everyone patient and grateful.</p>
</section>
