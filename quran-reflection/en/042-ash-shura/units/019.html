  <h2 class="ayah-title">Ash-Shura 42:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>

    <button class="word-link" type="button" data-word="بِعِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">بِعِبادِهِ</button>

    <button class="word-link" type="button" data-word="العَزيزُ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">العَزيزُ</button>

  <p class="english-verse">The God is gentle with His servants. He provides for whom He wills. He is the Powerful, the Mighty.</p>
