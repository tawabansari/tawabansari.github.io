<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Sent down; the sending of the Book with truth and the balance.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Book; the text sent down with truth.">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="With truth; describing the Book’s true and rightful sending.">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَالميزانَ" data-root="W Z N" data-learn-more="/quran-terminology/en/roots/w-z-n/" data-root-meaning="Weighing, measuring with a scale, establishing balance, and recognizing quantity or value through a criterion" data-context="And the balance; the measure mentioned alongside the Book.">وَالميزانَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يُدريكَ" data-root="D R Y" data-learn-more="/quran-terminology/en/roots/d-r-y/" data-root-meaning="Knowing or being aware of a matter; in Form IV, informing another." data-context="Makes you know; in the question about the Hour’s possible nearness.">يُدريكَ</button>
    <button class="word-link" type="button" data-word="لَعَلَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّ</button>
    <button class="word-link" type="button" data-word="السّاعَةَ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour; the event that may be near.">السّاعَةَ</button>
    <button class="word-link" type="button" data-word="قَريبٌ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Near; describing the Hour’s possible nearness.">قَريبٌ</button>
  </p>
  <p class="english-verse">The God is the One who sent down the Book in truth, and the balance. What will make you know? Perhaps the Hour is near.</p>
</section>
