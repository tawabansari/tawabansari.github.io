<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرىٰهُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="And you see them in the scene of presentation.">وَتَرىٰهُم</button>
    <button class="word-link" type="button" data-word="يُعرَضونَ" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="They are presented to it, referring contextually to the Fire.">يُعرَضونَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="خٰشِعينَ" data-root="KH SH ʿ (KH SH Ayn)" data-learn-more="/quran-terminology/en/roots/kh-sh-ayn/" data-root-meaning="Lowering, subsiding, softening, becoming still, and moving out of hardness, raisedness, noise, or resistance before truth and greatness." data-context="Subdued, as a result of humiliation.">خٰشِعينَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الذُّلِّ" data-root="DH L L" data-learn-more="/quran-terminology/en/roots/dh-l-l/" data-root-meaning="Being tamed, made accessible, humbled, or lowered from honor." data-context="Humiliation, causing the stated subdued condition.">الذُّلِّ</button>
    <button class="word-link" type="button" data-word="يَنظُرونَ" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="They look with an unobtrusive glance.">يَنظُرونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="طَرفٍ" data-root="TT R F" data-learn-more="/quran-terminology/en/roots/tt-r-f/" data-root-meaning="Edges, sides, parts of a whole, the gaze, and the movement of sight" data-context="A glance, in the expression a covert glance.">طَرفٍ</button>
    <button class="word-link" type="button" data-word="خَفِىٍّ" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="Covert and unobtrusive, qualifying the subdued glance." data-learn-more="/quran-terminology/en/roots/kh-f-y/">خَفِىٍّ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said, introducing the believers’ statement.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Have believed, identifying those making the following statement.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الخٰسِرينَ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="The losers, those who have lost themselves and their households.">الخٰسِرينَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="خَسِروا" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="Lost themselves and their households.">خَسِروا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Themselves, among what they have lost on the day of Resurrection.">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="وَأَهليهِم" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="And their households or families in this expression.">وَأَهليهِم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Day, the time of Resurrection.">يَومَ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Resurrection, in the expression day of Resurrection.">القِيٰمَةِ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The wrongdoers, described as being in enduring punishment.">الظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="عَذابٍ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, the adverse condition of the wrongdoers.">عَذابٍ</button>
    <button class="word-link" type="button" data-word="مُقيمٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Enduring, qualifying the punishment.">مُقيمٍ</button>
  </p>
  <p class="english-verse">You will see them exposed to it, humbled by disgrace, looking with a furtive glance. Those who believe will say, “The losers are those who have lost themselves and their families on the Day of Resurrection.” Indeed, the wrongdoers are in a lasting punishment.</p>
</section>
