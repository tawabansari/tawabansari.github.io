<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="They have taken patrons besides Him.">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِهِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Besides Him or in His place.">دونِهِ</button>
    <button class="word-link" type="button" data-word="أَولِياءَ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Patrons, chosen as protectors or supports.">أَولِياءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="حَفيظٌ" data-root="H F ZHA" data-root-meaning="Keeping and caring for something so that it is not lost, forgotten, abandoned, or ruined." data-context="Watching over them; The God’s oversight of those taking other patrons." data-learn-more="/quran-terminology/en/roots/h-f-zha/">حَفيظٌ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِوَكيلٍ" data-root="W K L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-l/" data-root-meaning="Entrusting or relying; wakīl is an agent or responsible guardian." data-context="An entrusted overseer over them; the role denied of the addressee.">بِوَكيلٍ</button>
  </p>
  <p class="english-verse">As for those who take protectors apart from Him, The God watches over them, and you are not their guardian.</p>
</section>
