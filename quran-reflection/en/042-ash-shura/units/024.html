<section class="ayah-block" id="ayah-024" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:24</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="يَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">يَقولونَ</button>
    <button class="word-link" type="button" data-word="افتَرىٰ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations.">افتَرىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="كَذِبًا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">كَذِبًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="يَشَإِ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشَإِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَختِم" data-root="KH T M" data-learn-more="/quran-terminology/en/roots/kh-t-m/" data-root-meaning="Seal, final closure, being closed, and final confirmation">يَختِم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَلبِكَ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">قَلبِكَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَيَمحُ" data-root="M H W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-h-w/" data-root-meaning="Erasing or effacing a trace.">وَيَمحُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="البٰطِلَ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth.">البٰطِلَ</button>
    <button class="word-link" type="button" data-word="وَيُحِقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">وَيُحِقُّ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">الحَقَّ</button>
    <button class="word-link" type="button" data-word="بِكَلِمٰتِهِ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality">بِكَلِمٰتِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
    <button class="word-link" type="button" data-word="بِذاتِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِذاتِ</button>
    <button class="word-link" type="button" data-word="الصُّدورِ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/">الصُّدورِ</button>
  </p>
  <p class="english-verse">Or do they say, “He has fabricated a lie about The God”? If The God wills, He can seal your heart. The God erases falsehood and establishes the truth through His words. He knows what is within the breasts.</p>
</section>
