<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="أَعرَضوا" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="They turn away; in the conditional clause.">أَعرَضوا</button>
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="أَرسَلنٰكَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="We sent you; in describing the messenger’s responsibility.">أَرسَلنٰكَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="حَفيظًا" data-root="H F ZHA" data-root-meaning="Keeping and caring for something so that it is not lost, forgotten, abandoned, or ruined." data-context="A keeper over them; the role denied of the messenger when people turn away." data-learn-more="/quran-terminology/en/roots/h-f-zha/">حَفيظًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="البَلٰغُ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="Conveying the message.">البَلٰغُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="أَذَقنَا" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="We let taste; granting an experience of mercy.">أَذَقنَا</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being, receiving mercy or adversity.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="رَحمَةً" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Mercy, the favor granted.">رَحمَةً</button>
    <button class="word-link" type="button" data-word="فَرِحَ" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context." data-context="Rejoices in the mercy received.">فَرِحَ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُصِبهُم" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="Befalls them, concerning adversity.">تُصِبهُم</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Adversity resulting from prior conduct.">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="قَدَّمَت" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="Has sent ahead, concerning their deeds.">قَدَّمَت</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands, referring to their own deeds.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being, receiving mercy or adversity.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="كَفورٌ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Deeply ungrateful; describing human conduct.">كَفورٌ</button>
  </p>
  <p class="english-verse">If they turn away, We have not sent you as a keeper over them. Your duty is only to convey. When We let the human being taste mercy from Us, he rejoices in it. But if an evil strikes them because of what their hands have sent ahead, the human being is deeply ungrateful.</p>
</section>
