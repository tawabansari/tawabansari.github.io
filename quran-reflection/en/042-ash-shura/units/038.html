<section class="ayah-block" id="ayah-038" data-translation-status="provisional">
  <h2 class="ayah-title">Ash-Shura 42:38</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="استَجابوا" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/">استَجابوا</button>
    <button class="word-link" type="button" data-word="لِرَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">لِرَبِّهِم</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَأَمرُهُم" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">وَأَمرُهُم</button>
    <button class="word-link" type="button" data-word="شورىٰ" data-root="SH W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-w-r/" data-root-meaning="Consultation; also signaling or pointing.">شورىٰ</button>
    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَهُم</button>
    <button class="word-link" type="button" data-word="وَمِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">يُنفِقونَ</button>
  </p>
  <p class="english-verse">those who respond to their Lord, establish prayer, conduct their affairs by consultation among themselves, and spend from what We have provided them,</p>
