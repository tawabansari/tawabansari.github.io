    ۖ
    <button class="word-link" type="button" data-word="كُلَّما" data-root="K L L" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-learn-more="/quran-terminology/en/roots/k-l-l/">كُلَّما</button>

  </p>
  <p class="english-verse">But as for those who were defiantly disobedient, their refuge is the Fire. Whenever they want to leave it, they are returned to it, and it is said to them: Taste the punishment of the Fire which you used to deny.</p>
