  <h2 class="ayah-title">As-Sajdah 32:14</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="لِقاءَ" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter">لِقاءَ</button>

    <button class="word-link" type="button" data-word="نَسينٰكُم" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">نَسينٰكُم</button>

    <button class="word-link" type="button" data-word="عَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">عَذابَ</button>
    <button class="word-link" type="button" data-word="الخُلدِ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place">الخُلدِ</button>

  </p>
  <p class="english-verse">So taste, because you forgot the meeting of this day of yours; We have forgotten you. And taste the everlasting punishment for what you used to do.</p>
