<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">As-Sajdah 32:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَتَجافىٰ" data-root="J F W" data-root-meaning="Drawing away and keeping apart; in human relationships, turning away and unkindness." data-context="Draws away or separates, describing their sides in relation to beds." data-learn-more="/quran-terminology/en/roots/j-f-w/">تَتَجافىٰ</button>
    <button class="word-link" type="button" data-word="جُنوبُهُم" data-root="J N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-n-b/" data-root-meaning="A side, flank, or region; ijtināb: keeping away; junub denotes a particular ritual condition." data-context="Their sides, the subject of drawing away from beds.">جُنوبُهُم</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="المَضاجِعِ" data-root="DAD J AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-j-ayn/" data-root-meaning="Lying on one&#x27;s side; maḍjaʿ is a resting place." data-context="Beds or reclining places from which their sides draw away.">المَضاجِعِ</button>
    <button class="word-link" type="button" data-word="يَدعونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="They call upon, invoking their Lord in supplication.">يَدعونَ</button>
    <button class="word-link" type="button" data-word="رَبَّهُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord, whom they invoke in fear and hope.">رَبَّهُم</button>
    <button class="word-link" type="button" data-word="خَوفًا" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="In fear, one of the two states accompanying their invocation.">خَوفًا</button>
    <button class="word-link" type="button" data-word="وَطَمَعًا" data-root="Ṭ M ʿ (TT M Ayn)" data-learn-more="/quran-terminology/en/roots/tt-m-ayn/" data-root-meaning="Expectation and inner inclination toward attaining a desired matter thought possible" data-context="And in hope or expectation, alongside fear.">وَطَمَعًا</button>
    <button class="word-link" type="button" data-word="وَمِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِمّا</button>
    <button class="word-link" type="button" data-word="رَزَقنٰهُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth" data-context="We have provided them, describing what they spend from.">رَزَقنٰهُم</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="They spend, giving from the provision they have received.">يُنفِقونَ</button>
  </p>
  <p class="english-verse">Their sides draw away from their beds; they call upon their Lord in fear and hope, and spend from what We have provided them.</p>
</section>
