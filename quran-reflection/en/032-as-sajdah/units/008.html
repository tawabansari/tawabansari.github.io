  <h2 class="ayah-title">As-Sajdah 32:8</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="نَسلَهُ" data-root="N S L" data-root-meaning="Emergence and separation from a source; nasl denotes offspring and continuing descent, while yansiluna denotes swift movement." data-context="The progeny and descendants of the human being mentioned in the preceding verse." data-learn-more="/quran-terminology/en/roots/n-s-l/">نَسلَهُ</button>

  <p class="english-verse">then made his descendants from an extract of a lowly fluid,</p>
