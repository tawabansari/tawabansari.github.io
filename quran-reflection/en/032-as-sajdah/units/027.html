<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">As-Sajdah 32:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Have they not seen; asking about observing the delivery of water and the growth of crops.">يَرَوا</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّا</button>
    <button class="word-link" type="button" data-word="نَسوقُ" data-root="S W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-q/" data-root-meaning="Driving or leading; sūq is a market; sāq is the lower leg." data-context="We drive; setting the water in motion toward vegetation-free land.">نَسوقُ</button>
    <button class="word-link" type="button" data-word="الماءَ" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Water, driven toward the land and used to bring forth crops.">الماءَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The land, described as without vegetation and receiving the water.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="الجُرُزِ" data-root="J R Z" data-root-meaning="Cutting and removing something; of land, being without vegetation or plant cover." data-context="Without vegetation; describing land toward which water is driven and from which crops emerge." data-learn-more="/quran-terminology/en/roots/j-r-z/">الجُرُزِ</button>
    <button class="word-link" type="button" data-word="فَنُخرِجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Then We bring forth; causing crops to emerge through the water.">فَنُخرِجُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="زَرعًا" data-root="Z R AYN" data-learn-more="/quran-terminology/en/roots/z-r-ayn/" data-root-meaning="Placing seed, sprouting, plant growth, and the appearance of produce" data-context="Crops or cultivated growth, brought forth from the land through water.">زَرعًا</button>
    <button class="word-link" type="button" data-word="تَأكُلُ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Eat; livestock and people feeding on the crops.">تَأكُلُ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="أَنعٰمُهُم" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="Their livestock, the domestic animals that feed on the crops.">أَنعٰمُهُم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسُهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="And they themselves, the people who also obtain food from the crops.">وَأَنفُسُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="أَفَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَلا</button>
    <button class="word-link" type="button" data-word="يُبصِرونَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="See; the concluding question about observing this sign in water’s delivery and plant growth.">يُبصِرونَ</button>
  </p>
  <p class="english-verse">Have they not seen that We drive water to barren land and bring forth crops with it, from which their livestock and they themselves eat? Will they not then see?</p>
</section>
