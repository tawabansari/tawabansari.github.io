  <h2 class="ayah-title">As-Sajdah 32:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="سَوّىٰهُ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness">سَوّىٰهُ</button>
    <button class="word-link" type="button" data-word="وَنَفَخَ" data-root="N F KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-kh/" data-root-meaning="Blowing or setting air in motion.">وَنَفَخَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="روحِهِ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit">روحِهِ</button>

    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="السَّمعَ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">السَّمعَ</button>
    <button class="word-link" type="button" data-word="وَالأَبصٰرَ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">وَالأَبصٰرَ</button>
    <button class="word-link" type="button" data-word="وَالأَفـِٔدَةَ" data-root="F A D" data-root-meaning="“heart” is the most appropriate basic equivalent for fuʾād: a heart that Qur’anic usage can connect with reception, understanding, inclination, responsiveness, and steadfastness." data-learn-more="/quran-terminology/en/roots/f-a-d/">وَالأَفـِٔدَةَ</button>
    ۚ
    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter.">قَليلًا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَشكُرونَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action">تَشكُرونَ</button>
  </p>
  <p class="english-verse">then fashioned him and breathed into him of His spirit, and made for you hearing, sight, and hearts. Little do you give thanks.</p>
