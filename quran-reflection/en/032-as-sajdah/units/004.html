    <button class="word-link" type="button" data-word="تَتَذَكَّرونَ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness">تَتَذَكَّرونَ</button>
  </p>
  <p class="english-verse">The God is the One who created the heavens and the earth and whatever is between them in six days, then established Himself upon the Throne. You have no guardian or intercessor besides Him. Will you not then take heed?</p>
