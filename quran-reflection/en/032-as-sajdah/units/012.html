<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">As-Sajdah 32:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="تَرىٰ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="You could see, observing the offenders before their Lord.">تَرىٰ</button>
    <button class="word-link" type="button" data-word="إِذِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذِ</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="J R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-r-m/" data-root-meaning="Cutting and acquiring; ijrām: committing an offense; lā jarama is an expression of certainty." data-context="The offenders, depicted with lowered heads.">المُجرِمونَ</button>
    <button class="word-link" type="button" data-word="ناكِسوا" data-root="N K S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-s/" data-root-meaning="Reversing or turning upside down; in aging, returning strength to weakness." data-context="Lowering their heads, describing the offenders’ posture.">ناكِسوا</button>
    <button class="word-link" type="button" data-word="رُءوسِهِم" data-root="R A S" data-root-meaning="The head; by extension, the upper, initial, or principal part of something. Raʾs al-māl: principal property." data-context="Their heads, lowered before their Lord." data-learn-more="/quran-terminology/en/roots/r-a-s/">رُءوسِهِم</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord, before whom the offenders stand.">رَبِّهِم</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord, beginning their request to return.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَبصَرنا" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="We have seen, acknowledging the reality now disclosed.">أَبصَرنا</button>
    <button class="word-link" type="button" data-word="وَسَمِعنا" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="And heard, acknowledging what they had not accepted before.">وَسَمِعنا</button>
    <button class="word-link" type="button" data-word="فَارجِعنا" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="Send us back, requesting another opportunity to act.">فَارجِعنا</button>
    <button class="word-link" type="button" data-word="نَعمَل" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="We may act, the purpose of their request to return.">نَعمَل</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Rightly or righteously, describing the action they promise.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="موقِنونَ" data-root="Y Q N" data-learn-more="/quran-terminology/en/roots/y-q-n/" data-root-meaning="Firmness of knowledge, clear assurance, and passing beyond conjecture" data-context="Certain, describing the offenders’ present conviction.">موقِنونَ</button>
  </p>
  <p class="english-verse">And if you could see when the offenders hang their heads before their Lord: Our Lord, we have seen and heard, so return us, and we will do righteousness. Indeed, we are certain.</p>
</section>
