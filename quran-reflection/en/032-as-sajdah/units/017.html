<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">As-Sajdah 32:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knows, negated by the preceding particle concerning the concealed reward.">تَعلَمُ</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="No soul: no one knows that reward.">نَفسٌ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أُخفِىَ" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="Has been kept hidden: the reward no soul knows." data-learn-more="/quran-terminology/en/roots/kh-f-y/">أُخفِىَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قُرَّةِ" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness." data-context="Comfort of the eyes, an expression for delight.">قُرَّةِ</button>
    <button class="word-link" type="button" data-word="أَعيُنٍ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="Eyes, in the expression comfort of the eyes.">أَعيُنٍ</button>
    <button class="word-link" type="button" data-word="جَزاءً" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="A reward for their deeds.">جَزاءً</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to, introducing their former deeds.">كانوا</button>
    <button class="word-link" type="button" data-word="يَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="They did: the deeds for which the reward is given.">يَعمَلونَ</button>
  </p>
  <p class="english-verse">So no soul knows what delight of the eyes has been hidden for them as a reward for what they used to do.</p>
</section>
