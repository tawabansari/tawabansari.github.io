<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="يَظهَروا" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support" data-context="If they gain the upper hand over you: the group under discussion obtaining power and dominance.">يَظهَروا</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَرقُبوا" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="In lā yarqubū: they would respect neither bond nor covenant; the consequence of their prevailing in the conditional statement." data-learn-more="/quran-terminology/en/roots/r-q-b/">يَرقُبوا</button>
    <button class="word-link" type="button" data-word="فيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيكُم</button>
    <button class="word-link" type="button" data-word="إِلًّا" data-root="A L L" data-learn-more="/quran-terminology/en/roots/a-l-l/" data-root-meaning="A human bond arising from kinship, covenant, alliance, or another recognized relationship, requiring respect for the other party’s standing and rights." data-context="A bond requiring respect, such as kinship or alliance; here its observance is denied.">إِلًّا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="ذِمَّةً" data-root="DH M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-m-m/" data-root-meaning="Blame and reproach; dhimmah is a covenant or binding obligation." data-context="A covenant, assurance of protection, or obligation that must be upheld, alongside kinship and alliance.">ذِمَّةً</button>
    ۚ
    <button class="word-link" type="button" data-word="يُرضونَكُم" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent" data-context="They please you with their words, in contrast with the stance of their hearts.">يُرضونَكُم</button>
    <button class="word-link" type="button" data-word="بِأَفوٰهِهِم" data-root="F W H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-w-h2/" data-root-meaning="The mouth or mouths." data-context="With their mouths: their verbal statements, which do not accord with their inward stance.">بِأَفوٰهِهِم</button>
    <button class="word-link" type="button" data-word="وَتَأبىٰ" data-root="A B Y" data-learn-more="/quran-terminology/en/roots/a-b-y/" data-root-meaning="Refusing, declining, or withholding acceptance; the motive and moral value depend on the object, subject, and context." data-context="Their hearts refuse: inwardly they do not accept what they say aloud.">وَتَأبىٰ</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Their hearts: their inward stance, contrasted with outward speech.">قُلوبُهُم</button>
    <button class="word-link" type="button" data-word="وَأَكثَرُهُم" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Most of them: a qualification concerning the group discussed in this context.">وَأَكثَرُهُم</button>
    <button class="word-link" type="button" data-word="فٰسِقونَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command" data-context="Defiant people: those departing from the bounds of faithfulness and obligation in this context.">فٰسِقونَ</button>
  </p>
  <p class="english-verse">How, when, if they gain the upper hand over you, they observe neither kinship nor a covenant toward you? They please you with their mouths, while their hearts refuse. Most of them are defiantly disobedient.</p>
</section>
