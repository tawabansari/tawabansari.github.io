<section class="ayah-block" id="ayah-109" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:109</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَفَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَفَمَن</button>
    <button class="word-link" type="button" data-word="أَسَّسَ" data-root="A S S" data-learn-more="/quran-terminology/en/roots/a-s-s/" data-root-meaning="Laying a base or foundation upon which something’s construction or continuation rests; and, more broadly, beginning and establishing an undertaking on a particular basis." data-context="Founded; establishing the first building upon mindfulness and divine approval.">أَسَّسَ</button>
    <button class="word-link" type="button" data-word="بُنيٰنَهُ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="His building, the structure in the first side of the comparison.">بُنيٰنَهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="تَقوىٰ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Mindfulness and responsible vigilance, the basis of the first building.">تَقوىٰ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَرِضوٰنٍ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent" data-context="And approval; divine approval accompanying mindfulness in the building’s foundation.">وَرِضوٰنٍ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better, comparing the two foundations.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَسَّسَ" data-root="A S S" data-learn-more="/quran-terminology/en/roots/a-s-s/" data-root-meaning="Laying a base or foundation upon which something’s construction or continuation rests; and, more broadly, beginning and establishing an undertaking on a particular basis." data-context="Founded; establishing the second building on a crumbling bank’s edge.">أَسَّسَ</button>
    <button class="word-link" type="button" data-word="بُنيٰنَهُ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="His building, the structure in the second side of the comparison.">بُنيٰنَهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="شَفا" data-root="SH F W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-f-w/" data-root-meaning="An edge or brink, especially of a precipice." data-context="The edge or brink on which the building is founded.">شَفا</button>
    <button class="word-link" type="button" data-word="جُرُفٍ" data-root="J R F" data-root-meaning="Removing and sweeping away a large quantity of something, especially soil eroded and carried off by flowing water." data-context="An eroded bank; here, qualified by hār, an unstable bank ready to crumble, with a building founded on its edge." data-learn-more="/quran-terminology/en/roots/j-r-f/">جُرُفٍ</button>
    <button class="word-link" type="button" data-word="هارٍ" data-root="H2 W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-w-r/" data-root-meaning="Collapsing or being on the verge of collapse." data-context="Crumbling or liable to collapse, describing the eroded bank.">هارٍ</button>
    <button class="word-link" type="button" data-word="فَانهارَ" data-root="H2 W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-w-r/" data-root-meaning="Collapsing or being on the verge of collapse." data-context="Then collapsed, completing the image of building on unstable ground.">فَانهارَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="نارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="Fire, in the expression the fire of Hell, the stated outcome in the image.">نارِ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guides; with negation, stating that the unjust people are not guided.">يَهدِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="People or a group, described in the following word as unjust.">القَومَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The unjust, describing the people named at the verse’s end.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">Is one who founded his building upon mindfulness of The God and His approval better, or one who founded his building on the edge of a crumbling bank, which collapsed with him into the fire of Hell? The God does not guide the unjust people.</p>
</section>
