<section class="ayah-block" id="ayah-114" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:114</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; in the restrictive construction explaining the reason for seeking forgiveness.">كانَ</button>
    <button class="word-link" type="button" data-word="استِغفارُ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Seeking forgiveness, asking pardon for Abraham’s father.">استِغفارُ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="لِأَبيهِ" data-root="A B W" data-learn-more="/quran-terminology/en/roots/a-b-w/" data-root-meaning="Father, fathers, and ancestors: descent, nurture, family relationships, and the legacy of earlier generations" data-context="For his father, the person for whom Abraham had sought forgiveness.">لِأَبيهِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="مَوعِدَةٍ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="A promise, the stated reason for seeking forgiveness.">مَوعِدَةٍ</button>
    <button class="word-link" type="button" data-word="وَعَدَها" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="He had promised it to him; the promise to seek forgiveness in this contextual reading.">وَعَدَها</button>
    <button class="word-link" type="button" data-word="إِيّاهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِيّاهُ</button>
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="تَبَيَّنَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Became clear, the stated condition becoming apparent to Abraham.">تَبَيَّنَ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="أَنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُ</button>
    <button class="word-link" type="button" data-word="عَدُوٌّ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="An enemy, describing that person’s stance toward The God in this context.">عَدُوٌّ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="تَبَرَّأَ" data-root="B R A" data-learn-more="/quran-terminology/en/roots/b-r-a/" data-root-meaning="Bringing into being, being released from illness or attribution, being clear of accusation, and declaring bara&#x27;ah" data-context="Dissociated himself from him and declared separation.">تَبَرَّأَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="لَأَوّٰهٌ" data-root="A W H2" data-learn-more="/quran-terminology/en/roots/a-w-h2/" data-root-meaning="Sighing and expressing emotion prompted by pain, sorrow, or concern." data-context="Given to sighing and supplication; Abraham’s deep concern in the context of seeking forgiveness for his father.">لَأَوّٰهٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="H L M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-m/" data-root-meaning="Forbearance and self-restraint; also dreams, and maturity in the expression reaching ḥulum." data-context="Forbearing and self-restrained, describing Abraham alongside awwāh.">حَليمٌ</button>
  </p>
  <p class="english-verse">Abraham’s seeking forgiveness for his father was only because of a promise he had made to him. When it became clear to him that he was an enemy of The God, he disowned him. Abraham was much given to sighing, forbearing.</p>
</section>
