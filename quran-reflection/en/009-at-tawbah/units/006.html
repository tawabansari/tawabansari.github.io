<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَحَدٌ" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="One; an individual from the stated group.">أَحَدٌ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="Associationists; the group from whom someone may seek protection.">المُشرِكينَ</button>
    <button class="word-link" type="button" data-word="استَجارَكَ" data-root="J W R" data-root-meaning="Neighborhood and adjacency; granting refuge and protection; jawr concerns departure from a right course or justice." data-context="Seeks your protection; the stated person’s request for safety." data-learn-more="/quran-terminology/en/roots/j-w-r/">استَجارَكَ</button>
    <button class="word-link" type="button" data-word="فَأَجِرهُ" data-root="J W R" data-root-meaning="Neighborhood and adjacency; granting refuge and protection; jawr concerns departure from a right course or justice." data-context="Grant him protection; the command to shelter the person seeking safety." data-learn-more="/quran-terminology/en/roots/j-w-r/">فَأَجِرهُ</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يَسمَعَ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Hears; hearing the speech while protected.">يَسمَعَ</button>
    <button class="word-link" type="button" data-word="كَلٰمَ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="Speech; what the protected person has the opportunity to hear.">كَلٰمَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="أَبلِغهُ" data-root="B L GH" data-learn-more="/quran-terminology/en/roots/b-l-gh/" data-root-meaning="Reaching, arriving at a limit, and delivering a message to its destination and completion of proof" data-context="Convey him; the command to take the person to safety.">أَبلِغهُ</button>
    <button class="word-link" type="button" data-word="مَأمَنَهُ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="His place of safety; the destination to which he must be conveyed.">مَأمَنَهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="بِأَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَنَّهُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="A people; the group described as not knowing.">قَومٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Know; the knowledge denied of them.">يَعلَمونَ</button>
  </p>
  <p class="english-verse">If any of the associators seeks your protection, grant him protection so that he may hear the word of The God; then convey him to his place of safety. That is because they are people who do not know.</p>
</section>
