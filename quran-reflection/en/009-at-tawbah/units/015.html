<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُذهِب" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach">وَيُذهِب</button>
    <button class="word-link" type="button" data-word="غَيظَ" data-root="GH Y ZHA" data-root-note="Root study coming soon.">غَيظَ</button>
    <button class="word-link" type="button" data-word="قُلوبِهِم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">قُلوبِهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَيَتوبُ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy">وَيَتوبُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشاءُ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">حَكيمٌ</button>
  </p>
  <p class="english-verse">And remove the anger of their hearts. The God turns toward whomever He wills. The God is Knowing, Wise.</p>
</section>
