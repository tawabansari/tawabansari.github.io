<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:92</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَتَوكَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="They came to you to request mounts or transport.">أَتَوكَ</button>
    <button class="word-link" type="button" data-word="لِتَحمِلَهُم" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="So that you might provide them with mounts or transport to participate." data-learn-more="/quran-terminology/en/roots/h-m-l/">لِتَحمِلَهُم</button>
    <button class="word-link" type="button" data-word="قُلتَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="You said, answering their request for transport.">قُلتَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="أَجِدُ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="I cannot find anything on which to carry them.">أَجِدُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَحمِلُكُم" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="I might carry you on transport that is unavailable." data-learn-more="/quran-terminology/en/roots/h-m-l/">أَحمِلُكُم</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="تَوَلَّوا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="They turned back after learning that transport was unavailable.">تَوَلَّوا</button>
    <button class="word-link" type="button" data-word="وَأَعيُنُهُم" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="And their eyes, the nominal subject of the clause describing streaming tears.">وَأَعيُنُهُم</button>
    <button class="word-link" type="button" data-word="تَفيضُ" data-root="F Y DAD" data-root-meaning="Flowing or streaming, sometimes with abundance and overflow; in extended uses, collective departure or engagement in discourse and activity." data-context="Their eyes stream with tears from grief at lacking transport and resources to participate." data-learn-more="/quran-terminology/en/roots/f-y-dad/">تَفيضُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الدَّمعِ" data-root="D M AYN" data-learn-more="/quran-terminology/en/roots/d-m-ayn/" data-root-meaning="Tears and their flow; in extended uses, liquid seeping and overflowing." data-context="Tears, whose flow is connected with their grief.">الدَّمعِ</button>
    <button class="word-link" type="button" data-word="حَزَنًا" data-root="Ḥ Z N" data-learn-more="/quran-terminology/en/roots/h-z-n/" data-root-meaning="Grief, heaviness of the heart, and the inner path becoming rough and difficult" data-context="Out of grief at finding nothing to spend.">حَزَنًا</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="يَجِدوا" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="They find nothing to cover the cost of participation.">يَجِدوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُنفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="They might spend on what is needed to participate.">يُنفِقونَ</button>
  </p>
  <p class="english-verse">Nor upon those who, when they came to you for mounts, you said, “I find nothing on which to mount you.” They turned away with their eyes overflowing with tears, grieving that they could find nothing to spend.</p>
</section>
