  <h2 class="ayah-title">At-Tawbah 9:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَئِن</button>
    <button class="word-link" type="button" data-word="سَأَلتَهُم" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability.">سَأَلتَهُم</button>
    <button class="word-link" type="button" data-word="لَيَقولُنَّ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">لَيَقولُنَّ</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="كُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنّا</button>

    <button class="word-link" type="button" data-word="وَنَلعَبُ" data-root="L AYN B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-ayn-b/" data-root-meaning="Play or activity for amusement.">وَنَلعَبُ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>
    <button class="word-link" type="button" data-word="أَبِاللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">أَبِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَءايٰتِهِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">وَءايٰتِهِ</button>
    <button class="word-link" type="button" data-word="وَرَسولِهِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَرَسولِهِ</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَستَهزِءونَ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game">تَستَهزِءونَ</button>
  </p>
  <p class="english-verse">If you ask them, they will surely say, “We were only talking idly and playing.” Say, “Was it The God, His signs, and His Messenger that you were mocking?”</p>
