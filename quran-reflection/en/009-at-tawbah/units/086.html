<section class="ayah-block" id="ayah-086" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:86</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="أُنزِلَت" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Was sent down; the revelation of a surah.">أُنزِلَت</button>
    <button class="word-link" type="button" data-word="سورَةٌ" data-root="S W R" data-learn-more="/quran-terminology/en/roots/s-w-r/" data-root-meaning="A wall, enclosure, boundary, raised structure, or a form that surrounds something and distinguishes inside from outside" data-context="A surah; the revealed unit containing the command.">سورَةٌ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="ءامِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believe; the command quoted from the surah.">ءامِنوا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَجٰهِدوا" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="And strive; the command to participate alongside His Messenger." data-learn-more="/quran-terminology/en/roots/j-h2-d/">وَجٰهِدوا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="رَسولِهِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="His Messenger; the one they are commanded to accompany.">رَسولِهِ</button>
    <button class="word-link" type="button" data-word="استَـٔذَنَكَ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Asked your leave; the resourceful seeking exemption.">استَـٔذَنَكَ</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولُوا</button>
    <button class="word-link" type="button" data-word="الطَّولِ" data-root="TT W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-w-l/" data-root-meaning="Length or extension; ṭawl denotes means, abundance, or bounty." data-context="Means; the resources held by those seeking exemption.">الطَّولِ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said; the petitioners’ words.">وَقالوا</button>
    <button class="word-link" type="button" data-word="ذَرنا" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be." data-context="Leave us; requesting to remain behind.">ذَرنا</button>
    <button class="word-link" type="button" data-word="نَكُن" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="We may be; remaining among those seated.">نَكُن</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="القٰعِدينَ" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Those remaining seated; those not departing with the group.">القٰعِدينَ</button>
  </p>
  <p class="english-verse">When a surah is sent down, “Believe in The God and strive alongside His Messenger,” those of means among them ask your permission and say, “Leave us to be with those who sit.”</p>
</section>
