<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَجَعَلتُم" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Have you equated; questioning the equivalence of two positions.">أَجَعَلتُم</button>
    <button class="word-link" type="button" data-word="سِقايَةَ" data-root="S Q Y" data-learn-more="/quran-terminology/en/roots/s-q-y/" data-root-meaning="Giving water, giving drink, bringing a drink, providing watering, and asking for water." data-context="Providing water; giving pilgrims drink.">سِقايَةَ</button>
    <button class="word-link" type="button" data-word="الحاجِّ" data-root="Ḥ J J" data-learn-more="/quran-terminology/en/roots/h-j-j/" data-root-meaning="From Intending a Destination and Hajj to Argument and Reasoned Confrontation" data-context="Pilgrims; those undertaking the pilgrimage.">الحاجِّ</button>
    <button class="word-link" type="button" data-word="وَعِمارَةَ" data-root="ʿ M R" data-learn-more="/quran-terminology/en/roots/ayn-m-r/" data-root-meaning="ʿAmara: the continuation of life, inhabited places, and enduring presence" data-context="And maintenance; caring for and sustaining the mosque.">وَعِمارَةَ</button>
    <button class="word-link" type="button" data-word="المَسجِدِ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="The mosque; the stated place of prostration and worship.">المَسجِدِ</button>
    <button class="word-link" type="button" data-word="الحَرامِ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="Sacred; the mosque’s protected sanctity.">الحَرامِ</button>
    <button class="word-link" type="button" data-word="كَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَمَن</button>
    <button class="word-link" type="button" data-word="ءامَنَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believed; describing the person in the comparison.">ءامَنَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَاليَومِ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the Day; in the expression the Last Day.">وَاليَومِ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="Last; qualifying the final Day.">الـٔاخِرِ</button>
    <button class="word-link" type="button" data-word="وَجٰهَدَ" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="And strove; describing someone exerting effort in the way of The God." data-learn-more="/quran-terminology/en/roots/j-h2-d/">وَجٰهَدَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Way; the direction of striving for The God.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَستَوۥنَ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Are equal; the equality denied.">يَستَوۥنَ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَهدِى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guides; the guidance denied to the unjust.">يَهدِى</button>
    <button class="word-link" type="button" data-word="القَومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="People; the group described as unjust.">القَومَ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="The unjust; those acting wrongfully.">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">Have you made the giving of water to pilgrims and the maintenance of the Sacred Mosque equal to one who believes in The God and the Last Day and strives in the way of The God? They are not equal with The God. The God does not guide the unjust people.</p>
</section>
