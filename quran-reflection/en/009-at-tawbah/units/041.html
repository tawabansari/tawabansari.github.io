<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="انفِروا" data-root="N F R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Setting out; also aversion or fleeing away.">انفِروا</button>
    <button class="word-link" type="button" data-word="خِفافًا" data-root="KH F F" data-learn-more="/quran-terminology/en/roots/kh-f-f/" data-root-meaning="From lightness and reduced burdens to loss of steadiness">خِفافًا</button>
    <button class="word-link" type="button" data-word="وَثِقالًا" data-root="TH Q L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-q-l/" data-root-meaning="Heaviness, weight, or a burden, physical or connected with responsibility and difficulty.">وَثِقالًا</button>
    <button class="word-link" type="button" data-word="وَجٰهِدوا" data-root="J H2 D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-h2-d/" data-root-meaning="Exerting effort or capacity against difficulty; jihād takes its particular meaning from purpose, means, and context.">وَجٰهِدوا</button>
    <button class="word-link" type="button" data-word="بِأَموٰلِكُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">بِأَموٰلِكُم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسِكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">وَأَنفُسِكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكُم</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice">خَيرٌ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">تَعلَمونَ</button>
  </p>
  <p class="english-verse">Go forth, light and heavy, and strive with your wealth and your lives in the way of The God. That is better for you, if you know.</p>
</section>
