<section class="ayah-block" id="ayah-117" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:117</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَقَد</button>
    <button class="word-link" type="button" data-word="تابَ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy" data-context="Turned toward: mercy and acceptance toward the stated group.">تابَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="النَّبِىِّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The Prophet: the first person named in divine turning toward them.">النَّبِىِّ</button>
    <button class="word-link" type="button" data-word="وَالمُهٰجِرينَ" data-root="H2 J R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-j-r/" data-root-meaning="Separating or leaving; hijrah is migration from a place." data-context="And the emigrants: a group who followed the Prophet.">وَالمُهٰجِرينَ</button>
    <button class="word-link" type="button" data-word="وَالأَنصارِ" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing" data-context="And the helpers: the supporters who accompanied the Prophet.">وَالأَنصارِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّبَعوهُ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="Followed him: accompanying the Prophet in hardship.">اتَّبَعوهُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ساعَةِ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The time: the period of the stated hardship.">ساعَةِ</button>
    <button class="word-link" type="button" data-word="العُسرَةِ" data-root="AYN S R" data-root-meaning="Hardship and constraint that make performing an undertaking, enduring a situation, or obtaining a result difficult." data-context="Hardship: the difficult conditions in which the Prophet’s followers accompanied him." data-learn-more="/quran-terminology/en/roots/ayn-s-r/">العُسرَةِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After: the sequence in relation to the nearly occurring deviation.">بَعدِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كادَ" data-root="K W D" data-learn-more="/quran-terminology/en/roots/k-w-d/" data-root-meaning="To come close to the threshold of occurrence, to stand at the edge of doing or becoming, and to show intense readiness or pressure toward an event" data-context="Nearly: approaching the stated deviation.">كادَ</button>
    <button class="word-link" type="button" data-word="يَزيغُ" data-root="Z Y GH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-y-gh/" data-root-meaning="Inclining or deviating from a course or uprightness." data-context="Swerve: hearts inclining away from uprightness.">يَزيغُ</button>
    <button class="word-link" type="button" data-word="قُلوبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Hearts: the subject of the near deviation.">قُلوبُ</button>
    <button class="word-link" type="button" data-word="فَريقٍ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="A group: some of those followers.">فَريقٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="تابَ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy" data-context="Turned toward: repeating mercy and acceptance toward them.">تابَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِم</button>
    <button class="word-link" type="button" data-word="رَءوفٌ" data-root="R A F" data-learn-more="/quran-terminology/en/roots/r-a-f/" data-root-meaning="Compassion and raʾūf: tenderness, kindness and consideration for another, from human feeling to descriptions of The God and the Prophet in the Qur’an" data-context="Deeply compassionate: describing The God’s care toward them.">رَءوفٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful: describing The God’s mercy.">رَحيمٌ</button>
  </p>
  <p class="english-verse">The God has turned toward the Prophet, the emigrants, and the helpers who followed him in the hour of hardship, after the hearts of a group of them nearly swerved. Then He turned toward them. He is Kind, Merciful toward them.</p>
</section>
