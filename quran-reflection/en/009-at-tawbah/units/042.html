<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:42</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was, in the condition">كانَ</button>
    <button class="word-link" type="button" data-word="عَرَضًا" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="An available gain">عَرَضًا</button>
    <button class="word-link" type="button" data-word="قَريبًا" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Nearby, describing the gain">قَريبًا</button>
    <button class="word-link" type="button" data-word="وَسَفَرًا" data-root="S F R" data-root-meaning="Uncovering and becoming visible; established branches include traveling, brightening, books, and conveying writing or messages." data-context="A journey, qualified as moderate and manageable in the condition." data-learn-more="/quran-terminology/en/roots/s-f-r/">وَسَفَرًا</button>
    <button class="word-link" type="button" data-word="قاصِدًا" data-root="Q SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-sad-d/" data-root-meaning="Purposeful direction; also moderation or a middle course." data-context="Moderate and manageable, describing the journey">قاصِدًا</button>
    <button class="word-link" type="button" data-word="لَاتَّبَعوكَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="They would have followed you">لَاتَّبَعوكَ</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="بَعُدَت" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="Became distant, describing the route">بَعُدَت</button>
    <button class="word-link" type="button" data-word="عَلَيهِمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِمُ</button>
    <button class="word-link" type="button" data-word="الشُّقَّةُ" data-root="SH Q Q" data-learn-more="/quran-terminology/en/roots/sh-q-q/" data-root-meaning="Splitting, breach, side, hardship, distance, and oppositional rupture" data-context="The distant, difficult route">الشُّقَّةُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَسَيَحلِفونَ" data-root="H L F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-f/" data-root-meaning="Swearing an oath or entering a covenant or alliance." data-context="And will swear">وَسَيَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَوِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَوِ</button>
    <button class="word-link" type="button" data-word="استَطَعنا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="We had been able">استَطَعنا</button>
    <button class="word-link" type="button" data-word="لَخَرَجنا" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="We would have gone out">لَخَرَجنا</button>
    <button class="word-link" type="button" data-word="مَعَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَكُم</button>
    <button class="word-link" type="button" data-word="يُهلِكونَ" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="Destroy" data-learn-more="/quran-terminology/en/roots/h2-l-k/">يُهلِكونَ</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Themselves">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knows">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَكٰذِبونَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="They are certainly liars">لَكٰذِبونَ</button>
  </p>
  <p class="english-verse">Had it been a nearby gain and a moderate journey, they would have followed you, but the distance seemed too great to them. They will swear by The God, “Had we been able, we would have gone out with you.” They destroy themselves, and The God knows that they are liars.</p>
</section>
