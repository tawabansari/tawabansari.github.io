<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:107</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="اتَّخَذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Established or took, referring to the mosque adopted for the harmful purposes stated.">اتَّخَذوا</button>
    <button class="word-link" type="button" data-word="مَسجِدًا" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="A mosque, a building bearing the name and appearance of a place of worship whose purpose the verse criticizes.">مَسجِدًا</button>
    <button class="word-link" type="button" data-word="ضِرارًا" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="For causing harm, one stated purpose of the mosque in question.">ضِرارًا</button>
    <button class="word-link" type="button" data-word="وَكُفرًا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="And for rejection, one condemned purpose of establishing that mosque.">وَكُفرًا</button>
    <button class="word-link" type="button" data-word="وَتَفريقًا" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="And for creating division, separating the believers.">وَتَفريقًا</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between, identifying the believers among whom division is created.">بَينَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers, those among whom the mosque was intended to create division.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَإِرصادًا" data-root="R SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-sad-d/" data-root-meaning="Watching or lying in wait." data-context="And as a prepared base, providing a place for someone who had previously warred.">وَإِرصادًا</button>
    <button class="word-link" type="button" data-word="لِمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَن</button>
    <button class="word-link" type="button" data-word="حارَبَ" data-root="H R B" data-root-meaning="War and hostile confrontation; dispossession; in the miḥrāb branch, an elevated, distinguished place." data-context="Had warred: someone who had previously engaged in hostile confrontation against The God and His messenger." data-learn-more="/quran-terminology/en/roots/h-r-b/">حارَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And His messenger, alongside The God as the object of the prior hostile confrontation.">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before, locating the hostile confrontation earlier than the mosque’s establishment.">قَبلُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَلَيَحلِفُنَّ" data-root="H L F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-f/" data-root-meaning="Swearing an oath or entering a covenant or alliance." data-context="And they will surely swear, introducing the founders’ claim of good intentions.">وَلَيَحلِفُنَّ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="أَرَدنا" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="We intended, their claim about their purpose.">أَرَدنا</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الحُسنىٰ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Good, what the founders claim was their sole intention.">الحُسنىٰ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يَشهَدُ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Bears witness, The God’s testimony that their claim is false.">يَشهَدُ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَكٰذِبونَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Certainly liars, describing those who claim good intentions.">لَكٰذِبونَ</button>
  </p>
  <p class="english-verse">Those who took a mosque for harm, disbelief, division among the believers, and as an outpost for one who had fought The God and His Messenger before—they will surely swear, “We intended only good.” The God bears witness that they are liars.</p>
</section>
