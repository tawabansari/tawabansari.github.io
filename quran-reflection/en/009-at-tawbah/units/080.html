  <p class="english-verse">Ask forgiveness for them or do not ask forgiveness for them. Even if you ask forgiveness for them seventy times, The God will never forgive them. That is because they disbelieved in The God and His Messenger. The God does not guide the defiantly disobedient people.</p>
