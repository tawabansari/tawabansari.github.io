<section class="ayah-block" id="ayah-108" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:108</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَقُم" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="do not stand">تَقُم</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="أَبَدًا" data-root="ʾ B D" data-learn-more="/quran-terminology/en/roots/a-b-d/" data-root-meaning="Abadan: continuance throughout the future in view" data-context="ever">أَبَدًا</button>
    ۚ
    <button class="word-link" type="button" data-word="لَمَسجِدٌ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="a mosque">لَمَسجِدٌ</button>
    <button class="word-link" type="button" data-word="أُسِّسَ" data-root="A S S" data-learn-more="/quran-terminology/en/roots/a-s-s/" data-root-meaning="Laying a base or foundation upon which something’s construction or continuation rests; and, more broadly, beginning and establishing an undertaking on a particular basis." data-context="has been founded">أُسِّسَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="التَّقوىٰ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="mindfulness">التَّقوىٰ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَوَّلِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="first">أَوَّلِ</button>
    <button class="word-link" type="button" data-word="يَومٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="day">يَومٍ</button>
    <button class="word-link" type="button" data-word="أَحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="more worthy">أَحَقُّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَقومَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="you stand">تَقومَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="رِجالٌ" data-root="R J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="A man; also a foot and walking on foot, in different forms." data-context="men">رِجالٌ</button>
    <button class="word-link" type="button" data-word="يُحِبّونَ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="love">يُحِبّونَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَتَطَهَّروا" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state" data-context="to cleanse themselves">يَتَطَهَّروا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="loves">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُطَّهِّرينَ" data-root="Ṭ H R" data-learn-more="/quran-terminology/en/roots/tt-h2-r/" data-root-meaning="Purity, removing impurity, cleansing, and emerging from a polluted state" data-context="those who purify themselves">المُطَّهِّرينَ</button>
  </p>
  <p class="english-verse">Never stand in it. A mosque founded on mindfulness from the first day has a greater right that you stand in it. In it are men who love to purify themselves. The God loves those who purify themselves.</p>
</section>
