<section class="ayah-block" id="ayah-066" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:66</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَعتَذِروا" data-root="AYN DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-dh-r/" data-root-meaning="An excuse or explanation seeking to remove blame." data-context="Make excuses; prohibited here, do not make excuses">تَعتَذِروا</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="كَفَرتُم" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="You disbelieved">كَفَرتُم</button>
    <button class="word-link" type="button" data-word="بَعدَ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After">بَعدَ</button>
    <button class="word-link" type="button" data-word="إيمٰنِكُم" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Your belief">إيمٰنِكُم</button>

    <button class="word-link" type="button" data-word="نَعفُ" data-root="ʿ F W" data-learn-more="/quran-terminology/en/roots/ayn-f-w/" data-root-meaning="Passing over pursuit of a fault, lifting censure, effacing a trace, and what remains beyond need" data-context="We pardon">نَعفُ</button>

    <button class="word-link" type="button" data-word="طائِفَةٍ" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="A group">طائِفَةٍ</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="نُعَذِّب" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="We punish">نُعَذِّب</button>
    <button class="word-link" type="button" data-word="طائِفَةً" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="A group">طائِفَةً</button>

    <button class="word-link" type="button" data-word="مُجرِمينَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="Wrongdoers; those who commit wrongful acts" data-learn-more="/quran-terminology/en/roots/j-r-m/">مُجرِمينَ</button>
  </p>
  <p class="english-verse">Make no excuses. You have disbelieved after your faith. If We pardon a group among you, We will punish another group because they were guilty.</p>
