<section class="ayah-block" id="ayah-106" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:106</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاخَرونَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">وَءاخَرونَ</button>
    <button class="word-link" type="button" data-word="مُرجَونَ" data-root="R J A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-a/" data-root-meaning="Postponing or deferring; the hamzah is unpronounced in some forms.">مُرجَونَ</button>
    <button class="word-link" type="button" data-word="لِأَمرِ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">لِأَمرِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِمّا</button>
    <button class="word-link" type="button" data-word="يُعَذِّبُهُم" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">يُعَذِّبُهُم</button>
    <button class="word-link" type="button" data-word="وَإِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِمّا</button>
    <button class="word-link" type="button" data-word="يَتوبُ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy">يَتوبُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">حَكيمٌ</button>
  </p>
  <p class="english-verse">Others are deferred to the command of The God: He will either punish them or turn toward them. The God is Knowing, Wise.</p>
</section>
