  </p>
  <p class="english-verse">Has the news of those before them not reached them: the people of Noah, ‘Ad, Thamud, the people of Abraham, the people of Midian, and the overturned towns? Their messengers came to them with clear proofs. The God would not wrong them; they were wronging themselves.</p>
