<section class="ayah-block" id="ayah-070" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:70</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="يَأتِهِم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Reach them, concerning the report of earlier peoples.">يَأتِهِم</button>
    <button class="word-link" type="button" data-word="نَبَأُ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The report of earlier peoples and settlements.">نَبَأُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِهِم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before them, concerning earlier peoples.">قَبلِهِم</button>
    <button class="word-link" type="button" data-word="قَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="The people, in “the people of Nūḥ.”">قَومِ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="Proper name; no root has been assigned.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَعادٍ" data-root-note="Proper name; no root has been assigned.">وَعادٍ</button>
    <button class="word-link" type="button" data-word="وَثَمودَ" data-root-note="Proper name; no root has been assigned.">وَثَمودَ</button>
    <button class="word-link" type="button" data-word="وَقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And the people, in “the people of Ibrāhīm.”">وَقَومِ</button>
    <button class="word-link" type="button" data-word="إِبرٰهيمَ" data-root-note="Proper name; no root has been assigned.">إِبرٰهيمَ</button>
    <button class="word-link" type="button" data-word="وَأَصحٰبِ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="And the people or inhabitants, concerning Madyan.">وَأَصحٰبِ</button>
    <button class="word-link" type="button" data-word="مَديَنَ" data-root-note="Proper name; no root has been assigned.">مَديَنَ</button>
    <button class="word-link" type="button" data-word="وَالمُؤتَفِكٰتِ" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="And the overturned settlements; plural, among the histories recalled as warnings.">وَالمُؤتَفِكٰتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَتَتهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Came to them, concerning their Messengers.">أَتَتهُم</button>
    <button class="word-link" type="button" data-word="رُسُلُهُم" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Their Messengers, who came with clear signs.">رُسُلُهُم</button>
    <button class="word-link" type="button" data-word="بِالبَيِّنٰتِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="With clear signs or proofs.">بِالبَيِّنٰتِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; the verb of being, completed by its accompanying clause.">كانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لِيَظلِمَهُم" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="To wrong them, within the denial that The God would wrong them.">لِيَظلِمَهُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were or used to, concerning their past condition or conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Themselves, those whom they were wronging.">أَنفُسَهُم</button>
    <button class="word-link" type="button" data-word="يَظلِمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="They were wronging themselves.">يَظلِمونَ</button>
  </p>
  <p class="english-verse">Has the news of those before them not reached them: the people of Noah, ‘Ad, Thamud, the people of Abraham, the people of Midian, and the overturned towns? Their messengers came to them with clear proofs. The God would not wrong them; they were wronging themselves.</p>
</section>
