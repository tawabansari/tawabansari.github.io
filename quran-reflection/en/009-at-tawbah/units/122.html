<section class="ayah-block" id="ayah-122" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:122</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="It is not fitting; in the negative construction rejecting all believers departing together.">كانَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers; those whose collective departure is discussed.">المُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="لِيَنفِروا" data-root="N F R" data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Moving away, withdrawing and setting out; bolting and turning away. In nominal uses, a group of companions or supporters." data-context="All set out; the expression rejects the believers departing all together.">لِيَنفِروا</button>
    <button class="word-link" type="button" data-word="كافَّةً" data-root="K F F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-f-f/" data-root-meaning="The palm; restraining or desisting; kāffah means all together." data-context="All together; the departure of the entire body of believers.">كافَّةً</button>
    ۚ
    <button class="word-link" type="button" data-word="فَلَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَولا</button>
    <button class="word-link" type="button" data-word="نَفَرَ" data-root="N F R" data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Moving away, withdrawing and setting out; bolting and turning away. In nominal uses, a group of companions or supporters." data-context="Set out; departure of a party from each group, connected with understanding religion and warning.">نَفَرَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Each; within the reference to a party from every group.">كُلِّ</button>
    <button class="word-link" type="button" data-word="فِرقَةٍ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="Group; the community from which a party is mentioned.">فِرقَةٍ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="طائِفَةٌ" data-root="Ṭ W F" data-learn-more="/quran-terminology/en/roots/tt-w-f/" data-root-meaning="Going around, surrounding, circulation, and a group within a whole" data-context="A party; a part of each group whose departure is discussed.">طائِفَةٌ</button>
    <button class="word-link" type="button" data-word="لِيَتَفَقَّهوا" data-root="F Q H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-h2/" data-root-meaning="Understanding or comprehending speech or a matter." data-context="To gain understanding; understanding religion in connection with the division of responsibilities.">لِيَتَفَقَّهوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God" data-context="Religion; the subject of understanding in the expression.">الدّينِ</button>
    <button class="word-link" type="button" data-word="وَلِيُنذِروا" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="And to warn; conveying warning to their own people.">وَلِيُنذِروا</button>
    <button class="word-link" type="button" data-word="قَومَهُم" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Their people; those to whom the warning is conveyed.">قَومَهُم</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="رَجَعوا" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="They return; returning to the people or the other group, according to how the pronouns are read.">رَجَعوا</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَحذَرونَ" data-root="Ḥ DH R" data-learn-more="/quran-terminology/en/roots/h-dh-r/" data-root-meaning="Caution, alertness before danger, conscious fear of harm, practical readiness, and protective vigilance before damage occurs" data-context="Beware; take heed of the consequences after receiving the warning.">يَحذَرونَ</button>
  </p>
  <p class="english-verse">It is not for the believers to go forth all together. Why, then, does a group from every division of them not go forth to gain understanding in religion and warn their people when they return to them, so that they may beware?</p>
</section>
