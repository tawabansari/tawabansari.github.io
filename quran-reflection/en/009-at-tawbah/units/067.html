<section class="ayah-block" id="ayah-067" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:67</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="المُنٰفِقونَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">المُنٰفِقونَ</button>
    <button class="word-link" type="button" data-word="وَالمُنٰفِقٰتُ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">وَالمُنٰفِقٰتُ</button>
    <button class="word-link" type="button" data-word="بَعضُهُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضُهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="يَأمُرونَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution.">يَأمُرونَ</button>
    <button class="word-link" type="button" data-word="بِالمُنكَرِ" data-root="N K R" data-learn-more="/quran-terminology/en/roots/n-k-r/" data-root-meaning="Unfamiliarity, alienness, roughness, reprehensibility, denial, and being changed from a familiar and recognizable state.">بِالمُنكَرِ</button>
    <button class="word-link" type="button" data-word="وَيَنهَونَ" data-root="N H2 Y" data-root-note="Root study coming soon.">وَيَنهَونَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="المَعروفِ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity.">المَعروفِ</button>
    <button class="word-link" type="button" data-word="وَيَقبِضونَ" data-root="Q B DAD" data-root-note="Root study coming soon.">وَيَقبِضونَ</button>
    <button class="word-link" type="button" data-word="أَيدِيَهُم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">أَيدِيَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="نَسُوا" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">نَسُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="فَنَسِيَهُم" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">فَنَسِيَهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="المُنٰفِقينَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">المُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الفٰسِقونَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command">الفٰسِقونَ</button>
  </p>
  <p class="english-verse">The hypocritical men and women are of one another. They command what is wrong, forbid what is right, and withhold their hands. They forgot The God, so He forgot them. The hypocrites are the defiantly disobedient.</p>
</section>
