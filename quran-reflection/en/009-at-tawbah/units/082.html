<section class="ayah-block" id="ayah-082" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:82</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَليَضحَكوا" data-root="DAD H K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-h-k/" data-root-meaning="Laughing or showing joy." data-context="So let them laugh a little, in a warning to those who refused to accompany the Messenger.">فَليَضحَكوا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="A little: the extent of laughter contrasted with much weeping.">قَليلًا</button>
    <button class="word-link" type="button" data-word="وَليَبكوا" data-root="B K Y" data-root-meaning="B K Y denotes weeping: the manifestation of a state that may involve tears, lamenting sounds, or sorrow and emotional response. In its causative form, it expresses making someone weep or causing weeping." data-context="And let them weep much: a warning and recompense for the conduct of the group concerned, rather than a general command to cry." data-learn-more="/quran-terminology/en/roots/b-k-y/">وَليَبكوا</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Much: the extent of weeping contrasted with little laughter.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="جَزاءً" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="Recompense corresponding to their deeds.">جَزاءً</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Used to: with the following verb, describes their continuing past conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="They used to earn: deeds whose consequences and recompense return to them.">يَكسِبونَ</button>
  </p>
  <p class="english-verse">Let them laugh a little and weep much, as recompense for what they used to earn.</p>
</section>
