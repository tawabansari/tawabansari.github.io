<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَرقُبونَ" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="In lā yarqubūn: they do not respect a bond or covenant concerning a believer." data-learn-more="/quran-terminology/en/roots/r-q-b/">يَرقُبونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="مُؤمِنٍ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Any believer: an indefinite noun under negation, describing the group’s conduct toward every believer.">مُؤمِنٍ</button>
    <button class="word-link" type="button" data-word="إِلًّا" data-root="A L L" data-learn-more="/quran-terminology/en/roots/a-l-l/" data-root-meaning="A human bond arising from kinship, covenant, alliance, or another recognized relationship, requiring respect for the other party’s standing and rights." data-context="A bond requiring respect, such as kinship or alliance: what they fail to observe.">إِلًّا</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="ذِمَّةً" data-root="DH M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-m-m/" data-root-meaning="Blame and reproach; dhimmah is a covenant or binding obligation." data-context="A covenant, protection, or binding commitment that this group does not uphold.">ذِمَّةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="المُعتَدونَ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="The aggressors: those overstepping limits by disregarding bonds and commitments.">المُعتَدونَ</button>
  </p>
  <p class="english-verse">They observe neither kinship nor a covenant toward a believer. They are the transgressors.</p>
</section>
