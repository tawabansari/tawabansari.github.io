<section class="ayah-block" id="ayah-013" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:13</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلا</button>
    <button class="word-link" type="button" data-word="تُقٰتِلونَ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="You fight them, engaging in combat">تُقٰتِلونَ</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life; also qawm: a people or community sharing a connection." data-context="A people, a connected group">قَومًا</button>
    <button class="word-link" type="button" data-word="نَكَثوا" data-root="N K TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-th/" data-root-meaning="Unraveling a strand; figuratively, breaking a covenant." data-context="Broke, violating their pledges">نَكَثوا</button>
    <button class="word-link" type="button" data-word="أَيمٰنَهُم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Their oaths and pledges">أَيمٰنَهُم</button>
    <button class="word-link" type="button" data-word="وَهَمّوا" data-root="H2 M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-m-m/" data-root-meaning="Distress or preoccupation; hamm can denote intention or resolve." data-context="And intended or resolved">وَهَمّوا</button>
    <button class="word-link" type="button" data-word="بِإِخراجِ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Expelling, driving out">بِإِخراجِ</button>
    <button class="word-link" type="button" data-word="الرَّسولِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="The Messenger, the one sent to convey the message">الرَّسولِ</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="بَدَءوكُم" data-root="B D A" data-root-meaning="Beginning, doing something initially or starting an activity or process; in creation contexts, bringing forth initially." data-learn-more="/quran-terminology/en/roots/b-d-a/" data-context="They began against you first, here taking the initiative in hostility">بَدَءوكُم</button>
    <button class="word-link" type="button" data-word="أَوَّلَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="First">أَوَّلَ</button>
    <button class="word-link" type="button" data-word="مَرَّةٍ" data-root="M R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing or recurrence; also bitterness or strength in different forms." data-context="An occasion or time">مَرَّةٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="أَتَخشَونَهُم" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God" data-context="Do you fear them?">أَتَخشَونَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="فَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">فَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَحَقُّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="More entitled or worthy">أَحَقُّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَخشَوهُ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God" data-context="You hold Him in reverent fear">تَخشَوهُ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You are">كُنتُم</button>
    <button class="word-link" type="button" data-word="مُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believers">مُؤمِنينَ</button>
  </p>
  <p class="english-verse">Will you not fight a people who broke their oaths, intended to expel the Messenger, and began against you the first time? Do you fear them? The God has a greater right that you fear Him, if you are believers.</p>
</section>
