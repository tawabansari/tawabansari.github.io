<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="حَسِبتُم" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="You supposed; questioning the expectation of being left untested.">حَسِبتُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تُترَكوا" data-root="T R K" data-learn-more="/quran-terminology/en/roots/t-r-k/" data-root-meaning="Leaving, abandoning, letting go, leaving something behind, and changing one’s active relation to it" data-context="You are left; being left without trial, questioned here.">تُترَكوا</button>
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="يَعلَمِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knows; those who strive becoming manifest.">يَعلَمِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="جٰهَدوا" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="Strove; those whose striving and loyalty become evident through testing." data-learn-more="/quran-terminology/en/roots/j-h2-d/">جٰهَدوا</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَم</button>
    <button class="word-link" type="button" data-word="يَتَّخِذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Took; choosing a confidant, negated by lam.">يَتَّخِذوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Other than; excluding the stated references.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="رَسولِهِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="His Messenger; among the stated objects of trust.">رَسولِهِ</button>
    <button class="word-link" type="button" data-word="وَلَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَا</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believers; the community named in the trust relationship.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَليجَةً" data-root="W L J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-l-j/" data-root-meaning="Entering; walījah is a close confidant or intimate." data-context="Confidant; someone admitted to intimate affairs and secrets.">وَليجَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware; knowing the addressees’ conduct." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="You do; the addressees’ actions.">تَعمَلونَ</button>
  </p>
  <p class="english-verse">Did you think you would be left alone while The God has not yet known those among you who strive and take no confidant apart from The God, His Messenger, and the believers? The God is aware of what you do.</p>
</section>
