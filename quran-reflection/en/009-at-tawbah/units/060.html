<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّمَا</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتُ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">الصَّدَقٰتُ</button>
    <button class="word-link" type="button" data-word="لِلفُقَراءِ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity.">لِلفُقَراءِ</button>
    <button class="word-link" type="button" data-word="وَالمَسٰكينِ" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling">وَالمَسٰكينِ</button>
    <button class="word-link" type="button" data-word="وَالعٰمِلينَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">وَالعٰمِلينَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="وَالمُؤَلَّفَةِ" data-root="ʾ L F" data-learn-more="/quran-terminology/en/roots/a-l-f/" data-root-meaning="Allafa: joining, becoming familiar, and establishing affinity and companionship">وَالمُؤَلَّفَةِ</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">قُلوبُهُم</button>
    <button class="word-link" type="button" data-word="وَفِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفِى</button>
    <button class="word-link" type="button" data-word="الرِّقابِ" data-root="R Q B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-q-b/" data-root-meaning="The neck; also watching or awaiting; raqabah can stand for a person.">الرِّقابِ</button>
    <button class="word-link" type="button" data-word="وَالغٰرِمينَ" data-root="GH R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-m/" data-root-meaning="Binding loss or debt; gharām denotes persistent suffering or attachment.">وَالغٰرِمينَ</button>
    <button class="word-link" type="button" data-word="وَفى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَابنِ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">وَابنِ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">السَّبيلِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَريضَةً" data-root="F R DAD (F R Ḍ)" data-learn-more="/quran-terminology/en/roots/f-r-dad/" data-root-meaning="From marking and assigning a share to an appointed matter.">فَريضَةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">حَكيمٌ</button>
  </p>
  <p class="english-verse">Charities are only for the poor, the needy, those who work on them, those whose hearts are brought together, the freeing of those in bondage, debtors, the way of The God, and the traveler—a duty from The God. The God is Knowing, Wise.</p>
</section>
