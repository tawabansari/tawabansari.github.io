<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّمَا</button>
    <button class="word-link" type="button" data-word="الصَّدَقٰتُ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Charitable contributions; the financial resources allocated in the verse.">الصَّدَقٰتُ</button>
    <button class="word-link" type="button" data-word="لِلفُقَراءِ" data-root="F Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-r/" data-root-meaning="Need or poverty; fāqirah is a crushing calamity." data-context="For the poor; one group of recipients.">لِلفُقَراءِ</button>
    <button class="word-link" type="button" data-word="وَالمَسٰكينِ" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling" data-context="And those in need; another recipient category.">وَالمَسٰكينِ</button>
    <button class="word-link" type="button" data-word="وَالعٰمِلينَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="And those administering them; people responsible for the contributions.">وَالعٰمِلينَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="وَالمُؤَلَّفَةِ" data-root="ʾ L F" data-learn-more="/quran-terminology/en/roots/a-l-f/" data-root-meaning="Allafa: joining, becoming familiar, and establishing affinity and companionship" data-context="And those being brought together; in the construction with qulūbuhum, their hearts.">وَالمُؤَلَّفَةِ</button>
    <button class="word-link" type="button" data-word="قُلوبُهُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Their hearts; the object of reconciliation in the preceding expression.">قُلوبُهُم</button>
    <button class="word-link" type="button" data-word="وَفِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفِى</button>
    <button class="word-link" type="button" data-word="الرِّقابِ" data-root="R Q B" data-root-meaning="Watching, guarding, waiting, and observing an obligation; raqabah: the neck and, by extension, a whole person or someone in bondage." data-context="People in bondage; part of charitable contributions is allocated toward their release, with differing interpretations of its implementation." data-learn-more="/quran-terminology/en/roots/r-q-b/">الرِّقابِ</button>
    <button class="word-link" type="button" data-word="وَالغٰرِمينَ" data-root="GH R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-m/" data-root-meaning="Binding loss or debt; gharām denotes persistent suffering or attachment." data-context="And debtors; a recipient category.">وَالغٰرِمينَ</button>
    <button class="word-link" type="button" data-word="وَفى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Way; in the expression sabīl Allāh among the allocations.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَابنِ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole" data-context="And son; within the idiom ibn al-sabīl, a stranded traveler.">وَابنِ</button>
    <button class="word-link" type="button" data-word="السَّبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; the second component of the expression for a traveler.">السَّبيلِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَريضَةً" data-root="F R DAD (F R Ḍ)" data-learn-more="/quran-terminology/en/roots/f-r-dad/" data-root-meaning="From marking and assigning a share to an appointed matter." data-context="A prescribed obligation; describing this allocation from The God.">فَريضَةً</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; describing The God.">عَليمٌ</button>
    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise; describing The God at the end of the provision.">حَكيمٌ</button>
  </p>
  <p class="english-verse">Charities are only for the poor, the needy, those who work on them, those whose hearts are brought together, the freeing of those in bondage, debtors, the way of The God, and the traveler—a duty from The God. The God is Knowing, Wise.</p>
</section>
