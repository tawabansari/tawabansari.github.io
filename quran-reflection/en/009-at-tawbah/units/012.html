<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="نَكَثوا" data-root="N K TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-th/" data-root-meaning="Unraveling a strand; figuratively, breaking a covenant." data-context="Broke, violating oaths after a covenant.">نَكَثوا</button>
    <button class="word-link" type="button" data-word="أَيمٰنَهُم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Their oaths, the commitments broken.">أَيمٰنَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِ" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After, locating the violation relative to the covenant.">بَعدِ</button>
    <button class="word-link" type="button" data-word="عَهدِهِم" data-root="ʿ H D" data-learn-more="/quran-terminology/en/roots/ayn-h2-d/" data-root-meaning="Knowing with obligation, covenant, care, preservation, and accountability" data-context="Their covenant, the earlier commitment.">عَهدِهِم</button>
    <button class="word-link" type="button" data-word="وَطَعَنوا" data-root="TT AYN N" data-learn-more="/quran-terminology/en/roots/tt-ayn-n/" data-root-meaning="A focused, penetrating strike; and in speech, an attack that tries to wound trust, covenant, or religious integrity." data-context="And attacked, assailing the addressees’ religion.">وَطَعَنوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="دينِكُم" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God" data-context="Your religion, what the covenant-breakers assail.">دينِكُم</button>
    <button class="word-link" type="button" data-word="فَقٰتِلوا" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="Then fight, the response stated to covenant-breaking and attack.">فَقٰتِلوا</button>
    <button class="word-link" type="button" data-word="أَئِمَّةَ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="Leaders, those leading rejection in this context.">أَئِمَّةَ</button>
    <button class="word-link" type="button" data-word="الكُفرِ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Rejection, identifying the leaders’ orientation.">الكُفرِ</button>
    ۙ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="أَيمٰنَ" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Oaths, in the denial of their commitment to pledges.">أَيمٰنَ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَنتَهونَ" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="Desist, stopping covenant-breaking and hostile conduct." data-learn-more="/quran-terminology/en/roots/n-h2-y/">يَنتَهونَ</button>
  </p>
  <p class="english-verse">If they break their oaths after their treaty and assail your religion, fight the leaders of disbelief; their oaths are nothing, so that they may desist.</p>
</section>
