  <h2 class="ayah-title">At-Tawbah 9:79</h2>

    <button class="word-link" type="button" data-word="يَلمِزونَ" data-root="L M Z" data-root-meaning="Lamz is injurious faultfinding and disparagement directed at a person or their conduct, carried out through speech, insinuation, or gesture, and commonly accompanied by taunting and contempt in Qur’anic usage." data-learn-more="/quran-terminology/en/roots/l-m-z/">يَلمِزونَ</button>
    <button class="word-link" type="button" data-word="المُطَّوِّعينَ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">المُطَّوِّعينَ</button>

    <button class="word-link" type="button" data-word="سَخِرَ" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/">سَخِرَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>

  <p class="english-verse">Those who criticize believers who give charity voluntarily, and those who find nothing beyond their effort, and mock them—The God mocks them, and they have a painful punishment.</p>
