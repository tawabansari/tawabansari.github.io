<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:56</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَحلِفونَ" data-root="H L F" data-root-meaning="Swearing an oath to affirm a claim or strengthen a commitment; حَلَّاف describes someone who swears frequently." data-context="And they swear to claim membership in the addressees’ community." data-learn-more="/quran-terminology/en/roots/h-l-f/">وَيَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="لَمِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمِنكُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="مِنكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُم</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنَّهُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="A people; describing those who swear.">قَومٌ</button>
    <button class="word-link" type="button" data-word="يَفرَقونَ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="They are afraid; fear underlying their claim of belonging.">يَفرَقونَ</button>
  </p>
  <p class="english-verse">They swear by The God that they are of you, but they are not of you. They are a people who are afraid.</p>
</section>
