<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:98</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الأَعرابِ" data-root="AYN R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-b/" data-root-meaning="ʿArabī relates to Arabic or Arabs; aʿrāb are desert dwellers; ʿurub means affectionate or devoted.">الأَعرابِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَتَّخِذُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">يَتَّخِذُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُنفِقُ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">يُنفِقُ</button>
    <button class="word-link" type="button" data-word="مَغرَمًا" data-root="GH R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-m/" data-root-meaning="Binding loss or debt; gharām denotes persistent suffering or attachment.">مَغرَمًا</button>
    <button class="word-link" type="button" data-word="وَيَتَرَبَّصُ" data-root="R B SAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-b-sad/" data-root-meaning="Waiting and watching for an event.">وَيَتَرَبَّصُ</button>
    <button class="word-link" type="button" data-word="بِكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِكُمُ</button>
    <button class="word-link" type="button" data-word="الدَّوائِرَ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">الدَّوائِرَ</button>
    ۚ
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="دائِرَةُ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">دائِرَةُ</button>
    <button class="word-link" type="button" data-word="السَّوءِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">السَّوءِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="سَميعٌ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">سَميعٌ</button>
    <button class="word-link" type="button" data-word="عَليمٌ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عَليمٌ</button>
  </p>
  <p class="english-verse">Among the desert Arabs are those who regard what they spend as a loss and await turns of fortune against you. Upon them is the evil turn. The God is Hearing, Knowing.</p>
</section>
