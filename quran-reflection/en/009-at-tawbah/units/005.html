<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="انسَلَخَ" data-root="S L KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-l-kh/" data-root-meaning="Skinning or stripping a covering; figuratively, emerging or coming to an end.">انسَلَخَ</button>
    <button class="word-link" type="button" data-word="الأَشهُرُ" data-root="SH H2 R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h2-r/" data-root-meaning="A month as a period of time.">الأَشهُرُ</button>
    <button class="word-link" type="button" data-word="الحُرُمُ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation">الحُرُمُ</button>
    <button class="word-link" type="button" data-word="فَاقتُلُوا" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">فَاقتُلُوا</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">المُشرِكينَ</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَيثُ</button>
    <button class="word-link" type="button" data-word="وَجَدتُموهُم" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception">وَجَدتُموهُم</button>
    <button class="word-link" type="button" data-word="وَخُذوهُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">وَخُذوهُم</button>
    <button class="word-link" type="button" data-word="وَاحصُروهُم" data-root="H SAD R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sad-r/" data-root-meaning="Restricting, preventing, and confining; ḥaṣūr means self-restrained.">وَاحصُروهُم</button>
    <button class="word-link" type="button" data-word="وَاقعُدوا" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations">وَاقعُدوا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلَّ</button>
    <button class="word-link" type="button" data-word="مَرصَدٍ" data-root="R SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-sad-d/" data-root-meaning="Watching or lying in wait.">مَرصَدٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="تابوا" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy">تابوا</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَءاتَوُا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَءاتَوُا</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةَ" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness.">الزَّكوٰةَ</button>
    <button class="word-link" type="button" data-word="فَخَلّوا" data-root="KH L W" data-learn-more="/quran-terminology/en/roots/kh-l-w/" data-root-meaning="Becoming empty, withdrawing into privacy, leaving the public field, being alone, becoming free of obstruction, and separating from open visibility">فَخَلّوا</button>
    <button class="word-link" type="button" data-word="سَبيلَهُم" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel">سَبيلَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحيمٌ</button>
  </p>
  <p class="english-verse">When the sacred months have passed, kill the associators wherever you find them, seize them, besiege them, and sit in wait for them at every lookout. If they repent, establish prayer, and give zakat, let them go their way. The God is Forgiving, Merciful.</p>
</section>
