<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="عٰهَدتُم" data-root="ʿ H D" data-learn-more="/quran-terminology/en/roots/ayn-h2-d/" data-root-meaning="Knowing with obligation, covenant, care, preservation, and accountability">عٰهَدتُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">المُشرِكينَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَنقُصوكُم" data-root="N Q Ṣ" data-learn-more="/quran-terminology/en/roots/n-q-sad/" data-root-meaning="Decreasing, diminishing and deficiency: from losses of wealth and produce to withholding others’ rights, a reduced lifespan and changing territorial limits">يَنقُصوكُم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَم</button>
    <button class="word-link" type="button" data-word="يُظٰهِروا" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support">يُظٰهِروا</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="أَحَدًا" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation">أَحَدًا</button>
    <button class="word-link" type="button" data-word="فَأَتِمّوا" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete.">فَأَتِمّوا</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="عَهدَهُم" data-root="ʿ H D" data-learn-more="/quran-terminology/en/roots/ayn-h2-d/" data-root-meaning="Knowing with obligation, covenant, care, preservation, and accountability">عَهدَهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="مُدَّتِهِم" data-root="M D D" data-learn-more="/quran-terminology/en/roots/m-d-d/" data-root-meaning="Stretching, extending, continuing, granting respite, adding support, and opening a wider field">مُدَّتِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-root-meaning="Ḥubb: love or affection; ḥabb and ḥabbah: grain or a seed. These branches are not interchangeable.">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="المُتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">المُتَّقينَ</button>
  </p>
  <p class="english-verse">Except those associators with whom you made a treaty, who then did not diminish anything due to you or support anyone against you. Fulfill their treaty with them until its term. The God loves the mindful.</p>
</section>
