<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:85</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُعجِبكَ" data-root="AYN J B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-j-b/" data-root-meaning="Wonder; iʿjāb denotes admiration or astonishment.">تُعجِبكَ</button>
    <button class="word-link" type="button" data-word="أَموٰلُهُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">أَموٰلُهُم</button>
    <button class="word-link" type="button" data-word="وَأَولٰدُهُم" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth">وَأَولٰدُهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُعَذِّبَهُم" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">يُعَذِّبَهُم</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="وَتَزهَقَ" data-root="Z H2 Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-h2-q/" data-root-meaning="Departing, perishing, or vanishing.">وَتَزهَقَ</button>
    <button class="word-link" type="button" data-word="أَنفُسُهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">أَنفُسُهُم</button>
    <button class="word-link" type="button" data-word="وَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُم</button>
    <button class="word-link" type="button" data-word="كٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كٰفِرونَ</button>
  </p>
  <p class="english-verse">Do not let their wealth or their children impress you. The God only intends to punish them through these in this world and for their souls to depart while they are disbelievers.</p>
</section>
