<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; within the denial that associators are entitled to maintain the places of worship.">كانَ</button>
    <button class="word-link" type="button" data-word="لِلمُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="For the associators; those who associate partners with The God.">لِلمُشرِكينَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَعمُروا" data-root="ʿ M R" data-learn-more="/quran-terminology/en/roots/ayn-m-r/" data-root-meaning="ʿAmara: the continuation of life, inhabited places, and enduring presence" data-context="To maintain; tending and maintaining the places of worship.">يَعمُروا</button>
    <button class="word-link" type="button" data-word="مَسٰجِدَ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Places of worship; places of prostration and worship.">مَسٰجِدَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شٰهِدينَ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="Bearing witness; testifying against themselves to unbelief.">شٰهِدينَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Themselves; those against whom their own testimony stands.">أَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="بِالكُفرِ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="To unbelief; what they attest concerning themselves.">بِالكُفرِ</button>
    ۚ
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="حَبِطَت" data-root="H B TT" data-root-meaning="A deed losing its fruit and value; in Form IV, rendering it fruitless and ineffective." data-context="Have come to nothing; the deeds of associators testifying to their own unbelief." data-learn-more="/quran-terminology/en/roots/h-b-tt/">حَبِطَت</button>
    <button class="word-link" type="button" data-word="أَعمٰلُهُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Their deeds; the actions of that group.">أَعمٰلُهُم</button>
    <button class="word-link" type="button" data-word="وَفِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَفِى</button>
    <button class="word-link" type="button" data-word="النّارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="The Fire; the place in which they remain.">النّارِ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="خٰلِدونَ" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place" data-context="Remaining; abiding in the Fire.">خٰلِدونَ</button>
  </p>
  <p class="english-verse">It is not for the associators to maintain the mosques of The God while testifying against themselves to disbelief. Their deeds have come to nothing, and in the Fire they will remain.</p>
</section>
