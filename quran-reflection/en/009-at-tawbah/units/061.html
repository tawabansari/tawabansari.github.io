  <p class="english-verse">Among them are those who hurt the Prophet and say, “He is an ear.” Say, “An ear of good for you. He believes in The God, trusts the believers, and is a mercy for those among you who believe.” Those who hurt the Messenger of The God have a painful punishment.</p>
