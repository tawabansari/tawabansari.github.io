<section class="ayah-block" id="ayah-095" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:95</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَيَحلِفونَ" data-root="H L F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-f/" data-root-meaning="Swearing an oath or entering a covenant or alliance." data-context="They will swear oaths.">سَيَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="إِذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذَا</button>
    <button class="word-link" type="button" data-word="انقَلَبتُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="You return, referring to coming back to them.">انقَلَبتُم</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="لِتُعرِضوا" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="So that you turn aside and leave them alone.">لِتُعرِضوا</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَأَعرِضوا" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="So turn away.">فَأَعرِضوا</button>
    <button class="word-link" type="button" data-word="عَنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="رِجسٌ" data-root="R J S" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-s/" data-root-meaning="Physical or moral uncleanness, according to context." data-context="Foulness or a condemned condition, describing them here.">رِجسٌ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُم" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="An abode, dwelling, or place of refuge, without necessarily implying safety or comfort." data-context="Their abode, Hell.">وَمَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمُ</button>
    <button class="word-link" type="button" data-word="جَزاءً" data-root="J Z Y" data-learn-more="/quran-terminology/en/roots/j-z-y/" data-root-meaning="Sufficing, standing in place of another, and settling the account of an act, right, or obligation through a fitting response" data-context="As recompense for their conduct.">جَزاءً</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were, in the construction describing former conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يَكسِبونَ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="They earned, bringing about the results of their conduct.">يَكسِبونَ</button>
  </p>
  <p class="english-verse">They will swear by The God to you when you return to them, so that you may turn away from them. Turn away from them; they are defilement, and their refuge is Hell, as recompense for what they used to earn.</p>
</section>
