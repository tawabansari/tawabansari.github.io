<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:112</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="التّٰئِبونَ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy" data-context="Those who repent and return to the right course.">التّٰئِبونَ</button>
    <button class="word-link" type="button" data-word="العٰبِدونَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Those who worship.">العٰبِدونَ</button>
    <button class="word-link" type="button" data-word="الحٰمِدونَ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd" data-context="Those who praise.">الحٰمِدونَ</button>
    <button class="word-link" type="button" data-word="السّٰئِحونَ" data-root="S Y H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-h/" data-root-meaning="Traveling through the land; sāʾiḥ is also explained as fasting in some interpretations." data-context="Those who travel; also interpreted as those who fast.">السّٰئِحونَ</button>
    <button class="word-link" type="button" data-word="الرّٰكِعونَ" data-root="R K ʿ (R K Ayn)" data-learn-more="/quran-terminology/en/roots/r-k-ayn/" data-root-meaning="Bending, lowering the body, coming down from uprightness, and showing submission through the body." data-context="Those who bow in worship.">الرّٰكِعونَ</button>
    <button class="word-link" type="button" data-word="السّٰجِدونَ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Those who prostrate.">السّٰجِدونَ</button>
    <button class="word-link" type="button" data-word="الـٔامِرونَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Those who enjoin what is right.">الـٔامِرونَ</button>
    <button class="word-link" type="button" data-word="بِالمَعروفِ" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="What is recognized as right.">بِالمَعروفِ</button>
    <button class="word-link" type="button" data-word="وَالنّاهونَ" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="And those who forbid what is wrong." data-learn-more="/quran-terminology/en/roots/n-h2-y/">وَالنّاهونَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُنكَرِ" data-root="N K R" data-learn-more="/quran-terminology/en/roots/n-k-r/" data-root-meaning="Unfamiliarity, alienness, roughness, reprehensibility, denial, and being changed from a familiar and recognizable state." data-context="What is wrong or disapproved.">المُنكَرِ</button>
    <button class="word-link" type="button" data-word="وَالحٰفِظونَ" data-root="H F ZHA" data-root-meaning="Keeping and caring for something so that it is not lost, forgotten, abandoned, or ruined." data-context="And those who keep and observe the limits of The God." data-learn-more="/quran-terminology/en/roots/h-f-zha/">وَالحٰفِظونَ</button>
    <button class="word-link" type="button" data-word="لِحُدودِ" data-root="H D D" data-root-meaning="Boundary and limit; prevention, sharpness, and cutting." data-context="Concerning the limits or established boundaries." data-learn-more="/quran-terminology/en/roots/h-d-d/">لِحُدودِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَبَشِّرِ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="And give good news.">وَبَشِّرِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers, recipients of good news.">المُؤمِنينَ</button>
  </p>
  <p class="english-verse">Those who repent, worship, praise, travel, bow, prostrate, command what is right, forbid what is wrong, and guard the limits of The God. Give good news to the believers.</p>
</section>
