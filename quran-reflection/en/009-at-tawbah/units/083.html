    <button class="word-link" type="button" data-word="الخٰلِفينَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">الخٰلِفينَ</button>

  <p class="english-verse">If The God returns you to a group of them and they ask your permission to go out, say, “You will never go out with me, nor will you fight an enemy alongside me. You were content to sit the first time, so sit with those who remain behind.”</p>
