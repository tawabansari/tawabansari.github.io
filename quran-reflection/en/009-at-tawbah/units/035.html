<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>

    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="نارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">نارِ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>

    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>

    <button class="word-link" type="button" data-word="لِأَنفُسِكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">لِأَنفُسِكُم</button>

    <button class="word-link" type="button" data-word="تَكنِزونَ" data-root="K N Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-z/" data-root-meaning="Accumulating or storing wealth.">تَكنِزونَ</button>
  </p>
  <p class="english-verse">On the day it is heated in the fire of Hell and their foreheads, sides, and backs are branded with it: “This is what you hoarded for yourselves, so taste what you used to hoard.”</p>
