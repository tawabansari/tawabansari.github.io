<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On the day when; introducing the time when the hoarded wealth is heated and used for branding.">يَومَ</button>
    <button class="word-link" type="button" data-word="يُحمىٰ" data-root="H M Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-y/" data-root-meaning="Heat and burning; also protection against encroachment; ḥamiyyah denotes zealous pride or partisanship." data-context="It is heated; referring to the hoarded gold and silver over which fire is kindled.">يُحمىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="نارِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="Fire; the fire in which the hoarded wealth is heated.">نارِ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="فَتُكوىٰ" data-root="K W Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-w-y/" data-root-meaning="Branding or burning with heat or hot metal." data-context="Then they are branded with it; the foreheads, sides, and backs are burned with the heated hoard.">فَتُكوىٰ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="جِباهُهُم" data-root="J B H2" data-root-meaning="the forehead and front of the face; in extended uses: direct encounter, confrontation, and a prominent position." data-context="Their foreheads; one of the three bodily regions that the verse describes as being branded." data-learn-more="/quran-terminology/en/roots/j-b-h2/">جِباهُهُم</button>
    <button class="word-link" type="button" data-word="وَجُنوبُهُم" data-root="J N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-n-b/" data-root-meaning="A side, flank, or region; ijtināb: keeping away; junub denotes a particular ritual condition." data-context="And their sides; the second bodily region mentioned as being branded.">وَجُنوبُهُم</button>
    <button class="word-link" type="button" data-word="وَظُهورُهُم" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support" data-context="And their backs; the third bodily region mentioned as being branded.">وَظُهورُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كَنَزتُم" data-root="K N Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-z/" data-root-meaning="Accumulating or storing wealth." data-context="You hoarded; addressing those who accumulated and stored this wealth for themselves.">كَنَزتُم</button>
    <button class="word-link" type="button" data-word="لِأَنفُسِكُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="For yourselves; those for whose own benefit the wealth had been hoarded.">لِأَنفُسِكُم</button>
    <button class="word-link" type="button" data-word="فَذوقوا" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="So taste; a command to experience the painful consequence of what they hoarded.">فَذوقوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كُنتُم" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="You were; with the following verb, expressing their past practice of hoarding.">كُنتُم</button>
    <button class="word-link" type="button" data-word="تَكنِزونَ" data-root="K N Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-z/" data-root-meaning="Accumulating or storing wealth." data-context="You used to hoard; accumulating and storing wealth.">تَكنِزونَ</button>
  </p>
  <p class="english-verse">On the day it is heated in the fire of Hell and their foreheads, sides, and backs are branded with it: “This is what you hoarded for yourselves, so taste what you used to hoard.”</p>
</section>
