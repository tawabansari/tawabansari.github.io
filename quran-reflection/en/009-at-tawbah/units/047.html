  <h2 class="ayah-title">At-Tawbah 9:47</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="خَرَجوا" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">خَرَجوا</button>
    <button class="word-link" type="button" data-word="فيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="زادوكُم" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure">زادوكُم</button>

  </p>
  <p class="english-verse">Had they gone out among you, they would have added nothing to you but disorder and hurried about among you, seeking turmoil for you. Among you are those who listen to them. The God knows the unjust.</p>
