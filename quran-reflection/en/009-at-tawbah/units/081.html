<section class="ayah-block" id="ayah-081" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:81</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَرِحَ" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context." data-context="Rejoiced; the pleasure of those who remained behind.">فَرِحَ</button>
    <button class="word-link" type="button" data-word="المُخَلَّفونَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Those left behind, who did not join the expedition.">المُخَلَّفونَ</button>
    <button class="word-link" type="button" data-word="بِمَقعَدِهِم" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="At their remaining seated; their staying behind.">بِمَقعَدِهِم</button>
    <button class="word-link" type="button" data-word="خِلٰفَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Behind and contrary to the messenger, by not accompanying him.">خِلٰفَ</button>
    <button class="word-link" type="button" data-word="رَسولِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="The messenger of The God, whom they did not accompany.">رَسولِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَكَرِهوا" data-root="K R H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-h2/" data-root-meaning="Dislike or hardship; ikrāh means compulsion against one&#x27;s will." data-context="And they disliked striving with their wealth and lives.">وَكَرِهوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُجٰهِدوا" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="To strive with their wealth and lives in the way of The God." data-learn-more="/quran-terminology/en/roots/j-h2-d/">يُجٰهِدوا</button>
    <button class="word-link" type="button" data-word="بِأَموٰلِهِم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="With their wealth; the material resources for striving.">بِأَموٰلِهِم</button>
    <button class="word-link" type="button" data-word="وَأَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="And their lives; their personal participation in striving.">وَأَنفُسِهِم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; the course of service to The God.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَقالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they said; introducing their advice not to go forth.">وَقالوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَنفِروا" data-root="N F R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-r/" data-root-meaning="Setting out; also aversion or fleeing away." data-context="Do not go forth; they discourage setting out in the heat.">تَنفِروا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الحَرِّ" data-root="H R R" data-root-meaning="Freedom, release, or exclusive dedication; in another branch, heat and scorching; ḥarīr: silk." data-context="The heat of the weather, invoked by those who stayed behind as a reason not to set out." data-learn-more="/quran-terminology/en/roots/h-r-r/">الحَرِّ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the messenger is instructed to answer.">قُل</button>
    <button class="word-link" type="button" data-word="نارُ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="Fire; Hell’s fire in the comparison of heat.">نارُ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="More intense; the greater intensity of Hell’s heat.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="حَرًّا" data-root="H R R" data-root-meaning="Freedom, release, or exclusive dedication; in another branch, heat and scorching; ḥarīr: silk." data-context="Heat; the heat of Hell’s fire, whose greater intensity is expressed separately by ashadd." data-learn-more="/quran-terminology/en/roots/h-r-r/">حَرًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were; with the following verb, forming the conditional expression.">كانوا</button>
    <button class="word-link" type="button" data-word="يَفقَهونَ" data-root="F Q H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-h2/" data-root-meaning="Understanding or comprehending speech or a matter." data-context="They understood; grasping the warning and comparison.">يَفقَهونَ</button>
  </p>
  <p class="english-verse">Those left behind rejoiced in their staying behind the Messenger of The God and disliked striving with their wealth and their lives in the way of The God. They said, “Do not go forth in the heat.” Say, “The fire of Hell is hotter,” if only they understood.</p>
</section>
