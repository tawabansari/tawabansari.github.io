  <h2 class="ayah-title">At-Tawbah 9:46</h2>
  <p class="arabic-text">

  <p class="english-verse">Had they intended to go out, they would have made preparations for it. But The God disliked their setting out, so He held them back, and it was said, “Sit with those who sit.”</p>
