<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَرادُوا" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="They intended or wished to go out, within the conditional “had they intended.”">أَرادُوا</button>
    <button class="word-link" type="button" data-word="الخُروجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Going out to accompany the Prophet in this situation.">الخُروجَ</button>
    <button class="word-link" type="button" data-word="لَأَعَدّوا" data-root="ʿ D D (Ayn D D)" data-learn-more="/quran-terminology/en/roots/ayn-d-d/" data-root-meaning="Counting, measure, appointed duration, and ordered preparation for a defined purpose" data-context="They would certainly have prepared for that departure, the consequence of genuine intention in the conditional.">لَأَعَدّوا</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="عُدَّةً" data-root="ʿ D D (Ayn D D)" data-learn-more="/quran-terminology/en/roots/ayn-d-d/" data-root-meaning="Counting, measure, appointed duration, and ordered preparation for a defined purpose" data-context="Preparedness, means, and equipment needed for departure.">عُدَّةً</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="كَرِهَ" data-root="K R H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-r-h2/" data-root-meaning="Dislike or hardship; ikrāh means compulsion against one&#x27;s will." data-context="The God disliked their departure and participation.">كَرِهَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="انبِعاثَهُم" data-root="B AYN TH (B ʿ TH)" data-learn-more="/quran-terminology/en/roots/b-ayn-th/" data-root-meaning="Raising, awakening, setting into motion from stillness, sleep, death, or inaction; and sending into a new state, role, or task." data-context="Their rising and setting out to depart and accompany the others.">انبِعاثَهُم</button>
    <button class="word-link" type="button" data-word="فَثَبَّطَهُم" data-root="TH B TT" data-root-meaning="TH B Ṭ denotes becoming slow, sluggish, or unable to proceed with an action and, transitively, restraining, slowing, or obstructing someone’s progress." data-context="So He held them back from departing and accompanying the others; the verb itself does not specify the precise means of restraint." data-learn-more="/quran-terminology/en/roots/th-b-tt/">فَثَبَّطَهُم</button>
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And it was said; the passive verb leaves the speaker unspecified in this phrase.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="اقعُدوا" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Sit and remain behind, in the statement addressed to that group.">اقعُدوا</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="القٰعِدينَ" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Those remaining seated or behind; the word itself does not give them all the same reason for not departing.">القٰعِدينَ</button>
  </p>
  <p class="english-verse">Had they intended to go out, they would have made preparations for it. But The God disliked their setting out, so He held them back, and it was said, “Sit with those who sit.”</p>
</section>
