<section class="ayah-block" id="ayah-034" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:34</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="They have believed; those addressed at the opening of the verse.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="كَثيرًا" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Many; a qualification that does not extend the judgment to every scholar and monk.">كَثيرًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الأَحبارِ" data-root="H B R" data-root-meaning="Traces and adornment; ḥabr/ḥibr: a religious scholar; ḥubūr: joy and enjoyment of blessings." data-context="Religious scholars; in “many of the scholars and monks.”" data-learn-more="/quran-terminology/en/roots/h-b-r/">الأَحبارِ</button>
    <button class="word-link" type="button" data-word="وَالرُّهبانِ" data-root="R H B" data-learn-more="/quran-terminology/en/roots/r-h2-b/" data-root-meaning="Awe, wary reverence, vigilance, and inward contraction before greatness and consequence." data-context="And the monks; the group named alongside the scholars.">وَالرُّهبانِ</button>
    <button class="word-link" type="button" data-word="لَيَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="They certainly consume; appropriating people’s wealth wrongfully.">لَيَأكُلونَ</button>
    <button class="word-link" type="button" data-word="أَموٰلَ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="Wealth; the property of the people.">أَموٰلَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="The people; those whose wealth is wrongfully consumed.">النّاسِ</button>
    <button class="word-link" type="button" data-word="بِالبٰطِلِ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="Wrongfully; qualifying their appropriation of people’s wealth.">بِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="وَيَصُدّونَ" data-root="SAD D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-d-d/" data-root-meaning="Turning away or preventing another." data-context="And they hinder; obstructing the way of The God.">وَيَصُدّونَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; in the expression “the way of The God.”">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="يَكنِزونَ" data-root="K N Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-n-z/" data-root-meaning="Accumulating or storing wealth." data-context="They hoard; accumulating and storing gold and silver.">يَكنِزونَ</button>
    <button class="word-link" type="button" data-word="الذَّهَبَ" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach" data-context="Gold; one of the two forms of wealth being hoarded.">الذَّهَبَ</button>
    <button class="word-link" type="button" data-word="وَالفِضَّةَ" data-root="F DAD DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-dad-dad/" data-root-meaning="Breaking apart or dispersing; fiḍḍah is silver." data-context="And silver; the other form of wealth mentioned with gold.">وَالفِضَّةَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يُنفِقونَها" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="They spend it; spending wealth in the way of The God, here negated.">يُنفِقونَها</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; the purpose of the spending they withhold.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَبَشِّرهُم" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="Then announce to them; here, the announcement of painful punishment.">فَبَشِّرهُم</button>
    <button class="word-link" type="button" data-word="بِعَذابٍ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="A punishment; the painful consequence announced to them.">بِعَذابٍ</button>
    <button class="word-link" type="button" data-word="أَليمٍ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful; qualifying the punishment.">أَليمٍ</button>
  </p>
  <p class="english-verse">You who believe, many scholars and monks consume people’s wealth wrongfully and bar others from the way of The God. Those who hoard gold and silver and do not spend it in the way of The God—give them news of a painful punishment.</p>
</section>
