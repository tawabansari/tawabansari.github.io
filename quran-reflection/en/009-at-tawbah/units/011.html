<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tawbah 9:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="تابوا" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy" data-context="Repented or returned.">تابوا</button>
    <button class="word-link" type="button" data-word="وَأَقامُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And established.">وَأَقامُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Ṣalāh; the worship and connection referred to here.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="وَءاتَوُا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="And gave.">وَءاتَوُا</button>
    <button class="word-link" type="button" data-word="الزَّكوٰةَ" data-root="Z K W / Z K Y" data-learn-more="/quran-terminology/en/roots/z-k-w/" data-root-meaning="Becoming pure, growing, flourishing, increasing in a sound state, and reaching sound fruitfulness." data-context="Zakāh; the purifying giving referred to here.">الزَّكوٰةَ</button>
    <button class="word-link" type="button" data-word="فَإِخوٰنُكُم" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brothers, close friends, or associates in a bond." data-context="Then your brothers.">فَإِخوٰنُكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الدّينِ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God" data-context="The religion or way under discussion.">الدّينِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَنُفَصِّلُ" data-root="F SAD L" data-root-meaning="Separating and distinguishing one thing from another so that its boundary, difference, or outcome becomes clear." data-context="We explain the signs clearly and distinctly." data-learn-more="/quran-terminology/en/roots/f-sad-l/">وَنُفَصِّلُ</button>
    <button class="word-link" type="button" data-word="الـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The signs or verses.">الـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="For a people or group." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="They know.">يَعلَمونَ</button>
  </p>
  <p class="english-verse">If they repent, establish prayer, and give zakat, they are your brothers in religion. We set out the signs in detail for people who know.</p>
</section>
