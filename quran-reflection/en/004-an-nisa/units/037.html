<section class="ayah-block" id="ayah-037" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَبخَلونَ" data-root="B KH L" data-root-meaning="Withholding or refusing to give, especially where fulfilling a due or generosity is appropriate." data-learn-more="/quran-terminology/en/roots/b-kh-l/" data-context="Are stingy, withholding generosity">يَبخَلونَ</button>
    <button class="word-link" type="button" data-word="وَيَأمُرونَ" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="And command, urging others toward that conduct">وَيَأمُرونَ</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People">النّاسَ</button>
    <button class="word-link" type="button" data-word="بِالبُخلِ" data-root="B KH L" data-root-meaning="Withholding or refusing to give, especially where fulfilling a due or generosity is appropriate." data-learn-more="/quran-terminology/en/roots/b-kh-l/" data-context="To stinginess, to withholding generosity">بِالبُخلِ</button>
    <button class="word-link" type="button" data-word="وَيَكتُمونَ" data-root="K T M" data-learn-more="/quran-terminology/en/roots/k-t-m/" data-root-meaning="Concealing, holding something inside, and preventing what is present with a person from becoming visible" data-context="And conceal">وَيَكتُمونَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="ءاتىٰهُمُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Has given them">ءاتىٰهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="His bounty, what He has bestowed">فَضلِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأَعتَدنا" data-root="AYN T D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-t-d/" data-root-meaning="Preparing or being ready and present." data-context="And We have prepared">وَأَعتَدنا</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="For the disbelievers, those concealing and rejecting truth">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment and suffering">عَذابًا</button>
    <button class="word-link" type="button" data-word="مُهينًا" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status" data-context="Humiliating, bringing low">مُهينًا</button>
  </p>
  <p class="english-verse">Those who are miserly, command people to be miserly, and conceal what The God has given them of His bounty. We have prepared for the disbelievers a humiliating punishment.</p>
</section>
