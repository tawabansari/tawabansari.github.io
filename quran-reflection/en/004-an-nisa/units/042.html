<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:42</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَوَدُّ" data-root="W D D" data-learn-more="/quran-terminology/en/roots/w-d-d/" data-root-meaning="Wadda: affection, wanting, and wishing something to happen">يَوَدُّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>
    <button class="word-link" type="button" data-word="وَعَصَوُا" data-root="ʿ Ṣ Y" data-learn-more="/quran-terminology/en/roots/ayn-sad-y/" data-root-meaning="Disobeying a command, refusing an instruction, and acting against the path of obedience.">وَعَصَوُا</button>
    <button class="word-link" type="button" data-word="الرَّسولَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرَّسولَ</button>
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="تُسَوّىٰ" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness">تُسَوّىٰ</button>
    <button class="word-link" type="button" data-word="بِهِمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضُ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَكتُمونَ" data-root="K T M" data-learn-more="/quran-terminology/en/roots/k-t-m/" data-root-meaning="Concealing, holding something inside, and preventing what is present with a person from becoming visible">يَكتُمونَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="حَديثًا" data-root="H D TH" data-learn-more="/quran-terminology/en/roots/h-d-th/" data-root-meaning="From Coming into Being to Speech That Is Recounted">حَديثًا</button>
  </p>
  <p class="english-verse">On that day, those who disbelieved and disobeyed the messenger will wish that the earth were leveled over them. They will conceal no statement from The God.</p>
</section>
