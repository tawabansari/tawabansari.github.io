<section class="ayah-block" id="ayah-107" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:107</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تُجٰدِل" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="do not argue in defense" data-learn-more="/quran-terminology/en/roots/j-d-l/">تُجٰدِل</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَختانونَ" data-root="KH W N" data-root-meaning="Diminution and taking away; in human conduct, violating trust, an entrusted responsibility, or fidelity, and infringing a right that should be respected." data-context="betray" data-learn-more="/quran-terminology/en/roots/kh-w-n/">يَختانونَ</button>
    <button class="word-link" type="button" data-word="أَنفُسَهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="their own selves">أَنفُسَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُحِبُّ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="does not love">يُحِبُّ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="is">كانَ</button>
    <button class="word-link" type="button" data-word="خَوّانًا" data-root="KH W N" data-root-meaning="Diminution and taking away; in human conduct, violating trust, an entrusted responsibility, or fidelity, and infringing a right that should be respected." data-context="persistently treacherous" data-learn-more="/quran-terminology/en/roots/kh-w-n/">خَوّانًا</button>
    <button class="word-link" type="button" data-word="أَثيمًا" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="sinful">أَثيمًا</button>
  </p>
  <p class="english-verse">Do not argue on behalf of those who betray themselves. Indeed, The God does not love anyone who is persistently treacherous and sinful.</p>
</section>
