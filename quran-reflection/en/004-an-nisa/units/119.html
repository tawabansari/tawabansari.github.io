<section class="ayah-block" id="ayah-119" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:119</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَأُضِلَّنَّهُم" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="I will surely mislead them: a form IV verb in Satan’s speech, with “them” as object and emphasis on his intention.">وَلَأُضِلَّنَّهُم</button>
    <button class="word-link" type="button" data-word="وَلَأُمَنِّيَنَّهُم" data-root="M N Y" data-learn-more="/quran-terminology/en/roots/m-n-y/" data-root-meaning="From Apportioning and Wishing to Recitation, Amānī, and Semen" data-context="I will fill them with wishes: Satan’s promise to occupy people with misleading hopes.">وَلَأُمَنِّيَنَّهُم</button>
    <button class="word-link" type="button" data-word="وَلَـٔامُرَنَّهُم" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="I will surely command them: in Satan’s speech, introducing the followers’ cutting of the ears.">وَلَـٔامُرَنَّهُم</button>
    <button class="word-link" type="button" data-word="فَلَيُبَتِّكُنَّ" data-root="B T K" data-learn-more="/quran-terminology/en/roots/b-t-k/" data-root-meaning="Cutting and separating part of something, with a cutting tool or by pulling and plucking." data-context="They will surely cut or slit livestock’s ears: a form II third-person plural verb with emphasis, following Satan’s command.">فَلَيُبَتِّكُنَّ</button>
    <button class="word-link" type="button" data-word="ءاذانَ" data-root="ʾ DH N" data-learn-more="/quran-terminology/en/roots/a-dh-n/" data-root-meaning="Ear, listening, making known, and giving permission" data-context="Ears: plural of udhun and the object of cutting or slitting, rather than permission.">ءاذانَ</button>
    <button class="word-link" type="button" data-word="الأَنعٰمِ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing; in the naʿam/anʿām branch, livestock and grazing animals." data-context="Livestock, such as camels, cattle, sheep and goats: the animals whose ears are the object of the cutting.">الأَنعٰمِ</button>
    <button class="word-link" type="button" data-word="وَلَـٔامُرَنَّهُم" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="And I will command them: the repeated verb introduces the command concerning altering creation.">وَلَـٔامُرَنَّهُم</button>
    <button class="word-link" type="button" data-word="فَلَيُغَيِّرُنَّ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="They will surely alter: a form II verb with a plural subject, in Satan’s speech concerning changing creation.">فَلَيُغَيِّرُنَّ</button>
    <button class="word-link" type="button" data-word="خَلقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Creation or created constitution: the object of altering; the scope of altering creation requires contextual and inter-verse examination.">خَلقَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَتَّخِذِ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Takes or chooses for himself: a form VIII verb in the conditional clause, with Satan as its object.">يَتَّخِذِ</button>
    <button class="word-link" type="button" data-word="الشَّيطٰنَ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance" data-context="Satan: the misleader and commanding figure whose speech is quoted in the first part of the verse.">الشَّيطٰنَ</button>
    <button class="word-link" type="button" data-word="وَلِيًّا" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="A guardian and authority to follow: the role a person gives Satan in this choice.">وَلِيًّا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="In min duni llah, instead of The God or apart from His authority; not a statement of physical lowness.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَد</button>
    <button class="word-link" type="button" data-word="خَسِرَ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="Has suffered loss: the consequence of taking Satan as guardian in the conditional sentence.">خَسِرَ</button>
    <button class="word-link" type="button" data-word="خُسرانًا" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="A loss: a verbal noun emphasizing the loss, qualified by mubinan.">خُسرانًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Clear and manifest: describing khusran and the evident character of the loss.">مُبينًا</button>
  </p>
  <p class="english-verse">I will surely mislead them, fill them with wishes, command them so they slit the ears of livestock, and command them so they alter The God’s creation.” Whoever takes Satan as a guardian instead of The God has suffered a manifest loss.</p>
</section>
