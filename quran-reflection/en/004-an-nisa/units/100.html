  <p class="english-verse">Whoever migrates in the way of The God will find many places of refuge and abundance in the earth. Whoever leaves his home migrating toward The God and His messenger, then death overtakes him, his reward has become incumbent upon The God. The God is forgiving, merciful.</p>
