<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَمَنَّوا" data-root="M N Y" data-learn-more="/quran-terminology/en/roots/m-n-y/" data-root-meaning="From Apportioning and Wishing to Recitation, Amānī, and Semen" data-context="You wish; the opening prohibition restrains this wish.">تَتَمَنَّوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فَضَّلَ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="Has favored, concerning differences in what people receive.">فَضَّلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="بَعضَكُم" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Some of you, the first side of the comparison.">بَعضَكُم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="بَعضٍ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable" data-context="Others, the second side of the comparison.">بَعضٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="لِلرِّجالِ" data-root="R J L" data-learn-more="/quran-terminology/en/roots/r-j-l/" data-root-meaning="Man; foot or leg; and walking or people on foot in distinct branches. Each form’s meaning follows its structure and context." data-context="For men, in the statement of their portion.">لِلرِّجالِ</button>
    <button class="word-link" type="button" data-word="نَصيبٌ" data-root="N SAD B" data-learn-more="/quran-terminology/en/roots/n-sad-b/" data-root-meaning="Setting up and establishing; naṣab and nuṣb denote hardship and weariness; naṣīb a share; nuṣub and anṣāb erected markers or stones." data-context="A portion for men of what they have earned.">نَصيبٌ</button>
    <button class="word-link" type="button" data-word="مِمَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمَّا</button>
    <button class="word-link" type="button" data-word="اكتَسَبوا" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Have earned, referring to the men’s deeds or acquisitions.">اكتَسَبوا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلِلنِّساءِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="And for women, in the statement of their portion.">وَلِلنِّساءِ</button>
    <button class="word-link" type="button" data-word="نَصيبٌ" data-root="N SAD B" data-learn-more="/quran-terminology/en/roots/n-sad-b/" data-root-meaning="Setting up and establishing; naṣab and nuṣb denote hardship and weariness; naṣīb a share; nuṣub and anṣāb erected markers or stones." data-context="A portion for women of what they have earned.">نَصيبٌ</button>
    <button class="word-link" type="button" data-word="مِمَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمَّا</button>
    <button class="word-link" type="button" data-word="اكتَسَبنَ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Have earned, referring to the women’s deeds or acquisitions.">اكتَسَبنَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَسـَٔلُوا" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="And ask, seeking The God’s bounty.">وَسـَٔلُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فَضلِهِ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party." data-context="His bounty, which they are instructed to seek.">فَضلِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Has been and is, in the statement of The God’s knowledge.">كانَ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Of every; expresses the scope of knowledge.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing, in describing the extent of knowledge.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَليمًا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing, describing The God at the verse’s end.">عَليمًا</button>
  </p>
  <p class="english-verse">Do not wish for that by which The God has favored some of you over others. For men is a share of what they have earned, and for women is a share of what they have earned. Ask The God of His bounty. Indeed, The God knows all things.</p>
</section>
