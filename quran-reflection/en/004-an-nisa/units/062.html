<section class="ayah-block" id="ayah-062" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:62</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="أَصٰبَتهُم" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="Befell them; describing a misfortune reaching them.">أَصٰبَتهُم</button>
    <button class="word-link" type="button" data-word="مُصيبَةٌ" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="A misfortune that befalls them.">مُصيبَةٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="قَدَّمَت" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="Has sent ahead; referring to their earlier conduct.">قَدَّمَت</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands; here representing their own deeds.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="جاءوكَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="They came to you to present their claim.">جاءوكَ</button>
    <button class="word-link" type="button" data-word="يَحلِفونَ" data-root="H L F" data-root-meaning="Swearing an oath to affirm a claim or strengthen a commitment; حَلَّاف describes someone who swears frequently." data-context="They swear to affirm their claim of intending goodness and reconciliation." data-learn-more="/quran-terminology/en/roots/h-l-f/">يَحلِفونَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="أَرَدنا" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="We intended; expressing their claimed intention.">أَرَدنا</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="إِحسٰنًا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Doing good; the purpose they claim for their conduct.">إِحسٰنًا</button>
    <button class="word-link" type="button" data-word="وَتَوفيقًا" data-root="W F Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-f-q/" data-root-meaning="Correspondence or agreement; tawfīq means bringing about accord or success." data-context="Reconciliation; part of their claim about their intention.">وَتَوفيقًا</button>
  </p>
  <p class="english-verse">How will it be when a calamity strikes them for what their hands have sent ahead, then they come to you swearing by The God, “We intended only kindness and reconciliation”?</p>
</section>
