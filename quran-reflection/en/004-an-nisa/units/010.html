<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Consume or appropriate the property of orphans.">يَأكُلونَ</button>
    <button class="word-link" type="button" data-word="أَموٰلَ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="The orphans’ property, which must not be unjustly appropriated.">أَموٰلَ</button>
    <button class="word-link" type="button" data-word="اليَتٰمىٰ" data-root="Y T M" data-learn-more="/quran-terminology/en/roots/y-t-m/" data-root-meaning="Loss of the father, the orphan’s situation, and responsibility for the orphan’s rights" data-context="The orphans whose property is wrongfully consumed.">اليَتٰمىٰ</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="Unjustly, violating the property owners’ rights.">ظُلمًا</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يَأكُلونَ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Consume; unjust consumption of property is described as eating fire.">يَأكُلونَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="بُطونِهِم" data-root="B TT N" data-root-meaning="The interior and inner side of something as opposed to its exterior and surface; in extended uses, an affair’s latent or less apparent aspect, or what is accessible to intimates and those familiar with it." data-context="Their bellies, into which consuming orphans’ property unjustly is described as consuming fire." data-learn-more="/quran-terminology/en/roots/b-tt-n/">بُطونِهِم</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="Fire, the consequence portrayed for unjustly consuming orphans’ property.">نارًا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَيَصلَونَ" data-root="SAD L Y" data-learn-more="/quran-terminology/en/roots/sad-l-y/" data-root-meaning="From taking warmth from a fire to entering it" data-context="And they will enter and suffer a blazing fire.">وَسَيَصلَونَ</button>
    <button class="word-link" type="button" data-word="سَعيرًا" data-root="S AYN R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-ayn-r/" data-root-meaning="Kindling fire; saʿīr is blazing fire; suʿur in some contexts denotes derangement." data-context="A fiercely blazing fire.">سَعيرًا</button>
  </p>
  <p class="english-verse">Those who consume the wealth of orphans unjustly consume only fire into their bellies, and they will burn in a blaze.</p>
</section>
