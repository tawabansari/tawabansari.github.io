<section class="ayah-block" id="ayah-128" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:128</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنِ</button>
    <button class="word-link" type="button" data-word="امرَأَةٌ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="A woman, the marital partner who fears her husband’s conduct.">امرَأَةٌ</button>
    <button class="word-link" type="button" data-word="خافَت" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Fears estrangement or avoidance on her husband’s part.">خافَت</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعلِها" data-root="B AYN L" data-root-meaning="In family usage, baʿl means husband, the male marital partner. In Elijah’s account, Baal is the name or title of a deity invoked instead of The God." data-context="Her husband, whose estrangement or avoidance the woman fears." data-learn-more="/quran-terminology/en/roots/b-ayn-l/">بَعلِها</button>
    <button class="word-link" type="button" data-word="نُشوزًا" data-root="N SH Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sh-z/" data-root-meaning="Rising or moving up; nushūz in relationships denotes estrangement or discord." data-context="Nushūz, marital discord or estrangement on the husband’s part.">نُشوزًا</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="إِعراضًا" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="Avoidance or turning away by the husband.">إِعراضًا</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="جُناحَ" data-root="J N H" data-root-meaning="Wing, side, inclination and sin: from birds in flight and human humility to lā junāḥ in Qur’anic rulings and inclining towards peace" data-learn-more="/quran-terminology/en/roots/j-n-h/" data-context="No blame, expressing the permissibility of reconciliation between them.">جُناحَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِما</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُصلِحا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="The two reach reconciliation and repair their relationship.">يُصلِحا</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between the two, the woman and her husband.">بَينَهُما</button>
    <button class="word-link" type="button" data-word="صُلحًا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="A reconciliation or settlement to repair the relationship.">صُلحًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالصُّلحُ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="And reconciliation, declared better in the following statement.">وَالصُّلحُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better, describing reconciliation between the parties.">خَيرٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَأُحضِرَتِ" data-root="Ḥ Ḍ R" data-learn-more="/quran-terminology/en/roots/h-dad-r/" data-root-meaning="Presence, arrival, proximity, and bringing into presence: from everyday life to confronting deeds in the Hereafter" data-context="And are attended by; souls are confronted with avarice.">وَأُحضِرَتِ</button>
    <button class="word-link" type="button" data-word="الأَنفُسُ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Souls or selves, confronting avarice.">الأَنفُسُ</button>
    <button class="word-link" type="button" data-word="الشُّحَّ" data-root="SH H H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h-h/" data-root-meaning="Stinginess joined with greed or possessiveness." data-context="Avarice or reluctance to yield one’s own demands or claims.">الشُّحَّ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُحسِنوا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Do good in conduct and the repair of relationships.">تُحسِنوا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="And remain mindful, guarding against harmful or wrongful conduct.">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was, expressing The God’s enduring awareness of conduct.">كانَ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Do, referring to the audience’s actions.">تَعمَلونَ</button>
    <button class="word-link" type="button" data-word="خَبيرًا" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Fully aware, describing The God’s knowledge of what you do." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرًا</button>
  </p>
  <p class="english-verse">If a woman fears defiance or aversion from her husband, there is no blame upon the two if they reach a settlement between themselves; settlement is better. Souls are attended by avarice. If you do good and are mindful, indeed, The God is aware of what you do.</p>
</section>
