  <h2 class="ayah-title">An-Nisa 4:5</h2>
  <p class="arabic-text">

  <p class="english-verse">Do not give the imprudent your wealth, which The God has made a means of support for you. Provide for them from it, clothe them, and speak to them in a fitting manner.</p>
