<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="خِفتُم" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Fear that justice will not be maintained.">خِفتُم</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="تُقسِطوا" data-root="Q S TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-tt/" data-root-meaning="Qisṭ and iqṣāṭ concern justice; qusūṭ concerns injustice or deviation; the form determines the sense." data-context="Act justly toward orphans; used in a negative construction.">تُقسِطوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="اليَتٰمىٰ" data-root="Y T M" data-learn-more="/quran-terminology/en/roots/y-t-m/" data-root-meaning="Loss of the father, the orphan’s situation, and responsibility for the orphan’s rights" data-context="Orphans and the observance of their rights.">اليَتٰمىٰ</button>
    <button class="word-link" type="button" data-word="فَانكِحوا" data-root="N K H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-h/" data-root-meaning="Nikāḥ denotes marriage or intercourse, according to construction and context." data-context="Marry; in a context of conditions and responsibility.">فَانكِحوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="طابَ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant." data-context="Be agreeable and suitable.">طابَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="Women; the subject of marriage in the verse.">النِّساءِ</button>
    <button class="word-link" type="button" data-word="مَثنىٰ" data-root="TH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/th-n-y/" data-root-meaning="Doubling, repeating, or folding; ithnān and mathnā denote two or two by two." data-context="In twos; a distributive numeral.">مَثنىٰ</button>
    <button class="word-link" type="button" data-word="وَثُلٰثَ" data-root="TH L TH" data-root-meaning="Three and its related forms: a count of three, third position, one-third and two-thirds, and distribution in threes." data-context="In threes; a distributive numeral in the context of marriage and conditions of justice." data-learn-more="/quran-terminology/en/roots/th-l-th/">وَثُلٰثَ</button>
    <button class="word-link" type="button" data-word="وَرُبٰعَ" data-root="R B AYN (R B ʿ)" data-learn-more="/quran-terminology/en/roots/r-b-ayn/" data-root-meaning="Four, fourfold grouping, one-fourth, forty, and the semantic field of counting and division" data-context="In fours; a distributive numeral, not an addition to two and three.">وَرُبٰعَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="خِفتُم" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Fear that you cannot maintain justice.">خِفتُم</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعدِلوا" data-root="ʿ D L (Ayn D L)" data-learn-more="/quran-terminology/en/roots/ayn-d-l/" data-root-meaning="Making things correspond, setting straight, equalizing, and placing each thing in a relation that prevents crookedness and one-sidedness" data-context="Maintain justice; used in a negative construction.">تَعدِلوا</button>
    <button class="word-link" type="button" data-word="فَوٰحِدَةً" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="Then one woman, if injustice is feared.">فَوٰحِدَةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="مَلَكَت" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Has come under authority and possession; part of the historical expression for those held in bondage.">مَلَكَت</button>
    <button class="word-link" type="button" data-word="أَيمٰنُكُم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Your right hands, in the expression mā malakat aymānukum.">أَيمٰنُكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="أَدنىٰ" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Nearer to avoiding deviation and injustice.">أَدنىٰ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="تَعولوا" data-root="AYN W L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-l/" data-root-meaning="Burden or departure from balance; in judgment, injustice." data-context="Depart from justice; expressed in a negative construction.">تَعولوا</button>
  </p>
  <p class="english-verse">If you fear that you will not deal equitably with the orphans, marry women who are pleasing to you: two, three, and four. But if you fear that you will not be just, then one, or what your right hands possess. That is nearer to your not acting unjustly.</p>
</section>
