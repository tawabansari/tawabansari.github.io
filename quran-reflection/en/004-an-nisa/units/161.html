<section class="ayah-block" id="ayah-161" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:161</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَخذِهِمُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="And their taking, accepting usury despite prohibition.">وَأَخذِهِمُ</button>
    <button class="word-link" type="button" data-word="الرِّبوٰا۟" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level" data-context="Usury, the object taken despite prior prohibition.">الرِّبوٰا۟</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="نُهوا" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="They had been forbidden, the prior prohibition of taking usury." data-learn-more="/quran-terminology/en/roots/n-h2-y/">نُهوا</button>
    <button class="word-link" type="button" data-word="عَنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُ</button>
    <button class="word-link" type="button" data-word="وَأَكلِهِم" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="And their consuming, wrongful appropriation of people’s property.">وَأَكلِهِم</button>
    <button class="word-link" type="button" data-word="أَموٰلَ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth" data-context="Property, people’s possessions.">أَموٰلَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People, those whose property is wrongfully consumed.">النّاسِ</button>
    <button class="word-link" type="button" data-word="بِالبٰطِلِ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="Wrongfully, describing the taking of property.">بِالبٰطِلِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَأَعتَدنا" data-root="AYN T D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-t-d/" data-root-meaning="Preparing or being ready and present." data-context="And We have prepared, referring to punishment.">وَأَعتَدنا</button>
    <button class="word-link" type="button" data-word="لِلكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="For rejecters, those among them facing the stated punishment.">لِلكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="A punishment, the stated recompense.">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful, describing the punishment.">أَليمًا</button>
  </p>
  <p class="english-verse">And for their taking usury though they had been forbidden it, and their consuming people’s wealth wrongfully. We have prepared a painful punishment for the disbelievers among them.</p>
</section>
