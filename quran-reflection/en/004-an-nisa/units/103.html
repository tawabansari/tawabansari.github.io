<section class="ayah-block" id="ayah-103" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:103</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="قَضَيتُمُ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination" data-context="You have completed; here, the completion of ṣalāt.">قَضَيتُمُ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Ṣalāt, whose completion is mentioned here.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="فَاذكُرُوا" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Then remember; the command to remember The God in different positions.">فَاذكُرُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قِيٰمًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Standing, one of the positions in which The God is remembered.">قِيٰمًا</button>
    <button class="word-link" type="button" data-word="وَقُعودًا" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="And sitting, alongside standing and lying on one’s sides.">وَقُعودًا</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="جُنوبِكُم" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="Your sides; in the expression about remembering while lying on one’s sides." data-learn-more="/quran-terminology/en/roots/j-n-b/">جُنوبِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذَا</button>
    <button class="word-link" type="button" data-word="اطمَأنَنتُم" data-root="TT M A N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-m-a-n/" data-root-meaning="Becoming calm or reassured after disturbance; also indexed under the shorter analysis ṭ-m-n." data-context="You become secure and at ease after fear and danger.">اطمَأنَنتُم</button>
    <button class="word-link" type="button" data-word="فَأَقيمُوا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Then establish ṣalāt; the command following the return of security.">فَأَقيمُوا</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Ṣalāt, whose establishment is commanded after security returns.">الصَّلوٰةَ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الصَّلوٰةَ" data-root="Ṣ L W / Ṣ L Y" data-learn-more="/quran-terminology/en/roots/sad-l-w/" data-root-meaning="Salat as living connection with The God, alignment with truth, and the established path that draws the human being out of heedlessness, crookedness, and dispersion" data-context="Ṣalāt, the subject of the statement about an obligation with an appointed time.">الصَّلوٰةَ</button>
    <button class="word-link" type="button" data-word="كانَت" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Has been; expressing the prescribed status of ṣalāt for believers.">كانَت</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="For the believers, upon whom the obligation of ṣalāt is prescribed.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="كِتٰبًا" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="A prescribed obligation; in kitāban mawqūtan, a binding prescription with an appointed time.">كِتٰبًا</button>
    <button class="word-link" type="button" data-word="مَوقوتًا" data-root="W Q T" data-root-meaning="A specified time or temporal limit, and appointing it for an undertaking, appointment, or event." data-context="Having an appointed time; qualifying the obligation of ṣalāt in kitāban mawqūtan." data-learn-more="/quran-terminology/en/roots/w-q-t/">مَوقوتًا</button>
  </p>
  <p class="english-verse">When you have completed prayer, remember The God standing, sitting, and on your sides. When you are secure, establish prayer. Indeed, prayer is an obligation upon the believers at appointed times.</p>
</section>
