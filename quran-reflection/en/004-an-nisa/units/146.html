<section class="ayah-block" id="ayah-146" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:146</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="تابوا" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy">تابوا</button>
    <button class="word-link" type="button" data-word="وَأَصلَحوا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state">وَأَصلَحوا</button>

    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَأَخلَصوا" data-root="KH L Ṣ" data-learn-more="/quran-terminology/en/roots/kh-l-sad/" data-root-meaning="Separation from admixture: from purity to exclusive dedication">وَأَخلَصوا</button>
    <button class="word-link" type="button" data-word="دينَهُم" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God">دينَهُم</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">المُؤمِنينَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَوفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَسَوفَ</button>
    <button class="word-link" type="button" data-word="يُؤتِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">يُؤتِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="أَجرًا" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">أَجرًا</button>
    <button class="word-link" type="button" data-word="عَظيمًا" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمًا</button>
  </p>
  <p class="english-verse">Except those who repent, make amends, hold fast to The God, and make their religion sincere for The God. Those are with the believers, and The God will give the believers a great reward.</p>
</section>
