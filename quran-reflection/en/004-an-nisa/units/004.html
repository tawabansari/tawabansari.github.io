<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتُوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="And give; the command to pay women their dowers">وَءاتُوا</button>
    <button class="word-link" type="button" data-word="النِّساءَ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language" data-context="The women; recipients of their own dowers in this verse">النِّساءَ</button>
    <button class="word-link" type="button" data-word="صَدُقٰتِهِنَّ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="Their dowers; the marital property attributed to the women">صَدُقٰتِهِنَّ</button>
    <button class="word-link" type="button" data-word="نِحلَةً" data-root="N H L" data-learn-more="/quran-terminology/en/roots/n-h-l/" data-root-meaning="Branches of giving, attribution or claims, and thinness; naḥl names honey bees, while niḥlah denotes a gift." data-context="As a gift; in the command to pay women their dowers, retaining the explanation of an established due">نِحلَةً</button>
    ۚ
    <button class="word-link" type="button" data-word="فَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِن</button>
    <button class="word-link" type="button" data-word="طِبنَ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant." data-context="They willingly relinquish; give up some of their dower">طِبنَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Something; a portion of the dower mentioned">شَىءٍ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="نَفسًا" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Willingly at heart; an accusative specification of the women’s wholehearted consent">نَفسًا</button>
    <button class="word-link" type="button" data-word="فَكُلوهُ" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="Then consume or use it; property willingly relinquished">فَكُلوهُ</button>
    <button class="word-link" type="button" data-word="هَنيـًٔا" data-root="H2 N A" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-n-a/" data-root-meaning="Being pleasant or wholesome, without distressing aftermath." data-context="Pleasantly; describing enjoyment of the transferred property">هَنيـًٔا</button>
    <button class="word-link" type="button" data-word="مَريـًٔا" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="Agreeably and wholesomely; paired with the preceding description of pleasant use">مَريـًٔا</button>
  </p>
  <p class="english-verse">Give women their bridal dues as a gift. If they willingly relinquish any of it to you, then consume it with enjoyment and ease.</p>
</section>
