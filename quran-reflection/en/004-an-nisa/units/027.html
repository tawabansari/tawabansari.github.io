<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَتوبَ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy">يَتوبَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="وَيُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">وَيُريدُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَتَّبِعونَ" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">يَتَّبِعونَ</button>
    <button class="word-link" type="button" data-word="الشَّهَوٰتِ" data-root="SH H2 W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sh-h2-w/" data-root-meaning="A strong desire or appetite for something.">الشَّهَوٰتِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَميلوا" data-root="M Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-y-l/" data-root-meaning="Leaning to one side or departing from balance.">تَميلوا</button>
    <button class="word-link" type="button" data-word="مَيلًا" data-root="M Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-y-l/" data-root-meaning="Leaning to one side or departing from balance.">مَيلًا</button>
    <button class="word-link" type="button" data-word="عَظيمًا" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect">عَظيمًا</button>
  </p>
  <p class="english-verse">The God wishes to turn to you, while those who follow desires wish you to deviate greatly.</p>
</section>
