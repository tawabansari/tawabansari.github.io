<section class="ayah-block" id="ayah-112" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:112</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَكسِب" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Commits, earning an error or sin through one’s own conduct.">يَكسِب</button>
    <button class="word-link" type="button" data-word="خَطيـَٔةً" data-root="KH Ṭ A" data-learn-more="/quran-terminology/en/roots/kh-tt-a/" data-root-meaning="Slipping from the right path, missing the mark, going wrong; and in some forms, conscious deviation from truth." data-context="An error, initially belonging to the person who commits it.">خَطيـَٔةً</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="إِثمًا" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="A sin, alongside an error as the person’s deed.">إِثمًا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَرمِ" data-root="R M Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-m-y/" data-root-meaning="Throwing or casting; figuratively, making an accusation." data-context="Casts or attributes, shifting one’s error or sin onto another.">يَرمِ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="بَريـًٔا" data-root="B R A" data-learn-more="/quran-terminology/en/roots/b-r-a/" data-root-meaning="Bringing into being, being released from illness or attribution, being clear of accusation, and declaring bara&#x27;ah" data-context="An innocent person, free of that particular attributed deed.">بَريـًٔا</button>
    <button class="word-link" type="button" data-word="فَقَدِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَقَدِ</button>
    <button class="word-link" type="button" data-word="احتَمَلَ" data-root="H M L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-l/" data-root-meaning="Carrying a load, bearing responsibility, and pregnancy." data-context="Has borne, taking on the burden of calumny and sin.">احتَمَلَ</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="B H2 T" data-root-meaning="In one branch, B H T denotes bewilderment and inability to respond to something startling or an unanswerable argument. In another, buhtān denotes falsehood and wrongful attribution distorting truth and potentially exposing an innocent person to accusation or harm." data-context="Calumny, attributing one’s own error or sin to someone innocent of it." data-learn-more="/quran-terminology/en/roots/b-h2-t/">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="وَإِثمًا" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="And sin, the responsibility borne alongside the calumny.">وَإِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Manifest, describing the sin of falsely accusing the innocent.">مُبينًا</button>
  </p>
  <p class="english-verse">Whoever earns an offense or a sin, then casts it upon an innocent person, has borne a slander and a manifest sin.</p>
</section>
