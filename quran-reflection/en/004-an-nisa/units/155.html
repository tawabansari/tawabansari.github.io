<section class="ayah-block" id="ayah-155" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:155</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَبِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَبِما</button>
    <button class="word-link" type="button" data-word="نَقضِهِم" data-root="N Q Ḍ" data-learn-more="/quran-terminology/en/roots/n-q-dad/" data-root-meaning="Unraveling a bond that had already been tied, twisted, strengthened, or built">نَقضِهِم</button>
    <button class="word-link" type="button" data-word="ميثٰقَهُم" data-root="W TH Q" data-learn-more="/quran-terminology/en/roots/w-th-q/" data-root-meaning="Firmness, reliability, secure binding, and a commitment that is not loose or abandoned">ميثٰقَهُم</button>
    <button class="word-link" type="button" data-word="وَكُفرِهِم" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">وَكُفرِهِم</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَقَتلِهِمُ" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life">وَقَتلِهِمُ</button>
    <button class="word-link" type="button" data-word="الأَنبِياءَ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”">الأَنبِياءَ</button>
    <button class="word-link" type="button" data-word="بِغَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state">بِغَيرِ</button>
    <button class="word-link" type="button" data-word="حَقٍّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">حَقٍّ</button>
    <button class="word-link" type="button" data-word="وَقَولِهِم" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقَولِهِم</button>
    <button class="word-link" type="button" data-word="قُلوبُنا" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">قُلوبُنا</button>
    <button class="word-link" type="button" data-word="غُلفٌ" data-root="GH L F" data-learn-more="/quran-terminology/en/roots/gh-l-f/" data-root-meaning="A sheath, a covering, and a heart that the message cannot reach">غُلفٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="طَبَعَ" data-root="TT B AYN" data-learn-more="/quran-terminology/en/roots/tt-b-ayn/" data-root-meaning="Sealing, imprinting, and fixing a lasting mark upon the channels of reception after a settled human direction.">طَبَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="بِكُفرِهِم" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">بِكُفرِهِم</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter.">قَليلًا</button>
  </p>
  <p class="english-verse">So for their breaking their covenant, their disbelief in The God’s signs, their killing the prophets without right, and their saying, “Our hearts are covered”—rather, The God has sealed them for their disbelief, so they believe but little—</p>
</section>
