<section class="ayah-block" id="ayah-050" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:50</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="انظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay">انظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="يَفتَرونَ" data-root="F R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-y/" data-root-meaning="Cutting or fashioning; iftirāʾ is fabricating false speech or accusations.">يَفتَرونَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الكَذِبَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">الكَذِبَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="K F Y" data-learn-more="/quran-terminology/en/roots/k-f-y/" data-root-meaning="Sufficiency: meeting a need and handling another’s affairs; The God’s sufficiency in witnessing, reckoning, aid, and protection">وَكَفىٰ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="إِثمًا" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind">إِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">مُبينًا</button>
  </p>
  <p class="english-verse">Look how they fabricate lies against The God. That is sufficient as a manifest sin.</p>
</section>
