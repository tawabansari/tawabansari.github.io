<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَءاتُوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَءاتُوا</button>
    <button class="word-link" type="button" data-word="اليَتٰمىٰ" data-root="Y T M" data-learn-more="/quran-terminology/en/roots/y-t-m/" data-root-meaning="Loss of the father, the orphan’s situation, and responsibility for the orphan’s rights">اليَتٰمىٰ</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">أَموٰلَهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَتَبَدَّلُوا" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">تَتَبَدَّلُوا</button>
    <button class="word-link" type="button" data-word="الخَبيثَ" data-root="KH B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-b-th/" data-root-meaning="Impurity, wickedness, or poor quality, physical or moral according to context.">الخَبيثَ</button>
    <button class="word-link" type="button" data-word="بِالطَّيِّبِ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant.">بِالطَّيِّبِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَأكُلوا" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption">تَأكُلوا</button>
    <button class="word-link" type="button" data-word="أَموٰلَهُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">أَموٰلَهُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَموٰلِكُم" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">أَموٰلِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="حوبًا" data-root="H W B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-w-b/" data-root-meaning="Sin, wrongdoing, or an offense.">حوبًا</button>
    <button class="word-link" type="button" data-word="كَبيرًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">كَبيرًا</button>
  </p>
  <p class="english-verse">Give the orphans their wealth. Do not exchange the impure for the pure, and do not consume their wealth along with your own. That is indeed a great sin.</p>
</section>
