  <h2 class="ayah-title">An-Nisa 4:45</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="وَكَفىٰ" data-root="K F Y" data-learn-more="/quran-terminology/en/roots/k-f-y/" data-root-meaning="Sufficiency: meeting a need and handling another’s affairs; The God’s sufficiency in witnessing, reckoning, aid, and protection">وَكَفىٰ</button>

    <button class="word-link" type="button" data-word="نَصيرًا" data-root="N Ṣ R" data-learn-more="/quran-terminology/en/roots/n-sad-r/" data-root-meaning="Helping, supporting against pressure and enemy, and bringing force that repels harm or leads to prevailing">نَصيرًا</button>

  <p class="english-verse">The God knows your enemies best. The God is sufficient as a guardian, and The God is sufficient as a helper.</p>
