<section class="ayah-block" id="ayah-133" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:133</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="يَشَأ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">يَشَأ</button>
    <button class="word-link" type="button" data-word="يُذهِبكُم" data-root="DH H B" data-learn-more="/quran-terminology/en/roots/dh-h2-b/" data-root-meaning="Going, leaving, passing away, disappearing from presence, and being taken out of reach">يُذهِبكُم</button>
    <button class="word-link" type="button" data-word="أَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَيُّهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسُ</button>
    <button class="word-link" type="button" data-word="وَيَأتِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَيَأتِ</button>
    <button class="word-link" type="button" data-word="بِـٔاخَرينَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">بِـٔاخَرينَ</button>

    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="قَديرًا" data-root="Q D R" data-learn-more="/quran-terminology/en/roots/q-d-r/" data-root-meaning="Power, ability, measuring, determining measure, setting limit, boundary and capacity; and in the Qur’anic field, power joined with measure, time, capacity, and ordered structure">قَديرًا</button>
  </p>
  <p class="english-verse">If He wills, He can remove you, O people, and bring others. The God is capable of that.</p>
