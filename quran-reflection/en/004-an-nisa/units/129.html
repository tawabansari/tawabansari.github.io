<section class="ayah-block" id="ayah-129" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:129</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَن</button>
    <button class="word-link" type="button" data-word="تَستَطيعوا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">تَستَطيعوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَعدِلوا" data-root="ʿ D L (Ayn D L)" data-learn-more="/quran-terminology/en/roots/ayn-d-l/" data-root-meaning="Making things correspond, setting straight, equalizing, and placing each thing in a relation that prevents crookedness and one-sidedness">تَعدِلوا</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَ</button>
    <button class="word-link" type="button" data-word="النِّساءِ" data-root="N S W" data-learn-more="/quran-terminology/en/roots/n-s-w/" data-root-meaning="Women and groups of women in Qur&#x27;anic language">النِّساءِ</button>
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="حَرَصتُم" data-root="Ḥ R Ṣ" data-learn-more="/quran-terminology/en/roots/h-r-sad/" data-root-meaning="Ḥaraṣa: intense desire and earnest concern for something sought">حَرَصتُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَميلوا" data-root="M Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-y-l/" data-root-meaning="Leaning to one side or departing from balance.">تَميلوا</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلَّ</button>
    <button class="word-link" type="button" data-word="المَيلِ" data-root="M Y L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-y-l/" data-root-meaning="Leaning to one side or departing from balance.">المَيلِ</button>
    <button class="word-link" type="button" data-word="فَتَذَروها" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be.">فَتَذَروها</button>
    <button class="word-link" type="button" data-word="كَالمُعَلَّقَةِ" data-root="AYN L Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-q/" data-root-meaning="Clinging or hanging; ʿalaq and ʿalaqah denote clinging matter or congealed blood in lexical explanations.">كَالمُعَلَّقَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُصلِحوا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state">تُصلِحوا</button>
    <button class="word-link" type="button" data-word="وَتَتَّقوا" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">وَتَتَّقوا</button>
    <button class="word-link" type="button" data-word="فَإِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="غَفورًا" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">غَفورًا</button>
    <button class="word-link" type="button" data-word="رَحيمًا" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحيمًا</button>
  </p>
  <p class="english-verse">You will never be able to be equitable between women, however eager you may be. So do not incline entirely to one side, leaving her as though suspended. If you make amends and are mindful, indeed, The God is forgiving, merciful.</p>
</section>
