  <h2 class="ayah-title">An-Nisa 4:156</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبِكُفرِهِم" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="And because of their disbelief, part of the criticised group’s conduct.">وَبِكُفرِهِم</button>
    <button class="word-link" type="button" data-word="وَقَولِهِم" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And their saying, the wrongful statement made about Mary.">وَقَولِهِم</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="مَريَمَ" data-root-note="Proper name; no root has been assigned.">مَريَمَ</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="B H2 T" data-root-meaning="In one branch, B H T denotes bewilderment and inability to respond to something startling or an unanswerable argument. In another, buhtān denotes falsehood and wrongful attribution distorting truth and potentially exposing an innocent person to accusation or harm." data-context="A grave calumny against Mary, a wrongful allegation made about her." data-learn-more="/quran-terminology/en/roots/b-h2-t/">بُهتٰنًا</button>

  </p>
  <p class="english-verse">And for their disbelief and their uttering a great slander against Mary;</p>
