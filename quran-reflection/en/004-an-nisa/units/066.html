  <h2 class="ayah-title">An-Nisa 4:66</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنّا</button>
    <button class="word-link" type="button" data-word="كَتَبنا" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="We prescribed and required, in the hypothetical condition.">كَتَبنا</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>

    <button class="word-link" type="button" data-word="اقتُلوا" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="Kill, within the quoted hypothetical rather than an independent command.">اقتُلوا</button>

    <button class="word-link" type="button" data-word="أَوِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوِ</button>
    <button class="word-link" type="button" data-word="اخرُجوا" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Leave, within the verse’s hypothetical condition.">اخرُجوا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دِيٰرِكُم" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence" data-context="Your homes and lands.">دِيٰرِكُم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فَعَلوهُ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="They would have done it, here negated.">فَعَلوهُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلٌ" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter." data-context="A few, the number acting within the hypothesis.">قَليلٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَو</button>
    <button class="word-link" type="button" data-word="أَنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّهُم</button>
    <button class="word-link" type="button" data-word="فَعَلوا" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="They acted upon.">فَعَلوا</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يوعَظونَ" data-root="W AYN ZH (W ʿ Ẓ)" data-learn-more="/quran-terminology/en/roots/w-ayn-zha/" data-root-meaning="Admonishing, counseling, warning, and reminding of consequences in order to make one attentive and reform conduct." data-context="They are counselled and admonished concerning it.">يوعَظونَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="لَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Would surely have been, the condition’s result.">لَكانَ</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better and more beneficial.">خَيرًا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="وَأَشَدَّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="And stronger or greater, describing the strengthening.">وَأَشَدَّ</button>
    <button class="word-link" type="button" data-word="تَثبيتًا" data-root="TH B T" data-root-meaning="TH B T concerns something being firm and remaining established in its position, condition, or validity. Causative forms express making firm, maintaining, or establishing something." data-context="Greater strengthening and firmness, the result of acting on counsel." data-learn-more="/quran-terminology/en/roots/th-b-t/">تَثبيتًا</button>
  </p>
  <p class="english-verse">Had We prescribed for them, “Kill yourselves,” or “Leave your homes,” they would not have done it except for a few of them. Had they done what they were admonished to do, it would have been better for them and more firmly establishing.</p>
</section>
