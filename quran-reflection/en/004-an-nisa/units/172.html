<section class="ayah-block" id="ayah-172" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:172</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="يَستَنكِفَ" data-root="N K F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-f/" data-root-meaning="Disdaining or refusing as beneath one&#x27;s dignity." data-context="Disdain or refuse; the Messiah does not disdain serving The God.">يَستَنكِفَ</button>
    <button class="word-link" type="button" data-word="المَسيحُ" data-root="M S H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-h/" data-root-meaning="Wiping or rubbing; also measuring a surface." data-context="The Messiah, the title of the person who does not disdain service.">المَسيحُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Be, in the expression of being a servant.">يَكونَ</button>
    <button class="word-link" type="button" data-word="عَبدًا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="A servant, the Messiah’s relation to The God.">عَبدًا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="وَلَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَا</button>
    <button class="word-link" type="button" data-word="المَلٰئِكَةُ" data-root="A L K / M L K" data-learn-more="/quran-terminology/en/roots/a-l-k/" data-root-note="The derivation of malak / malaikah is disputed. This study examines a possible connection with A L K; the Quranic Arabic Corpus indexes these words under M L K." data-root-meaning="Message and message-bearing: a possible relationship to malak and the place of angels in the Qur’an" data-context="The angels, who likewise do not disdain service.">المَلٰئِكَةُ</button>
    <button class="word-link" type="button" data-word="المُقَرَّبونَ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness" data-context="Brought near, describing the angels.">المُقَرَّبونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَستَنكِف" data-root="N K F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-k-f/" data-root-meaning="Disdaining or refusing as beneath one&#x27;s dignity." data-context="Disdains service, within the conditional clause.">يَستَنكِف</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="عِبادَتِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="His service, which the person disdains.">عِبادَتِهِ</button>
    <button class="word-link" type="button" data-word="وَيَستَكبِر" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="And acts arrogantly, alongside disdaining service.">وَيَستَكبِر</button>
    <button class="word-link" type="button" data-word="فَسَيَحشُرُهُم" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="Then He will gather them all toward Himself." data-learn-more="/quran-terminology/en/roots/h-sh-r/">فَسَيَحشُرُهُم</button>
    <button class="word-link" type="button" data-word="إِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="All together, emphasizing the gathering’s scope.">جَميعًا</button>
  </p>
  <p class="english-verse">The Messiah will never disdain being a servant of The God, nor will the angels brought near. Whoever disdains His worship and is arrogant, He will gather them all to Himself.</p>
</section>
