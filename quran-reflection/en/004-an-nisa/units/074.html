<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:74</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَليُقٰتِل" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="So let them fight.">فَليُقٰتِل</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; in The God’s way.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَشرونَ" data-root="SH R Y" data-learn-more="/quran-terminology/en/roots/sh-r-y/" data-root-meaning="Buying, selling, exchanging, and giving up one thing in return for another" data-context="Sell or exchange.">يَشرونَ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةَ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="Life.">الحَيوٰةَ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present." data-context="Worldly; this present life.">الدُّنيا</button>
    <button class="word-link" type="button" data-word="بِالـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="In exchange for the Hereafter.">بِالـٔاخِرَةِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُقٰتِل" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="Fights.">يُقٰتِل</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="The way; in The God’s way.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَيُقتَل" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="And is killed.">فَيُقتَل</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="يَغلِب" data-root="GH L B" data-learn-more="/quran-terminology/en/roots/gh-l-b/" data-root-meaning="Prevailing, gaining ascendancy, and defeating; in the physical branch, thickness and stoutness of necks or trees." data-context="Prevails and wins.">يَغلِب</button>
    <button class="word-link" type="button" data-word="فَسَوفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَسَوفَ</button>
    <button class="word-link" type="button" data-word="نُؤتيهِ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="We will give him.">نُؤتيهِ</button>
    <button class="word-link" type="button" data-word="أَجرًا" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action" data-context="A reward.">أَجرًا</button>
    <button class="word-link" type="button" data-word="عَظيمًا" data-root="ʿ Ẓ M" data-learn-more="/quran-terminology/en/roots/ayn-zha-m/" data-root-meaning="Magnitude, structure, weight, rank, and the heaviness of effect" data-context="Great.">عَظيمًا</button>
  </p>
  <p class="english-verse">Let those who sell the worldly life for the Hereafter fight in the way of The God. Whoever fights in the way of The God and is killed or prevails, We will give him a great reward.</p>
</section>
