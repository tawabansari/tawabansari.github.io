<section class="ayah-block" id="ayah-140" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:140</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="نَزَّلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Has sent down, referring to the instruction previously revealed in the Book.">نَزَّلَ</button>
    <button class="word-link" type="button" data-word="عَلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Book, the revealed text containing this instruction.">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="سَمِعتُم" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="You hear, concerning awareness of the rejection and mockery of the signs.">سَمِعتُم</button>
    <button class="word-link" type="button" data-word="ءايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The signs or verses, the subject of rejection and mockery in this gathering.">ءايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="يُكفَرُ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Are rejected, a passive verb referring to the signs.">يُكفَرُ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="وَيُستَهزَأُ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game" data-context="And are mocked, the derisive treatment of the signs.">وَيُستَهزَأُ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَقعُدوا" data-root="Q ʿ D" data-learn-more="/quran-terminology/en/roots/q-ayn-d/" data-root-meaning="Sitting, remaining in place, positions, and foundations" data-context="Do not sit, forbidding continued sitting with them in this situation.">تَقعُدوا</button>
    <button class="word-link" type="button" data-word="مَعَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَهُم</button>
    <button class="word-link" type="button" data-word="حَتّىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَتّىٰ</button>
    <button class="word-link" type="button" data-word="يَخوضوا" data-root="KH W DAD" data-root-meaning="Entering and moving within something; in discourse, entering a discussion or conversation and engaging in it." data-context="Engage in conversation on another subject, after the rejection and mockery of the signs cease." data-learn-more="/quran-terminology/en/roots/kh-w-dad/">يَخوضوا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="حَديثٍ" data-root="H D TH" data-learn-more="/quran-terminology/en/roots/h-d-th/" data-root-meaning="From Coming into Being to Speech That Is Recounted" data-context="Discourse or conversation, another subject in which they engage.">حَديثٍ</button>
    <button class="word-link" type="button" data-word="غَيرِهِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Other than it, different from the discourse of rejection and mockery in question.">غَيرِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّكُم</button>
    <button class="word-link" type="button" data-word="إِذًا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذًا</button>
    <button class="word-link" type="button" data-word="مِثلُهُم" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="Like them, in the consequence of the companionship described in the verse.">مِثلُهُم</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="جامِعُ" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="Gatherer, describing the gathering of hypocrites and disbelievers.">جامِعُ</button>
    <button class="word-link" type="button" data-word="المُنٰفِقينَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="The hypocrites, one of the two groups named at the verse’s end.">المُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="وَالكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="And the disbelievers, the other group in the statement of gathering.">وَالكٰفِرينَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="جَميعًا" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field" data-context="All together, the scope of the gathering of the named groups.">جَميعًا</button>
  </p>
  <p class="english-verse">He has sent down to you in the Book that when you hear The God’s signs being disbelieved in and mocked, do not sit with them until they engage in another conversation; otherwise you are like them. Indeed, The God will gather the hypocrites and disbelievers all together in Hell.</p>
</section>
