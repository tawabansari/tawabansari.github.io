  <h2 class="ayah-title">An-Nisa 4:51</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Have you not considered; inviting attention to the conduct of the group being described.">تَرَ</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أوتوا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Were given; those who received a share of the Scripture.">أوتوا</button>
    <button class="word-link" type="button" data-word="نَصيبًا" data-root="N SAD B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sad-b/" data-root-meaning="Setting up; naṣab is fatigue; naṣīb is a share; nuṣub are cultic stones." data-context="A share or portion; what they were given of the Scripture.">نَصيبًا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبِ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation" data-context="The Scripture; revealed writing of which the criticized group has a share.">الكِتٰبِ</button>
    <button class="word-link" type="button" data-word="يُؤمِنونَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="They believe; accepting and assenting to jibt and ṭāghūt.">يُؤمِنونَ</button>
    <button class="word-link" type="button" data-word="بِالجِبتِ" data-root="J B T" data-root-meaning="Jibt: a name for an idol, sorcerer, soothsayer, or other false object or authority wrongfully invested with belief and veneration." data-context="In jibt; accepting and believing in what this context treats as a false object or authority; the verse names no exclusive referent." data-learn-more="/quran-terminology/en/roots/j-b-t/">بِالجِبتِ</button>
    <button class="word-link" type="button" data-word="وَالطّٰغوتِ" data-root="Ṭ GH Y" data-learn-more="/quran-terminology/en/roots/tt-gh-y/" data-root-meaning="From transgression to Taghut: passing beyond the limit, breaking the boundary, and a false reference sitting in the place of truth" data-context="And ṭāghūt; a false authority exceeding rightful limits, placed alongside jibt as an object of their belief.">وَالطّٰغوتِ</button>
    <button class="word-link" type="button" data-word="وَيَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And they say; expressing their judgment that the disbelievers’ way is superior.">وَيَقولونَ</button>

    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved; those described by rejection in contrast to the believers’ faith.">كَفَروا</button>
    <button class="word-link" type="button" data-word="هٰؤُلاءِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰؤُلاءِ</button>
    <button class="word-link" type="button" data-word="أَهدىٰ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Better guided; the superiority in guidance they attribute to the disbelievers.">أَهدىٰ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believed; the believers whose way is ranked lower in this mistaken judgment.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="سَبيلًا" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="In respect of a way; the course being compared in the judgment about guidance.">سَبيلًا</button>
  </p>
  <p class="english-verse">Have you not seen those who were given a portion of the Book? They believe in jibt and taghut and say of those who disbelieve, “These are better guided in their way than those who believe.”</p>
</section>
