<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَعصِ" data-root="ʿ Ṣ Y" data-learn-more="/quran-terminology/en/roots/ayn-sad-y/" data-root-meaning="Disobeying a command, refusing an instruction, and acting against the path of obedience." data-context="Disobeys The God and His Messenger.">يَعصِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And His Messenger, in the statement concerning disobedience.">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="وَيَتَعَدَّ" data-root="ʿ D W" data-learn-more="/quran-terminology/en/roots/ayn-d-w/" data-root-meaning="Swift movement, passing beyond a limit, crossing a boundary, transgression, and entering a position of enmity." data-context="And transgresses the divinely prescribed boundaries.">وَيَتَعَدَّ</button>
    <button class="word-link" type="button" data-word="حُدودَهُ" data-root="H D D" data-root-meaning="Boundary and limit; prevention, sharpness, and cutting." data-context="His boundaries; divine limits whose transgression is described." data-learn-more="/quran-terminology/en/roots/h-d-d/">حُدودَهُ</button>
    <button class="word-link" type="button" data-word="يُدخِلهُ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="He admits him into the fire described.">يُدخِلهُ</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="A fire, the destination described.">نارًا</button>
    <button class="word-link" type="button" data-word="خٰلِدًا" data-root="KH L D" data-learn-more="/quran-terminology/en/roots/kh-l-d/" data-root-meaning="Remaining, enduring, and staying unchanged in a state or place" data-context="Remaining in that fire, describing the person’s outcome.">خٰلِدًا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="وَلَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَهُ</button>
    <button class="word-link" type="button" data-word="عَذابٌ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment and suffering stated for him.">عَذابٌ</button>
    <button class="word-link" type="button" data-word="مُهينٌ" data-root="H W N" data-learn-more="/quran-terminology/en/roots/h2-w-n/" data-root-meaning="Ease, gentleness, and the lowering of status" data-context="Humiliating, describing that punishment.">مُهينٌ</button>
  </p>
  <p class="english-verse">Whoever disobeys The God and His messenger and oversteps His bounds, He will admit him into a fire, abiding therein; and his is a humiliating punishment.</p>
</section>
