  <h2 class="ayah-title">An-Nisa 4:14</h2>
  <p class="arabic-text">

  <p class="english-verse">Whoever disobeys The God and His messenger and oversteps His bounds, He will admit him into a fire, abiding therein; and his is a humiliating punishment.</p>
