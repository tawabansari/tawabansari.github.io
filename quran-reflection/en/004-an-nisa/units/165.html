<section class="ayah-block" id="ayah-165" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:165</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="رُسُلًا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">رُسُلًا</button>

    <button class="word-link" type="button" data-word="وَمُنذِرينَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">وَمُنذِرينَ</button>

    <button class="word-link" type="button" data-word="عَزيزًا" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">عَزيزًا</button>
    <button class="word-link" type="button" data-word="حَكيمًا" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">حَكيمًا</button>
  </p>
  <p class="english-verse">Messengers bearing good news and warning, so that people would have no argument against The God after the messengers. The God is mighty, wise.</p>
