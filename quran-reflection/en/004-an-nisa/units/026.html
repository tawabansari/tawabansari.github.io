  <h2 class="ayah-title">An-Nisa 4:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>

    <button class="word-link" type="button" data-word="حَكيمٌ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">حَكيمٌ</button>

  <p class="english-verse">The God wishes to make clear to you, guide you to the ways of those before you, and turn to you. The God is knowing, wise.</p>
