<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:56</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Denied; in relation to the divine signs.">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs; the object of the denial mentioned.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="سَوفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">سَوفَ</button>
    <button class="word-link" type="button" data-word="نُصليهِم" data-root="SAD L Y" data-learn-more="/quran-terminology/en/roots/sad-l-y/" data-root-meaning="From taking warmth from a fire to entering it" data-context="We shall expose them to burning; describing punishment by fire.">نُصليهِم</button>
    <button class="word-link" type="button" data-word="نارًا" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="A fire; that to which they are exposed in the verse’s depiction.">نارًا</button>
    <button class="word-link" type="button" data-word="كُلَّما" data-root="K L L" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-learn-more="/quran-terminology/en/roots/k-l-l/" data-context="Whenever; introducing the condition for the replacement of skins.">كُلَّما</button>
    <button class="word-link" type="button" data-word="نَضِجَت" data-root="N DAD J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-dad-j/" data-root-meaning="Becoming cooked through or burned." data-context="Are cooked or burned through; the skins’ change under heat.">نَضِجَت</button>
    <button class="word-link" type="button" data-word="جُلودُهُم" data-root="J L D" data-root-meaning="Skin and the body’s outer covering; firmness and endurance; and, in the relevant verbal use, flogging." data-context="Their skins; those affected and burned through by fire in the verse’s depiction." data-learn-more="/quran-terminology/en/roots/j-l-d/">جُلودُهُم</button>
    <button class="word-link" type="button" data-word="بَدَّلنٰهُم" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning." data-context="We replace for them; other skins in place of the previous ones.">بَدَّلنٰهُم</button>
    <button class="word-link" type="button" data-word="جُلودًا" data-root="J L D" data-root-meaning="Skin and the body’s outer covering; firmness and endurance; and, in the relevant verbal use, flogging." data-context="Other skins; in the replacement of skins so that they taste the punishment." data-learn-more="/quran-terminology/en/roots/j-l-d/">جُلودًا</button>
    <button class="word-link" type="button" data-word="غَيرَها" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Other than them; describing the replacement skins.">غَيرَها</button>
    <button class="word-link" type="button" data-word="لِيَذوقُوا" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering." data-context="So that they taste; experiencing the punishment described.">لِيَذوقُوا</button>
    <button class="word-link" type="button" data-word="العَذابَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="The punishment; that which they are to taste.">العَذابَ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was/is; in the statement of divine might and wisdom.">كانَ</button>
    <button class="word-link" type="button" data-word="عَزيزًا" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty" data-context="Mighty and unassailable; a divine description at the verse’s end.">عَزيزًا</button>
    <button class="word-link" type="button" data-word="حَكيمًا" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="Wise; a divine description alongside might.">حَكيمًا</button>
  </p>
  <p class="english-verse">Those who disbelieve in Our signs, We will make them burn in a fire. Whenever their skins are burned through, We will replace them with other skins so that they may taste the punishment. Indeed, The God is mighty, wise.</p>
</section>
