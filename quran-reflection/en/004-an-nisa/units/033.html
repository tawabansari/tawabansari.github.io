<section class="ayah-block" id="ayah-033" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِكُلٍّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">وَلِكُلٍّ</button>
    <button class="word-link" type="button" data-word="جَعَلنا" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلنا</button>
    <button class="word-link" type="button" data-word="مَوٰلِىَ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority.">مَوٰلِىَ</button>
    <button class="word-link" type="button" data-word="مِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمّا</button>
    <button class="word-link" type="button" data-word="تَرَكَ" data-root="T R K" data-learn-more="/quran-terminology/en/roots/t-r-k/" data-root-meaning="Leaving, abandoning, letting go, leaving something behind, and changing one’s active relation to it">تَرَكَ</button>
    <button class="word-link" type="button" data-word="الوٰلِدانِ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth">الوٰلِدانِ</button>
    <button class="word-link" type="button" data-word="وَالأَقرَبونَ" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness">وَالأَقرَبونَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="عَقَدَت" data-root="AYN Q D" data-learn-more="/quran-terminology/en/roots/ayn-q-d/" data-root-meaning="ʿAqd is binding and establishing a connection that joins its parts and makes them firm to some degree.">عَقَدَت</button>
    <button class="word-link" type="button" data-word="أَيمٰنُكُم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing.">أَيمٰنُكُم</button>
    <button class="word-link" type="button" data-word="فَـٔاتوهُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">فَـٔاتوهُم</button>
    <button class="word-link" type="button" data-word="نَصيبَهُم" data-root="N SAD B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-sad-b/" data-root-meaning="Setting up; naṣab is fatigue; naṣīb is a share; nuṣub are cultic stones.">نَصيبَهُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="شَهيدًا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">شَهيدًا</button>
  </p>
  <p class="english-verse">For each We have appointed heirs to what parents and close relatives leave. As for those with whom your right hands have made a pledge, give them their share. Indeed, The God is witness over all things.</p>
</section>
