<section class="ayah-block" id="ayah-084" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:84</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَقٰتِل" data-root="Q T L" data-learn-more="/quran-terminology/en/roots/q-t-l/" data-root-meaning="Killing, being killed, mutual fighting, and responsibility before human life" data-context="So fight in the way of The God; the command to fight establishes the subject of urging believers later in the verse.">فَقٰتِل</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="سَبيلِ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="Way; in “the way of The God,” expressing the direction and purpose of the fighting discussed.">سَبيلِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تُكَلَّفُ" data-root="K L F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-l-f/" data-root-meaning="Assigning a task or obligation; takalluf means undertaking with strain or affectation." data-context="You are not charged; the negative construction and exception specify the addressee’s responsibility.">تُكَلَّفُ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="نَفسَكَ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Yourself; the addressee is charged with responsibility for himself and then commanded to urge believers.">نَفسَكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَحَرِّضِ" data-root="H R DAD" data-root-meaning="Severe wasting and weakness to the verge of destruction; in Form II, urging and prompting action." data-context="Urging and encouraging believers to participate in the fighting discussed in the verse." data-learn-more="/quran-terminology/en/roots/h-r-dad/">وَحَرِّضِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers; those whom the Prophet is commanded to urge in the context of fighting.">المُؤمِنينَ</button>
    ۖ
    <button class="word-link" type="button" data-word="عَسَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَسَى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَكُفَّ" data-root="K F F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-f-f/" data-root-meaning="The palm; restraining or desisting; kāffah means all together." data-context="Restrain; holding back the force and aggression of those who disbelieve is expressed as the hoped-for outcome.">يَكُفَّ</button>
    <button class="word-link" type="button" data-word="بَأسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="The force and fighting might of those who disbelieve, whose restraint the verse discusses.">بَأسَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved; describing the group whose force and aggression are to be restrained in this context.">كَفَروا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="أَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="Stronger and more intense; a comparative expressing the greater might of The God here.">أَشَدُّ</button>
    <button class="word-link" type="button" data-word="بَأسًا" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="Might and force; here the might of The God is compared with that of the opposing group.">بَأسًا</button>
    <button class="word-link" type="button" data-word="وَأَشَدُّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree" data-context="And more severe; a comparative describing the severity of The God’s chastisement and deterrence.">وَأَشَدُّ</button>
    <button class="word-link" type="button" data-word="تَنكيلًا" data-root="N K L" data-learn-more="/quran-terminology/en/roots/n-k-l/" data-root-meaning="Holding back, restraining, pushing back, and making one retreat; in punitive contexts, a restraining consequence." data-context="Severe, deterrent chastisement; describing the severity of The God’s chastisement at the verse’s close.">تَنكيلًا</button>
  </p>
  <p class="english-verse">Fight in the way of The God; you are responsible only for yourself. Urge the believers on. It may be that The God will restrain the might of those who disbelieve. The God is greater in might and more severe in exemplary punishment.</p>
</section>
