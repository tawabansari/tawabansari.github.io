  <p class="english-verse">Those whom the angels take while they are wronging themselves, they ask, “In what condition were you?” They say, “We were oppressed in the land.” They ask, “Was The God’s earth not spacious enough for you to migrate in it?” Those have Hell as their refuge—an evil destination.</p>
