<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">An-Nisa 4:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="أَرَدتُمُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence" data-context="You wish, intending to replace one wife with another.">أَرَدتُمُ</button>
    <button class="word-link" type="button" data-word="استِبدالَ" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning." data-context="Replacing, taking one wife in place of another.">استِبدالَ</button>
    <button class="word-link" type="button" data-word="زَوجٍ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="A wife, the one taken in place of another.">زَوجٍ</button>
    <button class="word-link" type="button" data-word="مَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="In place of, expressing replacement of the other wife.">مَكانَ</button>
    <button class="word-link" type="button" data-word="زَوجٍ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Another wife, whose place is taken by the new wife.">زَوجٍ</button>
    <button class="word-link" type="button" data-word="وَءاتَيتُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="And you have given, concerning property previously given to one of the wives.">وَءاتَيتُم</button>
    <button class="word-link" type="button" data-word="إِحدىٰهُنَّ" data-root="A Ḥ D" data-root-meaning="Aḥad: one, one of, and no one under negation" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-context="One of them, referring to one of the wives.">إِحدىٰهُنَّ</button>
    <button class="word-link" type="button" data-word="قِنطارًا" data-root="Q N Ṭ R" data-root-meaning="Qinṭār: a large weight unit whose value varied across historical systems; in Qur’anic usage, a substantial amount of wealth or property." data-context="A great amount of wealth, without a fixed numerical quantity specified here." data-learn-more="/quran-terminology/en/roots/q-n-tt-r/">قِنطارًا</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="تَأخُذوا" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Then do not take, prohibiting recovery of anything from the property given.">تَأخُذوا</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God Shayʾ denotes a thing or matter being referred to." data-context="Anything, any portion of the property given in this prohibition.">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَتَأخُذونَهُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="Would you take it back, a rebuking question about recovering the property.">أَتَأخُذونَهُ</button>
    <button class="word-link" type="button" data-word="بُهتٰنًا" data-root="B H2 T" data-root-meaning="In one branch, B H T denotes bewilderment and inability to respond to something startling or an unanswerable argument. In another, buhtān denotes falsehood and wrongful attribution distorting truth and potentially exposing an innocent person to accusation or harm." data-context="Through calumny and a wrongful claim, condemning unjust recovery of property given to a wife." data-learn-more="/quran-terminology/en/roots/b-h2-t/">بُهتٰنًا</button>
    <button class="word-link" type="button" data-word="وَإِثمًا" data-root="A TH M" data-learn-more="/quran-terminology/en/roots/a-th-m/" data-root-meaning="Sin, moral responsibility, and the lexical connection with slowness and falling behind" data-context="And sin, the wrongdoing involved in taking it.">وَإِثمًا</button>
    <button class="word-link" type="button" data-word="مُبينًا" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Manifest, describing the sin of wrongfully taking the property.">مُبينًا</button>
  </p>
  <p class="english-verse">If you wish to replace one spouse with another, and you have given one of them a great sum, do not take anything from it. Would you take it through slander and manifest sin?</p>
</section>
