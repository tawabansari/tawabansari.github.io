<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَيسَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَيسَ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَعمىٰ" data-root="AYN M Y" data-learn-more="/quran-terminology/en/roots/ayn-m-y/" data-root-meaning="Blindness, not seeing, the covered path of sight, ambiguity, and the loss of observation or discernment" data-context="The blind person, one of the three groups exempted in this matter.">الأَعمىٰ</button>
    <button class="word-link" type="button" data-word="حَرَجٌ" data-root="H R J" data-root-meaning="Constraint, pressure, and restriction; being caught in difficulty or liability." data-context="Blame for inability arising from blindness in the responsibility under discussion, lifted by the verse." data-learn-more="/quran-terminology/en/roots/h-r-j/">حَرَجٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَعرَجِ" data-root="AYN R J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-j/" data-root-meaning="Ascending; maʿārij are ways of ascent; aʿraj denotes lameness." data-context="The person with impaired walking, one group with a physical excuse.">الأَعرَجِ</button>
    <button class="word-link" type="button" data-word="حَرَجٌ" data-root="H R J" data-root-meaning="Constraint, pressure, and restriction; being caught in difficulty or liability." data-context="Blame for impaired mobility in the responsibility under discussion, lifted by the verse." data-learn-more="/quran-terminology/en/roots/h-r-j/">حَرَجٌ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="المَريضِ" data-root="M R DAD" data-learn-more="/quran-terminology/en/roots/m-r-dad/" data-root-meaning="Illness, weakness, deficiency, and departure from health and balance" data-context="The ill person, the third group with an excuse in the verse.">المَريضِ</button>
    <button class="word-link" type="button" data-word="حَرَجٌ" data-root="H R J" data-root-meaning="Constraint, pressure, and restriction; being caught in difficulty or liability." data-context="Blame for inability arising from illness in the responsibility under discussion, lifted by the verse." data-learn-more="/quran-terminology/en/roots/h-r-j/">حَرَجٌ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُطِعِ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/" data-context="Obeys, obedience to The God and His messenger.">يُطِعِ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And His messenger, alongside The God as the object of obedience.">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="يُدخِلهُ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="Admits that person, bringing the obedient person into gardens.">يُدخِلهُ</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="Gardens, the reward described in the verse.">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="تَجرى" data-root="J R Y" data-learn-more="/quran-terminology/en/roots/j-r-y/" data-root-meaning="Flowing, running, continuous movement in a channel, and moving along an appointed course" data-context="Flow, referring to rivers in the description of the gardens.">تَجرى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="تَحتِهَا" data-root="T Ḥ T" data-learn-more="/quran-terminology/en/roots/t-h-t/" data-root-meaning="Under, beneath, lower position, hidden layer, and foundational or relational placement" data-context="Beneath them, locating the rivers in relation to the gardens.">تَحتِهَا</button>
    <button class="word-link" type="button" data-word="الأَنهٰرُ" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="Rivers, the flowing waterways in the image of reward.">الأَنهٰرُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يَتَوَلَّ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Turns away, opposite obedience in the preceding clause.">يَتَوَلَّ</button>
    <button class="word-link" type="button" data-word="يُعَذِّبهُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishes that person, the stated consequence of turning away.">يُعَذِّبهُ</button>
    <button class="word-link" type="button" data-word="عَذابًا" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="A punishment, the suffering and recompense stated in the verse.">عَذابًا</button>
    <button class="word-link" type="button" data-word="أَليمًا" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being" data-context="Painful, describing the punishment at the verse’s conclusion.">أَليمًا</button>
  </p>
  <p class="english-verse">There is no blame upon the blind, nor upon the lame, nor upon the sick. Whoever obeys The God and His messenger, He will admit him into gardens beneath which rivers flow; whoever turns away, He will punish him with a painful punishment.</p>
</section>
