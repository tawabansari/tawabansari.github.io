  <p class="english-verse">When those who disbelieved placed zeal in their hearts—the zeal of ignorance—The God sent down His tranquility upon His messenger and upon the believers and bound them to the word of mindfulness. They were more entitled to it and worthy of it. The God knows everything.</p>
