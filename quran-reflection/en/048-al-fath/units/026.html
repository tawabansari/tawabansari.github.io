<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Put or placed; concerning zeal in the hearts of those who disbelieved.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieved; the group who placed the zeal of ignorance in their hearts.">كَفَروا</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِهِمُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Their hearts; their inward disposition in which partisan zeal is placed here.">قُلوبِهِمُ</button>
    <button class="word-link" type="button" data-word="الحَمِيَّةَ" data-root="H M Y" data-root-meaning="Heat and becoming hot; protection and preventing harm or access; ḥamiyyah: protective zeal, arousal, and partisanship." data-context="The partisan zeal those who disbelieved placed in their hearts; the following phrase specifies its ignorant kind." data-learn-more="/quran-terminology/en/roots/h-m-y/">الحَمِيَّةَ</button>
    <button class="word-link" type="button" data-word="حَمِيَّةَ" data-root="H M Y" data-root-meaning="Heat and becoming hot; protection and preventing harm or access; ḥamiyyah: protective zeal, arousal, and partisanship." data-context="Zeal; in ḥamiyyat al-jāhiliyyah, the censured partisanship contrasted with tranquility and reverent mindfulness." data-learn-more="/quran-terminology/en/roots/h-m-y/">حَمِيَّةَ</button>
    <button class="word-link" type="button" data-word="الجٰهِلِيَّةِ" data-root="J H L" data-learn-more="/quran-terminology/en/roots/j-h2-l/" data-root-meaning="Ignorance and unawareness; also rashness and unmeasured conduct arising from lack of knowledge, forbearance, or settled calm." data-context="Ignorance: the qualifier identifying the censured kind of zeal and partisanship in this group.">الجٰهِلِيَّةِ</button>
    <button class="word-link" type="button" data-word="فَأَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Then sent down; concerning the tranquility The God bestowed upon the messenger and believers.">فَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="سَكينَتَهُ" data-root="S K N" data-learn-more="/quran-terminology/en/roots/s-k-n/" data-root-meaning="Becoming calm, the settling of movement or anxiety, finding rest, and finding dwelling" data-context="His tranquility and steadiness; contrasted with the zeal of ignorance.">سَكينَتَهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="رَسولِهِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="His messenger; the messenger upon whom divine tranquility descended.">رَسولِهِ</button>
    <button class="word-link" type="button" data-word="وَعَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلَى</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="The believers; those who received divine tranquility together with the messenger.">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="وَأَلزَمَهُم" data-root="L Z M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-z-m/" data-root-meaning="Adhering or remaining inseparable; ilzām means binding or imposing." data-context="And bound them firmly; concerning their adherence to the word of reverent mindfulness.">وَأَلزَمَهُم</button>
    <button class="word-link" type="button" data-word="كَلِمَةَ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="A word or utterance; in kalimat al-taqwā, expressing their commitment to reverent mindfulness.">كَلِمَةَ</button>
    <button class="word-link" type="button" data-word="التَّقوىٰ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Reverent mindfulness; guarding oneself against what is wrong and harmful.">التَّقوىٰ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And they were; stating their entitlement and worthiness.">وَكانوا</button>
    <button class="word-link" type="button" data-word="أَحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="More entitled or worthy; concerning their relationship to the word of reverent mindfulness.">أَحَقَّ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="وَأَهلَها" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="And worthy of it; those suited to that word.">وَأَهلَها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And is; in this statement, expressing The God’s knowledge.">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Of every; indicating that this knowledge encompasses everything.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing; in bi-kulli shayʾ, everything that is an object of knowledge.">شَىءٍ</button>
    <button class="word-link" type="button" data-word="عَليمًا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowing; describing The God as knowing all things.">عَليمًا</button>
  </p>
  <p class="english-verse">When those who disbelieved placed zeal in their hearts—the zeal of ignorance—The God sent down His tranquility upon His messenger and upon the believers and bound them to the word of mindfulness. They were more entitled to it and worthy of it. The God knows everything.</p>
</section>
