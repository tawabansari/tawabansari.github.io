<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَقَد</button>
    <button class="word-link" type="button" data-word="رَضِىَ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent">رَضِىَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="المُؤمِنينَ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">المُؤمِنينَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="يُبايِعونَكَ" data-root="B Y AYN" data-learn-more="/quran-terminology/en/roots/b-y-ayn/" data-root-meaning="Selling, buying and selling, transferring something in exchange for compensation, and completing a clear transaction between two sides">يُبايِعونَكَ</button>
    <button class="word-link" type="button" data-word="تَحتَ" data-root="T Ḥ T" data-learn-more="/quran-terminology/en/roots/t-h-t/" data-root-meaning="Under, beneath, lower position, hidden layer, and foundational or relational placement">تَحتَ</button>
    <button class="word-link" type="button" data-word="الشَّجَرَةِ" data-root="SH J R" data-learn-more="/quran-terminology/en/roots/sh-j-r/" data-root-meaning="Branching, ramification, interweaving, and complex extension from a single origin">الشَّجَرَةِ</button>
    <button class="word-link" type="button" data-word="فَعَلِمَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">فَعَلِمَ</button>

    <button class="word-link" type="button" data-word="فَأَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">فَأَنزَلَ</button>

    <button class="word-link" type="button" data-word="فَتحًا" data-root="F T Ḥ" data-learn-more="/quran-terminology/en/roots/f-t-h/" data-root-meaning="From Opening What Is Closed to Access, Judgment, and a Decisive Opening">فَتحًا</button>
    <button class="word-link" type="button" data-word="قَريبًا" data-root="Q R B" data-learn-more="/quran-terminology/en/roots/q-r-b/" data-root-meaning="Drawing near, being near, shortening distance, entering a boundary, and the station of nearness">قَريبًا</button>
  </p>
  <p class="english-verse">The God was certainly pleased with the believers when they pledged allegiance to you beneath the tree. He knew what was in their hearts, sent down tranquility upon them, and rewarded them with a near opening,</p>
