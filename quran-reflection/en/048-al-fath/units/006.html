<section class="ayah-block" id="ayah-006" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:6</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيُعَذِّبَ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">وَيُعَذِّبَ</button>
    <button class="word-link" type="button" data-word="المُنٰفِقينَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">المُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="وَالمُنٰفِقٰتِ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality">وَالمُنٰفِقٰتِ</button>
    <button class="word-link" type="button" data-word="وَالمُشرِكينَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">وَالمُشرِكينَ</button>
    <button class="word-link" type="button" data-word="وَالمُشرِكٰتِ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">وَالمُشرِكٰتِ</button>
    <button class="word-link" type="button" data-word="الظّانّينَ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action.">الظّانّينَ</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="ظَنَّ" data-root="Ẓ N N (Zha N N)" data-learn-more="/quran-terminology/en/roots/zha-n-n/" data-root-meaning="Supposition, dominant perception, serious expectation, and a mental calculation in which one possibility becomes weightier and affects judgment or action.">ظَنَّ</button>
    <button class="word-link" type="button" data-word="السَّوءِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">السَّوءِ</button>
    ۚ
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="دائِرَةُ" data-root="D W R" data-learn-more="/quran-terminology/en/roots/d-w-r/" data-root-meaning="Turning, surrounding, circles, and a place of residence">دائِرَةُ</button>
    <button class="word-link" type="button" data-word="السَّوءِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">السَّوءِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَغَضِبَ" data-root="GH Ḍ B" data-learn-more="/quran-terminology/en/roots/gh-dad-b/" data-root-meaning="Intense displeasure and a response to what is unacceptable">وَغَضِبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="وَلَعَنَهُم" data-root="L ʿ N" data-learn-more="/quran-terminology/en/roots/l-ayn-n/" data-root-meaning="Driving away, distancing, and being placed in a state of exclusion">وَلَعَنَهُم</button>
    <button class="word-link" type="button" data-word="وَأَعَدَّ" data-root="ʿ D D (Ayn D D)" data-learn-more="/quran-terminology/en/roots/ayn-d-d/" data-root-meaning="Counting, measure, appointed duration, and ordered preparation for a defined purpose">وَأَعَدَّ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَساءَت" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">وَساءَت</button>
    <button class="word-link" type="button" data-word="مَصيرًا" data-root="Ṣ Y R" data-learn-more="/quran-terminology/en/roots/sad-y-r/" data-root-meaning="Reaching an end: maṣīr as the outcome to which affairs lead">مَصيرًا</button>
  </p>
  <p class="english-verse">And punish hypocritical men and women and associating men and women who think evil thoughts of The God. Upon them is the turn of evil. The God is angry with them, has cursed them, and has prepared Hell for them—an evil destination.</p>
</section>
