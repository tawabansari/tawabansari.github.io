<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِيَغفِرَ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="so that He may forgive">لِيَغفِرَ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تَقَدَّمَ" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="has preceded">تَقَدَّمَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="ذَنبِكَ" data-root="DH N B" data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="Dhanb: attributable sin, fault, or offense; dhanab: a tail or rear part; dhanūb with initial fatḥah: a share or portion, also used for a water bucket." data-context="your sin, with the expressions of what precedes and follows">ذَنبِكَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَأَخَّرَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="has followed or will follow">تَأَخَّرَ</button>
    <button class="word-link" type="button" data-word="وَيُتِمَّ" data-root="T M M" data-learn-more="/quran-terminology/en/roots/t-m-m/" data-root-meaning="Reaching or bringing a matter to its appointed limit after its required amount, duration, parts, or stages are complete." data-context="and complete">وَيُتِمَّ</button>
    <button class="word-link" type="button" data-word="نِعمَتَهُ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="His favor">نِعمَتَهُ</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="وَيَهدِيَكَ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="and guide you">وَيَهدِيَكَ</button>
    <button class="word-link" type="button" data-word="صِرٰطًا" data-root="SAD R TT" data-root-meaning="A clear, directed, upright path; a straight route that carries a person toward the destination of truth" data-learn-more="/quran-terminology/en/roots/s-r-t/" data-context="a path">صِرٰطًا</button>
    <button class="word-link" type="button" data-word="مُستَقيمًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="straight">مُستَقيمًا</button>
  </p>
  <p class="english-verse">So that The God may forgive you what preceded of your sin and what followed, complete His favor upon you, and guide you to a straight path,</p>
</section>
