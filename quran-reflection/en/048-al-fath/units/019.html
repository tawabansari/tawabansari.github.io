<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمَغانِمَ" data-root="GH N M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-m/" data-root-meaning="Obtaining gains or spoils; ghanam denotes sheep and goats.">وَمَغانِمَ</button>
    <button class="word-link" type="button" data-word="كَثيرَةً" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">كَثيرَةً</button>
    <button class="word-link" type="button" data-word="يَأخُذونَها" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">يَأخُذونَها</button>
    ۗ
    <button class="word-link" type="button" data-word="وَكانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكانَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَزيزًا" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">عَزيزًا</button>
    <button class="word-link" type="button" data-word="حَكيمًا" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">حَكيمًا</button>
  </p>
  <p class="english-verse">And abundant spoils which they take. The God is Almighty, Wise.</p>
</section>
