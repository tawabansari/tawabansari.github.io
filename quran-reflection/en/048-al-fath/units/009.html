<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لِتُؤمِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="So that you may believe; the stated purpose of faith in The God and His Messenger.">لِتُؤمِنوا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="وَرَسولِهِ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="And His Messenger; The God’s envoy in whom belief is also required.">وَرَسولِهِ</button>
    <button class="word-link" type="button" data-word="وَتُعَزِّروهُ" data-root="AYN Z R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-z-r/" data-root-meaning="Supporting with honor; in other usages, restraining or disciplining." data-context="And support and strengthen him; referring to the Messenger in the reading distinguishing the pronoun referents.">وَتُعَزِّروهُ</button>
    <button class="word-link" type="button" data-word="وَتُوَقِّروهُ" data-root="W Q R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-q-r/" data-root-meaning="Heaviness; waqr is impaired hearing; wiqr is a load; tawqīr is honoring." data-context="And honor and revere him; respect for the Messenger in that reading.">وَتُوَقِّروهُ</button>
    <button class="word-link" type="button" data-word="وَتُسَبِّحوهُ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="And glorify Him; declaring The God free of deficiency in that reading.">وَتُسَبِّحوهُ</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="B K R" data-learn-more="/quran-terminology/en/roots/b-k-r/" data-root-meaning="From the beginning of the day and coming early to remaining in the first stage." data-context="Morning; one of the two stated times for glorification.">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَأَصيلًا" data-root="A SAD L" data-learn-more="/quran-terminology/en/roots/a-sad-l/" data-root-meaning="a thing’s root or foundation, and late afternoon as a particular part of the day." data-context="And late afternoon approaching sunset; paired with morning as a time of glorification.">وَأَصيلًا</button>
  </p>
  <p class="english-verse">So that you may believe in The God and His messenger, support and honor him, and glorify Him morning and evening.</p>
</section>
