<section class="ayah-block" id="ayah-015" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Fath 48:15</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="سَيَقولُ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">سَيَقولُ</button>
    <button class="word-link" type="button" data-word="المُخَلَّفونَ" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it">المُخَلَّفونَ</button>
    <button class="word-link" type="button" data-word="إِذَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذَا</button>
    <button class="word-link" type="button" data-word="انطَلَقتُم" data-root="TT L Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-l-q/" data-root-meaning="Releasing or setting out; ṭalāq is dissolution of a marriage.">انطَلَقتُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="مَغانِمَ" data-root="GH N M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-m/" data-root-meaning="Obtaining gains or spoils; ghanam denotes sheep and goats.">مَغانِمَ</button>
    <button class="word-link" type="button" data-word="لِتَأخُذوها" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">لِتَأخُذوها</button>
    <button class="word-link" type="button" data-word="ذَرونا" data-root="W DH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-dh-r/" data-root-meaning="Leaving or letting be.">ذَرونا</button>
    <button class="word-link" type="button" data-word="نَتَّبِعكُم" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">نَتَّبِعكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="يُريدونَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدونَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُبَدِّلوا" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">يُبَدِّلوا</button>
    <button class="word-link" type="button" data-word="كَلٰمَ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality">كَلٰمَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>
    <button class="word-link" type="button" data-word="لَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَن</button>
    <button class="word-link" type="button" data-word="تَتَّبِعونا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course.">تَتَّبِعونا</button>
    <button class="word-link" type="button" data-word="كَذٰلِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكُم</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلُ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَسَيَقولونَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">فَسَيَقولونَ</button>
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="تَحسُدونَنا" data-root="Ḥ S D" data-learn-more="/quran-terminology/en/roots/h-s-d/" data-root-meaning="Ḥasad: resenting another’s advantage and wishing for its loss">تَحسُدونَنا</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانوا</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَفقَهونَ" data-root="F Q H2" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-h2/" data-root-meaning="Understanding or comprehending speech or a matter.">يَفقَهونَ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="قَليلًا" data-root="Q L L" data-learn-more="/quran-terminology/en/roots/q-l-l/" data-root-meaning="Being little, becoming few, being slight, or becoming small in relation to a greater matter.">قَليلًا</button>
  </p>
  <p class="english-verse">When you set out to take spoils, those who stayed behind will say: Let us follow you. They wish to change the word of The God. Say: You will not follow us; The God said so before. Then they will say: Rather, you envy us. Rather, they understood only a little.</p>
</section>
