  <h2 class="ayah-title">Qaf 50:31</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأُزلِفَتِ" data-root="Z L F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/z-l-f/" data-root-meaning="Drawing near or bringing close; zulfā denotes proximity or standing.">وَأُزلِفَتِ</button>
    <button class="word-link" type="button" data-word="الجَنَّةُ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">الجَنَّةُ</button>
    <button class="word-link" type="button" data-word="لِلمُتَّقينَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger.">لِلمُتَّقينَ</button>

  <p class="english-verse">The Garden is brought near to the mindful, not far away.</p>
