<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Qaf 50:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَصحٰبُ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides">وَأَصحٰبُ</button>
    <button class="word-link" type="button" data-word="الأَيكَةِ" data-root="A Y K" data-root-note="Root study coming soon.">الأَيكَةِ</button>
    <button class="word-link" type="button" data-word="وَقَومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَقَومُ</button>
    <button class="word-link" type="button" data-word="تُبَّعٍ" data-root-note="Proper name; no root has been assigned.">تُبَّعٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="كُلٌّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلٌّ</button>
    <button class="word-link" type="button" data-word="كَذَّبَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">كَذَّبَ</button>
    <button class="word-link" type="button" data-word="الرُّسُلَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">الرُّسُلَ</button>
    <button class="word-link" type="button" data-word="فَحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth">فَحَقَّ</button>
    <button class="word-link" type="button" data-word="وَعيدِ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive">وَعيدِ</button>
  </p>
  <p class="english-verse">And the people of the thicket and the people of Tubba. All denied the messengers, so My warning came true.</p>
