<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Qaf 50:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَنَزَّلنا" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="and We sent down">وَنَزَّلنا</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="the sky">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="water">ماءً</button>
    <button class="word-link" type="button" data-word="مُبٰرَكًا" data-root="B R K" data-root-meaning="Stability and continuance; barakah is enduring, abundant good, while Qur’anic tabāraka expresses exaltation and abundant good." data-context="blessed" data-learn-more="/quran-terminology/en/roots/b-r-k/">مُبٰرَكًا</button>
    <button class="word-link" type="button" data-word="فَأَنبَتنا" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed." data-context="then We grew">فَأَنبَتنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="جَنّٰتٍ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-context="gardens" data-root-meaning="Covering and concealment; jannah and jannāt denote a garden or gardens with vegetation cover.">جَنّٰتٍ</button>
    <button class="word-link" type="button" data-word="وَحَبَّ" data-root="H B B" data-root-meaning="Grain and seed; ḥabb denotes grain, and ḥabbah a single seed." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="and grain">وَحَبَّ</button>
    <button class="word-link" type="button" data-word="الحَصيدِ" data-root="H SAD D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sad-d/" data-root-meaning="Reaping or cutting crops; ḥaṣīd means reaped or cut down." data-context="the harvest">الحَصيدِ</button>
  </p>
  <p class="english-verse">We sent down blessed water from the sky and grew with it gardens and grain for harvest,</p>
