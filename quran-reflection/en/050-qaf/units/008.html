<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Qaf 50:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَبصِرَةً" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing" data-context="For insight; the purpose served by the signs of creation.">تَبصِرَةً</button>
    <button class="word-link" type="button" data-word="وَذِكرىٰ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="And a reminder; what the signs provide for a servant who turns.">وَذِكرىٰ</button>
    <button class="word-link" type="button" data-word="لِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="For every; extending the description to each servant who turns.">لِكُلِّ</button>
    <button class="word-link" type="button" data-word="عَبدٍ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Servant; the person described as turning.">عَبدٍ</button>
    <button class="word-link" type="button" data-word="مُنيبٍ" data-root="N W B" data-learn-more="/quran-terminology/en/roots/n-w-b/" data-root-meaning="Returning and visiting, with repeated visits, turns, or substitution in some uses. Qur’anic anāba denotes turning to The God; munīb describes a person or heart that turns toward Him." data-context="Turning; describing a servant for whom the signs are a reminder.">مُنيبٍ</button>
  </p>
  <p class="english-verse">As insight and a reminder for every servant who turns back.</p>
</section>
