<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Qaf 50:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="God says this in response to the disputation before Him.">قالَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَختَصِموا" data-root="KH SAD M" data-root-meaning="Two parties confronting and disputing over a claim, right, or contested issue; khasm denotes a party to the dispute." data-context="Do not dispute; a prohibition on continuing contention before God after the earlier warning." data-learn-more="/quran-terminology/en/roots/kh-sad-m/">تَختَصِموا</button>
    <button class="word-link" type="button" data-word="لَدَىَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدَىَّ</button>
    <button class="word-link" type="button" data-word="وَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَقَد</button>
    <button class="word-link" type="button" data-word="قَدَّمتُ" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="I had already sent and conveyed the warning to you.">قَدَّمتُ</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="بِالوَعيدِ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive" data-context="The previous warning of the consequences.">بِالوَعيدِ</button>
  </p>
  <p class="english-verse">He says: Do not dispute before Me; I sent you the warning beforehand.</p>
