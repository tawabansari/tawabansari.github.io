<section class="ayah-block" id="ayah-007" data-translation-status="provisional">
  <h2 class="ayah-title">Qaf 50:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth, the subject of spreading and producing growth.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="مَدَدنٰها" data-root="M D D" data-learn-more="/quran-terminology/en/roots/m-d-d/" data-root-meaning="Stretching, extending, continuing, granting respite, adding support, and opening a wider field" data-context="We spread it out, referring to the earth.">مَدَدنٰها</button>
    <button class="word-link" type="button" data-word="وَأَلقَينا" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter Ilqāʾ denotes casting, placing, or conveying something." data-context="And We cast and placed, referring to firm mountains in the earth.">وَأَلقَينا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="R S W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-s-w/" data-root-meaning="Becoming firmly settled; anchoring or coming to rest." data-context="Firm mountains, stable and established elevations in the earth.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="وَأَنبَتنا" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed." data-context="And We produced, referring to kinds of vegetation in the earth.">وَأَنبَتنا</button>
    <button class="word-link" type="button" data-word="فيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيها</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every, expressing the diversity of what grows.">كُلِّ</button>
    <button class="word-link" type="button" data-word="زَوجٍ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation Zawj can also denote a kind or category of beings, according to context." data-context="A kind or category of vegetation, in “every beautiful, fresh kind.”">زَوجٍ</button>
    <button class="word-link" type="button" data-word="بَهيجٍ" data-root="B H2 J" data-root-meaning="B H J denotes visible beauty and freshness apparent in a thing’s colour, appearance, or display. Applied to humans, it denotes joy and pleasure arising from something pleasing and possibly appearing in the face and behaviour." data-context="Beautiful and fresh, describing the kinds of vegetation produced in the earth." data-learn-more="/quran-terminology/en/roots/b-h2-j/">بَهيجٍ</button>
  </p>
  <p class="english-verse">We spread out the earth, cast firm mountains into it, and made every delightful pair grow in it,</p>
