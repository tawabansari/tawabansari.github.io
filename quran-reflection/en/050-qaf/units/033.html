  <h2 class="ayah-title">Qaf 50:33</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="خَشِىَ" data-root="KH SH Y" data-learn-more="/quran-terminology/en/roots/kh-sh-y/" data-root-meaning="Aware fear and serious regard before a known danger or consequence, and effective khashyah before The God">خَشِىَ</button>

  <p class="english-verse">Who feared the Entirely Merciful unseen and came with a heart turning back.</p>
