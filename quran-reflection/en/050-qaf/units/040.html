<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">Qaf 50:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمِنَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="Night; part of it is a time for glorification.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="فَسَبِّحهُ" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Glorify Him; the command to praise and declare transcendence.">فَسَبِّحهُ</button>
    <button class="word-link" type="button" data-word="وَأَدبٰرَ" data-root="D B R" data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back and latter part; turning away and passing; tadbīr, governing affairs; tadabbur, careful reflection on discourse." data-context="After; the plural of dubur, locating the time after prostration.">وَأَدبٰرَ</button>
    <button class="word-link" type="button" data-word="السُّجودِ" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Prostration; glorification is enjoined after it.">السُّجودِ</button>
  </p>
  <p class="english-verse">Glorify Him during part of the night and after prostration.</p>
