<section class="ayah-block" id="ayah-003" data-translation-status="provisional">
  <h2 class="ayah-title">At-Taghabun 64:3</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="He created; bringing the heavens and earth into existence">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; in the account of creation">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; alongside the heavens">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="بِالحَقِّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="In truth; describing the creation of the heavens and earth">بِالحَقِّ</button>
    <button class="word-link" type="button" data-word="وَصَوَّرَكُم" data-root="SAD W R" data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Form, shape, and configuration; giving form and fashioning. In another branch, inclining or causing inclination; and in the independent use al-ṣūr, a trumpet or horn for blowing." data-context="And He fashioned you; giving humans form and configuration">وَصَوَّرَكُم</button>
    <button class="word-link" type="button" data-word="فَأَحسَنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="Then made good; concerning humans’ forms">فَأَحسَنَ</button>
    <button class="word-link" type="button" data-word="صُوَرَكُم" data-root="SAD W R" data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Form, shape, and configuration; giving form and fashioning. In another branch, inclining or causing inclination; and in the independent use al-ṣūr, a trumpet or horn for blowing." data-context="Your forms and configurations; what He has made good">صُوَرَكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِلَيهِ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="Ṣ Y R" data-learn-more="/quran-terminology/en/roots/sad-y-r/" data-root-meaning="Reaching an end: maṣīr as the outcome to which affairs lead" data-context="The final return or outcome; to Him">المَصيرُ</button>
  </p>
  <p class="english-verse">He created the heavens and the earth in truth, formed you, and made your forms good. To Him is the return.</p>
</section>
