<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">At-Taghabun 64:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="تُقرِضُوا" data-root="Q R DAD" data-learn-more="/quran-terminology/en/roots/q-r-dad/" data-root-meaning="Cutting off a portion of wealth, separating it and giving it with expectation of return or reward, lending, and temporarily transferring something from one’s possession">تُقرِضُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="قَرضًا" data-root="Q R DAD" data-learn-more="/quran-terminology/en/roots/q-r-dad/" data-root-meaning="Cutting off a portion of wealth, separating it and giving it with expectation of return or reward, lending, and temporarily transferring something from one’s possession">قَرضًا</button>
    <button class="word-link" type="button" data-word="حَسَنًا" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">حَسَنًا</button>
    <button class="word-link" type="button" data-word="يُضٰعِفهُ" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase.">يُضٰعِفهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="وَيَغفِر" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">وَيَغفِر</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="شَكورٌ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action">شَكورٌ</button>
    <button class="word-link" type="button" data-word="حَليمٌ" data-root="H L M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-l-m/" data-root-meaning="Forbearance and self-restraint; also dreams, and maturity in the expression reaching ḥulum.">حَليمٌ</button>
  </p>
  <p class="english-verse">If you lend The God a good loan, He will multiply it for you and forgive you. The God is Appreciative and Forbearing.</p>
</section>
