  <p class="english-verse">On the day He gathers you for the Day of Gathering, that is the Day of Mutual Loss. Whoever believes in The God and does what is right, He will remove their misdeeds and admit them into gardens beneath which rivers flow, to remain there forever. That is the great success.</p>
