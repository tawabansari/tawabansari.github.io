<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mulk 67:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاعتَرَفوا" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="so they admitted">فَاعتَرَفوا</button>
    <button class="word-link" type="button" data-word="بِذَنبِهِم" data-root="DH N B" data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="Dhanb: attributable sin, fault, or offense; dhanab: a tail or rear part; dhanūb with initial fatḥah: a share or portion, also used for a water bucket." data-context="their sin, which they admit">بِذَنبِهِم</button>
    <button class="word-link" type="button" data-word="فَسُحقًا" data-root="S H Q" data-learn-more="/quran-terminology/en/roots/s-h-q/" data-root-meaning="Great distance and remoteness; in another branch, pounding, crushing and wearing out." data-context="so away with">فَسُحقًا</button>
    <button class="word-link" type="button" data-word="لِأَصحٰبِ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="the inhabitants of">لِأَصحٰبِ</button>
    <button class="word-link" type="button" data-word="السَّعيرِ" data-root="S AYN R" data-learn-more="/quran-terminology/en/roots/s-ayn-r/" data-root-meaning="Kindling and blazing fire; intense burning or agitation; suʿur denotes derangement or blazing fires according to context." data-context="the blazing Fire">السَّعيرِ</button>
  </p>
  <p class="english-verse">They acknowledge their sin. Away, then, with the companions of the blazing fire!</p>
