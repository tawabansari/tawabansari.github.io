<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mulk 67:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order">خَلَقَ</button>
    <button class="word-link" type="button" data-word="المَوتَ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">المَوتَ</button>
    <button class="word-link" type="button" data-word="وَالحَيوٰةَ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">وَالحَيوٰةَ</button>
    <button class="word-link" type="button" data-word="لِيَبلُوَكُم" data-root="B L W" data-learn-more="/quran-terminology/en/roots/b-l-w/" data-root-meaning="Testing in lived situations: good, evil, balāʾ, and wearing away">لِيَبلُوَكُم</button>
    <button class="word-link" type="button" data-word="أَيُّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَيُّكُم</button>
    <button class="word-link" type="button" data-word="أَحسَنُ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">أَحسَنُ</button>
    <button class="word-link" type="button" data-word="عَمَلًا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">عَمَلًا</button>
    ۚ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="العَزيزُ" data-root="AYN Z Z" data-learn-more="/quran-terminology/en/roots/ayn-z-z/" data-root-meaning="Power, firmness, invincibility, dignity, and difficulty">العَزيزُ</button>
    <button class="word-link" type="button" data-word="الغَفورُ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">الغَفورُ</button>
  </p>
  <p class="english-verse">He created death and life to test you as to which of you is best in deeds. He is the Mighty, the Forgiving.</p>
