<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Mulk 67:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَوَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَوَلَم</button>
    <button class="word-link" type="button" data-word="يَرَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">يَرَوا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="الطَّيرِ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record.">الطَّيرِ</button>
    <button class="word-link" type="button" data-word="فَوقَهُم" data-root="F W Q" data-learn-more="/quran-terminology/en/roots/f-w-q/" data-root-meaning="Being above a reference point: over, above, beyond, superior in rank, dominant in power, or greater in number">فَوقَهُم</button>
    <button class="word-link" type="button" data-word="صٰفّٰتٍ" data-root="SAD F F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-f-f/" data-root-meaning="Arranging in rows or spreading wings.">صٰفّٰتٍ</button>
    <button class="word-link" type="button" data-word="وَيَقبِضنَ" data-root="Q B DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-b-dad/" data-root-meaning="Grasping or gathering; qabḍah is a handful or grasped amount.">وَيَقبِضنَ</button>
    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُمسِكُهُنَّ" data-root="M S K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-k/" data-root-meaning="Grasping, retaining, or holding firmly.">يُمسِكُهُنَّ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنُ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">الرَّحمٰنُ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِكُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">بِكُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>
    <button class="word-link" type="button" data-word="بَصيرٌ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">بَصيرٌ</button>
  </p>
  <p class="english-verse">Have they not seen the birds above them spreading and folding their wings? None holds them up except the Entirely Merciful. He sees all things.</p>
</section>
