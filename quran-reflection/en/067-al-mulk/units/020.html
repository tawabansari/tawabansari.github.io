  <h2 class="ayah-title">Al-Mulk 67:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمَّن</button>

    <button class="word-link" type="button" data-word="جُندٌ" data-root="J N D" data-root-meaning="Forces gathered for assistance, support, and joint action; in military use, an army." data-context="An army supporting you, in the question about help apart from the Entirely Merciful." data-learn-more="/quran-terminology/en/roots/j-n-d/">جُندٌ</button>

  <p class="english-verse">What army is there for you that can help you besides the Entirely Merciful? The disbelievers are only in delusion.</p>
