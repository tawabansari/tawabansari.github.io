<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qalam 68:49</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَدٰرَكَهُ" data-root="D R K" data-learn-more="/quran-terminology/en/roots/d-r-k/" data-root-meaning="Reaching and attaining; sensory or cognitive apprehension, joining and timely intervention; dark also denotes a lower level." data-context="Reached him; the Lord’s favor, which changes Jonah’s outcome in context.">تَدٰرَكَهُ</button>
    <button class="word-link" type="button" data-word="نِعمَةٌ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="Favor; the Lord’s grace that reached Jonah.">نِعمَةٌ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord; the giver of that favor to Jonah.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="لَنُبِذَ" data-root="N B DH" data-learn-more="/quran-terminology/en/roots/n-b-dh/" data-root-meaning="Nabadha: casting, setting aside, and separation from a previous position" data-context="He would certainly have been cast; the counterfactual outcome without favor, qualified by blameworthiness.">لَنُبِذَ</button>
    <button class="word-link" type="button" data-word="بِالعَراءِ" data-root="AYN R Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-y/" data-root-meaning="Being bare or uncovered; ʿarāʾ is exposed, open ground." data-context="Onto the bare shore; the exposed open place mentioned.">بِالعَراءِ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مَذمومٌ" data-root="DH M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-m-m/" data-root-meaning="Blame and reproach; dhimmah is a covenant or binding obligation." data-context="Blameworthy; Jonah’s state in the counterfactual absence of favor.">مَذمومٌ</button>
  </p>
  <p class="english-verse">Had a favor from his Lord not reached him, he would have been cast onto the bare shore, blameworthy.</p>
</section>
