<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Qalam 68:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَاصبِر" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="Then be patient or steadfast.">فَاصبِر</button>
    <button class="word-link" type="button" data-word="لِحُكمِ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="For the judgment, awaiting the Lord’s decision.">لِحُكمِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, who gives the judgment.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَكُن" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Do not be like the man of the fish in that state.">تَكُن</button>
    <button class="word-link" type="button" data-word="كَصاحِبِ" data-root="Ṣ Ḥ B" data-learn-more="/quran-terminology/en/roots/sad-h-b/" data-root-meaning="Companionship, association, staying with, close company, being together in a path or state, and a stable relation between two sides" data-context="Like the companion of the fish, referring to Jonah.">كَصاحِبِ</button>
    <button class="word-link" type="button" data-word="الحوتِ" data-root="H W T" data-root-meaning="Fish; in non-Qur’anic uses of this family, circling and changing course." data-context="The fish in Jonah’s story." data-learn-more="/quran-terminology/en/roots/h-w-t/">الحوتِ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="نادىٰ" data-root="N D W" data-root-meaning="Calling and addressing; in the nominal branch, an assembly or gathering of people." data-context="Called, the man of the fish in distress." data-learn-more="/quran-terminology/en/roots/n-d-y/">نادىٰ</button>
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="مَكظومٌ" data-root="K ZHA M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-zha-m/" data-root-meaning="Holding in or suppressing, especially anger or grief." data-context="Distressed or constricted with grief, the caller’s state.">مَكظومٌ</button>
  </p>
  <p class="english-verse">Be patient for your Lord’s judgment, and do not be like the companion of the fish, when he called out, filled with anguish.</p>
</section>
