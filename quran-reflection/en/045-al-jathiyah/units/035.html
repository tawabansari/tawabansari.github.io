<section class="ayah-block" id="ayah-035" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jathiyah 45:35</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ذٰلِكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكُم</button>
    <button class="word-link" type="button" data-word="بِأَنَّكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِأَنَّكُمُ</button>
    <button class="word-link" type="button" data-word="اتَّخَذتُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">اتَّخَذتُم</button>
    <button class="word-link" type="button" data-word="ءايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="هُزُوًا" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game">هُزُوًا</button>
    <button class="word-link" type="button" data-word="وَغَرَّتكُمُ" data-root="GH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-r/" data-root-meaning="Deception or reliance on a misleading appearance.">وَغَرَّتكُمُ</button>
    <button class="word-link" type="button" data-word="الحَيوٰةُ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">الحَيوٰةُ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَاليَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">فَاليَومَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يُخرَجونَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">يُخرَجونَ</button>
    <button class="word-link" type="button" data-word="مِنها" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنها</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="يُستَعتَبونَ" data-root="AYN T B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-t-b/" data-root-meaning="Reproach; istiʿtāb means seeking reconciliation or an opportunity to make amends.">يُستَعتَبونَ</button>
  </p>
  <p class="english-verse">That is because you took the signs of The God in mockery and the worldly life deceived you. So today they will not be brought out of it, nor will they be asked to make amends.</p>
</section>
