  <h2 class="ayah-title">Al-Jathiyah 45:5</h2>

  <p class="english-verse">In the alternation of night and day, the provision The God sent down from the sky by which He revived the earth after its death, and the turning of the winds are signs for people who reason.</p>
</section>
