  <h2 class="ayah-title">Al-Jathiyah 45:17</h2>

  <p class="english-verse">We gave them clear proofs concerning the matter. They differed only after knowledge had come to them, out of transgression among themselves. Your Lord will judge between them on the Day of Resurrection concerning what they differed about.</p>
