<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jathiyah 45:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُلِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُلِ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يُحييكُم" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">يُحييكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُميتُكُم" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">يُميتُكُم</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَجمَعُكُم" data-root="J M ʿ (J M Ayn)" data-learn-more="/quran-terminology/en/roots/j-m-ayn/" data-root-meaning="Gathering, bringing together, and ending dispersion in a shared field">يَجمَعُكُم</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="يَومِ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومِ</button>
    <button class="word-link" type="button" data-word="القِيٰمَةِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القِيٰمَةِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="رَيبَ" data-root="R Y B" data-learn-more="/quran-terminology/en/roots/r-y-b/" data-root-meaning="Unsettled doubt, distrust, suspicion, destabilizing uncertainty, anxiety before truth, and a state that blocks confidence and rational submission before proof">رَيبَ</button>
    <button class="word-link" type="button" data-word="فيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فيهِ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="أَكثَرَ" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more">أَكثَرَ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمونَ</button>
  </p>
  <p class="english-verse">Say: The God gives you life, then causes you to die, then gathers you for the Day of Resurrection, in which there is no doubt. But most people do not know.</p>
</section>
