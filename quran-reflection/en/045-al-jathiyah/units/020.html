<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jathiyah 45:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="بَصٰئِرُ" data-root="B Ṣ R" data-learn-more="/quran-terminology/en/roots/b-sad-r/" data-root-meaning="Seeing, sight, the sign becoming clear, and responsibility after seeing">بَصٰئِرُ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">لِلنّاسِ</button>
    <button class="word-link" type="button" data-word="وَهُدًى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">وَهُدًى</button>
    <button class="word-link" type="button" data-word="وَرَحمَةٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">وَرَحمَةٌ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يوقِنونَ" data-root="Y Q N" data-learn-more="/quran-terminology/en/roots/y-q-n/" data-root-meaning="Firmness of knowledge, clear assurance, and passing beyond conjecture">يوقِنونَ</button>
  </p>
  <p class="english-verse">This is insight for people, and guidance and mercy for people who are certain.</p>
