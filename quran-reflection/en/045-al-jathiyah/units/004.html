  <h2 class="ayah-title">Al-Jathiyah 45:4</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="يَبُثُّ" data-root="B TH TH" data-root-meaning="Dispersing, spreading and disclosing: from creatures distributed across the earth to the distress Jacob voices to The God" data-learn-more="/quran-terminology/en/roots/b-th-th/">يَبُثُّ</button>

    <button class="word-link" type="button" data-word="دابَّةٍ" data-root="D B B" data-root-meaning="Moving, creeping and the moving creature: from ants and human footsteps to the range of living creatures, their provision and two different earthly creatures in the Qur’an" data-learn-more="/quran-terminology/en/roots/d-b-b/">دابَّةٍ</button>

    <button class="word-link" type="button" data-word="يوقِنونَ" data-root="Y Q N" data-learn-more="/quran-terminology/en/roots/y-q-n/" data-root-meaning="Firmness of knowledge, clear assurance, and passing beyond conjecture">يوقِنونَ</button>
