<section class="ayah-block" id="ayah-008" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jathiyah 45:8</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَسمَعُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">يَسمَعُ</button>
    <button class="word-link" type="button" data-word="ءايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="تُتلىٰ" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another.">تُتلىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُصِرُّ" data-root="SAD R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-r-r/" data-root-meaning="Binding tightly or persisting; ṣirr is severe cold; ṣarrah is a cry or clamor.">يُصِرُّ</button>
    <button class="word-link" type="button" data-word="مُستَكبِرًا" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">مُستَكبِرًا</button>
    <button class="word-link" type="button" data-word="كَأَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَن</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="يَسمَعها" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing">يَسمَعها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَبَشِّرهُ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">فَبَشِّرهُ</button>
    <button class="word-link" type="button" data-word="بِعَذابٍ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">بِعَذابٍ</button>
    <button class="word-link" type="button" data-word="أَليمٍ" data-root="ʾ L M" data-learn-more="/quran-terminology/en/roots/a-l-m/" data-root-meaning="Pain, suffering, harm, and what has a painful and distressing effect on the human being">أَليمٍ</button>
  </p>
  <p class="english-verse">Who hears the signs of The God recited to him, then persists arrogantly as though he had not heard them. So give him news of a painful punishment.</p>
</section>
