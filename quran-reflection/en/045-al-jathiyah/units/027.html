<section class="ayah-block" id="ayah-027" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Jathiyah 45:27</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَلِلَّهِ</button>
    <button class="word-link" type="button" data-word="مُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Dominion; sovereignty over the heavens and earth.">مُلكُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; within the scope of God’s dominion.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; together with the heavens under that dominion.">وَالأَرضِ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And on the day when; the time the Hour arises.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="تَقومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Arises; the promised event takes place.">تَقومُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="S W AYN" data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A portion of time or an appointed time; al-sāʿah in resurrection contexts is the promised Hour. Suwāʿ is a deity’s proper name of uncertain derivation." data-context="The Hour; the promised resurrection event.">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day; at that time of reckoning.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَخسَرُ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="Will lose; they suffer loss.">يَخسَرُ</button>
    <button class="word-link" type="button" data-word="المُبطِلونَ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="Those devoted to falsehood; those who pursue what is false.">المُبطِلونَ</button>
  </p>
  <p class="english-verse">To The God belongs the dominion of the heavens and the earth. On the day the Hour arises, those who pursue falsehood will lose.</p>
</section>
