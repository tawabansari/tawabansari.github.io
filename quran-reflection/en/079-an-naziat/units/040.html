<section class="ayah-block" id="ayah-040" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naziat 79:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَمّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="خافَ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Feared, reverence concerning standing before the Lord.">خافَ</button>
    <button class="word-link" type="button" data-word="مَقامَ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Standing, being before the Lord in this reading.">مَقامَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Their Lord, the object of reverence and accountability.">رَبِّهِ</button>
    <button class="word-link" type="button" data-word="وَنَهَى" data-root="N H2 Y" data-root-meaning="Reaching an end or limit; restraining the continuation of an action and desisting from it." data-context="And restrained, checking the self from following desire." data-learn-more="/quran-terminology/en/roots/n-h2-y/">وَنَهَى</button>
    <button class="word-link" type="button" data-word="النَّفسَ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="The self, what the person restrains from desire.">النَّفسَ</button>
    <button class="word-link" type="button" data-word="عَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنِ</button>
    <button class="word-link" type="button" data-word="الهَوىٰ" data-root="H W Y" data-learn-more="/quran-terminology/en/roots/h2-w-y/" data-root-meaning="Falling, being drawn in a direction, and personal desire" data-context="Desire, what the self is restrained from following.">الهَوىٰ</button>
  </p>
  <p class="english-verse">But as for whoever feared standing before his Lord and restrained the self from desire,</p>
