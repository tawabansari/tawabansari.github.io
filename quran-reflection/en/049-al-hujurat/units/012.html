    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="يَغتَب" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="let not backbite">يَغتَب</button>

    <button class="word-link" type="button" data-word="لَحمَ" data-root="L H M" data-context="the flesh" data-root-meaning="Flesh or meat, the body’s fleshy tissue; laḥm is singular and luḥūm plural. Its use as food and other roles follow from context." data-learn-more="/quran-terminology/en/roots/l-h-m/">لَحمَ</button>

    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>

  <p class="english-verse">You who believe, avoid much suspicion; some suspicion is a sin. Do not spy or backbite one another. Would any of you like to eat the flesh of his dead brother? You would loathe it. Be mindful of The God; The God accepts repentance and is Especially Merciful.</p>
