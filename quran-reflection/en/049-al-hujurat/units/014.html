<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Al-Hujurat 49:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَتِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَتِ</button>
    <button class="word-link" type="button" data-word="الأَعرابُ" data-root="AYN R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-b/" data-root-meaning="ʿArabī relates to Arabic or Arabs; aʿrāb are desert dwellers; ʿurub means affectionate or devoted.">الأَعرابُ</button>
    <button class="word-link" type="button" data-word="ءامَنّا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">ءامَنّا</button>
    ۖ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قُل</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="تُؤمِنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">تُؤمِنوا</button>
    <button class="word-link" type="button" data-word="وَلٰكِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِن</button>
    <button class="word-link" type="button" data-word="قولوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قولوا</button>
    <button class="word-link" type="button" data-word="أَسلَمنا" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender">أَسلَمنا</button>
    <button class="word-link" type="button" data-word="وَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَمّا</button>
    <button class="word-link" type="button" data-word="يَدخُلِ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it.">يَدخُلِ</button>
    <button class="word-link" type="button" data-word="الإيمٰنُ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">الإيمٰنُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="قُلوبِكُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">قُلوبِكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُطيعُوا" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">تُطيعُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="وَرَسولَهُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَرَسولَهُ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَلِتكُم" data-root="L Y T" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-y-t/" data-root-meaning="Diminishing or withholding part of a due.">يَلِتكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَعمٰلِكُم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">أَعمٰلِكُم</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَيـًٔا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحيمٌ</button>
  </p>
  <p class="english-verse">The desert Arabs said: We believe. Say: You have not believed; rather, say: We have submitted, for faith has not yet entered your hearts. If you obey The God and His messenger, He will diminish nothing of your deeds. The God is Forgiving, Especially Merciful.</p>
</section>
