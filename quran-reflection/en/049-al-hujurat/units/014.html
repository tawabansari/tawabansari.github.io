  <p class="english-verse">The desert Arabs said: We believe. Say: You have not believed; rather, say: We have submitted, for faith has not yet entered your hearts. If you obey The God and His messenger, He will diminish nothing of your deeds. The God is Forgiving, Especially Merciful.</p>
