<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">At-Takwir 81:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="رَءاهُ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="He saw him; a verb of seeing with the object pronoun “him,” whose referent is established from context.">رَءاهُ</button>
    <button class="word-link" type="button" data-word="بِالأُفُقِ" data-root="A F Q" data-learn-more="/quran-terminology/en/roots/a-f-q/" data-root-meaning="A horizon or region within an expanse, especially the farthest reach of sight in the relation between sky and earth; in the plural, different regions and reaches of the world." data-context="On the horizon: the region where the sighting occurred, described as clear.">بِالأُفُقِ</button>
    <button class="word-link" type="button" data-word="المُبينِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Clear or manifest; a description of the horizon in the scene of seeing, rather than an eastern or western direction.">المُبينِ</button>

  <p class="english-verse">He certainly saw him on the clear horizon.</p>
