<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةَ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass">عٰقِبَةَ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="أَسٰـُٔوا" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">أَسٰـُٔوا</button>
    <button class="word-link" type="button" data-word="السّوأىٰ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">السّوأىٰ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="كَذَّبوا" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">كَذَّبوا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَكانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكانوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game">يَستَهزِءونَ</button>
  </p>
  <p class="english-verse">Then the end of those who did evil was the worst, because they denied The God’s signs and mocked them.</p>
</section>
