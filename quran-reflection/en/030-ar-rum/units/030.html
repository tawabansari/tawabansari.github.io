  <h2 class="ayah-title">Ar-Rum 30:30</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="وَجهَكَ" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh">وَجهَكَ</button>

    <button class="word-link" type="button" data-word="حَنيفًا" data-root="Ḥ N F" data-learn-more="/quran-terminology/en/roots/h-n-f/" data-root-meaning="Ḥanīf: turning toward The God alone and away from shirk, with attention to inclination and the limits of historical evidence">حَنيفًا</button>

    <button class="word-link" type="button" data-word="فِطرَتَ" data-root="F TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-tt-r/" data-root-meaning="Splitting; faṭr denotes originating; fiṭrah is an original disposition.">فِطرَتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="فَطَرَ" data-root="F TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-tt-r/" data-root-meaning="Splitting; faṭr denotes originating; fiṭrah is an original disposition.">فَطَرَ</button>

    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>

    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَبديلَ" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning.">تَبديلَ</button>

    <button class="word-link" type="button" data-word="الدّينُ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God">الدّينُ</button>
    <button class="word-link" type="button" data-word="القَيِّمُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القَيِّمُ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنَّ</button>

    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>

    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمونَ</button>
  </p>
  <p class="english-verse">So set your face toward the religion, inclining to what is upright—the natural disposition of The God upon which He formed people. There is no altering The God’s creation. That is the upright religion, but most people do not know.</p>
</section>
