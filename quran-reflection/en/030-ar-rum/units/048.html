<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُرسِلُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Sends; sending the winds.">يُرسِلُ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit" data-context="The winds; what stirs the cloud in this expression.">الرِّيٰحَ</button>
    <button class="word-link" type="button" data-word="فَتُثيرُ" data-root="TH W R" data-learn-more="/quran-terminology/en/roots/th-w-r/" data-root-meaning="Rising, stirring up, turning over, and setting in motion" data-context="Then they stir up; the winds setting cloud in motion.">فَتُثيرُ</button>
    <button class="word-link" type="button" data-word="سَحابًا" data-root="S H B" data-root-meaning="Dragging, extending and cloud: from drawing something over the ground to clouds moving through the sky and people dragged in punishment" data-learn-more="/quran-terminology/en/roots/s-h-b/" data-context="Cloud; what the winds stir up.">سَحابًا</button>
    <button class="word-link" type="button" data-word="فَيَبسُطُهُ" data-root="B S TT" data-root-meaning="Opening, spreading, and extending; context can apply this to ample provision or breadth of knowledge and capacity." data-context="Then He spreads it; spreading the cloud in the sky." data-learn-more="/quran-terminology/en/roots/b-s-tt/">فَيَبسُطُهُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky; where the cloud spreads.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="He wills; how He spreads the cloud.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="وَيَجعَلُهُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="And makes it; forming the cloud into portions.">وَيَجعَلُهُ</button>
    <button class="word-link" type="button" data-word="كِسَفًا" data-root="K S F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-s-f/" data-root-meaning="A piece or fragment." data-context="Portions; the cloud’s divided condition.">كِسَفًا</button>
    <button class="word-link" type="button" data-word="فَتَرَى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Then you see; observing the rain emerging.">فَتَرَى</button>
    <button class="word-link" type="button" data-word="الوَدقَ" data-root="W D Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-d-q/" data-root-meaning="Rain or raindrops." data-context="Rain; what emerges from within the cloud.">الوَدقَ</button>
    <button class="word-link" type="button" data-word="يَخرُجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Emerges; the rain coming out from the cloud.">يَخرُجُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="خِلٰلِهِ" data-root="KH L L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-l-l/" data-root-meaning="An interval or opening between things; also intimate friendship." data-context="Within it; the cloud’s interstices through which rain emerges.">خِلٰلِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="أَصابَ" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="Brings it to; the rain reaching the stated servants.">أَصابَ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="يَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="He wills; those whom the rain reaches.">يَشاءُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="His servants; recipients of the rain.">عِبادِهِ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="يَستَبشِرونَ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="Rejoice; their response to the rain’s arrival.">يَستَبشِرونَ</button>
  </p>
  <p class="english-verse">The God is the One who sends the winds, which stir up a cloud. He spreads it in the sky as He wills and makes it into fragments; then you see rain coming out from within it. When He causes it to reach whom He wills of His servants, they rejoice,</p>
</section>
