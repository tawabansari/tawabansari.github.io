<section class="ayah-block" id="ayah-036" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:36</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِذا</button>
    <button class="word-link" type="button" data-word="أَذَقنَا" data-root="DH W Q" data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting and perceiving flavor; more broadly, testing and experiencing; adhāqa means making another taste or undergo an experience." data-context="We make taste; granting people an experience of mercy.">أَذَقنَا</button>
    <button class="word-link" type="button" data-word="النّاسَ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering" data-context="People; those receiving mercy.">النّاسَ</button>
    <button class="word-link" type="button" data-word="رَحمَةً" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Mercy; the blessing people are made to taste.">رَحمَةً</button>
    <button class="word-link" type="button" data-word="فَرِحوا" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context." data-context="They rejoiced; their response to mercy.">فَرِحوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    ۖ
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="تُصِبهُم" data-root="Ṣ W B" data-learn-more="/quran-terminology/en/roots/sad-w-b/" data-root-meaning="Descending, pouring down, reaching, striking, and something hitting its target or proper place" data-context="Befalls them; being affected by an adverse event.">تُصِبهُم</button>
    <button class="word-link" type="button" data-word="سَيِّئَةٌ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Adversity; the unfavorable event contrasted with mercy.">سَيِّئَةٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="قَدَّمَت" data-root="Q D M" data-learn-more="/quran-terminology/en/roots/q-d-m/" data-root-meaning="Being ahead, sending ahead, and having a prior history" data-context="Sent ahead; earlier conduct connected to the consequence.">قَدَّمَت</button>
    <button class="word-link" type="button" data-word="أَيديهِم" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="Their hands; an expression for their own actions.">أَيديهِم</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="يَقنَطونَ" data-root="Q N TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-n-tt/" data-root-meaning="Despair or loss of hope for good." data-context="They despair; their response when adversity strikes.">يَقنَطونَ</button>
  </p>
  <p class="english-verse">When We let people taste mercy, they rejoice in it. But if an evil befalls them because of what their hands have sent ahead, they despair.</p>
</section>
