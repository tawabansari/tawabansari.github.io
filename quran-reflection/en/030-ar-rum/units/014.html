<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And on the day when; the time the Hour arises.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="تَقومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Arises; the Hour taking place.">تَقومُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="S W AYN" data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A portion of time or an appointed time; al-sāʿah in resurrection contexts is the promised Hour. Suwāʿ is a deity’s proper name of uncertain derivation." data-context="The Hour; the promised resurrection event.">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day; when the stated event occurs.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَرَّقونَ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="They separate; the groups part with different outcomes.">يَتَفَرَّقونَ</button>
  </p>
  <p class="english-verse">On the day the Hour arises, that day they will separate.</p>
