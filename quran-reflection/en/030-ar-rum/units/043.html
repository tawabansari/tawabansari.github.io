<section class="ayah-block" id="ayah-043" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:43</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَقِم" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="So set firmly; within the expression for directing oneself toward the way.">فَأَقِم</button>
    <button class="word-link" type="button" data-word="وَجهَكَ" data-root="W J H" data-learn-more="/quran-terminology/en/roots/w-j-h2/" data-root-meaning="From the face and facing to direction, intention, and wajh Allāh" data-context="Your face and direction; within the expression for turning toward something.">وَجهَكَ</button>
    <button class="word-link" type="button" data-word="لِلدّينِ" data-root="D Y N" data-learn-more="/quran-terminology/en/roots/d-y-n/" data-root-meaning="Account, recompense, judgment, accountability, debt, obligation, binding order, and the way a human being submits before The God" data-context="Toward the way; the specified path and order of commitment.">لِلدّينِ</button>
    <button class="word-link" type="button" data-word="القَيِّمِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Upright and firmly established; describing the way.">القَيِّمِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before; concerning the arrival of the specified day.">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَأتِىَ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Comes; referring to the specified day.">يَأتِىَ</button>
    <button class="word-link" type="button" data-word="يَومٌ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="A day; the time of the event mentioned.">يَومٌ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="مَرَدَّ" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="A turning back or averting; negated with respect to that day.">مَرَدَّ</button>
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="يَومَئِذٍ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="On that day; referring to the day already mentioned.">يَومَئِذٍ</button>
    <button class="word-link" type="button" data-word="يَصَّدَّعونَ" data-root="SAD D AYN" data-root-meaning="Splitting and breaking continuity; in use, physical fissures, groups separating, open proclamation, and headache." data-context="They separate from one another; a Form V verb concerning people on that day." data-learn-more="/quran-terminology/en/roots/sad-d-ayn/">يَصَّدَّعونَ</button>
  </p>
  <p class="english-verse">So set your face toward the upright religion before a day comes from The God that cannot be turned back. On that day they will separate.</p>
</section>
