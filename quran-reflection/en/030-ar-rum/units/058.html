  <h2 class="ayah-title">Ar-Rum 30:58</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="القُرءانِ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text containing examples for people." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانِ</button>

    <button class="word-link" type="button" data-word="مَثَلٍ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="An example: an illustration.">مَثَلٍ</button>

  <p class="english-verse">We have set forth every kind of comparison for people in this Quran. If you bring them a sign, those who disbelieve will surely say: You are only promoters of falsehood.</p>
