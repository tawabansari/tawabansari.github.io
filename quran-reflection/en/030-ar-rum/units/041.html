<section class="ayah-block" id="ayah-041" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ظَهَرَ" data-root="Ẓ H R" data-learn-more="/quran-terminology/en/roots/zha-h2-r/" data-root-meaning="Back, outer surface, visibility, ascendancy, and support">ظَهَرَ</button>
    <button class="word-link" type="button" data-word="الفَسادُ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order">الفَسادُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="B R R" data-learn-more="/quran-terminology/en/roots/b-r-r/" data-root-meaning="Expansive goodness, upright conduct, faithfulness, beneficence, openness in good, and standing on firm moral ground.">البَرِّ</button>
    <button class="word-link" type="button" data-word="وَالبَحرِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation">وَالبَحرِ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كَسَبَت" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility">كَسَبَت</button>
    <button class="word-link" type="button" data-word="أَيدِى" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">أَيدِى</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
    <button class="word-link" type="button" data-word="لِيُذيقَهُم" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering.">لِيُذيقَهُم</button>
    <button class="word-link" type="button" data-word="بَعضَ" data-root="B ʿ Ḍ" data-learn-more="/quran-terminology/en/roots/b-ayn-dad/" data-root-meaning="Part, portion, some of a whole, relations among parts, and the mosquito as a small example in divine parable">بَعضَ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="عَمِلوا" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">عَمِلوا</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَرجِعونَ" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference">يَرجِعونَ</button>
  </p>
  <p class="english-verse">Corruption has appeared on land and sea because of what people’s hands have earned, so that He may let them taste some of what they have done, so that they may return.</p>
</section>
