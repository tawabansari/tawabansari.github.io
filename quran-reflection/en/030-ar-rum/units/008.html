    <button class="word-link" type="button" data-word="أَنفُسِهِم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/">أَنفُسِهِم</button>

  <p class="english-verse">Have they not reflected within themselves? The God created the heavens, the earth, and what is between them only in truth and for an appointed term. Yet many people disbelieve in meeting their Lord.</p>
