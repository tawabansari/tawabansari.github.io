<section class="ayah-block" id="ayah-039" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:39</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="ءاتَيتُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">ءاتَيتُم</button>

    <button class="word-link" type="button" data-word="لِيَربُوَا۟" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level">لِيَربُوَا۟</button>

    <button class="word-link" type="button" data-word="أَموٰلِ" data-root="M W L" data-learn-more="/quran-terminology/en/roots/m-w-l/" data-root-meaning="Māl and amwāl: from property and the resources of life to ownership, others’ rights, spending and the testing of people through wealth">أَموٰلِ</button>
    <button class="word-link" type="button" data-word="النّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسِ</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="يَربوا" data-root="R B W" data-learn-more="/quran-terminology/en/roots/r-b-w/" data-root-meaning="Rising, increasing, swelling, growing, and moving beyond a previous level">يَربوا</button>

    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="ءاتَيتُم" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">ءاتَيتُم</button>

    <button class="word-link" type="button" data-word="تُريدونَ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">تُريدونَ</button>

    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="فَأُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَأُولٰئِكَ</button>

    <button class="word-link" type="button" data-word="المُضعِفونَ" data-root="DAD AYN F" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-ayn-f/" data-root-meaning="Weakness; in another branch, multiplication or increase.">المُضعِفونَ</button>
  </p>
  <p class="english-verse">Whatever you give as riba to increase within people’s wealth does not increase with The God. But whatever you give as zakat, seeking The God’s face—those are the ones who multiply.</p>
</section>
