<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">Ar-Rum 30:55</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And on the day when, introducing the Hour’s arising.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="تَقومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="Arises, concerning the Hour.">تَقومُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="The Hour, the resurrection’s appointed event here.">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="يُقسِمُ" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="They swear, concerning the offenders.">يُقسِمُ</button>
    <button class="word-link" type="button" data-word="المُجرِمونَ" data-root="J R M" data-root-meaning="Cutting and separating; acquiring and obtaining; and, in another branch, committing wrongdoing and objectionable acts." data-context="The offenders, who swear about how long they remained." data-learn-more="/quran-terminology/en/roots/j-r-m/">المُجرِمونَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لَبِثوا" data-root="L B TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-th/" data-root-meaning="Staying or remaining for a period or in a place." data-context="They remained, in the offenders’ statement about duration.">لَبِثوا</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Other than or more than, within the denial of remaining beyond an hour.">غَيرَ</button>
    <button class="word-link" type="button" data-word="ساعَةٍ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name." data-context="An hour or a brief time, the duration claimed by the offenders.">ساعَةٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="كَذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَذٰلِكَ</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They were or used to, concerning their past condition or conduct.">كانوا</button>
    <button class="word-link" type="button" data-word="يُؤفَكونَ" data-root="A F K" data-learn-more="/quran-terminology/en/roots/a-f-k/" data-root-meaning="Turning something, or its changing, from its previous direction, condition, or form; in speech and belief, distorting truth or being turned away from it." data-context="They used to be turned away in this way, concerning the offenders’ judgment and duration of stay.">يُؤفَكونَ</button>
  </p>
  <p class="english-verse">On the day the Hour arises, the guilty will swear that they remained only an hour. Thus they used to be turned away.</p>
</section>
