<section class="ayah-block" id="ayah-031" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:31</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="مِثلَ" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">مِثلَ</button>
    <button class="word-link" type="button" data-word="دَأبِ" data-root="D A B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-a-b/" data-root-meaning="Continuity in effort or habit; daʾb is an established pattern.">دَأبِ</button>
    <button class="word-link" type="button" data-word="قَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">قَومِ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="Proper name; no root has been assigned.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَعادٍ" data-root-note="Proper name; no root has been assigned.">وَعادٍ</button>
    <button class="word-link" type="button" data-word="وَثَمودَ" data-root-note="Proper name; no root has been assigned.">وَثَمودَ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِم" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness">بَعدِهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَا</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يُريدُ" data-root="R W D" data-learn-more="/quran-terminology/en/roots/r-w-d/" data-root-meaning="Wanting, willing, intending, turning toward an aim, and seeking with effort or insistence">يُريدُ</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظُلمًا</button>
    <button class="word-link" type="button" data-word="لِلعِبادِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">لِلعِبادِ</button>
  </p>
  <p class="english-verse">like the fate of the people of Noah, Ad, Thamud, and those after them. The God does not desire injustice for His servants.</p>
</section>
