    <button class="word-link" type="button" data-word="قَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">قَومِ</button>

    <button class="word-link" type="button" data-word="لِلعِبادِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">لِلعِبادِ</button>

  <p class="english-verse">like the fate of the people of Noah, Ad, Thamud, and those after them. The God does not desire injustice for His servants.</p>
