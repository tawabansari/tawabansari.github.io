<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said; introducing the Lord’s speech that follows.">وَقالَ</button>
    <button class="word-link" type="button" data-word="رَبُّكُمُ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord; the speaker inviting people to call upon Him.">رَبُّكُمُ</button>
    <button class="word-link" type="button" data-word="ادعونى" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Call upon Me; an invitation to turn to Him and ask.">ادعونى</button>
    <button class="word-link" type="button" data-word="أَستَجِب" data-root="J W B" data-root-meaning="in concrete usage, jawb concerns cutting, piercing, and passing through something; in verbal and behavioral usage, jawāb and istijābah concern responding to speech, a request, or a call." data-learn-more="/quran-terminology/en/roots/j-w-b/" data-context="I will answer you; responding to their call upon Him.">أَستَجِب</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَستَكبِرونَ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar" data-context="Act arrogantly; considering themselves above worship and refusing it.">يَستَكبِرونَ</button>
    <button class="word-link" type="button" data-word="عَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَن</button>
    <button class="word-link" type="button" data-word="عِبادَتى" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worshipping Me; servitude and worship directed to The God.">عِبادَتى</button>
    <button class="word-link" type="button" data-word="سَيَدخُلونَ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="They will enter; future entry into Hell.">سَيَدخُلونَ</button>
    <button class="word-link" type="button" data-word="جَهَنَّمَ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمَ</button>
    <button class="word-link" type="button" data-word="داخِرينَ" data-root="D KH R" data-learn-more="/quran-terminology/en/roots/d-kh-r/" data-root-meaning="Lowliness, submission, and abasement; context determines the quality and value of this condition." data-context="Abased and humiliated; their condition on entering Hell, contrasted with their earlier arrogance.">داخِرينَ</button>
  </p>
  <p class="english-verse">Your Lord said, “Call upon Me; I will answer you. Those who are too arrogant to worship Me will enter Hell humbled.”</p>
</section>
