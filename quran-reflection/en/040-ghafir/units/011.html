<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="They said: the confessors’ statement.">قالوا</button>
    <button class="word-link" type="button" data-word="رَبَّنا" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Our Lord: the address in asking for a way out.">رَبَّنا</button>
    <button class="word-link" type="button" data-word="أَمَتَّنَا" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="You caused us to die, twice in their acknowledgment.">أَمَتَّنَا</button>
    <button class="word-link" type="button" data-word="اثنَتَينِ" data-root="TH N Y" data-root-meaning="twofoldness, turning back, and repetition" data-context="Twice: counting occasions of being made to die." data-learn-more="/quran-terminology/en/roots/th-n-y/">اثنَتَينِ</button>
    <button class="word-link" type="button" data-word="وَأَحيَيتَنَا" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting" data-context="And You brought us to life, twice.">وَأَحيَيتَنَا</button>
    <button class="word-link" type="button" data-word="اثنَتَينِ" data-root="TH N Y" data-root-meaning="twofoldness, turning back, and repetition" data-context="Twice: counting occasions of being brought to life." data-learn-more="/quran-terminology/en/roots/th-n-y/">اثنَتَينِ</button>
    <button class="word-link" type="button" data-word="فَاعتَرَفنا" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity." data-context="We acknowledged our responsibility for wrongdoing.">فَاعتَرَفنا</button>
    <button class="word-link" type="button" data-word="بِذُنوبِنا" data-root="DH N B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-n-b/" data-root-meaning="A tail; dhanb means sin and its liability; dhanūb denotes a full bucket or allotted share." data-context="Our sins, which are acknowledged.">بِذُنوبِنا</button>
    <button class="word-link" type="button" data-word="فَهَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهَل</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="خُروجٍ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="A way out of the condition described.">خُروجٍ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سَبيلٍ" data-root="S B L" data-learn-more="/quran-terminology/en/roots/s-b-l/" data-root-meaning="Sabīl: a way along which one can travel" data-context="A way or possibility of escape.">سَبيلٍ</button>
  </p>
  <p class="english-verse">They will say, “Our Lord, twice You caused us to die and twice You gave us life. We have acknowledged our sins. Is there any way out?”</p>
</section>
