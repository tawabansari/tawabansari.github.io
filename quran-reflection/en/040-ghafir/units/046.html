<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="النّارُ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">النّارُ</button>
    <button class="word-link" type="button" data-word="يُعرَضونَ" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment">يُعرَضونَ</button>
    <button class="word-link" type="button" data-word="عَلَيها" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيها</button>
    <button class="word-link" type="button" data-word="غُدُوًّا" data-root="GH D W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-d-w/" data-root-meaning="Morning or going early; ghad is tomorrow or the future.">غُدُوًّا</button>
    <button class="word-link" type="button" data-word="وَعَشِيًّا" data-root="AYN SH W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sh-w/" data-root-meaning="Late day or evening; ʿashw denotes dim sight or turning a blind eye.">وَعَشِيًّا</button>

    <button class="word-link" type="button" data-word="تَقومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">تَقومُ</button>
    <button class="word-link" type="button" data-word="السّاعَةُ" data-root="S W AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-w-ayn/" data-root-meaning="A span or passage of time; sāʿah is an hour, moment, or the final Hour; Suwāʿ is a deity&#x27;s proper name.">السّاعَةُ</button>
    <button class="word-link" type="button" data-word="أَدخِلوا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it.">أَدخِلوا</button>
    <button class="word-link" type="button" data-word="ءالَ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome.">ءالَ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="أَشَدَّ" data-root="SH D D" data-learn-more="/quran-terminology/en/roots/sh-d-d/" data-root-meaning="Gaining force, becoming firm, making firm, removing looseness, and an effect reaching a high degree">أَشَدَّ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">العَذابِ</button>
  </p>
  <p class="english-verse">the Fire, to which they are exposed morning and evening. And on the day the Hour arises: “Admit Pharaoh’s people to the severest punishment.”</p>
