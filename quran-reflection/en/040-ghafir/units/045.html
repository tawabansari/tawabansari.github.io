<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَقىٰهُ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Then protected him; concerning protection from the evils of their scheme.">فَوَقىٰهُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evils; the adverse effects of what they plotted.">سَيِّـٔاتِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="مَكَروا" data-root="M K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-k-r/" data-root-meaning="A concealed plan to redirect events; its evaluation depends on agent and context." data-context="They plotted; the conduct of those devising a harmful scheme.">مَكَروا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="H Y Q" data-root-meaning="Something befalling and encompassing someone, especially an adverse consequence in which the person becomes caught." data-context="Encompassed; grievous punishment befell Pharaoh’s people." data-learn-more="/quran-terminology/en/roots/h-y-q/">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِـٔالِ" data-root="&#x27; W L" data-learn-more="/quran-terminology/en/roots/a-w-l/" data-root-meaning="Precedence, being first, beginning a sequence, and returning a matter to its origin, reference point, or final outcome." data-context="Household and followers; in “Pharaoh’s people,” those encompassed by punishment.">بِـٔالِ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="سوءُ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Grievousness; in sūʾ al-ʿadhāb, describing the punishment’s adversity.">سوءُ</button>
    <button class="word-link" type="button" data-word="العَذابِ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment; what encompassed Pharaoh’s people.">العَذابِ</button>
  </p>
  <p class="english-verse">So The God protected him from the evils of what they plotted, and terrible punishment engulfed Pharaoh’s people:</p>
</section>
