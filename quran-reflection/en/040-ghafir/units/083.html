<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:83</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="جاءَتهُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to them; concerning their messengers’ arrival with clear signs.">جاءَتهُم</button>
    <button class="word-link" type="button" data-word="رُسُلُهُم" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Their messengers; those bringing the clear signs.">رُسُلُهُم</button>
    <button class="word-link" type="button" data-word="بِالبَيِّنٰتِ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="With clear signs; what the messengers brought.">بِالبَيِّنٰتِ</button>
    <button class="word-link" type="button" data-word="فَرِحوا" data-root="F R H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-h/" data-root-meaning="Joy or rejoicing; its evaluation depends on context." data-context="They delighted; in the knowledge they possessed.">فَرِحوا</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="عِندَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَهُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="العِلمِ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge; what they possessed and delighted in.">العِلمِ</button>
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="H Y Q" data-root-meaning="Something befalling and encompassing someone, especially an adverse consequence in which the person becomes caught." data-context="Encompassed them; what they previously mocked befell them." data-learn-more="/quran-terminology/en/roots/h-y-q/">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to; with the following verb, expressing their former mockery.">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game" data-context="They mocked; concerning what eventually encompassed them.">يَستَهزِءونَ</button>
  </p>
  <p class="english-verse">When their messengers came to them with clear proofs, they rejoiced in the knowledge they possessed, and what they used to ridicule engulfed them.</p>
</section>
