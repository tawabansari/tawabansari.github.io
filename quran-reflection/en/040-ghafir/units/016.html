<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="The day when: the time of their being exposed in the scene.">يَومَ</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="بٰرِزونَ" data-root="B R Z" data-root-meaning="Coming forth and becoming visible in open space or before sight and confrontation; in transitive forms, making something visible." data-learn-more="/quran-terminology/en/roots/b-r-z/" data-context="They are exposed and apparent: a masculine plural active participle describing their condition.">بٰرِزونَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَخفىٰ" data-root="KH F Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-f-y/" data-root-meaning="Being hidden or concealing; some forms and readings carry the sense of revealing." data-context="Is not hidden: denying that anything about them is concealed from The God.">يَخفىٰ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="شَىءٌ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="Willing and wanting; shay means a thing, matter, or entity that can be referred to or recognized." data-context="Anything: under negation, nothing about them is concealed.">شَىءٌ</button>
    ۚ
    <button class="word-link" type="button" data-word="لِمَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَنِ</button>
    <button class="word-link" type="button" data-word="المُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Sovereignty or dominion: the subject of the question, to whom does it belong today?">المُلكُ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Today: the day described in the judgment scene.">اليَومَ</button>
    ۖ
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الوٰحِدِ" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="The One: describing the oneness of The God.">الوٰحِدِ</button>
    <button class="word-link" type="button" data-word="القَهّارِ" data-root="Q H2 R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-h2-r/" data-root-meaning="Overpowering or bringing under control; qahr does not inherently denote the emotion of anger." data-context="The Overpowering: describing the mastery and sovereignty of The God.">القَهّارِ</button>
  </p>
  <p class="english-verse">the day they come forth, with nothing about them hidden from The God. To whom belongs the dominion today? To The God, the One, the Subduer.</p>
</section>
