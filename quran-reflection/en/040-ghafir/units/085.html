<section class="ayah-block" id="ayah-085" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:85</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَم</button>
    <button class="word-link" type="button" data-word="يَكُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">يَكُ</button>
    <button class="word-link" type="button" data-word="يَنفَعُهُم" data-root="N F ʿ" data-learn-more="/quran-terminology/en/roots/n-f-ayn/" data-root-meaning="Nafaʿa: benefiting someone and producing a favorable outcome">يَنفَعُهُم</button>
    <button class="word-link" type="button" data-word="إيمٰنُهُم" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">إيمٰنُهُم</button>
    <button class="word-link" type="button" data-word="لَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمّا</button>
    <button class="word-link" type="button" data-word="رَأَوا" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">رَأَوا</button>
    <button class="word-link" type="button" data-word="بَأسَنا" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity">بَأسَنا</button>
    ۖ
    <button class="word-link" type="button" data-word="سُنَّتَ" data-root="S N N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-n-n/" data-root-meaning="A tooth; sunnah is an established way; masnūn has differing explanations, including shaped or altered.">سُنَّتَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="خَلَت" data-root="KH L W" data-learn-more="/quran-terminology/en/roots/kh-l-w/" data-root-meaning="Becoming empty, withdrawing into privacy, leaving the public field, being alone, becoming free of obstruction, and separating from open visibility">خَلَت</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="عِبادِهِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship">عِبادِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَخَسِرَ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure">وَخَسِرَ</button>
    <button class="word-link" type="button" data-word="هُنالِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُنالِكَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">الكٰفِرونَ</button>
  </p>
  <p class="english-verse">But their faith did not benefit them when they saw Our might. The established way of The God that has passed among His servants. There the disbelievers lost.</p>
</section>
