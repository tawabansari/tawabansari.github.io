<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="He knows the eyes’ treachery and what breasts conceal.">يَعلَمُ</button>
    <button class="word-link" type="button" data-word="خائِنَةَ" data-root="KH W N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-w-n/" data-root-meaning="Betrayal and breach of trust or covenant." data-context="Treachery, in the expression the treachery of the eyes.">خائِنَةَ</button>
    <button class="word-link" type="button" data-word="الأَعيُنِ" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="The eyes, concerning treacherous looking or conduct.">الأَعيُنِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تُخفِى" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="Conceal: what the breasts keep within." data-learn-more="/quran-terminology/en/roots/kh-f-y/">تُخفِى</button>
    <button class="word-link" type="button" data-word="الصُّدورُ" data-root="SAD D R" data-root-meaning="ṣadr is the chest or front of something and, in human uses, may express the location of inward affairs. Ṣudūr in the verbal branch is departure, proceeding, or returning from somewhere, especially in contrast with arriving there." data-learn-more="/quran-terminology/en/roots/sad-d-r/" data-context="Breasts, as the location of what is concealed within.">الصُّدورُ</button>
  </p>
  <p class="english-verse">He knows the betrayal of the eyes and what the breasts conceal.</p>
