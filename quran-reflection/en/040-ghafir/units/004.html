<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="يُجٰدِلُ" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="Disputes over the signs of The God in a context of denial and opposition." data-learn-more="/quran-terminology/en/roots/j-d-l/">يُجٰدِلُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ءايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="The signs of The God, disputed by the deniers.">ءايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="إِلَّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَّا</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Have disbelieved; describing the specified disputants.">كَفَروا</button>
    <button class="word-link" type="button" data-word="فَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلا</button>
    <button class="word-link" type="button" data-word="يَغرُركَ" data-root="GH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-r/" data-root-meaning="Deception or reliance on a misleading appearance." data-context="Deceive you; the verse warns against being deceived.">يَغرُركَ</button>
    <button class="word-link" type="button" data-word="تَقَلُّبُهُم" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth" data-context="Their movement and circulation through the lands.">تَقَلُّبُهُم</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="البِلٰدِ" data-root="B L D" data-learn-more="/quran-terminology/en/roots/b-l-d/" data-root-meaning="From a tract of land to a territory, settlement, and a secure place" data-context="The lands through which they circulate.">البِلٰدِ</button>
  </p>
  <p class="english-verse">None dispute about the signs of The God except those who disbelieve, so do not let their movement through the lands deceive you.</p>
</section>
