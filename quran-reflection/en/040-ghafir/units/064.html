<section class="ayah-block" id="ayah-064" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:64</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function">جَعَلَ</button>
    <button class="word-link" type="button" data-word="لَكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُمُ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضَ</button>
    <button class="word-link" type="button" data-word="قَرارًا" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness.">قَرارًا</button>
    <button class="word-link" type="button" data-word="وَالسَّماءَ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">وَالسَّماءَ</button>
    <button class="word-link" type="button" data-word="بِناءً" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">بِناءً</button>
    <button class="word-link" type="button" data-word="وَصَوَّرَكُم" data-root="SAD W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Forming or giving shape; ṣūr is a trumpet; ṣur in al-Baqarah has explanations involving drawing near or gathering.">وَصَوَّرَكُم</button>
    <button class="word-link" type="button" data-word="فَأَحسَنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">فَأَحسَنَ</button>
    <button class="word-link" type="button" data-word="صُوَرَكُم" data-root="SAD W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Forming or giving shape; ṣūr is a trumpet; ṣur in al-Baqarah has explanations involving drawing near or gathering.">صُوَرَكُم</button>
    <button class="word-link" type="button" data-word="وَرَزَقَكُم" data-root="R Z Q" data-learn-more="/quran-terminology/en/roots/r-z-q/" data-root-meaning="Rizq, provision, delivered gift, fulfillment of need, and the opening of life and growth">وَرَزَقَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الطَّيِّبٰتِ" data-root="Ṭ Y B (TT Y B)" data-learn-more="/quran-terminology/en/roots/tt-y-b/" data-root-meaning="Pure, pleasant, wholesome, agreeable, and fitting in its own context; opposite of what is khabith, impure, harmful, or unpleasant.">الطَّيِّبٰتِ</button>
    ۚ
    <button class="word-link" type="button" data-word="ذٰلِكُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="رَبُّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَتَبارَكَ" data-root="B R K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-r-k/" data-root-meaning="Stability and continuance; barakah: enduring, abundant good; mubārak: endowed with such good.">فَتَبارَكَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="رَبُّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّ</button>
    <button class="word-link" type="button" data-word="العٰلَمينَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">العٰلَمينَ</button>
  </p>
  <p class="english-verse">The God is the One who made the earth a resting place for you and the sky a structure, formed you and made your forms good, and provided you with good things. That is The God, your Lord. Blessed is The God, Lord of all worlds.</p>
</section>
