<section class="ayah-block" id="ayah-018" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:18</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَنذِرهُم" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence">وَأَنذِرهُم</button>
    <button class="word-link" type="button" data-word="يَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears">يَومَ</button>
    <button class="word-link" type="button" data-word="الـٔازِفَةِ" data-root="A Z F" data-learn-more="/quran-terminology/en/roots/a-z-f/" data-root-meaning="The time of an affair or event drawing near, without the word itself specifying the interval or establishing that the event has fully occurred.">الـٔازِفَةِ</button>
    <button class="word-link" type="button" data-word="إِذِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذِ</button>
    <button class="word-link" type="button" data-word="القُلوبُ" data-root="Q L B" data-learn-more="/quran-terminology/en/roots/q-l-b/" data-root-meaning="Turning, transformation, overturning, the human inner center, and orientation before truth">القُلوبُ</button>
    <button class="word-link" type="button" data-word="لَدَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدَى</button>
    <button class="word-link" type="button" data-word="الحَناجِرِ" data-root="H N J R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-n-j-r/" data-root-meaning="The throat or upper windpipe; ḥanājir means throats.">الحَناجِرِ</button>

    ۚ
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لِلظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">لِلظّٰلِمينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="حَميمٍ" data-root="H M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-m-m/" data-root-meaning="Intense heat; ḥamīm means very hot water or a close friend, according to context; yaḥmūm is black smoke.">حَميمٍ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="شَفيعٍ" data-root="SH F ʿ (SH F Ayn)" data-learn-more="/quran-terminology/en/roots/sh-f-ayn/" data-root-meaning="Pairing, joining, and placing one factor beside another to support or strengthen an effect">شَفيعٍ</button>
    <button class="word-link" type="button" data-word="يُطاعُ" data-root="TT W AYN" data-root-meaning="Obedience, compliance, ability and voluntary action: from ṭawʿan wa-karhan to obedience, capacity and volunteering in the Qur’an" data-learn-more="/quran-terminology/en/roots/tt-w-ayn/">يُطاعُ</button>
  </p>
  <p class="english-verse">Warn them of the approaching day, when hearts are at the throats, choking back distress. The wrongdoers have no close friend and no intercessor who is heeded.</p>
</section>
