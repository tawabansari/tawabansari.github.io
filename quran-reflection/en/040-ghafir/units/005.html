<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Ghafir 40:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="كَذَّبَت" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Denied; Noah’s people and the later factions.">كَذَّبَت</button>
    <button class="word-link" type="button" data-word="قَبلَهُم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before them; the earlier deniers.">قَبلَهُم</button>
    <button class="word-link" type="button" data-word="قَومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-context="Noah’s people, among the earlier deniers." data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. In qawm, a people, group, or society sharing a common bond.">قَومُ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="Proper name; no root has been assigned.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَالأَحزابُ" data-root="H Z B" data-root-meaning="Gathering and forming a collective; people joined by a shared affiliation, position, or purpose." data-context="And the factions and groups after them." data-learn-more="/quran-terminology/en/roots/h-z-b/">وَالأَحزابُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="بَعدِهِم" data-root="B ʿ D (B Ayn D)" data-learn-more="/quran-terminology/en/roots/b-ayn-d/" data-root-meaning="Distance, separation, afterwardness in time or order, and being far from mercy and rightness" data-context="After them; the chronological sequence of groups.">بَعدِهِم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهَمَّت" data-root="H2 M M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-m-m/" data-root-meaning="Distress or preoccupation; hamm can denote intention or resolve." data-context="And intended; the plan to seize the messenger.">وَهَمَّت</button>
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; encompassing the stated communities.">كُلُّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="A community acting against its messenger.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="بِرَسولِهِم" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="Their messenger, the target of their action.">بِرَسولِهِم</button>
    <button class="word-link" type="button" data-word="لِيَأخُذوهُ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="To seize him; the communities’ intention toward their messengers.">لِيَأخُذوهُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَجٰدَلوا" data-root="J D L" data-root-meaning="Verbal confrontation and exchange to present, defend, answer, or oppose a position; its value depends on subject, evidence, and method." data-context="They disputed with falsehood to displace truth through it." data-learn-more="/quran-terminology/en/roots/j-d-l/">وَجٰدَلوا</button>
    <button class="word-link" type="button" data-word="بِالبٰطِلِ" data-root="B Ṭ L (B Tt L)" data-learn-more="/quran-terminology/en/roots/b-tt-l/" data-root-meaning="Becoming baseless, collapsing, becoming ineffective, and lacking enduring truth." data-context="With falsehood; the means and content of disputation.">بِالبٰطِلِ</button>
    <button class="word-link" type="button" data-word="لِيُدحِضوا" data-root="D H DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/d-h-dad/" data-root-meaning="Slipping; figuratively, defeating or invalidating an argument." data-context="To discredit; concerning truth.">لِيُدحِضوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="الحَقَّ" data-root="Ḥ Q Q" data-learn-more="/quran-terminology/en/roots/h-q-q/" data-root-meaning="Stability, realization, enduring reality, truth aligned with reality, fixed right, and obligation arising from truth" data-context="Truth, which they sought to displace.">الحَقَّ</button>
    <button class="word-link" type="button" data-word="فَأَخَذتُهُم" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="So I seized them; divine punitive seizure.">فَأَخَذتُهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="فَكَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَكَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was; in the question about the punishment.">كانَ</button>
    <button class="word-link" type="button" data-word="عِقابِ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass" data-context="My punishment; the consequence of denial and disputing with falsehood.">عِقابِ</button>
  </p>
  <p class="english-verse">Before them, the people of Noah and the allied factions after them denied. Every community plotted against its messenger to seize him, and they disputed with falsehood to overthrow the truth with it. So I seized them. How, then, was My penalty?</p>
</section>
