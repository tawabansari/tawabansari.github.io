  <h2 class="ayah-title">Al-Humazah 104:7</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="تَطَّلِعُ" data-root="TT L AYN" data-root-meaning="In its familiar semantic core, Ṭ L ʿ concerns rising and becoming apparent. In natural uses, it describes the sun appearing and plant produce emerging. In human uses, it can concern observing or learning something previously beyond a person’s access. In some constructions, it conveys reaching a particular place." data-learn-more="/quran-terminology/en/roots/tt-l-ayn/">تَطَّلِعُ</button>
    <button class="word-link" type="button" data-word="عَلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَى</button>
    <button class="word-link" type="button" data-word="الأَفـِٔدَةِ" data-root="F A D" data-root-meaning="“heart” is the most appropriate basic equivalent for fuʾād: a heart that Qur’anic usage can connect with reception, understanding, inclination, responsiveness, and steadfastness." data-learn-more="/quran-terminology/en/roots/f-a-d/">الأَفـِٔدَةِ</button>
  </p>
  <p class="english-verse">which rises over the hearts.</p>
