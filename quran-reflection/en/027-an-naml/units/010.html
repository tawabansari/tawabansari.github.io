<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَلقِ" data-root="L Q Y" data-learn-more="/quran-terminology/en/roots/l-q-y/" data-root-meaning="Meeting, encounter, facing, two things reaching one another, and receiving something in the moment of encounter" data-context="And throw; the command to Moses concerning his staff.">وَأَلقِ</button>
    <button class="word-link" type="button" data-word="عَصاكَ" data-root="AYN Ṣ W (ʿ Ṣ W)" data-learn-more="/quran-terminology/en/roots/ayn-sad-w/" data-root-meaning="Staff, support, tool of control, and a means for gathering strength and ordering movement." data-context="Your staff; what Moses was commanded to throw.">عَصاكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="رَءاها" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="He saw it; observing the staff’s movement.">رَءاها</button>
    <button class="word-link" type="button" data-word="تَهتَزُّ" data-root="H2 Z Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-z-z/" data-root-meaning="Shaking or vigorous movement." data-context="Moves or quivers; the staff compared to a snake.">تَهتَزُّ</button>
    <button class="word-link" type="button" data-word="كَأَنَّها" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَأَنَّها</button>
    <button class="word-link" type="button" data-word="جانٌّ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover" data-context="A snake; the comparison for the moving staff.">جانٌّ</button>
    <button class="word-link" type="button" data-word="وَلّىٰ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Turned away; describing Moses’ response.">وَلّىٰ</button>
    <button class="word-link" type="button" data-word="مُدبِرًا" data-root="D B R" data-learn-more="/quran-terminology/en/roots/d-b-r/" data-root-meaning="The back and latter part; turning away and passing; tadbīr, governing affairs; tadabbur, careful reflection on discourse." data-context="Turning his back and departing; describing Moses’ response.">مُدبِرًا</button>
    <button class="word-link" type="button" data-word="وَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَم</button>
    <button class="word-link" type="button" data-word="يُعَقِّب" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass" data-context="Did not turn back; describing Moses’ departure.">يُعَقِّب</button>
    ۚ
    <button class="word-link" type="button" data-word="يٰموسىٰ" data-root-note="Proper name; no root has been assigned.">يٰموسىٰ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَخَف" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Do not fear; reassuring Moses.">تَخَف</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَخافُ" data-root="KH W F" data-learn-more="/quran-terminology/en/roots/kh-w-f/" data-root-meaning="Fear, apprehension, readiness before future danger, and the direction of the soul before threat" data-context="Do not fear; describing messengers in The God’s presence.">يَخافُ</button>
    <button class="word-link" type="button" data-word="لَدَىَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَدَىَّ</button>
    <button class="word-link" type="button" data-word="المُرسَلونَ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="The messengers, who do not fear in the divine presence.">المُرسَلونَ</button>
  </p>
  <p class="english-verse">And throw down your staff. When he saw it moving as though it were a snake, he turned and fled without returning. Moses, do not fear. The messengers do not fear in My presence,</p>
</section>
