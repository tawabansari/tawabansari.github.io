<section class="ayah-block" id="ayah-060" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:60</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمَّن</button>
    <button class="word-link" type="button" data-word="خَلَقَ" data-root="KH L Q" data-learn-more="/quran-terminology/en/roots/kh-l-q/" data-root-meaning="Creating, bringing into being, measuring, shaping, forming, and bringing something forth in a specific form, measure, and order" data-context="Created, referring to the heavens and the earth.">خَلَقَ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens, part of the creation mentioned in the verse’s question.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth, created by that Creator together with the heavens.">وَالأَرضَ</button>
    <button class="word-link" type="button" data-word="وَأَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="And sent down, referring to water from the sky.">وَأَنزَلَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky, from which rain descends.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Water, the rain through which gardens are made to grow.">ماءً</button>
    <button class="word-link" type="button" data-word="فَأَنبَتنا" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed." data-context="Then We produced, referring to gardens possessing beauty and freshness.">فَأَنبَتنا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="حَدائِقَ" data-root="H D Q" data-root-meaning="Encircling and surrounding from different sides; the formation of defined bounds." data-context="Gardens, planted grounds with trees and beautiful growth." data-learn-more="/quran-terminology/en/roots/h-d-q/">حَدائِقَ</button>
    <button class="word-link" type="button" data-word="ذاتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذاتَ</button>
    <button class="word-link" type="button" data-word="بَهجَةٍ" data-root="B H2 J" data-root-meaning="B H J denotes visible beauty and freshness apparent in a thing’s colour, appearance, or display. Applied to humans, it denotes joy and pleasure arising from something pleasing and possibly appearing in the face and behaviour." data-context="Beauty and freshness, describing the pleasing appearance of the gardens in “gardens possessing beauty and freshness.”" data-learn-more="/quran-terminology/en/roots/b-h2-j/">بَهجَةٍ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was, in the expression denying your ability to grow the gardens’ trees.">كانَ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تُنبِتوا" data-root="N B T" data-learn-more="/quran-terminology/en/roots/n-b-t/" data-root-meaning="Sprouting, causing growth, and the emergence of life from a suitable bed." data-context="Make grow, referring to those gardens’ trees.">تُنبِتوا</button>
    <button class="word-link" type="button" data-word="شَجَرَها" data-root="SH J R" data-learn-more="/quran-terminology/en/roots/sh-j-r/" data-root-meaning="Branching, ramification, interweaving, and complex extension from a single origin" data-context="Their trees, the trees of the gardens mentioned.">شَجَرَها</button>
    ۗ
    <button class="word-link" type="button" data-word="أَءِلٰهٌ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Is there a deity, asking whether any deity exists alongside The God.">أَءِلٰهٌ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life. Qawm denotes a group of people or community." data-context="A people or community, describing those who set up equals.">قَومٌ</button>
    <button class="word-link" type="button" data-word="يَعدِلونَ" data-root="ʿ D L (Ayn D L)" data-learn-more="/quran-terminology/en/roots/ayn-d-l/" data-root-meaning="Making things correspond, setting straight, equalizing, and placing each thing in a relation that prevents crookedness and one-sidedness" data-context="They set up equals, treating others as peers of The God in this context; turning away from truth is also an attested interpretation.">يَعدِلونَ</button>
  </p>
  <p class="english-verse">Or the One who created the heavens and the earth and sent down water for you from the sky, with which We grew delightful gardens whose trees you could not grow? Is there a god alongside The God? Rather, they are a people who assign equals.</p>
</section>
