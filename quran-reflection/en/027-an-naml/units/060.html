    <button class="word-link" type="button" data-word="يَعدِلونَ" data-root="ʿ D L (Ayn D L)" data-learn-more="/quran-terminology/en/roots/ayn-d-l/" data-root-meaning="Making things correspond, setting straight, equalizing, and placing each thing in a relation that prevents crookedness and one-sidedness">يَعدِلونَ</button>

  <p class="english-verse">Or the One who created the heavens and the earth and sent down water for you from the sky, with which We grew delightful gardens whose trees you could not grow? Is there a god alongside The God? Rather, they are a people who assign equals.</p>
