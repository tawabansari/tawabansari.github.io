<section class="ayah-block" id="ayah-019" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:19</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَتَبَسَّمَ" data-root="B S M" data-learn-more="/quran-terminology/en/roots/b-s-m/" data-root-meaning="Smiling; a smiling expression appearing on the face with the lips opening gently." data-context="Then he smiled; Solomon’s response to the ant’s words.">فَتَبَسَّمَ</button>
    <button class="word-link" type="button" data-word="ضاحِكًا" data-root="DAD H K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-h-k/" data-root-meaning="Laughing or showing joy." data-context="Laughing; describing Solomon’s state as he smiles.">ضاحِكًا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَولِها" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="At her words; the ant’s speech prompting the smile.">قَولِها</button>
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And he said; introducing Solomon’s prayer.">وَقالَ</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord; Solomon’s address in prayer.">رَبِّ</button>
    <button class="word-link" type="button" data-word="أَوزِعنى" data-root="W Z AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-z-ayn/" data-root-meaning="Restraining or regulating a group; īzāʿ means prompting or enabling action." data-context="Prompt and enable me; requesting gratitude and righteous action.">أَوزِعنى</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="أَشكُرَ" data-root="SH K R" data-learn-more="/quran-terminology/en/roots/sh-k-r/" data-root-meaning="Recognizing a gift, not disregarding it, and showing a fitting response in awareness, speech, and action" data-context="To give thanks; responding to the blessing received.">أَشكُرَ</button>
    <button class="word-link" type="button" data-word="نِعمَتَكَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="Your blessing; the gift Solomon wishes to acknowledge gratefully.">نِعمَتَكَ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="أَنعَمتَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="You bestowed; the blessing upon Solomon and his parents.">أَنعَمتَ</button>
    <button class="word-link" type="button" data-word="عَلَىَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَىَّ</button>
    <button class="word-link" type="button" data-word="وَعَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَعَلىٰ</button>
    <button class="word-link" type="button" data-word="وٰلِدَىَّ" data-root="W L D" data-learn-more="/quran-terminology/en/roots/w-l-d/" data-root-meaning="Giving birth, being born, offspring, and the direct relationship of birth" data-context="My parents; two recipients of blessing in the prayer.">وٰلِدَىَّ</button>
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَن</button>
    <button class="word-link" type="button" data-word="أَعمَلَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="To do; requesting to perform righteous work.">أَعمَلَ</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Righteous work; the object of action in the prayer.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="تَرضىٰهُ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent" data-context="That pleases You; describing the desired work.">تَرضىٰهُ</button>
    <button class="word-link" type="button" data-word="وَأَدخِلنى" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="And admit me; requesting inclusion among the righteous servants.">وَأَدخِلنى</button>
    <button class="word-link" type="button" data-word="بِرَحمَتِكَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="By Your mercy; the means of admission among righteous servants.">بِرَحمَتِكَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="عِبادِكَ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Your servants; the company Solomon asks to join.">عِبادِكَ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحينَ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="The righteous; describing the servants Solomon asks to join.">الصّٰلِحينَ</button>
  </p>
  <p class="english-verse">He smiled, laughing at her words, and said: My Lord, inspire me to thank You for the favor You have bestowed upon me and my parents, and to do righteous work that pleases You. And admit me, through Your mercy, among Your righteous servants.</p>
</section>
