<section class="ayah-block" id="ayah-092" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:92</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَن</button>
    <button class="word-link" type="button" data-word="أَتلُوَا۟" data-root="T L W" data-learn-more="/quran-terminology/en/roots/t-l-w/" data-root-meaning="Following in sequence, moving after something, pursuing, and one thing coming in the extension of another." data-context="I recite: reading the Qur’an.">أَتلُوَا۟</button>
    <button class="word-link" type="button" data-word="القُرءانَ" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="The Qur’an: the text the messenger is commanded to recite." data-learn-more="/quran-terminology/en/roots/q-r-a/">القُرءانَ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَمَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَنِ</button>
    <button class="word-link" type="button" data-word="اهتَدىٰ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Is guided: accepting guidance.">اهتَدىٰ</button>
    <button class="word-link" type="button" data-word="فَإِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّما</button>
    <button class="word-link" type="button" data-word="يَهتَدى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Is guided: the result of finding the way.">يَهتَدى</button>
    <button class="word-link" type="button" data-word="لِنَفسِهِ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="For himself: guidance’s benefit returning to the person.">لِنَفسِهِ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="ضَلَّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome" data-context="Goes astray: departing from guidance.">ضَلَّ</button>
    <button class="word-link" type="button" data-word="فَقُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then say: the response to straying.">فَقُل</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أَنا۠" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنا۠</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المُنذِرينَ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="Warners: the role stated for the messenger.">المُنذِرينَ</button>
  </p>
  <p class="english-verse">And to recite the Quran. Whoever is guided is guided only for himself; and whoever strays, say: I am only one of the warners.</p>
</section>
