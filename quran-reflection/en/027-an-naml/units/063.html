<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:63</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمَّن</button>
    <button class="word-link" type="button" data-word="يَهديكُم" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">يَهديكُم</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ظُلُمٰتِ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">ظُلُمٰتِ</button>
    <button class="word-link" type="button" data-word="البَرِّ" data-root="B R R" data-learn-more="/quran-terminology/en/roots/b-r-r/" data-root-meaning="Expansive goodness, upright conduct, faithfulness, beneficence, openness in good, and standing on firm moral ground.">البَرِّ</button>
    <button class="word-link" type="button" data-word="وَالبَحرِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation">وَالبَحرِ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="يُرسِلُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">يُرسِلُ</button>
    <button class="word-link" type="button" data-word="الرِّيٰحَ" data-root="R W Ḥ" data-learn-more="/quran-terminology/en/roots/r-w-h/" data-root-meaning="Wind, breath, relief, and spirit">الرِّيٰحَ</button>
    <button class="word-link" type="button" data-word="بُشرًا" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact">بُشرًا</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَ</button>
    <button class="word-link" type="button" data-word="يَدَى" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">يَدَى</button>
    <button class="word-link" type="button" data-word="رَحمَتِهِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">رَحمَتِهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="أَءِلٰهٌ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">أَءِلٰهٌ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="تَعٰلَى" data-root="AYN L W" data-root-note="Root study coming soon.">تَعٰلَى</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَمّا</button>
    <button class="word-link" type="button" data-word="يُشرِكونَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God">يُشرِكونَ</button>
  </p>
  <p class="english-verse">Or the One who guides you through the darkness of land and sea, and sends the winds as good news ahead of His mercy? Is there a god alongside The God? Exalted is The God above what they associate with Him.</p>
</section>
