<section class="ayah-block" id="ayah-093" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:93</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقُلِ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقُلِ</button>
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd">الحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="سَيُريكُم" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness">سَيُريكُم</button>
    <button class="word-link" type="button" data-word="ءايٰتِهِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتِهِ</button>
    <button class="word-link" type="button" data-word="فَتَعرِفونَها" data-root="ʿ R F" data-learn-more="/quran-terminology/en/roots/ayn-r-f/" data-root-meaning="Knowing, recognizing, discerning, the appearance of a sign, and a thing coming out of ambiguity or unfamiliarity.">فَتَعرِفونَها</button>
    ۚ
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="رَبُّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبُّكَ</button>
    <button class="word-link" type="button" data-word="بِغٰفِلٍ" data-root="GH F L" data-learn-more="/quran-terminology/en/roots/gh-f-l/" data-root-meaning="Something remaining outside, or being left outside, the field of attention, watchfulness, and follow-up">بِغٰفِلٍ</button>
    <button class="word-link" type="button" data-word="عَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَمّا</button>
    <button class="word-link" type="button" data-word="تَعمَلونَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">تَعمَلونَ</button>
  </p>
  <p class="english-verse">And say: Praise belongs to The God. He will show you His signs, and you will recognize them. Your Lord is not unaware of what you do.</p>
</section>
