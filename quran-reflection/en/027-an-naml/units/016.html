<section class="ayah-block" id="ayah-016" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:16</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَوَرِثَ" data-root="W R TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-r-th/" data-root-meaning="Inheriting or receiving property or position from a predecessor.">وَوَرِثَ</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنُ" data-root-note="Proper name; no root has been assigned.">سُلَيمٰنُ</button>
    <button class="word-link" type="button" data-word="داوۥدَ" data-root-note="Proper name; no root has been assigned.">داوۥدَ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقالَ</button>
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النّاسُ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">النّاسُ</button>
    <button class="word-link" type="button" data-word="عُلِّمنا" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">عُلِّمنا</button>
    <button class="word-link" type="button" data-word="مَنطِقَ" data-root="N TT Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-tt-q/" data-root-meaning="Speaking or expressing.">مَنطِقَ</button>

    <button class="word-link" type="button" data-word="وَأوتينا" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival">وَأوتينا</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection.">كُلِّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">شَىءٍ</button>

    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="لَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُوَ</button>
    <button class="word-link" type="button" data-word="الفَضلُ" data-root="F Ḍ L (F Dad L)" data-learn-more="/quran-terminology/en/roots/f-dad-l/" data-root-meaning="Increase, added gift, and benefit beyond a baseline or compared party.">الفَضلُ</button>
    <button class="word-link" type="button" data-word="المُبينُ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">المُبينُ</button>
  </p>
  <p class="english-verse">And Solomon inherited from David and said: People, we have been taught the speech of birds and given of everything. This is indeed evident favor.</p>
