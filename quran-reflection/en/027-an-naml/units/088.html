<section class="ayah-block" id="ayah-088" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:88</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَرَى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="And you see; seeing the mountains in the verse.">وَتَرَى</button>
    <button class="word-link" type="button" data-word="الجِبالَ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; thought motionless yet described as passing like clouds." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجِبالَ</button>
    <button class="word-link" type="button" data-word="تَحسَبُها" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/" data-context="You think them; regarding the mountains as motionless.">تَحسَبُها</button>
    <button class="word-link" type="button" data-word="جامِدَةً" data-root="J M D" data-root-meaning="Solidifying and ceasing to flow; in the Qur’anic usage, being stationary and motionless." data-context="Motionless; the state the observer attributes to the mountains." data-learn-more="/quran-terminology/en/roots/j-m-d/">جامِدَةً</button>
    <button class="word-link" type="button" data-word="وَهِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهِىَ</button>
    <button class="word-link" type="button" data-word="تَمُرُّ" data-root="M R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing or recurrence; also bitterness or strength in different forms." data-context="They pass; the motion attributed to mountains.">تَمُرُّ</button>
    <button class="word-link" type="button" data-word="مَرَّ" data-root="M R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-r-r/" data-root-meaning="Passing or recurrence; also bitterness or strength in different forms." data-context="Passing; the verbal noun compared with clouds’ passage.">مَرَّ</button>
    <button class="word-link" type="button" data-word="السَّحابِ" data-root="S H B" data-root-meaning="Dragging, extending and cloud: from drawing something over the ground to clouds moving through the sky and people dragged in punishment" data-learn-more="/quran-terminology/en/roots/s-h-b/" data-context="Clouds; the comparison for mountains’ passing.">السَّحابِ</button>
    ۚ
    <button class="word-link" type="button" data-word="صُنعَ" data-root="SAD N AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-n-ayn/" data-root-meaning="Making or performing with skill and care." data-context="The work; attributing this making to The God.">صُنعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="أَتقَنَ" data-root="T Q N" data-learn-more="/quran-terminology/en/roots/t-q-n/" data-root-meaning="Making something precise, firm, coordinated, and free of structural flaw." data-context="Made precise and firm; describing the making of everything.">أَتقَنَ</button>
    <button class="word-link" type="button" data-word="كُلَّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every; the scope of the statement about each thing.">كُلَّ</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Thing; what is described as precisely made.">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="خَبيرٌ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Fully aware; describing divine knowledge of the audience’s deeds." data-learn-more="/quran-terminology/en/roots/kh-b-r/">خَبيرٌ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="تَفعَلونَ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action" data-context="You do; the addressees’ actions.">تَفعَلونَ</button>
  </p>
  <p class="english-verse">You see the mountains and think them motionless, while they pass like clouds. The workmanship of The God, who has perfected everything. He is aware of what you do.</p>
</section>
