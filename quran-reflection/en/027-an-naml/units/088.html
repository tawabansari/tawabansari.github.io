    <button class="word-link" type="button" data-word="الجِبالَ" data-root="J B L" data-root-note="Root study coming soon.">الجِبالَ</button>
    <button class="word-link" type="button" data-word="تَحسَبُها" data-root="H S B" data-root-meaning="Ḥisāb is counting and assessing quantity or conduct; ḥasiba is supposing and mentally assessing; ḥasb is sufficiency and adequacy; and other derivatives, including ḥasīb and ḥusbān, take their meanings from their morphology and context." data-learn-more="/quran-terminology/en/roots/h-s-b/">تَحسَبُها</button>

    <button class="word-link" type="button" data-word="أَتقَنَ" data-root="T Q N" data-learn-more="/quran-terminology/en/roots/t-q-n/" data-root-meaning="Making something precise, firm, coordinated, and free of structural flaw.">أَتقَنَ</button>

    <button class="word-link" type="button" data-word="تَفعَلونَ" data-root="F ʿ L" data-learn-more="/quran-terminology/en/roots/f-ayn-l/" data-root-meaning="Doing, bringing an act into reality, and moving from intention or possibility into action">تَفعَلونَ</button>

  <p class="english-verse">You see the mountains and think them motionless, while they pass like clouds. The workmanship of The God, who has perfected everything. He is aware of what you do.</p>
