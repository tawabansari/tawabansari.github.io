<section class="ayah-block" id="ayah-045" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أَرسَلنا" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination" data-context="We sent Salih to Thamud.">أَرسَلنا</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="ثَمودَ" data-root-note="Proper name; no root has been assigned.">ثَمودَ</button>
    <button class="word-link" type="button" data-word="أَخاهُم" data-root="A KH W" data-learn-more="/quran-terminology/en/roots/a-kh-w/" data-root-meaning="Brother; where context warrants, a fellow member of one’s people or an associate." data-context="Their brother Salih, expressing his connection with the community of Thamud.">أَخاهُم</button>
    <button class="word-link" type="button" data-word="صٰلِحًا" data-root-note="Proper name; no root has been assigned.">صٰلِحًا</button>
    <button class="word-link" type="button" data-word="أَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنِ</button>
    <button class="word-link" type="button" data-word="اعبُدُوا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worship and serve God, the substance of Salih’s call.">اعبُدُوا</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="فَريقانِ" data-root="F R Q" data-learn-more="/quran-terminology/en/roots/f-r-q/" data-root-meaning="Separating, distinguishing, splitting a continuity, and making a boundary between two things or two paths" data-context="Two distinct groups among Thamud in response to Salih’s call.">فَريقانِ</button>
    <button class="word-link" type="button" data-word="يَختَصِمونَ" data-root="KH SAD M" data-root-meaning="Two parties confronting and disputing over a claim, right, or contested issue; khasm denotes a party to the dispute." data-context="Two groups among Thamud dispute with one another concerning Salih’s call." data-learn-more="/quran-terminology/en/roots/kh-sad-m/">يَختَصِمونَ</button>
  </p>
  <p class="english-verse">We sent to Thamud their brother Salih: Worship The God. Then they became two groups disputing.</p>
</section>
