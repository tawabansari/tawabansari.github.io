<section class="ayah-block" id="ayah-083" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:83</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And the day when the groups are gathered.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="نَحشُرُ" data-root="H SH R" data-root-meaning="Gathering people or creatures from dispersion, often with directed movement toward a shared place or situation." data-context="We gather a group from every community among the deniers." data-learn-more="/quran-terminology/en/roots/h-sh-r/">نَحشُرُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="كُلِّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every, specifying gathering from each community.">كُلِّ</button>
    <button class="word-link" type="button" data-word="أُمَّةٍ" data-root="A M M" data-learn-more="/quran-terminology/en/roots/a-m-m/" data-root-meaning="From Mother and Origin to Ummah, Imam, What Lies Ahead, and Intending a Destination" data-context="A community from which a group is gathered.">أُمَّةٍ</button>
    <button class="word-link" type="button" data-word="فَوجًا" data-root="F W J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-w-j/" data-root-meaning="A company or group coming together." data-context="A group from each community.">فَوجًا</button>
    <button class="word-link" type="button" data-word="مِمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِمَّن</button>
    <button class="word-link" type="button" data-word="يُكَذِّبُ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="Denies The God’s signs.">يُكَذِّبُ</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِنا" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth" data-context="Our signs, which are denied.">بِـٔايٰتِنا</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهُم</button>
    <button class="word-link" type="button" data-word="يوزَعونَ" data-root="W Z AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-z-ayn/" data-root-meaning="Restraining or regulating a group; īzāʿ means prompting or enabling action." data-context="Are restrained and ordered after gathering.">يوزَعونَ</button>
  </p>
  <p class="english-verse">And the day We gather from every community a group of those who deny Our signs, and they are held in order,</p>
</section>
