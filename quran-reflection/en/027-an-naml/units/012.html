<section class="ayah-block" id="ayah-012" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:12</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَدخِل" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it.">وَأَدخِل</button>
    <button class="word-link" type="button" data-word="يَدَكَ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible.">يَدَكَ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="جَيبِكَ" data-root="J Y B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-y-b/" data-root-meaning="Jayb and juyūb: the garment opening at the neck and upper chest.">جَيبِكَ</button>
    <button class="word-link" type="button" data-word="تَخرُج" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility">تَخرُج</button>
    <button class="word-link" type="button" data-word="بَيضاءَ" data-root="B Y DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/b-y-dad/" data-root-meaning="Whiteness or becoming white; bayḍ in another branch denotes eggs.">بَيضاءَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="غَيرِ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state">غَيرِ</button>
    <button class="word-link" type="button" data-word="سوءٍ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">سوءٍ</button>

    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="تِسعِ" data-root="T S AYN" data-learn-more="/quran-terminology/en/roots/t-s-ayn/" data-root-meaning="The number nine, ninety, ninety-nine, and nineteen; a numerical root whose meaning is quantity, while each verse gives that quantity its role.">تِسعِ</button>
    <button class="word-link" type="button" data-word="ءايٰتٍ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتٍ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَقَومِهِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">وَقَومِهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُم</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانوا</button>
    <button class="word-link" type="button" data-word="قَومًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">قَومًا</button>
    <button class="word-link" type="button" data-word="فٰسِقينَ" data-root="F S Q" data-learn-more="/quran-terminology/en/roots/f-s-q/" data-root-meaning="Leaving the boundary, breaking from covenant and trust, and practical disobedience against a clear command">فٰسِقينَ</button>
  </p>
  <p class="english-verse">And put your hand into your garment’s opening; it will come out white without harm, among nine signs to Pharaoh and his people. They were a defiantly disobedient people.</p>
</section>
