<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="يَسجُدوا" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="They prostrate; with allā in continuation of the preceding context: so that they do not prostrate to The God.">يَسجُدوا</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="يُخرِجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="He brings forth; The God brings forth what is hidden in the heavens and the earth.">يُخرِجُ</button>
    <button class="word-link" type="button" data-word="الخَبءَ" data-root="KH B A" data-root-meaning="Covering and keeping concealed; khabʾ: something hidden or concealed." data-context="What is hidden in the heavens and the earth and which The God brings forth." data-learn-more="/quran-terminology/en/roots/kh-b-a/">الخَبءَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; one of the two domains whose hidden things The God brings forth.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth; the other domain whose hidden things The God brings forth.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَيَعلَمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="And He knows; The God knows what the addressees conceal or disclose.">وَيَعلَمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="تُخفونَ" data-root="KH F Y" data-root-meaning="Being or remaining hidden; concealing; and, in a branch of early Arabic, becoming apparent or revealing something concealed." data-context="You conceal; what you keep hidden from others’ sight or knowledge." data-learn-more="/quran-terminology/en/roots/kh-f-y/">تُخفونَ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تُعلِنونَ" data-root="ʿ L N (Ayn L N)" data-learn-more="/quran-terminology/en/roots/ayn-l-n/" data-root-meaning="Being Open and Making Manifest in Contrast to What Is Hidden" data-context="You disclose; what you make public or bring into the open.">تُعلِنونَ</button>
  </p>
  <p class="english-verse">So that they do not prostrate to The God, who brings out what is hidden in the heavens and the earth and knows what you conceal and what you reveal.</p>
</section>
