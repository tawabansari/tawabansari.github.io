<section class="ayah-block" id="ayah-020" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:20</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَتَفَقَّدَ" data-root="F Q D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-q-d/" data-root-meaning="Missing or losing something; tafaqqūd means checking or looking for it." data-context="And inspected or checked on; Solomon’s examination of the birds.">وَتَفَقَّدَ</button>
    <button class="word-link" type="button" data-word="الطَّيرَ" data-root="TT Y R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-y-r/" data-root-meaning="Flight or a bird; taṭayyur is taking an omen; ṭāʾir can also denote one&#x27;s lot or record." data-context="The birds; those Solomon is inspecting.">الطَّيرَ</button>
    <button class="word-link" type="button" data-word="فَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then he said; Solomon’s words after inspecting the birds.">فَقالَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="لِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِىَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="أَرَى" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="I see; in “why do I not see the hoopoe?”, expressing the bird’s absence from his sight.">أَرَى</button>
    <button class="word-link" type="button" data-word="الهُدهُدَ" data-root="H2 D H2 D" data-root-meaning="Hudhud names a crested bird with a distinctive call. The lexical family H D H D also records uses concerning repeated sounds and moving something. In the Qur’an, the word occurs only as the name of a bird in Solomon’s story." data-context="The hoopoe: the particular bird Solomon did not see when inspecting the birds." data-learn-more="/quran-terminology/en/roots/h2-d-h2-d/">الهُدهُدَ</button>
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was or is; in the question whether the hoopoe is among the absent.">كانَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الغائِبينَ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God" data-context="The absent; those not present, in Solomon’s question about the missing hoopoe.">الغائِبينَ</button>
  </p>
  <p class="english-verse">He inspected the birds and said: Why do I not see the hoopoe? Or is he among the absent?</p>
</section>
