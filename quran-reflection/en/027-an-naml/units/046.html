<section class="ayah-block" id="ayah-046" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:46</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَ</button>
    <button class="word-link" type="button" data-word="يٰقَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">يٰقَومِ</button>
    <button class="word-link" type="button" data-word="لِمَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَ</button>
    <button class="word-link" type="button" data-word="تَستَعجِلونَ" data-root="ʿ J L" data-learn-more="/quran-terminology/en/roots/ayn-j-l/" data-root-meaning="Hastening, seeking a result before its proper time, nearness, and the calf">تَستَعجِلونَ</button>
    <button class="word-link" type="button" data-word="بِالسَّيِّئَةِ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah">بِالسَّيِّئَةِ</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being">قَبلَ</button>
    <button class="word-link" type="button" data-word="الحَسَنَةِ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another.">الحَسَنَةِ</button>
    ۖ
    <button class="word-link" type="button" data-word="لَولا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَولا</button>
    <button class="word-link" type="button" data-word="تَستَغفِرونَ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence.">تَستَغفِرونَ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="لَعَلَّكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّكُم</button>
    <button class="word-link" type="button" data-word="تُرحَمونَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">تُرحَمونَ</button>
  </p>
  <p class="english-verse">He said: My people, why do you seek to hasten evil before good? Why do you not seek forgiveness from The God, so that you may receive mercy?</p>
</section>
