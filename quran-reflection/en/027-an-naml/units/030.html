<section class="ayah-block" id="ayah-030" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:30</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="سُلَيمٰنَ" data-root-note="Proper name; no root has been assigned.">سُلَيمٰنَ</button>
    <button class="word-link" type="button" data-word="وَإِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنَّهُ</button>
    <button class="word-link" type="button" data-word="بِسمِ" data-root="S M W / W S M" data-learn-more="/quran-terminology/en/roots/w-s-m/" data-root-meaning="Raising into the level of recognition, and marking for identification" data-transliteration="bismi" data-context="In the name; bi is a preposition and ism means a name, identifier, or identifying sign. Here, beginning an act in the name and remembrance of The God.">بِسمِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-transliteration="Allahi" data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”">اللَّهِ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="R H M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, womb-like care, protection, and nurturing connection" data-transliteration="al-Rahmani" data-context="The all-encompassing, overflowing, and universal mercy of The God">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="الرَّحيمِ" data-root="R H M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, womb-like care, protection, and nurturing connection" data-transliteration="al-Rahimi" data-context="The enduring, near, and relational mercy that accompanies guidance and growth">الرَّحيمِ</button>
  </p>
  <p class="english-verse">It is from Solomon, and it is: In the name of <a href="/en/quran-terminology/allah-means-the-god/">The God</a>, <a href="/en/quran-terminology/allah-means-the-god/#forqan-opening">the Entirely Merciful</a>, <a href="/en/quran-terminology/allah-means-the-god/#forqan-opening">the Especially Merciful</a>.</p>
</section>
