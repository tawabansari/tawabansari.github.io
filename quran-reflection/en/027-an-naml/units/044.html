  <p class="english-verse">She was told: Enter the palace. When she saw it, she thought it was deep water and uncovered her shins. He said: It is a palace made smooth with glass. She said: My Lord, I have wronged myself, and with Solomon I submit to The God, Lord of all worlds.</p>
