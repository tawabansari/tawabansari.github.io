  <h2 class="ayah-title">An-Naml 27:37</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ارجِع" data-root="R J ʿ" data-learn-more="/quran-terminology/en/roots/r-j-ayn/" data-root-meaning="Returning, going back, turning from a path, the return of an effect, and returning to a point of reference" data-context="Return.">ارجِع</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>

  <p class="english-verse">Return to them. We will certainly come to them with armies they cannot face, and drive them out of there humbled and abased.</p>
