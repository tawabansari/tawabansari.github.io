<section class="ayah-block" id="ayah-061" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:61</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمَّن</button>
    <button class="word-link" type="button" data-word="جَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Made or established; making the earth a place of settlement.">جَعَلَ</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth, made a place of settlement.">الأَرضَ</button>
    <button class="word-link" type="button" data-word="قَرارًا" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness." data-context="A place of settlement or stability; describing the earth here.">قَرارًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Placed; concerning rivers through the earth.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="خِلٰلَها" data-root="KH L L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-l-l/" data-root-meaning="An interval or opening between things; also intimate friendship." data-context="Through its midst or intervening spaces; where the rivers are placed.">خِلٰلَها</button>
    <button class="word-link" type="button" data-word="أَنهٰرًا" data-root="N H R" data-learn-more="/quran-terminology/en/roots/n-h2-r/" data-root-meaning="Visible watercourse, river, daylight, and open forceful repelling" data-context="Rivers; waterways placed through the earth.">أَنهٰرًا</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Placed or established; concerning the earth’s firm mountains.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="لَها" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَها</button>
    <button class="word-link" type="button" data-word="رَوٰسِىَ" data-root="R S W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-s-w/" data-root-meaning="Becoming firmly settled; anchoring or coming to rest." data-context="Firm mountains; the elevations mentioned in describing the earth.">رَوٰسِىَ</button>
    <button class="word-link" type="button" data-word="وَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Placed; concerning the barrier between two bodies of water.">وَجَعَلَ</button>
    <button class="word-link" type="button" data-word="بَينَ" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between; the barrier’s position relative to the two bodies of water.">بَينَ</button>
    <button class="word-link" type="button" data-word="البَحرَينِ" data-root="B Ḥ R (B H R)" data-learn-more="/quran-terminology/en/roots/b-h-r/" data-root-meaning="A broad expanse of water, openness and breadth, and an environment that is both a source of life and movement and a place of danger and human limitation" data-context="Two bodies of water or two seas; the sides separated by the barrier.">البَحرَينِ</button>
    <button class="word-link" type="button" data-word="حاجِزًا" data-root="H J Z" data-root-meaning="Separating and preventing; obstructing arrival, passage, or an action." data-context="A barrier and separator between two bodies of water." data-learn-more="/quran-terminology/en/roots/h-j-z/">حاجِزًا</button>
    ۗ
    <button class="word-link" type="button" data-word="أَءِلٰهٌ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="Is there a deity? A question about associating a deity with The God.">أَءِلٰهٌ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="أَكثَرُهُم" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Most of them; the majority described as not knowing.">أَكثَرُهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Know; with lā, the statement says that most of them do not know.">يَعلَمونَ</button>
  </p>
  <p class="english-verse">Or the One who made the earth a resting place, placed rivers within it, set firm mountains for it, and put a barrier between the two seas? Is there a god alongside The God? Rather, most of them do not know.</p>
</section>
