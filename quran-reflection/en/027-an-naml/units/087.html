<section class="ayah-block" id="ayah-087" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:87</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="And on the day when; the time of the trumpet’s sounding.">وَيَومَ</button>
    <button class="word-link" type="button" data-word="يُنفَخُ" data-root="N F KH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-f-kh/" data-root-meaning="Blowing or setting air in motion." data-context="Is blown; a passive verb describing blowing into the trumpet.">يُنفَخُ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الصّورِ" data-root="SAD W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/sad-w-r/" data-root-meaning="Forming or giving shape; ṣūr is a trumpet; ṣur in al-Baqarah has explanations involving drawing near or gathering." data-context="The trumpet mentioned in the resurrection scene.">الصّورِ</button>
    <button class="word-link" type="button" data-word="فَفَزِعَ" data-root="F Z AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-z-ayn/" data-root-meaning="Sudden alarm or terror." data-context="Then they are terrified; the reaction described with an explicit exception.">فَفَزِعَ</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; where some of those mentioned are.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; paired with the heavens to express the verse’s scope.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="إِلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلّا</button>
    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="شاءَ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Wills; The God’s will in the exception clause.">شاءَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَكُلٌّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="And all; expressing the inclusiveness of coming before Him.">وَكُلٌّ</button>
    <button class="word-link" type="button" data-word="أَتَوهُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="They come before Him; appearing before The God.">أَتَوهُ</button>
    <button class="word-link" type="button" data-word="دٰخِرينَ" data-root="D KH R" data-learn-more="/quran-terminology/en/roots/d-kh-r/" data-root-meaning="Lowliness, submission, and abasement; context determines the quality and value of this condition." data-context="In submission and lowliness; the condition of all as they come before Him.">دٰخِرينَ</button>
  </p>
  <p class="english-verse">And the day the trumpet is blown, whoever is in the heavens and whoever is on the earth will be terrified, except whom The God wills. And all will come to Him humbled.</p>
</section>
