<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:49</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قالوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="The conspirators said.">قالوا</button>
    <button class="word-link" type="button" data-word="تَقاسَموا" data-root="Q S M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-s-m/" data-root-meaning="Dividing or allotting; qasam is an oath." data-context="Swear an oath to one another.">تَقاسَموا</button>
    <button class="word-link" type="button" data-word="بِاللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">بِاللَّهِ</button>
    <button class="word-link" type="button" data-word="لَنُبَيِّتَنَّهُ" data-root="B Y T" data-root-meaning="In its spatial branch, B Y T denotes a house or place provided for dwelling, shelter, and return; its temporal branch concerns spending the night. Related uses concern doing, planning, or preparing something at night." data-context="We will surely attack him by night." data-learn-more="/quran-terminology/en/roots/b-y-t/">لَنُبَيِّتَنَّهُ</button>
    <button class="word-link" type="button" data-word="وَأَهلَهُ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="And his household.">وَأَهلَهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَنَقولَنَّ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then we will surely say.">لَنَقولَنَّ</button>
    <button class="word-link" type="button" data-word="لِوَلِيِّهِ" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="To his guardian or next of kin.">لِوَلِيِّهِ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="شَهِدنا" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth" data-context="We did not witness, in their planned false claim.">شَهِدنا</button>
    <button class="word-link" type="button" data-word="مَهلِكَ" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="The destruction of Salih’s household, which the conspirators plan to deny witnessing." data-learn-more="/quran-terminology/en/roots/h2-l-k/">مَهلِكَ</button>
    <button class="word-link" type="button" data-word="أَهلِهِ" data-root="ʾ H L" data-learn-more="/quran-terminology/en/roots/a-h2-l/" data-root-meaning="From family and the people of a household to community, belonging, and worthiness" data-context="His household.">أَهلِهِ</button>
    <button class="word-link" type="button" data-word="وَإِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِنّا</button>
    <button class="word-link" type="button" data-word="لَصٰدِقونَ" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action" data-context="We are truthful, the conspirators’ claim.">لَصٰدِقونَ</button>
  </p>
  <p class="english-verse">They said: Swear to one another by The God that we will attack him and his family by night, then tell his guardian: We did not witness his family’s destruction, and we are truthful.</p>
</section>
