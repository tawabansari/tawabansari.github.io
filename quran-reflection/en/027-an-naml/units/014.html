<section class="ayah-block" id="ayah-014" data-translation-status="provisional">
  <h2 class="ayah-title">An-Naml 27:14</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَجَحَدوا" data-root="J H D" data-root-meaning="Denying or refusing to accept something that calls for acknowledgment; in its prominent sense, denial despite recognizing the truth." data-context="And they rejected the signs despite inward certainty, in wrongdoing and arrogance." data-learn-more="/quran-terminology/en/roots/j-h-d/">وَجَحَدوا</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="وَاستَيقَنَتها" data-root="Y Q N" data-learn-more="/quran-terminology/en/roots/y-q-n/" data-root-meaning="Firmness of knowledge, clear assurance, and passing beyond conjecture" data-context="And were certain of them, inward certainty concerning the signs they denied.">وَاستَيقَنَتها</button>
    <button class="word-link" type="button" data-word="أَنفُسُهُم" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="Their souls, identifying those inwardly certain of the signs.">أَنفُسُهُم</button>
    <button class="word-link" type="button" data-word="ظُلمًا" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place" data-context="In wrongdoing, describing the motive or moral character of the denial.">ظُلمًا</button>
    <button class="word-link" type="button" data-word="وَعُلُوًّا" data-root="AYN L W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-l-w/" data-root-meaning="Height or elevation; rising or exalting." data-context="And arrogance, the self-exaltation accompanying denial.">وَعُلُوًّا</button>
    ۚ
    <button class="word-link" type="button" data-word="فَانظُر" data-root="N Ẓ R" data-learn-more="/quran-terminology/en/roots/n-zha-r/" data-root-meaning="Looking, attending carefully to something, waiting, and granting delay" data-context="So see, directing attention to their outcome.">فَانظُر</button>
    <button class="word-link" type="button" data-word="كَيفَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">كَيفَ</button>
    <button class="word-link" type="button" data-word="كانَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Was, in the question concerning the corrupters’ outcome.">كانَ</button>
    <button class="word-link" type="button" data-word="عٰقِبَةُ" data-root="ʿ Q B" data-learn-more="/quran-terminology/en/roots/ayn-q-b/" data-root-meaning="Heel, succession, replacement and outcome: from consequence and punishment to following up and crossing the difficult pass" data-context="Outcome, the final result of the corrupters’ conduct.">عٰقِبَةُ</button>
    <button class="word-link" type="button" data-word="المُفسِدينَ" data-root="F S D" data-learn-more="/quran-terminology/en/roots/f-s-d/" data-root-meaning="Corruption, ruin, the breakdown of salāh, and departure from health, balance, and beneficial order" data-context="The corrupters, whose outcome is presented for consideration.">المُفسِدينَ</button>
  </p>
  <p class="english-verse">And they rejected them in wrongdoing and arrogance, although their souls were certain of them. So see how the corrupters ended.</p>
</section>
