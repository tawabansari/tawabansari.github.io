<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">Sad 38:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَجَعَلَ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="Has he made, within the question of rejection.">أَجَعَلَ</button>
    <button class="word-link" type="button" data-word="الـٔالِهَةَ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="The gods, which the speakers regard as multiple.">الـٔالِهَةَ</button>
    <button class="word-link" type="button" data-word="إِلٰهًا" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God" data-context="A god or object of worship, described as one.">إِلٰهًا</button>
    <button class="word-link" type="button" data-word="وٰحِدًا" data-root="W Ḥ D" data-learn-more="/quran-terminology/en/roots/w-h-d/" data-root-meaning="Being one, being single, being alone, and treating something as one." data-context="One, describing the object of worship.">وٰحِدًا</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="لَشَىءٌ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Indeed a thing, described as exceedingly astonishing.">لَشَىءٌ</button>
    <button class="word-link" type="button" data-word="عُجابٌ" data-root="AYN J B" data-root-meaning="Wonder and finding something significant or unusual; iʿjāb denotes pleasing or impressing, and ʿujb self-admiration." data-context="Exceedingly astonishing, describing one object of worship in the deniers’ speech." data-learn-more="/quran-terminology/en/roots/ayn-j-b/">عُجابٌ</button>
  </p>
  <p class="english-verse">Has he made the gods one god? This is indeed an astonishing thing.”</p>
