<section class="ayah-block" id="ayah-004" data-translation-status="provisional">
  <h2 class="ayah-title">Sad 38:4</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَعَجِبوا" data-root="AYN J B" data-root-meaning="Wonder and finding something significant or unusual; iʿjāb denotes pleasing or impressing, and ʿujb self-admiration." data-context="They were astonished at a warner coming from among themselves." data-learn-more="/quran-terminology/en/roots/ayn-j-b/">وَعَجِبوا</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="جاءَهُم" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Came to them, referring to a warner among themselves.">جاءَهُم</button>
    <button class="word-link" type="button" data-word="مُنذِرٌ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="A warner whose arrival astonishes them.">مُنذِرٌ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَقالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And said, introducing the accusation.">وَقالَ</button>
    <button class="word-link" type="button" data-word="الكٰفِرونَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="The disbelievers making the accusation.">الكٰفِرونَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="سٰحِرٌ" data-root="S Ḥ R" data-learn-more="/quran-terminology/en/roots/s-h-r/" data-root-meaning="Siḥr and saḥar: altered perception and the time before dawn" data-context="A magician, the accusation.">سٰحِرٌ</button>
    <button class="word-link" type="button" data-word="كَذّابٌ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message" data-context="A great liar, their accusation.">كَذّابٌ</button>
  </p>
  <p class="english-verse">And they were astonished that a warner from among themselves came to them. The disbelievers said, “This is a magician, a persistent liar.</p>
