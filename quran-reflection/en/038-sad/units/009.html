    <button class="word-link" type="button" data-word="خَزائِنُ" data-root="KH Z N" data-root-meaning="Keeping and safeguarding; a treasury is a repository or resources in custody, and a khāzin is their keeper." data-context="Treasuries; the Lord’s mercy resources, whose possession by them is questioned." data-learn-more="/quran-terminology/en/roots/kh-z-n/">خَزائِنُ</button>

  <p class="english-verse">Or do they possess the treasuries of the mercy of your Lord, the Mighty, the Bestower?</p>
