<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">Sad 38:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="مُلكُ" data-root="M L K" data-learn-more="/quran-terminology/en/roots/m-l-k/" data-root-meaning="Ownership, kingship, authority, sovereignty, power of disposal, and the dependence of every ownership and dominion upon The God" data-context="Sovereignty: the claim of ownership and authority over the heavens and earth.">مُلكُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens: part of the realm whose sovereignty is questioned.">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="And the earth: alongside the heavens in that question.">وَالأَرضِ</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="بَينَهُما" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction" data-context="Between them: what lies between the heavens and earth.">بَينَهُما</button>
    ۖ
    <button class="word-link" type="button" data-word="فَليَرتَقوا" data-root="R Q Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-q-y/" data-root-meaning="Ascending; in another usage, reciting a healing invocation." data-context="Then let them ascend: a command challenging their claim.">فَليَرتَقوا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَسبٰبِ" data-root="S B B" data-root-meaning="Sabab: A route, means, or bond enabling access and connection between two things. Sabba: To insult and offend through contemptuous speech. Lexical sources also connect this branch with cutting." data-context="Ways or means of ascent and access, in the verse’s challenging command." data-learn-more="/quran-terminology/en/roots/s-b-b/">الأَسبٰبِ</button>
  </p>
  <p class="english-verse">Or does the dominion of the heavens and the earth and whatever is between them belong to them? Then let them ascend by the means.</p>
