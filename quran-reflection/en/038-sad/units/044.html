<section class="ayah-block" id="ayah-044" data-translation-status="provisional">
  <h2 class="ayah-title">Sad 38:44</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَخُذ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit" data-context="And take; a command to Job to take a bundle in his hand.">وَخُذ</button>
    <button class="word-link" type="button" data-word="بِيَدِكَ" data-root="Y D Y" data-learn-more="/quran-terminology/en/roots/y-d-y/" data-root-meaning="Hand; the instrument through which will, action, authority, disposal, responsibility, giving, and covenant become visible." data-context="With or in your hand; Job’s hand holding the bundle.">بِيَدِكَ</button>
    <button class="word-link" type="button" data-word="ضِغثًا" data-root="DAD GH TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dad-gh-th/" data-root-meaning="A mixed bundle of stalks or twigs; aḍghāth aḥlām means confused dreams." data-context="A bundle of stalks, branches, or plants; the implement specified for striking in this verse.">ضِغثًا</button>
    <button class="word-link" type="button" data-word="فَاضرِب" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="Then strike with it; a command that does not itself name the recipient or number of strokes.">فَاضرِب</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="وَلا" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلا</button>
    <button class="word-link" type="button" data-word="تَحنَث" data-root="H N TH" data-root-meaning="Sin and transgression; in the use concerning oaths, failing to fulfill or breaking an oath." data-context="Do not violate your oath; with prohibitive lā, addressing Job and forbidding oath-breaking, without specifying the oath’s full background in the verse." data-learn-more="/quran-terminology/en/roots/h-n-th/">تَحنَث</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="وَجَدنٰهُ" data-root="W J D" data-learn-more="/quran-terminology/en/roots/w-j-d/" data-root-meaning="Finding, having access, and encountering something within one’s perception" data-context="We found him; introducing the assessment of Job as patient.">وَجَدنٰهُ</button>
    <button class="word-link" type="button" data-word="صابِرًا" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure." data-context="Patient; describing Job’s endurance and steadfastness amid suffering.">صابِرًا</button>
    ۚ
    <button class="word-link" type="button" data-word="نِعمَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="How excellent; a verb of praise for the servant being described.">نِعمَ</button>
    <button class="word-link" type="button" data-word="العَبدُ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="The servant; Job in his relationship of servitude to his Lord.">العَبدُ</button>
    ۖ
    <button class="word-link" type="button" data-word="إِنَّهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّهُ</button>
    <button class="word-link" type="button" data-word="أَوّابٌ" data-root="A W B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-w-b/" data-root-meaning="Returning or coming back; awwāb: one who repeatedly returns or turns back." data-context="One who repeatedly turns back; describing Job’s repeated turning to his Lord.">أَوّابٌ</button>
  </p>
  <p class="english-verse">And take a bundle of stalks in your hand, strike with it, and do not break your oath. We found him patient. What an excellent servant! He was ever returning.</p>
</section>
