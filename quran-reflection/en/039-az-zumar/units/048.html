<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَبَدا" data-root="B D W" data-learn-more="/quran-terminology/en/roots/b-d-w/" data-root-meaning="Appearing, becoming visible after concealment, and entering the field of sight or awareness" data-context="And became apparent; concerning the evils of what they had acquired.">وَبَدا</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="سَيِّـٔاتُ" data-root="S W A" data-learn-more="/quran-terminology/en/roots/s-w-a/" data-root-meaning="From badness and unpleasantness to sayyiʾah, harm, and sawʾah" data-context="Evils; connected with what they had acquired.">سَيِّـٔاتُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كَسَبوا" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="They acquired; what they had gained, whose evils now become apparent.">كَسَبوا</button>
    <button class="word-link" type="button" data-word="وَحاقَ" data-root="H Y Q" data-root-meaning="Something befalling and encompassing someone, especially an adverse consequence in which the person becomes caught." data-context="Will encompass them; in the scene where the evils of their conduct become apparent, what they mocked besets them." data-learn-more="/quran-terminology/en/roots/h-y-q/">وَحاقَ</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِم</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="They used to; with the following verb, expressing their former mockery.">كانوا</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="يَستَهزِءونَ" data-root="H Z A" data-learn-more="/quran-terminology/en/roots/h2-z-a/" data-root-meaning="Mocking, belittling, humiliating, making something weightless, and treating seriously placed truth as a game" data-context="They mocked; concerning what encompassed them.">يَستَهزِءونَ</button>
  </p>
  <p class="english-verse">The evils of what they earned will appear to them, and what they used to ridicule will engulf them.</p>
</section>
