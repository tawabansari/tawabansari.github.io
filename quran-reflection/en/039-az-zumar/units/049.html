<section class="ayah-block" id="ayah-049" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:49</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَإِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِذا</button>
    <button class="word-link" type="button" data-word="مَسَّ" data-root="M S S" data-learn-more="/quran-terminology/en/roots/m-s-s/" data-root-meaning="From direct contact to the experience of good, harm, and human intimacy" data-context="Touches; harm reaching and affecting a person.">مَسَّ</button>
    <button class="word-link" type="button" data-word="الإِنسٰنَ" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="The human being who prays in hardship and makes a claim after receiving a blessing.">الإِنسٰنَ</button>
    <button class="word-link" type="button" data-word="ضُرٌّ" data-root="Ḍ R R" data-learn-more="/quran-terminology/en/roots/dad-r-r/" data-root-meaning="Ḍarra: harm, hardship, and compulsion" data-context="Harm or hardship; the distress prompting the person to pray.">ضُرٌّ</button>
    <button class="word-link" type="button" data-word="دَعانا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="Calls upon Us; seeking God’s help in hardship.">دَعانا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="إِذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذا</button>
    <button class="word-link" type="button" data-word="خَوَّلنٰهُ" data-root="KH W L" data-root-meaning="Care and maintenance; granting and placing at someone’s disposal; in the kinship branch, maternal uncle and maternal aunt." data-context="We granted him a blessing; placing a benefit from Us at his disposal." data-learn-more="/quran-terminology/en/roots/kh-w-l/">خَوَّلنٰهُ</button>
    <button class="word-link" type="button" data-word="نِعمَةً" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing" data-context="A blessing; a benefit granted to him by God.">نِعمَةً</button>
    <button class="word-link" type="button" data-word="مِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنّا</button>
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Says; introducing the person’s claim after receiving the blessing.">قالَ</button>
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="أوتيتُهُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="I was given it; a passive verb within the recipient’s claim.">أوتيتُهُ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="عِلمٍ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Knowledge; in the claim “on the basis of knowledge,” whose possessor is an exegetical question.">عِلمٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="بَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَل</button>
    <button class="word-link" type="button" data-word="هِىَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هِىَ</button>
    <button class="word-link" type="button" data-word="فِتنَةٌ" data-root="F T N" data-learn-more="/quran-terminology/en/roots/f-t-n/" data-root-meaning="Fatana: trial, pressure, and exposure to a change of direction" data-context="A trial; the blessing is identified here as a test.">فِتنَةٌ</button>
    <button class="word-link" type="button" data-word="وَلٰكِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلٰكِنَّ</button>
    <button class="word-link" type="button" data-word="أَكثَرَهُم" data-root="K TH R" data-learn-more="/quran-terminology/en/roots/k-th-r/" data-root-meaning="Abundance, increase, multitude, great quantity, abundant good, and deceptive rivalry in having more" data-context="Most of them; the majority described as lacking knowledge.">أَكثَرَهُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Know; negated here to express ignorance of the reality of the trial.">يَعلَمونَ</button>
  </p>
  <p class="english-verse">When harm touches the human being, he calls upon Us. Then, when We grant him a favor from Us, he says, “I was given it only on account of knowledge.” Rather, it is a trial, but most of them do not know.</p>
</section>
