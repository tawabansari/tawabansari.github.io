<section class="ayah-block" id="ayah-055" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:55</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاتَّبِعوا" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="And follow, a command concerning what has been sent down.">وَاتَّبِعوا</button>
    <button class="word-link" type="button" data-word="أَحسَنَ" data-root="Ḥ S N" data-learn-more="/quran-terminology/en/roots/h-s-n/" data-root-meaning="Being good, beautiful, fitting, and worthy; or making something good and conveying goodness to another." data-context="The best of what has been sent down, to be followed.">أَحسَنَ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أُنزِلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Has been sent down from the Lord.">أُنزِلَ</button>
    <button class="word-link" type="button" data-word="إِلَيكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="رَبِّكُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, the source of what has been sent down.">رَبِّكُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before, the opportunity to act prior to punishment’s arrival.">قَبلِ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَأتِيَكُمُ" data-root="A T Y" data-learn-more="/quran-terminology/en/roots/a-t-y/" data-root-meaning="Coming, arriving, bringing, giving, delivering, and the certainty of arrival" data-context="Reaches you, concerning punishment.">يَأتِيَكُمُ</button>
    <button class="word-link" type="button" data-word="العَذابُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption" data-context="Punishment, before whose arrival action is urged.">العَذابُ</button>

    <button class="word-link" type="button" data-word="وَأَنتُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَأَنتُم</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="تَشعُرونَ" data-root="SH AYN R" data-learn-more="/quran-terminology/en/roots/sh-ayn-r/" data-root-meaning="Perception, subtle awareness, situational sensitivity, sign-recognition, and unawareness of a near reality" data-context="Perceive; negated to express unawareness of punishment’s approach.">تَشعُرونَ</button>
  </p>
  <p class="english-verse">And follow the best of what has been sent down to you from your Lord, before the punishment comes upon you suddenly while you are unaware,</p>
