<section class="ayah-block" id="ayah-042" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:42</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="يَتَوَفَّى" data-root="W F Y" data-learn-more="/quran-terminology/en/roots/w-f-y/" data-root-meaning="Completing, bringing to full completion, fully rendering what is due, and not falling short in covenant, measure, accounting, promise, or recompense">يَتَوَفَّى</button>
    <button class="word-link" type="button" data-word="الأَنفُسَ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself">الأَنفُسَ</button>
    <button class="word-link" type="button" data-word="حينَ" data-root="H Y N" data-learn-more="/quran-terminology/en/roots/h-y-n/" data-root-meaning="A time, moment, interval, period, deadline, or bounded segment within the flow of time.">حينَ</button>
    <button class="word-link" type="button" data-word="مَوتِها" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">مَوتِها</button>
    <button class="word-link" type="button" data-word="وَالَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّتى</button>
    <button class="word-link" type="button" data-word="لَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَم</button>
    <button class="word-link" type="button" data-word="تَمُت" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">تَمُت</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="مَنامِها" data-root="N W M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-w-m/" data-root-meaning="Sleep or sleeping.">مَنامِها</button>
    ۖ
    <button class="word-link" type="button" data-word="فَيُمسِكُ" data-root="M S K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-s-k/" data-root-meaning="Grasping, retaining, or holding firmly.">فَيُمسِكُ</button>
    <button class="word-link" type="button" data-word="الَّتى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّتى</button>
    <button class="word-link" type="button" data-word="قَضىٰ" data-root="Q Ḍ Y" data-learn-more="/quran-terminology/en/roots/q-dad-y/" data-root-meaning="From completion to settlement, command, and determination">قَضىٰ</button>
    <button class="word-link" type="button" data-word="عَلَيهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهَا</button>
    <button class="word-link" type="button" data-word="المَوتَ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions">المَوتَ</button>
    <button class="word-link" type="button" data-word="وَيُرسِلُ" data-root="R S L" data-learn-more="/quran-terminology/en/roots/r-s-l/" data-root-meaning="Sending, a message-bearing mission, and the messenger who carries it to its destination">وَيُرسِلُ</button>
    <button class="word-link" type="button" data-word="الأُخرىٰ" data-root="A KH R" data-root-meaning="After-ness, delay, otherness, and finality" data-learn-more="/quran-terminology/en/roots/a-kh-r/">الأُخرىٰ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="أَجَلٍ" data-root="A J L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/a-j-l/" data-root-meaning="An appointed period and its endpoint, including a deadline or the end of life.">أَجَلٍ</button>
    <button class="word-link" type="button" data-word="مُسَمًّى" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">مُسَمًّى</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَـٔايٰتٍ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">لَـٔايٰتٍ</button>
    <button class="word-link" type="button" data-word="لِقَومٍ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">لِقَومٍ</button>
    <button class="word-link" type="button" data-word="يَتَفَكَّرونَ" data-root="F K R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-k-r/" data-root-meaning="Thinking or reflection in pursuit of understanding.">يَتَفَكَّرونَ</button>
  </p>
  <p class="english-verse">The God takes the souls at their death, and those that have not died during their sleep. He holds those for which He has decreed death and releases the others until a specified term. In this are signs for people who reflect.</p>
</section>
