<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَذاقَهُمُ" data-root="DH W Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/dh-w-q/" data-root-meaning="Tasting or experiencing, whether pleasure or suffering.">فَأَذاقَهُمُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الخِزىَ" data-root="KH Z Y" data-learn-more="/quran-terminology/en/roots/kh-z-y/" data-root-meaning="Humiliation, disgrace, and a fall in standing before others">الخِزىَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الحَيوٰةِ" data-root="Ḥ Y Y" data-learn-more="/quran-terminology/en/roots/h-y-y/" data-root-meaning="Life, being alive, freshness, responsiveness, wakefulness, haya, and greeting">الحَيوٰةِ</button>
    <button class="word-link" type="button" data-word="الدُّنيا" data-root="D N W" data-learn-more="/quran-terminology/en/roots/d-n-w/" data-root-meaning="Being near, drawing near, being lower, and being more present.">الدُّنيا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَلَعَذابُ" data-root="ʿ DH B" data-learn-more="/quran-terminology/en/roots/ayn-dh-b/" data-root-meaning="Sweetness, tasting the quality of a state, and the bitter consequence of denial and corruption">وَلَعَذابُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةِ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality">الـٔاخِرَةِ</button>
    <button class="word-link" type="button" data-word="أَكبَرُ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">أَكبَرُ</button>
    ۚ
    <button class="word-link" type="button" data-word="لَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَو</button>
    <button class="word-link" type="button" data-word="كانوا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">كانوا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition">يَعلَمونَ</button>
  </p>
  <p class="english-verse">So The God made them taste disgrace in worldly life. The punishment of the Hereafter is greater, if they only knew.</p>
</section>
