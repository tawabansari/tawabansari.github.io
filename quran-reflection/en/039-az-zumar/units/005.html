    <button class="word-link" type="button" data-word="وَيُكَوِّرُ" data-root="K W R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/k-w-r/" data-root-meaning="Wrapping or rolling together, as with a turban.">وَيُكَوِّرُ</button>

  <p class="english-verse">He created the heavens and the earth in truth. He wraps the night over the day and wraps the day over the night, and subjected the sun and the moon, each running for a specified term. Indeed, He is the Mighty, the Ever-Forgiving.</p>
