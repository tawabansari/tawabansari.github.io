<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَمَّن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمَّن</button>
    <button class="word-link" type="button" data-word="هُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُوَ</button>
    <button class="word-link" type="button" data-word="قٰنِتٌ" data-root="Q N T" data-learn-more="/quran-terminology/en/roots/q-n-t/" data-root-meaning="From obedience and commitment to steadfastness in worship" data-context="Devout and obedient: describing the person being compared.">قٰنِتٌ</button>
    <button class="word-link" type="button" data-word="ءاناءَ" data-root="A N Y" data-learn-more="/quran-terminology/en/roots/a-n-y/" data-root-meaning="The arrival of a time, portions of time, deliberation and delay, and reaching readiness or a limit." data-context="Portions or hours of the night: the time of the person’s devotion, prostration, and standing.">ءاناءَ</button>
    <button class="word-link" type="button" data-word="الَّيلِ" data-root="L Y L" data-learn-more="/quran-terminology/en/roots/l-y-l/" data-root-meaning="Night, the covering of day, reduction of light, relative stillness, and nightly units of time" data-context="The night: the time of the devotional conduct described.">الَّيلِ</button>
    <button class="word-link" type="button" data-word="ساجِدًا" data-root="S J D" data-learn-more="/quran-terminology/en/roots/s-j-d/" data-root-meaning="Lowering oneself, submitting, bowing down, and entering a state of humility before a higher rank" data-context="Prostrating: describing the person’s posture during nighttime devotion.">ساجِدًا</button>
    <button class="word-link" type="button" data-word="وَقائِمًا" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="And standing: the person’s other posture alongside prostration.">وَقائِمًا</button>
    <button class="word-link" type="button" data-word="يَحذَرُ" data-root="Ḥ DH R" data-learn-more="/quran-terminology/en/roots/h-dh-r/" data-root-meaning="Caution, alertness before danger, conscious fear of harm, practical readiness, and protective vigilance before damage occurs" data-context="Fears: is wary of the outcome in the Hereafter.">يَحذَرُ</button>
    <button class="word-link" type="button" data-word="الـٔاخِرَةَ" data-root="A KH R" data-learn-more="/quran-terminology/en/roots/a-kh-r/" data-root-meaning="After-ness, delay, otherness, and finality" data-context="The Hereafter: the coming life and outcome of which the person is wary.">الـٔاخِرَةَ</button>
    <button class="word-link" type="button" data-word="وَيَرجوا" data-root="R J W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-j-w/" data-root-meaning="Hope or expectation; also an edge or side; postponement in some forms is also analyzed under r-j-ʾ." data-context="And hopes: looking to the Lord’s mercy.">وَيَرجوا</button>
    <button class="word-link" type="button" data-word="رَحمَةَ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Mercy: the Lord’s care and forgiveness for which the person hopes.">رَحمَةَ</button>
    <button class="word-link" type="button" data-word="رَبِّهِ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord: the source of the mercy for which he hopes.">رَبِّهِ</button>
    ۗ
    <button class="word-link" type="button" data-word="قُل" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say: the command to put the following question.">قُل</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="يَستَوِى" data-root="S W Y" data-learn-more="/quran-terminology/en/roots/s-w-y/" data-root-meaning="Straightness, balance, proportioning, and uprightness without crookedness" data-context="Are equal: asking whether those who know and those who do not are alike.">يَستَوِى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Know: describing the first group in the comparison.">يَعلَمونَ</button>
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="لا" data-root-note="Grammatical word; no derivational root is assigned for this use.">لا</button>
    <button class="word-link" type="button" data-word="يَعلَمونَ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="Do not know: the verb with lā describing the second group.">يَعلَمونَ</button>
    ۗ
    <button class="word-link" type="button" data-word="إِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّما</button>
    <button class="word-link" type="button" data-word="يَتَذَكَّرُ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Takes heed: receiving the reminder and emerging from heedlessness.">يَتَذَكَّرُ</button>
    <button class="word-link" type="button" data-word="أُولُوا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولُوا</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="L B B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-b-b/" data-root-meaning="The core or pure part; lubb denotes understanding or sound reason." data-context="Understanding: in ulū al-albāb, people possessing sound discernment.">الأَلبٰبِ</button>
  </p>
  <p class="english-verse">Or one who is devout during the hours of the night, prostrating and standing, fearing the Hereafter and hoping for his Lord’s mercy? Say, “Are those who know equal to those who do not know?” Only those of understanding take heed.</p>
</section>
