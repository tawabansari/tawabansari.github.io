<section class="ayah-block" id="ayah-059" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:59</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="بَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بَلىٰ</button>
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="جاءَتكَ" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter">جاءَتكَ</button>
    <button class="word-link" type="button" data-word="ءايٰتى" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">ءايٰتى</button>
    <button class="word-link" type="button" data-word="فَكَذَّبتَ" data-root="K DH B" data-learn-more="/quran-terminology/en/roots/k-dh-b/" data-root-meaning="Speaking against reality, declaring untrue, counting as false, attributing falsity, and breaking the credibility of a report, sign, promise, or message">فَكَذَّبتَ</button>
    <button class="word-link" type="button" data-word="بِها" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِها</button>
    <button class="word-link" type="button" data-word="وَاستَكبَرتَ" data-root="K B R" data-learn-more="/quran-terminology/en/roots/k-b-r/" data-root-meaning="Greatness, magnifying, true majesty, and in its negative branch arrogance and istikbar">وَاستَكبَرتَ</button>
    <button class="word-link" type="button" data-word="وَكُنتَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization">وَكُنتَ</button>

    <button class="word-link" type="button" data-word="الكٰفِرينَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">الكٰفِرينَ</button>

  <p class="english-verse">Yes, My signs came to you, but you denied them, acted arrogantly, and were among the disbelievers.</p>
