<section class="ayah-block" id="ayah-056" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:56</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="تَقولَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Say; the words of a person lamenting earlier neglect.">تَقولَ</button>
    <button class="word-link" type="button" data-word="نَفسٌ" data-root="N F S" data-learn-more="/quran-terminology/en/roots/n-f-s/" data-root-meaning="The self, the living bearer of relation, responsibility, inner reality, and the return of action to oneself" data-context="A person or soul; the one voicing regret.">نَفسٌ</button>
    <button class="word-link" type="button" data-word="يٰحَسرَتىٰ" data-root="H S R" data-root-meaning="Uncovering and exposure; depleted strength and exhaustion; also intense regret or grief over loss or an unwelcome outcome." data-learn-more="/quran-terminology/en/roots/h-s-r/" data-context="Alas for me; a personal cry of regret over earlier neglect.">يٰحَسرَتىٰ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="فَرَّطتُ" data-root="F R TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-r-tt/" data-root-meaning="Going ahead or exceeding bounds; tafrīṭ is neglect, while ifrāṭ is excess." data-context="I neglected; the speaker&#x27;s admission of failing their responsibility.">فَرَّطتُ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="جَنبِ" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="Regarding duty toward The God; the contextual use of janb, without attributing a bodily side to Him." data-learn-more="/quran-terminology/en/roots/j-n-b/">جَنبِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَإِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِن</button>
    <button class="word-link" type="button" data-word="كُنتُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="I was; admitting one&#x27;s earlier conduct and condition.">كُنتُ</button>
    <button class="word-link" type="button" data-word="لَمِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَمِنَ</button>
    <button class="word-link" type="button" data-word="السّٰخِرينَ" data-root="S KH R" data-root-meaning="Ridiculing, belittling and bringing into service: from human humiliation to natural forces, social relationships and the distinction between sikhriyy and sukhriyy" data-learn-more="/quran-terminology/en/roots/s-kh-r/" data-context="Those who mocked; the group the speaker admits having belonged to.">السّٰخِرينَ</button>
  </p>
  <p class="english-verse">lest a soul say, “Alas for my neglect concerning The God! I was among those who mocked.”</p>
</section>
