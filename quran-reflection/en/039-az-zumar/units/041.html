  <h2 class="ayah-title">Az-Zumar 39:41</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="إِنّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّا</button>
    <button class="word-link" type="button" data-word="أَنزَلنا" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility">أَنزَلنا</button>
    <button class="word-link" type="button" data-word="عَلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكَ</button>
    <button class="word-link" type="button" data-word="الكِتٰبَ" data-root="K T B" data-learn-more="/quran-terminology/en/roots/k-t-b/" data-root-meaning="Writing, binding meaning together, recording, decreeing, obligation, documentation, book, scripture, and entry into a system of record, judgment, or revelation">الكِتٰبَ</button>
    <button class="word-link" type="button" data-word="لِلنّاسِ" data-root="N W S" data-learn-more="/quran-terminology/en/roots/n-w-s/" data-root-meaning="Al-nās, people, collective human movement, and the public field of guidance and whispering">لِلنّاسِ</button>

    <button class="word-link" type="button" data-word="فَمَنِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَمَنِ</button>
    <button class="word-link" type="button" data-word="اهتَدىٰ" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided">اهتَدىٰ</button>

    <button class="word-link" type="button" data-word="وَمَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَمَن</button>
    <button class="word-link" type="button" data-word="ضَلَّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">ضَلَّ</button>
    <button class="word-link" type="button" data-word="فَإِنَّما" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّما</button>
    <button class="word-link" type="button" data-word="يَضِلُّ" data-root="Ḍ L L" data-learn-more="/quran-terminology/en/roots/dad-l-l/" data-root-meaning="Ḍalla: losing the way, a place, access, or an outcome">يَضِلُّ</button>

    <button class="word-link" type="button" data-word="أَنتَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنتَ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    <button class="word-link" type="button" data-word="بِوَكيلٍ" data-root="W K L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-k-l/" data-root-meaning="Entrusting or relying; wakīl is an agent or responsible guardian.">بِوَكيلٍ</button>
  </p>
  <p class="english-verse">We sent down the Book upon you for people in truth. Whoever is guided, it is for his own good; and whoever strays, he strays only to his own detriment. You are not a guardian over them.</p>
