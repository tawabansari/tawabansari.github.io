<section class="ayah-block" id="ayah-069" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:69</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَشرَقَتِ" data-root="SH R Q" data-learn-more="/quran-terminology/en/roots/sh-r-q/" data-root-meaning="From sunrise and illumination to mashriq and mashāriq">وَأَشرَقَتِ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضُ</button>
    <button class="word-link" type="button" data-word="بِنورِ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals">بِنورِ</button>

    <button class="word-link" type="button" data-word="وَالشُّهَداءِ" data-root="SH H D" data-learn-more="/quran-terminology/en/roots/sh-h2-d/" data-root-meaning="Conscious presence, responsible observation, testimony, and standing in relation to truth">وَالشُّهَداءِ</button>

    <button class="word-link" type="button" data-word="بَينَهُم" data-root="B Y N" data-learn-more="/quran-terminology/en/roots/b-y-n/" data-root-meaning="Separation, the space between things, clarification of boundaries, and making meaning clear through distinction">بَينَهُم</button>

    <button class="word-link" type="button" data-word="يُظلَمونَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">يُظلَمونَ</button>
  </p>
  <p class="english-verse">The earth will shine with its Lord’s light, the record will be set down, the prophets and witnesses will be brought, and judgment will be made between them in truth. They will not be wronged.</p>
