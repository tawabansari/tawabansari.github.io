<section class="ayah-block" id="ayah-065" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:65</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَلَقَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَلَقَد</button>
    <button class="word-link" type="button" data-word="أوحِىَ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="Was revealed; the warning to the addressee and earlier prophets.">أوحِىَ</button>
    <button class="word-link" type="button" data-word="إِلَيكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكَ</button>
    <button class="word-link" type="button" data-word="وَإِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَإِلَى</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَبلِكَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before you; the earlier prophets.">قَبلِكَ</button>
    <button class="word-link" type="button" data-word="لَئِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَئِن</button>
    <button class="word-link" type="button" data-word="أَشرَكتَ" data-root="SH R K" data-learn-more="/quran-terminology/en/roots/sh-r-k/" data-root-meaning="Sharing, assigning a share, and bringing other than The God into a domain that belongs purely to The God" data-context="You associate partners; the condition in the warning.">أَشرَكتَ</button>
    <button class="word-link" type="button" data-word="لَيَحبَطَنَّ" data-root="H B TT" data-root-meaning="A deed losing its fruit and value; in Form IV, rendering it fruitless and ineffective." data-context="Will surely come to nothing; the emphatic warning conditional on association." data-learn-more="/quran-terminology/en/roots/h-b-tt/">لَيَحبَطَنَّ</button>
    <button class="word-link" type="button" data-word="عَمَلُكَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Your work; the addressee’s conduct under that condition.">عَمَلُكَ</button>
    <button class="word-link" type="button" data-word="وَلَتَكونَنَّ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And you will certainly be; the emphatic consequence of the condition.">وَلَتَكونَنَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الخٰسِرينَ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure" data-context="The losers; those the addressee would join under that condition.">الخٰسِرينَ</button>
  </p>
  <p class="english-verse">It has been revealed to you and to those before you: “If you associate partners, your work will surely come to nothing, and you will be among the losers.”</p>
