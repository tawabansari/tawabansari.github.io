    <button class="word-link" type="button" data-word="رَبَّهُم" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبَّهُم</button>

    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">الجَنَّةِ</button>

  <p class="english-verse">Those who were mindful of their Lord will be led to the Garden in groups, until, when they reach it and its gates are opened, its keepers say to them, “Peace upon you. You have become good and pure, so enter it, remaining there.”</p>
