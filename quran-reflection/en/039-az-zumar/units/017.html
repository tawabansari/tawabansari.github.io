<section class="ayah-block" id="ayah-017" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:17</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="اجتَنَبُوا" data-root="J N B" data-root-meaning="Flank, side, and lateral position; distancing, keeping away, and avoidance. In purification contexts, junub names a state requiring purification." data-context="They avoided; refraining from worshiping ṭāghūt." data-learn-more="/quran-terminology/en/roots/j-n-b/">اجتَنَبُوا</button>
    <button class="word-link" type="button" data-word="الطّٰغوتَ" data-root="Ṭ GH Y" data-learn-more="/quran-terminology/en/roots/tt-gh-y/" data-root-meaning="From transgression to Taghut: passing beyond the limit, breaking the boundary, and a false reference sitting in the place of truth" data-context="Ṭāghūt; the object whose worship is avoided.">الطّٰغوتَ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يَعبُدوها" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="They worship it; the worship from which they have refrained.">يَعبُدوها</button>
    <button class="word-link" type="button" data-word="وَأَنابوا" data-root="N W B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-w-b/" data-root-meaning="Repeated return; inābah is returning or turning toward." data-context="And they returned; turning back to The God.">وَأَنابوا</button>
    <button class="word-link" type="button" data-word="إِلَى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَى</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="لَهُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُمُ</button>
    <button class="word-link" type="button" data-word="البُشرىٰ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="Good news; the glad tidings promised to them.">البُشرىٰ</button>
    ۚ
    <button class="word-link" type="button" data-word="فَبَشِّر" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="So give glad tidings; the command to convey good news to the servants.">فَبَشِّر</button>
    <button class="word-link" type="button" data-word="عِبادِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="My servants; those addressed by the glad tidings.">عِبادِ</button>
  </p>
  <p class="english-verse">Those who avoid worshipping the taghut and turn back to The God have good news. So give good news to My servants</p>
</section>
