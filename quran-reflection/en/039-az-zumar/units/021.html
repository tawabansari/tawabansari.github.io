<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلَم</button>
    <button class="word-link" type="button" data-word="تَرَ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="Have you not seen; a question directing attention to a natural process.">تَرَ</button>
    <button class="word-link" type="button" data-word="أَنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَنَّ</button>
    <button class="word-link" type="button" data-word="اللَّهَ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهَ</button>
    <button class="word-link" type="button" data-word="أَنزَلَ" data-root="N Z L" data-learn-more="/quran-terminology/en/roots/n-z-l/" data-root-meaning="Descent, settling, and the making of truth accessible within human reception and responsibility" data-context="Sent down; bringing water down from the sky.">أَنزَلَ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="السَّماءِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The sky; the source of descending water in the verse’s description.">السَّماءِ</button>
    <button class="word-link" type="button" data-word="ماءً" data-root="M W H" data-learn-more="/quran-terminology/en/roots/m-w-h2/" data-root-meaning="Water: the carrier of life, cleansing, growth, flow, and the continuation of living existence" data-context="Water; what is sent down from the sky.">ماءً</button>
    <button class="word-link" type="button" data-word="فَسَلَكَهُ" data-root="S L K" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-l-k/" data-root-meaning="Following a path or inserting something into a course or place." data-context="He conducted it; directing the water into springs.">فَسَلَكَهُ</button>
    <button class="word-link" type="button" data-word="يَنٰبيعَ" data-root="N B AYN" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-b-ayn/" data-root-meaning="Water springing forth; yanbūʿ is a spring." data-context="Springs; outlets of water in the earth.">يَنٰبيعَ</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; the setting for water’s passage and vegetation’s growth.">الأَرضِ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يُخرِجُ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="He brings forth; producing crops through water.">يُخرِجُ</button>
    <button class="word-link" type="button" data-word="بِهِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِ</button>
    <button class="word-link" type="button" data-word="زَرعًا" data-root="Z R AYN" data-learn-more="/quran-terminology/en/roots/z-r-ayn/" data-root-meaning="Placing seed, sprouting, plant growth, and the appearance of produce" data-context="Crops; vegetation produced through water.">زَرعًا</button>
    <button class="word-link" type="button" data-word="مُختَلِفًا" data-root="KH L F" data-learn-more="/quran-terminology/en/roots/kh-l-f/" data-root-meaning="Coming behind, succeeding, following after something, and standing in continuation after it" data-context="Varying; the diversity of the crops’ colors.">مُختَلِفًا</button>
    <button class="word-link" type="button" data-word="أَلوٰنُهُ" data-root="L W N" data-learn-more="/quran-terminology/en/roots/l-w-n/" data-root-meaning="Color, visible appearance, and distinction among kinds" data-context="Its colors; the vegetation’s different visible colors.">أَلوٰنُهُ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَهيجُ" data-root="H2 Y J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-y-j/" data-root-meaning="Becoming stirred up; also a plant&#x27;s drying and yellowing." data-context="It withers; moving toward dryness after growth.">يَهيجُ</button>
    <button class="word-link" type="button" data-word="فَتَرىٰهُ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="You see it; observing the vegetation turn yellow.">فَتَرىٰهُ</button>
    <button class="word-link" type="button" data-word="مُصفَرًّا" data-root="Ṣ F R (Sad F R)" data-learn-more="/quran-terminology/en/roots/sad-f-r/" data-root-meaning="Yellowness, yellowishness, and entering the state of yellow" data-context="Yellowed; describing the crop as it dries.">مُصفَرًّا</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="يَجعَلُهُ" data-root="J AYN L (J ʿ L)" data-learn-more="/quran-terminology/en/roots/j-ayn-l/" data-root-meaning="Placing, appointing, making into a role, establishing within an order, and assigning a thing to a state or function" data-context="He makes it; bringing the vegetation into a crumbled state.">يَجعَلُهُ</button>
    <button class="word-link" type="button" data-word="حُطٰمًا" data-root="H TT M" data-root-meaning="Ḥaṭm is the action of breaking and crushing; ḥuṭām is its result and fragmented remains, especially of dry vegetation; and ḥuṭamah names or describes something characterized by intense crushing." data-learn-more="/quran-terminology/en/roots/h-tt-m/" data-context="Crumbled debris; the brittle remnants of vegetation.">حُطٰمًا</button>
    ۚ
    <button class="word-link" type="button" data-word="إِنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنَّ</button>
    <button class="word-link" type="button" data-word="فى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فى</button>
    <button class="word-link" type="button" data-word="ذٰلِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذٰلِكَ</button>
    <button class="word-link" type="button" data-word="لَذِكرىٰ" data-root="DH K R" data-learn-more="/quran-terminology/en/roots/dh-k-r/" data-root-meaning="Remembering, mentioning, bringing truth into awareness, preserving a sign in mind, speech, and action, and bringing the human being out of heedlessness" data-context="Indeed a reminder; what this process offers people of understanding.">لَذِكرىٰ</button>
    <button class="word-link" type="button" data-word="لِأُولِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِأُولِى</button>
    <button class="word-link" type="button" data-word="الأَلبٰبِ" data-root="L B B" data-root-meaning="The core or pure, choice part of something; in human use, reason and the faculty of understanding." data-context="Understanding; possessed by those who take heed from water, growth, and the vegetation’s crumbling." data-learn-more="/quran-terminology/en/roots/l-b-b/">الأَلبٰبِ</button>
  </p>
  <p class="english-verse">Have you not seen that The God sends down water from the sky and channels it as springs in the earth, then brings forth with it crops of varied colors? Then they wither and you see them yellow; then He makes them fragments. In this is a reminder for those of understanding.</p>
</section>
