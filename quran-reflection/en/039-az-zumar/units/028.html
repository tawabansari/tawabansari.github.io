<section class="ayah-block" id="ayah-028" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:28</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قُرءانًا" data-root="Q R A" data-root-meaning="Reading and voicing ordered speech; in the qarʾ branch, periods within women’s cycle of menstruation and purity." data-context="An Arabic Qur’an: the text without crookedness." data-learn-more="/quran-terminology/en/roots/q-r-a/">قُرءانًا</button>
    <button class="word-link" type="button" data-word="عَرَبِيًّا" data-root="AYN R B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-r-b/" data-root-meaning="ʿArabī relates to Arabic or Arabs; aʿrāb are desert dwellers; ʿurub means affectionate or devoted." data-context="Arabic: the Qur’an’s language.">عَرَبِيًّا</button>
    <button class="word-link" type="button" data-word="غَيرَ" data-root="GH Y R" data-learn-more="/quran-terminology/en/roots/gh-y-r/" data-root-meaning="Otherness, excepting, distinction, separation, boundary-making, changing, becoming different, and leaving a previous state" data-context="Without: denying crookedness.">غَيرَ</button>
    <button class="word-link" type="button" data-word="ذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">ذى</button>
    <button class="word-link" type="button" data-word="عِوَجٍ" data-root="AYN W J" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-w-j/" data-root-meaning="Crookedness or deviation from straightness." data-context="Crookedness: what is denied of the Qur’an.">عِوَجٍ</button>
    <button class="word-link" type="button" data-word="لَعَلَّهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَعَلَّهُم</button>
    <button class="word-link" type="button" data-word="يَتَّقونَ" data-root="W Q Y" data-learn-more="/quran-terminology/en/roots/w-q-y/" data-root-meaning="To guard, protect, place a shield, keep oneself away from harm, practice conscious restraint, act with responsible vigilance, and place a barrier between oneself and danger." data-context="Become mindful: the aim of conscious restraint.">يَتَّقونَ</button>
  </p>
  <p class="english-verse">an Arabic Quran without any crookedness, so that they may be mindful.</p>
