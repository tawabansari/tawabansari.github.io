<section class="ayah-block" id="ayah-074" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:74</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَقالُوا" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">وَقالُوا</button>
    <button class="word-link" type="button" data-word="الحَمدُ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd">الحَمدُ</button>
    <button class="word-link" type="button" data-word="لِلَّهِ" data-root="A L H" data-learn-more="/quran-terminology/en/roots/a-l-h/" data-root-meaning="Worship, turning toward, placing something in the station of a god, and recognizing The God">لِلَّهِ</button>
    <button class="word-link" type="button" data-word="الَّذى" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذى</button>
    <button class="word-link" type="button" data-word="صَدَقَنا" data-root="Ṣ D Q" data-learn-more="/quran-terminology/en/roots/sad-d-q/" data-root-meaning="Truthfulness, correspondence with reality, and firmness in speech, faith, covenant, and action">صَدَقَنا</button>
    <button class="word-link" type="button" data-word="وَعدَهُ" data-root="W AYN D (W ʿ D)" data-learn-more="/quran-terminology/en/roots/w-ayn-d/" data-root-meaning="Promising, announcing a future matter, appointing a time or place of meeting, and warning of a consequence that will arrive">وَعدَهُ</button>
    <button class="word-link" type="button" data-word="وَأَورَثَنَا" data-root="W R TH" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-r-th/" data-root-meaning="Inheriting or receiving property or position from a predecessor.">وَأَورَثَنَا</button>
    <button class="word-link" type="button" data-word="الأَرضَ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">الأَرضَ</button>
    <button class="word-link" type="button" data-word="نَتَبَوَّأُ" data-root="B W ʾ" data-learn-more="/quran-terminology/en/roots/b-w-a/" data-root-meaning="From returning and settling to providing a place and incurring consequences">نَتَبَوَّأُ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="حَيثُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">حَيثُ</button>
    <button class="word-link" type="button" data-word="نَشاءُ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God">نَشاءُ</button>
    ۖ
    <button class="word-link" type="button" data-word="فَنِعمَ" data-root="N ʿ M (N Ayn M)" data-learn-more="/quran-terminology/en/roots/n-ayn-m/" data-root-meaning="Blessing, favor, ease, expansion, grace, provision, enjoyment, and the responsibility that arises from receiving blessing">فَنِعمَ</button>
    <button class="word-link" type="button" data-word="أَجرُ" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action">أَجرُ</button>
    <button class="word-link" type="button" data-word="العٰمِلينَ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">العٰمِلينَ</button>
  </p>
  <p class="english-verse">And they will say, “Praise belongs to The God, who fulfilled His promise to us and made us inherit the land. We settle wherever we wish in the Garden.” How excellent is the reward of those who work!</p>
</section>
