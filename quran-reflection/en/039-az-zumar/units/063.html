<section class="ayah-block" id="ayah-063" data-translation-status="provisional">
  <h2 class="ayah-title">Az-Zumar 39:63</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="لَهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُ</button>
    <button class="word-link" type="button" data-word="مَقاليدُ" data-root="Q L D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-l-d/" data-root-meaning="A necklace and hanging around the neck; maqālīd denotes keys or control of stores.">مَقاليدُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتِ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction">السَّمٰوٰتِ</button>
    <button class="word-link" type="button" data-word="وَالأَرضِ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet">وَالأَرضِ</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَروا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair">كَفَروا</button>
    <button class="word-link" type="button" data-word="بِـٔايٰتِ" data-root="A Y Y" data-learn-more="/quran-terminology/en/roots/a-y-y/" data-root-meaning="Sign, clear marker, remarkable indication, and something that guides the human being beyond itself toward a greater truth">بِـٔايٰتِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="أُولٰئِكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أُولٰئِكَ</button>
    <button class="word-link" type="button" data-word="هُمُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُمُ</button>
    <button class="word-link" type="button" data-word="الخٰسِرونَ" data-root="KH S R" data-learn-more="/quran-terminology/en/roots/kh-s-r/" data-root-meaning="Losing, decreasing, suffering loss, losing capital, and ending with a result below the original investment after measure">الخٰسِرونَ</button>
  </p>
  <p class="english-verse">His are the keys of the heavens and the earth. Those who disbelieve in the signs of The God are the losers.</p>
</section>
