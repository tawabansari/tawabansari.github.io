<section class="ayah-block" id="ayah-009" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tahrim 66:9</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The Prophet, addressed by the command in this verse.">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="جٰهِدِ" data-root="J H2 D" data-root-meaning="Serious effort and exertion of capacity in the face of difficulty; jahd also expresses intensity and hardship, and juhd ability and capacity." data-context="Strive and exert yourself in confronting the stated groups." data-learn-more="/quran-terminology/en/roots/j-h2-d/">جٰهِدِ</button>
    <button class="word-link" type="button" data-word="الكُفّارَ" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="The disbelievers, one group concerned by the command.">الكُفّارَ</button>
    <button class="word-link" type="button" data-word="وَالمُنٰفِقينَ" data-root="N F Q" data-learn-more="/quran-terminology/en/roots/n-f-q/" data-root-meaning="Infāq as giving out from provision and setting blessing into motion, and nifāq as hidden doubleness, departure from truthfulness, and the concealed passage between outward appearance and inward reality" data-context="And the hypocrites, whose outward and inward positions differ.">وَالمُنٰفِقينَ</button>
    <button class="word-link" type="button" data-word="وَاغلُظ" data-root="GH L ZHA" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-l-zha/" data-root-meaning="Thickness, severity, or harshness, physical or behavioral according to context." data-context="And be firm and stern.">وَاغلُظ</button>
    <button class="word-link" type="button" data-word="عَلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيهِم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَمَأوىٰهُم" data-root="A W Y" data-learn-more="/quran-terminology/en/roots/a-w-y/" data-root-meaning="An abode, dwelling, or place of refuge, without necessarily implying safety or comfort." data-context="Their abode, Hell.">وَمَأوىٰهُم</button>
    <button class="word-link" type="button" data-word="جَهَنَّمُ" data-root-note="Proper name; no root has been assigned.">جَهَنَّمُ</button>
    ۖ
    <button class="word-link" type="button" data-word="وَبِئسَ" data-root="B ʾ S" data-learn-more="/quran-terminology/en/roots/b-a-s/" data-root-meaning="Severity, hardship, and adversity" data-context="And how evil it is, expressing condemnation of this place.">وَبِئسَ</button>
    <button class="word-link" type="button" data-word="المَصيرُ" data-root="Ṣ Y R" data-learn-more="/quran-terminology/en/roots/sad-y-r/" data-root-meaning="Reaching an end: maṣīr as the outcome to which affairs lead" data-context="The final outcome or destination reached.">المَصيرُ</button>
  </p>
  <p class="english-verse">O Prophet, strive against the disbelievers and the hypocrites, and be firm with them. Their refuge is Hell. What an evil destination!</p>
</section>
