  <h2 class="ayah-title">At-Tahrim 66:3</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>

    <button class="word-link" type="button" data-word="وَأَعرَضَ" data-root="ʿ R Ḍ (Ayn R Dad)" data-learn-more="/quran-terminology/en/roots/ayn-r-dad/" data-root-meaning="Presenting, setting before, exposing to view, and placing before assessment" data-context="And passed over; refraining from mentioning another part.">وَأَعرَضَ</button>

    <button class="word-link" type="button" data-word="فَلَمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَمّا</button>
    <button class="word-link" type="button" data-word="نَبَّأَها" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="He informed her; the prophet told his wife.">نَبَّأَها</button>

    <button class="word-link" type="button" data-word="مَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَن</button>
    <button class="word-link" type="button" data-word="أَنبَأَكَ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="He informed you; asking about the information’s source.">أَنبَأَكَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    ۖ
    <button class="word-link" type="button" data-word="قالَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="He said; introducing the speaker’s statement.">قالَ</button>
    <button class="word-link" type="button" data-word="نَبَّأَنِىَ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="He informed me; the answer identifying the source.">نَبَّأَنِىَ</button>

    <button class="word-link" type="button" data-word="الخَبيرُ" data-root="KH B R" data-root-meaning="Awareness and knowledge of a thing’s reality and condition; khabar: conveyed information; khabīr: aware." data-context="Aware; describing The God’s knowledge in the verse’s context." data-learn-more="/quran-terminology/en/roots/kh-b-r/">الخَبيرُ</button>
  </p>
  <p class="english-verse">When the Prophet confided a statement to one of his wives, and she disclosed it and The God made it known to him, he made part of it known and passed over part. When he informed her of it, she said, “Who told you this?” He said, “The Knowing, the Aware told me.”</p>
