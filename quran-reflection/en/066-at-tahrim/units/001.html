<section class="ayah-block" id="ayah-001" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tahrim 66:1</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="يٰأَيُّهَا" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰأَيُّهَا</button>
    <button class="word-link" type="button" data-word="النَّبِىُّ" data-root="N B A" data-learn-more="/quran-terminology/en/roots/n-b-a/" data-root-meaning="News, informing, and the title “Nabī”" data-context="The Prophet, the addressee">النَّبِىُّ</button>
    <button class="word-link" type="button" data-word="لِمَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِمَ</button>
    <button class="word-link" type="button" data-word="تُحَرِّمُ" data-root="Ḥ R M" data-learn-more="/quran-terminology/en/roots/h-r-m/" data-root-meaning="Prevention, inviolability, protected bounds, and deprivation" data-context="You prohibit">تُحَرِّمُ</button>
    <button class="word-link" type="button" data-word="ما" data-root-note="Grammatical word; no derivational root is assigned for this use.">ما</button>
    <button class="word-link" type="button" data-word="أَحَلَّ" data-root="H L L" data-root-meaning="Opening and undoing a binding; permissibility and removal of prohibition; alighting and settling." data-context="Has permitted: what The God made lawful for the Prophet." data-learn-more="/quran-terminology/en/roots/h-l-l/">أَحَلَّ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكَ</button>
    ۖ
    <button class="word-link" type="button" data-word="تَبتَغى" data-root="B GH Y" data-learn-more="/quran-terminology/en/roots/b-gh-y/" data-root-meaning="Seeking, pursuing, and going beyond a limit" data-context="You seek">تَبتَغى</button>
    <button class="word-link" type="button" data-word="مَرضاتَ" data-root="R Ḍ W" data-learn-more="/quran-terminology/en/roots/r-dad-w/" data-root-meaning="From pleasure and acceptance to mutual consent" data-context="The approval of the wives">مَرضاتَ</button>
    <button class="word-link" type="button" data-word="أَزوٰجِكَ" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Your wives">أَزوٰجِكَ</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="غَفورٌ" data-root="GH F R" data-learn-more="/quran-terminology/en/roots/gh-f-r/" data-root-meaning="Covering and forgiving a fault so that the human being is protected from its punishment and consequence." data-context="Forgiving, describing The God">غَفورٌ</button>
    <button class="word-link" type="button" data-word="رَحيمٌ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="Merciful, describing The God">رَحيمٌ</button>
  </p>
  <p class="english-verse">O Prophet, why do you prohibit what The God has made lawful for you, seeking your wives’ approval? The God is Forgiving and Merciful.</p>
</section>
