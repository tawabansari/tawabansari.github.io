<section class="ayah-block" id="ayah-005" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tahrim 66:5</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="عَسىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَسىٰ</button>
    <button class="word-link" type="button" data-word="رَبُّهُ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="His Lord: in the statement about replacing the Prophet’s wives.">رَبُّهُ</button>
    <button class="word-link" type="button" data-word="إِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِن</button>
    <button class="word-link" type="button" data-word="طَلَّقَكُنَّ" data-root="TT L Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/tt-l-q/" data-root-meaning="Releasing or setting out; ṭalāq is dissolution of a marriage." data-context="He divorces you: the condition attached to replacing the wives.">طَلَّقَكُنَّ</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="يُبدِلَهُ" data-root="B D L" data-learn-more="/quran-terminology/en/roots/b-d-l/" data-root-meaning="Changing, substituting one thing for another, altering position or meaning." data-context="Replaces for him: provides other wives in place of the addressees.">يُبدِلَهُ</button>
    <button class="word-link" type="button" data-word="أَزوٰجًا" data-root="Z W J" data-learn-more="/quran-terminology/en/roots/z-w-j/" data-root-meaning="Pair, counterpart, mate, complement, and linked dual relation" data-context="Wives: those described as potential replacements.">أَزوٰجًا</button>
    <button class="word-link" type="button" data-word="خَيرًا" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better: describing the replacement wives in comparison with the addressees.">خَيرًا</button>
    <button class="word-link" type="button" data-word="مِنكُنَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنكُنَّ</button>
    <button class="word-link" type="button" data-word="مُسلِمٰتٍ" data-root="S L M" data-learn-more="/quran-terminology/en/roots/s-l-m/" data-root-meaning="Soundness, safety, non-aggression, complete delivery, and surrender" data-context="Submitting: one of the descriptions of the replacement wives.">مُسلِمٰتٍ</button>
    <button class="word-link" type="button" data-word="مُؤمِنٰتٍ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="Believing women: a description of the replacement wives.">مُؤمِنٰتٍ</button>
    <button class="word-link" type="button" data-word="قٰنِتٰتٍ" data-root="Q N T" data-learn-more="/quran-terminology/en/roots/q-n-t/" data-root-meaning="From obedience and commitment to steadfastness in worship" data-context="Obedient women: committed to obedience and worship.">قٰنِتٰتٍ</button>
    <button class="word-link" type="button" data-word="تٰئِبٰتٍ" data-root="T W B" data-learn-more="/quran-terminology/en/roots/t-w-b/" data-root-meaning="Returning from a wrong path, turning again toward The God, and having the way of reform opened by divine mercy" data-context="Repentant women: those turning back toward The God.">تٰئِبٰتٍ</button>
    <button class="word-link" type="button" data-word="عٰبِدٰتٍ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Worshipping women: devoted to servanthood and worship.">عٰبِدٰتٍ</button>
    <button class="word-link" type="button" data-word="سٰئِحٰتٍ" data-root="S Y H" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-y-h/" data-root-meaning="Traveling through the land; sāʾiḥ is also explained as fasting in some interpretations." data-context="Fasting women in Forqan’s current translation; sāʾiḥāt is explained through fasting in some interpretations.">سٰئِحٰتٍ</button>
    <button class="word-link" type="button" data-word="ثَيِّبٰتٍ" data-root="TH Y B" data-root-meaning="Having previous conjugal experience; in the derivational analysis of several lexicographers, related to returning under TH W B." data-context="Women who have had conjugal experience, contrasted with women who have not." data-learn-more="/quran-terminology/en/roots/th-y-b/">ثَيِّبٰتٍ</button>
    <button class="word-link" type="button" data-word="وَأَبكارًا" data-root="B K R" data-learn-more="/quran-terminology/en/roots/b-k-r/" data-root-meaning="From the beginning of the day and coming early to remaining in the first stage." data-context="And virgins: contrasted with women who have prior conjugal experience.">وَأَبكارًا</button>
  </p>
  <p class="english-verse">If he divorces you, perhaps his Lord will replace you with wives better than you: submitting, believing, obedient, repentant, worshipping, fasting, previously married and virgins.</p>
</section>
