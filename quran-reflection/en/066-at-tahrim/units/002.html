<section class="ayah-block" id="ayah-002" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tahrim 66:2</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="قَد" data-root-note="Grammatical word; no derivational root is assigned for this use.">قَد</button>
    <button class="word-link" type="button" data-word="فَرَضَ" data-root="F R DAD (F R Ḍ)" data-learn-more="/quran-terminology/en/roots/f-r-dad/" data-root-meaning="From marking and assigning a share to an appointed matter." data-context="Has prescribed">فَرَضَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="لَكُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَكُم</button>
    <button class="word-link" type="button" data-word="تَحِلَّةَ" data-root="H L L" data-root-meaning="Opening and undoing a binding; permissibility and removal of prohibition; alighting and settling." data-context="Release from the binding force of oaths." data-learn-more="/quran-terminology/en/roots/h-l-l/">تَحِلَّةَ</button>
    <button class="word-link" type="button" data-word="أَيمٰنِكُم" data-root="Y M N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/y-m-n/" data-root-meaning="The right side or hand; yamīn is an oath; also good fortune or blessing." data-context="Your oaths">أَيمٰنِكُم</button>
    ۚ
    <button class="word-link" type="button" data-word="وَاللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">وَاللَّهُ</button>
    <button class="word-link" type="button" data-word="مَولىٰكُم" data-root="W L Y" data-learn-more="/quran-terminology/en/roots/w-l-y/" data-root-meaning="Nearness and continuity; a relation that may lead to direction, support, undertaking, belonging, or priority." data-context="Your protector or patron">مَولىٰكُم</button>
    ۖ
    <button class="word-link" type="button" data-word="وَهُوَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَهُوَ</button>
    <button class="word-link" type="button" data-word="العَليمُ" data-root="ʿ L M" data-learn-more="/quran-terminology/en/roots/ayn-l-m/" data-root-meaning="Knowing, recognition, the disclosure of truth, teaching, signs, and worlds known through distinction and recognition" data-context="The Knowing, describing The God">العَليمُ</button>
    <button class="word-link" type="button" data-word="الحَكيمُ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position" data-context="The Wise, describing The God">الحَكيمُ</button>
  </p>
  <p class="english-verse">The God has prescribed for you the release from your oaths. The God is your protector; He is the Knowing, the Wise.</p>
</section>
