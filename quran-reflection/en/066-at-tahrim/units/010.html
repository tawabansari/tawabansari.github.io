  <p class="english-verse">The God sets forth an example for those who disbelieve: the wife of Noah and the wife of Lot. They were married to two righteous servants of Ours, but betrayed them, so those two could avail them nothing against The God. It was said, “Enter the Fire with those who enter.”</p>
