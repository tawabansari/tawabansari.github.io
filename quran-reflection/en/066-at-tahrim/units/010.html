<section class="ayah-block" id="ayah-010" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tahrim 66:10</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="ضَرَبَ" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state" data-context="Sets forth an example; presenting the wives of Noah and Lot as examples.">ضَرَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form" data-context="An example; illustrating the situation of those who disbelieve.">مَثَلًا</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="كَفَرُوا" data-root="K F R" data-learn-more="/quran-terminology/en/roots/k-f-r/" data-root-meaning="Covering, concealing, covering truth and blessing, and sometimes covering the effect of error through repair" data-context="Disbelieve; the group for whom the example is presented.">كَفَرُوا</button>
    <button class="word-link" type="button" data-word="امرَأَتَ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="The wife of Noah; Noah’s spouse in the example.">امرَأَتَ</button>
    <button class="word-link" type="button" data-word="نوحٍ" data-root-note="Proper name; no root has been assigned.">نوحٍ</button>
    <button class="word-link" type="button" data-word="وَامرَأَتَ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="And the wife of Lot; Lot’s spouse in the example.">وَامرَأَتَ</button>
    <button class="word-link" type="button" data-word="لوطٍ" data-root-note="Proper name; no root has been assigned.">لوطٍ</button>
    ۖ
    <button class="word-link" type="button" data-word="كانَتا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="The two women were; describing their previous situation.">كانَتا</button>
    <button class="word-link" type="button" data-word="تَحتَ" data-root="T Ḥ T" data-learn-more="/quran-terminology/en/roots/t-h-t/" data-root-meaning="Under, beneath, lower position, hidden layer, and foundational or relational placement" data-context="Under; in this construction, expressing marriage to two righteous men.">تَحتَ</button>
    <button class="word-link" type="button" data-word="عَبدَينِ" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Two servants; Noah and Lot, the two women’s husbands.">عَبدَينِ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عِبادِنا" data-root="ʿ B D (Ayn B D)" data-learn-more="/quran-terminology/en/roots/ayn-b-d/" data-root-meaning="Servanthood, practical humility, directed obedience, service, dependence, conscious submission, and placing oneself under The God’s command and lordship" data-context="Our servants; Noah and Lot’s servanthood in relation to God.">عِبادِنا</button>
    <button class="word-link" type="button" data-word="صٰلِحَينِ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Two righteous men; describing Noah and Lot’s uprightness.">صٰلِحَينِ</button>
    <button class="word-link" type="button" data-word="فَخانَتاهُما" data-root="KH W N" data-root-meaning="Diminution and taking away; in human conduct, violating trust, an entrusted responsibility, or fidelity, and infringing a right that should be respected." data-context="But the two women betrayed their husbands; the verb alone does not specify the precise kind of betrayal." data-learn-more="/quran-terminology/en/roots/kh-w-n/">فَخانَتاهُما</button>
    <button class="word-link" type="button" data-word="فَلَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَم</button>
    <button class="word-link" type="button" data-word="يُغنِيا" data-root="GH N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-n-y/" data-root-meaning="Sufficiency or wealth; ighnāʾ means making sufficient or benefiting." data-context="Could avail; negated here concerning the husbands’ ability to protect the women from God’s judgment.">يُغنِيا</button>
    <button class="word-link" type="button" data-word="عَنهُما" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَنهُما</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="شَيـًٔا" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Anything; within the negation, no benefit or protection against God.">شَيـًٔا</button>
    <button class="word-link" type="button" data-word="وَقيلَ" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="And it was said; a passive verb introducing the following command.">وَقيلَ</button>
    <button class="word-link" type="button" data-word="ادخُلَا" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="You two, enter; commanding the two women to enter the Fire.">ادخُلَا</button>
    <button class="word-link" type="button" data-word="النّارَ" data-root="N W R" data-learn-more="/quran-terminology/en/roots/n-w-r/" data-root-meaning="Light, Fire, and What Illumination Reveals" data-context="The Fire; the place they are commanded to enter.">النّارَ</button>
    <button class="word-link" type="button" data-word="مَعَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مَعَ</button>
    <button class="word-link" type="button" data-word="الدّٰخِلينَ" data-root="D KH L" data-learn-more="/quran-terminology/en/roots/d-kh-l/" data-root-meaning="Entering from outside into a place, group, condition, or domain; or causing another to enter it." data-context="Those who enter; the people with whom the two women enter the Fire.">الدّٰخِلينَ</button>
  </p>
  <p class="english-verse">The God sets forth an example for those who disbelieve: the wife of Noah and the wife of Lot. They were married to two righteous servants of Ours, but betrayed them, so those two could avail them nothing against The God. It was said, “Enter the Fire with those who enter.”</p>
</section>
