<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tahrim 66:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَضَرَبَ" data-root="Ḍ R B (Dad R B)" data-learn-more="/quran-terminology/en/roots/dad-r-b/" data-root-meaning="Decisive impact, contact, setting forth, movement, example-making, distancing, and changing a state">وَضَرَبَ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="مَثَلًا" data-root="M TH L" data-learn-more="/quran-terminology/en/roots/m-th-l/" data-root-meaning="Likeness, example, manifestation, and bringing meaning near to human understanding through a visible form">مَثَلًا</button>
    <button class="word-link" type="button" data-word="لِلَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">لِلَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنُوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses">ءامَنُوا</button>
    <button class="word-link" type="button" data-word="امرَأَتَ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action.">امرَأَتَ</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="إِذ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِذ</button>
    <button class="word-link" type="button" data-word="قالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech">قالَت</button>
    <button class="word-link" type="button" data-word="رَبِّ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّ</button>
    <button class="word-link" type="button" data-word="ابنِ" data-root="B N Y" data-learn-more="/quran-terminology/en/roots/b-n-y/" data-root-meaning="Building, erecting, founding, forming an ordered structure, and joining parts into a stable whole">ابنِ</button>
    <button class="word-link" type="button" data-word="لى" data-root-note="Grammatical word; no derivational root is assigned for this use.">لى</button>
    <button class="word-link" type="button" data-word="عِندَكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَكَ</button>
    <button class="word-link" type="button" data-word="بَيتًا" data-root="B Y T" data-learn-more="/quran-terminology/en/roots/b-y-t/" data-root-meaning="A house or dwelling; bāta: spending the night; tabyīt: arranging something by night or in secret." data-root-note="Preliminary meaning; a full root study is not yet available.">بَيتًا</button>
    <button class="word-link" type="button" data-word="فِى" data-root-note="Grammatical word; no derivational root is assigned for this use.">فِى</button>
    <button class="word-link" type="button" data-word="الجَنَّةِ" data-root="J N N" data-learn-more="/quran-terminology/en/roots/j-n-n/" data-root-meaning="Covering, hiddenness from sight, protected enclosure, and being placed under cover">الجَنَّةِ</button>
    <button class="word-link" type="button" data-word="وَنَجِّنى" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety">وَنَجِّنى</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="فِرعَونَ" data-root-note="Proper name; no root has been assigned.">فِرعَونَ</button>
    <button class="word-link" type="button" data-word="وَعَمَلِهِ" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent">وَعَمَلِهِ</button>
    <button class="word-link" type="button" data-word="وَنَجِّنى" data-root="N J W" data-learn-more="/quran-terminology/en/roots/n-j-w/" data-root-meaning="Escaping danger, emerging from a harmful condition, and reaching a place of safety">وَنَجِّنى</button>

    <button class="word-link" type="button" data-word="القَومِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">القَومِ</button>
    <button class="word-link" type="button" data-word="الظّٰلِمينَ" data-root="Ẓ L M" data-learn-more="/quran-terminology/en/roots/zha-l-m/" data-root-meaning="Darkness, concealment, lack of light, covering right, diminishing right, and displacing things from their proper place">الظّٰلِمينَ</button>
  </p>
  <p class="english-verse">The God sets forth an example for those who believe: Pharaoh’s wife, when she said, “My Lord, build me a house with You in the Garden, and save me from Pharaoh and his deeds, and save me from the wrongdoing people.”</p>
</section>
