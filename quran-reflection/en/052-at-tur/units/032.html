<section class="ayah-block" id="ayah-032" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tur 52:32</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="تَأمُرُهُم" data-root="ʾ M R" data-learn-more="/quran-terminology/en/roots/a-m-r/" data-root-meaning="Commanding, directing, seeking that something be done, and placing action or affairs on the path of execution." data-context="Command them; questioning the relation of their statements to reason.">تَأمُرُهُم</button>
    <button class="word-link" type="button" data-word="أَحلٰمُهُم" data-root="H L M" data-root-meaning="Dreams and visions in sleep; puberty in بُلُوغُ الْحُلُمِ; reason, forbearance, and self-restraint against rashness." data-context="Their minds or powers of reason; questioned critically here, rather than their dreams." data-learn-more="/quran-terminology/en/roots/h-l-m/">أَحلٰمُهُم</button>
    <button class="word-link" type="button" data-word="بِهٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهٰذا</button>
    ۚ
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="هُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">هُم</button>
    <button class="word-link" type="button" data-word="قَومٌ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="A people; characterized by transgression.">قَومٌ</button>
    <button class="word-link" type="button" data-word="طاغونَ" data-root="Ṭ GH Y" data-learn-more="/quran-terminology/en/roots/tt-gh-y/" data-root-meaning="From transgression to Taghut: passing beyond the limit, breaking the boundary, and a false reference sitting in the place of truth" data-context="Transgressing; exceeding rightful bounds.">طاغونَ</button>
  </p>
  <p class="english-verse">Do their minds command them to this, or are they a transgressing people?</p>
