<section class="ayah-block" id="ayah-021" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tur 52:21</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَالَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَالَّذينَ</button>
    <button class="word-link" type="button" data-word="ءامَنوا" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="They believed: the believers introduced at the opening of the verse.">ءامَنوا</button>
    <button class="word-link" type="button" data-word="وَاتَّبَعَتهُم" data-root="T B ʿ" data-learn-more="/quran-terminology/en/roots/t-b-ayn/" data-root-meaning="Taking a place behind a person, thing, trace, or path and continuing movement along its course." data-context="Their descendants followed them, sharing their predecessors’ faith.">وَاتَّبَعَتهُم</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتُهُم" data-root="DH R R" data-learn-more="/quran-terminology/en/roots/dh-r-r/" data-root-meaning="Dharrah: perceptible smallness; dhurriyyah: descendants and the question of origin" data-context="Their descendants: the subject of following in this clause.">ذُرِّيَّتُهُم</button>
    <button class="word-link" type="button" data-word="بِإيمٰنٍ" data-root="A M N" data-learn-more="/quran-terminology/en/roots/a-m-n/" data-root-meaning="Security, trust, and belief: related words with distinct uses" data-context="In faith: qualifying the descendants’ following as accompanied by faith.">بِإيمٰنٍ</button>
    <button class="word-link" type="button" data-word="أَلحَقنا" data-root="L H Q" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/l-h-q/" data-root-meaning="Catching up or joining another." data-context="We joined their descendants with them, in the context of the Garden’s blessings.">أَلحَقنا</button>
    <button class="word-link" type="button" data-word="بِهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِهِم</button>
    <button class="word-link" type="button" data-word="ذُرِّيَّتَهُم" data-root="DH R R" data-learn-more="/quran-terminology/en/roots/dh-r-r/" data-root-meaning="Dharrah: perceptible smallness; dhurriyyah: descendants and the question of origin" data-context="Their descendants who are joined with them: the object of alḥaqnā.">ذُرِّيَّتَهُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="أَلَتنٰهُم" data-root="A L T" data-learn-more="/quran-terminology/en/roots/a-l-t/" data-root-meaning="Diminishing a quantity, right, or outcome; especially withholding part of what belongs to someone or should be delivered to them." data-context="In wa-mā alatnāhum: We diminished nothing of their deeds; this joining does not reduce the outcome of their deeds.">أَلَتنٰهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="عَمَلِهِم" data-root="ʿ M L (Ayn M L)" data-learn-more="/quran-terminology/en/roots/ayn-m-l/" data-root-meaning="Working, doing, and what proceeds from an agent" data-context="Their deeds: their conduct, whose outcome and reward are preserved in this context.">عَمَلِهِم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="شَىءٍ" data-root="SH Y A" data-learn-more="/quran-terminology/en/roots/sh-y-a/" data-root-meaning="To will, want, or have volition; and in Qur’anic usage, for a matter to enter the field of will, possibility, and realization, especially in relation to The God" data-context="Anything at all: following negation, excluding any amount of diminution of deeds.">شَىءٍ</button>
    ۚ
    <button class="word-link" type="button" data-word="كُلُّ" data-root="K L L" data-learn-more="/quran-terminology/en/roots/k-l-l/" data-root-meaning="Totality, inclusiveness, and comprehensiveness; encompassing from all sides, or lateral connection." data-context="Every: extending the concluding statement to each person.">كُلُّ</button>
    <button class="word-link" type="button" data-word="امرِئٍ" data-root="M R ʾ" data-learn-more="/quran-terminology/en/roots/m-r-a/" data-root-meaning="The human person, the human woman, narrative relations, and individual responsibility by which a person is known through heart, earning, speech, and action." data-context="A person: each human being in relation to their own conduct and responsibility.">امرِئٍ</button>
    <button class="word-link" type="button" data-word="بِما" data-root-note="Grammatical word; no derivational root is assigned for this use.">بِما</button>
    <button class="word-link" type="button" data-word="كَسَبَ" data-root="K S B" data-learn-more="/quran-terminology/en/roots/k-s-b/" data-root-meaning="From Seeking and Acquiring to the Outcome of Action and Human Responsibility" data-context="Earned: what a person has acquired through their own deeds and conduct.">كَسَبَ</button>
    <button class="word-link" type="button" data-word="رَهينٌ" data-root="R H2 N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-h2-n/" data-root-meaning="A pledge or security; being held or bound." data-context="Held in pledge: each person is bound in responsibility to what they have earned.">رَهينٌ</button>
  </p>
  <p class="english-verse">Those who believed and whose offspring followed them in faith—We joined their offspring to them and diminished nothing of their deeds. Every person is pledged for what he has earned.</p>
</section>
