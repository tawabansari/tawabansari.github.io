<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">At-Tur 52:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَاصبِر" data-root="Ṣ B R (SAD B R)" data-learn-more="/quran-terminology/en/roots/sad-b-r/" data-root-meaning="Holding, restraining, controlling, and preventing the self or a position from being released, scattered, or broken under pressure.">وَاصبِر</button>
    <button class="word-link" type="button" data-word="لِحُكمِ" data-root="H K M" data-learn-more="/quran-terminology/en/roots/h-k-m/" data-root-meaning="Restraining, making firm, preventing disorder, and placing each matter in its proper position">لِحُكمِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="فَإِنَّكَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِنَّكَ</button>
    <button class="word-link" type="button" data-word="بِأَعيُنِنا" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink.">بِأَعيُنِنا</button>
    ۖ
    <button class="word-link" type="button" data-word="وَسَبِّح" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution">وَسَبِّح</button>
    <button class="word-link" type="button" data-word="بِحَمدِ" data-root="Ḥ M D (H M D)" data-learn-more="/quran-terminology/en/roots/h-m-d/" data-root-meaning="Conscious praise, recognition of goodness and perfection, gratitude joined with acknowledgement, and the disclosure of worthiness for ḥamd">بِحَمدِ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="حينَ" data-root="H Y N" data-learn-more="/quran-terminology/en/roots/h-y-n/" data-root-meaning="A time, moment, interval, period, deadline, or bounded segment within the flow of time.">حينَ</button>
    <button class="word-link" type="button" data-word="تَقومُ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life.">تَقومُ</button>
  </p>
  <p class="english-verse">Be patient for your Lord’s judgment, for you are before Our eyes. Glorify your Lord with praise when you rise.</p>
