  <h2 class="ayah-title">At-Tur 52:40</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَم</button>
    <button class="word-link" type="button" data-word="تَسـَٔلُهُم" data-root="S A L" data-learn-more="/quran-terminology/en/roots/s-a-l/" data-root-meaning="Asking, requesting, and questioning in accountability." data-context="You ask them: questioning whether a reward is demanded.">تَسـَٔلُهُم</button>
    <button class="word-link" type="button" data-word="أَجرًا" data-root="A J R" data-learn-more="/quran-terminology/en/roots/a-j-r/" data-root-meaning="From wages and payment for work to the reward of action" data-context="A payment asked in return for the message.">أَجرًا</button>
    <button class="word-link" type="button" data-word="فَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="مَغرَمٍ" data-root="GH R M" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/gh-r-m/" data-root-meaning="Binding loss or debt; gharām denotes persistent suffering or attachment." data-context="A financial charge: the supposed burden of payment.">مَغرَمٍ</button>
    <button class="word-link" type="button" data-word="مُثقَلونَ" data-root="TH Q L" data-root-meaning="Heaviness, weight, burden, and importance; from material loads to the weighing of human deeds" data-context="Weighed down: in this question, burdened by a demanded payment." data-learn-more="/quran-terminology/en/roots/th-q-l/">مُثقَلونَ</button>
  </p>
  <p class="english-verse">Or do you ask them for payment, so that they are burdened by a debt?</p>
