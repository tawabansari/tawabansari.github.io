    <button class="word-link" type="button" data-word="وَتُحِبّونَ" data-root="H B B" data-root-meaning="Love, affection and attachment; in the relevant forms, being dearer, making dear or preferring." data-learn-more="/quran-terminology/en/roots/h-b-b/" data-context="and you love">وَتُحِبّونَ</button>
