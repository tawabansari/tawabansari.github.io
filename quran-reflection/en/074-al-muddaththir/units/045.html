  <h2 class="ayah-title">Al-Muddaththir 74:45</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكُنّا" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And we used to, expressing the speakers’ past, repeated conduct with the imperfect verb.">وَكُنّا</button>

  <p class="english-verse">We used to plunge into idle talk with those who did so,</p>
