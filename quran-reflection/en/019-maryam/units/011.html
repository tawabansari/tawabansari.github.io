<section class="ayah-block" id="ayah-011" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:11</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَخَرَجَ" data-root="KH R J" data-learn-more="/quran-terminology/en/roots/kh-r-j/" data-root-meaning="Coming out, bringing out, drawing something from concealment, and moving it from a closed field into visibility, effect, and responsibility" data-context="Then he came out, Zechariah’s departure from the miḥrāb to his people.">فَخَرَجَ</button>
    <button class="word-link" type="button" data-word="عَلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلىٰ</button>
    <button class="word-link" type="button" data-word="قَومِهِ" data-root="Q W M" data-learn-more="/quran-terminology/en/roots/q-w-m/" data-root-meaning="Rising, standing, establishing, becoming upright, gaining structure, sustaining a thing upon a sound foundation, and making it active in life." data-context="His people, those with whom Zechariah communicated after leaving the miḥrāb.">قَومِهِ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="المِحرابِ" data-root="H R B" data-root-meaning="War and hostile confrontation; dispossession; in the miḥrāb branch, an elevated, distinguished place." data-context="The miḥrāb: the dedicated place of worship from which Zechariah comes out to his people." data-learn-more="/quran-terminology/en/roots/h-r-b/">المِحرابِ</button>
    <button class="word-link" type="button" data-word="فَأَوحىٰ" data-root="W H Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/w-h-y/" data-root-meaning="Rapid, discreet signaling or communication; waḥy has differing agents and recipients according to context." data-context="Then he signalled to them, communicating the instruction to glorify to his people.">فَأَوحىٰ</button>
    <button class="word-link" type="button" data-word="إِلَيهِم" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيهِم</button>
    <button class="word-link" type="button" data-word="أَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَن</button>
    <button class="word-link" type="button" data-word="سَبِّحوا" data-root="S B Ḥ" data-learn-more="/quran-terminology/en/roots/s-b-h/" data-root-meaning="Swimming, moving smoothly in a course, remaining away from sinking or leaving the orbit, and declaring The God free from every false attribution" data-context="Glorify, Zechariah’s instruction to his people for morning and evening.">سَبِّحوا</button>
    <button class="word-link" type="button" data-word="بُكرَةً" data-root="B K R" data-learn-more="/quran-terminology/en/roots/b-k-r/" data-root-meaning="From the beginning of the day and coming early to remaining in the first stage." data-context="Morning, one of the two stated times for glorification.">بُكرَةً</button>
    <button class="word-link" type="button" data-word="وَعَشِيًّا" data-root="AYN SH W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/ayn-sh-w/" data-root-meaning="Late day or evening; ʿashw denotes dim sight or turning a blind eye." data-context="And evening, the other stated time for glorification.">وَعَشِيًّا</button>
  </p>
  <p class="english-verse">He came out to his people from the sanctuary and signaled to them to glorify morning and evening.</p>
</section>
