<section class="ayah-block" id="ayah-048" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:48</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَأَعتَزِلُكُم" data-root="AYN Z L" data-learn-more="/quran-terminology/en/roots/ayn-z-l/" data-root-meaning="Separating or setting aside from a group, position, or relationship; iʿtizāl is withdrawal, and maʿzūl is someone or something set apart or excluded." data-context="And I withdraw from you; Abraham declares his decision to leave his people and their worship.">وَأَعتَزِلُكُم</button>
    <button class="word-link" type="button" data-word="وَما" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَما</button>
    <button class="word-link" type="button" data-word="تَدعونَ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="You invoke; what Abraham’s hearers invoke apart from The God.">تَدعونَ</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="دونِ" data-root="D W N" data-learn-more="/quran-terminology/en/roots/d-w-n/" data-root-meaning="Dūn: a relation to a reference point—before it, below it, or apart from it" data-context="Apart from; in “apart from The God,” describing what they invoke.">دونِ</button>
    <button class="word-link" type="button" data-word="اللَّهِ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهِ</button>
    <button class="word-link" type="button" data-word="وَأَدعوا" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="And I invoke; Abraham calls upon his Lord.">وَأَدعوا</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord; the one Abraham invokes and places his hope in.">رَبّى</button>
    <button class="word-link" type="button" data-word="عَسىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use." data-learn-more="/quran-terminology/en/roots/ayn-s-y/">عَسىٰ</button>
    <button class="word-link" type="button" data-word="أَلّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَلّا</button>
    <button class="word-link" type="button" data-word="أَكونَ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="Be; within Abraham’s hope not to be disappointed in calling upon his Lord.">أَكونَ</button>
    <button class="word-link" type="button" data-word="بِدُعاءِ" data-root="D ʿ W (D Ayn W)" data-learn-more="/quran-terminology/en/roots/d-ayn-w/" data-root-meaning="To call, summon, invite, invoke for help, ask, or name someone by a given relation and identity" data-context="In calling upon; Abraham’s invocation of his Lord.">بِدُعاءِ</button>
    <button class="word-link" type="button" data-word="رَبّى" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="My Lord; the one Abraham calls upon in prayer.">رَبّى</button>
    <button class="word-link" type="button" data-word="شَقِيًّا" data-root="SH Q Y" data-learn-more="/quran-terminology/en/roots/sh-q-w/" data-root-meaning="Suffering, hardship, deprivation or an unhappy outcome, in contrast with well-being; context determines the condition and its significance." data-context="Disappointed or wretched; what Abraham hopes not to be in invoking his Lord.">شَقِيًّا</button>
  </p>
  <p class="english-verse">I will withdraw from you and what you call upon apart from The God, and I will call upon my Lord. I hope I will not be disappointed in calling upon my Lord.”</p>
</section>
