<section class="ayah-block" id="ayah-078" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:78</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="أَطَّلَعَ" data-root="TT L AYN" data-root-meaning="In its familiar semantic core, Ṭ L ʿ concerns rising and becoming apparent. In natural uses, it describes the sun appearing and plant produce emerging. In human uses, it can concern observing or learning something previously beyond a person’s access. In some constructions, it conveys reaching a particular place." data-learn-more="/quran-terminology/en/roots/tt-l-ayn/">أَطَّلَعَ</button>
    <button class="word-link" type="button" data-word="الغَيبَ" data-root="GH Y B" data-learn-more="/quran-terminology/en/roots/gh-y-b/" data-root-meaning="Hiddenness, absence from human sight, what lies beyond direct perception, and the boundary between limited human awareness and the encompassing knowledge of The God">الغَيبَ</button>
    <button class="word-link" type="button" data-word="أَمِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَمِ</button>
    <button class="word-link" type="button" data-word="اتَّخَذَ" data-root="ʾ KH DH" data-learn-more="/quran-terminology/en/roots/a-kh-dh/" data-root-meaning="Taking, bringing into one&#x27;s possession, restraining, and bringing something within the sphere of control, obligation, or pursuit">اتَّخَذَ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="الرَّحمٰنِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return">الرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="عَهدًا" data-root="ʿ H D" data-learn-more="/quran-terminology/en/roots/ayn-h2-d/" data-root-meaning="Knowing with obligation, covenant, care, preservation, and accountability">عَهدًا</button>
  </p>
  <p class="english-verse">Has he looked into the unseen, or taken a covenant with the Entirely Merciful?</p>
</section>
