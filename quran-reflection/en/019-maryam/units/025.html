<section class="ayah-block" id="ayah-025" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:25</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَهُزّى" data-root="H2 Z Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-z-z/" data-root-meaning="Shaking or vigorous movement." data-context="And shake; the command to Maryam to shake the palm trunk.">وَهُزّى</button>
    <button class="word-link" type="button" data-word="إِلَيكِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلَيكِ</button>
    <button class="word-link" type="button" data-word="بِجِذعِ" data-root="J DH AYN" data-root-meaning="The main trunk of a tree, especially a date palm." data-context="The trunk of; in “the palm trunk,” which Maryam was commanded to shake toward herself." data-learn-more="/quran-terminology/en/roots/j-dh-ayn/">بِجِذعِ</button>
    <button class="word-link" type="button" data-word="النَّخلَةِ" data-root="N KH L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-kh-l/" data-root-meaning="A date palm or date palms." data-context="The palm; the date palm whose trunk Maryam is commanded to shake.">النَّخلَةِ</button>
    <button class="word-link" type="button" data-word="تُسٰقِط" data-root="S Q TT" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/s-q-tt/" data-root-meaning="Falling or causing to fall." data-context="It will drop; the palm lets fresh, ripe dates fall upon Maryam.">تُسٰقِط</button>
    <button class="word-link" type="button" data-word="عَلَيكِ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عَلَيكِ</button>
    <button class="word-link" type="button" data-word="رُطَبًا" data-root="R TT B" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-tt-b/" data-root-meaning="Moistness and freshness; ruṭab are fresh, ripe dates." data-context="Fresh, ripe dates; the food that falls from the palm upon Maryam.">رُطَبًا</button>
    <button class="word-link" type="button" data-word="جَنِيًّا" data-root="J N Y" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-n-y/" data-root-meaning="Gathering fruit; janā: fruit available for gathering; janiyy: fresh and ready to pick." data-context="Ripe and ready to pick; describing the dates falling upon Maryam.">جَنِيًّا</button>
  </p>
  <p class="english-verse">Shake the palm trunk toward you; it will drop fresh, ripe dates upon you.</p>
</section>
