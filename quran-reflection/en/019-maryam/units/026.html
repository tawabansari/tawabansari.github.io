<section class="ayah-block" id="ayah-026" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:26</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَكُلى" data-root="A K L" data-learn-more="/quran-terminology/en/roots/a-k-l/" data-root-meaning="Eating, consuming, benefiting, absorbing, and sometimes wearing something down through consumption" data-context="So eat, a command addressed to Mary.">فَكُلى</button>
    <button class="word-link" type="button" data-word="وَاشرَبى" data-root="SH R B" data-learn-more="/quran-terminology/en/roots/sh-r-b/" data-root-meaning="Drinking, drink, a share of water, and a place or path of access to drinking." data-context="And drink, a command addressed to Mary.">وَاشرَبى</button>
    <button class="word-link" type="button" data-word="وَقَرّى" data-root="Q R R" data-learn-more="/quran-terminology/en/roots/q-r-r/" data-root-meaning="Settling, becoming stable, finding rest in a proper place, and the calming of restlessness." data-context="And be comforted, in the expression concerning the eye’s contentment.">وَقَرّى</button>
    <button class="word-link" type="button" data-word="عَينًا" data-root="AYN Y N (ʿ Y N)" data-learn-more="/quran-terminology/en/roots/ayn-y-n/" data-root-meaning="Eye, spring, observation, care, and visible accessible water or drink." data-context="The eye, within the expression of Mary’s comfort and contentment.">عَينًا</button>
    ۖ
    <button class="word-link" type="button" data-word="فَإِمّا" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَإِمّا</button>
    <button class="word-link" type="button" data-word="تَرَيِنَّ" data-root="R A Y" data-learn-more="/quran-terminology/en/roots/r-a-y/" data-root-meaning="Seeing, perceiving, and something becoming clear to the viewer through sight or awareness" data-context="You see a human being in the stated situation.">تَرَيِنَّ</button>
    <button class="word-link" type="button" data-word="مِنَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنَ</button>
    <button class="word-link" type="button" data-word="البَشَرِ" data-root="B SH R" data-learn-more="/quran-terminology/en/roots/b-sh-r/" data-root-meaning="The human visible surface, the face, the effect of news upon a person, and direct contact" data-context="Human beings whom Mary might see.">البَشَرِ</button>
    <button class="word-link" type="button" data-word="أَحَدًا" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="Someone, any one of the human beings.">أَحَدًا</button>
    <button class="word-link" type="button" data-word="فَقولى" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="Then say, announcing the vow and abstention from conversation.">فَقولى</button>
    <button class="word-link" type="button" data-word="إِنّى" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِنّى</button>
    <button class="word-link" type="button" data-word="نَذَرتُ" data-root="N DH R" data-learn-more="/quran-terminology/en/roots/n-dh-r/" data-root-meaning="Vow, warning, commitment, and awakening before consequence" data-context="I have vowed, undertaking a commitment to the Entirely Merciful.">نَذَرتُ</button>
    <button class="word-link" type="button" data-word="لِلرَّحمٰنِ" data-root="R Ḥ M" data-learn-more="/quran-terminology/en/roots/r-h-m/" data-root-meaning="Mercy, nurturing care, protective nearness, forgiveness, and the opening of a path toward growth and return" data-context="To the Entirely Merciful, to whom the vow is dedicated.">لِلرَّحمٰنِ</button>
    <button class="word-link" type="button" data-word="صَومًا" data-root="SAD W M" data-root-meaning="Abstaining and ceasing an activity or movement." data-context="Vowed abstention; here, refraining from speaking to any human being that day." data-learn-more="/quran-terminology/en/roots/sad-w-m/">صَومًا</button>
    <button class="word-link" type="button" data-word="فَلَن" data-root-note="Grammatical word; no derivational root is assigned for this use.">فَلَن</button>
    <button class="word-link" type="button" data-word="أُكَلِّمَ" data-root="K L M" data-learn-more="/quran-terminology/en/roots/k-l-m/" data-root-meaning="Speech that carries meaning and effect, leaving a mark in the listener, covenant, judgment, history, or reality" data-context="Speak, within the denial of conversation with a human being that day.">أُكَلِّمَ</button>
    <button class="word-link" type="button" data-word="اليَومَ" data-root="Y W M" data-learn-more="/quran-terminology/en/roots/y-w-m/" data-root-meaning="Day, the time when a matter becomes manifest, an appointed period, the moment of account, and the field where the result of deeds appears" data-context="Today, the period of the stated abstention.">اليَومَ</button>
    <button class="word-link" type="button" data-word="إِنسِيًّا" data-root="A N S" data-learn-more="/quran-terminology/en/roots/a-n-s/" data-root-meaning="Humankind and familiarity: perceiving, becoming acquainted, and social company" data-context="Any human being, the interlocutor from whom Mary abstains in conversation.">إِنسِيًّا</button>
  </p>
  <p class="english-verse">Eat, drink, and be comforted. If you see any human, say, ‘I have vowed a fast to the Entirely Merciful, so today I will not speak to any human.’”</p>
</section>
