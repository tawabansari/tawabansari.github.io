<section class="ayah-block" id="ayah-023" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:23</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَأَجاءَهَا" data-root="J Y ʾ" data-learn-more="/quran-terminology/en/roots/j-y-a/" data-root-meaning="Coming, arriving, bringing, and making a person, thing, or event present at a point of encounter" data-context="Then drove her; the childbirth pains brought Maryam to the palm trunk.">فَأَجاءَهَا</button>
    <button class="word-link" type="button" data-word="المَخاضُ" data-root="M KH DAD" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/m-kh-dad/" data-root-meaning="Agitation or churning; makhāḍ is labor in childbirth." data-context="The pains of childbirth, which drove Maryam toward the palm trunk.">المَخاضُ</button>
    <button class="word-link" type="button" data-word="إِلىٰ" data-root-note="Grammatical word; no derivational root is assigned for this use.">إِلىٰ</button>
    <button class="word-link" type="button" data-word="جِذعِ" data-root="J DH AYN" data-root-meaning="The main trunk of a tree, especially a date palm." data-context="The trunk of; in “the trunk of the palm,” beside which Maryam arrived during childbirth pains." data-learn-more="/quran-terminology/en/roots/j-dh-ayn/">جِذعِ</button>
    <button class="word-link" type="button" data-word="النَّخلَةِ" data-root="N KH L" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/n-kh-l/" data-root-meaning="A date palm or date palms." data-context="The palm; the date palm whose trunk Maryam reached.">النَّخلَةِ</button>
    <button class="word-link" type="button" data-word="قالَت" data-root="Q W L" data-learn-more="/quran-terminology/en/roots/q-w-l/" data-root-meaning="Saying, expression, claim, command, attribution, and the responsibility of speech" data-context="She said; Maryam voiced her wish in that distress.">قالَت</button>
    <button class="word-link" type="button" data-word="يٰلَيتَنى" data-root-note="Grammatical word; no derivational root is assigned for this use.">يٰلَيتَنى</button>
    <button class="word-link" type="button" data-word="مِتُّ" data-root="M W T" data-learn-more="/quran-terminology/en/roots/m-w-t/" data-root-meaning="Death, the quieting or stopping of active life, departure from worldly living, and transition from a living active state into a condition where known life no longer functions" data-context="I had died; Maryam’s wish to have died before this event.">مِتُّ</button>
    <button class="word-link" type="button" data-word="قَبلَ" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before; indicating a time preceding this event.">قَبلَ</button>
    <button class="word-link" type="button" data-word="هٰذا" data-root-note="Grammatical word; no derivational root is assigned for this use.">هٰذا</button>
    <button class="word-link" type="button" data-word="وَكُنتُ" data-root="K W N" data-learn-more="/quran-terminology/en/roots/k-w-n/" data-root-meaning="Being, existing in a state, becoming, taking place, or coming into realization" data-context="And had been; continuing Maryam’s wish to have been something forgotten.">وَكُنتُ</button>
    <button class="word-link" type="button" data-word="نَسيًا" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence." data-context="Something forgotten; something left outside attention and remembrance.">نَسيًا</button>
    <button class="word-link" type="button" data-word="مَنسِيًّا" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence." data-context="Forgotten; a passive description reinforcing the forgotten state of nasy.">مَنسِيًّا</button>
  </p>
  <p class="english-verse">The pains of childbirth drove her to the trunk of a palm. She said, “If only I had died before this and been something forgotten, entirely out of mind!”</p>
</section>
