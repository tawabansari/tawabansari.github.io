<section class="ayah-block" id="ayah-098" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:98</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَكَم" data-root-note="Grammatical word; no derivational root is assigned for this use.">وَكَم</button>
    <button class="word-link" type="button" data-word="أَهلَكنا" data-root="H2 L K" data-root-meaning="The loss or ending of existence, a condition, or effective power; Form IV highlights causing such destruction." data-context="We destroyed many generations before them." data-learn-more="/quran-terminology/en/roots/h2-l-k/">أَهلَكنا</button>
    <button class="word-link" type="button" data-word="قَبلَهُم" data-root="Q B L" data-learn-more="/quran-terminology/en/roots/q-b-l/" data-root-meaning="Facing, turning toward, being before something, and accepting what comes toward the human being" data-context="Before them.">قَبلَهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="قَرنٍ" data-root="Q R N" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/q-r-n/" data-root-meaning="Joining or accompanying; qarīn is a companion; qarn is a generation or contemporary community." data-context="A past generation.">قَرنٍ</button>
    <button class="word-link" type="button" data-word="هَل" data-root-note="Grammatical word; no derivational root is assigned for this use.">هَل</button>
    <button class="word-link" type="button" data-word="تُحِسُّ" data-root="H S S" data-root-meaning="In Arabic, ح س س has several semantic branches: perceiving and becoming aware of something; seeking news and signs; sound and sensory reaction; and killing or destroying. In the Qur’an, each form’s meaning follows its morphology and context. أَحَسَّ concerns perceiving, تَحَسَّسَ seeking news, حَسِيس a faint sound, and حَسَّ in a battle context killing and destroying." data-context="Do you perceive anyone’s presence?" data-learn-more="/quran-terminology/en/roots/h-s-s/">تُحِسُّ</button>
    <button class="word-link" type="button" data-word="مِنهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُم</button>
    <button class="word-link" type="button" data-word="مِن" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِن</button>
    <button class="word-link" type="button" data-word="أَحَدٍ" data-root="A Ḥ D" data-learn-more="/quran-terminology/en/roots/a-h-d/" data-root-meaning="Aḥad: one, one of, and no one under negation" data-context="Even one of them.">أَحَدٍ</button>
    <button class="word-link" type="button" data-word="أَو" data-root-note="Grammatical word; no derivational root is assigned for this use.">أَو</button>
    <button class="word-link" type="button" data-word="تَسمَعُ" data-root="S M ʿ (S M Ayn)" data-learn-more="/quran-terminology/en/roots/s-m-ayn/" data-root-meaning="Hearing, listening attentively, receiving the message, and responsibility after hearing" data-context="Or do you hear?">تَسمَعُ</button>
    <button class="word-link" type="button" data-word="لَهُم" data-root-note="Grammatical word; no derivational root is assigned for this use.">لَهُم</button>
    <button class="word-link" type="button" data-word="رِكزًا" data-root="R K Z" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/r-k-z/" data-root-meaning="Planting or setting down; rikz is a faint sound." data-context="A faint or hidden sound.">رِكزًا</button>
  </p>
  <p class="english-verse">How many generations before them We destroyed! Do you sense any of them or hear a faint sound from them?</p>
