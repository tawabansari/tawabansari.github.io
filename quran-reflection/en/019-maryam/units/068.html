<section class="ayah-block" id="ayah-068" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:68</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَوَرَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah">فَوَرَبِّكَ</button>
    <button class="word-link" type="button" data-word="لَنَحشُرَنَّهُم" data-root="H SH R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h-sh-r/" data-root-meaning="Gathering and driving people or creatures together from their places.">لَنَحشُرَنَّهُم</button>
    <button class="word-link" type="button" data-word="وَالشَّيٰطينَ" data-root="SH Ṭ N" data-learn-more="/quran-terminology/en/roots/sh-tt-n/" data-root-meaning="Becoming distant from the proper place, rebelling from the path of truth, and taking the role of one who distances from guidance">وَالشَّيٰطينَ</button>
    <button class="word-link" type="button" data-word="ثُمَّ" data-root-note="Grammatical word; no derivational root is assigned for this use.">ثُمَّ</button>
    <button class="word-link" type="button" data-word="لَنُحضِرَنَّهُم" data-root="Ḥ Ḍ R" data-learn-more="/quran-terminology/en/roots/h-dad-r/" data-root-meaning="Presence, arrival, proximity, and bringing into presence: from everyday life to confronting deeds in the Hereafter">لَنُحضِرَنَّهُم</button>
    <button class="word-link" type="button" data-word="حَولَ" data-root="H W L" data-learn-more="/quran-terminology/en/roots/h-w-l/" data-root-meaning="Aroundness, surrounding relation, turning, change of state, transfer, and becoming a barrier between things">حَولَ</button>

    <button class="word-link" type="button" data-word="جِثِيًّا" data-root="J TH W" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/j-th-w/" data-root-meaning="Kneeling; jāthiyah and juthiyy: kneeling or those on their knees.">جِثِيًّا</button>
  </p>
  <p class="english-verse">By your Lord, We will surely gather them and the devils, then bring them around Hell on their knees.</p>
