  <h2 class="ayah-title">Maryam 19:64</h2>
  <p class="arabic-text">

    <button class="word-link" type="button" data-word="نَسِيًّا" data-root="N S Y" data-learn-more="/quran-terminology/en/roots/n-s-y/" data-root-meaning="Forgetting, losing from remembrance, leaving something outside attention, and removing it from the field of mental and practical presence.">نَسِيًّا</button>
  </p>
  <p class="english-verse">We descend only by your Lord’s command. To Him belongs what is before us, what is behind us, and what is between them. Your Lord is never forgetful.</p>
