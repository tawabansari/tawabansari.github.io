  <h2 class="ayah-title">Maryam 19:22</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="فَحَمَلَتهُ" data-root="H M L" data-root-meaning="Lifting, carrying, and bearing something; from physical loads and pregnancy to responsibility, commitment, and the consequences of deeds." data-context="Then she conceived him; Mary carrying Jesus in pregnancy." data-learn-more="/quran-terminology/en/roots/h-m-l/">فَحَمَلَتهُ</button>

  <p class="english-verse">She conceived him and withdrew with him to a distant place.</p>
