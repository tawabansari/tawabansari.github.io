<section class="ayah-block" id="ayah-076" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:76</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="وَيَزيدُ" data-root="Z Y D" data-learn-more="/quran-terminology/en/roots/z-y-d/" data-root-meaning="Adding, increasing, excess, and intensifying beyond a previous measure" data-context="And increases, concerning The God’s increasing guidance.">وَيَزيدُ</button>
    <button class="word-link" type="button" data-word="اللَّهُ" data-root="A L H" data-root-meaning="In our linguistic reading, Allah is connected with ilah and the root A L H. Ilah means a deity or object of worship: the one toward whom a person turns in devotion, refuge, and servitude. The Arabic definite article al makes the expression definite, bringing al-ilah close to the meaning “The God.” Through contraction and assimilation, this form becomes Allah." data-context="In this reading, Allah is not merely an untranslatable proper name, but a title of rank for the One uniquely worthy of worship. Forqan therefore renders it as “The God.”" data-learn-more="/quran-terminology/en/roots/a-l-h/">اللَّهُ</button>
    <button class="word-link" type="button" data-word="الَّذينَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">الَّذينَ</button>
    <button class="word-link" type="button" data-word="اهتَدَوا" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Found guidance, those who accepted its path.">اهتَدَوا</button>
    <button class="word-link" type="button" data-word="هُدًى" data-root="H D Y" data-learn-more="/quran-terminology/en/roots/h2-d-y/" data-root-meaning="Guidance, direction, leading to the right path, receiving the orientation of truth, and preparing oneself to be guided" data-context="Guidance, what is increased for those already guided.">هُدًى</button>
    ۗ
    <button class="word-link" type="button" data-word="وَالبٰقِيٰتُ" data-root="B Q Y" data-root-meaning="B Q Y denotes something continuing or not disappearing against ending, passing away, or loss. Causative constructions express leaving or preserving; descriptive forms express lastingness and surviving; baqiyyah denotes what remains of a whole, relationship, or valuable resource." data-context="Lasting, describing good deeds that are better in reward and outcome." data-learn-more="/quran-terminology/en/roots/b-q-y/">وَالبٰقِيٰتُ</button>
    <button class="word-link" type="button" data-word="الصّٰلِحٰتُ" data-root="Ṣ L Ḥ (Sad L H)" data-learn-more="/quran-terminology/en/roots/sad-l-h/" data-root-meaning="Salāh, rightness, soundness, harmony, reform, and returning something to its proper state" data-context="Good or worthy, describing the lasting deeds.">الصّٰلِحٰتُ</button>
    <button class="word-link" type="button" data-word="خَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="Better, the good deeds’ superiority in reward.">خَيرٌ</button>
    <button class="word-link" type="button" data-word="عِندَ" data-root-note="Grammatical word; no derivational root is assigned for this use.">عِندَ</button>
    <button class="word-link" type="button" data-word="رَبِّكَ" data-root="R B B" data-learn-more="/quran-terminology/en/roots/r-b-b/" data-root-meaning="Lordship, nurturing, ownership joined with governance, bringing a being toward growth, and the right of command based on rubūbiyyah" data-context="Your Lord, with whom the deeds’ reward is assessed.">رَبِّكَ</button>
    <button class="word-link" type="button" data-word="ثَوابًا" data-root="TH W B" data-learn-more="/quran-terminology/en/roots/th-w-b/" data-root-meaning="Thāba: returning and the return of an outcome" data-context="In reward, the first aspect of the good deeds’ superiority.">ثَوابًا</button>
    <button class="word-link" type="button" data-word="وَخَيرٌ" data-root="KH Y R" data-learn-more="/quran-terminology/en/roots/kh-y-r/" data-root-meaning="Goodness, real benefit and superiority, valuable wealth, choosing and choice" data-context="And better, concerning the deeds’ final outcome.">وَخَيرٌ</button>
    <button class="word-link" type="button" data-word="مَرَدًّا" data-root="R D D" data-learn-more="/quran-terminology/en/roots/r-d-d/" data-root-meaning="Returning, turning back, repelling, and turning away from a course" data-context="In return or outcome, the deeds’ ultimate result.">مَرَدًّا</button>
  </p>
  <p class="english-verse">The God increases those who are guided in guidance. Lasting righteous deeds are better with your Lord in reward and better in return.</p>
</section>
