<section class="ayah-block" id="ayah-090" data-translation-status="provisional">
  <h2 class="ayah-title">Maryam 19:90</h2>
  <p class="arabic-text">
    <button class="word-link" type="button" data-word="تَكادُ" data-root="K W D" data-learn-more="/quran-terminology/en/roots/k-w-d/" data-root-meaning="To come close to the threshold of occurrence, to stand at the edge of doing or becoming, and to show intense readiness or pressure toward an event" data-context="Almost; expressing the imminence of the immense events.">تَكادُ</button>
    <button class="word-link" type="button" data-word="السَّمٰوٰتُ" data-root="S M W" data-learn-more="/quran-terminology/en/roots/s-m-w/" data-root-meaning="Height, being above, elevation, superior position, and the upward direction" data-context="The heavens; described as almost splitting.">السَّمٰوٰتُ</button>
    <button class="word-link" type="button" data-word="يَتَفَطَّرنَ" data-root="F TT R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/f-tt-r/" data-root-meaning="Splitting; faṭr denotes originating; fiṭrah is an original disposition." data-context="Split apart; the heavens’ rupturing in the verse.">يَتَفَطَّرنَ</button>
    <button class="word-link" type="button" data-word="مِنهُ" data-root-note="Grammatical word; no derivational root is assigned for this use.">مِنهُ</button>
    <button class="word-link" type="button" data-word="وَتَنشَقُّ" data-root="SH Q Q" data-learn-more="/quran-terminology/en/roots/sh-q-q/" data-root-meaning="Splitting, breach, side, hardship, distance, and oppositional rupture" data-context="And split; the earth’s rupturing.">وَتَنشَقُّ</button>
    <button class="word-link" type="button" data-word="الأَرضُ" data-root="A R Ḍ" data-learn-more="/quran-terminology/en/roots/a-r-dad/" data-root-meaning="Earth, land, and the ground beneath one’s feet" data-context="The earth; described as splitting.">الأَرضُ</button>
    <button class="word-link" type="button" data-word="وَتَخِرُّ" data-root="KH R R" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/kh-r-r/" data-root-meaning="Falling down; also the sound of falling or flowing." data-context="And fall; mountains collapsing.">وَتَخِرُّ</button>
    <button class="word-link" type="button" data-word="الجِبالُ" data-root="J B L" data-root-meaning="a mountain or elevated mass; natural constitution and creation; a large human multitude." data-context="Mountains; described as falling and breaking apart." data-learn-more="/quran-terminology/en/roots/j-b-l/">الجِبالُ</button>
    <button class="word-link" type="button" data-word="هَدًّا" data-root="H2 D D" data-root-note="Preliminary meaning; a full root study is not yet available." data-learn-more="/quran-terminology/en/roots/h2-d-d/" data-root-meaning="Breaking, collapsing, or severe destruction." data-context="A great collapse; emphasizing the mountains’ breaking apart.">هَدًّا</button>
  </p>
  <p class="english-verse">The heavens almost tear apart from it, the earth splits open, and the mountains fall in collapse,</p>
