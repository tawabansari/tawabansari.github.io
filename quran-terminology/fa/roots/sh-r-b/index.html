  <h1>ریشه قرآنی ش ر ب</h1>
  <p><strong>معنای کوتاه:</strong> نوشیدن، آب خوردن، راه یا محل نوشیدن.</p>
  <p>این صفحه به‌عنوان جای‌نگهدار ساخته شده است تا واژگان مرتبط با این ریشه در آیات قابل ارجاع باشند. تفصیل کامل ریشه بعداً افزوده می‌شود.</p>
</main>
