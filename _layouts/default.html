<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    .theme-toggle-button {
      border: 1px solid #ddd;
      border-radius: 999px;
      background: #fff;
      color: inherit;
      padding: 0.35rem 0.7rem;
      margin-left: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    .theme-toggle-button:hover {
      border-color: #aaa;
    }

    .theme-icon-light {
      display: none;
    }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: #b08d57;
      z-index: 9999;
      transition: width 0.1s linear;
    }

    .back-to-top {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      color: inherit;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }

    .back-to-top.show {
      display: flex;
    }

    .copy-ayah-link {
      border: 1px solid #ddd;
      border-radius: 999px;
      background: #fff;
      color: #555;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.25rem 0.55rem;
      margin-inline-start: 0.5rem;
      vertical-align: middle;
    }

    .copy-ayah-link:hover {
      border-color: #aaa;
    }

    body.dark-theme {
      background: #0f172a;
      color: #e5e7eb;
    }

    body.dark-theme .site-header,
    body.dark-theme .site-footer {
      background: #0b1220;
      border-color: #334155;
    }

    body.dark-theme .container {
      background: transparent;
    }

    body.dark-theme h1,
    body.dark-theme h2,
    body.dark-theme h3,
    body.dark-theme h4,
    body.dark-theme p,
    body.dark-theme li {
      color: #e5e7eb;
    }

    body.dark-theme a {
      color: #e5e7eb;
    }

    body.dark-theme .site-brand,
    body.dark-theme .site-brand span,
    body.dark-theme .home-link,
    body.dark-theme .site-nav a {
      color: #f1f5f9;
    }

    body.dark-theme .brand-separator {
      color: #94a3b8;
    }

    body.dark-theme .landing-card,
    body.dark-theme .ayah-card,
    body.dark-theme .article-card,
    body.dark-theme .section-card,
    body.dark-theme .language-card,
    body.dark-theme .home-card,
    body.dark-theme .surah-card,
    body.dark-theme .card-grid a,
    body.dark-theme details {
      background: #172033;
      border-color: #334155;
      color: #e5e7eb;
    }

    body.dark-theme .landing-card:hover,
    body.dark-theme .ayah-card:hover,
    body.dark-theme .article-card:hover,
    body.dark-theme .section-card:hover,
    body.dark-theme .language-card:hover,
    body.dark-theme .home-card:hover,
    body.dark-theme .surah-card:hover,
    body.dark-theme .card-grid a:hover {
      border-color: #64748b;
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
    }

    body.dark-theme .surah-meaning,
    body.dark-theme .surah-count,
    body.dark-theme .placeholder {
      color: #cbd5e1;
    }

    body.dark-theme .arabic-text,
    body.dark-theme .farsi-verse,
    body.dark-theme .english-verse {
      color: #f8fafc;
    }

    body.dark-theme .ayah-block {
      border-top-color: #334155;
    }

    body.dark-theme blockquote,
    body.dark-theme .arabic-box,
    body.dark-theme .verse-box,
    body.dark-theme .quran-box,
    body.dark-theme .quote-box,
    body.dark-theme pre,
    body.dark-theme code {
      background: #172033;
      border-color: #334155;
      color: #f1f5f9;
    }

    body.dark-theme button,
    body.dark-theme .button,
    body.dark-theme .btn {
      background: #1e293b;
      border-color: #475569;
      color: #f8fafc;
    }

    body.dark-theme .theme-toggle-button,
    body.dark-theme .back-to-top,
    body.dark-theme .copy-ayah-link {
      background: #172033;
      border-color: #475569;
      color: #f8fafc;
    }

    body.dark-theme .theme-icon-dark {
      display: none;
    }

    body.dark-theme .theme-icon-light {
      display: inline;
    }

    body.dark-theme .reading-progress {
      background: #d6b26d;
    }
  </style>
</head>
<body>

<div class="reading-progress" aria-hidden="true"></div>

<header class="site-header">

  <div class="header-left">
    <a class="home-link" href="/">Home</a>

    <a class="site-brand" href="/introduction/">
      <span class="brand-en">Introduction to Qur’an</span>
      <span class="brand-separator">·</span>
      <span class="brand-fa">آشنایی با قرآن</span>
    </a>
  </div>

  <nav class="site-nav">
    <a href="/en/">English</a>
    <a href="/fa/">فارسی</a>

    <button class="theme-toggle-button" type="button" aria-label="Switch theme">
      <span class="theme-icon-dark">🌙</span>
      <span class="theme-icon-light">☀️</span>
    </button>
  </nav>

</header>

<main class="container">
  {{ content }}
</main>

<button class="back-to-top" type="button" aria-label="Back to top">
  ↑
</button>

<footer class="site-footer">
  <p>© {{ site.time | date: "%Y" }} Forqan Archive</p>
</footer>

<script>
  const themeButton = document.querySelector('.theme-toggle-button');
  const savedTheme = localStorage.getItem('forqan-theme');

  if (savedTheme === 'dark') {
    document.body.classList.add('dark-theme');
  }

  themeButton.addEventListener('click', function () {
    document.body.classList.toggle('dark-theme');

    if (document.body.classList.contains('dark-theme')) {
      localStorage.setItem('forqan-theme', 'dark');
    } else {
      localStorage.setItem('forqan-theme', 'light');
    }
  });

  const progressBar = document.querySelector('.reading-progress');
  const backToTopButton = document.querySelector('.back-to-top');

  function updateScrollTools() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const documentHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const progress = documentHeight > 0 ? (scrollTop / documentHeight) * 100 : 0;

    progressBar.style.width = progress + '%';

    if (scrollTop > 500) {
      backToTopButton.classList.add('show');
    } else {
      backToTopButton.classList.remove('show');
    }
  }

  window.addEventListener('scroll', updateScrollTools);
  window.addEventListener('load', updateScrollTools);

  backToTopButton.addEventListener('click', function () {
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  });

  document.querySelectorAll('.ayah-block[id]').forEach(function (ayahBlock) {
    const ayahTitle = ayahBlock.querySelector('.ayah-title, h2');

    if (!ayahTitle) return;

    const copyButton = document.createElement('button');
    copyButton.className = 'copy-ayah-link';
    copyButton.type = 'button';
    copyButton.textContent = '🔗';
    copyButton.setAttribute('aria-label', 'Copy verse link');

    copyButton.addEventListener('click', function () {
      const cleanUrl = window.location.origin + window.location.pathname + '#' + ayahBlock.id;

      navigator.clipboard.writeText(cleanUrl).then(function () {
        const originalText = copyButton.textContent;
        copyButton.textContent = '✓';

        setTimeout(function () {
          copyButton.textContent = originalText;
        }, 1200);
      });
    });

    ayahTitle.appendChild(copyButton);
  });
</script>

</body>
</html>
