<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    .theme-toggle-button {
      border: 1px solid #ddd;
      border-radius: 999px;
      background: #fff;
      color: inherit;
      padding: 0.35rem 0.7rem;
      margin-left: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    .theme-toggle-button:hover {
      border-color: #aaa;
    }

    .theme-icon-light {
      display: none;
    }
  </style>
</head>
<body>

<header class="site-header">

  <div class="header-left">
    <a class="home-link" href="/">Home</a>

    <a class="site-brand" href="/introduction/">
      <span class="brand-en">Introduction to Qur’an</span>
      <span class="brand-separator">·</span>
      <span class="brand-fa">آشنایی با قرآن</span>
    </a>
  </div>

  <nav class="site-nav">
    <a href="/en/">English</a>
    <a href="/fa/">فارسی</a>

    <button class="theme-toggle-button" type="button" aria-label="Switch theme">
      <span class="theme-icon-dark">🌙</span>
      <span class="theme-icon-light">☀️</span>
    </button>
  </nav>

</header>

<main class="container">
  {{ content }}
</main>

<footer class="site-footer">
  <p>© {{ site.time | date: "%Y" }} Forqan Archive</p>
</footer>

</body>
</html>
